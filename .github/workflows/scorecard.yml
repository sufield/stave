name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run Scorecard (retry on transient GitHub API errors)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCORECARD_VERSION: v5.1.1
        run: |
          set -euo pipefail

          curl -sSL -o scorecard.tar.gz \
            "https://github.com/ossf/scorecard/releases/download/${SCORECARD_VERSION}/scorecard_${SCORECARD_VERSION#v}_linux_amd64.tar.gz"
          tar -xzf scorecard.tar.gz scorecard
          chmod +x ./scorecard

          attempts=0
          max_attempts=3
          until [ "$attempts" -ge "$max_attempts" ]; do
            attempts=$((attempts+1))
            echo "Attempt ${attempts}/${max_attempts}"

            if ./scorecard \
              --repo "https://github.com/${{ github.repository }}" \
              --format sarif \
              --show-details \
              --sarif-file results.sarif
            then
              exit 0
            fi

            echo "Scorecard failed (likely transient GitHub API issue). Waiting before retry..."
            sleep 30
          done

          echo "Scorecard failed after ${max_attempts} attempts."
          exit 1

      - name: Upload artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          sarif_file: results.sarif
