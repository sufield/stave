name: Docs Drift

on:
  pull_request:
    paths:
      # Doc trees
      - 'docs/**'
      - 'stave/docs/**'
      # Root docs — the audit found stale `internal/domain` references
      # here that the previous docs-only trigger missed entirely.
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'ARCHITECTURE.md'
      - 'TESTING.md'
      - 'DOCTRINE.md'
      # Code paths that the docs name. A move under any of these
      # could leave a doc referencing a now-dead location, so we
      # want the drift gate to fire on the PR that does the move.
      - 'cmd/**'
      - 'pkg/**'
      - 'internal/**'
      # The workflow itself — so an edit to the check list is
      # validated by the check it just changed.
      - '.github/workflows/docs-drift.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'stave/docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'ARCHITECTURE.md'
      - 'TESTING.md'
      - 'DOCTRINE.md'
      - 'cmd/**'
      - 'pkg/**'
      - 'internal/**'
      - '.github/workflows/docs-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check for stale references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect stale paths and terms in docs
        run: |
          set -euo pipefail
          bad=0

          # Scan set: every Markdown under docs/ EXCEPT internal
          # content + the four root docs the audit found ungated.
          # Internal content classification matches the Makefile's
          # SYNC_EXCLUDES — anything excluded from the public-repo
          # sync is also excluded from the drift gate.
          #
          # Excluded subdirs (point-in-time / internal-process):
          #   docs/plans/        design plans (paths frozen at write)
          #   docs/audits/       audit reports (point-in-time analyses)
          #   docs/ontology/     versioned ontology snapshots
          #   docs/design/       design discussions
          #   docs/design-notes/ design notes
          #   docs/project/      project tracking
          #   docs/contrib/      contributor process notes
          #
          # Excluded top-level files (internal-by-pattern + named):
          #   docs/*-audit.md            audit reports
          #   docs/*-backlog.md          backlog tracking
          #   docs/aggregation_decisions.md
          #   docs/bisect-timeline.md
          #   docs/bug-template.md
          #   docs/cli-style-guide.md
          #   docs/developer-workflow.md
          #   docs/examples-experiments.md
          #   docs/fixture-drift-cleanup-*.md
          #   docs/go-idioms.md          file:line inventory
          #   docs/graph-experiments.md
          #   docs/methodology-coverage-*.md
          #   docs/new-readme.md
          #   docs/pending-items.md
          #   docs/sir-pending-discussion.md
          check_pattern() {
            local pattern="$1"
            local reason="$2"
            if grep -rn -E "$pattern" \
                README.md \
                docs/ \
                --include='*.md' \
                --exclude-dir=plans \
                --exclude-dir=audits \
                --exclude-dir=ontology \
                --exclude-dir=design \
                --exclude-dir=design-notes \
                --exclude-dir=project \
                --exclude-dir=contrib \
                --exclude='*-audit.md' \
                --exclude='*-backlog.md' \
                --exclude='aggregation_decisions.md' \
                --exclude='bisect-timeline.md' \
                --exclude='bug-template.md' \
                --exclude='cli-style-guide.md' \
                --exclude='developer-workflow.md' \
                --exclude='examples-experiments.md' \
                --exclude='fixture-drift-cleanup-*.md' \
                --exclude='go-idioms.md' \
                --exclude='graph-experiments.md' \
                --exclude='methodology-coverage-*.md' \
                --exclude='new-readme.md' \
                --exclude='pending-items.md' \
                --exclude='sir-pending-discussion.md' \
                2>/dev/null; then
              echo "::error::Stale reference: $reason (pattern: $pattern)"
              bad=1
            fi
          }

          # Paths that were moved or removed
          check_pattern 'pkg/alpha/domain/'          'pkg/alpha/domain/ moved to internal/core/'
          check_pattern 'internal/adapters/input/'   'adapters/input/ flattened to adapters/'
          check_pattern 'internal/report/'           'report moved to adapters/output/report/'
          check_pattern 'internal/pruner/'           'pruner moved to adapters/pruner/'
          check_pattern 'internal/testutil/'         'testutil was deleted'
          # The 36dcbf2de audit added the following — each was a
          # real stale path the previous docs-only trigger missed.
          check_pattern 'internal/domain'            'internal/domain merged into internal/core/'
          check_pattern 'internal/cel/'              'internal/cel/ moved to internal/adapters/cel/'
          check_pattern 'cmd/stave/cmd/'             'cmd/stave/cmd nesting flattened to cmd/'
          check_pattern 'cmd/evaluate'               'cmd/evaluate renamed to cmd/apply'
          check_pattern 'evaluation_run\.go'         'evaluation_run.go replaced by workflow.go (AuditWorkflow)'
          check_pattern 'engine/runner\.go'          'engine/runner.go replaced by engine/assessor.go'
          check_pattern 'scripts/e2e\.sh'            'scripts/e2e.sh retired — use `make e2e` / `go test ./e2e/...`'
          check_pattern 'scripts/e2e-counterfactual' 'e2e-counterfactual.sh retired'
          check_pattern '\.inv\.yaml'                '.inv.yaml extension never shipped — use .control.yaml'
          check_pattern '\.inv\.json'                '.inv.json extension never shipped'

          # Commands that were removed or renamed
          check_pattern 'stave-dev extractor'        'extractor command was removed'
          check_pattern 'stave invariants\b'         '`stave invariants` retired — there is no such command'
          # The 11 out-of-scope commands removed in the scope-narrowing
          # pass. See features/scope.yaml; re-adding any is blocked by the
          # scope-drift lint (cmd/features_scope_lint_test.go). `stave check`
          # (before/after evaluation comparison) is NOT in this list — it is
          # a live, in-scope command.
          check_pattern 'stave monitor\b'            '`stave monitor` removed — continuous monitoring is out of scope'
          check_pattern 'stave watch\b'              '`stave watch` removed — continuous monitoring is out of scope'
          # NOTE: `stave plan` is NOT gated — the name was reused this cycle for a
          # live coverage-preview command (which controls evaluate, by service ×
          # severity). The removed remediation-planning surface that stays gated is
          # rank/simulate/deadline/budget below. Mirrors features/scope.yaml.
          check_pattern 'stave rank\b'               '`stave rank` removed — remediation planning is out of scope'
          check_pattern 'stave simulate\b'           '`stave simulate` removed — remediation planning is out of scope'
          check_pattern 'stave forensics\b'          '`stave forensics` removed — incident response is out of scope'
          check_pattern 'stave budget\b'             '`stave budget` removed — out of scope'
          check_pattern 'stave enrich\b'             '`stave enrich` removed — external enrichment is out of scope'
          check_pattern 'stave inventory\b'          '`stave inventory` removed — external enrichment is out of scope'
          check_pattern 'stave consolidate\b'        '`stave consolidate` removed — multi-account orchestration is out of scope'
          check_pattern 'stave deadline\b'           '`stave deadline` removed — SLA-deadline policy authoring is out of scope (SLA evaluation stays)'
          check_pattern 'stave simulate\b'           '`stave simulate` removed — remediation planning is out of scope'

          # Stale vocabulary — phrase-level only; "Invariants as Code"
          # and "System Invariant" stay as the brand/concept, and
          # docs/explanation/ is already off the scan path. See
          # TERMINOLOGY.md for the canonical → deprecated mapping and
          # the "where invariant deliberately stays" carve-outs.
          check_pattern 'invariant file'             '"invariant file" is stale — use "control file"'
          check_pattern 'invariant YAML'             '"invariant YAML" is stale — use "control YAML"'
          check_pattern '[Ii]nvariant catalog'       '"invariant catalog" is stale — use "control catalog" (see TERMINOLOGY.md)'
          check_pattern '[Ii]nvariant evaluation'    '"invariant evaluation" is stale — use "control evaluation" (see TERMINOLOGY.md)'
          check_pattern 'authored invariant'         '"authored invariant" is stale — use "authored control" (see TERMINOLOGY.md)'

          # Stale binary split language
          check_pattern 'stave-dev only'             'no dev-only commands — all ship in one binary'
          check_pattern 'Developer Commands.*dev'    'no separate developer command set'

          exit $bad
