name: Coverage

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Regenerate goldens and sync
        run: make regenerate-goldens golden-update-all sync-schemas sync-controls sync-alternatives

      - name: Audit behavioral changes
        run: |
          CHANGED=$(git diff --name-only testdata/ | wc -l)
          if [ "$CHANGED" -gt 0 ]; then
            echo "::warning::BEHAVIORAL: $CHANGED golden files changed"
            git diff --stat testdata/
          fi

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit updated goldens
        run: |
          git add testdata/ internal/contracts/schema/embedded internal/controldata/embedded internal/adapters/coverage/embedded
          git diff --cached --quiet || git commit -m "auto-update goldens [behavioral: $(git diff --cached --name-only testdata/ | wc -l) files]"

      - name: Push updated goldens
        if: github.event_name == 'push'
        run: git push

      - name: Generate coverage (single test run)
        run: |
          set -euo pipefail
          pkgs="$(go list ./... | grep -vE '/e2e$')"

          go test $pkgs \
            -tags stavedev \
            -covermode=atomic \
            -coverpkg=./... \
            -coverprofile=unit.out \
            -count=1 \
            -parallel=2 \
            -timeout 20m

      - name: Generate testscript integration coverage
        run: |
          go test ./cmd/stave/... -run TestScripts \
            -tags stavedev \
            -covermode=atomic \
            -coverpkg=./... \
            -coverprofile=testscript.out \
            -count=1 \
            -timeout 120s

      - name: Merge coverage profiles
        run: |
          head -1 unit.out > coverage.out
          tail -n +2 unit.out >> coverage.out
          tail -n +2 testscript.out >> coverage.out

      - name: Enforce core package coverage policy
        run: |
          set -euo pipefail

          # Extract per-package coverage from the merged profile.
          # No re-running tests — just reading the profile we already have.
          check_coverage() {
            local pkg_pattern="$1"
            local min="$2"
            local label="$3"

            # go tool cover -func outputs lines like:
            #   github.com/sufield/stave/internal/app/eval/eval.go:42: Evaluate  85.7%
            #   ...
            #   total:  (statements)  67.3%
            # Filter to lines matching the package, compute weighted avg.
            local got
            got="$(go tool cover -func=coverage.out \
              | grep "$pkg_pattern" \
              | awk '/^total:/{next} {gsub("%","",$3); sum+=$3; n++} END {if(n>0) printf "%.1f", sum/n; else print "0"}')"

            echo "$label coverage: ${got}% (minimum: ${min}%)"
            awk -v got="$got" -v min="$min" \
              'BEGIN { exit (got+0 < min+0) ? 1 : 0 }' || {
              echo "::error::$label coverage ${got}% is below minimum ${min}%"
              return 1
            }
          }

          failed=0
          check_coverage "internal/app/"           25 "internal/app"           || failed=1
          check_coverage "internal/core/predicate/" 40 "internal/core/predicate" || failed=1
          check_coverage "internal/core/kernel/"    50 "internal/core/kernel"    || failed=1
          check_coverage "internal/core/evaluation/" 45 "internal/core/evaluation" || failed=1

          exit $failed

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          disable_search: true
          flags: unit
          fail_ci_if_error: false
