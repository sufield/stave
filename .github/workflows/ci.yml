name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # PRs that touch only documentation, examples, or experiments
    # do not trigger CI. Catches the common "fix typo in readme"
    # and "add a fixture demo" cases that have no chance of
    # affecting the Go build or the engine output. Pushes to main
    # and the schedule still run the full pipeline so drift
    # between docs-only and other commits is caught nightly.
    #
    # Win 1's path-filter (the `changes` job) covers the same
    # spirit for Go-code PRs that happen not to touch the catalog;
    # this is the broader case where no Go code changed at all.
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'experiments/**'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # nightly 6am UTC

permissions:
  contents: read
  actions: read

jobs:
  changes:
    # Path-change detector: downstream jobs read these outputs to
    # decide whether their work is needed for the current PR. Always
    # runs (cheap; just a checkout + diff walk) so non-PR triggers
    # (push to main, schedule, workflow_dispatch) get outputs too —
    # though those triggers ignore the filter and run unconditionally
    # via the catch-all `github.event_name != 'pull_request'` guard
    # on dependent jobs.
    #
    # `catalog`: anything that changes the regen output. Includes the
    # YAML source (controls/, chains/), the schema sources, the
    # embedded mirrors (regen reads them), the regen tool itself,
    # the Makefile target, any Go code (engine logic can change
    # the projected JSON), go.mod/go.sum (deps could shift output),
    # and the workflow file itself (so an edit to this filter
    # always validates against a real run).
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      catalog: ${{ steps.filter.outputs.catalog }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            catalog:
              - 'controls/**'
              - 'chains/**'
              - 'schemas/**'
              - 'testdata/**'
              - 'internal/**/*.go'
              - 'cmd/**/*.go'
              - 'pkg/**/*.go'
              - 'internal/controldata/embedded/**'
              - 'internal/contracts/schema/embedded/**'
              - 'internal/adapters/coverage/embedded/**'
              - 'data/alternatives/**'
              - 'internal/tools/regengoldens/**'
              - 'Makefile'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'

  goldens:
    # Single regen of the testdata/e2e fixtures + embedded copies +
    # in-process goldens, uploaded as an artifact for downstream
    # test/race jobs to download. Replaces the duplicated regen step
    # that used to run inside each of the four test shards plus race.
    # Wall-clock per workflow is unchanged (shards were already
    # parallel) but runner-minutes for regen drop ~5×, and the design
    # has one source of truth for the regen tree.
    #
    # `if:` gate: skip regen on PRs that touched none of the paths
    # the regen output depends on (docs-only PRs, channel content,
    # business docs). Non-PR triggers (push to main, schedule,
    # workflow_dispatch) always run regen — the cost only matters on
    # PRs where contributor feedback latency is the constraint. The
    # `changes` job declares what counts as catalog-affecting; see
    # its definition above.
    name: Regenerate goldens
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.catalog == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'
          check-latest: true
          cache: true
      - name: Regenerate goldens and sync
        # ARGS includes -fail-on-behavioral: the regen tool auto-accepts
        # CLEAN / FINGERPRINT-ONLY / METADATA-ONLY diffs (writes them
        # silently), and exits non-zero on BEHAVIORAL / MIXED / ERROR
        # so the human PR review step is the gate, not this regen step.
        # Without the flag, controller upgrades that touched 200 fixture
        # fingerprints landed as 200 file diffs the reviewer scrolled
        # past; with it, only behavior changes attract attention. See
        # internal/tools/regengoldens/main.go for the category definitions.
        run: make regenerate-goldens golden-update-all sync-schemas sync-controls sync-alternatives ARGS="-workers 4 -fail-on-behavioral"
      - name: Upload regen tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goldens
          path: |
            testdata/
            internal/contracts/schema/embedded/
            internal/controldata/embedded/
            internal/adapters/coverage/embedded/
            **/testdata/golden/
          retention-days: 1
          if-no-files-found: error

  test-fast:
    # Sub-minute PR feedback. Mirrors `make test-fast`: -short across
    # the whole module so binary-spawning E2E suites and 50+-command
    # walks self-skip. Runs as its own job so it doesn't wait behind
    # the sharded full suite. The full sharded `test` job below
    # remains the gate for merging — this is just a fast no-no signal.
    name: Test (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'
          check-latest: true
          cache: true
      - name: Sync embeds
        run: make sync-schemas sync-controls sync-alternatives
      - name: Run -short test suite
        run: go test -short -timeout 5m -count=1 ./...

  test:
    name: Test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: goldens
    # `!failure() && !cancelled()` means "run when goldens succeeded
    # OR was skipped." The default `needs:` semantics cancel
    # downstream jobs when an upstream skips; we explicitly allow it
    # because a skipped goldens job means "no catalog change, the
    # checked-in goldens are still valid" — tests run against those
    # rather than a regenerated copy. The Download step below
    # short-circuits in the same case so the absent artifact isn't
    # an error.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Weighted by measured package times (without -race).
          # Shard 0: enginetest (383s) — heaviest, own runner
          # Shard 1: cmd/stave + graph + cel = ~351s
          # Shard 2: controls/builtin + pack + pkg/stave + cmd/apply + cmd/apply/verify = ~255s
          # Shard 3: remaining ~150 packages
          - shard: 0
            filter: "internal/core/enginetest$"
          - shard: 1
            filter: "(cmd/stave|internal/graph|internal/cel)$"
          - shard: 2
            filter: "(internal/adapters/controls/builtin|internal/builtin/pack|pkg/stave)$|cmd/apply"
          - shard: 3
            filter: ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'
          check-latest: true
          cache: true

      - name: Download regenerated goldens
        if: needs.goldens.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: goldens
          path: .

      - name: Sync embeds (no regen — using checked-in goldens)
        # When the goldens job was skipped (PR didn't touch catalog),
        # the artifact does not exist. Run the embed sync targets
        # directly so the test job still has the
        # internal/contracts/schema/embedded/ tree the build needs.
        if: needs.goldens.result == 'skipped'
        run: make sync-schemas sync-controls sync-alternatives

      - name: Run tests
        run: |
          set -euo pipefail
          all_pkgs=$(go list ./... | grep -vE '/e2e$')

          if [ -n "${{ matrix.filter }}" ]; then
            pkgs=$(echo "$all_pkgs" | grep -E '${{ matrix.filter }}')
          else
            # Shard 3: everything not claimed by shards 0-2
            pkgs=$(echo "$all_pkgs" | grep -vE '(internal/core/enginetest|cmd/stave|internal/graph|internal/cel|internal/adapters/controls/builtin|internal/builtin/pack|pkg/stave)$|cmd/apply')
          fi

          echo "::group::Packages ($(echo "$pkgs" | wc -l))"
          echo "$pkgs"
          echo "::endgroup::"

          # -parallel=2 matches the 2-core runner; no -race on PRs
          echo "$pkgs" | xargs go test \
            -tags stavedev \
            -count=1 \
            -parallel=2 \
            -timeout 15m

  race:
    name: Race detection
    # Trigger gate stays the same (push to main + schedule + manual);
    # `&& !failure() && !cancelled()` allows the job to proceed when
    # the upstream `goldens` job was skipped — which on those
    # triggers it won't be (the `goldens` `if:` falls through to its
    # second clause for non-PR events), but explicit is safer than
    # depending on that invariant.
    if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !failure() && !cancelled()
    runs-on: ubuntu-latest
    needs: goldens
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'
          check-latest: true
          cache: true
      - name: Download regenerated goldens
        if: needs.goldens.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: goldens
          path: .
      - name: Sync embeds (no regen — using checked-in goldens)
        if: needs.goldens.result == 'skipped'
        run: make sync-schemas sync-controls sync-alternatives
      - name: Run tests with race detector
        # Exclude ./e2e/ — that suite drives the compiled stave binary
        # as a black box, so race instrumentation on the test process
        # itself adds no signal but inflates runtime past the 30m
        # package timeout (the e2e job runs without -race for the same
        # reason). Mirrors the /e2e exclusion in the regular `test` job.
        run: |
          set -euo pipefail
          pkgs=$(go list ./... | grep -vE '/e2e$')
          GORACE="halt_on_error=1 history_size=4" \
          go test -tags stavedev -race -count=1 -parallel=2 -timeout 30m $pkgs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'
          check-latest: true
          cache: true
      - name: Install golangci-lint from source
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.3
      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m
      - name: wrapcheck debt ratchet (must not grow)
        # Measures grandfathered wrapcheck violations and fails if the
        # count rose above the committed baseline. See
        # docs/audits/lint-wrapcheck-rollout.md and the lint-debt target.
        run: make lint-debt

  vuln:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'
          check-latest: true
          cache: true
      - name: Verify Go version
        # Positive assertion: setup-go must install exactly the
        # patch release `go.mod`'s toolchain directive specifies
        # (currently go1.26.5, which patches crypto/tls
        # vulnerability). A negative-only check
        # would silently pass on any other patch — including an
        # older vulnerable one — so we assert intent here.
        run: |
          go version
          go version | grep -q 'go1.26.5'
      - name: Install govulncheck
        # Run govulncheck directly instead of golang/govulncheck-action
        # so we use the Go installed by the explicit setup-go above
        # (1.26.5). The wrapper action invokes its own internal
        # setup-go with `go-version: stable` and silently overrides
        # any `go-version-file` we pass — that's how 1.26.2 was being
        # reinstalled into this job and re-flagging GO-2026-4971.
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  license:
    name: License compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'
          check-latest: true
          cache: true
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@v1.6.0
      - name: Check licenses
        run: |
          go-licenses report ./cmd/stave --template=csv > licenses.csv 2>licenses-warnings.txt || true
          if grep -iE '(GPL|AGPL|SSPL|LGPL)' licenses.csv; then
            echo "::error::Forbidden license detected in dependencies"
            cat licenses.csv
            exit 1
          fi
          if go-licenses check ./cmd/stave --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC 2>check-warnings.txt; then
            echo "All dependency licenses are allowed"
          else
            echo "::error::Unknown or disallowed license detected"
            cat check-warnings.txt
            exit 1
          fi
      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: license-report
          path: licenses.csv

  e2e:
    name: E2E
    # PRs use the sharded `test` job + `test-fast` for the fast path.
    # The full e2e suite (~5800 fixtures serialised at -parallel 1,
    # 45–60m wall-clock) runs on push to main and the nightly cron.
    # Mirrors the `race` job's gating — both are slow signals that
    # would otherwise dominate PR feedback latency.
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: goldens
    # Job-level timeout sits 10m above the go test -timeout so a
    # genuine package-level deadline-exceeded surfaces as a Go
    # panic-with-stack (and per-case heartbeat logs) rather than a
    # generic GitHub-Actions "job killed at the time limit" with
    # no test output.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'
          check-latest: true
          cache: true
      - name: Download regenerated goldens
        if: needs.goldens.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: goldens
          path: .
      - name: Sync embeds (no regen — using checked-in goldens)
        if: needs.goldens.result == 'skipped'
        run: make sync-schemas sync-controls sync-alternatives
      - name: Build and run E2E tests
        # -v so a stuck case surfaces its own name in the log
        # instead of the package timing out silently. Cases are
        # serialised inside the suite (see e2e/e2e_test.go) and
        # -parallel 1 is the belt-and-braces override at the
        # command level — enforces the no-concurrency contract
        # even if a future test forgets the convention.
        #
        # -timeout 60m: raised from 45m. With ~5800 fixtures
        # serialised, the prior 45m budget left no headroom for a
        # transient slow runner. The job-level timeout-minutes
        # (above) is 70m so the Go runtime fires its own deadline
        # first and prints the stack instead of the runner killing
        # the job blind.
        #
        # No -race: the e2e suite drives the compiled stave binary
        # as a black box, so race detection on the test process
        # itself adds no signal and would 2–10× the runtime.
        run: make build && go test -v -parallel 1 -count=1 -timeout 60m -run E2E ./e2e/

  release-check:
    name: GoReleaser config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

  consistency-check:
    # Source-of-truth consistency gate. Runs every non-golden regen target
    # then asserts the working tree is clean. Catches both forgotten regens
    # and direct edits to embedded copies that bypass the canonical source.
    # Independent of `goldens` and `test` so a sync drift doesn't block
    # test results from appearing — contributors need both signals.
    # See stave/docs/audits/sync-audit.md for the derivation-chain map.
    name: Source-of-truth consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'
          check-latest: true
          cache: true
      - name: Run consistency check
        run: make consistency-check
