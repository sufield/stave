name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # nightly 6am UTC

permissions:
  contents: read
  actions: read

jobs:
  goldens:
    # Single regen of the testdata/e2e fixtures + embedded copies +
    # in-process goldens, uploaded as an artifact for downstream
    # test/race jobs to download. Replaces the duplicated regen step
    # that used to run inside each of the four test shards plus race.
    # Wall-clock per workflow is unchanged (shards were already
    # parallel) but runner-minutes for regen drop ~5×, and the design
    # has one source of truth for the regen tree.
    name: Regenerate goldens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true
      - name: Regenerate goldens and sync
        run: make regenerate-goldens golden-update-all sync-schemas sync-controls sync-alternatives ARGS="-workers 4"
      - name: Upload regen tree
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v7.0.1
        with:
          name: goldens
          path: |
            testdata/
            internal/contracts/schema/embedded/
            internal/controldata/embedded/
            internal/adapters/coverage/embedded/
            **/testdata/golden/
          retention-days: 1
          if-no-files-found: error

  test-fast:
    # Sub-minute PR feedback. Mirrors `make test-fast`: -short across
    # the whole module so binary-spawning E2E suites and 50+-command
    # walks self-skip. Runs as its own job so it doesn't wait behind
    # the sharded full suite. The full sharded `test` job below
    # remains the gate for merging — this is just a fast no-no signal.
    name: Test (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true
      - name: Sync embeds
        run: make sync-schemas sync-controls sync-alternatives
      - name: Run -short test suite
        run: go test -short -timeout 5m -count=1 ./...

  test:
    name: Test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: goldens
    strategy:
      fail-fast: false
      matrix:
        include:
          # Weighted by measured package times (without -race).
          # Shard 0: enginetest (383s) — heaviest, own runner
          # Shard 1: cmd/stave + graph + cel = ~351s
          # Shard 2: controls/builtin + pack + pkg/stave + cmd/apply + cmd/apply/verify = ~255s
          # Shard 3: remaining ~150 packages
          - shard: 0
            filter: "internal/core/enginetest$"
          - shard: 1
            filter: "(cmd/stave|internal/graph|internal/cel)$"
          - shard: 2
            filter: "(internal/adapters/controls/builtin|internal/builtin/pack|pkg/stave)$|cmd/apply"
          - shard: 3
            filter: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Download regenerated goldens
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7.0.0
        with:
          name: goldens
          path: .

      - name: Run tests
        run: |
          set -euo pipefail
          all_pkgs=$(go list ./... | grep -vE '/e2e$')

          if [ -n "${{ matrix.filter }}" ]; then
            pkgs=$(echo "$all_pkgs" | grep -E '${{ matrix.filter }}')
          else
            # Shard 3: everything not claimed by shards 0-2
            pkgs=$(echo "$all_pkgs" | grep -vE '(internal/core/enginetest|cmd/stave|internal/graph|internal/cel|internal/adapters/controls/builtin|internal/builtin/pack|pkg/stave)$|cmd/apply')
          fi

          echo "::group::Packages ($(echo "$pkgs" | wc -l))"
          echo "$pkgs"
          echo "::endgroup::"

          # -parallel=2 matches the 2-core runner; no -race on PRs
          echo "$pkgs" | xargs go test \
            -tags stavedev \
            -count=1 \
            -parallel=2 \
            -timeout 15m

  race:
    name: Race detection
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: goldens
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true
      - name: Download regenerated goldens
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7.0.0
        with:
          name: goldens
          path: .
      - name: Run tests with race detector
        run: |
          GORACE="halt_on_error=1 history_size=4" \
          go test -tags stavedev -race -count=1 -parallel=2 -timeout 30m ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true
      - name: Install golangci-lint from source
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.3
      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

  vuln:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true
      - uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee # v1
        with:
          go-version-file: 'go.mod'

  license:
    name: License compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@v1.6.0
      - name: Check licenses
        run: |
          go-licenses report ./cmd/stave --template=csv > licenses.csv 2>licenses-warnings.txt || true
          if grep -iE '(GPL|AGPL|SSPL|LGPL)' licenses.csv; then
            echo "::error::Forbidden license detected in dependencies"
            cat licenses.csv
            exit 1
          fi
          if go-licenses check ./cmd/stave --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC 2>check-warnings.txt; then
            echo "All dependency licenses are allowed"
          else
            echo "::error::Unknown or disallowed license detected"
            cat check-warnings.txt
            exit 1
          fi
      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v7.0.1
        with:
          name: license-report
          path: licenses.csv

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true
      - name: Build and run E2E tests
        run: make build && go test ./e2e/ -run E2E -count=1 -timeout 30m

  release-check:
    name: GoReleaser config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: goreleaser/goreleaser-action@e24998b8b67b290c2fa8b7c14fcfa7de2c5c9b8c # v7.1.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

  docs-freshness:
    name: Docs freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true
      - name: Check README freshness
        run: make readme-check
