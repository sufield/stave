name: CI auto-retry

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write

jobs:
  retry-transient:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Check for transient infrastructure failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const attempt = context.payload.workflow_run.run_attempt;

            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });

            // A job that failed before any step ran is the signature of
            // "Failed to resolve action download info" / 502 / 503 —
            // GitHub couldn't fetch the action at setup time.
            const transient = data.jobs.some(job =>
              job.conclusion === 'failure' &&
              job.steps.every(s => s.conclusion === null || s.conclusion === 'skipped')
            );

            if (!transient) {
              console.log('Not a transient failure — skipping retry');
              return;
            }

            console.log(`Transient failure detected (attempt ${attempt}/3) — re-running failed jobs`);
            await github.rest.actions.reRunWorkflowFailedJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
