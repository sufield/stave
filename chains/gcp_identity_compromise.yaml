id: gcp_identity_compromise
description: >
  Primitive roles assigned AND service account keys exist or default
  SA used. Over-privileged access with exportable credentials or
  default broad permissions.
controls:
  - CTL.GCP.IAM.PRIMITIVE.001
  - CTL.GCP.IAM.SA.KEYS.001
  - CTL.GCP.IAM.SA.DEFAULT.001
escalation_threshold: 2
compound_severity: critical
preconditions:
  - iam_credential_theft
postconditions:
  - ec2_code_execution
implicit_dependencies: []
