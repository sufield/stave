id: sns_notification_black_hole
description: >
  Any single notification black hole — no subscribers, all
  unconfirmed, or alarm references deleted topic. Each
  independently means published messages reach nobody. The
  topic accepts messages but doesn't deliver them — either
  because there are no subscribers, all are pending
  confirmation, or the topic itself is gone. Threshold of 1
  fires whenever the notification chain is broken from the
  topic side, regardless of which specific failure caused it.
controls:
  - CTL.SNS.LIFECYCLE.NOSUBSCRIBERS.001
  - CTL.SNS.LIFECYCLE.UNCONFIRMED.001
  - CTL.SNS.GHOST.ALARM.001
escalation_threshold: 1
compound_severity: high
preconditions:
  - ungoverned_operation
postconditions:
  - audit_trail_destroyed
implicit_dependencies:
  - source: observation.ghost_reference_resolver
    fallback: fail_open
    diagnostic: >-
      Ghost reference resolution depends on snapshot completeness for the referenced resource type. If the referenced service was not collected, ghost references cannot be detected.
