id: eventbridge_failure_path_weak
description: >
  EventBridge rule's failure-handling primitives are themselves
  broken: the dead-letter queue is a ghost reference (the SQS
  queue named in the rule's DeadLetterConfig has been deleted)
  AND retries are explicitly disabled. The rule advertises a
  resilient failure-handling posture — the console shows DLQ
  configured — while in fact failed events have neither retry
  headroom nor a preservation destination. This is the most
  insidious form of the failure-path collapse because the
  configuration looks correct on inspection. Threshold of 2 fires
  when both defects coexist on the same rule.
controls:
  - CTL.EVENTBRIDGE.GHOST.RULE.DLQ.001
  - CTL.EVENTBRIDGE.RULE.RETRY.NONE.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - ungoverned_operation
postconditions:
  - data_destruction
