id: ebs_backup_incomplete
description: >
  DLM retention is too narrow plus either no
  cross-region copy or the tag selector matches
  no volumes. Backups may be running but are
  insufficient — too few recovery points AND
  either no DR capability across regions or some
  intended volumes aren't covered. Threshold of
  2 because the dangerous compound is when
  multiple backup-quality gaps stack: the
  workload's recovery posture is much thinner
  than the catalog of DLM policies suggests.
controls:
  - CTL.EC2.EBS.DLM.RETENTION.SHORT.001
  - CTL.EC2.EBS.DLM.NOCROSSREGION.001
  - CTL.EC2.EBS.GHOST.DLM.NOTARGET.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - ungoverned_operation
postconditions:
  - data_destruction
