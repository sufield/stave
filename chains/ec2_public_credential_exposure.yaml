id: ec2_public_credential_exposure
description: >
  EC2 instance exposes credentials through multiple independent
  vectors. Public IP exposes the instance to direct internet
  access. IMDSv2 not required means an SSRF vulnerability can
  retrieve IAM role credentials via IMDSv1 (a single PUT to
  169.254.169.254). User data contains secrets visible to any
  process on the instance. Each vector is a separate finding;
  their co-occurrence on one instance means a single compromise
  yields credentials through whichever path is easiest — network
  access, SSRF, or local process enumeration.
controls:
  - CTL.EC2.PUBLIC.001
  - CTL.EC2.IMDSV2.001
  - CTL.EC2.USERDATA.SECRETS.001
escalation_threshold: 2
compound_severity: critical
preconditions:
  - internet_access
postconditions:
  - iam_credential_theft
implicit_dependencies: []
