id: sagemaker_training_data_exposure
description: >
  SageMaker training pipeline with unencrypted volumes, unencrypted
  inter-container traffic, and no network isolation. Training data
  is exposed at every layer — at rest on volumes, in transit between
  containers, and via network calls from training containers.
controls:
  - CTL.SAGEMAKER.TRAINING.ENCRYPT.VOLUME.001
  - CTL.SAGEMAKER.TRAINING.ENCRYPT.INTERCONTAINER.001
  - CTL.SAGEMAKER.TRAINING.ISOLATION.001
escalation_threshold: 2
compound_severity: critical
preconditions:
  - s3_data_access
postconditions:
  - data_destruction
implicit_dependencies: []
