id: secrets_replica_weak
description: >
  Policy mismatch across replicas plus either non-compliant
  region or orphaned primary. Credential replicas have
  inconsistent access control AND either credential
  material is in an unauthorized region or the primary is
  gone (no rotation, no lifecycle). Multiple replication
  governance failures: the credential is replicated to
  multiple regions, those replicas don't enforce the
  same access control, and either a replica sits in a
  forbidden region or there is no living primary to
  rotate from.
controls:
  - CTL.SECRETS.REPLICA.POLICY.MISMATCH.001
  - CTL.SECRETS.REPLICA.NONCOMPLIANT.REGION.001
  - CTL.SECRETS.REPLICA.ORPHAN.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - ungoverned_operation
postconditions:
  - audit_trail_destroyed
