id: ec2_direct_exposure
description: >
  Instance serves traffic directly from the internet (no load
  balancer in front) AND either has excessive security groups or
  exposes high-risk ports. The instance is on the public network
  edge without LB-provided protections (TLS termination, WAF,
  DDoS absorption, connection rate limiting, access logging) AND
  either its effective network rules are unauditable (too many
  SGs to evaluate) or known-risky services are open. Each
  factor compounds the others — direct exposure means no upstream
  policy enforcement, excessive SGs means no clear local rule
  set, and exposed high-risk ports turn the configuration into
  an active reachable attack surface.
controls:
  - CTL.EC2.NETWORK.DIRECT.001
  - CTL.EC2.NETWORK.MULTIPLE.SG.001
  - CTL.VPC.SG.HIGHPORTS.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - internet_access
postconditions:
  - ec2_code_execution
implicit_dependencies: []
