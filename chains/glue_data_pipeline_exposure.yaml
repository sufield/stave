id: glue_data_pipeline_exposure
description: >
  Glue ETL pipeline with unencrypted S3 data, plaintext secrets in
  job arguments, and an exposed data catalog. The combination creates
  a complete data pipeline compromise: the attacker discovers the data
  architecture via the public catalog, extracts credentials from job
  arguments, and reads unencrypted data from S3.
controls:
  - CTL.GLUE.JOB.ENCRYPT.S3.001
  - CTL.GLUE.JOB.SECRETS.001
  - CTL.GLUE.CATALOG.POLICY.001
escalation_threshold: 2
compound_severity: critical
preconditions:
  - s3_data_access
postconditions:
  - data_destruction
