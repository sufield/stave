id: secrets_rotation_undetected
description: >
  No rotation failure alarm plus either ghost rotation
  Lambda or stale rotation. Rotation failures are
  undetected AND either the rotation mechanism is broken
  or rotation is already overdue. The credential is
  static with no detection of the failure — the worst
  combination at the rotation layer: state-broken plus
  event-blind. Threshold of 2 fires when rotation
  monitoring is missing AND the rotation pipeline is
  already in a failed state.
controls:
  - CTL.SECRETS.ALARM.ROTATION.FAILURE.001
  - CTL.SECRETS.GHOST.ROTATIONLAMBDA.001
  - CTL.SECRETS.ROTATION.STALE.001
escalation_threshold: 2
compound_severity: critical
preconditions:
  - ungoverned_operation
postconditions:
  - audit_trail_destroyed
