id: secrets_false_security
description: >
  Ghost rotation Lambda plus either stale rotation or long
  interval. Rotation is broken (Lambda deleted) AND either
  the credential is already stale or the configured
  interval was too long to begin with. The credential has
  been static for an extended period with no functioning
  rotation mechanism — the audit shows "rotation enabled"
  while the secret holds the same value it has for months.
  Threshold of 2 fires when ghost rotation compounds with
  another rotation-quality failure.
controls:
  - CTL.SECRETS.GHOST.ROTATIONLAMBDA.001
  - CTL.SECRETS.ROTATION.STALE.001
  - CTL.SECRETS.ROTATION.INTERVAL.LONG.001
escalation_threshold: 2
compound_severity: critical
preconditions:
  - ungoverned_operation
postconditions:
  - audit_trail_destroyed
