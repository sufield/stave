id: azure_keyvault_credential_drift
description: >
  Keys and secrets without expiration AND no rotation policy.
  Credentials in Key Vault persist indefinitely without forced
  renewal. A compromised key or secret remains valid until manually
  revoked — which requires knowing it was compromised.
controls:
  - CTL.AZURE.KEYVAULT.KEY.EXPIRY.001
  - CTL.AZURE.KEYVAULT.SECRET.EXPIRY.001
  - CTL.AZURE.KEYVAULT.ROTATION.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - iam_credential_theft
postconditions:
  - ec2_code_execution
implicit_dependencies: []
