id: chegg_root_credential_path
description: >
  Chegg incident shape (2018): former contractor used
  shared ROOT credentials to exfiltrate 40M user records
  from S3. The FTC issued a consent order. Invariants:
  root credentials should not exist on member accounts
  (centralized root management), and root access should
  never be shared. This chain fires when centralized
  root management is not enabled AND root credentials
  exist AND root MFA is missing.
controls:
  - CTL.IAM.ROOT.ACCESSKEY.001
  - CTL.IAM.ROOT.MFA.001
  - CTL.IAM.CRED.ROTATION.001
escalation_threshold: 2
compound_severity: critical
preconditions:
  - iam_credential_theft
postconditions:
  - data_access
implicit_dependencies: []
