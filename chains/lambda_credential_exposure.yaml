id: lambda_credential_exposure
description: >
  Secrets are detected in environment variables (existing
  CTL.LAMBDA.ENV.SECRETS.001) AND either credentials are
  not managed via Secrets Manager / SSM SecureString or
  the env block is encrypted with the AWS-managed key
  rather than a CMK (existing CTL.LAMBDA.ENV.ENCRYPT.001).
  Credentials live in env vars AND either no managed
  storage alternative is in place or no key-policy
  control plane is in place. The combination is the
  function's credential-handling surface failing on more
  than one dimension simultaneously.
controls:
  - CTL.LAMBDA.ENV.SECRETS.001
  - CTL.LAMBDA.SECRETS.NOTMANAGED.001
  - CTL.LAMBDA.ENV.ENCRYPT.001
escalation_threshold: 2
compound_severity: critical
preconditions:
  - network_access_lambda
postconditions:
  - iam_credential_theft
