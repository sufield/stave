id: ec2_ssh_attack_surface
description: >
  Key pair is shared across many instances AND either an instance
  has SSH open without a key pair OR SSH is permitted from broad
  CIDR ranges. The SSH access plane has compounding failures: the
  authorization material is widely distributed (any leak of the
  shared private half opens many instances at once), AND either
  the access method on at least one instance is ambiguous (no key
  pair but SSH reachable — brute force, post-launch injection, or
  gratuitous exposure) or the network reachability is broad
  (anyone on the listed CIDRs can attempt SSH). Any one of these
  alone is medium severity; together they describe an SSH plane
  that is simultaneously high-blast-radius and easy to reach.
controls:
  - CTL.EC2.KEYPAIR.SHARED.001
  - CTL.EC2.KEYPAIR.NOKEY.SSHOPEN.001
  - CTL.EC2.SG.INGRESS.CIDR.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - internet_access
postconditions:
  - vpc_instance_compromise
