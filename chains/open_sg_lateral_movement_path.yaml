id: open_sg_lateral_movement_path
description: >
  Security group allows unrestricted inbound access, EC2
  instances run in the default VPC (flat network), and VPC
  flow logs are disabled. A single compromised instance can
  reach every other instance with no network controls and no
  visibility. This turns one compromise into full environment
  takeover.
controls:
  - CTL.VPC.SG.UNRESTRICTED.001
  - CTL.EC2.DEFAULT.VPC.001
  - CTL.VPC.FLOWLOG.001
escalation_threshold: 3
compound_severity: high
preconditions:
  - internet_access
postconditions:
  - network_access_ec2
  - network_access_vpc
