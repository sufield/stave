id: lambda_secrets_broken
description: >
  Any secrets-infrastructure failure — env var references
  a secret the role cannot read, references an SSM
  parameter stored as String instead of SecureString, or
  references a deleted KMS key for env encryption (uses
  Lambda-1's CTL.LAMBDA.GHOST.KMS.001). Each condition
  independently means the secrets-management chain is
  broken at runtime: the function either cannot fetch its
  secret at all, fetches it from plaintext storage, or
  cannot decrypt the env block. Threshold of 1 makes the
  chain fast-firing on any single break.
controls:
  - CTL.LAMBDA.SECRETS.BROKEN.REF.001
  - CTL.LAMBDA.SECRETS.SSM.INSECURE.001
  - CTL.LAMBDA.GHOST.KMS.001
escalation_threshold: 1
compound_severity: high
preconditions:
  - network_access_lambda
postconditions:
  - iam_credential_theft
implicit_dependencies:
  - source: observation.ghost_reference_resolver
    fallback: fail_open
    diagnostic: >-
      Ghost reference resolution depends on snapshot completeness for the referenced resource type. If the referenced service was not collected, ghost references cannot be detected.
