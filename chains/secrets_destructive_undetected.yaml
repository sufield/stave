id: secrets_destructive_undetected
description: >
  No delete alarm plus either no PutSecretValue alarm or
  secret already pending deletion. Destructive secret
  operations (deletion, value modification) are
  unmonitored AND either credential modification is
  invisible or a deletion is already in progress without
  detection. Threshold of 2 fires when both the alerting
  surface for destructive operations is missing AND the
  state already reflects an undetected destructive
  action.
controls:
  - CTL.SECRETS.ALARM.DELETE.001
  - CTL.SECRETS.ALARM.PUTVALUE.001
  - CTL.SECRETS.GHOST.DELETION.REFERENCED.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - ungoverned_operation
postconditions:
  - data_destruction
