id: ecs_secret_lifecycle
description: >
  Any single secrets-management failure compromises the
  container's credential posture. Plaintext credentials in env
  vars (CTL.ECS.SECRETS.001) — credentials visible in
  configuration. Broken secret reference
  (CTL.ECS.TASKDEF.SECRET.BROKEN.REF.001) — execution role
  cannot retrieve the referenced secret; tasks fail at launch.
  Insecure SSM parameter type
  (CTL.ECS.TASKDEF.SSM.INSECURE.001) — String type instead of
  SecureString; values stored in plaintext on the SSM side
  without KMS protection. Threshold of 1 reflects that each
  failure independently means credentials are either exposed,
  inaccessible, or unprotected — three different broken states
  but the same operational consequence: the secrets workflow
  is not delivering on the security guarantee it should.
controls:
  - CTL.ECS.SECRETS.001
  - CTL.ECS.TASKDEF.SECRET.BROKEN.REF.001
  - CTL.ECS.TASKDEF.SSM.INSECURE.001
escalation_threshold: 1
compound_severity: high
preconditions:
  - container_code_execution
postconditions:
  - data_access
