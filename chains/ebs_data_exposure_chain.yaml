id: ebs_data_exposure_chain
description: >
  Plaintext disk data is shared cross-account
  AND either no SCP prevents public sharing or
  the public-sharing alarm is missing. Data is
  exposed AND either unprotected at the
  organizational level or unmonitored at the
  detection level. Threshold of 2 because the
  compound describes both an active exposure
  and a posture that cannot prevent or detect
  worse exposure happening next.
controls:
  - CTL.EC2.EBS.SNAPSHOT.UNENCRYPTED.SHARED.001
  - CTL.EC2.EBS.CROSSACCOUNT.NOSCPRESTRICTION.001
  - CTL.EC2.EBS.ALARM.SNAPSHOTPUBLIC.001
escalation_threshold: 2
compound_severity: critical
preconditions:
  - ungoverned_operation
postconditions:
  - data_access
