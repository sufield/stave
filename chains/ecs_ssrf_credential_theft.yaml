id: ecs_ssrf_credential_theft
description: >
  ECS task has an over-privileged IAM role and unrestricted outbound
  network access. An SSRF vulnerability in any container can retrieve
  credentials from the task metadata endpoint and exfiltrate them to
  attacker infrastructure over the unrestricted egress path. The
  credential theft is one HTTP request away from completion.
controls:
  - CTL.ECS.TASKMETADATA.001
  - CTL.VPC.SG.EGRESS.001
escalation_threshold: 2
compound_severity: critical
