id: azure_silent_monitoring_collapse
description: >
  Alert notifications are broken (ghost action group) AND either
  Defender security contact is missing or Activity Log is not exported.
  The monitoring infrastructure appears active but notifications go
  nowhere and audit data is not preserved.
controls:
  - CTL.AZURE.ALERT.GHOST.001
  - CTL.AZURE.DEFENDER.CONTACT.001
  - CTL.AZURE.ACTIVITYLOG.EXPORT.001
escalation_threshold: 2
compound_severity: critical
preconditions:
  - internet_access
postconditions:
  - iam_credential_theft
