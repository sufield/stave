id: ec2_lt_security_drift
description: >
  Launch template default version is not the latest AND either the
  template forces public IPs (overriding subnet architecture) OR
  the template references a deregistered AMI. The template is the
  authoritative source of truth for new instance launches; when
  it has multiple drift signals at once — the team has authored
  newer versions that are not in effect, AND the active version
  forces internet exposure or points at an AMI that no longer
  exists — every scale-out, replacement, and manual launch
  reproduces the drift. The combined posture is a template that
  is simultaneously stale, mis-configured for network exposure,
  and pointing at deleted infrastructure.
controls:
  - CTL.EC2.LT.VERSION.STALE.001
  - CTL.EC2.LT.PUBLICIP.001
  - CTL.EC2.AMI.GHOST.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - network_access_ec2
postconditions:
  - ec2_code_execution
