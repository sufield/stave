id: rds_credential_lifecycle
description: >
  Database credentials are not in Secrets Manager AND either no
  rotation is configured for the Secrets Manager secret that
  exists on the account or the master password has not been
  rotated within the threshold. The credential lifecycle is
  broken in compounding ways: the credential is unmanaged AND
  either rotation is not even configured or the rotation that
  exists is not actually being exercised. The compromise window
  is unbounded — any leaked copy of the credential remains valid
  until somebody manually intervenes, and the absence of central
  management means the team does not know how many copies exist
  to update.
controls:
  - CTL.RDS.SECRET.EXISTS.001
  - CTL.SECRETS.ROTATION.001
  - CTL.RDS.AUTH.MASTERPASSWORD.AGE.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - network_access_rds
postconditions:
  - db_credential_theft
implicit_dependencies: []
