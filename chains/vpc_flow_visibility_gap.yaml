id: vpc_flow_visibility_gap
description: >
  Flow logs are not in ACTIVE status AND either capture only one
  traffic direction or deliver to an insecure destination. Network
  visibility is broken at two independent layers — logs are not
  flowing now, AND historical logs (if any) are either incomplete
  or compromisable. Even if the status issue is fixed, the
  existing record is structurally unfit for investigation.
controls:
  - CTL.VPC.FLOWLOG.STATUS.001
  - CTL.VPC.FLOWLOG.BIDIRECTIONAL.001
  - CTL.VPC.FLOWLOG.DESTINATION.SECURE.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - network_access_vpc
postconditions:
  - audit_trail_destroyed
