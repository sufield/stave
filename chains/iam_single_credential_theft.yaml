id: iam_single_credential_theft
description: >
  An IAM user has a full-admin policy attached AND no console MFA
  enrolled. The two findings co-fire on the same user. Either
  finding alone is high-severity; together they describe the
  canonical "one credential leak = full account breach" path: an
  attacker who phishes, scrapes, or otherwise obtains this user's
  password reaches admin-equivalent capability in a single step,
  with no second factor blocking them. The risk-relationship
  essay names this as the first compound on its list ("excessive
  permissions + no MFA"); this chain makes that compound a real
  detection rather than a hypothetical pattern.
controls:
  - CTL.IAM.POLICY.ADMIN.001
  - CTL.IAM.CONSOLE.MFA.001
escalation_threshold: 2
compound_severity: critical
preconditions:
  - iam_credential_theft
postconditions:
  - shadow_admin_access
