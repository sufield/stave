id: route53_dns_compromise
description: >
  Route53 domain without transfer lock and with dangling IP records.
  The domain is vulnerable to both hijacking via unauthorized transfer
  and subdomain takeover via dangling DNS records.
controls:
  - CTL.ROUTE53.TRANSFER.001
  - CTL.ROUTE53.DANGLING.001
escalation_threshold: 2
compound_severity: critical
preconditions:
  - internet_access
postconditions:
  - s3_data_access
