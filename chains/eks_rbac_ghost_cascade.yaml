id: eks_rbac_ghost_cascade
description: >
  EKS RBAC layer has multiple ghost references co-occurring:
  Bindings reference deleted subjects (ServiceAccounts,
  Users, Groups), bindings reference deleted Roles or
  ClusterRoles, and / or NetworkPolicies match no live pods.
  Each ghost is independently a name-reuse privilege
  escalation surface — a recreated SA / Role / labeled pod
  silently inherits the original's grants. Co-occurrence
  indicates the RBAC + network-policy inventory has not been
  pruned. Threshold of 2 fires when at least two RBAC /
  policy ghosts coexist.
controls:
  - CTL.EKS.RBAC.GHOST.SUBJECT.001
  - CTL.EKS.RBAC.GHOST.ROLEREF.001
  - CTL.EKS.NETPOL.GHOST.PEER.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - ungoverned_operation
postconditions:
  - shadow_admin_access
implicit_dependencies:
  - source: observation.ghost_reference_resolver
    fallback: fail_open
    diagnostic: >-
      Ghost reference resolution depends on snapshot completeness for the referenced resource type. If the referenced service was not collected, ghost references cannot be detected.
