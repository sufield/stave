id: secrets_rotation_broken
description: >
  Any rotation failure — rotation Lambda deleted, rotation
  overdue, or rotation never completed. Each independently
  means the credential is static while appearing rotated.
  The "false rotation" pattern at the credential layer.
  Threshold of 1 fires whenever the rotation pipeline is
  broken from any cause, regardless of which specific
  failure mode triggered it.
controls:
  - CTL.SECRETS.GHOST.ROTATIONLAMBDA.001
  - CTL.SECRETS.ROTATION.STALE.001
  - CTL.SECRETS.ROTATION.NEVER.001
escalation_threshold: 1
compound_severity: high
preconditions:
  - ungoverned_operation
postconditions:
  - audit_trail_destroyed
implicit_dependencies:
  - source: observation.ghost_reference_resolver
    fallback: fail_open
    diagnostic: >-
      Ghost reference resolution depends on snapshot completeness for the referenced resource type. If the referenced service was not collected, ghost references cannot be detected.
