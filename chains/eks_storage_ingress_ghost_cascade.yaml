id: eks_storage_ingress_ghost_cascade
description: >
  EKS storage / ingress / load-balancer layer has multiple
  ghost references co-occurring: PVC references a deleted
  StorageClass, StorageClass references a deleted KMS key,
  Ingress references a deleted ACM certificate, or
  LoadBalancer Service annotation references a deleted SG.
  Each ghost breaks a specific operational path (storage
  provisioning, encryption, TLS, ELB binding); co-occurrence
  indicates the cluster's AWS-side resource inventory has
  drifted past the cluster's manifest references. Threshold
  of 2 fires when at least two storage / ingress ghosts
  coexist.
controls:
  - CTL.EKS.PVC.GHOST.STORAGECLASS.001
  - CTL.EKS.STORAGECLASS.GHOST.KMS.001
  - CTL.EKS.INGRESS.GHOST.CERT.001
  - CTL.EKS.SERVICE.GHOST.SG.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - ungoverned_operation
postconditions:
  - data_destruction
