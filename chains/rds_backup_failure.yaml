id: rds_backup_failure
description: >
  Automated backups are not encrypted (uses existing
  CTL.RDS.ENCRYPT.BACKUP.001) AND either no cross-region
  recovery path exists or the retention floor is below the
  active compliance framework. The backup posture has
  multiple compounding failures: the data is unprotected at
  rest AND either it is not regionally resilient or it does
  not satisfy the framework's recovery window. Each gap
  alone is high severity; the combination is a backup
  surface that fails the encryption contract, the regional
  resilience contract, or the regulatory retention contract
  simultaneously.
controls:
  - CTL.RDS.ENCRYPT.BACKUP.001
  - CTL.RDS.BACKUP.CROSSREGION.001
  - CTL.RDS.BACKUP.RETENTION.COMPLIANCE.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - network_access_rds
postconditions:
  - data_destruction
