id: iam_credential_leakage
description: >
  Credentials exposed in ANY of user data, CloudFormation, or CI/CD.
  Each independently is a credential leakage path. Threshold 1 because
  any single exposure is a compromise — credentials in user data are
  readable via four attack surfaces, credentials in CloudFormation
  persist in stack history, and long-lived CI/CD keys are the most
  commonly leaked credential type.
controls:
  - CTL.IAM.CREDENTIAL.USERDATA.001
  - CTL.IAM.CREDENTIAL.CFN.001
  - CTL.IAM.CREDENTIAL.CICD.001
escalation_threshold: 1
compound_severity: critical
preconditions:
  - network_access_ec2
postconditions:
  - iam_credential_theft
