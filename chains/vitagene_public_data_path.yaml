id: vitagene_public_data_path
description: >
  Vitagene incident shape: public S3 buckets containing
  sensitive customer data (DNA information) with no
  CloudTrail logging to detect access. The FTC fined
  the company. The compound: public S3 plus no logging
  equals data exposure with no forensic trail.
controls:
  - CTL.S3.POLLUTION.PUBLIC.001
  - CTL.CLOUDTRAIL.DATAEVENTS.S3.001
escalation_threshold: 2
compound_severity: high
incident_precedent:
  name: Vitagene (2019)
  impact: Customer DNA data exposed in public S3 buckets; FTC enforcement action
  reference: FTC complaint and consent order
preconditions:
  - internet_access
postconditions:
  - data_access
