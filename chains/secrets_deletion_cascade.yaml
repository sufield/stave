id: secrets_deletion_cascade
description: >
  Either secret pending deletion with dependent resources
  or rotation Lambda deleted. Each independently causes
  cascading service failure — secret deletion breaks every
  service that depends on the credential, ghost rotation
  Lambda breaks rotation indefinitely. Both are transversal
  failures: one resource's broken state propagates outward
  to every dependent. Threshold of 1 fires on either.
controls:
  - CTL.SECRETS.GHOST.DELETION.REFERENCED.001
  - CTL.SECRETS.GHOST.ROTATIONLAMBDA.001
escalation_threshold: 1
compound_severity: critical
preconditions:
  - ungoverned_operation
postconditions:
  - data_destruction
implicit_dependencies:
  - source: observation.ghost_reference_resolver
    fallback: fail_open
    diagnostic: >-
      Ghost reference resolution depends on snapshot completeness for the referenced resource type. If the referenced service was not collected, ghost references cannot be detected.
