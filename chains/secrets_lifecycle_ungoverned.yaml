id: secrets_lifecycle_ungoverned
description: >
  Old AWSPREVIOUS plus either minimum deletion window or
  dormant secret. Multiple lifecycle governance failures:
  old credential versions persist AND either deletion is
  rushed (7-day minimum window may not surface infrequent
  consumers) or the secret is unused (latent surface). The
  credential infrastructure is neither cleaned up nor
  properly governed. Threshold of 2 fires when AWSPREVIOUS
  staleness compounds with another lifecycle failure.
controls:
  - CTL.SECRETS.LIFECYCLE.PREVIOUSOLD.001
  - CTL.SECRETS.LIFECYCLE.DELETION.MINWAIT.001
  - CTL.SECRETS.LIFECYCLE.DORMANT.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - ungoverned_operation
postconditions:
  - audit_trail_destroyed
