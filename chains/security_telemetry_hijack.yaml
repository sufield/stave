id: security_telemetry_hijack
description: >
  Security telemetry destination bucket (CloudTrail, Config, GuardDuty,
  VPC Flow Logs, Macie) can be hijacked. This is the "blinding the
  watchmen" scenario — the attacker simultaneously exfiltrates security
  telemetry AND removes defender visibility. Ghost destination plus
  missing data perimeter SCP. OAuth authorization events
  (AuthorizeOAuth2Access, CreateOAuth2Token) are recorded in
  CloudTrail — hijacking this trail's destination also blinds
  monitoring of agent authorization activity.
controls:
  - CTL.CLOUDTRAIL.GHOST.S3BUCKET.001
  - CTL.CONFIG.GHOST.DELIVERY.S3.001
  - CTL.GUARDDUTY.GHOST.EXPORT.S3.001
  - CTL.VPC.FLOWLOG.GHOST.S3.001
  - CTL.MACIE.GHOST.EXPORT.S3.001
  - CTL.IAM.SCP.DATAPERIMETER.S3.001
escalation_threshold: 2
compound_severity: critical
preconditions:
  - s3_delete_bucket_permission
postconditions:
  - security_telemetry_exfiltration
  - detection_blindness
implicit_dependencies:
  - source: observation.ghost_reference_resolver
    fallback: fail_open
    diagnostic: >-
      Ghost reference resolution depends on snapshot completeness for the referenced resource type. If the referenced service was not collected, ghost references cannot be detected.
