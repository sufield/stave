id: ec2_patch_failure
description: >
  Instance is patch non-compliant AND either the
  maintenance window that installs patches has not run in
  over a month or the compliance scan that detects them
  has not run in over a week. Known vulnerabilities exist
  on the instance AND either the remediation pipeline
  (maintenance window) is broken or the detection
  pipeline (compliance scan) is stale. The patch-
  management lifecycle is failing at multiple points
  simultaneously — the failures hide each other (a stale
  scan understates how many patches are missing; an
  inactive window means even visible misses are not
  fixed).
controls:
  - CTL.SSM.PATCH.COMPLIANCE.001
  - CTL.EC2.PATCH.WINDOW.INACTIVE.001
  - CTL.EC2.PATCH.SCAN.STALE.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - network_access_ec2
postconditions:
  - ec2_code_execution
