id: sagemaker_training_data_leak
description: >
  SageMaker training job execution role has overbroad S3 access
  (s3:* or s3:GetObject on *), the training data source is
  cross-account and unencrypted, and the training job has no
  VPC isolation. The training container can read any S3 bucket
  (including non-training data), the cross-account path carries
  data in plaintext, and the missing VPC isolation means the
  training container has internet egress for exfiltration. All
  three conditions must stack: overbroad S3 provides reach,
  cross-account unencrypted provides an unprotected data path,
  and missing VPC provides the egress channel.
controls:
  - CTL.SAGEMAKER.TRAINING.OVERPERM.S3.001
  - CTL.SAGEMAKER.TRAINING.DATA.CROSSACCOUNT.001
  - CTL.SAGEMAKER.TRAINING.VPC.001
escalation_threshold: 3
compound_severity: critical
preconditions:
  - s3_data_access
postconditions:
  - data_destruction
