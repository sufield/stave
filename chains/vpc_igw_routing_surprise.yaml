id: vpc_igw_routing_surprise
description: >
  A VPC has an internet gateway attached that's not architecturally
  needed (CTL.VPC.IGW.UNNECESSARY.001) AND either the main route
  table points at it (CTL.VPC.ROUTETABLE.MAIN.PUBLIC.001 — any
  subnet associated with the main RT becomes public via the
  default association) or subnets are auto-assigning public IPs
  (CTL.VPC.SUBNET.AUTOPUBLIC.001 — instances launched there are
  internet-facing without explicit opt-in). The IGW alone is
  configuration debt; the IGW plus an exposing route or subnet
  attribute is the "routing surprise" — instances the operator
  thinks are private are reachable from the internet through
  whichever leg fires. Threshold 2 because each leg alone is
  documented hygiene; the conjunction describes the actual blast
  surface (the IGW is the egress door + the route/subnet is the
  unlocked path).
controls:
  - CTL.VPC.IGW.UNNECESSARY.001
  - CTL.VPC.ROUTETABLE.MAIN.PUBLIC.001
  - CTL.VPC.SUBNET.AUTOPUBLIC.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - network_access_vpc
postconditions:
  - initial_access
implicit_dependencies: []
