id: lambda_exfiltration_bridge
description: >
  Function has broad data access, no VPC network isolation, and no
  logging. Data can move from private stores to external destinations
  without network controls and without an audit trail.
controls:
  - CTL.LAMBDA.VPC.SENSITIVE.001
  - CTL.LAMBDA.ROLE.LEASTPRIV.001
  - CTL.LAMBDA.LOG.001
escalation_threshold: 2
compound_severity: critical
