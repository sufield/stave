id: cicd_credential_exfiltration_path
description: >
  CI/CD credential exposure incident shape: CI/CD systems
  use long-term IAM access keys instead of OIDC federation,
  AND CI/CD roles have broad permissions. This is the root
  cause of three breaches.cloud incidents: CommuteAir (2023,
  Jenkins with access keys to No Fly List), Uber (2014/2016,
  GitHub repos with access keys to 57M records, $148M fine),
  and Drizly (2020, credential-stuffed GitHub to AWS keys to
  2M records). 19% of the breaches.cloud database shares
  this pattern.
controls:
  - CTL.IAM.CREDENTIAL.CICD.001
  - CTL.IAM.CICD.SCOPE.001
  - CTL.IAM.OIDC.GITHUB.SUBJECT.001
escalation_threshold: 2
compound_severity: critical
preconditions:
  - internet_access
postconditions:
  - iam_credential_theft
implicit_dependencies: []
