id: eks_workload_ghost_cascade
description: >
  EKS workload-layer has multiple ghost references co-occurring:
  container image points at a deleted ECR repo, Pod env / volumes
  reference a deleted Secret or ConfigMap, or HPA targets a
  deleted workload. Each ghost alone breaks scaling / startup /
  configuration; co-occurrence indicates the workload's
  external-resource bindings haven't been audited as the AWS
  inventory drifted. Threshold of 2 fires when at least two
  workload-level ghost references coexist.
controls:
  - CTL.EKS.WORKLOAD.GHOST.IMAGE.001
  - CTL.EKS.HPA.GHOST.TARGET.001
  - CTL.EKS.POD.GHOST.SECRET.001
  - CTL.EKS.POD.GHOST.CONFIGMAP.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - ungoverned_operation
postconditions:
  - data_destruction
