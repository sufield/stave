id: secrets_rds_unmanaged
description: >
  Any RDS credential management failure — master password
  not in Secrets Manager, rotation stale, or secret for
  deleted database. Each independently means database
  authentication is ungoverned: either the password is
  outside SM (no rotation, no audit), rotation is broken
  (credential static), or the secret outlived the
  database (orphaned). Threshold of 1 fires on any one
  of these failures.
controls:
  - CTL.SECRETS.INTEGRATION.RDS.NOSECRET.001
  - CTL.SECRETS.ROTATION.STALE.001
  - CTL.SECRETS.LIFECYCLE.ORPHAN.DATABASE.001
escalation_threshold: 1
compound_severity: high
preconditions:
  - ungoverned_operation
postconditions:
  - audit_trail_destroyed
