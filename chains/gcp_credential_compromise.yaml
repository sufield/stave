id: gcp_credential_compromise
description: >
  SA keys exist AND either primitive roles assigned, default SA on
  compute, or GKE Workload Identity disabled. Exportable credentials
  combined with over-privileged or shared identities.
controls:
  - CTL.GCP.IAM.SA.KEYS.001
  - CTL.GCP.IAM.PRIMITIVE.001
  - CTL.GCP.COMPUTE.DEFAULTSA.001
  - CTL.GCP.GKE.WORKLOAD.001
escalation_threshold: 2
compound_severity: critical
preconditions:
  - iam_credential_theft
postconditions:
  - ec2_code_execution
