id: eks_image_credential_decay
description: >
  EKS image-credential and pull-policy posture has
  multiple defects: imagePullSecret shared across
  namespaces (cross-tenant credential leak), pods
  with imagePullPolicy=Never (cached-only, ignores
  updates), and pulls from ECR Public Gallery
  (rate-limited public registry). Each defect alone
  is operationally significant; co-occurrence
  indicates the cluster's image-pull configuration
  was set up in dev mode and never tightened for
  production. Threshold of 2 fires when at least
  two image-credential defects coexist.
controls:
  - CTL.EKS.IMAGE.PULLSECRET.SHARED.001
  - CTL.EKS.IMAGE.PULLPOLICY.NEVER.001
  - CTL.EKS.ECR.PULL.PUBLIC.GALLERY.001
escalation_threshold: 2
compound_severity: medium
preconditions:
  - ungoverned_operation
postconditions:
  - iam_credential_theft
