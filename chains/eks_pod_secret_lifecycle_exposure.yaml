id: eks_pod_secret_lifecycle_exposure
description: >
  EKS pod secrets composition is unsafe end-to-end:
  CTL.EKS.POD.SATOKEN.AUTOMOUNT.001 — service-account tokens
  auto-mount into every pod (broad in-cluster API surface) AND
  either CTL.EKS.SECRETS.ENCRYPT.001 — Kubernetes Secrets are not
  envelope-encrypted at rest with a customer-managed KMS key
  (etcd stores them in cleartext) OR CTL.EKS.SECRETS.ROTATION.001
  — secrets aren't rotated within the policy period (long-lived
  credential in a long-lived store). Threshold 2 because each leg
  is a known posture concern; their conjunction describes the
  Kubernetes-side variant of the secrets-management compound
  shape the AWS compound authoring plan's sub-family 3 names
  (the ECS-side variant is already covered by ecs_secret_lifecycle).
  An attacker who compromises any pod in the cluster has API
  access via the auto-mounted token, can list Kubernetes
  Secrets the pod's role can read, and the secrets at rest +
  rotation properties determine whether the read produces
  cleartext stale material.
controls:
  - CTL.EKS.POD.SATOKEN.AUTOMOUNT.001
  - CTL.EKS.SECRETS.ENCRYPT.001
  - CTL.EKS.SECRETS.ROTATION.001
escalation_threshold: 2
compound_severity: critical
preconditions:
  - container_code_execution
postconditions:
  - iam_credential_theft
implicit_dependencies: []
