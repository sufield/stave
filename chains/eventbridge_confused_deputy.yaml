id: eventbridge_confused_deputy
description: >
  Two or more service-source confused-deputy openings on the same
  EventBridge bus. Bus policy authorizes multiple AWS service
  principals (S3, CloudWatch, SES, SSM) to PutEvents without
  aws:SourceArn or aws:SourceAccount restrictions. Each service-
  source gap is independently a cross-account injection vector;
  two co-occurring confirms the bus operator has no service-source
  scoping discipline rather than a single misconfigured statement.
  Threshold of 2 fires when at least two service-sources are
  unguarded on the same bus. Same chain pattern as
  sns_confused_deputy and sqs_confused_deputy.
controls:
  - CTL.EVENTBRIDGE.POLICY.S3.NOSOURCE.001
  - CTL.EVENTBRIDGE.POLICY.CLOUDWATCH.NOSOURCE.001
  - CTL.EVENTBRIDGE.POLICY.SES.NOSOURCE.001
  - CTL.EVENTBRIDGE.POLICY.SSM.NOSOURCE.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - ungoverned_operation
postconditions:
  - cross_account_injection
