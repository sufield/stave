id: snowflake_credential_path
description: >
  The Snowflake incident shape (2024): console access without MFA
  AND stale credentials AND stale password AND stale admin compound.
  UNC5537 used credentials obtained from historical infostealer
  infections to access Snowflake customer tenants. The common factor
  across 165+ affected organizations: no MFA on service accounts,
  credentials that had not been rotated in years, and administrative
  permissions on forgotten identities. This chain maps the AWS
  equivalent — CTL.IAM.CONSOLE.MFA.001 detects MFA-less console,
  CTL.IAM.CRED.UNUSED.001 detects stale access keys,
  CTL.IAM.PASSWORD.ROTATION.001 detects stale passwords, and
  CTL.IAM.POLLUTION.STALEADMIN.001 detects the compound of stale
  credentials with admin access. When all four fire, the account is
  the exact Snowflake victim profile: forgotten, powerful, and
  accessible with old credentials.
  Linked incidents: Snowflake/UNC5537 (2024, Mandiant — 165+
  victims including AT&T 110M records, Ticketmaster 560M records,
  Santander 30M records), Wiz "infostealer-to-cloud" campaign
  analysis (2025, credential marketplace to SaaS/IaaS pivot).
controls:
  - CTL.IAM.CONSOLE.MFA.001
  - CTL.IAM.CRED.UNUSED.001
  - CTL.IAM.PASSWORD.ROTATION.001
  - CTL.IAM.POLLUTION.STALEADMIN.001
escalation_threshold: 3
compound_severity: critical
preconditions:
  - credential_access
postconditions:
  - data_exfiltration
implicit_dependencies:
  - source: observation.iam_credential_last_used
    fallback: fail_closed
    diagnostic: >
      IAM credential last-used date not captured. Cannot determine
      whether credentials are stale or recently rotated.
