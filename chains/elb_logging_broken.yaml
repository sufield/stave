id: elb_logging_broken
description: >
  Any ELB logging failure — ghost access-log bucket,
  access-log permission denied, or WAF logging
  disabled. Each independently means request-level or
  filtering-level audit data is not recorded. The
  perimeter has no audit trail. Threshold of 1 fires
  whenever any one of the three logging surfaces is
  broken.
controls:
  - CTL.ELB.GHOST.ACCESSLOG.001
  - CTL.ELB.ACCESSLOG.PERMISSION.001
  - CTL.ELB.WAF.NOLOG.001
escalation_threshold: 1
compound_severity: high
preconditions:
  - ungoverned_operation
postconditions:
  - audit_trail_destroyed
