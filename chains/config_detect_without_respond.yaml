id: config_detect_without_respond
description: >
  Non-compliant resources without remediation,
  or remediation configured but broken (ghost
  SSM document or ghost role). Each
  independently means detected non-compliance
  persists without fix. Detection without
  response — the compliance equivalent of
  alarm without action. Threshold of 1 because
  any path that leaves non-compliance
  unmitigated represents the same end state.
controls:
  - CTL.CONFIG.RULE.NONCOMPLIANT.NOREMEDIATION.001
  - CTL.CONFIG.REMEDIATION.GHOST.SSM.001
  - CTL.CONFIG.REMEDIATION.GHOST.ROLE.001
escalation_threshold: 1
compound_severity: high
preconditions:
  - ungoverned_operation
postconditions:
  - audit_trail_destroyed
