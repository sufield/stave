id: ec2_unmanaged_instance
description: >
  Instance is not SSM-managed AND either it is excluded from
  Inspector coverage or it is patch non-compliant. The
  instance sits outside centralized management AND either has
  no vulnerability scanning or has known unpatched
  vulnerabilities. The two conditions reinforce each other:
  unmanaged-by-SSM frequently causes Inspector exclusion (the
  agent is the scanner's input), and unmanaged-by-SSM
  precludes Patch Manager from delivering patches at all.
controls:
  - CTL.EC2.SSM.MANAGED.001
  - CTL.EC2.INSPECTOR.COVERAGE.001
  - CTL.SSM.PATCH.COMPLIANCE.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - network_access_ec2
postconditions:
  - ec2_code_execution
