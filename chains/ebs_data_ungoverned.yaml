id: ebs_data_ungoverned
description: >
  Persistent data ungoverned by lifecycle
  controls: an unattached volume lingering in
  the catalog, an attachment with
  DeleteOnTermination disabled (volume survives
  instance termination), and a volume in
  hardware error state. Two or more together
  describe data persisting outside intended
  lifecycle boundaries: orphaned and at risk.
  Threshold of 2 because each individual
  finding is operational, but the compound
  describes a data-governance failure at the
  storage layer.
controls:
  - CTL.EC2.EBS.UNATTACHED.001
  - CTL.EC2.EBS.DELETEONTERMINATION.001
  - CTL.EC2.EBS.VOLUME.ERRORSTATE.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - ungoverned_operation
postconditions:
  - data_destruction
