id: vpc_hybrid_unencrypted
description: >
  Either a Direct Connect carries unencrypted traffic or a site-to-
  site VPN uses a weak cipher suite. Any hybrid connectivity path
  between the organization's datacenter and AWS is operating without
  sufficient transit confidentiality. The two failure modes are
  independent ("DX has no overlay" vs "VPN uses AES-128") but produce
  the same outcome — recorded traffic is readable by an operator
  with physical or cryptanalytic access.
controls:
  - CTL.VPC.DX.ENCRYPTION.001
  - CTL.VPC.VPN.ENCRYPTION.WEAK.001
escalation_threshold: 1
compound_severity: high
preconditions:
  - network_access_vpc
postconditions:
  - data_in_transit_exposure
