id: ecs_container_hardening_failure
description: >
  Multiple container hardening failures stacked. The container
  runs as root (CTL.ECS.ROOT.001) — application vulnerabilities
  execute with UID 0 inside the container. Combined with either
  a writable root filesystem (CTL.ECS.TASKDEF.READONLY.001) —
  attacker-introduced binaries persist on disk — or no memory
  limit (CTL.ECS.TASKDEF.NOMEMLIMIT.001) — one container's leak
  or load spike kills neighbors via OOM. Threshold of 2 reflects
  that any single hardening gap is a tolerable defense-in-depth
  miss but two together describe a container that is both
  privileged-enough-to-act-on-the-filesystem and
  not-bounded-in-resources — a posture that meaningfully
  amplifies any compromise or operational incident.
controls:
  - CTL.ECS.ROOT.001
  - CTL.ECS.TASKDEF.READONLY.001
  - CTL.ECS.TASKDEF.NOMEMLIMIT.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - container_code_execution
postconditions:
  - data_access
