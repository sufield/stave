id: secrets_crossservice_mismatch
description: >
  Either cross-account SM/KMS mismatch or ghost policy
  principal. Each independently means secret access control
  is broken at the policy layer — either access appears
  granted but KMS blocks it, or the policy references a
  principal that no longer exists (ARN-reclamation hazard).
  The visible policy review surface is misleading in both
  cases. Threshold of 1 fires whenever the secret's access
  posture is inconsistent or stale.
controls:
  - CTL.SECRETS.CROSSACCOUNT.NOKMS.001
  - CTL.SECRETS.GHOST.POLICY.PRINCIPAL.001
escalation_threshold: 1
compound_severity: high
preconditions:
  - resource_policy_escalation
postconditions:
  - ungoverned_operation
