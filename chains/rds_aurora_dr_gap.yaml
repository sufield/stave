id: rds_aurora_dr_gap
description: >
  Aurora Global Database secondary is unencrypted OR the
  cluster has no cross-region recovery path of any kind
  (uses RDS-5's CTL.RDS.BACKUP.CROSSREGION.001). Either
  condition independently breaks the cluster's regional-
  failure DR posture: the secondary exists but its data
  protection profile differs from the primary's, OR the
  cluster has no second-region landing zone at all. The
  threshold of 1 reflects that DR is binary in
  practice — you have a working alternate-region recovery
  path or you do not, and a half-built one (encrypted
  primary, unencrypted secondary) is its own category of
  failure.
controls:
  - CTL.RDS.AURORA.GLOBAL.UNENCRYPTED.001
  - CTL.RDS.BACKUP.CROSSREGION.001
escalation_threshold: 1
compound_severity: high
preconditions:
  - network_access_rds
postconditions:
  - data_destruction
