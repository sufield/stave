id: github_secret_exposure
description: >
  No secret scanning plus either no push protection or no MFA.
  Leaked credentials persist undetected with either no prevention
  or weak authentication to the repository.
controls:
  - CTL.GITHUB.REPO.SECRETSCAN.001
  - CTL.GITHUB.REPO.SECRETSCAN.PUSH.001
  - CTL.GITHUB.ORG.MFA.001
escalation_threshold: 2
compound_severity: critical
preconditions:
  - internet_access
postconditions:
  - iam_credential_theft
