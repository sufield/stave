id: config_delivery_unreliable
description: >
  Any delivery reliability failure: delivery
  failures unmonitored, delivery bucket deleted,
  or snapshots stale. Each independently means
  the configuration audit trail is either not
  being persisted, not being monitored for
  persistence failures, or not being refreshed.
  Threshold of 1 because the durable
  configuration record is unreliable in any of
  these cases.
controls:
  - CTL.CONFIG.DELIVERY.FAILURES.UNMONITORED.001
  - CTL.CONFIG.GHOST.DELIVERY.S3.001
  - CTL.CONFIG.LIFECYCLE.SNAPSHOT.STALE.001
escalation_threshold: 1
compound_severity: high
preconditions:
  - ungoverned_operation
postconditions:
  - audit_trail_destroyed
