id: rds_auth_weakness
description: >
  IAM authentication is not enabled on the RDS instance AND
  either the master username matches a well-known default or
  a Secrets Manager secret on the account has a public
  resource policy. The authentication path falls back to
  password-only AND either the username half is free for
  the attacker (well-known default) or the password half is
  publicly retrievable (any AWS principal can call
  GetSecretValue). One condition alone is medium severity;
  the combination is the database operating with a guessable
  username and / or a publicly-fetchable password against
  static-credential authentication.
controls:
  - CTL.RDS.IAMAUTH.001
  - CTL.RDS.AUTH.MASTERUSER.001
  - CTL.SECRETSMANAGER.POLICY.PUBLIC.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - network_access_rds
postconditions:
  - rds_data_access
