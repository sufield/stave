id: ec2_ebs_data_remnant
description: >
  EBS volume is unattached or has DeleteOnTermination disabled
  AND the volume is unencrypted. Data either persists after
  termination or already persists as an orphan, AND the data
  is plaintext. Anyone in the account with `ec2:AttachVolume`
  permission can attach the orphan to a scratch instance and
  read every block. The combination is the worst-case data
  remnant: the data is exposed by being unmonitored, and
  exposed again by being unencrypted.
controls:
  - CTL.EC2.EBS.UNATTACHED.001
  - CTL.EC2.EBS.DELETEONTERMINATION.001
  - CTL.EC2.EBS.ENCRYPT.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - network_access_vpc
postconditions:
  - data_access
