id: network_ghost_exposure
description: >
  Multiple network infrastructure references point to deleted resources.
  Traffic routing (DNS), access policies (VPC endpoint), and firewall
  rules (security group) all contain ghost references — the network
  configuration describes an infrastructure that no longer exists.
controls:
  - CTL.VPC.ENDPOINT.GHOST.001
  - CTL.ROUTE53.GHOST.001
  - CTL.VPC.SG.GHOST.001
escalation_threshold: 2
compound_severity: critical
preconditions:
  - internet_access
postconditions:
  - s3_data_access
implicit_dependencies:
  - source: observation.ghost_reference_resolver
    fallback: fail_open
    diagnostic: >-
      Ghost reference resolution depends on snapshot completeness for the referenced resource type. If the referenced service was not collected, ghost references cannot be detected.
