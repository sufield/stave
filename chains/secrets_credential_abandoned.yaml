id: secrets_credential_abandoned
description: >
  Any credential abandonment — dormant secret, never
  accessed, or orphan database. Each independently means a
  credential exists without legitimate use: the credential
  may still authenticate at the target service, the policy
  still grants access, and nobody monitors for misuse. The
  abandoned-credential pattern: a working credential that
  nobody uses but anybody with GetSecretValue permission
  can retrieve. Threshold of 1 fires whenever a secret is
  not exercised by any legitimate consumer.
controls:
  - CTL.SECRETS.LIFECYCLE.DORMANT.001
  - CTL.SECRETS.LIFECYCLE.NEVERACCESSED.001
  - CTL.SECRETS.LIFECYCLE.ORPHAN.DATABASE.001
escalation_threshold: 1
compound_severity: medium
preconditions:
  - ungoverned_operation
postconditions:
  - audit_trail_destroyed
