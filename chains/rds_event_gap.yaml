id: rds_event_gap
description: >
  No deletion-event subscription AND either no security-event
  subscription or no deletion protection. The change-detection
  chain has compounding failures: a database deletion is not
  notified in real time AND either security-posture changes
  (security group, parameter group, configuration) are
  similarly invisible to the on-call channel, or the preventive
  control (deletion protection) is also off. The team learns
  about deletions and posture changes from application failure
  modes or the next quarterly audit, not from the events
  themselves.
controls:
  - CTL.RDS.EVENTS.DELETION.001
  - CTL.RDS.EVENTS.SECURITY.001
  - CTL.RDS.DELETEPROT.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - network_access_rds
postconditions:
  - data_destruction
