id: codebuild_supply_chain_compromise
description: >
  CodeBuild project with plaintext credentials, overprivileged role,
  and unauthenticated or unvetted source — complete supply chain
  attack surface. An attacker who gains build execution can extract
  credentials, use the overprivileged role to access production
  resources, and inject malicious code into build artifacts.
controls:
  - CTL.CODEBUILD.SECRETS.001
  - CTL.CODEBUILD.ROLE.001
  - CTL.CODEBUILD.SOURCE.ORG.001
escalation_threshold: 2
compound_severity: critical
preconditions:
  - s3_data_access
postconditions:
  - data_destruction
implicit_dependencies: []
