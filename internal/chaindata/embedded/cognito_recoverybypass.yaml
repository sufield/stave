id: cognito_recoverybypass
description: >
  MFA is enforced on the happy-path login
  AND the recovery flow doesn't require MFA
  AND the only second factor available is
  SMS. The MFA enforcement is theatre — an
  attacker uses the recovery path (email or
  SMS-driven) to bypass MFA entirely, and
  even if they faced MFA, SMS alone is
  defeatable via SIM swap. Threshold of 2
  because the dangerous compound is when
  the recovery escape route stacks with a
  weak channel.
controls:
  - CTL.COGNITO.RECOVERY.NOMFA.001
  - CTL.COGNITO.MFA.SMSONLY.001
  - CTL.COGNITO.MFA.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - ungoverned_operation
postconditions:
  - iam_credential_theft
implicit_dependencies: []
