id: lambda_event_source_exposure
description: >
  Event source exposure of Lambda functions. Traces inward to each
  Lambda — enumerating all invocation paths (ESM pull and push-based),
  classifying source trust levels, detecting unconstrained resource-based
  policy grants, and identifying trigger chain amplification where
  weakly-authenticated sources transitively invoke privileged execution
  roles. Composes with FM-042 blast radius for trust boundary violation
  detection.
controls:
  - CTL.LAMBDA.TRIGGER.APIGATEWAY.NOAUTH.001
  - CTL.LAMBDA.TRIGGER.CONFUSEDDEPUTY.001
  - CTL.LAMBDA.TRIGGER.GHOST.001
  - CTL.LAMBDA.ESM.NODLQ.001
  - CTL.LAMBDA.ESM.BISECT.001
  - CTL.LAMBDA.INVOKE.PUBLIC.001
escalation_threshold: 2
compound_severity: critical
preconditions:
  - initial_access
postconditions:
  - ec2_code_execution
  - data_access
implicit_dependencies:
  - source: observation.ghost_reference_resolver
    fallback: fail_open
    diagnostic: >-
      Ghost reference resolution depends on snapshot completeness for the referenced resource type. If the referenced service was not collected, ghost references cannot be detected.
