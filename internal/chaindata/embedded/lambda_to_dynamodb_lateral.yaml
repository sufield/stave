id: lambda_to_dynamodb_lateral
description: >
  Lambda function has an overbroad execution role and
  DynamoDB is accessible without a VPC endpoint policy
  restriction — a compromised function can read or write
  arbitrary DynamoDB tables via the public API. The first
  leg detects that the Lambda execution role exceeds
  least-privilege (CTL.LAMBDA.ROLE.LEASTPRIV.001) —
  the role grants broad DynamoDB actions (dynamodb:*,
  dynamodb:GetItem on *, or similar). The second leg
  detects that no VPC endpoint enforces a restrictive
  policy on DynamoDB access (CTL.DYNAMODB.VPC.ENDPOINT.001)
  — the function reaches DynamoDB over the public endpoint
  with no network-level constraint. Together: function
  compromise yields unrestricted DynamoDB access across
  every table the overbroad role permits. This is the most
  common serverless architecture pair (API Gateway → Lambda
  → DynamoDB) and the IAM-path lateral movement pattern.
  Removing either leg breaks the chain: scope the Lambda
  role to specific tables and actions, OR enforce a VPC
  endpoint policy that restricts DynamoDB access to
  authorized principals.
controls:
  - CTL.LAMBDA.ROLE.LEASTPRIV.001
  - CTL.DYNAMODB.VPC.ENDPOINT.001
scope: global
escalation_threshold: 2
compound_severity: high
preconditions:
  - credential_access
postconditions:
  - data_access
implicit_dependencies: []
