id: apprunner_to_rds_lateral
description: >
  App Runner service is connected to a VPC and shares
  network connectivity with an RDS instance that accepts
  broad security-group ingress — a compromised service can
  reach the database directly over the VPC network. The
  first leg detects that the App Runner VPC connector's
  security group permits unrestricted egress
  (CTL.VPC.SG.EGRESS.001) — the service can initiate
  connections to any destination in the VPC, including the
  database subnet. The second leg detects that the RDS
  instance's security group accepts broad ingress on the
  database port (CTL.RDS.SG.BROAD.001) — including from
  the App Runner subnet. Together: service compromise
  yields database access without restriction. App Runner
  commonly backs web applications with RDS databases; this
  is the standard web-app lateral movement pattern.
  Removing either leg breaks the chain: restrict the VPC
  connector's egress to the database endpoint only, OR
  scope the RDS security group to accept connections only
  from the App Runner security group.
controls:
  - CTL.VPC.SG.EGRESS.001
  - CTL.RDS.SG.BROAD.001
scope_field: properties.network.vpc_id
escalation_threshold: 2
compound_severity: high
preconditions:
  - network_access_vpc
postconditions:
  - data_access
implicit_dependencies: []
