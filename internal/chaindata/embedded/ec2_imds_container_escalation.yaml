id: ec2_imds_container_escalation
description: >
  Container-aware IMDS bypass is detected
  (CTL.EC2.IMDSV2.002 — host-network or bridge+hop>1
  containers reach the metadata endpoint) AND either the
  hop limit alone is excessive or IMDSv2 is not enforced
  at all. Multiple credential-theft preconditions stack:
  containers can reach IMDS, the hop allowance is
  generous, and the basic IMDSv1 protections may not
  even be in place. A compromised container retrieves
  the host's IAM role credentials and operates with
  host-level permissions across the account.
controls:
  - CTL.EC2.IMDSV2.002
  - CTL.EC2.IMDS.HOPLIMIT.001
  - CTL.EC2.IMDSV2.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - container_code_execution
postconditions:
  - iam_credential_theft
implicit_dependencies: []
