id: eks_cluster_blind
description: >
  EKS cluster has multiple cluster-level monitoring
  gaps: API server error rate, etcd latency, NotReady
  node count, node pressure, or kubelet heartbeat
  alarms missing. The cluster's coordination layer
  (control plane + node liveness) operates without
  observability. Operators detect failures via
  downstream symptoms (deploys hanging, evictions
  cascading) rather than direct alarms. Threshold of
  2 fires when at least two cluster-monitoring gaps
  coexist.
controls:
  - CTL.EKS.ALARM.API.ERRORS.001
  - CTL.EKS.ALARM.ETCD.LATENCY.001
  - CTL.EKS.ALARM.NODES.NOTREADY.001
  - CTL.EKS.ALARM.NODE.PRESSURE.001
  - CTL.EKS.ALARM.KUBELET.HEARTBEAT.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - ungoverned_operation
postconditions:
  - audit_trail_destroyed
implicit_dependencies: []
