id: lambda_silent_failure
description: >
  Either the function's DLQ points at a deleted target OR
  an event source mapping points at a deleted source (uses
  existing CTL.LAMBDA.TRIGGER.GHOST.001). Each condition
  independently causes data loss without surfacing through
  the standard "the function is failing" signals. Ghost
  DLQ: failed events vanish on publish (no error
  propagation). Ghost ESM: events are never consumed
  because the source no longer exists. Threshold of 1
  reflects that either condition alone is sufficient for
  silent loss.
controls:
  - CTL.LAMBDA.GHOST.DLQ.001
  - CTL.LAMBDA.TRIGGER.GHOST.001
escalation_threshold: 1
compound_severity: high
preconditions:
  - network_access_lambda
postconditions:
  - audit_trail_destroyed
implicit_dependencies:
  - source: observation.ghost_reference_resolver
    fallback: fail_open
    diagnostic: >-
      Ghost reference resolution depends on snapshot completeness for the referenced resource type. If the referenced service was not collected, ghost references cannot be detected.
