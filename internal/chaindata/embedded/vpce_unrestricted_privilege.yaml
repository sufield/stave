id: vpce_unrestricted_privilege
description: >
  Principal has broad IAM permissions AND the VPC endpoint uses a
  default or wildcard policy — the endpoint does not restrict the
  principal's effective permissions, making IAM-level breadth fully
  exploitable through this network path. The IAM privilege resolver
  over-approximates by not modeling endpoint policies; this chain
  surfaces the cases where the over-approximation matters: broad
  IAM permissions AND a permissive endpoint policy mean the
  resolver's output matches reality. When the endpoint policy IS
  restrictive, only the IAM-side control fires — the chain does
  not, correctly suppressing the compound risk signal.
controls:
  - CTL.IAM.POLICY.ADMIN.001
  - CTL.IAM.POLICY.SERVICEWILDCARD.001
  - CTL.IAM.POLICY.RESOURCE.WILDCARD.001
  - CTL.EC2.PROFILE.OVERBROAD.001
  - CTL.VPC.ENDPOINT.INTERFACE.DEFAULTPOLICY.001
  - CTL.VPC.ENDPOINT.GATEWAY.DEFAULTPOLICY.001
  - CTL.VPC.ENDPOINT.POLICY.WILDCARD.001
  - CTL.VPC.ENDPOINT.POLICY.NOPRINCIPAL.001
scope: global
escalation_threshold: 2
compound_severity: high
preconditions:
  - credential_access
  - network_access_vpc
postconditions:
  - data_access
  - lateral_movement
implicit_dependencies: []
