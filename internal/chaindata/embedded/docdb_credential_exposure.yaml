id: docdb_credential_exposure
description: >
  DocumentDB cluster has TLS disabled at the parameter group and
  IAM database authentication disabled. The cluster authenticates
  only via long-lived database-local passwords, and those
  passwords (plus the SCRAM challenge/response authenticating
  them) travel the VPC in clear text. Any in-VPC packet capture
  recovers a working master credential. The two controls together
  produce continuous credential exposure; TLS off alone leaks
  short-lived IAM tokens, IAM-off alone preserves long-lived
  passwords behind TLS.
controls:
  - CTL.DOCUMENTDB.TLS.DISABLED.001
  - CTL.DOCUMENTDB.IAM.AUTH.OFF.001
escalation_threshold: 2
compound_severity: critical
postconditions:
  - db_credential_theft
  - data_in_transit_exposure
implicit_dependencies: []
