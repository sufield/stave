id: lambda_credential_history
description: >
  Older published function versions retain stale
  environment variables AND credential patterns are
  detected in the current env block (existing
  CTL.LAMBDA.ENV.SECRETS.001). The function's current
  configuration carries credential-shaped values AND the
  immutable version snapshots in published version
  history retain prior credential states. The risk is
  cumulative: every published version that ever held a
  raw credential is a permanent disclosure path against
  any principal with lambda:GetFunction on the version-
  qualified ARN.
controls:
  - CTL.LAMBDA.ENV.VISIBLE.VERSIONS.001
  - CTL.LAMBDA.ENV.SECRETS.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - network_access_lambda
postconditions:
  - iam_credential_theft
implicit_dependencies: []
