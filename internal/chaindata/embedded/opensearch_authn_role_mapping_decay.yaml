id: opensearch_authn_role_mapping_decay
description: >
  OpenSearch domain has multiple FGAC role-mapping
  defects: all_access mapped to broad backend
  role, kibana_user mapped to wildcard backend, or
  role mappings reference deleted IAM identities.
  Each defect alone weakens the data-plane
  authorization boundary; co-occurrence indicates
  role-mapping discipline broke. Threshold of 2
  fires when at least two role-mapping defects
  coexist.
controls:
  - CTL.OPENSEARCH.ROLE.ALLACCESS.BROAD.001
  - CTL.OPENSEARCH.ROLE.KIBANA.WILDCARD.001
  - CTL.OPENSEARCH.ROLE.MAPPING.DANGLING.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - ungoverned_operation
postconditions:
  - shadow_admin_access
implicit_dependencies: []
