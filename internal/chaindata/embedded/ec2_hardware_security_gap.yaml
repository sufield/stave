id: ec2_hardware_security_gap
description: >
  Instance is on a non-Nitro instance type AND either UEFI Secure
  Boot is not enabled or a sensitive workload is on shared
  tenancy. Multiple hardware-level security gaps coexist: the
  larger Xen hypervisor attack surface is paired with either an
  unverified boot chain or the inability to demonstrate dedicated
  hardware for compliance-tagged data. The combination removes the
  layered hardware defenses that the Nitro family + Secure Boot +
  dedicated tenancy stack was designed to provide together.
controls:
  - CTL.EC2.NITRO.001
  - CTL.EC2.SECUREBOOT.001
  - CTL.EC2.TENANCY.SENSITIVE.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - network_access_ec2
postconditions:
  - ec2_code_execution
implicit_dependencies: []
