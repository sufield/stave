id: ecs_to_rds_lateral
description: >
  ECS tasks share a VPC with an RDS instance that accepts
  broad security-group ingress — a compromised task can
  reach the database without additional credential theft or
  network pivoting. The first leg detects that the ECS
  task's security group permits unrestricted egress
  (CTL.VPC.SG.EGRESS.001) — tasks can initiate connections
  to the database subnet. The second leg detects that the
  RDS instance's security group accepts broad ingress on
  the database port (CTL.RDS.SG.BROAD.001) — including
  from the ECS task subnet. Together: task compromise
  yields database access without restriction. Removing
  either leg breaks the chain: restrict ECS task egress to
  required destinations only, OR scope the RDS security
  group to specific application security groups rather than
  broad CIDRs.
controls:
  - CTL.VPC.SG.EGRESS.001
  - CTL.RDS.SG.BROAD.001
scope_field: properties.network.vpc_id
escalation_threshold: 2
compound_severity: high
preconditions:
  - network_access_vpc
postconditions:
  - data_access
implicit_dependencies: []
