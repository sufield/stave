id: eventbridge_apidest_failure_path
description: >
  EventBridge API destination has multiple operational defects:
  HTTP endpoint (not HTTPS), ghost connection (deleted), or no
  rate limit. HTTP + ghost-connection means every event leaks
  partial request metadata to a destination that can't actually
  authenticate; HTTP + no-rate-limit means a fan-out spike
  blasts the partner over plaintext; ghost-connection +
  no-rate-limit means failed retries against a missing
  authentication path compound. Threshold of 2 fires when at
  least two destination defects coexist.
controls:
  - CTL.EVENTBRIDGE.APIDEST.HTTP.001
  - CTL.EVENTBRIDGE.APIDEST.GHOST.CONNECTION.001
  - CTL.EVENTBRIDGE.APIDEST.RATELIMIT.UNSET.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - ungoverned_operation
postconditions:
  - data_in_transit_exposure
implicit_dependencies:
  - source: observation.network_topology
    fallback: fail_closed
    diagnostic: >-
      Network topology resolution not available. Routing-dependent controls cannot verify reachability between segments.
  - source: observation.ghost_reference_resolver
    fallback: fail_open
    diagnostic: >-
      Ghost reference resolution depends on snapshot completeness for the referenced resource type. If the referenced service was not collected, ghost references cannot be detected.
