id: vpc_vpn_compromise
description: >
  Site-to-site VPN has weak cipher suites AND either tunnel logging
  is disabled or the peer authenticates with a pre-shared key. The
  tunnel is cryptographically fragile AND either its failure events
  are invisible or the shared secret is the only access gate — a
  compromised PSK plus weak cipher plus no logging is end-to-end
  silent passive decryption with no forensic trail.
controls:
  - CTL.VPC.VPN.ENCRYPTION.WEAK.001
  - CTL.VPC.VPN.LOGGING.001
  - CTL.VPC.VPN.PSK.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - network_access_vpc
postconditions:
  - data_in_transit_exposure
implicit_dependencies: []
