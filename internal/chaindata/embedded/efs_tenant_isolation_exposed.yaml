id: efs_tenant_isolation_exposed
description: >
  EFS tenant isolation is broken (no POSIX enforcement, no
  root-directory isolation, or no deny-root policy) AND at least
  one consumer of the file system is internet-reachable. The base
  efs_tenant_isolation_failure chain fires when the EFS access
  controls are insufficient; this chain escalates severity when
  the compromisable file system is reachable from the internet
  via an exposed ECS service. An attacker who compromises the
  exposed service can read and write every tenant's data on the
  shared file system. Threshold of 2 fires when the internet
  exposure compounds with any single EFS isolation failure.
controls:
  - CTL.EFS.AP.POSIX.001
  - CTL.EFS.AP.ROOT.001
  - CTL.EFS.POLICY.DENYROOT.001
  - CTL.ECS.NETWORK.PUBLIC.001
escalation_threshold: 2
compound_severity: critical
preconditions:
  - internet_access
postconditions:
  - s3_data_access
implicit_dependencies: []
