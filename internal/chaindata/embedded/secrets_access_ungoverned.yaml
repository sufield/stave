id: secrets_access_ungoverned
description: >
  Cross-account without org boundary plus either
  read/write overlap or policy sprawl. Credential access
  crosses the organizational boundary AND either the same
  principal can read and modify the credential, or the
  policy is unauditable. Multiple access-control governance
  failures compound: the access surface is broader than
  the org, less segregated than required, and harder to
  audit. Threshold of 2 fires when cross-account exposure
  compounds with another access-policy failure.
controls:
  - CTL.SECRETS.POLICY.CROSSACCOUNT.001
  - CTL.SECRETS.POLICY.READWRITE.001
  - CTL.SECRETS.POLICY.SPRAWL.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - resource_policy_escalation
postconditions:
  - ungoverned_operation
implicit_dependencies: []
