id: agent_credential_exfiltration
description: >
  Agent role can read production secrets AND has a network path to
  exfiltrate them AND sessions are not attributed. The three legs
  correspond to the three failures in the Hugging Face breach: the
  agent could access credentials (secrets read), the sandbox had
  internet access (egress path), and the compromised sessions were
  hard to attribute in CloudTrail (no session naming). An attacker
  with prompt control reads the secret, sends it to an external
  endpoint, and the session is indistinguishable from legitimate
  agent activity. Remove any leg — scope secret access, restrict
  egress, or require session naming — and the chain breaks.
controls:
  - CTL.IAM.AGENT.CHAIN.SENSITIVE.001
  - CTL.VPC.SG.EGRESS.001
  - CTL.IAM.SESSION.NAME.001
escalation_threshold: 2
compound_severity: critical
incident_precedent:
  name: Hugging Face Autonomous Agent Breach (2026)
  impact: Model stole credentials and used them outside sandbox without attribution
  reference: CSA/SANS/RSAC Post-Mortem v0.8, July 27 2026
preconditions:
  - automation_hijack
postconditions:
  - iam_credential_theft
implicit_dependencies: []
