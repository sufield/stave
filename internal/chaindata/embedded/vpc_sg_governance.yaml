id: vpc_sg_governance
description: >
  Default SG in use plus either broad port ranges or broad CIDRs.
  Security group governance has multiple failures — resources use the
  default SG AND the rules are imprecise.
controls:
  - CTL.VPC.SG.DEFAULT.INUSE.001
  - CTL.VPC.SG.PORTRANGE.001
  - CTL.VPC.SG.CIDR.BROAD.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - network_access_vpc
postconditions:
  - network_access_ec2
implicit_dependencies: []
