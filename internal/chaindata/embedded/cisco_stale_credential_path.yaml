id: cisco_stale_credential_path
description: >
  The Cisco WebEx incident shape (2024): stale IAM credentials
  AND stale password AND inactive account — a forgotten identity
  still carrying access. The attacker used credentials from a
  decommissioned service account that was never disabled, then
  pivoted to internal systems. This chain maps the compound state
  where multiple staleness indicators on the same account confirm
  it is genuinely abandoned — not just a low-activity user. When
  all three fire on the same principal, the account is forgotten
  and its credentials are a standing invitation. Any one is a
  hygiene issue; all three together are the named pattern from the
  Cisco disclosure.
  Linked incidents: Cisco WebEx (2024, decommissioned service
  account), Toyota (2022, contractor credentials active 5+ years),
  Wiz "abandoned identities" threat class (2025, stale credentials
  as initial access vector in 23% of cloud incidents).
controls:
  - CTL.IAM.CRED.UNUSED.001
  - CTL.IAM.PASSWORD.ROTATION.001
  - CTL.IAM.ACCOUNT.INACTIVE.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - credential_access
postconditions:
  - iam_credential_theft
implicit_dependencies:
  - source: observation.iam_credential_last_used
    fallback: fail_closed
    diagnostic: >
      IAM credential last-used date not captured. Cannot determine
      whether credentials are stale.
