id: eks_pod_to_datastore_lateral
description: >
  EKS pods share a VPC with a database that accepts broad
  security-group ingress — a compromised pod can reach the
  database without additional credential theft or network
  pivoting. The first leg detects that the EKS node group's
  security group permits unrestricted egress
  (CTL.VPC.SG.EGRESS.001) — pods can initiate connections
  to the database subnet. The second leg detects that the
  database's security group accepts broad ingress on the
  database port (CTL.RDS.SG.BROAD.001 or
  CTL.DOCUMENTDB.SG.OPEN.001) — including from the EKS
  node subnet. Together: pod compromise yields database
  access without restriction. This is the EKS breach
  lateral-movement pattern: pod → unrestricted egress →
  broadly-permissive database SG → database access.
  Removing either leg breaks the chain: restrict EKS node
  egress to required destinations only, OR scope the
  database SG to specific application security groups
  rather than broad CIDRs.
controls:
  - CTL.VPC.SG.EGRESS.001
  - CTL.RDS.SG.BROAD.001
scope_field: properties.network.vpc_id
escalation_threshold: 2
compound_severity: high
preconditions:
  - network_access_vpc
postconditions:
  - data_access
implicit_dependencies: []
