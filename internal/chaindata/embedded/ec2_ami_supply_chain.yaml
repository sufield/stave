id: ec2_ami_supply_chain
description: >
  Instance is running an untrusted AMI AND either the AMI is
  deprecated/aged (CTL.EC2.AMI.CURRENCY.001) or the AMI is
  unencrypted. The compute supply chain has compounding
  failures: the image came from outside the trusted publisher
  set AND either it is a stale image with accumulated
  unpatched CVEs or its underlying snapshots travel without
  encryption. Each individual finding is a supply-chain
  concern; the combination is supply-chain compromise plus
  no defense-in-depth.
controls:
  - CTL.EC2.AMI.UNTRUSTED.001
  - CTL.EC2.AMI.CURRENCY.001
  - CTL.EC2.AMI.ENCRYPTION.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - network_access_vpc
postconditions:
  - ec2_code_execution
implicit_dependencies: []
