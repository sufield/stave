id: r53_private_zone_risk
description: >
  Any private hosted zone misconfiguration: external-account VPC
  association, no VPC association at all, or public IPs in private
  zone records. Each independently compromises the private zone's
  intended isolation. Cross-account association exposes internal
  DNS to an external account; no association makes the zone
  unresolvable while still exposing records to anyone with
  route53:ListResourceRecordSets permission; public IP records
  in a private zone route internal-looking traffic out to the
  internet. Threshold of 1 reflects that any one of these
  conditions independently violates the private zone's purpose
  — internal DNS resolution restricted to authorized VPCs.
controls:
  - CTL.ROUTE53.CROSSACCOUNT.PRIVATEASSOC.001
  - CTL.ROUTE53.PRIVATE.NOVPC.001
  - CTL.ROUTE53.PRIVATE.PUBLICRECORDS.001
escalation_threshold: 1
compound_severity: high
preconditions:
  - network_access_vpc
postconditions:
  - data_access
implicit_dependencies: []
