dsl_version: ctrl.v1
id: CTL.GCS.UNIFORM.001
name: Uniform Bucket-Level Access Must Be Enabled
description: >
  GCS buckets must use uniform bucket-level access. When disabled, both
  IAM policies and object ACLs control access, creating a dual-path
  exposure risk that is harder to audit and more prone to misconfiguration.
domain: exposure
severity: high
compliance:
  cis_gcp_v1.3.0: "5.2"
  ccm_v4: ["DSP-07", "DSP-17"]
scope_tags:
  - gcp
  - gcs
type: unsafe_state
params:
  attack_stage: initial_access
remediation:
  description: >
    Bucket does not use uniform bucket-level access. Object ACLs may
    grant access that contradicts the bucket IAM policy.
  action: >
    Enable uniform bucket-level access. Run:
    gcloud storage buckets update gs://BUCKET --uniform-bucket-level-access
  example: |
    {
      "storage": {
        "kind": "bucket",
        "controls": {
          "uniform_access_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.controls.uniform_access_enabled
      op: eq
      value: false
