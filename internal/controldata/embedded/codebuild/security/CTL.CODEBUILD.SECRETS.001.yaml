dsl_version: ctrl.v1
id: CTL.CODEBUILD.SECRETS.001
name: CodeBuild Projects Must Not Store Secrets in Plaintext Environment Variables
description: >
  CodeBuild project environment variables of type PLAINTEXT must not
  contain secrets (API keys, tokens, passwords). Plaintext env vars
  are visible in the AWS console, CLI output, and CloudTrail logs.
  Use SECRETS_MANAGER or PARAMETER_STORE environment variable types
  instead.
domain: exposure
severity: critical
compliance:
  nist_800_53_r5: "IA-5(7)"
  soc2: "CC6.1"
  pci_dss_v4.0: "3.4.1"
  ccm_v4: ["IAM-16", "DSP-17"]
scope_tags:
  - aws
  - codebuild
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - logging
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_codebuild_project
params:
  attack_stage: credential_access
remediation:
  description: >
    CodeBuild project contains plaintext secrets in environment
    variables.
  action: >
    Change environment variable types from PLAINTEXT to
    SECRETS_MANAGER or PARAMETER_STORE. Store secrets in AWS
    Secrets Manager or SSM Parameter Store and reference them
    by name in the environment variable configuration.
  example: |
    {
      "compute": {
        "kind": "codebuild_project",
        "secrets": { "has_plaintext_credentials": false }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: codebuild_project
    - field: properties.compute.secrets.has_plaintext_credentials
      op: eq
      value: true
