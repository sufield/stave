dsl_version: ctrl.v1
id: CTL.GRAFANA.AUTH.001
name: Managed Grafana Workspace Not Using SSO Authentication
description: >
  An Amazon Managed Grafana workspace is not configured with IAM
  Identity Center (SSO) or SAML authentication. Without centralized
  authentication, workspace access is managed separately from the
  organization's identity provider, creating credential sprawl and
  bypassing MFA and session policies enforced by the IdP.
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "IA-2"
  soc2: "CC6.1"
  ccm_v4: ["IAM-02"]
  scs_c02: "10.11"
scope_tags:
  - aws
  - grafana
taxonomy:
  - compliance-mapping
subtractive_category:
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_grafana_workspace]
params:
  attack_stage: initial_access
remediation:
  description: >
    Managed Grafana workspace does not use SSO or SAML for
    authentication.
  action: >
    Configure IAM Identity Center or SAML authentication for
    the workspace: aws grafana update-workspace-authentication
    --workspace-id <id> --authentication-providers AWS_SSO.
  example: |
    {
      "observability": {
        "kind": "grafana_workspace",
        "grafana": {
          "sso_configured": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.observability.kind
      op: eq
      value: grafana_workspace
    - field: properties.observability.grafana.sso_configured
      op: eq
      value: false
tests:
  - name: "Workspace without SSO fails"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:grafana:us-east-1:111122223333:/workspaces/g-abc123"
      asset_type: aws_grafana_workspace
      vendor: aws
      properties:
        observability:
          kind: grafana_workspace
          grafana:
            sso_configured: false
  - name: "Workspace with SSO passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:grafana:us-east-1:111122223333:/workspaces/g-def456"
      asset_type: aws_grafana_workspace
      vendor: aws
      properties:
        observability:
          kind: grafana_workspace
          grafana:
            sso_configured: true
