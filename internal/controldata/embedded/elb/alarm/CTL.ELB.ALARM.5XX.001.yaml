dsl_version: ctrl.v1
id: CTL.ELB.ALARM.5XX.001
name: No CloudWatch Alarm for ELB 5xx Errors
description: >
  No CloudWatch alarm monitors HTTPCode_ELB_5XX_Count
  (ALB) or HTTPCode_ELB_5XX (CLB). 5xx errors come from
  the load balancer itself — not the backend
  application — and indicate perimeter failures: 503
  (no healthy targets), 502 (target closed connection),
  or 500 (internal LB error). Without an alarm, users
  experience errors while operations team has no
  signal. Skipped for NLB which doesn't generate HTTP
  error codes.
domain: detection
severity: critical
compliance:
  cis_aws_v3.0: "2.5"
  soc2: "CC7.2, CC7.3, A1.2"
  nist_800_53_r5: "SI-4, IR-4, IR-5"
  pci_dss_v4.0: "10.6, 12.10"
  fedramp_moderate: "SI-4"
  iso_27001_2022: "A.5.30, A.8.16"
  ccm_v4: ["LOG-08", "BCR-08"]
scope_tags:
  - aws
  - elb
taxonomy:
  - compliance-mapping
  - monitoring
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
  blast_radius:
    type: detection
    scope: account
    multiplier: 5.0
remediation:
  description: >
    No alarm fires when the load balancer returns 5xx.
    Perimeter failures are invisible.
  action: >
    Create a CloudWatch alarm on AWS/ApplicationELB
    HTTPCode_ELB_5XX_Count (or AWS/ELB HTTPCode_ELB_5XX
    for CLB) dimensioned by the load balancer name.
    Threshold > 0 over a 1-minute period; route to
    on-call. Pair with a target-side
    HTTPCode_Target_5XX_Count alarm so the team can
    distinguish ELB-side failures (no healthy targets)
    from application-side failures (target returned
    5xx).
  example: |
    {
      "network": {
        "kind": "load_balancer",
        "elb": {
          "elb_type": "alb",
          "alarm_5xx": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: load_balancer
    - field: properties.network.elb.elb_type
      op: ne
      value: nlb
    - field: properties.network.elb.alarm_5xx
      op: eq
      value: false
defect: >
  Load balancer has no CloudWatch alarm for 5xx errors.
infection: >
  ELB 5xx errors are generated by the load balancer
  itself — not the backend application. A 503 means
  the ALB has no healthy targets to route to. A 502
  means the target closed the connection before
  responding. A 500 means an internal ALB error.
  These are infrastructure failures, not application
  bugs. Without an alarm: users experience 503 errors.
  The application team doesn't know because their
  application metrics show no errors (the request
  never reached the application). The infrastructure
  team doesn't know because nobody monitors ELB
  metrics. The outage continues until someone manually
  checks the ALB or a user reports the error.
failure: >
  Undetected perimeter failure. The load balancer
  returns server errors to users without notification.
tests:
  - name: ALB without 5xx alarm fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:elasticloadbalancing:us-east-1:111122223333:loadbalancer/app/prod-alb/abc"
      asset_type: aws_load_balancer
      vendor: aws
      properties:
        network:
          kind: load_balancer
          elb:
            elb_type: "alb"
            alarm_5xx: false
  - name: ALB with 5xx alarm passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:elasticloadbalancing:us-east-1:111122223333:loadbalancer/app/prod-alb/abc"
      asset_type: aws_load_balancer
      vendor: aws
      properties:
        network:
          kind: load_balancer
          elb:
            elb_type: "alb"
            alarm_5xx: true
  - name: NLB without 5xx alarm does not fire (NLB has no HTTP errors)
    verdict: PASS
    asset:
      asset_id: "arn:aws:elasticloadbalancing:us-east-1:111122223333:loadbalancer/net/prod-nlb/abc"
      asset_type: aws_load_balancer
      vendor: aws
      properties:
        network:
          kind: load_balancer
          elb:
            elb_type: "nlb"
            alarm_5xx: false
