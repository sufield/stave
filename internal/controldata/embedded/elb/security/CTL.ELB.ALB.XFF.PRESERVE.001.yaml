dsl_version: ctrl.v1
id: CTL.ELB.ALB.XFF.PRESERVE.001
name: Internet-Facing ALB Preserves Client-Controlled X-Forwarded-For
description: >
  An internet-facing ALB sets routing.http.xff_header_processing.mode to
  "preserve", so the client's X-Forwarded-For header is passed through unchanged.
  If any downstream service trusts XFF for access control, rate limiting, geo
  decisions, or audit logging, a client can spoof its source IP by setting the
  header. "append" (ALB adds the real client IP) or "remove" closes this.

  The ALB is treated as internet-facing not only when its scheme is
  internet-facing, but also when it is internal yet sits behind an
  internet-facing NLB (NLB->ALB passthrough) — the collector resolves that and
  sets internet_facing, so the FN trap is caught.

  Inspired by Doyensec CloudsecTidbits No. 5 — Navigating Lax Load Balancers.
  Validated against doyensec/ELBaph.
domain: network
severity: medium
compliance:
  nist_800_53_r5: "SC-7"
  soc2: "CC6.1"
  pci_dss_v4.0: "1.3.1"
scope_tags:
  - aws
  - elb
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
observation_fields:
  - compute.kind
  - compute.elb.internet_facing
  - compute.elb.xff_header_processing_mode
remediation:
  description: >
    Internet-facing ALB preserves the client X-Forwarded-For header, letting
    clients spoof their source IP to any downstream XFF consumer.
  action: >
    Set routing.http.xff_header_processing.mode to "append" (the ALB appends the
    true client IP) or "remove". Never "preserve" on an internet-facing ALB.
  example: |
    {
      "compute": {
        "kind": "elb",
        "elb": {
          "internet_facing": true,
          "xff_header_processing_mode": "append"
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: elb
    - field: properties.compute.elb.internet_facing
      op: eq
      value: true
    - field: properties.compute.elb.xff_header_processing_mode
      op: eq
      value: preserve
tests:
  - name: internet-facing ALB preserving XFF fires (vulnerable)
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:elasticloadbalancing:us-east-1:111122223333:loadbalancer/app/pub/1"
      asset_type: aws_elb
      vendor: aws
      properties:
        compute:
          kind: elb
          elb:
            internet_facing: true
            xff_header_processing_mode: preserve
  - name: internet-facing ALB appending XFF passes (false-positive trap)
    verdict: PASS
    asset:
      asset_id: "arn:aws:elasticloadbalancing:us-east-1:111122223333:loadbalancer/app/pub/2"
      asset_type: aws_elb
      vendor: aws
      properties:
        compute:
          kind: elb
          elb:
            internet_facing: true
            xff_header_processing_mode: append
  - name: internal ALB behind internet-facing NLB preserving XFF fires (false-negative trap — NLB passthrough)
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:elasticloadbalancing:us-east-1:111122223333:loadbalancer/app/int/3"
      asset_type: aws_elb
      vendor: aws
      properties:
        compute:
          kind: elb
          elb:
            internet_facing: true
            xff_header_processing_mode: preserve
