dsl_version: ctrl.v1
id: CTL.ELB.NLB.ACCESSLOG.001
name: NLB Access Logging Not Enabled
description: >
  Network Load Balancer has access logging
  disabled. Connection-level audit data
  (source IP, port, accepted/rejected,
  bytes, timestamps) is not written to S3.
  Investigation of NLB-fronted incidents
  has no audit trail to query.
domain: audit
severity: high
compliance:
  cis_aws_v3.0: "1.16"
  soc2: "CC7.1, CC7.2"
  nist_800_53_r5: "AU-2, AU-9, AU-12"
  pci_dss_v4.0: "10.2, 10.5"
  fedramp_moderate: "AU-2, AU-9, AU-12"
  hipaa: "164.312(b)"
  iso_27001_2022: "A.5.16, A.8.15"
  ccm_v4: ["LOG-08"]
scope_tags:
  - aws
  - elb
taxonomy:
  - compliance-mapping
  - logging
subtractive_category:
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_elb]
params:
  attack_stage: detection_evasion
  blast_radius:
    type: detection
    scope: account
    multiplier: 3.0
remediation:
  description: >
    NLB access logging disabled. No
    connection-level audit trail.
  action: >
    Enable access logging on the NLB and
    point it at an S3 bucket: aws elbv2
    modify-load-balancer-attributes with
    Attributes including
    access_logs.s3.enabled=true and
    access_logs.s3.bucket=<bucket>. Pair
    with the existing
    CTL.ELB.ACCESSLOG.PERMISSION control
    that catches misconfigured bucket
    policies.
  example: |
    {
      "compute": {
        "kind": "elb",
        "elb": {
          "lb_type": "network",
          "nlb_access_log_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: elb
    - field: properties.compute.elb.lb_type
      op: eq
      value: network
    - field: properties.compute.elb.nlb_access_log_enabled
      op: eq
      value: false
defect: >
  Network Load Balancer has access logging
  disabled.
infection: >
  NLB access logs record per-connection
  metadata: source IP, source port,
  destination, accepted vs rejected
  status, bytes transferred, timestamps.
  Without logs, investigating NLB-
  fronted incidents (DDoS, scanning,
  abuse) has no per-connection audit
  trail. Many compliance frameworks
  require connection-level logging for
  network-facing services. Same enable-
  it pattern as ALB access logging
  (CTL.ELB.LOG.001), but NLB logging is
  off by default and frequently overlooked.
failure: >
  No NLB connection audit trail. Per-
  connection metadata not retained.
tests:
  - name: NLB without access log fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:elasticloadbalancing:us-east-1:111122223333:loadbalancer/net/abc/123"
      asset_type: aws_elb
      vendor: aws
      properties:
        compute:
          kind: elb
          elb:
            lb_type: "network"
            nlb_access_log_enabled: false
  - name: NLB with access log passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:elasticloadbalancing:us-east-1:111122223333:loadbalancer/net/abc/123"
      asset_type: aws_elb
      vendor: aws
      properties:
        compute:
          kind: elb
          elb:
            lb_type: "network"
            nlb_access_log_enabled: true
