dsl_version: ctrl.v1
id: CTL.COGNITO.GHOST.PRESIGNUP.001
name: Cognito Pre-Sign-Up Lambda Trigger References Deleted Function
description: >
  Cognito user pool has a pre-sign-up Lambda
  trigger configured but the Lambda function
  has been deleted. Every user signup attempt
  fails because the trigger Lambda invocation
  errors. The pool appears configured; the
  signup flow is broken.
domain: exposure
severity: critical
archetype: ghost-reference
compliance:
  soc2: "CC6.1, CC8.1, A1.2"
  nist_800_53_r5: "CM-2, CM-3, IA-2"
  pci_dss_v4.0: "8.3"
  fedramp_moderate: "CM-3, IA-2"
  iso_27001_2022: "A.5.16, A.8.5"
  ccm_v4: ["IAM-09"]
scope_tags:
  - aws
  - cognito
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
  blast_radius:
    type: governance
    scope: account
    multiplier: 4.0
remediation:
  description: >
    Pre-sign-up Lambda has been deleted; signup
    flow fails for every new user.
  action: >
    Either redeploy the Lambda with the same
    ARN (preserving the trigger configuration)
    or remove the pre-sign-up trigger from the
    user pool: aws cognito-idp update-user-pool
    --user-pool-id <id> with lambda_config
    omitting pre_sign_up. After fix, validate
    by completing a signup in a sandbox.
  example: |
    {
      "identity": {
        "kind": "cognito_user_pool",
        "cognito": {
          "user_pool_id": "us-east-1_abcdefg",
          "trigger_type": "pre_sign_up",
          "trigger_lambda_arn": "arn:aws:lambda:us-east-1:111122223333:function:cog-presignup",
          "trigger_lambda_exists": true,
          "has_ghost_trigger": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: cognito_user_pool
    - field: properties.identity.cognito.trigger_type
      op: eq
      value: pre_sign_up
    - field: properties.identity.cognito.has_ghost_trigger
      op: eq
      value: true
defect: >
  Cognito pre-sign-up trigger references a
  deleted Lambda function.
infection: >
  The pre-sign-up trigger fires before Cognito
  finalizes a new user registration. Common
  uses: domain-restriction logic, captcha
  validation, custom username normalization,
  invitation-code verification. When the
  trigger Lambda is deleted, every signup
  call invokes a function that doesn't exist;
  Cognito returns an error to the client.
  Self-service signup stops working entirely.
  Admin-create-user may still work depending
  on configuration, but any consumer-facing
  app flow that depends on signup is broken.
  The user pool console shows the trigger as
  configured (the Lambda ARN is still present);
  only the actual invocation surfaces the
  failure.
failure: >
  Signup flow broken. Every new user signup
  fails because the configured trigger Lambda
  has been deleted.
tests:
  - name: ghost pre-sign-up trigger fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cognito-idp:us-east-1:111122223333:userpool/us-east-1_abcdefg"
      asset_type: aws_cognito_user_pool
      vendor: aws
      properties:
        identity:
          kind: cognito_user_pool
          cognito:
            user_pool_id: "us-east-1_abcdefg"
            trigger_type: "pre_sign_up"
            trigger_lambda_arn: "arn:aws:lambda:us-east-1:111122223333:function:deleted-fn"
            trigger_lambda_exists: false
            has_ghost_trigger: true
  - name: live pre-sign-up trigger passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:cognito-idp:us-east-1:111122223333:userpool/us-east-1_abcdefg"
      asset_type: aws_cognito_user_pool
      vendor: aws
      properties:
        identity:
          kind: cognito_user_pool
          cognito:
            user_pool_id: "us-east-1_abcdefg"
            trigger_type: "pre_sign_up"
            trigger_lambda_arn: "arn:aws:lambda:us-east-1:111122223333:function:cog-presignup"
            trigger_lambda_exists: true
            has_ghost_trigger: false
