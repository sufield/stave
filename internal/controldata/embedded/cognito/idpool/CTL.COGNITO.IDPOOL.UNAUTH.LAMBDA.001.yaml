dsl_version: ctrl.v1
id: CTL.COGNITO.IDPOOL.UNAUTH.LAMBDA.001
name: Cognito Identity Pool Unauthenticated Role Has Lambda Invoke Access
description: >
  Cognito identity pool allows unauthenticated
  access AND the unauthenticated role grants
  lambda:InvokeFunction on one or more Lambda
  functions. Anonymous clients can invoke
  Lambdas — turning the function into a
  publicly callable endpoint regardless of the
  function's intended access pattern.
domain: exposure
severity: critical
compliance:
  cis_aws_v3.0: "1.16"
  soc2: "CC6.1, CC6.3"
  nist_800_53_r5: "AC-3, AC-6, IA-2"
  pci_dss_v4.0: "7.1, 7.2"
  fedramp_moderate: "AC-3, AC-6"
  hipaa: "164.308(a)(4)(ii)(B)"
  iso_27001_2022: "A.5.15, A.5.18"
  ccm_v4: ["IAM-09"]
scope_tags:
  - aws
  - cognito
taxonomy:
  - compliance-mapping
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_cognito_identity_pool
params:
  attack_stage: privilege_escalation
  blast_radius:
    type: data
    scope: account
    multiplier: 4.5
remediation:
  description: >
    Unauthenticated role can invoke Lambda
    functions. Functions are publicly callable
    via Cognito anonymous credentials.
  action: >
    Remove lambda:InvokeFunction from the
    unauthenticated role. If anonymous
    invocation is genuinely required, front
    the Lambda with API Gateway or Lambda
    function URL with their own throttling
    and authentication, rather than expose
    direct Invoke through Cognito.
  example: |
    {
      "identity": {
        "kind": "cognito_identity_pool",
        "access": { "allow_unauthenticated": true },
        "cognito": {
          "unauth_role_lambda_functions": [],
          "unauth_role_has_lambda": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: cognito_identity_pool
    - field: properties.identity.access.allow_unauthenticated
      op: present
    - field: properties.identity.access.allow_unauthenticated
      op: eq
      value: true
    - field: properties.identity.cognito.unauth_role_has_lambda
      op: present
    - field: properties.identity.cognito.unauth_role_has_lambda
      op: eq
      value: true
defect: >
  Cognito unauthenticated role has
  lambda:InvokeFunction.
infection: >
  Lambda invocation through Cognito anonymous
  credentials makes the targeted function a
  publicly invokable endpoint. The function
  may have been written assuming it's only
  called by a trusted internal pipeline,
  trusting its inputs and skipping
  authorization checks. Through the
  unauthenticated role, anyone on the internet
  invokes the function with attacker-controlled
  parameters. If the function takes a SQL
  query or a shell command parameter (common
  in admin tools that were never meant to be
  externally invoked), the attacker has remote
  code execution. If the function does
  anything sensitive — read user data, send
  email, charge cards, modify state — it now
  does that on behalf of any internet caller.
failure: >
  Anonymous Lambda invocation. Functions
  accessible to the unauthenticated role are
  publicly callable through Cognito.
tests:
  - name: unauth role with Lambda invoke fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cognito-identity:us-east-1:111122223333:identitypool/us-east-1:abc-id-pool"
      asset_type: aws_cognito_identity_pool
      vendor: aws
      properties:
        identity:
          kind: cognito_identity_pool
          access:
            allow_unauthenticated: true
          cognito:
            unauth_role_lambda_functions:
              - "arn:aws:lambda:us-east-1:111122223333:function:internal-sql-runner"
            unauth_role_has_lambda: true
  - name: unauth role without Lambda passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:cognito-identity:us-east-1:111122223333:identitypool/us-east-1:abc-id-pool"
      asset_type: aws_cognito_identity_pool
      vendor: aws
      properties:
        identity:
          kind: cognito_identity_pool
          access:
            allow_unauthenticated: true
          cognito:
            unauth_role_lambda_functions: []
            unauth_role_has_lambda: false
