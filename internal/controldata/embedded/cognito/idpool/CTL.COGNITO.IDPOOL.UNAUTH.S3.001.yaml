dsl_version: ctrl.v1
id: CTL.COGNITO.IDPOOL.UNAUTH.S3.001
name: Cognito Identity Pool Unauthenticated Role Has S3 Access
description: >
  Cognito identity pool allows unauthenticated
  access AND the unauthenticated role grants
  S3 actions (GetObject, PutObject, ListBucket,
  or wildcard s3 actions) on one or more
  buckets. Anonymous clients can read from
  or write to S3 by exchanging Cognito
  identities for AWS credentials.
domain: exposure
severity: critical
compliance:
  cis_aws_v3.0: "1.16"
  soc2: "CC6.1, CC6.3, CC6.6"
  nist_800_53_r5: "AC-3, AC-4, AC-6, IA-2"
  pci_dss_v4.0: "7.1, 7.2"
  fedramp_moderate: "AC-3, AC-4, AC-6"
  hipaa: "164.308(a)(4)(ii)(B), 164.312(a)(1)"
  iso_27001_2022: "A.5.15, A.8.2"
  ccm_v4: ["IAM-09", "DSP-04"]
scope_tags:
  - aws
  - cognito
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_cognito_identity_pool
params:
  attack_stage: collection
  blast_radius:
    type: data
    scope: account
    multiplier: 5.0
remediation:
  description: >
    Unauthenticated role has S3 access. Bucket
    contents are publicly addressable through
    anonymous Cognito credentials.
  action: >
    Remove S3 actions from the unauthenticated
    role unless the bucket is intentionally
    public (and even then, prefer making the
    bucket itself public via bucket policy
    rather than threading anonymous access
    through Cognito). Audit CloudTrail for
    s3 API calls performed under the
    unauthenticated role's session — those
    are anonymous reads or writes that may
    have already exfiltrated or modified data.
  example: |
    {
      "identity": {
        "kind": "cognito_identity_pool",
        "access": { "allow_unauthenticated": true },
        "cognito": {
          "unauth_role_s3_actions": [],
          "unauth_role_s3_buckets": [],
          "unauth_role_has_s3": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: cognito_identity_pool
    - field: properties.identity.access.allow_unauthenticated
      op: eq
      value: true
    - field: properties.identity.cognito.unauth_role_has_s3
      op: eq
      value: true
defect: >
  Cognito unauthenticated role has S3 access.
infection: >
  S3 access on the unauthenticated role makes
  the targeted buckets publicly addressable
  through Cognito. An anonymous client calls
  GetCredentialsForIdentity, gets credentials
  with s3:GetObject on the bucket, calls
  s3:GetObject, and reads the data. The bucket
  itself does not need to be public — anonymous
  access flows through Cognito's session
  credentials, not through bucket policy.
  Common scenarios: image hosts, public file
  drops, mobile-app asset buckets where the
  developer added s3:GetObject for read access
  without realizing that means GLOBAL read.
  PutObject on the unauthenticated role lets
  anyone upload — anonymous file write,
  storage abuse, malware staging.
failure: >
  Anonymous S3 access. Buckets accessible to
  the unauthenticated role are publicly
  addressable through Cognito.
tests:
  - name: unauth role with S3 fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cognito-identity:us-east-1:111122223333:identitypool/us-east-1:abc-id-pool"
      asset_type: aws_cognito_identity_pool
      vendor: aws
      properties:
        identity:
          kind: cognito_identity_pool
          access:
            allow_unauthenticated: true
          cognito:
            unauth_role_s3_actions: ["s3:GetObject", "s3:PutObject"]
            unauth_role_s3_buckets: ["arn:aws:s3:::user-uploads"]
            unauth_role_has_s3: true
  - name: unauth role without S3 passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:cognito-identity:us-east-1:111122223333:identitypool/us-east-1:abc-id-pool"
      asset_type: aws_cognito_identity_pool
      vendor: aws
      properties:
        identity:
          kind: cognito_identity_pool
          access:
            allow_unauthenticated: true
          cognito:
            unauth_role_s3_actions: []
            unauth_role_s3_buckets: []
            unauth_role_has_s3: false
