dsl_version: ctrl.v1
id: CTL.COGNITO.IDPOOL.AUTHROLE.PASSROLE.001
name: Cognito Identity Pool Authenticated Role Has iam:PassRole
description: >
  Cognito identity pool's authenticated role
  policy contains iam:PassRole. Any signed-in
  user can launch services (EC2, Lambda, ECS)
  with a different role attached — escalating
  to whatever permissions the passed role
  carries. Cognito turns into a privilege-
  escalation primitive.
domain: identity
severity: critical
compliance:
  cis_aws_v3.0: "1.16"
  soc2: "CC6.1, CC6.3"
  nist_800_53_r5: "AC-3, AC-6"
  pci_dss_v4.0: "7.1, 7.2"
  fedramp_moderate: "AC-3, AC-6"
  hipaa: "164.308(a)(4)(ii)(B)"
  iso_27001_2022: "A.5.15, A.5.18"
  ccm_v4: ["IAM-09"]
scope_tags:
  - aws
  - cognito
taxonomy:
  - compute-hardening
  - credential-lifecycle
  - network-perimeter
subtractive_category:
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_cognito_identity_pool
params:
  attack_stage: privilege_escalation
  blast_radius:
    type: data
    scope: account
    multiplier: 5.0
remediation:
  description: >
    Authenticated role can pass other roles to
    AWS services. Privilege escalation in one
    API call.
  action: >
    Remove iam:PassRole from the authenticated
    role. If the application genuinely needs
    PassRole (rare for end-user-facing apps —
    PassRole is typically a deployment-time
    permission), scope the action to a single
    specific role ARN with iam:PassedToService
    conditions matching the legitimate
    consumer service. The existing
    CTL.IAM.POLICY.PASSROLE.001 catches
    PassRole broadly; this control flags the
    case where Cognito's authenticated role is
    one of the holders.
  example: |
    {
      "identity": {
        "kind": "cognito_identity_pool",
        "cognito": {
          "auth_role_has_passrole": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: cognito_identity_pool
    - field: properties.identity.cognito.auth_role_has_passrole
      op: present
    - field: properties.identity.cognito.auth_role_has_passrole
      op: eq
      value: true
defect: >
  Cognito authenticated role has iam:PassRole.
infection: >
  iam:PassRole on the Cognito authenticated
  role is one API call away from arbitrary
  privilege escalation. A signed-in user
  obtains AWS credentials, calls
  ec2:RunInstances with --iam-instance-profile
  pointing at an admin role (which the user
  can pass because PassRole is permitted),
  and SSHes into the new instance — they're
  now running on AWS infrastructure with the
  admin role's credentials, completely
  outside the Cognito session lifecycle. The
  same pattern works with lambda:CreateFunction,
  ecs:RegisterTaskDefinition, and many other
  services that accept a role parameter. The
  Cognito session is the entry point; the
  IAM role attached to the new resource is
  the escalated identity.
failure: >
  One-call privilege escalation. Any signed-in
  user can launch services with privileged
  roles attached.
tests:
  - name: authenticated role with PassRole fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cognito-identity:us-east-1:111122223333:identitypool/us-east-1:abc"
      asset_type: aws_cognito_identity_pool
      vendor: aws
      properties:
        identity:
          kind: cognito_identity_pool
          cognito:
            auth_role_has_passrole: true
  - name: authenticated role without PassRole passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:cognito-identity:us-east-1:111122223333:identitypool/us-east-1:abc"
      asset_type: aws_cognito_identity_pool
      vendor: aws
      properties:
        identity:
          kind: cognito_identity_pool
          cognito:
            auth_role_has_passrole: false
