dsl_version: ctrl.v1
id: CTL.COGNITO.IDPOOL.UNAUTH.UNUSED.001
name: Cognito Identity Pool Allows Unauthenticated Access But No Application Uses It
description: >
  Cognito identity pool allows unauthenticated
  identities but no application references this
  identity pool. The default-on configuration
  exposes anonymous AWS credentials with no
  matching legitimate use. Either clean up the
  pool or disable unauthenticated access.
domain: governance
severity: high
archetype: dormant-resource
compliance:
  soc2: "CC6.1, CC8.1"
  nist_800_53_r5: "AC-3, CM-2, CM-8, SA-22"
  pci_dss_v4.0: "7.1"
  fedramp_moderate: "AC-3, CM-8"
  iso_27001_2022: "A.5.9, A.5.18"
  ccm_v4: ["IAM-09", "DSP-04"]
scope_tags:
  - aws
  - cognito
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
  blast_radius:
    type: governance
    scope: account
    multiplier: 2.0
remediation:
  description: >
    Identity pool allows anonymous access but
    nothing uses it.
  action: >
    Either delete the identity pool entirely
    (no application uses it — it's pure
    governance debt) or disable unauthenticated
    access if the pool will be wired into an
    application later. Default-on
    unauthenticated access is exposure without
    purpose.
  example: |
    {
      "identity": {
        "kind": "cognito_identity_pool",
        "access": { "allow_unauthenticated": true },
        "cognito": {
          "identity_pool_referenced_by_app": true,
          "is_unauth_unused": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: cognito_identity_pool
    - field: properties.identity.access.allow_unauthenticated
      op: eq
      value: true
    - field: properties.identity.cognito.is_unauth_unused
      op: eq
      value: true
defect: >
  Cognito identity pool allows unauthenticated
  access but no application references it.
infection: >
  Identity pools are commonly created via
  console wizards or Terraform modules with
  defaults including allow_unauthenticated:
  true. If the pool was never wired into an
  application — or if the application that
  used it was decommissioned — the identity
  pool sits in the account exposing anonymous
  credentials backed by whatever IAM role
  was attached. The role may be tightly
  scoped or may be wide; either way, the
  exposure has no offsetting business
  purpose. Default-on misconfiguration
  combined with no use makes this pure
  governance debt that may have already been
  exploited without anyone noticing — there's
  no application monitoring the pool, so
  anonymous credential issuance produces no
  signal.
failure: >
  Default-on anonymous access without purpose.
  Identity pool exposes credentials nobody
  asked for.
tests:
  - name: unused unauth pool fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cognito-identity:us-east-1:111122223333:identitypool/us-east-1:orphan-pool"
      asset_type: aws_cognito_identity_pool
      vendor: aws
      properties:
        identity:
          kind: cognito_identity_pool
          access:
            allow_unauthenticated: true
          cognito:
            identity_pool_referenced_by_app: false
            is_unauth_unused: true
  - name: referenced unauth pool does not fire on this control
    verdict: PASS
    asset:
      asset_id: "arn:aws:cognito-identity:us-east-1:111122223333:identitypool/us-east-1:active-pool"
      asset_type: aws_cognito_identity_pool
      vendor: aws
      properties:
        identity:
          kind: cognito_identity_pool
          access:
            allow_unauthenticated: true
          cognito:
            identity_pool_referenced_by_app: true
            is_unauth_unused: false
