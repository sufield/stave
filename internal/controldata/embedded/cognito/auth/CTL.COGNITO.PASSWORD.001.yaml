dsl_version: ctrl.v1
id: CTL.COGNITO.PASSWORD.001
name: Cognito User Pools Must Enforce a Strong Password Policy
description: >
  Cognito user pools must enforce a minimum password length of 12
  characters and require at least three of four character classes
  (uppercase, lowercase, numbers, special characters). Cognito password
  policy is independent of the IAM account password policy — a strong
  IAM policy does not protect application users authenticated through
  Cognito. A user pool with weak defaults allows end users to set
  trivially guessable passwords. Temporary password validity must not
  exceed 7 days — temporary passwords issued during account creation or
  password reset that remain valid for extended periods are a credential
  exposure risk if the invitation email is intercepted. For user pools
  handling PHI (patient portals, healthcare applications), weak
  application passwords are a direct credential compromise risk that
  IAM password controls cannot address.

  This control reads a pre-computed `is_weak` rollup that the collector
  derives from the underlying minimum-length and char-class requirements
  (uppercase, lowercase, numbers, symbols). The rollup is intentional:
  one finding fires on weak-password configurations of any shape rather
  than four near-identical findings per char-class. The cost is triage
  granularity — the finding does not name *which* specific requirement
  is missing. Operators inspect the observation's `password_policy`
  object directly to identify the failing field. Temporary password
  validity is covered by a sibling control (`TEMPPASSWORD.001`) reading
  `temp_password_valid_days_exceeded`.
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "IA-5(1)"
  fedramp_moderate: "IA-5(1)"
  pci_dss_v4.0: "8.3.6"
  soc2: "CC6.1"
  hipaa: "164.312(d)"
  ccm_v4: ["IAM-14", "IAM-15", "IAM-16"]
scope_tags:
  - aws
  - cognito
taxonomy:
  - compliance-mapping
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_cognito_user_pool
params:
  attack_stage: initial_access
remediation:
  description: >
    Cognito user pool password policy is weak. Minimum length is below
    12 characters, required character classes are insufficient, or
    temporary password validity exceeds 7 days.
  action: >
    Update the user pool password policy via the Cognito console or
    UpdateUserPool API. Set minimum password length to 12 or higher.
    Require at least three of: uppercase, lowercase, numbers, special
    characters. Set temporary password validity to 7 days or less.
    Consider enabling Cognito advanced security features for compromised
    credential detection as a complementary control.
  example: |
    {
      "identity": {
        "kind": "user_pool",
        "password_policy": {
          "is_weak": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: user_pool
    - field: properties.identity.password_policy.is_weak
      op: eq
      value: true
