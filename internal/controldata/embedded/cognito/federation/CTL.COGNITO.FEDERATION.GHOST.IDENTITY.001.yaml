dsl_version: ctrl.v1
id: CTL.COGNITO.FEDERATION.GHOST.IDENTITY.001
name: Cognito Pool Enables Ghost Identity Injection With Elevated Attributes
description: >
  Three conditions hold together on this Cognito User Pool: an external IdP is
  registered, there is no PreSignUp Lambda gate before user creation, and a
  security-sensitive attribute is mapped from that IdP's claims. An attacker
  controlling the IdP federates and a ghost identity is auto-created with the
  sensitive attribute (e.g. custom:role=admin) set from an attacker-controlled
  claim — no trigger prevented it, and the identity persists.

  Each condition alone is a finding (CTL.COGNITO.FEDERATION.PRESIGNUP.MISSING.001
  for the missing gate, CTL.COGNITO.FEDERATION.ATTRMAP.SENSITIVE.001 for the
  mapping); this compound proves all hold for a specific IdP. The finding names
  the IdP that creates the risk — on a pool with one safe and one risky IdP, it
  fires for the risky one only. Computed by examples/cognito-ghost-identity/
  (Soufflé + Z3, which agree).

  Inspired by Doyensec CloudsecTidbits No. 4 — The Danger of Multi-SSO AWS
  Cognito User Pools.
domain: identity
severity: critical
scope: compound
corpus_reference: MITRE:T1078
compliance:
  owasp_nhi: "NHI5"
  soc2: "CC6.1"
  nist_800_53_r5: "AC-2, AC-6"
  pci_dss_v4.0: "7.2.1"
  ccm_v4: ["IAM-09", "IAM-16"]
scope_tags:
  - aws
  - cognito
taxonomy:
  - compliance-mapping
  - trust-decay
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_cognito_user_pool
params:
  attack_stage: privilege_escalation
observation_fields:
  - identity.kind
  - identity.cognito.ghost_identity_chain_present
  - identity.cognito.ghost_identity_idp
  - identity.cognito.ghost_identity_path
remediation:
  description: >
    External IdP + no PreSignUp gate + sensitive attribute mapping = ghost
    identity auto-created with elevated attributes from attacker-controlled claims.
  action: >
    Break any one link: add a PreSignUp Lambda gate, remove the sensitive
    attribute from the IdP AttributeMapping, or remove the untrusted external IdP.
    Adding the PreSignUp gate addresses the broadest set of federation risks.
  example: |
    {
      "identity": {
        "kind": "cognito_user_pool",
        "cognito": {
          "ghost_identity_chain_present": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: cognito_user_pool
    - field: properties.identity.cognito.ghost_identity_chain_present
      op: present
    - field: properties.identity.cognito.ghost_identity_chain_present
      op: eq
      value: true
tests:
  - name: external IdPs + no PreSignUp + sensitive mapping fires (vulnerable)
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cognito-idp:us-east-1:111122223333:userpool/us-east-1_ABC123"
      asset_type: aws_cognito_user_pool
      vendor: aws
      properties:
        identity:
          kind: cognito_user_pool
          cognito:
            ghost_identity_chain_present: true
            ghost_identity_idp: "PartnerIdP"
            ghost_identity_path: "External IdP 'PartnerIdP' → no PreSignUp gate → ghost identity created with custom:role set by attacker-controlled IdP claim"
  - name: sensitive mapping but PreSignUp gate present passes (false-positive trap — gate breaks the chain)
    verdict: PASS
    asset:
      asset_id: "arn:aws:cognito-idp:us-east-1:111122223333:userpool/us-east-1_DEF456"
      asset_type: aws_cognito_user_pool
      vendor: aws
      properties:
        identity:
          kind: cognito_user_pool
          cognito:
            ghost_identity_chain_present: false
  - name: only one of two IdPs has the sensitive mapping fires for that IdP (false-negative trap — names the risky IdP)
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cognito-idp:us-east-1:111122223333:userpool/us-east-1_GHI789"
      asset_type: aws_cognito_user_pool
      vendor: aws
      properties:
        identity:
          kind: cognito_user_pool
          cognito:
            ghost_identity_chain_present: true
            ghost_identity_idp: "PartnerIdP"
            ghost_identity_path: "External IdP 'PartnerIdP' → no PreSignUp gate → ghost identity created with custom:accessLevel set by attacker-controlled IdP claim"
