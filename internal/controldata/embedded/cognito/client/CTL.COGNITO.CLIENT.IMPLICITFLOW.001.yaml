dsl_version: ctrl.v1
id: CTL.COGNITO.CLIENT.IMPLICITFLOW.001
name: Cognito App Client Allows OAuth Implicit Flow
description: >
  Cognito app client lists `implicit` in its
  allowed OAuth flows. The implicit flow
  returns access tokens in URL fragments —
  observable in browser history, server logs,
  and referer headers. OAuth 2.1 explicitly
  removes implicit; modern clients should use
  authorization-code with PKCE.
domain: exposure
severity: high
compliance:
  cis_aws_v3.0: "1.16"
  soc2: "CC6.1"
  nist_800_53_r5: "IA-2, SC-8"
  pci_dss_v4.0: "4.2, 8.3"
  fedramp_moderate: "IA-2, SC-8"
  iso_27001_2022: "A.5.16, A.8.5"
  ccm_v4: ["IAM-09"]
scope_tags:
  - aws
  - cognito
taxonomy:
  - compliance-mapping
  - credential-lifecycle
subtractive_category:
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_cognito_app_client
params:
  attack_stage: credential_access
  blast_radius:
    type: data
    scope: account
    multiplier: 3.0
remediation:
  description: >
    Implicit flow is enabled. Tokens transit in
    URL fragments.
  action: >
    Remove `implicit` from allowed_o_auth_flows
    on the app client. Migrate any client still
    using implicit to authorization-code with
    PKCE — the modern equivalent for browser
    apps that retains the same UX without the
    URL-fragment token leak. SPAs that need
    public-client behavior get auth code via
    the BFF (backend-for-frontend) pattern or
    direct PKCE in the browser.
  example: |
    {
      "identity": {
        "kind": "cognito_app_client",
        "cognito": {
          "allowed_oauth_flows": ["code"],
          "allows_implicit_flow": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: cognito_app_client
    - field: properties.identity.cognito.allows_implicit_flow
      op: present
    - field: properties.identity.cognito.allows_implicit_flow
      op: eq
      value: true
defect: >
  Cognito app client allows the OAuth implicit
  flow.
infection: >
  Implicit flow returns the access token in the
  URL fragment of the redirect URI:
  https://app.example.com/callback#access_token=...
  URL fragments aren't sent to servers in HTTP
  requests, but they are visible in browser
  history, observable in browser extensions,
  preserved in some logs (referer headers from
  subsequent navigation can leak the parent
  URL), and exposable through any XSS that can
  read window.location. Authorization-code with
  PKCE keeps the token out of the URL entirely
  — the auth code is exchanged for a token
  server-side or via PKCE-backed direct
  exchange. OAuth 2.1 deprecates implicit
  entirely; AWS keeps it for backward
  compatibility but lists it as discouraged.
failure: >
  Tokens transit in URL fragments. Implicit
  flow exposes access tokens to any party that
  can read browser state.
tests:
  - name: implicit flow enabled fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cognito-idp:us-east-1:111122223333:userpool/us-east-1_abc/client/abc123"
      asset_type: aws_cognito_user_pool_client
      vendor: aws
      properties:
        identity:
          kind: cognito_app_client
          cognito:
            allowed_oauth_flows: ["code", "implicit"]
            allows_implicit_flow: true
  - name: code-only flow passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:cognito-idp:us-east-1:111122223333:userpool/us-east-1_abc/client/abc123"
      asset_type: aws_cognito_user_pool_client
      vendor: aws
      properties:
        identity:
          kind: cognito_app_client
          cognito:
            allowed_oauth_flows: ["code"]
            allows_implicit_flow: false
