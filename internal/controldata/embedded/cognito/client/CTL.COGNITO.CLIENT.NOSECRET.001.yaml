dsl_version: ctrl.v1
id: CTL.COGNITO.CLIENT.NOSECRET.001
name: Cognito App Client Has No Client Secret
description: >
  Cognito app client is configured without a
  client secret while serving as the
  authentication credential for a server-side
  application. Public clients (browser SPAs,
  mobile apps) intentionally have no secret;
  server-side clients should always have one.
  A confidential application without a secret
  has no client-level authentication —
  anybody can pretend to be the application
  to Cognito.
domain: identity
severity: high
compliance:
  cis_aws_v3.0: "1.16"
  soc2: "CC6.1, CC6.3"
  nist_800_53_r5: "IA-2, IA-3, IA-5"
  pci_dss_v4.0: "8.3"
  fedramp_moderate: "IA-2, IA-3"
  iso_27001_2022: "A.5.16, A.8.5"
  ccm_v4: ["IAM-09"]
scope_tags:
  - aws
  - cognito
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - impersonation
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_cognito_app_client
params:
  attack_stage: credential_access
  blast_radius:
    type: data
    scope: account
    multiplier: 3.0
remediation:
  description: >
    Confidential client has no secret; the
    application has no proof of identity to
    Cognito.
  action: >
    Generate a secret on the app client (aws
    cognito-idp create-user-pool-client with
    --generate-secret) and rotate the
    application's stored credential through
    Secrets Manager. Only intentionally public
    clients (SPA, mobile) should remain
    secret-less; document why each public
    client is public so future audits don't
    re-flag.
  example: |
    {
      "identity": {
        "kind": "cognito_app_client",
        "cognito": {
          "is_public_client": false,
          "has_client_secret": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: cognito_app_client
    - field: properties.identity.cognito.is_public_client
      op: eq
      value: false
    - field: properties.identity.cognito.has_client_secret
      op: eq
      value: false
defect: >
  Confidential Cognito app client has no client
  secret.
infection: >
  Cognito app clients with a secret authenticate
  to the token endpoint using HTTP Basic auth
  with client_id:client_secret. Without a
  secret, the client identifies itself with
  client_id alone — and client_id is not a
  secret (it appears in URLs, logs, callback
  redirects). Any party that obtains the
  client_id can impersonate the application,
  exchange auth codes for tokens, and act in
  the application's name. The intentional case
  for no-secret is a public client (mobile or
  SPA) where storing a secret is impossible
  anyway. The dangerous case is a server-side
  client that someone left without a secret —
  the application has no client-level identity
  proof, only the OAuth flow's user-level
  proof.
failure: >
  Application has no client-level authentication
  to Cognito. Any caller with the client_id
  can impersonate the application.
tests:
  - name: confidential client without secret fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cognito-idp:us-east-1:111122223333:userpool/us-east-1_abc/client/abc123"
      asset_type: aws_cognito_user_pool_client
      vendor: aws
      properties:
        identity:
          kind: cognito_app_client
          cognito:
            is_public_client: false
            has_client_secret: false
  - name: confidential client with secret passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:cognito-idp:us-east-1:111122223333:userpool/us-east-1_abc/client/abc123"
      asset_type: aws_cognito_user_pool_client
      vendor: aws
      properties:
        identity:
          kind: cognito_app_client
          cognito:
            is_public_client: false
            has_client_secret: true
  - name: public client without secret passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:cognito-idp:us-east-1:111122223333:userpool/us-east-1_abc/client/spa-app"
      asset_type: aws_cognito_user_pool_client
      vendor: aws
      properties:
        identity:
          kind: cognito_app_client
          cognito:
            is_public_client: true
            has_client_secret: false
