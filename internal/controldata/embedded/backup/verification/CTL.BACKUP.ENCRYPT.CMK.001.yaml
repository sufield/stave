dsl_version: ctrl.v1
id: CTL.BACKUP.ENCRYPT.CMK.001
name: Backup Vault Must Use a Customer-Managed KMS Key
description: >
  Backup vaults with encryption must use a customer-managed KMS
  key, not the AWS-managed default. The AWS-managed key has a
  key policy the customer cannot edit and cannot be revoked or
  rotated on the customer's schedule. Backup data often contains
  full database snapshots, file system contents, and application
  state — customer-managed keys provide per-tenant key-policy
  control and per-incident key-revocation capability.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: SC-12
  soc2: CC6.7
  pci_dss_v4.0: 3.6.1
  hipaa: "164.312(a)(2)(iv)"
  ccm_v4:
  - CEK-04
  - CEK-08
scope_tags:
- aws
- backup
taxonomy:
  - compliance-mapping
  - encryption-at-rest
  - key-management
subtractive_category:
  - S07
  - S08
  - S10
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_backup_vault]
params:
  attack_stage: exfiltration
remediation:
  description: >
    Backup vault is encrypted with the AWS-managed default key.
    Per-tenant key-policy and revocation controls are unavailable.
  action: >
    Create a new backup vault with a customer-managed KMS key.
    AWS Backup does not allow changing the encryption key on an
    existing vault. Migrate recovery points to the new vault.
  example: |
    {
      "backup": {
        "kind": "resource",
        "has_backup": true,
        "encrypted": true,
        "kms_key_managed_by": "customer"
      }
    }
unsafe_predicate:
  all:
  - field: properties.backup.kind
    op: eq
    value: resource
  - field: properties.backup.has_backup
    op: eq
    value: true
  - field: properties.backup.encrypted
    op: eq
    value: true
  - field: properties.backup.kms_key_managed_by
    op: eq
    value: aws
tests:
  - name: aws-managed key fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:backup:us-east-1:111122223333:backup-vault:prod-vault"
      asset_type: aws_backup_vault
      vendor: aws
      properties:
        backup:
          kind: resource
          has_backup: true
          encrypted: true
          kms_key_managed_by: aws
  - name: customer-managed key passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:backup:us-east-1:111122223333:backup-vault:prod-vault"
      asset_type: aws_backup_vault
      vendor: aws
      properties:
        backup:
          kind: resource
          has_backup: true
          encrypted: true
          kms_key_managed_by: customer
  - name: unencrypted vault not in scope
    verdict: PASS
    asset:
      asset_id: "arn:aws:backup:us-east-1:111122223333:backup-vault:dev-vault"
      asset_type: aws_backup_vault
      vendor: aws
      properties:
        backup:
          kind: resource
          has_backup: true
          encrypted: false
