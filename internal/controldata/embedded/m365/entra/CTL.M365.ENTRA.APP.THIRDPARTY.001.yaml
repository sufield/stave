dsl_version: ctrl.v1
id: CTL.M365.ENTRA.APP.THIRDPARTY.001
name: Third-Party Integrated Apps Allowed
description: >
  Third-party integrated apps allowed without approval.
domain: identity
severity: medium
compliance:
  cis_m365_v4: "6.2"
  nist_800_53_r5: "CM-6"
  soc2: "CC6.1"
scope_tags: [m365]
taxonomy:
  - compliance-mapping
  - network-perimeter
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Third-Party Integrated Apps Allowed — finding detected.
  action: Remediate per control description.
  example: |
    {"m365": {"identity": {"kind": "entra_config", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.m365.identity.kind
      op: eq
      value: entra_config
    - field: properties.m365.identity.app.thirdparty_apps_blocked
      op: eq
      value: false
