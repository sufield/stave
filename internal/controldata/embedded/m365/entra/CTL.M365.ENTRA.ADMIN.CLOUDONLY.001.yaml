dsl_version: ctrl.v1
id: CTL.M365.ENTRA.ADMIN.CLOUDONLY.001
name: Admin Accounts Not Cloud-Only
description: >
  Admin accounts synced from on-prem AD. On-prem compromise
  (Kerberoasting, DCSync) grants cloud admin access.
domain: identity
severity: high
compliance:
  cis_m365_v4: "1.3"
  nist_800_53_r5: "AC-2"
  soc2: "CC6.1"
scope_tags: [m365]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Admin Accounts Not Cloud-Only — finding detected.
  action: Remediate per control description.
  example: |
    {"m365": {"identity": {"kind": "entra_config", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.m365.identity.kind
      op: eq
      value: entra_config
    - field: properties.m365.identity.admin_cloud_only
      op: eq
      value: false
