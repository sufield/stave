dsl_version: ctrl.v1
id: CTL.M365.EXCHANGE.AUDIT.001
name: Mailbox Auditing Not Fully Enabled
description: >
  Org-wide or per-user auditing disabled, or audit bypass active.
  Email access, deletion, and send-as not recorded.
domain: detection
severity: high
compliance:
  cis_m365_v4: "10.3"
  nist_800_53_r5: "AU-2"
  hipaa: "164.312(b)"
  pci_dss_v4: "10.2"
  soc2: "CC7.2"
scope_tags: [m365]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: defense_evasion
remediation:
  description: Mailbox Auditing Not Fully Enabled — finding detected.
  action: Remediate per control description.
  example: |
    {"m365": {"exchange": {"kind": "exchange_org", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.m365.exchange.kind
      op: eq
      value: exchange_org
    - field: properties.m365.exchange.org_mailbox_auditing
      op: eq
      value: false
