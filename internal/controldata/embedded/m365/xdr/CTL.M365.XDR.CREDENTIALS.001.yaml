dsl_version: ctrl.v1
id: CTL.M365.XDR.CREDENTIALS.001
name: Privileged User Exposed Credentials Detected
description: >
  Defender XDR detected exposed credentials for privileged users.
  Active threat requiring immediate credential rotation.
domain: detection
severity: critical
compliance:
  nist_800_53_r5: "IA-5"
  soc2: "CC6.1"
scope_tags: [m365]
taxonomy:
  - compliance-mapping
  - compute-hardening
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Privileged User Exposed Credentials Detected — finding detected.
  action: Remediate per control description.
  example: |
    {"m365": {"security": {"kind": "defender_xdr", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.m365.security.kind
      op: eq
      value: defender_xdr
    - field: properties.m365.security.xdr.privileged_user_exposed_creds
      op: eq
      value: true
