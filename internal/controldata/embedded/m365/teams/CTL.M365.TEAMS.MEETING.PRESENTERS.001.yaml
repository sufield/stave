dsl_version: ctrl.v1
id: CTL.M365.TEAMS.MEETING.PRESENTERS.001
name: Meeting Presenters Not Restricted
description: >
  Any participant can present by default. Unrestricted screen
  sharing and content control.
domain: exposure
severity: medium
compliance:
  cis_m365_v4: "12.4"
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
scope_tags: [m365]
taxonomy:
  - compliance-mapping
  - network-perimeter
subtractive_category:
  - S05
type: unsafe_state
classification: state_assertion
applicable_asset_types: [m365_resource]
params:
  attack_stage: initial_access
remediation:
  description: Meeting Presenters Not Restricted — finding detected.
  action: Remediate per control description.
  example: |
    {"m365": {"collaboration": {"kind": "teams_config", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.m365.collaboration.kind
      op: eq
      value: teams_config
    - field: properties.m365.collaboration.teams.presenters_restricted
      op: eq
      value: false
