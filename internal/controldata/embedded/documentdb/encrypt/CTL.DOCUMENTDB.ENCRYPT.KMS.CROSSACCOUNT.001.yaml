dsl_version: ctrl.v1
id: CTL.DOCUMENTDB.ENCRYPT.KMS.CROSSACCOUNT.001
name: DocumentDB Cluster KMS Key Must Not Permit Cross-Org Decrypt
description: >
  The KMS key encrypting a DocumentDB cluster (and its snapshots)
  must not have a key policy that grants `kms:Decrypt` to
  principals outside the organization's allow-list. A snapshot copy
  encrypted with such a key is decryptable wherever those
  principals reach — turning a cross-account snapshot share into
  a clear-text exfil path even when storage encryption is on and
  snapshot sharing is restricted, because the recipient still
  legitimately holds Decrypt against the source key.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: AC-3
  soc2: CC6.6
  pci_dss_v4.0: 3.6.1
  ccm_v4:
  - CEK-04
  - IAM-09
scope_tags:
- aws
- documentdb
type: unsafe_state
classification: state_assertion
params:
  attack_stage: exfiltration
remediation:
  description: >
    Cluster's KMS key policy permits `kms:Decrypt` to a principal
    outside the organization's allow-list. Snapshot recipients can
    decrypt the data wherever the policy admits them.
  action: >
    Tighten the key policy: scope `kms:Decrypt` to specific
    `aws:PrincipalOrgID` or explicit account ARNs that legitimately
    need to read the encrypted data, and add `aws:ViaService =
    rds.<region>.amazonaws.com` so the grant only applies through
    the DocDB integration path.
unsafe_predicate:
  all:
  - field: properties.database.kind
    op: eq
    value: documentdb_cluster
  - field: properties.database.encryption.kms_key_crossaccount_decrypt
    op: eq
    value: true
