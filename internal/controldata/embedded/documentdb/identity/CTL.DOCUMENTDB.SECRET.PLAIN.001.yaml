dsl_version: ctrl.v1
id: CTL.DOCUMENTDB.SECRET.PLAIN.001
name: DocumentDB Cluster Must Use Secrets Manager for Master Password
description: >
  DocumentDB cluster master password is not managed by AWS
  Secrets Manager. Plaintext passwords in Terraform state,
  CloudFormation parameters, or environment variables are
  exposed to anyone with access to the deployment pipeline.
  Secrets Manager provides automatic rotation and audit
  logging for database credentials.
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "IA-5"
  soc2: "CC6.1"
  pci_dss_v4.0: "8.3"
  ccm_v4: ["IAM-02"]
scope_tags:
  - aws
  - documentdb
taxonomy:
  - compliance-mapping
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_documentdb_cluster]
params:
  attack_stage: credential_access
remediation:
  description: >
    DocumentDB cluster master password is not managed by
    Secrets Manager.
  action: >
    Enable Secrets Manager integration for the DocumentDB
    cluster master password. Use manage_master_user_password
    in Terraform or the ManageMasterUserPassword API parameter.
  example: |
    {
      "database": {
        "kind": "documentdb_cluster",
        "credentials": {
          "uses_secrets_manager": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.database.kind
      op: eq
      value: documentdb_cluster
    - field: properties.database.credentials.uses_secrets_manager
      op: ne
      value: true
tests:
  - name: plaintext password fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:rds:us-east-1:111122223333:cluster:my-docdb"
      asset_type: aws_documentdb_cluster
      vendor: aws
      properties:
        database:
          kind: documentdb_cluster
          credentials:
            uses_secrets_manager: false
  - name: secrets manager managed passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:rds:us-east-1:111122223333:cluster:my-docdb"
      asset_type: aws_documentdb_cluster
      vendor: aws
      properties:
        database:
          kind: documentdb_cluster
          credentials:
            uses_secrets_manager: true
