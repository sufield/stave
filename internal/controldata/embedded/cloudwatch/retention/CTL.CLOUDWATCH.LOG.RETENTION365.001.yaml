dsl_version: ctrl.v1
id: CTL.CLOUDWATCH.LOG.RETENTION365.001
name: CloudWatch Log Retention Must Be At Least 365 Days
description: >
  CloudWatch log groups for cardholder data environment audit logs must
  retain logs for at least 365 days. PCI-DSS v4.0 requires 12 months
  of audit trail with at least 3 months immediately available.
domain: exposure
severity: high
compliance:
  pci_dss_v4.0: "10.7"
  nist_800_53_r5: "AU-11"
  fedramp_moderate: "AU-11"
  gdpr: "Art.30"
  ccm_v4: ["DSP-16", "LOG-03"]
scope_tags:
  - aws
  - cloudwatch
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
remediation:
  description: >
    CloudWatch log group retention is less than 365 days. Audit logs
    may be deleted before the PCI-required retention period.
  action: >
    Set retention to at least 365 days:
    aws logs put-retention-policy --log-group-name <name>
    --retention-in-days 365
  example: |
    {
      "log_group": {
        "kind": "log_group",
        "has_retention_policy": true,
        "retention_days": 365
      }
    }
unsafe_predicate:
  all:
    - field: properties.log_group.kind
      op: eq
      value: log_group
    - field: properties.log_group.retention_days
      op: lt
      value: 365
