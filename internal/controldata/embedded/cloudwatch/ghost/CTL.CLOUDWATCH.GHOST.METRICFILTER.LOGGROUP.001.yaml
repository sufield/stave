dsl_version: ctrl.v1
id: CTL.CLOUDWATCH.GHOST.METRICFILTER.LOGGROUP.001
name: CloudWatch Metric Filter References Deleted Log Group
description: >
  CloudWatch metric filter is associated with a log
  group that has been deleted. The metric filter exists
  in the console — pattern, namespace, and metric name
  are all configured — but the log group it parses no
  longer exists. The filter evaluates nothing, the
  metric publishes no data points, and every alarm
  based on the metric goes to INSUFFICIENT_DATA. One
  deleted log group can break N metric filters, and
  through them N alarms — the highest multiplier ghost
  reference in the catalog.
domain: exposure
severity: critical
archetype: ghost-reference
compliance:
  cis_aws_v3.0: "3.4, 4.1"
  soc2: "CC7.1, CC7.2, CC8.1"
  nist_800_53_r5: "AU-6, CM-2, CM-3, SI-4"
  pci_dss_v4.0: "10.5, 10.6"
  fedramp_moderate: "SI-4"
  hipaa: "164.312(b)"
  iso_27001_2022: "A.8.15, A.8.16"
  ccm_v4: ["LOG-08", "LOG-12"]
scope_tags:
  - aws
  - cloudwatch
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
  blast_radius:
    type: detection
    scope: account
    multiplier: 5.0
remediation:
  description: >
    Metric filter parses a deleted log group. Every
    downstream alarm is non-functional.
  action: >
    Either recreate the log group with the same name
    and recreate the metric filter on it, or repoint
    the metric filter at an existing log group, or
    delete the orphan filter if the monitoring is no
    longer needed. After fix, verify by triggering an
    event matching the filter pattern and confirming
    the metric publishes a data point. Audit other
    metric filters on the same deleted log group —
    they share the same fate.
  example: |
    {
      "monitoring": {
        "kind": "metric_filter",
        "cloudwatch": {
          "metric_filter_name": "RootLoginFilter",
          "log_group_name": "/aws/cloudtrail/org",
          "log_group_exists": true,
          "has_ghost_log_group": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.monitoring.kind
      op: eq
      value: metric_filter
    - field: properties.monitoring.cloudwatch.has_ghost_log_group
      op: eq
      value: true
defect: >
  CloudWatch metric filter references a log group that
  has been deleted.
infection: >
  A metric filter evaluates log events as they arrive
  in a log group. When the log group is deleted: no log
  events arrive, the filter pattern matches nothing,
  the associated metric publishes no data points, and
  every alarm based on the metric goes to
  INSUFFICIENT_DATA. The metric filter exists in the
  CloudWatch console — it has a name, a pattern, and a
  metric. An auditor checking "do we have a metric
  filter for root logins?" sees the filter and marks
  it compliant. The filter evaluates nothing because
  its source is gone. Every alarm downstream is
  non-functional. The entire detection chain — filter
  → metric → alarm → SNS → notification — is severed
  at the first link.
failure: >
  Detection chain broken at source. Metric filter
  evaluates nothing — every downstream alarm is
  non-functional because the log group was deleted.
tests:
  - name: metric filter on deleted log group fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:logs:us-east-1:111122223333:metric-filter:RootLoginFilter"
      asset_type: aws_metric_filter
      vendor: aws
      properties:
        monitoring:
          kind: metric_filter
          cloudwatch:
            metric_filter_name: "RootLoginFilter"
            log_group_name: "/aws/cloudtrail/org-deleted"
            log_group_exists: false
            has_ghost_log_group: true
            metric_namespace: "CISBenchmark"
            metric_name: "RootLogin"
  - name: metric filter on active log group passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:logs:us-east-1:111122223333:metric-filter:RootLoginFilter"
      asset_type: aws_metric_filter
      vendor: aws
      properties:
        monitoring:
          kind: metric_filter
          cloudwatch:
            metric_filter_name: "RootLoginFilter"
            log_group_name: "/aws/cloudtrail/org"
            log_group_exists: true
            has_ghost_log_group: false
  - name: filter on deleted CloudTrail log group fires (compound — every CT alarm is dead)
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:logs:us-east-1:111122223333:metric-filter:UnauthorizedAPICalls"
      asset_type: aws_metric_filter
      vendor: aws
      properties:
        monitoring:
          kind: metric_filter
          cloudwatch:
            metric_filter_name: "UnauthorizedAPICalls"
            log_group_name: "/aws/cloudtrail/org"
            log_group_exists: false
            has_ghost_log_group: true
