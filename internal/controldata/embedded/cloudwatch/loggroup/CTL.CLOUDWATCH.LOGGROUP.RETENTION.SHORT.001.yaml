dsl_version: ctrl.v1
id: CTL.CLOUDWATCH.LOGGROUP.RETENTION.SHORT.001
name: CloudWatch Log Group Retention Too Short for Compliance
description: >
  CloudWatch Logs log group has a retention period
  shorter than the applicable compliance requirement.
  Common requirements: HIPAA 6 years (2190 days),
  PCI-DSS 1 year (365 days), SOC2 1 year (365 days).
  When the configured retention is shorter than the
  required minimum, security investigation data and
  audit evidence are deleted before the audit window
  closes. Compliance-profile control: fires when
  retention is set AND retention_compliant is false
  for the active compliance tag set.
domain: governance
severity: high
compliance:
  cis_aws_v3.0: "3.4"
  soc2: "CC7.1, A1.2"
  nist_800_53_r5: "AU-9, AU-11"
  pci_dss_v4.0: "10.5.1, 10.7"
  fedramp_moderate: "AU-11"
  hipaa: "164.312(b), 164.316(b)(2)(i)"
  iso_27001_2022: "A.5.16, A.8.10"
  ccm_v4: ["LOG-12"]
scope_tags:
  - aws
  - cloudwatch
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_cloudwatch_log_group
params:
  attack_stage: impact
  blast_radius:
    type: detection
    scope: account
    multiplier: 2.5
remediation:
  description: >
    Log group retention is shorter than the applicable
    compliance requirement. Audit evidence expires
    before the retention window closes.
  action: >
    Update the log group retention to meet or exceed
    required_retention_days:
    aws logs put-retention-policy --log-group-name <name>
    --retention-in-days <days>. Allowed CW Logs
    retention values are discrete (1, 3, 5, 7, 14, 30,
    60, 90, 120, 150, 180, 365, 400, 545, 731, 1827,
    3653) — pick the smallest value that meets or
    exceeds the required minimum.
  example: |
    {
      "monitoring": {
        "kind": "log_group",
        "cloudwatch": {
          "log_group_name": "/aws/lambda/checkout",
          "retention_days": 365,
          "has_retention_policy": true,
          "retention_compliant": true,
          "required_retention_days": 365,
          "compliance_tags": ["pci"]
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.monitoring.kind
      op: eq
      value: log_group
    - field: properties.monitoring.cloudwatch.has_retention_policy
      op: present
    - field: properties.monitoring.cloudwatch.has_retention_policy
      op: eq
      value: true
    - field: properties.monitoring.cloudwatch.retention_compliant
      op: ne
      value: true
defect: >
  CloudWatch log group retention is shorter than the
  applicable compliance retention requirement.
infection: >
  Retention policies on CloudWatch Logs control how
  long log events persist before automatic deletion.
  CTL.CLOUDWATCH.RETENTION.001 catches the absence of
  any retention setting; this control catches a
  retention period that's shorter than required —
  30 days configured, 365 required for PCI. Real-time
  alarms continue to work because they only need
  recent events. But forensic queries (CloudWatch
  Logs Insights across the past year) only see the
  retention window. An incident discovered in month
  9 with 30-day retention has 8 months of log data
  gone — even though the log group exists and has a
  retention policy that an auditor would mark
  compliant on a casual review.
failure: >
  Audit evidence expires too early. Log retention is
  shorter than the compliance window — forensic
  queries see nothing past the configured horizon.
tests:
  - name: 30-day retention with 365-day requirement fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:logs:us-east-1:111122223333:log-group:/aws/lambda/checkout"
      asset_type: aws_log_group
      vendor: aws
      properties:
        monitoring:
          kind: log_group
          cloudwatch:
            log_group_name: "/aws/lambda/checkout"
            retention_days: 30
            has_retention_policy: true
            retention_compliant: false
            required_retention_days: 365
            compliance_tags: ["pci"]
  - name: 365-day retention meeting requirement passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:logs:us-east-1:111122223333:log-group:/aws/lambda/checkout"
      asset_type: aws_log_group
      vendor: aws
      properties:
        monitoring:
          kind: log_group
          cloudwatch:
            log_group_name: "/aws/lambda/checkout"
            retention_days: 365
            has_retention_policy: true
            retention_compliant: true
            required_retention_days: 365
            compliance_tags: ["pci"]
  - name: log group without retention does not fire (NORETENTION catches that)
    verdict: PASS
    asset:
      asset_id: "arn:aws:logs:us-east-1:111122223333:log-group:/aws/lambda/checkout"
      asset_type: aws_log_group
      vendor: aws
      properties:
        monitoring:
          kind: log_group
          cloudwatch:
            log_group_name: "/aws/lambda/checkout"
            retention_days: 0
            has_retention_policy: false
            retention_compliant: false
            required_retention_days: 365
            compliance_tags: ["pci"]
