dsl_version: ctrl.v1
id: CTL.CLOUDWATCH.MONITOR.TRAIL.001
name: "CloudTrail Configuration Changes Must Be Monitored"
description: >
  A CloudWatch metric filter and alarm must monitor cloudtrail configuration changes.
  Changes to CloudTrail (CreateTrail, UpdateTrail, DeleteTrail, StopLogging) are the first action in covering tracks after compromise.
domain: exposure
severity: high
compliance:
  cis_aws_v3.0: "4.5"
  soc2: "CC7.1"
  ccm_v4: ["LOG-03"]
scope_tags:
  - aws
  - cloudwatch
type: unsafe_state
params:
  attack_stage: detection_evasion
remediation:
  description: >
    No metric filter or alarm is configured to monitor cloudtrail configuration changes.
  action: >
    Create a CloudWatch log metric filter on the CloudTrail log group
    matching the CIS-specified pattern for cloudtrail configuration changes, then create
    an alarm with an SNS notification action.
  example: |
    {
      "monitoring": {
        "kind": "account",
        "metric_filters": {
          "cloudtrail_changes": {
            "exists": true
          }
        },
        "alarms": {
          "cloudtrail_changes": {
            "exists": true,
            "sns_topic_arn": "arn:aws:sns:us-east-1:123456789012:security-alerts"
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.monitoring.kind
      op: eq
      value: account
    - field: properties.monitoring.metric_filters.cloudtrail_changes.exists
      op: eq
      value: false
