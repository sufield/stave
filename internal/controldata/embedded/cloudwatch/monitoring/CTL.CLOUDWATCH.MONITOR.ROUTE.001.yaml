dsl_version: ctrl.v1
id: CTL.CLOUDWATCH.MONITOR.ROUTE.001
name: "Route Table Changes Must Be Monitored"
description: >
  A CloudWatch metric filter and alarm must monitor route table changes.
  Route table modifications can redirect traffic through attacker-controlled paths.
domain: exposure
severity: medium
compliance:
  cis_aws_v3.0: "4.13"
  soc2: "CC7.1"
  ccm_v4: ["LOG-03"]
scope_tags:
  - aws
  - cloudwatch
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
remediation:
  description: >
    No metric filter or alarm is configured to monitor route table changes.
  action: >
    Create a CloudWatch log metric filter on the CloudTrail log group
    matching the CIS-specified pattern for route table changes, then create
    an alarm with an SNS notification action.
  example: |
    {
      "monitoring": {
        "kind": "account",
        "metric_filters": {
          "route_table_changes": {
            "exists": true
          }
        },
        "alarms": {
          "route_table_changes": {
            "exists": true,
            "sns_topic_arn": "arn:aws:sns:us-east-1:123456789012:security-alerts"
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.monitoring.kind
      op: eq
      value: account
    - field: properties.monitoring.metric_filters.route_table_changes.exists
      op: eq
      value: false
