dsl_version: ctrl.v1
id: CTL.CLOUDWATCH.MONITOR.UNAUTH.001
name: "Unauthorized API Calls Must Be Monitored"
description: >
  A CloudWatch metric filter and alarm must monitor unauthorized api calls.
  Unauthorized API calls (AccessDenied, UnauthorizedAccess) indicate credential probing or misconfigured IAM policies.
domain: exposure
severity: critical
compliance:
  owasp_nhi: "NHI8"
  cis_aws_v3.0: "4.1"
  soc2: "CC7.1"
  ccm_v4: ["LOG-03"]
scope_tags:
  - aws
  - cloudwatch
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - logging
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
remediation:
  description: >
    No metric filter or alarm is configured to monitor unauthorized api calls.
  action: >
    Create a CloudWatch log metric filter on the CloudTrail log group
    matching the CIS-specified pattern for unauthorized api calls, then create
    an alarm with an SNS notification action.
  example: |
    {
      "monitoring": {
        "kind": "account",
        "metric_filters": {
          "unauthorized_api_calls": {
            "exists": true
          }
        },
        "alarms": {
          "unauthorized_api_calls": {
            "exists": true,
            "sns_topic_arn": "arn:aws:sns:us-east-1:123456789012:security-alerts"
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.monitoring.kind
      op: eq
      value: account
    - field: properties.monitoring.metric_filters.unauthorized_api_calls.exists
      op: eq
      value: false
