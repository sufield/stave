dsl_version: ctrl.v1
id: CTL.QBUSINESS.APP.ENCRYPT.CMK.001
name: Q Business Application Must Use Customer-Managed KMS Key
description: >
  Q Business application does not use a customer-managed KMS key.
  Applications store indexed enterprise documents, conversation
  history, and retrieval indices. Without a customer-managed key,
  encryptionConfiguration uses AWS-managed encryption with no
  customer-controlled key policy. Index-level encryption inherits
  from the application — no separate index KMS field exists.
domain: encryption
severity: medium
compliance:
  nist_800_53_r5: "SC-28"
  soc2: "CC6.7"
  hipaa: "164.312(a)(2)(iv)"
  ccm_v4: ["CEK-03"]
scope_tags:
  - aws
  - qbusiness
  - ai
taxonomy:
  - encryption-at-rest
  - key-management
subtractive_category:
  - S07
  - S10
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_qbusiness_application
params:
  attack_stage: exfiltration
remediation:
  description: Q Business application uses AWS-managed encryption.
  action: >
    Create a new Q Business application with
    encryptionConfiguration.kmsKeyId set to a customer-managed KMS
    key. Existing applications cannot be re-encrypted.
  example: |
    {
      "ai": {
        "kind": "qbusiness_application",
        "encryption": { "uses_customer_kms": true }
      }
    }
unsafe_predicate:
  all:
    - field: properties.ai.kind
      op: eq
      value: qbusiness_application
    - field: properties.ai.encryption.uses_customer_kms
      op: eq
      value: false
tests:
  - name: aws-managed key fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:qbusiness:us-east-1:111122223333:application/prod-app"
      asset_type: aws_qbusiness_application
      vendor: aws
      properties:
        ai:
          kind: qbusiness_application
          encryption:
            uses_customer_kms: false
  - name: customer-managed key passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:qbusiness:us-east-1:111122223333:application/prod-app"
      asset_type: aws_qbusiness_application
      vendor: aws
      properties:
        ai:
          kind: qbusiness_application
          encryption:
            uses_customer_kms: true
