dsl_version: ctrl.v1
id: CTL.CONFIG.REMEDIATION.001
name: Critical Config Rules Must Have Automatic Remediation
domain: governance
description: >
  Safety mechanism integrity control. Checks that security guardrails
  are actively enforcing, not just present.
severity: high
compliance:
  nist_800_53_r5: "CM-6"
  fedramp_moderate: "CM-6"
  pci_dss_v4.0: "6.3.2"
  soc2: "CC7.1"
  ccm_v4: ["CCC-04", "GRC-05"]
scope_tags:
  - aws
  - config
type: unsafe_state
params:
  base_impact: 8
  attack_stage: resilience
remediation:
  description: >
    Safety mechanism integrity check detected a guardrail in non-enforcing
    or degraded state.
  action: >
    Review the specific guardrail identified in this finding and restore
    it to an enforcing state.
unsafe_predicate:
  all:
    - field: properties.config.critical_rule_without_remediation
      op: eq
      value: true
