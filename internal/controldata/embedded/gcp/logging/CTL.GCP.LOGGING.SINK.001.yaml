dsl_version: ctrl.v1
id: CTL.GCP.LOGGING.SINK.001
name: No Log Sink Configured for Export
description: >
  No log sink configured. Logs exist only in Cloud Logging with no
  export to Storage, BigQuery, or Pub/Sub for SIEM integration.
domain: exposure
severity: medium
compliance:
  cis_gcp_v3: "2.2"
  nist_800_53_r5: "AU-6"
  soc2: "CC7.2"
scope_tags: [gcp]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: No Log Sink Configured — finding detected.
  action: Configure a log sink to export logs.
  example: |
    {"gcp": {"monitoring": {"kind": "log_sink", "sink": {"configured": true}}}}
unsafe_predicate:
  all:
    - field: properties.gcp.monitoring.kind
      op: eq
      value: log_sink
    - field: properties.gcp.monitoring.sink.configured
      op: eq
      value: false
