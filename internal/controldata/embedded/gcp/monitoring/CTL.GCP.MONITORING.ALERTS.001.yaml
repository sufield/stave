dsl_version: ctrl.v1
id: CTL.GCP.MONITORING.ALERTS.001
name: Metric Filters Without Alert Policies
description: >
  Log-based metric filters exist but have no corresponding alert
  policies. Metrics collected but no alerts fire on thresholds.
domain: detection
severity: medium
compliance:
  cis_gcp_v3: "2.6"
  nist_800_53_r5: "AU-6"
  soc2: "CC7.2"
scope_tags: [gcp]
taxonomy:
  - compliance-mapping
subtractive_category:
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types: [gcp_resource]
params:
  attack_stage: detection_evasion
remediation:
  description: Metric Filters Without Alert Policies — finding detected.
  action: Create alert policies for all metric filters.
  example: |
    {"gcp": {"monitoring": {"kind": "alert_policy", "alert": {"enabled": true}}}}
unsafe_predicate:
  all:
    - field: properties.gcp.monitoring.kind
      op: eq
      value: alert_policy
    - field: properties.gcp.monitoring.alert.enabled
      op: ne
      value: true
