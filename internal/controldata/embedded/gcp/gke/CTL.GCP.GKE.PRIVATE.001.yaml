dsl_version: ctrl.v1
id: CTL.GCP.GKE.PRIVATE.001
name: GKE Cluster API Server Publicly Accessible
description: >
  GKE API server accessible from the public internet. No private
  endpoint or master authorized networks configured.
domain: exposure
severity: high
compliance:
  cis_gcp_v3: "7.1"
  nist_800_53_r5: "AC-4"
  pci_dss_v4: "1.3"
  soc2: "CC6.6"
scope_tags: [gcp]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: GKE API Server Publicly Accessible — finding detected.
  action: Enable private endpoint and master authorized networks.
  example: |
    {"gcp": {"compute": {"kind": "gke_cluster", "gke": {"private_endpoint": true}}}}
unsafe_predicate:
  all:
    - field: properties.gcp.compute.kind
      op: eq
      value: gke_cluster
    - field: properties.gcp.compute.gke.private_endpoint
      op: eq
      value: false
