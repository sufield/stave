dsl_version: ctrl.v1
id: CTL.GCP.COMPUTE.FIREWALL.ALL.001
name: Firewall Rule Allows All Traffic from the Internet
description: >
  Firewall rule allows all protocols/ports from 0.0.0.0/0. The
  entire instance is exposed on every port.
domain: exposure
severity: critical
compliance:
  cis_gcp_v3: "3.8"
  nist_800_53_r5: "SC-7"
  hipaa: "164.312(a)(1)"
  pci_dss_v4: "1.3"
  soc2: "CC6.6"
scope_tags: [gcp]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Firewall Allows All Traffic from Internet — finding detected.
  action: Remove the rule and create specific allow rules.
  example: |
    {"gcp": {"compute": {"kind": "firewall_rule", "firewall": {"allows_all_from_internet": false}}}}
unsafe_predicate:
  all:
    - field: properties.gcp.compute.kind
      op: eq
      value: firewall_rule
    - field: properties.gcp.compute.firewall.allows_all_from_internet
      op: eq
      value: true
