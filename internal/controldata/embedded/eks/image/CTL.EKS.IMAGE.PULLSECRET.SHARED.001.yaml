dsl_version: ctrl.v1
id: CTL.EKS.IMAGE.PULLSECRET.SHARED.001
name: EKS imagePullSecret Shared Across Multiple Namespaces
description: >
  EKS cluster has the same imagePullSecret (registry
  credential, typically of type
  `kubernetes.io/dockerconfigjson`) replicated across
  multiple namespaces. Compromise of any pod in any
  of those namespaces yields the registry credential —
  which then permits pulling any image the credential
  is authorized to read, including private images
  belonging to other tenants. The blast radius of a
  pull-credential leak scales linearly with the number
  of namespaces it's replicated to.
domain: identity
severity: medium
compliance:
  soc2: "CC6.1, CC6.3"
  nist_800_53_r5: "AC-3, IA-5"
  pci_dss_v4.0: "8.3"
  fedramp_moderate: "AC-3, IA-5"
  iso_27001_2022: "A.5.17, A.8.5"
  ccm_v4: ["IAM-02", "IAM-04"]
scope_tags:
  - aws
  - eks
taxonomy:
  - compliance-mapping
  - credential-lifecycle
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eks_image_pull_secret
params:
  attack_stage: credential_access
remediation:
  description: >
    EKS imagePullSecret is replicated across multiple
    namespaces.
  action: >
    Per-namespace pull secrets scoped to that namespace's
    image needs. For private ECR specifically, prefer
    IRSA-based pull (configure the workload's
    ServiceAccount with IRSA + an IAM role granting
    ecr:GetAuthorizationToken + repo-scoped pull) instead
    of long-lived dockerconfigjson Secrets entirely. ECR
    now supports IAM-side authentication directly, making
    Secret-based credentials a legacy pattern.
  example: |
    {
      "k8s": {
        "image_pull_secret": {
          "secret_name": "ecr-credentials",
          "namespace_count": 1
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.k8s.image_pull_secret.namespace_count
      op: gt
      value: 1
defect: >
  EKS imagePullSecret with the same name + content
  exists in multiple namespaces.
infection: >
  Each namespace has a copy of the registry credential.
  Pod compromise in any of those namespaces yields the
  credential. The credential's authorization scope is
  whatever the underlying registry account permits —
  typically the org's full private image catalog.
  Cross-tenant image pulls become possible (workloads
  in tenant A can pull tenant B's images), and registry
  audit logs show the cross-tenant access without
  surfacing it as anomalous (the credential is the
  same).
failure: >
  Cross-tenant pull-credential leakage. Pull credential
  reachable from any of N namespaces; credential
  compromise yields scope of all images the credential
  can pull.
tests:
  - name: pull secret in 4 namespaces fires
    verdict: VIOLATION
    asset:
      asset_id: "k8s/secret/ecr-credentials"
      asset_type: aws_eks_image_pull_secret
      vendor: aws
      properties:
        k8s:
          image_pull_secret:
            secret_name: "ecr-credentials"
            namespace_count: 4
  - name: pull secret in single namespace passes
    verdict: PASS
    asset:
      asset_id: "k8s/orders/secret/orders-ecr"
      asset_type: aws_eks_image_pull_secret
      vendor: aws
      properties:
        k8s:
          image_pull_secret:
            secret_name: "orders-ecr"
            namespace_count: 1
