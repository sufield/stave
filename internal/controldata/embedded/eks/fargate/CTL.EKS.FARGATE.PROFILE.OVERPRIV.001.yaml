dsl_version: ctrl.v1
id: CTL.EKS.FARGATE.PROFILE.OVERPRIV.001
name: EKS Fargate Profile Pod Execution Role Is Overprivileged
description: >
  EKS Fargate profile's pod execution role has IAM
  permissions beyond the documented Fargate runtime
  requirements. The pod execution role is what AWS uses
  to provision the Fargate task — pull container images
  from ECR, write logs to CloudWatch, and bootstrap pod
  networking. AWS publishes
  `AmazonEKSFargatePodExecutionRolePolicy` with the
  precise permission set; broader roles grant pods (or
  whoever assumes the role) more than they need.
domain: governance
severity: medium
compliance:
  soc2: "CC6.1, CC6.3"
  nist_800_53_r5: "AC-3, AC-6"
  pci_dss_v4.0: "7.2"
  fedramp_moderate: "AC-3, AC-6"
  iso_27001_2022: "A.5.15, A.8.2"
  ccm_v4: ["IAM-04", "IAM-16"]
scope_tags:
  - aws
  - eks
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eks_fargate_profile
params:
  attack_stage: privilege_escalation
remediation:
  description: >
    EKS Fargate profile pod execution role grants more
    than AWS's documented baseline.
  action: >
    Replace the role's policies with
    AmazonEKSFargatePodExecutionRolePolicy (the AWS-managed
    minimal policy). For pods needing additional AWS
    permissions, grant them via IRSA on the workload's
    ServiceAccount — not via the pod execution role,
    which is shared across every pod the profile selects.
  example: |
    {
      "k8s": {
        "fargate_profile": {
          "execution_role_uses_managed_policy_only": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.k8s.fargate_profile.execution_role_uses_managed_policy_only
      op: eq
      value: false
defect: >
  EKS Fargate profile's pod execution role has
  permissions beyond the AWS-managed
  AmazonEKSFargatePodExecutionRolePolicy baseline.
infection: >
  The pod execution role is shared across every Fargate
  pod the profile selects. Permissions added to it apply
  to all those pods. If the additional permissions are
  workload-specific (e.g., a custom S3 read for one
  application), unrelated workloads inherit them. Pod
  compromise yields the union of every workload's needs.
  Per-workload IAM (IRSA) is the documented pattern for
  pod-specific permissions; broadening the execution role
  defeats the per-workload model.
failure: >
  Cross-workload IAM scope leakage on Fargate. Pod
  execution role accumulates per-application permissions;
  every Fargate pod inherits the union.
tests:
  - name: Fargate execution role overprivileged fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:eks:us-east-1:111122223333:fargateprofile/prod/jobs"
      asset_type: aws_eks_fargate_profile
      vendor: aws
      properties:
        k8s:
          fargate_profile:
            execution_role_uses_managed_policy_only: false
  - name: Fargate execution role on managed-only passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:eks:us-east-1:111122223333:fargateprofile/prod/jobs"
      asset_type: aws_eks_fargate_profile
      vendor: aws
      properties:
        k8s:
          fargate_profile:
            execution_role_uses_managed_policy_only: true
