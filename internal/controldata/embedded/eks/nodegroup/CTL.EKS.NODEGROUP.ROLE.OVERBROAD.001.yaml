dsl_version: ctrl.v1
id: CTL.EKS.NODEGROUP.ROLE.OVERBROAD.001
name: EKS Node Group IAM Role Exceeds Kubelet-Minimum Permissions
description: >
  EKS managed node group's IAM role has permissions beyond
  kubelet-minimum. The kubelet-minimum set is:
  eks:DescribeCluster, ECR pull (ecr:GetAuthorizationToken,
  ecr:BatchGetImage, ecr:GetDownloadUrlForLayer), CloudWatch
  Logs push (logs:CreateLogGroup, logs:CreateLogStream,
  logs:PutLogEvents, logs:DescribeLogStreams), EC2 describe
  (ec2:DescribeInstances, ec2:DescribeRegions), and VPC CNI
  (ec2:CreateNetworkInterface, ec2:AttachNetworkInterface,
  ec2:DeleteNetworkInterface, ec2:DescribeNetworkInterfaces).
  Any action outside this set — s3:*, iam:PassRole,
  sts:AssumeRole on broad targets, secretsmanager:* — means
  every pod that inherits the node profile (via missing IRSA
  or Pod Identity) gains excess permissions. The companion
  control CTL.EKS.POD.NODE.PROFILE.INHERIT.001 detects pods
  using the node profile; this control flags that the profile
  itself is over-permissioned.
domain: identity
severity: medium
compliance:
  soc2: "CC6.1, CC6.3"
  nist_800_53_r5: "AC-6"
  pci_dss_v4.0: "7.2"
  fedramp_moderate: "AC-6"
  iso_27001_2022: "A.5.15, A.8.2"
  ccm_v4: ["IAM-04", "IAM-14"]
scope_tags:
  - aws
  - eks
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - least-privilege
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eks_nodegroup
params:
  attack_stage: privilege_escalation
  blast_radius:
    type: control
    scope: account
    multiplier: 2.0
remediation:
  description: >
    EKS node group IAM role has permissions beyond
    kubelet-minimum.
  action: >
    Scope the node group IAM role to kubelet-minimum
    permissions only: eks:DescribeCluster, ECR pull,
    CloudWatch Logs push, EC2 describe, and VPC CNI
    network-interface operations. Move all workload-specific
    AWS permissions to IRSA or Pod Identity bindings on
    specific service accounts. After migration, remove
    excess policies from the node role and verify pods
    still function with their dedicated IRSA roles.
  example: |
    {
      "k8s": {
        "nodegroup": {
          "role_exceeds_kubelet_minimum": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.k8s.nodegroup.role_exceeds_kubelet_minimum
      op: eq
      value: true
defect: >
  EKS node group IAM role grants actions beyond
  kubelet-minimum: the role includes workload-level
  permissions that should be scoped via IRSA or Pod Identity.
infection: >
  The node role is the fallback credential source for every
  pod on the node group. Pods without IRSA or Pod Identity
  inherit these permissions via IMDS. Even pods WITH IRSA
  can reach the node role if IMDS hop limit > 1 (see
  CTL.EKS.NODEGROUP.IMDS.HOPLIMIT.001). An overbroad node
  role turns every pod compromise into an escalation to
  whatever the excess permissions allow — S3 bucket access,
  role assumption chains, secrets retrieval, or IAM
  mutation. The node role should contain only what the
  kubelet, CNI plugin, and container runtime need to
  function.
failure: >
  Node-role blast radius expansion. Pod compromise yields
  workload-irrelevant permissions; the node role becomes
  an escalation pivot rather than a minimal-privilege
  infrastructure credential.
tests:
  - name: overbroad node role fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:eks:us-east-1:111122223333:nodegroup/prod/default"
      asset_type: aws_eks_nodegroup
      vendor: aws
      properties:
        k8s:
          nodegroup:
            role_exceeds_kubelet_minimum: true
            role_arn: "arn:aws:iam::111122223333:role/eks-node-prod-overbroad"
            excess_actions:
              - "s3:*"
              - "iam:PassRole"
              - "sts:AssumeRole"
              - "secretsmanager:GetSecretValue"
  - name: kubelet-minimum role passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:eks:us-east-1:111122223333:nodegroup/prod/default"
      asset_type: aws_eks_nodegroup
      vendor: aws
      properties:
        k8s:
          nodegroup:
            role_exceeds_kubelet_minimum: false
            role_arn: "arn:aws:iam::111122223333:role/eks-node-prod-minimal"
  - name: node role with only CNI extra passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:eks:us-east-1:111122223333:nodegroup/prod/cni-nodes"
      asset_type: aws_eks_nodegroup
      vendor: aws
      properties:
        k8s:
          nodegroup:
            role_exceeds_kubelet_minimum: false
            role_arn: "arn:aws:iam::111122223333:role/eks-node-prod-cni"
