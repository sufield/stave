dsl_version: ctrl.v1
id: CTL.EKS.NETPOL.EGRESS.OPEN.001
name: EKS NetworkPolicy Allows Egress To 0.0.0.0/0
description: >
  EKS NetworkPolicy has an egress rule with `ipBlock.cidr:
  0.0.0.0/0` — pods covered by the rule can connect to any
  destination. The intent is usually "I need to call any
  external API"; the effect defeats default-deny-egress
  isolation. Should be replaced with an egress allowlist
  matching the actual external endpoints the workload
  calls (specific CIDRs or DNS-name-resolved IPs).
domain: governance
severity: high
compliance:
  soc2: "CC6.1, CC6.6"
  nist_800_53_r5: "AC-4, SC-7"
  pci_dss_v4.0: "1.2, 1.3"
  fedramp_moderate: "AC-4, SC-7"
  iso_27001_2022: "A.5.15, A.8.20"
  ccm_v4: ["IVS-09", "DSP-17"]
scope_tags:
  - aws
  - eks
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eks_network_policy
params:
  attack_stage: exfiltration
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.0
remediation:
  description: >
    EKS NetworkPolicy egress rule allows 0.0.0.0/0.
  action: >
    Replace 0.0.0.0/0 with specific egress destinations:
    AWS API ranges (or VPC endpoints + the endpoint's
    private IP range), partner API CIDRs, internal cluster
    services. For workloads needing broad outbound, use a
    DNS firewall + egress-via-NAT-with-logging pattern
    rather than NetworkPolicy 0.0.0.0/0.
  example: |
    {
      "k8s": {
        "network_policy": {
          "egress_allows_world": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.k8s.network_policy.egress_allows_world
      op: eq
      value: true
defect: >
  EKS NetworkPolicy has an egress rule with `ipBlock.cidr:
  0.0.0.0/0`.
infection: >
  Pods covered by the rule can connect to any destination.
  Compromise yields unbounded data exfiltration: attacker
  selects an external server, dumps cluster Secrets to it.
  IMDS access (169.254.169.254) — typically the path to
  node IAM credentials — also remains reachable since
  0.0.0.0/0 includes the link-local range. The
  default-deny-egress posture, if present elsewhere, is
  defeated by this single allow-all rule.
failure: >
  Unbounded data exfiltration surface. Pods can connect
  anywhere; default-deny-egress floor defeated.
tests:
  - name: policy with 0.0.0.0/0 egress fires
    verdict: VIOLATION
    asset:
      asset_id: "k8s/orders/networkpolicy/orders-egress-all"
      asset_type: aws_eks_network_policy
      vendor: aws
      properties:
        k8s:
          network_policy:
            egress_allows_world: true
  - name: policy with scoped egress passes
    verdict: PASS
    asset:
      asset_id: "k8s/orders/networkpolicy/orders-egress-aws"
      asset_type: aws_eks_network_policy
      vendor: aws
      properties:
        k8s:
          network_policy:
            egress_allows_world: false
