dsl_version: ctrl.v1
id: CTL.EKS.NETPOL.NODEFAULTDENY.INGRESS.001
name: EKS Namespace Has No Default-Deny Ingress NetworkPolicy
description: >
  EKS namespace has no NetworkPolicy that selects all pods
  (`podSelector: {}`) with empty ingress rules — the
  default-deny-ingress baseline. Without it, pods in the
  namespace accept ingress from any pod in any namespace by
  default. NetworkPolicies are additive — explicit allow
  rules layered on top of a missing default-deny don't
  actually narrow connectivity, they just add to the
  permissive default. Default-deny ingress is the
  namespace-level isolation floor.
domain: governance
severity: high
compliance:
  soc2: "CC6.1, CC6.6, CC6.7"
  nist_800_53_r5: "AC-3, AC-4, SC-7"
  pci_dss_v4.0: "1.2, 1.3"
  fedramp_moderate: "AC-3, SC-7"
  iso_27001_2022: "A.5.15, A.8.20"
  ccm_v4: ["IVS-09", "DSP-17"]
scope_tags:
  - aws
  - eks
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eks_namespace
params:
  attack_stage: lateral_movement
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.0
remediation:
  description: >
    EKS namespace has no default-deny-ingress NetworkPolicy.
  action: >
    Apply a default-deny baseline:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny-ingress
        namespace: <ns>
      spec:
        podSelector: {}
        policyTypes: [Ingress]
    Then layer explicit allow policies for the connections
    the workload actually needs. Default-deny + explicit
    allow is the documented Kubernetes pattern for
    namespace-level network isolation.
  example: |
    {
      "k8s": {
        "namespace": {
          "has_default_deny_ingress": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.k8s.namespace.has_default_deny_ingress
      op: eq
      value: false
    - field: properties.k8s.namespace.is_system_namespace
      op: eq
      value: false
defect: >
  EKS namespace has no NetworkPolicy establishing default-
  deny ingress.
infection: >
  Without default-deny, NetworkPolicies are purely
  additive — every explicit allow rule extends rather than
  narrows connectivity. Pods accept ingress from anywhere
  in the cluster by default. A pod compromise in any
  namespace can probe-then-pivot to pods in this namespace
  without any policy obstruction. Cross-namespace lateral
  movement requires no policy bypass; it's the default
  state.
failure: >
  Cluster-wide lateral movement enabled by default. Pods in
  any namespace can connect to pods in this namespace.
tests:
  - name: namespace without default-deny fires
    verdict: VIOLATION
    asset:
      asset_id: "k8s/namespace/orders"
      asset_type: aws_eks_namespace
      vendor: aws
      properties:
        k8s:
          namespace:
            has_default_deny_ingress: false
            is_system_namespace: false
  - name: namespace with default-deny passes
    verdict: PASS
    asset:
      asset_id: "k8s/namespace/orders"
      asset_type: aws_eks_namespace
      vendor: aws
      properties:
        k8s:
          namespace:
            has_default_deny_ingress: true
            is_system_namespace: false
