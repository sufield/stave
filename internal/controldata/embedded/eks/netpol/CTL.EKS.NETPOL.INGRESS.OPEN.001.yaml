dsl_version: ctrl.v1
id: CTL.EKS.NETPOL.INGRESS.OPEN.001
name: EKS NetworkPolicy Allows Ingress From 0.0.0.0/0
description: >
  EKS NetworkPolicy has an ingress rule with `ipBlock.cidr:
  0.0.0.0/0` — effectively no source restriction. Common
  intent: "I want this to be reachable from anywhere"; common
  effect: defeats the namespace's default-deny baseline. If
  the rule applies to all pods in the namespace
  (podSelector: {}), the namespace is functionally
  ingress-open even with default-deny present.
domain: governance
severity: high
compliance:
  soc2: "CC6.1, CC6.6"
  nist_800_53_r5: "AC-3, AC-4, SC-7"
  pci_dss_v4.0: "1.2, 1.3"
  fedramp_moderate: "AC-3, SC-7"
  iso_27001_2022: "A.5.15, A.8.20"
  ccm_v4: ["IVS-09"]
scope_tags:
  - aws
  - eks
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eks_network_policy
params:
  attack_stage: lateral_movement
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.0
remediation:
  description: >
    EKS NetworkPolicy ingress rule allows 0.0.0.0/0.
  action: >
    Replace 0.0.0.0/0 with the specific source CIDR or
    podSelector that should be permitted. For workloads
    that legitimately need to be reachable from external
    networks, place them behind an Ingress controller / ALB
    rather than allowing 0.0.0.0/0 directly to pods.
  example: |
    {
      "k8s": {
        "network_policy": {
          "ingress_allows_world": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.k8s.network_policy.ingress_allows_world
      op: eq
      value: true
defect: >
  EKS NetworkPolicy has an ingress rule with `ipBlock.cidr:
  0.0.0.0/0`.
infection: >
  The rule grants ingress from any source. Where the rule
  applies — to specific pods or all pods — those pods
  accept connections from anywhere reachable on the
  network. In a typical EKS cluster, that includes other
  pods, NAT-gateway-egressing-back-in traffic, and
  potentially internet-routable addresses depending on
  cluster networking. Default-deny baselines + explicit
  allow rules become moot if any explicit rule opens to
  0.0.0.0/0.
failure: >
  Default-deny defeated. Pods covered by the rule are
  effectively open to any source.
tests:
  - name: policy with 0.0.0.0/0 ingress fires
    verdict: VIOLATION
    asset:
      asset_id: "k8s/orders/networkpolicy/orders-allow-all"
      asset_type: aws_eks_network_policy
      vendor: aws
      properties:
        k8s:
          network_policy:
            ingress_allows_world: true
  - name: policy with scoped ingress passes
    verdict: PASS
    asset:
      asset_id: "k8s/orders/networkpolicy/orders-from-frontend"
      asset_type: aws_eks_network_policy
      vendor: aws
      properties:
        k8s:
          network_policy:
            ingress_allows_world: false
