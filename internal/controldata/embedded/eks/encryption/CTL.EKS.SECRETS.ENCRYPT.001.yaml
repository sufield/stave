dsl_version: ctrl.v1
id: CTL.EKS.SECRETS.ENCRYPT.001
name: EKS Kubernetes Secrets Must Be Encrypted with KMS CMK
description: >
  EKS clusters must encrypt Kubernetes secrets at rest using a
  customer-managed KMS key. Without envelope encryption, anyone
  with access to the etcd backup or underlying EBS volume can
  read all cluster secrets (API tokens, database passwords,
  TLS certificates) in plaintext.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SC-28"
  hipaa: "164.312(a)(2)(iv)"
  fedramp_moderate: "SC-28"
  cis_eks: "2.3"
  ccm_v4: ["CEK-03"]
scope_tags:
  - aws
  - eks
type: unsafe_state
params:
  attack_stage: credential_access
remediation:
  description: >
    EKS Kubernetes secrets are not envelope-encrypted with a
    customer-managed KMS key. Secrets are stored in plaintext in etcd.
  action: >
    Enable secrets encryption:
    aws eks associate-encryption-config --cluster-name <cluster>
    --encryption-config '[{"resources":["secrets"],"provider":
    {"keyArn":"arn:aws:kms:<region>:<account>:key/<key-id>"}}]'
unsafe_predicate:
  all:
    - field: properties.encryption.secrets_encrypted
      op: eq
      value: false
