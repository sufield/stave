dsl_version: ctrl.v1
id: CTL.EKS.AWSAUTH.UNTRUSTED.ACCOUNT.001
name: EKS aws-auth Maps Role From Account Outside Organization
description: >
  EKS aws-auth ConfigMap (or Access Entry) maps an IAM
  role from an account outside the AWS Organization.
  External accounts can authenticate to the cluster as
  whatever Kubernetes group the mapping grants —
  often system:masters or another high-privilege
  group. Same risk as cross-account IAM grants but at
  the cluster authentication layer; harder to audit
  because the account ID lives inline in the
  ConfigMap.
domain: identity
severity: critical
compliance:
  soc2: "CC6.1, CC6.3, CC6.6"
  nist_800_53_r5: "AC-3, AC-4, AC-6"
  pci_dss_v4.0: "7.2"
  fedramp_moderate: "AC-3, AC-6"
  iso_27001_2022: "A.5.15, A.8.2"
  ccm_v4: ["IAM-04", "IAM-08"]
scope_tags:
  - aws
  - eks
taxonomy:
  - compliance-mapping
  - logging
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eks_aws_auth_mapping
params:
  attack_stage: privilege_escalation
  blast_radius:
    type: control
    scope: account
    multiplier: 3.0
remediation:
  description: >
    EKS aws-auth maps role from outside the org.
  action: >
    Remove the cross-org mapping. For legitimate
    external collaboration, use IAM Identity Center
    or AWS SSO with org-scoped trust rather than
    inline cross-account aws-auth mappings. If the
    mapping is required, document it with a
    justification annotation in the ConfigMap and
    pair with a CloudTrail alarm on cluster-config
    changes for the mapped role's account ID.
  example: |
    {
      "k8s": {
        "cluster": {
          "aws_auth": {
            "role_account_id": "111122223333",
            "role_account_in_org": true
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.k8s.cluster.aws_auth.role_account_in_org
      op: eq
      value: false
defect: >
  EKS aws-auth maps an IAM role from outside the AWS
  Organization.
infection: >
  External accounts can authenticate to the cluster.
  The mapping's Kubernetes groups apply — typically
  granting cluster-admin or namespace-admin
  privileges. Compromise of the external account, or
  abuse by the external party, yields cluster
  access. The cross-org boundary, normally enforced
  at the org policy layer, is bypassed at the
  cluster authentication layer. CloudTrail records
  the cross-account API calls but typically routes
  to the source account's trail, not the cluster
  owner's.
failure: >
  Cross-organization cluster access. External
  accounts have authenticated paths into the
  cluster; org-policy boundary defeated at the K8s
  layer.
tests:
  - name: cross-org aws-auth mapping fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:eks:us-east-1:111122223333:cluster/prod#aws-auth/external"
      asset_type: aws_eks_aws_auth_mapping
      vendor: aws
      properties:
        k8s:
          cluster:
            aws_auth:
              role_arn: "arn:aws:iam::999988887777:role/ExternalAdmin"
              role_account_id: "999988887777"
              role_account_in_org: false
  - name: in-org aws-auth mapping passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:eks:us-east-1:111122223333:cluster/prod#aws-auth/internal"
      asset_type: aws_eks_aws_auth_mapping
      vendor: aws
      properties:
        k8s:
          cluster:
            aws_auth:
              role_arn: "arn:aws:iam::222233334444:role/InternalAdmin"
              role_account_id: "222233334444"
              role_account_in_org: true
