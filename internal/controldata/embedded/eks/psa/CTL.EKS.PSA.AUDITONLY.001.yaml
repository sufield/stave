dsl_version: ctrl.v1
id: CTL.EKS.PSA.AUDITONLY.001
name: EKS Namespace Has PSA In Audit-Only Mode On Production Workload
description: >
  EKS production namespace has PSA configured with audit /
  warn but no enforce — non-compliant pods generate audit
  events but are still admitted. PSA's audit and warn modes
  exist for measuring compliance during migration; running
  them indefinitely on production without enforce means
  insecure pods continue to land while auditors see "PSA is
  configured" reports.
domain: governance
severity: medium
compliance:
  soc2: "CC6.1, CC8.1"
  nist_800_53_r5: "AC-3, CM-2, SI-3"
  fedramp_moderate: "AC-3, SI-3"
  iso_27001_2022: "A.5.15, A.8.16"
  ccm_v4: ["IVS-09"]
scope_tags:
  - aws
  - eks
taxonomy:
  - compliance-mapping
subtractive_category:
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eks_namespace
params:
  attack_stage: detection_evasion
remediation:
  description: >
    EKS production namespace has PSA in audit-only mode.
  action: >
    Promote audit / warn to enforce after a measurement
    period (typically 2-4 weeks of audit events review).
    Set:
      pod-security.kubernetes.io/enforce=restricted
    leaving audit / warn at the same level for cross-check.
    If the namespace has legitimate violations at the chosen
    level, exempt them via per-pod annotations rather than
    weakening the namespace-wide enforce.
  example: |
    {
      "k8s": {
        "namespace": {
          "has_psa_enforce_label": true,
          "psa_audit_only": false,
          "is_production": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.k8s.namespace.psa_audit_only
      op: eq
      value: true
    - field: properties.k8s.namespace.is_production
      op: eq
      value: true
defect: >
  EKS production namespace has PSA configured as audit / warn
  only without an enforce level.
infection: >
  PSA admission accepts every pod regardless of security
  context but emits audit events for non-compliant ones. The
  cluster's audit log records the violations; nothing
  prevents them. Operators reviewing PSA dashboards see
  metrics that imply enforcement; the actual cluster
  posture is "warned and admitted." Long-running audit-only
  configurations are migration plans that stalled.
failure: >
  Audit visibility without prevention. PSA-violating pods
  continue to admit while their violations populate
  metrics — operational visibility implies enforcement that
  doesn't exist.
tests:
  - name: production audit-only fires
    verdict: VIOLATION
    asset:
      asset_id: "k8s/namespace/prod-orders"
      asset_type: aws_eks_namespace
      vendor: aws
      properties:
        k8s:
          namespace:
            name: "prod-orders"
            has_psa_enforce_label: false
            psa_audit_only: true
            is_production: true
  - name: production with enforce passes
    verdict: PASS
    asset:
      asset_id: "k8s/namespace/prod-orders"
      asset_type: aws_eks_namespace
      vendor: aws
      properties:
        k8s:
          namespace:
            name: "prod-orders"
            has_psa_enforce_label: true
            psa_enforce_level: "restricted"
            psa_audit_only: false
            is_production: true
