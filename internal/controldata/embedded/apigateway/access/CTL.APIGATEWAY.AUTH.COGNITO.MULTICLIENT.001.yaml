dsl_version: ctrl.v1
id: CTL.APIGATEWAY.AUTH.COGNITO.MULTICLIENT.001
name: Cognito Authorizer Accepts Tokens From Any App Client in Pool
description: >
  Cognito user pool authorizer is attached to a user pool but the
  authorizer's allowed app-client list is empty or wildcarded.
  Any access token issued by any app client in the pool is
  accepted. User pools commonly host multiple applications:
  the consumer mobile app, the partner portal, the internal
  admin console — each typically has its own app client. With
  no client-ID restriction, a token issued for the consumer app
  is also accepted by the admin API. A leaked or compromised
  consumer token grants admin access if the admin API also
  trusts the same pool.
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "AC-2, AC-3, AC-6, IA-2"
  fedramp_moderate: "AC-2, AC-3, AC-6"
  pci_dss_v4.0: "7.1, 7.2, 8.3"
  soc2: "CC6.1, CC6.3"
  iso_27001_2022: "A.5.15, A.5.16"
  ccm_v4: ["IAM-04", "IAM-09"]
scope_tags:
  - aws
  - apigateway
taxonomy:
  - compliance-mapping
subtractive_category:
  - S02
  - S03
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_apigateway_rest_api]
params:
  attack_stage: privilege_escalation
remediation:
  description: >
    Cognito authorizer accepts tokens from every app client in the
    pool. Cross-application token reuse is possible.
  action: >
    Configure the Cognito authorizer's identity validation to pin
    the specific app client IDs that should be accepted. In a
    Lambda authorizer fronting Cognito, validate the token's
    client_id (id token) or aud (access token) claim against an
    allowlist. For HTTP API JWT authorizers, set the audience
    field to the specific client IDs. Document which app clients
    legitimately reach this API and reject tokens from others.
  example: |
    {
      "api": {
        "kind": "apigateway_authorizer",
        "authorizer": {
          "type": "COGNITO_USER_POOLS",
          "cognito": {
            "client_ids_pinned": true
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.api.kind
      op: eq
      value: apigateway_authorizer
    - field: properties.api.authorizer.type
      op: eq
      value: COGNITO_USER_POOLS
    - field: properties.api.authorizer.cognito.client_ids_pinned
      op: eq
      value: false
