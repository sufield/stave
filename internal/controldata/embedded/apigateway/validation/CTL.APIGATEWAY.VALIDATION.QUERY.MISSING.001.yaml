dsl_version: ctrl.v1
id: CTL.APIGATEWAY.VALIDATION.QUERY.MISSING.001
name: REST API Method Validator Doesn't Validate Query Parameters
description: >
  REST API method has a request validator attached but the
  validator is configured to skip query-string parameter
  validation. Method query parameters declared on the method
  (with required=true) flow through to the integration
  unchecked: missing parameters reach the backend (which often
  500s on null), wrong-type parameters bypass schema
  expectations, parameter-injection payloads transit unfiltered
  to the backend. Body validation alone is incomplete — many
  REST endpoints carry their primary input in query strings,
  and those need the same schema-driven gating as bodies.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "SI-10, SC-7"
  fedramp_moderate: "SI-10, SC-7"
  pci_dss_v4.0: "6.4.2"
  soc2: "CC6.1, CC6.6"
  iso_27001_2022: "A.5.10, A.8.16"
  ccm_v4: ["IVS-09", "TVM-04"]
scope_tags:
  - aws
  - apigateway
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
remediation:
  description: >
    Method validator skips query parameter validation; declared
    query parameters reach the backend unchecked.
  action: >
    Configure a request validator that includes query/header
    validation and attach it to the method: aws apigateway
    create-request-validator with --validate-request-parameters
    true, then update-method --request-validator-id <id>.
    Declare each method query parameter with required=true /
    false explicitly so the validator has a contract to
    enforce.
  example: |
    {
      "api": {
        "kind": "apigateway_method",
        "method": {
          "validates_query_params": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.api.kind
      op: eq
      value: apigateway_method
    - field: properties.api.method.has_validator
      op: eq
      value: true
    - field: properties.api.method.validates_query_params
      op: eq
      value: false
