dsl_version: ctrl.v1
id: CTL.APIGATEWAY.EXECLOG.LEVEL.INFO.001
name: REST API Execution Logging Set to INFO in Production
description: >
  REST API stage has execution logging enabled at level INFO
  on what appears to be a production stage (stage_name not
  matching dev/test/staging conventions). INFO-level execution
  logs include detailed per-request internal processing —
  authorizer outputs, integration request/response headers
  and metadata, mapping template execution. Production volume
  at INFO level inflates CloudWatch costs significantly and
  surfaces operational metadata that can leak sensitive
  detail. ERROR level captures the same diagnostic value for
  failures without persisting per-request internals on the
  happy path. INFO is appropriate for development and short-
  lived diagnostic windows; the long-lived production setting
  should be ERROR.
domain: governance
severity: medium
compliance:
  nist_800_53_r5: "AU-9, SC-28, SI-12"
  fedramp_moderate: "AU-9, SC-28"
  pci_dss_v4.0: "10.5"
  soc2: "CC6.7, CC8.1"
  iso_27001_2022: "A.5.33, A.8.10, A.8.15"
  ccm_v4: ["LOG-08", "GRC-04"]
scope_tags:
  - aws
  - apigateway
taxonomy:
  - compliance-mapping
  - logging
subtractive_category:
  - S03
  - S07
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_apigateway_rest_api]
params:
  attack_stage: detection_evasion
remediation:
  description: >
    Production stage execution logging at INFO level — high
    log volume and per-request internal disclosure.
  action: >
    Lower the production stage's execution log level to ERROR:
    aws apigateway update-stage with --patch-operations
    op=replace,path=/*/loggingLevel,value=ERROR. For short-
    lived diagnostic windows, raise to INFO temporarily, then
    revert when the diagnosis is complete. Pair with the
    existing CTL.APIGATEWAY.EXECLOG.DATALOG.001 control —
    keep data trace off in production regardless of log
    level.
  example: |
    {
      "api": {
        "kind": "apigateway_stage",
        "execution_log": {
          "is_production_stage": true,
          "log_level": "ERROR"
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.api.kind
      op: eq
      value: apigateway_stage
    - field: properties.api.execution_log.is_production_stage
      op: eq
      value: true
    - field: properties.api.execution_log.log_level
      op: eq
      value: INFO
