dsl_version: ctrl.v1
id: CTL.APIGATEWAY.ALARM.4XX.001
name: No CloudWatch Alarm on API Gateway 4xx Error Rate
description: >
  API Gateway stage emits the 4XXError metric to CloudWatch but
  no alarm watches it. 4xx errors are usually client mistakes —
  bad input, missing auth — but a sustained spike is a strong
  signal of attack probing: credential stuffing produces
  401/403 spikes, parameter fuzzing produces 400/422 spikes,
  authorizer-bypass attempts produce 401 spikes. Alarming on
  a 4xx baseline plus deviation gives early warning of
  reconnaissance and active attack — well before the 5xx
  alarm fires from a successful exploitation.
domain: audit
severity: medium
compliance:
  nist_800_53_r5: "AU-6, IR-4, SI-4"
  fedramp_moderate: "AU-6, IR-4, SI-4"
  pci_dss_v4.0: "10.4, 10.7, 11.5"
  soc2: "CC7.2, CC7.3"
  iso_27001_2022: "A.5.25, A.8.16"
  ccm_v4: ["LOG-04", "LOG-05", "TVM-04"]
scope_tags:
  - aws
  - apigateway
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - monitoring
subtractive_category:
  - S03
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_apigateway_rest_api]
params:
  attack_stage: detection_evasion
remediation:
  description: >
    No CloudWatch alarm watches the API Gateway 4xx error rate.
  action: >
    Create an alarm on AWS/ApiGateway namespace, 4XXError metric,
    dimensioned by ApiName/Stage. Threshold should reflect
    baseline plus reconnaissance headroom — a 5x increase over
    rolling baseline is a common attack-probing signal. aws
    cloudwatch put-metric-alarm with --metric-name 4XXError.
    Pair with a separate alarm on 401/403 specifically if the
    access log format breaks out status — credential-stuffing
    detection benefits from the narrower signal.
  example: |
    {
      "api": {
        "kind": "apigateway_stage",
        "alarms": {
          "has_4xx_alarm": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.api.kind
      op: eq
      value: apigateway_stage
    - field: properties.api.alarms.has_4xx_alarm
      op: eq
      value: false
