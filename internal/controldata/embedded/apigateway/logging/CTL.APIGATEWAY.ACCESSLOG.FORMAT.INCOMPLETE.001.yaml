dsl_version: ctrl.v1
id: CTL.APIGATEWAY.ACCESSLOG.FORMAT.INCOMPLETE.001
name: API Gateway Access Log Format Missing Critical Fields
description: >
  Access logging is enabled but the configured access log format
  omits at least one of the fields needed for incident response
  and audit: $context.requestId, $context.identity.caller or
  $context.identity.user, $context.identity.sourceIp,
  $context.responseLatency, $context.status, and a request
  timestamp ($context.requestTimeEpoch preferred, or
  $context.requestTime). With these fields missing, an
  investigator looking at the logs cannot answer the questions an
  incident demands: who called this method, from where, how long
  did it take, what status did API Gateway return, what was the
  request correlation ID for cross-system tracing, and WHEN it
  happened. The log line still exists and counts as "logging
  enabled" in compliance reporting, but its forensic value is
  near zero.

  The timestamp is the field this control adds for time-integrity:
  without it, events cannot be ordered and cross-service
  correlation degrades. $context.requestTimeEpoch (millisecond
  epoch) is unambiguous for correlation across systems whose
  clocks may disagree; the human-readable $context.requestTime
  satisfies the requirement but is INFO-flagged to prefer epoch.

  Inspired by NCC Group "Time as an Attack Surface" white paper by
  Andy Davis.
domain: audit
severity: medium
compliance:
  nist_800_53_r5: "AU-2, AU-3, AU-6"
  fedramp_moderate: "AU-2, AU-3, AU-6"
  pci_dss_v4.0: "10.2, 10.3"
  soc2: "CC7.2, CC7.3"
  iso_27001_2022: "A.8.15, A.8.16"
  ccm_v4: ["LOG-04", "LOG-08"]
scope_tags:
  - aws
  - apigateway
applicable_asset_types:
  - aws_apigateway_rest_api
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
remediation:
  description: >
    Access log format is missing at least one of: requestId,
    caller identity, source IP, latency, status.
  action: >
    Update the stage's access log format to include the full
    investigation-ready set: $context.requestId,
    $context.identity.sourceIp, $context.identity.caller (or
    $context.identity.user / $context.authorizer.principalId
    depending on auth type), $context.requestTime,
    $context.httpMethod, $context.resourcePath, $context.status,
    $context.responseLatency, $context.responseLength. aws
    apigateway update-stage with --patch-operations
    op=replace,path=/accessLogSettings/format,value=<json-template>.
    The AWS-recommended JSON format covers the full set; verify
    nothing has been pruned.
  example: |
    {
      "api": {
        "kind": "apigateway_stage",
        "access_log": {
          "format_complete": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.api.kind
      op: eq
      value: apigateway_stage
    - field: properties.api.access_log.format_complete
      op: eq
      value: false
tests:
  - name: access log format omitting the request timestamp fires (vulnerable — time-integrity gap)
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:apigateway:us-east-1::/restapis/api-no-ts/stages/prod"
      asset_type: aws_apigateway_rest_api
      vendor: aws
      properties:
        api:
          kind: apigateway_stage
          access_log:
            format_complete: false
  - name: format with requestTimeEpoch and the full field set passes (false-positive trap)
    verdict: PASS
    asset:
      asset_id: "arn:aws:apigateway:us-east-1::/restapis/api-epoch/stages/prod"
      asset_type: aws_apigateway_rest_api
      vendor: aws
      properties:
        api:
          kind: apigateway_stage
          access_log:
            format_complete: true
  - name: human-readable requestTime satisfies completeness; epoch preferred is INFO-only (false-positive trap)
    verdict: PASS
    asset:
      asset_id: "arn:aws:apigateway:us-east-1::/restapis/api-human-ts/stages/prod"
      asset_type: aws_apigateway_rest_api
      vendor: aws
      properties:
        api:
          kind: apigateway_stage
          access_log:
            format_complete: true
