dsl_version: ctrl.v1
id: CTL.APIGATEWAY.CACHE.ENCRYPT.001
name: REST API Cache Must Be Encrypted
description: >
  API Gateway REST API stages with caching enabled must encrypt
  cached responses at rest. Unencrypted cache can expose response
  payloads, tokens, and PII.
domain: encryption
severity: medium
compliance:
  nist_800_53_r5: "SC-28"
  soc2: "CC6.7"
  ccm_v4: ["CEK-03"]
scope_tags:
  - aws
  - apigateway
taxonomy:
  - compliance-mapping
  - encryption-at-rest
subtractive_category:
  - S03
  - S10
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_apigateway_rest_api]
params:
  attack_stage: collection
remediation:
  description: REST API stage cache is not encrypted.
  action: Enable cache encryption on the stage.
  example: |
    {
      "api": {
        "kind": "rest_api",
        "encryption": { "cache_encrypted": true }
      }
    }
unsafe_predicate:
  all:
    - field: properties.api.kind
      op: eq
      value: rest_api
    - field: properties.api.encryption.cache_encrypted
      op: eq
      value: false
