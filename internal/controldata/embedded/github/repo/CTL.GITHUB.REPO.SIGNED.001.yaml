dsl_version: ctrl.v1
id: CTL.GITHUB.REPO.SIGNED.001
name: Default Branch Does Not Require Signed Commits
description: >
  Commits not required to be GPG or SSH signed. Commit authorship
  can be spoofed — an attacker can create commits appearing to
  come from a trusted developer.
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "SI-7"
  nist_ssdf: "PS.1"
  soc2: "CC8.1"
scope_tags: [github]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
remediation:
  description: Default Branch Does Not Require Signed Commits — finding detected.
  action: Enable "Require signed commits" in branch protection.
  example: |
    {"github": {"repo": {"kind": "repository", "branch_protection": {"requires_signed_commits": true}}}}
unsafe_predicate:
  all:
    - field: properties.github.repo.kind
      op: eq
      value: repository
    - field: properties.github.repo.branch_protection.requires_signed_commits
      op: eq
      value: false
