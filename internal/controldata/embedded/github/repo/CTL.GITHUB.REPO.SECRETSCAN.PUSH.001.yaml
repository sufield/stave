dsl_version: ctrl.v1
id: CTL.GITHUB.REPO.SECRETSCAN.PUSH.001
name: Secret Scanning Push Protection Not Enabled
description: >
  Push protection disabled. Secrets detected after commit, not
  blocked before. The credential enters git history before detection
  and must be rotated.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SA-11"
  nist_ssdf: "PW.7"
  soc2: "CC8.1"
scope_tags: [github]
taxonomy:
  - compliance-mapping
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Secret Scanning Push Protection Not Enabled — finding detected.
  action: Enable push protection in secret scanning settings.
  example: |
    {"github": {"repo": {"kind": "repository", "secret_scanning_push_protection": true}}}
unsafe_predicate:
  all:
    - field: properties.github.repo.kind
      op: eq
      value: repository
    - field: properties.github.repo.secret_scanning_push_protection
      op: eq
      value: false
