dsl_version: ctrl.v1
id: CTL.GITHUB.REPO.BRANCHPROT.001
name: Default Branch Protection Not Enabled
description: >
  No branch protection rules on the default branch. Anyone with
  write access can push directly — no code review, no CI checks,
  no approval required.
domain: exposure
severity: critical
compliance:
  nist_800_53_r5: "CM-3"
  nist_ssdf: "PW.1"
  pci_dss_v4: "6.3"
  soc2: "CC8.1"
  slsa: "Level 2"
scope_tags: [github]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types: [github_repository]
params:
  attack_stage: initial_access
remediation:
  description: Default Branch Protection Not Enabled — finding detected.
  action: Enable branch protection rules on the default branch.
  example: |
    {"github": {"repo": {"kind": "repository", "branch_protection": {"enabled": true}}}}
unsafe_predicate:
  all:
    - field: properties.github.repo.kind
      op: eq
      value: repository
    - field: properties.github.repo.branch_protection.enabled
      op: eq
      value: false
