dsl_version: ctrl.v1
id: CTL.ORG.SCP.BEANSTALK.DENY.001
name: SCP Does Not Deny Elastic Beanstalk Usage
description: >
  Organization SCPs do not deny Elastic Beanstalk service usage in
  member accounts. Beanstalk provisions EC2 instances, Auto Scaling
  groups, Elastic Load Balancers, security groups, S3 buckets, and
  optionally RDS databases behind the Beanstalk API surface. These
  resources are created with Beanstalk-managed defaults that may not
  match organizational security baselines — including overpermissioned
  security groups and public-facing load balancers. Without an SCP
  denying elasticbeanstalk:*, any IAM principal can provision
  internet-facing infrastructure outside the standard IaC governance
  pipeline.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "CM-7"
  soc2: "CC6.6"
  ccm_v4: ["IAM-10"]
scope_tags:
  - aws
  - organizations
taxonomy:
  - account-governance
  - resource-sprawl
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_organization
params:
  attack_stage: detection_evasion
observation_fields:
  - organization.kind
  - organization.scp.denies_elasticbeanstalk
remediation:
  description: >
    Organization SCPs do not deny Elastic Beanstalk usage in member
    accounts.
  action: >
    Add an SCP denying elasticbeanstalk:* for all principals. Exclude
    specific accounts if Beanstalk is intentionally used.
  example: |
    {
      "organization": {
        "kind": "scp_policy_set",
        "scp": {
          "denies_elasticbeanstalk": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.organization.kind
      op: eq
      value: scp_policy_set
    - field: properties.organization.scp.denies_elasticbeanstalk
      op: ne
      value: true
tests:
  - name: "no Beanstalk deny fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:organizations::111122223333:organization/o-abc123"
      asset_type: aws_organization
      vendor: aws
      properties:
        organization:
          kind: scp_policy_set
          scp: {denies_elasticbeanstalk: false}
  - name: "Beanstalk deny passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:organizations::444455556666:organization/o-def456"
      asset_type: aws_organization
      vendor: aws
      properties:
        organization:
          kind: scp_policy_set
          scp: {denies_elasticbeanstalk: true}
