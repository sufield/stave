dsl_version: ctrl.v1
id: CTL.ORG.SCP.LIGHTSAIL.DENY.001
name: SCP Does Not Deny Lightsail Usage
description: >
  Organization SCPs do not deny Lightsail service usage in member
  accounts. Lightsail operates outside the standard AWS governance
  boundary — it runs in an AWS-managed VPC, creates its own credential
  namespace, and is not recorded by AWS Config. Without an SCP denying
  lightsail:*, any IAM principal can provision shadow infrastructure
  invisible to the organization's CSPM, SIEM, and credential inventory.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "CM-7"
  soc2: "CC6.6"
  ccm_v4: ["IAM-10"]
scope_tags:
  - aws
  - organizations
taxonomy:
  - account-governance
  - resource-sprawl
payer_exempt: true
payer_compensating_control: null
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_organization
params:
  attack_stage: detection_evasion
observation_fields:
  - organization.kind
  - organization.scp.denies_lightsail
remediation:
  description: >
    Organization SCPs do not deny Lightsail usage in member accounts.
  action: >
    Add an SCP denying lightsail:* for all principals. Exclude specific
    accounts if Lightsail is intentionally used.
  example: |
    {
      "organization": {
        "kind": "scp_policy_set",
        "scp": {
          "denies_lightsail": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.organization.kind
      op: eq
      value: scp_policy_set
    - field: properties.organization.scp.denies_lightsail
      op: ne
      value: true
tests:
  - name: "organization without Lightsail deny fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:organizations::111122223333:organization/o-abc123"
      asset_type: aws_organization
      vendor: aws
      properties:
        organization:
          kind: scp_policy_set
          scp:
            denies_lightsail: false
  - name: "organization with Lightsail deny passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:organizations::444455556666:organization/o-def456"
      asset_type: aws_organization
      vendor: aws
      properties:
        organization:
          kind: scp_policy_set
          scp:
            denies_lightsail: true
