dsl_version: ctrl.v1
id: CTL.ORG.SCP.BATCH.DENY.001
name: SCP Does Not Deny AWS Batch Usage
description: >
  Organization SCPs do not deny AWS Batch service usage in member
  accounts. Batch provisions EC2 instances or Fargate compute with
  IAM execution roles behind the Batch API surface. Batch jobs can
  run arbitrary container images with the job role's permissions,
  and compute environments may use IMDSv1 by default. Without an
  SCP denying batch:*, any IAM principal can provision compute with
  broad permissions outside standard EC2/ECS governance.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "CM-7"
  soc2: "CC6.6"
  ccm_v4: ["IAM-10"]
scope_tags:
  - aws
  - organizations
taxonomy:
  - account-governance
  - resource-sprawl
subtractive_category:
  - S01
  - S02
payer_exempt: true
payer_compensating_control: null
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_organization
params:
  attack_stage: detection_evasion
observation_fields:
  - organization.kind
  - organization.scp.denies_batch
remediation:
  description: >
    Organization SCPs do not deny AWS Batch usage in member accounts.
  action: >
    Add an SCP denying batch:* for all principals. Exclude specific
    accounts if Batch is intentionally used.
  example: |
    {
      "organization": {
        "kind": "scp_policy_set",
        "scp": {
          "denies_batch": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.organization.kind
      op: eq
      value: scp_policy_set
    - field: properties.organization.scp.denies_batch
      op: ne
      value: true
tests:
  - name: "no Batch deny fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:organizations::111122223333:organization/o-abc123"
      asset_type: aws_organization
      vendor: aws
      properties:
        organization:
          kind: scp_policy_set
          scp: {denies_batch: false}
  - name: "Batch deny passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:organizations::444455556666:organization/o-def456"
      asset_type: aws_organization
      vendor: aws
      properties:
        organization:
          kind: scp_policy_set
          scp: {denies_batch: true}
