dsl_version: ctrl.v1
id: CTL.ORG.DP.SNAPSHOT.BLOCKPUBLIC.001
name: "Declarative Policy Does Not Block Public EBS Snapshot Sharing"
description: >
  No declarative policy blocks public EBS snapshot sharing at
  the organizational level. The policy type is
  ec2_attributes.snapshot_block_public_access with state =
  "block_all_sharing". Without this, any account admin can share
  EBS snapshots publicly, exposing disk contents including
  databases, log files, and credentials.
domain: governance
severity: high
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["DSP-01"]
scope_tags:
  - aws
  - organizations
  - ec2
taxonomy:
  - account-governance
  - data-protection
payer_exempt: true
payer_compensating_control: null
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_organization
params:
  attack_stage: exfiltration
observation_fields:
  - organization.kind
  - organization.dp.blocks_public_snapshot_sharing
remediation:
  description: >
    No declarative policy blocks public EBS snapshot sharing.
  action: >
    Create a declarative policy of type
    ec2_attributes.snapshot_block_public_access with state =
    "block_all_sharing" at the organization root.
  example: |
    {
      "organization": {
        "kind": "declarative_policy_set",
        "dp": {
          "blocks_public_snapshot_sharing": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.organization.kind
      op: eq
      value: declarative_policy_set
    - field: properties.organization.dp.blocks_public_snapshot_sharing
      op: ne
      value: true
defect: >
  No declarative policy blocks public EBS snapshot sharing.
infection: >
  EBS snapshots can be shared publicly by any account admin.
  Publicly shared snapshots expose the full disk contents:
  database files, application data, log files, credentials
  stored on disk.
failure: >
  Developer shares a snapshot publicly to transfer data
  between personal accounts. The snapshot contains an
  application database with customer PII. An external actor
  discovers the public snapshot, creates a volume, mounts it,
  and extracts the database.
tests:
  - name: "no public snapshot block fires"
    verdict: VIOLATION
    asset:
      asset_id: "o-abc123def4"
      asset_type: aws_organization
      vendor: aws
      properties:
        organization:
          kind: declarative_policy_set
          dp:
            blocks_public_snapshot_sharing: false
  - name: "public snapshot block passes"
    verdict: PASS
    asset:
      asset_id: "o-abc123def4"
      asset_type: aws_organization
      vendor: aws
      properties:
        organization:
          kind: declarative_policy_set
          dp:
            blocks_public_snapshot_sharing: true
