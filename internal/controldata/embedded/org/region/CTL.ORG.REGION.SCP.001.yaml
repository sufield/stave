dsl_version: ctrl.v1
id: CTL.ORG.REGION.SCP.001
name: AWS Organizations Must Have an SCP Restricting Resource Creation to Approved Regions
description: >
  AWS Organizations must have a Service Control Policy that restricts
  resource creation to an approved set of AWS regions. Without a region
  restriction SCP, any IAM principal can create resources in any of 30+
  regions — including regions where the organization has no CloudTrail,
  no GuardDuty, no Config recording, and no monitoring infrastructure.
  MITRE ATT&CK T1535 documents this as a defense evasion technique:
  attackers deliberately operate in unused regions to bypass cloud
  monitoring. A region restriction SCP closes all unmonitored regions
  simultaneously with a single organizational policy rather than
  requiring monitoring deployment to every region. This is the
  architectural complement to per-region monitoring controls — it
  eliminates the regions where monitoring is not deployed.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "CM-7"
  fedramp_moderate: "CM-7"
  hipaa: "164.312(b)"
  pci_dss_v4.0: "12.5.2"
  soc2: "CC7.1"
  gdpr: "Art.32"
  ccm_v4: ["GRC-02", "IAM-10"]
scope_tags:
  - aws
  - organizations
taxonomy:
  - account-governance
  - logging
  - monitoring
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
  base_impact: 8
  blast_radius:
    type: detection
    scope: account
    multiplier: 2.0
remediation:
  description: >
    No SCP restricts resource creation to approved AWS regions.
    Resources can be created in any region, including regions with
    no monitoring infrastructure.
  action: >
    Attach an SCP to the organization root with a Deny statement
    conditioned on aws:RequestedRegion that restricts resource creation
    to the organization's approved operating regions. Example condition:
    StringNotEquals aws:RequestedRegion [us-east-1, us-west-2, eu-west-1].
    Exclude global services (IAM, CloudFront, Route 53) from the
    restriction using a NotAction list.
  example: |
    {
      "organization": {
        "kind": "scp_policy_set",
        "region_restriction": {
          "has_scp": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.organization.kind
      op: eq
      value: scp_policy_set
    - field: properties.organization.region_restriction.has_scp
      op: eq
      value: false
