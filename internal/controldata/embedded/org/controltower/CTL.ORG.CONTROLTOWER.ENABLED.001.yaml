dsl_version: ctrl.v1
id: CTL.ORG.CONTROLTOWER.ENABLED.001
name: AWS Control Tower Must Be Enabled for Landing Zone Governance
description: >
  AWS Control Tower is not enabled. Control Tower provides a
  governed landing zone with preventive and detective guardrails
  across member accounts. Without it, account provisioning and
  baseline security configuration must be managed manually, leading
  to configuration drift and inconsistent security posture across
  the organization.
domain: governance
severity: high
compliance:
  nist_800_53_r5: "AC-3, CM-2"
  soc2: "CC6.1, CC8.1"
  ccm_v4: ["GRC-04"]
  scs_c02: "1.4"
scope_tags:
  - aws
  - organizations
taxonomy:
  - account-governance
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_organization
params:
  attack_stage: initial_access
  blast_radius:
    type: governance
    scope: organization
    multiplier: 3.0
remediation:
  description: >
    AWS Control Tower is not enabled. No automated landing zone
    governance or guardrails are in place.
  action: >
    Enable Control Tower from the management account. Select a
    home region, configure the log archive and audit accounts,
    and enable the default guardrails.
  example: |
    {
      "governance": {
        "kind": "control_tower",
        "control_tower": {
          "enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: control_tower
    - field: properties.governance.control_tower.enabled
      op: eq
      value: false
tests:
  - name: "Control Tower not enabled fails"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:controltower:us-east-1:111122223333:landingzone"
      asset_type: aws_control_tower
      vendor: aws
      properties:
        governance:
          kind: control_tower
          control_tower:
            enabled: false
  - name: "Control Tower enabled passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:controltower:us-east-1:111122223333:landingzone"
      asset_type: aws_control_tower
      vendor: aws
      properties:
        governance:
          kind: control_tower
          control_tower:
            enabled: true
