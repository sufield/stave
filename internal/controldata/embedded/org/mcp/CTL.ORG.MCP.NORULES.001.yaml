dsl_version: ctrl.v1
id: CTL.ORG.MCP.NORULES.001
name: MCP Attached With No Rules Loaded
description: >
  Managed Control Policy is attached to the organization but no
  rules are loaded or evaluating. The policy appears active — it
  shows as attached in the Organizations console and API — but
  provides zero enforcement. Same archetype as a Secrets Manager
  rotation enabled with a deleted Lambda: the protection mechanism
  exists in name only. Common causes: policy syntax error rejected
  all rules, empty policy body, or IAM permission issue preventing
  rule evaluation.
domain: governance
severity: critical
compliance:
  nist_800_53_r5: "AC-3, CM-7"
  soc2: "CC6.1"
  ccm_v4: ["GRC-01", "IAM-01"]
scope_tags:
  - aws
  - organizations
taxonomy:
  - account-governance
  - compliance-mapping
  - trust-decay
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_organization
params:
  attack_stage: initial_access
observation_fields:
  - organization.kind
  - organization.mcp.enabled
  - organization.mcp.rules_loaded
remediation:
  description: >
    MCP is attached but no rules are loaded. The policy provides
    no protection despite appearing active.
  action: >
    Check the MCP policy body for syntax errors. Verify IAM
    permissions allow the Organizations service to evaluate the
    policy. Re-attach the policy if needed and confirm rules
    appear in the evaluation log.
  example: |
    {
      "organization": {
        "kind": "mcp_policy_set",
        "mcp": {
          "enabled": true,
          "rules_loaded": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.organization.kind
      op: eq
      value: mcp_policy_set
    - field: properties.organization.mcp.enabled
      op: eq
      value: true
    - field: properties.organization.mcp.rules_loaded
      op: eq
      value: false
tests:
  - name: "MCP attached, no rules loaded — fires"
    verdict: VIOLATION
    asset:
      asset_id: "o-abc123def4"
      asset_type: aws_organization
      vendor: aws
      properties:
        organization:
          kind: mcp_policy_set
          mcp:
            enabled: true
            rules_loaded: false
  - name: "MCP attached with rules loaded — passes"
    verdict: PASS
    asset:
      asset_id: "o-abc123def4"
      asset_type: aws_organization
      vendor: aws
      properties:
        organization:
          kind: mcp_policy_set
          mcp:
            enabled: true
            rules_loaded: true
