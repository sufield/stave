dsl_version: ctrl.v1
id: CTL.CLOUDFRONT.ACCESS.SIGNED.LONG.EXPIRY.001
name: CloudFront Signed URL / Cookie Default Expiration Window Is Days or Weeks
description: >
  CloudFront distribution issues signed URLs or signed cookies
  whose default expiration window exceeds 24 hours (often
  days or weeks). The expiration timestamp is encoded into
  the signed URL itself; once issued, the URL stays valid
  until expiry regardless of subsequent revocation. A leaked
  long-lived signed URL grants access for days; the
  attacker doesn't need to maintain credentials, just
  retain the URL. Most signed-URL use cases tolerate
  expiration windows in minutes (single-page download) to
  hours (a viewing session). Days-or-weeks expiration is
  appropriate only for content meant to be widely
  distributable — at which point the signing requirement
  itself is questionable.
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "AC-3, IA-5, SC-12"
  fedramp_moderate: "AC-3, IA-5, SC-12"
  pci_dss_v4.0: "8.2, 8.3"
  soc2: "CC6.1, CC6.7"
  iso_27001_2022: "A.5.16, A.8.16"
  ccm_v4: ["IAM-13"]
scope_tags:
  - aws
  - cloudfront
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
remediation:
  description: >
    Default signed URL / cookie expiration window is too
    long; leaked URLs grant access for days.
  action: >
    Reduce the default expiration window in the application
    code that issues signed URLs to the minimum the use
    case allows (15 minutes for one-shot downloads, a few
    hours for streaming sessions). Issue per-request URLs
    rather than reusing them across viewing sessions. For
    use cases that genuinely need long-lived access (e.g.,
    podcast episodes, public-asset CDN content), reconsider
    whether signed URLs are the right primitive — public
    distribution may suit better, paired with rate limits
    and WAF.
  example: |
    {
      "cdn": {
        "kind": "distribution",
        "cloudfront": {
          "signed_url_default_expiry_seconds": 3600
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.cdn.kind
      op: eq
      value: distribution
    - field: properties.cdn.cloudfront.signed_url_default_expiry_seconds
      op: gt
      value: 86400
defect: >
  CloudFront signed URL / cookie default expiration window
  exceeds 24 hours.
infection: >
  Signed URLs and signed cookies encode the expiration
  timestamp into the signature itself. Once issued, the URL
  / cookie remains valid until that timestamp regardless
  of subsequent revocation, key rotation, or operator
  intent — there's no per-URL revocation primitive
  short of rotating the entire trusted-key-group key
  (which invalidates every URL signed by that key, not
  just the leaked one). A leaked long-lived signed URL
  is effectively a long-lived credential: the attacker
  doesn't need to maintain auth, just retain the URL.
  Signed URLs leak through normal channels — browser
  history, web access logs the URL appears in, share-
  link copy/paste in chat tools, screenshots. Each leak
  in a long-expiration scenario gives the attacker
  days-to-weeks of access; in a short-expiration
  scenario the leak is moot within minutes. Most use
  cases tolerate minutes-to-hours expiration; the
  default in many SDKs is hours-to-days because the
  default trades off operator convenience against
  security.
failure: >
  Long-lived URL credentials. Leaked signed URLs grant
  attacker access for days; revocation requires key
  rotation that invalidates legitimate URLs too.
tests:
  - name: 7-day expiration fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cloudfront::111122223333:distribution/E1ABCDEFG"
      asset_type: aws_cloudfront_distribution
      vendor: aws
      properties:
        cdn:
          kind: distribution
          cloudfront:
            signed_url_default_expiry_seconds: 604800
  - name: 1-hour expiration passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:cloudfront::111122223333:distribution/E1ABCDEFG"
      asset_type: aws_cloudfront_distribution
      vendor: aws
      properties:
        cdn:
          kind: distribution
          cloudfront:
            signed_url_default_expiry_seconds: 3600
