family: CTL.GCP.GKE
infection: >
  GKE clusters run containerized workloads with access to GCP
  services via service accounts. Public API servers expose the
  Kubernetes control plane. Legacy ABAC provides coarse authorization.
  Without Workload Identity, all pods on a node share the same GCP
  credentials via the metadata server at 169.254.169.254.
failure: >
  Kubernetes control plane or workload credential compromise. An
  attacker accesses the cluster API from the internet, exploits
  coarse ABAC policies, or obtains shared node credentials.
