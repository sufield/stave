control: CTL.IAM.PASSWORD.COMPLEXITY.001
defect: >
  The IAM account password policy does not require all four
  character types (uppercase, lowercase, numbers, symbols).
infection: >
  Each missing character type requirement reduces the effective
  keyspace. A password policy missing symbol requirements allows
  dictionary words with simple substitutions. Automated credential-
  stuffing and brute-force tools target accounts with weak password
  policies because the reduced keyspace makes attacks faster.
failure: >
  Weak password keyspace. User passwords are more vulnerable to
  brute-force and dictionary attacks because the policy permits
  low-complexity passwords.
