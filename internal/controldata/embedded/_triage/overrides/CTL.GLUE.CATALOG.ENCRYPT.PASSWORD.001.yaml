control: CTL.GLUE.CATALOG.ENCRYPT.PASSWORD.001
defect: >
  The Glue Data Catalog does not encrypt connection passwords at
  rest. JDBC passwords, Redshift credentials, and other data store
  authentication material are stored in plaintext.
infection: >
  An attacker with glue:GetConnection access retrieves the
  connection properties and extracts plaintext credentials. These
  credentials typically grant direct access to production databases
  (RDS, Redshift, Aurora) that the ETL pipeline connects to.
failure: >
  Database credential exposure via catalog. Plaintext connection
  passwords in the Glue catalog provide direct access to data
  stores, bypassing all other access controls.
