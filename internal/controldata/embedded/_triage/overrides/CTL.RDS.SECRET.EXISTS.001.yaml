control: CTL.RDS.SECRET.EXISTS.001
defect: >
  RDS instance does not have its credentials
  managed by Secrets Manager — either via the
  ManageMasterUserPassword integration or via
  a Secrets Manager secret tagged with the
  instance.
infection: >
  When the credential is not in Secrets Manager,
  it is somewhere — and that somewhere is
  invariably a worse place. The patterns
  observed in real fleets: application config
  files committed to git (the password is in
  the commit history forever, including in
  private-then-leaked-on-disgruntled-employee-
  exit repos), ECS task definitions where the
  Environment list shows the password in
  plaintext to anyone with
  ecs:DescribeTaskDefinition (a much broader
  set of principals than the secret-fetch IAM
  permission would be), Lambda environment
  variables visible in the CloudFormation
  console output and in any IAM principal with
  cloudformation:DescribeStacks rights, SSM
  Parameter Store with String type instead of
  SecureString (not encrypted at rest, not
  audited at access time), and source-code
  hardcoding ("we'll move it to Secrets
  Manager later"). Each storage location is a
  separate exposure surface; every application
  that connects holds its own copy of the
  credential; rotation requires updating every
  copy in every consumer, which in practice
  means rotation does not happen. Secrets
  Manager centralizes the credential, supports
  automatic rotation, logs every retrieval
  via CloudTrail, and integrates directly
  with the RDS Proxy authentication chain.
failure: >
  Unmanaged database credentials. Multiple
  copies in multiple places, no central
  rotation, no central audit. Compromise of any
  single copy yields permanent access until
  someone notices and triggers a manual
  rotation across every consumer.
