control: CTL.ELB.NETWORK.INTERNETFACING.PRIVATESUBNET.001
defect: >
  Internet-facing load balancer is deployed in private
  subnets without an internet gateway route.
infection: >
  An internet-facing load balancer needs public subnets
  — subnets with a route to an internet gateway — so
  the ALB's ENIs receive public IPs and are reachable
  from the internet. In private subnets: the ALB has
  no public IP, there's no route from the internet to
  the ALB, the ALB is unreachable despite the
  internet-facing scheme, and DNS resolves to private
  IPs that internet clients can't reach. This is a
  complete service failure for any application that
  expects internet traffic through this load balancer.
failure: >
  Internet-facing load balancer unreachable. Load
  balancer in private subnets has no internet route —
  external traffic can't reach it.
