control: CTL.SECRETS.REPLICA.ORPHAN.001
defect: >
  Secret replica persists after the primary has been
  deleted.
infection: >
  When a primary secret is deleted, replicas are NOT
  automatically deleted — they persist as standalone
  secrets with the last replicated credential value.
  The replica retains: the credential value (frozen at
  the last rotation before primary deletion), the
  resource policy (access control still grants
  GetSecretValue to permitted principals), and the
  encryption (KMS key in the replica region). The
  credential in the replica may still authenticate at
  the target service — the database password may still
  work even though the primary secret management was
  deleted. The replica is an orphaned credential cache
  with no lifecycle management.
failure: >
  Orphaned credential replica. Primary deleted but
  replica retains the credential value with no rotation
  or lifecycle management.
