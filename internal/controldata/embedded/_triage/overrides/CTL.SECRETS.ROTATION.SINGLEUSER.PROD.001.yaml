control: CTL.SECRETS.ROTATION.SINGLEUSER.PROD.001
defect: >
  Production secret uses single-user rotation strategy.
infection: >
  Single-user rotation changes the password for one
  database user. The rotation sequence: (1) generate new
  password, (2) update the database user's password, (3)
  store new password in the secret. Between steps 2 and 3,
  any caller that already retrieved the old password and
  tries to use it sees an authentication failure. Multi-user
  rotation avoids this entirely: two users (e.g., app_user,
  app_user_clone) take turns; the inactive user is rotated
  while the active user continues serving traffic. For
  production workloads, the no-downtime property of multi-
  user rotation is the difference between rotation being a
  routine operation and rotation causing transient errors.
failure: >
  Brief authentication-failure window during rotation.
  Production traffic experiences transient errors every
  rotation cycle.
