control: CTL.CLOUDFRONT.ORIGIN.S3.WEBSITE.001
defect: >
  CloudFront S3 origin points at the bucket's static-website
  endpoint instead of the REST API endpoint.
infection: >
  S3 buckets expose two distinct endpoints: the REST API
  endpoint (bucket.s3.region.amazonaws.com) and the static-
  website endpoint (bucket.s3-website-region.amazonaws.com)
  when website hosting is enabled. The two endpoints behave
  differently — the REST API endpoint speaks the standard
  S3 protocol and supports signed requests; the website
  endpoint serves like a web server with index docs, error
  docs, and HTTP-style routing, but it doesn't accept
  signed requests. Origin Access Control and the legacy
  Origin Access Identity both depend on signed requests to
  let CloudFront prove it's the legitimate caller; neither
  works with the website endpoint. Operators using the
  website endpoint either set the bucket to allow public
  access (so CloudFront can reach it without signing) or
  attempt to combine OAC with the website endpoint and find
  the signing is silently ineffective. The CloudFront
  access pattern collapses to public-bucket-fronted-by-
  CloudFront — anyone who finds the bucket's website
  hostname bypasses CloudFront entirely, hitting S3
  directly with no edge protections.
failure: >
  CloudFront becomes optional. The bucket is public and
  reachable directly via the website hostname; CloudFront's
  edge protections are bypassable.
