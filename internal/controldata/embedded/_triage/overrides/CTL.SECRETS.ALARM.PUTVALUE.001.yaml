control: CTL.SECRETS.ALARM.PUTVALUE.001
defect: >
  No CloudWatch alarm monitors PutSecretValue API calls.
infection: >
  PutSecretValue replaces the secret's credential value.
  When called outside of rotation (which also calls
  PutSecretValue internally): someone or something is
  changing the credential manually. This may be: an
  attacker replacing the password with one they control
  (credential takeover), automation that modifies
  credentials without going through rotation (bypassing
  rotation governance), or a developer updating a
  credential directly (skipping the rotation process).
  PutSecretValue outside of rotation should be rare and
  investigated. The alarm should distinguish
  rotation-initiated PutSecretValue (expected) from
  manual PutSecretValue (investigate).
failure: >
  Undetected credential modification. The secret's value
  was changed outside of rotation without notification.
