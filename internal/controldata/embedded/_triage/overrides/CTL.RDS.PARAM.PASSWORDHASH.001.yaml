control: CTL.RDS.PARAM.PASSWORDHASH.001
defect: >
  PostgreSQL RDS instance has password_encryption set to
  md5 in its parameter group instead of scram-sha-256.
infection: >
  PostgreSQL's md5 password storage is unsalted — the
  hash is a deterministic function of the password and
  the username only. Any pg_authid leak (a routine
  pg_dump that catches the system catalog, a replication
  snapshot picked up by a third-party tool, a
  cross-account snapshot share that was authorized
  before this control existed, an unencrypted automated
  backup — see CTL.RDS.ENCRYPT.BACKUP.001) is
  immediately attackable with a precomputed rainbow
  table built once for the username space the
  organization uses. The protocol-level exchange is
  worse: md5 authentication transmits the salted hash
  to the server, where "salted" means salted with a
  random 4-byte challenge that the attacker who
  captured a single MITM exchange can match against
  rainbow tables in seconds for short passwords.
  scram-sha-256 (RFC 5802 / RFC 7677, supported in
  PostgreSQL since 10) replaces both: the stored hash
  uses a per-user random salt and an iterated PBKDF
  (10000 rounds in libpq's default), and the
  authentication exchange is a challenge-response
  flow that never sends the password hash to the
  server in a form an attacker on the wire can
  precompute against. The parameter governs new and
  rotated passwords; existing md5 hashes upgrade on
  the next ALTER USER ... PASSWORD.
failure: >
  Catalog-level password compromise. Leaked pg_authid
  contents are convertible to plaintext credentials
  with public rainbow tables; live-wire captures of
  the auth handshake are similarly attackable.
