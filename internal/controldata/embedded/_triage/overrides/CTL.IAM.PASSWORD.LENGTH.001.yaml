control: CTL.IAM.PASSWORD.LENGTH.001
defect: >
  The IAM account password policy requires fewer than 14 characters
  minimum.
infection: >
  Modern GPU-based password cracking can exhaust short password
  spaces rapidly. An 8-character password with full complexity takes
  hours to crack; a 14-character password takes years. The minimum
  length is the single most impactful password policy setting.
failure: >
  Brute-force vulnerable passwords. Users can set passwords short
  enough to be cracked within practical timeframes.
