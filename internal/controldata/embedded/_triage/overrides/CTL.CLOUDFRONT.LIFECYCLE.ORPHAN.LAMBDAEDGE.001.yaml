control: CTL.CLOUDFRONT.LIFECYCLE.ORPHAN.LAMBDAEDGE.001
defect: >
  Lambda@Edge function is not associated with any CloudFront
  cache behavior.
infection: >
  Lambda@Edge functions execute at edge locations during
  viewer-request, origin-request, origin-response, or
  viewer-response triggers. They're associated with
  specific cache behaviors via LambdaFunctionAssociations
  pointing at versioned function ARNs. An unassociated
  Lambda@Edge function is inert: no traffic invokes it
  (zero invocation cost) but the function version persists
  in every edge location until edge replicas drain and the
  function is deleted. Drain plus delete typically takes
  hours to a day. Orphan Lambda@Edge functions accumulate
  in two ways: inventory clutter (every region's Lambda
  console shows them) and version pile-up (each refactor
  creates a new version, the old version often isn't
  cleaned). Over time, the orphan inventory grows and the
  cleanup-cost-vs-benefit ratio worsens.
failure: >
  Inventory and replica accumulation. Function exists in
  every edge location without serving traffic; cleanup
  delay means the orphan persists for hours-to-day after
  intent.
