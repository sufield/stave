control: CTL.S3.BUCKET.TAKEOVER.001
defect: >
  An external reference — DNS CNAME, CDN origin, package-
  manager install URL, application configuration — points at
  an S3 bucket that does not exist in AWS or is not owned by
  the referencing account. The bucket name is unclaimed;
  anyone can register it with `aws s3api create-bucket`.
infection: >
  An attacker claims the unclaimed bucket name and serves
  arbitrary content from it. Any downstream consumer following
  the reference — browsers resolving the CNAME, CDNs proxying
  the origin, package managers fetching install scripts —
  retrieves attacker content under a trusted-looking URL.
  Because the bucket's DNS and path appear legitimate
  (matching the original infrastructure), endpoint detection
  and user intuition both fail: the attacker's certificate
  validates, the hostname is familiar, the URL looks routine.
  Software-distribution takeover is the worst case: `curl |
  sh` style install commands execute attacker code.
failure: >
  Attacker-controlled content delivery under a trusted
  identity. Remediation is complex because affected downstream
  consumers may have cached or installed attacker-delivered
  artifacts during the exposure window; full recovery
  requires re-verifying installed software, rotating
  credentials potentially captured, and invalidating cached
  content across CDNs and browser caches.
