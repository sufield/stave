control: CTL.LAMBDA.SECRETS.NOTMANAGED.001
defect: >
  Lambda function holds credential-shaped
  environment variables (DB_PASSWORD, API_KEY,
  SECRET_TOKEN, OAUTH_*, AUTH_TOKEN, and
  similar) as raw values rather than as
  references to Secrets Manager ARNs or SSM
  Parameter Store SecureString parameters.
infection: >
  Raw credentials in env vars compound four
  exposure problems simultaneously. (1)
  Disclosure surface: the value is visible to
  every IAM principal with
  lambda:GetFunctionConfiguration, which is a
  much broader set than the secrets-fetch IAM
  permission would scope. (2) Version
  persistence: published Lambda versions are
  immutable snapshots of the function
  configuration including the env block, so
  the credential persists in every published
  version forever (see
  CTL.LAMBDA.ENV.VISIBLE.VERSIONS.001 for the
  matching catalog control). (3) Audit
  invisibility: CloudTrail logs the
  GetFunctionConfiguration call but not which
  env variables were read; "someone read this
  function's configuration" cannot be narrowed
  to "someone read the database password."
  (4) Rotation friction: rotating the live
  credential requires a function configuration
  update plus (for raw values) a published-
  version churn that retains the historical
  value, which is sufficient operational cost
  that rotation in practice happens rarely or
  never. Secrets Manager (and SSM
  SecureString) closes all four: centralized
  storage, automatic rotation, per-fetch
  CloudTrail audit under the calling identity,
  and no credential value in the function
  configuration. Distinct from
  CTL.LAMBDA.ENV.SECRETS.001 (pattern
  detection) — this control checks for the
  management alternative.
failure: >
  Static credential in function config. The
  credential is visible, unrotated, and
  persists in version history. Rotation cost
  is high enough that it does not actually
  happen.
