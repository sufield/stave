control: CTL.CODEBUILD.SECRETS.001
defect: >
  The CodeBuild project stores plaintext secrets (API keys, tokens,
  passwords) in PLAINTEXT environment variables. These values are
  visible in the AWS console, CLI output, CloudTrail logs, and build
  logs.
infection: >
  An attacker with codebuild:BatchGetProjects or CloudTrail read
  access retrieves the environment variables and extracts credentials.
  Build environment credentials typically grant access to source
  repositories, artifact stores, container registries, and deployment
  targets — the entire CI/CD supply chain.
failure: >
  Credential exposure via build configuration. Plaintext secrets in
  CodeBuild environment variables are accessible through multiple
  vectors and grant access to the CI/CD pipeline's upstream and
  downstream dependencies.
