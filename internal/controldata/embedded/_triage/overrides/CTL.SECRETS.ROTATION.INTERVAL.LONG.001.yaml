control: CTL.SECRETS.ROTATION.INTERVAL.LONG.001
defect: >
  Secret rotation interval is configured beyond the 90-day
  threshold.
infection: >
  Long rotation intervals extend the window during which a
  compromised credential remains valid. If the credential
  is exposed (committed to a repo, leaked in a log, captured
  by an SSRF vulnerability), the attacker has the rotation
  interval to use it before the next rotation. A 365-day
  interval gives a full year. Compliance frameworks
  generally require credentials to rotate within 90 days
  precisely because shorter intervals limit the blast radius
  of a credential compromise.
failure: >
  Extended credential validity window. A compromised
  credential remains valid for the full configured
  interval.
