control: CTL.GITHUB.REPO.SECRETSCAN.001
defect: >
  Repository does not have secret scanning enabled. Committed
  secrets are not detected.
infection: >
  Developers accidentally commit credentials more frequently than
  most organizations realize. AWS access keys, database passwords,
  API tokens, private keys, and connection strings end up in source
  code, configuration files, and documentation. Once committed, the
  secret persists in git history permanently — even if the file is
  deleted. Without secret scanning, these credentials sit undetected
  until an attacker finds them.
failure: >
  Credential exposure via source code. An attacker discovers
  committed credentials and uses them to access cloud resources,
  databases, APIs, or other systems.
