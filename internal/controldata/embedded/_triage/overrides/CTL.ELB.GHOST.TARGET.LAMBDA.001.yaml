control: CTL.ELB.GHOST.TARGET.LAMBDA.001
defect: >
  ELB Lambda target group references a deleted Lambda
  function.
infection: >
  ALB-to-Lambda integration uses a target group of type
  Lambda whose registered target is the function ARN.
  When the Lambda is deleted, the ALB still has the
  target registered. Every request the ALB forwards
  attempts to invoke the Lambda; the invocation fails
  with ResourceNotFoundException; the ALB returns 502
  Bad Gateway to the client. The target group's health
  check shows the target as unhealthy — but that signal
  is only visible if someone is watching it. Production
  traffic continues to fail.
failure: >
  Service outage on Lambda routes. Every request
  forwarded to the target group returns 502 because the
  Lambda function was deleted.
