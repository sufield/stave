control: CTL.CLOUDFRONT.CACHE.SETCOOKIE.001
defect: >
  CloudFront cache behavior caches responses with Set-Cookie
  headers without per-user partitioning.
infection: >
  Set-Cookie headers carry session tokens, CSRF tokens, and
  login state — they're the primary mechanism by which
  servers convey authentication and per-user identity to
  browsers. CloudFront caching is keyed by URL plus whatever
  the cache policy includes (specific headers, cookies,
  query strings). When the cache key doesn't include the
  per-user identifier (the user's existing session cookie,
  the Authorization header, the signed cookie), one user's
  response — including their Set-Cookie — gets cached and
  served to anyone else requesting the same path. The next
  user receives the first user's session: their browser
  stores the first user's cookies and authenticates as that
  user on subsequent requests. The pattern is the most
  common cross-user cache leakage shape on authenticated
  paths. The fix is to disable caching on authenticated
  routes (the cleanest pattern) or to partition cache keys
  by cookie / Authorization / signed-cookie value (the
  more complex pattern that needs careful auditing).
failure: >
  Cross-user session theft. One user's Set-Cookie is served
  to others; the receiver's browser authenticates as the
  original user.
