control: CTL.SECRETS.ALARM.DELETE.001
defect: >
  No CloudWatch alarm monitors DeleteSecret API calls.
infection: >
  DeleteSecret schedules the secret for permanent deletion
  with a recovery window (7-30 days). During this window,
  GetSecretValue fails — every Lambda function, ECS task,
  RDS Proxy, and application that retrieves this credential
  fails. Without an alarm: the deletion is invisible until
  dependent services start failing. A scheduled deletion on
  Friday evening causes service failures over the weekend
  — nobody is notified until Monday. RestoreSecret can
  reverse the deletion during the recovery window, but only
  if someone knows it happened. The alarm provides
  seconds-to-minutes notification.
failure: >
  Undetected secret deletion. Credential scheduled for
  permanent deletion without notification. Dependent
  services fail.
