control: CTL.ELASTICACHE.ENCRYPT.REST.001
defect: >
  ElastiCache Redis cluster does not have at-rest encryption enabled. Cached data is stored in plaintext.
infection: >
  Session tokens, cached credentials, and application state stored in the cluster are accessible without decryption to anyone who gains access to the underlying storage or backup snapshots.
failure: >
  Cache data exposure. Sensitive data in ElastiCache is stored unencrypted at rest.
