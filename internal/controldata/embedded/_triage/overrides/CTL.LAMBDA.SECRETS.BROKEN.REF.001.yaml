control: CTL.LAMBDA.SECRETS.BROKEN.REF.001
defect: >
  Lambda function has an environment variable
  containing a Secrets Manager ARN or SSM
  Parameter Store name, but the function's
  execution role does not grant the appropriate
  fetch action (secretsmanager:GetSecretValue
  or ssm:GetParameter) on the referenced
  resource.
infection: >
  The function is configured to retrieve
  credentials from a managed secrets service —
  the env var carries the ARN, the application
  code calls GetSecretValue with that ARN — and
  the call fails with AccessDeniedException at
  runtime. The function then either crashes
  (when it does not handle the error path) or
  operates in a degraded mode (when it falls
  back to a default credential, skips the
  credential-using operation, or serves stale
  cached state). The failure is consistent
  across every cold start because the
  permission is the missing piece, not the
  reference. The pattern is almost always a
  deployment misconfiguration, and the most
  common origins are: an IaC split across
  teams where the secret was created and the
  env var was wired but the IAM-policy update
  belonged to a different team's pipeline that
  never ran; a refactor where the secret ARN
  changed (rotation that produced a new
  resource name; account migration; rename of
  the secret) without an accompanying policy
  update; and a policy scoped to a wildcard
  that intentionally excluded this specific
  secret. Cross-resource reasoning detects
  this: the env var references are joined
  against role policy grants to find the
  mismatch.
failure: >
  Runtime credential failure on every cold
  start. Crash or degraded mode depending on
  the function's error handling; no warning
  before the first invocation discovers the
  permission gap.
