control: CTL.LAMBDA.ENV.KMS.EXTERNAL.001
defect: >
  Lambda function uses a KMS key owned by an
  AWS account other than the function's own (or
  outside the team's organizational boundary)
  for environment-variable encryption.
infection: >
  The external account holds key-policy
  authority. Three concrete capabilities follow
  from that. (1) The external owner can disable
  the key — every cold-start KMS:Decrypt fails
  and the function stops initializing on the
  next execution-environment provision. (2) The
  external owner can schedule the key for
  deletion — the failure becomes permanent at
  the deletion date, and (within the 7-30 day
  pending-deletion window) the function-owner
  team has limited time to migrate. (3) The
  external owner can modify the key policy at
  any time to revoke this account's decrypt
  rights — the function silently begins
  failing without any change in this account's
  configuration. The function's continued
  operation therefore depends on a relationship
  the function-owner team does not control.
  Same architectural pattern that
  CTL.S3.ENCRYPT.KMS.OWNERSHIP.001 catches on
  S3 buckets and the RDS external-key concept
  catches on databases: encryption is in place,
  but the key-control plane is outside the
  team's organizational boundary. Most common
  origins are partner-account integrations
  where the partner's CMK was reused for
  convenience, account migrations where the
  function moved without re-pointing at a same-
  account key, and IaC modules copied across
  accounts that did not refresh the KMS
  reference.
failure: >
  Function operation contingent on an external
  account. Disable, delete, or policy-modify by
  the key owner breaks the function with no
  recourse on this side.
