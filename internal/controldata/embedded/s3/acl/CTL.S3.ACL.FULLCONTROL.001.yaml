dsl_version: ctrl.v1
id: CTL.S3.ACL.FULLCONTROL.001
name: No FULL_CONTROL ACL Grants to Public
description: >
  S3 bucket ACLs must not grant FULL_CONTROL to AllUsers or
  AuthenticatedUsers. FULL_CONTROL is the worst-case ACL
  misconfiguration — the grantee can read, write, and delete
  objects and modify the ACL itself.
domain: exposure
exposure:
  type: acl_full_control
  principal_scope: public
severity: critical
compliance:
  nist_800_53_r5: "AC-3"
  ccm_v4: ["DSP-17", "IAM-16"]
scope_tags: [aws, s3]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_bucket
params:
  attack_stage: initial_access
remediation:
  description: >
    Bucket ACL grants FULL_CONTROL to AllUsers or AuthenticatedUsers.
    This grants complete control including object read/write/delete
    and ACL modification.
  action: >
    Replace the bucket ACL with "BucketOwnerFullControl" or remove
    the FULL_CONTROL grant to public groups. Enable S3 Public Access
    Block with BlockPublicAcls and IgnorePublicAcls set to true.
  example: |
    {
      "storage": {
        "access": {
          "has_full_control_public": false,
          "has_full_control_authenticated": false
        }
      }
    }
unsafe_predicate_alias: s3.has_full_control_grant
alternatives:
  - tool: prowler
    check_id: s3_bucket_public_list_acl
    coverage: covered
    note: >-
      Stave splits ACL-list detection across public-list composite, READ_ACP (recon),
      and FULL_CONTROL paths.
  - tool: prowler
    check_id: s3_bucket_public_write_acl
    coverage: covered
    note: >-
      Stave splits ACL-write detection across public-write composite, FULL_CONTROL
      grants, and WRITE_ACP (escalation) grants.
