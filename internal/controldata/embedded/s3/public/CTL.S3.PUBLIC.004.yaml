dsl_version: ctrl.v1
id: CTL.S3.PUBLIC.004
name: No Public Read via Bucket Policy
description: >
  S3 bucket policies must not grant read access to an anonymous or
  wildcard principal. A Statement with Effect Allow, Principal "*"
  or AWS: "*", and an Action such as s3:GetObject without a
  restricting Condition enables any unauthenticated caller to read
  objects. This is distinct from CTL.S3.PUBLIC.001, which fires on
  the composite public_read signal regardless of mechanism; this
  control narrows to the bucket-policy path so the finding points
  the operator at the policy specifically. For ACL-based public
  read, see CTL.S3.ACL.FULLCONTROL.001 (FULL_CONTROL grants) and
  CTL.S3.ACL.ESCALATION.001 (WRITE_ACP grants).
compliance:
  ccm_v4: ["DSP-07", "DSP-17"]
domain: storage
exposure:
  type: policy_public_read
  principal_scope: public
severity: medium
scope_tags:
- aws
- s3
taxonomy:
  - identity-perimeter
  - network-perimeter
  - trust-boundary
version: ctrl.v1
type: unsafe_duration
classification: aggregate_check
applicable_asset_types:
  - aws_s3_bucket
params:
  attack_stage: initial_access
  max_unsafe_duration: 0h
remediation:
  description: >
    Bucket policy grants s3:GetObject, s3:GetObjectAcl, or equivalent
    read action to an anonymous or wildcard principal. Any
    unauthenticated caller can read objects.
  action: >
    Remove or constrain the policy statement granting read actions to
    Principal "*" or AWS: "*". If broad read access is genuinely
    required, add a restricting Condition on aws:PrincipalOrgID,
    aws:SourceVpc, or a fixed aws:SourceIp CIDR. Enable S3 Public
    Access Block with BlockPublicPolicy set to true to reject future
    policies that grant public read.
  example: |
    {
      "storage": {
        "access": {
          "read_via_resource": false
        }
      }
    }
unsafe_predicate:
  any:
  - field: properties.storage.access.read_via_resource
    op: eq
    value: true
alternatives:
  - tool: prowler
    check_id: s3_bucket_public_access
    coverage: covered
    note: >-
      Stave splits public-access detection across composite, policy, and
      effective-public views; union covers Prowler.
