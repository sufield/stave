dsl_version: ctrl.v1
id: CTL.S3.PAB.IGNOREPUBLICACLS.001
name: S3 Bucket Ignore Public ACLs Flag Must Be Enabled
description: >
  The `IgnorePublicAcls` flag of the bucket's Public Access Block
  configuration causes S3 to disregard any existing ACL grant that
  would make the bucket or its objects publicly accessible, even if
  the grant is already in place. When this specific flag is `false`,
  historical ACL grants to `AllUsers` or `AuthenticatedUsers` stay
  effective — enabling `BlockPublicAcls` alone does not neutralize
  grants that were made before the flag was enabled. The umbrella
  `CTL.S3.CONTROLS.001` fires when any of the four PAB flags is off;
  this control narrows the finding to the specific flag so the
  operator knows that the fix is not "block new ACLs" but "ignore
  the ones already there." Prowler and ScoutSuite both report the
  four flags independently.
domain: exposure
severity: high
compliance:
  cis_aws_v1.4.0: "2.1.5"
  cis_aws_v3.0: "2.1.4"
  pci_dss_v3.2.1: "1.3.6"
  soc2: "CC6.1"
  pci_dss_v4.0: "2.2.1"
  nist_800_53_r5: "AC-3"
  fedramp_moderate: "AC-3"
  gdpr: "Art.32"
  ffiec: "ISH-4"
  iso_27001_2022: "A.8.3"
  nist_csf_2.0: "PR.PS"
  ccm_v4: ["DSP-07", "DSP-17"]
  owasp_subtractive: "S08"
  subtractive_tier: "deletion"
scope_tags:
  - aws
  - s3
taxonomy:
  - compliance-mapping
  - network-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_bucket
params:
  attack_stage: initial_access
remediation:
  description: >
    The bucket's `IgnorePublicAcls` PAB flag is disabled. Any
    pre-existing public ACL grants on the bucket or its objects
    remain effective; enabling `BlockPublicAcls` alone does not
    retroactively disarm them.
  action: >
    Enable the `IgnorePublicAcls` flag on the bucket's Public Access
    Block configuration. Pair it with `BlockPublicAcls` for full
    ACL-path coverage — the pair prevents new public ACL grants and
    neutralizes existing ones.
  example: |
    {
      "storage": {
        "kind": "bucket",
        "controls": {
          "public_access_block": {
            "ignore_public_acls": true
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.controls.public_access_block.ignore_public_acls
      op: eq
      value: false
alternatives:
  - tool: prowler
    check_id: s3_bucket_level_public_access_block
    coverage: covered
    note: Stave umbrella requires all 4 flags vs Prowler's 2; per-flag controls give actionable remediation.
