dsl_version: ctrl.v1
id: CTL.S3.PAB.BLOCKPUBLICPOLICY.001
name: S3 Bucket Block Public Policy Flag Must Be Enabled
description: >
  The `BlockPublicPolicy` flag of the bucket's Public Access Block
  configuration rejects any new bucket-policy update that would
  evaluate as public under AWS `PolicyStatus.IsPublic`. When this
  specific flag is `false`, a `PutBucketPolicy` call with `Principal:
  "*"` and no restricting Condition succeeds rather than being
  rejected at the API boundary. The umbrella `CTL.S3.CONTROLS.001`
  fires when any of the four PAB flags is off; this control narrows
  the finding to the specific flag so remediation targets the
  policy-write path rather than the full PAB tuple. Prowler and
  ScoutSuite both report the four flags independently.
domain: exposure
severity: high
compliance:
  cis_aws_v1.4.0: "2.1.5"
  cis_aws_v3.0: "2.1.4"
  pci_dss_v3.2.1: "1.3.6"
  soc2: "CC6.1"
  pci_dss_v4.0: "2.2.1"
  nist_800_53_r5: "AC-3"
  fedramp_moderate: "AC-3"
  gdpr: "Art.32"
  ffiec: "ISH-4"
  iso_27001_2022: "A.8.3"
  nist_csf_2.0: "PR.PS"
  ccm_v4: ["DSP-07", "DSP-17"]
  owasp_subtractive: "S08"
  subtractive_tier: "deletion"
scope_tags:
  - aws
  - s3
taxonomy:
  - compliance-mapping
  - network-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_bucket
params:
  attack_stage: initial_access
remediation:
  description: >
    The bucket's `BlockPublicPolicy` PAB flag is disabled. New
    `PutBucketPolicy` calls that grant `Principal: "*"` without a
    restricting Condition will succeed rather than being blocked at
    the API boundary.
  action: >
    Enable the `BlockPublicPolicy` flag on the bucket's Public Access
    Block configuration. Preserve the other three flag values so
    enabling this one doesn't silently disable the others.
  example: |
    {
      "storage": {
        "kind": "bucket",
        "controls": {
          "public_access_block": {
            "block_public_policy": true
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.controls.public_access_block.block_public_policy
      op: eq
      value: false
alternatives:
  - tool: prowler
    check_id: s3_bucket_level_public_access_block
    coverage: covered
    note: Stave umbrella requires all 4 flags vs Prowler's 2; per-flag controls give actionable remediation.
