dsl_version: ctrl.v1
id: CTL.S3.PERIMETER.CONFUSEDDEPUTY.001
name: S3 Bucket Service Principal Grant Without SourceOrgID
description: >
  S3 bucket policy grants access to an AWS service principal (e.g.,
  cloudtrail.amazonaws.com, logging.s3.amazonaws.com) without an
  aws:SourceOrgID condition. Without the confused deputy dimension of
  the data perimeter, the service principal can write to or read from
  the bucket on behalf of any AWS account — not just accounts in the
  organization. An attacker who controls a different AWS account can
  configure the same service to deliver data to the victim's bucket
  (write path) or request data through the service on the victim's
  behalf (read path). aws:SourceOrgID restricts service-principal
  grants to requests originating from accounts within the specified
  organization. This is distinct from aws:SourceAccount (single
  account) and sts:ExternalId (third-party roles) — SourceOrgID
  scales across the entire organization without per-account updates.
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["IAM-05"]
scope_tags:
  - aws
  - s3
taxonomy:
  - confused-deputy
  - logging
  - trust-boundary
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_bucket
params:
  attack_stage: initial_access
  base_impact: 6
  blast_radius:
    type: prevention
    scope: resource
    multiplier: 1.0
observation_fields:
  - storage.kind
  - storage.access.has_service_principal_grant
  - storage.perimeter.confused_deputy_enforced
remediation:
  description: >
    S3 bucket policy grants access to an AWS service principal without
    aws:SourceOrgID. The service can act on behalf of accounts outside
    the organization — the confused deputy dimension of the data
    perimeter is missing.
  action: >
    Add an aws:SourceOrgID condition to all service-principal Allow
    statements: {"StringEquals": {"aws:SourceOrgID": "o-exampleorgid"}}.
    For services that also support aws:SourceAccount (CloudTrail, Config,
    ELB access logs), SourceOrgID is preferred because it covers all
    accounts in the org without enumeration. For services that do not
    support SourceOrgID, fall back to aws:SourceAccount with explicit
    account IDs.
  example: |
    {
      "storage": {
        "kind": "bucket",
        "access": {
          "has_service_principal_grant": true
        },
        "perimeter": {
          "confused_deputy_enforced": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.access.has_service_principal_grant
      op: present
    - field: properties.storage.access.has_service_principal_grant
      op: eq
      value: true
    - field: properties.storage.perimeter.confused_deputy_enforced
      op: ne
      value: true
tests:
  - name: "service principal grant without SourceOrgID — fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:s3:::cloudtrail-logs"
      asset_type: aws_s3_bucket
      vendor: aws
      properties:
        storage:
          kind: bucket
          access:
            has_service_principal_grant: true
          perimeter:
            confused_deputy_enforced: false
  - name: "service principal grant with SourceOrgID — passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:s3:::cloudtrail-logs"
      asset_type: aws_s3_bucket
      vendor: aws
      properties:
        storage:
          kind: bucket
          access:
            has_service_principal_grant: true
          perimeter:
            confused_deputy_enforced: true
  - name: "no service principal grant — passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:s3:::app-data"
      asset_type: aws_s3_bucket
      vendor: aws
      properties:
        storage:
          kind: bucket
          access:
            has_service_principal_grant: false
          perimeter:
            confused_deputy_enforced: false
