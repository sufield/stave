dsl_version: ctrl.v1
id: CTL.S3.GLACIER.RESTORE.WINDOW.001
name: "Glacier Restore Window Exceeds Acceptable Duration"
description: >
  Glacier restore window exceeds 7 days. Extended restore windows leave
  formerly-archived data in a standard-accessible state longer than
  necessary. The restore window should be the minimum duration required
  for the restore purpose.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "A1.2"
  ccm_v4: ["DSP-17"]
scope_tags:
  - aws
  - s3
taxonomy:
  - compliance-mapping
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_bucket
params:
  attack_stage: collection
observation_fields:
  - storage.kind
  - storage.glacier.restore_window_excessive
remediation:
  description: >
    Glacier restore window is longer than 7 days, leaving archived data
    accessible longer than necessary.
  action: >
    Reduce the Glacier restore window to the minimum duration required.
    Use 1-3 day restore windows for operational restores. Extended
    restore windows leave archived data in a standard-accessible state
    unnecessarily.
  example: |
    {
      "storage": {
        "kind": "bucket",
        "glacier": {
          "restore_window_excessive": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.glacier.restore_window_excessive
      op: eq
      value: true
tests:
  - name: bucket with excessive glacier restore window fires
    verdict: VIOLATION
    asset:
      asset_id: arn:aws:s3:::prod-archive-primary
      asset_type: aws_s3_bucket
      vendor: aws
      properties:
        storage:
          kind: bucket
          glacier:
            restore_window_excessive: true
  - name: bucket with acceptable glacier restore window passes
    verdict: PASS
    asset:
      asset_id: arn:aws:s3:::prod-archive-safe
      asset_type: aws_s3_bucket
      vendor: aws
      properties:
        storage:
          kind: bucket
          glacier:
            restore_window_excessive: false
