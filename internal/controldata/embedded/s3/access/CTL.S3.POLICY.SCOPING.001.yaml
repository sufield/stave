dsl_version: ctrl.v1
id: CTL.S3.POLICY.SCOPING.001
name: Non-Narrow Bucket Policy Grants Must Carry a Scoping Condition
description: >
  S3 bucket policies with Allow statements whose Principal is non-narrow
  (`Principal: "*"`, `Principal: {"AWS": "*"}`, or an Allow block with no
  Principal) should constrain every such statement with at least one
  scoping Condition: `aws:PrincipalOrgID`, `aws:SourceVpc`, `aws:SourceIp`
  with a fixed CIDR, or `aws:SourceArn`. Without a scoping Condition, the
  effective principal set is the full internet (anonymous) or every AWS
  account on Earth (`AWS: "*"`). Scoping Conditions do not fix the name
  of the principal but they collapse the reachable principal set to
  callers routed through a known org, VPC, IP range, or service — a
  posture hardening step that prevents a future policy edit from
  silently expanding exposure. This control does not fire on buckets
  with no policy, nor on buckets whose Allow statements all name
  specific accounts or role ARNs; both states are captured by
  `policy_has_scoping_condition` being absent or null.
domain: governance
severity: medium
compliance:
  nist_800_53_r5: "AC-3"
  hipaa: "164.312(a)(1)"
  soc2: "CC6.1"
  ccm_v4: ["DSP-07", "DSP-17", "IAM-16"]
scope_tags:
  - aws
  - s3
taxonomy:
  - compliance-mapping
  - identity-perimeter
  - network-perimeter
subtractive_category:
  - S03
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_bucket
params:
  attack_stage: initial_access
remediation:
  description: >
    Bucket policy contains at least one Allow statement with a non-narrow
    principal and no scoping Condition. Any caller whose request reaches
    the S3 API can exercise that statement. This is a posture weakness
    rather than active exposure — when paired with a wildcard action or
    an over-broad action set, it becomes the exposure path other
    controls report.
  action: >
    For every Allow statement with `Principal: "*"`, `Principal: {"AWS": "*"}`,
    or no Principal block, add a Condition that binds the request to a
    fixed value: `aws:PrincipalOrgID` to limit to the organization,
    `aws:SourceVpc` to limit to a VPC endpoint, `aws:SourceIp` with a CIDR
    to limit to a known range, or `aws:SourceArn` to limit to a specific
    caller. If the statement is supposed to be globally reachable (CDN
    origin, public data distribution), replace the bucket policy grant
    with a narrower mechanism — Origin Access Control, Access Points,
    or signed URLs.
  example: |
    {
      "storage": {
        "kind": "bucket",
        "access": {
          "policy_has_scoping_condition": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.access.policy_has_scoping_condition
      op: present
      value: true
    - field: properties.storage.access.policy_has_scoping_condition
      op: eq
      value: false
