dsl_version: ctrl.v1
id: CTL.S3.MRAP.POLICY.BROADGRANT.001
name: MRAP Policy Has Broad Non-Service-Principal Grant
description: >
  The Multi-Region Access Point resource policy grants access
  to a non-service principal without a restricting condition.
  This includes Principal "*" or {"AWS": "*"} with no Condition,
  or an external IAM principal ARN with no scoping condition
  (aws:PrincipalOrgID, aws:SourceVpc, aws:SourceArn, etc.).
  Service-principal statements (cloudfront.amazonaws.com) are
  excluded — those are the OAC controls' domain. The MRAP
  policy is evaluated independently of bucket policies, so a
  broad grant here creates an access path regardless of bucket
  policy restrictions.
domain: exposure
exposure:
  type: public_read
  principal_scope: public
severity: critical
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["DCS-07", "IAM-16", "IVS-03"]
scope_tags:
  - aws
  - s3
taxonomy:
  - identity-perimeter
  - network-perimeter
subtractive_category:
  - S03
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_multi_region_access_point
params:
  attack_stage: initial_access
remediation:
  description: >
    MRAP policy has a broad grant to a non-service principal.
  action: >
    Remove the wildcard or unconditioned principal grant. If
    external access is required, scope the grant with a
    Condition on aws:PrincipalOrgID, aws:SourceVpc, or
    aws:PrincipalArn. For CloudFront access, use OAC with the
    service principal pattern instead of direct IAM grants.
  example: |
    {
      "storage": {
        "mrap": {
          "kind": "multi_region_access_point",
          "policy": {
            "has_broad_non_service_grant": false
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.mrap.kind
      op: eq
      value: multi_region_access_point
    - field: properties.storage.mrap.policy.has_broad_non_service_grant
      op: eq
      value: true
tests:
  - name: wildcard principal fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:s3::111122223333:accesspoint/mymrap.mrap"
      asset_type: aws_s3_multi_region_access_point
      vendor: aws
      properties:
        storage:
          mrap:
            kind: multi_region_access_point
            policy:
              cloudfront_service_grant:
                present: false
                condition_enforced: false
                source_arn_foreign_account: false
              has_broad_non_service_grant: true
              has_migration_residue: false
  - name: no broad grant passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:s3::111122223333:accesspoint/mymrap.mrap"
      asset_type: aws_s3_multi_region_access_point
      vendor: aws
      properties:
        storage:
          mrap:
            kind: multi_region_access_point
            policy:
              cloudfront_service_grant:
                present: false
                condition_enforced: false
                source_arn_foreign_account: false
              has_broad_non_service_grant: false
              has_migration_residue: false
  - name: service principal grant does not fire this control
    verdict: PASS
    asset:
      asset_id: "arn:aws:s3::111122223333:accesspoint/mymrap.mrap"
      asset_type: aws_s3_multi_region_access_point
      vendor: aws
      properties:
        storage:
          mrap:
            kind: multi_region_access_point
            policy:
              cloudfront_service_grant:
                present: true
                condition_enforced: false
                source_arn_foreign_account: false
              has_broad_non_service_grant: false
              has_migration_residue: false
