dsl_version: ctrl.v1
id: CTL.S3.MRAP.POLICY.OAC.NOCONDITION.001
name: MRAP CloudFront Grant Missing aws:SourceArn Condition
description: >
  The Multi-Region Access Point resource policy grants the
  cloudfront.amazonaws.com service principal without the
  documented aws:SourceArn restricting condition. Without
  the condition any CloudFront distribution in any account
  can read through this MRAP — a confused-deputy vector.
  The AWS developer guide prescribes StringEquals on
  aws:SourceArn with the owning distribution's ARN.
domain: exposure
exposure:
  type: confused_deputy
  principal_scope: authenticated
severity: high
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["IAM-16", "IVS-03"]
scope_tags:
  - aws
  - s3
taxonomy:
  - identity-perimeter
  - confused-deputy
subtractive_category:
  - S03
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_multi_region_access_point
params:
  attack_stage: initial_access
remediation:
  description: >
    MRAP policy grants CloudFront without a restricting condition.
  action: >
    Add a Condition block with StringEquals on aws:SourceArn
    pointing to the specific CloudFront distribution ARN
    (arn:aws:cloudfront::ACCOUNT:distribution/DIST_ID). Use the
    SigV4a signing protocol for the OAC origin configuration.
  example: |
    {
      "storage": {
        "mrap": {
          "kind": "multi_region_access_point",
          "policy": {
            "cloudfront_service_grant": {
              "present": true,
              "condition_enforced": true
            }
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.mrap.kind
      op: eq
      value: multi_region_access_point
    - field: properties.storage.mrap.policy.cloudfront_service_grant.present
      op: eq
      value: true
    - field: properties.storage.mrap.policy.cloudfront_service_grant.condition_enforced
      op: eq
      value: false
tests:
  - name: cloudfront grant without condition fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:s3::111122223333:accesspoint/mymrap.mrap"
      asset_type: aws_s3_multi_region_access_point
      vendor: aws
      properties:
        storage:
          mrap:
            kind: multi_region_access_point
            policy:
              cloudfront_service_grant:
                present: true
                condition_enforced: false
                source_arn_foreign_account: false
              has_broad_non_service_grant: false
              has_migration_residue: false
  - name: cloudfront grant with condition passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:s3::111122223333:accesspoint/mymrap.mrap"
      asset_type: aws_s3_multi_region_access_point
      vendor: aws
      properties:
        storage:
          mrap:
            kind: multi_region_access_point
            policy:
              cloudfront_service_grant:
                present: true
                condition_enforced: true
                source_arn_foreign_account: false
              has_broad_non_service_grant: false
              has_migration_residue: false
  - name: no cloudfront grant passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:s3::111122223333:accesspoint/mymrap.mrap"
      asset_type: aws_s3_multi_region_access_point
      vendor: aws
      properties:
        storage:
          mrap:
            kind: multi_region_access_point
            policy:
              cloudfront_service_grant:
                present: false
                condition_enforced: false
                source_arn_foreign_account: false
              has_broad_non_service_grant: false
              has_migration_residue: false
