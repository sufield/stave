dsl_version: ctrl.v1
id: CTL.S3.MRAP.POLICY.MIGRATION.RESIDUE.001
name: MRAP Policy Has Both OAC and Legacy Role Grants
description: >
  The MRAP policy contains both a CloudFront service-principal
  Allow (the OAC pattern) and a non-service-principal IAM
  role/user Allow over overlapping actions (s3:GetObject or
  s3:*). This indicates a Lambda@Edge-era grant left beside a
  newer OAC grant. Lambda@Edge origin request triggers are
  incompatible with SigV4a OAC (per the CloudFront developer
  guide), so the role grant is residual and can be removed.
  Informational — the extra grant does not create a new
  exposure, but it widens the attack surface unnecessarily.
domain: governance
severity: low
compliance:
  nist_800_53_r5: "CM-3"
  soc2: "CC8.1"
scope_tags:
  - aws
  - s3
taxonomy:
  - compliance-mapping
subtractive_category:
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_multi_region_access_point
params:
  attack_stage: persistence
remediation:
  description: >
    MRAP policy carries both OAC and legacy role grants.
  action: >
    Remove the IAM role/user Allow statement that overlaps
    with the CloudFront OAC grant. The OAC service-principal
    path supersedes Lambda@Edge role-based access for the
    same actions.
  example: |
    {
      "storage": {
        "mrap": {
          "kind": "multi_region_access_point",
          "policy": {
            "has_migration_residue": false
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.mrap.kind
      op: eq
      value: multi_region_access_point
    - field: properties.storage.mrap.policy.has_migration_residue
      op: eq
      value: true
tests:
  - name: both OAC and role grant fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:s3::111122223333:accesspoint/mymrap.mrap"
      asset_type: aws_s3_multi_region_access_point
      vendor: aws
      properties:
        storage:
          mrap:
            kind: multi_region_access_point
            policy:
              cloudfront_service_grant:
                present: true
                condition_enforced: true
                source_arn_foreign_account: false
              has_broad_non_service_grant: false
              has_migration_residue: true
  - name: OAC only passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:s3::111122223333:accesspoint/mymrap.mrap"
      asset_type: aws_s3_multi_region_access_point
      vendor: aws
      properties:
        storage:
          mrap:
            kind: multi_region_access_point
            policy:
              cloudfront_service_grant:
                present: true
                condition_enforced: true
                source_arn_foreign_account: false
              has_broad_non_service_grant: false
              has_migration_residue: false
  - name: no OAC grant passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:s3::111122223333:accesspoint/mymrap.mrap"
      asset_type: aws_s3_multi_region_access_point
      vendor: aws
      properties:
        storage:
          mrap:
            kind: multi_region_access_point
            policy:
              cloudfront_service_grant:
                present: false
                condition_enforced: false
                source_arn_foreign_account: false
              has_broad_non_service_grant: false
              has_migration_residue: false
