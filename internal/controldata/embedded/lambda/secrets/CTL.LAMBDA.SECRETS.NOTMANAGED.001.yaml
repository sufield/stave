dsl_version: ctrl.v1
id: CTL.LAMBDA.SECRETS.NOTMANAGED.001
name: Lambda Functions Must Manage Credentials via Secrets Manager or SSM SecureString
description: >
  Lambda functions that hold credential-shaped environment
  variables (DB_PASSWORD, API_KEY, SECRET_TOKEN, OAUTH_*,
  AUTH_TOKEN, and similar) must reference those values
  through Secrets Manager ARNs or SSM Parameter Store
  SecureString parameters at runtime, not store them as
  raw values in the function's environment block. Raw
  credentials in env vars are visible to any principal
  with `lambda:GetFunctionConfiguration` (a much broader
  set than the secrets-fetch IAM permission would be),
  persist immutably in every published function version
  (rotating the live credential leaves the old value in
  every historical version snapshot — see
  CTL.LAMBDA.ENV.VISIBLE.VERSIONS.001), are not
  CloudTrail-audited at the read level (only function-
  configuration reads are logged, not env var reads), and
  do not rotate without a function configuration update
  (which means rotation in practice happens rarely or
  never). Secrets Manager (and SSM SecureString)
  centralizes the credential, supports automatic rotation,
  logs every retrieval via CloudTrail with the IAM
  identity that fetched it, and keeps the credential
  value out of the function configuration entirely.
  Distinct from CTL.LAMBDA.ENV.SECRETS.001, which detects
  the pattern; this control checks for the management
  alternative.
domain: secrets
severity: high
compliance:
  owasp_nhi: "NHI2, NHI9"
  nist_800_53_r5: "IA-5"
  pci_dss_v4: "8.2"
  hipaa: "164.312(d)"
  ccm_v4: ["IAM-02", "CEK-05"]
scope_tags: [aws, lambda]
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - logging
subtractive_category:
  - S07
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_lambda_function
params:
  attack_stage: credential_access
remediation:
  description: Lambda function holds raw credentials in environment variables.
  action: Move the credentials to Secrets Manager or SSM SecureString; reference the ARN from the env var; remove the raw values.
  example: |
    {"compute": {"kind": "function", "function": {"env_has_raw_credentials": false, "uses_secrets_manager": true}}}
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: function
    - field: properties.compute.function.env_has_raw_credentials
      op: eq
      value: true
    - field: properties.compute.function.uses_secrets_manager
      op: eq
      value: false
