dsl_version: ctrl.v1
id: CTL.LAMBDA.LOG.ENCRYPT.001
name: Lambda CloudWatch Log Group Not Encrypted with CMK
description: >
  Lambda function CloudWatch log groups must be encrypted
  with a customer-managed KMS key. Log groups are
  encrypted by default with the CloudWatch service key,
  but a CMK provides explicit key policy control,
  CloudTrail-level audit on key use, and revocation
  capability. Lambda logs frequently contain sensitive
  data — request and response payloads, error stacks
  with PII, debug output that captures credentials. The
  service key cannot be revoked, has no caller-specific
  audit, and is shared across the account; a CMK is the
  only way to limit log access to specific principals
  and to detect anomalous access via CloudTrail key
  events.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "AU-9"
  fedramp_moderate: "AU-9"
  pci_dss_v4.0: "10.3.2"
  hipaa: "164.312(a)(2)(iv)"
  soc2: "CC6.1"
  ccm_v4: ["LOG-12", "CEK-03"]
scope_tags:
  - aws
  - lambda
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_lambda_function
params:
  attack_stage: detection_evasion
remediation:
  description: >
    Lambda log group is not encrypted with a customer-managed
    KMS key.
  action: >
    Associate a CMK with the log group via aws logs
    associate-kms-key --log-group-name /aws/lambda/<function>
    --kms-key-id <cmk-arn>. Ensure the CMK key policy permits
    logs.<region>.amazonaws.com to use the key.
  example: |
    {
      "compute": {
        "kind": "function",
        "logging": {
          "encrypted_cmk": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: function
    - field: properties.compute.logging.log_group_exists
      op: eq
      value: true
    - field: properties.compute.logging.encrypted_cmk
      op: eq
      value: false
