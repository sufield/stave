dsl_version: ctrl.v1
id: CTL.LAMBDA.CONCURRENCY.001
name: Lambda Functions Must Have Reserved Concurrency Configured
description: >
  Lambda functions must have reserved concurrency set to a non-zero value. Without reserved concurrency, a function competes for the account-wide concurrency pool with every other function. A single function experiencing a traffic spike can exhaust the account limit and prevent all other functions from executing. Reserved concurrency provides both a ceiling (blast radius limitation) and a floor (availability guarantee) for each function.
domain: exposure
severity: low
compliance:
  nist_800_53_r5: "SC-5"
  fedramp_moderate: "SC-5"
  hipaa: "164.308(a)(7)"
  soc2: "A1.1"
  pci_dss_v4.0: "1.3.2"
  ccm_v4: ["BCR-08"]
scope_tags:
  - aws
  - lambda
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_lambda_function
params:
  attack_stage: resilience
remediation:
  description: >
    Lambda function has no reserved concurrency. It shares the account-wide concurrency pool with all other functions.
  action: >
    Set reserved concurrency via aws lambda put-function-concurrency --reserved-concurrent-executions <value>. Choose a value that bounds the function's maximum invocations while leaving headroom for other critical functions.
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: function
    - field: properties.compute.concurrency.reserved_set
      op: eq
      value: false
