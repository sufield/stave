dsl_version: ctrl.v1
id: CTL.WORKSPACES.ENCRYPT.CMK.001
name: WorkSpaces Not Encrypted with Customer-Managed KMS Key
description: >
  WorkSpaces volumes are encrypted but not with a customer-managed
  KMS key. The AWS-managed key provides at-rest encryption but no
  key-policy control and no ability to revoke access by disabling
  the key. If the uses_cmk field is absent the control is
  not-evaluable and does not fire.
domain: exposure
severity: medium
compliance:
  soc2: "CC6.1, CC6.7"
  nist_800_53_r5: "SC-12, SC-13, SC-28"
  pci_dss_v4.0: "3.5"
  ccm_v4: ["CEK-03"]
scope_tags:
  - aws
  - workspaces
taxonomy:
  - encryption-at-rest
  - key-management
subtractive_category:
  - S10
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_workspaces_workspace
params:
  attack_stage: exfiltration
observation_fields:
  - compute.kind
  - compute.encryption.volumes_encrypted
  - compute.encryption.uses_cmk
remediation:
  description: >
    WorkSpaces volume encryption is not backed by a customer-managed
    KMS key.
  action: >
    Launch a new WorkSpace with a customer-managed KMS key
    (encryption must be set at launch time). Migrate the user to
    the new WorkSpace.
  example: |
    {
      "compute": {
        "kind": "workspace",
        "encryption": {
          "volumes_encrypted": true,
          "uses_cmk": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: workspace
    - field: properties.compute.encryption.volumes_encrypted
      op: eq
      value: true
    - field: properties.compute.encryption.uses_cmk
      op: eq
      value: false
tests:
  - name: workspace with AWS-managed key fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:workspaces:us-east-1:111122223333:workspace/ws-abc123"
      asset_type: aws_workspaces_workspace
      vendor: aws
      properties:
        compute:
          kind: workspace
          encryption:
            volumes_encrypted: true
            uses_cmk: false
  - name: workspace with CMK passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:workspaces:us-east-1:111122223333:workspace/ws-abc123"
      asset_type: aws_workspaces_workspace
      vendor: aws
      properties:
        compute:
          kind: workspace
          encryption:
            volumes_encrypted: true
            uses_cmk: true
  - name: workspace with absent uses_cmk passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:workspaces:us-east-1:111122223333:workspace/ws-abc123"
      asset_type: aws_workspaces_workspace
      vendor: aws
      properties:
        compute:
          kind: workspace
          encryption:
            volumes_encrypted: true
