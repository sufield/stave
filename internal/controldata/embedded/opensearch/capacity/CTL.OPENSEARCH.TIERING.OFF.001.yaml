dsl_version: ctrl.v1
id: CTL.OPENSEARCH.TIERING.OFF.001
name: OpenSearch Domain Has Hot-Warm-Cold Tiering Available But Disabled
description: >
  OpenSearch domain has UltraWarm / Cold storage
  tiers available (engine + instance class
  permits) but disabled. Time-series workload
  (logs, metrics) on hot tier alone costs
  3-10x what tiered storage costs. Cold tier
  is appropriate for indices > 90 days; UltraWarm
  for 14-90 days; hot for < 14 days.
domain: capacity
severity: low
compliance:
  soc2: "CC8.1"
  nist_800_53_r5: "CM-7"
  fedramp_moderate: "CM-7"
  iso_27001_2022: "A.8.14"
  ccm_v4: ["BCR-08"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: persistence
remediation:
  description: >
    UltraWarm/Cold available but unused.
  action: >
    Enable UltraWarm and / or Cold tier; create
    ISM policy to migrate indices age-by-age.
    Cost optimization: cold storage ~10x
    cheaper than hot.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "capacity": {
          "tiering_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.capacity.tiering_available
      op: eq
      value: true
    - field: properties.search_service.capacity.tiering_enabled
      op: eq
      value: false
defect: >
  Tiering available but disabled.
infection: >
  Hot-tier storage cost paid for cold-data
  workload; budget waste.
failure: >
  Cost-optimization opportunity unused.
tests:
  - name: tiering off fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          capacity:
            tiering_available: true
            tiering_enabled: false
  - name: tiering on passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          capacity:
            tiering_available: true
            tiering_enabled: true
