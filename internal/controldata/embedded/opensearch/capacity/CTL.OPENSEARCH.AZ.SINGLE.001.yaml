dsl_version: ctrl.v1
id: CTL.OPENSEARCH.AZ.SINGLE.001
name: OpenSearch Production Domain Deployed In Single AZ
description: >
  OpenSearch production-tier domain has fewer
  than 2 Availability Zones, or has multi-AZ
  enabled but only one data node per AZ. AZ-
  failure event takes the cluster offline; with
  one node per AZ, partial-zone events impact
  search capacity. Multi-AZ with multiple data
  nodes per zone is the production baseline.
domain: resilience
severity: high
compliance:
  soc2: "A1.1, A1.2"
  nist_800_53_r5: "CP-7, SC-5"
  fedramp_moderate: "CP-7"
  iso_27001_2022: "A.8.14"
  ccm_v4: ["BCR-04", "BCR-08"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: resilience
remediation:
  description: >
    Production domain in single AZ or 1
    node/AZ.
  action: >
    Migrate via blue-green to multi-AZ with
    minimum 2 data nodes per AZ. Use
    `with_standby` for fastest failover.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "capacity": {
          "az_resilient": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.capacity.is_production
      op: eq
      value: true
    - field: properties.search_service.capacity.az_resilient
      op: eq
      value: false
defect: >
  Production domain not AZ-resilient.
infection: >
  AZ-failure event takes the cluster offline;
  RTO measured in hours.
failure: >
  AZ-failure single point of failure.
tests:
  - name: single AZ prod fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          capacity:
            is_production: true
            az_resilient: false
  - name: multi-AZ resilient passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          capacity:
            is_production: true
            az_resilient: true
