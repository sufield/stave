dsl_version: ctrl.v1
id: CTL.OPENSEARCH.MASTER.UNDERSIZED.001
name: OpenSearch Master Instance Type Undersized For Cluster Shard Count
description: >
  OpenSearch dedicated master instance type is
  too small for the cluster's shard count.
  Master memory grows with shards (rough rule:
  ~10 MB heap per shard); a small master with
  10K+ shards spends most of its time in GC.
  Symptoms: cluster-state delays, ISM
  transitions slow, mapping updates stall.
domain: resilience
severity: medium
compliance:
  soc2: "A1.1"
  nist_800_53_r5: "SC-5"
  fedramp_moderate: "SC-5"
  iso_27001_2022: "A.8.14"
  ccm_v4: ["BCR-04"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: resilience
remediation:
  description: >
    Master instance type undersized for shard
    count.
  action: >
    Compute master heap need based on shard
    count; right-size to next instance class
    (m6g.large → m6g.xlarge → m6g.2xlarge).
    Reduce shard count if possible (force_merge,
    rollover policy).
  example: |
    {
      "search_service": {
        "kind": "domain",
        "capacity": {
          "master_undersized": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.capacity.master_undersized
      op: eq
      value: true
defect: >
  Master sized below recommended for shard
  count.
infection: >
  GC pauses inflate cluster-state ops; mapping
  updates / ISM transitions slow.
failure: >
  Control-plane bottleneck.
tests:
  - name: undersized fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          capacity:
            master_undersized: true
  - name: right-sized passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          capacity:
            master_undersized: false
