dsl_version: ctrl.v1
id: CTL.OPENSEARCH.SHARD.COUNT.HIGH.001
name: OpenSearch Shard Count Per Node Exceeds 1000
description: >
  OpenSearch domain has more than 1000 shards
  per data node (commonly recommended ceiling).
  High shard counts inflate cluster-state size,
  slow shard reallocation, and increase master
  memory pressure. Common cause: time-series
  workload with daily indices and many indices,
  no rollover policy.
domain: capacity
severity: medium
compliance:
  soc2: "A1.1"
  nist_800_53_r5: "SC-5"
  fedramp_moderate: "SC-5"
  iso_27001_2022: "A.8.14"
  ccm_v4: ["BCR-04"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: resilience
remediation:
  description: >
    >1000 shards per data node.
  action: >
    Apply ISM rollover policy + force_merge to
    reduce shard count. Consolidate small
    indices via reindex. Aim for fewer, larger
    shards.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "capacity": {
          "shards_per_node": 500
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.capacity.shards_per_node
      op: gt
      value: 1000
defect: >
  >1000 shards per data node.
infection: >
  Cluster-state operations slow; master memory
  pressure; reallocations stall.
failure: >
  Capacity ceiling approached.
tests:
  - name: 2000 shards/node fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          capacity:
            shards_per_node: 2000
  - name: 500 shards/node passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          capacity:
            shards_per_node: 500
