dsl_version: ctrl.v1
id: CTL.OPENSEARCH.ALARM.CLUSTER.RED.001
name: OpenSearch Cluster Red Status Has No CloudWatch Alarm
description: >
  OpenSearch domain has no CloudWatch alarm on the
  `ClusterStatus.red` metric. ClusterStatus.red
  means at least one primary shard is unassigned;
  data is unavailable for queries on that shard.
  Without an alarm, the cluster sits red until a
  customer or downstream pipeline complains.
domain: detect
severity: high
compliance:
  soc2: "CC7.2, A1.1"
  nist_800_53_r5: "AU-12, SI-4"
  fedramp_moderate: "AU-12"
  iso_27001_2022: "A.8.16"
  ccm_v4: ["LOG-08"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: detection_evasion
remediation:
  description: >
    No alarm on ClusterStatus.red.
  action: >
    Create CloudWatch alarm: metric
    ClusterStatus.red >= 1 for 1 datapoint, page
    on-call. Recover-action: AutomatedSnapshot
    restore or shard reallocation.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "alarms": {
          "cluster_red_alarm_present": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.alarms.cluster_red_alarm_present
      op: eq
      value: false
defect: >
  No CloudWatch alarm on ClusterStatus.red.
infection: >
  Red cluster runs with unavailable shards;
  on-call learns from downstream complaints
  rather than the alarm.
failure: >
  Critical health signal absent.
tests:
  - name: missing alarm fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          alarms:
            cluster_red_alarm_present: false
  - name: alarm present passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          alarms:
            cluster_red_alarm_present: true
