dsl_version: ctrl.v1
id: CTL.OPENSEARCH.ALARM.NODES.001
name: OpenSearch Node Count Drop Has No CloudWatch Alarm
description: >
  OpenSearch domain has no CloudWatch alarm on
  the `Nodes` metric. Silent node loss reduces
  capacity and resilience; without an alarm,
  on-call learns about it from downstream
  capacity / latency degradation. Particularly
  important for clusters with dedicated masters
  where the loss of a master is immediately
  service-impacting.
domain: detect
severity: high
compliance:
  soc2: "CC7.2, A1.1"
  nist_800_53_r5: "AU-12, SI-4"
  fedramp_moderate: "AU-12"
  iso_27001_2022: "A.8.16"
  ccm_v4: ["LOG-08"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: detection_evasion
remediation:
  description: >
    No alarm on Nodes count drop.
  action: >
    CloudWatch alarm: Nodes < expected for 1
    datapoint, page on-call.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "alarms": {
          "nodes_alarm_present": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.alarms.nodes_alarm_present
      op: eq
      value: false
defect: >
  No alarm on Nodes metric.
infection: >
  Silent node loss; cluster capacity reduces
  without operator awareness.
failure: >
  Capacity-loss signal absent.
tests:
  - name: missing alarm fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          alarms:
            nodes_alarm_present: false
  - name: alarm present passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          alarms:
            nodes_alarm_present: true
