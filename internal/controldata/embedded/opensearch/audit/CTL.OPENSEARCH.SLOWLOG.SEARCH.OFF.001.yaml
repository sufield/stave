dsl_version: ctrl.v1
id: CTL.OPENSEARCH.SLOWLOG.SEARCH.OFF.001
name: OpenSearch Search Slow Log Disabled
description: >
  OpenSearch domain has search slow-log delivery
  to CloudWatch disabled. Slow-log is the primary
  signal for query-shape regressions (mapping
  bloat, missing index, expensive aggregations,
  cross-cluster search latency). Without it,
  search performance issues become visible only
  via the customer-side complaint chain.
domain: detection
severity: low
compliance:
  soc2: "CC7.2, A1.1"
  nist_800_53_r5: "AU-2, AU-12"
  fedramp_moderate: "AU-2"
  iso_27001_2022: "A.8.16"
  ccm_v4: ["LOG-08"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: detection_evasion
remediation:
  description: >
    Search slow log not delivered to CloudWatch.
  action: >
    Enable via UpdateDomainConfig --log-publishing-
    options SEARCH_SLOW_LOGS. Set thresholds
    appropriate to the workload (e.g., 10s warn,
    30s info).
  example: |
    {
      "search_service": {
        "kind": "domain",
        "audit": {
          "search_slowlog_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.audit.search_slowlog_enabled
      op: eq
      value: false
defect: >
  Search slow log delivery off.
infection: >
  Slow searches accumulate without observability.
  Query-shape regressions (after mapping
  changes, plugin upgrades, ISM transitions)
  cause performance degradation that ops only
  notices via downstream alerts.
failure: >
  Performance signal absent. Capacity decisions
  made without query-shape data.
tests:
  - name: search slowlog off fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          audit:
            search_slowlog_enabled: false
  - name: search slowlog on passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          audit:
            search_slowlog_enabled: true
