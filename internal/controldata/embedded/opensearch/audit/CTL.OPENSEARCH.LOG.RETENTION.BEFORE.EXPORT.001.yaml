dsl_version: ctrl.v1
id: CTL.OPENSEARCH.LOG.RETENTION.BEFORE.EXPORT.001
name: OpenSearch Log Group Retention Expires Before Scheduled S3 Export
description: >
  OpenSearch domain log group has retention shorter
  than the cadence of its scheduled S3 export job.
  Events age out of the CloudWatch group before
  the export task copies them to S3 long-term
  storage. The export job picks up only the
  retained events, leaving a gap between the
  export window and what was actually generated.
  Common pattern: 7-day retention with weekly
  export job that runs every Monday — events from
  Tuesday-Sunday survive but the prior week's
  Monday events are gone.
domain: detection
severity: high
compliance:
  soc2: "CC7.2"
  pci_dss_v4.0: "10.5.1"
  nist_800_53_r5: "AU-11"
  fedramp_moderate: "AU-11"
  iso_27001_2022: "A.5.33"
  ccm_v4: ["LOG-04"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
  - logging
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: detection_evasion
remediation:
  description: >
    Log group retention < export cadence.
  action: >
    Increase log group retention to >= (export
    cadence + buffer). 7-day retention with
    daily export is fine; 7-day with weekly
    export needs at minimum 14-day retention.
    Or switch to streaming export
    (Kinesis Firehose) instead of batch.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "audit": {
          "retention_lt_export_cadence": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.audit.retention_lt_export_cadence
      op: eq
      value: true
defect: >
  Log retention shorter than S3 export cadence;
  events age out before export.
infection: >
  Periodic log gaps in the S3 archive,
  positioned at the cadence boundaries. Audit
  reconstruction misses these gaps; investigators
  treat the gap as "no events" rather than
  "events lost."
failure: >
  Long-term archive completeness gap. Compliance
  audits that read from S3 see partial history.
tests:
  - name: retention lt export cadence fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          audit:
            retention_lt_export_cadence: true
  - name: retention >= cadence passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          audit:
            retention_lt_export_cadence: false
