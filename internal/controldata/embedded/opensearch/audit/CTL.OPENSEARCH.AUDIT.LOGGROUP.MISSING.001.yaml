dsl_version: ctrl.v1
id: CTL.OPENSEARCH.AUDIT.LOGGROUP.MISSING.001
name: OpenSearch Audit Log Destination Configured But CloudWatch Group Missing
description: >
  OpenSearch domain audit log destination
  references a CloudWatch Log group that does not
  exist. Audit log delivery silently drops events
  — the domain reports audit-enabled, the log
  pipeline appears healthy from inventory, but
  no events arrive at any consumer. Common
  pattern: log group renamed / deleted by another
  team without checking which services delivered
  to it.
domain: detect
severity: high
compliance:
  soc2: "CC7.2, A1.2"
  pci_dss_v4.0: "10.4.1"
  nist_800_53_r5: "AU-3, AU-12"
  fedramp_moderate: "AU-3"
  iso_27001_2022: "A.8.15"
  ccm_v4: ["LOG-04", "LOG-08"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: detection_evasion
remediation:
  description: >
    Audit log destination references missing
    CloudWatch group.
  action: >
    Re-create the log group or repoint audit
    delivery to an existing group via
    UpdateDomainConfig --log-publishing-options.
    Verify with describe-domain-config + log
    group list.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "audit": {
          "destination_log_group_exists": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.audit.enabled
      op: eq
      value: true
    - field: properties.search_service.audit.destination_log_group_exists
      op: eq
      value: false
defect: >
  Audit log destination points to nonexistent
  CloudWatch group.
infection: >
  Audit events generated by the domain are
  written to a destination that doesn't exist.
  Compliance report says audit-enabled; reality
  is no audit data persists.
failure: >
  Silent audit-trail loss. Worst case for
  detect: the system claims it's working.
tests:
  - name: missing log group fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          audit:
            enabled: true
            destination_log_group_exists: false
  - name: existing log group passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          audit:
            enabled: true
            destination_log_group_exists: true
