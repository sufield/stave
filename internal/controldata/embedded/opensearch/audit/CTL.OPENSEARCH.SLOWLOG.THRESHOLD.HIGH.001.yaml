dsl_version: ctrl.v1
id: CTL.OPENSEARCH.SLOWLOG.THRESHOLD.HIGH.001
name: OpenSearch Slow Log Threshold Set Above Practical Trigger
description: >
  OpenSearch domain slow-log threshold (per-tier
  warn / info / debug / trace) is set high enough
  that no operational query crosses it. Effectively
  off, but config inventory and compliance reports
  show slow-log enabled. Common pattern: operator
  copy-pasted thresholds from cluster docs (5
  minutes default warn) without tuning to actual
  query SLA.
domain: detection
severity: medium
compliance:
  soc2: "CC7.2"
  nist_800_53_r5: "AU-12"
  fedramp_moderate: "AU-12"
  iso_27001_2022: "A.8.16"
  ccm_v4: ["LOG-08"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: detection_evasion
remediation:
  description: >
    Slow log threshold above practical trigger
    point.
  action: >
    Tune thresholds to workload SLA; one common
    starting point: warn 10s, info 5s, debug 2s,
    trace 1s for search; halve for index. Review
    after every major workload change.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "audit": {
          "slowlog_threshold_too_high": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.audit.slowlog_threshold_too_high
      op: eq
      value: true
defect: >
  Slow-log thresholds set above practical
  triggers; no events fire.
infection: >
  Compliance review counts slow-log enabled.
  Operators query the log group, see no events,
  conclude there are no slow queries. Real
  performance regressions remain invisible.
failure: >
  Detection theater. Logging present but
  effectively off.
tests:
  - name: too-high thresholds fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          audit:
            slowlog_threshold_too_high: true
  - name: tuned thresholds passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          audit:
            slowlog_threshold_too_high: false
