dsl_version: ctrl.v1
id: CTL.OPENSEARCH.AUTOTUNE.OFF.001
name: OpenSearch Auto-Tune Disabled
description: >
  OpenSearch domain has Auto-Tune disabled.
  Auto-Tune adjusts JVM heap, garbage
  collector, and queue sizes based on observed
  workload. Without it, recommended settings
  drift over time as workload changes; manual
  tuning is rarely revisited. Auto-Tune
  applies during maintenance window.
domain: governance
severity: low
compliance:
  soc2: "CC8.1"
  nist_800_53_r5: "CM-3"
  fedramp_moderate: "CM-3"
  iso_27001_2022: "A.8.32"
  ccm_v4: ["BCR-04"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: persistence
remediation:
  description: >
    Auto-Tune disabled.
  action: >
    Enable via UpdateDomainConfig --auto-tune-
    options DesiredState=ENABLED. Pair with
    off-peak maintenance window.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "engine": {
          "autotune_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.engine.autotune_enabled
      op: eq
      value: false
defect: >
  Auto-Tune disabled.
infection: >
  Tuning drifts from optimal over time as
  workload patterns change.
failure: >
  Configuration optimization missed.
tests:
  - name: autotune off fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          engine:
            autotune_enabled: false
  - name: autotune on passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          engine:
            autotune_enabled: true
