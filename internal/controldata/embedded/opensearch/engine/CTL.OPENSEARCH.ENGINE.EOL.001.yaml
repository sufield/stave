dsl_version: ctrl.v1
id: CTL.OPENSEARCH.ENGINE.EOL.001
name: OpenSearch Engine Version End-Of-Life
description: >
  OpenSearch domain runs an engine version that
  is end-of-life (e.g., Elasticsearch 5.x, 6.x,
  7.1-7.9). EOL versions receive no security
  patches; known CVEs remain unfixed. AWS
  forced-update windows for EOL versions are
  hard deadlines with limited rollback.
domain: governance
severity: critical
compliance:
  soc2: "CC7.1, CC8.1"
  pci_dss_v4.0: "6.2, 6.3"
  nist_800_53_r5: "SI-2, RA-5"
  fedramp_moderate: "SI-2"
  iso_27001_2022: "A.8.8"
  ccm_v4: ["TVM-04", "TVM-08"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
  - deprecation
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: persistence
remediation:
  description: >
    Engine version is EOL.
  action: >
    Plan blue-green migration to current OpenSearch
    major version. Test on non-prod first; allow
    weeks for cluster-state migration.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "engine": {
          "is_eol": false
        }
      }
    }
lifecycle:
  status: eol
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.engine.is_eol
      op: eq
      value: true
defect: >
  EOL engine version.
infection: >
  Known CVEs unfixed; vendor support absent.
failure: >
  Patch debt at hardest stage to migrate from.
tests:
  - name: eol fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          engine:
            is_eol: true
  - name: current passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          engine:
            is_eol: false
