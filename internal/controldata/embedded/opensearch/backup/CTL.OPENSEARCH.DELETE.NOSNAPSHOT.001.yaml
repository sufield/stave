dsl_version: ctrl.v1
id: CTL.OPENSEARCH.DELETE.NOSNAPSHOT.001
name: OpenSearch Domain Deletion Not Gated By Pre-Delete Snapshot
description: >
  OpenSearch domain deletion process / IAM
  doesn't enforce a pre-delete manual snapshot.
  Default `DeleteDomain` API removes the domain
  immediately; automated snapshots are gone with
  the domain. Recovery from accidental deletion
  is impossible unless a manual snapshot was
  taken first. CI/CD or break-glass processes
  must enforce snapshot-before-delete.
domain: governance
severity: high
compliance:
  soc2: "CC7.4, A1.2"
  nist_800_53_r5: "CP-9, CM-3"
  fedramp_moderate: "CP-9"
  iso_27001_2022: "A.8.13"
  ccm_v4: ["BCR-08", "BCR-11"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: impact
remediation:
  description: >
    No snapshot-before-delete gate.
  action: >
    Add IAC / CI/CD step: take manual snapshot
    + verify in S3 + only then call
    DeleteDomain. Or use SCP that denies
    DeleteDomain unless tag
    "deletion_protection": "false" is set,
    forcing operator to pre-arm.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "backup": {
          "snapshot_before_delete_enforced": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.backup.snapshot_before_delete_enforced
      op: eq
      value: false
defect: >
  No pre-delete snapshot gate.
infection: >
  Accidental / malicious DeleteDomain destroys
  the domain plus all automated snapshots.
  Recovery impossible.
failure: >
  Single-step destruction path. No undo.
tests:
  - name: no snapshot gate fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          backup:
            snapshot_before_delete_enforced: false
  - name: snapshot gate enforced passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          backup:
            snapshot_before_delete_enforced: true
