dsl_version: ctrl.v1
id: CTL.OPENSEARCH.SNAPSHOT.NOCROSSREGION.001
name: OpenSearch Manual Snapshot Bucket Has No Cross-Region Replication
description: >
  OpenSearch domain manual snapshot S3 bucket has
  no cross-region replication configured.
  Region-wide AWS event (rare but documented)
  takes the snapshot bucket offline along with
  the domain; recovery requires snapshots in a
  different region. CRR adds cost but the
  alternative is no DR position for region-wide
  events.
domain: governance
severity: medium
compliance:
  soc2: "CC7.4, A1.2"
  nist_800_53_r5: "CP-9, CP-7"
  fedramp_moderate: "CP-9"
  iso_27001_2022: "A.8.13, A.8.14"
  ccm_v4: ["BCR-08", "BCR-11"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: resilience
remediation:
  description: >
    Snapshot bucket has no cross-region
    replication.
  action: >
    Enable S3 CRR to a bucket in another region
    using a multi-region KMS key. Cost trade-off:
    storage 2x; alternative: scheduled snapshot
    copy to second-region bucket via Lambda.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "backup": {
          "snapshot_crossregion_replicated": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.backup.manual_repo_registered
      op: eq
      value: true
    - field: properties.search_service.backup.snapshot_crossregion_replicated
      op: eq
      value: false
defect: >
  No cross-region replication on snapshot
  bucket.
infection: >
  Region-wide failure leaves zero recovery
  position. RTO / RPO claims for region-wide
  events are unmet.
failure: >
  DR gap for region-wide events.
tests:
  - name: no crossregion fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          backup:
            manual_repo_registered: true
            snapshot_crossregion_replicated: false
  - name: crossregion replicated passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          backup:
            manual_repo_registered: true
            snapshot_crossregion_replicated: true
