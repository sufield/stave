dsl_version: ctrl.v1
id: CTL.OPENSEARCH.SNAPSHOT.KEY.DRIFT.001
name: OpenSearch Snapshot S3 Encryption Key Differs From Domain Key
description: >
  OpenSearch domain's manual snapshot S3 bucket
  uses a KMS key different from the domain's
  at-rest encryption key. During restore, the
  destination domain (which expects to decrypt
  with its at-rest key) cannot read snapshots
  encrypted with a separate key — restore fails
  unless the target domain is granted access to
  both keys, or unless the snapshot bucket
  re-encrypts on the fly. Common cause: bucket
  was created with default account key and
  domain was later assigned a tenant-specific
  key.
domain: encrypt
severity: high
compliance:
  soc2: "CC6.7"
  nist_800_53_r5: "SC-12, SC-13"
  fedramp_moderate: "SC-12"
  iso_27001_2022: "A.8.24"
  ccm_v4: ["CEK-04", "CEK-09"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: persistence
remediation:
  description: >
    Snapshot S3 key differs from domain key.
  action: >
    Either update bucket default encryption to
    match domain key or grant the target
    domain's role kms:Decrypt on both keys.
    Document the key custody decision.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "backup": {
          "snapshot_key_matches_domain": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.backup.manual_repo_registered
      op: eq
      value: true
    - field: properties.search_service.backup.snapshot_key_matches_domain
      op: eq
      value: false
defect: >
  Snapshot bucket KMS key differs from domain
  key.
infection: >
  Restore from snapshot fails until ad-hoc
  permissions are granted; recovery RTO
  inflated by KMS troubleshooting.
failure: >
  Recovery friction. Snapshot taken successfully
  but unusable without out-of-band setup.
tests:
  - name: key drift fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          backup:
            manual_repo_registered: true
            snapshot_key_matches_domain: false
  - name: matching key passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          backup:
            manual_repo_registered: true
            snapshot_key_matches_domain: true
