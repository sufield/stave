dsl_version: ctrl.v1
id: CTL.OPENSEARCH.SNAPSHOT.NOMANUAL.REPO.001
name: OpenSearch Domain Has No Manual Snapshot Repository Registered
description: >
  OpenSearch domain has only the automated-
  snapshot repository (cs-automated*) and no
  manually registered S3 snapshot repository.
  Automated snapshots cap at 14-day retention
  and live in AWS-controlled storage; manual
  repository in S3 is required for any
  recovery scenario beyond 14 days, cross-
  region restore, or air-gapped backup.
domain: governance
severity: high
compliance:
  soc2: "CC7.4, A1.2"
  nist_800_53_r5: "CP-9"
  fedramp_moderate: "CP-9"
  iso_27001_2022: "A.8.13"
  ccm_v4: ["BCR-08", "BCR-11"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: persistence
remediation:
  description: >
    No manual snapshot repository registered.
  action: >
    Create S3 bucket with KMS encryption +
    object lock. Register as snapshot
    repository via _snapshot/<repo>. Schedule
    daily / weekly snapshot creation via Curator
    or ISM "snapshot" action.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "backup": {
          "manual_repo_registered": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.backup.manual_repo_registered
      op: eq
      value: false
defect: >
  No manual S3 snapshot repo registered.
infection: >
  Recovery limited to last 14 days; cross-
  region / air-gapped restore impossible.
failure: >
  Backup-strategy gap.
tests:
  - name: no manual repo fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          backup:
            manual_repo_registered: false
  - name: manual repo present passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          backup:
            manual_repo_registered: true
