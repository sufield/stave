dsl_version: ctrl.v1
id: CTL.OPENSEARCH.CCS.UNSCOPED.001
name: OpenSearch Cross-Cluster Trust Or Replication Pattern Unscoped
description: >
  OpenSearch cross-cluster setup is over-broad:
  CCS trust granted to a non-production source
  cluster, CCS access policy not index-scoped, or
  CCR auto-follow pattern matches `*` (replicates
  everything). Each variant exposes more data
  than the integration requires.
domain: exposure
severity: high
compliance:
  soc2: "CC6.1, CC6.3"
  nist_800_53_r5: "AC-3, AC-6"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.5.15, A.8.20"
  ccm_v4: ["IAM-16"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: lateral_movement
remediation:
  description: >
    Cross-cluster trust / replication
    over-broad.
  action: >
    Restrict CCS to production-tier source
    clusters only; scope access policy by
    index pattern; restrict CCR auto-follow
    to specific index prefixes.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "crosscluster": {
          "trust_scoped": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.crosscluster.has_connections
      op: eq
      value: true
    - field: properties.search_service.crosscluster.trust_scoped
      op: eq
      value: false
defect: >
  CCS / CCR trust pattern unscoped.
infection: >
  More data exposed than integration needs;
  compromise of source cluster amplifies.
failure: >
  Cross-cluster blast radius oversize.
tests:
  - name: unscoped fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          crosscluster:
            has_connections: true
            trust_scoped: false
  - name: scoped passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          crosscluster:
            has_connections: true
            trust_scoped: true
