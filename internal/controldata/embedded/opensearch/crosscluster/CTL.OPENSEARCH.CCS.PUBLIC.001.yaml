dsl_version: ctrl.v1
id: CTL.OPENSEARCH.CCS.PUBLIC.001
name: OpenSearch Cross-Cluster Connection Traverses Public Endpoint
description: >
  OpenSearch cross-cluster search (CCS) or cross-
  cluster replication (CCR) connection between
  two domains traverses the public internet
  endpoint of either side rather than VPC
  PrivateLink. Search / replication traffic
  contains the data being queried; transiting
  the public path exposes it to interception
  and inflates egress cost.
domain: encrypt
severity: high
compliance:
  soc2: "CC6.7"
  pci_dss_v4.0: "4.2.1"
  nist_800_53_r5: "SC-7, SC-8"
  fedramp_moderate: "SC-7"
  iso_27001_2022: "A.8.20"
  ccm_v4: ["IVS-03"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: lateral_movement
  blast_radius:
    type: data_exposure
    scope: account
    multiplier: 2.0
remediation:
  description: >
    CCS / CCR over public endpoint.
  action: >
    Migrate cross-cluster connection to use VPC
    PrivateLink endpoints on both ends.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "crosscluster": {
          "connections_over_public": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.crosscluster.has_connections
      op: eq
      value: true
    - field: properties.search_service.crosscluster.connections_over_public
      op: eq
      value: true
defect: >
  Cross-cluster connection traverses public
  internet.
infection: >
  Data exposed to network observers; egress
  cost inflated.
failure: >
  Cross-cluster traffic on public path.
tests:
  - name: public CCS fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          crosscluster:
            has_connections: true
            connections_over_public: true
  - name: privatelink CCS passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          crosscluster:
            has_connections: true
            connections_over_public: false
