dsl_version: ctrl.v1
id: CTL.OPENSEARCH.CCS.COMPLIANCE.BOUNDARY.001
name: OpenSearch Cross-Cluster Connection Crosses Compliance Boundary
description: >
  OpenSearch CCS / CCR connection between two
  domains crosses a compliance scope boundary:
  PII / PHI / PCI-scoped data accessed from a
  non-scoped cluster, GDPR-EU index queryable
  from a US cluster, etc. Compliance requires
  the data to remain within scope; cross-cluster
  query / replication breaches it.
domain: governance
severity: high
compliance:
  soc2: "CC6.1, CC8.1"
  pci_dss_v4.0: "1.3.4"
  hipaa: "164.502(e)"
  nist_800_53_r5: "AC-3, AC-4"
  fedramp_moderate: "AC-4"
  iso_27001_2022: "A.5.10, A.8.20"
  ccm_v4: ["DSP-04", "DSP-19"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
  - trust-boundary
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: lateral_movement
  blast_radius:
    type: data_exposure
    scope: cross_account
    multiplier: 2.5
remediation:
  description: >
    CCS / CCR crosses compliance boundary.
  action: >
    Tear down the cross-cluster connection.
    Implement compliance-scoped clusters that
    do not federate. If federation is required,
    restrict to non-regulated indices via
    explicit pattern allowlist.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "crosscluster": {
          "crosses_compliance_boundary": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.crosscluster.crosses_compliance_boundary
      op: eq
      value: true
defect: >
  Cross-cluster connection breaches
  compliance scope.
infection: >
  PII / PHI / PCI data accessible from non-
  scoped clusters; compliance audit failure.
failure: >
  Compliance boundary violation.
tests:
  - name: boundary breach fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          crosscluster:
            crosses_compliance_boundary: true
  - name: scoped passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          crosscluster:
            crosses_compliance_boundary: false
