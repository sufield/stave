dsl_version: ctrl.v1
id: CTL.OPENSEARCH.CUSTOM.CERT.UNTRUSTED.001
name: OpenSearch Custom Endpoint Certificate From Untrusted CA
description: >
  OpenSearch domain has a custom endpoint configured
  with an ACM certificate issued by a private /
  internal / untrusted CA whose root is not in the
  client trust store. Clients connecting to the
  custom endpoint either fail TLS verification or
  (worse) operators globally disable verification to
  make the connection work, eliminating any value
  TLS provides.
domain: encryption
severity: high
compliance:
  soc2: "CC6.7"
  pci_dss_v4.0: "4.2.1"
  nist_800_53_r5: "SC-8, SC-12, SC-13"
  fedramp_moderate: "SC-8, SC-13"
  iso_27001_2022: "A.8.24"
  ccm_v4: ["CEK-04", "CEK-09"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: detection_evasion
  blast_radius:
    type: data_exposure
    scope: account
    multiplier: 2.0
remediation:
  description: >
    OpenSearch custom endpoint certificate is issued
    by a CA not in standard client trust stores.
  action: >
    Replace with a certificate from a public CA
    issued via ACM (free for AWS-managed services).
    Or distribute the private CA root to all
    clients that consume the custom endpoint and
    document the trust path. Verify with:
      openssl s_client -connect <custom-endpoint>:443
        -servername <custom-endpoint>
  example: |
    {
      "search_service": {
        "kind": "domain",
        "encrypt": {
          "custom_endpoint_cert_trusted": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.access.custom_endpoint_enabled
      op: eq
      value: true
    - field: properties.search_service.encrypt.custom_endpoint_cert_trusted
      op: eq
      value: false
defect: >
  Custom endpoint certificate is from an untrusted
  / private CA without distributed root.
infection: >
  Clients fail TLS verification on connect, then
  either fail entirely or are configured to skip
  verification. Skip-verification removes the
  authentication property of TLS; an attacker who
  can intercept the network path can present any
  certificate and decrypt traffic.
failure: >
  TLS server-authentication broken. Either clients
  fail (availability impact) or skip verification
  (confidentiality impact).
tests:
  - name: untrusted CA cert fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            custom_endpoint_enabled: true
          encrypt:
            custom_endpoint_cert_trusted: false
  - name: trusted public CA cert passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            custom_endpoint_enabled: true
          encrypt:
            custom_endpoint_cert_trusted: true
