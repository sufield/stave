dsl_version: ctrl.v1
id: CTL.OPENSEARCH.POLICY.UPDATECONFIG.NONADMIN.001
name: OpenSearch UpdateDomainConfig Permission Granted To Non-Admin
description: >
  OpenSearch domain policy or attached IAM policy
  grants `es:UpdateElasticsearchDomainConfig`
  (or `es:UpdateDomainConfig`) to a role that is
  not the admin / break-glass role.
  UpdateDomainConfig modifies access policies,
  encryption settings, network config, log
  delivery, and cluster topology. Compromise of
  any role with this action ≈ control-plane
  takeover of the domain.
domain: exposure
severity: critical
compliance:
  soc2: "CC6.1, CC6.3, CC8.1"
  pci_dss_v4.0: "7.2.1, 7.2.2"
  nist_800_53_r5: "AC-6, CM-3"
  fedramp_moderate: "AC-6"
  iso_27001_2022: "A.5.15, A.8.20"
  ccm_v4: ["IAM-02", "IAM-16"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - least-privilege
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: privilege_escalation
  blast_radius:
    type: control_plane
    scope: account
    multiplier: 3.0
remediation:
  description: >
    Non-admin role granted UpdateDomainConfig
    permission.
  action: >
    Restrict UpdateDomainConfig to a documented
    admin role with break-glass review. Prefer
    IaC-driven config changes; revoke direct
    UpdateDomainConfig from automation roles.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "access": {
          "policy_updateconfig_nonadmin": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.access.policy_updateconfig_nonadmin
      op: eq
      value: true
defect: >
  Non-admin role can call UpdateDomainConfig.
infection: >
  Compromise of the role allows attacker to alter
  access policy (whitelist their own IP), disable
  encryption, change KMS key, redirect log
  delivery (audit-trail break), or modify cluster
  topology. All without admin credentials.
failure: >
  Control-plane access escalation. The role's
  effective capability is "domain owner."
tests:
  - name: nonadmin updateconfig fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            policy_updateconfig_nonadmin: true
  - name: admin-only updateconfig passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            policy_updateconfig_nonadmin: false
