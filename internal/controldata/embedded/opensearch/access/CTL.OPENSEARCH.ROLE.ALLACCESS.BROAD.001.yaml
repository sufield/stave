dsl_version: ctrl.v1
id: CTL.OPENSEARCH.ROLE.ALLACCESS.BROAD.001
name: OpenSearch all_access Role Mapped To Broad Backend Identity
description: >
  OpenSearch FGAC built-in `all_access` role is
  mapped to a broad backend identity — an IAM role
  shared across many services, an entire SAML
  group, or `*`. The all_access role is the
  cluster-admin equivalent on the data plane;
  broad mapping means any caller with that
  backend role inherits cluster admin.
domain: exposure
severity: critical
compliance:
  soc2: "CC6.1, CC6.3"
  pci_dss_v4.0: "7.2.1, 7.2.2"
  nist_800_53_r5: "AC-6, AC-3"
  fedramp_moderate: "AC-6"
  iso_27001_2022: "A.5.15, A.8.20"
  ccm_v4: ["IAM-02", "IAM-16"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
  - least-privilege
  - resource-sprawl
subtractive_category:
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: privilege_escalation
  blast_radius:
    type: control_plane
    scope: account
    multiplier: 3.0
remediation:
  description: >
    all_access mapped to overbroad backend role.
  action: >
    Restrict all_access mapping to a specific
    documented break-glass IAM role with separate
    sign-off. Map operational roles to the
    minimum FGAC role they actually need.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "access": {
          "role_mapping_allaccess_broad": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.access.role_mapping_allaccess_broad
      op: present
    - field: properties.search_service.access.role_mapping_allaccess_broad
      op: eq
      value: true
defect: >
  all_access mapped to overbroad backend
  identity.
infection: >
  Compromise of any caller in the mapped backend
  role yields cluster-admin. Audit shows all
  cluster-admin actions originating from the
  generic backend identity, making attribution
  impossible.
failure: >
  Cluster-admin sprawl. Effective admin count is
  every IAM identity in the mapped backend role.
tests:
  - name: allaccess broad fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            role_mapping_allaccess_broad: true
  - name: allaccess scoped to break-glass passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            role_mapping_allaccess_broad: false
