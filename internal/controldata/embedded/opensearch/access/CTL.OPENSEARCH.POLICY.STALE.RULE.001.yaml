dsl_version: ctrl.v1
id: CTL.OPENSEARCH.POLICY.STALE.RULE.001
name: OpenSearch Access Policy Has Stale Temporary Allow Rule
description: >
  OpenSearch domain access policy contains a
  statement marked or commented as temporary
  (operator's home IP, contractor's office, vendor
  CIDR, debugging exception) that has been in place
  for more than 90 days. Temporary rules
  accumulate over years; nobody owns removing
  them. Each stale rule is an unreviewed allow
  path.
domain: governance
severity: medium
compliance:
  soc2: "CC6.1, CC8.1"
  nist_800_53_r5: "AC-6, CA-7"
  fedramp_moderate: "AC-6"
  iso_27001_2022: "A.5.15, A.8.27"
  ccm_v4: ["IAM-16", "GRC-08"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: persistence
  blast_radius:
    type: data_exposure
    scope: account
    multiplier: 1.5
remediation:
  description: >
    Access policy contains stale temporary allow
    rule older than 90 days.
  action: >
    Quarterly access-policy review: identify each
    statement marked temporary; either promote to
    a permanent rule (with documented owner) or
    remove. Encode expiry dates in policy
    statement Sids ("temp-2025Q1-corp-ip") so
    review is mechanical.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "access": {
          "policy_has_stale_temp_rule": false,
          "policy_oldest_temp_rule_age_days": 30
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.access.policy_has_stale_temp_rule
      op: eq
      value: true
    - field: properties.search_service.access.policy_oldest_temp_rule_age_days
      op: gt
      value: 90
defect: >
  Access policy contains a temporary allow rule
  older than 90 days.
infection: >
  Original purpose of the rule is forgotten; the
  IP / principal it allowed may have moved on but
  the allow path remains. Periodic review skips
  these rules because operators don't know which
  are still load-bearing.
failure: >
  Allow-path debt. Policy review is incomplete
  because reviewers can't tell which temporary
  rules are still needed.
tests:
  - name: stale 180-day temp rule fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            policy_has_stale_temp_rule: true
            policy_oldest_temp_rule_age_days: 180
  - name: recent temp rule passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            policy_has_stale_temp_rule: true
            policy_oldest_temp_rule_age_days: 30
