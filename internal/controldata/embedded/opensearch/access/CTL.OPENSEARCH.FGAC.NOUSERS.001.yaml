dsl_version: ctrl.v1
id: CTL.OPENSEARCH.FGAC.NOUSERS.001
name: OpenSearch FGAC Enabled But Internal User Database Empty
description: >
  OpenSearch domain has fine-grained access control
  enabled but the internal user database is empty
  (only the default master). FGAC was turned on as
  a checkbox to satisfy compliance, but no users /
  role mappings exist to actually use it. Either
  all access falls back to the master credential
  (single shared credential) or all data-plane
  calls fail (silent outage when first FGAC-aware
  client reaches it).
domain: governance
severity: medium
compliance:
  soc2: "CC6.1, CC6.6"
  pci_dss_v4.0: "8.2.1"
  nist_800_53_r5: "AC-2, AC-3"
  fedramp_moderate: "AC-2"
  iso_27001_2022: "A.5.16, A.8.5"
  ccm_v4: ["IAM-09"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: persistence
remediation:
  description: >
    FGAC enabled but no internal users defined.
  action: >
    Provision per-tenant internal users or map IAM
    roles to FGAC roles via opensearch-cli /
    Dashboards Security plugin. Decide whether
    internal-user DB is the source of truth or
    whether SAML / Cognito / IAM is.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "access": {
          "fgac_enabled": true,
          "fgac_internal_user_count": 5
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.access.fgac_enabled
      op: eq
      value: true
    - field: properties.search_service.access.fgac_internal_user_count
      op: lt
      value: 1
defect: >
  FGAC enabled with 0 internal users.
infection: >
  All access funnels through the master credential
  or fails entirely. FGAC's per-user audit and
  least-privilege features are present in name but
  unused.
failure: >
  FGAC pretense without substance. Compliance
  reports cite FGAC as a control; reality is no
  per-user access discipline exists.
tests:
  - name: fgac no users fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            fgac_enabled: true
            fgac_internal_user_count: 0
  - name: fgac with users passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            fgac_enabled: true
            fgac_internal_user_count: 12
