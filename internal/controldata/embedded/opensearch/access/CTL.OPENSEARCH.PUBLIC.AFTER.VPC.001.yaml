dsl_version: ctrl.v1
id: CTL.OPENSEARCH.PUBLIC.AFTER.VPC.001
name: OpenSearch Public Endpoint Left Enabled After VPC Migration
description: >
  OpenSearch domain has both a VPC endpoint and a
  public endpoint enabled simultaneously, with VPC
  configuration indicating the domain was migrated
  to VPC. After VPC migration, the public endpoint
  is supposed to be disabled; leaving it enabled
  defeats the purpose of the migration. Common
  pattern: operator runs UpdateDomainConfig to add
  VPC config, but the original public endpoint is
  not auto-disabled and operator never returns to
  remove it.
domain: exposure
severity: critical
compliance:
  soc2: "CC6.1"
  pci_dss_v4.0: "1.3.1"
  nist_800_53_r5: "SC-7"
  fedramp_moderate: "SC-7"
  iso_27001_2022: "A.8.20"
  ccm_v4: ["DSP-17", "IVS-03"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
  - network-isolation
  - trust-decay
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: initial_access
  blast_radius:
    type: data_exposure
    scope: account
    multiplier: 3.0
remediation:
  description: >
    OpenSearch domain has VPC endpoint and public
    endpoint enabled at the same time.
  action: >
    Disable the public endpoint via UpdateDomainConfig.
    Cannot be done in-place if existing clients still
    hit the public endpoint; coordinate the cutover
    via DNS / custom endpoint repointing. Confirm
    with DescribeDomainConfig that endpoint_options
    no longer includes a public endpoint.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "access": {
          "vpc_enabled": true,
          "publicly_accessible": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.access.vpc_enabled
      op: eq
      value: true
    - field: properties.search_service.access.publicly_accessible
      op: eq
      value: true
defect: >
  Domain has VPC + public endpoints enabled
  simultaneously.
infection: >
  Public endpoint accepts traffic from any internet
  source allowed by the access policy. VPC migration
  is half-complete; the network-level boundary the
  VPC was supposed to enforce is not in effect.
  Clients with stale DNS / config continue to hit the
  public endpoint without anyone noticing.
failure: >
  Half-migrated domain. VPC inventory says VPC-only,
  reality says public + VPC. Attack surface includes
  the entire internet.
tests:
  - name: vpc and public both enabled fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            vpc_enabled: true
            publicly_accessible: true
  - name: vpc only passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            vpc_enabled: true
            publicly_accessible: false
