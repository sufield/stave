dsl_version: ctrl.v1
id: CTL.OPENSEARCH.ISM.NOFAILURE.PATH.001
name: OpenSearch ISM Policy Lacks Failure Transition Path
description: >
  OpenSearch ISM policy has no `error_notification`
  or transition handling for `Failed` state.
  When a step fails (e.g., snapshot to a missing
  repo, force_merge on a node-pressured cluster),
  the policy stops mid-flight; indices accumulate
  in failed state forever, blocking future
  state transitions on those indices. Common
  with policies authored by trial and error.
domain: governance
severity: medium
compliance:
  soc2: "CC8.1, CC7.3"
  nist_800_53_r5: "CM-3, AU-12"
  fedramp_moderate: "CM-3"
  iso_27001_2022: "A.5.30, A.8.16"
  ccm_v4: ["BCR-08"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: persistence
remediation:
  description: >
    ISM policy lacks failure handling.
  action: >
    Add error_notification (SNS / email) or
    explicit retry/fail transitions. Audit
    failed-state indices weekly:
      GET _plugins/_ism/explain/* | jq '.[]
        | select(.state.name=="failed")'
  example: |
    {
      "search_service": {
        "kind": "domain",
        "ism": {
          "has_failure_path": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.ism.has_failure_path
      op: eq
      value: false
defect: >
  ISM policy without failure handling.
infection: >
  Failed indices accumulate in failed state;
  next phase never reached; cluster fills.
failure: >
  Lifecycle stuck.
tests:
  - name: no failure path fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          ism:
            has_failure_path: false
  - name: failure path present passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          ism:
            has_failure_path: true
