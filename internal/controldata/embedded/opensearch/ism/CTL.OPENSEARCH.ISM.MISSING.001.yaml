dsl_version: ctrl.v1
id: CTL.OPENSEARCH.ISM.MISSING.001
name: OpenSearch Time-Series Indices Have No ISM Policy Attached
description: >
  OpenSearch domain has time-series indices
  (logs, metrics, daily / hourly index pattern)
  with no ISM (Index State Management) policy
  attached. Indices grow unboundedly; storage
  fills; flood-stage hits. Even when an ISM
  policy exists, mismatched `default_state`
  causes new indices to enter the wrong phase
  and never transition.
domain: governance
severity: medium
compliance:
  soc2: "CC8.1, A1.1"
  nist_800_53_r5: "CP-2, CM-2"
  fedramp_moderate: "CP-2"
  iso_27001_2022: "A.5.30"
  ccm_v4: ["BCR-08"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: persistence
remediation:
  description: >
    Time-series indices without ISM policy.
  action: >
    Create ISM policy with rollover, force_merge,
    warm/cold transitions, and delete state.
    Attach to index template so new indices
    inherit. Verify with _plugins/_ism/policies.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "ism": {
          "timeseries_indices_with_policy": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.ism.has_timeseries_indices
      op: eq
      value: true
    - field: properties.search_service.ism.timeseries_indices_with_policy
      op: eq
      value: false
defect: >
  Time-series indices without ISM policy.
infection: >
  Indices grow unboundedly; storage fills;
  flood-stage hits.
failure: >
  Storage growth uncapped.
tests:
  - name: no ism fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          ism:
            has_timeseries_indices: true
            timeseries_indices_with_policy: false
  - name: ism attached passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          ism:
            has_timeseries_indices: true
            timeseries_indices_with_policy: true
