dsl_version: ctrl.v1
id: CTL.OPENSEARCH.NOTIFY.HTTP.001
name: OpenSearch Notification Plugin Webhook Over HTTP Or Async-Search Unbounded
description: >
  OpenSearch notification plugin webhook
  configured over plain HTTP (cleartext alert
  bodies) or Async-Search results retained
  indefinitely (storage growth + privacy).
  Webhook bodies often contain alert content
  including sensitive data; HTTP makes it
  visible to network observers.
domain: encryption
severity: medium
compliance:
  soc2: "CC6.7"
  pci_dss_v4.0: "4.2.1"
  nist_800_53_r5: "SC-8"
  fedramp_moderate: "SC-8"
  iso_27001_2022: "A.8.24"
  ccm_v4: ["CEK-04"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
subtractive_category:
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: detection_evasion
remediation:
  description: >
    Notify webhook HTTP or async-search
    unbounded retention.
  action: >
    Reconfigure webhooks to HTTPS endpoints.
    Set async_search.maximum_response_size
    and TTL via cluster settings.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "plugin": {
          "notify_safe": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.plugin.notify_safe
      op: eq
      value: false
defect: >
  Notification plugin or async-search unsafe.
infection: >
  Cleartext alerts; storage / retention drift.
failure: >
  Plugin hygiene gap.
tests:
  - name: unsafe fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          plugin:
            notify_safe: false
  - name: safe passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          plugin:
            notify_safe: true
