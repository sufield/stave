dsl_version: ctrl.v1
id: CTL.WAF.LOGGING.001
name: WAF Logging Must Be Enabled
description: >
  WAF web ACLs must have logging enabled to record blocked and
  allowed requests. Without logging, attacks cannot be detected,
  investigated, or correlated with other security events.
  This control is the **visibility** check in the seven-control WAF
  safety envelope: presence (CTL.WAF.RULES.001), enforcement
  (CTL.WAF.RULES.BLOCKMODE.001), coverage (CTL.WAF.RULES.OWASP.001),
  visibility (CTL.WAF.LOGGING.001), architectural prerequisite
  (CTL.WAF.ORIGIN.LOCKDOWN.001), parser overflow protection
  (CTL.WAF.PARSERLIMIT.PROTECT.001), and evasion observability
  (CTL.WAF.EVASION.OBSERVE.001). All seven may fire on the same Web
  ACL simultaneously; each addresses a distinct failure mode.
domain: exposure
severity: medium
compliance:
  soc2: "CC7.1"
  nist_800_53_r5: "AU-2"
  fedramp_moderate: "AU-2"
  ccm_v4: ["IVS-09", "LOG-12"]
scope_tags:
  - aws
  - waf
taxonomy:
  - compliance-mapping
  - logging
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
remediation:
  description: >
    WAF web ACL does not have logging enabled. Attack traffic is
    not recorded.
  action: >
    Enable WAF logging to S3, CloudWatch Logs, or Kinesis Data
    Firehose via aws wafv2 put-logging-configuration.
  example: |
    {
      "waf": {
        "kind": "web_acl",
        "logging": {
          "enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.waf.kind
      op: eq
      value: web_acl
    - field: properties.waf.logging.enabled
      op: eq
      value: false
