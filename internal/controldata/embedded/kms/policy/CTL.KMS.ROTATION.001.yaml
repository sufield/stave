dsl_version: ctrl.v1
id: CTL.KMS.ROTATION.001
name: KMS Customer-Managed Key Rotation Must Be Enabled
description: >
  Customer-created symmetric KMS keys must have automatic key rotation
  enabled. Key rotation limits the amount of data encrypted with a
  single key version, reducing the blast radius of key compromise.
domain: exposure
severity: medium
compliance:
  cis_aws_v3.0: "3.6"
  soc2: "CC6.7"
  pci_dss_v4.0: "3.6.1"
  nist_800_53_r5: "SC-12"
  fedramp_moderate: "SC-12"
  gdpr: "Art.32"
  ffiec: "ISH-4"
  iso_27001_2022: "A.8.24"
  nist_csf_2.0: "PR.DS"
  ccm_v4: ["CEK-03", "CEK-05"]
scope_tags:
  - aws
  - kms
type: unsafe_state
classification: state_assertion
params:
  attack_stage: exfiltration
remediation:
  description: >
    KMS key does not have automatic rotation enabled.
  action: >
    Enable key rotation:
    aws kms enable-key-rotation --key-id <key-id>
  example: |
    {
      "cryptography": {
        "kind": "key",
        "key_rotation_enabled": true
      }
    }
unsafe_predicate:
  all:
    - field: properties.cryptography.kind
      op: eq
      value: key
    - field: properties.cryptography.key_rotation_enabled
      op: eq
      value: false
