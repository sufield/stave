dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.XRAY.OFF.001
name: Step Functions X-Ray Tracing Disabled On Production Workflow
description: >
  Step Functions production workflow has X-Ray
  tracing disabled. Cross-service correlation
  (Lambda + DDB + SQS / SNS spans linked to
  the workflow execution) is impossible
  without it; latency / error breakdown
  per-service and per-state is also lost.
  Performance investigations rely on per-
  service log correlation by execution ID,
  which is fragile.
domain: detect
severity: medium
compliance:
  soc2: "CC7.2"
  nist_800_53_r5: "AU-12, SI-4"
  fedramp_moderate: "AU-12"
  iso_27001_2022: "A.8.16"
  ccm_v4: ["LOG-08"]
scope_tags:
  - aws
  - stepfunctions
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: detection_evasion
remediation:
  description: >
    X-Ray tracing disabled on production.
  action: >
    Set tracingConfiguration.enabled: true.
    Configure 100% sampling for low-volume
    workflows, 10% for high-volume. Add
    annotations (execution ID, tenant) for
    queryable traces.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "log": {
          "xray_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.log.is_production
      op: eq
      value: true
    - field: properties.compute.log.xray_enabled
      op: eq
      value: false
defect: >
  X-Ray disabled on production workflow.
infection: >
  Cross-service correlation absent;
  performance investigation slow.
failure: >
  Tracing baseline absent.
tests:
  - name: off fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          log:
            is_production: true
            xray_enabled: false
  - name: on passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          log:
            is_production: true
            xray_enabled: true
