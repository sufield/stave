dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.ALARM.EXEC.FAILED.001
name: Step Functions ExecutionsFailed Has No CloudWatch Alarm
description: >
  No CloudWatch alarm on the `ExecutionsFailed`
  metric. Failed executions accumulate without
  paging on-call; only customer impact (or
  daily review) surfaces them. The metric is
  the most direct workflow-health signal.
domain: detection
severity: high
compliance:
  soc2: "CC7.2, A1.1"
  nist_800_53_r5: "AU-12, SI-4"
  fedramp_moderate: "AU-12"
  iso_27001_2022: "A.8.16"
  ccm_v4: ["LOG-08"]
scope_tags:
  - aws
  - stepfunctions
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: detection_evasion
remediation:
  description: >
    No alarm on ExecutionsFailed.
  action: >
    Create alarm: ExecutionsFailed > 0 for 1
    datapoint, page on-call. For high-volume
    workflows, alarm on rate (>5%) instead of
    raw count.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "alarms": {
          "executions_failed_alarm": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.alarms.executions_failed_alarm
      op: eq
      value: false
defect: >
  No alarm on ExecutionsFailed.
infection: >
  Failures accumulate; on-call learns from
  customer impact rather than the alarm.
failure: >
  Critical-path signal absent.
tests:
  - name: missing fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          alarms:
            executions_failed_alarm: false
  - name: present passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          alarms:
            executions_failed_alarm: true
