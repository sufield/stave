dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.ALIAS.NOWEIGHTED.001
name: Step Functions Aliases Don't Use Weighted Routing For Canary Deploys
description: >
  Step Functions aliases route 100% of
  StartExecution calls to a single version.
  Deploys are all-or-nothing; canary deploys
  (route 1% to new version, watch alarms,
  then ramp) impossible. Production
  deploys carry full risk on every change.
domain: governance
severity: medium
compliance:
  soc2: "CC8.1, A1.1"
  nist_800_53_r5: "CM-3"
  fedramp_moderate: "CM-3"
  iso_27001_2022: "A.8.32"
  ccm_v4: ["BCR-08"]
scope_tags:
  - aws
  - stepfunctions
taxonomy:
  - compliance-mapping
  - monitoring
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: persistence
remediation:
  description: >
    Aliases without weighted routing.
  action: >
    Configure weighted RoutingConfiguration
    when deploying new versions; e.g., new
    version 5%, prior version 95%, ramp
    over hours while watching ExecutionsFailed
    alarm.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "deployment": {
          "alias_uses_weighted_routing": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.deployment.alias_uses_weighted_routing
      op: eq
      value: false
defect: >
  Aliases without weighted routing.
infection: >
  All-or-nothing deploys; no canary signal
  before full traffic.
failure: >
  Deploy risk profile binary.
tests:
  - name: no canary fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          deployment:
            alias_uses_weighted_routing: false
  - name: canary passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          deployment:
            alias_uses_weighted_routing: true
