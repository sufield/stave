dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.ASL.MAP.MAXCONCURRENCY.ZERO.001
name: Step Functions Map State Sets MaxConcurrency To Zero (Unlimited)
description: >
  ASL `Map` state sets `MaxConcurrency: 0` —
  ASL semantics treat 0 as "no limit," same
  as the field being absent. Common confusion:
  operator intends "process zero items" or
  "default" but actually configures unbounded
  fan-out.
domain: lifecycle
severity: high
compliance:
  soc2: "CC7.4, A1.1"
  nist_800_53_r5: "SI-11, SC-5"
  fedramp_moderate: "SI-11"
  iso_27001_2022: "A.8.16"
  ccm_v4: ["BCR-08"]
scope_tags:
  - aws
  - stepfunctions
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: persistence
remediation:
  description: >
    Map MaxConcurrency: 0.
  action: >
    Set explicit positive value (typical: 50).
    If "no concurrency" was intended, omit
    Map entirely.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "asl": {
          "map_maxconcurrency_zero_count": 0
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.asl.map_maxconcurrency_zero_count
      op: gt
      value: 0
defect: >
  Map MaxConcurrency: 0 (unlimited).
infection: >
  Same as no-limit; fan-out unbounded;
  semantics surprise.
failure: >
  Misleading config.
tests:
  - name: zero fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          asl:
            map_maxconcurrency_zero_count: 1
  - name: positive passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          asl:
            map_maxconcurrency_zero_count: 0
