dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.ASL.MAP.LARGE.NOTDISTRIBUTED.001
name: Step Functions Inline Map With Large Input Should Be Distributed Map
description: >
  Inline (legacy) Map state runs with input
  arrays large enough to hit the inline limit
  (Standard: ~25,000 history events; Express:
  hard limit ~30 items in some builds). Beyond
  the inline limit, executions fail mid-run
  with no partial-result recovery. Distributed
  Map (ProcessorConfig.Mode: DISTRIBUTED) was
  introduced specifically to handle large
  inputs.
domain: lifecycle
severity: high
compliance:
  soc2: "CC7.4, A1.1"
  nist_800_53_r5: "SI-11, SC-5"
  fedramp_moderate: "SI-11"
  iso_27001_2022: "A.8.16"
  ccm_v4: ["BCR-08"]
scope_tags:
  - aws
  - stepfunctions
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: persistence
remediation:
  description: >
    Inline Map with large input.
  action: >
    Migrate to Distributed Map: add
    `ItemProcessor.ProcessorConfig.Mode:
    DISTRIBUTED`. Workflow definition shape
    changes; test thoroughly.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "asl": {
          "inline_map_large_count": 0
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.asl.inline_map_large_count
      op: gt
      value: 0
defect: >
  Inline Map handling input larger than
  inline limit.
infection: >
  Mid-run failure once history-events limit
  hit; no partial recovery.
failure: >
  Sizing mismatch.
tests:
  - name: large inline fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          asl:
            inline_map_large_count: 1
  - name: distributed passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          asl:
            inline_map_large_count: 0
