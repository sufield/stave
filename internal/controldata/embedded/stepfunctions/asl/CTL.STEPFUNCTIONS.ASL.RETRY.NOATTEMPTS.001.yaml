dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.ASL.RETRY.NOATTEMPTS.001
name: Step Functions Retry Clause With MaxAttempts Zero
description: >
  ASL `Retry` clause has `MaxAttempts: 0` —
  effectively disables retry. Transient
  failures (DDB throttling, Lambda cold-start
  timeout, SDK 5xx) propagate as task failure
  on first attempt. Standard mitigation for
  these is automatic retry; explicitly
  disabling it indicates retry was set up but
  never tuned, or a misunderstanding.
domain: lifecycle
severity: medium
compliance:
  soc2: "CC7.4, A1.2"
  nist_800_53_r5: "SI-11"
  fedramp_moderate: "SI-11"
  iso_27001_2022: "A.8.16"
  ccm_v4: ["BCR-08"]
scope_tags:
  - aws
  - stepfunctions
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: persistence
remediation:
  description: >
    Retry MaxAttempts: 0.
  action: >
    Set MaxAttempts to a sensible value (3-5
    for typical transient errors, with
    BackoffRate >= 2.0). Or remove the Retry
    block entirely if no retry is intended.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "asl": {
          "retry_zero_attempts_count": 0
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.asl.retry_zero_attempts_count
      op: gt
      value: 0
defect: >
  Retry clause with MaxAttempts: 0.
infection: >
  Transient failures fail-out without retry.
failure: >
  Resilience surface ungated.
tests:
  - name: zero attempts fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          asl:
            retry_zero_attempts_count: 1
  - name: tuned retry passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          asl:
            retry_zero_attempts_count: 0
