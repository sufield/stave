dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.ASL.MAP.NOCATCH.001
name: Step Functions Map State Lacks Catch Clause
description: >
  ASL `Map` state (inline or distributed) has
  no `Catch` clause. Single iteration failure
  aborts the whole Map; downstream cleanup is
  not defined. For distributed Map, failures
  can also bypass `ToleratedFailureCount` if
  the Map itself errors before iteration
  begins.
domain: lifecycle
severity: high
compliance:
  soc2: "CC7.4, A1.2"
  nist_800_53_r5: "SI-11"
  fedramp_moderate: "SI-11"
  iso_27001_2022: "A.8.16"
  ccm_v4: ["BCR-08"]
scope_tags:
  - aws
  - stepfunctions
taxonomy:
  - compliance-mapping
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: persistence
remediation:
  description: >
    Map state has no Catch clause.
  action: >
    Add Catch clause routing to compensation /
    failure state. For distributed Map, also
    configure `ToleratedFailureCount` /
    `ToleratedFailurePercentage`.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "asl": {
          "map_without_catch_count": 0
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.asl.map_without_catch_count
      op: gt
      value: 0
defect: >
  Map state without Catch.
infection: >
  Single iteration failure aborts entire Map;
  partial-iteration state inconsistent.
failure: >
  Fan-out resilience absent.
tests:
  - name: missing catch fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          asl:
            map_without_catch_count: 1
  - name: catch present passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          asl:
            map_without_catch_count: 0
