dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.TOKEN.PLAINTEXT.001
name: Step Functions Task Token Logged Or Persisted In Plaintext
description: >
  Step Functions Task token (used by
  `.waitForTaskToken` integrations) is
  captured in workflow logs (CloudWatch),
  persisted in SQS / SNS / S3 without
  encryption, or otherwise reachable in
  plaintext. Anyone reading the captured token
  can call `SendTaskSuccess` /
  `SendTaskFailure` for the workflow,
  spoofing worker responses and progressing
  the workflow with attacker-supplied data.
domain: encryption
severity: high
compliance:
  soc2: "CC6.1, CC6.7"
  pci_dss_v4.0: "3.5.1, 8.3.2"
  nist_800_53_r5: "IA-5, SC-28"
  fedramp_moderate: "SC-28"
  iso_27001_2022: "A.5.16, A.8.24"
  ccm_v4: ["IAM-09", "CEK-04"]
scope_tags:
  - aws
  - stepfunctions
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: credential_access
remediation:
  description: >
    Task token captured in plaintext.
  action: >
    Mask token in log output (workflow
    logging.IncludeExecutionData filter or
    Pass-state redaction). Worker queue (SQS /
    SNS) carrying the token must use SSE-KMS.
    Treat the token as a credential.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "encrypt": {
          "task_token_protected": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.encrypt.uses_task_token
      op: eq
      value: true
    - field: properties.compute.encrypt.task_token_protected
      op: eq
      value: false
defect: >
  Task token reachable in plaintext.
infection: >
  Attacker spoofs SendTaskSuccess; workflow
  progresses with attacker data.
failure: >
  Token-as-credential leak.
tests:
  - name: leak fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          encrypt:
            uses_task_token: true
            task_token_protected: false
  - name: protected passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          encrypt:
            uses_task_token: true
            task_token_protected: true
