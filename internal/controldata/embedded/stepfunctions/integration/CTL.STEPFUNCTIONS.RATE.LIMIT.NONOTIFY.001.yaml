dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.RATE.LIMIT.NONOTIFY.001
name: Step Functions No Notification On StartExecution Rate Throttling
description: >
  Step Functions IAM role used to invoke
  StartExecution has no rate-limit on the
  caller side, and no CloudWatch alarm /
  EventBridge rule configured to notify on
  approach to the StartExecution burst /
  account-level concurrent quota. Sudden
  bursts (event-storm scenarios) silently
  exhaust quota; downstream consumers see
  failed invocations without traceable
  source.
domain: detect
severity: medium
compliance:
  soc2: "CC7.2, A1.1"
  nist_800_53_r5: "AU-12, SI-4"
  fedramp_moderate: "AU-12"
  iso_27001_2022: "A.8.16"
  ccm_v4: ["LOG-08"]
scope_tags:
  - aws
  - stepfunctions
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: detection_evasion
remediation:
  description: >
    No notification on rate-limit approach.
  action: >
    Create CloudWatch alarm: ExecutionsStarted
    rate > 80% of region quota. Subscribe
    on-call to detect surges before quota is
    hit.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "alarms": {
          "rate_limit_notify_present": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.alarms.rate_limit_notify_present
      op: eq
      value: false
defect: >
  No rate-limit-approach notification.
infection: >
  Quota exhaustion silent; downstream
  failures unattributed.
failure: >
  Capacity headroom unobserved.
tests:
  - name: missing fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          alarms:
            rate_limit_notify_present: false
  - name: present passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          alarms:
            rate_limit_notify_present: true
