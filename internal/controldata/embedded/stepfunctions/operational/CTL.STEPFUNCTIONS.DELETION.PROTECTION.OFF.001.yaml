dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.DELETION.PROTECTION.OFF.001
name: Step Functions Production State Machine Has No Deletion Protection
description: >
  Step Functions production-tier state machine
  has no termination protection. A single
  DeleteStateMachine call (accidental,
  malicious, buggy automation) destroys the
  workflow irreversibly. Production state
  machines require an explicit deletion-
  protection flag or SCP guard.
domain: governance
severity: high
compliance:
  soc2: "CC8.1, A1.2"
  nist_800_53_r5: "CM-3, CP-9"
  fedramp_moderate: "CM-3"
  iso_27001_2022: "A.5.16, A.8.32"
  ccm_v4: ["GRC-08", "BCR-08"]
scope_tags:
  - aws
  - stepfunctions
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: impact
remediation:
  description: >
    Production state machine has no deletion
    protection.
  action: >
    Apply tag-based SCP that denies
    DeleteStateMachine on production-tagged
    machines. Pair with versioning so
    rollback is possible if something does
    delete.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "operational": {
          "deletion_protection": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.operational.is_production
      op: eq
      value: true
    - field: properties.compute.operational.deletion_protection
      op: eq
      value: false
defect: >
  Production state machine without deletion
  protection.
infection: >
  Single DeleteStateMachine = irreversible
  loss.
failure: >
  No undo for destruction.
tests:
  - name: off fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          operational:
            is_production: true
            deletion_protection: false
  - name: on passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          operational:
            is_production: true
            deletion_protection: true
