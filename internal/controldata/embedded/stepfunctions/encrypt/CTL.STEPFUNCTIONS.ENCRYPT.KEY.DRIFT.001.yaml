dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.ENCRYPT.KEY.DRIFT.001
name: Step Functions Definition And Execution KMS Keys Differ
description: >
  Step Functions state machine's definition
  encryption key differs from the per-
  execution data encryption key. Operators
  rotating one key out without rotating the
  other lose the ability to read either old
  definitions or old execution histories.
  Compliance / forensic recovery requires both
  keys; key custody must be coherent.
domain: encryption
severity: medium
compliance:
  soc2: "CC6.7, CC8.1"
  nist_800_53_r5: "SC-12, CM-3"
  fedramp_moderate: "SC-12"
  iso_27001_2022: "A.8.24"
  ccm_v4: ["CEK-09"]
scope_tags:
  - aws
  - stepfunctions
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: persistence
remediation:
  description: >
    Definition key != execution key.
  action: >
    Align both EncryptionConfiguration KmsKeyId
    references to the same customer-managed
    CMK. Document the key custody decision.
    For multi-region DR, use a multi-region
    KMS key.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "encrypt": {
          "definition_and_exec_keys_match": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.encrypt.definition_and_exec_keys_match
      op: eq
      value: false
defect: >
  Definition and execution keys differ.
infection: >
  Out-of-sync rotation breaks read of one or
  the other historical record.
failure: >
  Key-custody inconsistency.
tests:
  - name: drift fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          encrypt:
            definition_and_exec_keys_match: false
  - name: aligned passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          encrypt:
            definition_and_exec_keys_match: true
