dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.LAMBDA.DLQ.MISSING.001
name: Step Functions Lambda Function Async Invocation DLQ Not Configured
description: >
  Lambda function called via async invocation
  pattern (e.g., from Step Functions Map with
  high concurrency, or from EventBridge →
  Step Functions → Lambda chain) has no Dead
  Letter Queue configured. Lambda's internal
  retries can run out; without DLQ, the
  failure record is lost. For workflows
  that need at-least-once semantics on
  Lambda invocation, DLQ is required.
domain: lifecycle
severity: medium
compliance:
  soc2: "CC7.4, A1.2"
  nist_800_53_r5: "SI-11, AU-12"
  fedramp_moderate: "SI-11"
  iso_27001_2022: "A.8.16"
  ccm_v4: ["BCR-08"]
scope_tags:
  - aws
  - stepfunctions
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: persistence
remediation:
  description: >
    Async-invoked Lambda has no DLQ.
  action: >
    Configure DeadLetterConfig on the Lambda
    function pointing at SQS / SNS. Alarm
    on DLQ object count > 0 for prompt
    investigation.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "asl": {
          "lambda_async_dlq_configured": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.asl.has_async_lambda
      op: eq
      value: true
    - field: properties.compute.asl.lambda_async_dlq_configured
      op: eq
      value: false
defect: >
  Async-invoked Lambda without DLQ.
infection: >
  Failed retries lost; at-least-once
  semantics violated.
failure: >
  Async failure surface unobserved.
tests:
  - name: missing fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          asl:
            has_async_lambda: true
            lambda_async_dlq_configured: false
  - name: present passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          asl:
            has_async_lambda: true
            lambda_async_dlq_configured: true
