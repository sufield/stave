dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.IAM.STARTEXEC.WILDCARD.001
name: Step Functions StartExecution Granted To Wildcard Principal
description: >
  Step Functions state machine has an IAM policy
  granting `states:StartExecution` to
  `Principal: "*"` without conditions. Any AWS
  identity (or anonymous, depending on path) can
  start executions of this state machine,
  consuming downstream Lambda / DDB / SNS
  resources at the workflow's full IAM
  authority.
domain: exposure
severity: critical
compliance:
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  nist_800_53_r5: "AC-3, AC-6"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.5.15, A.8.20"
  ccm_v4: ["IAM-02", "IAM-16"]
scope_tags:
  - aws
  - stepfunctions
taxonomy:
  - compliance-mapping
  - confused-deputy
  - trust-boundary
subtractive_category:
  - S02
  - S03
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: initial_access
  blast_radius:
    type: data_exposure
    scope: account
    multiplier: 3.0
remediation:
  description: >
    StartExecution granted to wildcard principal.
  action: >
    Replace Principal: "*" with specific role
    ARNs that need to start executions. Add
    `aws:SourceAccount` / `aws:SourceArn`
    conditions for cross-account integrations.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "iam": {
          "startexec_wildcard_principal": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.iam.startexec_wildcard_principal
      op: eq
      value: true
defect: >
  StartExecution granted Principal: "*".
infection: >
  Any AWS identity reaching the policy path can
  start executions; downstream resources
  invoked at workflow authority.
failure: >
  Workflow ungated; cost / abuse / pivot
  surface open.
tests:
  - name: wildcard fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          iam:
            startexec_wildcard_principal: true
  - name: scoped passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          iam:
            startexec_wildcard_principal: false
