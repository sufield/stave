dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.IAM.STATES.WILDCARD.001
name: Step Functions IAM Policy Grants states:* On Resource:*
description: >
  IAM policy grants `states:*` on `Resource: "*"`
  without scoping by tag, account, or specific
  state machine ARN. Roles holding this policy
  can create, update, delete, start, and stop
  every state machine in the account. Most
  workloads need just StartExecution / Describe
  on a single ARN.
domain: exposure
severity: critical
compliance:
  soc2: "CC6.1, CC6.3"
  pci_dss_v4.0: "7.2.1, 7.2.2"
  nist_800_53_r5: "AC-6"
  fedramp_moderate: "AC-6"
  iso_27001_2022: "A.5.15, A.8.20"
  ccm_v4: ["IAM-02", "IAM-16"]
scope_tags:
  - aws
  - stepfunctions
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: privilege_escalation
  blast_radius:
    type: control_plane
    scope: account
    multiplier: 3.0
remediation:
  description: >
    states:* on Resource:* granted to non-admin.
  action: >
    Narrow to the specific actions the role needs
    (StartExecution, DescribeExecution) on the
    specific state machine ARN. Reserve states:*
    for admin / break-glass with sign-off.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "iam": {
          "states_wildcard_resource_wildcard": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.iam.states_wildcard_resource_wildcard
      op: eq
      value: true
defect: >
  states:* on Resource:* present on non-admin role.
infection: >
  Compromise of any role with this policy yields
  full Step Functions control-plane authority
  on every state machine in the account.
failure: >
  Cross-machine privilege amplification.
tests:
  - name: wildcard fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          iam:
            states_wildcard_resource_wildcard: true
  - name: scoped passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          iam:
            states_wildcard_resource_wildcard: false
