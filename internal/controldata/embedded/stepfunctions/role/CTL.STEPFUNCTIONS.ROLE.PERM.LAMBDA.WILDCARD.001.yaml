dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.ROLE.PERM.LAMBDA.WILDCARD.001
name: Step Functions Execution Role Grants lambda:InvokeFunction On Wildcard Resource
description: >
  Execution role grants `lambda:InvokeFunction`
  on `Resource: "*"` instead of specific function
  ARNs. State machine can invoke any Lambda in
  the account, not just its own task functions.
  Compromise of the workflow input or definition
  becomes a path to invoke arbitrary Lambdas.
domain: exposure
severity: high
compliance:
  soc2: "CC6.1, CC6.3"
  pci_dss_v4.0: "7.2.1"
  nist_800_53_r5: "AC-6"
  fedramp_moderate: "AC-6"
  iso_27001_2022: "A.5.15, A.8.20"
  ccm_v4: ["IAM-02", "IAM-16"]
scope_tags:
  - aws
  - stepfunctions
taxonomy:
  - compliance-mapping
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: privilege_escalation
  blast_radius:
    type: control_plane
    scope: account
    multiplier: 2.5
remediation:
  description: >
    lambda:InvokeFunction granted on Resource:*.
  action: >
    Pin Resource to specific function ARNs (or
    aliases / versions) referenced by the state
    machine. Use ABAC for many-function cases.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "role": {
          "lambda_invoke_wildcard": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.role.lambda_invoke_wildcard
      op: eq
      value: true
defect: >
  lambda:InvokeFunction on Resource:*.
infection: >
  State machine can invoke arbitrary Lambdas;
  workflow becomes a Lambda invocation pivot.
failure: >
  Lambda invocation surface unscoped.
tests:
  - name: wildcard fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          role:
            lambda_invoke_wildcard: true
  - name: pinned passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          role:
            lambda_invoke_wildcard: false
