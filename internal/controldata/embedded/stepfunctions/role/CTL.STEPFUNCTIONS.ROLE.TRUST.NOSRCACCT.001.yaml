dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.ROLE.TRUST.NOSRCACCT.001
name: Step Functions Execution Role Trust Policy Lacks SourceAccount/SourceArn
description: >
  Step Functions execution role's trust policy
  trusts `states.amazonaws.com` but lacks
  `aws:SourceAccount` and `aws:SourceArn`
  conditions. Without them, Step Functions in any
  account can be tricked into assuming this role
  via a confused-deputy chain (e.g. a Step
  Functions service in account B calling
  StartExecution on a state machine pointing at
  this role's ARN). The two conditions bind the
  trust to a specific calling account / state
  machine.
domain: exposure
severity: high
compliance:
  soc2: "CC6.1, CC6.6"
  pci_dss_v4.0: "7.2.4"
  nist_800_53_r5: "AC-3, AC-6"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.5.16, A.8.20"
  ccm_v4: ["IAM-09", "IAM-16"]
scope_tags:
  - aws
  - stepfunctions
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: privilege_escalation
  blast_radius:
    type: cross_account
    scope: cross_account
    multiplier: 3.0
remediation:
  description: >
    Trust policy missing SourceAccount /
    SourceArn condition.
  action: >
    Add condition keys to the trust policy:
      "Condition": {
        "StringEquals": {"aws:SourceAccount": "111122223333"},
        "ArnLike": {"aws:SourceArn": "arn:aws:states:us-east-1:111122223333:stateMachine:*"}
      }
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "role": {
          "trust_has_source_account": true,
          "trust_has_source_arn": true
        }
      }
    }
unsafe_predicate:
  any:
    - all:
        - field: properties.compute.kind
          op: eq
          value: state_machine
        - field: properties.compute.role.trust_has_source_account
          op: eq
          value: false
    - all:
        - field: properties.compute.kind
          op: eq
          value: state_machine
        - field: properties.compute.role.trust_has_source_arn
          op: eq
          value: false
defect: >
  Execution role trust policy lacks
  SourceAccount or SourceArn condition.
infection: >
  Confused-deputy: Step Functions in another
  account can pivot through this role.
failure: >
  Trust boundary unscoped.
tests:
  - name: missing source-account fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          role:
            trust_has_source_account: false
            trust_has_source_arn: true
  - name: both conditions passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          role:
            trust_has_source_account: true
            trust_has_source_arn: true
