dsl_version: ctrl.v1
id: CTL.RDS.AUTH.MASTERPASSWORD.AGE.001
name: RDS Master Password Must Be Rotated Within Threshold
description: >
  RDS master passwords must be rotated at least every 90 days. The
  master password is the administrative credential — schema
  modification, user management, full data access, and
  configuration change all flow from it. Long-lived master
  passwords accumulate exposure across the lifetime of the
  organization: terminal sessions logged to shell history, config
  files committed to private-then-public repositories, connection
  pool definitions cached in build artifacts, Slack DMs and email
  threads from the database's initial setup, and team members who
  have rotated through the role and still have the credential in
  a password manager. Each individual exposure is small; the
  cumulative exposure of a 200-day-old password is significant
  and irreducible without rotation. The 90-day floor matches
  PCI-DSS 8.3 and FedRAMP credential-rotation expectations.
  Observable via the Secrets Manager secret's LastChangedDate when
  RDS uses ManageMasterUserPassword, or via CloudTrail
  ModifyDBInstance --master-user-password events otherwise.
domain: access
severity: high
compliance:
  nist_800_53_r5: "IA-5"
  pci_dss_v4: "8.3"
  hipaa: "164.308(a)(5)(ii)(D)"
  ccm_v4: ["IAM-02", "CEK-05"]
scope_tags: [aws, rds]
taxonomy:
  - credential-lifecycle
  - logging
  - trust-decay
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_rds_instance]
params:
  attack_stage: credential_access
remediation:
  description: RDS master password has not been rotated within the threshold window.
  action: Rotate the master password (or enable Secrets Manager automatic rotation if using ManageMasterUserPassword).
  example: |
    {"database": {"kind": "rds_instance", "auth": {"master_password_stale": false}}}
unsafe_predicate:
  all:
    - field: properties.database.kind
      op: eq
      value: rds_instance
    - field: properties.database.auth.master_password_stale
      op: eq
      value: true
