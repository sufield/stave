dsl_version: ctrl.v1
id: CTL.RDS.BACKUP.RETENTION.COMPLIANCE.001
name: RDS Backup Retention Must Meet the Active Compliance Floor
description: >
  RDS automated backup retention must meet the framework floor
  applicable to the data the instance handles: PCI-DSS 10.7
  (1 year online, 1 year accessible offline; the operationally
  relevant floor is 365 days), HIPAA's 6-year audit retention
  under 164.316 (≈2190 days for the technical safeguards an
  RDS backup is taken to satisfy), SOX's 7-year retention for
  financial records (≈2555 days). The control is compliance-
  conditional: it fires when the instance carries a compliance
  tag (HIPAA, PCI, PII, FedRAMP, SOX, etc.) AND the retention
  is below the framework's floor. Operational-only retention
  (the basic "automated backups enabled" check) is covered by
  CTL.RDS.BACKUP.001; this control catches the gap between
  "backups exist" and "backups satisfy regulatory recovery
  windows." The remediation is either extending the automated-
  backup retention (capped at 35 days by RDS) or, more
  commonly, an AWS Backup vault with a lifecycle policy that
  matches the framework floor.
domain: governance
severity: high
compliance:
  nist_800_53_r5: "CP-9"
  pci_dss_v4: "10.7"
  hipaa: "164.316(b)(2)(i)"
  ccm_v4: ["BCR-09"]
scope_tags: [aws, rds]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
params:
  attack_stage: resilience
remediation:
  description: RDS backup retention is below the active compliance framework's floor.
  action: Extend automated-backup retention or attach an AWS Backup vault with a framework-aligned lifecycle policy.
  example: |
    {"database": {"kind": "rds_instance", "backup": {"retention_meets_compliance": true}}}
unsafe_predicate:
  all:
    - field: properties.database.kind
      op: eq
      value: rds_instance
    - field: properties.database.backup.has_compliance_obligation
      op: eq
      value: true
    - field: properties.database.backup.retention_meets_compliance
      op: eq
      value: false
