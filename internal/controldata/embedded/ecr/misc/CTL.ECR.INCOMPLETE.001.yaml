dsl_version: ctrl.v1
id: CTL.ECR.INCOMPLETE.001
name: Complete Data Required for ECR Assessment
description: >
  ECR repository safety cannot be proven when access control data
  is missing from the snapshot. The extractor must populate
  container_registry.access.public to evaluate exposure controls.
compliance:
  ccm_v4: ["DCS-06"]
domain: exposure
severity: low
scope_tags:
  - aws
  - ecr
taxonomy:
  - compliance-mapping
subtractive_category:
  - S08
applicable_asset_types:
  - aws_ecr_repository
type: unsafe_state
classification: state_assertion
params: {}
remediation:
  description: >
    ECR assessment data is incomplete. The extractor did not populate
    required access control properties.
  action: >
    Re-run the extractor with ECR permissions:
    ecr:DescribeRepositories, ecr:GetRepositoryPolicy.
unsafe_predicate:
  all:
    - field: properties.container_registry.kind
      op: eq
      value: repository
    - field: properties.container_registry.access.public
      op: missing
      value: true
