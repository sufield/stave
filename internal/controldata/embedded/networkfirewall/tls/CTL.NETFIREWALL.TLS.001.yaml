dsl_version: ctrl.v1
id: CTL.NETFIREWALL.TLS.001
name: Network Firewall TLS Inspection Not Configured
description: >
  Network Firewall does not have TLS inspection enabled. Encrypted
  traffic (HTTPS, TLS) passes through the firewall with only
  connection-metadata visibility — source and destination IPs,
  ports, SNI hostnames. The firewall cannot inspect the encrypted
  payload: URL paths, request bodies, response content, uploaded
  files. Malware delivered via HTTPS, command-and-control
  communication over HTTPS, and data exfiltration inside TLS
  sessions bypass content inspection entirely. TLS inspection is a
  defense-in-depth measure with operational tradeoffs (certificate
  management, performance impact, privacy and compliance
  considerations for decrypting user traffic) — not every
  environment should enable it, but every environment should
  document a conscious decision about it.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "SI-4"
  fedramp_moderate: "SI-4"
  pci_dss_v4.0: "11.5.1"
  soc2: "CC7.1"
  hipaa: "164.312(e)(1)"
  ccm_v4: ["CEK-10", "IVS-04"]
scope_tags:
  - aws
  - networkfirewall
taxonomy:
  - compliance-mapping
  - encryption-in-transit
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
observation_fields:
  - network.kind
  - network.firewall.tls_inspection_enabled
  - network.firewall.tls_certificate_arn
remediation:
  description: >
    Network Firewall does not inspect TLS traffic. Encrypted flows
    bypass content inspection.
  action: >
    Enable TLS inspection on the firewall policy. Provision an ACM
    certificate for the firewall's interception role and configure
    the TLS inspection configuration with the traffic scope
    (source/destination CIDRs, SNI patterns). Exclude flows where
    decryption is contractually or legally inappropriate (employee
    personal services, healthcare portals, banking, etc.) via an
    allowlist. If TLS inspection is intentionally not used,
    document the decision and the compensating controls (endpoint
    protection, egress allowlisting by domain, application-layer
    logging on the destination).
  example: |
    {
      "network": {
        "kind": "network_firewall",
        "firewall": {
          "tls_inspection_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: network_firewall
    - field: properties.network.firewall.tls_inspection_enabled
      op: eq
      value: false
