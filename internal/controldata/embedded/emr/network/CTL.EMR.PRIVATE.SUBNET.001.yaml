dsl_version: ctrl.v1
id: CTL.EMR.PRIVATE.SUBNET.001
name: EMR Cluster Must Be Provisioned in Private VPC Subnet
description: >
  EMR clusters must be provisioned in private VPC subnets (subnets
  without a route to an internet gateway). A cluster in a public
  subnet — even without public IPs on nodes — can be reached via
  the internet gateway if security groups allow it. Private subnets
  ensure the cluster is reachable only through VPN, Direct Connect,
  or VPC peering, not from the public internet.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SC-7"
  soc2: "CC6.6"
  pci_dss_v4.0: "1.3.1"
  ccm_v4: ["IVS-03", "IVS-09"]
scope_tags:
  - aws
  - emr
taxonomy:
  - compliance-mapping
  - network-isolation
subtractive_category:
  - S03
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_emr_cluster]
params:
  attack_stage: initial_access
remediation:
  description: >
    EMR cluster is provisioned in a public subnet.
  action: >
    Recreate the cluster in a private subnet. Configure a NAT
    gateway or VPC endpoints for S3 and other AWS service access.
    Use AWS Systems Manager Session Manager or a bastion host for
    administrative access.
  example: |
    {
      "compute": {
        "kind": "emr_cluster",
        "network": {
          "in_private_subnet": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: emr_cluster
    - field: properties.compute.network.in_private_subnet
      op: ne
      value: true
tests:
  - name: public subnet fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:elasticmapreduce:us-east-1:123456789012:cluster/j-ABC123"
      asset_type: aws_emr_cluster
      vendor: aws
      properties:
        compute:
          kind: emr_cluster
          network:
            in_private_subnet: false
  - name: private subnet passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:elasticmapreduce:us-east-1:123456789012:cluster/j-ABC123"
      asset_type: aws_emr_cluster
      vendor: aws
      properties:
        compute:
          kind: emr_cluster
          network:
            in_private_subnet: true
