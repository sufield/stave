dsl_version: ctrl.v1
id: CTL.AZURE.SQL.ADADMIN.001
name: SQL Server Entra ID Admin Not Configured
description: >
  No Entra ID administrator set. Entra ID authentication is not
  possible without an admin configured.
domain: identity
severity: medium
compliance:
  cis_azure_v2: "4.1.3"
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
scope_tags: [azure]
taxonomy:
  - compliance-mapping
  - least-privilege
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: SQL Server Entra ID Admin Not Configured — finding detected.
  action: Configure an Entra ID administrator for the SQL server.
  example: |
    {"azure": {"database": {"kind": "sql_server", "sql": {"ad_admin_configured": true}}}}
unsafe_predicate:
  all:
    - field: properties.azure.database.kind
      op: eq
      value: sql_server
    - field: properties.azure.database.sql.ad_admin_configured
      op: eq
      value: false
