dsl_version: ctrl.v1
id: CTL.AZURE.SQL.TLS.001
name: SQL Server TLS Minimum Version Below 1.2
description: >
  SQL server accepts TLS 1.0 or 1.1 connections with known
  vulnerabilities (BEAST, POODLE, CRIME).
domain: encryption
severity: high
compliance:
  cis_azure_v2: "4.1.5"
  nist_800_53_r5: "SC-8"
  pci_dss_v4: "4.1"
  soc2: "CC6.1"
scope_tags: [azure]
taxonomy:
  - compliance-mapping
  - encryption-in-transit
subtractive_category:
  - S10
type: unsafe_state
classification: state_assertion
applicable_asset_types: [azure_resource]
params:
  attack_stage: initial_access
remediation:
  description: SQL Server TLS Minimum Version Below 1.2 — finding detected.
  action: Set minimum TLS version to 1.2.
  example: |
    {"azure": {"database": {"kind": "sql_server", "sql": {"tls_minimum_version": "1.2"}}}}
unsafe_predicate:
  all:
    - field: properties.azure.database.kind
      op: eq
      value: sql_server
    - field: properties.azure.database.sql.tls_minimum_version
      op: lt
      value: "1.2"
