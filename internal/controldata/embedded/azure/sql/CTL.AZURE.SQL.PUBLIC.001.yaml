dsl_version: ctrl.v1
id: CTL.AZURE.SQL.PUBLIC.001
name: Azure SQL Must Not Allow Public Network Access
description: >
  SQL server accepts connections from the public internet.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SC-7"
  soc2: "CC6.1"
  ccm_v4: ["IVS-03"]
scope_tags: [azure]
taxonomy:
  - compliance-mapping
  - network-perimeter
subtractive_category:
  - S03
type: unsafe_state
classification: state_assertion
applicable_asset_types: [azure_resource]
params:
  attack_stage: initial_access
remediation:
  description: Azure SQL Must Not Allow Public Network Access — finding detected.
  action: Remediate per control description.
  example: |
    {"azure": {"database": {"kind": "sql_server", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.azure.database.kind
      op: eq
      value: sql_server
    - field: properties.azure.database.sql.public_network_access
      op: eq
      value: true
