dsl_version: ctrl.v1
id: CTL.AZURE.MYSQL.PUBLIC.001
name: MySQL Public Network Access Enabled
description: >
  Server accepts connections from the public internet. Database
  is directly reachable without VNet or private endpoint restriction.
domain: exposure
severity: high
compliance:
  cis_azure_v2: "4.4.2"
  nist_800_53_r5: "AC-4"
  hipaa: "164.312(a)(1)"
  pci_dss_v4: "1.3"
  soc2: "CC6.6"
scope_tags: [azure]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: MySQL Public Network Access Enabled — finding detected.
  action: Disable public network access and use private endpoints.
  example: |
    {"azure": {"database": {"kind": "mysql_server", "mysql": {"public_network_access": false}}}}
unsafe_predicate:
  all:
    - field: properties.azure.database.kind
      op: eq
      value: mysql_server
    - field: properties.azure.database.mysql.public_network_access
      op: eq
      value: true
