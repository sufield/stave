dsl_version: ctrl.v1
id: CTL.AZURE.DEFENDER.SQL.001
name: Defender for SQL Not Enabled
description: >
  Defender for SQL Servers not enabled. No SQL threat detection
  for injection attempts, anomalous access, or brute force.
domain: exposure
severity: high
compliance:
  cis_azure_v2: "2.1.3"
  nist_800_53_r5: "SI-4"
  soc2: "CC7.1"
scope_tags: [azure]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Defender for SQL Not Enabled — finding detected.
  action: Enable Defender for SQL Servers at Standard tier.
  example: |
    {"azure": {"monitoring": {"kind": "defender_setting", "defender": {"plan": "SqlServers", "pricing_tier": "Standard"}}}}
unsafe_predicate:
  all:
    - field: properties.azure.monitoring.kind
      op: eq
      value: defender_setting
    - field: properties.azure.monitoring.defender.plan
      op: eq
      value: SqlServers
    - any:
        - field: properties.azure.monitoring.defender.enabled
          op: eq
          value: false
        - field: properties.azure.monitoring.defender.pricing_tier
          op: eq
          value: Free
