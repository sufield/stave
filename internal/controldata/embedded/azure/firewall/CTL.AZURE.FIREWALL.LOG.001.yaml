dsl_version: ctrl.v1
id: CTL.AZURE.FIREWALL.LOG.001
name: Azure Firewall Must Have Diagnostic Logging Enabled
description: >
  Azure Firewall must have diagnostic logging enabled. Without logging,
  inspected traffic produces no audit trail.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "AU-2"
  soc2: "CC7.1"
  ccm_v4: ["LOG-03"]
scope_tags: [azure]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
remediation:
  description: Azure Firewall diagnostic logging is disabled.
  action: Enable diagnostic settings for AzureFirewallApplicationRule and AzureFirewallNetworkRule logs.
  example: |
    {"azure": {"network": {"kind": "azure_firewall", "firewall": {"diagnostic_logging_enabled": true}}}}
unsafe_predicate:
  all:
    - field: properties.azure.network.kind
      op: eq
      value: azure_firewall
    - field: properties.azure.network.firewall.diagnostic_logging_enabled
      op: eq
      value: false
