dsl_version: ctrl.v1
id: CTL.AZURE.DIAGNOSTIC.001
name: Diagnostic Settings Not Configured on Key Resources
description: >
  Critical resource types lack diagnostic settings. Resource-level
  logs and metrics are not captured for investigation or alerting.
domain: exposure
severity: medium
compliance:
  cis_azure_v2: "5.1.5"
  nist_800_53_r5: "AU-2"
  pci_dss_v4: "10.3"
  soc2: "CC7.2"
scope_tags: [azure]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Diagnostic Settings Not Configured on Key Resources — finding detected.
  action: Remediate per control description.
  example: |
    {"azure": {"monitoring": {"kind": "diagnostic_setting", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.azure.monitoring.kind
      op: eq
      value: diagnostic_setting
    - field: properties.azure.monitoring.diagnostic.logs_enabled
      op: eq
      value: false
