dsl_version: ctrl.v1
id: CTL.AZURE.ENTRA.SIGNINRISK.001
name: Entra ID Sign-In Risk Policy Not Configured
description: >
  No sign-in risk policy. Risky sign-ins (impossible travel,
  anonymous IP, malware-linked IP) are not blocked or challenged
  with MFA. Requires Entra ID P2 license.
domain: identity
severity: high
compliance:
  cis_azure_v2: "1.2.6"
  nist_800_53_r5: "AC-7"
  soc2: "CC6.1"
scope_tags: [azure]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types: [azure_resource]
params:
  attack_stage: initial_access
remediation:
  description: Entra ID Sign-In Risk Policy Not Configured — finding detected.
  action: Configure a sign-in risk policy in Entra ID Identity Protection.
  example: |
    {"azure": {"identity": {"kind": "risk_policy", "signin_risk_policy_configured": true}}}
unsafe_predicate:
  all:
    - field: properties.azure.identity.kind
      op: eq
      value: risk_policy
    - field: properties.azure.identity.signin_risk_policy_configured
      op: ne
      value: true
