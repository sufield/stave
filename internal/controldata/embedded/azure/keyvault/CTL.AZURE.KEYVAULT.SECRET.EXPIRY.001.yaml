dsl_version: ctrl.v1
id: CTL.AZURE.KEYVAULT.SECRET.EXPIRY.001
name: Key Vault Secrets Without Expiration Date
description: >
  Secrets (passwords, API keys, connection strings) without
  expiration persist indefinitely without forced rotation.
domain: encryption
severity: high
compliance:
  owasp_nhi: "NHI7"
  cis_azure_v2: "8.2"
  nist_800_53_r5: "SC-12"
  soc2: "CC6.1"
scope_tags: [azure]
taxonomy:
  - compliance-mapping
subtractive_category:
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types: [azure_resource]
params:
  attack_stage: persistence
remediation:
  description: Key Vault Secrets Without Expiration Date — finding detected.
  action: Set expiration dates on all secrets.
  example: |
    {"azure": {"security": {"kind": "keyvault", "keyvault": {"secret_expiry_set": true}}}}
unsafe_predicate:
  all:
    - field: properties.azure.security.kind
      op: eq
      value: keyvault
    - field: properties.azure.security.keyvault.secret_expiry_set
      op: eq
      value: false
