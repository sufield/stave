dsl_version: ctrl.v1
id: CTL.MWAA.LOG.TASK.001
name: MWAA Environment Must Have Task Logging Enabled
description: >
  MWAA environment does not have task logging enabled. Task logs
  capture Airflow task execution details including DAG runs,
  operator outputs, and failure traces. Without task logging,
  unauthorized DAG modifications or data pipeline tampering
  cannot be detected through execution records.
domain: detection
severity: medium
compliance:
  nist_800_53_r5: "AU-2, AU-3"
  soc2: "CC7.2"
  pci_dss_v4.0: "10.2"
scope_tags:
  - aws
  - mwaa
taxonomy:
  - compliance-mapping
  - logging
subtractive_category:
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_mwaa_environment]
params:
  attack_stage: discovery
remediation:
  description: >
    MWAA environment task logging is not enabled.
  action: >
    Enable task logging for the MWAA environment. Configure
    the task log level to at least INFO to capture DAG
    execution events in CloudWatch Logs.
  example: |
    {
      "compute": {
        "kind": "mwaa_environment",
        "logging": {
          "task_log_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: mwaa_environment
    - field: properties.compute.logging.task_log_enabled
      op: ne
      value: true
tests:
  - name: task logging disabled fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:airflow:us-east-1:123456789012:environment/my-env"
      asset_type: aws_mwaa_environment
      vendor: aws
      properties:
        compute:
          kind: mwaa_environment
          logging:
            task_log_enabled: false
  - name: task logging enabled passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:airflow:us-east-1:123456789012:environment/my-env"
      asset_type: aws_mwaa_environment
      vendor: aws
      properties:
        compute:
          kind: mwaa_environment
          logging:
            task_log_enabled: true
