dsl_version: ctrl.v1
id: CTL.MWAA.ENV.ACTIVE.001
name: MWAA Environments Are Active in Account
description: >
  The account has active MWAA (Managed Workflows for Apache Airflow)
  environments. MWAA provisions Fargate compute, S3 buckets for DAG
  storage, and CloudWatch log groups behind the Airflow API surface.
  DAGs execute arbitrary Python code with the MWAA execution role's
  permissions.
domain: exposure
severity: low
compliance:
  nist_800_53_r5: "CM-8"
  soc2: "CC6.1"
  ccm_v4: ["DSP-04"]
scope_tags: [aws, mwaa]
taxonomy: [resource-sprawl]
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_account]
params:
  attack_stage: discovery
observation_fields: [account.mwaa.has_active_environments]
remediation:
  description: MWAA environments active outside normal governance.
  action: Evaluate intent; if unwanted, delete environments and SCP deny airflow:*.
  example: |
    {"account": {"mwaa": {"has_active_environments": false}}}
unsafe_predicate:
  all:
    - field: properties.account.mwaa.has_active_environments
      op: present
    - field: properties.account.mwaa.has_active_environments
      op: eq
      value: true
tests:
  - name: "active MWAA fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:root"
      asset_type: aws_account
      vendor: aws
      properties:
        account: {mwaa: {has_active_environments: true}}
  - name: "no MWAA passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::444455556666:root"
      asset_type: aws_account
      vendor: aws
      properties:
        account: {mwaa: {has_active_environments: false}}
