dsl_version: ctrl.v1
id: CTL.GUARDDUTY.ENABLED.001
name: Amazon GuardDuty Must Be Enabled
description: >
  GuardDuty must be enabled to provide continuous threat detection. It analyzes CloudTrail, VPC Flow Logs, and DNS logs to detect reconnaissance, instance compromise, and account compromise.
domain: exposure
severity: high
compliance:
  soc2: "CC7.1"
  pci_dss_v4.0: "5.2"
  nist_800_53_r5: "SI-3"
  fedramp_moderate: "SI-3"
  gdpr: "Art.32"
  ffiec: "CAT-D3"
scope_tags:
  - aws
  - guardduty
type: unsafe_state
params: {}
remediation:
  description: >
    GuardDuty is not enabled. Threats are not being detected.
  action: >
    Enable GuardDuty: aws guardduty create-detector --enable
  example: |
    {
      {
      "threat_detection": {
        "kind": "detector",
        "enabled": true
      }
    }
    }
unsafe_predicate:
  all:
    - field: properties.threat_detection.enabled
      op: eq
      value: false
