dsl_version: ctrl.v1
id: CTL.AD.LOCK.DURATION.001
name: Account Lockout Duration Must Be At Least 15 Minutes
description: >
  Account lockout duration must be at least 15 minutes to slow
  brute-force attacks and give defenders time to respond.
domain: identity
severity: medium
compliance:
  cis_ad: "1.2.2"
  ccm_v4: ["IAM-15"]
scope_tags:
  - active_directory
taxonomy:
  - compliance-mapping
  - credential-lifecycle
subtractive_category:
  - S07
type: unsafe_state
classification: parameterized_check
applicable_asset_types: [aws_directory_service_directory]
params:
  attack_stage: credential_access
remediation:
  description: >
    Account lockout duration is less than 15 minutes.
  action: >
    Set lockout duration to 15 minutes or more in Default Domain Policy.
unsafe_predicate:
  all:
    - field: properties.password_policy.lockout_duration_minutes
      op: lt
      value: 15
