dsl_version: ctrl.v1
id: CTL.AD.ACCOUNT.NOEXPIRY.001
name: Admin Accounts Must Not Have Non-Expiring Passwords
description: >
  Privileged accounts must not have the password-never-expires flag
  set. Non-expiring passwords on admin accounts create persistent
  credential risks.
domain: identity
severity: high
compliance:
  owasp_nhi: "NHI7"
  cis_ad: "5.4"
  ccm_v4: ["IAM-08", "IAM-09"]
scope_tags:
  - active_directory
taxonomy:
  - compliance-mapping
  - compute-hardening
  - credential-lifecycle
subtractive_category:
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_directory_service_directory]
params:
  attack_stage: persistence
remediation:
  description: >
    Admin accounts have non-expiring passwords.
  action: >
    Remove the password-never-expires flag from admin accounts.
    Use Fine-Grained Password Policies if different expiry is needed.
unsafe_predicate:
  all:
    - field: properties.accounts.admin_with_no_expiry
      op: eq
      value: true
