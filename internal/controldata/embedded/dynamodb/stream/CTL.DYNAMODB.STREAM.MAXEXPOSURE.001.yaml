dsl_version: ctrl.v1
id: CTL.DYNAMODB.STREAM.MAXEXPOSURE.001
name: DynamoDB Stream Exposes Full Item History
description: >
  DynamoDB Stream is configured with StreamViewType
  NEW_AND_OLD_IMAGES — every stream record includes both the
  complete previous state and the complete current state of
  the modified item. This is the maximum data exposure the
  stream can produce: a single update exposes all attributes
  before and after the change. Stream consumers — Lambda event
  source mappings, Kinesis Data Streams — have access to the
  full change history for every item in the table. If a
  consumer is overprivileged, cross-account, or compromised,
  it can reconstruct the complete modification history of
  every item. NEW_AND_OLD_IMAGES is appropriate when the
  consumer genuinely needs both states (audit trail, CDC
  replication). Verify the consumer's actual requirement
  before accepting this configuration.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "AC-4"
  soc2: "CC6.1"
  ccm_v4: ["DSP-07"]
scope_tags:
  - aws
  - dynamodb
taxonomy:
  - compliance-mapping
  - compute-hardening
subtractive_category:
  - S02
  - S05
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_dynamodb_table]
params:
  attack_stage: exfiltration
remediation:
  description: >
    DynamoDB Stream is configured with NEW_AND_OLD_IMAGES —
    both the old and new item content are written to the stream
    for every modification.
  action: >
    If the consumer does not need the old item state, reduce
    to NEW_IMAGE (current state only) or KEYS_ONLY (partition
    and sort keys only). Update via
    aws dynamodb update-table --table-name TABLE
    --stream-specification StreamEnabled=true,
    StreamViewType=NEW_IMAGE. Note that changing the stream
    view type creates a new stream — consumers must be
    updated to the new stream ARN.
  example: |
    {
      "database": {
        "kind": "table",
        "dynamodb": {
          "stream_enabled": true,
          "stream_view_type": "KEYS_ONLY"
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.database.kind
      op: eq
      value: table
    - field: properties.database.dynamodb.stream_enabled
      op: eq
      value: true
    - field: properties.database.dynamodb.stream_view_type
      op: eq
      value: NEW_AND_OLD_IMAGES
