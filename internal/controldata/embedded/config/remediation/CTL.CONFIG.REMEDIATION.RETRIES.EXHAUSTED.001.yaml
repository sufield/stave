dsl_version: ctrl.v1
id: CTL.CONFIG.REMEDIATION.RETRIES.EXHAUSTED.001
name: Config Remediation Retries Exhausted
description: >
  AWS Config remediation has exhausted its retry
  attempts. The remediation tried to fix non-
  compliant resources, failed each time, and
  has stopped retrying. Resources remain non-
  compliant. The configuration is in place; the
  fix gave up.
domain: governance
severity: medium
compliance:
  soc2: "CC7.2, CC8.1"
  nist_800_53_r5: "CA-7, CM-3, IR-4, SI-4"
  pci_dss_v4.0: "11.5, 12.10"
  fedramp_moderate: "CA-7, IR-4"
  iso_27001_2022: "A.5.30, A.8.16"
  ccm_v4: ["LOG-08"]
scope_tags:
  - aws
  - config
taxonomy:
  - compliance-mapping
subtractive_category:
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_config_recorder]
params:
  attack_stage: resilience
  blast_radius:
    type: governance
    scope: account
    multiplier: 2.0
remediation:
  description: >
    Remediation tried multiple times and gave
    up; resources remain non-compliant.
  action: >
    Inspect the failure reason. Permission
    denied: the remediation role lacks a needed
    action — update the policy. Resource
    protected: a Deny statement (SCP, resource
    policy) overrides the remediation —
    coordinate with the policy owner. SSM
    document logic error: the document hits an
    unhandled edge case — patch the document.
    After the underlying fix, manually trigger
    remediation: aws configservice
    start-remediation-execution
    --config-rule-name <rule>
    --resource-keys <list>.
  example: |
    {
      "compliance": {
        "kind": "config_remediation",
        "config": {
          "rule_name": "s3-bucket-server-side-encryption-enabled",
          "remediation_status": "succeeded",
          "remediation_retries_exhausted": false,
          "remediation_last_attempt": "2026-04-27T00:00:00Z",
          "remediation_failure_reason": "",
          "noncompliant_count": 0
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compliance.kind
      op: eq
      value: config_remediation
    - field: properties.compliance.config.remediation_retries_exhausted
      op: eq
      value: true
defect: >
  Config remediation has exhausted retries with
  resources still non-compliant.
infection: >
  Config auto-remediation retries a configurable
  number of times when the SSM execution fails.
  Common failure causes: insufficient
  permissions on the remediation role (role
  can't modify the resource), the resource is
  protected by a deny policy (explicit Deny
  overrides the remediation role's Allow), the
  SSM document logic has a bug (automation step
  fails), or the resource is in a state the
  document doesn't handle. After retries are
  exhausted, remediation stops. Resources
  remain non-compliant. The remediation status
  shows 'failed.' Nobody is notified unless an
  alarm monitors remediation failures. The
  failure_reason field surfaces the root cause
  for triage.
failure: >
  Remediation gave up. Auto-fix tried and
  failed; resources remain non-compliant with
  no further remediation attempts.
tests:
  - name: remediation with exhausted retries fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:config:us-east-1:111122223333:remediation/s3-bucket-server-side-encryption-enabled"
      asset_type: aws_config_remediation
      vendor: aws
      properties:
        compliance:
          kind: config_remediation
          config:
            rule_name: "s3-bucket-server-side-encryption-enabled"
            remediation_status: "failed"
            remediation_retries_exhausted: true
            remediation_last_attempt: "2026-04-20T00:00:00Z"
            remediation_failure_reason: "AccessDenied: missing s3:PutBucketEncryption"
            noncompliant_count: 8
  - name: succeeding remediation passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:config:us-east-1:111122223333:remediation/s3-bucket-server-side-encryption-enabled"
      asset_type: aws_config_remediation
      vendor: aws
      properties:
        compliance:
          kind: config_remediation
          config:
            rule_name: "s3-bucket-server-side-encryption-enabled"
            remediation_status: "succeeded"
            remediation_retries_exhausted: false
            remediation_last_attempt: "2026-04-27T00:00:00Z"
            remediation_failure_reason: ""
            noncompliant_count: 0
