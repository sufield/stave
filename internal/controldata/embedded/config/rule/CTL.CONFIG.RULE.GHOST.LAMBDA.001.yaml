dsl_version: ctrl.v1
id: CTL.CONFIG.RULE.GHOST.LAMBDA.001
name: Config Custom Rule References Deleted Lambda Function
description: >
  AWS Config custom rule references a Lambda
  function that has been deleted. Custom rules
  delegate evaluation to a Lambda function — the
  function receives the configuration item and
  returns COMPLIANT or NON_COMPLIANT. When the
  Lambda is deleted, evaluation fails and the
  resource's compliance status becomes unknown.
domain: exposure
severity: high
archetype: ghost-reference
scope: compound
compliance:
  soc2: "CC7.1, CC8.1"
  nist_800_53_r5: "CA-7, CM-2, CM-3, SI-4"
  pci_dss_v4.0: "11.5"
  fedramp_moderate: "CA-7, CM-3"
  hipaa: "164.312(b)"
  iso_27001_2022: "A.5.16, A.8.15"
  ccm_v4: ["LOG-08"]
scope_tags:
  - aws
  - config
taxonomy:
  - ai-supply-chain
  - compliance-mapping
  - trust-decay
subtractive_category:
  - S08
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_config_recorder]
params:
  attack_stage: detection_evasion
  blast_radius:
    type: detection
    scope: account
    multiplier: 3.0
remediation:
  description: >
    Custom rule's Lambda is gone. Evaluation
    cannot run.
  action: >
    Either redeploy the Lambda function with the
    same ARN (preserving rule configuration) or
    update the rule to point at a replacement
    Lambda: aws configservice put-config-rule
    with Source.SourceIdentifier set to the new
    function ARN. If the Lambda's logic is no
    longer needed, delete the rule rather than
    leaving an orphan.
  example: |
    {
      "compliance": {
        "kind": "config_rule",
        "config": {
          "rule_name": "custom-tag-policy",
          "rule_source_type": "CUSTOM_LAMBDA",
          "rule_lambda_arn": "arn:aws:lambda:us-east-1:111122223333:function:tag-policy-eval",
          "rule_lambda_exists": true,
          "has_ghost_rule_lambda": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compliance.kind
      op: eq
      value: config_rule
    - field: properties.compliance.config.has_ghost_rule_lambda
      op: eq
      value: true
defect: >
  Config custom rule references a deleted
  Lambda function.
infection: >
  Custom Config rules delegate evaluation to a
  Lambda function. When the Lambda is deleted,
  Config triggers the rule evaluation (on
  configuration change or on schedule), invokes
  the Lambda, the invocation fails
  (ResourceNotFoundException), and the
  evaluation returns an error — not COMPLIANT,
  not NON_COMPLIANT, just error. The resource's
  compliance status becomes unknown. An auditor
  sees the rule exists but compliance results
  show errors instead of pass/fail. The custom
  compliance check — which was presumably
  created because no managed rule covered the
  requirement — is non-functional.
failure: >
  Custom compliance check broken. Config rule
  cannot evaluate because its Lambda function
  was deleted; compliance status unknown.
tests:
  - name: custom rule with deleted Lambda fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:config:us-east-1:111122223333:config-rule/custom-tag-policy"
      asset_type: aws_config_rule
      vendor: aws
      properties:
        compliance:
          kind: config_rule
          config:
            rule_name: "custom-tag-policy"
            rule_source_type: "CUSTOM_LAMBDA"
            rule_lambda_arn: "arn:aws:lambda:us-east-1:111122223333:function:deleted-fn"
            rule_lambda_exists: false
            has_ghost_rule_lambda: true
  - name: custom rule with live Lambda passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:config:us-east-1:111122223333:config-rule/custom-tag-policy"
      asset_type: aws_config_rule
      vendor: aws
      properties:
        compliance:
          kind: config_rule
          config:
            rule_name: "custom-tag-policy"
            rule_source_type: "CUSTOM_LAMBDA"
            rule_lambda_arn: "arn:aws:lambda:us-east-1:111122223333:function:tag-policy-eval"
            rule_lambda_exists: true
            has_ghost_rule_lambda: false
