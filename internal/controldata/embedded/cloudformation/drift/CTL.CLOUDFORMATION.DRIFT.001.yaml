dsl_version: ctrl.v1
id: CTL.CLOUDFORMATION.DRIFT.001
name: CloudFormation Stack Drift Detection Must Be Enabled
description: >
  CloudFormation stacks managing production infrastructure must have drift detection enabled. Drift indicates out-of-band changes bypassing IaC.
domain: exposure
severity: medium
compliance:
  soc2: "CC8.1"
  pci_dss_v4.0: "6.3.2"
  nist_800_53_r5: "CM-3"
  fedramp_moderate: "CM-3"
scope_tags:
  - aws
  - cloudformation
type: unsafe_state
params: {}
remediation:
  description: >
    CloudFormation stack does not have drift detection enabled.
  action: >
    Detect drift: aws cloudformation detect-stack-drift --stack-name <name>. Configure periodic detection via EventBridge.
  example: |
    {
      {
      "infrastructure": {
        "kind": "stack",
        "drift_detection_enabled": true
      }
    }
    }
unsafe_predicate:
  all:
    - field: properties.infrastructure.drift_detection_enabled
      op: eq
      value: false
