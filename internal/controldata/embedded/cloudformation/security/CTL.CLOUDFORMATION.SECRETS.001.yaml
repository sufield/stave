dsl_version: ctrl.v1
id: CTL.CLOUDFORMATION.SECRETS.001
name: CloudFormation Stack Outputs Must Not Contain Secrets
description: >
  CloudFormation stack outputs must not contain hardcoded secrets.
  Stack outputs are readable by anyone with cloudformation:DescribeStacks
  access, visible in the console, and logged in CloudTrail.
domain: exposure
severity: critical
compliance:
  nist_800_53_r5: "IA-5(7)"
  soc2: "CC6.1"
  ccm_v4: ["IAM-16", "DSP-17"]
scope_tags: [aws, cloudformation]
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - logging
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
remediation:
  description: CloudFormation stack outputs contain secrets.
  action: Remove secrets from outputs. Use Secrets Manager or Parameter Store with dynamic references.
  example: |
    {"governance": {"kind": "cloudformation_stack", "secrets": {"has_secrets_in_outputs": false}}}
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: cloudformation_stack
    - field: properties.governance.secrets.has_secrets_in_outputs
      op: eq
      value: true
