dsl_version: ctrl.v1
id: CTL.DAX.LOG.CLOUDWATCH.001
name: DAX CloudWatch Logging Must Be Enabled
description: >
  DynamoDB Accelerator (DAX) cluster does not have CloudWatch
  logging enabled. Without logging, cache operations are not
  recorded, limiting visibility into access patterns and
  potential data exfiltration via the cache layer.
domain: detection
severity: low
compliance:
  nist_800_53_r5: "AU-2, AU-3"
  soc2: "CC7.2"
  pci_dss_v4.0: "10.2"
scope_tags:
  - aws
  - dax
taxonomy:
  - compliance-mapping
  - logging
subtractive_category:
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_dax_cluster]
params:
  attack_stage: discovery
remediation:
  description: >
    DAX CloudWatch logging is not enabled.
  action: >
    Enable CloudWatch logging for the DAX cluster.
  example: |
    {
      "cache": {
        "kind": "dax_cluster",
        "logging": {
          "cloudwatch_log_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.cache.kind
      op: eq
      value: dax_cluster
    - field: properties.cache.logging.cloudwatch_log_enabled
      op: ne
      value: true
tests:
  - name: CloudWatch logging disabled fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:dax:us-east-1:123456789012:cache/my-dax"
      asset_type: aws_dax_cluster
      vendor: aws
      properties:
        cache:
          kind: dax_cluster
          logging:
            cloudwatch_log_enabled: false
  - name: CloudWatch logging enabled passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:dax:us-east-1:123456789012:cache/my-dax"
      asset_type: aws_dax_cluster
      vendor: aws
      properties:
        cache:
          kind: dax_cluster
          logging:
            cloudwatch_log_enabled: true
