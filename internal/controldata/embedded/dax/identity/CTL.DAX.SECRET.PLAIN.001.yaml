dsl_version: ctrl.v1
id: CTL.DAX.SECRET.PLAIN.001
name: DAX Cluster Credentials Must Use Secrets Manager
description: >
  DAX cluster credentials are not managed through AWS Secrets
  Manager. Hardcoded cluster credentials risk exposure and
  complicate rotation.
domain: identity
severity: low
compliance:
  nist_800_53_r5: "IA-5"
  soc2: "CC6.1"
scope_tags:
  - aws
  - dax
taxonomy:
  - compliance-mapping
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_dax_cluster]
params:
  attack_stage: credential_access
remediation:
  description: >
    DAX cluster credentials are not managed via Secrets Manager.
  action: >
    Store DAX cluster credentials in AWS Secrets Manager and
    configure automatic rotation.
  example: |
    {
      "cache": {
        "kind": "dax_cluster",
        "credentials": {
          "uses_secrets_manager": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.cache.kind
      op: eq
      value: dax_cluster
    - field: properties.cache.credentials.uses_secrets_manager
      op: ne
      value: true
tests:
  - name: DAX without Secrets Manager fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:dax:us-east-1:123456789012:cache/my-dax"
      asset_type: aws_dax_cluster
      vendor: aws
      properties:
        cache:
          kind: dax_cluster
          credentials:
            uses_secrets_manager: false
  - name: DAX with Secrets Manager passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:dax:us-east-1:123456789012:cache/my-dax"
      asset_type: aws_dax_cluster
      vendor: aws
      properties:
        cache:
          kind: dax_cluster
          credentials:
            uses_secrets_manager: true
