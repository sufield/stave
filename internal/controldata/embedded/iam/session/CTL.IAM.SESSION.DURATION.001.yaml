dsl_version: ctrl.v1
id: CTL.IAM.SESSION.DURATION.001
name: Role MaxSessionDuration Exceeds 4 Hours
description: >
  IAM role allows sessions up to 12 hours (the AWS maximum). For most
  roles, 1-4 hours is sufficient. Long sessions persist after credential
  compromise is detected — revocation requires waiting for session expiry
  or deleting the role entirely. MaxSessionDuration controls the upper
  bound of temporary credentials issued via AssumeRole.
domain: identity
severity: medium
compliance:
  owasp_nhi: "NHI4"
  soc2: "CC6.1"
  nist_800_53_r5: "AC-12"
  pci_dss_v4.0: "8.2.8"
  fedramp_moderate: "AC-12"
  ccm_v4: ["IAM-05"]
scope_tags:
  - aws
  - iam
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  attack_stage: credential_access
observation_fields:
  - identity.kind
  - identity.role.max_session_duration
  - identity.role.session_duration_excessive
remediation:
  description: >
    IAM role MaxSessionDuration exceeds 4 hours. Stolen session
    credentials remain valid for the full duration regardless of
    detection or response actions.
  action: >
    Set MaxSessionDuration to 14400 seconds (4 hours) or less via
    aws iam update-role --role-name ROLE --max-session-duration 14400.
    For CI/CD and automation roles, use 3600 seconds (1 hour).
  example: |
    {
      "identity": {
        "kind": "role",
        "role": {
          "max_session_duration": 14400,
          "session_duration_excessive": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: role
    - field: properties.identity.role.session_duration_excessive
      op: eq
      value: true
defect: >
  IAM role MaxSessionDuration set above 4-hour threshold.
infection: >
  When a principal assumes this role, the temporary credentials are
  valid for up to the MaxSessionDuration. A 12-hour session means
  stolen credentials remain valid for 12 hours regardless of any
  response action. The organization cannot revoke a specific STS
  session — they must either delete the role (breaking all consumers)
  or wait for expiry. Shorter MaxSessionDuration limits the window
  during which stolen credentials are usable.
failure: >
  Extended credential validity. Stolen session credentials remain
  valid for hours after theft, regardless of detection or response.
tests:
  - name: role with excessive session duration fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:role/long-session-role"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          role:
            max_session_duration: 43200
            session_duration_excessive: true
  - name: role with normal session duration passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:role/short-session-role"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          role:
            max_session_duration: 3600
            session_duration_excessive: false
