dsl_version: ctrl.v1
id: CTL.IAM.CRED.ROTATION.001
name: Access Keys Must Be Rotated Within 90 Days
description: >
  IAM user access keys older than 90 days must be rotated. Long-lived
  access keys accumulate exposure risk and may have been leaked in
  code repositories, logs, or configuration files.
domain: identity
severity: medium
compliance:
  cis_aws_v1.4.0: "1.14"
  cis_aws_v3.0: "1.14"
  hipaa: "164.312(a)(2)(i)"
  pci_dss_v3.2.1: "8.2.4"
  soc2: "CC6.1"
  pci_dss_v4.0: "8.3.9"
  nist_800_53_r5: "IA-5(1)"
  fedramp_moderate: "IA-5(1)"
scope_tags:
  - aws
  - iam
type: unsafe_state
params: {}
remediation:
  description: >
    IAM user has at least one access key older than 90 days.
    Stale keys have had more time to be compromised via code commits,
    shared configuration, or log exposure.
  action: >
    Create a new access key, update all systems using the old key,
    then deactivate and delete the old key.
  example: |
    {
      "identity": {
        "kind": "user",
        "access_keys": {
          "has_stale_key": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: user
    - field: properties.identity.access_keys.has_stale_key
      op: eq
      value: true
