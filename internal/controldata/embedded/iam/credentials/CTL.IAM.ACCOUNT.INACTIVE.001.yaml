dsl_version: ctrl.v1
id: CTL.IAM.ACCOUNT.INACTIVE.001
name: Inactive Accounts Must Be Disabled
description: >
  IAM accounts with no login or API activity for 90 days or more must
  be disabled. Dormant accounts are high-value targets — they have
  permissions but no active user monitoring their usage. Legacy
  accounts, test accounts, and accounts from departed employees
  accumulate over time and provide persistent, unmonitored access
  paths for attackers.
domain: identity
severity: medium
compliance:
  hipaa: "164.312(a)(2)(i)"
  soc2: "CC6.2"
  cis_aws_v3.0: "1.12"
  pci_dss_v4.0: "8.1.4"
  nist_800_53_r5: "AC-2"
  fedramp_moderate: "AC-2"
  ccm_v4: ["IAM-02", "IAM-08"]
scope_tags:
  - aws
  - iam
type: unsafe_state
classification: parameterized_check
params:
  attack_stage: credential_access
remediation:
  description: >
    IAM account has had no activity for over 90 days. Dormant accounts
    are high-value targets with no active monitoring.
  action: >
    Disable or delete the IAM user. If the account is still needed,
    review and renew its access with a documented justification and
    an updated expiry date.
  example: |
    {
      "identity": {
        "kind": "user",
        "credentials": {
          "inactive_days": 15
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.credentials.inactive_days
      op: gt
      value: 90
alternatives:
  - tool: prowler
    check_id: iam_user_console_access_unused
    coverage: covered
    note: Stave splits credential-unused from account-inactive; union matches.
