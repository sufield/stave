dsl_version: ctrl.v1
id: CTL.IAM.CRED.UNUSED.001
name: Disable Unused Credentials
description: >
  IAM credentials unused for 90 days or more must be disabled.
  Dormant credentials are a persistent attack surface that provides
  access without triggering normal usage patterns.
domain: identity
severity: medium
compliance:
  owasp_nhi: "NHI1"
  cis_aws_v1.4.0: "1.12"
  cis_aws_v3.0: "1.12"
  hipaa: "164.312(a)(2)(i)"
  soc2: "CC6.2"
  pci_dss_v4.0: "8.1.4"
  nist_800_53_r5: "AC-2"
  fedramp_moderate: "AC-2"
  ccm_v4: ["IAM-02", "IAM-08"]
  owasp_subtractive: "S07"
  subtractive_tier: "deletion"
scope_tags:
  - aws
  - iam
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - trust-decay
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_user
params:
  attack_stage: credential_access
remediation:
  description: >
    IAM user has credentials that have not been used in over 90 days.
    Dormant credentials increase the attack surface without business justification.
  action: >
    Disable or delete unused credentials. Review the user's need for access
    and remove the IAM user if no longer required.
  example: |
    {
      "identity": {
        "kind": "user",
        "credentials": {
          "unused": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: user
    - field: properties.identity.credentials.unused
      op: present
    - field: properties.identity.credentials.unused
      op: eq
      value: true
alternatives:
  - tool: prowler
    check_id: iam_user_access_not_stale_to_bedrock
    coverage: partial
    note: Generic staleness; no Bedrock-specific freshness tracking.
  - tool: prowler
    check_id: iam_user_accesskey_unused
    coverage: covered
    note: Stave has two thresholds; Prowler's 45-day matches UNUSED45.001 precisely.
  - tool: prowler
    check_id: iam_user_console_access_unused
    coverage: covered
    note: Stave splits credential-unused from account-inactive; union matches.
