dsl_version: ctrl.v1
id: CTL.IAM.CRED.SETUPKEY.001
name: No Access Keys Created at User Setup
description: >
  Access keys should not be created at user creation time. Keys
  created during setup are often distributed insecurely and may
  not be needed. Create keys only for specific programmatic access.
domain: identity
severity: medium
compliance:
  cis_aws_v3.0: "1.11"
  soc2: "CC6.2"
  ccm_v4: ["IAM-02", "IAM-08"]
scope_tags:
  - aws
  - iam
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
remediation:
  description: >
    Access key was created at user setup time. The key may have been
    distributed insecurely.
  action: >
    Delete the setup-time access key and create a new one only if
    programmatic access is specifically required.
  example: |
    {
      "identity": {
        "kind": "user",
        "access_keys": {
          "created_at_setup": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: user
    - field: properties.identity.access_keys.created_at_setup
      op: eq
      value: true
alternatives:
  - tool: prowler
    check_id: iam_user_no_setup_initial_access_key
    coverage: covered
    note: Both check access keys that exist from user-setup time.
