dsl_version: ctrl.v1
id: CTL.IAM.SCP.RESERVEDINSTANCE.001
name: "SCP Does Not Deny Reserved Instance Purchases"
description: >
  SCP does not deny ec2:PurchaseReservedInstancesOffering in member
  accounts. This is the most expensive single API call in AWS — one
  call can commit up to $3M per instance, and with the default limit
  of 20 instances, a single compromised credential can commit $62M in
  irrecoverable spend. Unlike most API actions, Reserved Instance
  purchases cannot be reversed, cancelled, or refunded. The SCP is the
  only preventive control; IAM policies are insufficient because any
  admin can grant themselves the permission.
domain: identity
severity: high
compliance:
  nist_800_53_r5: "AC-6"
  soc2: "CC6.1"
  ccm_v4: ["IAM-04"]
scope_tags:
  - aws
  - iam
  - ec2
taxonomy:
  - account-governance
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_organization
params:
  attack_stage: impact
observation_fields:
  - identity.kind
  - identity.scp.denies_ri_purchase
remediation:
  description: >
    Organization SCPs do not prevent Reserved Instance purchases.
  action: >
    Add an SCP that denies ec2:PurchaseReservedInstancesOffering for
    all principals in member accounts. Exempt only the billing
    break-glass role via a condition on aws:PrincipalArn.
  example: |
    {
      "identity": {
        "kind": "organization",
        "scp": {
          "denies_ri_purchase": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: organization
    - field: properties.identity.scp.denies_ri_purchase
      op: ne
      value: true
tests:
  - name: "organization without RI purchase protection fails"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:organizations::111122223333:organization/o-abc123"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            denies_ri_purchase: false
  - name: "organization with RI purchase protection passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:organizations::444455556666:organization/o-def456"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            denies_ri_purchase: true
