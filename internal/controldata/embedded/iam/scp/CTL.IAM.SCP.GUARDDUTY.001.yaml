dsl_version: ctrl.v1
id: CTL.IAM.SCP.GUARDDUTY.001
name: "SCP Does Not Protect GuardDuty"
description: >
  SCP does not deny GuardDuty disablement in member accounts. A
  compromised account admin can disable GuardDuty threat detection,
  eliminating runtime threat monitoring. Without SCP protection, the
  attacker can disable GuardDuty and operate without threat alerts.
domain: identity
severity: high
compliance:
  owasp_nhi: "NHI6"
  nist_800_53_r5: "SI-4"
  soc2: "CC6.6"
  ccm_v4: ["TVM-01"]
scope_tags:
  - aws
  - iam
taxonomy:
  - account-governance
  - compliance-mapping
  - monitoring
  - detection-evasion
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_organization
params:
  attack_stage: detection_evasion
observation_fields:
  - identity.kind
  - identity.scp.denies_guardduty_disable
remediation:
  description: >
    Organization SCPs do not deny GuardDuty disablement in member
    accounts.
  action: >
    Add an SCP that denies guardduty:DeleteDetector,
    guardduty:DisassociateFromMasterAccount, and
    guardduty:UpdateDetector for all principals in member accounts.
  example: |
    {
      "identity": {
        "kind": "organization",
        "scp": {
          "denies_guardduty_disable": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: organization
    - field: properties.identity.scp.denies_guardduty_disable
      op: eq
      value: false
tests:
  - name: "organization without GuardDuty protection fails"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:organizations::111122223333:organization/o-abc123"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            denies_guardduty_disable: false
  - name: "organization with GuardDuty protection passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:organizations::444455556666:organization/o-def456"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            denies_guardduty_disable: true
