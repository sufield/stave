dsl_version: ctrl.v1
id: CTL.IAM.SCP.IAM.001
name: "SCP Does Not Restrict Critical IAM Actions"
description: >
  SCP does not deny known privilege escalation actions in member
  accounts. Actions like iam:CreatePolicyVersion, iam:AttachRolePolicy,
  iam:PutRolePolicy, and iam:UpdateAssumeRolePolicy are the core
  escalation primitives. SCPs are the only control that prevents an
  account admin from self-escalating — IAM policies can be modified by
  anyone with iam:*, and permission boundaries can be removed.
domain: identity
severity: high
compliance:
  owasp_nhi: "NHI6"
  nist_800_53_r5: "AC-6"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  ccm_v4: ["IAM-05"]
scope_tags:
  - aws
  - iam
taxonomy:
  - account-governance
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_organization
params:
  attack_stage: privilege_escalation
observation_fields:
  - identity.kind
  - identity.scp.denies_iam_escalation
remediation:
  description: >
    Organization SCPs do not deny or constrain critical IAM escalation
    actions in member accounts.
  action: >
    Add an SCP that denies iam:CreatePolicyVersion, iam:AttachRolePolicy,
    iam:PutRolePolicy, and iam:UpdateAssumeRolePolicy for non-admin
    principals in member accounts. Use condition keys to exempt
    designated break-glass roles.
  example: |
    {
      "identity": {
        "kind": "organization",
        "scp": {
          "denies_iam_escalation": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: organization
    - field: properties.identity.scp.denies_iam_escalation
      op: eq
      value: false
tests:
  - name: "organization without IAM escalation denial fails"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:organizations::111122223333:organization/o-abc123"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            denies_iam_escalation: false
  - name: "organization with IAM escalation denial passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:organizations::444455556666:organization/o-def456"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            denies_iam_escalation: true
