dsl_version: ctrl.v1
id: CTL.IAM.SCP.CLOSEACCOUNT.001
name: "SCP Does Not Deny account:CloseAccount"
description: >
  No SCP in the hierarchy denies account:CloseAccount. An attacker
  who compromises a member account admin can close the AWS account,
  permanently destroying all resources — EC2 instances, S3 data,
  RDS databases, IAM configuration, and audit trails. Account closure
  is irreversible after a 90-day grace period. Unlike resource
  deletion, closing the account eliminates the entire control plane
  in one API call.
domain: identity
severity: critical
compliance:
  nist_800_53_r5: "AC-6"
  soc2: "CC6.1"
  ccm_v4: ["IAM-05", "BCR-08"]
scope_tags:
  - aws
  - iam
taxonomy:
  - account-governance
  - compliance-mapping
payer_exempt: true
payer_compensating_control: null
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_organization
params:
  attack_stage: impact
  base_impact: 10
  blast_radius:
    type: destruction
    scope: account
    multiplier: 3.0
observation_fields:
  - identity.kind
  - identity.scp.denies_close_account
remediation:
  description: >
    Organization SCPs do not deny account:CloseAccount for member
    accounts.
  action: >
    Add an SCP that denies account:CloseAccount for all principals
    in member accounts. Apply it to the organization root.
  example: |
    {
      "identity": {
        "kind": "organization",
        "scp": {
          "denies_close_account": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: organization
    - field: properties.identity.scp.denies_close_account
      op: ne
      value: true
tests:
  - name: "organization without close-account denial fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:organizations::111122223333:organization/o-abc123"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            denies_close_account: false
  - name: "organization with close-account denial passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:organizations::444455556666:organization/o-def456"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            denies_close_account: true
