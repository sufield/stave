dsl_version: ctrl.v1
id: CTL.IAM.SCP.ROOT.001
name: "SCP Does Not Deny Root Access Key Creation"
description: >
  SCP does not deny iam:CreateAccessKey for root users in member
  accounts. Root access keys provide unrestricted API access to the
  entire AWS account — every service, every resource, every action.
  They bypass IAM policies and permission boundaries. Once created,
  root access keys persist until explicitly deleted.
domain: identity
severity: high
compliance:
  owasp_nhi: "NHI6"
  nist_800_53_r5: "AC-6"
  soc2: "CC6.1"
  ccm_v4: ["IAM-05"]
scope_tags:
  - aws
  - iam
taxonomy:
  - account-governance
  - compute-hardening
  - credential-lifecycle
  - network-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_organization
params:
  attack_stage: persistence
observation_fields:
  - identity.kind
  - identity.scp.denies_root_access_key
remediation:
  description: >
    Organization SCPs do not deny root access key creation in member
    accounts.
  action: >
    Add an SCP that denies iam:CreateAccessKey when the principal is
    root. Apply via condition aws:PrincipalArn matching the root ARN
    pattern.
  example: |
    {
      "identity": {
        "kind": "organization",
        "scp": {
          "denies_root_access_key": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: organization
    - field: properties.identity.scp.denies_root_access_key
      op: ne
      value: true
tests:
  - name: "organization without root access key denial fails"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:organizations::111122223333:organization/o-abc123"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            denies_root_access_key: false
  - name: "organization with root access key denial passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:organizations::444455556666:organization/o-def456"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            denies_root_access_key: true
