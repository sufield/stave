dsl_version: ctrl.v1
id: CTL.IAM.SCP.KMS.CREATEKEY.EXTERNAL.001
name: "SCP Does Not Deny kms:CreateKey with EXTERNAL Origin"
description: >
  No SCP in the hierarchy denies creating KMS keys with
  origin=EXTERNAL. This is the earliest prevention point in the
  BYOKM ransomware kill chain — if the attacker cannot create a
  KMS key with EXTERNAL origin, no subsequent phase (import key
  material, replicate, re-encrypt, rug pull) is possible. The
  SCP should use a condition key (kms:KeyOrigin) to deny only
  EXTERNAL-origin key creation while permitting normal
  AWS_KMS-origin keys. If the kms:KeyOrigin condition key is
  not available in the SCP context, the broader approach is to
  deny kms:CreateKey entirely and grant it only to approved
  automation roles — but this blocks all key creation, not just
  BYOKM keys.
domain: identity
severity: critical
compliance:
  nist_800_53_r5: "SC-12"
  soc2: "CC6.1"
  ccm_v4: ["CEK-03", "IAM-05"]
scope_tags:
  - aws
  - iam
  - kms
taxonomy:
  - account-governance
  - compliance-mapping
  - key-management
subtractive_category:
  - S02
  - S05
  - S10
payer_exempt: true
payer_compensating_control: null
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_organization
params:
  attack_stage: initial_access
  base_impact: 9
  blast_radius:
    type: prevention
    scope: organization
    multiplier: 3.0
observation_fields:
  - identity.kind
  - identity.scp.denies_kms_create_key_external
remediation:
  description: >
    Organization SCPs do not deny creating KMS keys with EXTERNAL
    origin. Any principal can create a BYOKM key.
  action: >
    Add an SCP that denies kms:CreateKey with condition
    StringEquals kms:KeyOrigin EXTERNAL. This blocks BYOKM key
    creation while allowing normal AWS-generated keys. If the
    organization legitimately uses BYOKM keys, exempt specific
    approved accounts via condition.
  example: |
    {
      "identity": {
        "kind": "organization",
        "scp": {
          "denies_kms_create_key_external": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: organization
    - field: properties.identity.scp.denies_kms_create_key_external
      op: ne
      value: true
defect: >
  Organization SCPs do not deny kms:CreateKey with EXTERNAL origin.
  BYOKM key creation is unrestricted.
infection: >
  Any principal with kms:CreateKey can create a KMS key with
  EXTERNAL origin. This is the prerequisite for the entire BYOKM
  ransomware kill chain. The key appears as a normal customer-managed
  key in KMS — no alarm fires on creation alone.
failure: >
  Attacker creates a BYOKM key, imports their key material,
  re-encrypts data, and deletes the key material. All encrypted
  data is irrecoverable. Prevention at this earliest point would
  have blocked the entire kill chain.
tests:
  - name: "organization without EXTERNAL CreateKey denial fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:organizations::111122223333:organization/o-abc123"
      asset_type: aws_organization
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            denies_kms_create_key_external: false
  - name: "organization with EXTERNAL CreateKey denial passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:organizations::444455556666:organization/o-def456"
      asset_type: aws_organization
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            denies_kms_create_key_external: true
