dsl_version: ctrl.v1
id: CTL.IAM.SCP.IMDSV2.001
name: "SCP Does Not Enforce IMDSv2"
description: >
  SCP does not deny EC2 instance launches without IMDSv2 required.
  Without this SCP, any identity in the organization can launch
  instances with IMDSv1 enabled. IMDSv1 is the primary credential-theft
  vector via SSRF — an attacker who compromises a web application on an
  EC2 instance can query the metadata service at 169.254.169.254 to
  steal IAM role credentials. The SCP denies ec2:RunInstances when
  ec2:MetadataHttpTokens is not "required", preventing IMDSv1 instances
  at the organizational boundary.
domain: identity
severity: high
compliance:
  owasp_nhi: "NHI9"
  nist_800_53_r5: "SC-7"
  soc2: "CC6.1"
  ccm_v4: ["IVS-08"]
scope_tags:
  - aws
  - iam
  - ec2
taxonomy:
  - account-governance
  - compute-hardening
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_organization
params:
  attack_stage: initial_access
observation_fields:
  - identity.kind
  - identity.scp.denies_ec2_launch_without_imdsv2
remediation:
  description: >
    Organization SCPs do not enforce IMDSv2 on new EC2 instances.
  action: >
    Add an SCP that denies ec2:RunInstances with condition
    ec2:MetadataHttpTokens != "required". This prevents any identity
    from launching instances without IMDSv2 enforced. Optionally also
    deny ec2:ModifyInstanceMetadataOptions to prevent downgrade of
    existing instances, and deny all actions when ec2:RoleDelivery < 2.0
    for defense in depth.
  example: |
    {
      "identity": {
        "kind": "organization",
        "scp": {
          "denies_ec2_launch_without_imdsv2": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: organization
    - field: properties.identity.scp.denies_ec2_launch_without_imdsv2
      op: eq
      value: false
tests:
  - name: "organization without IMDSv2 SCP fails"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:organizations::111122223333:organization/o-abc123"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            denies_ec2_launch_without_imdsv2: false
  - name: "organization with IMDSv2 SCP passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:organizations::444455556666:organization/o-def456"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            denies_ec2_launch_without_imdsv2: true
