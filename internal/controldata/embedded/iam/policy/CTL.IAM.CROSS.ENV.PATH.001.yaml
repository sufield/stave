dsl_version: ctrl.v1
id: CTL.IAM.CROSS.ENV.PATH.001
name: Production Must Not Be Reachable from Lower Environment via Transitive Trust
description: >
  Production resources must have no transitive access path from
  non-production environments. The extractor traces sts:AssumeRole
  chains and resource policy grants from non-production accounts to
  production resources. A direct cross-account role is one hop; a
  chain through an intermediate shared-services account is two or
  more. Each hop widens the attack surface — a compromised dev
  credential becomes a production breach when bridge roles exist.
domain: identity
severity: critical
scope: compound
corpus_reference: MITRE:T1199
compliance:
  owasp_nhi: "NHI6"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  nist_800_53_r5: "AC-4"
  fedramp_moderate: "AC-4"
  ccm_v4: ["IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - trust-boundary
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  base_impact: 10
  attack_stage: persistence
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.5
remediation:
  description: >
    Production resource is reachable from a non-production environment
    through a chain of trust relationships. Security boundary between
    environments is collapsed via transitive access.
  action: >
    Remove cross-account trust relationships that bridge non-prod to
    prod. Use separate deployment pipelines per environment. Enforce
    environment isolation via SCPs that deny non-prod accounts from
    assuming prod roles.
  example: |
    {
      "identity": {
        "kind": "role",
        "role": {
          "cross_env": {
            "reachable_from_lower_env": false
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: role
    - field: properties.identity.role.cross_env.reachable_from_lower_env
      op: eq
      value: true
