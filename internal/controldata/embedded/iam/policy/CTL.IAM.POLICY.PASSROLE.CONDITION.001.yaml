dsl_version: ctrl.v1
id: CTL.IAM.POLICY.PASSROLE.CONDITION.001
name: PassRole Must Have iam:PassedToService Condition
description: >
  IAM policies granting iam:PassRole must include an
  iam:PassedToService condition restricting which AWS service can
  receive the passed role. Without this condition, a principal can
  pass a role to any compute service — Lambda, EC2, Glue, CodeBuild,
  CloudFormation, SSM — regardless of Resource scope. A role scoped
  to specific ARNs but passable to any service still enables lateral
  movement: the principal picks whichever service gives the most
  convenient execution environment.
domain: identity
severity: high
compliance:
  owasp_nhi: "NHI5"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  nist_800_53_r5: "AC-6(5)"
  fedramp_moderate: "AC-6(5)"
  iso_27001_2022: "A.8.3"
  ccm_v4: ["IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
params:
  attack_stage: privilege_escalation
remediation:
  description: >
    IAM policy grants iam:PassRole without an iam:PassedToService
    condition. The principal can pass roles to any AWS service.
  action: >
    Add an iam:PassedToService condition to the PassRole statement.
    Example: "Condition": {"StringEquals": {"iam:PassedToService":
    "lambda.amazonaws.com"}}. Restrict to only the service(s)
    the principal legitimately uses.
  example: |
    {
      "identity": {
        "kind": "user",
        "policies": {
          "passrole_has_service_condition": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.policies.passrole_has_service_condition
      op: ne
      value: true
