dsl_version: ctrl.v1
id: CTL.IAM.POLICY.VERSIONS.ATCAPACITY.001
name: "Managed Policy at Version Capacity"
description: >
  A customer-managed IAM policy has 5 versions (AWS maximum).
  iam:CreatePolicyVersion requires deleting a version first, but
  iam:SetDefaultPolicyVersion can still activate any existing dormant
  version without deletion. At capacity, the attack surface is frozen
  — the set of potentially-exploitable versions is fixed.
domain: identity
severity: low
compliance:
  nist_800_53_r5: "AC-6"
scope_tags:
  - aws
  - iam
taxonomy:
  - compliance-mapping
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_user
params:
  attack_stage: privilege_escalation
  base_impact: 2
  blast_radius:
    type: prevention
    scope: account
    multiplier: 1.0
observation_fields:
  - identity.kind
  - identity.policy.version_count
remediation:
  description: >
    IAM managed policy is at the 5-version limit. Review and delete
    unneeded versions to free capacity.
  action: >
    Review and delete unneeded policy versions to free capacity. If
    all 5 versions are intentional, verify that none contains broader
    permissions than the current default. Use aws iam
    delete-policy-version to remove unnecessary versions.
  example: |
    {
      "identity": {
        "kind": "user",
        "policy": {
          "version_count": 2
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: user
    - field: properties.identity.policy.version_count
      op: present
    - field: properties.identity.policy.version_count
      op: eq
      value: 5
tests:
  - name: "user with 5 policy versions fails"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:user/mallory"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: user
          policy:
            version_count: 5
  - name: "user with 3 policy versions passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:user/bob"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: user
          policy:
            version_count: 3
  - name: "user with 1 policy version passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:user/alice"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: user
          policy:
            version_count: 1
alternatives:
  - tool: prowler
    check_id: iam_policy_no_full_access_to_cloudwatch_logs
    coverage: partial
    note: No direct Prowler check for version capacity; partial overlap with broad IAM policy checks.
