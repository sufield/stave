dsl_version: ctrl.v1
id: CTL.IAM.RESOURCE.POLICY.CROSS.ENV.001
name: Resource Policy Grants Cross-Environment Access
description: >
  Production resource policy (S3, KMS, SQS, SNS, Lambda) grants access
  to a principal from a different environment tier. An enclave or sandbox
  account principal can access production data without assuming a
  production role — bypassing AssumeRole controls, MFA requirements,
  and session logging. This is the resource-policy leg of cross-
  environment pivot that CTL.IAM.CROSS.ENV.001 covers on the IAM side.
  The OpenAI ExploitGym incident (July 2026) demonstrated this pattern:
  stolen enclave credentials accessed production resources through
  resource policy grants that did not require role assumption.
domain: identity
severity: critical
scope: compound
corpus_reference: MITRE:T1199
compliance:
  owasp_nhi: "NHI6"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  nist_800_53_r5: "AC-4"
  fedramp_moderate: "AC-4"
  iso_27001_2022: "A.8.22"
  ccm_v4: ["IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
taxonomy:
  - compliance-mapping
  - trust-boundary
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_iam_user, aws_iam_role]
params:
  attack_stage: lateral_movement
observation_fields:
  - identity.resource_policy.has_cross_env_grant
remediation:
  description: >
    Resource policy grants access to a principal from a different
    environment tier. Cross-environment access bypasses AssumeRole
    controls.
  action: >
    Remove cross-environment principal grants from resource policies.
    Cross-environment access should route through AssumeRole with
    ExternalId and MFA conditions so that session logging, duration
    limits, and conditional access apply. If direct resource-policy
    access is required, scope it to specific actions and add
    aws:PrincipalOrgID and aws:PrincipalTag/Environment conditions.
  example: |
    {
      "identity": {
        "kind": "role",
        "resource_policy": {
          "has_cross_env_grant": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.resource_policy.has_cross_env_grant
      op: present
    - field: properties.identity.resource_policy.has_cross_env_grant
      op: eq
      value: true
tests:
  - name: "resource policy with cross-env grant fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:role/ProdDataRole"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          resource_policy:
            has_cross_env_grant: true
  - name: "resource policy without cross-env grant passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:role/ProdInternalRole"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          resource_policy:
            has_cross_env_grant: false
