dsl_version: ctrl.v1
id: CTL.IAM.POLICY.DIRECT.001
name: No Direct Policy Attachment on IAM Users
description: >
  IAM users must not have managed policies attached directly.
  Policies should be attached to groups or roles, not individual users.
  Direct attachment creates unmanageable per-user permission sprawl.
domain: identity
severity: low
compliance:
  cis_aws_v1.4.0: "1.15"
  cis_aws_v3.0: "1.15"
  hipaa: "164.312(a)(1)"
  soc2: "CC6.3"
  pci_dss_v4.0: "7.2.2"
  nist_800_53_r5: "AC-6"
  fedramp_moderate: "AC-6"
  gdpr: "Art.32"
  ffiec: "CAT-D3"
  iso_27001_2022: "A.8.2"
  nist_csf_2.0: "PR.AA"
  ccm_v4: ["IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
type: unsafe_state
classification: state_assertion
params:
  attack_stage: privilege_escalation
remediation:
  description: >
    IAM user has managed policies attached directly. Direct attachment
    prevents consistent permission management across users.
  action: >
    Create IAM groups with the required policies and add the user to
    the appropriate groups. Remove directly attached policies from the user.
  example: |
    {
      "identity": {
        "kind": "user",
        "policies": {
          "has_direct_policies": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: user
    - field: properties.identity.policies.has_direct_policies
      op: eq
      value: true
alternatives:
  - tool: prowler
    check_id: iam_policy_attached_only_to_group_or_roles
    coverage: covered
    note: Stave splits 'no direct managed attach' from 'no inline policies' into two controls; union matches.
