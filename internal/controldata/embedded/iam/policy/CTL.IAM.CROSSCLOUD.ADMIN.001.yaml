dsl_version: ctrl.v1
id: CTL.IAM.CROSSCLOUD.ADMIN.001
name: No Full Admin Policies Across Any Cloud Provider
description: >
  No IAM policy on any cloud provider should grant unrestricted
  administrative access (Action: *, Resource: * or equivalent).
  This control extends CTL.IAM.POLICY.ADMIN.001 beyond AWS to
  Azure (Contributor/Owner at subscription scope) and GCP
  (roles/owner, roles/editor at project scope). The same
  least-privilege principle applies regardless of cloud provider.
domain: identity
severity: critical
compliance:
  owasp_nhi: "NHI5"
  soc2: "CC6.1"
  nist_800_53_r5: "AC-6"
  ccm_v4: ["IAM-01", "IAM-05", "IAM-16"]
scope_tags:
  - multicloud
  - iam
type: unsafe_state
classification: state_assertion
corpus_reference: MITRE:T1078.004
applicable_asset_types:
  - aws_iam_user
params:
  attack_stage: privilege_escalation
remediation:
  description: >
    IAM entity has full admin access. Any compromised identity
    can perform any action on any resource.
  action: >
    Replace admin policies with scoped policies granting only
    required permissions. Use cloud-specific access analyzers
    to identify unused permissions.
  example: |
    {
      "identity": {
        "kind": "user",
        "policies": {
          "has_admin_access": false
        }
      }
    }
mitre_attack:
  - id: T1078.004
    name: "Valid Accounts: Cloud Accounts"
    tactic: privilege-escalation
validated_against:
  - vendor: datadog
    lab: iam-002-to-admin
    result: detected
    verified: "2026-05-29"
  - vendor: datadog
    lab: lambda-004-to-iam-002
    result: detected
    verified: "2026-05-29"
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: user
    - field: properties.identity.policies.has_admin_access
      op: eq
      value: true
