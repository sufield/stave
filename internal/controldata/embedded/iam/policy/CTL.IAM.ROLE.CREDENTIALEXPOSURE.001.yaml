dsl_version: ctrl.v1
id: CTL.IAM.ROLE.CREDENTIALEXPOSURE.001
name: Non-Security Roles Must Not Have CredentialExposure Actions
description: >
  IAM role outside the security admin set has
  CredentialExposure-classified actions
  (sts:GetFederationToken, iam:CreateAccessKey,
  iam:CreateLoginProfile, sts:AssumeRole on *,
  iam:UpdateAccessKey, etc.). These actions create or
  modify credentials — they should be restricted to
  security admin roles and automated credential rotation
  tooling. The sensitive action registry classifies these
  as CredentialExposure; any non-security role with them
  is an escalation vector.
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "AC-6(1)"
  soc2: "CC6.3"
  ccm_v4: ["IAM-04", "IAM-05"]
scope_tags:
  - aws
  - iam
taxonomy:
  - least-privilege
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  attack_stage: privilege_escalation
observation_fields:
  - identity.kind
  - identity.role.is_security_admin
  - identity.effective_permissions.has_credential_exposure_actions
remediation:
  description: >
    Non-security role has CredentialExposure actions.
    Attacker can create or modify credentials.
  action: >
    Remove CredentialExposure actions from the role's
    permissions. If the role needs iam:CreateAccessKey for
    service account rotation, scope it to the specific
    user ARN and add a condition key.
  example: |
    {
      "identity": {
        "kind": "role",
        "role": {"is_security_admin": false},
        "effective_permissions": {
          "has_credential_exposure_actions": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: role
    - field: properties.identity.role.is_security_admin
      op: ne
      value: true
    - field: properties.identity.effective_permissions.has_credential_exposure_actions
      op: eq
      value: true
tests:
  - name: "non-security role with credential actions fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:role/app-deployer"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          role:
            is_security_admin: false
          effective_permissions:
            has_credential_exposure_actions: true
  - name: "security admin with credential actions passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:role/security-admin"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          role:
            is_security_admin: true
          effective_permissions:
            has_credential_exposure_actions: true
