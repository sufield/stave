dsl_version: ctrl.v1
id: CTL.IAM.POLICY.ADMIN.001
name: No Full Admin Policies Attached
description: >
  No IAM policy with Effect Allow on Action "*" and Resource "*"
  should be attached to any IAM entity. Full admin policies violate
  least privilege and grant unrestricted access to all services.
domain: identity
severity: critical
compliance:
  owasp_nhi: "NHI5"
  cis_aws_v3.0: "1.16"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  nist_800_53_r5: "AC-6"
  fedramp_moderate: "AC-6"
  gdpr: "Art.32"
  ffiec: "CAT-D3"
  iso_27001_2022: "A.8.3"
  nist_csf_2.0: "PR.AA"
  ccm_v4: ["IAM-05", "IAM-16"]
  owasp_subtractive: "S02"
  subtractive_tier: "deletion"
scope_tags:
  - aws
  - iam
taxonomy:
  - least-privilege
  - logging
  - network-perimeter
type: unsafe_state
classification: state_assertion
corpus_reference: MITRE:T1078.004
applicable_asset_types:
  - aws_iam_user
params:
  attack_stage: privilege_escalation
remediation:
  description: >
    IAM entity has a policy granting full *:* administrative access.
  action: >
    Replace wildcard admin policies with scoped policies granting
    only the specific permissions required. Use AWS Access Analyzer
    to generate least-privilege policies from CloudTrail activity.
  example: |
    {
      "identity": {
        "kind": "user",
        "policies": {
          "has_admin_access": false
        }
      }
    }
mitre_attack:
  - id: T1078.004
    name: "Valid Accounts: Cloud Accounts"
    tactic: privilege-escalation
validated_against:
  - vendor: datadog
    lab: iam-002-to-admin
    result: detected
    verified: "2026-05-29"
  - vendor: datadog
    lab: lambda-004-to-iam-002
    result: detected
    verified: "2026-05-29"
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: user
    - field: properties.identity.policies.has_admin_access
      op: present
    - field: properties.identity.policies.has_admin_access
      op: eq
      value: true
alternatives:
  - tool: prowler
    check_id: iam_aws_attached_policy_no_administrative_privileges
    coverage: covered
    note: >-
      Fires on identity.policies.has_admin_access = true for any principal attachment,
      including AWS-managed.
  - tool: prowler
    check_id: iam_customer_attached_policy_no_administrative_privileges
    coverage: covered
    note: Same field as AWS-managed; has_admin_access is agnostic to policy source.
  - tool: prowler
    check_id: iam_customer_unattached_policy_no_administrative_privileges
    coverage: partial
    note: >-
      Stave's signal is per-principal-attached; unattached admin policies (inventory
      hygiene) not currently surfaced.
  - tool: prowler
    check_id: iam_group_administrator_access_policy
    coverage: covered
    note: Catches admin access regardless of whether attached directly or via group membership.
  - tool: prowler
    check_id: iam_inline_policy_no_administrative_privileges
    coverage: covered
    note: "POLICY.ADMIN catches *:*; POLICY.INLINE enforces no-inline-on-users as structural hygiene."
  - tool: prowler
    check_id: iam_role_administratoraccess_policy
    coverage: covered
    note: has_admin_access is principal-kind-agnostic; same control covers user and role cases.
  - tool: prowler
    check_id: iam_user_administrator_access_policy
    coverage: covered
    note: Per-user admin attach plus account-wide admin-count threshold.
