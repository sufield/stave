dsl_version: ctrl.v1
id: CTL.IAM.POLICY.CLOUDSHELL.001
name: Restrict AWSCloudShellFullAccess
description: >
  The AWSCloudShellFullAccess managed policy should not be attached
  to any IAM entity unless specifically required. CloudShell provides
  a browser-based shell that can bypass network-level controls.
domain: identity
severity: medium
compliance:
  owasp_nhi: "NHI5"
  cis_aws_v3.0: "1.22"
  soc2: "CC6.3"
  ccm_v4: ["IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
taxonomy:
  - compliance-mapping
  - least-privilege
  - network-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_account
params:
  attack_stage: privilege_escalation
remediation:
  description: >
    AWSCloudShellFullAccess is attached to IAM entities that do not
    require it.
  action: >
    Detach AWSCloudShellFullAccess from all IAM users, groups, and
    roles that do not require it.
  example: |
    {
      "identity": {
        "kind": "account",
        "policies": {
          "cloudshell_unrestricted": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: account
    - field: properties.identity.policies.cloudshell_unrestricted
      op: eq
      value: true
alternatives:
  - tool: prowler
    check_id: iam_policy_cloudshell_admin_not_attached
    coverage: covered
    note: Both check the specific AWSCloudShellFullAccess attachment.
