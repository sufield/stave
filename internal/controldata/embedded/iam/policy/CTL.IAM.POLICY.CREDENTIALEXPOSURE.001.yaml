dsl_version: ctrl.v1
id: CTL.IAM.POLICY.CREDENTIALEXPOSURE.001
name: Policy Grants Credential-Exposure Actions
description: >
  IAM policy grants actions classified as credential-exposure in
  the AWS sensitive action registry: sts:GetFederationToken,
  sts:GetSessionToken, iam:CreateAccessKey, iam:CreateLoginProfile,
  ssm:GetParameter (SecureString), secretsmanager:GetSecretValue,
  and similar. These actions let an attacker mint or extract
  credentials from within the account, enabling persistence and
  lateral movement that survives credential rotation. Principals
  should only have credential-exposure actions when their function
  explicitly requires them.
domain: identity
severity: high
compliance:
  owasp_nhi: "NHI1"
  nist_800_53_r5: "AC-6, IA-5"
  soc2: "CC6.1"
  ccm_v4: ["IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
taxonomy:
  - least-privilege
  - credential-lifecycle
subtractive_category:
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  attack_stage: credential_access
observation_fields:
  - identity.kind
  - identity.policies.has_credential_exposure_actions
remediation:
  description: >
    IAM policy grants actions that can create or extract credentials.
  action: >
    Remove credential-exposure actions from the policy or scope
    them with resource and condition constraints. Use the sensitive
    action registry to audit which credential-exposure actions the
    principal actually invokes.
  example: |
    {
      "identity": {
        "kind": "role",
        "policies": {
          "has_credential_exposure_actions": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.policies.has_credential_exposure_actions
      op: eq
      value: true
tests:
  - name: "role with credential exposure actions — fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:role/app-role"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          policies:
            has_credential_exposure_actions: true
  - name: "role without credential exposure actions — passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:role/compute-role"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          policies:
            has_credential_exposure_actions: false
