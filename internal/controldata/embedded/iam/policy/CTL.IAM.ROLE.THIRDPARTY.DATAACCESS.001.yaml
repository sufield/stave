dsl_version: ctrl.v1
id: CTL.IAM.ROLE.THIRDPARTY.DATAACCESS.001
name: Third-Party Roles Must Not Have DataAccess Actions Without Explicit Deny
description: >
  IAM role assumed by external parties has effective
  permissions that include DataAccess-classified actions
  (s3:GetObject, dynamodb:GetItem, rds:DownloadDBLogFile,
  etc.) without an explicit deny. Third-party access roles
  should not have blanket data-read permissions — they
  should be restricted to the specific API actions and
  resources the third party needs. The sensitive action
  registry classifies actions by risk; DataAccess is the
  category for actions that read customer data.
domain: identity
severity: high
compliance:
  nist_800_53_r5: "AC-6(1)"
  soc2: "CC6.3"
  ccm_v4: ["IAM-04"]
scope_tags:
  - aws
  - iam
taxonomy:
  - least-privilege
  - trust-boundary
  - data-perimeter
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  attack_stage: collection
observation_fields:
  - identity.kind
  - identity.trust.allows_external_assume
  - identity.effective_permissions.has_data_access_actions
  - identity.effective_permissions.data_access_explicitly_denied
remediation:
  description: >
    Third-party role has DataAccess actions without explicit
    deny. External party can read customer data.
  action: >
    Add explicit Deny statements for DataAccess-classified
    actions to the role's identity policy, or replace
    broad read permissions with specific actions scoped to
    the resources the third party needs.
  example: |
    {
      "identity": {
        "kind": "role",
        "trust": {"allows_external_assume": true},
        "effective_permissions": {
          "has_data_access_actions": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: role
    - field: properties.identity.trust.allows_external_assume
      op: eq
      value: true
    - field: properties.identity.effective_permissions.has_data_access_actions
      op: eq
      value: true
    - field: properties.identity.effective_permissions.data_access_explicitly_denied
      op: ne
      value: true
tests:
  - name: "third-party role with DataAccess fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:role/vendor-integration"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          trust:
            allows_external_assume: true
          effective_permissions:
            has_data_access_actions: true
            data_access_explicitly_denied: false
  - name: "third-party role with explicit deny passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:role/vendor-integration"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          trust:
            allows_external_assume: true
          effective_permissions:
            has_data_access_actions: true
            data_access_explicitly_denied: true
