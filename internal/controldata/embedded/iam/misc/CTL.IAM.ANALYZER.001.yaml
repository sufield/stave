dsl_version: ctrl.v1
id: CTL.IAM.ANALYZER.001
name: IAM Access Analyzer Must Be Enabled
description: >
  IAM Access Analyzer must be enabled in every region. Access Analyzer
  identifies resources shared with external entities and generates
  findings for unintended exposure.
domain: identity
severity: high
compliance:
  cis_aws_v3.0: "1.20"
  soc2: "CC6.1"
  pci_dss_v4.0: "11.3.1"
  nist_800_53_r5: "SI-4"
  fedramp_moderate: "SI-4"
  ccm_v4: ["CCC-07", "IAM-03"]
scope_tags:
  - aws
  - iam
taxonomy:
  - compliance-mapping
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_iam_user, aws_iam_role]
params:
  attack_stage: detection_evasion
remediation:
  description: >
    IAM Access Analyzer is not enabled in this region.
  action: >
    Create an Access Analyzer in each region:
    aws accessanalyzer create-analyzer --analyzer-name default
    --type ACCOUNT --region <region>
  example: |
    {
      "access_analyzer": {
        "enabled": true,
        "analyzer_type": "ACCOUNT"
      }
    }
unsafe_predicate:
  all:
    - field: properties.access_analyzer.enabled
      op: eq
      value: false
