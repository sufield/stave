dsl_version: ctrl.v1
id: CTL.IAM.SSO.ENCRYPT.CMK.001
name: IAM Identity Center Must Use a Customer-Managed KMS Key
description: >
  IAM Identity Center instance is encrypted with an AWS-managed
  key instead of a customer-managed KMS key — the organization
  cannot control key rotation schedule, key policy, or key
  deletion. Identity Center stores workforce identity data
  including group memberships and permission set assignments
  that may be subject to compliance requirements mandating
  customer-controlled encryption.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: SC-12
  soc2: CC6.7
  pci_dss_v4.0: 3.6.1
  ccm_v4:
    - CEK-04
    - CEK-08
scope_tags:
  - aws
  - iam
taxonomy:
  - compliance-mapping
  - encryption-at-rest
  - key-management
subtractive_category:
  - S10
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_sso_instance]
params:
  attack_stage: credential_access
observation_fields:
  - identity.sso.kms_key_customer_managed
remediation:
  description: >
    IAM Identity Center is encrypted with an AWS-managed key.
    Per-tenant key-policy and revocation controls are unavailable.
  action: >
    Configure a customer-managed KMS key for the Identity Center
    instance. For multi-Region instances, use a multi-Region
    KMS key so the key replicates alongside the instance.
  example: |
    {
      "identity": {
        "kind": "sso_config",
        "sso": {
          "kms_key_arn": "arn:aws:kms:us-east-1:111122223333:key/mrk-1234",
          "kms_key_customer_managed": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: sso_config
    - field: properties.identity.sso.kms_key_customer_managed
      op: eq
      value: false
tests:
  - name: SSO with AWS-managed key fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:sso:::instance/ssoins-1234567890abcdef"
      asset_type: aws_sso_instance
      vendor: aws
      properties:
        identity:
          kind: sso_config
          sso:
            kms_key_arn: "arn:aws:kms:us-east-1:111122223333:key/abcd-1234"
            kms_key_customer_managed: false
  - name: SSO with customer-managed key passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:sso:::instance/ssoins-abcdef1234567890"
      asset_type: aws_sso_instance
      vendor: aws
      properties:
        identity:
          kind: sso_config
          sso:
            kms_key_arn: "arn:aws:kms:us-east-1:111122223333:key/mrk-5678"
            kms_key_customer_managed: true
