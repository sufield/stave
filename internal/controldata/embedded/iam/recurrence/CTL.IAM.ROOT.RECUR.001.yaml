dsl_version: ctrl.v1
id: CTL.IAM.ROOT.RECUR.001
name: Root Account Must Not Be Used Repeatedly
description: >
  Root account API activity has occurred more than once in 30 days. A single root usage may be a legitimate break-glass event. Two or more usages within a month requires investigation — either the organization has not addressed the process that led to the first usage, or root credentials have been compromised and are being actively used.
domain: identity
severity: critical
compliance:
  soc2: "CC7.1"
  nist_800_53_r5: "AC-2"
  fedramp_moderate: "AC-2"
  cis_aws_v3.0: "1.7"
  hipaa: "164.312(a)(2)(i)"
  pci_dss_v4.0: "8.1.1"
  ccm_v4: ["CCC-07", "IAM-08"]
scope_tags:
  - aws
  - iam
type: unsafe_recurrence
classification: aggregate_check
params:
  recurrence_threshold: 1
  window_days: 30
  attack_stage: credential_access
remediation:
  description: >
    Resource has oscillated between safe and unsafe state repeatedly.
    This is not a single misconfiguration — it is a pattern requiring
    investigation.
  action: >
    Investigate the root cause of the repeated oscillation. Determine
    whether the pattern indicates a broken process, operational
    workaround, or active compromise. Review CloudTrail for the API
    calls that triggered each transition.
unsafe_predicate:
  all:
    - field: properties.identity.root.recent_api_activity
      op: eq
      value: true
alternatives:
  - tool: prowler
    check_id: iam_avoid_root_usage
    coverage: covered
    note: Both check root-account activity signals.
