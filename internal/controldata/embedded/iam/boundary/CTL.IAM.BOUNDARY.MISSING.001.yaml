dsl_version: ctrl.v1
id: CTL.IAM.BOUNDARY.MISSING.001
name: Delegated Admin Role Can Create Unbounded Principals
description: >
  An IAM role with iam:CreateRole or iam:CreateUser permission does not
  have a permission boundary that requires setting a boundary on created
  principals. The role can create new IAM roles and users without any
  boundary constraint — the created principals have no upper bound on
  their effective permissions.
domain: identity
severity: high
compliance:
  nist_800_53_r5: "AC-6(5)"
  soc2: "CC6.3"
  pci_dss_v4.0: "7.2.2"
  ccm_v4: ["IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_iam_user, aws_iam_role]
defect: >
  IAM role can create new IAM principals without requiring a permission
  boundary on the created principals.
infection: >
  Permission boundaries constrain the maximum permissions a principal can
  have — even if an IAM policy grants broader access, the boundary limits
  the effective permissions. A delegated admin role that can create new
  principals without boundary requirements can create principals with any
  permissions — the created principal is unbounded. The delegated admin
  can effectively escalate beyond their own boundary by creating a new
  principal without one.
failure: >
  Boundary escape via principal creation. The delegated admin creates a
  new role without a boundary, attaches admin policies to it, and assumes
  it — bypassing their own boundary.
params:
  attack_stage: privilege_escalation
  base_impact: 8
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.0
observation_fields:
  - identity.kind
  - identity.role.can_create_principals
  - identity.role.boundary_requires_boundary_on_created
  - identity.role.has_boundary
remediation:
  description: >
    Delegated admin role can create unbounded IAM principals.
  action: >
    Add a permission boundary condition to the delegated admin role
    that requires iam:PermissionsBoundary on CreateRole and CreateUser
    calls.
  example: |
    {
      "identity": {
        "kind": "role",
        "role": {
          "boundary_requires_boundary_on_created": true,
          "has_boundary": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.role.boundary_requires_boundary_on_created
      op: ne
      value: true
tests:
  - name: delegated admin without boundary requirement fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:role/delegated-admin"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          role:
            can_create_principals: true
            boundary_requires_boundary_on_created: false
            has_boundary: true
  - name: delegated admin with boundary requirement passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:role/scoped-admin"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          role:
            can_create_principals: true
            boundary_requires_boundary_on_created: true
            has_boundary: true
