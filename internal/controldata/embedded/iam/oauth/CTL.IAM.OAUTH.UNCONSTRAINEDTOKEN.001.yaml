dsl_version: ctrl.v1
id: CTL.IAM.OAUTH.UNCONSTRAINEDTOKEN.001
name: OAuth Token Creation Must Have Grant Type Constraint
description: >
  An IAM identity has signin:CreateOAuth2Token permission without a
  signin:OAuthGrantType condition. Without this condition, all OAuth
  grant types are available — including client_credentials, which
  enables headless token acquisition without browser-based
  authorization. Any holder of this role's AWS credentials can obtain
  OAuth tokens for the AWS MCP Server without interactive approval.

  Note: this evaluation does not credit SCP-based OAuth restrictions
  that use condition keys. If your organization uses SCPs with
  signin:OAuthGrantType conditions, this finding may not apply.
domain: identity
severity: critical
scope: compound
corpus_reference: MITRE:T1550.001
compliance:
  nist_800_53_r5: "AC-6(5)"
  fedramp_moderate: "AC-6(5)"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  iso_27001_2022: "A.8.3"
  ccm_v4: ["IAM-02", "IAM-05"]
scope_tags:
  - aws
  - iam
  - oauth
taxonomy:
  - compliance-mapping
  - least-privilege
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_user
  - aws_iam_role
observation_fields:
  - identity.oauth.create_token.present
  - identity.oauth.grant_type_constrained
remediation:
  description: >
    Identity can create OAuth tokens for the AWS MCP Server
    (signin:CreateOAuth2Token) without a grant type constraint.
    The client_credentials grant is available, enabling headless
    agent impersonation.
  action: >
    Add a signin:OAuthGrantType condition restricting grant types to
    authorization_code and refresh_token. This forces interactive
    browser-based authorization and prevents headless token acquisition
    via client_credentials.
  example: |
    {
      "identity": {
        "oauth": {
          "create_token": { "present": true },
          "grant_type_constrained": true
        }
      }
    }
mitre_attack:
  - id: T1550.001
    name: "Use Alternate Authentication Material: Application Access Token"
    tactic: credential-access
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: in
      value: ["user", "role"]
    - field: properties.identity.oauth.create_token.present
      op: eq
      value: true
    - field: properties.identity.oauth.grant_type_constrained
      op: eq
      value: false
tests:
  - name: Role with OAuth token creation and no grant type constraint
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::123456789012:role/mcp-agent"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          oauth:
            create_token:
              present: true
            grant_type_constrained: false
  - name: Role with OAuth token creation and grant type constraint
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::123456789012:role/mcp-agent-scoped"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          oauth:
            create_token:
              present: true
            grant_type_constrained: true
