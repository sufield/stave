dsl_version: ctrl.v1
id: CTL.IAM.OAUTH.UNSCOPEDRESOURCE.001
name: OAuth Authorize Must Be Scoped to MCP Service Principal
description: >
  An IAM identity has signin:AuthorizeOAuth2Access with Resource: *
  rather than scoped to the MCP service principal ARN
  (arn:aws:signin:*:*:service-principal/aws-mcp.amazonaws.com). An
  unscoped resource permits authorization against any service principal
  registered in the signin namespace — current and future.
domain: identity
severity: medium
scope: compound
corpus_reference: MITRE:T1550.001
compliance:
  nist_800_53_r5: "AC-6(5)"
  fedramp_moderate: "AC-6(5)"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  iso_27001_2022: "A.8.3"
scope_tags:
  - aws
  - iam
  - oauth
taxonomy:
  - compliance-mapping
  - least-privilege
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_user
  - aws_iam_role
observation_fields:
  - identity.oauth.authorize_access.present
  - identity.oauth.scoped_to_mcp_service_principal
remediation:
  description: >
    Identity has OAuth authorization permission with Resource: * rather
    than scoped to the MCP service principal.
  action: >
    Scope the Resource field to
    arn:aws:signin:*:*:service-principal/aws-mcp.amazonaws.com to limit
    authorization to the intended service.
  example: |
    {
      "identity": {
        "oauth": {
          "authorize_access": { "present": true },
          "scoped_to_mcp_service_principal": true
        }
      }
    }
mitre_attack:
  - id: T1550.001
    name: "Use Alternate Authentication Material: Application Access Token"
    tactic: credential-access
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: in
      value: ["user", "role"]
    - field: properties.identity.oauth.authorize_access.present
      op: present
    - field: properties.identity.oauth.authorize_access.present
      op: eq
      value: true
    - field: properties.identity.oauth.scoped_to_mcp_service_principal
      op: ne
      value: true
tests:
  - name: Role with OAuth authorize and unscoped resource
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::123456789012:role/mcp-agent"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          oauth:
            authorize_access:
              present: true
            scoped_to_mcp_service_principal: false
  - name: Role with OAuth authorize scoped to MCP service principal
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::123456789012:role/mcp-agent-scoped"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          oauth:
            authorize_access:
              present: true
            scoped_to_mcp_service_principal: true
