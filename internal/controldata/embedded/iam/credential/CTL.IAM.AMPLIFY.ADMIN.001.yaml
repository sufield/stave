dsl_version: ctrl.v1
id: CTL.IAM.AMPLIFY.ADMIN.001
name: IAM Policy Grants Amplify App Creation
description: >
  An IAM principal has a policy granting amplify:CreateApp. Amplify
  apps provision CloudFront distributions, S3 buckets, Lambda@Edge
  functions, and IAM roles — internet-facing infrastructure invisible
  to the standard CloudFront, S3, and Lambda management APIs.
domain: identity
severity: high
compliance:
  nist_800_53_r5: "AC-6"
  soc2: "CC6.3"
  ccm_v4: ["IAM-02"]
scope_tags: [aws, iam]
taxonomy:
  - least-privilege
  - resource-sprawl
subtractive_category:
  - S02
  - S03
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_iam_user, aws_iam_role]
params:
  attack_stage: persistence
observation_fields:
  - identity.kind
  - identity.permissions.amplify_create_app
remediation:
  description: IAM principal can create Amplify apps — shadow CDN and compute.
  action: Remove amplify:CreateApp from the principal's policies.
  example: |
    {"identity": {"kind": "iam_principal", "permissions": {"amplify_create_app": false}}}
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: in
      value: [iam_user, iam_role]
    - field: properties.identity.permissions.amplify_create_app
      op: present
    - field: properties.identity.permissions.amplify_create_app
      op: eq
      value: true
tests:
  - name: "principal with Amplify create fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:user/deploy-bot"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: iam_user
          permissions: {amplify_create_app: true}
  - name: "principal without Amplify create passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::444455556666:user/readonly"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: iam_user
          permissions: {amplify_create_app: false}
