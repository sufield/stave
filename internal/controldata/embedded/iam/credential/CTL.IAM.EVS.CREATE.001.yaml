dsl_version: ctrl.v1
id: CTL.IAM.EVS.CREATE.001
name: IAM Policy Grants EVS Environment Creation
description: >
  An IAM principal has a policy granting evs:CreateEnvironment. This
  allows provisioning a full VMware SDDC in an AWS-managed account —
  the resulting infrastructure runs outside the customer's VPC, is not
  inventoried by AWS Config, and creates a VMware management plane
  invisible to CloudWatch, GuardDuty, and Security Hub. This is both
  a resource-sprawl and a detection-evasion vector.
domain: identity
severity: high
compliance:
  nist_800_53_r5: "AC-6"
  soc2: "CC6.3"
  ccm_v4: ["IAM-02"]
scope_tags:
  - aws
  - iam
taxonomy:
  - credential-lifecycle
  - resource-sprawl
  - least-privilege
subtractive_category:
  - S08
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_user
  - aws_iam_role
params:
  attack_stage: privilege_escalation
observation_fields:
  - identity.kind
  - identity.permissions.evs_create_environment
remediation:
  description: >
    IAM principal can create EVS environments — shadow VMware
    infrastructure outside standard governance.
  action: >
    Remove evs:CreateEnvironment from the principal's policies.
  example: |
    {
      "identity": {
        "kind": "iam_principal",
        "permissions": {
          "evs_create_environment": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: in
      value:
        - iam_user
        - iam_role
    - field: properties.identity.permissions.evs_create_environment
      op: present
    - field: properties.identity.permissions.evs_create_environment
      op: eq
      value: true
tests:
  - name: "principal with EVS create permission fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:user/infra-admin"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: iam_user
          permissions:
            evs_create_environment: true
  - name: "principal without EVS create passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::444455556666:user/readonly-user"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: iam_user
          permissions:
            evs_create_environment: false
  - name: "role with EVS create fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:role/deploy-role"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: iam_role
          permissions:
            evs_create_environment: true
