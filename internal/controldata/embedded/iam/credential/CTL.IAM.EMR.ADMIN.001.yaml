dsl_version: ctrl.v1
id: CTL.IAM.EMR.ADMIN.001
name: IAM Policy Grants EMR Job Flow Creation
description: >
  An IAM principal has a policy granting
  elasticmapreduce:RunJobFlow. EMR clusters provision EC2 instances
  with overpermissioned default security groups
  (ElasticMapReduce-master and ElasticMapReduce-slave) and IAM roles
  with S3 and KMS access for data processing.
domain: identity
severity: high
compliance:
  nist_800_53_r5: "AC-6"
  soc2: "CC6.3"
  ccm_v4: ["IAM-02"]
scope_tags: [aws, iam]
taxonomy:
  - least-privilege
  - resource-sprawl
subtractive_category:
  - S02
  - S04
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_iam_user, aws_iam_role]
params:
  attack_stage: persistence
observation_fields:
  - identity.kind
  - identity.permissions.emr_run_job_flow
remediation:
  description: IAM principal can create EMR clusters — EC2 with overpermissioned default SGs.
  action: Remove elasticmapreduce:RunJobFlow from the principal's policies.
  example: |
    {"identity": {"kind": "iam_principal", "permissions": {"emr_run_job_flow": false}}}
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: in
      value: [iam_user, iam_role]
    - field: properties.identity.permissions.emr_run_job_flow
      op: present
    - field: properties.identity.permissions.emr_run_job_flow
      op: eq
      value: true
tests:
  - name: "principal with EMR RunJobFlow fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:user/data-eng"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: iam_user
          permissions: {emr_run_job_flow: true}
  - name: "principal without EMR RunJobFlow passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::444455556666:user/readonly"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: iam_user
          permissions: {emr_run_job_flow: false}
