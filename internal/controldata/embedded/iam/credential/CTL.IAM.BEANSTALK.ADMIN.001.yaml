dsl_version: ctrl.v1
id: CTL.IAM.BEANSTALK.ADMIN.001
name: IAM Policy Grants Elastic Beanstalk Environment Creation
description: >
  An IAM principal has a policy granting
  elasticbeanstalk:CreateEnvironment. Beanstalk environments
  provision EC2 instances, Auto Scaling groups, Elastic Load
  Balancers, security groups, and optionally RDS databases —
  internet-facing infrastructure with Beanstalk-managed defaults
  that may not match organizational security baselines.
domain: identity
severity: high
compliance:
  nist_800_53_r5: "AC-6"
  soc2: "CC6.3"
  ccm_v4: ["IAM-02"]
scope_tags: [aws, iam]
taxonomy:
  - least-privilege
  - resource-sprawl
subtractive_category:
  - S02
  - S03
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_iam_user, aws_iam_role]
params:
  attack_stage: persistence
observation_fields:
  - identity.kind
  - identity.permissions.beanstalk_create_environment
remediation:
  description: IAM principal can create Beanstalk environments — EC2, ELB, SG with managed defaults.
  action: Remove elasticbeanstalk:CreateEnvironment from the principal's policies.
  example: |
    {"identity": {"kind": "iam_principal", "permissions": {"beanstalk_create_environment": false}}}
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: in
      value: [iam_user, iam_role]
    - field: properties.identity.permissions.beanstalk_create_environment
      op: present
    - field: properties.identity.permissions.beanstalk_create_environment
      op: eq
      value: true
tests:
  - name: "principal with Beanstalk create fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:user/deploy-bot"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: iam_user
          permissions: {beanstalk_create_environment: true}
  - name: "principal without Beanstalk create passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::444455556666:user/readonly"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: iam_user
          permissions: {beanstalk_create_environment: false}
