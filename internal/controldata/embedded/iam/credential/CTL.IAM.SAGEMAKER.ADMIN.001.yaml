dsl_version: ctrl.v1
id: CTL.IAM.SAGEMAKER.ADMIN.001
name: IAM Policy Grants SageMaker Notebook and Domain Creation
description: >
  An IAM principal has a policy granting
  sagemaker:CreateNotebookInstance or sagemaker:CreateDomain.
  SageMaker notebook instances and Studio domains provision EC2
  compute with EBS storage, optional internet access, and IAM
  execution roles that typically have broad S3 and KMS permissions
  for training data access.
domain: identity
severity: high
compliance:
  nist_800_53_r5: "AC-6"
  soc2: "CC6.3"
  ccm_v4: ["IAM-02"]
scope_tags: [aws, iam]
taxonomy:
  - least-privilege
  - resource-sprawl
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_iam_user, aws_iam_role]
params:
  attack_stage: privilege_escalation
observation_fields:
  - identity.kind
  - identity.permissions.sagemaker_create_notebook
remediation:
  description: IAM principal can create SageMaker notebooks — compute with data access and potential internet exposure.
  action: Remove sagemaker:CreateNotebookInstance and sagemaker:CreateDomain from the principal's policies.
  example: |
    {"identity": {"kind": "iam_principal", "permissions": {"sagemaker_create_notebook": false}}}
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: in
      value: [iam_user, iam_role]
    - field: properties.identity.permissions.sagemaker_create_notebook
      op: present
    - field: properties.identity.permissions.sagemaker_create_notebook
      op: eq
      value: true
tests:
  - name: "principal with SageMaker create fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:role/ml-team"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: iam_role
          permissions: {sagemaker_create_notebook: true}
  - name: "principal without SageMaker create passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::444455556666:user/readonly"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: iam_user
          permissions: {sagemaker_create_notebook: false}
