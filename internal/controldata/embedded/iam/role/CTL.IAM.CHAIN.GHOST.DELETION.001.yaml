dsl_version: ctrl.v1
id: CTL.IAM.CHAIN.GHOST.DELETION.001
name: Role Chain Reaches a Role Scheduled for Deletion (TOCTOU)
description: >
  A principal has a transitive role-assumption chain whose target
  is scheduled for deletion at a known future time. The chain is
  reachable now, but every consumer caching the reachability
  decision is stale once the deletion completes — the
  time-of-check / time-of-use pattern. After the deletion window
  closes, the chain has a future-ghost reference: any policy that
  re-evaluated against the cached chain would assume permissions
  that no longer exist (or — worse — that another team has
  recreated under the same ARN with different intent). Same
  ghost-reference primitive as
  CTL.SECRETS.GHOST.DELETION.REFERENCED.001, lifted from
  per-asset to multi-hop chain analysis. The .present boolean is
  folded upstream from Stave's chain walker, which stamps each
  emitted RoleChainFact with `scheduled_deletion_at` whenever the
  chain crosses an identity scheduled for future deletion (the
  earliest such timestamp wins per chain).
domain: identity
severity: high
archetype: ghost-reference
compliance:
  owasp_nhi: "NHI1"
  soc2: "CC6.1, CC8.1"
  pci_dss_v4.0: "7.2.1, 10.6"
  nist_800_53_r5: "AC-2, CM-3, IR-4"
  fedramp_moderate: "AC-2, CM-3"
  iso_27001_2022: "A.5.16, A.8.32"
  ccm_v4: ["IAM-04", "IAM-13", "BCR-08"]
scope_tags:
  - aws
  - iam
type: unsafe_state
classification: state_assertion
params:
  attack_stage: persistence
  base_impact: 7
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.0
observation_fields:
  - identity.kind
  - identity.chain.ghost_deletion.present
  - identity.chain.ghost_deletion.target_role
  - identity.chain.ghost_deletion.scheduled_deletion_at
  - identity.chain.ghost_deletion.hop_count
remediation:
  description: >
    A multi-hop role chain reaches a role that is scheduled for
    deletion. After the deletion window closes, every consumer
    reasoning over today's reachability data is operating on a
    snapshot that no longer matches reality. If the deleted role
    is later recreated (manually or by IaC) under the same ARN,
    the chain silently re-activates against whatever permissions
    the new role carries — which may or may not match the
    deleted one.
  action: >
    Decide intent: (a) if the deletion is unintended, cancel it
    and restore the role; (b) if intentional, remove the
    intermediate hops that lead to this role BEFORE the deletion
    window closes — typically by tightening sts:AssumeRole on
    the trust policies of the upstream roles, or by removing
    iam:PassRole grants that aim at the doomed role. After the
    deletion completes, audit any IaC / Terraform state that
    references the role's ARN; recreating the role under the
    same name is the foundational TOCTOU step the attacker
    would race for.
  example: |
    {
      "identity": {
        "kind": "user",
        "chain": {
          "ghost_deletion": {
            "present": false
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.chain.ghost_deletion.present
      op: eq
      value: true
