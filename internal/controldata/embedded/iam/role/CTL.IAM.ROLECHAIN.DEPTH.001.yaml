dsl_version: ctrl.v1
id: CTL.IAM.ROLECHAIN.DEPTH.001
name: Role Chain Depth Exceeds Threshold
description: >
  IAM role participates in an assume-role chain deeper than the
  recommended threshold. AWS allows role chaining up to the session
  duration limit, but deep chains (3+ hops) obscure the original
  principal's identity in CloudTrail, complicate access reviews,
  and create fragile dependency chains where revoking one role
  breaks downstream automation. Each hop reduces the maximum
  session duration (capped at 1 hour for chained sessions),
  signaling that the architecture relies on transitive trust
  rather than direct grants.
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "AC-6, AU-3"
  soc2: "CC6.1"
  ccm_v4: ["IAM-05", "LOG-03"]
scope_tags:
  - aws
  - iam
taxonomy:
  - least-privilege
  - trust-boundary
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  attack_stage: lateral_movement
observation_fields:
  - identity.kind
  - identity.role_chain_depth
remediation:
  description: >
    Role participates in an assume-role chain exceeding the
    recommended depth.
  action: >
    Flatten the role chain by granting direct trust relationships
    where possible. If chaining is required for cross-account
    patterns, limit depth to 2 hops and ensure each hop is
    logged and auditable.
  example: |
    {
      "identity": {
        "kind": "role",
        "role_chain_depth": 1
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: role
    - field: properties.identity.role_chain_depth
      op: gt
      value: 2
tests:
  - name: "role chain depth 4 — fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:role/deep-chain"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          role_chain_depth: 4
  - name: "role chain depth 1 — passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:role/direct-role"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          role_chain_depth: 1
