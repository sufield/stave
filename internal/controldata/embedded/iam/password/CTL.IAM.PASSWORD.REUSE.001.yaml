dsl_version: ctrl.v1
id: CTL.IAM.PASSWORD.REUSE.001
name: Password Reuse Prevention Must Be At Least 24
description: >
  The IAM account password policy must prevent reuse of the last 24
  passwords. Without reuse prevention, users cycle between a small set
  of passwords, negating the value of password rotation.
domain: identity
severity: medium
compliance:
  cis_aws_v1.4.0: "1.9"
  cis_aws_v3.0: "1.9"
  hipaa: "164.312(a)(2)(i)"
  pci_dss_v3.2.1: "8.2.5"
  soc2: "CC6.1"
  pci_dss_v4.0: "8.3.7"
scope_tags:
  - aws
  - iam
type: unsafe_state
params: {}
remediation:
  description: >
    Password reuse prevention is set below 24. Users can cycle through
    a small number of passwords, reducing the effectiveness of rotation.
  action: >
    Update the IAM password policy to prevent reuse of the last 24 passwords.
    Run: aws iam update-account-password-policy --password-reuse-prevention 24
  example: |
    {
      "identity": {
        "kind": "password_policy",
        "password_policy": {
          "reuse_prevention_count": 24
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: password_policy
    - field: properties.identity.password_policy.reuse_prevention_count
      op: lt
      value: 24
