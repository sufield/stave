dsl_version: ctrl.v1
id: CTL.IAM.PASSWORD.EXPIRATION.001
name: Password Policy Must Enforce Expiration Within 90 Days
description: >
  IAM account password policy must enforce password expiration
  within 90 days. Two unsafe states: max_password_age = 0 (passwords
  never expire, credentials valid indefinitely) or max_password_age
  > 90 (expiration too infrequent, exceeds CIS AWS Foundations
  Benchmark threshold). Either gives compromised passwords an
  unnecessarily long validity window.
domain: identity
severity: medium
compliance:
  cis_aws_v1.4.0: "1.11"
  cis_aws_v3.0: "1.11"
  hipaa: "164.312(a)(2)(i)"
  soc2: "CC6.1"
  pci_dss_v4.0: "8.3.9"
  nist_800_53_r5: "IA-5(1)"
  fedramp_moderate: "IA-5(1)"
  iso_27001_2022: "A.5.17"
  nist_csf_2.0: "PR.AA"
  ccm_v4: ["IAM-02"]
scope_tags:
  - aws
  - iam
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_password_policy
params:
  attack_stage: persistence
observation_fields:
  - identity.kind
  - identity.password_policy.max_password_age
remediation:
  description: >
    IAM account password policy does not enforce password expiration.
    Passwords never expire, giving compromised credentials indefinite
    validity.
  action: >
    Set password expiration to 90 days or less:
    aws iam update-account-password-policy --max-password-age 90
  example: |
    {
      "identity": {
        "kind": "password_policy",
        "password_policy": {
          "max_password_age": 90
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: password_policy
    - any:
        - field: properties.identity.password_policy.max_password_age
          op: eq
          value: 0
        - field: properties.identity.password_policy.max_password_age
          op: gt
          value: 90
defect: >
  IAM account password policy either disables password expiration
  (max_password_age = 0) or sets it above 90 days.
infection: >
  A password that never expires remains valid indefinitely after
  compromise. An attacker who obtains a console password through
  phishing, credential stuffing, or shoulder surfing retains access
  until the password is manually changed — there is no automatic
  rotation forcing them out. Combined with weak complexity
  requirements (CTL.IAM.PASSWORD.COMPLEXITY.001), the exposure
  window is unbounded.
failure: >
  Persistent access via compromised console password. No automatic
  credential rotation forces attacker re-authentication.
tests:
  - name: password policy with no expiration fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:password-policy"
      asset_type: aws_iam_password_policy
      vendor: aws
      properties:
        identity:
          kind: password_policy
          password_policy:
            max_password_age: 0
            minimum_length: 14
  - name: password policy with 365-day expiration fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:password-policy"
      asset_type: aws_iam_password_policy
      vendor: aws
      properties:
        identity:
          kind: password_policy
          password_policy:
            max_password_age: 365
            minimum_length: 14
  - name: password policy with 90-day expiration passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:password-policy"
      asset_type: aws_iam_password_policy
      vendor: aws
      properties:
        identity:
          kind: password_policy
          password_policy:
            max_password_age: 90
            minimum_length: 14
alternatives:
  - tool: prowler
    check_id: iam_password_policy_expires_passwords_within_90_days_or_less
    coverage: partial
    note: >-
      Prowler checks the policy-level expiration setting.
      CTL.IAM.PASSWORD.ROTATION.001 covers per-user stale passwords;
      this control covers the account-level policy enforcement.
validated_against:
  - vendor: nccgroup
    lab: sadcloud
    result: detected
    verified: "2026-06-01"
