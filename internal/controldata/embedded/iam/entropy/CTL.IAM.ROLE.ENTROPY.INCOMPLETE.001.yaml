dsl_version: ctrl.v1
id: CTL.IAM.ROLE.ENTROPY.INCOMPLETE.001
name: Complete Data Required for Entitlement Entropy Assessment
description: >
  Access Advisor data, permission policy inventory, or tag inventory is
  absent from the snapshot. Without this data, permission drift, category
  mixing, and intent mismatch controls cannot evaluate. Re-run the
  extractor with iam:GenerateServiceLastAccessedDetails,
  iam:GetServiceLastAccessedDetails, iam:ListAttachedRolePolicies,
  iam:ListRolePolicies, and iam:ListRoleTags permissions.
compliance:
  ccm_v4: ["DCS-06", "IAM-02"]
domain: identity
severity: low
scope_tags:
  - aws
  - iam
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  base_impact: 2
remediation:
  description: >
    The snapshot does not contain the data required for entitlement
    entropy assessment.
  action: >
    Re-run the extractor with permissions to collect Access Advisor data
    (iam:GenerateServiceLastAccessedDetails,
    iam:GetServiceLastAccessedDetails), policy inventory
    (iam:ListAttachedRolePolicies, iam:ListRolePolicies), and tags
    (iam:ListRoleTags).
  example: |
    {
      "identity": {
        "kind": "iam_role",
        "access_advisor": { "available": true }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: iam_role
    - field: properties.identity.access_advisor.available
      op: eq
      value: false
tests:
  - name: "role with access advisor passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::123:role/observable"
      asset_type: iam_role
      vendor: aws
      properties:
        identity:
          kind: iam_role
          access_advisor:
            available: true
  - name: "role missing access advisor fails"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::123:role/blind"
      asset_type: iam_role
      vendor: aws
      properties:
        identity:
          kind: iam_role
          access_advisor:
            available: false
