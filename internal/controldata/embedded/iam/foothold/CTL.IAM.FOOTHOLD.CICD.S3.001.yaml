dsl_version: ctrl.v1
id: CTL.IAM.FOOTHOLD.CICD.S3.001
name: CI/CD Role Can Write Deployment Artifacts to S3
description: >
  A CI/CD-identified role has effective permissions to write objects
  to S3 (s3:PutObject). S3 buckets are the standard artifact store
  for Lambda deployment zips, CloudFormation templates, Terraform
  state, and Helm charts. If the pipeline is compromised through a
  supply chain attack, the attacker modifies deployment artifacts —
  injecting backdoors into Lambda functions, CloudFormation
  templates, or Terraform state files that execute on next deploy.
domain: identity
severity: medium
scope: compound
corpus_reference: MITRE:T1195.002
compliance:
  owasp_nhi: "NHI5"
  nist_800_53_r5: "AC-6"
  soc2: "CC6.1"
  ccm_v4: ["IAM-04"]
scope_tags:
  - aws
  - iam
  - cicd
taxonomy:
  - least-privilege
  - supply-chain
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  attack_stage: persistence
observation_fields:
  - identity.cicd_role
  - identity.effective_access.s3
remediation:
  description: >
    CI/CD role can write objects to S3. A compromised pipeline can
    modify deployment artifacts in artifact buckets.
  action: >
    Scope S3 write permissions to specific bucket ARNs and key
    prefixes. Use S3 Object Lock on artifact buckets to prevent
    overwrite of released artifacts. Enable S3 versioning so
    tampered artifacts are detectable.
  example: |
    {
      "identity": {
        "kind": "iam_role",
        "cicd_role": true,
        "effective_access": { "s3": false }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.cicd_role
      op: eq
      value: true
    - field: properties.identity.effective_access.s3
      op: eq
      value: true
tests:
  - name: "CI/CD role with S3 write fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:role/github-actions-deploy"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: iam_role
          cicd_role: true
          effective_access:
            s3: true
  - name: "CI/CD role without S3 write passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:role/github-actions-test"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: iam_role
          cicd_role: true
          effective_access:
            s3: false
