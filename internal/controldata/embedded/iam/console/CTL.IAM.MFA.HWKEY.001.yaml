dsl_version: ctrl.v1
id: CTL.IAM.MFA.HWKEY.001
name: Privileged Accounts Must Use Hardware MFA
description: >
  IAM users with admin access must use a hardware MFA device (FIDO2,
  YubiKey, Gemalto), not a virtual MFA app or SMS. Virtual MFA can be
  compromised through device theft, seed extraction, or SIM swap
  attacks. Hardware tokens cannot be cloned or phished via device
  compromise, providing stronger protection for the most privileged
  identities.
domain: identity
severity: high
compliance:
  owasp_nhi: "NHI4"
  hipaa: "164.312(d)"
  soc2: "CC6.1"
  cis_aws_v3.0: "1.6"
  pci_dss_v4.0: "8.3.1"
  nist_800_53_r5: "IA-2(1)"
  fedramp_moderate: "IA-2(1)"
  gdpr: "Art.32"
  iso_27001_2022: "A.8.5"
  nist_csf_2.0: "PR.AA"
  ccm_v4: ["IAM-14"]
scope_tags:
  - aws
  - iam
taxonomy:
  - compute-hardening
  - credential-lifecycle
  - least-privilege
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_user
params:
  attack_stage: credential_access
remediation:
  description: >
    Privileged IAM user uses virtual MFA instead of hardware MFA.
    Virtual MFA is vulnerable to device compromise and SIM swap.
  action: >
    Replace virtual MFA with a hardware FIDO2 or TOTP device. Remove
    the existing virtual MFA device and enroll a hardware token via
    IAM > Users > Security credentials > MFA.
  example: |
    {
      "identity": {
        "kind": "user",
        "policies": {
          "has_admin_access": true
        },
        "mfa": {
          "hardware_mfa": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.policies.has_admin_access
      op: present
    - field: properties.identity.policies.has_admin_access
      op: eq
      value: true
    - field: properties.identity.mfa.hardware_mfa
      op: ne
      value: true
alternatives:
  - tool: prowler
    check_id: iam_administrator_access_with_mfa
    coverage: covered
    note: >-
      Stave requires hardware MFA on privileged accounts; Prowler requires any MFA.
      Stave is stricter on MFA factor.
  - tool: prowler
    check_id: iam_user_hardware_mfa_enabled
    coverage: partial
    note: >-
      Stave requires hardware MFA for privileged users; Prowler requires it for all
      users. Posture-policy difference.
