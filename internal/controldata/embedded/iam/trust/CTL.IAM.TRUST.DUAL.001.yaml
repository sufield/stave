dsl_version: ctrl.v1
id: CTL.IAM.TRUST.DUAL.001
name: IAM Role Trust Must Not Combine Compute and Identity Federation Without Scoping
description: >
  IAM roles must not simultaneously trust a compute service principal
  (lambda.amazonaws.com, ec2.amazonaws.com, ecs-tasks.amazonaws.com,
  apigateway.amazonaws.com) AND an identity federation principal
  (cognito-identity.amazonaws.com, sts.amazonaws.com via SAML/OIDC,
  accounts.google.com) when the identity federation trust carries no
  condition restricting which identity pool, audience, or external ID
  can assume the role. The dual-trust pattern is the Capital One
  pre-condition: the role exists for a Lambda integration; a Cognito
  trust gets added later for a mobile app and the developer forgets to
  scope it to the specific identity pool. Any identity pool in the
  account — including pools that allow unauthenticated access — can
  obtain credentials for a role intended for a single backend service.
domain: identity
severity: high
scope: compound
corpus_reference: MITRE:T1199
compliance:
  owasp_nhi: "NHI6"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  nist_800_53_r5: "AC-3, AC-6"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.8.3"
  ccm_v4: ["IAM-02", "IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - trust-boundary
subtractive_category:
  - S03
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  attack_stage: privilege_escalation
  base_impact: 8
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.0
remediation:
  description: >
    The role's trust policy admits both a compute service and an
    identity federation service. The identity federation trust is not
    scoped to a specific identity pool, audience, or external ID, so
    any unauthenticated principal that can obtain Cognito credentials
    can assume the role.
  action: >
    Either (a) remove the identity federation principal from the trust
    policy if the role only needs the compute service, or (b) add a
    Condition that scopes the identity federation trust to the specific
    pool: for Cognito, "cognito-identity.amazonaws.com:aud" =
    "<region>:<pool-id>"; for SAML, "saml:aud" = "<application-id>";
    for OIDC, "oidc:aud" = "<client-id>". Wildcard audience values
    provide no protection.
  example: |
    {
      "identity": {
        "kind": "role",
        "trust_policy": {
          "has_dual_unscoped_trust": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: role
    - field: properties.identity.trust_policy.has_compute_trust
      op: present
    - field: properties.identity.trust_policy.has_compute_trust
      op: eq
      value: true
    - field: properties.identity.trust_policy.has_identity_federation_trust
      op: present
    - field: properties.identity.trust_policy.has_identity_federation_trust
      op: eq
      value: true
    - field: properties.identity.trust_policy.identity_federation_trust_unscoped
      op: present
    - field: properties.identity.trust_policy.identity_federation_trust_unscoped
      op: eq
      value: true
tests:
  - name: "dual-trust unscoped fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::123:role/dual-unscoped"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          trust_policy:
            trusted_services:
              - lambda.amazonaws.com
              - cognito-identity.amazonaws.com
            has_compute_trust: true
            has_identity_federation_trust: true
            identity_federation_trust_unscoped: true
  - name: "compute-only trust passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::123:role/compute-only"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          trust_policy:
            trusted_services:
              - lambda.amazonaws.com
            has_compute_trust: true
            has_identity_federation_trust: false
            identity_federation_trust_unscoped: false
  - name: "identity-trust scoped passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::123:role/identity-scoped"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          trust_policy:
            trusted_services:
              - lambda.amazonaws.com
              - cognito-identity.amazonaws.com
            has_compute_trust: true
            has_identity_federation_trust: true
            identity_federation_trust_unscoped: false
