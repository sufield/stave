dsl_version: ctrl.v1
id: CTL.IAM.TRUST.OIDC.003
name: OIDC Federation Role Must Have Scoped Permissions
description: >
  IAM roles assumed via OIDC federation (CI/CD pipelines) must have
  scoped permissions appropriate for their deployment task. A CI/CD
  role with AdministratorAccess or broad wildcard actions creates a
  supply chain blast radius — any compromise of the CI/CD pipeline
  grants full account access. The extractor checks if the role's
  effective permissions exceed a deployment-appropriate scope.
domain: identity
severity: high
compliance:
  soc2: "CC6.1"
  nist_800_53_r5: "AC-6(5)"
  ccm_v4: ["DCS-07", "IAM-16"]
scope_tags:
  - aws
  - iam
  - supply-chain
type: unsafe_state
params:
  base_impact: 8
  attack_stage: persistence
remediation:
  description: >
    OIDC-trusted CI/CD role has overly broad permissions. Pipeline
    compromise grants excessive access.
  action: >
    Scope the role's permissions to the minimum required for the
    deployment task. Replace AdministratorAccess with task-specific
    policies (e.g., s3:PutObject on the deployment bucket,
    ecs:UpdateService on the target cluster).
  example: |
    {
      "identity": {
        "kind": "role",
        "trust": {
          "oidc": {
            "has_oidc_trust": true,
            "has_admin_permissions": false
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.trust.oidc.has_oidc_trust
      op: eq
      value: true
    - field: properties.identity.trust.oidc.has_admin_permissions
      op: eq
      value: true
