dsl_version: ctrl.v1
id: CTL.IAM.TRUST.SOURCEARN.001
name: AWS Service Principal Trust Must Have SourceArn or SourceAccount Condition
description: >
  IAM roles trusted by AWS service principals (*.amazonaws.com) must include
  aws:SourceArn or aws:SourceAccount conditions. Without these conditions,
  the service can assume the role when acting on behalf of any resource in
  any account — including attacker-controlled resources. AWS Lambda execution
  roles without aws:SourceArn allow any Lambda function in any account to
  assume the role. SNS/S3 notification roles without SourceArn allow any
  bucket or topic in any account to trigger the role assumption.
domain: identity
severity: high
compliance:
  nist_800_53_r5: "AC-3, AC-6"
  fedramp_moderate: "AC-3"
  pci_dss_v4.0: "7.2.1"
  soc2: "CC6.1"
  ccm_v4: ["DCS-07", "IAM-16"]
scope_tags:
  - aws
  - iam
type: unsafe_state
params:
  base_impact: 8
  attack_stage: persistence
  blast_radius:
    type: prevention
    scope: account
    multiplier: 1.5
remediation:
  description: >
    An IAM role trusts an AWS service principal without SourceArn or
    SourceAccount conditions. Any resource in the trusted AWS service —
    including resources in other accounts — can assume this role.
  action: >
    Add aws:SourceArn scoped to the specific resource ARN that should
    trigger the role assumption. If the resource ARN is not known at
    deploy time, add aws:SourceAccount scoped to your account ID.
  example: |
    {
      "identity": {
        "kind": "role",
        "trust_policy": {
          "has_aws_service_principal": true,
          "source_arn_protected": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.trust_policy.has_aws_service_principal
      op: eq
      value: true
    - field: properties.identity.trust_policy.source_arn_protected
      op: eq
      value: false
