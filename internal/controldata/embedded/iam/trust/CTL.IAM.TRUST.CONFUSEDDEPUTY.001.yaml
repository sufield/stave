dsl_version: ctrl.v1
id: CTL.IAM.TRUST.CONFUSEDDEPUTY.001
name: Account-Root Third-Party Trust Must Have Confused Deputy Protection
description: >
  IAM roles trusting a third-party account root principal
  (arn:aws:iam::X:root from outside the organization) without
  sts:ExternalId or aws:SourceAccount conditions are maximally
  exposed to the confused deputy problem. Any customer of the same
  third-party vendor can assume your role through the vendor's IAM
  system — because the trust grants access to ALL principals in the
  account, not just one specific role. The Microsoft Midnight
  Blizzard 2024 breach exploited a legacy cross-tenant trust without
  per-customer binding to pivot from a test tenant to production
  Exchange mailboxes. Account-root trust is critical because the
  blast radius is the entire third-party account's principal
  population.
domain: identity
severity: critical
scope: compound
corpus_reference: MITRE:T1199
compliance:
  owasp_nhi: "NHI4"
  hipaa: "164.312(a)(1)"
  nist_800_53_r5: "AC-3, AC-6"
  fedramp_moderate: "AC-3"
  pci_dss_v4.0: "7.2.1"
  soc2: "CC6.1, CC9.2"
  iso_27001_2022: "A.8.3"
  ccm_v4: ["DCS-07", "IAM-16"]
scope_tags:
  - aws
  - iam
taxonomy:
  - compliance-mapping
  - confused-deputy
  - trust-boundary
type: unsafe_state
classification: state_assertion
params:
  base_impact: 10
  attack_stage: persistence
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.0
remediation:
  description: >
    An IAM role trusts a third-party account root principal without
    confused deputy protection. Any customer of the third-party vendor
    can assume this role through the vendor's IAM system.
  action: >
    Add an sts:ExternalId condition with a unique per-relationship value to
    the role trust policy. Alternatively, add aws:SourceAccount scoped to the
    specific account that should be permitted. Do not use wildcard values —
    ExternalId set to * provides no protection.
  example: |
    {
      "identity": {
        "kind": "role",
        "trust_policy": {
          "has_third_party_principal": true,
          "principal_is_account_root": true,
          "confused_deputy_protected": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.trust_policy.has_third_party_principal
      op: present
    - field: properties.identity.trust_policy.has_third_party_principal
      op: eq
      value: true
    - field: properties.identity.trust_policy.confused_deputy_protected
      op: ne
      value: true
    - field: properties.identity.trust_policy.principal_is_account_root
      op: present
    - field: properties.identity.trust_policy.principal_is_account_root
      op: eq
      value: true
alternatives:
  - tool: prowler
    check_id: iam_role_cross_service_confused_deputy_prevention
    coverage: covered
    note: >-
      Stave splits third-party trust (needs ExternalId) from AWS-service-principal
      trust (needs SourceArn/SourceAccount); union covers Prowler.
