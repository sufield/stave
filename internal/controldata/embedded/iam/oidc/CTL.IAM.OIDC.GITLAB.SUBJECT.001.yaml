dsl_version: ctrl.v1
id: CTL.IAM.OIDC.GITLAB.SUBJECT.001
name: GitLab OIDC Roles Must Restrict Subject Claim
description: >
  IAM roles trusting GitLab OIDC must restrict the sub claim to
  specific projects and branches. Without a subject restriction,
  ANY GitLab project — including attacker-controlled — can assume
  the role. The AWS Console creates this misconfiguration by
  default. The trust policy says "I trust GitLab" when it should
  say "I trust myorg/myproject on the main branch."
  Technique: hackingthe.cloud exploiting misconfigured GitLab
  OIDC AWS IAM roles.
domain: identity
severity: critical
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["IAM-09", "IVS-03"]
scope_tags:
  - aws
  - iam
taxonomy:
  - trust-boundary
  - identity-perimeter
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  attack_stage: initial_access
observation_fields:
  - identity.kind
  - identity.trust.allows_gitlab_oidc
  - identity.trust.gitlab_oidc_subject_restricted
remediation:
  description: >
    IAM role trusts GitLab OIDC but does not restrict the sub
    claim. Any GitLab project can assume this role.
  action: >
    Add a StringLike condition on gitlab.com:sub in the trust
    policy restricting to specific project paths and ref types.
    Example: "project_path:myorg/myproject:ref_type:branch:ref:main"
  example: |
    {
      "identity": {
        "kind": "role",
        "trust": {
          "allows_gitlab_oidc": true,
          "gitlab_oidc_subject_restricted": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: role
    - field: properties.identity.trust.allows_gitlab_oidc
      op: eq
      value: true
    - field: properties.identity.trust.gitlab_oidc_subject_restricted
      op: ne
      value: true
tests:
  - name: "gitlab oidc without subject restriction fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::123456789012:role/gitlab-deploy"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          trust:
            allows_gitlab_oidc: true
            gitlab_oidc_subject_restricted: false
  - name: "gitlab oidc with subject restriction passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::123456789012:role/gitlab-deploy"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          trust:
            allows_gitlab_oidc: true
            gitlab_oidc_subject_restricted: true
  - name: "non-gitlab role passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::123456789012:role/service-role"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          trust:
            allows_gitlab_oidc: false
            gitlab_oidc_subject_restricted: false
