dsl_version: ctrl.v1
id: CTL.IAM.ESCALATE.COGNITO.UPDATEATTR.001
name: Principal Can Set Any User Attribute via Unscoped AdminUpdateUserAttributes
description: >
  A principal can call cognito-idp:AdminUpdateUserAttributes without an
  attribute-scoping Condition. The permission is legitimate for SCIM / JIT
  provisioning — but unconstrained, it can set ANY attribute on ANY user in the
  pool, including security-sensitive ones (custom:role, custom:isAdmin,
  custom:tenantID). A SCIM handler (or any holder of this permission) thus
  escalates: write custom:role=admin on a user and application-side authorization
  treats them as admin. The fix is an IAM Condition restricting which attributes
  may be updated (cognito-idp:AllowedAttributesForUpdate); with that condition
  present, the permission is safe and this control does not fire.

  Generic least-privilege controls (CTL.LAMBDA.ROLE.LEASTPRIV.001,
  CTL.IAM.POLICY.SERVICEWILDCARD.001) do not catch this — AdminUpdateUserAttributes
  is a normal provisioning action, not a wildcard or admin grant. The collector
  resolves the permission across inline + attached managed policies (e.g.
  AmazonCognitoPowerUser grants cognito-idp:* with no condition) and matches not
  just the exact action and cognito-idp:* but any partial wildcard whose glob
  covers it (cognito-idp:Admin*, cognito-idp:AdminUpdate*) — FN traps. It sets the
  .present boolean when the action is reachable AND no attribute-scoping condition
  SAFELY constrains it: an AllowedAttributesForUpdate condition counts as safe
  only when its allowed set contains no sensitive attribute — a condition that
  allows custom:role does not make it safe.

  Infrastructure control inspired by Doyensec "SCIM Hunting — Beyond SSO".
domain: identity
severity: high
scope: compound
corpus_reference: MITRE:T1098
compliance:
  owasp_nhi: "NHI5"
  soc2: "CC6.1"
  nist_800_53_r5: "AC-6, AC-16"
  pci_dss_v4.0: "7.2.1"
  ccm_v4: ["IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
  - cognito
type: unsafe_state
classification: state_assertion
params:
  attack_stage: privilege_escalation
observation_fields:
  - identity.kind
  - identity.escalation.cognito_updateattr_unscoped.present
remediation:
  description: >
    Principal can set arbitrary user attributes because
    cognito-idp:AdminUpdateUserAttributes is granted without an attribute-scoping
    condition.
  action: >
    Add an IAM Condition restricting the updatable attributes
    (cognito-idp:AllowedAttributesForUpdate) to the non-sensitive set the
    integration needs, or remove AdminUpdateUserAttributes if provisioning does
    not require attribute writes. Inspect attached managed policies
    (AmazonCognitoPowerUser grants cognito-idp:* unconstrained).
  example: |
    {
      "identity": {
        "kind": "role",
        "escalation": {
          "cognito_updateattr_unscoped": {
            "present": false
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.escalation.cognito_updateattr_unscoped.present
      op: eq
      value: true
tests:
  - name: role with unscoped AdminUpdateUserAttributes fires (vulnerable)
    verdict: VIOLATION
    asset:
      asset_id: arn:aws:iam::111122223333:role/scim-handler-role
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          escalation:
            cognito_updateattr_unscoped:
              present: true
  - name: role with AdminUpdateUserAttributes + attribute-scoping condition passes (false-positive trap)
    verdict: PASS
    asset:
      asset_id: arn:aws:iam::111122223333:role/scim-handler-scoped
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          escalation:
            cognito_updateattr_unscoped:
              present: false
  - name: role with cognito-idp via AmazonCognitoPowerUser managed policy fires (false-negative trap — managed policy resolution)
    verdict: VIOLATION
    asset:
      asset_id: arn:aws:iam::111122223333:role/scim-handler-pow.user
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          escalation:
            cognito_updateattr_unscoped:
              present: true
