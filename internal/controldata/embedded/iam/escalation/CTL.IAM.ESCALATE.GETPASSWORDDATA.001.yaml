dsl_version: ctrl.v1
id: CTL.IAM.ESCALATE.GETPASSWORDDATA.001
name: Principal Must Not Escalate via EC2 GetPasswordData
description: >
  Principals with ec2:GetPasswordData can retrieve the administrator
  password for any Windows EC2 instance. The password is encrypted with
  the key pair specified at launch. If the attacker also has access to
  the key pair or the key pair is widely shared, they gain RDP
  administrator access to the instance and inherit its network position
  and IAM role.
domain: identity
severity: high
scope: compound
corpus_reference: MITRE:T1098
compliance:
  owasp_nhi: "NHI5"
  soc2: "CC6.1"
  nist_800_53_r5: "AC-6(5)"
  ccm_v4: ["IAM-05"]
scope_tags:
  - aws
  - iam
  - ec2
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - network-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  attack_stage: credential_access
  base_impact: 9
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.0
observation_fields:
  - identity.kind
  - identity.escalation.ec2_getpassworddata.present
remediation:
  description: >
    Principal can retrieve Windows administrator passwords for EC2
    instances.
  action: >
    Remove ec2:GetPasswordData or scope it to specific instance ARNs.
    GetPasswordData retrieves the administrator password for Windows
    instances encrypted with the launch key pair.
  example: |
    {
      "identity": {
        "kind": "user",
        "escalation": {
          "ec2_getpassworddata": {
            "present": false
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.escalation.ec2_getpassworddata.present
      op: present
    - field: properties.identity.escalation.ec2_getpassworddata.present
      op: eq
      value: true
tests:
  - name: user with EC2 GetPasswordData escalation path fires
    verdict: VIOLATION
    asset:
      asset_id: arn:aws:iam::111122223333:user/mallory
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: user
          escalation:
            ec2_getpassworddata:
              present: true
  - name: user without escalation path passes
    verdict: PASS
    asset:
      asset_id: arn:aws:iam::111122223333:user/bob
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: user
          escalation:
            ec2_getpassworddata:
              present: false
alternatives:
  - tool: prowler
    check_id: iam_inline_policy_allows_privilege_escalation
    coverage: covered
    note: One of 42 per-technique controls covering the aggregated Prowler check.
  - tool: prowler
    check_id: iam_policy_allows_privilege_escalation
    coverage: covered
    note: One of 42 per-technique controls covering the aggregated Prowler check.
