dsl_version: ctrl.v1
id: CTL.IAM.MANAGED.ACCOUNTMGMT.BOUNDARY.001
name: Roles Created Via Account Management Must Have Permission Boundaries
description: >
  Roles created through account management workflows (using
  AWSManagedAccountManagementAccess or equivalent) must have a
  permission boundary attached. The account management policy
  grants both iam:CreateRole and iam:PutRolePermissionsBoundary.
  If the workflow creates roles without boundaries, those roles
  have no upper bound on their effective permissions — the
  management policy becomes an unrestricted role factory. The
  boundary is the only mechanism that constrains what the created
  roles can do.
domain: identity
severity: high
compliance:
  nist_800_53_r5: "AC-6(5)"
  soc2: "CC6.3"
  pci_dss_v4.0: "7.2.2"
  ccm_v4: ["IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
taxonomy:
  - least-privilege
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_iam_role]
params:
  attack_stage: privilege_escalation
observation_fields:
  - identity.kind
  - identity.role.created_via_account_management
  - identity.role.has_boundary
remediation:
  description: >
    Role created via account management workflow does not have a
    permission boundary. The role has no upper bound on effective
    permissions.
  action: >
    Attach a permission boundary to the role that limits its
    effective permissions to the intended scope. Modify the
    account management workflow to require
    iam:PermissionsBoundary as a condition on iam:CreateRole
    calls.
  example: |
    {
      "identity": {
        "kind": "role",
        "role": {
          "created_via_account_management": true,
          "has_boundary": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: role
    - field: properties.identity.role.created_via_account_management
      op: eq
      value: true
    - field: properties.identity.role.has_boundary
      op: ne
      value: true
tests:
  - name: "account-management-created role without boundary fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::444455556666:role/CreatedByAccountMgmt"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          role:
            created_via_account_management: true
            has_boundary: false
  - name: "account-management-created role with boundary passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::444455556666:role/BoundedRole"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          role:
            created_via_account_management: true
            has_boundary: true
  - name: "non-account-management role without boundary passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::444455556666:role/RegularRole"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          role:
            created_via_account_management: false
            has_boundary: false
