dsl_version: ctrl.v1
id: CTL.IAM.ESCALATE.ATTACHUSERPOLICY.001
name: Principal Must Not Escalate via iam:AttachUserPolicy On Self
description: >
  A principal with `iam:AttachUserPolicy` whose Resource field includes
  its own user ARN can attach any managed policy — including
  `arn:aws:iam::aws:policy/AdministratorAccess` — to itself and become
  admin with a single API call. This is Rhino Security Labs
  privilege-escalation technique #1 ("IAM — Attach to user") and is
  covered by Prowler's iam_policy_allows_privilege_escalation and
  Pacu's iam__privesc_scan. No other permission is required;
  self-scoped AttachUserPolicy is a one-step path to full admin.

  Scope: gated on `identity.kind == "user"`. The `iam:AttachUserPolicy`
  AWS action targets users specifically — roles cannot be the self-
  target. The role-side analogue is `iam:AttachRolePolicy` on self,
  a separate technique covered by its own
  `CTL.IAM.ESCALATE.ATTACHROLEPOLICY.001` control.
domain: identity
severity: critical
scope: compound
corpus_reference: MITRE:T1098.003
compliance:
  owasp_nhi: "NHI5"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  nist_800_53_r5: "AC-6(5)"
  fedramp_moderate: "AC-6(5)"
  iso_27001_2022: "A.8.3"
  ccm_v4: ["IAM-02", "IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_user
params:
  attack_stage: privilege_escalation
  base_impact: 10
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.5
observation_fields:
  - identity.kind
  - identity.escalation.attach_user_policy_self.present
  - identity.escalation.attach_user_policy_self.target_user_arn
  - identity.escalation.attach_user_policy_self.resource_scope
  - identity.escalation.attach_user_policy_self.reachable_managed_policies
remediation:
  description: >
    Principal has `iam:AttachUserPolicy` scoped to its own user ARN
    (either explicitly by ARN, by `"*"`, or by a user-set that includes
    it). It can attach any managed policy to itself, including
    `AdministratorAccess`, and become admin without any further
    vulnerability.
  action: >
    Remove `iam:AttachUserPolicy` from the principal, or scope its
    Resource field to user ARNs that do not include the principal
    itself (admin-only bootstrap roles, for example). Enforce at the
    organization level with an SCP that denies `iam:AttachUserPolicy`
    on `${aws:PrincipalArn}`. Also consider a permissions boundary on
    the principal that prevents the attached policy from taking effect.
  example: |
    {
      "identity": {
        "kind": "user",
        "escalation": {
          "attach_user_policy_self": {
            "present": false
          }
        }
      }
    }
mitre_attack:
  - id: T1098.003
    name: "Account Manipulation: Additional Cloud Roles"
    tactic: privilege-escalation
validated_against:
  - vendor: bishopfox
    lab: privesc7-AttachUserPolicy
    result: detected
    verified: "2026-05-30"
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: user
    - field: properties.identity.escalation.attach_user_policy_self.present
      op: eq
      value: true
alternatives:
  - tool: prowler
    check_id: iam_inline_policy_allows_privilege_escalation
    coverage: covered
    note: One of 24 per-technique controls covering the aggregated Prowler check.
  - tool: prowler
    check_id: iam_policy_allows_privilege_escalation
    coverage: covered
