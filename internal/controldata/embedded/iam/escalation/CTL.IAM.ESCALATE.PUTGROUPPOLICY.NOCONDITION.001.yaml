dsl_version: ctrl.v1
id: CTL.IAM.ESCALATE.PUTGROUPPOLICY.NOCONDITION.001
name: Principal Has iam:PutGroupPolicy With Resource Covering Belonging Group
description: >
  A principal has `iam:PutGroupPolicy` and the Resource field covers a
  group the principal belongs to. Unlike `iam:AttachGroupPolicy` which
  can be condition-restricted via `iam:PolicyARN`, there is no IAM
  Condition key that restricts the *content* of an inline policy written
  via PutGroupPolicy. Every PutGroupPolicy grant is inherently
  unrestricted in what policy document the caller can write — the only
  available defense is restricting the Resource field to groups the
  principal does not belong to. When the Resource covers a belonging
  group, the principal can author an arbitrary inline policy document
  (including `"Action": "*"` on `"Resource": "*"`) and inject it onto
  that group, elevating every member — including the principal — with a
  single API call. This combines the worst properties of PutUserPolicy
  (attacker-authored payload) and AttachGroupPolicy (group-wide blast
  radius).

  Scope: gated on `identity.kind == "user"`. Fires when the principal
  has `iam:PutGroupPolicy` and the Resource scope includes a group the
  principal belongs to. The capability-only variant is detected by
  `CTL.IAM.ESCALATE.PUTGROUPPOLICY.001`.
domain: identity
severity: critical
scope: compound
corpus_reference: MITRE:T1098.003
