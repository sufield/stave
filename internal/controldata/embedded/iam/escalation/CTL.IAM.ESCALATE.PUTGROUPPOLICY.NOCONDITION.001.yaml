  - S10
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_user
params:
  attack_stage: privilege_escalation
  base_impact: 10
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.5
observation_fields:
  - identity.kind
  - identity.escalation.put_group_policy.present
  - identity.escalation.put_group_policy.resource_scope
remediation:
  description: >
    Principal has `iam:PutGroupPolicy` with Resource covering a group
    the principal belongs to. Authoring an inline policy granting
    `"Action": "*"` on `"Resource": "*"` on that group elevates every
    member to admin, including the principal.
  action: >
    Scope `iam:PutGroupPolicy` Resource to groups the principal does
    not belong to, or remove the permission entirely. SCP-level deny
    on `iam:PutGroupPolicy` where the target group contains the
    calling principal closes the path.
  example: |
    {
      "identity": {
        "kind": "user",
        "escalation": {
          "put_group_policy": {
            "present": true,
            "resource_scope": "non_belonging"
          }
        }
      }
    }
mitre_attack:
