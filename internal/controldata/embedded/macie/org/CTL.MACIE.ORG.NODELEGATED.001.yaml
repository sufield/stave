dsl_version: ctrl.v1
id: CTL.MACIE.ORG.NODELEGATED.001
name: Macie Has No Delegated Administrator
description: >
  Amazon Macie has no delegated administrator registered. Macie
  administration runs from the management account, concentrating
  data classification operations in the highest-trust account
  boundary. A dedicated security account should manage Macie
  across the organization.
domain: governance
severity: medium
compliance:
  nist_800_53_r5: "AC-6(5)"
  soc2: "CC6.1"
  ccm_v4: ["IAM-09"]
  scs_c02: "8.10"
scope_tags:
  - aws
  - macie
taxonomy:
  - account-governance
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_macie2_account]
params:
  attack_stage: privilege_escalation
  blast_radius:
    type: governance
    scope: organization
    multiplier: 2.0
remediation:
  description: >
    No delegated administrator for Macie. Management account handles
    all data classification operations.
  action: >
    Register a delegated admin: aws macie2
    enable-organization-admin-account --admin-account-id
    <security-acct>.
  example: |
    {
      "governance": {
        "kind": "macie_organization",
        "macie": {
          "delegated_admin_configured": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: macie_organization
    - field: properties.governance.macie.delegated_admin_configured
      op: eq
      value: false
tests:
  - name: "Macie org without delegated admin fails"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:organizations::111122223333:organization/o-abc"
      asset_type: aws_macie_organization
      vendor: aws
      properties:
        governance:
          kind: macie_organization
          macie:
            delegated_admin_configured: false
  - name: "Macie org with delegated admin passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:organizations::111122223333:organization/o-abc"
      asset_type: aws_macie_organization
      vendor: aws
      properties:
        governance:
          kind: macie_organization
          macie:
            delegated_admin_configured: true
