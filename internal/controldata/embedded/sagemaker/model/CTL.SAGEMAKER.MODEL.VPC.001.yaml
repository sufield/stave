dsl_version: ctrl.v1
id: CTL.SAGEMAKER.MODEL.VPC.001
name: SageMaker Models Must Use VPC Configuration
description: >
  SageMaker models must define VpcConfig with subnets and security
  groups so inference containers communicate through a VPC rather
  than the public internet.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "SC-7"
  soc2: "CC6.6"
  ccm_v4: ["IVS-03"]
scope_tags:
  - aws
  - sagemaker
type: unsafe_state
classification: state_assertion
params:
  attack_stage: exfiltration
remediation:
  description: SageMaker model is not configured with VPC settings.
  action: Define VpcConfig with subnets and security groups.
  example: |
    {
      "compute": {
        "kind": "sagemaker_model",
        "network": { "in_vpc": true }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: sagemaker_model
    - field: properties.compute.network.in_vpc
      op: eq
      value: false
