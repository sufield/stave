dsl_version: ctrl.v1
id: CTL.SAGEMAKER.ENDPOINT.DATACAPTURE.001
name: SageMaker Endpoint Must Have Data Capture Enabled
description: >
  SageMaker endpoint configuration does not have data capture
  enabled. Data capture records inference requests and responses
  to S3, providing the audit trail for model behavior analysis,
  drift detection, and incident investigation. Without data
  capture, there is no record of what the model received or
  returned — making it impossible to detect adversarial inputs,
  investigate model misbehavior, or demonstrate compliance with
  data processing requirements.
domain: governance
severity: medium
compliance:
  nist_800_53_r5: "AU-2, AU-3"
  soc2: "CC7.2"
  ccm_v4: ["LOG-01", "LOG-03"]
scope_tags:
  - aws
  - sagemaker
  - ai
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_sagemaker_endpoint
params:
  attack_stage: detection_evasion
remediation:
  description: SageMaker endpoint has no data capture configuration.
  action: >
    Add a DataCaptureConfig to the endpoint configuration with
    EnableCapture set to true. Configure the destination S3 URI
    and specify which data to capture (Input, Output, or both).
  example: |
    {
      "compute": {
        "kind": "sagemaker_endpoint_config",
        "governance": { "data_capture_enabled": true }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: sagemaker_endpoint_config
    - field: properties.compute.governance.data_capture_enabled
      op: eq
      value: false
