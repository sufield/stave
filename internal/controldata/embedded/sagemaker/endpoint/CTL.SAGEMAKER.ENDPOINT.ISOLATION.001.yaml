dsl_version: ctrl.v1
id: CTL.SAGEMAKER.ENDPOINT.ISOLATION.001
name: SageMaker Endpoint Configuration Must Enable Network Isolation
description: >
  SageMaker endpoint configuration must enable network isolation to
  prevent model containers from making outbound network calls during
  inference. Without isolation, a compromised or malicious model
  container can exfiltrate inference data, cached training data, or
  model weights to external endpoints. Network isolation at the
  endpoint level is independent of VPC placement — an endpoint can
  be in a VPC but still allow outbound calls if isolation is not
  enabled.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SC-7"
  soc2: "CC6.6"
  ccm_v4: ["IVS-03", "IVS-04"]
scope_tags:
  - aws
  - sagemaker
  - ai
type: unsafe_state
classification: state_assertion
params:
  attack_stage: exfiltration
remediation:
  description: SageMaker endpoint configuration has network isolation disabled.
  action: >
    Set EnableNetworkIsolation to true on the endpoint configuration.
    This prevents all outbound network access from model containers.
  example: |
    {
      "compute": {
        "kind": "sagemaker_endpoint_config",
        "network": { "network_isolation_enabled": true }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: sagemaker_endpoint_config
    - field: properties.compute.network.network_isolation_enabled
      op: eq
      value: false
