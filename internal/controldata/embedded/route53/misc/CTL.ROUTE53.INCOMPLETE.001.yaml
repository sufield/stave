dsl_version: ctrl.v1
id: CTL.ROUTE53.INCOMPLETE.001
name: Complete Data Required for Route 53 Assessment
description: >
  The observation snapshot is missing required Route 53 properties.
domain: exposure
severity: info
compliance:
  ccm_v4: ["DCS-06"]
scope_tags:
  - aws
  - route53
taxonomy:
  - compliance-mapping
subtractive_category:
  - S08
applicable_asset_types:
  - aws_route53_hosted_zone
type: unsafe_state
classification: absence_check
params: {}
remediation:
  description: >
    Observation is missing Route 53 properties.
  action: >
    Ensure the extractor calls aws route53 list-hosted-zones and list-health-checks.
  example: |
    {
      "dns_service": {
        "kind": "hosted_zone",
        "health_checks_configured": true
      }
    }
unsafe_predicate:
  all:
    - field: properties.dns_service.health_checks_configured
      op: missing
      value: true
