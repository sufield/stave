dsl_version: ctrl.v1
id: CTL.ROUTE53.HEALTHCHECK.001
name: Route 53 Health Checks Must Be Configured
description: >
  Route 53 health checks must be configured for DNS records pointing to critical endpoints. Without health checks, DNS routes to failed endpoints.
domain: exposure
severity: medium
compliance:
  soc2: "A1.1"
scope_tags:
  - aws
  - route53
type: unsafe_state
params: {}
remediation:
  description: >
    Route 53 hosted zone has no health checks configured.
  action: >
    Create health checks: aws route53 create-health-check and associate with failover routing.
  example: |
    {
      {
      "dns_service": {
        "kind": "hosted_zone",
        "health_checks_configured": true
      }
    }
    }
unsafe_predicate:
  all:
    - field: properties.dns_service.health_checks_configured
      op: eq
      value: false
