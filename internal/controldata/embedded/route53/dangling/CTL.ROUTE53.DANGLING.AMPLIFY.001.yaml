dsl_version: ctrl.v1
id: CTL.ROUTE53.DANGLING.AMPLIFY.001
name: DNS Record Points to Deleted AWS Amplify App
description: >
  Route 53 CNAME record points to a deleted AWS Amplify app. Amplify
  custom domains are associated via CNAME; when the Amplify app is
  deleted, the custom domain association is removed but the CNAME
  record may remain. An attacker who creates a new Amplify app and
  configures the same custom domain can serve content on the
  organization's subdomain. Amplify apps validate domain ownership
  via DNS — the existing CNAME record serves as proof of ownership.
domain: exposure
severity: high
archetype: ghost-reference
scope: compound
compliance:
  nist_800_53_r5: "CM-3"
  pci_dss_v4.0: "6.5.6"
  soc2: "CC7.1"
  ccm_v4: ["CCC-03", "IVS-03"]
scope_tags:
  - aws
  - route53
taxonomy:
  - compliance-mapping
  - trust-boundary
  - trust-decay
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_route53_hosted_zone]
params:
  attack_stage: initial_access
remediation:
  description: >
    DNS CNAME record points to a deleted AWS Amplify app. The custom
    domain is reclaimable by an attacker who creates a new Amplify app.
  action: >
    Delete the CNAME record pointing to the decommissioned Amplify
    app, or re-create the Amplify app and reclaim the custom domain
    defensively.
  example: |
    {
      "network": {
        "kind": "route53_record",
        "dns": {
          "record_name": "app.example.com",
          "target_type": "amplify",
          "has_dangling_amplify_target": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: route53_record
    - field: properties.network.dns.has_dangling_amplify_target
      op: eq
      value: true
