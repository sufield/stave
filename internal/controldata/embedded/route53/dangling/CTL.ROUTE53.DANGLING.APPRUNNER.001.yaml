dsl_version: ctrl.v1
id: CTL.ROUTE53.DANGLING.APPRUNNER.001
name: DNS Record Points to Deleted AWS App Runner Service
description: >
  Route 53 CNAME record points to a deleted AWS App Runner service.
  App Runner services accept custom domain configuration via CNAME
  validation. When the service is deleted, the custom domain binding
  is removed but the CNAME record in Route 53 may remain. An attacker
  who creates a new App Runner service and associates the same custom
  domain can serve content on the organization's subdomain.
domain: exposure
severity: high
archetype: ghost-reference
scope: compound
compliance:
  nist_800_53_r5: "CM-3"
  pci_dss_v4.0: "6.5.6"
  soc2: "CC7.1"
  ccm_v4: ["CCC-03", "IVS-03"]
scope_tags:
  - aws
  - route53
taxonomy:
  - compliance-mapping
  - trust-boundary
  - trust-decay
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_route53_hosted_zone]
params:
  attack_stage: initial_access
remediation:
  description: >
    DNS CNAME record points to a deleted AWS App Runner service. The
    custom domain is reclaimable by an attacker who creates a new service.
  action: >
    Delete the CNAME record pointing to the decommissioned App Runner
    service, or create a new App Runner service and reclaim the custom
    domain defensively.
  example: |
    {
      "network": {
        "kind": "route53_record",
        "dns": {
          "record_name": "api.example.com",
          "target_type": "apprunner",
          "has_dangling_apprunner_target": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: route53_record
    - field: properties.network.dns.has_dangling_apprunner_target
      op: eq
      value: true
