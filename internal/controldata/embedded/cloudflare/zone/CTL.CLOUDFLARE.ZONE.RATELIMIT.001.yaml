dsl_version: ctrl.v1
id: CTL.CLOUDFLARE.ZONE.RATELIMIT.001
name: Rate Limiting Not Configured
description: >
  No rate limiting rules. Brute force, credential stuffing, and
  API abuse operate without throttling.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SC-5"
  pci_dss_v4: "6.5"
  soc2: "CC6.6"
scope_tags: [cloudflare]
taxonomy:
  - compliance-mapping
  - credential-lifecycle
subtractive_category:
  - S03
type: unsafe_state
classification: state_assertion
applicable_asset_types: [cloudflare_zone]
params:
  attack_stage: initial_access
remediation:
  description: Rate Limiting Not Configured — finding detected.
  action: Remediate per control description.
  example: |
    {"cloudflare": {"zone": {"kind": "zone_config", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.cloudflare.zone.kind
      op: eq
      value: zone_config
    - field: properties.cloudflare.zone.rate_limiting_enabled
      op: eq
      value: false
