dsl_version: ctrl.v1
id: CTL.CLOUDFLARE.ZONE.ALWAYSONLINE.001
name: Always Online Mode Enabled
description: >
  Always Online serves stale cached pages when origin is down.
  May serve outdated security content.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "CM-6"
  soc2: "CC6.1"
scope_tags: [cloudflare]
taxonomy:
  - compliance-mapping
  - trust-decay
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Always Online Mode Enabled — finding detected.
  action: Remediate per control description.
  example: |
    {"cloudflare": {"zone": {"kind": "zone_config", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.cloudflare.zone.kind
      op: eq
      value: zone_config
    - field: properties.cloudflare.zone.always_online
      op: eq
      value: true
