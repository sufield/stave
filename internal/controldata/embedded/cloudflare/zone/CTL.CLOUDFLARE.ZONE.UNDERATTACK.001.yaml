dsl_version: ctrl.v1
id: CTL.CLOUDFLARE.ZONE.UNDERATTACK.001
name: Under Attack Mode Permanently Enabled
description: >
  Under Attack mode permanently enabled without active DDoS.
  Degrades user experience and interferes with legitimate automation.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "CM-6"
  soc2: "CC6.1"
scope_tags: [cloudflare]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Under Attack Mode Permanently Enabled — finding detected.
  action: Remediate per control description.
  example: |
    {"cloudflare": {"zone": {"kind": "zone_config", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.cloudflare.zone.kind
      op: eq
      value: zone_config
    - field: properties.cloudflare.zone.under_attack_mode
      op: eq
      value: true
