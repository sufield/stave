dsl_version: ctrl.v1
id: CTL.SECRETS.LIFECYCLE.DORMANT.001
name: Secret Not Accessed in 90+ Days
description: >
  Secret has not been accessed (GetSecretValue) in more than
  90 days. The credential exists, may still be valid at the
  target service (database password still works, API key
  still authenticates), and the secret policy still grants
  access — but nobody retrieves it. Dormant secrets are
  latent credential surfaces: the credential works but isn't
  used, the policy permits reading but nobody reads, and
  nobody monitors for anomalous access. Same 90-day dormancy
  threshold used across Lambda, IAM, DynamoDB, CloudFront,
  Route 53, KMS, SQS, and SNS controls — uniform across
  domains.
domain: governance
severity: medium
compliance:
  soc2: "CC6.1, CC8.1"
  nist_800_53_r5: "CM-2, CM-3, IA-5, SA-22"
  pci_dss_v4.0: "1.2, 8.2.4, 8.5"
  fedramp_moderate: "CM-2"
  hipaa: "164.312(a)(1)"
  iso_27001_2022: "A.5.16, A.8.32"
  ccm_v4: ["IAM-04", "IAM-08"]
scope_tags:
  - aws
  - secretsmanager
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
remediation:
  description: >
    Secret has been dormant for 90+ days while its policy
    continues to authorize GetSecretValue. The credential is
    a latent surface — readable by permitted principals
    without monitoring.
  action: >
    Audit the secret's CloudTrail history (GetSecretValue
    events) to confirm true dormancy. If the secret is truly
    unused, schedule it for deletion
    (aws secretsmanager delete-secret --secret-id <id>
    --recovery-window-in-days 30) so any unrecorded
    consumers fail loudly during the recovery window. If the
    secret is held for future use, restrict the policy to a
    minimal principal set, attach a CloudWatch alarm on
    GetSecretValue access, and document the planned
    reactivation date.
  example: |
    {
      "secret": {
        "kind": "secret",
        "lifecycle": {
          "is_dormant": false,
          "last_accessed_days": 7
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.lifecycle.is_dormant
      op: eq
      value: true
defect: >
  Secret has not been accessed in 90+ days while its policy
  continues to grant GetSecretValue.
infection: >
  A dormant secret retains its full configuration: the
  credential value (which may still authenticate at the
  target service), the resource policy (which grants
  GetSecretValue to permitted principals), and the KMS key
  (which allows decryption). Nobody accesses the secret
  because no application uses the credential — but the
  credential may still WORK at the target service. If an
  attacker discovers the secret ARN and has (or obtains)
  GetSecretValue permission, they retrieve a working
  credential that nobody monitors. The credential works.
  Nobody uses it legitimately. Nobody watches for
  illegitimate use.
failure: >
  Latent credential surface. A working credential that
  nobody uses but anybody with GetSecretValue permission can
  retrieve.
tests:
  - name: 120-day dormant secret fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:legacy/api-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          lifecycle:
            is_dormant: true
            last_accessed_days: 120
            policy_principal_count: 4
  - name: 5-day-active secret passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/api-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          lifecycle:
            is_dormant: false
            last_accessed_days: 5
  - name: 365-day dormant secret with cross-account policy fires (severe)
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:abandoned/db-master-XyZ"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          lifecycle:
            is_dormant: true
            last_accessed_days: 365
            policy_principal_count: 7
          policy:
            policy_cross_account: true
            cross_account_ids: ["444455556666"]
