dsl_version: ctrl.v1
id: CTL.SECRETS.LIFECYCLE.PREVIOUSOLD.001
name: Secret AWSPREVIOUS Version Older Than 180 Days
description: >
  Secret's AWSPREVIOUS version stage contains a credential
  value that is more than 180 days old. AWSPREVIOUS holds
  the previous credential after rotation — intended for
  rollback during the brief rotation window. A 180-day-old
  AWSPREVIOUS means: the previous credential has been
  accessible for 6 months, any principal with
  GetSecretValue and the version-stage parameter can
  retrieve the old credential, and the old credential may
  still work at the target service (not all target services
  invalidate old passwords after rotation).
domain: governance
severity: medium
compliance:
  soc2: "CC6.1, CC6.7"
  nist_800_53_r5: "IA-5, SC-12, AU-11"
  pci_dss_v4.0: "3.6, 8.2.4"
  fedramp_moderate: "IA-5"
  iso_27001_2022: "A.5.16, A.8.5"
  ccm_v4: ["IAM-04", "CEK-10"]
scope_tags:
  - aws
  - secretsmanager
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - trust-decay
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
remediation:
  description: >
    Secret's AWSPREVIOUS version is older than 180 days; an
    old credential remains retrievable.
  action: >
    Remove the AWSPREVIOUS stage by re-rotating the secret
    (which advances AWSCURRENT to a new version and
    AWSPREVIOUS to the just-superseded one) so the stale
    AWSPREVIOUS is replaced. If rotation isn't producing
    fresh AWSPREVIOUS values, investigate the rotation
    pipeline (see CTL.SECRETS.ROTATION.STALE.001 and
    CTL.SECRETS.GHOST.ROTATIONLAMBDA.001). Verify the target
    service has invalidated the old credential — for RDS,
    confirm the previous password has been revoked at the
    database; for API providers, confirm the old key has
    been revoked at their console.
  example: |
    {
      "secret": {
        "kind": "secret",
        "lifecycle": {
          "has_previous_version": true,
          "previous_version_age_days": 30,
          "previous_version_old": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.lifecycle.has_previous_version
      op: eq
      value: true
    - field: properties.secret.lifecycle.previous_version_old
      op: eq
      value: true
defect: >
  Secret's AWSPREVIOUS version is older than 180 days.
infection: >
  AWSPREVIOUS exists for rollback during the rotation
  window — typically the period of minutes to hours during
  which clients caching the old credential need a fallback.
  Six months in, AWSPREVIOUS no longer serves rollback; it
  is just an old credential sitting in the secret. Any
  principal with GetSecretValue and the AWSPREVIOUS version
  parameter can retrieve it. If the target service hasn't
  invalidated the old credential (some services keep old
  passwords valid for grace periods), the old credential
  may still authenticate. The risk grows the longer
  AWSPREVIOUS persists — older credentials are likelier to
  have leaked through forgotten code, log lines, or git
  history.
failure: >
  Old credential retained. AWSPREVIOUS exposes a
  six-month-old credential value that may still work at the
  target service.
tests:
  - name: 200-day-old AWSPREVIOUS fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/api-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          lifecycle:
            has_previous_version: true
            previous_version_age_days: 200
            previous_version_old: true
  - name: 30-day-old AWSPREVIOUS passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/api-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          lifecycle:
            has_previous_version: true
            previous_version_age_days: 30
            previous_version_old: false
  - name: year-old AWSPREVIOUS fires (severe)
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:legacy/db-master-XyZ"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          lifecycle:
            has_previous_version: true
            previous_version_age_days: 380
            previous_version_old: true
