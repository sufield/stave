dsl_version: ctrl.v1
id: CTL.SECRETS.LIFECYCLE.ORPHAN.DATABASE.001
name: Secret Exists for Decommissioned Database
description: >
  Secret contains credentials for a database (RDS, Aurora,
  Redshift, DocumentDB) that has been deleted. The database
  is gone; the credential authenticates to nothing. But the
  secret persists with its policy, encryption, and rotation
  configuration — credential infrastructure for
  infrastructure that no longer exists. If rotation is still
  configured, every rotation execution attempts to update a
  credential on a database that doesn't exist, failing
  silently and possibly compounding with
  CTL.SECRETS.GHOST.ROTATIONLAMBDA.001 patterns.
domain: governance
severity: high
compliance:
  soc2: "CC6.1, CC8.1"
  nist_800_53_r5: "CM-2, CM-3, SA-22"
  pci_dss_v4.0: "1.2, 8.5"
  fedramp_moderate: "CM-2"
  iso_27001_2022: "A.5.16, A.8.32"
  ccm_v4: ["IAM-04", "IAM-08"]
scope_tags:
  - aws
  - secretsmanager
taxonomy:
  - credential-lifecycle
  - key-management
  - trust-decay
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_secretsmanager_secret
params:
  attack_stage: credential_access
  blast_radius:
    type: detection
    scope: account
    multiplier: 2.0
remediation:
  description: >
    Secret stores credentials for a database that has been
    deleted. The credential is meaningless; the secret is
    orphan infrastructure.
  action: >
    Schedule the secret for deletion
    (aws secretsmanager delete-secret --secret-id <id>
    --recovery-window-in-days 30). Disable rotation first if
    rotation is still configured (the rotation Lambda will
    keep failing on every cycle until disabled). Audit the
    secret's principals — anyone who recently retrieved this
    credential is reading a value that authenticates to
    nothing, which is an integration bug worth surfacing.
  example: |
    {
      "secret": {
        "kind": "secret",
        "target": {
          "secret_type": "rds",
          "target_database_arn": "arn:aws:rds:us-east-1:111122223333:db:legacy-prod",
          "target_database_exists": true,
          "has_orphan_database": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.target.has_orphan_database
      op: eq
      value: true
defect: >
  Secret contains credentials for a database that no longer
  exists.
infection: >
  The secret stores a database password for a database that
  no longer exists. The credential is useless — it
  authenticates to nothing. But the secret persists: the
  resource policy grants GetSecretValue to principals (who
  can read a useless credential), the KMS key encrypts the
  secret (consuming key operations), rotation may still be
  configured (rotation Lambda attempts to rotate a credential
  for a non-existent database — rotation fails silently),
  and the secret consumes Secrets Manager cost. More
  importantly, the orphaned secret clutters the credential
  inventory — auditors must evaluate every secret, including
  dead ones, and the dead ones distract from real findings.
failure: >
  Orphaned credential infrastructure. Secret stores a
  credential for a deleted database; the policy, rotation,
  and KMS coupling persist without purpose.
tests:
  - name: secret with deleted RDS target fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:legacy/rds-master-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          target:
            secret_type: "rds"
            target_database_arn: "arn:aws:rds:us-east-1:111122223333:db:legacy-prod"
            target_database_exists: false
            has_orphan_database: true
  - name: secret with active RDS target passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/rds-master-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          target:
            secret_type: "rds"
            target_database_arn: "arn:aws:rds:us-east-1:111122223333:db:prod"
            target_database_exists: true
            has_orphan_database: false
  - name: orphan database with rotation still configured fires (compound)
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:legacy/redshift-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          target:
            secret_type: "redshift"
            target_database_arn: "arn:aws:redshift:us-east-1:111122223333:cluster:legacy-cluster"
            target_database_exists: false
            has_orphan_database: true
          rotation:
            rotation_enabled: true
            rotation_interval_days: 30
