dsl_version: ctrl.v1
id: CTL.SECRETS.GHOST.POLICY.PRINCIPAL.001
name: Secret Resource Policy References Deleted IAM Principal
description: >
  Secret resource policy grants access to an IAM principal
  (role or user ARN) that has been deleted. The policy
  statement persists. If the principal ARN is reclaimed
  (a new role is created with the same name), the secret
  policy unintentionally grants access to the new
  principal — the same ARN-reclamation hazard covered by
  CTL.SQS.GHOST.POLICY.PRINCIPAL.001 and similar SNS/IAM
  ghost-policy controls.
domain: governance
severity: medium
archetype: ghost-reference
scope: compound
compliance:
  soc2: "CC6.1, CC6.7"
  nist_800_53_r5: "AC-3, CM-2, CM-3"
  pci_dss_v4.0: "7.1, 7.2"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.5.15, A.8.3"
  ccm_v4: ["IAM-04", "IAM-16"]
scope_tags:
  - aws
  - secretsmanager
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - trust-decay
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
remediation:
  description: >
    Secret resource policy references one or more deleted
    IAM principals.
  action: >
    Edit the secret's resource policy and remove statements
    that reference deleted principal ARNs
    (aws secretsmanager put-resource-policy --secret-id <id>
    --resource-policy <policy>). If the access was
    intentional and the principal is being recreated,
    confirm the recreated role assumes the same trust
    posture before re-adding the statement.
  example: |
    {
      "secret": {
        "kind": "secret",
        "policy": {
          "policy_principals": ["arn:aws:iam::111122223333:role/app"],
          "has_ghost_principal": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.policy.has_ghost_principal
      op: eq
      value: true
defect: >
  Secret resource policy references one or more deleted IAM
  principals.
infection: >
  Secret resource policies grant access by IAM principal ARN.
  When the named principal is deleted, the policy statement
  persists — the secret continues to advertise access for
  that ARN. If the ARN is later reclaimed (a new role is
  created with the same name in the same account), the
  secret automatically grants access to the new principal.
  The new principal may be created by a different team for
  a different purpose, yet inherits the previous principal's
  secret access. This is the ARN-reclamation hazard that
  affects every IAM-principal reference in resource policies
  across the catalog.
failure: >
  Latent access grant. The secret's resource policy
  authorizes principals that no longer exist; if the ARN is
  reclaimed, access is silently granted to the new
  principal.
tests:
  - name: secret with ghost principal fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:shared/db-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          policy:
            policy_principals:
              - "arn:aws:iam::111122223333:role/legacy-app"
            ghost_principals:
              - "arn:aws:iam::111122223333:role/legacy-app"
            has_ghost_principal: true
  - name: secret with active principals passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:shared/db-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          policy:
            policy_principals:
              - "arn:aws:iam::111122223333:role/active-app"
            ghost_principals: []
            has_ghost_principal: false
