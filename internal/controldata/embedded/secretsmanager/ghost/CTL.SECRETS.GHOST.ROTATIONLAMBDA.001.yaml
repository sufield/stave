dsl_version: ctrl.v1
id: CTL.SECRETS.GHOST.ROTATIONLAMBDA.001
name: Secret Rotation Lambda Function Deleted
description: >
  Secret has rotation enabled but the rotation Lambda function
  has been deleted. The console shows rotation enabled, the
  rotation schedule is set, the rotation ARN is present —
  but the Lambda function doesn't exist. When the next
  rotation is triggered, the invocation fails silently. The
  credential never rotates. The secret appears to have
  active rotation; it doesn't. This is the credential
  rotation ghost — the most dangerous ghost reference in
  the Secrets Manager domain because the gap is INVISIBLE
  to audits: the rotation configuration shows "Enabled,
  30-day interval" while the credential has been static
  since the Lambda was deleted.
domain: governance
severity: critical
archetype: ghost-reference
scope: compound
compliance:
  owasp_nhi: "NHI1"
  cis_aws_v3.0: "2.4"
  soc2: "CC6.1, CC6.7, CC8.1"
  nist_800_53_r5: "IA-5, SC-12, CM-2, CM-3"
  pci_dss_v4.0: "3.6, 8.2.4"
  fedramp_moderate: "IA-5"
  hipaa: "164.312(a)(1)"
  iso_27001_2022: "A.5.16, A.8.5"
  ccm_v4: ["IAM-04", "CEK-10"]
scope_tags:
  - aws
  - secretsmanager
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - trust-decay
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_secretsmanager_secret
params:
  attack_stage: credential_access
  blast_radius:
    type: prevention
    scope: account
    multiplier: 4.0
remediation:
  description: >
    Secret rotation references a deleted Lambda function.
    Rotation is configured but cannot execute; the
    credential is static while appearing rotated.
  action: >
    Restore the rotation Lambda by redeploying the function
    (the same SAR template that was originally used for the
    credential type — RDS-PostgreSQL-Rotation,
    RDS-MySQL-Rotation, etc.), then update the secret's
    rotation configuration to point at the new function ARN
    (aws secretsmanager rotate-secret --secret-id <id>
    --rotation-lambda-arn <arn>). Force an immediate rotation
    so the static credential is replaced
    (aws secretsmanager rotate-secret --secret-id <id>
    --rotate-immediately). Audit the secret's
    LastRotatedDate to determine how long rotation has been
    silently broken; rotate any other secrets that share the
    same rotation Lambda template.
  example: |
    {
      "secret": {
        "kind": "secret",
        "rotation": {
          "rotation_enabled": true,
          "rotation_lambda_arn": "arn:aws:lambda:us-east-1:111122223333:function:rotate-rds",
          "rotation_lambda_exists": true,
          "has_ghost_rotation_lambda": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.rotation.rotation_enabled
      op: eq
      value: true
    - field: properties.secret.rotation.has_ghost_rotation_lambda
      op: eq
      value: true
defect: >
  Secret has rotation enabled but the rotation Lambda
  function has been deleted; rotation cannot execute.
infection: >
  Secret rotation is the mechanism that changes the
  credential on a schedule — generating a new password,
  updating the target service (RDS, API, etc.), and storing
  the new value. When the rotation Lambda is deleted: the
  rotation schedule triggers on time, the trigger attempts
  to invoke the Lambda, the invocation fails (function not
  found), the rotation fails silently, the credential
  doesn't change. The secret's LastRotatedDate stops
  advancing. The credential becomes static — the same
  password indefinitely. The rotation configuration shows
  "Rotation enabled: Yes" and "Rotation schedule: 30 days."
  An auditor checking rotation sees "enabled." The
  credential hasn't actually changed since the Lambda was
  deleted — which could be weeks, months, or years ago.
failure: >
  Silent rotation failure. Rotation appears enabled but the
  Lambda function was deleted. The credential is static
  while appearing rotated.
tests:
  - name: secret with ghost rotation Lambda fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/rds/master-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          rotation:
            rotation_enabled: true
            rotation_lambda_arn: "arn:aws:lambda:us-east-1:111122223333:function:rotate-rds-deleted"
            rotation_lambda_exists: false
            has_ghost_rotation_lambda: true
  - name: secret with active rotation Lambda passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/rds/master-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          rotation:
            rotation_enabled: true
            rotation_lambda_arn: "arn:aws:lambda:us-east-1:111122223333:function:rotate-rds"
            rotation_lambda_exists: true
            has_ghost_rotation_lambda: false
  - name: long-standing ghost (180 days since LastRotatedDate) fires (severe)
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:legacy/api-key-XyZ"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          rotation:
            rotation_enabled: true
            rotation_lambda_arn: "arn:aws:lambda:us-east-1:111122223333:function:rotate-legacy-deleted"
            rotation_lambda_exists: false
            has_ghost_rotation_lambda: true
            last_rotated_days: 180
