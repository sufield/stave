dsl_version: ctrl.v1
id: CTL.SECRETS.GHOST.DELETION.REFERENCED.001
name: Secret Scheduled for Deletion While Referenced by Active Resources
description: >
  Secret is scheduled for deletion and is referenced by
  active resources — Lambda functions (env-var ARN), ECS
  task definitions (valueFrom), RDS Proxy (auth
  configuration), or other services. When the deletion
  recovery window expires, the secret is permanently
  deleted; every service that references it then fails:
  Lambda cold starts can't load the credential, ECS tasks
  can't launch, RDS Proxy can't authenticate. Same
  transversal-ghost pattern as
  CTL.KMS.STATE.PENDINGDELETION.001 — one resource pending
  deletion, multiple dependent services affected.
domain: governance
severity: critical
compliance:
  soc2: "CC6.1, CC8.1, A1.2"
  nist_800_53_r5: "CM-2, CM-3, CP-10, IR-4"
  pci_dss_v4.0: "10.6, 10.7"
  fedramp_moderate: "CM-2"
  hipaa: "164.312(a)(1)"
  iso_27001_2022: "A.5.16, A.8.32"
  ccm_v4: ["IAM-04", "BCR-08"]
scope_tags:
  - aws
  - secretsmanager
type: unsafe_state
classification: state_assertion
params:
  attack_stage: impact
  blast_radius:
    type: prevention
    scope: account
    multiplier: 4.0
remediation:
  description: >
    Secret is scheduled for deletion while still referenced
    by active services. The recovery window will expire and
    every dependent service will fail.
  action: >
    Decide intent: (a) if deletion is unintended, restore
    the secret immediately
    (aws secretsmanager restore-secret --secret-id <id>);
    (b) if deletion is intended, repoint every dependent
    resource (Lambda env vars, ECS task definitions, RDS
    Proxy auth config, etc.) to a replacement secret BEFORE
    the recovery window expires, then verify the dependent
    services have read the new value at least once. The
    minimum recovery window is 7 days — short enough that
    accidental deletions of widely-referenced secrets
    require immediate action.
  example: |
    {
      "secret": {
        "kind": "secret",
        "lifecycle": {
          "is_scheduled_deletion": false,
          "deletion_days_remaining": null,
          "dependent_resource_count": 0
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.lifecycle.is_scheduled_deletion
      op: eq
      value: true
    - field: properties.secret.lifecycle.dependent_resource_count
      op: gt
      value: 0
defect: >
  Secret is scheduled for deletion while still referenced by
  active resources.
infection: >
  When a secret is scheduled for deletion, a recovery window
  begins (minimum 7 days, maximum 30 days). During the
  window: GetSecretValue fails for every caller, the secret
  can be recovered (RestoreSecret). When the window expires,
  the secret is permanently deleted with no recovery. Every
  service that references the secret fails: Lambda functions
  that retrieve the credential on cold start fail to start.
  ECS tasks that inject the secret via valueFrom fail to
  launch. RDS Proxy that authenticates via the secret can't
  connect to the database. The failure is immediate (during
  the deletion window) and permanent (after the window
  expires).
failure: >
  Cascading authentication failure. Secret deletion will
  break every service that depends on it for credentials.
tests:
  - name: secret scheduled for deletion with dependents fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/api-key-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          lifecycle:
            is_scheduled_deletion: true
            deletion_date: "2026-05-15T00:00:00Z"
            deletion_days_remaining: 18
            dependent_resource_count: 3
            dependent_services: ["lambda", "ecs"]
  - name: active secret passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/api-key-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          lifecycle:
            is_scheduled_deletion: false
            dependent_resource_count: 3
            dependent_services: ["lambda", "ecs"]
  - name: imminent deletion (1 day) with dependents fires (severe)
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/db-master-XyZ"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          lifecycle:
            is_scheduled_deletion: true
            deletion_date: "2026-04-28T00:00:00Z"
            deletion_days_remaining: 1
            dependent_resource_count: 7
            dependent_services: ["lambda", "ecs", "rds_proxy"]
