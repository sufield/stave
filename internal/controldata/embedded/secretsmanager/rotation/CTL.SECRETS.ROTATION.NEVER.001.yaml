dsl_version: ctrl.v1
id: CTL.SECRETS.ROTATION.NEVER.001
name: Secret Rotation Enabled But Never Successfully Completed
description: >
  Secret has rotation enabled but LastRotatedDate is null —
  rotation has never successfully completed. Rotation was
  configured (enabled, Lambda set, schedule set) but has
  never executed successfully. The credential is the same
  value that was stored when the secret was created. The
  configuration shows good intent ("rotation enabled, 30-day
  interval") but the credential has never actually been
  changed.
domain: governance
severity: high
compliance:
  owasp_nhi: "NHI7"
  cis_aws_v3.0: "2.4"
  soc2: "CC6.1, CC6.7"
  nist_800_53_r5: "IA-5, SC-12"
  pci_dss_v4.0: "3.6, 8.2.4"
  fedramp_moderate: "IA-5"
  hipaa: "164.312(a)(1)"
  iso_27001_2022: "A.5.16, A.8.5"
  ccm_v4: ["IAM-04", "CEK-10"]
scope_tags:
  - aws
  - secretsmanager
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
remediation:
  description: >
    Secret rotation is enabled but has never successfully
    completed. The credential remains the original
    creation-time value.
  action: >
    Force an immediate rotation
    (aws secretsmanager rotate-secret --secret-id <id>
    --rotate-immediately) and watch the rotation Lambda's
    CloudWatch logs. The first rotation often fails on
    permission gaps (the rotation Lambda's execution role
    can't assume the database admin role, can't update
    the target service, can't write back to Secrets
    Manager). Fix the underlying error and re-run until
    LastRotatedDate is populated. Until that succeeds, the
    secret holds its original creation-time value.
  example: |
    {
      "secret": {
        "kind": "secret",
        "rotation": {
          "rotation_enabled": true,
          "has_ever_rotated": true,
          "last_rotated_days": 5,
          "secret_age_days": 60
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.rotation.rotation_enabled
      op: eq
      value: true
    - field: properties.secret.rotation.has_ever_rotated
      op: eq
      value: false
defect: >
  Secret rotation is enabled but has never successfully
  rotated.
infection: >
  Rotation was configured at secret creation time (or
  shortly after) but has never executed successfully. The
  rotation Lambda has been invoked one or more times by the
  schedule and every invocation has failed. Common
  first-rotation failures: the rotation Lambda's execution
  role can't assume the database admin role; the Lambda's
  network configuration prevents reaching the target
  service (RDS in a private subnet without VPC endpoints);
  the rotation strategy is misconfigured for the credential
  type (single-user template applied to a multi-user
  workload). Until rotation succeeds at least once, the
  credential stored in the secret is whatever value was
  initialized at creation.
failure: >
  Original credential never changed. The secret holds the
  value first stored at creation time despite rotation
  being enabled.
tests:
  - name: rotation enabled but never rotated fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:newproject/db-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          rotation:
            rotation_enabled: true
            has_ever_rotated: false
            last_rotated_date: null
            secret_age_days: 180
            rotation_interval_days: 30
  - name: rotation has completed at least once passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/db-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          rotation:
            rotation_enabled: true
            has_ever_rotated: true
            last_rotated_days: 5
            secret_age_days: 220
            rotation_interval_days: 30
