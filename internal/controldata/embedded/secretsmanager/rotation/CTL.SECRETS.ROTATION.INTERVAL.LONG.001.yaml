dsl_version: ctrl.v1
id: CTL.SECRETS.ROTATION.INTERVAL.LONG.001
name: Secret Rotation Interval Exceeds 90 Days
description: >
  Secret rotation interval is configured to more than 90
  days. Most compliance frameworks recommend or require
  credential rotation within 90 days — PCI-DSS recommends
  90-day rotation, NIST 800-53 recommends periodic
  rotation, and many organizational policies require 90
  days or less. A rotation interval of 365 days means the
  credential is the same for an entire year. Note: some
  credentials don't rotate frequently (long-lived API keys
  for stable integrations, OAuth client secrets); the
  finding warrants review against credential type and
  compliance requirements rather than a hard reject.
domain: governance
severity: medium
compliance:
  cis_aws_v3.0: "2.4"
  soc2: "CC6.1, CC6.7"
  nist_800_53_r5: "IA-5, SC-12"
  pci_dss_v4.0: "3.6, 8.2.4"
  fedramp_moderate: "IA-5"
  hipaa: "164.312(a)(1)"
  iso_27001_2022: "A.5.16, A.8.5"
  ccm_v4: ["IAM-04", "CEK-10"]
scope_tags:
  - aws
  - secretsmanager
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
remediation:
  description: >
    Secret rotation interval exceeds 90 days, beyond common
    compliance and policy thresholds.
  action: >
    Reduce the rotation interval to 90 days or less
    (aws secretsmanager rotate-secret --secret-id <id>
    --rotation-rules AutomaticallyAfterDays=30). For
    credential types that genuinely cannot rotate frequently
    (stable third-party API integrations, legacy OAuth
    client secrets), document the exception with the
    rationale and the compensating controls (network
    isolation, audit logging, least-privilege scoping).
  example: |
    {
      "secret": {
        "kind": "secret",
        "rotation": {
          "rotation_enabled": true,
          "rotation_interval_days": 30,
          "rotation_interval_long": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.rotation.rotation_enabled
      op: eq
      value: true
    - field: properties.secret.rotation.rotation_interval_long
      op: eq
      value: true
defect: >
  Secret rotation interval is configured beyond the 90-day
  threshold.
infection: >
  Long rotation intervals extend the window during which a
  compromised credential remains valid. If the credential
  is exposed (committed to a repo, leaked in a log, captured
  by an SSRF vulnerability), the attacker has the rotation
  interval to use it before the next rotation. A 365-day
  interval gives a full year. Compliance frameworks
  generally require credentials to rotate within 90 days
  precisely because shorter intervals limit the blast radius
  of a credential compromise.
failure: >
  Extended credential validity window. A compromised
  credential remains valid for the full configured
  interval.
tests:
  - name: 365-day interval fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/api-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          rotation:
            rotation_enabled: true
            rotation_interval_days: 365
            rotation_interval_long: true
  - name: 30-day interval passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/api-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          rotation:
            rotation_enabled: true
            rotation_interval_days: 30
            rotation_interval_long: false
