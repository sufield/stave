dsl_version: ctrl.v1
id: CTL.SECRETS.INTEGRATION.RDS.NOSECRET.001
name: RDS Instance Master Credential Not Managed by Secrets Manager
description: >
  RDS instance has a master user password that is not
  managed by Secrets Manager. The password was set at
  instance creation (CloudFormation parameter, CLI, or
  console) and is stored somewhere outside Secrets Manager
  — in a CloudFormation template, deployment script,
  environment variable, developer's notes, or nowhere
  (forgotten). The password can't be rotated via Secrets
  Manager, can't be audited via CloudTrail data events,
  and can't be restricted via resource policy. Does not
  fire on RDS instances that use IAM database
  authentication (no master password in use).
domain: governance
severity: high
compliance:
  cis_aws_v3.0: "2.4"
  soc2: "CC6.1, CC6.7"
  nist_800_53_r5: "IA-5, SC-12, SC-28"
  pci_dss_v4.0: "3.5, 8.2.4"
  fedramp_moderate: "IA-5"
  hipaa: "164.312(a)(1)"
  iso_27001_2022: "A.5.16, A.8.5"
  ccm_v4: ["IAM-04", "CEK-10"]
scope_tags:
  - aws
  - secretsmanager
  - rds
taxonomy:
  - credential-lifecycle
  - encryption-at-rest
  - logging
subtractive_category:
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_secretsmanager_secret]
params:
  attack_stage: credential_access
  blast_radius:
    type: prevention
    scope: account
    multiplier: 3.0
remediation:
  description: >
    RDS master credential is unmanaged. The password is
    static, unaudited, and uncontrolled.
  action: >
    Migrate the master credential to Secrets Manager.
    Preferred: enable RDS-managed password
    (aws rds modify-db-instance --db-instance-identifier
    <id> --manage-master-user-password
    --master-user-secret-kms-key-id <cmk>) — RDS creates
    and rotates the secret automatically. Alternative:
    create a Secrets Manager secret manually, attach a
    rotation Lambda, point applications at the secret
    ARN, then run a one-time password reset through the
    new rotation pipeline. After migration, verify
    the secret has rotation enabled
    (CTL.SECRETS.ROTATION.001) and is encrypted with a
    customer-managed key (CTL.SECRETSMANAGER.ENCRYPT.001).
  example: |
    {
      "secret": {
        "kind": "secret",
        "integration": {
          "rds_instance_id": "prod-app-db",
          "rds_master_managed": true,
          "rds_has_sm_secret": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.integration.rds_iam_auth_enabled
      op: eq
      value: false
    - field: properties.secret.integration.rds_master_managed
      op: eq
      value: false
    - field: properties.secret.integration.rds_has_sm_secret
      op: eq
      value: false
defect: >
  RDS master credential is not managed by Secrets Manager.
infection: >
  An RDS master credential outside Secrets Manager has
  no: automated rotation (the password is static until
  someone manually changes it), access auditing (who
  knows the password is untracked — it's a string stored
  somewhere), access control (anyone who has the password
  string can authenticate — no IAM policy, no resource
  policy, no KMS key), or lifecycle management (the
  password persists until someone remembers to change
  it). The credential is likely hardcoded in: application
  configuration files (committed to source control),
  CloudFormation templates (visible to anyone with stack
  access), environment variables (visible in the
  execution environment), or documentation (wikis,
  runbooks, shared documents).
failure: >
  Unmanaged database credential. Master password is
  outside Secrets Manager — no rotation, no auditing, no
  access control.
tests:
  - name: RDS without SM-managed credential fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:rds:us-east-1:111122223333:db:prod-app-db"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          integration:
            rds_instance_id: "prod-app-db"
            rds_instance_arn: "arn:aws:rds:us-east-1:111122223333:db:prod-app-db"
            rds_iam_auth_enabled: false
            rds_master_managed: false
            rds_has_sm_secret: false
  - name: RDS with SM-managed credential passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:rds:us-east-1:111122223333:db:prod-app-db"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          integration:
            rds_instance_id: "prod-app-db"
            rds_instance_arn: "arn:aws:rds:us-east-1:111122223333:db:prod-app-db"
            rds_iam_auth_enabled: false
            rds_master_managed: true
            rds_has_sm_secret: true
  - name: RDS with IAM auth does not fire (no password in use)
    verdict: PASS
    asset:
      asset_id: "arn:aws:rds:us-east-1:111122223333:db:iam-auth-db"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          integration:
            rds_instance_id: "iam-auth-db"
            rds_instance_arn: "arn:aws:rds:us-east-1:111122223333:db:iam-auth-db"
            rds_iam_auth_enabled: true
            rds_master_managed: false
            rds_has_sm_secret: false
