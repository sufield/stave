dsl_version: ctrl.v1
id: CTL.SECRETS.ALARM.ACCESS.VOLUME.001
name: No CloudWatch Alarm for High-Frequency GetSecretValue Calls
description: >
  No CloudWatch alarm monitors for high-frequency
  GetSecretValue API calls. Sudden spikes may indicate
  credential scraping (attacker enumerating and reading
  secrets), caching failure (an application retrieving
  the secret on every request instead of caching), or bulk
  credential retrieval (automation reading many secrets
  simultaneously). Anomaly detection or environment-tuned
  thresholds reduce false positives from legitimate
  causes (deployment rolling out, application restart).
domain: detection
severity: medium
compliance:
  soc2: "CC7.2"
  nist_800_53_r5: "AU-6, SI-4"
  pci_dss_v4.0: "10.6"
  fedramp_moderate: "SI-4"
  iso_27001_2022: "A.8.16"
  ccm_v4: ["LOG-08"]
scope_tags:
  - aws
  - secretsmanager
taxonomy:
  - credential-lifecycle
  - logging
  - monitoring
  - trust-boundary
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
remediation:
  description: >
    Anomalous GetSecretValue volume is unmonitored.
    Credential scraping or runaway-application access goes
    undetected.
  action: >
    Create a CloudWatch anomaly-detection alarm on
    AWS/SecretsManager metric (or a CloudTrail metric
    filter counting GetSecretValue events). Anomaly
    detection adapts to the baseline call volume per
    environment so it avoids false positives during
    deployment ramps. Pair with the access-failure alarm
    so spikes in either dimension trigger investigation.
  example: |
    {
      "secret": {
        "kind": "secret",
        "monitoring": {
          "alarm_access_volume": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.monitoring.alarm_access_volume
      op: ne
      value: true
defect: >
  No CloudWatch alarm monitors anomalous GetSecretValue
  call frequency.
infection: >
  High-frequency GetSecretValue has multiple plausible
  causes. Credential scraping: an attacker who has
  obtained partial access enumerates secret ARNs and
  attempts to read each one (the failed reads also
  surface in ALARM.ACCESS.FAILURE.001 — together they
  form the attack signature). Caching failure: an
  application that should cache the credential between
  requests instead retrieves it on every call,
  multiplying request volume by call rate. Bulk
  retrieval: a script that walks the secret inventory.
  Without volume monitoring, the spike is invisible
  until the AWS bill or a downstream rate-limit event
  surfaces it.
failure: >
  Undetected anomalous credential access. Volume spikes
  (legitimate or malicious) are invisible.
tests:
  - name: secret without access-volume alarm fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/api-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          monitoring:
            alarm_access_volume: false
  - name: secret with access-volume alarm passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/api-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          monitoring:
            alarm_access_volume: true
  - name: cross-account secret without volume alarm fires (severe)
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:shared/db-XyZ"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          monitoring:
            alarm_access_volume: false
          policy:
            policy_cross_account: true
            policy_external_accounts: ["444455556666"]
