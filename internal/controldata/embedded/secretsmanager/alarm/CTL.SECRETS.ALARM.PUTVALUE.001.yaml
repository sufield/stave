dsl_version: ctrl.v1
id: CTL.SECRETS.ALARM.PUTVALUE.001
name: No CloudWatch Alarm for Secrets Manager PutSecretValue
description: >
  No CloudWatch alarm monitors CloudTrail for
  PutSecretValue API calls. PutSecretValue replaces the
  secret's credential value — the database password, API
  key, or token changes. Without an alarm, credential
  modification is invisible. An attacker with
  PutSecretValue permission can replace a production
  database password with one they control, and every
  service that retrieves the secret then authenticates
  with the attacker's password. The alarm should ideally
  filter rotation-initiated PutSecretValue calls
  (userIdentity = rotation Lambda ARN) and alert only on
  manual or non-rotation modifications.
domain: detection
severity: high
compliance:
  cis_aws_v3.0: "2.4"
  soc2: "CC6.1, CC7.2, CC7.3"
  nist_800_53_r5: "AC-3, AU-6, SI-4, IR-4"
  pci_dss_v4.0: "8.2.4, 10.6"
  fedramp_moderate: "SI-4"
  hipaa: "164.312(a)(1)"
  iso_27001_2022: "A.5.15, A.8.16"
  ccm_v4: ["IAM-04", "LOG-08"]
scope_tags:
  - aws
  - secretsmanager
taxonomy:
  - credential-lifecycle
  - logging
  - monitoring
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
  blast_radius:
    type: detection
    scope: account
    multiplier: 2.5
remediation:
  description: >
    Credential modifications go undetected. PutSecretValue
    outside of rotation should be a rare and investigated
    event.
  action: >
    Create a CloudTrail metric filter on
    eventName = PutSecretValue. To reduce noise from
    rotation-initiated calls, exclude events where
    userIdentity.arn matches a known rotation Lambda
    pattern: '{ $.eventName = "PutSecretValue" &&
    $.userIdentity.arn != "*lambda*rotation*" }'. Wire to
    a CloudWatch alarm with threshold >= 1 over a
    5-minute period. Route to ops on-call so manual
    modifications surface immediately and trigger
    investigation.
  example: |
    {
      "secret": {
        "kind": "secret",
        "monitoring": {
          "alarm_put_value": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.monitoring.alarm_put_value
      op: eq
      value: false
defect: >
  No CloudWatch alarm monitors PutSecretValue API calls.
infection: >
  PutSecretValue replaces the secret's credential value.
  When called outside of rotation (which also calls
  PutSecretValue internally): someone or something is
  changing the credential manually. This may be: an
  attacker replacing the password with one they control
  (credential takeover), automation that modifies
  credentials without going through rotation (bypassing
  rotation governance), or a developer updating a
  credential directly (skipping the rotation process).
  PutSecretValue outside of rotation should be rare and
  investigated. The alarm should distinguish
  rotation-initiated PutSecretValue (expected) from
  manual PutSecretValue (investigate).
failure: >
  Undetected credential modification. The secret's value
  was changed outside of rotation without notification.
tests:
  - name: secret without put-value alarm fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/db-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          monitoring:
            alarm_put_value: false
  - name: secret with put-value alarm passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/db-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          monitoring:
            alarm_put_value: true
