dsl_version: ctrl.v1
id: CTL.SECRETS.ALARM.ROTATION.APPROACHING.001
name: No Monitoring for Secrets Approaching Rotation Deadline
description: >
  No monitoring tracks secrets approaching their rotation
  deadline — secrets where (LastRotatedDate + interval)
  falls within the next 7 days. Proactive control
  (vs. reactive ROTATION.STALE.001 which fires after
  rotation is already overdue): early warning lets the
  team verify the rotation pipeline before failure.
domain: governance
severity: medium
compliance:
  owasp_nhi: "NHI7"
  soc2: "CC7.2"
  nist_800_53_r5: "IA-5, SI-4"
  pci_dss_v4.0: "8.2.4"
  fedramp_moderate: "SI-4"
  iso_27001_2022: "A.5.16, A.8.16"
  ccm_v4: ["IAM-04", "LOG-08"]
scope_tags:
  - aws
  - secretsmanager
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
remediation:
  description: >
    No early-warning monitoring for secrets nearing rotation
    deadline.
  action: >
    Run a periodic Lambda or scheduled query that flags
    secrets where (LastRotatedDate + RotationRules.AutomaticallyAfterDays)
    is within 7 days of now. Publish the list to an SNS
    topic, ticket queue, or dashboard so the team can
    verify the rotation pipeline (Lambda exists, network
    path works, target service reachable) before rotation
    actually runs. Pair with CTL.SECRETS.ALARM.ROTATION.FAILURE.001
    so when rotation does run, failures are caught in real
    time.
  example: |
    {
      "secret": {
        "kind": "secret",
        "monitoring": {
          "alarm_rotation_approaching": true,
          "rotation_due_days": 14
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.monitoring.alarm_rotation_approaching
      op: eq
      value: false
defect: >
  No monitoring tracks secrets approaching their rotation
  deadline.
infection: >
  Without an approaching-deadline signal, the only
  rotation visibility is reactive: ROTATION.STALE.001
  fires after 2x the interval has elapsed (i.e., after
  rotation has already failed and the credential is
  already overdue). Proactive monitoring lets the team
  catch problems in the window where rotation is
  imminent but not yet failing — for example: the
  rotation Lambda's IAM role lost permissions due to a
  recent boundary change. With approaching-deadline
  monitoring, the team verifies the next rotation will
  succeed; without it, the team finds out after the
  rotation has failed and the credential is stale.
failure: >
  No early warning for rotation. Failures are detected
  only after the credential is already overdue.
tests:
  - name: secret without approaching-deadline monitoring fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/api-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          monitoring:
            alarm_rotation_approaching: false
            rotation_due_days: 3
  - name: secret with approaching-deadline monitoring passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/api-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          monitoring:
            alarm_rotation_approaching: true
            rotation_due_days: 14
