dsl_version: ctrl.v1
id: CTL.SECRETS.CROSSACCOUNT.NOKMS.001
name: Secret Shared Cross-Account Without KMS Key Sharing
description: >
  Secret resource policy grants GetSecretValue to an
  external account but the secret's KMS key policy doesn't
  grant kms:Decrypt to that account. The external account
  has Secrets Manager permission to read the secret but
  can't decrypt it — the KMS key blocks the decryption.
  The access appears granted; the decryption fails. This is
  a cross-service permission mismatch where one service
  grants access and the other blocks it. Note: secrets
  encrypted with the AWS-managed key (aws/secretsmanager)
  cannot be shared cross-account at all — this control
  applies to CMK-encrypted secrets where cross-account
  access is intended.
domain: exposure
severity: high
compliance:
  owasp_nhi: "NHI6"
  soc2: "CC6.1, CC6.7"
  nist_800_53_r5: "AC-3, AC-4, SC-12"
  pci_dss_v4.0: "3.4.1, 7.1"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.5.15, A.8.3"
  ccm_v4: ["IAM-16", "CEK-03"]
scope_tags:
  - aws
  - secretsmanager
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.0
remediation:
  description: >
    Secret grants cross-account GetSecretValue but its KMS
    key does not grant Decrypt to the same account. The
    access appears configured but fails on the KMS step.
  action: >
    Either: (a) update the KMS key policy to grant
    kms:Decrypt to the external account principal that the
    secret policy authorizes
    (aws kms put-key-policy --key-id <id> --policy <policy>);
    or (b) if cross-account access was unintended, remove
    the cross-account grant from the secret resource policy.
    Both sides — Secrets Manager AND KMS — must
    consistently authorize the external account for cross-
    account secret reads to function.
  example: |
    {
      "secret": {
        "kind": "secret",
        "policy": {
          "policy_cross_account": true,
          "cross_account_ids": ["444455556666"]
        },
        "encryption": {
          "kms_key_cross_account_decrypt": true,
          "has_kms_access_mismatch": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.policy.policy_cross_account
      op: eq
      value: true
    - field: properties.secret.encryption.has_kms_access_mismatch
      op: eq
      value: true
defect: >
  Secret grants cross-account access via Secrets Manager
  policy but the KMS key policy does not grant Decrypt to
  the same account.
infection: >
  Secrets Manager secrets are encrypted with a KMS key. To
  read a secret, a principal needs BOTH:
  secretsmanager:GetSecretValue (permission to call the
  Secrets Manager API) AND kms:Decrypt on the secret's
  encryption key (permission to decrypt the encrypted
  value). When a secret is shared cross-account via
  resource policy but the KMS key policy doesn't include
  the external account, the external account's
  GetSecretValue call fails with an access denied on the
  KMS Decrypt step. The Secrets Manager permission looks
  correct; the failure comes from KMS. This is a cross-
  service permission mismatch — one service grants access,
  another blocks it — and is uniquely confusing because
  the IAM/secret policy review surface looks complete.
failure: >
  Cross-service permission mismatch. Secret access granted
  by Secrets Manager policy but blocked by KMS key policy.
tests:
  - name: secret with cross-account SM grant but no KMS share fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:shared/db-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          policy:
            policy_cross_account: true
            cross_account_ids: ["444455556666"]
          encryption:
            customer_managed_key: true
            kms_key_arn: "arn:aws:kms:us-east-1:111122223333:key/abc-123"
            kms_key_cross_account_decrypt: false
            has_kms_access_mismatch: true
  - name: secret with cross-account SM grant and matching KMS share passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:shared/db-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          policy:
            policy_cross_account: true
            cross_account_ids: ["444455556666"]
          encryption:
            customer_managed_key: true
            kms_key_arn: "arn:aws:kms:us-east-1:111122223333:key/abc-123"
            kms_key_cross_account_decrypt: true
            has_kms_access_mismatch: false
