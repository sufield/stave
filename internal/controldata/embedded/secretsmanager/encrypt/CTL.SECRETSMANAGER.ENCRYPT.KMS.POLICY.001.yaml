dsl_version: ctrl.v1
id: CTL.SECRETSMANAGER.ENCRYPT.KMS.POLICY.001
name: KMS Key Policy for Secrets Manager Encryption Is Overly Broad
description: >
  The KMS key used to encrypt a Secrets Manager secret has an
  overly broad key policy — kms:Decrypt granted to the account
  root, a wildcard principal, or a broad IAM pattern. An overly
  broad key policy undermines encryption: any matching principal
  can decrypt the secret value, bypassing Secrets Manager's
  resource policy and IAM controls entirely. Same cross-property
  invariant as CTL.S3.ENCRYPT.KMS.POLICY.001 applied to Secrets
  Manager: the secret passes the CMK-encrypted check but the key
  policy makes the encryption cosmetic. The collector pre-computes
  kms_key_policy_broad by joining the secret's KmsKeyId to the
  KMS key's policy analysis.
domain: exposure
severity: critical
compliance:
  nist_800_53_r5: "SC-13, IA-5(7)"
  pci_dss_v4.0: "3.6.1"
  soc2: "CC6.1"
  ccm_v4: ["CEK-01", "IAM-16"]
scope_tags:
  - aws
  - secretsmanager
taxonomy:
  - encryption-at-rest
  - key-management
  - credential-lifecycle
subtractive_category:
  - S02
  - S10
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_secretsmanager_secret
params:
  attack_stage: credential_access
observation_fields:
  - secret.kind
  - secret.encryption.kms_key_policy_broad
remediation:
  description: >
    KMS key used for Secrets Manager encryption has an overly
    broad key policy. Any matching principal can decrypt the
    secret value directly via KMS.
  action: >
    Scope the KMS key policy to the specific principals that need
    access. Use kms:ViaService condition to restrict usage to
    secretsmanager.amazonaws.com. Remove kms:* grants and limit
    kms:Decrypt to authorized consumers only.
  example: |
    {
      "secret": {
        "kind": "secret",
        "encryption": {
          "kms_key_policy_broad": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.encryption.kms_key_policy_broad
      op: eq
      value: true
tests:
  - name: "secret with broad KMS key policy — fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/db-creds-AbCdEf"
      asset_type: aws_secretsmanager_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          encryption:
            kms_key_policy_broad: true
  - name: "secret with scoped KMS key policy — passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/api-key-GhIjKl"
      asset_type: aws_secretsmanager_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          encryption:
            kms_key_policy_broad: false
