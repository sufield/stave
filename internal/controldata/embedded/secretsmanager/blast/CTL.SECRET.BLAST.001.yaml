dsl_version: ctrl.v1
id: CTL.SECRET.BLAST.001
name: Secret with Multiple Readers Must Not Target Sensitive Resource
description: >
  Secrets in Secrets Manager that provide credentials to sensitive
  resources (PHI, PII, confidential) must have a minimal set of
  readers. A secret readable by more than 3 principals is a high-value
  target — compromising any one of those principals provides a direct
  path to the sensitive data, bypassing IAM least privilege on the
  data resource itself. The extractor maps which principals have
  secretsmanager:GetSecretValue and which resource the secret unlocks.
domain: exposure
severity: critical
compliance:
  hipaa: "164.312(a)(1)"
  soc2: "CC6.1"
  pci_dss_v4.0: "3.4.1"
  nist_800_53_r5: "SC-12"
  ccm_v4: ["DSP-17", "IAM-05"]
scope_tags:
  - aws
  - secretsmanager
type: unsafe_state
classification: state_assertion
params:
  base_impact: 10
  attack_stage: credential_access
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.5
remediation:
  description: >
    Secret targeting sensitive resource has too many readers.
    Each reader is a potential credential compromise path to the
    sensitive data.
  action: >
    Reduce the number of principals with secretsmanager:GetSecretValue
    to the minimum required. Use resource-based policies on the secret
    to restrict access. Enable automatic rotation via
    aws secretsmanager rotate-secret --secret-id <id>.
  example: |
    {
      "secret": {
        "kind": "secret",
        "blast_radius": {
          "privileged_reader_count": 2,
          "target_sensitivity": "phi"
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.blast_radius.privileged_reader_count
      op: gt
      value: 3
    - field: properties.secret.blast_radius.target_sensitivity
      op: in
      value: ["phi", "pii", "confidential"]
