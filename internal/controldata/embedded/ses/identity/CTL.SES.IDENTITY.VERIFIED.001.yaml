dsl_version: ctrl.v1
id: CTL.SES.IDENTITY.VERIFIED.001
name: SES Verified Identities Must Use Organization-Owned Domains
description: >
  SES verified identities should be organization-owned domains,
  not personal or consumer email addresses (gmail.com, yahoo.com,
  outlook.com). Verified personal email addresses indicate ad-hoc
  SES usage outside organizational control.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["DSP-01"]
scope_tags:
  - aws
  - ses
taxonomy:
  - data-protection
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_ses_identity
params:
  attack_stage: impact
observation_fields:
  - messaging.kind
  - messaging.ses.is_consumer_domain
remediation:
  description: >
    SES verified identity uses a consumer email domain.
  action: >
    Verify organization-owned domains instead. Remove personal
    email verified identities.
  example: |
    {
      "messaging": {
        "kind": "ses_identity",
        "ses": {
          "is_consumer_domain": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.messaging.kind
      op: eq
      value: ses_identity
    - field: properties.messaging.ses.is_consumer_domain
      op: eq
      value: true
tests:
  - name: "consumer domain fires"
    verdict: VIOLATION
    asset:
      asset_id: "user@gmail.com"
      asset_type: aws_ses_identity
      vendor: aws
      properties:
        messaging:
          kind: ses_identity
          ses:
            is_consumer_domain: true
  - name: "org domain passes"
    verdict: PASS
    asset:
      asset_id: "noreply@company.com"
      asset_type: aws_ses_identity
      vendor: aws
      properties:
        messaging:
          kind: ses_identity
          ses:
            is_consumer_domain: false
