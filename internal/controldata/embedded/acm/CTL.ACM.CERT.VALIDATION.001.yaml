dsl_version: ctrl.v1
id: CTL.ACM.CERT.VALIDATION.001
name: ACM Certificates Must Use DNS Validation
description: >
  ACM certificates should use DNS validation, not email validation.
  Email validation requires manual intervention for each renewal —
  if the domain contact email is stale, renewal fails silently and
  the certificate expires. DNS validation enables automatic renewal
  as long as the CNAME record exists, eliminating human-dependent
  renewal processes.
domain: exposure
severity: low
compliance:
  nist_800_53_r5: "SC-17"
  soc2: "CC6.1"
  ccm_v4: ["CEK-02"]
  scs_c02: "6.2"
scope_tags: [aws, acm]
taxonomy:
  - compliance-mapping
  - trust-decay
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_acm_certificate]
params:
  attack_stage: initial_access
remediation:
  description: >
    ACM certificate uses email validation. Renewal depends on
    human response to validation emails.
  action: >
    Re-request the certificate with DNS validation. Add the CNAME
    record ACM provides to your DNS zone. This enables automatic
    renewal without human intervention.
  example: |
    {
      "certificate": {
        "kind": "acm_certificate",
        "validation_method": "DNS"
      }
    }
unsafe_predicate:
  all:
    - field: properties.certificate.kind
      op: eq
      value: acm_certificate
    - field: properties.certificate.validation_method
      op: eq
      value: EMAIL
