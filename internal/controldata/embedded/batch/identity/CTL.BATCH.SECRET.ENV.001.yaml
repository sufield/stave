dsl_version: ctrl.v1
id: CTL.BATCH.SECRET.ENV.001
name: Batch Job Definition Must Not Contain Plaintext Secrets
description: >
  AWS Batch job definition contains plaintext secrets in
  environment variables. Secrets in environment variables
  are visible in the Batch console, API responses, and
  CloudTrail logs.
domain: identity
severity: low
compliance:
  nist_800_53_r5: "IA-5"
  soc2: "CC6.1"
scope_tags:
  - aws
  - batch
taxonomy:
  - compliance-mapping
  - credential-lifecycle
subtractive_category:
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_batch_job_definition]
params:
  attack_stage: credential_access
remediation:
  description: >
    Batch job definition contains plaintext secrets in
    environment variables.
  action: >
    Move secrets to AWS Secrets Manager or SSM Parameter Store
    and reference them via the Batch secrets configuration.
  example: |
    {
      "compute": {
        "kind": "batch_job_definition",
        "secrets": {
          "env_contains_plaintext": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: batch_job_definition
    - field: properties.compute.secrets.env_contains_plaintext
      op: eq
      value: true
tests:
  - name: job with plaintext secrets fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:batch:us-east-1:123456789012:job-definition/my-job:1"
      asset_type: aws_batch_job_definition
      vendor: aws
      properties:
        compute:
          kind: batch_job_definition
          secrets:
            env_contains_plaintext: true
  - name: job without plaintext secrets passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:batch:us-east-1:123456789012:job-definition/my-job:1"
      asset_type: aws_batch_job_definition
      vendor: aws
      properties:
        compute:
          kind: batch_job_definition
          secrets:
            env_contains_plaintext: false
