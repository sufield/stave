dsl_version: ctrl.v1
id: CTL.EXPOSURE.ANON.INCOMPLETE.001
name: Complete Data Required for Reachability Assessment
description: >
  Unauthenticated reachability cannot be assessed when the reachability
  kind discriminator is present but the reachable field is missing.
  The extractor encountered an error during graph traversal and could
  not determine whether the resource is reachable from anonymous
  principals.
compliance:
  ccm_v4: ["DCS-06", "DSP-07", "DSP-17", "IVS-03"]
domain: exposure
severity: low
scope_tags:
  - aws
  - cross-service
type: unsafe_state
params: {}
remediation:
  description: >
    Reachability assessment is incomplete. The extractor could not
    determine whether this resource is reachable from anonymous
    principals.
  action: >
    Re-run the reachability extractor with sufficient IAM permissions
    to read API Gateway configurations, Lambda function policies,
    IAM role trust policies, and resource-based policies for all
    resources in the account.
unsafe_predicate:
  all:
    - field: properties.reachability.kind
      op: eq
      value: anonymous_path
    - field: properties.reachability.anonymous_path.reachable
      op: missing
      value: true
