dsl_version: ctrl.v1
id: CTL.EXPOSURE.ANON.001
name: Sensitive Resources Must Not Be Reachable from Anonymous
description: >
  Resources tagged with sensitive data classifications (PHI, PII,
  confidential) must not be reachable from anonymous or unauthenticated
  principals through any composition of access grants. The extractor
  traces paths from anonymous through API Gateway routes, Lambda
  integrations, IAM role assumptions, bucket policies, VPC endpoint
  policies, and security group rules. This catches the
  API Gateway → Lambda → IAM Role → S3 Bucket pattern where every
  resource passes individual inspection but the composition creates
  an unauthenticated path to sensitive data.
domain: exposure
severity: critical
compliance:
  hipaa: "164.312(a)(1)"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  nist_800_53_r5: "AC-3"
  fedramp_moderate: "AC-3"
  gdpr: "Art.32"
  ccm_v4: ["DSP-07", "DSP-17", "IVS-03"]
scope_tags:
  - aws
  - cross-service
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
params:
  base_impact: 10
  attack_stage: initial_access
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.5
remediation:
  description: >
    A sensitive resource is reachable from the public internet through
    a chain of access grants. No individual resource is misconfigured,
    but the composition creates an unauthenticated path to data
    classified as sensitive.
  action: >
    Add an authorization layer to the path. Configure an API Gateway
    authorizer (Cognito, Lambda, or IAM), attach a WAF with managed
    rule groups, or remove the Lambda function's permission to access
    the sensitive resource. Review the full path and break the chain
    at the most appropriate point.
  example: |
    {
      "reachability": {
        "kind": "anonymous_path",
        "anonymous_path": {
          "reachable": false,
          "target_data_classification": "phi"
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.reachability.kind
      op: eq
      value: anonymous_path
    - field: properties.reachability.anonymous_path.reachable
      op: eq
      value: true
    - field: properties.reachability.anonymous_path.target_data_classification
      op: in
      value: ["phi", "pii", "confidential"]
