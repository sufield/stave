dsl_version: ctrl.v1
id: CTL.EXPOSURE.SOVEREIGNTY.INCOMPLETE.001
name: Complete Data Required for Sovereignty Assessment
description: >
  Sovereignty assessment requires the cross_border_access_detected
  field. The extractor could not determine whether the resource is
  accessible from outside its jurisdiction.
compliance:
  ccm_v4: ["DCS-06", "DSP-17", "IVS-03"]
domain: exposure
severity: low
scope_tags:
  - aws
  - cross-service
  - compliance
taxonomy:
  - compliance-mapping
applicable_asset_types:
  - aws_reachability_analysis
type: unsafe_state
classification: state_assertion
params: {}
remediation:
  description: >
    Sovereignty assessment is incomplete. The extractor could not
    determine cross-border access patterns.
  action: >
    Re-run the sovereignty extractor with permissions to enumerate
    IAM principals, their account regions, and resource-based
    policies for all sensitive resources.
unsafe_predicate:
  all:
    - field: properties.reachability.kind
      op: eq
      value: cross_border
    - field: properties.reachability.sovereignty.cross_border_access_detected
      op: missing
      value: true
