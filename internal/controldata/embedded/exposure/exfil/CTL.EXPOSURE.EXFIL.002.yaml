dsl_version: ctrl.v1
id: CTL.EXPOSURE.EXFIL.002
name: Compute with Internet Egress Must Not Have Wildcard Write
description: >
  Compute instances with internet egress paths must have scoped
  write permissions. An instance with s3:PutObject on Resource "*"
  combined with outbound internet access can write data to any S3
  bucket — including attacker-controlled external buckets. The
  extractor checks if the instance role grants wildcard write
  permissions to storage services.
domain: exposure
severity: high
compliance:
  soc2: "CC6.1"
  nist_800_53_r5: "AC-6"
  fedramp_moderate: "AC-6"
  ccm_v4: ["DSP-17", "IVS-03"]
scope_tags:
  - aws
  - cross-service
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_account
params:
  base_impact: 8
  attack_stage: exfiltration
remediation:
  description: >
    Compute instance has wildcard write permissions and internet
    egress. Data can be written to external destinations.
  action: >
    Scope the instance role's write permissions to specific resource
    ARNs. Replace s3:PutObject on Resource "*" with explicit bucket
    ARNs. Use VPC endpoints with bucket-scoped policies to restrict
    write targets.
  example: |
    {
      "reachability": {
        "kind": "exfiltration_path",
        "exfiltration": {
          "path_to_internet_exists": true,
          "has_wildcard_write": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.reachability.kind
      op: eq
      value: exfiltration_path
    - field: properties.reachability.exfiltration.path_to_internet_exists
      op: eq
      value: true
    - field: properties.reachability.exfiltration.has_wildcard_write
      op: eq
      value: true
