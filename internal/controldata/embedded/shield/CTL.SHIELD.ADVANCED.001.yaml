dsl_version: ctrl.v1
id: CTL.SHIELD.ADVANCED.001
name: Shield Advanced Must Be Enabled for Internet-Facing Resources
description: >
  AWS accounts with internet-facing resources must have Shield Advanced
  enabled with all internet-facing resources registered as protected.
  Shield Standard provides basic DDoS protection automatically. Shield
  Advanced provides volumetric DDoS mitigation at the network edge,
  24/7 DDoS Response Team (DRT) access, cost protection against
  scaling charges during attacks, and attack diagnostics. WAF controls
  protect against application-layer attacks but do not protect against
  volumetric network-layer DDoS that exhausts bandwidth or connection
  capacity before WAF can evaluate requests. A 100 Gbps UDP flood
  cannot be mitigated by WAF rules — it requires scrubbing at the
  network edge. For PHI and financial services, unmitigated DDoS is
  both an operational and compliance risk — HIPAA and PCI-DSS require
  availability of regulated systems.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "SC-5"
  fedramp_moderate: "SC-5"
  hipaa: "164.308(a)(7)"
  pci_dss_v4.0: "1.3.1"
  soc2: "A1.1"
  ccm_v4: ["IVS-09"]
scope_tags:
  - aws
  - shield
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_shield_subscription]
params:
  attack_stage: resilience
  base_impact: 8
  blast_radius:
    type: detection
    scope: account
    multiplier: 1.5
remediation:
  description: >
    Shield Advanced is not subscribed or internet-facing resources are
    not registered as protected. Volumetric DDoS attacks are mitigated
    only by Shield Standard basic protection.
  action: >
    Subscribe to AWS Shield Advanced via the Shield console or API.
    Register all internet-facing resources (ALBs, NLBs, CloudFront
    distributions, Route 53 hosted zones, Elastic IPs) as protected
    resources. Configure Route 53 health checks for protected resources
    to enable proactive engagement by the DDoS Response Team.
  example: |
    {
      "account": {
        "kind": "shield_subscription",
        "shield_advanced": {
          "all_resources_protected": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.account.kind
      op: eq
      value: shield_subscription
    - field: properties.account.shield_advanced.all_resources_protected
      op: eq
      value: false
