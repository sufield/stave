dsl_version: ctrl.v1
id: CTL.SHIELD.DRT.NOACCESS.001
name: Shield DRT Has No IAM Access Configured
description: >
  Shield Advanced is active but the DDoS Response Team (DRT) has no IAM
  role configured for account access. During a DDoS attack, the DRT
  cannot create or modify WAF rules, inspect Shield protections, or
  adjust rate-based rules on your behalf. Manual credential provisioning
  during an attack delays mitigation by the time it takes to create and
  share an IAM role — typically 15-30 minutes of unmitigated attack
  traffic. The DRT role requires shield:* and wafv2:* permissions at
  minimum.
domain: exposure
severity: low
compliance:
  nist_800_53_r5: "SC-5"
  fedramp_moderate: "SC-5"
  soc2: "A1.1"
  ccm_v4: ["IVS-09"]
scope_tags:
  - aws
  - shield
taxonomy:
  - network-perimeter
  - monitoring
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_shield_subscription]
params:
  attack_stage: resilience
  base_impact: 5
  blast_radius:
    type: detection
    scope: account
    multiplier: 1.0
remediation:
  description: >
    Shield Advanced is subscribed but the DRT has no IAM access. During
    an attack, the DRT cannot act without manual credential provisioning.
  action: >
    Create an IAM role with shield:* and wafv2:* permissions and
    associate it via aws shield associate-drt-role --role-arn <arn>.
  example: |
    {
      "account": {
        "kind": "shield_subscription",
        "shield_advanced": {
          "drt_access_configured": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.account.kind
      op: eq
      value: shield_subscription
    - field: properties.account.shield_advanced.drt_access_configured
      op: eq
      value: false
