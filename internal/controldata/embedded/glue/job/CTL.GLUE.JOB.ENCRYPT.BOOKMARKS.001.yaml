dsl_version: ctrl.v1
id: CTL.GLUE.JOB.ENCRYPT.BOOKMARKS.001
name: Glue ETL Jobs Must Encrypt Job Bookmarks
description: >
  Glue ETL jobs must use a security configuration with job bookmark
  encryption enabled (CSE-KMS). Unencrypted bookmarks expose dataset
  paths, partitions, and processing state. Tampered bookmarks can
  trigger data reprocessing or skipping.
domain: encryption
severity: low
compliance:
  nist_800_53_r5: "SC-28"
  ccm_v4: ["CEK-03"]
scope_tags:
  - aws
  - glue
taxonomy:
  - compliance-mapping
  - encryption-at-rest
subtractive_category:
  - S10
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_glue_job]
params:
  attack_stage: collection
remediation:
  description: Glue ETL job does not encrypt job bookmarks.
  action: >
    Create a Glue security configuration with job bookmark encryption
    (CSE-KMS) and attach it to the job.
  example: |
    {
      "compute": {
        "kind": "glue_job",
        "encryption": { "bookmarks_encrypted": true }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: glue_job
    - field: properties.compute.encryption.bookmarks_encrypted
      op: eq
      value: false
