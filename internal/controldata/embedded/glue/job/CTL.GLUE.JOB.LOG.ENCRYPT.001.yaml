dsl_version: ctrl.v1
id: CTL.GLUE.JOB.LOG.ENCRYPT.001
name: Glue ETL Job CloudWatch Logs Must Be Encrypted
description: >
  Glue ETL jobs must use a security configuration with CloudWatch
  Logs encryption enabled (SSE-KMS). Unencrypted log entries can
  expose credentials, PII, connection strings, and schema details.
domain: encryption
severity: medium
compliance:
  nist_800_53_r5: "SC-28"
  soc2: "CC6.7"
  ccm_v4: ["CEK-03"]
scope_tags:
  - aws
  - glue
taxonomy:
  - credential-lifecycle
  - encryption-at-rest
  - logging
type: unsafe_state
classification: state_assertion
params:
  attack_stage: collection
remediation:
  description: Glue ETL job CloudWatch logs are not encrypted.
  action: >
    Create a Glue security configuration with CloudWatch Logs
    encryption (SSE-KMS) and attach it to the job.
  example: |
    {
      "compute": {
        "kind": "glue_job",
        "encryption": { "cloudwatch_encrypted": true }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: glue_job
    - field: properties.compute.encryption.cloudwatch_encrypted
      op: eq
      value: false
