dsl_version: ctrl.v1
id: CTL.EC2.PUBLIC.001
name: EC2 Instances Must Not Have Public IP Addresses
description: >
  EC2 instances should not have public IP addresses unless explicitly
  required. Public IP assignment exposes the instance to direct
  internet access, bypassing network perimeter controls.
domain: exposure
severity: high
compliance:
  cis_aws_v1.4.0: "5.1"
  hipaa: "164.312(e)(1)"
  soc2: "CC6.6"
  pci_dss_v4.0: "1.3.4"
  nist_800_53_r5: "AC-3"
  fedramp_moderate: "AC-3"
  gdpr: "Art.32"
scope_tags:
  - aws
  - ec2
type: unsafe_state
params:
  attack_stage: initial_access
remediation:
  description: >
    EC2 instance has a public IP address. The instance is directly
    reachable from the internet.
  action: >
    Launch instances in private subnets without public IP assignment.
    Use NAT Gateway or VPC endpoints for outbound internet access.
    Use ALB or NLB for inbound traffic that requires internet access.
  example: |
    {
      "compute": {
        "kind": "instance",
        "network": {
          "has_public_ip": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: instance
    - field: properties.compute.network.has_public_ip
      op: eq
      value: true
tests:
  - name: "instance with public IP fails"
    verdict: VIOLATION
    asset:
      asset_id: "i-pub001"
      asset_type: ec2_instance
      vendor: aws
      properties:
        compute:
          kind: instance
          network:
            has_public_ip: true
  - name: "instance without public IP passes"
    verdict: PASS
    asset:
      asset_id: "i-priv001"
      asset_type: ec2_instance
      vendor: aws
      properties:
        compute:
          kind: instance
          network:
            has_public_ip: false
