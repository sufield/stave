dsl_version: ctrl.v1
id: CTL.EC2.IMDSV2.001
name: EC2 Instances Must Require IMDSv2
description: >
  EC2 instances must enforce Instance Metadata Service Version 2 (IMDSv2).
  IMDSv1 is vulnerable to SSRF attacks that can steal instance credentials
  from the metadata endpoint.
domain: exposure
severity: high
compliance:
  cis_aws_v1.4.0: "5.6"
  cis_aws_v3.0: "5.6"
  soc2: "CC6.6"
  pci_dss_v4.0: "2.2.1"
  nist_800_53_r5: "CM-6"
  fedramp_moderate: "CM-6"
  ccm_v4: ["IVS-03", "IVS-04"]
scope_tags:
  - aws
  - ec2
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_ec2_instance
params:
  attack_stage: credential_access
remediation:
  description: >
    EC2 instance does not enforce IMDSv2. Instance credentials are
    vulnerable to SSRF-based credential theft via the metadata endpoint.
  action: >
    Set HttpTokens to required on the instance metadata options. Run:
    aws ec2 modify-instance-metadata-options --instance-id i-xxx
    --http-tokens required --http-endpoint enabled
  example: |
    {
      "compute": {
        "kind": "instance",
        "network": {
          "imdsv2_required": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: instance
    - field: properties.compute.network.imdsv2_required
      op: eq
      value: false
tests:
  - name: "instance with IMDSv2 required passes"
    verdict: PASS
    asset:
      asset_id: "i-test001"
      asset_type: ec2_instance
      vendor: aws
      properties:
        compute:
          kind: instance
          network:
            imdsv2_required: true
  - name: "instance with IMDSv2 not required fails"
    verdict: VIOLATION
    asset:
      asset_id: "i-test002"
      asset_type: ec2_instance
      vendor: aws
      properties:
        compute:
          kind: instance
          network:
            imdsv2_required: false
  - name: "non-instance asset passes"
    verdict: PASS
    asset:
      asset_id: "sg-test001"
      asset_type: ec2_security_group
      vendor: aws
      properties:
        compute:
          kind: security_group
