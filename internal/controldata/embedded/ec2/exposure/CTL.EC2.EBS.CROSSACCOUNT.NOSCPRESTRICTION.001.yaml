dsl_version: ctrl.v1
id: CTL.EC2.EBS.CROSSACCOUNT.NOSCPRESTRICTION.001
name: No SCP Prevents Public Snapshot Sharing in Member Accounts
description: >
  AWS Organizations is in use but no Service
  Control Policy prevents member accounts from
  calling ModifySnapshotAttribute with
  createVolumePermission: all. Without an SCP,
  any admin in any member account can make any
  snapshot public — a single API call exposing
  disk contents to every AWS account.
domain: governance
severity: high
compliance:
  cis_aws_v3.0: "1.4"
  soc2: "CC6.1, CC6.6"
  nist_800_53_r5: "AC-3, AC-4, SC-28"
  pci_dss_v4.0: "7.2"
  fedramp_moderate: "AC-3, AC-4"
  hipaa: "164.312(a)(1)"
  iso_27001_2022: "A.5.15, A.5.18"
  ccm_v4: ["IAM-09"]
scope_tags:
  - aws
  - ec2
  - ebs
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_ec2_account
params:
  attack_stage: privilege_escalation
  blast_radius:
    type: data
    scope: organization
    multiplier: 4.0
remediation:
  description: >
    No SCP at the organization level prevents
    public snapshot sharing.
  action: >
    Attach an SCP at the organization root or
    relevant OUs that denies
    ec2:ModifySnapshotAttribute when the request
    parameter Group equals "all" (the public-
    sharing pattern). Test in a sandbox OU
    first to confirm legitimate snapshot-share
    flows still work, then propagate to all
    OUs. Combine with the equivalent SCP for
    s3:PutBucketAcl, rds:ModifyDBSnapshot
    Attribute, and other public-sharing surfaces.
  example: |
    {
      "compute": {
        "kind": "ec2_account",
        "ebs": {
          "is_org_account": true,
          "has_scp_deny_public_snapshot": true,
          "scp_covers_modify_snapshot": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: ec2_account
    - field: properties.compute.ebs.is_org_account
      op: eq
      value: true
    - field: properties.compute.ebs.has_scp_deny_public_snapshot
      op: eq
      value: false
defect: >
  No SCP prevents member accounts from making
  EBS snapshots public.
infection: >
  ModifySnapshotAttribute with
  createVolumePermission: all is the one-API-
  call data breach. Without an SCP that denies
  this action across the organization, any
  admin in any member account can make any
  snapshot public. A compromised admin account,
  a misconfigured automation script, or an
  insider can expose production database
  snapshots, application images, and operating
  system volumes to the world. An SCP with
  Deny on ec2:ModifySnapshotAttribute scoped
  to the public-sharing pattern prevents
  exposure at the organizational level —
  regardless of any individual account's IAM
  configuration.
failure: >
  Organizational snapshot exposure risk. No SCP
  prevents public snapshot sharing — any member
  account admin can expose any snapshot.
tests:
  - name: org account without SCP fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:ec2:us-east-1:111122223333:account"
      asset_type: aws_ec2_account
      vendor: aws
      properties:
        compute:
          kind: ec2_account
          ebs:
            is_org_account: true
            has_scp_deny_public_snapshot: false
            scp_covers_modify_snapshot: false
  - name: org account with SCP passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:ec2:us-east-1:111122223333:account"
      asset_type: aws_ec2_account
      vendor: aws
      properties:
        compute:
          kind: ec2_account
          ebs:
            is_org_account: true
            has_scp_deny_public_snapshot: true
            scp_covers_modify_snapshot: true
  - name: standalone account does not fire
    verdict: PASS
    asset:
      asset_id: "arn:aws:ec2:us-east-1:111122223333:account"
      asset_type: aws_ec2_account
      vendor: aws
      properties:
        compute:
          kind: ec2_account
          ebs:
            is_org_account: false
            has_scp_deny_public_snapshot: false
