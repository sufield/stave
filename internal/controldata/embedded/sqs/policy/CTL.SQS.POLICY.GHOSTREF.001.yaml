dsl_version: ctrl.v1
id: CTL.SQS.POLICY.GHOSTREF.001
name: SQS Queue Policy Must Not Reference Deleted Principals
description: >
  SQS queue policies must not grant access to principal ARNs that
  don't exist in the IAM inventory. A recreated principal matching
  the ghost ARN inherits SendMessage (injection) or ReceiveMessage
  (interception) access. Resource-based policies evaluate ARN strings,
  not unique IDs.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["IAM-16", "DSP-17"]
scope_tags: [aws, sqs]
taxonomy:
  - compliance-mapping
  - trust-decay
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_sqs_queue]
params:
  attack_stage: persistence
remediation:
  description: SQS queue policy references a principal that no longer exists.
  action: Remove the ghost principal ARN from the queue policy.
  example: |
    {"messaging": {"kind": "queue", "policy": {"has_ghost_principal": false}}}
unsafe_predicate:
  all:
    - field: properties.messaging.kind
      op: eq
      value: queue
    - field: properties.messaging.policy.has_ghost_principal
      op: eq
      value: true
