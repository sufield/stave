dsl_version: ctrl.v1
id: CTL.K8S.APISERVER.ANON.001
name: API Server Anonymous Authentication Must Be Disabled
description: >
  The Kubernetes API server must not allow anonymous authentication.
  Anonymous auth permits unauthenticated requests to the API, enabling
  reconnaissance and potential cluster compromise.
domain: exposure
severity: critical
compliance:
  cis_k8s_v1.9: "1.2.1"
  ccm_v4: ["IVS-04"]
scope_tags:
  - kubernetes
  - apiserver
taxonomy:
  - compliance-mapping
subtractive_category:
  - S03
type: unsafe_state
classification: state_assertion
applicable_asset_types: [k8s_apiserver]
params:
  attack_stage: initial_access
remediation:
  description: >
    API server anonymous authentication is enabled. Unauthenticated
    requests are accepted.
  action: >
    Set --anonymous-auth=false on the API server. For managed clusters,
    verify the provider disables anonymous auth by default.
unsafe_predicate:
  all:
    - field: type
      op: eq
      value: k8s_apiserver
    - field: properties.apiserver.anonymous_auth_enabled
      op: eq
      value: true
