dsl_version: ctrl.v1
id: CTL.K8S.APISERVER.SA.KEY.001
name: API Server Service Account Key File Must Be Set
description: >
  The API server must be configured with --service-account-key-file
  to verify service account tokens with a dedicated key pair.
domain: exposure
severity: high
compliance:
  cis_k8s_v1.9: "1.2.28"
  ccm_v4: ["IVS-04"]
scope_tags:
  - kubernetes
  - apiserver
taxonomy:
  - compliance-mapping
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
remediation:
  description: >
    API server service account key file is not configured. Service
    account tokens cannot be properly verified.
  action: >
    Set --service-account-key-file on the API server.
unsafe_predicate:
  all:
    - field: type
      op: eq
      value: k8s_apiserver
    - field: properties.apiserver.service_account_key_file
      op: missing
      value: true
