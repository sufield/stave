dsl_version: ctrl.v1
id: CTL.K8S.APISERVER.PROFILING.001
name: API Server Profiling Must Be Disabled
description: >
  The API server profiling endpoint must be disabled. Profiling exposes
  system and program details useful for attackers to identify
  vulnerabilities and plan exploitation.
domain: exposure
severity: low
compliance:
  cis_k8s_v1.9: "1.2.18"
  ccm_v4: ["IVS-04"]
scope_tags:
  - kubernetes
  - apiserver
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types: [k8s_resource]
params:
  attack_stage: discovery
remediation:
  description: >
    API server profiling is enabled, exposing system internals.
  action: >
    Set --profiling=false on the API server.
unsafe_predicate:
  all:
    - field: type
      op: eq
      value: k8s_apiserver
    - field: properties.apiserver.profiling_enabled
      op: eq
      value: true
