dsl_version: ctrl.v1
id: CTL.K8S.ETCD.CERT.001
name: etcd Must Use TLS Certificates
description: >
  etcd must be configured with TLS certificate and key files. Without
  TLS, all cluster state (including Secrets) is transmitted in cleartext.
domain: exposure
severity: critical
compliance:
  cis_k8s_v1.9: "2.1"
  ccm_v4: ["IVS-04"]
scope_tags:
  - kubernetes
  - etcd
taxonomy:
  - compliance-mapping
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
applicable_asset_types: [k8s_resource]
params:
  attack_stage: credential_access
remediation:
  description: >
    etcd is not configured with TLS certificates.
  action: >
    Set --cert-file and --key-file on the etcd server.
unsafe_predicate:
  all:
    - field: type
      op: eq
      value: k8s_etcd
    - any:
        - field: properties.etcd.cert_file
          op: missing
          value: true
        - field: properties.etcd.key_file
          op: missing
          value: true
