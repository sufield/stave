dsl_version: ctrl.v1
id: CTL.K8S.ETCD.PEER.KEY.001
name: etcd Peer Key File Must Be Set
description: >
  etcd must be configured with a peer key file for mutual TLS between
  etcd cluster members. Without the private key, peer TLS cannot be
  established and inter-node communication is insecure.
domain: exposure
severity: high
compliance:
  cis_k8s_v1.9: "2.5"
  ccm_v4: ["IVS-04"]
scope_tags:
  - kubernetes
  - etcd
taxonomy:
  - compliance-mapping
  - credential-lifecycle
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types: [k8s_etcd]
params:
  attack_stage: credential_access
remediation:
  description: >
    etcd peer key file is not configured. Peer mutual TLS cannot be
    established.
  action: >
    Set --peer-key-file on the etcd server pointing to the private key
    corresponding to the peer certificate.
unsafe_predicate:
  all:
    - field: type
      op: eq
      value: k8s_etcd
    - field: properties.etcd.peer_key_file
      op: missing
      value: true
