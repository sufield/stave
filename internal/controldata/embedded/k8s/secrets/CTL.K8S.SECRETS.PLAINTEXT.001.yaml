dsl_version: ctrl.v1
id: CTL.K8S.SECRETS.PLAINTEXT.001
name: Pods Must Not Mount Secrets as Environment Variables
description: >
  Secrets should be mounted as files, not environment variables.
  Environment variables are visible in process listings, crash dumps,
  and container inspection output, increasing the risk of credential
  exposure.
domain: exposure
severity: medium
compliance:
  cis_k8s_v1.8.0: "5.4.1"
  ccm_v4: ["CEK-03"]
scope_tags:
  - kubernetes
  - secrets
type: unsafe_state
params:
  attack_stage: exfiltration
remediation:
  description: >
    Pod spec mounts Secrets as environment variables. Secret values
    appear in process listings and container inspection.
  action: >
    Mount Secrets as volumes instead of environment variables. Use
    projected volumes with restrictive file permissions (0400).
  example: |
    {
      "secrets": {
        "kind": "pod",
        "has_env_secrets": false
      }
    }
unsafe_predicate:
  all:
    - field: properties.secrets.kind
      op: eq
      value: pod
    - field: properties.secrets.has_env_secrets
      op: eq
      value: true
