dsl_version: ctrl.v1
id: CTL.K8S.CM.ROOT.CA.001
name: Controller Manager Root CA File Must Be Set
description: >
  The controller manager must have --root-ca-file configured. This CA
  bundle is injected into each service account token secret, allowing
  pods to verify the API server's TLS certificate and preventing
  man-in-the-middle attacks.
domain: exposure
severity: high
compliance:
  cis_k8s_v1.9: "1.3.5"
  ccm_v4: ["IVS-04"]
scope_tags:
  - kubernetes
  - controller_manager
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
remediation:
  description: >
    Controller manager root CA file is not set. Service account tokens
    cannot verify the API server certificate.
  action: >
    Set --root-ca-file on the controller manager pointing to the
    cluster CA bundle.
unsafe_predicate:
  all:
    - field: type
      op: eq
      value: k8s_controller_manager
    - field: properties.controller_manager.root_ca_file
      op: missing
      value: true
