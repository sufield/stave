dsl_version: ctrl.v1
id: CTL.K8S.RBAC.WILDCARD.001
name: ClusterRoles Must Not Use Wildcard Resources or Verbs
description: >
  Kubernetes ClusterRoles must not grant wildcard (*) access to resources
  or verbs. Wildcard grants provide cluster-wide permissions that bypass
  the principle of least privilege.
domain: exposure
severity: critical
compliance:
  cis_k8s_v1.8.0: "5.1.3"
  ccm_v4: ["IAM-05", "IAM-16"]
scope_tags:
  - kubernetes
  - rbac
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
params:
  attack_stage: privilege_escalation
remediation:
  description: >
    ClusterRole uses wildcard resources or verbs. Any pod with this role
    can access any resource in the cluster.
  action: >
    Replace wildcard entries with explicit resource names and verbs.
    Use Roles (namespace-scoped) instead of ClusterRoles where possible.
  example: |
    {
      "rbac": {
        "kind": "cluster_role",
        "has_wildcard_resources": false,
        "has_wildcard_verbs": false
      }
    }
unsafe_predicate:
  all:
    - field: properties.rbac.kind
      op: eq
      value: cluster_role
    - any:
        - field: properties.rbac.has_wildcard_resources
          op: eq
          value: true
        - field: properties.rbac.has_wildcard_verbs
          op: eq
          value: true
