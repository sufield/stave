dsl_version: ctrl.v1
id: CTL.K8S.IMDS.BLOCK.001
name: Cluster Must Have NetworkPolicy Blocking Pod Egress to IMDS
description: >
  Kubernetes clusters must have a NetworkPolicy blocking pod egress
  to the cloud instance metadata service at 169.254.169.254. A pod
  with hostNetwork=true and CAP_NET_RAW can intercept IMDS traffic
  and inject crafted responses containing attacker-controlled SSH
  keys, gaining root access to the node. A NetworkPolicy blocking
  169.254.169.254/32 egress prevents this escalation even when pod
  security controls fail.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "AC-4"
  mitre_attack: "TA0006"
  ccm_v4: ["IVS-03", "IVS-04", "IVS-06"]
  owasp_subtractive: "S01"
  subtractive_tier: "deletion"
scope_tags:
  - kubernetes
taxonomy:
  - compute-hardening
  - credential-lifecycle
  - network-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types: [k8s_cluster]
params:
  attack_stage: credential_access
remediation:
  description: >
    No NetworkPolicy blocks pod egress to the instance metadata
    service (169.254.169.254). Pods with hostNetwork and CAP_NET_RAW
    can spoof IMDS responses to inject SSH keys.
  action: >
    Apply a NetworkPolicy in every namespace blocking egress to
    169.254.169.254/32. For AWS, also enforce IMDSv2 with hop
    limit 1 on all node groups.
unsafe_predicate:
  all:
    - field: properties.network_policies.blocks_imds_egress
      op: eq
      value: false
