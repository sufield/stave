dsl_version: ctrl.v1
id: CTL.K8S.NETPOL.EGRESS.001
name: Cluster Must Have Egress Network Policies
description: >
  The cluster must have egress network policies defined. Without
  egress policies, compromised pods can freely communicate with
  external command-and-control servers, exfiltrate data, or attack
  other services outside the cluster.
domain: exposure
severity: medium
compliance:
  cis_k8s_v1.9: "5.3.2"
  ccm_v4: ["IVS-03", "IVS-06"]
scope_tags:
  - kubernetes
  - network
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types: [k8s_cluster]
params:
  attack_stage: exfiltration
remediation:
  description: >
    No egress network policies exist. Pods can send traffic to any
    external destination without restriction.
  action: >
    Create egress NetworkPolicies to restrict outbound traffic from
    pods to only approved destinations and ports.
unsafe_predicate:
  all:
    - field: type
      op: eq
      value: k8s_cluster
    - field: properties.network.has_egress_policy
      op: eq
      value: false
