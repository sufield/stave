dsl_version: ctrl.v1
id: CTL.K8S.POD.PRIVILEGED.001
name: Containers Must Not Run in Privileged Mode
description: >
  Pods must not run privileged containers. Privileged containers have
  full access to the host's devices, kernel capabilities, and
  namespaces, effectively granting root-level access to the node.
domain: exposure
severity: critical
compliance:
  cis_k8s_v1.9: "5.2.1"
  ccm_v4: ["IVS-04"]
scope_tags:
  - kubernetes
  - pod_security
taxonomy:
  - compliance-mapping
  - compute-hardening
  - network-perimeter
subtractive_category:
  - S02
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types: [k8s_pod]
params:
  attack_stage: privilege_escalation
remediation:
  description: >
    Container is running in privileged mode with unrestricted host
    access.
  action: >
    Set securityContext.privileged=false on all containers. Use
    specific capabilities instead of privileged mode.
unsafe_predicate:
  all:
    - field: type
      op: eq
      value: k8s_pod
    - field: properties.pod.privileged
      op: eq
      value: true
