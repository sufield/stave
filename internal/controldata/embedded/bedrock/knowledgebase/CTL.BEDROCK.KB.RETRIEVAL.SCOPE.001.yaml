dsl_version: ctrl.v1
id: CTL.BEDROCK.KB.RETRIEVAL.SCOPE.001
name: KB Retrieval Role Must Not Reach Data Beyond Declared Sources
description: >
  A Bedrock Knowledge Base declares its data sources (specific S3 prefixes,
  OpenSearch collections). The retrieval role must not be able to reach data
  outside that declared set — not through a wildcard S3 prefix that happens to
  match other buckets, not through an AssumeRole hop to a role with broader
  access, and not through a resource-based policy on some other bucket that
  grants the retrieval role. Any such path lets the retrieval connector pull
  data the Knowledge Base was never scoped to serve.

  This is a compound (graph-reachability) control over a resource type that
  bridges IAM to data stores. The reasoning layer parses the KB's declared
  dataSourceConfiguration, resolves what the retrieval role can actually reach
  (IAM policies with wildcard expansion + assume chains + resource-based
  policies), and emits ai.knowledge_base.retrieval_exceeds_declared_scope when
  the reachable set is not contained in the declared set. The reasoning spec —
  Soufflé reachability plus a Z3 cross-check, including wildcard-prefix and
  resource-policy edges — lives at examples/rag-retrieval-scope/.
domain: identity
severity: high
scope: compound
corpus_reference: MITRE:T1530
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_bedrock_knowledge_base
compliance:
  nist_800_53_r5: "AC-6"
  soc2: "CC6.1"
  ccm_v4: ["AIS-09", "DSP-17"]
scope_tags:
  - aws
  - bedrock
  - rag
taxonomy:
  - compliance-mapping
observation_fields:
  - ai.kind
  - ai.knowledge_base.retrieval_exceeds_declared_scope
remediation:
  description: >
    The Knowledge Base retrieval role can reach data that is not a declared KB
    data source — via a wildcard prefix, an assume-role hop, or a resource-based
    policy on another store.
  action: >
    Scope the retrieval role's resource ARNs to exactly the declared data
    sources (no wildcard prefixes that overmatch). Remove assume-role edges that
    widen reach. Audit bucket/collection resource policies for grants to the
    retrieval role on non-source stores and remove them.
  example: |
    {
      "ai": {
        "kind": "bedrock_knowledge_base",
        "knowledge_base": { "retrieval_exceeds_declared_scope": false }
      }
    }
unsafe_predicate:
  all:
    - field: properties.ai.kind
      op: eq
      value: bedrock_knowledge_base
    - field: properties.ai.knowledge_base.retrieval_exceeds_declared_scope
      op: eq
      value: true
defect: >
  The KB retrieval role can reach data outside the KB's declared data sources.
infection: >
  The retrieval connector becomes an exfiltration path: a query can surface data
  from buckets/collections the Knowledge Base never indexed, bypassing the
  intended data boundary.
failure: >
  Sensitive records outside the KB's scope are returned through the retrieval
  API because the retrieval role's reach — by wildcard, hop, or resource policy —
  exceeded the declared sources.
tests:
  - name: retrieval role with a wildcard prefix overmatching a non-source bucket fires (vulnerable)
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:bedrock:us-east-1:111122223333:knowledge-base/hr-docs-kb"
      asset_type: aws_bedrock_knowledge_base
      vendor: aws
      properties:
        ai:
          kind: bedrock_knowledge_base
          knowledge_base:
            retrieval_exceeds_declared_scope: true
  - name: retrieval role scoped exactly to the declared source passes (false-positive trap)
    verdict: PASS
    asset:
      asset_id: "arn:aws:bedrock:us-east-1:111122223333:knowledge-base/product-kb"
      asset_type: aws_bedrock_knowledge_base
      vendor: aws
      properties:
        ai:
          kind: bedrock_knowledge_base
          knowledge_base:
            retrieval_exceeds_declared_scope: false
  - name: non-source bucket policy granting the retrieval role fires (false-negative trap — resource-based path)
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:bedrock:us-east-1:111122223333:knowledge-base/legal-kb"
      asset_type: aws_bedrock_knowledge_base
      vendor: aws
      properties:
        ai:
          kind: bedrock_knowledge_base
          knowledge_base:
            retrieval_exceeds_declared_scope: true
