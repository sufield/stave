dsl_version: ctrl.v1
id: CTL.BEDROCK.ACCESS.MODELSCOPE.001
name: Bedrock Model Access Allows All Foundation Models
description: >
  AWS account's Bedrock model access configuration enables all
  available foundation models rather than restricting to an approved
  subset. When all models are enabled, any IAM principal with
  bedrock:InvokeModel permission can call any model — including
  expensive models (increasing cost blast radius) and models with
  capabilities beyond what the workload requires (e.g. code
  generation, image generation). Restricting model access to the
  approved set limits both cost exposure and the capability surface
  available to compromised credentials. The model access list is
  an account-level setting managed through the Bedrock console
  or bedrock:PutFoundationModelEntitlement API.
domain: governance
severity: medium
compliance:
  nist_800_53_r5: "AC-6, CM-7"
  soc2: "CC6.1"
  ccm_v4: ["IAM-05"]
scope_tags:
  - aws
  - bedrock
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - least-privilege
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_bedrock_access
params:
  attack_stage: discovery
remediation:
  description: >
    Bedrock model access enables all foundation models. Any
    IAM principal with InvokeModel can call any model.
  action: >
    Review the enabled models in the Bedrock console under Model
    access. Disable models not required by any workload. Enable
    only the specific models each team needs and enforce per-model
    IAM conditions (bedrock:InvokeModel with Resource ARN scoped
    to specific model IDs) in IAM policies.
  example: |
    {
      "ai": {
        "kind": "bedrock_access",
        "access": { "allows_all_models": false }
      }
    }
unsafe_predicate:
  all:
    - field: properties.ai.kind
      op: eq
      value: bedrock_access
    - field: properties.ai.access.allows_all_models
      op: eq
      value: true
observation_fields:
  - ai.kind
  - ai.access.allows_all_models
tests:
  - name: "all models accessible — fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:bedrock:us-east-1:111122223333:model-access/account"
      asset_type: aws_bedrock_access
      vendor: aws
      properties:
        ai:
          kind: bedrock_access
          access:
            allows_all_models: true
  - name: "restricted model access — passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:bedrock:us-east-1:111122223333:model-access/account"
      asset_type: aws_bedrock_access
      vendor: aws
      properties:
        ai:
          kind: bedrock_access
          access:
            allows_all_models: false
