dsl_version: ctrl.v1
id: CTL.BEDROCK.GUARDRAIL.TOPIC.001
name: Bedrock Guardrails Must Define Topic Policy
description: >
  Bedrock guardrails must configure a topic policy to deny specific
  subjects the model should not engage with. Without a topic policy,
  the guardrail relies solely on content filters, which operate on
  toxicity categories but cannot enforce business-specific
  restrictions — for example, preventing a customer-facing model
  from discussing competitors, providing medical advice, or
  generating legal opinions.
domain: governance
severity: medium
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["AIS-06"]
scope_tags:
  - aws
  - bedrock
  - ai
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_bedrock_guardrail
params:
  attack_stage: impact
remediation:
  description: Bedrock guardrail has no topic policy defined.
  action: >
    Add a topic policy to the guardrail with denied topics
    appropriate for the model's use case. Define clear topic
    definitions and sample phrases for each denied topic.
  example: |
    {
      "ai": {
        "kind": "bedrock_guardrail",
        "guardrail": { "topic_policy_defined": true }
      }
    }
unsafe_predicate:
  all:
    - field: properties.ai.kind
      op: eq
      value: bedrock_guardrail
    - field: properties.ai.guardrail.topic_policy_defined
      op: eq
      value: false
