dsl_version: ctrl.v1
id: CTL.BEDROCK.AGENTCORE.STALE.001
name: AgentCore Runtime Must Not Be Idle Beyond Threshold
description: >
  AgentCore runtime has not been invoked within the observation
  window (default 30 days). A stale runtime retains its execution
  role credentials, network configuration, and tool registrations
  — a dormant attack surface with active permissions. The
  collector pre-computes whether the runtime's last invocation
  exceeds the staleness threshold. Mirrors
  CTL.BEDROCK.AGENT.STALE.001 applied to AgentCore runtimes.
domain: governance
severity: low
compliance:
  owasp_nhi: "NHI1"
  nist_800_53_r5: "AC-2(3)"
  soc2: "CC6.1"
  ccm_v4: ["IAM-13"]
scope_tags:
  - aws
  - bedrock
taxonomy:
  - credential-lifecycle
  - resource-sprawl
  - trust-decay
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_bedrock_agentcore_runtime
params:
  attack_stage: persistence
remediation:
  description: >
    AgentCore runtime has been idle past the staleness threshold.
    Decide whether to delete or archive.
  action: >
    Either delete the runtime and its execution role if the
    workload is truly abandoned, or document the runtime's
    expected idle duration with a reviewed_at tag and a
    scheduled review date. Reduce blast radius by detaching
    high-privilege managed policies from the role even while
    the runtime stays.
  example: |
    {
      "ai": {
        "kind": "bedrock_agentcore_runtime",
        "runtime": { "is_idle": false }
      }
    }
unsafe_predicate:
  all:
    - field: properties.ai.kind
      op: eq
      value: bedrock_agentcore_runtime
    - field: properties.ai.runtime.is_idle
      op: eq
      value: true
observation_fields:
  - ai.kind
  - ai.runtime.is_idle
tests:
  - name: "idle runtime — fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:bedrock:us-east-1:111122223333:agent-runtime/rt-IDLE"
      asset_type: aws_bedrock_agentcore_runtime
      vendor: aws
      properties:
        ai:
          kind: bedrock_agentcore_runtime
          runtime:
            is_idle: true
  - name: "active runtime — passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:bedrock:us-east-1:111122223333:agent-runtime/rt-ACTIVE"
      asset_type: aws_bedrock_agentcore_runtime
      vendor: aws
      properties:
        ai:
          kind: bedrock_agentcore_runtime
          runtime:
            is_idle: false
