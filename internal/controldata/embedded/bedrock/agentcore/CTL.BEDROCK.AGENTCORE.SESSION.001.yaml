dsl_version: ctrl.v1
id: CTL.BEDROCK.AGENTCORE.SESSION.001
name: AgentCore Runtime Session Lifetime Must Be Bounded
description: >
  AgentCore runtime lifecycleConfiguration.maxLifetime exceeds the
  recommended threshold. Long-lived runtime sessions extend the
  window during which a compromised agent retains its execution
  role credentials, memory context, and tool access. The collector
  pre-computes whether maxLifetime exceeds the threshold (default
  28800 seconds / 8 hours). Shorter lifetimes force credential
  rotation and limit the blast radius of prompt-injection or
  credential-theft attacks.
domain: identity
severity: medium
compliance:
  owasp_nhi: "NHI7"
  nist_800_53_r5: "AC-12"
  soc2: "CC6.1"
  hipaa: "164.312(a)(2)(iii)"
  ccm_v4: ["IAM-13"]
scope_tags:
  - aws
  - bedrock
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - trust-decay
subtractive_category:
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_bedrock_agentcore_runtime
params:
  attack_stage: persistence
remediation:
  description: >
    AgentCore runtime session lifetime exceeds the recommended
    bound. Long sessions extend the credential window.
  action: >
    Reduce lifecycleConfiguration.maxLifetime to 28800 seconds
    (8 hours) or less. For agents handling sensitive data, 3600
    seconds (1 hour) is the tighter recommendation. Update via
    UpdateAgentRuntime.
  example: |
    {
      "ai": {
        "kind": "bedrock_agentcore_runtime",
        "runtime": { "max_lifetime_excessive": false }
      }
    }
unsafe_predicate:
  all:
    - field: properties.ai.kind
      op: eq
      value: bedrock_agentcore_runtime
    - field: properties.ai.runtime.max_lifetime_excessive
      op: eq
      value: true
observation_fields:
  - ai.kind
  - ai.runtime.max_lifetime_excessive
tests:
  - name: "runtime with excessive lifetime — fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:bedrock:us-east-1:111122223333:agent-runtime/rt-LONG"
      asset_type: aws_bedrock_agentcore_runtime
      vendor: aws
      properties:
        ai:
          kind: bedrock_agentcore_runtime
          runtime:
            max_lifetime_excessive: true
  - name: "runtime with bounded lifetime — passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:bedrock:us-east-1:111122223333:agent-runtime/rt-SHORT"
      asset_type: aws_bedrock_agentcore_runtime
      vendor: aws
      properties:
        ai:
          kind: bedrock_agentcore_runtime
          runtime:
            max_lifetime_excessive: false
