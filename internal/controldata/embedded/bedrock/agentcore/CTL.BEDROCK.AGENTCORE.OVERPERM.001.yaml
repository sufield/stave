dsl_version: ctrl.v1
id: CTL.BEDROCK.AGENTCORE.OVERPERM.001
name: AgentCore Runtime Execution Role Must Scope Permissions
description: >
  AgentCore runtime execution role grants overly broad permissions
  — the role can reach resources far beyond what the runtime's
  registered tools require. An attacker who controls the agent's
  prompt or tool input can leverage the broad role to read, write,
  or delete resources the agent should never touch. The collector
  pre-computes whether the role's effective permissions exceed the
  runtime's declared tool scope. Mirrors
  CTL.BEDROCK.AGENT.OVERPERM.S3.001 applied to AgentCore runtimes.
domain: identity
severity: high
compliance:
  owasp_nhi: "NHI5"
  nist_800_53_r5: "AC-6"
  soc2: "CC6.1"
  hipaa: "164.312(a)(1)"
  ccm_v4: ["IAM-04", "IAM-05"]
scope_tags:
  - aws
  - bedrock
taxonomy:
  - compliance-mapping
  - least-privilege
  - ai-guardrails
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_bedrock_agentcore_runtime
params:
  attack_stage: exfiltration
remediation:
  description: >
    AgentCore runtime execution role has overly broad permissions.
    The role's access scope exceeds the runtime's tool footprint.
  action: >
    Scope the role's permissions to the specific resources the
    runtime's tools require. Use resource-based conditions
    (aws:ResourceTag, StringEquals on prefix) to narrow access.
    Review the role with IAM Access Analyzer to identify unused
    permissions.
  example: |
    {
      "ai": {
        "kind": "bedrock_agentcore_runtime",
        "runtime": { "role_scope_broad": false }
      }
    }
unsafe_predicate:
  all:
    - field: properties.ai.kind
      op: eq
      value: bedrock_agentcore_runtime
    - field: properties.ai.runtime.role_scope_broad
      op: eq
      value: true
observation_fields:
  - ai.kind
  - ai.runtime.role_scope_broad
tests:
  - name: "runtime with broad role — fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:bedrock:us-east-1:111122223333:agent-runtime/rt-BROAD"
      asset_type: aws_bedrock_agentcore_runtime
      vendor: aws
      properties:
        ai:
          kind: bedrock_agentcore_runtime
          runtime:
            role_scope_broad: true
  - name: "runtime with scoped role — passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:bedrock:us-east-1:111122223333:agent-runtime/rt-SCOPED"
      asset_type: aws_bedrock_agentcore_runtime
      vendor: aws
      properties:
        ai:
          kind: bedrock_agentcore_runtime
          runtime:
            role_scope_broad: false
