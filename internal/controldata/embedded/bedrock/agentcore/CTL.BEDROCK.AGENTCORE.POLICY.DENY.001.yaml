dsl_version: ctrl.v1
id: CTL.BEDROCK.AGENTCORE.POLICY.DENY.001
name: AgentCore Policy Must Include Explicit Forbid Rules
description: >
  AgentCore Policy must include explicit forbid rules.
  Cedar/Dogwood use deny-by-default — a request with no matching
  permit is denied. But a policy with only permit rules and no
  explicit forbid is permissive by omission: it relies on the
  absence of a permit to deny, which is fragile under policy
  drift. A new permit added by another team member silently
  widens the allowed set. Explicit forbid rules create a
  hard boundary that survives permit additions.
  Schema gap: this control is inert until a collector populates the
  properties.ai.runtime.policy_has_forbid field. See
  docs-internal/schema-gaps/agentcore-policy.md.
domain: governance
severity: medium
compliance:
  owasp_nhi: "NHI5"
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["IAM-04"]
scope_tags:
  - aws
  - bedrock
taxonomy:
  - compliance-mapping
  - ai-guardrails
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_bedrock_agentcore_runtime
params:
  attack_stage: privilege_escalation
remediation:
  description: >
    AgentCore Policy has no explicit forbid rules. The policy
    relies entirely on permit-only authorization.
  action: >
    Add explicit forbid rules for destructive operations
    (data deletion, privilege changes, cross-account actions)
    and sensitive data access. Forbid rules in Cedar/Dogwood
    override permits, creating hard boundaries that survive
    permit drift.
  example: |
    {
      "ai": {
        "kind": "bedrock_agentcore_runtime",
        "runtime": { "policy_has_forbid": true }
      }
    }
unsafe_predicate:
  all:
    - field: properties.ai.kind
      op: eq
      value: bedrock_agentcore_runtime
    - field: properties.ai.runtime.policy_attached
      op: eq
      value: true
    - field: properties.ai.runtime.policy_has_forbid
      op: eq
      value: false
observation_fields:
  - ai.kind
  - ai.runtime.policy_attached
  - ai.runtime.policy_has_forbid
defect: >
  AgentCore Policy has no explicit forbid rules.
infection: >
  The policy relies on deny-by-default with permit-only rules.
  A new permit added by another team member silently widens the
  allowed set. No hard boundary prevents destructive actions.
failure: >
  Permit-only policy. A policy drift event (new permit) can
  silently grant destructive tool access with no forbid
  rule to catch it.
tests:
  - name: "policy without forbid rules — fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:bedrock:us-east-1:111122223333:agent-runtime/rt-NOFORBID"
      asset_type: aws_bedrock_agentcore_runtime
      vendor: aws
      properties:
        ai:
          kind: bedrock_agentcore_runtime
          runtime:
            policy_attached: true
            policy_has_forbid: false
  - name: "policy with forbid rules — passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:bedrock:us-east-1:111122223333:agent-runtime/rt-FORBID"
      asset_type: aws_bedrock_agentcore_runtime
      vendor: aws
      properties:
        ai:
          kind: bedrock_agentcore_runtime
          runtime:
            policy_attached: true
            policy_has_forbid: true
