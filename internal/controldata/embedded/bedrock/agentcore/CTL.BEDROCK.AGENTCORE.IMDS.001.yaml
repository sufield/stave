dsl_version: ctrl.v1
id: CTL.BEDROCK.AGENTCORE.IMDS.001
name: AgentCore Runtime Must Require IMDSv2
description: >
  AgentCore runtime metadataConfiguration.requireMMDSV2 is false —
  the runtime accepts IMDSv1 requests. IMDSv1 uses a simple GET
  without a session token, making it exploitable via SSRF attacks:
  any code running in the agent that can issue HTTP requests to
  169.254.169.254 can steal the runtime's IAM credentials. IMDSv2
  requires a PUT-based token exchange that SSRF payloads typically
  cannot perform. This mirrors CTL.EC2.IMDSV2.001 applied to the
  AgentCore execution environment.
domain: identity
severity: high
compliance:
  owasp_nhi: "NHI5"
  nist_800_53_r5: "AC-3, SC-23"
  soc2: "CC6.1"
  hipaa: "164.312(a)(1)"
  ccm_v4: ["IAM-04", "IVS-04"]
  owasp_subtractive: "S01"
  subtractive_tier: "deletion"
scope_tags:
  - aws
  - bedrock
taxonomy:
  - compliance-mapping
  - compute-hardening
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_bedrock_agentcore_runtime
params:
  attack_stage: credential_access
corpus_reference: "MITRE:T1552.005"
remediation:
  description: >
    AgentCore runtime allows IMDSv1 metadata requests — SSRF can
    steal the runtime's IAM credentials.
  action: >
    Set metadataConfiguration.requireMMDSV2 to true on the
    AgentCore runtime via UpdateAgentRuntime.
  example: |
    {
      "ai": {
        "kind": "bedrock_agentcore_runtime",
        "runtime": { "require_imdsv2": true }
      }
    }
unsafe_predicate:
  all:
    - field: properties.ai.kind
      op: eq
      value: bedrock_agentcore_runtime
    - field: properties.ai.runtime.require_imdsv2
      op: eq
      value: false
observation_fields:
  - ai.kind
  - ai.runtime.require_imdsv2
tests:
  - name: "runtime allows IMDSv1 — fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:bedrock:us-east-1:111122223333:agent-runtime/rt-IMDSV1"
      asset_type: aws_bedrock_agentcore_runtime
      vendor: aws
      properties:
        ai:
          kind: bedrock_agentcore_runtime
          runtime:
            require_imdsv2: false
  - name: "runtime requires IMDSv2 — passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:bedrock:us-east-1:111122223333:agent-runtime/rt-IMDSV2"
      asset_type: aws_bedrock_agentcore_runtime
      vendor: aws
      properties:
        ai:
          kind: bedrock_agentcore_runtime
          runtime:
            require_imdsv2: true
