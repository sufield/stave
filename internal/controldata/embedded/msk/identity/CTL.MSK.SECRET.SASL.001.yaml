dsl_version: ctrl.v1
id: CTL.MSK.SECRET.SASL.001
name: MSK Cluster SASL Credentials Must Use Secrets Manager
description: >
  MSK cluster SASL/SCRAM credentials are not managed through
  AWS Secrets Manager. Hardcoded or manually managed SASL
  credentials risk exposure and complicate rotation.
domain: identity
severity: low
compliance:
  nist_800_53_r5: "IA-5"
  soc2: "CC6.1"
scope_tags:
  - aws
  - msk
taxonomy:
  - compliance-mapping
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_msk_cluster]
params:
  attack_stage: credential_access
remediation:
  description: >
    MSK cluster SASL credentials are not managed via Secrets Manager.
  action: >
    Configure SASL/SCRAM authentication to use AWS Secrets Manager
    for credential storage and rotation.
  example: |
    {
      "storage": {
        "kind": "msk_cluster",
        "credentials": {
          "sasl_uses_secrets_manager": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: msk_cluster
    - field: properties.storage.credentials.sasl_uses_secrets_manager
      op: ne
      value: true
tests:
  - name: SASL without Secrets Manager fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:kafka:us-east-1:123456789012:cluster/my-cluster/abc123"
      asset_type: aws_msk_cluster
      vendor: aws
      properties:
        storage:
          kind: msk_cluster
          credentials:
            sasl_uses_secrets_manager: false
  - name: SASL with Secrets Manager passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:kafka:us-east-1:123456789012:cluster/my-cluster/abc123"
      asset_type: aws_msk_cluster
      vendor: aws
      properties:
        storage:
          kind: msk_cluster
          credentials:
            sasl_uses_secrets_manager: true
