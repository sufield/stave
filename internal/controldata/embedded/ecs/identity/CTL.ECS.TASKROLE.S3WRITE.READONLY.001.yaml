dsl_version: ctrl.v1
id: CTL.ECS.TASKROLE.S3WRITE.READONLY.001
name: Read-Only ECS Service Must Not Have S3 Write Permissions
description: >
  ECS service designated as read-only has a task role with S3 write
  permissions (s3:PutObject, s3:PutObjectAcl, or s3:DeleteObject).
  Application code in this service can modify the artifact store it
  should only consume — enabling artifact tampering from a
  supposedly read-only consumer. The service_intent property is
  derived from the service or task definition tags (e.g.,
  stave:service-intent=read-only). When intent is declared and
  the role violates it, the trust model is broken.
domain: identity
severity: high
compliance:
  soc2: "CC6.1"
  nist_800_53_r5: "AC-6"
  ccm_v4: ["IAM-04", "DSP-07"]
scope_tags:
  - aws
  - ecs
taxonomy:
  - compliance-mapping
  - least-privilege
  - data-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_ecs_task_definition]
params:
  attack_stage: impact
observation_fields:
  - container.kind
  - container.task_role.has_s3_write
  - container.service_intent
remediation:
  description: >
    ECS service tagged as read-only has a task role with S3 write
    permissions.
  action: >
    Scope the task role to read-only S3 actions (s3:GetObject,
    s3:ListBucket) on the artifact store. Remove s3:PutObject,
    s3:PutObjectAcl, and s3:DeleteObject.
  example: |
    {
      "container": {
        "kind": "task_definition",
        "task_role": { "has_s3_write": false },
        "service_intent": "read-only"
      }
    }
unsafe_predicate:
  all:
    - field: properties.container.kind
      op: eq
      value: task_definition
    - field: properties.container.task_role.has_s3_write
      op: eq
      value: true
    - field: properties.container.service_intent
      op: eq
      value: "read-only"
