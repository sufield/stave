dsl_version: ctrl.v1
id: CTL.ECS.TASKMETADATA.001
name: ECS Task Role Must Follow Least Privilege
description: >
  ECS task definitions must not have over-privileged task IAM roles. The
  task metadata endpoint (TMDEv4) exposes the task role credentials to
  every container in the task via a link-local HTTP endpoint with no
  session-based protection. An SSRF vulnerability in any container can
  retrieve valid short-lived AWS credentials in a single HTTP request.
  The blast radius of a credential theft is defined entirely by the task
  role's permissions — wildcard actions or wildcard resources on data-plane
  services (S3, DynamoDB, RDS, Secrets Manager, KMS) make the credential
  theft equivalent to account-wide lateral movement. This is the container
  equivalent of the EC2 IMDS vulnerability that CTL.EC2.IMDSV2.001
  addresses, but structurally more exposed because the ECS metadata
  endpoint has no IMDSv2-style session token protection.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "AC-6"
  fedramp_moderate: "AC-6"
  pci_dss_v4.0: "7.2.1"
  soc2: "CC6.1"
  hipaa: "164.312(a)(1)"
  ccm_v4: ["IVS-06", "LOG-12"]
scope_tags:
  - aws
  - ecs
taxonomy:
  - compute-hardening
  - credential-lifecycle
  - least-privilege
subtractive_category:
  - S01
  - S02
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_ecs_task_definition]
params:
  base_impact: 8
  attack_stage: credential_access
  blast_radius:
    type: detection
    scope: account
    multiplier: 1.5
remediation:
  description: >
    ECS task role has overly broad permissions. Any SSRF vulnerability in
    a container within this task can retrieve these credentials from the
    task metadata endpoint and use them to access AWS services with the
    role's full permissions.
  action: >
    Scope the task role to only the specific actions and resource ARNs the
    task requires. Replace managed policies like AmazonS3FullAccess with
    inline policies scoped to specific resources. Use IAM Access Analyzer
    to generate a least-privilege policy from actual task activity. If the
    task does not need AWS API access, remove the task role entirely.
  example: |
    {
      "container": {
        "kind": "task_definition",
        "task_role": {
          "is_overprivileged": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.container.kind
      op: eq
      value: task_definition
    - field: properties.container.task_role.is_overprivileged
      op: eq
      value: true
