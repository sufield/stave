dsl_version: ctrl.v1
id: CTL.ECS.TASKDEF.REVISION.STALE.SECRETS.001
name: ECS Task Definition Old Revisions Contain Plaintext Credentials
description: >
  Task definition has one or more inactive (older) revisions
  whose container env vars include plaintext credentials. The
  current active revision may have been migrated to
  valueFrom — credentials moved out of env into Secrets
  Manager or SSM — but ECS task definition revisions are
  immutable. The plaintext credentials that were in the
  earlier revisions are still there, visible to anyone with
  ecs:DescribeTaskDefinition on the older revision ARNs, and
  preserved in CloudTrail history of past UpdateTaskDefinition
  events. Migration is incomplete until the credentials are
  rotated and the affected revisions are deregistered (or
  treated as compromised). Distinct from
  CTL.ECS.SECRETS.001 — that control fires on the current
  state of any revision; this one fires when the *current*
  state is clean but the *history* is not.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "IA-5"
  fedramp_moderate: "IA-5"
  pci_dss_v4.0: "8.3.1"
  soc2: "CC6.1"
  hipaa: "164.312(d)"
  ccm_v4: ["IAM-16", "CEK-03"]
scope_tags:
  - aws
  - ecs
taxonomy:
  - credential-lifecycle
  - logging
  - trust-decay
subtractive_category:
  - S07
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_ecs_task_definition]
params:
  attack_stage: credential_access
remediation:
  description: >
    Older revisions of this task definition family contain
    plaintext credentials. The current revision may be clean
    but the immutable history exposes the same secrets.
  action: >
    Treat the credentials in stale revisions as compromised
    and rotate them — change the database password, regenerate
    the API token, rotate the access key. Once the old values
    no longer work, deregister the affected task definition
    revisions so they cannot be referenced. Update IAM policy
    on the task definition family to deny
    ecs:DescribeTaskDefinition on the deregistered revisions
    if your IAM model allows revision-level granularity.
  example: |
    {
      "container": {
        "kind": "task_definition_family",
        "revision_history": {
          "stale_credential_revision_count": 0,
          "stale_credential_revisions": []
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.container.kind
      op: eq
      value: task_definition_family
    - field: properties.container.revision_history.stale_credential_revision_count
      op: gt
      value: 0
