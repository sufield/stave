dsl_version: ctrl.v1
id: CTL.SIGNIN.CONSOLE.AUTH.ENABLED.001
name: Console Sign-In Authorization Must Be Enabled
description: >
  Console sign-in resource-based policy (RBP) enforcement must be
  enabled for the account. When disabled, any resource permission
  statements defining network restrictions (source IP, source VPC)
  have no effect — the policies exist but are not enforced, leaving
  the console sign-in path unrestricted.
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["IAM-10"]
scope_tags:
  - aws
  - signin
taxonomy:
  - account-governance
  - identity-perimeter
subtractive_category:
  - S05
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_signin_configuration]
params:
  attack_stage: initial_access
observation_fields:
  - governance.signin.console_authorization_enabled
remediation:
  description: >
    Console sign-in RBP enforcement is disabled. Any resource
    permission statements have no effect.
  action: >
    Enable console authorization via
    aws signin put-console-authorization-configuration
    --target-id <account-id> --region us-east-1.
  example: |
    {
      "governance": {
        "signin": {
          "console_authorization_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.signin.console_authorization_enabled
      op: eq
      value: false
defect: >
  Console sign-in RBP enforcement is disabled for the account.
infection: >
  An attacker with valid credentials signs in from any network
  location; IP/VPC restrictions in resource permission statements
  are silently ignored.
failure: >
  Console access is unrestricted despite existing network
  restriction policies.
tests:
  - name: authorization disabled fires
    verdict: VIOLATION
    asset: { asset_id: "111111111111/signin", asset_type: aws_signin_configuration, vendor: aws, properties: { governance: { signin: { console_authorization_enabled: false, has_resource_permission_statements: true, has_excluded_principal: false } } } }
  - name: authorization enabled passes
    verdict: PASS
    asset: { asset_id: "222222222222/signin", asset_type: aws_signin_configuration, vendor: aws, properties: { governance: { signin: { console_authorization_enabled: true, has_resource_permission_statements: true, has_excluded_principal: false } } } }
