dsl_version: ctrl.v1
id: CTL.SNS.POLICY.GHOSTREF.001
name: SNS Topic Policy Must Not Reference Deleted Principals
description: >
  SNS topic policies must not grant access to principal ARNs that
  don't exist in the IAM inventory. A recreated principal matching
  the ghost ARN inherits Publish (injection) or Subscribe
  (interception) access. Resource-based policies evaluate ARN strings,
  not unique IDs.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["IAM-16", "DSP-17"]
scope_tags: [aws, sns]
taxonomy:
  - compliance-mapping
  - trust-decay
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_sns_topic
params:
  attack_stage: persistence
remediation:
  description: SNS topic policy references a principal that no longer exists.
  action: Remove the ghost principal ARN from the topic policy.
  example: |
    {"messaging": {"kind": "topic", "policy": {"has_ghost_principal": false}}}
unsafe_predicate:
  all:
    - field: properties.messaging.kind
      op: eq
      value: topic
    - field: properties.messaging.policy.has_ghost_principal
      op: eq
      value: true
