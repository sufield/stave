dsl_version: ctrl.v1
id: CTL.SNS.ENCRYPT.TRANSPORT.001
name: SNS Topic Policy Does Not Enforce HTTPS (aws:SecureTransport)
description: >
  SNS topic policy does not include a Deny statement gated on
  aws:SecureTransport: false. Without that deny, publishers
  can call sns:Publish over HTTP — message body, message
  attributes, and SNS API parameters traverse the network
  unencrypted. SNS at-rest encryption (CTL.SNS.ENCRYPT.001 /
  .CMK.001) protects the message after it lands in the
  topic; this control protects the message while it is on
  the wire from publisher to SNS. Same enforcement pattern
  as CTL.S3.TLS.001 and CTL.SQS.ENCRYPT.TRANSPORT.001 — a
  Deny statement with aws:SecureTransport: false is the
  canonical SNS HTTPS enforcement.
domain: exposure
severity: high
compliance:
  cis_aws_v3.0: "2.1.2"
  soc2: "CC6.1, CC6.7"
  nist_800_53_r5: "SC-8, SC-13"
  pci_dss_v4.0: "4.1, 4.2"
  fedramp_moderate: "SC-8"
  hipaa: "164.312(e)(1)"
  iso_27001_2022: "A.8.20"
  ccm_v4: ["CEK-03", "IVS-09"]
scope_tags:
  - aws
  - sns
taxonomy:
  - compliance-mapping
  - encryption-at-rest
  - encryption-in-transit
subtractive_category:
  - S10
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_sns_topic
params:
  attack_stage: collection
remediation:
  description: >
    SNS topic policy permits HTTP publish requests because no
    condition rejects aws:SecureTransport = false.
  action: >
    Add a Deny statement to the topic policy:
    {"Effect":"Deny","Principal":"*","Action":"sns:*",
    "Resource":"<topic-arn>","Condition":
    {"Bool":{"aws:SecureTransport":"false"}}}.
    Apply via aws sns set-topic-attributes --topic-arn <arn>
    --attribute-name Policy --attribute-value <policy-json>.
    Verify all publishers use the HTTPS endpoint.
  example: |
    {
      "messaging": {
        "kind": "topic",
        "sns": {
          "policy_enforces_ssl": true,
          "has_secure_transport_condition": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.messaging.kind
      op: eq
      value: topic
    - field: properties.messaging.sns.policy_enforces_ssl
      op: eq
      value: false
defect: >
  SNS topic policy does not include an aws:SecureTransport
  condition denying HTTP publish requests.
infection: >
  SNS exposes both HTTP and HTTPS endpoints for the Publish
  API. Without a topic policy condition that denies
  requests where aws:SecureTransport = false, publishers
  can call Publish over HTTP — plaintext. The message body
  (notification content, alarm details, application
  events), message attributes, and SNS API parameters
  traverse the network unencrypted. A network adversary
  with passive observation can read every published
  message; an active adversary can replay or modify
  messages in flight. A Deny statement gated on
  aws:SecureTransport: false rejects the entire HTTP
  publish surface. This is the SNS analogue of S3's
  bucket-policy HTTPS enforcement.
failure: >
  Plaintext message publish path. Messages and SNS API
  parameters can travel over HTTP and are observable to any
  network adversary on the path between publisher and SNS.
tests:
  - name: topic policy without SecureTransport condition fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:sns:us-east-1:111122223333:orders-topic"
      asset_type: aws_sns_topic
      vendor: aws
      properties:
        messaging:
          kind: topic
          sns:
            policy_enforces_ssl: false
            has_secure_transport_condition: false
  - name: topic policy with SecureTransport Deny passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:sns:us-east-1:111122223333:orders-topic"
      asset_type: aws_sns_topic
      vendor: aws
      properties:
        messaging:
          kind: topic
          sns:
            policy_enforces_ssl: true
            has_secure_transport_condition: true
