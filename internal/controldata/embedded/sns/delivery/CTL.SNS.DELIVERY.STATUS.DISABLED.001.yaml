dsl_version: ctrl.v1
id: CTL.SNS.DELIVERY.STATUS.DISABLED.001
name: SNS Topic Has No Delivery Status Logging
description: >
  SNS topic does not have delivery status logging enabled for
  any subscription protocol (HTTP/HTTPS, SQS, Lambda,
  application/mobile push). Without delivery status logging
  there is no SNS-side record of whether messages reached
  subscribers — delivery successes and failures are invisible.
  A subscription to a failing endpoint (HTTP timeout, Lambda
  error, SQS permission denied) fails silently; the publish
  API returned success, the subscriber never received the
  message, and nothing was logged in between. The publisher
  has no signal of delivery failure; the only way to know
  whether messages reached subscribers is to inspect the
  subscriber side, which is impossible if the subscriber is
  itself failing.
domain: detection
severity: high
compliance:
  soc2: "CC7.1, CC7.2"
  nist_800_53_r5: "AU-2, AU-3, AU-6, AU-11"
  pci_dss_v4.0: "10.1, 10.7"
  fedramp_moderate: "AU-2"
  iso_27001_2022: "A.8.15, A.8.16"
  ccm_v4: ["LOG-02", "LOG-08"]
scope_tags:
  - aws
  - sns
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_sns_topic
params:
  attack_stage: detection_evasion
  blast_radius:
    type: detection
    scope: account
    multiplier: 2.5
remediation:
  description: >
    SNS topic has no delivery status logging enabled for any
    subscription protocol. Delivery successes and failures are
    invisible.
  action: >
    Enable delivery status logging per protocol on the topic:
    aws sns set-topic-attributes --topic-arn <arn>
    --attribute-name HTTPSuccessFeedbackRoleArn --attribute-value
    <role-arn> (and FailureFeedbackRoleArn,
    SuccessFeedbackSampleRate). Repeat for SQS, Lambda, and
    Application protocols by setting SQSSuccessFeedbackRoleArn,
    LambdaSuccessFeedbackRoleArn, etc. Each protocol is
    configured independently; enable logging for every protocol
    that the topic uses. Delivery status logs go to CloudWatch
    Logs and record outcome, error code, and delivery time.
  example: |
    {
      "messaging": {
        "kind": "topic",
        "sns": {
          "topic_arn": "arn:aws:sns:us-east-1:111122223333:alerts",
          "delivery_status_logging": true,
          "has_any_delivery_logging": true,
          "delivery_status_protocols": ["sqs", "http"]
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.messaging.kind
      op: eq
      value: topic
    - field: properties.messaging.sns.has_any_delivery_logging
      op: eq
      value: false
defect: >
  SNS topic has no delivery status logging enabled for any
  protocol.
infection: >
  SNS delivery status logging records the outcome of every
  message delivery attempt: success, failure, error code,
  delivery time, and subscriber endpoint. Without delivery
  status logging: a subscription to a failing HTTP endpoint
  retries and discards messages without any record. A Lambda
  subscription that errors on every invocation produces no
  delivery log. An SQS subscription that fails due to
  permission changes generates no delivery record. The only
  way to know whether messages reached subscribers is to check
  the subscriber side — if the subscriber is down, there's no
  record anywhere. Delivery status logging provides the
  SNS-side delivery outcome independent of subscriber health.
failure: >
  No delivery outcome visibility. Message delivery successes
  and failures are unrecorded. Failing subscriptions are
  invisible.
tests:
  - name: topic without delivery logging fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:sns:us-east-1:111122223333:alerts"
      asset_type: aws_sns_topic
      vendor: aws
      properties:
        messaging:
          kind: topic
          sns:
            topic_arn: "arn:aws:sns:us-east-1:111122223333:alerts"
            has_any_delivery_logging: false
            delivery_status_protocols: []
  - name: topic with delivery logging passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:sns:us-east-1:111122223333:alerts"
      asset_type: aws_sns_topic
      vendor: aws
      properties:
        messaging:
          kind: topic
          sns:
            topic_arn: "arn:aws:sns:us-east-1:111122223333:alerts"
            has_any_delivery_logging: true
            delivery_status_protocols: ["sqs", "http", "lambda"]
  - name: topic with HTTP subscription to external endpoint and no logging fires (high risk)
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:sns:us-east-1:111122223333:webhook-fanout"
      asset_type: aws_sns_topic
      vendor: aws
      properties:
        messaging:
          kind: topic
          sns:
            topic_arn: "arn:aws:sns:us-east-1:111122223333:webhook-fanout"
            has_any_delivery_logging: false
            delivery_status_protocols: []
            subscription_protocols: ["https"]
            has_external_http_subscription: true
