dsl_version: ctrl.v1
id: CTL.SNS.DELIVERY.LOG.RETENTION.001
name: SNS Delivery Status Log Group Has Insufficient Retention
description: >
  SNS delivery status CloudWatch log group has no retention
  policy (logs retained forever — costly) or retention shorter
  than 365 days (forensic horizon insufficient). Same baseline
  pattern as CTL.LAMBDA.LOG.RETENTION.001 and
  CTL.RDS.LOG.RETENTION.001 — consistent retention floor for
  every CloudWatch log group across the catalog. Fires only
  when delivery status logging is enabled (otherwise
  CTL.SNS.DELIVERY.STATUS.DISABLED.001 covers the wider
  failure of having no logs at all).
domain: governance
severity: medium
compliance:
  nist_800_53_r5: "AU-11"
  fedramp_moderate: "AU-11"
  pci_dss_v4.0: "10.5.1"
  soc2: "CC7.2"
  hipaa: "164.312(b)"
  ccm_v4: ["LOG-08", "LOG-12"]
scope_tags:
  - aws
  - sns
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_sns_topic
params:
  attack_stage: detection_evasion
remediation:
  description: >
    SNS delivery status log group has either no retention
    policy (retained forever) or retention shorter than 365
    days.
  action: >
    Set retentionInDays on the delivery status log group to
    365 or higher (3653 = 10 years for long-retention
    compliance workloads). Use put-retention-policy on the
    log group, or set retention via the CloudFormation/
    Terraform resource that owns it. The 365-day floor matches
    the catalog-wide retention baseline used by Lambda, RDS,
    ECS, API Gateway, and Route 53 query logs.
  example: |
    {
      "messaging": {
        "kind": "topic",
        "sns": {
          "has_any_delivery_logging": true,
          "delivery_log_group": "/aws/sns/delivery-status",
          "delivery_log_retention_days": 365,
          "delivery_log_retention_set": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.messaging.kind
      op: eq
      value: topic
    - field: properties.messaging.sns.has_any_delivery_logging
      op: eq
      value: true
    - field: properties.messaging.sns.delivery_log_retention_set
      op: eq
      value: false
defect: >
  SNS delivery status log group has no retention policy or
  retention shorter than 365 days.
infection: >
  Delivery status logs are the SNS-side audit trail of who
  received what. Incidents discovered late often require
  reviewing months of delivery activity — was that webhook
  failing for a day, a week, a month? Was the Lambda
  subscription erroring before the recent code deploy or
  after? With no retention policy, logs retain forever (high
  storage cost — typically the reason teams disable logging
  later). With short retention, the forensic horizon collapses
  and old enough events are simply gone. The 365-day floor
  matches the typical compliance audit horizon and aligns
  with every other CloudWatch log retention control in the
  catalog.
failure: >
  Truncated delivery audit horizon. Delivery status events
  older than the retention window are gone. Forensic
  investigation into past delivery patterns is impossible.
tests:
  - name: delivery log group with 30-day retention fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:sns:us-east-1:111122223333:alerts"
      asset_type: aws_sns_topic
      vendor: aws
      properties:
        messaging:
          kind: topic
          sns:
            has_any_delivery_logging: true
            delivery_log_group: "/aws/sns/delivery-status"
            delivery_log_retention_days: 30
            delivery_log_retention_set: false
  - name: delivery log group with 365-day retention passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:sns:us-east-1:111122223333:alerts"
      asset_type: aws_sns_topic
      vendor: aws
      properties:
        messaging:
          kind: topic
          sns:
            has_any_delivery_logging: true
            delivery_log_group: "/aws/sns/delivery-status"
            delivery_log_retention_days: 365
            delivery_log_retention_set: true
