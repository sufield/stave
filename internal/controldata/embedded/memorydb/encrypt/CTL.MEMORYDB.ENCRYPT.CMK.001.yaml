dsl_version: ctrl.v1
id: CTL.MEMORYDB.ENCRYPT.CMK.001
name: MemoryDB Cluster Not Encrypted with Customer-Managed KMS Key
description: >
  MemoryDB cluster has encryption at rest enabled but does not use
  a customer-managed KMS key. The AWS-managed key provides at-rest
  encryption but no key-policy control and no ability to revoke
  access by disabling the key. If the uses_cmk field is absent the
  control is not-evaluable and does not fire.
domain: exposure
severity: medium
compliance:
  soc2: "CC6.1, CC6.7"
  nist_800_53_r5: "SC-12, SC-13, SC-28"
  pci_dss_v4.0: "3.5"
  ccm_v4: ["CEK-03"]
scope_tags:
  - aws
  - memorydb
taxonomy:
  - encryption-at-rest
  - key-management
subtractive_category:
  - S10
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_memorydb_cluster
params:
  attack_stage: exfiltration
observation_fields:
  - storage.kind
  - storage.encryption.at_rest_enabled
  - storage.encryption.uses_cmk
remediation:
  description: >
    MemoryDB cluster encryption is not backed by a customer-managed
    KMS key.
  action: >
    Create a new MemoryDB cluster with a customer-managed KMS key
    (encryption settings are immutable after creation). Migrate
    data from the existing cluster.
  example: |
    {
      "storage": {
        "kind": "memorydb_cluster",
        "encryption": {
          "at_rest_enabled": true,
          "uses_cmk": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: memorydb_cluster
    - field: properties.storage.encryption.at_rest_enabled
      op: eq
      value: true
    - field: properties.storage.encryption.uses_cmk
      op: eq
      value: false
tests:
  - name: cluster with AWS-managed key fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:memorydb:us-east-1:111122223333:cluster/my-cluster"
      asset_type: aws_memorydb_cluster
      vendor: aws
      properties:
        storage:
          kind: memorydb_cluster
          encryption:
            at_rest_enabled: true
            uses_cmk: false
  - name: cluster with CMK passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:memorydb:us-east-1:111122223333:cluster/my-cluster"
      asset_type: aws_memorydb_cluster
      vendor: aws
      properties:
        storage:
          kind: memorydb_cluster
          encryption:
            at_rest_enabled: true
            uses_cmk: true
  - name: cluster with absent uses_cmk passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:memorydb:us-east-1:111122223333:cluster/my-cluster"
      asset_type: aws_memorydb_cluster
      vendor: aws
      properties:
        storage:
          kind: memorydb_cluster
          encryption:
            at_rest_enabled: true
