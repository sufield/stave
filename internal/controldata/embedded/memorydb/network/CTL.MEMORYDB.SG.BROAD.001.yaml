dsl_version: ctrl.v1
id: CTL.MEMORYDB.SG.BROAD.001
name: MemoryDB Cluster Security Group Must Not Allow Broad Ingress
description: >
  MemoryDB cluster security group must restrict ingress to
  specific application security groups or CIDR blocks. A security
  group allowing 0.0.0.0/0 on port 6379 exposes the cluster to
  any host with network access. MemoryDB uses the same Redis
  protocol and default port as ElastiCache Redis — broad ingress
  enables the same lateral movement vector from compromised
  compute within the VPC.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SC-7"
  soc2: "CC6.6"
  pci_dss_v4.0: "1.3.1"
  ccm_v4: ["IVS-06", "IVS-09"]
scope_tags:
  - aws
  - memorydb
taxonomy:
  - compliance-mapping
  - network-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_memorydb_cluster]
params:
  attack_stage: initial_access
remediation:
  description: >
    MemoryDB cluster security group allows broad ingress.
  action: >
    Restrict the security group to allow ingress only from
    application security groups or specific CIDR blocks that
    need cluster access. Remove 0.0.0.0/0 rules on port 6379.
  example: |
    {
      "cache": {
        "kind": "memorydb_cluster",
        "network": {
          "security_group_broad_ingress": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.cache.kind
      op: eq
      value: memorydb_cluster
    - field: properties.cache.network.security_group_broad_ingress
      op: eq
      value: true
tests:
  - name: broad security group fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:memorydb:us-east-1:123456789012:cluster/my-cluster"
      asset_type: aws_memorydb_cluster
      vendor: aws
      properties:
        cache:
          kind: memorydb_cluster
          network:
            security_group_broad_ingress: true
  - name: restricted security group passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:memorydb:us-east-1:123456789012:cluster/my-cluster"
      asset_type: aws_memorydb_cluster
      vendor: aws
      properties:
        cache:
          kind: memorydb_cluster
          network:
            security_group_broad_ingress: false
