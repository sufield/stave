dsl_version: ctrl.v1
id: CTL.LIGHTSAIL.ACCESS.KEY.001
name: Lightsail Bucket Has Active Access Keys
description: >
  A Lightsail bucket has active access keys created via
  lightsail:CreateBucketAccessKey — outside the IAM credential
  lifecycle. Not in credential reports, not subject to rotation.
domain: identity
severity: high
compliance:
  owasp_nhi: "NHI1"
  nist_800_53_r5: "IA-5"
  soc2: "CC6.1"
  ccm_v4: ["IAM-09"]
scope_tags: [aws, lightsail]
taxonomy: [credential-lifecycle, resource-sprawl, identity-perimeter]
subtractive_category:
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_lightsail_bucket]
params:
  attack_stage: credential_access
observation_fields: [storage.kind, storage.access_keys.count]
remediation:
  description: Lightsail bucket has access keys outside IAM lifecycle.
  action: Delete with aws lightsail delete-bucket-access-key; migrate to IAM.
  example: |
    {"storage": {"kind": "lightsail_bucket", "access_keys": {"count": 0}}}
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: lightsail_bucket
    - field: properties.storage.access_keys.count
      op: gt
      value: 0
tests:
  - name: "bucket with keys fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:lightsail:us-east-1:111122223333:Bucket/my-bucket"
      asset_type: aws_lightsail_bucket
      vendor: aws
      properties:
        storage: {kind: lightsail_bucket, access_keys: {count: 2}}
  - name: "bucket without keys passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:lightsail:us-east-1:444455556666:Bucket/clean-bucket"
      asset_type: aws_lightsail_bucket
      vendor: aws
      properties:
        storage: {kind: lightsail_bucket, access_keys: {count: 0}}
