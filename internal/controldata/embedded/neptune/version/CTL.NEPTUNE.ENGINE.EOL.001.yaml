dsl_version: ctrl.v1
id: CTL.NEPTUNE.ENGINE.EOL.001
name: Neptune Engine Version Must Not Be End-of-Life
description: >
  Neptune clusters must not run engine versions that have reached
  end-of-life. AWS publishes a deprecation calendar per Neptune
  engine version; clusters on a deprecated version no longer receive
  security patches and will eventually be force-upgraded during a
  maintenance window the operator did not choose. This is distinct
  from CTL.NEPTUNE.UPGRADE.001 which checks the auto-minor-upgrade
  toggle — auto-upgrade applies patches within a supported major
  version but does not upgrade between major versions. A cluster
  with auto-upgrade enabled on an EOL major version receives no
  further patches. The same lifecycle pattern as
  CTL.DOCUMENTDB.ENGINE.DEPRECATED.001 and CTL.RDS.ENGINE.EOL.001.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "SI-2"
  soc2: "CC7.1"
  pci_dss_v4.0: "6.3.3"
  ccm_v4: ["TVM-04"]
scope_tags:
  - aws
  - neptune
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
params:
  attack_stage: persistence
remediation:
  description: >
    Neptune cluster runs an engine version that has reached
    end-of-life. Security patches are no longer issued and a
    forced upgrade is queued.
  action: >
    Upgrade the cluster to a supported engine version using
    aws neptune modify-db-cluster --engine-version <ver>
    --apply-immediately. Coordinate the upgrade with application
    teams — major version upgrades may change Gremlin or SPARQL
    query behavior.
  example: |
    {
      "database": {
        "kind": "neptune_cluster",
        "engine_version": {
          "is_eol": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.database.kind
      op: eq
      value: neptune_cluster
    - field: properties.database.engine_version.is_eol
      op: eq
      value: true
