dsl_version: ctrl.v1
id: CTL.IOT.RULE.NOERRORACTION.001
name: IoT Topic Rule Has No Error Action
description: >
  IoT topic rule has no error action configured. When a rule's
  primary action fails (destination unreachable, throttled, role
  permission denied), messages are silently dropped. Without an
  error action routing failures to a dead-letter queue or CloudWatch
  log group, failed deliveries are invisible — a detection gap
  for both operational failures and security-relevant events.
domain: detection
severity: medium
compliance:
  nist_800_53_r5: "AU-6"
  soc2: "CC7.2"
scope_tags:
  - aws
  - iot
taxonomy:
  - logging
  - detection-evasion
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_iot_topic_rule]
params:
  attack_stage: detection_evasion
observation_fields:
  - iot.kind
  - iot.topic_rule.has_error_action
remediation:
  description: >
    Topic rule has no error action — failed deliveries are silently
    dropped.
  action: >
    Add an error action that routes failed messages to an SQS
    dead-letter queue or CloudWatch Logs log group.
  example: |
    {
      "iot": {
        "kind": "topic_rule",
        "topic_rule": {
          "has_error_action": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.iot.kind
      op: eq
      value: topic_rule
    - field: properties.iot.topic_rule.has_error_action
      op: ne
      value: true
tests:
  - name: no error action fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iot:us-east-1:123456789012:rule/ingest-telemetry"
      asset_type: aws_iot_topic_rule
      vendor: aws
      properties:
        iot:
          kind: topic_rule
          topic_rule:
            rule_name: ingest-telemetry
            has_error_action: false
  - name: error action configured passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:iot:us-east-1:123456789012:rule/ingest-telemetry"
      asset_type: aws_iot_topic_rule
      vendor: aws
      properties:
        iot:
          kind: topic_rule
          topic_rule:
            rule_name: ingest-telemetry
            has_error_action: true
