dsl_version: ctrl.v1
id: CTL.CLOUDTRAIL.DATAWRITE.001
name: S3 Object Write Logging Must Be Enabled
description: >
  CloudTrail must log S3 data write events (PutObject, DeleteObject).
  Without object-level write logging, individual object mutations
  are invisible to the audit trail.
domain: exposure
severity: high
compliance:
  cis_aws_v3.0: "3.8"
  soc2: "CC6.2"
  pci_dss_v4.0: "10.2.1.7"
  nist_800_53_r5: "AU-3"
scope_tags:
  - aws
  - cloudtrail
type: unsafe_state
params: {}
remediation:
  description: >
    CloudTrail does not log S3 object write events.
  action: >
    Add S3 data write event selectors to the trail using
    advanced event selectors with readOnly=false.
  example: |
    {
      "audit_trail": {
        "kind": "trail",
        "s3_data_events": {
          "write_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.audit_trail.kind
      op: eq
      value: trail
    - field: properties.audit_trail.s3_data_events.write_enabled
      op: eq
      value: false
