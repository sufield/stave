dsl_version: ctrl.v1
id: CTL.CLOUDTRAIL.DATAREAD.001
name: S3 Object Read Logging Must Be Enabled
description: >
  CloudTrail must log S3 data read events (GetObject). Read logging
  provides evidence of data access for PHI audit trails and breach
  investigation.
domain: exposure
severity: high
compliance:
  cis_aws_v3.0: "3.9"
  soc2: "CC6.2"
  pci_dss_v4.0: "10.2.1.7"
  nist_800_53_r5: "AU-3"
  fedramp_moderate: "AU-3"
  gdpr: "Art.30"
scope_tags:
  - aws
  - cloudtrail
type: unsafe_state
params: {}
remediation:
  description: >
    CloudTrail does not log S3 object read events.
  action: >
    Add S3 data read event selectors to the trail using
    advanced event selectors with readOnly=true.
  example: |
    {
      "audit_trail": {
        "kind": "trail",
        "s3_data_events": {
          "read_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.audit_trail.kind
      op: eq
      value: trail
    - field: properties.audit_trail.s3_data_events.read_enabled
      op: eq
      value: false
