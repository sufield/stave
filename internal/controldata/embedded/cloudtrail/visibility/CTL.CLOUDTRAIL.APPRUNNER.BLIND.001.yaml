dsl_version: ctrl.v1
id: CTL.CLOUDTRAIL.APPRUNNER.BLIND.001
name: CloudTrail Does Not Log App Runner Data Events
description: >
  CloudTrail data events do not cover App Runner service invocations.
  HTTP requests to App Runner endpoints are handled by AWS-managed
  infrastructure and are not visible in the customer's CloudTrail
  data event logs. Management events (CreateService, DeleteService)
  are logged, but request-level activity (who called the service,
  with what payload) is invisible. For services handling sensitive
  data, this is a detection blind spot.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "AU-2"
  soc2: "CC7.1"
  ccm_v4: ["LOG-01"]
scope_tags:
  - aws
  - cloudtrail
taxonomy:
  - logging
  - detection-evasion
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_cloudtrail_trail
params:
  attack_stage: detection_evasion
observation_fields:
  - audit_trail.kind
  - audit_trail.apprunner_data_events.logged
remediation:
  description: >
    CloudTrail does not capture App Runner data-plane events.
  action: >
    Enable application-level access logging within the App Runner
    service configuration. Route access logs to CloudWatch Logs for
    centralized monitoring. App Runner data-plane events cannot be
    captured via CloudTrail event selectors.
  example: |
    {
      "audit_trail": {
        "kind": "trail",
        "apprunner_data_events": {
          "logged": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.audit_trail.kind
      op: eq
      value: trail
    - field: properties.audit_trail.apprunner_data_events.logged
      op: ne
      value: true
tests:
  - name: "trail not logging App Runner data events fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cloudtrail:us-east-1:111122223333:trail/main-trail"
      asset_type: aws_cloudtrail_trail
      vendor: aws
      properties:
        audit_trail:
          kind: trail
          apprunner_data_events: {logged: false}
  - name: "trail logging App Runner data events passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:cloudtrail:us-east-1:444455556666:trail/full-trail"
      asset_type: aws_cloudtrail_trail
      vendor: aws
      properties:
        audit_trail:
          kind: trail
          apprunner_data_events: {logged: true}
