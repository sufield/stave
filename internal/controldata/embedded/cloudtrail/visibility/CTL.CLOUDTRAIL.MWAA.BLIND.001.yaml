dsl_version: ctrl.v1
id: CTL.CLOUDTRAIL.MWAA.BLIND.001
name: CloudTrail Does Not Log MWAA Data Events
description: >
  CloudTrail data events do not cover MWAA DAG execution. MWAA
  environments run DAGs on Fargate compute, but individual DAG run
  activity (task execution, operator calls, connection usage) is not
  logged in CloudTrail. Management events (CreateEnvironment,
  DeleteEnvironment) are logged, but DAG execution — which runs
  arbitrary Python code with the execution role's permissions — is
  invisible to CloudTrail.
domain: exposure
severity: low
compliance:
  nist_800_53_r5: "AU-2"
  soc2: "CC7.1"
  ccm_v4: ["LOG-01"]
scope_tags: [aws, cloudtrail]
taxonomy:
  - logging
  - detection-evasion
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_cloudtrail_trail]
params:
  attack_stage: detection_evasion
observation_fields:
  - audit_trail.kind
  - audit_trail.mwaa_data_events.logged
remediation:
  description: CloudTrail does not capture MWAA DAG execution events.
  action: >
    Enable MWAA task-level logging via the environment's logging
    configuration (DAG processing, scheduler, task, web server,
    worker logs to CloudWatch). MWAA execution events cannot be
    captured via CloudTrail event selectors.
  example: |
    {"audit_trail": {"kind": "trail", "mwaa_data_events": {"logged": true}}}
unsafe_predicate:
  all:
    - field: properties.audit_trail.kind
      op: eq
      value: trail
    - field: properties.audit_trail.mwaa_data_events.logged
      op: eq
      value: false
tests:
  - name: "trail not logging MWAA data events fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cloudtrail:us-east-1:111122223333:trail/main-trail"
      asset_type: aws_cloudtrail_trail
      vendor: aws
      properties:
        audit_trail:
          kind: trail
          mwaa_data_events: {logged: false}
  - name: "trail logging MWAA data events passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:cloudtrail:us-east-1:444455556666:trail/full-trail"
      asset_type: aws_cloudtrail_trail
      vendor: aws
      properties:
        audit_trail:
          kind: trail
          mwaa_data_events: {logged: true}
