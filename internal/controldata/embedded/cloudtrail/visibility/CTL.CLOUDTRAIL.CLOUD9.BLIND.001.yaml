dsl_version: ctrl.v1
id: CTL.CLOUDTRAIL.CLOUD9.BLIND.001
name: CloudTrail Does Not Log Cloud9 Data Events
description: >
  CloudTrail data events do not cover Cloud9 IDE sessions. Cloud9
  environments run on EC2 instances but IDE session activity (file
  edits, terminal commands, credential usage) is not logged in
  CloudTrail. Management events (CreateEnvironmentEC2,
  DeleteEnvironment) are logged, but interactive session activity
  is invisible — an attacker with access to a Cloud9 environment
  can operate without an audit trail.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "AU-2"
  soc2: "CC7.1"
  ccm_v4: ["LOG-01"]
scope_tags: [aws, cloudtrail]
taxonomy:
  - logging
  - detection-evasion
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_cloudtrail_trail]
params:
  attack_stage: detection_evasion
observation_fields:
  - audit_trail.kind
  - audit_trail.cloud9_data_events.logged
remediation:
  description: CloudTrail does not capture Cloud9 session-level events.
  action: >
    Enable SSM Session Manager logging for Cloud9 environments to
    capture terminal activity. Cloud9 session events cannot be
    captured via CloudTrail event selectors.
  example: |
    {"audit_trail": {"kind": "trail", "cloud9_data_events": {"logged": true}}}
unsafe_predicate:
  all:
    - field: properties.audit_trail.kind
      op: eq
      value: trail
    - field: properties.audit_trail.cloud9_data_events.logged
      op: eq
      value: false
tests:
  - name: "trail not logging Cloud9 data events fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cloudtrail:us-east-1:111122223333:trail/main-trail"
      asset_type: aws_cloudtrail_trail
      vendor: aws
      properties:
        audit_trail:
          kind: trail
          cloud9_data_events: {logged: false}
  - name: "trail logging Cloud9 data events passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:cloudtrail:us-east-1:444455556666:trail/full-trail"
      asset_type: aws_cloudtrail_trail
      vendor: aws
      properties:
        audit_trail:
          kind: trail
          cloud9_data_events: {logged: true}
