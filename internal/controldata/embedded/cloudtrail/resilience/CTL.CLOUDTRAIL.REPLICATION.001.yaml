dsl_version: ctrl.v1
id: CTL.CLOUDTRAIL.REPLICATION.001
name: CloudTrail Logs Must Be Replicated to a Separate Account
description: >
  CloudTrail log destination must have cross-account replication
  configured to a separate logging account. Without replication,
  compromising the trail-hosting account enables complete evidence
  destruction.
domain: audit
severity: medium
compliance:
  nist_800_53_r5: "AU-9"
  soc2: "CC7.1"
  fedramp_moderate: "AU-9"
  ccm_v4: ["BCR-08", "LOG-05"]
scope_tags:
  - aws
  - cloudtrail
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
remediation:
  description: CloudTrail logs stored without cross-account replication.
  action: >
    Configure S3 replication on the trail bucket targeting a bucket
    in a separate logging account.
  example: |
    {
      "audit_trail": {
        "kind": "trail",
        "has_cross_account_replication": true
      }
    }
unsafe_predicate:
  all:
    - field: properties.audit_trail.kind
      op: eq
      value: trail
    - field: properties.audit_trail.has_cross_account_replication
      op: eq
      value: false
