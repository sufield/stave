dsl_version: ctrl.v1
id: CTL.CLOUDTRAIL.INCOMPLETE.001
name: Complete Data Required for CloudTrail Assessment
description: >
  The observation snapshot is missing required CloudTrail properties.
  A safety assessment cannot be completed without trail configuration
  data.
domain: exposure
severity: info
compliance:
  ccm_v4: ["DCS-06", "LOG-05"]
scope_tags:
  - aws
  - cloudtrail
type: unsafe_state
params: {}
remediation:
  description: >
    Observation is missing CloudTrail trail properties. The extractor
    must populate audit_trail.multi_region_enabled and related fields.
  action: >
    Ensure the extractor calls aws cloudtrail describe-trails and
    aws cloudtrail get-trail-status and maps the response to the
    audit_trail observation properties.
  example: |
    {
      "audit_trail": {
        "kind": "trail",
        "multi_region_enabled": true,
        "log_file_validation_enabled": true,
        "encryption": {
          "encrypted": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.audit_trail.kind
      op: eq
      value: trail
    - field: properties.audit_trail.multi_region_enabled
      op: missing
      value: true
