dsl_version: ctrl.v1
id: CTL.CLOUDTRAIL.DATAEVENTS.BEDROCK.001
name: CloudTrail Data Events Not Enabled for Bedrock API Calls
description: >
  CloudTrail is not configured to log Bedrock data events
  (InvokeModel, InvokeModelWithResponseStream, Converse,
  Retrieve, RetrieveAndGenerate). Without data events for
  Bedrock, there is no record of which models were invoked,
  what prompts were sent, or which knowledge bases were
  queried. An attacker — or an unsanctioned internal user —
  can invoke foundation models, exfiltrate data through
  prompt responses, or abuse agent tool-use without any
  audit trail. Management events alone show model
  provisioning but not model usage.
domain: detection
severity: high
compliance:
  soc2: "CC7.1, CC7.2"
  nist_800_53_r5: "AU-2, AU-3, AU-12"
  pci_dss_v4.0: "10.1, 10.2, 10.3"
  fedramp_moderate: "AU-2"
  iso_27001_2022: "A.8.15, A.8.16"
  ccm_v4: ["LOG-02", "LOG-13"]
scope_tags:
  - aws
  - cloudtrail
  - bedrock
taxonomy:
  - compliance-mapping
  - logging
subtractive_category:
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_cloudtrail_trail
params:
  attack_stage: detection_evasion
  blast_radius:
    type: detection
    scope: account
    multiplier: 3.0
remediation:
  description: >
    CloudTrail does not log Bedrock data events. Model
    invocations and knowledge base queries are unrecorded.
  action: >
    Add a Bedrock data-event selector to the trail:
    aws cloudtrail put-event-selectors --trail-name
    <trail> --advanced-event-selectors
    '[{"Name":"Bedrock data events",
       "FieldSelectors":[
         {"Field":"eventCategory","Equals":["Data"]},
         {"Field":"resources.type","Equals":["AWS::Bedrock::Model"]}]}]'.
  example: |
    {
      "audit": {
        "kind": "trail",
        "cloudtrail": {
          "data_events_bedrock": true,
          "has_bedrock_data_event_gap": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.audit.kind
      op: eq
      value: trail
    - field: properties.audit.cloudtrail.has_bedrock_data_event_gap
      op: present
    - field: properties.audit.cloudtrail.has_bedrock_data_event_gap
      op: eq
      value: true
defect: >
  CloudTrail data events are not enabled for Bedrock API
  calls.
infection: >
  Bedrock management events (CreateModelCustomizationJob,
  CreateAgent) are logged by default. Data events
  (InvokeModel, Converse, Retrieve) are NOT logged by
  default. Without Bedrock data events: which models were
  invoked is unknown, what data was sent in prompts is
  unrecorded, whether knowledge base queries exfiltrated
  sensitive data is unverifiable. For incident response,
  data events answer: who invoked which model, when, with
  what input. Without them, AI usage is invisible.
failure: >
  No audit trail for Bedrock model invocations. Prompt
  injection, data exfiltration through model responses,
  and unauthorized model usage cannot be detected or
  reconstructed.
tests:
  - name: trail without Bedrock data events fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cloudtrail:us-east-1:111122223333:trail/org-trail"
      asset_type: aws_cloudtrail_trail
      vendor: aws
      properties:
        audit:
          kind: trail
          cloudtrail:
            data_events_bedrock: false
            has_bedrock_data_event_gap: true
  - name: trail with Bedrock data events passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:cloudtrail:us-east-1:111122223333:trail/org-trail"
      asset_type: aws_cloudtrail_trail
      vendor: aws
      properties:
        audit:
          kind: trail
          cloudtrail:
            data_events_bedrock: true
            has_bedrock_data_event_gap: false
