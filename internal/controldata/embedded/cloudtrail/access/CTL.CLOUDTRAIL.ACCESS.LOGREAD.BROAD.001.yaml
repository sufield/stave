dsl_version: ctrl.v1
id: CTL.CLOUDTRAIL.ACCESS.LOGREAD.BROAD.001
name: CloudTrail Log Files Accessible to Overly Broad Principals
description: >
  CloudTrail trail S3 bucket is readable by too many
  principals. Audit logs contain every API call —
  principal ARNs, source IPs, resource ARNs, parameters,
  timestamps. Broad read access to audit logs lets an
  insider or compromised principal map the entire
  infrastructure without making any API calls themselves
  (stealth reconnaissance), identify high-value targets,
  and time their actions against admin activity windows.
  Audit log read access should be limited to the security
  team and incident responders.
domain: exposure
severity: medium
compliance:
  soc2: "CC6.1, CC6.3, CC7.1"
  nist_800_53_r5: "AC-3, AC-6, AU-9"
  pci_dss_v4.0: "7.1, 7.2, 10.5"
  fedramp_moderate: "AC-6"
  iso_27001_2022: "A.5.15, A.8.3"
  ccm_v4: ["IAM-09", "LOG-08"]
scope_tags:
  - aws
  - cloudtrail
taxonomy:
  - compliance-mapping
  - least-privilege
  - logging
subtractive_category:
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_cloudtrail_trail
params:
  attack_stage: discovery
  blast_radius:
    type: detection
    scope: account
    multiplier: 2.0
remediation:
  description: >
    Trail S3 bucket is readable by an unnecessarily broad
    principal set. Audit-log content is information-dense.
  action: >
    Audit each principal in s3_read_principals. Remove
    read access from any principal that doesn't have a
    legitimate analysis or incident-response role.
    Replace bucket-wide reads with prefix-scoped reads
    where possible (e.g., a specific account's
    AWSLogs/<account-id>/ prefix for that account's
    security team). Reserve full bucket reads for the
    central security and IR teams.
  example: |
    {
      "audit": {
        "kind": "trail",
        "cloudtrail": {
          "s3_read_principals": ["arn:aws:iam::111122223333:role/SecurityRead"],
          "s3_read_principal_count": 1,
          "s3_read_broadly_granted": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.audit.kind
      op: eq
      value: trail
    - field: properties.audit.cloudtrail.s3_read_broadly_granted
      op: present
    - field: properties.audit.cloudtrail.s3_read_broadly_granted
      op: eq
      value: true
defect: >
  CloudTrail trail S3 bucket is readable by an
  unnecessarily broad set of IAM principals.
infection: >
  Audit logs are the most information-dense resource in
  the account. Every API call is recorded with: who
  (principal ARN, access key, account ID), what (API
  action, resource ARN, parameters), when (timestamp),
  where (source IP, user agent, region). An attacker
  with read access to audit logs can: map the entire
  infrastructure without making any API calls themselves
  (stealth reconnaissance), identify high-value targets
  (which resources are accessed most, which roles have
  broad access), and time their attack (learn when
  admins are active/inactive). Audit log read access
  should be limited to the security team and incident
  responders.
failure: >
  Audit log exposure. Too many principals can read the
  full API call history — enabling stealth
  reconnaissance.
tests:
  - name: 15 principals readable fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cloudtrail:us-east-1:111122223333:trail/org-trail"
      asset_type: aws_cloudtrail_trail
      vendor: aws
      properties:
        audit:
          kind: trail
          cloudtrail:
            s3_bucket_name: "org-cloudtrail-logs"
            s3_read_principal_count: 15
            s3_read_broadly_granted: true
  - name: only security team readable passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:cloudtrail:us-east-1:111122223333:trail/org-trail"
      asset_type: aws_cloudtrail_trail
      vendor: aws
      properties:
        audit:
          kind: trail
          cloudtrail:
            s3_bucket_name: "org-cloudtrail-logs"
            s3_read_principal_count: 2
            s3_read_broadly_granted: false
