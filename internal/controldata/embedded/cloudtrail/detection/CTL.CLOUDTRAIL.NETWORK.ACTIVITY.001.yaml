dsl_version: ctrl.v1
id: CTL.CLOUDTRAIL.NETWORK.ACTIVITY.001
name: CloudTrail Must Log Network Activity Events for VPC Endpoints
description: >
  CloudTrail Network Activity event logging must be enabled to
  capture VPC endpoint data-plane events including anonymous S3
  requests. AWS's April 2026 patch logs anonymous requests as
  Network Activity events, but only if this event type is enabled.
domain: audit
severity: high
compliance:
  nist_800_53_r5: "AU-12"
  soc2: "CC7.1"
  fedramp_moderate: "AU-12"
  ccm_v4: ["LOG-03", "LOG-05"]
scope_tags:
  - aws
  - cloudtrail
taxonomy:
  - compliance-mapping
  - logging
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_cloudtrail_trail
params:
  attack_stage: detection_evasion
remediation:
  description: Network Activity event logging is not enabled.
  action: >
    Enable Network Activity events on the CloudTrail trail via
    PutEventSelectors with the networkActivity event category.
unsafe_predicate:
  all:
    - field: properties.audit_trail.kind
      op: eq
      value: trail
    - field: properties.audit_trail.network_activity_events.enabled
      op: eq
      value: false
