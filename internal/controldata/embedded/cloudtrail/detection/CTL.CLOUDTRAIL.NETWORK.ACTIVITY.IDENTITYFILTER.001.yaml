dsl_version: ctrl.v1
id: CTL.CLOUDTRAIL.NETWORK.ACTIVITY.IDENTITYFILTER.001
name: CloudTrail Network Activity Events Must Not Filter by UserIdentity
description: >
  CloudTrail network activity event logging is enabled but advanced
  event selectors include UserIdentity-based filtering conditions.
  A UserIdentity filter narrows which principals' VPC endpoint
  traffic is logged, creating a targeted blind spot — traffic from
  excluded principals is invisible. An attacker who compromises an
  excluded identity operates through VPC endpoints without any
  network activity record.
domain: exposure
severity: high
axioms: [A4, D8]
compliance:
  nist_800_53_r5: "AU-3, AU-12"
  soc2: "CC7.2"
  ccm_v4: ["LOG-01", "LOG-05"]
scope_tags:
  - aws
  - cloudtrail
taxonomy:
  - logging
  - detection-evasion
subtractive_category:
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_cloudtrail_trail]
params:
  attack_stage: detection_evasion
observation_fields:
  - audit_trail.kind
  - audit_trail.network_activity_events.enabled
  - audit_trail.network_activity_events.has_identity_filter
remediation:
  description: >
    CloudTrail network activity event selectors filter by
    UserIdentity. Some principals' VPC endpoint traffic is
    not logged.
  action: >
    Remove UserIdentity field selectors from the advanced
    event selector for networkActivity events. Log all
    principals' network activity without identity-based
    filtering.
  example: |
    {
      "audit_trail": {
        "kind": "trail",
        "network_activity_events": {
          "enabled": true,
          "has_identity_filter": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.audit_trail.kind
      op: eq
      value: trail
    - field: properties.audit_trail.network_activity_events.enabled
      op: eq
      value: true
    - field: properties.audit_trail.network_activity_events.has_identity_filter
      op: eq
      value: true
tests:
  - name: "trail with identity filter on network activity — fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cloudtrail:us-east-1:111122223333:trail/main-trail"
      asset_type: aws_cloudtrail_trail
      vendor: aws
      properties:
        audit_trail:
          kind: trail
          network_activity_events:
            enabled: true
            has_identity_filter: true
  - name: "trail without identity filter — passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:cloudtrail:us-east-1:111122223333:trail/main-trail"
      asset_type: aws_cloudtrail_trail
      vendor: aws
      properties:
        audit_trail:
          kind: trail
          network_activity_events:
            enabled: true
            has_identity_filter: false
