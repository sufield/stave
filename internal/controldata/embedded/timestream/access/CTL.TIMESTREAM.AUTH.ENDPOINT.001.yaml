dsl_version: ctrl.v1
id: CTL.TIMESTREAM.AUTH.ENDPOINT.001
name: Timestream Endpoint Must Require Authentication
description: >
  Amazon Timestream database endpoint does not require
  authentication. Without endpoint-level authentication,
  any client with network access can query or write
  time-series data.
domain: exposure
severity: low
compliance:
  nist_800_53_r5: "AC-3, IA-2"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2"
scope_tags:
  - aws
  - timestream
taxonomy:
  - compliance-mapping
  - network-perimeter
subtractive_category:
  - S03
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_timestream_database]
params:
  attack_stage: initial_access
remediation:
  description: >
    Timestream endpoint does not require authentication.
  action: >
    Configure the Timestream database to require IAM
    authentication for query and write access.
  example: |
    {
      "database": {
        "kind": "timestream_database",
        "auth": {
          "endpoint_auth_required": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.database.kind
      op: eq
      value: timestream_database
    - field: properties.database.auth.endpoint_auth_required
      op: ne
      value: true
tests:
  - name: unauthenticated Timestream fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:timestream:us-east-1:123456789012:database/my_db"
      asset_type: aws_timestream_database
      vendor: aws
      properties:
        database:
          kind: timestream_database
          auth:
            endpoint_auth_required: false
  - name: authenticated Timestream passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:timestream:us-east-1:123456789012:database/my_db"
      asset_type: aws_timestream_database
      vendor: aws
      properties:
        database:
          kind: timestream_database
          auth:
            endpoint_auth_required: true
