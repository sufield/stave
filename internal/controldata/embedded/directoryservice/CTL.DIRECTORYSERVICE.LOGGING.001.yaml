dsl_version: ctrl.v1
id: CTL.DIRECTORYSERVICE.LOGGING.001
name: Directory Service Log Forwarding Not Configured
description: >
  AWS Managed Microsoft AD directory does not forward logs to
  CloudWatch. Without log forwarding, authentication events,
  group policy changes, and directory modifications are not
  available for security monitoring or incident investigation.
domain: governance
severity: medium
compliance:
  nist_800_53_r5: "AU-2, AU-6"
  soc2: "CC7.1"
  ccm_v4: ["LOG-03"]
scope_tags:
  - aws
  - directoryservice
taxonomy:
  - monitoring
subtractive_category:
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_directory_service]
params:
  attack_stage: detection_evasion
  blast_radius:
    type: detection
    scope: account
    multiplier: 2.0
remediation:
  description: >
    Directory Service log forwarding to CloudWatch is not
    configured.
  action: >
    Enable log forwarding: aws ds create-log-subscription
    --directory-id <dir-id> --log-group-name /aws/directoryservice/<dir-id>.
  example: |
    {
      "directory": {
        "kind": "managed_ad",
        "logging": {
          "cloudwatch_configured": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.directory.kind
      op: eq
      value: managed_ad
    - field: properties.directory.logging.cloudwatch_configured
      op: ne
      value: true
tests:
  - name: "no log forwarding fails"
    verdict: VIOLATION
    asset:
      asset_id: "d-123456abcd"
      asset_type: aws_directory_service
      vendor: aws
      properties:
        directory:
          kind: managed_ad
          logging:
            cloudwatch_configured: false
  - name: "log forwarding configured passes"
    verdict: PASS
    asset:
      asset_id: "d-123456abcd"
      asset_type: aws_directory_service
      vendor: aws
      properties:
        directory:
          kind: managed_ad
          logging:
            cloudwatch_configured: true
