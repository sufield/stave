dsl_version: ctrl.v1
id: CTL.MQ.ENGINE.EOL.001
name: Amazon MQ Engine Version Must Not Be End-of-Life
description: >
  Amazon MQ brokers must not run engine versions that have reached
  end-of-life. RabbitMQ 3.8 and 3.9 reached EOL in 2023, and
  ActiveMQ 5.15 is past community support. AWS publishes version
  support timelines per engine; brokers on EOL versions no longer
  receive security patches from the engine vendor. Message brokers
  handle authentication credentials, application events, and
  inter-service communication — an unpatched broker engine is a
  credential-bearing service running unmaintained code. AWS will
  eventually force-upgrade brokers on deprecated versions during
  a maintenance window the operator did not schedule.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SI-2"
  soc2: "CC7.1"
  pci_dss_v4.0: "6.3.3"
  ccm_v4: ["TVM-04"]
scope_tags:
  - aws
  - mq
taxonomy:
  - compliance-mapping
  - deprecation
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_mq_broker
params:
  attack_stage: persistence
remediation:
  description: >
    Amazon MQ broker runs an engine version that has reached
    end-of-life. Security patches are no longer issued by the
    engine vendor.
  action: >
    Upgrade the broker to a supported engine version. For
    RabbitMQ, upgrade to 3.13.x. For ActiveMQ, upgrade to 5.17.x
    or later. Use aws mq update-broker --engine-version <ver>.
    Test message consumers and producers against the new version
    before upgrading production — major version upgrades may
    change protocol behavior or deprecate features.
  example: |
    {
      "messaging": {
        "kind": "mq_broker",
        "engine_version": {
          "is_eol": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.messaging.kind
      op: eq
      value: mq_broker
    - field: properties.messaging.engine_version.is_eol
      op: eq
      value: true
