dsl_version: ctrl.v1
id: CTL.MQ.LOG.AUDIT.001
name: Amazon MQ Broker Must Have Audit Logging Enabled
description: >
  Amazon MQ broker does not have audit logging enabled. Audit
  logs capture broker authentication events, connection attempts,
  and administrative actions. Without audit logging, unauthorized
  access to message queues and topics cannot be detected or
  investigated after the fact.
domain: detection
severity: medium
compliance:
  nist_800_53_r5: "AU-2, AU-3"
  soc2: "CC7.2"
  pci_dss_v4.0: "10.2"
scope_tags:
  - aws
  - mq
taxonomy:
  - compliance-mapping
  - logging
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_mq_broker]
params:
  attack_stage: discovery
remediation:
  description: >
    Amazon MQ broker audit logging is not enabled.
  action: >
    Enable audit logging for the Amazon MQ broker. Audit logs
    are delivered to CloudWatch Logs and capture authentication
    and connection events.
  example: |
    {
      "messaging": {
        "kind": "broker",
        "logging": {
          "audit_log_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.messaging.kind
      op: eq
      value: broker
    - field: properties.messaging.logging.audit_log_enabled
      op: ne
      value: true
tests:
  - name: audit logging disabled fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:mq:us-east-1:123456789012:broker:my-broker:b-1234"
      asset_type: aws_mq_broker
      vendor: aws
      properties:
        messaging:
          kind: broker
          logging:
            audit_log_enabled: false
  - name: audit logging enabled passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:mq:us-east-1:123456789012:broker:my-broker:b-1234"
      asset_type: aws_mq_broker
      vendor: aws
      properties:
        messaging:
          kind: broker
          logging:
            audit_log_enabled: true
