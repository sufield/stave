dsl_version: ctrl.v1
id: CTL.SSM.SESSION.LOGGING.001
name: SSM Session Manager Must Have Logging Enabled
description: >
  SSM Session Manager session preferences do not enable logging
  to S3 or CloudWatch Logs. Without session logging, interactive
  shell sessions to EC2 instances leave no audit trail. An
  attacker or insider who accesses an instance via Session Manager
  can execute arbitrary commands without detection. Session
  logging is configured via the SSM-SessionManagerRunShell document.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "AU-2"
  soc2: "CC7.2"
  ccm_v4: ["LOG-03"]
scope_tags: [aws, ssm]
taxonomy:
  - compliance-mapping
  - logging
subtractive_category:
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_ssm_parameter]
params:
  attack_stage: detection_evasion
remediation:
  description: SSM Session Manager logging is not enabled.
  action: >
    Configure the SSM-SessionManagerRunShell document to log sessions
    to an S3 bucket or CloudWatch Logs log group.
  example: |
    {"governance": {"kind": "ssm_session_preferences", "logging": {"s3_enabled": true, "cloudwatch_enabled": true}}}
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: ssm_session_preferences
    - field: properties.governance.logging.s3_enabled
      op: eq
      value: false
    - field: properties.governance.logging.cloudwatch_enabled
      op: eq
      value: false
