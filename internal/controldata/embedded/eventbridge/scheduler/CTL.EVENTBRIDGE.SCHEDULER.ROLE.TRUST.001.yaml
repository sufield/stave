dsl_version: ctrl.v1
id: CTL.EVENTBRIDGE.SCHEDULER.ROLE.TRUST.001
name: EventBridge Scheduler Role Trust Policy Not Restricted To Scheduler Service
description: >
  EventBridge Scheduler invocation role's trust policy does not
  restrict AssumeRole to scheduler.amazonaws.com — the role can
  be assumed by other AWS services or by IAM principals through
  the standard sts:AssumeRole path. Scheduler-only trust is the
  AWS-recommended posture; broader trust expands which principals
  can pivot through the role to the schedule's target permissions.
domain: governance
severity: high
compliance:
  soc2: "CC6.1, CC6.3"
  nist_800_53_r5: "AC-3, AC-6, IA-2"
  pci_dss_v4.0: "7.2, 8.3"
  fedramp_moderate: "AC-3, AC-6"
  iso_27001_2022: "A.5.15, A.8.2"
  ccm_v4: ["IAM-04", "IAM-16"]
scope_tags:
  - aws
  - eventbridge
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eventbridge_schedule
params:
  attack_stage: privilege_escalation
  blast_radius:
    type: control
    scope: account
    multiplier: 2.0
remediation:
  description: >
    EventBridge Scheduler role trust policy permits assumption
    beyond scheduler.amazonaws.com.
  action: >
    Restrict the trust policy to a single Statement allowing
    sts:AssumeRole only when Principal.Service is
    scheduler.amazonaws.com. Add a Condition with
    aws:SourceAccount = your account ID and aws:SourceArn
    matching the schedule ARN pattern to prevent confused-deputy
    use across accounts. Remove any other Service or AWS
    principals from the trust.
  example: |
    {
      "governance": {
        "kind": "eventbridge_schedule",
        "events": {
          "role_trust_scheduler_only": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: eventbridge_schedule
    - field: properties.governance.events.role_trust_scheduler_only
      op: eq
      value: false
defect: >
  EventBridge Scheduler invocation role trust policy is not
  restricted to scheduler.amazonaws.com.
infection: >
  The role's trust policy lists service principals beyond
  scheduler.amazonaws.com — typically left over from when a role
  was repurposed from another service, or copy-pasted from a
  template that listed multiple services for portability.
  Any service whose principal is in the trust policy can assume
  the role. If the role grants the schedule's target invocation
  permissions, those permissions become reachable from outside
  the Scheduler control plane. Cross-account misconfiguration
  compounds the risk: without aws:SourceAccount or aws:SourceArn
  conditions, a confused-deputy pattern lets an external account
  trick another service into assuming the role on its behalf.
failure: >
  Identity-boundary expansion. The role's target permissions
  are reachable from principals beyond Scheduler; cross-account
  confused deputy is possible if no source-condition is set.
tests:
  - name: role with broad trust fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:scheduler:us-east-1:111122223333:schedule/default/nightly"
      asset_type: aws_eventbridge_schedule
      vendor: aws
      properties:
        governance:
          kind: eventbridge_schedule
          events:
            role_trust_scheduler_only: false
  - name: role with scheduler-only trust passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:scheduler:us-east-1:111122223333:schedule/default/nightly"
      asset_type: aws_eventbridge_schedule
      vendor: aws
      properties:
        governance:
          kind: eventbridge_schedule
          events:
            role_trust_scheduler_only: true
