dsl_version: ctrl.v1
id: CTL.EVENTBRIDGE.SCHEDULER.GROUP.NOCMK.001
name: EventBridge Scheduler Schedule Group Encrypted With AWS-Managed Key
description: >
  EventBridge Scheduler schedule group has KmsKeyArn empty or set
  to the AWS-managed key (aws/scheduler) instead of a customer-
  managed key (CMK). Schedule input payloads — the body delivered
  to the target on each fire — may contain sensitive data
  (account-scoped IDs, payload templates with detail fields).
  AWS-managed-key encryption can't be revoked, audited at the
  key level, or rotated on the org's schedule. Same CMK-vs-AWS-
  managed pattern as SNS topic encryption.
domain: governance
severity: medium
compliance:
  soc2: "CC6.1"
  nist_800_53_r5: "SC-12, SC-28"
  pci_dss_v4.0: "3.5"
  fedramp_moderate: "SC-12, SC-28"
  iso_27001_2022: "A.5.17, A.8.24"
  ccm_v4: ["CEK-02", "CEK-03"]
scope_tags:
  - aws
  - eventbridge
taxonomy:
  - compliance-mapping
  - encryption-at-rest
subtractive_category:
  - S07
  - S09
  - S10
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eventbridge_schedule_group
params:
  attack_stage: collection
remediation:
  description: >
    EventBridge Scheduler schedule group uses AWS-managed key
    encryption.
  action: >
    Create a customer-managed KMS key with appropriate key
    policy (allowing scheduler.amazonaws.com encrypt/decrypt for
    schedules in this account, restricted by SourceArn) and
    update the schedule group's KmsKeyArn (UpdateScheduleGroup).
    Schedules created in the group inherit the group's
    encryption key.
  example: |
    {
      "governance": {
        "kind": "eventbridge_schedule_group",
        "events": {
          "uses_cmk": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: eventbridge_schedule_group
    - field: properties.governance.events.uses_cmk
      op: eq
      value: false
defect: >
  EventBridge Scheduler schedule group uses AWS-managed key
  encryption rather than a customer-managed KMS key.
infection: >
  Schedule input payloads are encrypted with the AWS-managed
  key aws/scheduler. The org has no policy control over the
  key, no per-key audit visibility, and no ability to rotate
  on its own cadence. If the org's compliance posture requires
  CMK encryption for stored payload material, this group falls
  outside that boundary. Migrating later requires creating new
  schedules in a new group; existing schedules can't be moved
  between groups.
failure: >
  Compliance / audit gap. Schedule input payloads are encrypted
  but not under the org's key-management control.
tests:
  - name: group with AWS-managed key fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:scheduler:us-east-1:111122223333:schedule-group/default"
      asset_type: aws_eventbridge_schedule_group
      vendor: aws
      properties:
        governance:
          kind: eventbridge_schedule_group
          events:
            uses_cmk: false
  - name: group with CMK passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:scheduler:us-east-1:111122223333:schedule-group/default"
      asset_type: aws_eventbridge_schedule_group
      vendor: aws
      properties:
        governance:
          kind: eventbridge_schedule_group
          events:
            uses_cmk: true
