dsl_version: ctrl.v1
id: CTL.EVENTBRIDGE.SCHEDULER.ROLE.WILDCARD.001
name: EventBridge Scheduler Role Grants Wildcard Target Actions
description: >
  EventBridge Scheduler schedule's invocation IAM role grants
  wildcard actions on the target service (lambda:*, states:*,
  ecs:*, sqs:*) instead of the specific InvokeFunction /
  StartExecution / RunTask / SendMessage action the schedule
  needs. The role grants substantially more than the schedule
  exercises; if the role is ever assumed by another principal
  (role trust gap, audit blind spot), the wildcard scope brings
  the full attack surface with it. Same overprivilege pattern as
  Lambda execution roles.
domain: governance
severity: high
compliance:
  soc2: "CC6.1, CC6.3"
  nist_800_53_r5: "AC-3, AC-6"
  pci_dss_v4.0: "7.2"
  fedramp_moderate: "AC-3, AC-6"
  iso_27001_2022: "A.5.15, A.8.2"
  ccm_v4: ["IAM-04", "IAM-16"]
scope_tags:
  - aws
  - eventbridge
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eventbridge_schedule
params:
  attack_stage: privilege_escalation
  blast_radius:
    type: control
    scope: account
    multiplier: 2.0
remediation:
  description: >
    EventBridge Scheduler invocation role grants wildcard target
    actions instead of the specific action the schedule
    requires.
  action: >
    Replace the wildcard with the single action the target
    needs: lambda:InvokeFunction (Lambda target),
    states:StartExecution (Step Functions target), ecs:RunTask
    plus iam:PassRole (ECS task target), sqs:SendMessage (SQS
    target), or the Universal-target's specific service:Action.
    Restrict the Resource to the specific target ARN, not
    Resource: *.
  example: |
    {
      "governance": {
        "kind": "eventbridge_schedule",
        "events": {
          "role_has_wildcard": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: eventbridge_schedule
    - field: properties.governance.events.role_has_wildcard
      op: eq
      value: true
defect: >
  EventBridge Scheduler invocation role grants wildcard target
  actions instead of the minimum required action.
infection: >
  The scheduler role is broader than the schedule's actual
  invocation needs. The schedule uses one specific action
  (e.g., lambda:InvokeFunction); the role permits the entire
  service. Any principal that can assume the role — through a
  trust-policy gap, role-chain pivot, or compromise of the
  Scheduler control plane — gets the full wildcard scope. The
  schedule itself runs unchanged; the excess privilege is
  dormant attack surface.
failure: >
  Latent privilege escalation surface. Compromise of the
  scheduler role yields full wildcard permissions on the target
  service, far beyond what the schedule itself uses.
tests:
  - name: schedule with wildcard role fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:scheduler:us-east-1:111122223333:schedule/default/nightly"
      asset_type: aws_eventbridge_schedule
      vendor: aws
      properties:
        governance:
          kind: eventbridge_schedule
          events:
            role_has_wildcard: true
  - name: schedule with scoped role passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:scheduler:us-east-1:111122223333:schedule/default/nightly"
      asset_type: aws_eventbridge_schedule
      vendor: aws
      properties:
        governance:
          kind: eventbridge_schedule
          events:
            role_has_wildcard: false
