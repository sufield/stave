dsl_version: ctrl.v1
id: CTL.EVENTBRIDGE.CONNECTION.BASIC.PLAINTEXT.001
name: EventBridge Connection Stores BASIC Auth Credentials In Plaintext
description: >
  EventBridge Connection uses BASIC authentication with username
  and password supplied directly in the connection definition
  rather than via a Secrets Manager reference. The credentials
  are visible to any principal with events:DescribeConnection,
  CloudTrail logs them in PutConnection / UpdateConnection
  events, and rotation requires editing the connection
  definition rather than rotating a secret.
domain: exposure
severity: high
compliance:
  soc2: "CC6.1, CC6.3"
  nist_800_53_r5: "AC-3, IA-5, SC-28"
  pci_dss_v4.0: "3.5, 8.3"
  fedramp_moderate: "AC-3, IA-5"
  iso_27001_2022: "A.5.17, A.8.5, A.8.24"
  ccm_v4: ["IAM-02", "IAM-16"]
scope_tags:
  - aws
  - eventbridge
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - logging
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eventbridge_connection
params:
  attack_stage: credential_access
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.5
remediation:
  description: >
    EventBridge Connection BASIC auth has plaintext credentials
    in the connection definition.
  action: >
    Move credentials to AWS Secrets Manager. Update the
    connection's BasicAuthParameters to use a SECRETS_MANAGER
    reference. Configure the secret for automatic rotation and
    grant the connection's role secretsmanager:GetSecretValue
    on the secret ARN only.
  example: |
    {
      "governance": {
        "kind": "eventbridge_connection",
        "events": {
          "auth_type": "BASIC",
          "credentials_via_secret": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: eventbridge_connection
    - field: properties.governance.events.auth_type
      op: eq
      value: BASIC
    - field: properties.governance.events.credentials_via_secret
      op: eq
      value: false
defect: >
  EventBridge Connection BASIC auth credentials are stored in
  the connection definition rather than referenced from
  Secrets Manager.
infection: >
  The connection's BasicAuthParameters carry the partner's
  credentials in plain text. Every principal with
  events:DescribeConnection sees them. CloudTrail logs the
  PutConnection / UpdateConnection events with the credential
  payload. Rotation requires editing the connection rather
  than rotating a secret. The partner endpoint's authentication
  boundary now depends on every reader of connection
  definitions being trusted.
failure: >
  Credential exposure. Partner credentials are visible in
  connection configuration to a broad set of principals;
  rotation is manual and CloudTrail-logged.
tests:
  - name: BASIC connection with plaintext credentials fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:connection/partner"
      asset_type: aws_eventbridge_connection
      vendor: aws
      properties:
        governance:
          kind: eventbridge_connection
          events:
            auth_type: "BASIC"
            credentials_via_secret: false
  - name: BASIC connection with secret reference passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:connection/partner"
      asset_type: aws_eventbridge_connection
      vendor: aws
      properties:
        governance:
          kind: eventbridge_connection
          events:
            auth_type: "BASIC"
            credentials_via_secret: true
