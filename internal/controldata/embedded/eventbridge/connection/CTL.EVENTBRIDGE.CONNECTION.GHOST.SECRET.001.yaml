dsl_version: ctrl.v1
id: CTL.EVENTBRIDGE.CONNECTION.GHOST.SECRET.001
name: EventBridge Connection References Deleted Secrets Manager Secret
description: >
  EventBridge Connection's auth parameters reference an AWS
  Secrets Manager secret that no longer exists. Every API
  destination invocation through this connection requires the
  connection's auth credentials, which are fetched from the
  named secret — when the secret is gone, the destination
  invocation fails authentication. Same ghost-reference pattern
  as the other EB ghost-target controls but on the auth surface.
domain: governance
severity: high
compliance:
  soc2: "CC6.1, CC8.1, CC7.4"
  nist_800_53_r5: "CM-2, CM-3, IA-5"
  fedramp_moderate: "CM-2, IA-5"
  iso_27001_2022: "A.5.16, A.5.17, A.8.32"
  ccm_v4: ["BCR-08", "IAM-02"]
scope_tags:
  - aws
  - eventbridge
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eventbridge_connection
params:
  attack_stage: detection_evasion
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.0
remediation:
  description: >
    EventBridge Connection references a Secrets Manager secret
    that has been deleted. Every API destination invocation
    fails authentication.
  action: >
    Recreate the secret at the original ARN with the current
    valid credentials, repoint the connection to a live secret
    via UpdateConnection, or delete the connection and the
    associated API destinations if the integration is being
    decommissioned. Audit which API destinations depend on this
    connection (events:DescribeApiDestination, filter by
    ConnectionArn) and consider their failure mode while the
    secret is missing.
  example: |
    {
      "governance": {
        "kind": "eventbridge_connection",
        "events": {
          "secret_arn": "arn:aws:secretsmanager:us-east-1:111122223333:secret:eb-partner-api",
          "secret_exists": true,
          "has_ghost_secret": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: eventbridge_connection
    - field: properties.governance.events.has_ghost_secret
      op: eq
      value: true
defect: >
  EventBridge Connection references a Secrets Manager secret
  ARN that has been deleted.
infection: >
  The connection's auth parameters point at a Secrets Manager
  ARN. When an API destination invocation needs credentials,
  the EventBridge data plane resolves the ARN — the secret no
  longer exists, GetSecretValue fails, the invocation
  authentication fails. The partner endpoint never receives
  the request. The connection appears configured (DescribeConnection
  shows the secret ARN); every actual invocation through it
  fails. Operators investigating "why aren't events reaching
  partner X" find a connection that looks healthy but a data
  plane that can't authenticate.
failure: >
  Silent destination failure. API destination invocations
  through the connection fail authentication; partner-bound
  events are never delivered.
tests:
  - name: connection with ghost secret fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:connection/partner"
      asset_type: aws_eventbridge_connection
      vendor: aws
      properties:
        governance:
          kind: eventbridge_connection
          events:
            secret_arn: "arn:aws:secretsmanager:us-east-1:111122223333:secret:eb-partner-api-deleted"
            secret_exists: false
            has_ghost_secret: true
  - name: connection with live secret passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:connection/partner"
      asset_type: aws_eventbridge_connection
      vendor: aws
      properties:
        governance:
          kind: eventbridge_connection
          events:
            secret_arn: "arn:aws:secretsmanager:us-east-1:111122223333:secret:eb-partner-api"
            secret_exists: true
            has_ghost_secret: false
