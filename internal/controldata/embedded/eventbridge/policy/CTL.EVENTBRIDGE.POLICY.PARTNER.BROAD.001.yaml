dsl_version: ctrl.v1
id: CTL.EVENTBRIDGE.POLICY.PARTNER.BROAD.001
name: EventBridge Bus Policy Allows Partner Event Source Registration Broadly
description: >
  EventBridge bus resource policy grants
  events:CreatePartnerEventSource to principals beyond a tightly-
  scoped administrative role. Partner event sources are SaaS
  integrations (Datadog, PagerDuty, Auth0, etc.) that publish
  events into the bus. Allowing broad registration means an
  unauthorized account or role can register a partner-shaped
  source and inject events that downstream rules treat as coming
  from a trusted partner.
domain: exposure
severity: medium
compliance:
  soc2: "CC6.1, CC6.3, CC6.6"
  nist_800_53_r5: "AC-3, AC-6, SC-7"
  fedramp_moderate: "AC-3, AC-6"
  iso_27001_2022: "A.5.15, A.5.19, A.8.2"
  ccm_v4: ["IAM-04", "IAM-16"]
scope_tags:
  - aws
  - eventbridge
taxonomy:
  - compliance-mapping
  - least-privilege
subtractive_category:
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eventbridge_bus
params:
  attack_stage: initial_access
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.0
remediation:
  description: >
    EventBridge bus policy grants partner-event-source registration
    beyond an administrative role.
  action: >
    Restrict events:CreatePartnerEventSource and
    events:CreateEventBus (for partner buses) to a dedicated
    platform-admin role. Audit existing partner event sources via
    ListPartnerEventSources for unexpected registrations.
  example: |
    {
      "governance": {
        "kind": "eventbridge_bus",
        "events": {
          "policy_partner_broad": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: eventbridge_bus
    - field: properties.governance.events.policy_partner_broad
      op: eq
      value: true
defect: >
  EventBridge bus policy grants events:CreatePartnerEventSource
  to a broad set of principals.
infection: >
  Any principal granted partner-source registration can create
  a partner-shaped event source. Once registered, the source can
  publish events into the bus. Downstream rules that filter on
  source = partner-name treat these events as coming from a
  legitimate SaaS integration. The attacker has effectively
  established a trusted publishing channel into the org's
  automation surface.
failure: >
  Untrusted partner registration. Attacker-controlled partner
  events flow into the bus and are treated by consumer rules as
  legitimate SaaS-originated events.
tests:
  - name: bus policy with broad partner registration fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:event-bus/app"
      asset_type: aws_eventbridge_bus
      vendor: aws
      properties:
        governance:
          kind: eventbridge_bus
          events:
            policy_partner_broad: true
  - name: bus policy with scoped partner registration passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:event-bus/app"
      asset_type: aws_eventbridge_bus
      vendor: aws
      properties:
        governance:
          kind: eventbridge_bus
          events:
            policy_partner_broad: false
