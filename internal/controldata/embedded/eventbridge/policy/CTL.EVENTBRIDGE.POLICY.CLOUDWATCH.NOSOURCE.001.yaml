dsl_version: ctrl.v1
id: CTL.EVENTBRIDGE.POLICY.CLOUDWATCH.NOSOURCE.001
name: EventBridge Bus Policy Allows CloudWatch PutEvents Without SourceAccount
description: >
  EventBridge bus resource policy grants events:PutEvents to the
  CloudWatch service principal (cloudwatch.amazonaws.com or
  events.amazonaws.com on cross-account flows) without an
  aws:SourceAccount or aws:SourceArn condition. Any CloudWatch
  alarm in any AWS account can publish events to the bus. The bus
  accepts the spoofed alarm-state-change event; downstream rules
  matching alarm-related patterns fire on attacker-controlled
  input — including security-response automations.
domain: exposure
severity: high
compliance:
  cis_aws_v3.0: "1.20"
  soc2: "CC6.1, CC6.6"
  nist_800_53_r5: "AC-3, AC-4, SC-7"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.5.15, A.8.9"
  ccm_v4: ["IAM-16", "IVS-09"]
scope_tags:
  - aws
  - eventbridge
taxonomy:
  - compliance-mapping
  - confused-deputy
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eventbridge_bus
params:
  attack_stage: initial_access
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.0
remediation:
  description: >
    EventBridge bus policy authorizes the CloudWatch service
    principal without a source-account or source-ARN restriction.
    Any account's CloudWatch alarm can publish to the bus.
  action: >
    Add aws:SourceAccount (the legitimate publishing account) or
    aws:SourceArn (the specific alarm ARN) to every statement
    granting CloudWatch PutEvents.
  example: |
    {
      "governance": {
        "kind": "eventbridge_bus",
        "events": {
          "policy_allows_cloudwatch": true,
          "policy_cloudwatch_has_source": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: eventbridge_bus
    - field: properties.governance.events.policy_allows_cloudwatch
      op: eq
      value: true
    - field: properties.governance.events.policy_cloudwatch_has_source
      op: eq
      value: false
defect: >
  EventBridge bus policy authorizes CloudWatch service principal
  PutEvents without aws:SourceAccount or aws:SourceArn.
infection: >
  The bus policy grants PutEvents to the CloudWatch service
  principal without binding the source account or source ARN. An
  attacker with access to any AWS account creates an alarm whose
  state change shape mimics a legitimate alarm-fired event, then
  triggers it. The bus ingests the event; downstream rules matching
  alarm patterns invoke their targets on the spoofed payload.
  Security automation that auto-remediates on alarm fire becomes
  attacker-driven.
failure: >
  Spoofed alarm injection. Any account's CloudWatch alarm can
  appear to be an internal alarm and trigger remediation
  automation.
tests:
  - name: CloudWatch principal without source condition fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:event-bus/ops"
      asset_type: aws_eventbridge_bus
      vendor: aws
      properties:
        governance:
          kind: eventbridge_bus
          events:
            policy_allows_cloudwatch: true
            policy_cloudwatch_has_source: false
  - name: CloudWatch principal with sourceAccount passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:event-bus/ops"
      asset_type: aws_eventbridge_bus
      vendor: aws
      properties:
        governance:
          kind: eventbridge_bus
          events:
            policy_allows_cloudwatch: true
            policy_cloudwatch_has_source: true
