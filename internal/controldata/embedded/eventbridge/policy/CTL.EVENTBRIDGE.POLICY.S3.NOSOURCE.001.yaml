dsl_version: ctrl.v1
id: CTL.EVENTBRIDGE.POLICY.S3.NOSOURCE.001
name: EventBridge Bus Policy Allows S3 PutEvents Without SourceArn
description: >
  EventBridge bus resource policy grants events:PutEvents to the S3
  service principal (s3.amazonaws.com) without an aws:SourceArn or
  aws:SourceAccount condition. Any S3 bucket in any AWS account can
  configure event notifications targeting the bus and have them
  accepted. Same confused-deputy pattern as
  CTL.SQS.POLICY.S3.NOSOURCE.001 / CTL.SNS.POLICY.S3.NOSOURCE.001 —
  but the EventBridge variant has the largest blast radius because
  the injected event reaches every rule whose pattern matches it,
  including security-automation Lambdas, downstream Step Functions,
  and cross-account targets.
domain: exposure
severity: high
compliance:
  cis_aws_v3.0: "1.20"
  soc2: "CC6.1, CC6.6"
  nist_800_53_r5: "AC-3, AC-4, SC-7"
  pci_dss_v4.0: "1.2, 7.1"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.5.15, A.8.9"
  ccm_v4: ["IAM-16", "IVS-09"]
scope_tags:
  - aws
  - eventbridge
taxonomy:
  - compliance-mapping
  - confused-deputy
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eventbridge_bus
params:
  attack_stage: initial_access
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.5
remediation:
  description: >
    EventBridge bus policy authorizes the S3 service principal
    without source restriction. Any S3 bucket in any account can
    publish event notifications to the bus.
  action: >
    Add aws:SourceArn (the legitimate bucket ARN) or
    aws:SourceAccount (the bucket-owning account) to every Statement
    granting s3.amazonaws.com PutEvents. Combine both for defense in
    depth — sourceArn pins the specific bucket, sourceAccount blocks
    any bucket in foreign accounts.
  example: |
    {
      "governance": {
        "kind": "eventbridge_bus",
        "events": {
          "policy_allows_s3": true,
          "policy_s3_has_source": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: eventbridge_bus
    - field: properties.governance.events.policy_allows_s3
      op: eq
      value: true
    - field: properties.governance.events.policy_s3_has_source
      op: eq
      value: false
defect: >
  EventBridge bus policy authorizes S3 service principal PutEvents
  without aws:SourceArn or aws:SourceAccount.
infection: >
  The bus policy grants events:PutEvents to s3.amazonaws.com without
  restricting which bucket may publish. An attacker creates a bucket
  in their own account, configures a PutObject event notification
  targeting the bus ARN, and uploads an object. The bus accepts the
  attacker-controlled S3 event. Every rule whose pattern matches
  fires — security-response Lambdas, automation pipelines, audit
  ingestors — each treating the spoofed event as legitimate. The
  blast radius is every downstream consumer.
failure: >
  Cross-account event injection. Any S3 bucket in any account can
  inject S3-shaped events into the bus, triggering every matching
  rule and every downstream target on attacker-controlled input.
tests:
  - name: S3 principal without source condition fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:event-bus/app"
      asset_type: aws_eventbridge_bus
      vendor: aws
      properties:
        governance:
          kind: eventbridge_bus
          events:
            policy_allows_s3: true
            policy_s3_has_source: false
  - name: S3 principal with sourceArn passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:event-bus/app"
      asset_type: aws_eventbridge_bus
      vendor: aws
      properties:
        governance:
          kind: eventbridge_bus
          events:
            policy_allows_s3: true
            policy_s3_has_source: true
