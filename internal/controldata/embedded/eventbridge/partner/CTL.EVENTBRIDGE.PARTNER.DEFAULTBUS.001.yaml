dsl_version: ctrl.v1
id: CTL.EVENTBRIDGE.PARTNER.DEFAULTBUS.001
name: EventBridge Partner Event Source Routes To Default Bus
description: >
  EventBridge partner event source (Datadog, PagerDuty,
  Auth0, etc.) is associated with the account's default bus
  rather than a dedicated partner bus. Partner events mix
  with AWS service events and any other application traffic
  on the default bus. Cross-tenant rules can consume partner
  events; archive on the default bus captures partner
  payloads alongside org-internal events; per-partner
  isolation is impossible after association.
domain: exposure
severity: high
compliance:
  soc2: "CC6.1, CC6.6"
  nist_800_53_r5: "AC-3, AC-4, SC-7"
  fedramp_moderate: "AC-3, SC-7"
  iso_27001_2022: "A.5.15, A.8.20"
  ccm_v4: ["IVS-09", "DSP-17"]
scope_tags:
  - aws
  - eventbridge
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eventbridge_partner_source
params:
  attack_stage: collection
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.0
remediation:
  description: >
    EventBridge partner event source is associated with the
    default bus; partner events mix with org traffic.
  action: >
    Create a dedicated partner bus (CreateEventBus with
    EventSourceName matching the partner). Move the partner
    source association to the dedicated bus. The default bus
    should never carry partner events — partner data and
    AWS service events have different access-control,
    archive-retention, and audit profiles.
  example: |
    {
      "governance": {
        "kind": "eventbridge_partner_source",
        "events": {
          "associated_bus_is_default": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: eventbridge_partner_source
    - field: properties.governance.events.associated_bus_is_default
      op: eq
      value: true
defect: >
  EventBridge partner event source is associated with the
  account's default bus.
infection: >
  Partner-source events flow into the default bus. Every rule
  on the default bus sees them. Cross-tenant rules consume
  partner data. Archive on the default bus captures partner
  payloads. Per-partner per-policy isolation isn't
  achievable: partner-source events and AWS service events
  share the same access-control and audit posture.
failure: >
  Cross-tenant partner-data mixing. Partner events visible to
  unrelated rules; per-partner isolation impossible.
tests:
  - name: partner source on default bus fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:partner-event-source/datadog/abc"
      asset_type: aws_eventbridge_partner_source
      vendor: aws
      properties:
        governance:
          kind: eventbridge_partner_source
          events:
            associated_bus: "default"
            associated_bus_is_default: true
  - name: partner source on dedicated bus passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:partner-event-source/datadog/abc"
      asset_type: aws_eventbridge_partner_source
      vendor: aws
      properties:
        governance:
          kind: eventbridge_partner_source
          events:
            associated_bus: "datadog-events"
            associated_bus_is_default: false
