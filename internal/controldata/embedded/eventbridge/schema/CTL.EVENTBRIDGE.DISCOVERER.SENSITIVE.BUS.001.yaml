dsl_version: ctrl.v1
id: CTL.EVENTBRIDGE.DISCOVERER.SENSITIVE.BUS.001
name: EventBridge Schema Discoverer Indexes A Sensitive Event Bus
description: >
  EventBridge schema discoverer is enabled on a bus whose source
  filter or known traffic includes sensitive event sources
  (aws.guardduty, aws.health, aws.config, aws.iam, application
  events with PII detail fields). The discoverer infers schemas
  from event bodies — every shape it sees becomes a registered
  schema definition, including PII field names, account-scoped
  IDs, and finding-detail layouts. The schema registry then
  carries those shapes for anyone with DescribeSchema access to
  read.
domain: exposure
severity: medium
compliance:
  soc2: "CC6.1, CC6.6, P4.0"
  nist_800_53_r5: "AC-3, AC-21, SI-12"
  fedramp_moderate: "AC-3, SI-12"
  iso_27001_2022: "A.5.15, A.8.16, A.8.24"
  ccm_v4: ["DSP-17", "LOG-08"]
scope_tags:
  - aws
  - eventbridge
taxonomy:
  - compliance-mapping
  - monitoring
subtractive_category:
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eventbridge_discoverer
params:
  attack_stage: collection
  blast_radius:
    type: prevention
    scope: account
    multiplier: 1.5
remediation:
  description: >
    EventBridge schema discoverer is indexing a sensitive event
    bus into the schema registry.
  action: >
    Either move the discoverer to a non-sensitive analytics
    bus, or set the discoverer state to STOPPED if the
    discovery sprint is complete. If the schemas of sensitive
    sources must be discovered for downstream codegen, restrict
    DescribeSchema access via a custom registry — don't use
    the default registry.
  example: |
    {
      "governance": {
        "kind": "eventbridge_discoverer",
        "events": {
          "indexes_sensitive_source": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: eventbridge_discoverer
    - field: properties.governance.events.state
      op: eq
      value: STARTED
    - field: properties.governance.events.indexes_sensitive_source
      op: eq
      value: true
defect: >
  EventBridge schema discoverer in STARTED state indexes a bus
  carrying sensitive event sources into the schema registry.
infection: >
  Every event the discoverer observes contributes its shape to
  a registered schema. When the bus carries
  GuardDuty / Config / Health / IAM events, the schema includes
  finding-detail field names, severity-level enum values,
  resource-ARN patterns, and other audit-grade structural
  detail. Anyone with events:DescribeSchema (often a wider
  set than direct event consumers) can list the registry and
  read the schema definitions, including any PII fields the
  discoverer happened to see.
failure: >
  Schema registry leakage. Sensitive event shape — finding
  field structures, audit metadata layouts — is exposed via
  the schema registry to a broader audience than the original
  event consumers.
tests:
  - name: discoverer on GuardDuty-carrying bus fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:schemas:us-east-1:111122223333:discoverer/d-abc"
      asset_type: aws_eventbridge_discoverer
      vendor: aws
      properties:
        governance:
          kind: eventbridge_discoverer
          events:
            state: "STARTED"
            indexes_sensitive_source: true
  - name: discoverer on analytics bus passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:schemas:us-east-1:111122223333:discoverer/d-xyz"
      asset_type: aws_eventbridge_discoverer
      vendor: aws
      properties:
        governance:
          kind: eventbridge_discoverer
          events:
            state: "STARTED"
            indexes_sensitive_source: false
