dsl_version: ctrl.v1
id: CTL.EVENTBRIDGE.PIPE.SOURCE.MSK.NOIAM.001
name: EventBridge Pipe MSK Source Does Not Use IAM Authentication
description: >
  EventBridge Pipe with an Amazon MSK source uses TLS-only or
  SASL_SCRAM authentication instead of IAM-based authentication.
  IAM auth (CLIENT_CERTIFICATE_TLS_AUTH excluded) lets pipe access
  be controlled through standard AWS IAM policies, integrates
  with CloudTrail, and avoids the operational burden of
  rotating SCRAM secrets or distributing client certificates. MSK
  IAM auth is the recommended posture; non-IAM modes are an
  identity-management gap unless there's a documented compatibility
  reason.
domain: governance
severity: medium
compliance:
  soc2: "CC6.1, CC6.3"
  nist_800_53_r5: "AC-3, IA-5"
  fedramp_moderate: "AC-3, IA-5"
  iso_27001_2022: "A.5.15, A.8.2"
  ccm_v4: ["IAM-02", "IAM-04"]
scope_tags:
  - aws
  - eventbridge
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eventbridge_pipe
params:
  attack_stage: credential_access
remediation:
  description: >
    EventBridge Pipe MSK source uses non-IAM authentication.
  action: >
    Switch the pipe's SourceParameters.ManagedStreamingKafkaParameters
    authentication to MSK IAM auth (set credentials reference
    to use IAM rather than SASL_SCRAM secret). Grant the pipe
    role kafka-cluster:Connect plus the per-topic
    kafka-cluster:DescribeTopic / kafka-cluster:ReadData actions
    scoped to the consuming topic ARN. Remove the SCRAM secret
    from the pipe configuration.
  example: |
    {
      "governance": {
        "kind": "eventbridge_pipe",
        "events": {
          "source_type": "msk",
          "msk_auth_type": "IAM"
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: eventbridge_pipe
    - field: properties.governance.events.source_type
      op: eq
      value: msk
    - field: properties.governance.events.msk_auth_type
      op: ne
      value: IAM
defect: >
  EventBridge Pipe MSK source uses TLS-only or SASL_SCRAM
  authentication instead of IAM auth.
infection: >
  The pipe authenticates to MSK with a non-IAM mechanism. SCRAM
  secrets must be rotated manually and stored in Secrets
  Manager; client certificates must be distributed and revoked
  out-of-band. Neither path integrates with IAM policies or
  CloudTrail's per-action audit log. Investigating "who
  consumed which topic" requires correlating MSK broker logs
  rather than CloudTrail. Access revocation requires rotating
  the secret or revoking the cert rather than removing an IAM
  permission.
failure: >
  Identity-management gap. Pipe access to MSK is governed by
  shared secrets / certificates rather than IAM, weakening
  audit and revocation paths.
tests:
  - name: MSK source with SCRAM auth fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:pipes:us-east-1:111122223333:pipe/msk-ingest"
      asset_type: aws_eventbridge_pipe
      vendor: aws
      properties:
        governance:
          kind: eventbridge_pipe
          events:
            source_type: "msk"
            msk_auth_type: "SASL_SCRAM_512_AUTH"
  - name: MSK source with IAM auth passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:pipes:us-east-1:111122223333:pipe/msk-ingest"
      asset_type: aws_eventbridge_pipe
      vendor: aws
      properties:
        governance:
          kind: eventbridge_pipe
          events:
            source_type: "msk"
            msk_auth_type: "IAM"
