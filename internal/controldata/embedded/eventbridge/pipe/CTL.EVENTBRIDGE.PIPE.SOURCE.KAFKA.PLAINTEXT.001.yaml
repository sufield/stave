dsl_version: ctrl.v1
id: CTL.EVENTBRIDGE.PIPE.SOURCE.KAFKA.PLAINTEXT.001
name: EventBridge Pipe Self-Managed Kafka Source Stores Credentials In Plaintext
description: >
  EventBridge Pipe with a self-managed Apache Kafka source has
  authentication credentials configured directly (BasicAuth /
  SASL_SCRAM with cleartext username and password) instead of via
  Secrets Manager reference. The credentials are visible to anyone
  with pipes:DescribePipe permission and rotate only when the pipe
  is updated. Same plaintext-credential pattern as Lambda
  environment variables but in pipe scope.
domain: exposure
severity: high
compliance:
  soc2: "CC6.1, CC6.3"
  nist_800_53_r5: "AC-3, IA-5, SC-28"
  pci_dss_v4.0: "3.5, 8.3"
  fedramp_moderate: "AC-3, IA-5"
  iso_27001_2022: "A.5.17, A.8.5, A.8.24"
  ccm_v4: ["IAM-02", "IAM-16"]
scope_tags:
  - aws
  - eventbridge
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eventbridge_pipe
params:
  attack_stage: credential_access
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.5
remediation:
  description: >
    EventBridge Pipe Kafka source authentication has plaintext
    credentials in the pipe definition.
  action: >
    Move the credentials to AWS Secrets Manager. Replace the
    pipe's SourceParameters.SelfManagedKafkaParameters.Credentials
    with a SECRETS_MANAGER reference (BasicAuth ARN or
    ClientCertificateTlsAuth ARN as appropriate). Configure the
    secret for automatic rotation and grant the pipe role
    secretsmanager:GetSecretValue on the secret ARN only.
  example: |
    {
      "governance": {
        "kind": "eventbridge_pipe",
        "events": {
          "source_type": "self_managed_kafka",
          "kafka_credentials_plaintext": false,
          "kafka_credentials_via_secret": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: eventbridge_pipe
    - field: properties.governance.events.source_type
      op: eq
      value: self_managed_kafka
    - field: properties.governance.events.kafka_credentials_plaintext
      op: eq
      value: true
defect: >
  EventBridge Pipe self-managed Kafka source authentication
  uses plaintext credentials in the pipe definition rather than
  a Secrets Manager reference.
infection: >
  The pipe's source configuration carries the Kafka cluster's
  credentials in plain text. Every principal with
  pipes:DescribePipe — typically a broader set than is required
  for credential access — sees the credentials. CloudTrail logs
  pipes:UpdatePipe events with the credential payload. Rotation
  requires editing the pipe definition rather than rotating a
  secret. The Kafka cluster's authentication boundary now
  depends on every reader of pipe definitions being trusted.
failure: >
  Credential exposure. Kafka cluster credentials are visible in
  pipe configuration to a broad set of principals; rotation is
  manual and CloudTrail-logged.
tests:
  - name: Kafka source with plaintext credentials fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:pipes:us-east-1:111122223333:pipe/kafka-ingest"
      asset_type: aws_eventbridge_pipe
      vendor: aws
      properties:
        governance:
          kind: eventbridge_pipe
          events:
            source_type: "self_managed_kafka"
            kafka_credentials_plaintext: true
  - name: Kafka source with secret reference passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:pipes:us-east-1:111122223333:pipe/kafka-ingest"
      asset_type: aws_eventbridge_pipe
      vendor: aws
      properties:
        governance:
          kind: eventbridge_pipe
          events:
            source_type: "self_managed_kafka"
            kafka_credentials_plaintext: false
            kafka_credentials_via_secret: true
