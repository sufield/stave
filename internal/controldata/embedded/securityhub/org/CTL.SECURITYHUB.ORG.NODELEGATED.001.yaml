dsl_version: ctrl.v1
id: CTL.SECURITYHUB.ORG.NODELEGATED.001
name: Security Hub Has No Delegated Administrator
description: >
  Security Hub is managed from the management account because no
  delegated administrator is registered. Security Hub
  administration — managing standards, integrations, and member
  account enrollment — should run from a dedicated security
  account to separate operational security from organizational
  management.
domain: governance
severity: medium
compliance:
  nist_800_53_r5: "AC-6(5)"
  soc2: "CC6.1"
  ccm_v4: ["IAM-09"]
  scs_c02: "4.8"
scope_tags:
  - aws
  - securityhub
taxonomy:
  - account-governance
  - compliance-mapping
type: unsafe_state
classification: state_assertion
params:
  attack_stage: privilege_escalation
  blast_radius:
    type: governance
    scope: organization
    multiplier: 3.0
remediation:
  description: >
    No delegated administrator registered for Security Hub.
  action: >
    Register a security account as delegated admin: aws
    securityhub enable-organization-admin-account --admin-account-id
    <security-acct>.
  example: |
    {
      "security_hub": {
        "kind": "hub_organization",
        "hub": {
          "delegated_admin_configured": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.security_hub.kind
      op: eq
      value: hub_organization
    - field: properties.security_hub.hub.delegated_admin_configured
      op: eq
      value: false
tests:
  - name: "Security Hub without delegated admin fails"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:organizations::111122223333:organization/o-abc"
      asset_type: aws_securityhub_organization
      vendor: aws
      properties:
        security_hub:
          kind: hub_organization
          hub:
            delegated_admin_configured: false
  - name: "Security Hub with delegated admin passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:organizations::111122223333:organization/o-abc"
      asset_type: aws_securityhub_organization
      vendor: aws
      properties:
        security_hub:
          kind: hub_organization
          hub:
            delegated_admin_configured: true
