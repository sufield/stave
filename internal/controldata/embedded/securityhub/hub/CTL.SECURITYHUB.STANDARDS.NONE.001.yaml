dsl_version: ctrl.v1
id: CTL.SECURITYHUB.STANDARDS.NONE.001
name: Security Hub Must Have Security Standards Enabled
description: >
  Security Hub must have at least one security standard enabled (AWS
  Foundational Security Best Practices, CIS Benchmarks, or PCI DSS).
  Security Hub without standards is a findings aggregator with no
  baseline — it collects third-party findings but performs no
  continuous posture evaluation. Standards provide automated security
  checks that run continuously against account resources.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "SI-4"
  soc2: "CC7.1"
  pci_dss_v4.0: "11.3.1"
  ccm_v4: ["LOG-03"]
scope_tags:
  - aws
  - securityhub
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
remediation:
  description: >
    Security Hub has no security standards enabled. No automated
    posture checks are running.
  action: >
    Enable security standards in Security Hub: aws securityhub
    batch-enable-standards. At minimum enable AWS Foundational
    Security Best Practices (FSBP).
  example: |
    {
      "security_hub": {
        "kind": "hub",
        "enabled": true,
        "standards_enabled": true
      }
    }
unsafe_predicate:
  all:
    - field: properties.security_hub.kind
      op: eq
      value: hub
    - field: properties.security_hub.standards_enabled
      op: eq
      value: false
