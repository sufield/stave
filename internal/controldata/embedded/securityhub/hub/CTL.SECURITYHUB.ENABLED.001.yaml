dsl_version: ctrl.v1
id: CTL.SECURITYHUB.ENABLED.001
name: AWS Security Hub Must Be Enabled
description: >
  Security Hub must be enabled to aggregate security findings from GuardDuty, Inspector, Macie, and Config into a unified view.
domain: exposure
severity: high
compliance:
  soc2: "CC7.1"
  pci_dss_v4.0: "11.3.1"
  nist_800_53_r5: "SI-4"
scope_tags:
  - aws
  - securityhub
type: unsafe_state
params: {}
remediation:
  description: >
    Security Hub is not enabled. Security findings are not aggregated.
  action: >
    Enable Security Hub: aws securityhub enable-security-hub --enable-default-standards
  example: |
    {
      {
      "security_hub": {
        "kind": "hub",
        "enabled": true
      }
    }
    }
unsafe_predicate:
  all:
    - field: properties.security_hub.enabled
      op: eq
      value: false
