dsl_version: ctrl.v1
id: CTL.VPC.CLIENTVPN.LOGGING.001
name: Client VPN Connection Logging Not Enabled
description: >
  Client VPN connection logging is not enabled. The endpoint does not
  record who connected, when they connected, from what source IP, for
  how long, or which authorization rules their traffic matched. After
  a credential compromise, there is no way to identify which VPN
  sessions were the attacker's — every connection is indistinguishable
  from legitimate use.
domain: audit
severity: high
compliance:
  cis_aws_v3.0: "3.9"
  nist_800_53_r5: "AU-2"
  fedramp_moderate: "AU-2"
  pci_dss_v4.0: "10.2.1"
  soc2: "CC7.2"
  hipaa: "164.312(b)"
  ccm_v4: ["LOG-03", "LOG-08"]
scope_tags:
  - aws
  - vpc
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_clientvpn_endpoint
params:
  attack_stage: detection_evasion
observation_fields:
  - network.kind
  - network.clientvpn.endpoint_id
  - network.clientvpn.connection_logging
  - network.clientvpn.log_group
remediation:
  description: >
    Client VPN endpoint does not have connection logging enabled.
    Sessions are not recorded.
  action: >
    Enable connection logging on the Client VPN endpoint. Route
    records to a CloudWatch Logs group in a logging-dedicated
    account. Retain records per incident-response and compliance
    requirements. Alert on unusual source-IP patterns, sessions
    outside business hours, and repeated authentication failures.
  example: |
    {
      "network": {
        "kind": "clientvpn_endpoint",
        "clientvpn": {
          "connection_logging": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: clientvpn_endpoint
    - field: properties.network.clientvpn.connection_logging
      op: eq
      value: false
