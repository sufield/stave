dsl_version: ctrl.v1
id: CTL.VPC.ROUTETABLE.MAIN.PUBLIC.001
name: Main Route Table Has Public Route
description: >
  The VPC's main (default) route table has a 0.0.0.0/0 route to an
  Internet Gateway. Any new subnet created without an explicit custom
  route-table association inherits the main route table — so every
  new subnet is public by default. The operator creating the subnet
  must remember to associate a private route table; omission produces
  an internet-facing subnet silently. The safe default is a main
  route table with no IGW route, so subnets are private unless
  explicitly associated with a public route table.
domain: exposure
severity: high
compliance:
  cis_aws_v3.0: "5.1"
  nist_800_53_r5: "SC-7"
  fedramp_moderate: "SC-7"
  pci_dss_v4.0: "1.2.1"
  soc2: "CC6.6"
  ccm_v4: ["IVS-03", "IVS-06"]
scope_tags:
  - aws
  - vpc
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_vpc_route_table
params:
  attack_stage: initial_access
observation_fields:
  - network.kind
  - network.routetable.is_main
  - network.routetable.has_igw_route
  - network.routetable.igw_route_destination
remediation:
  description: >
    Main route table has a default route pointing to the Internet
    Gateway. New subnets inherit internet connectivity by default.
  action: >
    Remove the 0.0.0.0/0 → IGW route from the main route table.
    Create a dedicated "public-subnets" route table with the IGW
    route and explicitly associate it only with subnets that should
    be public (ALB, NAT, bastion). New subnets inherit the main
    route table, so the main route table should represent the safe
    default (no internet route).
  example: |
    {
      "network": {
        "kind": "route_table",
        "routetable": {
          "is_main": true,
          "has_igw_route": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: route_table
    - field: properties.network.routetable.is_main
      op: eq
      value: true
    - field: properties.network.routetable.has_igw_route
      op: eq
      value: true
