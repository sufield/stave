dsl_version: ctrl.v1
id: CTL.VPC.TGW.PEERING.CROSSREGION.NOENCRYPT.001
name: Cross-Region TGW Peering Without Verified Encryption
description: >
  Transit Gateway peering attachment crosses AWS Regions. Cross-region
  TGW peering carries traffic across the AWS backbone network between
  regions. While AWS encrypts backbone traffic at the physical layer,
  cross-region peering paths should be accounted for in data
  classification and compliance posture. Regulated workloads
  traversing this path may require application-layer encryption
  beyond the default transport encryption.
domain: audit
severity: low
compliance:
  nist_800_53_r5: "SC-8, SC-13"
  fedramp_moderate: "SC-8"
  pci_dss_v4.0: "4.2.1"
  soc2: "CC6.7"
  hipaa: "164.312(e)(1)"
  ccm_v4: ["IVS-03", "CEK-03"]
scope_tags:
  - aws
  - vpc
taxonomy:
  - compliance-mapping
  - network-isolation
  - encryption-in-transit
subtractive_category:
  - S06
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_transit_gateway_peering_attachment
params:
  attack_stage: lateral_movement
observation_fields:
  - network.tgw.peering.is_cross_region
  - network.tgw.peering.requester_region
  - network.tgw.peering.accepter_region
  - network.tgw.peering.state
remediation:
  description: >
    Transit Gateway peering attachment crosses AWS Regions. Cross-region
    traffic should be verified against data classification policy.
  action: >
    Verify that workloads traversing this cross-region peering path
    implement application-layer encryption (TLS, IPsec) appropriate
    for the data classification. Document the cross-region path in
    your network architecture and data flow diagrams. If the peering
    is no longer needed, remove the attachment to eliminate the
    cross-region transit path.
  example: |
    {
      "network": {
        "tgw": {
          "peering": {
            "is_cross_region": false
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.tgw.peering.is_cross_region
      op: eq
      value: true
