dsl_version: ctrl.v1
id: CTL.VPC.NACL.UNRESTRICTED.001
name: Custom NACL Allows All Traffic
description: >
  A custom (non-default) Network ACL is associated with subnets
  but allows all inbound and outbound traffic — the same effect
  as using the default NACL. Creating a custom NACL implies
  intent to filter; an allow-all custom NACL is either a
  misconfiguration or a placeholder from an incomplete
  deployment. The custom NACL's existence creates the
  appearance of defense-in-depth — dashboards show "custom
  NACL: attached" — while providing none of the filtering that
  justifies the extra moving part.
domain: exposure
severity: medium
compliance:
  cis_aws_v3.0: "5.1"
  nist_800_53_r5: "SC-7"
  fedramp_moderate: "SC-7"
  pci_dss_v4.0: "1.3.2"
  soc2: "CC6.6"
  ccm_v4: ["IVS-03", "IVS-06"]
scope_tags:
  - aws
  - vpc
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_vpc_network_acl
params:
  attack_stage: initial_access
observation_fields:
  - network.kind
  - network.nacl.is_custom
  - network.nacl.allows_all
  - network.nacl.rule_count
remediation:
  description: >
    Custom NACL permits all traffic — it provides no filtering
    benefit over the default NACL it replaced.
  action: >
    Replace the allow-all rules with a minimal deny-and-allow
    policy for the subnet's workload. At minimum: deny admin
    ports (22, 3389) from 0.0.0.0/0, deny known-bad CIDR
    blocks, allow only the egress destinations the workload
    requires. If the custom NACL is a placeholder for work
    that never completed, either finish the rule set or delete
    the NACL and re-associate subnets with the default.
  example: |
    {
      "network": {
        "kind": "network_acl",
        "nacl": {
          "allows_all": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: network_acl
    - field: properties.network.nacl.is_custom
      op: eq
      value: true
    - field: properties.network.nacl.allows_all
      op: eq
      value: true
