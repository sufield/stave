dsl_version: ctrl.v1
id: CTL.VPC.ENDPOINT.IAM.CONDITION.001
name: VPC Endpoint Policy Must Require IAM Conditions
description: >
  VPC endpoint policies must include IAM conditions (aws:PrincipalArn,
  aws:PrincipalOrgID) to verify the identity of requesters. Without
  these, any principal in the VPC can use the endpoint without
  identity verification at the policy layer.
domain: network
severity: medium
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["IAM-05", "IVS-03"]
scope_tags:
  - aws
  - vpc
taxonomy:
  - compliance-mapping
  - identity-perimeter
  - network-isolation
subtractive_category:
  - S06
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_vpc_endpoint
params:
  attack_stage: lateral_movement
remediation:
  description: VPC endpoint policy lacks IAM conditions.
  action: >
    Add aws:PrincipalArn or aws:PrincipalOrgID conditions to the
    endpoint policy to restrict which principals can use it.
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: vpc_endpoint
    - field: properties.network.endpoint_policy.requires_iam_conditions
      op: eq
      value: false
