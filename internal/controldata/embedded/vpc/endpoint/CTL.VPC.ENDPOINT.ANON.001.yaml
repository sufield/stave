dsl_version: ctrl.v1
id: CTL.VPC.ENDPOINT.ANON.001
name: VPC Endpoint Policy Must Deny Anonymous Requests
description: >
  VPC endpoint policies must explicitly deny anonymous (unsigned)
  requests. Without this, unauthenticated S3 requests can transit
  the endpoint without identity information, evading CloudTrail
  logging and IAM policy evaluation.
domain: network
severity: high
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.6"
  ccm_v4: ["IVS-03", "IVS-04"]
scope_tags:
  - aws
  - vpc
taxonomy:
  - compliance-mapping
  - logging
  - network-isolation
subtractive_category:
  - S03
  - S06
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_vpc_endpoint
params:
  attack_stage: detection_evasion
remediation:
  description: VPC endpoint policy does not deny anonymous requests.
  action: >
    Add a Deny statement to the endpoint policy for requests where
    aws:PrincipalArn does not exist (anonymous/unsigned requests).
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: vpc_endpoint
    - field: properties.network.endpoint_policy.denies_anonymous
      op: eq
      value: false
