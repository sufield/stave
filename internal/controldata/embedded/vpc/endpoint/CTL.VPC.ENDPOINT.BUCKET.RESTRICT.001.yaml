dsl_version: ctrl.v1
id: CTL.VPC.ENDPOINT.BUCKET.RESTRICT.001
name: VPC Endpoint Policy Must Restrict Target S3 Buckets
description: >
  VPC endpoint policies for S3 must restrict which buckets can be
  accessed. Without Resource constraints, any S3 bucket globally —
  including attacker-controlled buckets — is reachable through the
  organization's endpoint.
domain: network
severity: high
compliance:
  nist_800_53_r5: "AC-4"
  soc2: "CC6.6"
  ccm_v4: ["IVS-03"]
scope_tags:
  - aws
  - vpc
taxonomy:
  - compliance-mapping
  - network-isolation
subtractive_category:
  - S06
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_vpc_endpoint
params:
  attack_stage: exfiltration
remediation:
  description: VPC endpoint policy allows access to any S3 bucket.
  action: >
    Add a Resource constraint to the endpoint policy listing only
    the organization's buckets. Deny all other bucket ARNs.
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: vpc_endpoint
    - field: properties.network.endpoint_policy.restricts_target_buckets
      op: eq
      value: false
