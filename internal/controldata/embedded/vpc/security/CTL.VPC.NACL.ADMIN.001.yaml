dsl_version: ctrl.v1
id: CTL.VPC.NACL.ADMIN.001
name: NACL Allows High-Risk Ports from Internet
description: >
  Network ACL allows inbound traffic from 0.0.0.0/0 or ::/0 to
  high-risk service ports. NACLs apply to entire subnets — open
  dangerous ports expose every instance in every associated subnet.
  High-risk ports include admin access (SSH 22, RDP 3389, Telnet 23),
  file sharing (SMB 445), databases (MySQL 3306, PostgreSQL 5432,
  MSSQL 1433, MongoDB 27017, Redis 6379), search/cache (Elasticsearch
  9200, Memcached 11211), and container management (Docker 2375,
  Kubelet 10250).
domain: exposure
severity: high
compliance:
  cis_aws_v3.0: "5.1"
  soc2: "CC6.6"
  pci_dss_v4.0: "1.3.1"
  nist_800_53_r5: "AC-4"
  fedramp_moderate: "AC-4"
  ccm_v4: ["IVS-03"]
scope_tags:
  - aws
  - vpc
taxonomy:
  - least-privilege
  - network-isolation
  - network-perimeter
subtractive_category:
  - S02
  - S03
  - S06
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_vpc_network_acl
params:
  attack_stage: initial_access
observation_fields:
  - network.kind
  - network.nacl.allows_high_risk_from_internet
  - network.nacl.high_risk_port_list
remediation:
  description: >
    NACL allows inbound traffic from 0.0.0.0/0 to high-risk ports.
  action: >
    Replace allow rules with deny rules for high-risk ports (22, 23,
    445, 1433, 2375, 3306, 3389, 5432, 6379, 9200, 10250, 11211,
    27017) from 0.0.0.0/0. Position deny rules with lower rule numbers
    than any conflicting allow rules. Use aws ec2
    create-network-acl-entry to add deny rules.
  example: |
    {
      "network": {
        "kind": "network_acl",
        "nacl": {
          "allows_high_risk_from_internet": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: network_acl
    - field: properties.network.nacl.allows_high_risk_from_internet
      op: eq
      value: true
tests:
  - name: "NACL allowing high-risk ports from internet fires"
    verdict: VIOLATION
    asset:
      asset_id: "acl-highrisk-open"
      asset_type: aws_vpc_network_acl
      vendor: aws
      properties:
        network:
          kind: network_acl
          nacl:
            allows_high_risk_from_internet: true
            high_risk_port_list:
              - 22
              - 3389
              - 3306
  - name: "NACL blocking high-risk ports passes"
    verdict: PASS
    asset:
      asset_id: "acl-highrisk-closed"
      asset_type: aws_vpc_network_acl
      vendor: aws
      properties:
        network:
          kind: network_acl
          nacl:
            allows_high_risk_from_internet: false
