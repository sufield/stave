dsl_version: ctrl.v1
id: CTL.APPRUNNER.SECRET.ENV.001
name: App Runner Service Must Not Store Secrets in Environment Variables
description: >
  App Runner service configuration contains plaintext secrets
  in environment variables. Environment variables are visible
  in the App Runner console, API responses, and CloudTrail
  logs. Secrets should be stored in Secrets Manager or SSM
  Parameter Store and referenced at runtime.
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "IA-5"
  soc2: "CC6.1"
  pci_dss_v4.0: "8.3"
  ccm_v4: ["IAM-02"]
scope_tags:
  - aws
  - apprunner
taxonomy:
  - compliance-mapping
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_apprunner_service]
params:
  attack_stage: credential_access
remediation:
  description: >
    App Runner service stores secrets in environment variables.
  action: >
    Move secrets to Secrets Manager or SSM Parameter Store.
    Configure the App Runner service to reference secrets at
    runtime using the instance role. Remove plaintext values
    from the service configuration.
  example: |
    {
      "compute": {
        "kind": "apprunner_service",
        "secrets": {
          "env_contains_plaintext": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: apprunner_service
    - field: properties.compute.secrets.env_contains_plaintext
      op: eq
      value: true
tests:
  - name: plaintext secrets in env fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:apprunner:us-east-1:111122223333:service/api/abc123"
      asset_type: aws_apprunner_service
      vendor: aws
      properties:
        compute:
          kind: apprunner_service
          secrets:
            env_contains_plaintext: true
  - name: no plaintext secrets passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:apprunner:us-east-1:111122223333:service/api/abc123"
      asset_type: aws_apprunner_service
      vendor: aws
      properties:
        compute:
          kind: apprunner_service
          secrets:
            env_contains_plaintext: false
