    consumers:
      - CTL.ECR.PULLTHROUGH.UNRESTRICTED.001

  - field: container_registry.pull_through_cache.has_filter_rules
    type: boolean
    postcondition: >
      True if the pull-through cache rule has repository filter rules restricting which upstream repositories are cached. False means all upstream repos are cached indiscriminately — any image in the public registry can enter the private ECR cache. Derived from ecr:DescribePullThroughCacheRules → repositoryFilters.
