  - field: account.ai_services.has_active_services
    type: boolean
    postcondition: >
      True if the account has active AI/ML service resources (Bedrock model access, SageMaker endpoints, Comprehend endpoints, etc.). Derived from service-specific list APIs.
    consumers:
      - CTL.ACCOUNT.AI.UNSANCTIONED.001

  - field: account.ai_workload_authorized
    type: boolean
    postcondition: >
