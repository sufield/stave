      - CTL.EKS.LOGGING.001

  - field: logging.audit_delivering
    type: boolean
    postcondition: >
      True if the EKS cluster's audit logs are actively being delivered to CloudWatch Logs (log group exists, has recent log events within the last 24 hours). Derived from logs:DescribeLogGroups and logs:FilterLogEvents on the /aws/eks/<cluster>/cluster log group.
