    consumers:
      - CTL.S3VECTORS.ENCRYPTION.001

  - field: storage.encryption.encryption_enforced_in_policy
    type: boolean
    postcondition: >
      True if the bucket policy contains a Deny statement for s3:PutObject (or s3:PutObject*) with a condition on s3:x-amz-server-side-encryption that rejects requests without server-side encryption specified (StringNotEquals on aws:kms or AES256, or Null condition on s3:x-amz-server-side-encryption = true). Only meaningful when at_rest_enabled is true.
