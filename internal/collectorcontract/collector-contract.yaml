  - field: identity.management_account.has_workload_principals
    type: boolean
    consumers:
      - CTL.IAM.ORG.MGMT.PRINCIPALS.001

  - field: identity.marketplace.can_subscribe
    type: boolean
    postcondition: >
      True if the principal's effective permissions include any buyer-side Marketplace subscription action (Subscribe, AcceptAgreementRequest, AcceptAgreementApprovalRequest, CreateAgreementRequest). Derived from the IAM resolver's effective permission set — requires NotAction expansion (PowerUserAccess grants all marketplace actions via NotAction: ["iam:*", "organizations:*"]).
    consumers:
      - CTL.IAM.POLICY.MARKETPLACE.NOCONDITION.001
      - CTL.IAM.PRINCIPAL.MARKETPLACE.SUBSCRIBE.001

  - field: identity.marketplace.subscribe_conditioned
    type: boolean
    postcondition: >
      True if every Allow statement granting buyer-side Marketplace subscription actions has a Condition scoping the grant to specific ProductIds (StringEquals or StringLike on aws-marketplace:ProductId). False if any subscription grant is unconditioned or uses a non-ProductId condition. Only meaningful when identity.marketplace.can_subscribe is true.
    consumers:
      - CTL.IAM.POLICY.MARKETPLACE.NOCONDITION.001

  - field: identity.mfa.hardware_mfa
    type: boolean
    consumers:
      - CTL.IAM.MFA.HWKEY.001

  - field: identity.nep.boundary_effective
    type: boolean
    consumers:
      - CTL.IAM.NEP.BOUNDARY.001

  - field: identity.nep.has_escalation_path
    type: boolean
    consumers:
      - CTL.IAM.NEP.ESCALATION.001

  - field: identity.nep.is_admin
    type: boolean
    consumers:
      - CTL.IAM.NEP.ADMIN.001

  - field: identity.network.waf_acl_attached
    type: boolean
    consumers:
      - CTL.COGNITO.WAF.001

  - field: identity.nhi_ratio_excessive
    type: boolean
    postcondition: >
      True if the machine-to-human identity ratio (IAM roles / IAM users) exceeds 200:1. Derived from iam:GetAccountSummary SummaryMap.Roles and SummaryMap.Users. Accounts with zero IAM users are excluded (ratio undefined).
    consumers:
      - CTL.IAM.IDENTITY.RATIO.001

  - field: identity.oauth.any_action.present
    type: boolean
    consumers:
      - CTL.IAM.OAUTH.INVENTORY.001

  - field: identity.oauth.authorize_access.present
    type: boolean
    consumers:
      - CTL.IAM.OAUTH.UNCONSTRAINEDAUTHORIZE.001
      - CTL.IAM.OAUTH.UNSCOPEDRESOURCE.001

  - field: identity.oauth.authorize_access.via_wildcard
    type: boolean
    consumers:
      - CTL.IAM.OAUTH.WILDCARDGRANT.001

  - field: identity.oauth.create_token.present
    type: boolean
    consumers:
      - CTL.IAM.OAUTH.DELEGATIONBLAST.001

  - field: identity.oauth.create_token.via_wildcard
    type: boolean
    consumers:
      - CTL.IAM.OAUTH.WILDCARDGRANT.001

  - field: identity.oauth.has_elevated_permissions
