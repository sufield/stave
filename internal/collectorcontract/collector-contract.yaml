      - CTL.S3.ENCRYPT.DENY.UNENCRYPTED.001

  - field: storage.encryption.in_transit_enforced
    type: boolean
    consumers:
      - CTL.S3.ENCRYPT.002

  - field: storage.encryption.key_pinned_in_policy
    type: boolean
    postcondition: >
      True if the bucket policy contains a Deny statement for s3:PutObject (or s3:PutObject*) with a StringNotEquals condition on s3:x-amz-server-side-encryption-aws-kms-key-id whose value matches the bucket's default encryption KMS key ARN. False if the condition is absent, uses Allow instead of Deny, uses StringEquals instead of StringNotEquals, or the ARN does not match the default encryption key. Only meaningful when encryption algorithm is aws:kms.
    consumers:
      - CTL.S3.ENCRYPT.KEYPINNING.001

  - field: storage.encryption.kms_key_encrypt_broad
    type: boolean
    postcondition: >
