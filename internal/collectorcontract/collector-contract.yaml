# Collector Contract
#
# GENERATED — do not edit by hand.
# Source: scripts/gen-contract.py scans all control unsafe_predicate fields.
# To update: `make gen-contract` then commit the result.
# To validate: `make validate-contract` (re-generates and diffs).
#
# Axiom 1 boundary between the collector (Physical Domain) and the
# evaluation engine (Functional Domain). Each entry specifies the
# semantic postcondition a collector MUST satisfy when producing a
# field. The CEL predicate engine trusts these fields without
# re-evaluating the underlying policy.
#
# null_semantics for all boolean fields: null or absent means
# "the collector did not evaluate this field." It does NOT mean
# false. Predicates that test `op: eq, value: false` will not
# match null — this is by design.

version: "1.0"

contracts:

  - field: access.codeartifact.domain_policy_cross_account_unconditioned
    type: boolean
    postcondition: >
      True if the domain resource policy allows cross-account principals without aws:PrincipalOrgID or specific account conditions. Derived from codeartifact:GetDomainPermissionsPolicy.
    consumers:
      - CTL.CODEARTIFACT.DOMAIN.POLICY.CROSSACCOUNT.001

  - field: access.codeartifact.policy_allows_public
    type: boolean
    postcondition: >
      True if the repository resource policy contains Principal "*" or Principal AWS "*" without restricting conditions. Derived from codeartifact:GetRepositoryPermissionsPolicy.
    consumers:
      - CTL.CODEARTIFACT.POLICY.PUBLIC.001

  - field: access.sagemaker.model_package_group.policy_allows_broad_access
    type: boolean
    postcondition: >
      True if the model package group resource policy allows Principal "*", broad cross-account access without conditions, or any principal with sagemaker:Describe* and sagemaker:CreateModel* without scoping. Derived from sagemaker:GetModelPackageGroupPolicy.
    consumers:
      - CTL.SAGEMAKER.MODELPACKAGE.ACCESS.001

  - field: access_analyzer.enabled
    type: boolean
    consumers:
