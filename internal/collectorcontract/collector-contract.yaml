    type: boolean
    postcondition: >
      True if the ECR repository has AWS Managed Signing configured (images are automatically signed at push time via an AWS Signer signing profile). Derived from ecr:DescribeRepositories or ecr:GetRegistrySigningConfiguration. False when no signing profile is attached to the repository.
    consumers:
