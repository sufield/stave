id: ddb_encryption_inconsistent
description: >
  Multiple encryption failures across the data and cache
  layers. The table is not encrypted with a customer-managed
  KMS key (CTL.DYNAMODB.ENCRYPT.001) AND either the DAX cluster
  is unencrypted at rest
  (CTL.DYNAMODB.DAX.ENCRYPT.REST.001) or the table and its
  DAX cluster have inconsistent encryption posture
  (CTL.DYNAMODB.ENCRYPT.DAX.MISMATCH.001). Threshold of 2
  reflects that one encryption miss alone is a known
  posture concern; two together describe a workload whose
  data layer encryption story is broken at multiple points —
  the table doesn't have key-policy control and the cache
  layer doesn't have or doesn't match the table's protection.
controls:
  - CTL.DYNAMODB.ENCRYPT.001
  - CTL.DYNAMODB.DAX.ENCRYPT.REST.001
  - CTL.DYNAMODB.ENCRYPT.DAX.MISMATCH.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - data_access
postconditions:
  - data_in_transit_exposure
implicit_dependencies: []
