id: vpc_endpoint_bypass
description: >
  Interface VPC endpoint has Private DNS disabled AND either its
  security group permits the full VPC CIDR or its endpoint policy
  allows all principals. The endpoint is either bypassed at the
  DNS layer (traffic routes to the public endpoint because
  Private DNS is off) or overly permissive at the access-control
  layer (every VPC workload can call it with any identity). The
  endpoint exists, is billed per hour, and provides no meaningful
  isolation in either case.
controls:
  - CTL.VPC.ENDPOINT.DNS.001
  - CTL.VPC.ENDPOINT.SG.BROAD.001
  - CTL.VPC.ENDPOINT.ANON.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - network_access_vpc
postconditions:
  - data_in_transit_exposure
implicit_dependencies: []
