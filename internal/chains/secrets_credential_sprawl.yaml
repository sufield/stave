id: secrets_credential_sprawl
description: >
  Excessive sharing accounts plus either credential
  duplication or dormant secret. The credential is
  broadly shared AND either copied (desynchronization
  risk) or unused (latent surface). Credential sprawl
  across the organization: many accounts, many copies,
  few legitimate consumers. Threshold of 2 fires when
  blast-radius compounds with another sprawl indicator.
controls:
  - CTL.SECRETS.CROSSACCOUNT.BLASTRADIUS.001
  - CTL.SECRETS.CROSSACCOUNT.VALUECOPIED.001
  - CTL.SECRETS.LIFECYCLE.DORMANT.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - ungoverned_operation
postconditions:
  - audit_trail_destroyed
implicit_dependencies: []
