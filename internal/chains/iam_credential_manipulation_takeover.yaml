id: iam_credential_manipulation_takeover
description: >
  Principal can create or change console credentials for another
  user — CreateLoginProfile creates console access for a
  programmatic-only service account, UpdateLoginProfile resets an
  existing user's password, ResyncMFADevice bypasses MFA protection.
  Combined, these enable full console takeover of a higher-privilege
  principal. The attack path is: identify a service account with no
  console profile and broad permissions → CreateLoginProfile with a
  chosen password → console login as that user → access all resources
  the victim can reach. If the victim has MFA, ResyncMFADevice
  disarms it first.
controls:
  - CTL.IAM.ESCALATE.CREATELOGINPROFILE.001
  - CTL.IAM.ESCALATE.UPDATELOGINPROFILE.001
  - CTL.IAM.ESCALATE.RESYNCMFADEVICE.001
escalation_threshold: 2
compound_severity: critical
preconditions:
  - initial_access
postconditions:
  - iam_credential_theft
implicit_dependencies: []
incident_precedent:
  name: Rhino Security Labs aws_escalate.py (2019)
  impact: Console takeover via credential manipulation on service accounts
  reference: Bishop Fox IAM Vulnerable privesc5/privesc6; GUI-Vil (p0 Labs, 2023) same technique
