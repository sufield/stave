id: lambda_resource_exhaustion
description: >
  Lambda function is publicly invocable with no concurrency limit and
  an excessive timeout. Any caller can drive unlimited simultaneous
  invocations each running for the maximum timeout, exhausting account
  concurrency and generating unbounded AWS costs.
controls:
  - CTL.LAMBDA.CONCURRENCY.001
  - CTL.LAMBDA.TIMEOUT.001
  - CTL.LAMBDA.URL.AUTH.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - internet_access
postconditions:
  - ec2_code_execution
implicit_dependencies: []
