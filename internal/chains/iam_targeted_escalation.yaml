id: iam_targeted_escalation
description: >
  Principal can enumerate IAM principals AND read their policies
  AND has a privilege escalation vector. This enables surgical
  selection of the highest-privilege target for escalation rather
  than blind exploitation. The attacker identifies the
  programmatic-only service account with admin permissions and no
  MFA, creates console access for it, and logs in with full
  privileges.
controls:
  - CTL.IAM.RECON.VICTIM.SELECTION.001
  - CTL.IAM.ESCALATE.CREATELOGINPROFILE.001
  - CTL.IAM.ESCALATE.UPDATELOGINPROFILE.001
  - CTL.IAM.ESCALATE.CREATEACCESSKEY.001
  - CTL.IAM.ESCALATE.ATTACHUSERPOLICY.001
  - CTL.IAM.ESCALATE.PUTUSERPOLICY.001
  - CTL.IAM.ESCALATE.CREATEPOLICYVERSION.001
  - CTL.IAM.ESCALATE.ADDUSERTOGROUP.001
  - CTL.IAM.ESCALATE.RESYNCMFADEVICE.001
escalation_threshold: 2
compound_severity: high
scope: global
preconditions:
  - initial_access
postconditions:
  - targeted_privilege_escalation
implicit_dependencies: []
incident_precedent:
  name: GUI-Vil (p0 Labs, 2023)
  impact: Attackers enumerated IAM users then created console access for the highest-privilege service account
  reference: Rhino Security Labs aws_escalate.py victim selection phase; Bishop Fox IAM Vulnerable privesc scenarios
