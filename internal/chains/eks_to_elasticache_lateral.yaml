id: eks_to_elasticache_lateral
description: >
  EKS pods share a VPC with an ElastiCache cluster that
  accepts broad security-group ingress — a compromised pod
  can reach the cache without additional credential theft
  or network pivoting. The first leg detects that the EKS
  node group's security group permits unrestricted egress
  (CTL.VPC.SG.EGRESS.001) — pods can initiate connections
  to the ElastiCache subnet. The second leg detects that
  the ElastiCache cluster's security group accepts broad
  ingress on the cache port (CTL.ELASTICACHE.SG.BROAD.001)
  — including from the EKS node subnet. Together: pod
  compromise yields cache access without restriction.
  ElastiCache clusters often hold session tokens,
  rate-limit counters, or cached credentials — cache access
  enables session hijacking or data theft. Removing either
  leg breaks the chain: restrict EKS node egress to
  required destinations only, OR scope the ElastiCache
  security group to specific application security groups.
controls:
  - CTL.VPC.SG.EGRESS.001
  - CTL.ELASTICACHE.SG.BROAD.001
scope_field: properties.network.vpc_id
escalation_threshold: 2
compound_severity: high
preconditions:
  - network_access_vpc
postconditions:
  - data_access
implicit_dependencies: []
