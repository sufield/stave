id: emr_data_exposure
description: >
  EMR cluster with public network exposure and no encryption. Cluster
  nodes are reachable from the internet and data is stored and
  transmitted in plaintext. An attacker can access Hadoop and Spark
  interfaces directly and read processing data without decryption.
controls:
  - CTL.EMR.PUBLIC.SG.001
  - CTL.EMR.ENCRYPT.001
escalation_threshold: 2
compound_severity: critical
preconditions:
  - internet_access
postconditions:
  - s3_data_access
implicit_dependencies: []
