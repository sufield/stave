id: secrets_access_blind
description: >
  No data events plus either no access failure alarm or
  no volume alarm. Credential access is unaudited AND
  either failed access attempts or high-frequency access
  is undetected. Who reads which credential is unknown
  AND anomalous access patterns are invisible. Threshold
  of 2 fires when both the audit trail and the real-time
  signal are missing — credential reads happen with no
  trace and no alerting.
controls:
  - CTL.SECRETS.AUDIT.DATAEVENTS.001
  - CTL.SECRETS.ALARM.ACCESS.FAILURE.001
  - CTL.SECRETS.ALARM.ACCESS.VOLUME.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - ungoverned_operation
postconditions:
  - audit_trail_destroyed
implicit_dependencies: []
