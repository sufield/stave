id: eks_to_redshift_lateral
description: >
  EKS pods share a VPC with a Redshift cluster whose security
  group allows broad ingress on port 5439 — a compromised pod
  can reach the data warehouse without additional credential
  theft or network pivoting. The first leg detects that the EKS
  node group's security group permits unrestricted egress
  (CTL.VPC.SG.EGRESS.001) — pods can initiate connections to
  the Redshift subnet. The second leg detects that the Redshift
  cluster's security group accepts 0.0.0.0/0 ingress on the
  warehouse port (CTL.REDSHIFT.SG.OPEN.001) — including from
  the EKS node subnet. Together: pod compromise yields warehouse
  access without restriction. Redshift clusters hold analytics
  data, PII, financial records — warehouse access enables bulk
  exfiltration. Removing either leg breaks the chain.
controls:
  - CTL.VPC.SG.EGRESS.001
  - CTL.REDSHIFT.SG.OPEN.001
scope_field: properties.network.vpc_id
escalation_threshold: 2
compound_severity: high
preconditions:
  - network_access_vpc
postconditions:
  - data_access
implicit_dependencies: []
