id: detection_blind_region
description: >
  Region has no SCP restriction AND no active detection coverage.
  An attacker can create resources in this region and operate
  without any monitoring or alerting. Fires on two legs
  (no region-deny + no detector) within one account. Strengthens
  to three legs when opt-in region status (I2) is collected.
  Cross-asset-type chain: SCP fires on aws_organization, GuardDuty
  on aws_guardduty_detector; account-scoped joining groups both
  asset types by account_id.
controls:
  - CTL.ORG.REGION.SCP.001
  - CTL.GUARDDUTY.REGION.COVERAGE.001
escalation_threshold: 2
compound_severity: high
scope: account
preconditions:
  - iam_credential_theft
postconditions:
  - detection_evasion
# Future third leg: CTL.ACCOUNT.REGION.OPTIN.UNUSED.001
# Blocked on I2 (SCHEMA-BLOCKED: account:ListRegions not in contract).
implicit_dependencies: []
