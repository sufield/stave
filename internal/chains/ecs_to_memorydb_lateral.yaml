id: ecs_to_memorydb_lateral
description: >
  ECS tasks share a VPC with a MemoryDB cluster whose security
  group allows broad ingress on port 6379 — a compromised task
  can reach the cluster without additional credential theft or
  network pivoting. The first leg detects that the ECS task's
  security group permits unrestricted egress
  (CTL.VPC.SG.EGRESS.001) — tasks can initiate connections to
  the MemoryDB subnet. The second leg detects that the MemoryDB
  cluster's security group accepts broad ingress on the Redis
  port (CTL.MEMORYDB.SG.BROAD.001) — including from the ECS
  task subnet. Together: task compromise yields cluster access
  without restriction. Removing either leg breaks the chain.
controls:
  - CTL.VPC.SG.EGRESS.001
  - CTL.MEMORYDB.SG.BROAD.001
scope_field: properties.network.vpc_id
escalation_threshold: 2
compound_severity: high
preconditions:
  - network_access_vpc
postconditions:
  - data_access
implicit_dependencies: []
