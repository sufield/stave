id: eks_to_secretsmanager_lateral
description: >
  EKS node group has an overbroad IAM role and Secrets
  Manager secrets lack rotation — a compromised pod
  inheriting the node role can call
  secretsmanager:GetSecretValue to extract long-lived
  secrets. The first leg detects that the EKS node
  group's IAM role exceeds kubelet-minimum permissions
  (CTL.EKS.NODEGROUP.ROLE.OVERBROAD.001) — the role
  grants broad Secrets Manager actions. The second leg
  detects that the target secret has no automatic
  rotation (CTL.SECRETSMANAGER.ACCESS.001) — the secret
  value is static and remains valid indefinitely after
  exfiltration. Together: pod compromise yields access
  to secrets that never expire. Pods without IRSA or
  Pod Identity inherit the node role via IMDS — the
  node role becomes the secret-extraction credential.
  Removing either leg breaks the chain: scope the node
  role to kubelet-minimum and move workload Secrets
  Manager access to IRSA, OR enable automatic rotation
  so exfiltrated secrets expire promptly.
controls:
  - CTL.EKS.NODEGROUP.ROLE.OVERBROAD.001
  - CTL.SECRETSMANAGER.ACCESS.001
scope: global
escalation_threshold: 2
compound_severity: high
preconditions:
  - credential_access
postconditions:
  - secret_store_access
implicit_dependencies: []
