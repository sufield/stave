id: unmonitored_region_path
description: >
  Unmonitored region: a region has a default VPC (allowing
  trivial resource creation) but GuardDuty is not enabled.
  An attacker with EC2 permissions can launch instances in
  this region with no detection. The default VPC makes
  resource creation trivially easy — public subnets and an
  Internet Gateway exist by default. Combined with no
  GuardDuty, this is the quietest place to operate.
controls:
  - CTL.VPC.DEFAULT.001
  - CTL.GUARDDUTY.REGION.COVERAGE.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - iam_credential_theft
postconditions:
  - ungoverned_operation
implicit_dependencies:
  - source: observation.regional_resource_inventory
    fallback: fail_closed
    diagnostic: >
      Regional resource inventory not available. Cannot
      determine which regions have default VPCs.
