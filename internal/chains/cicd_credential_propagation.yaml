id: cicd_credential_propagation
description: >
  CI/CD role holds the permission compound enabling supply chain
  propagation: push container images (ECR) + read production secrets
  (Secrets Manager) + write deployment artifacts (S3). Any two of
  three co-occurring on a CI/CD-identified role constitutes a
  propagation path — a compromised pipeline dependency can move
  laterally through the artifact supply chain. This chain models
  the AFTER-theft phase; cicd_credential_exfiltration_path models
  the theft itself. A role firing both chains has the complete
  supply chain attack shape.
  The TeamPCP/Trivy campaign (March 2026) demonstrated this exact
  propagation: the infostealer in the compromised Trivy scanner
  harvested credentials from 10,000+ pipelines, then stole the
  BerriAI/LiteLLM PyPI publishing token from Secrets Manager to
  publish a malicious package with 3.6M daily downloads. Codecov
  (2021) preceded this with the same credential-harvest-from-CI
  shape.
controls:
  - CTL.IAM.FOOTHOLD.CICD.ECR.001
  - CTL.IAM.FOOTHOLD.CICD.SECRETS.001
  - CTL.IAM.FOOTHOLD.CICD.S3.001
escalation_threshold: 2
compound_severity: critical
incident_precedent:
  name: TeamPCP/Trivy (2026)
  impact: 10,000+ pipelines compromised; LiteLLM PyPI token stolen via Secrets Manager; 3.6M daily downloads of malicious package
  reference: LiteLLM/BerriAI (2026), Codecov (2021) share propagation pattern
preconditions:
  - iam_credential_theft
postconditions:
  - ec2_code_execution
  - data_exfiltration
implicit_dependencies: []
