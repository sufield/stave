id: bedrock_to_dynamodb_lateral
description: >
  Bedrock agent has an overbroad IAM role and DynamoDB is
  accessible without a VPC endpoint policy restriction — a
  compromised or prompt-injected agent can read or write
  arbitrary DynamoDB tables via the public API. The first
  leg detects that the Bedrock agent's role grants
  overbroad S3 or data-access permissions
  (CTL.BEDROCK.AGENT.OVERPERM.S3.001) — the role is not
  scoped to specific resources. The second leg detects
  that no VPC endpoint enforces a restrictive policy on
  DynamoDB access (CTL.DYNAMODB.VPC.ENDPOINT.001) — the
  agent reaches DynamoDB over the public endpoint with no
  network-level constraint. Together: agent compromise via
  prompt injection or tool misuse yields unrestricted
  DynamoDB access across every table the overbroad role
  permits. Bedrock agents with knowledge bases commonly
  access DynamoDB for retrieval-augmented generation; this
  IAM-path lateral movement pattern is the agentic
  equivalent of the Lambda→DynamoDB pattern. Removing
  either leg breaks the chain: scope the agent role to
  specific tables and actions, OR enforce a VPC endpoint
  policy that restricts DynamoDB access to authorized
  agent roles only.
controls:
  - CTL.BEDROCK.AGENT.OVERPERM.S3.001
  - CTL.DYNAMODB.VPC.ENDPOINT.001
scope: global
escalation_threshold: 2
compound_severity: high
preconditions:
  - credential_access
postconditions:
  - data_access
implicit_dependencies: []
