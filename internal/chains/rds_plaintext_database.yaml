id: rds_plaintext_database
description: >
  TLS is not enforced for client connections AND either the
  instance is not encrypted at rest OR the automated backup chain
  is unencrypted. Encryption fails at multiple layers
  simultaneously: in transit (an attacker on any segment between
  the application and the database reads credentials and queries),
  AND either at rest (the instance storage is plaintext) or in the
  backup service (a recoverable plaintext copy of the database
  exists). The intersection is a database whose data is reachable
  in cleartext through more than one channel; closing any one
  layer alone leaves the others.
controls:
  - CTL.RDS.SSL.001
  - CTL.RDS.ENCRYPT.001
  - CTL.RDS.ENCRYPT.BACKUP.001
escalation_threshold: 2
compound_severity: high
preconditions:
  - network_access_rds
postconditions:
  - rds_data_access
implicit_dependencies: []
