id: compromised_secret_path
description: >
  Secret with wide read access provides credentials to sensitive data.
  Multiple principals can read the secret, the secret targets a PHI or
  PII resource, and rotation may be stale. Compromising any reader
  provides a direct path to the sensitive data, bypassing IAM least
  privilege on the data resource itself.
controls:
  - CTL.SECRET.BLAST.001
  - CTL.SECRET.BLAST.002
  - CTL.SECRETSMANAGER.ACCESS.001
escalation_threshold: 2
compound_severity: critical
preconditions:
  - iam_credential_theft
postconditions:
  - secret_store_access
implicit_dependencies: []
