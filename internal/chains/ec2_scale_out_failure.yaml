id: ec2_scale_out_failure
description: >
  Either the launch template's AMI is deregistered (scale-out
  fails because the AMI does not exist) or the AMI used by the
  Auto Scaling Group is deprecated/aged (scale-out launches
  vulnerable instances). Both conditions independently
  compromise an Auto Scaling Group's ability to safely add
  capacity during demand spikes — one fails outright, the
  other succeeds but with security debt. The chain fires on
  either alone because either alone breaks the safety
  contract of auto-scaling.
controls:
  - CTL.EC2.AMI.GHOST.001
  - CTL.EC2.AMI.CURRENCY.001
escalation_threshold: 1
compound_severity: high
preconditions:
  - network_access_vpc
postconditions:
  - ungoverned_operation
implicit_dependencies:
  - source: observation.ghost_reference_resolver
    fallback: fail_open
    diagnostic: >-
      Ghost reference resolution depends on snapshot completeness for the referenced resource type. If the referenced service was not collected, ghost references cannot be detected.
