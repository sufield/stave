id: lambda_confused_deputy
description: >
  Either service trigger without source restriction or
  cross-account invocation without org boundary. Each
  independently allows invocation from outside the intended
  scope — service-principal confused deputy (any S3/SNS/
  EventBridge/API Gateway resource in any account can
  invoke the function) or account-principal cross-account
  grant without aws:PrincipalOrgID. The function is
  invocable by unintended callers regardless of which path
  the attacker takes; threshold of 1 reflects that either
  alone is already a complete invocation-boundary failure.
controls:
  - CTL.LAMBDA.TRIGGER.CONFUSEDDEPUTY.001
  - CTL.LAMBDA.POLICY.CROSSACCOUNT.001
escalation_threshold: 1
compound_severity: high
preconditions:
  - network_access_lambda
postconditions:
  - resource_policy_escalation
implicit_dependencies: []
