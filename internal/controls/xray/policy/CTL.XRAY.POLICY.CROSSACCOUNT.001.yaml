dsl_version: ctrl.v1
id: CTL.XRAY.POLICY.CROSSACCOUNT.001
name: X-Ray Resource Policy Grants Cross-Account Access Without Organizational Boundary
description: >
  X-Ray resource policy grants actions to principals in external
  AWS accounts without an aws:PrincipalOrgID condition. External
  accounts can read distributed traces containing request
  parameters, error details, latency data, and service topology.
  If the account leaves the organization, access persists.
  PutResourcePolicy controls cross-account trace collection
  and group access.
domain: exposure
severity: medium
compliance:
  soc2: "CC6.1, CC6.6"
  nist_800_53_r5: "AC-3, AC-4, AC-6"
  iso_27001_2022: "A.5.15, A.5.19"
  ccm_v4: ["IAM-16", "IVS-09"]
scope_tags:
  - aws
  - xray
taxonomy:
  - identity-perimeter
  - trust-boundary
subtractive_category:
  - S03
  - S05
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_xray_group
params:
  attack_stage: collection
  blast_radius:
    type: prevention
    scope: organization
    multiplier: 1.5
remediation:
  description: >
    X-Ray resource policy grants cross-account access without
    an aws:PrincipalOrgID condition.
  action: >
    Add aws:PrincipalOrgID restricting access to the
    organization's ID. For the rare legitimate cross-org
    grant, use aws:PrincipalAccount with the explicit account
    ID and document the trust relationship.
  example: |
    {
      "observability": {
        "kind": "xray_group",
        "xray": {
          "policy_cross_account": false,
          "policy_has_org_condition": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.observability.kind
      op: eq
      value: xray_group
    - field: properties.observability.xray.policy_cross_account
      op: eq
      value: true
    - field: properties.observability.xray.policy_has_org_condition
      op: eq
      value: false
defect: >
  X-Ray resource policy grants actions to external account
  principals without aws:PrincipalOrgID.
infection: >
  Cross-account trace access without organizational boundary
  means the external account can read distributed traces
  regardless of current org membership. Traces contain
  request metadata, latency data, error details, and service
  topology — enough to map internal architecture and identify
  weak points. If the account leaves the organization, access
  persists.
failure: >
  Trace access outside organizational boundary. External-
  account principals can read distributed traces without
  org-membership verification, and access persists across
  org changes.
tests:
  - name: cross-account without org condition fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:xray:us-east-1:111122223333:group/default"
      asset_type: aws_xray_group
      vendor: aws
      properties:
        observability:
          kind: xray_group
          xray:
            policy_cross_account: true
            policy_has_org_condition: false
            policy_external_accounts:
              - "222233334444"
  - name: cross-account with org condition passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:xray:us-east-1:111122223333:group/default"
      asset_type: aws_xray_group
      vendor: aws
      properties:
        observability:
          kind: xray_group
          xray:
            policy_cross_account: true
            policy_has_org_condition: true
            policy_external_accounts:
              - "222233334444"
  - name: no cross-account passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:xray:us-east-1:111122223333:group/internal"
      asset_type: aws_xray_group
      vendor: aws
      properties:
        observability:
          kind: xray_group
          xray:
            policy_cross_account: false
