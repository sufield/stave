dsl_version: ctrl.v1
id: CTL.MWAA.ENV.PUBLIC.001
name: MWAA Web Server Is Publicly Accessible
description: >
  MWAA environment web server is configured with PUBLIC_ONLY access
  mode, making the Apache Airflow UI accessible from the internet.
  The Airflow UI provides full control over DAG execution, variable
  management, and connection configuration — exposing it publicly
  allows an attacker to trigger arbitrary DAG runs and access
  stored credentials. Use PRIVATE_ONLY to restrict access to the
  VPC.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SC-7"
  soc2: "CC6.6"
  ccm_v4: ["IVS-03"]
scope_tags: [aws, mwaa]
taxonomy:
  - network-perimeter
subtractive_category:
  - S03
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_mwaa_environment]
params:
  attack_stage: initial_access
observation_fields:
  - compute.mwaa.webserver_access_mode
remediation:
  description: MWAA web server is publicly accessible.
  action: >
    Change the MWAA environment's web server access mode to
    PRIVATE_ONLY. Access the Airflow UI through a VPN, bastion host,
    or AWS Client VPN endpoint.
  example: |
    {"compute": {"mwaa": {"webserver_access_mode": "PRIVATE_ONLY"}}}
unsafe_predicate:
  all:
    - field: properties.compute.mwaa.webserver_access_mode
      op: eq
      value: PUBLIC_ONLY
tests:
  - name: "public web server fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:airflow:us-east-1:111122223333:environment/prod-airflow"
      asset_type: aws_mwaa_environment
      vendor: aws
      properties:
        compute:
          mwaa: {webserver_access_mode: PUBLIC_ONLY}
  - name: "private web server passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:airflow:us-east-1:444455556666:environment/secure-airflow"
      asset_type: aws_mwaa_environment
      vendor: aws
      properties:
        compute:
          mwaa: {webserver_access_mode: PRIVATE_ONLY}
  - name: "lowercase public fires (case-insensitive enum)"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:airflow:us-east-1:777788889999:environment/lc-airflow"
      asset_type: aws_mwaa_environment
      vendor: aws
      properties:
        compute:
          mwaa: {webserver_access_mode: public_only}
