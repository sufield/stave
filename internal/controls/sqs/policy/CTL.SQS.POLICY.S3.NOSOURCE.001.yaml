dsl_version: ctrl.v1
id: CTL.SQS.POLICY.S3.NOSOURCE.001
name: SQS Queue Policy Allows S3 SendMessage Without SourceArn
description: >
  SQS queue policy grants sqs:SendMessage to the S3 service
  principal (s3.amazonaws.com) without aws:SourceArn or
  aws:SourceAccount condition. Any S3 bucket in any account can
  configure event notifications targeting the queue and have
  them accepted. An attacker creates a bucket, sets up a
  PutObject event notification pointing at the queue ARN, and
  generates events — the queue receives attacker-controlled S3
  event payloads. Counterpart to CTL.SQS.POLICY.SNS.NOSOURCE.001
  on the S3 event-notification surface.
domain: exposure
severity: high
archetype: confused-deputy
compliance:
  cis_aws_v3.0: "1.20"
  soc2: "CC6.1, CC6.6"
  nist_800_53_r5: "AC-3, AC-4, SC-7"
  pci_dss_v4.0: "1.2, 7.1"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.5.15, A.8.9"
  ccm_v4: ["IAM-16", "IVS-09"]
scope_tags:
  - aws
  - sqs
taxonomy:
  - compliance-mapping
  - confused-deputy
subtractive_category:
  - S08
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_sqs_queue
params:
  attack_stage: initial_access
remediation:
  description: >
    SQS queue policy authorizes the S3 service principal
    without a source restriction. Any S3 bucket in any account
    can deliver event notifications to the queue.
  action: >
    Add aws:SourceArn (the legitimate bucket ARN) or
    aws:SourceAccount (the bucket-owning account) to every
    Statement granting s3.amazonaws.com SendMessage. Both
    conditions can be combined for defense in depth — sourceArn
    pins the specific bucket; sourceAccount blocks any bucket
    in foreign accounts. Apply via
    aws sqs set-queue-attributes --attributes
    Policy=<file://policy.json>.
  example: |
    {
      "messaging": {
        "kind": "queue",
        "sqs": {
          "policy_allows_s3": true,
          "policy_s3_has_source": true,
          "policy_s3_source_arns": ["arn:aws:s3:::uploads-bucket"]
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.messaging.kind
      op: eq
      value: queue
    - field: properties.messaging.sqs.policy_allows_s3
      op: eq
      value: true
    - field: properties.messaging.sqs.policy_s3_has_source
      op: eq
      value: false
defect: >
  SQS queue policy authorizes S3 service principal SendMessage
  without aws:SourceArn or aws:SourceAccount.
infection: >
  The queue policy grants sqs:SendMessage to s3.amazonaws.com
  without restricting which bucket can send. Any S3 bucket — in
  any AWS account — can configure event notifications targeting
  the queue. An attacker creates a bucket in their own account,
  configures a PutObject event notification pointed at the queue
  ARN, and generates events; the queue accepts the attacker's
  S3 event payloads as legitimate. The consumer often trusts
  S3 event records (bucket name, object key, ETag) and proceeds
  to fetch the named object — under the attacker's control.
  aws:SourceArn restricts to a specific bucket ARN;
  aws:SourceAccount restricts to the bucket-owning account.
failure: >
  Cross-account event injection. Any S3 bucket in any account
  can deliver attacker-controlled event records to the queue.
tests:
  - name: S3 principal without source condition fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:sqs:us-east-1:111122223333:upload-queue"
      asset_type: aws_sqs_queue
      vendor: aws
      properties:
        messaging:
          kind: queue
          sqs:
            policy_allows_s3: true
            policy_s3_has_source: false
  - name: S3 principal with sourceArn + sourceAccount passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:sqs:us-east-1:111122223333:upload-queue"
      asset_type: aws_sqs_queue
      vendor: aws
      properties:
        messaging:
          kind: queue
          sqs:
            policy_allows_s3: true
            policy_s3_has_source: true
            policy_s3_source_arns:
              - "arn:aws:s3:::uploads-bucket"
