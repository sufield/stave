dsl_version: ctrl.v1
id: CTL.SQS.POLICY.SPRAWL.001
name: SQS Queue Policy Has Excessive Permission Statements
description: >
  SQS queue policy has more than ten permission statements.
  Each service integration adds a Statement: the SNS topic from
  initial setup, the S3 bucket notification from a migration
  project, the EventBridge rule from a monitoring pipeline, the
  Lambda DLQ configuration from a decommissioned function.
  Statements are rarely removed. The policy accumulates until
  it is unauditable — too many entries to review, each granting
  SendMessage from a different source. Same accumulation
  pattern as CTL.LAMBDA.POLICY.ACCUMULATED.001. The threshold
  of ten is a heuristic; configurable per workload.
domain: governance
severity: medium
compliance:
  soc2: "CC6.1, CC8.1"
  nist_800_53_r5: "AC-6, CM-2"
  fedramp_moderate: "AC-6"
  iso_27001_2022: "A.5.15, A.5.19"
  ccm_v4: ["IAM-16"]
scope_tags:
  - aws
  - sqs
taxonomy:
  - least-privilege
  - resource-sprawl
  - trust-decay
subtractive_category:
  - S02
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_sqs_queue
params:
  attack_stage: detection_evasion
remediation:
  description: >
    SQS queue policy carries an excessive number of permission
    statements. Auditing the access surface in this state is
    impractical and stale entries accumulate.
  action: >
    Audit the policy
    (aws sqs get-queue-attributes --queue-url <url>
    --attribute-names Policy) and remove statements for
    sources that no longer exist or no longer need to write to
    the queue. Pair the cleanup with an inventory check
    against CTL.SQS.GHOST.POLICY.SOURCEARN.001 to identify
    deleted sources still referenced. After cleanup, gate
    future additions through an automated policy review so
    the count stays under the threshold.
  example: |
    {
      "messaging": {
        "kind": "queue",
        "sqs": {
          "policy_statement_count": 4,
          "policy_excessive": false,
          "policy_service_principals": ["sns.amazonaws.com"]
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.messaging.kind
      op: eq
      value: queue
    - field: properties.messaging.sqs.policy_excessive
      op: eq
      value: true
defect: >
  SQS queue policy carries more permission statements than the
  configured threshold.
infection: >
  Each service integration adds a policy statement: the SNS
  topic from initial setup, the S3 bucket notification from a
  migration project, the EventBridge rule from a monitoring
  pipeline, the Lambda DLQ configuration from a decommissioned
  function. Statements are rarely removed. Over time the policy
  accumulates SendMessage grants from many sources — some of
  which may no longer exist (ghost sourceArns, deleted
  principals). The policy becomes unauditable: too many
  statements to review with confidence, each granting access
  from a different surface. The risk is not a single broken
  grant; it is the loss of the operator's ability to know what
  the queue is exposed to.
failure: >
  Unauditable queue access surface. The queue accepts messages
  from many distinct sources, some of which may no longer be
  legitimate, and no operator can review them all with
  confidence.
tests:
  - name: 15 statements fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:sqs:us-east-1:111122223333:orders-queue"
      asset_type: aws_sqs_queue
      vendor: aws
      properties:
        messaging:
          kind: queue
          sqs:
            policy_statement_count: 15
            policy_excessive: true
            policy_service_principals:
              - "sns.amazonaws.com"
              - "s3.amazonaws.com"
              - "events.amazonaws.com"
  - name: 3 statements passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:sqs:us-east-1:111122223333:orders-queue"
      asset_type: aws_sqs_queue
      vendor: aws
      properties:
        messaging:
          kind: queue
          sqs:
            policy_statement_count: 3
            policy_excessive: false
            policy_service_principals:
              - "sns.amazonaws.com"
  - name: 25 statements fires (severe accumulation)
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:sqs:us-east-1:111122223333:fanin-queue"
      asset_type: aws_sqs_queue
      vendor: aws
      properties:
        messaging:
          kind: queue
          sqs:
            policy_statement_count: 25
            policy_excessive: true
