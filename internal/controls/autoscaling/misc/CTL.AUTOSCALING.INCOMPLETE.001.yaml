dsl_version: ctrl.v1
id: CTL.AUTOSCALING.INCOMPLETE.001
name: Complete Data Required for Auto Scaling Assessment
description: >
  The observation snapshot is missing required Auto Scaling properties.
domain: exposure
severity: info
compliance:
  ccm_v4: ["DCS-06", "IVS-02"]
scope_tags:
  - aws
  - autoscaling
taxonomy:
  - compliance-mapping
  - redundancy
subtractive_category:
  - S08
applicable_asset_types:
  - aws_autoscaling_group
type: unsafe_state
classification: absence_check
params: {}
remediation:
  description: >
    Observation is missing Auto Scaling properties.
  action: >
    Ensure the extractor calls aws autoscaling describe-auto-scaling-groups.
  example: |
    {
      "scaling": {
        "kind": "auto_scaling_group",
        "availability_zone_count": 3
      }
    }
unsafe_predicate:
  all:
    - field: properties.scaling.availability_zone_count
      op: missing
      value: true
