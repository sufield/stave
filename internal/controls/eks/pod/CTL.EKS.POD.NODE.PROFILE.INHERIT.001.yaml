dsl_version: ctrl.v1
id: CTL.EKS.POD.NODE.PROFILE.INHERIT.001
name: EKS Pod Calls AWS APIs Through Node Instance Profile Without IRSA
description: >
  EKS Pod calls AWS APIs (detected via observed AWS SDK
  usage, IRSA-aware base images, or AWS-related env vars)
  but the pod's ServiceAccount has no IRSA annotation and no
  Pod Identity association. The pod inherits the node's EC2
  instance profile credentials via IMDS — every workload on
  every node sharing that node group gets the same IAM
  permissions. The IRSA / Pod Identity mechanism — bind
  IAM permissions to specific workloads, not to nodes — is
  defeated. Compromise of any pod yields whatever the node
  role permits.
domain: identity
severity: high
compliance:
  soc2: "CC6.1, CC6.3"
  nist_800_53_r5: "AC-3, AC-6, IA-2"
  pci_dss_v4.0: "7.2"
  fedramp_moderate: "AC-3, AC-6"
  iso_27001_2022: "A.5.15, A.8.2"
  ccm_v4: ["IAM-04", "IAM-14", "IAM-16"]
scope_tags:
  - aws
  - eks
taxonomy:
  - compliance-mapping
  - compute-hardening
  - credential-lifecycle
subtractive_category:
  - S01
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eks_pod_spec
params:
  attack_stage: credential_access
  blast_radius:
    type: control
    scope: account
    multiplier: 2.5
remediation:
  description: >
    EKS Pod calls AWS APIs but lacks IRSA / Pod Identity
    binding.
  action: >
    Create an IRSA role scoped to the workload's specific
    AWS API needs (least privilege). Annotate the pod's
    ServiceAccount with the role ARN. Confirm the role's
    trust policy carries both `sub` (specific
    serviceaccount) and `aud`=`sts.amazonaws.com`
    conditions (see CTL.EKS.IRSA.SUB.UNSCOPED and
    CTL.EKS.IRSA.AUDIENCE.MISSING). Block IMDSv2 access
    from pods at the node level (`HttpPutResponseHopLimit:
    1`) so pods can't fall back to the node profile.
  example: |
    {
      "k8s": {
        "pod_spec": {
          "calls_aws_apis": true,
          "has_irsa_or_pod_identity": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.k8s.pod_spec.calls_aws_apis
      op: eq
      value: true
    - field: properties.k8s.pod_spec.has_irsa_or_pod_identity
      op: eq
      value: false
defect: >
  EKS Pod calls AWS APIs but its ServiceAccount has no IRSA
  annotation and the pod has no Pod Identity association.
infection: >
  The pod's AWS SDK calls fall back to the EC2 instance
  metadata service to obtain credentials. IMDSv2 returns
  the node's IAM instance profile credentials — broader
  than per-workload IRSA scope by design (the node role
  has to grant CNI plugins, kube-proxy, and node
  bootstrap-time operations, in addition to whatever
  workload-side roles team practice has accumulated). Every
  pod scheduled on the node inherits the same credentials.
  Compromise of any pod's container yields the full node
  role's permissions; lateral movement to AWS resources
  proceeds with whatever the node role permits — typically
  much more than the compromised workload legitimately
  needed.
failure: >
  IAM-scope collapse. Per-workload IAM granularity
  defeated; every pod on the node shares the node-role's
  permissions; pod compromise scope is the node role.
tests:
  - name: pod calling AWS without IRSA fires
    verdict: VIOLATION
    asset:
      asset_id: "k8s/orders/deployment/orders-api"
      asset_type: aws_eks_pod_spec
      vendor: aws
      properties:
        k8s:
          pod_spec:
            calls_aws_apis: true
            has_irsa_or_pod_identity: false
  - name: pod with IRSA passes
    verdict: PASS
    asset:
      asset_id: "k8s/orders/deployment/orders-api"
      asset_type: aws_eks_pod_spec
      vendor: aws
      properties:
        k8s:
          pod_spec:
            calls_aws_apis: true
            has_irsa_or_pod_identity: true
            irsa_role_arn: "arn:aws:iam::111122223333:role/eks-orders-irsa"
  - name: pod not calling AWS passes
    verdict: PASS
    asset:
      asset_id: "k8s/orders/deployment/static-server"
      asset_type: aws_eks_pod_spec
      vendor: aws
      properties:
        k8s:
          pod_spec:
            calls_aws_apis: false
            has_irsa_or_pod_identity: false
