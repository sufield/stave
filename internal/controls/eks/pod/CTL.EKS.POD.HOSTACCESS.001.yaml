dsl_version: ctrl.v1
id: CTL.EKS.POD.HOSTACCESS.001
name: EKS Pod Uses hostNetwork hostPID Or hostIPC
description: >
  EKS workload Pod has `hostNetwork: true`, `hostPID: true`,
  or `hostIPC: true`. Each shares a host namespace with the
  pod and breaks the pod's isolation. hostNetwork lets the
  pod observe and bind to host network interfaces (including
  internal cluster traffic and IMDS); hostPID lets the pod
  see and signal all host processes; hostIPC lets the pod
  share IPC with host processes. Each is a documented
  privilege escalation path. Should be limited to
  infrastructure DaemonSets.
domain: governance
severity: high
compliance:
  soc2: "CC6.1, CC6.6"
  nist_800_53_r5: "AC-3, AC-6, SC-7"
  pci_dss_v4.0: "1.4"
  fedramp_moderate: "AC-3, AC-6"
  iso_27001_2022: "A.5.15, A.8.16"
  ccm_v4: ["IVS-09"]
scope_tags:
  - aws
  - eks
taxonomy:
  - compliance-mapping
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eks_pod_spec
params:
  attack_stage: privilege_escalation
  blast_radius:
    type: control
    scope: account
    multiplier: 2.5
remediation:
  description: >
    EKS Pod uses host namespace sharing (hostNetwork, hostPID,
    or hostIPC).
  action: >
    Remove `hostNetwork`, `hostPID`, `hostIPC` from the pod
    spec. For network-level needs, use a Service / ClusterIP.
    For monitoring host processes, use a per-pod metrics
    collector that exports via the cluster network rather
    than reading from the host PID namespace. For
    infrastructure DaemonSets that legitimately need these
    (kube-proxy, CNI), document the exception and confirm
    the namespace's PSA level permits it.
  example: |
    {
      "k8s": {
        "pod_spec": {
          "has_host_network": false,
          "has_host_pid": false,
          "has_host_ipc": false,
          "is_infrastructure_daemonset": false
        }
      }
    }
unsafe_predicate:
  all:
    - any:
        - field: properties.k8s.pod_spec.has_host_network
          op: eq
          value: true
        - field: properties.k8s.pod_spec.has_host_pid
          op: eq
          value: true
        - field: properties.k8s.pod_spec.has_host_ipc
          op: eq
          value: true
    - field: properties.k8s.pod_spec.is_infrastructure_daemonset
      op: eq
      value: false
defect: >
  EKS Pod has hostNetwork, hostPID, or hostIPC enabled and
  is not a documented infrastructure DaemonSet.
infection: >
  hostNetwork: pod can bind on the node's network
  interfaces, observe other pods' traffic on the node, and
  read the EC2 instance metadata service (IMDS) at
  169.254.169.254 (which exposes the node's IAM instance
  profile credentials). hostPID: pod can ps the entire
  host's process list including kubelet, observe arguments
  passed to other pods, and signal them. hostIPC: pod can
  inject into shared-memory regions of host-side processes.
  Each is a documented containment break.
failure: >
  Pod containment break. Pod observes host-namespace
  resources (network, processes, IPC) — can pivot to node
  IAM creds, signal sibling pods, or cross containment
  boundaries.
tests:
  - name: pod with hostNetwork fires
    verdict: VIOLATION
    asset:
      asset_id: "k8s/orders/deployment/orders-api"
      asset_type: aws_eks_pod_spec
      vendor: aws
      properties:
        k8s:
          pod_spec:
            has_host_network: true
            has_host_pid: false
            has_host_ipc: false
            is_infrastructure_daemonset: false
  - name: pod with hostPID fires
    verdict: VIOLATION
    asset:
      asset_id: "k8s/orders/deployment/debugger"
      asset_type: aws_eks_pod_spec
      vendor: aws
      properties:
        k8s:
          pod_spec:
            has_host_network: false
            has_host_pid: true
            has_host_ipc: false
            is_infrastructure_daemonset: false
  - name: kube-proxy DaemonSet passes
    verdict: PASS
    asset:
      asset_id: "k8s/kube-system/daemonset/kube-proxy"
      asset_type: aws_eks_pod_spec
      vendor: aws
      properties:
        k8s:
          pod_spec:
            has_host_network: true
            has_host_pid: false
            has_host_ipc: false
            is_infrastructure_daemonset: true
  - name: pod with no host access passes
    verdict: PASS
    asset:
      asset_id: "k8s/orders/deployment/orders-api"
      asset_type: aws_eks_pod_spec
      vendor: aws
      properties:
        k8s:
          pod_spec:
            has_host_network: false
            has_host_pid: false
            has_host_ipc: false
            is_infrastructure_daemonset: false
