dsl_version: ctrl.v1
id: CTL.EKS.POD.PRIVILEGED.001
name: EKS Pod Or Container Runs With privileged=true
description: >
  EKS workload Pod / Deployment / DaemonSet has at least one
  container with `securityContext.privileged: true`. A
  privileged container has effectively root access on the
  host node — full Linux capabilities, no AppArmor / SELinux
  enforcement, host devices accessible. Pod compromise yields
  node compromise. Privileged containers should be limited to
  specific infrastructure DaemonSets (CNI plugins, storage
  drivers) and absolutely never application workloads.
domain: governance
severity: critical
compliance:
  soc2: "CC6.1, CC6.6"
  nist_800_53_r5: "AC-3, AC-6, SI-3"
  pci_dss_v4.0: "1.4, 2.2"
  fedramp_moderate: "AC-3, AC-6"
  iso_27001_2022: "A.5.15, A.8.2, A.8.16"
  ccm_v4: ["IVS-09", "TVM-09"]
scope_tags:
  - aws
  - eks
taxonomy:
  - compliance-mapping
  - compute-hardening
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eks_pod_spec
params:
  attack_stage: privilege_escalation
  blast_radius:
    type: control
    scope: account
    multiplier: 3.0
remediation:
  description: >
    EKS Pod has a container running with privileged=true.
  action: >
    Remove `privileged: true` from the container's
    securityContext. If the container truly needs elevated
    capabilities, request only the specific Linux capabilities
    it needs via `securityContext.capabilities.add`. For
    DaemonSets that legitimately require privileged (CNI,
    storage drivers, monitoring with eBPF), document the
    exception in the workload manifest comments and confirm
    the namespace's PSA level allows it (typically a dedicated
    `kube-system`-style namespace, not the application
    namespace).
  example: |
    {
      "k8s": {
        "pod_spec": {
          "has_privileged_container": false,
          "is_infrastructure_daemonset": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.k8s.pod_spec.has_privileged_container
      op: eq
      value: true
    - field: properties.k8s.pod_spec.is_infrastructure_daemonset
      op: eq
      value: false
defect: >
  EKS Pod has a container with `securityContext.privileged:
  true` and is not a documented infrastructure DaemonSet.
infection: >
  Privileged containers run with full host capabilities —
  no AppArmor / SELinux enforcement, host devices visible,
  every Linux capability granted. A pod compromise — RCE in
  the application, supply-chain attack on a base image,
  unsafe deserialization — yields full root on the host
  node. From there: every other pod on the node is
  reachable, the kubelet credential is harvestable, the
  node's IAM instance profile is assumable. Single-pod
  compromise becomes node-and-cluster compromise.
failure: >
  Pod-to-host privilege escalation surface. Compromise of
  the privileged container yields root-equivalent on the
  underlying node and all its pods.
tests:
  - name: privileged application pod fires
    verdict: VIOLATION
    asset:
      asset_id: "k8s/orders/deployment/orders-api"
      asset_type: aws_eks_pod_spec
      vendor: aws
      properties:
        k8s:
          pod_spec:
            has_privileged_container: true
            is_infrastructure_daemonset: false
  - name: CNI infrastructure DaemonSet passes
    verdict: PASS
    asset:
      asset_id: "k8s/kube-system/daemonset/aws-node"
      asset_type: aws_eks_pod_spec
      vendor: aws
      properties:
        k8s:
          pod_spec:
            has_privileged_container: true
            is_infrastructure_daemonset: true
  - name: non-privileged pod passes
    verdict: PASS
    asset:
      asset_id: "k8s/orders/deployment/orders-api"
      asset_type: aws_eks_pod_spec
      vendor: aws
      properties:
        k8s:
          pod_spec:
            has_privileged_container: false
            is_infrastructure_daemonset: false
