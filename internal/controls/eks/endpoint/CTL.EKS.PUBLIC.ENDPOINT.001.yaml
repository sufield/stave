dsl_version: ctrl.v1
id: CTL.EKS.PUBLIC.ENDPOINT.001
name: EKS Public API Endpoint Must Restrict Access with CIDR Allowlists
description: >
  EKS clusters with public API endpoints must restrict access to
  specific CIDR ranges. An unrestricted public endpoint
  (0.0.0.0/0) allows any internet IP to reach the API server,
  enabling credential-based attacks from anywhere.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "AC-17"
  fedramp_moderate: "SC-7"
  cis_eks: "2.2"
  ccm_v4: ["IVS-03"]
scope_tags:
  - aws
  - eks
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - network-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_eks_cluster]
params:
  attack_stage: initial_access
remediation:
  description: >
    EKS API server is publicly accessible without CIDR restrictions.
    Any IP on the internet can reach the API server.
  action: >
    Option 1 (preferred): Disable public endpoint entirely.
    Option 2: Restrict to specific CIDRs (corporate NAT, VPN, CI/CD).
    aws eks update-cluster-config --name <cluster>
    --resources-vpc-config endpointPublicAccess=true,
    publicAccessCidrs="10.0.0.0/8,203.0.113.0/24"
unsafe_predicate:
  all:
    - field: properties.endpoint.public_access
      op: eq
      value: true
    - field: properties.endpoint.public_unrestricted
      op: eq
      value: true
