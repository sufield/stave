dsl_version: ctrl.v1
id: CTL.EKS.IMAGE.LATEST.TAG.001
name: EKS Production Workload Uses :latest Image Tag
description: >
  EKS production workload's image reference uses the
  `:latest` tag (or no tag, which defaults to :latest).
  The :latest tag is mutable — the image bytes change
  when a new image is pushed under the same tag.
  Deploys lose reproducibility (rolling back via spec
  revision doesn't roll back the image bytes), pod
  scheduling onto a new node may pull a different
  image than the existing pods on the cluster, and
  release auditing can't tie a running container to
  a specific image build.
domain: governance
severity: high
compliance:
  soc2: "CC8.1, CC7.4"
  nist_800_53_r5: "CM-2, CM-3"
  fedramp_moderate: "CM-2"
  iso_27001_2022: "A.5.16, A.8.32"
  ccm_v4: ["BCR-08", "TVM-09"]
scope_tags:
  - aws
  - eks
taxonomy:
  - compliance-mapping
  - compute-hardening
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eks_workload
params:
  attack_stage: persistence
remediation:
  description: >
    EKS production workload uses :latest image tag.
  action: >
    Replace :latest with a specific version tag (semver,
    Git SHA, or build ID). For maximum reproducibility,
    pin by SHA256 digest:
      image: 111122223333.dkr.ecr.us-east-1.amazonaws.com/
             orders@sha256:abc123...
    Tags are convenient pointers; digests are
    cryptographic identifiers. Production should pin
    by digest where possible.
  example: |
    {
      "k8s": {
        "workload": {
          "image_uri": "111122223333.dkr.ecr.us-east-1.amazonaws.com/orders:v1.2.3",
          "uses_latest_tag": false,
          "is_production": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.k8s.workload.uses_latest_tag
      op: eq
      value: true
    - field: properties.k8s.workload.is_production
      op: eq
      value: true
defect: >
  EKS production workload's image reference uses
  `:latest` tag.
infection: >
  The :latest tag is mutable. New image pushes to the
  same tag mean nodes that pull the image at different
  times can run different image bytes. Rolling back a
  Deployment doesn't roll back the image — a `kubectl
  rollout undo` re-pulls :latest, which is now the
  new image. Audit trail "which image was running
  when" requires correlating with deploy timestamps
  rather than reading the manifest.
failure: >
  Loss of deploy reproducibility. Rollback doesn't
  restore prior image; pods on different nodes may
  run different image bytes; audit trail decoupled
  from manifest.
tests:
  - name: production with :latest fires
    verdict: VIOLATION
    asset:
      asset_id: "k8s/orders/deployment/orders-api"
      asset_type: aws_eks_workload
      vendor: aws
      properties:
        k8s:
          workload:
            image_uri: "ecr/orders:latest"
            uses_latest_tag: true
            is_production: true
  - name: dev with :latest passes
    verdict: PASS
    asset:
      asset_id: "k8s/dev/deployment/orders-api"
      asset_type: aws_eks_workload
      vendor: aws
      properties:
        k8s:
          workload:
            image_uri: "ecr/orders:latest"
            uses_latest_tag: true
            is_production: false
  - name: production with versioned tag passes
    verdict: PASS
    asset:
      asset_id: "k8s/orders/deployment/orders-api"
      asset_type: aws_eks_workload
      vendor: aws
      properties:
        k8s:
          workload:
            image_uri: "ecr/orders:v1.2.3"
            uses_latest_tag: false
            is_production: true
