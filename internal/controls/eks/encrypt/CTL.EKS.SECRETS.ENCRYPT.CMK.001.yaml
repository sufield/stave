dsl_version: ctrl.v1
id: CTL.EKS.SECRETS.ENCRYPT.CMK.001
name: EKS Secrets Envelope Encryption Must Use a Customer-Managed KMS Key
description: >
  EKS clusters with secrets encryption enabled must use a
  customer-managed KMS key for the envelope encryption provider,
  not the AWS-managed default. The AWS-managed key provides no
  key-policy control, no custom rotation schedule, and no
  ability to revoke access to Kubernetes secrets during an
  incident. EKS secrets store credentials, tokens, and TLS
  certificates; the KMS key wraps the data-encryption key
  that protects them in etcd.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: SC-12
  soc2: CC6.7
  pci_dss_v4.0: 3.6.1
  ccm_v4:
    - CEK-04
    - CEK-08
scope_tags:
  - aws
  - eks
taxonomy:
  - compliance-mapping
  - encryption-at-rest
  - key-management
subtractive_category:
  - S07
  - S10
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_eks_cluster]
params:
  attack_stage: credential_access
remediation:
  description: >
    EKS cluster secrets encryption is using an AWS-managed key.
    Per-tenant key-policy and revocation controls are unavailable.
  action: >
    Create a customer-managed KMS key with a key policy scoped
    to the EKS service principal. Update the cluster encryption
    config with aws eks associate-encryption-config --cluster-name
    <name> --encryption-config '[{"provider":{"keyArn":"<cmk-arn>"},
    "resources":["secrets"]}]'.
  example: |
    {
      "k8s": {
        "cluster": {
          "secrets_encrypt_kms_key_origin": "CUSTOMER_MANAGED"
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.k8s.cluster.secrets_encrypt_kms_key_origin
      op: eq
      value: AWS_MANAGED
tests:
  - name: EKS secrets with AWS-managed key fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:eks:us-east-1:111122223333:cluster/prod"
      asset_type: aws_eks_cluster
      vendor: aws
      properties:
        k8s:
          cluster:
            secrets_encrypt_kms_key_origin: AWS_MANAGED
  - name: EKS secrets with customer-managed CMK passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:eks:us-east-1:111122223333:cluster/prod"
      asset_type: aws_eks_cluster
      vendor: aws
      properties:
        k8s:
          cluster:
            secrets_encrypt_kms_key_origin: CUSTOMER_MANAGED
