dsl_version: ctrl.v1
id: CTL.GCP.COMPUTE.FIREWALL.RDP.001
name: Firewall Rule Allows RDP from the Internet
description: >
  Firewall rule allows TCP port 3389 from 0.0.0.0/0. RDP directly
  accessible from any IP on the internet.
domain: exposure
severity: critical
compliance:
  cis_gcp_v3: "3.7"
  nist_800_53_r5: "SC-7"
  pci_dss_v4: "1.3"
  soc2: "CC6.6"
scope_tags: [gcp]
taxonomy:
  - compliance-mapping
  - network-perimeter
subtractive_category:
  - S03
type: unsafe_state
classification: state_assertion
applicable_asset_types: [gcp_resource]
params:
  attack_stage: initial_access
remediation:
  description: Firewall Allows RDP from Internet — finding detected.
  action: Restrict source ranges to specific IPs or use IAP.
  example: |
    {"gcp": {"compute": {"kind": "firewall_rule", "firewall": {"allows_rdp_from_internet": false}}}}
unsafe_predicate:
  all:
    - field: properties.gcp.compute.kind
      op: eq
      value: firewall_rule
    - field: properties.gcp.compute.firewall.allows_rdp_from_internet
      op: eq
      value: true
