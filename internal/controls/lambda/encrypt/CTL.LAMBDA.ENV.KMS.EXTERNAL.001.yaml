dsl_version: ctrl.v1
id: CTL.LAMBDA.ENV.KMS.EXTERNAL.001
name: Lambda Functions Must Not Use KMS Keys Owned by External Accounts
description: >
  Lambda functions must not encrypt their environment
  variables with a KMS key owned by an AWS account other
  than the function's own (or an account explicitly within
  the same AWS Organization that the team controls). The
  external account holds key-policy authority — they can
  disable the key (every cold-start KMS:Decrypt fails and
  the function stops initializing), schedule the key for
  deletion (the failure becomes permanent at the deletion
  date), or modify the key policy to revoke this account's
  decrypt rights at any time. The function's continued
  operation therefore depends on a relationship the team
  does not control. Same architectural pattern that
  CTL.S3.ENCRYPT.KMS.OWNERSHIP.001 catches on S3 buckets
  and the RDS external-key concept catches on databases:
  encryption is in place, but the key-control plane is
  outside the team's organizational boundary. Most common
  origins are partner-account integrations where the
  partner's CMK was reused for convenience, account
  migrations where the function moved without re-pointing
  at a same-account key, and IaC modules copied across
  accounts that did not refresh the KMS reference.
domain: encryption
severity: high
compliance:
  nist_800_53_r5: "SC-12"
  pci_dss_v4: "3.6"
  ccm_v4: ["CEK-03", "BCR-08"]
scope_tags: [aws, lambda]
taxonomy:
  - compliance-mapping
  - encryption-at-rest
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_lambda_function
params:
  attack_stage: resilience
remediation:
  description: Lambda function uses an externally-owned KMS key for environment-variable encryption.
  action: Re-encrypt the environment under a same-account (or same-org) CMK and update the function's KMSKeyArn.
  example: |
    {"compute": {"kind": "function", "function": {"kms_key_external": false}}}
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: function
    - field: properties.compute.function.kms_key_external
      op: eq
      value: true
