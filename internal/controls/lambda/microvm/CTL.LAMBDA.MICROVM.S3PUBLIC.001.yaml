dsl_version: ctrl.v1
id: CTL.LAMBDA.MICROVM.S3PUBLIC.001
name: MicroVM Artifact Bucket Allows Public Access
description: >
  MicroVM Artifact Bucket Allows Public Access. Lab control for the Lambda MicroVM validation suite
  (ctf/labs/microvm). Evaluates a captured MicroVM configuration snapshot
  (obs.v0.1) for this invariant.
domain: exposure
severity: critical
compliance:
  nist_800_53_r5: "AC-6"
scope_tags:
  - aws
  - lambda
  - microvm
taxonomy:
  - compliance-mapping
  - network-perimeter
subtractive_category:
  - S03
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_bucket
params:
  attack_stage: exfiltration
remediation:
  description: >
    MicroVM Artifact Bucket Allows Public Access — finding detected on the captured MicroVM configuration.
  action: >
    Enable S3 Block Public Access on the artifact bucket and remove public bucket-policy grants.
  example: |
    {
      "storage": {
        "kind": "s3_bucket",
        "public_access_blocked": true
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: s3_bucket
    - field: properties.storage.public_access_blocked
      op: eq
      value: false
