dsl_version: ctrl.v1
id: CTL.LAMBDA.MICROVM.SUBNET.001
name: MicroVM Network Connector Uses Unapproved Subnets
description: >
  MicroVM Network Connector Uses Unapproved Subnets. Lab control for the Lambda MicroVM validation suite
  (ctf/labs/microvm). Evaluates a captured MicroVM configuration snapshot
  (obs.v0.1) for this invariant.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "AC-6"
scope_tags:
  - aws
  - lambda
  - microvm
taxonomy:
  - compliance-mapping
  - network-isolation
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_lambda_network_connector
params:
  attack_stage: lateral_movement
remediation:
  description: >
    MicroVM Network Connector Uses Unapproved Subnets — finding detected on the captured MicroVM configuration.
  action: >
    Attach the network connector only to approved private subnets; remove public or unlisted subnets.
  example: |
    {
      "network_connector": {
        "kind": "network_connector",
        "subnets": {
          "has_unapproved": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network_connector.kind
      op: eq
      value: network_connector
    - field: properties.network_connector.subnets.has_unapproved
      op: eq
      value: true
