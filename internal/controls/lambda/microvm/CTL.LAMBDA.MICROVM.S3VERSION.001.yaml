dsl_version: ctrl.v1
id: CTL.LAMBDA.MICROVM.S3VERSION.001
name: MicroVM Artifact Bucket Versioning Not Enabled
description: >
  MicroVM Artifact Bucket Versioning Not Enabled. Lab control for the Lambda MicroVM validation suite
  (ctf/labs/microvm). Evaluates a captured MicroVM configuration snapshot
  (obs.v0.1) for this invariant.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "AC-6"
scope_tags:
  - aws
  - lambda
  - microvm
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_bucket
params:
  attack_stage: resilience
remediation:
  description: >
    MicroVM Artifact Bucket Versioning Not Enabled — finding detected on the captured MicroVM configuration.
  action: >
    Enable (not merely un-suspend) versioning on the artifact bucket for a deployment audit trail.
  example: |
    {
      "storage": {
        "kind": "s3_bucket",
        "versioning_enabled": true
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: s3_bucket
    - field: properties.storage.versioning_enabled
      op: eq
      value: false
