dsl_version: ctrl.v1
id: CTL.LAMBDA.MICROVM.TAGSESSION.WILDCARD.001
name: MicroVM Execution Role Trust Policy Grants sts:TagSession via Over-Broad sts:* Wildcard
description: >
  The MicroVM execution role's trust policy grants sts:TagSession through an
  sts:* wildcard rather than the explicit, scoped action. The wildcard also
  confers every other STS action (AssumeRoleWithWebIdentity, AssumeRoleWithSAML,
  GetFederationToken, …), expanding the trust relationship far beyond what
  session tagging requires. Distinct from the missing case
  (CTL.LAMBDA.MICROVM.TAGSESSION.MISSING.001): here the action is present, but
  granted over-broadly.
domain: identity
severity: high
compliance:
  nist_800_53_r5: "AC-6"
scope_tags:
  - aws
  - lambda
  - microvm
taxonomy:
  - compliance-mapping
subtractive_category:
  - S02
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  attack_stage: privilege_escalation
remediation:
  description: >
    The execution role's trust policy grants sts:TagSession via an sts:* wildcard,
    which also grants every other STS action.
  action: >
    Replace sts:* with the explicit actions the role needs — sts:AssumeRole and
    sts:TagSession — so session tagging is allowed without the unscoped wildcard.
  example: |
    {
      "role": {
        "kind": "iam_role",
        "purpose": "execution",
        "trust_tagsession_overbroad": false
      }
    }
unsafe_predicate:
  all:
    - field: properties.role.kind
      op: eq
      value: iam_role
    - field: properties.role.purpose
      op: eq
      value: execution
    - field: properties.role.trust_tagsession_overbroad
      op: eq
      value: true
