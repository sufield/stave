dsl_version: ctrl.v1
id: CTL.LAMBDA.MICROVM.SNAPSHOTSECRET.001
name: MicroVM Image Loads Secrets Into the Snapshot at Init
description: >
  MicroVM Image Loads Secrets Into the Snapshot at Init. Lab control for the Lambda MicroVM validation suite
  (ctf/labs/microvm). Evaluates a captured MicroVM configuration snapshot
  (obs.v0.1) for this invariant.
domain: identity
severity: critical
compliance:
  nist_800_53_r5: "AC-6"
scope_tags:
  - aws
  - lambda
  - microvm
taxonomy:
  - compliance-mapping
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_lambda_microvm_image
params:
  attack_stage: credential_access
remediation:
  description: >
    MicroVM Image Loads Secrets Into the Snapshot at Init — finding detected on the captured MicroVM configuration.
  action: >
    Defer secret loading to a runtime lifecycle hook; never read secrets at module scope before the snapshot.
  example: |
    {
      "microvm_image": {
        "kind": "microvm_image",
        "init_secret_access": false
      }
    }
unsafe_predicate:
  all:
    - field: properties.microvm_image.kind
      op: eq
      value: microvm_image
    - field: properties.microvm_image.init_secret_access
      op: eq
      value: true
