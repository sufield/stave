dsl_version: ctrl.v1
id: CTL.LAMBDA.MICROVM.IDENTITY.001
name: MicroVM Workload Identity Has No Identity Claims
description: >
  MicroVM Workload Identity Has No Identity Claims. Lab control for the Lambda MicroVM validation suite
  (ctf/labs/microvm). Evaluates a captured MicroVM configuration snapshot
  (obs.v0.1) for this invariant.
domain: identity
severity: low
compliance:
  nist_800_53_r5: "AC-6"
scope_tags:
  - aws
  - lambda
  - microvm
taxonomy:
  - compliance-mapping
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_lambda_microvm
params:
  attack_stage: discovery
remediation:
  description: >
    MicroVM Workload Identity Has No Identity Claims — finding detected on the captured MicroVM configuration.
  action: >
    Ensure the MicroVM workload identity carries non-empty identity claims so the workload is governable.
  example: |
    {
      "microvm": {
        "kind": "microvm",
        "identity": {
          "has_claims": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.microvm.kind
      op: eq
      value: microvm
    - field: properties.microvm.identity.has_claims
      op: ne
      value: true
