dsl_version: ctrl.v1
id: CTL.LAMBDA.ENV.EXCESSIVE.001
name: Lambda Functions Should Not Have Excessive Environment Variables
description: >
  Lambda functions should carry no more than the
  configured environment-variable threshold (default 20).
  Functions whose env-var count exceeds the threshold are
  almost always misconfigured: they hold a mix of
  credentials, endpoint URLs, feature flags, retry
  parameters, and per-deploy configuration that should
  live in a configuration service (AWS AppConfig, SSM
  Parameter Store with hierarchies, or a layer-resident
  config file) rather than in the function's environment
  block. Three problems compound at scale. (1) Audit
  cost: a 30-variable env block is past the size a
  human reviewer can hold in working memory; identifying
  which entries are credentials versus URLs versus flags
  becomes a per-variable pattern-matching exercise. (2)
  Rotation cost: every change to any one variable
  requires a function configuration update and (for
  raw credentials) a published-version churn that
  retains the historical value. (3) Disclosure
  surface: every additional variable is one more value
  exposed by lambda:GetFunctionConfiguration. The
  threshold is a heuristic; some functions legitimately
  carry many flags, and the threshold is configurable.
domain: governance
severity: low
compliance:
  owasp_nhi: "NHI2"
  ccm_v4: ["IAM-02", "CCC-04"]
scope_tags: [aws, lambda]
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - resource-sprawl
subtractive_category:
  - S07
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_lambda_function
params:
  attack_stage: credential_access
remediation:
  description: Lambda function has more environment variables than the audit threshold permits.
  action: Move configuration values to AppConfig / SSM Parameter Store; keep only runtime-essential variables in the function's env block.
  example: |
    {"compute": {"kind": "function", "function": {"env_var_count_excessive": false}}}
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: function
    - field: properties.compute.function.env_var_count_excessive
      op: eq
      value: true
