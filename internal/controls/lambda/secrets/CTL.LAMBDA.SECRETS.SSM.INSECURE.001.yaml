dsl_version: ctrl.v1
id: CTL.LAMBDA.SECRETS.SSM.INSECURE.001
name: Lambda SSM Parameter References Must Use SecureString
description: >
  Lambda functions whose environment variables reference
  SSM Parameter Store parameters that hold credentials
  must reference SecureString-typed parameters, not
  String-typed ones. SSM Parameter Store String type
  stores values in plaintext: the parameter is readable
  by any principal holding `ssm:GetParameter` (a much
  broader IAM action than the kms:Decrypt that
  SecureString reads require), is visible in the SSM
  console without an additional decrypt step, is
  unencrypted at rest, and provides no CloudTrail signal
  for its read operations distinct from generic
  parameter reads. SecureString-typed parameters encrypt
  the value with KMS, gate reads on `kms:Decrypt` against
  the key policy, log every decrypt in CloudTrail under
  the calling identity, and store ciphertext at rest. The
  pattern that produces this finding is a one-shot
  parameter creation that took the SSM default (String)
  for what was clearly a credential, or a refactor where
  the parameter was migrated to a new name without
  re-typing as SecureString. Same architectural pattern
  as the S3 / RDS / Secrets-Manager equivalence: managed
  storage is necessary but not sufficient — the storage
  type matters.
domain: secrets
severity: medium
compliance:
  owasp_nhi: "NHI2, NHI9"
  nist_800_53_r5: "SC-28"
  pci_dss_v4: "3.4"
  ccm_v4: ["CEK-03", "DSP-15"]
scope_tags: [aws, lambda]
taxonomy:
  - credential-lifecycle
  - encryption-at-rest
  - logging
subtractive_category:
  - S08
  - S10
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_lambda_function
params:
  attack_stage: credential_access
remediation:
  description: Lambda function references an SSM parameter stored as String instead of SecureString.
  action: Recreate the parameter as SecureString (or migrate the credential to Secrets Manager) and update the env var reference.
  example: |
    {"compute": {"kind": "function", "function": {"ssm_insecure_param_count": 0}}}
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: function
    - field: properties.compute.function.env_references_ssm
      op: eq
      value: true
    - field: properties.compute.function.has_insecure_ssm_param
      op: eq
      value: true
