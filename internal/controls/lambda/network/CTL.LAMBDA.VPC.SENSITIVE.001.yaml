dsl_version: ctrl.v1
id: CTL.LAMBDA.VPC.SENSITIVE.001
name: Lambda Functions Accessing Sensitive Data Must Be in VPC
description: >
  Lambda functions tagged with data-classification phi or pii, or functions whose execution role grants access to RDS, DocumentDB, or DynamoDB, must be configured to run inside a VPC. Without VPC, the function executes in AWS-managed infrastructure with direct internet egress — data accessed by the function can be exfiltrated without traversing any network controls.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SC-7"
  fedramp_moderate: "SC-7"
  hipaa: "164.312(e)(1)"
  pci_dss_v4.0: "1.3.1"
  soc2: "CC6.6"
  ccm_v4: ["IVS-03"]
scope_tags:
  - aws
  - lambda
taxonomy:
  - compliance-mapping
  - network-isolation
subtractive_category:
  - S06
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_lambda_function
params:
  attack_stage: exfiltration
remediation:
  description: >
    Sensitive Lambda function is not configured to run in a VPC.
  action: >
    Configure the function to run in a VPC with private subnets. Use a NAT gateway for outbound internet access if needed.
  example: |
    {
      "compute": {
        "kind": "function",
        "vpc": {
          "sensitive_without_vpc": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: function
    - field: properties.compute.vpc.sensitive_without_vpc
      op: eq
      value: true
