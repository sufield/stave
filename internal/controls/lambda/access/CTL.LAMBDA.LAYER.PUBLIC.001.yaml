dsl_version: ctrl.v1
id: CTL.LAMBDA.LAYER.PUBLIC.001
name: Lambda Layer Version Must Not Be Publicly Shared
description: >
  Lambda layer version has a permission granting access to
  Principal "*" via lambda:AddLayerVersionPermission. A
  public layer can be used by any AWS account. If the layer
  contains proprietary code, embedded secrets, or internal
  API endpoints, this is a data exposure. Distinct from
  CTL.LAMBDA.LAYER.EXTERNAL.001 which checks whether a
  function USES an external layer — this control checks
  whether a layer IS externally shared. Scott Piper's
  aws_exposable_resources lists
  lambda:AddLayerVersionPermission as a public exposure
  vector.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["DSP-17"]
scope_tags:
  - aws
  - lambda
taxonomy:
  - identity-perimeter
  - data-protection
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_lambda_layer_version
params:
  attack_stage: collection
observation_fields:
  - compute.kind
  - compute.lambda.layer_public
remediation:
  description: >
    Lambda layer version is publicly shared. Any AWS
    account can use this layer in their functions.
  action: >
    Remove the public permission from the layer version.
    To share with specific accounts, use explicit account
    IDs via lambda:AddLayerVersionPermission with a
    specific principal.
  example: |
    {
      "compute": {
        "kind": "lambda_layer_version",
        "lambda": {
          "layer_public": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: lambda_layer_version
    - field: properties.compute.lambda.layer_public
      op: eq
      value: true
tests:
  - name: "public layer version fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:lambda:us-east-1:111122223333:layer:shared-utils:3"
      asset_type: aws_lambda_layer_version
      vendor: aws
      properties:
        compute:
          kind: lambda_layer_version
          lambda:
            layer_public: true
  - name: "private layer version passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:lambda:us-east-1:111122223333:layer:internal-utils:5"
      asset_type: aws_lambda_layer_version
      vendor: aws
      properties:
        compute:
          kind: lambda_layer_version
          lambda:
            layer_public: false
