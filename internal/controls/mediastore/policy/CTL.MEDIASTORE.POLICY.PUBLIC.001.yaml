dsl_version: ctrl.v1
id: CTL.MEDIASTORE.POLICY.PUBLIC.001
name: MediaStore Container Policy Must Not Allow Public Access
description: >
  MediaStore container policy grants access to Principal "*"
  or external accounts without aws:PrincipalOrgID condition.
  MediaStore containers hold streaming media assets. A public
  container policy lets any AWS account (or unauthenticated
  caller if combined with public endpoint) read, overwrite,
  or delete media objects. Scott Piper's aws_exposable_resources
  lists mediastore:PutContainerPolicy as a public exposure vector.
  API: mediastore:GetContainerPolicy.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["DSP-17", "IVS-03"]
scope_tags:
  - aws
  - mediastore
taxonomy:
  - identity-perimeter
  - network-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_mediastore_container
params:
  attack_stage: collection
observation_fields:
  - media.kind
  - media.mediastore.container_policy_public
remediation:
  description: >
    MediaStore container policy grants public access.
    Any principal can read or modify media objects.
  action: >
    Restrict the container policy to specific account
    IDs or add an aws:PrincipalOrgID condition. For
    public content delivery, use CloudFront with an
    origin access identity instead of a public
    container policy.
  example: |
    {
      "media": {
        "kind": "mediastore_container",
        "mediastore": {
          "container_policy_public": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.media.kind
      op: eq
      value: mediastore_container
    - field: properties.media.mediastore.container_policy_public
      op: eq
      value: true
tests:
  - name: "public container policy fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:mediastore:us-east-1:111122223333:container/live-stream"
      asset_type: aws_mediastore_container
      vendor: aws
      properties:
        media:
          kind: mediastore_container
          mediastore:
            container_policy_public: true
  - name: "restricted container policy passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:mediastore:us-east-1:111122223333:container/live-stream"
      asset_type: aws_mediastore_container
      vendor: aws
      properties:
        media:
          kind: mediastore_container
          mediastore:
            container_policy_public: false
