dsl_version: ctrl.v1
id: CTL.ACCOUNT.DEPRECATED.SERVICE.001
name: No Resources Must Exist for AWS-Deprecated Services
description: >
  Resources exist for an AWS service that has been deprecated
  or announced for end-of-life. Resources on deprecated
  services are abandoned infrastructure by definition — the
  service they depend on is shutting down. AWS deprecated
  15+ services in 2024-2025 including CodeCommit, Cloud9,
  SimpleDB, S3 Select, Data Pipeline, QLDB, Forecast, App
  Mesh, Lookout for Vision/Equipment, MediaStore, Elastic
  Transcoder, Honeycode, DeepComposer, DeepLens, and
  DeepRacer. Resources on these services receive no security
  patches and have no migration path after shutdown.
  Source: AWS breaking_changes repo
  (github.com/SummitRoute/aws_breaking_changes).
domain: governance
severity: medium
compliance:
  nist_800_53_r5: "SI-2, CM-8"
  soc2: "CC6.1"
  ccm_v4: ["IVS-04", "BCR-09"]
scope_tags:
  - aws
taxonomy:
  - account-governance
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_account
params:
  attack_stage: persistence
observation_fields:
  - account.kind
  - account.deprecated_services.has_resources
  - account.deprecated_services.service_names
remediation:
  description: >
    Resources exist for deprecated AWS services. These
    services are shutting down and resources will stop
    functioning.
  action: >
    Migrate resources off deprecated services before
    their end-of-support date. Decommission resources
    that are no longer needed. Inventory deprecated
    service resources via AWS Config or the service's
    own console.
  example: |
    {
      "account": {
        "kind": "deprecated_service_inventory",
        "deprecated_services": {
          "has_resources": false,
          "service_names": []
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.account.kind
      op: eq
      value: deprecated_service_inventory
    - field: properties.account.deprecated_services.has_resources
      op: eq
      value: true
tests:
  - name: "deprecated service resources fires"
    verdict: VIOLATION
    asset:
      asset_id: "111122223333:deprecated-services"
      asset_type: aws_account
      vendor: aws
      properties:
        account:
          kind: deprecated_service_inventory
          deprecated_services:
            has_resources: true
            service_names: ["codecommit", "cloud9"]
  - name: "no deprecated service resources passes"
    verdict: PASS
    asset:
      asset_id: "111122223333:deprecated-services"
      asset_type: aws_account
      vendor: aws
      properties:
        account:
          kind: deprecated_service_inventory
          deprecated_services:
            has_resources: false
            service_names: []
