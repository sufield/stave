dsl_version: ctrl.v1
id: CTL.CLOUDTRAIL.MEMBERCANNARROW.001
name: Organization Member Accounts Can Narrow CloudTrail Event Scope
description: >
  No Service Control Policy prevents organization member accounts
  from calling cloudtrail:PutEventSelectors or
  cloudtrail:PutAdvancedEventSelector. Even with an organization
  trail in place, a compromised member-account admin can narrow
  the event selector scope — excluding specific event types,
  data sources, or UserIdentity principals — making subsequent
  actions invisible. Unlike StopLogging (which triggers CloudWatch
  alarms), scope narrowing produces no alarm because the trail
  remains active. This is the A5 (Separation of Duties) analog
  of CTL.CLOUDTRAIL.ORG.MEMBERCANSTOP.001: the actor can both
  perform actions and suppress the record of those actions.
domain: governance
severity: high
axioms: [A5]
compliance:
  cis_aws_v3.0: "3.1"
  soc2: "CC7.1, CC7.2"
  nist_800_53_r5: "AC-3, AU-9, AU-12"
  pci_dss_v4.0: "10.5, 10.7"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.5.15, A.8.15"
  ccm_v4: ["IAM-04", "LOG-08"]
scope_tags:
  - aws
  - cloudtrail
taxonomy:
  - compliance-mapping
  - logging
  - detection-evasion
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_cloudtrail_trail
params:
  attack_stage: detection_evasion
  blast_radius:
    type: detection
    scope: organization
    multiplier: 4.0
observation_fields:
  - audit.kind
  - audit.cloudtrail.scp_denies_eventselector_modify
remediation:
  description: >
    No SCP prevents member accounts from narrowing CloudTrail
    event scope. Member-account compromise can create targeted
    blind spots without disabling the trail.
  action: >
    Attach an SCP to the organization (or relevant OU) that
    denies cloudtrail:PutEventSelectors and
    cloudtrail:PutAdvancedEventSelector with a NotPrincipal
    excluding the security-admin role and the management account.
    Verify by attempting PutAdvancedEventSelector from a member
    account's admin role — the call must fail with an SCP-denied
    error.
  example: |
    {
      "audit": {
        "kind": "trail",
        "cloudtrail": {
          "scp_denies_eventselector_modify": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.audit.kind
      op: eq
      value: trail
    - field: properties.audit.cloudtrail.scp_denies_eventselector_modify
      op: ne
      value: true
defect: >
  No SCP prevents member accounts from modifying CloudTrail event
  selectors on their trail.
infection: >
  Without an SCP that denies cloudtrail:PutEventSelectors and
  cloudtrail:PutAdvancedEventSelector for member accounts: a
  compromised admin calls PutAdvancedEventSelector to add a
  UserIdentity exclusion — their VPC endpoint traffic becomes
  invisible. The trail stays active so no alarm fires; the scope
  just narrows silently. If the account also has its own trail
  (not org-managed), the attacker can narrow both management and
  data event coverage. An SCP with Deny on these actions
  (with condition excluding the management account or a security
  role) prevents the scope-narrowing attack.
failure: >
  Member accounts can narrow CloudTrail event scope. No SCP
  prevents PutEventSelectors or PutAdvancedEventSelector in
  member accounts.
tests:
  - name: "org member without event selector SCP — fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cloudtrail:us-east-1:111122223333:trail/member-trail"
      asset_type: aws_cloudtrail_trail
      vendor: aws
      properties:
        audit:
          kind: trail
          cloudtrail:
            scp_denies_eventselector_modify: false
  - name: "org member with event selector SCP — passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:cloudtrail:us-east-1:111122223333:trail/member-trail"
      asset_type: aws_cloudtrail_trail
      vendor: aws
      properties:
        audit:
          kind: trail
          cloudtrail:
            scp_denies_eventselector_modify: true
