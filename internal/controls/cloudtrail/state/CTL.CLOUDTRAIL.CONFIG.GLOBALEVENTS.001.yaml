dsl_version: ctrl.v1
id: CTL.CLOUDTRAIL.CONFIG.GLOBALEVENTS.001
name: CloudTrail Trail Does Not Include Global Service Events
description: >
  CloudTrail trail has IncludeGlobalServiceEvents set to
  false. Global service events come from services that
  operate globally rather than per-region — IAM, STS,
  CloudFront, Route 53. With global events excluded: IAM
  policy changes are not logged, STS AssumeRole calls
  are not logged, CloudFront distribution changes are
  not logged, and Route 53 record changes are not logged.
  These are among the most security-critical events. AWS
  multi-region trails default IncludeGlobalServiceEvents
  to true; this control catches single-region trails or
  multi-region trails where the flag has been explicitly
  flipped.
domain: governance
severity: high
compliance:
  cis_aws_v3.0: "3.1"
  soc2: "CC7.1"
  nist_800_53_r5: "AU-2, AU-3, AU-12"
  pci_dss_v4.0: "10.1, 10.2"
  fedramp_moderate: "AU-2"
  iso_27001_2022: "A.8.15, A.8.16"
  ccm_v4: ["LOG-02", "LOG-08"]
scope_tags:
  - aws
  - cloudtrail
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - logging
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_cloudtrail_trail
params:
  attack_stage: detection_evasion
  blast_radius:
    type: detection
    scope: account
    multiplier: 4.0
remediation:
  description: >
    Trail excludes global service events. IAM, STS,
    CloudFront, and Route 53 events are unrecorded.
  action: >
    Update the trail to include global service events:
    aws cloudtrail update-trail --name <trail>
    --include-global-service-events. For multi-region
    trails this is the default — the flag is only false
    when explicitly disabled. For single-region trails,
    enabling global events causes that trail to receive
    duplicate global events if any other trail in the
    account already does. The org pattern is one
    multi-region trail with global events enabled,
    and any per-region trails with global events
    disabled.
  example: |
    {
      "audit": {
        "kind": "trail",
        "cloudtrail": {
          "include_global_events": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.audit.kind
      op: eq
      value: trail
    - field: properties.audit.cloudtrail.include_global_events
      op: ne
      value: true
defect: >
  CloudTrail trail does not include global service events.
infection: >
  Global service events are generated by services that
  don't operate in a specific region — IAM, STS,
  CloudFront, Route 53. These services generate events
  in us-east-1 regardless of where the API call was
  made. With IncludeGlobalServiceEvents = false: IAM
  changes (CreateUser, AttachRolePolicy, CreateAccessKey)
  are not logged by this trail. STS events (AssumeRole,
  GetSessionToken) are not logged. An attacker who
  creates an IAM user, attaches AdministratorAccess, and
  assumes a cross-account role — all unrecorded. The
  most critical identity and access events are missing
  from the audit trail.
failure: >
  Identity events unrecorded. IAM, STS, CloudFront, and
  Route 53 events excluded from the audit trail.
tests:
  - name: trail without global events fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cloudtrail:us-east-1:111122223333:trail/org-trail"
      asset_type: aws_cloudtrail_trail
      vendor: aws
      properties:
        audit:
          kind: trail
          cloudtrail:
            include_global_events: false
  - name: trail with global events passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:cloudtrail:us-east-1:111122223333:trail/org-trail"
      asset_type: aws_cloudtrail_trail
      vendor: aws
      properties:
        audit:
          kind: trail
          cloudtrail:
            include_global_events: true
