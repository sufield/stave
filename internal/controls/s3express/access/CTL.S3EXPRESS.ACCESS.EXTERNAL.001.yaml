dsl_version: ctrl.v1
id: CTL.S3EXPRESS.ACCESS.EXTERNAL.001
name: No Unauthorized External Access to Directory Buckets
description: >
  Directory Bucket policies must not grant access to external AWS
  accounts without organization-scoping conditions. The s3express:
  IAM namespace is separate from s3:, so s3:-scoped RCPs that
  enforce data perimeters do not cover Directory Buckets.
domain: exposure
exposure:
  type: cross_account_access
  principal_scope: cross_account
severity: high
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.3"
  ccm_v4: ["DSP-17", "IAM-16"]
scope_tags:
  - aws
  - s3express
taxonomy:
  - identity-perimeter
  - trust-boundary
  - data-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3express_directory_bucket
params:
  attack_stage: exfiltration
observation_fields:
  - storage.kind
  - storage.access.external_account_ids
remediation:
  description: >
    Directory Bucket policy grants access to external AWS accounts.
  action: >
    Remove external account access or add aws:PrincipalOrgID
    condition. Verify s3express:-scoped SCP/RCP coverage exists
    independently of s3: policies.
  example: |
    {
      "storage": {
        "kind": "directory_bucket",
        "access": {
          "external_account_ids": []
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: directory_bucket
    - field: properties.storage.access.external_account_ids
      op: present
tests:
  - name: directory bucket with external account access fires
    verdict: VIOLATION
    asset:
      asset_id: arn:aws:s3express:us-east-1:123456789012:bucket/shared--use1-az4--x-s3
      asset_type: aws_s3express_directory_bucket
      vendor: aws
      properties:
        storage:
          kind: directory_bucket
          access:
            external_account_ids: ["987654321098"]
  - name: directory bucket with no external access passes
    verdict: PASS
    asset:
      asset_id: arn:aws:s3express:us-east-1:123456789012:bucket/internal--use1-az4--x-s3
      asset_type: aws_s3express_directory_bucket
      vendor: aws
      properties:
        storage:
          kind: directory_bucket
          access:
            external_account_ids: []
