dsl_version: ctrl.v1
id: CTL.M365.DEFENDER.SAFEATTACH.001
name: Safe Attachments Not Enabled
description: >
  Attachments not detonated in sandbox. Zero-day malware in
  documents and archives reaches inboxes without behavioral analysis.
domain: detection
severity: high
compliance:
  cis_m365_v4: "8.6"
  nist_800_53_r5: "SI-3"
  pci_dss_v4: "5.2"
  soc2: "CC7.1"
scope_tags: [m365]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types: [m365_resource]
params:
  attack_stage: initial_access
remediation:
  description: Safe Attachments Not Enabled — finding detected.
  action: Remediate per control description.
  example: |
    {"m365": {"security": {"kind": "defender_config", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.m365.security.kind
      op: eq
      value: defender_config
    - field: properties.m365.security.defender.safe_attachments_enabled
      op: eq
      value: false
