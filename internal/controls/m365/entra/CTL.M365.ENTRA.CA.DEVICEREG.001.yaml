dsl_version: ctrl.v1
id: CTL.M365.ENTRA.CA.DEVICEREG.001
name: MFA Not Required for Device Registration
description: >
  MFA not required for device registration. An attacker registers
  a controlled device with a stolen password.
domain: identity
severity: high
compliance:
  cis_m365_v4: "5.5"
  nist_800_53_r5: "IA-2"
  soc2: "CC6.1"
scope_tags: [m365]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types: [m365_resource]
params:
  attack_stage: initial_access
remediation:
  description: MFA Not Required for Device Registration — finding detected.
  action: Remediate per control description.
  example: |
    {"m365": {"identity": {"kind": "conditional_access_policy", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.m365.identity.kind
      op: eq
      value: conditional_access_policy
    - field: properties.m365.identity.ca.requires_mfa_for_device_reg
      op: ne
      value: true
