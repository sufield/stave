dsl_version: ctrl.v1
id: CTL.M365.ENTRA.CA.PLATFORMS.001
name: Unknown Device Platforms Not Blocked
description: >
  Sign-ins from unknown device platforms not blocked. Only known
  platforms (Windows, macOS, iOS, Android) should be allowed.
domain: identity
severity: medium
compliance:
  cis_m365_v4: "5.3"
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
scope_tags: [m365]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types: [m365_resource]
params:
  attack_stage: initial_access
remediation:
  description: Unknown Device Platforms Not Blocked — finding detected.
  action: Remediate per control description.
  example: |
    {"m365": {"identity": {"kind": "conditional_access_policy", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.m365.identity.kind
      op: eq
      value: conditional_access_policy
    - field: properties.m365.identity.ca.blocks_unknown_platforms
      op: ne
      value: true
