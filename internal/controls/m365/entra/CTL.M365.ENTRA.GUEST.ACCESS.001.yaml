dsl_version: ctrl.v1
id: CTL.M365.ENTRA.GUEST.ACCESS.001
name: Guest User Access Not Restricted
description: >
  Guest users have same access as members by default. Guests
  should have restricted directory access.
domain: identity
severity: medium
compliance:
  cis_m365_v4: "7.2"
  nist_800_53_r5: "AC-3"
  soc2: "CC6.2"
scope_tags: [m365]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types: [m365_resource]
params:
  attack_stage: initial_access
remediation:
  description: Guest User Access Not Restricted — finding detected.
  action: Remediate per control description.
  example: |
    {"m365": {"identity": {"kind": "entra_config", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.m365.identity.kind
      op: eq
      value: entra_config
    - field: properties.m365.identity.guest.access_restricted
      op: ne
      value: true
