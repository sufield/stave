dsl_version: ctrl.v1
id: CTL.M365.TEAMS.MEETING.EXTERNAL.001
name: External Users Have Elevated Meeting Privileges
description: >
  External users can chat, take control, or bypass lobby in
  meetings. One or more elevated privileges enabled.
domain: exposure
severity: medium
compliance:
  cis_m365_v4: "12.2"
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
scope_tags: [m365]
taxonomy:
  - compliance-mapping
subtractive_category:
  - S05
type: unsafe_state
classification: state_assertion
applicable_asset_types: [m365_resource]
params:
  attack_stage: initial_access
remediation:
  description: External Users Have Elevated Meeting Privileges — finding detected.
  action: Remediate per control description.
  example: |
    {"m365": {"collaboration": {"kind": "teams_config", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.m365.collaboration.kind
      op: eq
      value: teams_config
    - field: properties.m365.collaboration.teams.external_control_enabled
      op: eq
      value: true
