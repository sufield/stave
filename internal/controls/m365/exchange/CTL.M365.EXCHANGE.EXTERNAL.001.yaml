dsl_version: ctrl.v1
id: CTL.M365.EXCHANGE.EXTERNAL.001
name: External Email Tagging Not Enabled
description: >
  Inbound external email not tagged with [External] indicator.
  Impersonation emails appear identical to internal messages.
domain: exposure
severity: medium
compliance:
  cis_m365_v4: "10.4"
  nist_800_53_r5: "SI-4"
  soc2: "CC7.1"
scope_tags: [m365]
taxonomy:
  - compliance-mapping
  - impersonation
type: unsafe_state
classification: state_assertion
applicable_asset_types: [m365_resource]
params:
  attack_stage: initial_access
remediation:
  description: External Email Tagging Not Enabled — finding detected.
  action: Remediate per control description.
  example: |
    {"m365": {"exchange": {"kind": "exchange_org", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.m365.exchange.kind
      op: eq
      value: exchange_org
    - field: properties.m365.exchange.external_tagging_enabled
      op: eq
      value: false
