dsl_version: ctrl.v1
id: CTL.M365.EXCHANGE.TRANSPORT.WHITELIST.001
name: Transport Rules Whitelist Bypasses Filtering
description: >
  Transport rules whitelist senders/domains, bypassing ALL
  filtering including malware. Higher severity than spam bypass.
domain: detection
severity: high
compliance:
  cis_m365_v4: "10.9"
  nist_800_53_r5: "SI-3"
  soc2: "CC6.8"
scope_tags: [m365]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types: [m365_resource]
params:
  attack_stage: initial_access
remediation:
  description: Transport Rules Whitelist Bypasses Filtering — finding detected.
  action: Remediate per control description.
  example: |
    {"m365": {"exchange": {"kind": "exchange_org", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.m365.exchange.kind
      op: eq
      value: exchange_org
    - field: properties.m365.exchange.transport_whitelist_disabled
      op: eq
      value: false
