dsl_version: ctrl.v1
id: CTL.M365.ADMIN.PASSWORD.001
name: Passwords Set to Never Expire
description: >
  Passwords never expire. Acceptable only with active breach
  detection (user risk policy). Without it, compromised credentials
  persist indefinitely.
domain: identity
severity: medium
compliance:
  cis_m365_v4: "15.3"
  nist_800_53_r5: "IA-5"
  soc2: "CC6.1"
scope_tags: [m365]
taxonomy:
  - compliance-mapping
  - credential-lifecycle
subtractive_category:
  - S02
  - S07
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types: [m365_resource]
params:
  attack_stage: persistence
remediation:
  description: Passwords Set to Never Expire — finding detected.
  action: Remediate per control description.
  example: |
    {"m365": {"placeholder": true}}
unsafe_predicate:
  all:
    - field: properties.m365.admin.kind
      op: eq
      value: admincenter_config
    - field: properties.m365.admin.password_expiry_enabled
      op: eq
      value: false
