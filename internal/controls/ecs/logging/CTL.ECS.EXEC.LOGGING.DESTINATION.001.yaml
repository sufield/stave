dsl_version: ctrl.v1
id: CTL.ECS.EXEC.LOGGING.DESTINATION.001
name: ECS Execute Command Sessions Not Logged to Durable Destination
description: >
  ECS cluster has execute command enabled but session output is not
  routed to a durable destination (S3 or CloudWatch Logs). Without
  session logging, interactive shell commands run inside containers
  produce no audit trail — an operator or attacker can execute
  arbitrary commands with no record of what was typed or returned.
  The ExecuteCommandConfiguration.logConfiguration must route to S3
  or CloudWatch to satisfy audit requirements.
domain: detection
severity: high
compliance:
  nist_800_53_r5: "AU-2, AU-3, AU-6"
  fedramp_moderate: "AU-2"
  hipaa: "164.312(b)"
  pci_dss_v4.0: "10.2.1"
  soc2: "CC7.2"
  mitre_attack: "T1059"
  ccm_v4: ["LOG-03", "LOG-12"]
scope_tags:
  - aws
  - ecs
taxonomy:
  - compliance-mapping
  - logging
  - monitoring
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_ecs_task_definition]
params:
  attack_stage: detection_evasion
  blast_radius:
    type: detection
    scope: cluster
    multiplier: 2.0
observation_fields:
  - container.kind
  - container.exec.enabled_in_production
  - container.exec.logging_enabled
remediation:
  description: >
    ECS execute command is enabled but session logs have no durable
    destination. Interactive shell sessions produce no audit trail.
  action: >
    Configure ExecuteCommandConfiguration.logConfiguration in the
    ECS cluster to route session output to an S3 bucket or CloudWatch
    Logs group. Set cloudWatchLogGroupName or s3BucketName, and
    enable cloudWatchEncryptionEnabled or s3EncryptionEnabled.
  example: |
    {
      "container": {
        "kind": "ecs_service",
        "exec": {
          "enabled_in_production": true,
          "logging_enabled": true,
          "logging_destination": "cloudwatch"
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.container.kind
      op: eq
      value: ecs_service
    - field: properties.container.exec.enabled_in_production
      op: eq
      value: true
    - field: properties.container.exec.logging_enabled
      op: eq
      value: false
tests:
  - name: "exec enabled without logging — fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:ecs:us-east-1:111122223333:cluster/prod-api"
      asset_type: aws_ecs_task_definition
      vendor: aws
      properties:
        container:
          kind: ecs_service
          exec:
            enabled_in_production: true
            logging_enabled: false
  - name: "exec enabled with CloudWatch logging — passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:ecs:us-east-1:111122223333:cluster/prod-api"
      asset_type: aws_ecs_task_definition
      vendor: aws
      properties:
        container:
          kind: ecs_service
          exec:
            enabled_in_production: true
            logging_enabled: true
            logging_destination: cloudwatch
  - name: "exec disabled — passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:ecs:us-east-1:111122223333:cluster/prod-api"
      asset_type: aws_ecs_task_definition
      vendor: aws
      properties:
        container:
          kind: ecs_service
          exec:
            enabled_in_production: false
            logging_enabled: false
