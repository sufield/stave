dsl_version: ctrl.v1
id: CTL.GITHUB.REPO.FORCEPUSH.001
name: Default Branch Allows Force Push
description: >
  Force push allowed on the default branch. Force push rewrites
  git history — an attacker can remove evidence of previous commits
  and replace branch content entirely.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "CM-5"
  nist_ssdf: "PS.1"
  soc2: "CC8.1"
scope_tags: [github]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types: [github_repository]
params:
  attack_stage: detection_evasion
remediation:
  description: Default Branch Allows Force Push — finding detected.
  action: Disable force push on the default branch in branch protection.
  example: |
    {"github": {"repo": {"kind": "repository", "branch_protection": {"allows_force_push": false}}}}
unsafe_predicate:
  all:
    - field: properties.github.repo.kind
      op: eq
      value: repository
    - field: properties.github.repo.branch_protection.allows_force_push
      op: eq
      value: true
