dsl_version: ctrl.v1
id: CTL.MQ.ENCRYPT.CMK.001
name: MQ Broker Not Encrypted with Customer-Managed KMS Key
description: >
  Amazon MQ broker has encryption at rest enabled but does not use
  a customer-managed KMS key. The AWS-managed key provides at-rest
  encryption but no key-policy control and no ability to revoke
  access by disabling the key. If the uses_cmk field is absent the
  control is not-evaluable and does not fire.
domain: exposure
severity: medium
compliance:
  soc2: "CC6.1, CC6.7"
  nist_800_53_r5: "SC-12, SC-13, SC-28"
  pci_dss_v4.0: "3.5"
  ccm_v4: ["CEK-03"]
scope_tags:
  - aws
  - mq
taxonomy:
  - encryption-at-rest
  - key-management
subtractive_category:
  - S10
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_mq_broker
params:
  attack_stage: exfiltration
observation_fields:
  - storage.kind
  - storage.encryption.at_rest_enabled
  - storage.encryption.uses_cmk
remediation:
  description: >
    MQ broker encryption is not backed by a customer-managed KMS key.
  action: >
    Create a new broker with a customer-managed KMS key
    (aws mq create-broker --encryption-options KmsKeyId=arn:aws:kms:...:key/...).
    Migrate broker configuration and queues.
  example: |
    {
      "storage": {
        "kind": "mq_broker",
        "encryption": {
          "at_rest_enabled": true,
          "uses_cmk": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: mq_broker
    - field: properties.storage.encryption.at_rest_enabled
      op: eq
      value: true
    - field: properties.storage.encryption.uses_cmk
      op: eq
      value: false
tests:
  - name: broker with AWS-managed key fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:mq:us-east-1:111122223333:broker:my-broker:abc123"
      asset_type: aws_mq_broker
      vendor: aws
      properties:
        storage:
          kind: mq_broker
          encryption:
            at_rest_enabled: true
            uses_cmk: false
  - name: broker with CMK passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:mq:us-east-1:111122223333:broker:my-broker:abc123"
      asset_type: aws_mq_broker
      vendor: aws
      properties:
        storage:
          kind: mq_broker
          encryption:
            at_rest_enabled: true
            uses_cmk: true
  - name: broker with absent uses_cmk passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:mq:us-east-1:111122223333:broker:my-broker:abc123"
      asset_type: aws_mq_broker
      vendor: aws
      properties:
        storage:
          kind: mq_broker
          encryption:
            at_rest_enabled: true
