dsl_version: ctrl.v1
id: CTL.MQ.SECRET.BROKER.001
name: MQ Broker Credentials Must Use Secrets Manager
description: >
  Amazon MQ broker user credentials are not managed through
  AWS Secrets Manager. Hardcoded broker credentials risk
  exposure and complicate rotation.
domain: identity
severity: low
compliance:
  nist_800_53_r5: "IA-5"
  soc2: "CC6.1"
scope_tags:
  - aws
  - mq
taxonomy:
  - compliance-mapping
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_mq_broker]
params:
  attack_stage: credential_access
remediation:
  description: >
    MQ broker credentials are not managed via Secrets Manager.
  action: >
    Store broker user credentials in AWS Secrets Manager and
    configure automatic rotation.
  example: |
    {
      "messaging": {
        "kind": "broker",
        "credentials": {
          "uses_secrets_manager": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.messaging.kind
      op: eq
      value: broker
    - field: properties.messaging.credentials.uses_secrets_manager
      op: ne
      value: true
tests:
  - name: broker without Secrets Manager fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:mq:us-east-1:123456789012:broker:my-broker"
      asset_type: aws_mq_broker
      vendor: aws
      properties:
        messaging:
          kind: broker
          credentials:
            uses_secrets_manager: false
  - name: broker with Secrets Manager passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:mq:us-east-1:123456789012:broker:my-broker"
      asset_type: aws_mq_broker
      vendor: aws
      properties:
        messaging:
          kind: broker
          credentials:
            uses_secrets_manager: true
