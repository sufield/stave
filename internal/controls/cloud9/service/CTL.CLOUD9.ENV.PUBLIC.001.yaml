dsl_version: ctrl.v1
id: CTL.CLOUD9.ENV.PUBLIC.001
name: Cloud9 Environment Has Public SSH Access
description: >
  Cloud9 environment is configured with CONNECT_SSH connection type,
  which requires the underlying EC2 instance to have a public IP
  address and SSH port open to the internet. This exposes the
  development environment to brute force attacks and credential
  stuffing. Use CONNECT_SSM (Systems Manager) instead, which does
  not require a public IP or inbound security group rules.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SC-7"
  soc2: "CC6.6"
  ccm_v4: ["IVS-03"]
scope_tags: [aws, cloud9]
taxonomy:
  - network-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_cloud9_environment]
params:
  attack_stage: initial_access
observation_fields:
  - compute.cloud9.connection_type
remediation:
  description: Cloud9 environment uses SSH connection requiring public IP.
  action: >
    Recreate the Cloud9 environment with CONNECT_SSM connection type.
    SSM does not require a public IP or inbound security group rules.
  example: |
    {"compute": {"cloud9": {"connection_type": "CONNECT_SSM"}}}
unsafe_predicate:
  all:
    - field: properties.compute.cloud9.connection_type
      op: eq
      value: CONNECT_SSH
tests:
  - name: "SSH connection type fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cloud9:us-east-1:111122223333:environment:abc123"
      asset_type: aws_cloud9_environment
      vendor: aws
      properties:
        compute:
          cloud9: {connection_type: CONNECT_SSH}
  - name: "SSM connection type passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:cloud9:us-east-1:444455556666:environment:def456"
      asset_type: aws_cloud9_environment
      vendor: aws
      properties:
        compute:
          cloud9: {connection_type: CONNECT_SSM}
  - name: "lowercase SSH fires (case-insensitive enum)"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cloud9:us-east-1:777788889999:environment:ghi789"
      asset_type: aws_cloud9_environment
      vendor: aws
      properties:
        compute:
          cloud9: {connection_type: connect_ssh}
