dsl_version: ctrl.v1
id: CTL.CLOUD9.IMDS.V1.001
name: Cloud9 Environment Must Enforce IMDSv2
description: >
  Cloud9 environment EC2 instance allows IMDSv1 access. IMDSv1
  is vulnerable to SSRF attacks that can steal instance
  credentials from the metadata endpoint.
domain: exposure
severity: low
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  owasp_subtractive: "S01"
  subtractive_tier: "deletion"
scope_tags:
  - aws
  - cloud9
taxonomy:
  - compliance-mapping
  - credential-lifecycle
subtractive_category:
  - S01
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_cloud9_environment]
params:
  attack_stage: credential_access
remediation:
  description: >
    Cloud9 environment allows IMDSv1 access.
  action: >
    Enforce IMDSv2 on the Cloud9 environment EC2 instance.
  example: |
    {
      "compute": {
        "kind": "cloud9_environment",
        "metadata": {
          "imdsv2_enforced": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: cloud9_environment
    - field: properties.compute.metadata.imdsv2_enforced
      op: ne
      value: true
tests:
  - name: environment without IMDSv2 fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cloud9:us-east-1:123456789012:environment:abc123"
      asset_type: aws_cloud9_environment
      vendor: aws
      properties:
        compute:
          kind: cloud9_environment
          metadata:
            imdsv2_enforced: false
  - name: environment with IMDSv2 passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:cloud9:us-east-1:123456789012:environment:abc123"
      asset_type: aws_cloud9_environment
      vendor: aws
      properties:
        compute:
          kind: cloud9_environment
          metadata:
            imdsv2_enforced: true
