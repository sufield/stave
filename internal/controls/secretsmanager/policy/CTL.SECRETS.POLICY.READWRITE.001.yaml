dsl_version: ctrl.v1
id: CTL.SECRETS.POLICY.READWRITE.001
name: Secret Policy Grants Both Read and Write to Same Principal
description: >
  Secret resource policy grants both secretsmanager:GetSecretValue
  (read the credential) and secretsmanager:PutSecretValue
  (modify the credential) to the same APPLICATION principal.
  The principal that reads the credential can also change
  it — no separation between credential consumer (reads)
  and credential manager (writes). An attacker who
  compromises the principal can read the current credential
  AND replace it. The control excludes rotation-Lambda
  principals (which legitimately need PutSecretValue for
  rotation) by checking the policy_rotation_principals
  inventory.
domain: governance
severity: medium
compliance:
  owasp_nhi: "NHI5"
  soc2: "CC6.1, CC6.3"
  nist_800_53_r5: "AC-3, AC-6, SC-12"
  pci_dss_v4.0: "7.1, 7.2"
  fedramp_moderate: "AC-6"
  iso_27001_2022: "A.5.15, A.8.3"
  ccm_v4: ["IAM-04", "IAM-09"]
scope_tags:
  - aws
  - secretsmanager
taxonomy:
  - compliance-mapping
  - credential-lifecycle
subtractive_category:
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_secretsmanager_secret]
params:
  attack_stage: credential_access
remediation:
  description: >
    Secret policy grants both GetSecretValue and
    PutSecretValue to the same application principal.
  action: >
    Split the principal: keep GetSecretValue on the
    application role and move PutSecretValue to a separate
    administrative or rotation role. Update the secret
    resource policy to reflect the split (separate Statement
    blocks per role). If a single principal genuinely needs
    both — a service that updates its own credential —
    document the rationale and add compensating controls
    (audit alarm on PutSecretValue events, MFA condition on
    PutSecretValue).
  example: |
    {
      "secret": {
        "kind": "secret",
        "policy": {
          "policy_read_principals": ["arn:aws:iam::111122223333:role/app"],
          "policy_write_principals": ["arn:aws:iam::111122223333:role/rotation"],
          "has_read_write_overlap": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.policy.has_read_write_overlap
      op: eq
      value: true
defect: >
  Secret policy grants both GetSecretValue and PutSecretValue
  to the same application principal.
infection: >
  Separation of read and write for credentials means:
  applications READ the credential (GetSecretValue) to
  authenticate to the target service. Administrators or
  rotation functions WRITE the credential (PutSecretValue)
  to update it. When both permissions overlap on an
  application principal: a compromised application role can
  change the database password (locking out every other
  application that uses the same credential), an insider
  with application access can modify the credential
  (replacing the production password with one they control),
  and there's no separation between credential consumer and
  credential manager. The blast radius of compromising the
  application role expands from "read the credential" to
  "control the credential."
failure: >
  No read/write separation. The same principal can both
  retrieve and replace the credential.
tests:
  - name: app role with GetSecretValue + PutSecretValue fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/db-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          policy:
            policy_read_principals: ["arn:aws:iam::111122223333:role/api-server"]
            policy_write_principals: ["arn:aws:iam::111122223333:role/api-server"]
            has_read_write_overlap: true
            read_write_overlap_principals: ["arn:aws:iam::111122223333:role/api-server"]
  - name: separated read/write principals passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/db-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          policy:
            policy_read_principals: ["arn:aws:iam::111122223333:role/api-server"]
            policy_write_principals: ["arn:aws:iam::111122223333:role/rotation"]
            has_read_write_overlap: false
            read_write_overlap_principals: []
  - name: rotation Lambda with write-only does not fire
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/db-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          policy:
            policy_read_principals: ["arn:aws:iam::111122223333:role/api-server"]
            policy_write_principals: ["arn:aws:iam::111122223333:role/rotation"]
            has_read_write_overlap: false
            read_write_overlap_principals: []
