dsl_version: ctrl.v1
id: CTL.SECRETS.ALARM.ACCESS.FAILURE.001
name: No CloudWatch Alarm for GetSecretValue Failures
description: >
  No CloudWatch alarm monitors GetSecretValue API calls
  that return errors (AccessDeniedException,
  ResourceNotFoundException, DecryptionFailureException).
  Access failure spikes indicate either active security
  events (credential scraping — an attacker testing which
  secrets they can read), operational failures (secret
  deleted or KMS key disabled — services breaking), or
  permission changes (IAM policy modified — legitimate
  services losing access). The alarm targets spikes, not
  individual failures, since transient denials happen
  during normal IAM deployments.
domain: detection
severity: medium
compliance:
  cis_aws_v3.0: "4.4"
  soc2: "CC6.1, CC7.2"
  nist_800_53_r5: "AU-6, SI-4"
  pci_dss_v4.0: "10.6"
  fedramp_moderate: "SI-4"
  iso_27001_2022: "A.8.16"
  ccm_v4: ["LOG-08"]
scope_tags:
  - aws
  - secretsmanager
taxonomy:
  - credential-lifecycle
  - logging
  - monitoring
subtractive_category:
  - S09
  - S10
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_secretsmanager_secret]
params:
  attack_stage: detection_evasion
remediation:
  description: >
    GetSecretValue failures are unmonitored.
    Access-denied spikes and decryption failures are
    invisible.
  action: >
    Create a CloudTrail metric filter on
    eventName = GetSecretValue with errorCode present:
    '{ $.eventName = "GetSecretValue" && $.errorCode = "*" }'
    and a CloudWatch alarm with a threshold tuned to
    typical baseline noise (start at 5 errors per 5
    minutes; tune by environment). Route to ops/security
    on-call. Optionally split the alarm by errorCode so
    AccessDeniedException (security signal),
    ResourceNotFoundException (operational signal), and
    DecryptionFailureException (KMS signal) page distinct
    teams.
  example: |
    {
      "secret": {
        "kind": "secret",
        "monitoring": {
          "alarm_access_failure": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.monitoring.alarm_access_failure
      op: ne
      value: true
defect: >
  No CloudWatch alarm monitors GetSecretValue failures.
infection: >
  GetSecretValue failures appear as errorCode in CloudTrail
  events. Common codes: AccessDeniedException (principal
  lacks permission — may be unauthorized access attempt or
  IAM misconfiguration), ResourceNotFoundException (secret
  deleted or doesn't exist — service is broken),
  DecryptionFailureException (KMS key issue — secret
  exists but can't be decrypted). A spike in
  GetSecretValue failures indicates either: an active
  security event (credential scraping — attacker testing
  which secrets they can read), an operational failure
  (secret deleted or key disabled — services breaking),
  or a permission change (IAM policy modified —
  legitimate services losing access).
failure: >
  Undetected credential access failures. Unauthorized
  access attempts or service failures manifest as
  GetSecretValue errors without notification.
tests:
  - name: secret without access-failure alarm fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/api-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          monitoring:
            alarm_access_failure: false
  - name: secret with access-failure alarm passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/api-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          monitoring:
            alarm_access_failure: true
