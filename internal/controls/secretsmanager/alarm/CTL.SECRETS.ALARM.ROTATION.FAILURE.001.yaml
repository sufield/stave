dsl_version: ctrl.v1
id: CTL.SECRETS.ALARM.ROTATION.FAILURE.001
name: No CloudWatch Alarm for Secrets Manager Rotation Failure
description: >
  No CloudWatch alarm monitors the RotationFailed event
  (Secrets Manager → CloudWatch Events / EventBridge) or
  CloudTrail RotateSecret error events. When rotation fails
  the credential doesn't change, the next rotation attempt
  may also fail, and the credential becomes static while
  rotation appears configured. Companion to
  CTL.SECRETS.GHOST.ROTATIONLAMBDA.001 and
  CTL.SECRETS.ROTATION.STALE.001 (SM-1): the SM-1 controls
  detect rotation already broken (state); this alarm
  detects rotation failing now (event), enabling
  minutes-level response.
domain: detection
severity: critical
compliance:
  owasp_nhi: "NHI7"
  cis_aws_v3.0: "2.4"
  soc2: "CC7.2, CC7.3"
  nist_800_53_r5: "IA-5, SI-4, IR-4"
  pci_dss_v4.0: "8.2.4, 10.6"
  fedramp_moderate: "SI-4"
  hipaa: "164.312(a)(1)"
  iso_27001_2022: "A.5.16, A.8.16"
  ccm_v4: ["IAM-04", "LOG-08"]
scope_tags:
  - aws
  - secretsmanager
taxonomy:
  - credential-lifecycle
  - logging
  - monitoring
  - trust-decay
subtractive_category:
  - S07
  - S08
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_secretsmanager_secret]
params:
  attack_stage: detection_evasion
  blast_radius:
    type: detection
    scope: account
    multiplier: 3.0
remediation:
  description: >
    Rotation failures are unmonitored. Credential rotation
    may stop without notification.
  action: >
    Either: (a) configure an EventBridge rule on
    aws.secretsmanager source with detail-type "AWS API Call
    via CloudTrail" and event names containing rotation
    failure / lambda invocation errors, then route to a
    CloudWatch alarm via SNS notification; or (b) create a
    CloudTrail metric filter on
    eventName = RotateSecret AND errorCode is present, then
    a CloudWatch alarm with threshold >= 1 over a 5-minute
    period. Either path provides minutes-level detection.
    Verify the alarm action publishes to a topic with at
    least one confirmed subscriber (see
    CTL.SNS.LIFECYCLE.UNCONFIRMED.001).
  example: |
    {
      "secret": {
        "kind": "secret",
        "monitoring": {
          "alarm_rotation_failure": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.monitoring.alarm_rotation_failure
      op: ne
      value: true
defect: >
  No CloudWatch alarm monitors Secrets Manager rotation
  failures.
infection: >
  Rotation failure means the Lambda function attempted to
  rotate the credential and failed. Common causes: the
  Lambda function can't reach the target database
  (network/VPC/SG change), the Lambda function doesn't
  have permission to change the password (IAM policy
  changed), the Lambda function code has a bug (runtime
  error), or the target service rejected the new
  credential (password policy violation). After failure:
  the credential stays the same (AWSCURRENT unchanged),
  the LastRotatedDate doesn't advance, and Secrets Manager
  may retry on the next scheduled rotation — which may
  also fail for the same reason. Without an alarm, the
  team discovers rotation failure when an auditor checks
  LastRotatedDate (weeks later), a compliance scan flags
  the secret (quarterly), or ROTATION.STALE.001 fires
  (after 2x the interval). A rotation failure alarm
  provides minutes-level detection.
failure: >
  Undetected rotation failure. Credential rotation failed
  — the credential is static with no real-time
  notification.
tests:
  - name: secret without rotation failure alarm fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/rds-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          monitoring:
            alarm_rotation_failure: false
  - name: secret with rotation failure alarm passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/rds-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          monitoring:
            alarm_rotation_failure: true
  - name: ghost rotation Lambda + no failure alarm fires (compound)
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:legacy/api-XyZ"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          monitoring:
            alarm_rotation_failure: false
          rotation:
            rotation_enabled: true
            rotation_lambda_exists: false
            has_ghost_rotation_lambda: true
