dsl_version: ctrl.v1
id: CTL.SECRETS.REPLICA.ORPHAN.001
name: Secret Primary Deleted But Replicas Remain
description: >
  Secrets Manager secret primary was deleted but replica
  secrets in other regions still exist. Replicas retain
  the credential value (frozen at the last value before
  deletion), the resource policy, and the encryption
  configuration — but no longer receive rotation updates
  from the primary. The replicas are orphaned credential
  caches with no lifecycle management.
domain: governance
severity: medium
compliance:
  soc2: "CC6.1, CC8.1"
  nist_800_53_r5: "CM-2, CM-3, SC-12"
  pci_dss_v4.0: "1.2, 8.2.4"
  fedramp_moderate: "CM-2"
  iso_27001_2022: "A.5.16, A.8.32"
  ccm_v4: ["IAM-04", "IAM-08"]
scope_tags:
  - aws
  - secretsmanager
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - trust-decay
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_secretsmanager_secret]
params:
  attack_stage: credential_access
remediation:
  description: >
    Replica persists after primary deletion. The credential
    is frozen and cannot rotate.
  action: >
    Decide intent: (a) if the deletion was intentional and
    no consumers in the replica region depend on the
    secret, schedule the replica for deletion
    (aws secretsmanager delete-secret --secret-id
    <replica-arn> --recovery-window-in-days 30); (b) if
    the replica region has consumers that still need the
    credential, promote the replica to a standalone
    primary and re-establish rotation
    (aws secretsmanager remove-regions-from-replication
    on the original primary first if a primary still
    exists). Audit the target service to confirm the
    credential held in the replica is still valid; if
    not, the orphan replica is misleading consumers with
    a stale value.
  example: |
    {
      "secret": {
        "kind": "secret",
        "replication": {
          "is_replica": false,
          "primary_exists": true,
          "has_orphan_primary": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.replication.is_replica
      op: eq
      value: true
    - field: properties.secret.replication.has_orphan_primary
      op: eq
      value: true
defect: >
  Secret replica persists after the primary has been
  deleted.
infection: >
  When a primary secret is deleted, replicas are NOT
  automatically deleted — they persist as standalone
  secrets with the last replicated credential value.
  The replica retains: the credential value (frozen at
  the last rotation before primary deletion), the
  resource policy (access control still grants
  GetSecretValue to permitted principals), and the
  encryption (KMS key in the replica region). The
  credential in the replica may still authenticate at
  the target service — the database password may still
  work even though the primary secret management was
  deleted. The replica is an orphaned credential cache
  with no lifecycle management.
failure: >
  Orphaned credential replica. Primary deleted but
  replica retains the credential value with no rotation
  or lifecycle management.
tests:
  - name: orphan replica fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:eu-west-1:111122223333:secret:prod/global-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          replication:
            is_replica: true
            primary_arn: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/global-AbCdEf"
            primary_exists: false
            has_orphan_primary: true
            replica_region: "eu-west-1"
  - name: replica with active primary passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:eu-west-1:111122223333:secret:prod/global-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          replication:
            is_replica: true
            primary_arn: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/global-AbCdEf"
            primary_exists: true
            has_orphan_primary: false
            replica_region: "eu-west-1"
  - name: orphan replica holding RDS credential fires (frozen rotation)
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:ap-southeast-1:111122223333:secret:prod/rds-master-XyZ"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          replication:
            is_replica: true
            primary_arn: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/rds-master-XyZ"
            primary_exists: false
            has_orphan_primary: true
            replica_region: "ap-southeast-1"
          target:
            secret_type: "rds"
