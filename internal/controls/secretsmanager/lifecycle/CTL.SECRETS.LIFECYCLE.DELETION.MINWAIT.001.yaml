dsl_version: ctrl.v1
id: CTL.SECRETS.LIFECYCLE.DELETION.MINWAIT.001
name: Secret Scheduled for Deletion with Minimum Recovery Window
description: >
  Secret is scheduled for deletion with the minimum 7-day
  recovery window. The minimum window provides the least
  time to discover dependent services that fail. A 30-day
  window provides more time for weekly batch jobs and
  monthly processes to fail loudly while the secret is
  still recoverable. Same pattern as
  CTL.KMS.DELETION.MINWAIT.001 — short windows force every
  consumer to be discovered fast or not at all.
domain: governance
severity: high
compliance:
  soc2: "CC6.1, CC8.1, A1.2"
  nist_800_53_r5: "CM-2, CM-3, CP-10"
  pci_dss_v4.0: "1.2"
  fedramp_moderate: "CM-2"
  iso_27001_2022: "A.5.16, A.8.32"
  ccm_v4: ["IAM-04", "BCR-08"]
scope_tags:
  - aws
  - secretsmanager
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - logging
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_secretsmanager_secret]
params:
  attack_stage: impact
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.0
remediation:
  description: >
    Secret is scheduled for deletion with the minimum
    recovery window; weekly and monthly consumers may not
    surface in time.
  action: >
    Cancel the deletion (aws secretsmanager restore-secret
    --secret-id <id>) and reschedule with a longer recovery
    window — at least 30 days
    (aws secretsmanager delete-secret --secret-id <id>
    --recovery-window-in-days 30). Audit the secret's
    CloudTrail history for callers that retrieve the
    credential infrequently (weekly batch, monthly billing,
    quarterly compliance jobs); a 7-day window will not
    surface those.
  example: |
    {
      "secret": {
        "kind": "secret",
        "lifecycle": {
          "is_scheduled_deletion": true,
          "deletion_wait_days": 30,
          "deletion_wait_minimum": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.lifecycle.is_scheduled_deletion
      op: eq
      value: true
    - field: properties.secret.lifecycle.deletion_wait_minimum
      op: eq
      value: true
defect: >
  Secret is scheduled for deletion with the minimum 7-day
  recovery window.
infection: >
  When a secret is scheduled for deletion the recovery
  window is the only buffer against accidentally deleting a
  credential a service still depends on. With a 7-day
  window, consumers that retrieve the credential less than
  weekly may never surface — by the time the monthly
  billing job tries to authenticate, the secret has been
  permanently deleted. Permanent deletion is irreversible.
  A 30-day window catches monthly and most quarterly jobs
  while the secret is still recoverable. The minimum window
  is acceptable only for secrets whose consumers are
  catalogued and active.
failure: >
  Insufficient recovery buffer. Secret deletion will
  complete before infrequent consumers have a chance to
  fail loudly.
tests:
  - name: 7-day recovery window fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/api-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          lifecycle:
            is_scheduled_deletion: true
            deletion_wait_days: 7
            deletion_wait_minimum: true
            deletion_date: "2026-05-04T00:00:00Z"
  - name: 30-day recovery window passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/api-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          lifecycle:
            is_scheduled_deletion: true
            deletion_wait_days: 30
            deletion_wait_minimum: false
            deletion_date: "2026-05-27T00:00:00Z"
