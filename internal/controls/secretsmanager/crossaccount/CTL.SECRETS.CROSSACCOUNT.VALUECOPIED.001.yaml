dsl_version: ctrl.v1
id: CTL.SECRETS.CROSSACCOUNT.VALUECOPIED.001
name: Secret Value Duplicated in Another Account
description: >
  The same credential value exists in secrets in multiple
  accounts — the credential was copied between accounts
  instead of using cross-account access via resource
  policy. When the credential rotates in the source
  account, the copy is stale; authentication may fail or
  destination accounts may continue using the old value.
  Stave detects duplication via observation metadata
  (matching credential fingerprints, tag patterns, or
  scanner-flagged duplicates) rather than reading the
  credential value itself.
domain: governance
severity: medium
compliance:
  owasp_nhi: "NHI9"
  soc2: "CC6.1, CC6.7"
  nist_800_53_r5: "IA-5, SC-12, CM-2"
  pci_dss_v4.0: "3.5, 8.2.4"
  fedramp_moderate: "IA-5"
  iso_27001_2022: "A.5.16, A.8.5"
  ccm_v4: ["IAM-04", "CEK-10"]
scope_tags:
  - aws
  - secretsmanager
taxonomy:
  - credential-lifecycle
  - identity-perimeter
  - trust-boundary
  - trust-decay
subtractive_category:
  - S05
  - S07
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_secretsmanager_secret]
params:
  attack_stage: credential_access
remediation:
  description: >
    Same credential value exists in multiple secrets across
    accounts. Rotation in one secret leaves the others
    stale.
  action: >
    Replace duplication with cross-account access. Pick
    one secret as authoritative, configure its resource
    policy to grant GetSecretValue to consuming-account
    principals (with aws:PrincipalOrgID — see
    CTL.SECRETS.POLICY.CROSSACCOUNT.001), point all
    consumers at the authoritative secret ARN, then delete
    the duplicate secrets. Audit the duplicates' rotation
    history before deletion to identify the rotation
    pipeline that needs to take over.
  example: |
    {
      "secret": {
        "kind": "secret",
        "policy": {
          "has_duplicate_value": false,
          "duplicate_secret_arns": []
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.policy.has_duplicate_value
      op: eq
      value: true
defect: >
  Secret credential value is duplicated in secrets across
  accounts.
infection: >
  Credential duplication means the same password or API
  key is stored in multiple independent secrets. When the
  credential rotates in the source secret (via Secrets
  Manager rotation), the copies don't update — they
  retain the old value. Applications in destination
  accounts authenticate with the old credential — which
  may or may not still work at the target service. If
  the target service invalidated the old credential
  during rotation, destination accounts break. If the
  old credential still works (single-user rotation
  doesn't invalidate old passwords immediately), the
  destination accounts use a stale credential that may
  be invalidated at any future rotation. Cross-account
  secret ACCESS (via resource policy) is the correct
  pattern — the credential exists once and is read from
  one source.
failure: >
  Credential desynchronization. Credential copies don't
  update when the source rotates — destination accounts
  use stale credentials.
tests:
  - name: duplicated credential value across accounts fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/db-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          policy:
            has_duplicate_value: true
            duplicate_secret_arns:
              - "arn:aws:secretsmanager:us-east-1:444455556666:secret:prod/db-XyZ"
              - "arn:aws:secretsmanager:us-east-1:777788889999:secret:prod/db-PqR"
            duplicate_accounts: ["444455556666", "777788889999"]
  - name: cross-account access via policy passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/db-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          policy:
            has_duplicate_value: false
            duplicate_secret_arns: []
            duplicate_accounts: []
  - name: stale duplicate (rotated 30 days ago, copy unchanged) fires (severe)
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/api-XyZ"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          policy:
            has_duplicate_value: true
            duplicate_secret_arns:
              - "arn:aws:secretsmanager:us-east-1:444455556666:secret:prod/api-stale"
            duplicate_accounts: ["444455556666"]
          rotation:
            rotation_enabled: true
            last_rotated_days: 30
