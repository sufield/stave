dsl_version: ctrl.v1
id: CTL.SECRETSMANAGER.INCOMPLETE.001
name: Complete Data Required for Secrets Manager Assessment
description: >
  The observation snapshot is missing required Secrets Manager
  properties. A safety assessment cannot be completed without
  secret configuration data.
domain: exposure
severity: info
compliance:
  ccm_v4: ["DCS-06"]
scope_tags:
  - aws
  - secretsmanager
taxonomy:
  - compliance-mapping
subtractive_category:
  - S08
applicable_asset_types:
  - aws_secretsmanager_secret
type: unsafe_state
classification: state_assertion
params: {}
remediation:
  description: >
    Observation is missing Secrets Manager properties.
  action: >
    Ensure the extractor calls aws secretsmanager describe-secret
    and maps the response to the secret observation properties.
  example: |
    {
      "secret": {
        "kind": "secret",
        "encryption": {
          "customer_managed_key": true
        },
        "access": {
          "rotation_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.encryption.customer_managed_key
      op: missing
      value: true
