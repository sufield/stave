dsl_version: ctrl.v1
id: CTL.SECRETSMANAGER.ENCRYPT.001
name: Secrets Must Be Encrypted with Customer-Managed KMS Key
description: >
  Secrets Manager secrets must be encrypted with a customer-managed
  KMS key. The default AWS-managed key does not support key revocation
  or cross-account key policies needed for breach response.
domain: exposure
severity: high
archetype: encryption-gap
compliance:
  hipaa: "164.312(a)(2)(iv)"
  soc2: "CC6.7"
  pci_dss_v4.0: "3.4.1"
  nist_800_53_r5: "SC-28"
  fedramp_moderate: "SC-28"
  gdpr: "Art.32"
  ccm_v4: ["CEK-03"]
scope_tags:
  - aws
  - secretsmanager
taxonomy:
  - compliance-mapping
  - encryption-at-rest
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_secretsmanager_secret]
params:
  attack_stage: exfiltration
remediation:
  description: >
    Secret is not encrypted with a customer-managed KMS key.
  action: >
    Recreate the secret with a customer-managed KMS key specified.
    Secrets Manager does not allow changing the encryption key after
    creation.
  example: |
    {
      "secret": {
        "kind": "secret",
        "encryption": {
          "customer_managed_key": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.encryption.customer_managed_key
      op: eq
      value: false
