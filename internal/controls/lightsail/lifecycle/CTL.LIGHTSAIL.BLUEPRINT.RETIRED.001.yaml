dsl_version: ctrl.v1
id: CTL.LIGHTSAIL.BLUEPRINT.RETIRED.001
name: Lightsail Instance Must Not Use Retired Blueprint
description: >
  Lightsail instances must not run retired OS or application
  blueprints. AWS retires blueprints when the underlying OS
  reaches end-of-life (Ubuntu 18.04, CentOS 7, Amazon Linux 1)
  or when the application version is no longer maintained.
  Instances on retired blueprints no longer receive security
  patches through the blueprint update channel. Unlike EC2,
  Lightsail instances are often managed by operators who do not
  run their own patch pipelines — the blueprint is their sole
  patch source.
domain: exposure
severity: low
compliance:
  nist_800_53_r5: "SI-2"
  soc2: "CC7.1"
scope_tags:
  - aws
  - lightsail
taxonomy:
  - compliance-mapping
  - deprecation
  - compute-hardening
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_lightsail_instance]
params:
  attack_stage: persistence
remediation:
  description: >
    Lightsail instance runs a retired blueprint. Security patches
    are no longer issued through the blueprint channel.
  action: >
    Create a new instance with a supported blueprint and migrate
    your application. Export data from the retired instance, launch
    a replacement with a current blueprint (e.g. ubuntu_22_04),
    and restore. Use aws lightsail create-instances with the
    updated --blueprint-id.
  example: |
    {
      "compute": {
        "kind": "lightsail_instance",
        "blueprint": {
          "is_retired": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: lightsail_instance
    - field: properties.compute.blueprint.is_retired
      op: eq
      value: true
