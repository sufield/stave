dsl_version: ctrl.v1
id: CTL.CLOUDFRONT.CACHE.LEGACY.001
name: CloudFront Distribution Uses Legacy Cache Settings Instead of Cache Policy
description: >
  CloudFront cache behavior is configured with the legacy
  ForwardedValues / MinTTL / MaxTTL / DefaultTTL block
  rather than referencing a cache policy via CachePolicyId.
  The legacy block was the original CloudFront caching
  configuration; AWS introduced cache policies (and the
  related origin-request and response-headers policies) in
  2020 to provide cleaner separation of concerns and reusable
  configurations. Behaviors that still use the legacy block
  carry forward the older limitations: cookie / header /
  query-string forwarding is bundled with cache-key
  computation, the configuration can't be reused across
  behaviors or distributions, and it's harder to express
  modern patterns like cookie / Authorization in the cache
  key. New behaviors should use cache policies; existing
  legacy behaviors should be migrated when convenient.
domain: governance
severity: medium
compliance:
  nist_800_53_r5: "CM-2, SC-7"
  fedramp_moderate: "CM-2, SC-7"
  soc2: "CC6.1, CC8.1"
  iso_27001_2022: "A.5.10, A.8.9"
  ccm_v4: ["GRC-04"]
scope_tags:
  - aws
  - cloudfront
taxonomy:
  - compliance-mapping
  - deprecation
subtractive_category:
  - S03
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_cloudfront_distribution]
params:
  attack_stage: detection_evasion
remediation:
  description: >
    Cache behavior uses legacy ForwardedValues block instead
    of a cache policy.
  action: >
    Migrate the behavior to use a cache policy: aws
    cloudfront create-cache-policy with the equivalent
    parameters as the legacy block, then update-distribution
    to set CachePolicyId on the behavior. AWS provides
    several managed cache policies (CachingOptimized,
    CachingDisabled, CachingOptimizedForUncompressedObjects)
    that cover most use cases. Custom cache policies allow
    operators to express cookie / Authorization / header
    inclusion in the cache key cleanly. After migration,
    the legacy ForwardedValues block can be removed.
  example: |
    {
      "cdn": {
        "kind": "distribution",
        "cloudfront": {
          "uses_legacy_cache_settings": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.cdn.kind
      op: eq
      value: distribution
    - field: properties.cdn.cloudfront.uses_legacy_cache_settings
      op: eq
      value: true
defect: >
  CloudFront cache behavior uses the legacy ForwardedValues
  block instead of a cache policy.
infection: >
  CloudFront's original caching configuration bundled cache-
  key computation, cookie / header / query-string forwarding,
  and TTL settings into a single ForwardedValues block on
  each cache behavior. AWS introduced cache policies (and
  origin-request and response-headers policies) in 2020 to
  separate concerns: cache policies define what's in the
  cache key and TTLs, origin-request policies define what's
  forwarded to the origin, response-headers policies define
  what's added to responses. The split lets operators
  express modern patterns cleanly: cookie / Authorization
  in the cache key without coupling that to origin-
  forwarding decisions. Behaviors still using the legacy
  block carry forward the older limitations and are harder
  to audit. The legacy block also has subtle behaviors
  around when CloudFront ignores headers / query strings
  for caching purposes that catch operators by surprise.
  Migrating to cache policies improves clarity and
  consistency, particularly for behaviors that need to
  cache authenticated content (where header inclusion in
  the cache key is critical).
failure: >
  Configuration drift exposure. Legacy block bundles
  concerns; modern caching patterns are harder to express
  cleanly; operator errors on cache key composition are
  more likely.
tests:
  - name: legacy cache settings fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cloudfront::111122223333:distribution/E1ABCDEFG"
      asset_type: aws_cloudfront_distribution
      vendor: aws
      properties:
        cdn:
          kind: distribution
          cloudfront:
            uses_legacy_cache_settings: true
  - name: cache policy passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:cloudfront::111122223333:distribution/E1ABCDEFG"
      asset_type: aws_cloudfront_distribution
      vendor: aws
      properties:
        cdn:
          kind: distribution
          cloudfront:
            uses_legacy_cache_settings: false
