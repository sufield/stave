dsl_version: ctrl.v1
id: CTL.AZURE.VM.EXTENSION.001
name: VM Must Not Have Unauthorized Extensions
description: >
  VMs must not have extensions beyond the approved baseline. Extensions execute with system privileges and survive restarts.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "CM-7"
  soc2: "CC6.1"
  ccm_v4: ["IVS-03"]
scope_tags: [azure]
taxonomy:
  - compliance-mapping
subtractive_category:
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types: [azure_resource]
params:
  attack_stage: initial_access
remediation:
  description: VM Must Not Have Unauthorized Extensions — finding detected.
  action: Remediate per control description.
  example: |
    {"azure": {"compute": {"kind": "virtual_machine", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.azure.compute.kind
      op: eq
      value: virtual_machine
    - field: properties.azure.compute.vm.has_unauthorized_extensions
      op: eq
      value: true
