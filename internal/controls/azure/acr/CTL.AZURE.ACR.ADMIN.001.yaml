dsl_version: ctrl.v1
id: CTL.AZURE.ACR.ADMIN.001
name: Container Registry Admin User Enabled
description: >
  Admin user provides a single shared credential with full push/pull
  access to all repositories. Not scoped, not auditable per-user,
  not integrated with RBAC.
domain: identity
severity: high
compliance:
  cis_azure_v2: "9.15"
  nist_800_53_r5: "AC-6"
  soc2: "CC6.1"
scope_tags: [azure]
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - least-privilege
type: unsafe_state
classification: state_assertion
applicable_asset_types: [azure_resource]
params:
  attack_stage: initial_access
remediation:
  description: Container Registry Admin User Enabled — finding detected.
  action: Disable admin user and use RBAC with Entra ID.
  example: |
    {"azure": {"compute": {"kind": "container_registry", "acr": {"admin_user_enabled": false}}}}
unsafe_predicate:
  all:
    - field: properties.azure.compute.kind
      op: eq
      value: container_registry
    - field: properties.azure.compute.acr.admin_user_enabled
      op: eq
      value: true
