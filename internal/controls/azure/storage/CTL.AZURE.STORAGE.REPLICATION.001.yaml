dsl_version: ctrl.v1
id: CTL.AZURE.STORAGE.REPLICATION.001
name: Cross-Tenant Replication Not Disabled
description: >
  Cross-tenant replication allows data to be replicated to storage
  accounts in other Azure tenants. Data replicated outside the
  organization is beyond organizational control.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "AC-4"
  soc2: "CC6.6"
scope_tags: [azure]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types: [azure_resource]
params:
  attack_stage: exfiltration
remediation:
  description: Cross-Tenant Replication Not Disabled — finding detected.
  action: Disable cross-tenant replication on the storage account.
  example: |
    {"azure": {"storage": {"kind": "storage_account", "cross_tenant_replication_enabled": false}}}
unsafe_predicate:
  all:
    - field: properties.azure.storage.kind
      op: eq
      value: storage_account
    - field: properties.azure.storage.cross_tenant_replication_enabled
      op: eq
      value: true
