dsl_version: ctrl.v1
id: CTL.AZURE.STORAGE.LOG.001
name: Azure Storage Must Have Diagnostic Logging Enabled
description: >
  Azure Storage accounts must have diagnostic logging enabled for
  read, write, and delete operations. Without logging, data access
  patterns are invisible.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "AU-2"
  soc2: "CC7.1"
  ccm_v4: ["LOG-03"]
scope_tags:
  - azure
taxonomy:
  - compliance-mapping
  - logging
type: unsafe_state
classification: state_assertion
applicable_asset_types: [azure_resource]
params:
  attack_stage: detection_evasion
remediation:
  description: Azure Storage diagnostic logging is disabled.
  action: Enable diagnostic logging for read, write, and delete operations.
  example: |
    {"azure": {"storage": {"kind": "azure_blob_storage", "logging": {"enabled": true}}}}
unsafe_predicate:
  all:
    - field: properties.azure.storage.kind
      op: eq
      value: azure_blob_storage
    - field: properties.azure.storage.logging.enabled
      op: eq
      value: false
