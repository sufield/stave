dsl_version: ctrl.v1
id: CTL.AZURE.ENTRA.PASSWORDBAN.001
name: Entra ID Custom Banned Password List Not Configured
description: >
  No custom banned password list. Users can set passwords containing
  company name, product names, or common organizational terms.
domain: identity
severity: medium
compliance:
  cis_azure_v2: "1.7"
  nist_800_53_r5: "IA-5"
  soc2: "CC6.1"
scope_tags: [azure]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types: [azure_resource]
params:
  attack_stage: initial_access
remediation:
  description: Entra ID Custom Banned Password List Not Configured — finding detected.
  action: Configure a custom banned password list in Entra ID.
  example: |
    {"azure": {"identity": {"kind": "password_policy", "banned_password_list_configured": true}}}
unsafe_predicate:
  all:
    - field: properties.azure.identity.kind
      op: eq
      value: password_policy
    - field: properties.azure.identity.banned_password_list_configured
      op: ne
      value: true
