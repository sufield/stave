dsl_version: ctrl.v1
id: CTL.AZURE.IDENTITY.SP.SECRET.001
name: Service Principals Must Use Certificate Credentials
description: >
  Service principals must use certificate-based credentials instead
  of client secrets. Client secrets are long-lived strings that can
  be leaked in logs, config files, or source code.
domain: identity
severity: high
compliance:
  nist_800_53_r5: "IA-5"
  soc2: "CC6.1"
  ccm_v4: ["IAM-16"]
scope_tags: [azure]
taxonomy:
  - compliance-mapping
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
applicable_asset_types: [azure_resource]
params:
  attack_stage: credential_access
remediation:
  description: Service principal uses client secret instead of certificate.
  action: Replace client secret with certificate credential from Key Vault.
  example: |
    {"azure": {"identity": {"kind": "service_principal", "uses_secret_credential": false}}}
unsafe_predicate:
  all:
    - field: properties.azure.identity.kind
      op: eq
      value: service_principal
    - field: properties.azure.identity.uses_secret_credential
      op: present
    - field: properties.azure.identity.uses_secret_credential
      op: eq
      value: true
