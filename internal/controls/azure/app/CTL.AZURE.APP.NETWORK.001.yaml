dsl_version: ctrl.v1
id: CTL.AZURE.APP.NETWORK.001
name: App Service Public Network Access Without Restrictions
description: >
  Public network access enabled with no IP restrictions or VNet
  integration. The application accepts connections from any IP.
domain: exposure
severity: high
compliance:
  cis_azure_v2: "9.7"
  nist_800_53_r5: "AC-4"
  soc2: "CC6.6"
scope_tags: [azure]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types: [azure_resource]
params:
  attack_stage: initial_access
remediation:
  description: App Service Public Network Access Without Restrictions — finding detected.
  action: Configure IP restrictions, VNet integration, or private endpoints.
  example: |
    {"azure": {"compute": {"kind": "app_service", "app": {"ip_restrictions_configured": true}}}}
unsafe_predicate:
  all:
    - field: properties.azure.compute.kind
      op: eq
      value: app_service
    - field: properties.azure.compute.app.public_network_access
      op: eq
      value: true
    - field: properties.azure.compute.app.ip_restrictions_configured
      op: eq
      value: false
