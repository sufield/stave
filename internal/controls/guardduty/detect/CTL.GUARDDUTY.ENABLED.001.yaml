dsl_version: ctrl.v1
id: CTL.GUARDDUTY.ENABLED.001
name: Amazon GuardDuty Must Be Enabled
description: >
  GuardDuty must be enabled to provide continuous threat detection. It analyzes CloudTrail, VPC Flow Logs, and DNS logs to detect reconnaissance, instance compromise, and account compromise.
domain: exposure
severity: high
compliance:
  soc2: "CC7.1"
  pci_dss_v4.0: "5.2"
  nist_800_53_r5: "SI-3"
  fedramp_moderate: "SI-3"
  gdpr: "Art.32"
  ffiec: "CAT-D3"
  iso_27001_2022: "A.8.16"
  nist_csf_2.0: "DE.CM"
  ccm_v4: ["LOG-03"]
scope_tags:
  - aws
  - guardduty
taxonomy:
  - compliance-mapping
  - logging
  - monitoring
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_guardduty_detector]
params:
  attack_stage: detection_evasion
  blast_radius:
    type: detection
    scope: account
    multiplier: 2.5
remediation:
  description: >
    GuardDuty is not enabled. Threats are not being detected.
  action: >
    Enable GuardDuty: aws guardduty create-detector --enable
  example: |
    {
      {
      "threat_detection": {
        "kind": "detector",
        "enabled": true
      }
    }
    }
unsafe_predicate:
  all:
    - field: properties.threat_detection.enabled
      op: eq
      value: false
