dsl_version: ctrl.v1
id: CTL.GUARDDUTY.INCOMPLETE.001
name: Complete Data Required for GuardDuty Assessment
description: >
  The observation snapshot is missing required GuardDuty properties.
domain: exposure
severity: info
compliance:
  ccm_v4: ["DCS-06", "LOG-03"]
scope_tags:
  - aws
  - guardduty
taxonomy:
  - compliance-mapping
  - monitoring
applicable_asset_types:
  - aws_guardduty_detector
type: unsafe_state
classification: absence_check
params: {}
remediation:
  description: >
    Observation is missing GuardDuty properties.
  action: >
    Ensure the extractor calls aws guardduty list-detectors and get-detector.
  example: |
    {
      "threat_detection": {
        "kind": "detector",
        "enabled": true
      }
    }
unsafe_predicate:
  all:
    - field: properties.threat_detection.enabled
      op: missing
      value: true
