dsl_version: ctrl.v1
id: CTL.ACM.KEY.ALGORITHM.001
name: ACM Certificates Must Use Strong Key Algorithms
description: >
  ACM certificates must use RSA-2048+ or ECDSA P-256+ key
  algorithms. Weak algorithms (RSA-1024, ECDSA P-192) are
  vulnerable to factoring or discrete logarithm attacks.
domain: encryption
severity: high
compliance:
  nist_800_53_r5: "SC-13"
  soc2: "CC6.7"
  ccm_v4: ["CEK-03", "CEK-04"]
scope_tags: [aws, acm]
taxonomy:
  - compliance-mapping
  - key-management
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_acm_certificate]
params:
  attack_stage: exfiltration
remediation:
  description: ACM certificate uses a weak key algorithm.
  action: Request a new certificate with RSA-2048 or ECDSA P-256.
  example: |
    {"governance": {"kind": "acm_certificate", "certificate": {"key_algorithm_strong": true}}}
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: acm_certificate
    - field: properties.governance.certificate.key_algorithm_strong
      op: eq
      value: false
