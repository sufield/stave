dsl_version: ctrl.v1
id: CTL.BEDROCK.AGENT.STALE.001
name: Bedrock Agent Must Not Be Idle Beyond Threshold
description: >
  Bedrock agent has not been invoked within the observation
  window (default 30 days). A stale agent retains its execution
  role permissions, its action-group registrations (the
  Lambdas it can call), and its knowledge-base associations
  — a dormant attack surface with active credentials. Same
  shape as CTL.SAGEMAKER.NOTEBOOK.IDLE.001 (idle data-science
  notebook) and CTL.LIFECYCLE.STAGING.STALE.001 (general
  stale-resource pattern) applied to Bedrock agents. Distinct
  from CTL.BEDROCK.AGENT.SESSION.TTL.001 (idle-session TTL
  too long): SESSION.TTL is per-session timeout configuration;
  this control flags agents whose entire identity is idle.
domain: governance
severity: low
compliance:
  owasp_nhi: "NHI1"
  nist_800_53_r5: "AC-2(3)"
  soc2: "CC6.1"
  ccm_v4: ["IAM-13"]
scope_tags:
  - aws
  - bedrock
taxonomy:
  - credential-lifecycle
  - resource-sprawl
  - trust-decay
subtractive_category:
  - S07
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_bedrock_agent
params:
  attack_stage: persistence
remediation:
  description: >
    Bedrock agent has been idle past the staleness threshold.
    Decide whether to delete or archive.
  action: >
    Either delete the agent + its execution role if the
    workload is truly abandoned, or document the agent's
    expected idle duration with a reviewed_at tag and a
    scheduled review date. Reduce blast radius by detaching
    high-privilege managed policies from the role even while
    the agent stays.
    ⚠️ DEPRECATION: Amazon Bedrock Agents (Classic) entered maintenance
    mode July 30, 2026. New deployments should use Amazon Bedrock
    AgentCore. Existing Classic agents remain functional but will not
    receive new features.
  example: |
    {
      "ai": {
        "kind": "bedrock_agent",
        "agent": { "is_idle": false }
      }
    }
unsafe_predicate:
  all:
    - field: properties.ai.kind
      op: eq
      value: bedrock_agent
    - field: properties.ai.agent.is_idle
      op: eq
      value: true
