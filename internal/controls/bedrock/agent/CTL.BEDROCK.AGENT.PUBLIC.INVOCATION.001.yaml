dsl_version: ctrl.v1
id: CTL.BEDROCK.AGENT.PUBLIC.INVOCATION.001
name: Bedrock Agent Invocation Endpoint Must Not Be Publicly Accessible
description: >
  Bedrock agent's invocation surface is reachable without
  authenticated AWS principals — for example, an API Gateway
  fronting InvokeAgent with no authorizer, a public Lambda URL
  proxying agent invocation, or a CloudFront distribution that
  forwards directly to the agent without auth. The agent's
  blast radius is whatever the agent's execution role can
  reach (knowledge-base contents, Lambda action groups,
  invoked models). Letting unauthenticated callers reach
  InvokeAgent turns the agent's internal data and tool surface
  into an internet-accessible API. The collector pre-computes
  the boolean from the agent's downstream invocation paths
  (API Gateway authorizers, Lambda URL auth_type, public
  CloudFront distributions pointing at the agent endpoint).
domain: exposure
severity: high
compliance:
  owasp_nhi: "NHI6"
  nist_800_53_r5: "AC-3, SC-7"
  soc2: "CC6.6"
  hipaa: "164.312(a)(1)"
  ccm_v4: ["IAM-04", "IVS-03"]
scope_tags:
  - aws
  - bedrock
taxonomy:
  - compliance-mapping
  - network-perimeter
subtractive_category:
  - S03
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_bedrock_agent
params:
  attack_stage: initial_access
remediation:
  description: >
    Bedrock agent has a publicly-reachable invocation path. The
    agent's data and tool surface are exposed to unauthenticated
    callers.
  action: >
    Front the agent invocation with an authenticated path:
    either an API Gateway authorizer (Cognito user pool, custom
    Lambda authorizer, or IAM auth), a Lambda URL with
    auth_type=AWS_IAM, or a private VPC integration. Remove
    any public Lambda URL or unrestricted API Gateway resource
    that proxies InvokeAgent.
    ⚠️ DEPRECATION: Amazon Bedrock Agents (Classic) entered maintenance
    mode July 30, 2026. New deployments should use Amazon Bedrock
    AgentCore. Existing Classic agents remain functional but will not
    receive new features.
  example: |
    {
      "ai": {
        "kind": "bedrock_agent",
        "agent": { "public_invocation_endpoint": false }
      }
    }
unsafe_predicate:
  all:
    - field: properties.ai.kind
      op: eq
      value: bedrock_agent
    - field: properties.ai.agent.public_invocation_endpoint
      op: eq
      value: true
