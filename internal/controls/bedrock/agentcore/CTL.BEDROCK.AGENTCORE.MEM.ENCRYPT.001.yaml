dsl_version: ctrl.v1
id: CTL.BEDROCK.AGENTCORE.MEM.ENCRYPT.001
name: AgentCore Memory Must Use Customer-Managed KMS Key
description: >
  AgentCore memory does not have a customer-managed KMS key
  (encryptionKeyArn is absent). Agent memory stores conversation
  history, tool-call results, extracted facts, and strategy
  outputs — potentially including PII, credentials, and business
  logic. Without CMK encryption, this data is encrypted with the
  AWS-managed default key, which the customer cannot independently
  rotate or revoke. CMK provides cryptographic kill-switch
  capability: revoking the key immediately makes all stored
  memory inaccessible.
domain: encryption
severity: medium
compliance:
  nist_800_53_r5: "SC-12, SC-28"
  soc2: "CC6.1"
  hipaa: "164.312(a)(2)(iv)"
  ccm_v4: ["CEK-03", "DSP-01"]
scope_tags:
  - aws
  - bedrock
taxonomy:
  - compliance-mapping
  - encryption-at-rest
  - key-management
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_bedrock_agentcore_memory
params:
  attack_stage: collection
remediation:
  description: >
    AgentCore memory uses the AWS-managed default key — the
    customer cannot independently rotate or revoke it.
  action: >
    Create a KMS key for AgentCore memory encryption and set
    encryptionKeyArn on the memory resource. The key policy
    should restrict access to the memory execution role and
    security operators.
  example: |
    {
      "ai": {
        "kind": "bedrock_agentcore_memory",
        "memory": { "cmk_configured": true }
      }
    }
unsafe_predicate:
  all:
    - field: properties.ai.kind
      op: eq
      value: bedrock_agentcore_memory
    - field: properties.ai.memory.cmk_configured
      op: eq
      value: false
observation_fields:
  - ai.kind
  - ai.memory.cmk_configured
tests:
  - name: "memory without CMK — fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:bedrock:us-east-1:111122223333:agentcore-memory/mem-NOKEY"
      asset_type: aws_bedrock_agentcore_memory
      vendor: aws
      properties:
        ai:
          kind: bedrock_agentcore_memory
          memory:
            cmk_configured: false
  - name: "memory with CMK — passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:bedrock:us-east-1:111122223333:agentcore-memory/mem-CMK"
      asset_type: aws_bedrock_agentcore_memory
      vendor: aws
      properties:
        ai:
          kind: bedrock_agentcore_memory
          memory:
            cmk_configured: true
