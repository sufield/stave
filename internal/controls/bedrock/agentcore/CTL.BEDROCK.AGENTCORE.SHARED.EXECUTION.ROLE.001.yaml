dsl_version: ctrl.v1
id: CTL.BEDROCK.AGENTCORE.SHARED.EXECUTION.ROLE.001
name: AgentCore Runtimes Must Not Share Execution Roles
description: >
  Multiple Bedrock AgentCore runtimes share the same IAM execution
  role. Compromising any one runtime — via prompt injection, tool
  abuse, or code interpreter escape — grants the attacker the
  shared role's credentials. Those credentials reach every other
  runtime's resources: ECR images, memory stores, code
  interpreters, and S3 log buckets. Each runtime should have a
  dedicated execution role scoped to its own resource set. The
  collector pre-computes whether the runtime's execution role ARN
  is referenced by another runtime in the same account.
domain: identity
severity: high
compliance:
  owasp_nhi: "NHI5"
  nist_800_53_r5: "AC-6(3)"
  soc2: "CC6.3"
  hipaa: "164.312(a)(1)"
  ccm_v4: ["IAM-05", "IAM-09"]
scope_tags:
  - aws
  - bedrock
taxonomy:
  - compliance-mapping
  - least-privilege
  - ai-guardrails
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_bedrock_agentcore_runtime
params:
  attack_stage: lateral_movement
observation_fields:
  - ai.kind
  - ai.runtime.execution_role_shared
  - ai.runtime.execution_role_arn
remediation:
  description: >
    Multiple AgentCore runtimes share the same execution role.
    Compromising one runtime grants lateral access to every other
    runtime's resources.
  action: >
    Create a dedicated IAM execution role per AgentCore runtime.
    Scope each role to the specific resources that runtime's tools
    require — its own ECR repository, memory store, code
    interpreter sandbox, and S3 log prefix. Use resource-based
    conditions (aws:ResourceTag, StringEquals on ARN prefix) to
    enforce isolation.
  example: |
    {
      "ai": {
        "kind": "bedrock_agentcore_runtime",
        "runtime": {
          "execution_role_shared": false,
          "execution_role_arn": "arn:aws:iam::111122223333:role/agent-A-only"
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.ai.kind
      op: eq
      value: bedrock_agentcore_runtime
    - field: properties.ai.runtime.execution_role_shared
      op: eq
      value: true
tests:
  - name: "shared execution role — fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:bedrock:us-east-1:111122223333:agent-runtime/rt-SHARED-A"
      asset_type: aws_bedrock_agentcore_runtime
      vendor: aws
      properties:
        ai:
          kind: bedrock_agentcore_runtime
          runtime:
            execution_role_shared: true
            execution_role_arn: "arn:aws:iam::111122223333:role/shared-agentcore-role"
  - name: "dedicated execution role — passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:bedrock:us-east-1:111122223333:agent-runtime/rt-DEDICATED"
      asset_type: aws_bedrock_agentcore_runtime
      vendor: aws
      properties:
        ai:
          kind: bedrock_agentcore_runtime
          runtime:
            execution_role_shared: false
            execution_role_arn: "arn:aws:iam::111122223333:role/agent-A-only"
