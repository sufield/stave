dsl_version: ctrl.v1
id: CTL.BEDROCK.AGENTCORE.PAYMENT.NOLIMIT.001
name: AgentCore Payment Session Must Have Spending Limits
description: >
  AgentCore payment manager must configure session spending limits.
  Without a spending cap, a prompt injection or agent misinterpretation
  in a single session can drain funds at machine speed. The AgentCore
  Payments blog explicitly notes agents "can misinterpret a response as
  authorization to spend or repeat a payment because of an unexpected
  retry." The spending limit is the deterministic check at the
  infrastructure layer that prevents this.
  Schema gap: this control is inert until a collector populates the
  properties.ai.payment.payment_session_has_limits field. See
  docs-internal/schema-gaps/agentcore-policy.md.
domain: governance
severity: critical
compliance:
  nist_800_53_r5: "AC-6(1)"
  soc2: "CC6.1"
  ccm_v4: ["IAM-04", "GRC-01"]
scope_tags:
  - aws
  - bedrock
taxonomy:
  - compliance-mapping
  - ai-guardrails
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_bedrock_agentcore_runtime
params:
  attack_stage: execution
observation_fields:
  - ai.kind
  - ai.payment.payment_session_has_limits
remediation:
  description: >
    AgentCore payment manager has no session spending limits.
    Autonomous agent transactions are uncapped.
  action: >
    Configure a maximum spend amount per payment session via the
    AgentCore Payment Manager configuration. Set the cap to the
    lowest value that supports the agent's intended transaction
    pattern. For x402 microtransaction agents, typical caps are
    single-digit dollars per session.
  example: |
    {
      "ai": {
        "kind": "bedrock_agentcore_runtime",
        "payment": { "payment_session_has_limits": true }
      }
    }
unsafe_predicate:
  all:
    - field: properties.ai.kind
      op: eq
      value: bedrock_agentcore_runtime
    - field: properties.ai.payment.payment_session_has_limits
      op: eq
      value: false
defect: >
  AgentCore payment manager has no session spending limits configured.
infection: >
  Autonomous agent can transact without any spending cap. Prompt
  injection or retry bugs can trigger unlimited spending in a
  single session at machine speed.
failure: >
  Uncapped autonomous spending. Financial loss from prompt injection,
  misinterpretation, or unexpected retry behavior.
tests:
  - name: "payment session without limits — fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:bedrock:us-east-1:111122223333:agent-runtime/rt-NOLIMIT"
      asset_type: aws_bedrock_agentcore_runtime
      vendor: aws
      properties:
        ai:
          kind: bedrock_agentcore_runtime
          payment:
            payment_session_has_limits: false
  - name: "payment session with limits — passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:bedrock:us-east-1:111122223333:agent-runtime/rt-LIMITED"
      asset_type: aws_bedrock_agentcore_runtime
      vendor: aws
      properties:
        ai:
          kind: bedrock_agentcore_runtime
          payment:
            payment_session_has_limits: true
