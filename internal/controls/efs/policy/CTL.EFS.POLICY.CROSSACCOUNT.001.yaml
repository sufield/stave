dsl_version: ctrl.v1
id: CTL.EFS.POLICY.CROSSACCOUNT.001
name: EFS File System Policy Grants Cross-Account Access Without Organizational Boundary
description: >
  EFS file system policy grants actions to principals in external
  AWS accounts without an aws:PrincipalOrgID condition. Cross-account
  EFS access enables mounting the file system from EC2 instances or
  containers in the external account. If the external account is
  compromised, the attacker can read, modify, or delete all files
  on the shared file system.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["DSP-17", "IAM-16"]
scope_tags:
  - aws
  - efs
taxonomy:
  - identity-perimeter
  - trust-boundary
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_efs_file_system
params:
  attack_stage: initial_access
observation_fields:
  - filesystem.kind
  - filesystem.file_system_policy.cross_account
  - filesystem.file_system_policy.has_org_condition
remediation:
  description: >
    EFS file system policy grants cross-account access without an
    aws:PrincipalOrgID condition.
  action: >
    Add an aws:PrincipalOrgID condition to restrict cross-account
    access to principals within the organization. Also consider
    using VPC peering or Transit Gateway conditions to restrict
    network-level access.
  example: |
    {
      "filesystem": {
        "kind": "efs",
        "file_system_policy": {
          "cross_account": true,
          "has_org_condition": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.filesystem.kind
      op: eq
      value: efs
    - field: properties.filesystem.file_system_policy.cross_account
      op: eq
      value: true
    - field: properties.filesystem.file_system_policy.has_org_condition
      op: eq
      value: false
tests:
  - name: "cross-account without org condition fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:elasticfilesystem:us-east-1:111122223333:file-system/fs-abc123"
      asset_type: aws_efs_file_system
      vendor: aws
      properties:
        filesystem:
          kind: efs
          file_system_policy:
            cross_account: true
            has_org_condition: false
  - name: "cross-account with org condition passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:elasticfilesystem:us-east-1:111122223333:file-system/fs-abc123"
      asset_type: aws_efs_file_system
      vendor: aws
      properties:
        filesystem:
          kind: efs
          file_system_policy:
            cross_account: true
            has_org_condition: true
  - name: "no cross-account access passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:elasticfilesystem:us-east-1:111122223333:file-system/fs-internal"
      asset_type: aws_efs_file_system
      vendor: aws
      properties:
        filesystem:
          kind: efs
          file_system_policy:
            cross_account: false
