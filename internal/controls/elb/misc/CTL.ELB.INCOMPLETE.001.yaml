dsl_version: ctrl.v1
id: CTL.ELB.INCOMPLETE.001
name: Complete Data Required for ELB Assessment
description: >
  Load balancer safety cannot be assessed when TLS configuration is
  missing from the snapshot. The extractor must populate
  loadbalancer.encryption.tls_1_2_or_higher.
compliance:
  ccm_v4: ["DCS-06"]
domain: exposure
severity: low
scope_tags:
  - aws
  - elb
taxonomy:
  - compliance-mapping
subtractive_category:
  - S08
  - S10
applicable_asset_types:
  - aws_elb_load_balancer
  - aws_elbv2_load_balancer
type: unsafe_state
classification: absence_check
params: {}
remediation:
  description: >
    ELB assessment data is incomplete. The extractor did not populate
    required loadbalancer properties.
  action: >
    Re-run the extractor with ELB permissions:
    elasticloadbalancing:DescribeLoadBalancers,
    elasticloadbalancing:DescribeLoadBalancerAttributes,
    elasticloadbalancing:DescribeListeners.
unsafe_predicate:
  all:
    - field: properties.loadbalancer.encryption.tls_1_2_or_higher
      op: missing
      value: true
