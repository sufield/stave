dsl_version: ctrl.v1
id: CTL.ELB.DELETION.PROTECT.001
name: Load Balancer Must Have Deletion Protection Enabled
description: Production load balancers must have deletion protection enabled.
domain: resilience
severity: medium
compliance:
  nist_800_53_r5: CP-10
  soc2: CC6.1
  ccm_v4:
  - BCR-08
scope_tags:
- aws
- elb
taxonomy:
  - compliance-mapping
subtractive_category:
  - S03
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_elb]
params:
  attack_stage: impact
remediation:
  description: LB lacks deletion protection.
  action: Enable deletion protection.
unsafe_predicate:
  all:
  - field: properties.loadbalancer.deletion_protection
    op: eq
    value: false
