dsl_version: ctrl.v1
id: CTL.ELB.AUTH.OIDC.SECRET.PLAINTEXT.001
name: ELB OIDC Auth Action Stores Client Secret in Plaintext
description: >
  ALB authenticate-oidc action's ClientSecret
  is a literal string rather than a reference
  to AWS Secrets Manager. The OIDC client
  secret sits in the listener rule
  configuration in plaintext, visible to
  anyone with elbv2:DescribeRules.
domain: identity
severity: high
compliance:
  cis_aws_v3.0: "1.16"
  soc2: "CC6.1, CC6.7"
  nist_800_53_r5: "IA-5, SC-13"
  pci_dss_v4.0: "3.5, 8.6"
  fedramp_moderate: "IA-5, SC-13"
  hipaa: "164.312(a)(2)(iv)"
  iso_27001_2022: "A.5.17, A.8.24"
  ccm_v4: ["IAM-09", "CEK-09"]
scope_tags:
  - aws
  - elb
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - logging
subtractive_category:
  - S03
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_elb]
params:
  attack_stage: credential_access
  blast_radius:
    type: data
    scope: account
    multiplier: 3.0
remediation:
  description: >
    OIDC client secret stored as plaintext in
    listener rule.
  action: >
    Migrate the client secret to AWS Secrets
    Manager and reference it from the listener
    rule: store the secret with aws
    secretsmanager create-secret, then update
    the rule's authenticate-oidc action to
    reference the secret ARN. Anyone with
    elbv2:DescribeRules then sees the ARN
    rather than the literal secret. Rotate
    the secret afterwards since the previous
    plaintext value may be in CloudTrail
    history.
  example: |
    {
      "compute": {
        "kind": "elb",
        "elb": {
          "oidc_client_secret_is_arn": true,
          "oidc_secret_plaintext": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: elb
    - field: properties.compute.elb.oidc_secret_plaintext
      op: eq
      value: true
defect: >
  OIDC client secret stored as plaintext in
  ALB listener rule.
infection: >
  ALB listener rules with authenticate-oidc
  actions accept the OIDC client secret
  inline. When operators paste the secret
  directly rather than referencing Secrets
  Manager, the secret becomes visible
  through DescribeRules — every read-only
  IAM user with elbv2:Describe access can
  retrieve it. CloudTrail also records the
  ModifyRule call payload, so the secret may
  appear in audit logs. Migrating to a
  Secrets Manager reference moves the
  storage to a tightly-policy-controlled
  surface and lets the secret be rotated
  without touching ELB configuration.
failure: >
  OIDC client secret in listener rule
  metadata. Read-only IAM principals can
  retrieve the secret via DescribeRules.
tests:
  - name: plaintext OIDC secret fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:elasticloadbalancing:us-east-1:111122223333:loadbalancer/app/abc/123"
      asset_type: aws_elb
      vendor: aws
      properties:
        compute:
          kind: elb
          elb:
            oidc_client_secret_is_arn: false
            oidc_secret_plaintext: true
  - name: secrets-manager reference passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:elasticloadbalancing:us-east-1:111122223333:loadbalancer/app/abc/123"
      asset_type: aws_elb
      vendor: aws
      properties:
        compute:
          kind: elb
          elb:
            oidc_client_secret_is_arn: true
            oidc_secret_plaintext: false
