dsl_version: ctrl.v1
id: CTL.ELB.TG.BACKEND.PLAINTEXT.001
name: ELB Target Group Uses HTTP to Backend Despite Backend Supporting HTTPS
description: >
  Target group's Protocol is HTTP even though
  the backend supports HTTPS (port 443
  reachable). The ALB terminates TLS at the
  listener and re-encodes the request as
  plaintext over the network to the target.
  Defense-in-depth requires TLS end-to-end
  for sensitive workloads.
domain: exposure
severity: medium
compliance:
  cis_aws_v3.0: "1.16"
  soc2: "CC6.1, CC6.7"
  nist_800_53_r5: "SC-8, SC-23"
  pci_dss_v4.0: "4.2"
  fedramp_moderate: "SC-8, SC-23"
  hipaa: "164.312(e)(1)"
  iso_27001_2022: "A.8.20, A.8.24"
  ccm_v4: ["IVS-09"]
scope_tags:
  - aws
  - elb
taxonomy:
  - compliance-mapping
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_elb]
params:
  attack_stage: credential_access
  blast_radius:
    type: data
    scope: account
    multiplier: 2.0
remediation:
  description: >
    Target group uses plaintext HTTP to backend
    despite backend supporting HTTPS.
  action: >
    Update the target group protocol to HTTPS
    and the port to the backend's TLS port:
    aws elbv2 modify-target-group with
    Protocol=HTTPS,Port=443. Verify backend
    targets present a valid certificate (or
    accept self-signed if internal). The ALB
    will then re-encrypt to the backend
    rather than send plaintext over the VPC
    network.
  example: |
    {
      "compute": {
        "kind": "elb_target_group",
        "elb": {
          "tg_protocol": "HTTPS",
          "backend_supports_https": true,
          "tg_backend_plaintext": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: elb_target_group
    - field: properties.compute.elb.tg_backend_plaintext
      op: eq
      value: true
defect: >
  Target group sends plaintext HTTP to a
  backend that supports HTTPS.
infection: >
  ALB-to-target traffic transits over the VPC
  network. AWS attests that traffic between
  ALB and target stays inside the VPC, but
  defense-in-depth treats the VPC as
  untrusted (zero-trust posture). For
  HIPAA-regulated workloads, encryption end-
  to-end including the ALB-to-target hop is
  the typical compliance baseline. The
  control fires when the target group
  protocol is HTTP and the backend
  demonstrably supports HTTPS — the
  asymmetry indicates configuration drift
  rather than an architectural choice.
failure: >
  Plaintext over VPC network. ALB-to-target
  hop unencrypted despite backend supporting
  HTTPS.
tests:
  - name: HTTP target group with HTTPS backend fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:elasticloadbalancing:us-east-1:111122223333:targetgroup/abc/123"
      asset_type: aws_elb_target_group
      vendor: aws
      properties:
        compute:
          kind: elb_target_group
          elb:
            tg_protocol: "HTTP"
            backend_supports_https: true
            tg_backend_plaintext: true
  - name: HTTPS target group passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:elasticloadbalancing:us-east-1:111122223333:targetgroup/abc/123"
      asset_type: aws_elb_target_group
      vendor: aws
      properties:
        compute:
          kind: elb_target_group
          elb:
            tg_protocol: "HTTPS"
            backend_supports_https: true
            tg_backend_plaintext: false
