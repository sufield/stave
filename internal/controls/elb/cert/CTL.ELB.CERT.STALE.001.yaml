dsl_version: ctrl.v1
id: CTL.ELB.CERT.STALE.001
name: ELB Listener Has Old Certificate Still Attached After Replacement
description: >
  ELB listener has multiple certificates
  attached including one that's been
  superseded but not removed. The stale
  certificate is no longer the default but
  remains active for SNI matches against
  its SAN list — a forgotten cert may
  still be serving traffic.
domain: governance
severity: low
archetype: dormant-resource
compliance:
  soc2: "CC8.1"
  nist_800_53_r5: "CM-2, CM-8, SA-22"
  iso_27001_2022: "A.5.9, A.8.10"
  ccm_v4: ["DSP-04"]
scope_tags:
  - aws
  - elb
taxonomy:
  - compliance-mapping
  - trust-decay
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_elb]
params:
  attack_stage: resilience
  blast_radius:
    type: governance
    scope: account
    multiplier: 1.0
remediation:
  description: >
    Listener has stale certificate(s) attached.
  action: >
    Identify the active certificate (the one
    used by current production traffic) and
    remove the others: aws elbv2
    remove-listener-certificates with
    --certificates CertificateArn=<old>.
    Each ALB listener can attach multiple
    certificates (for SNI), so 'multiple'
    isn't itself a defect — but
    certificates that no SAN-bearing
    domain currently routes to the LB
    are stale.
  example: |
    {
      "compute": {
        "kind": "elb",
        "elb": {
          "listener_certificate_count": 1,
          "stale_certificates": []
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: elb
    - field: properties.compute.elb.has_stale_listener_certs
      op: eq
      value: true
defect: >
  ELB listener has certificates attached
  that are no longer in active routing.
infection: >
  Certificate replacement is a common
  operation: a new cert is provisioned
  and attached to the listener, traffic
  flips over, and the old cert is
  supposed to be removed. In practice,
  the removal step is frequently skipped
  — the new cert works, the old cert
  doesn't break anything, and the
  cleanup task drops off the queue. Stale
  certs accumulate. Two consequences:
  the listener attaches a longer chain
  of unused certs that auditors must
  reason about, and an attacker who
  knows about the old cert and can
  influence DNS may still route traffic
  through it via SNI manipulation.
  Cleanup is straightforward; the
  control surfaces the work.
failure: >
  Stale certs on listener. Cleanup debt
  from past cert replacements; auditors
  must reason about each unused cert.
tests:
  - name: stale certs present fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:elasticloadbalancing:us-east-1:111122223333:listener/app/abc/123/listener"
      asset_type: aws_elb_listener
      vendor: aws
      properties:
        compute:
          kind: elb
          elb:
            listener_certificate_count: 4
            stale_certificates:
              - "arn:aws:acm:us-east-1:111122223333:certificate/old1"
              - "arn:aws:acm:us-east-1:111122223333:certificate/old2"
            has_stale_listener_certs: true
  - name: clean listener passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:elasticloadbalancing:us-east-1:111122223333:listener/app/abc/123/listener"
      asset_type: aws_elb_listener
      vendor: aws
      properties:
        compute:
          kind: elb
          elb:
            listener_certificate_count: 1
            stale_certificates: []
            has_stale_listener_certs: false
