dsl_version: ctrl.v1
id: CTL.KMS.LIFECYCLE.CROSSENV.001
name: KMS Key Used Across Production and Non-Production Environments
description: >
  KMS key encrypts resources tagged production AND resources
  tagged non-production (development, staging, testing). A
  single key crossing the prod/non-prod boundary is a
  bidirectional risk: a non-production action — a developer
  disabling the key during cleanup, a sandbox automation
  scheduling deletion, a policy broadened for debug access —
  silently changes the security posture of the production data
  also encrypted with that key. The relationship runs the
  other way too: anyone with Decrypt on the key in
  non-production can decrypt production ciphertext, because
  it is the same key. The remediation is a per-environment
  key with an alias that encodes the environment
  (alias/prod-database-key, alias/dev-database-key) and
  policies that do not authorize cross-environment use. Same
  cross-environment pattern as CTL.RDS.SNAPSHOT.CROSSENV.001,
  CTL.APIGATEWAY.STAGE.CROSSENV.001, and
  CTL.VPC.SEGMENT.ENVMIX.001 — environment is a trust domain,
  and shared cryptographic material collapses that domain.
domain: governance
severity: high
compliance:
  soc2: "CC6.1, CC6.7"
  nist_800_53_r5: "AC-4, SC-12, SC-28"
  pci_dss_v4.0: "3.5, 7.2.4"
  fedramp_moderate: "SC-12"
  iso_27001_2022: "A.5.10, A.8.24"
  ccm_v4: ["CEK-03", "DSP-17"]
scope_tags:
  - aws
  - kms
taxonomy:
  - compliance-mapping
  - key-management
subtractive_category:
  - S08
  - S10
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_kms_key
params:
  attack_stage: lateral_movement
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.0
remediation:
  description: >
    KMS key is used by resources in both production and
    non-production environments. The key crosses an
    environment trust boundary in both directions.
  action: >
    Create per-environment keys with environment-encoded
    aliases (alias/prod-<workload>-key,
    alias/dev-<workload>-key). Re-encrypt non-production
    data under the non-production key and update resource
    references; production data should remain on a
    production-only key whose policy does not authorize
    non-production principals. Once split, gate future key
    use with provisioning pipelines that enforce environment
    alignment between key and resource. Use environment tags
    (env=prod, env=dev) consistently across resources so the
    drift can be re-detected.
  example: |
    {
      "cryptography": {
        "kind": "key",
        "lifecycle": {
          "used_by_prod": true,
          "used_by_nonprod": false,
          "cross_env": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.cryptography.kind
      op: eq
      value: key
    - field: properties.cryptography.lifecycle.cross_env
      op: eq
      value: true
defect: >
  KMS key is used by resources in both production and
  non-production environments.
infection: >
  A key shared across environments creates a bidirectional
  risk. Production risk from non-production actions: a
  developer disables the key during cleanup, breaking
  production. A non-production developer needs Decrypt for
  debugging, so the policy is broadened — now they can also
  decrypt production data. A sandbox automation schedules
  the key for deletion when the sandbox is torn down, and
  the production-data deletion countdown is silent for as
  many days as the deletion window. Security risk from
  shared access: anyone with Decrypt in non-production can
  decrypt production data — it is the same key, and the
  audit trail does not distinguish "decrypted my own
  non-production data" from "decrypted production data with
  a non-production permission." The key should be separate
  per environment, with alias/prod-<workload>-key and
  alias/dev-<workload>-key holding independent policies and
  independent lifecycles.
failure: >
  Cross-environment blast radius. Key operations (disable,
  delete, policy change) in one environment affect the
  other; access granted in non-production extends to
  production data because the same key material protects
  both.
tests:
  - name: key used by both prod and non-prod fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:kms:us-east-1:111122223333:key/mrk-cross-env"
      asset_type: aws_kms_key
      vendor: aws
      properties:
        cryptography:
          kind: key
          lifecycle:
            used_by_prod: true
            used_by_nonprod: true
            cross_env: true
            prod_resources:
              - "arn:aws:rds:us-east-1:111122223333:db:prod-orders"
            nonprod_resources:
              - "arn:aws:lambda:us-east-1:111122223333:function:dev-orders-test"
  - name: key used only in prod passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:kms:us-east-1:111122223333:key/mrk-prod-only"
      asset_type: aws_kms_key
      vendor: aws
      properties:
        cryptography:
          kind: key
          lifecycle:
            used_by_prod: true
            used_by_nonprod: false
            cross_env: false
            prod_resources:
              - "arn:aws:rds:us-east-1:111122223333:db:prod-orders"
              - "arn:aws:s3:::prod-app-data"
  - name: key with large cross-env surface fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:kms:us-east-1:111122223333:key/mrk-cross-env-large"
      asset_type: aws_kms_key
      vendor: aws
      properties:
        cryptography:
          kind: key
          lifecycle:
            used_by_prod: true
            used_by_nonprod: true
            cross_env: true
            prod_resources:
              - "arn:aws:rds:us-east-1:111122223333:db:prod-orders"
              - "arn:aws:s3:::prod-app-data"
              - "arn:aws:dynamodb:us-east-1:111122223333:table/prod-sessions"
            nonprod_resources:
              - "arn:aws:lambda:us-east-1:111122223333:function:dev-orders-test"
              - "arn:aws:rds:us-east-1:111122223333:db:dev-orders"
              - "arn:aws:s3:::dev-app-data"
              - "arn:aws:s3:::staging-app-data"
              - "arn:aws:dynamodb:us-east-1:111122223333:table/dev-sessions"
