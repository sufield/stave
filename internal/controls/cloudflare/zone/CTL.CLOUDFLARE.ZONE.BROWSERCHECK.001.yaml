dsl_version: ctrl.v1
id: CTL.CLOUDFLARE.ZONE.BROWSERCHECK.001
name: Browser Integrity Check Not Enabled
description: >
  Browser integrity check not enabled. HTTP headers not inspected
  for common bot signatures.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "SI-4"
  soc2: "CC7.1"
scope_tags: [cloudflare]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types: [cloudflare_zone]
params:
  attack_stage: initial_access
remediation:
  description: Browser Integrity Check Not Enabled — finding detected.
  action: Remediate per control description.
  example: |
    {"cloudflare": {"zone": {"kind": "zone_config", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.cloudflare.zone.kind
      op: eq
      value: zone_config
    - field: properties.cloudflare.zone.browser_integrity_check
      op: eq
      value: false
