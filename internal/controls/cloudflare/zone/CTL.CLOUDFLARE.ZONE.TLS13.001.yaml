dsl_version: ctrl.v1
id: CTL.CLOUDFLARE.ZONE.TLS13.001
name: Cloudflare Zone TLS 1.3 Not Enabled
description: >
  TLS 1.3 not enabled. Improved security and performance unavailable.
domain: encryption
severity: medium
compliance:
  nist_800_53_r5: "SC-8"
  soc2: "CC6.1"
scope_tags: [cloudflare]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types: [cloudflare_zone]
params:
  attack_stage: initial_access
remediation:
  description: Cloudflare Zone TLS 1.3 Not Enabled — finding detected.
  action: Remediate per control description.
  example: |
    {"cloudflare": {"zone": {"kind": "zone_config", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.cloudflare.zone.kind
      op: eq
      value: zone_config
    - field: properties.cloudflare.zone.tls_1_3_enabled
      op: eq
      value: false
