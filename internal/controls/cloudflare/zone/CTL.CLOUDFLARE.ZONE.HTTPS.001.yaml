dsl_version: ctrl.v1
id: CTL.CLOUDFLARE.ZONE.HTTPS.001
name: Cloudflare Zone HTTPS Redirect Not Enabled
description: >
  Automatic HTTPS redirect not enabled. HTTP requests served without
  redirecting to HTTPS.
domain: encryption
severity: high
compliance:
  nist_800_53_r5: "SC-8"
  pci_dss_v4: "4.1"
  soc2: "CC6.7"
scope_tags: [cloudflare]
taxonomy:
  - compliance-mapping
  - encryption-in-transit
type: unsafe_state
classification: state_assertion
applicable_asset_types: [cloudflare_zone]
params:
  attack_stage: initial_access
remediation:
  description: Cloudflare Zone HTTPS Redirect Not Enabled — finding detected.
  action: Remediate per control description.
  example: |
    {"cloudflare": {"zone": {"kind": "zone_config", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.cloudflare.zone.kind
      op: eq
      value: zone_config
    - field: properties.cloudflare.zone.https_redirect_enabled
      op: eq
      value: false
