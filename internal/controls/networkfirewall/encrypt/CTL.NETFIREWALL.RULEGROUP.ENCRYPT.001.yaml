dsl_version: ctrl.v1
id: CTL.NETFIREWALL.RULEGROUP.ENCRYPT.001
name: Network Firewall Rule Group Must Use Customer-Managed KMS Key
description: >
  Network Firewall rule groups should encrypt their configuration at
  rest with a customer-managed KMS key. Without CMK encryption the
  rule group data is encrypted with an AWS-managed key, which provides
  no key-policy control over who can read the rule definitions and no
  CloudTrail visibility into decrypt operations.
domain: governance
severity: low
compliance:
  nist_800_53_r5: "SC-28"
  soc2: "CC6.1"
  ccm_v4: ["CEK-03"]
scope_tags: [aws, networkfirewall]
taxonomy:
  - encryption-at-rest
  - key-management
subtractive_category:
  - S10
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_networkfirewall_firewall]
params:
  attack_stage: persistence
remediation:
  description: >
    Network Firewall rule group is not encrypted with a
    customer-managed KMS key.
  action: >
    Recreate the rule group with an EncryptionConfiguration specifying
    Type CUSTOMER_KMS and the KMS key ARN. Existing rule groups cannot
    be updated in place — export the rules, delete, and recreate.
  example: |
    {"network": {"kind": "network_firewall_rule_group", "rule_group": {"encryption_configuration": {"type": "CUSTOMER_KMS"}}}}
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: network_firewall_rule_group
    - field: properties.network.rule_group.encryption_configuration.type
      op: ne
      value: CUSTOMER_KMS
