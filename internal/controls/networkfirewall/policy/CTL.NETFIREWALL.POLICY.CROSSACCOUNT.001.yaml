dsl_version: ctrl.v1
id: CTL.NETFIREWALL.POLICY.CROSSACCOUNT.001
name: Network Firewall Rule Group Resource Policy Grants Cross-Account Access Without Organizational Boundary
description: >
  Network Firewall rule group or firewall policy resource policy
  grants cross-account access without an aws:PrincipalOrgID
  condition. An external account can consume or modify shared
  rule groups; if the account leaves the organization, access
  persists. PutResourcePolicy on rule groups and firewall
  policies controls who can reference them in their own firewall
  configurations — cross-account sharing without org boundary
  means a departed account retains the ability to read rule
  definitions, which may reveal internal network segmentation
  strategy.
domain: exposure
severity: high
compliance:
  soc2: "CC6.1, CC6.6"
  nist_800_53_r5: "AC-3, AC-4, AC-6"
  pci_dss_v4.0: "1.2, 7.1, 7.2"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.5.15, A.5.19"
  ccm_v4: ["IAM-16", "IVS-09"]
scope_tags: [aws, networkfirewall]
taxonomy:
  - identity-perimeter
  - trust-boundary
subtractive_category:
  - S03
  - S05
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_networkfirewall_firewall]
params:
  attack_stage: initial_access
  blast_radius:
    type: prevention
    scope: organization
    multiplier: 2.0
remediation:
  description: >
    Network Firewall rule group resource policy grants
    cross-account access without an aws:PrincipalOrgID condition.
  action: >
    Add aws:PrincipalOrgID restricting access to the
    organization's ID. For legitimate cross-org sharing, use
    aws:PrincipalAccount with the explicit account ID and
    document the trust relationship.
  example: |
    {
      "network": {
        "kind": "network_firewall",
        "firewall": {
          "policy_cross_account": true,
          "policy_has_org_condition": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: network_firewall
    - field: properties.network.firewall.policy_cross_account
      op: eq
      value: true
    - field: properties.network.firewall.policy_has_org_condition
      op: eq
      value: false
defect: >
  Network Firewall rule group resource policy grants actions to
  external account principals without aws:PrincipalOrgID.
infection: >
  Cross-account rule group access without organizational boundary
  means the external account can reference or inspect shared rule
  groups regardless of current org membership. If the account
  leaves the organization, access persists. Rule group definitions
  reveal internal network segmentation strategy — stateful rules
  expose which protocols, ports, and domains are allowed or denied,
  giving an attacker a map of the firewall posture.
failure: >
  Rule group access outside organizational boundary. External-
  account principals can consume shared firewall rules without
  org-membership verification, and access persists across org
  changes.
tests:
  - name: cross-account without org condition fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:network-firewall:us-east-1:111122223333:firewall-policy/shared-policy"
      asset_type: aws_networkfirewall_firewall
      vendor: aws
      properties:
        network:
          kind: network_firewall
          firewall:
            policy_cross_account: true
            policy_has_org_condition: false
            policy_external_accounts:
              - "222233334444"
  - name: cross-account with org condition passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:network-firewall:us-east-1:111122223333:firewall-policy/shared-policy"
      asset_type: aws_networkfirewall_firewall
      vendor: aws
      properties:
        network:
          kind: network_firewall
          firewall:
            policy_cross_account: true
            policy_has_org_condition: true
            policy_external_accounts:
              - "222233334444"
  - name: no cross-account passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:network-firewall:us-east-1:111122223333:firewall-policy/internal-policy"
      asset_type: aws_networkfirewall_firewall
      vendor: aws
      properties:
        network:
          kind: network_firewall
          firewall:
            policy_cross_account: false
