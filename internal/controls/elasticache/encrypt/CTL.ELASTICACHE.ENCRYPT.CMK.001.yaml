dsl_version: ctrl.v1
id: CTL.ELASTICACHE.ENCRYPT.CMK.001
name: ElastiCache Redis Must Use a Customer-Managed KMS Key
description: >
  ElastiCache Redis clusters with at-rest encryption must use a
  customer-managed KMS key, not the AWS-managed default. The
  AWS-managed key has a key policy the customer cannot edit and
  cannot be revoked or rotated on the customer's schedule. Using
  it satisfies the at-rest encryption checkbox but eliminates
  per-tenant key-policy and per-incident key-revocation controls
  that customer-managed keys provide.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: SC-12
  soc2: CC6.7
  pci_dss_v4.0: 3.6.1
  ccm_v4:
  - CEK-04
  - CEK-08
scope_tags:
- aws
- elasticache
taxonomy:
  - compliance-mapping
  - encryption-at-rest
  - key-management
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_elasticache_cluster]
params:
  attack_stage: exfiltration
remediation:
  description: >
    Cluster is encrypted with the AWS-managed default key.
    Per-tenant key-policy and revocation controls are unavailable.
  action: >
    Create a new cluster with a customer-managed KMS key. ElastiCache
    does not allow changing the encryption key on an existing cluster.
    Snapshot the cluster, then restore to a new cluster with a CMK.
  example: |
    {
      "cache": {
        "kind": "cluster",
        "encryption": {
          "at_rest_enabled": true,
          "kms_key_managed_by": "customer"
        }
      }
    }
unsafe_predicate:
  all:
  - field: properties.cache.kind
    op: eq
    value: cluster
  - field: properties.cache.encryption.at_rest_enabled
    op: eq
    value: true
  - field: properties.cache.encryption.kms_key_managed_by
    op: eq
    value: aws
tests:
  - name: aws-managed key fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:elasticache:us-east-1:111122223333:cluster:prod-redis"
      asset_type: aws_elasticache_cluster
      vendor: aws
      properties:
        cache:
          kind: cluster
          encryption:
            at_rest_enabled: true
            kms_key_managed_by: aws
  - name: customer-managed key passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:elasticache:us-east-1:111122223333:cluster:prod-redis"
      asset_type: aws_elasticache_cluster
      vendor: aws
      properties:
        cache:
          kind: cluster
          encryption:
            at_rest_enabled: true
            kms_key_managed_by: customer
  - name: unencrypted cluster not in scope
    verdict: PASS
    asset:
      asset_id: "arn:aws:elasticache:us-east-1:111122223333:cluster:dev-redis"
      asset_type: aws_elasticache_cluster
      vendor: aws
      properties:
        cache:
          kind: cluster
          encryption:
            at_rest_enabled: false
