dsl_version: ctrl.v1
id: CTL.ELASTICACHE.SG.BROAD.001
name: ElastiCache Cluster Security Group Must Not Allow Broad Ingress
description: >
  ElastiCache cluster security group must restrict ingress to
  specific application security groups or CIDR blocks. A security
  group allowing 0.0.0.0/0 on the Redis/Memcached port exposes
  the cache to any host with network access. Even with AUTH
  enabled, broad ingress increases the attack surface for brute-
  force and network-level exploits.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SC-7"
  soc2: "CC6.6"
  pci_dss_v4.0: "1.3.1"
  ccm_v4: ["IVS-06", "IVS-09"]
scope_tags:
  - aws
  - elasticache
taxonomy:
  - compliance-mapping
  - network-perimeter
subtractive_category:
  - S03
  - S06
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_elasticache_cluster]
params:
  attack_stage: initial_access
remediation:
  description: >
    ElastiCache cluster security group allows broad ingress.
  action: >
    Restrict the security group to allow ingress only from
    application security groups or specific CIDR blocks that
    need cache access. Remove 0.0.0.0/0 rules on ports 6379
    (Redis) and 11211 (Memcached).
  example: |
    {
      "cache": {
        "kind": "cluster",
        "network": {
          "security_group_broad_ingress": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.cache.kind
      op: eq
      value: cluster
    - field: properties.cache.network.security_group_broad_ingress
      op: eq
      value: true
tests:
  - name: broad security group fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:elasticache:us-east-1:123456789012:cluster:my-cache"
      asset_type: aws_elasticache_cluster
      vendor: aws
      properties:
        cache:
          kind: cluster
          network:
            security_group_broad_ingress: true
  - name: restricted security group passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:elasticache:us-east-1:123456789012:cluster:my-cache"
      asset_type: aws_elasticache_cluster
      vendor: aws
      properties:
        cache:
          kind: cluster
          network:
            security_group_broad_ingress: false
