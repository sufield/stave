dsl_version: ctrl.v1
id: CTL.ELASTICACHE.LOG.SLOW.001
name: ElastiCache Cluster Must Have Slow Log Enabled
description: >
  ElastiCache cluster does not have slow log delivery enabled.
  Slow logs capture queries that exceed a configurable latency
  threshold, providing visibility into performance degradation
  and potential abuse patterns such as key enumeration or
  denial-of-service via expensive commands.
domain: detection
severity: medium
compliance:
  nist_800_53_r5: "AU-2, AU-3"
  soc2: "CC7.2"
  pci_dss_v4.0: "10.2"
scope_tags:
  - aws
  - elasticache
taxonomy:
  - compliance-mapping
  - logging
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_elasticache_cluster]
params:
  attack_stage: discovery
remediation:
  description: >
    ElastiCache cluster slow log delivery is not enabled.
  action: >
    Enable slow log delivery for the ElastiCache cluster.
    Configure log delivery to CloudWatch Logs or Kinesis
    Data Firehose with the slow-log log type.
  example: |
    {
      "cache": {
        "kind": "cluster",
        "logging": {
          "slow_log_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.cache.kind
      op: eq
      value: cluster
    - field: properties.cache.logging.slow_log_enabled
      op: ne
      value: true
tests:
  - name: slow log disabled fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:elasticache:us-east-1:123456789012:cluster:my-cache"
      asset_type: aws_elasticache_cluster
      vendor: aws
      properties:
        cache:
          kind: cluster
          logging:
            slow_log_enabled: false
  - name: slow log enabled passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:elasticache:us-east-1:123456789012:cluster:my-cache"
      asset_type: aws_elasticache_cluster
      vendor: aws
      properties:
        cache:
          kind: cluster
          logging:
            slow_log_enabled: true
