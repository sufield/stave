dsl_version: ctrl.v1
id: CTL.GLUE.JOB.ENCRYPT.CMK.001
name: Glue Job Must Use a Customer-Managed KMS Key
description: >
  Glue jobs must encrypt bookmarks, S3 targets, and CloudWatch
  Logs output with a customer-managed KMS key. The AWS-managed
  default key provides no key-policy control and cannot be
  revoked during an incident. Glue jobs process and transform
  data across S3, databases, and streaming sources; the
  encryption key controls who can access intermediate and
  output data at rest.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: SC-12
  soc2: CC6.7
  pci_dss_v4.0: 3.6.1
  ccm_v4:
    - CEK-04
    - CEK-08
scope_tags:
  - aws
  - glue
taxonomy:
  - compliance-mapping
  - encryption-at-rest
  - key-management
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_glue_job]
params:
  attack_stage: exfiltration
remediation:
  description: >
    Glue job is not using a customer-managed KMS key for
    encryption. Bookmark, S3, and log data are encrypted
    with AWS-managed keys.
  action: >
    Create a customer-managed KMS key and configure the
    Glue job security configuration to use it for S3,
    CloudWatch Logs, and bookmark encryption.
  example: |
    {
      "compute": {
        "kind": "glue_job",
        "glue": {
          "job": {
            "kms_key_origin": "CUSTOMER_MANAGED"
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: glue_job
    - field: properties.compute.glue.job.kms_key_origin
      op: eq
      value: AWS_MANAGED
tests:
  - name: Glue job with AWS-managed key fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:glue:us-east-1:111122223333:job/etl-transform"
      asset_type: aws_glue_job
      vendor: aws
      properties:
        compute:
          kind: glue_job
          glue:
            job:
              kms_key_origin: AWS_MANAGED
  - name: Glue job with customer-managed CMK passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:glue:us-east-1:111122223333:job/etl-transform"
      asset_type: aws_glue_job
      vendor: aws
      properties:
        compute:
          kind: glue_job
          glue:
            job:
              kms_key_origin: CUSTOMER_MANAGED
