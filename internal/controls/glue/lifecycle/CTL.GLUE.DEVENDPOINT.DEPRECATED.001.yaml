dsl_version: ctrl.v1
id: CTL.GLUE.DEVENDPOINT.DEPRECATED.001
name: Glue Dev Endpoint Is Deprecated
description: >
  AWS Glue development endpoints are a deprecated resource type.
  AWS recommends migrating to Glue Studio notebooks or Glue
  interactive sessions, which provide better isolation, faster
  startup, and active feature development. Existing dev endpoints
  remain operational but receive no new features and may be
  removed in a future service update. Dev endpoints also carry
  a broader attack surface — they expose a network-accessible
  Spark environment that persists between sessions, unlike
  interactive sessions which are ephemeral.
domain: config
severity: low
compliance:
  nist_800_53_r5: "SA-22"
scope_tags:
  - aws
  - glue
taxonomy:
  - compliance-mapping
  - deprecation
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_glue_job]
params:
  attack_stage: discovery
remediation:
  description: >
    Glue development endpoint exists. Dev endpoints are deprecated
    in favor of Glue interactive sessions.
  action: >
    Migrate to Glue interactive sessions or Glue Studio notebooks.
    Delete the dev endpoint after confirming all development
    workflows have been migrated. Use aws glue delete-dev-endpoint
    --endpoint-name <name> to remove.
  example: |
    {
      "compute": {
        "kind": "glue_dev_endpoint",
        "deprecated": false
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: glue_dev_endpoint
    - field: properties.compute.deprecated
      op: eq
      value: true
