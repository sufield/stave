dsl_version: ctrl.v1
id: CTL.GLOBALACCELERATOR.LOG.FLOW.001
name: Global Accelerator Flow Logs Must Be Enabled
description: >
  AWS Global Accelerator does not have flow logs enabled.
  Without flow logs, network traffic to the accelerator
  endpoints is not recorded, limiting visibility into
  connection patterns and potential abuse.
domain: detection
severity: low
compliance:
  nist_800_53_r5: "AU-2, AU-3"
  soc2: "CC7.2"
  pci_dss_v4.0: "10.2"
scope_tags:
  - aws
  - globalaccelerator
taxonomy:
  - compliance-mapping
  - logging
subtractive_category:
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_globalaccelerator_accelerator]
params:
  attack_stage: discovery
remediation:
  description: >
    Global Accelerator flow logs are not enabled.
  action: >
    Enable flow logs for the Global Accelerator to record
    network traffic metadata to an S3 bucket.
  example: |
    {
      "network": {
        "kind": "accelerator",
        "logging": {
          "flow_log_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: accelerator
    - field: properties.network.logging.flow_log_enabled
      op: ne
      value: true
tests:
  - name: flow logs disabled fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:globalaccelerator::123456789012:accelerator/abc-123"
      asset_type: aws_globalaccelerator_accelerator
      vendor: aws
      properties:
        network:
          kind: accelerator
          logging:
            flow_log_enabled: false
  - name: flow logs enabled passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:globalaccelerator::123456789012:accelerator/abc-123"
      asset_type: aws_globalaccelerator_accelerator
      vendor: aws
      properties:
        network:
          kind: accelerator
          logging:
            flow_log_enabled: true
