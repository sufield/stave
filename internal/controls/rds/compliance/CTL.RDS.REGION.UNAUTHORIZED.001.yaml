dsl_version: ctrl.v1
id: CTL.RDS.REGION.UNAUTHORIZED.001
name: RDS Instance Deployed In Unauthorized Region
description: >
  RDS instance deployed in an AWS region not on the organization's
  approved list. Database instances carry persistent data subject to
  residency requirements. aws:RequestedRegion governs the API
  endpoint, not data movement — replication and cross-region read
  replicas are separate control families.
domain: governance
severity: medium
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["DSP-04", "DSP-19"]
  hipaa: "164.310(d)"
scope_tags:
  - aws
  - rds
taxonomy:
  - compliance-mapping
subtractive_category:
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_rds_instance
params:
  attack_stage: persistence
remediation:
  description: >
    RDS instance in unauthorized region.
  action: >
    Create a snapshot, copy it to an authorized region, restore
    from the snapshot, then delete the original instance and
    snapshot.
  example: |
    {
      "database": {
        "kind": "instance",
        "governance": {
          "region_authorized": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.database.kind
      op: eq
      value: instance
    - field: properties.database.governance.region_authorized
      op: eq
      value: false
tests:
  - name: instance in unauthorized region fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:rds:me-south-1:111122223333:db:prod"
      asset_type: aws_rds_instance
      vendor: aws
      properties:
        database:
          kind: instance
          governance:
            region_authorized: false
  - name: instance in authorized region passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:rds:us-east-1:111122223333:db:prod"
      asset_type: aws_rds_instance
      vendor: aws
      properties:
        database:
          kind: instance
          governance:
            region_authorized: true
