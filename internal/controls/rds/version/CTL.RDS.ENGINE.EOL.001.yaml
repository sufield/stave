dsl_version: ctrl.v1
id: CTL.RDS.ENGINE.EOL.001
name: RDS Instances Must Not Run End-of-Life Database Engine Versions
description: >
  RDS instances must not run major database engine versions that have
  reached end-of-life (EOL) and no longer receive security patches from
  the engine vendor. This is distinct from CTL.RDS.AUTOUPGRADE.001 which
  covers automatic minor version upgrades within a supported major
  version. Auto minor upgrade does not upgrade between major versions —
  an EOL major version receives no further patches regardless of the
  auto-upgrade setting. PostgreSQL 11 (EOL November 2023), MySQL 5.7
  (EOL October 2023), and MariaDB 10.4 (EOL June 2024) are examples
  of major versions that continue running on RDS but receive no security
  patches from the upstream vendor. The engine version is permanently
  unpatched against any vulnerability disclosed after EOL. For PHI and
  cardholder data environments, running an EOL engine is a direct
  compliance finding — HIPAA requires maintained software and PCI-DSS
  6.3.3 requires protection from known vulnerabilities through patching.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SI-2"
  fedramp_moderate: "SI-2"
  pci_dss_v4.0: "6.3.3"
  soc2: "CC7.1"
  hipaa: "164.312(c)(1)"
  ccm_v4: ["IVS-04"]
scope_tags:
  - aws
  - rds
taxonomy:
  - compliance-mapping
  - deprecation
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_rds_instance]
params:
  base_impact: 8
  attack_stage: initial_access
  blast_radius:
    type: detection
    scope: account
    multiplier: 1.5
remediation:
  description: >
    RDS instance is running a database engine major version that has
    reached end-of-life. No security patches are available from the
    engine vendor. Known CVEs accumulate without remediation.
  action: >
    Upgrade the RDS instance to a supported major engine version. For
    PostgreSQL, upgrade to PostgreSQL 14 or later. For MySQL, upgrade
    to MySQL 8.0. For MariaDB, upgrade to MariaDB 10.6 or later. Use
    a blue-green deployment or read replica promotion to minimize
    downtime. Test the application against the new major version in a
    staging environment before upgrading production — major version
    upgrades may include breaking changes in SQL behavior, function
    signatures, or default settings.
  example: |
    {
      "database": {
        "kind": "instance",
        "engine_version": {
          "is_eol": false
        }
      }
    }
lifecycle:
  status: eol
unsafe_predicate:
  all:
    - field: properties.database.kind
      op: eq
      value: instance
    - field: properties.database.engine_version.is_eol
      op: eq
      value: true
