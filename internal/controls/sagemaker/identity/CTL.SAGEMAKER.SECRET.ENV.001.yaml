dsl_version: ctrl.v1
id: CTL.SAGEMAKER.SECRET.ENV.001
name: SageMaker Notebook Must Not Contain Plaintext Secrets
description: >
  SageMaker notebook instance contains plaintext secrets in
  environment variables or lifecycle configuration. Secrets
  are visible in the SageMaker console and API responses.
domain: identity
severity: low
compliance:
  nist_800_53_r5: "IA-5"
  soc2: "CC6.1"
scope_tags:
  - aws
  - sagemaker
taxonomy:
  - compliance-mapping
  - credential-lifecycle
subtractive_category:
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_sagemaker_notebook_instance]
params:
  attack_stage: credential_access
remediation:
  description: >
    SageMaker notebook contains plaintext secrets.
  action: >
    Move secrets to AWS Secrets Manager or SSM Parameter Store
    and access them programmatically from the notebook.
  example: |
    {
      "compute": {
        "kind": "sagemaker_notebook",
        "secrets": {
          "env_contains_plaintext": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: sagemaker_notebook
    - field: properties.compute.secrets.env_contains_plaintext
      op: eq
      value: true
tests:
  - name: notebook with plaintext secrets fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:sagemaker:us-east-1:123456789012:notebook-instance/my-nb"
      asset_type: aws_sagemaker_notebook_instance
      vendor: aws
      properties:
        compute:
          kind: sagemaker_notebook
          secrets:
            env_contains_plaintext: true
  - name: notebook without plaintext secrets passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:sagemaker:us-east-1:123456789012:notebook-instance/my-nb"
      asset_type: aws_sagemaker_notebook_instance
      vendor: aws
      properties:
        compute:
          kind: sagemaker_notebook
          secrets:
            env_contains_plaintext: false
