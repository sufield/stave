dsl_version: ctrl.v1
id: CTL.SAGEMAKER.PIPELINE.ENCRYPT.CMK.001
name: SageMaker Pipeline Must Use a Customer-Managed KMS Key
description: >
  SageMaker pipelines with encryption must use a customer-managed
  KMS key, not the AWS-managed default. Pipelines chain multiple
  processing stages, each with its own storage for artifacts,
  intermediate data, and model outputs. The AWS-managed key has a
  key policy the customer cannot edit and cannot be revoked or
  rotated on the customer's schedule. Customer-managed keys
  provide per-tenant key-policy control and per-incident
  key-revocation capability across all pipeline stages.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: SC-12
  soc2: CC6.7
  pci_dss_v4.0: 3.6.1
  hipaa: "164.312(a)(2)(iv)"
  ccm_v4:
  - CEK-04
  - CEK-08
scope_tags:
- aws
- sagemaker
taxonomy:
  - compliance-mapping
  - encryption-at-rest
  - key-management
subtractive_category:
  - S07
  - S10
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_sagemaker_pipeline]
params:
  attack_stage: exfiltration
remediation:
  description: >
    Pipeline is encrypted with the AWS-managed default key.
    Per-tenant key-policy and revocation controls are unavailable.
  action: >
    Configure the pipeline's OutputDataConfig and
    ProcessingOutputConfig to use a customer-managed KMS key ARN.
    Update the pipeline definition to reference the CMK.
  example: |
    {
      "compute": {
        "kind": "sagemaker_pipeline",
        "encryption": {
          "uses_customer_kms": true,
          "kms_key_managed_by": "customer"
        }
      }
    }
unsafe_predicate:
  all:
  - field: properties.compute.kind
    op: eq
    value: sagemaker_pipeline
  - field: properties.compute.encryption.uses_customer_kms
    op: eq
    value: true
  - field: properties.compute.encryption.kms_key_managed_by
    op: eq
    value: aws
tests:
  - name: aws-managed key fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:sagemaker:us-east-1:111122223333:pipeline/ml-pipeline"
      asset_type: aws_sagemaker_pipeline
      vendor: aws
      properties:
        compute:
          kind: sagemaker_pipeline
          encryption:
            uses_customer_kms: true
            kms_key_managed_by: aws
  - name: customer-managed key passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:sagemaker:us-east-1:111122223333:pipeline/ml-pipeline"
      asset_type: aws_sagemaker_pipeline
      vendor: aws
      properties:
        compute:
          kind: sagemaker_pipeline
          encryption:
            uses_customer_kms: true
            kms_key_managed_by: customer
  - name: unencrypted pipeline not in scope
    verdict: PASS
    asset:
      asset_id: "arn:aws:sagemaker:us-east-1:111122223333:pipeline/dev-pipeline"
      asset_type: aws_sagemaker_pipeline
      vendor: aws
      properties:
        compute:
          kind: sagemaker_pipeline
          encryption:
            uses_customer_kms: false
