dsl_version: ctrl.v1
id: CTL.K8S.SECRETS.ENCRYPT.001
name: Kubernetes Secrets Must Be Encrypted at Rest in etcd
description: >
  Kubernetes Secrets stored in etcd must be encrypted at rest. By
  default, Secrets are stored as base64-encoded plaintext in etcd,
  readable by anyone with etcd access or etcd backup access.
domain: exposure
severity: critical
compliance:
  cis_k8s_v1.8.0: "1.2.29"
  hipaa: "164.312(a)(2)(iv)"
  soc2: "CC6.7"
  ccm_v4: ["CEK-03"]
scope_tags:
  - kubernetes
  - secrets
taxonomy:
  - compliance-mapping
  - encryption-at-rest
subtractive_category:
  - S10
type: unsafe_state
classification: state_assertion
applicable_asset_types: [k8s_resource]
params:
  attack_stage: exfiltration
remediation:
  description: >
    Kubernetes Secrets are not encrypted at rest in etcd. Anyone with
    etcd access can read all Secrets in plaintext.
  action: >
    Configure the API server with --encryption-provider-config pointing
    to an EncryptionConfiguration that uses aescbc, aesgcm, or kms
    provider. For EKS, enable envelope encryption with a KMS key.
  example: |
    {
      "secrets": {
        "kind": "cluster",
        "etcd_encryption_enabled": true
      }
    }
unsafe_predicate:
  all:
    - field: properties.secrets.kind
      op: eq
      value: cluster
    - field: properties.secrets.etcd_encryption_enabled
      op: eq
      value: false
