dsl_version: ctrl.v1
id: CTL.K8S.EXEC.RESTRICT.001
name: kubectl exec Must Be Restricted via RBAC to Authorized Roles
description: >
  kubectl exec (pods/exec) allows executing commands in running pods.
  Granting this to service accounts or broad principals enables
  arbitrary code execution in any pod the principal can target. An
  attacker who compromises a principal with pods/exec access can run
  commands in privileged pods, access secrets mounted in other pods,
  and pivot to the host if any pod runs with elevated privileges.
domain: identity
severity: high
compliance:
  nist_800_53_r5: "AC-3"
  cis_k8s_v1.9: "5.1.3"
  mitre_attack: "T1609"
  ccm_v4: ["IAM-05", "IAM-16"]
scope_tags:
  - kubernetes
  - rbac
taxonomy:
  - compliance-mapping
  - compute-hardening
  - network-perimeter
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types: [k8s_cluster]
params:
  attack_stage: execution
remediation:
  description: >
    RBAC grants pods/exec to service accounts or broad roles.
    Arbitrary command execution is possible in target pods.
  action: >
    Audit all ClusterRoles and Roles granting pods/exec. Restrict
    pods/exec to named developer roles with namespace scope, not
    cluster-wide roles. Remove pods/exec from service account bindings.
  example: |
    {
      "rbac": {
        "kind": "cluster_role",
        "pods_exec_unrestricted": false
      }
    }
unsafe_predicate:
  all:
    - field: properties.rbac.kind
      op: eq
      value: cluster_role
    - field: properties.rbac.pods_exec_unrestricted
      op: eq
      value: true
