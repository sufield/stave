dsl_version: ctrl.v1
id: CTL.K8S.JOB.TTL.001
name: Jobs in NetworkPolicy Namespaces Must Configure ttlSecondsAfterFinished
description: >
  Kubernetes Jobs in namespaces with active NetworkPolicy must set
  ttlSecondsAfterFinished to limit completed pod residency. The VPC
  CNI controller does not flush NetworkPolicy firewall rules when a
  pod reaches Completed state. Without TTL, completed pod IPs are
  recycled with stale firewall rules attached, silently granting new
  pods the original pod's network access.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "AC-4"
  mitre_attack: "TA0008"
  ccm_v4: ["CCC-04", "IVS-04"]
scope_tags:
  - kubernetes
  - eks
taxonomy:
  - compliance-mapping
  - trust-decay
type: unsafe_state
classification: state_assertion
applicable_asset_types: [k8s_resource]
params:
  attack_stage: lateral_movement
remediation:
  description: >
    Jobs in NetworkPolicy namespaces do not have ttlSecondsAfterFinished
    configured. Completed pods accumulate with stale firewall rules.
  action: >
    Add ttlSecondsAfterFinished (60-300 seconds) to all Job specs in
    namespaces with NetworkPolicy. For cluster-wide enforcement, use
    a policy engine (OPA/Kyverno) to require this field.
unsafe_predicate:
  all:
    - field: properties.jobs.has_job_without_ttl_in_netpol_ns
      op: eq
      value: true
