dsl_version: ctrl.v1
id: CTL.K8S.INCOMPLETE.001
name: Complete Data Required for Kubernetes Assessment
description: >
  Kubernetes cluster safety cannot be assessed when audit logging
  status is missing from the snapshot. The extractor must populate
  audit.audit_logging_enabled.
compliance:
  ccm_v4: ["DCS-06"]
domain: exposure
severity: low
scope_tags:
  - kubernetes
taxonomy:
  - compliance-mapping
subtractive_category:
  - S08
applicable_asset_types:
  - k8s_cluster
type: unsafe_state
classification: state_assertion
params: {}
remediation:
  description: >
    Kubernetes assessment data is incomplete. The extractor did not
    populate required cluster properties.
  action: >
    Re-run the extractor with Kubernetes API access to describe
    cluster configuration, RBAC, network policies, and secrets.
unsafe_predicate:
  all:
    - field: properties.audit.kind
      op: eq
      value: cluster
    - field: properties.audit.audit_logging_enabled
      op: missing
      value: true
