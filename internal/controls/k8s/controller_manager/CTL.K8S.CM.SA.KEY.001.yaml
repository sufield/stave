dsl_version: ctrl.v1
id: CTL.K8S.CM.SA.KEY.001
name: Controller Manager Service Account Private Key Must Be Set
description: >
  The controller manager must have a service account private key file
  configured for signing service account tokens.
domain: exposure
severity: high
compliance:
  cis_k8s_v1.9: "1.3.4"
  ccm_v4: ["IVS-04"]
scope_tags:
  - kubernetes
  - controller_manager
taxonomy:
  - compliance-mapping
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
applicable_asset_types: [k8s_controller_manager]
params:
  attack_stage: credential_access
remediation:
  description: >
    Controller manager service account private key file is not configured.
  action: >
    Set --service-account-private-key-file on the controller manager.
unsafe_predicate:
  all:
    - field: type
      op: eq
      value: k8s_controller_manager
    - field: properties.controller_manager.service_account_private_key_file
      op: missing
      value: true
