dsl_version: ctrl.v1
id: CTL.K8S.CM.SA.CREDS.001
name: Controller Manager Must Use Individual Service Account Credentials
description: >
  The controller manager must use individual service account credentials
  for each controller. Without this, all controllers share the controller
  manager's credentials, violating least privilege.
domain: exposure
severity: high
compliance:
  cis_k8s_v1.9: "1.3.3"
  ccm_v4: ["IVS-04"]
scope_tags:
  - kubernetes
  - controller_manager
taxonomy:
  - compliance-mapping
  - credential-lifecycle
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types: [k8s_controller_manager]
params:
  attack_stage: privilege_escalation
remediation:
  description: >
    Controller manager does not use individual service account credentials.
  action: >
    Set --use-service-account-credentials=true on the controller manager.
unsafe_predicate:
  all:
    - field: type
      op: eq
      value: k8s_controller_manager
    - field: properties.controller_manager.use_service_account_credentials
      op: eq
      value: false
