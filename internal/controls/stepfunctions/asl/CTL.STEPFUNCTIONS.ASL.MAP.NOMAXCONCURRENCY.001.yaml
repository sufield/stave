dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.ASL.MAP.NOMAXCONCURRENCY.001
name: Step Functions Map State Has No MaxConcurrency Limit
description: >
  ASL `Map` state has no `MaxConcurrency` field
  set. Map fans out per-iteration with no
  bounded parallelism — for a 10K-item input,
  10K Lambda invocations land simultaneously,
  exhausting Lambda concurrent-execution
  reserves and throttling everything else in
  the account.
domain: lifecycle
severity: high
compliance:
  soc2: "CC7.4, A1.1"
  nist_800_53_r5: "SI-11, SC-5"
  fedramp_moderate: "SI-11"
  iso_27001_2022: "A.8.16"
  ccm_v4: ["BCR-08"]
scope_tags:
  - aws
  - stepfunctions
taxonomy:
  - compliance-mapping
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: persistence
remediation:
  description: >
    Map state without MaxConcurrency.
  action: >
    Set MaxConcurrency to a value that won't
    saturate downstream (e.g., 50 for Lambda
    workloads where reserved concurrency is
    1000). Tune based on Container Insights
    metrics on first run.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "asl": {
          "map_no_maxconcurrency_count": 0
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.asl.map_no_maxconcurrency_count
      op: gt
      value: 0
defect: >
  Map state without MaxConcurrency.
infection: >
  Unbounded fan-out exhausts downstream
  capacity; cascading throttle.
failure: >
  Concurrency cap missing.
tests:
  - name: missing fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          asl:
            map_no_maxconcurrency_count: 1
  - name: bounded passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          asl:
            map_no_maxconcurrency_count: 0
