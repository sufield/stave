dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.ASL.CATCH.STATES.ALL.001
name: Step Functions Catch Matches States.ALL Routing All Errors To Same Path
description: >
  ASL `Catch` clause matches `States.ALL` and
  routes every error type to the same handler.
  States.ALL conflates retryable transient
  errors with permanent ones (validation,
  permissions, malformed input) — the handler
  cannot distinguish "retry this" from "page
  on-call." Different error classes need
  different paths.
domain: lifecycle
severity: medium
compliance:
  soc2: "CC7.4"
  nist_800_53_r5: "SI-11"
  fedramp_moderate: "SI-11"
  iso_27001_2022: "A.8.16"
  ccm_v4: ["BCR-08"]
scope_tags:
  - aws
  - stepfunctions
taxonomy:
  - compliance-mapping
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: persistence
remediation:
  description: >
    Catch ErrorEquals: ["States.ALL"].
  action: >
    Replace with multiple Catch clauses keyed
    on specific ErrorEquals values
    (States.TaskFailed, States.Timeout,
    Lambda.Unknown, custom error names from
    the workflow).
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "asl": {
          "catch_states_all_count": 0
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.asl.catch_states_all_count
      op: gt
      value: 0
defect: >
  Catch matches States.ALL.
infection: >
  Error class lost; handler cannot distinguish
  failure types; retry logic / paging breaks.
failure: >
  Error-class fidelity lost.
tests:
  - name: states-all fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          asl:
            catch_states_all_count: 2
  - name: scoped catches passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          asl:
            catch_states_all_count: 0
