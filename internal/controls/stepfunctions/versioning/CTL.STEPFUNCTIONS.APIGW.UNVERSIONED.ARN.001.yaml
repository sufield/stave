dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.APIGW.UNVERSIONED.ARN.001
name: Step Functions API Gateway Integration Targets Unversioned State Machine ARN
description: >
  API Gateway integration with Step Functions
  uses the unversioned state machine ARN.
  Same failure mode as EventBridge
  unversioned: any new alias / version is
  exposed; canary deploys have no effect on
  the API GW caller path.
domain: governance
severity: medium
compliance:
  soc2: "CC8.1, A1.2"
  nist_800_53_r5: "CM-3"
  fedramp_moderate: "CM-3"
  iso_27001_2022: "A.8.32"
  ccm_v4: ["BCR-08"]
scope_tags:
  - aws
  - stepfunctions
taxonomy:
  - compliance-mapping
  - network-perimeter
subtractive_category:
  - S08
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: persistence
remediation:
  description: >
    API GW integration targets unversioned ARN.
  action: >
    Update integration request URI to use
    alias ARN. Pair API Gateway stage with
    state-machine alias for environment-
    aligned routing.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "deployment": {
          "apigw_targets_alias_arn": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.deployment.has_apigw_target
      op: eq
      value: true
    - field: properties.compute.deployment.apigw_targets_alias_arn
      op: eq
      value: false
defect: >
  API GW targets unversioned ARN.
infection: >
  New versions exposed via API GW caller
  immediately.
failure: >
  Caller-path canary bypassed.
tests:
  - name: unversioned fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          deployment:
            has_apigw_target: true
            apigw_targets_alias_arn: false
  - name: alias passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          deployment:
            has_apigw_target: true
            apigw_targets_alias_arn: true
