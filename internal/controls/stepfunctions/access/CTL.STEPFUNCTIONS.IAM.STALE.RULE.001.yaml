dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.IAM.STALE.RULE.001
name: Step Functions IAM Policy Has Stale Temporary Allow Rule
description: >
  Step Functions IAM policy contains a statement
  marked or commented as temporary (operator's
  IP, contractor's vendor CIDR, debugging
  exception) older than 90 days. Temporary rules
  accumulate as nobody owns removal; each is an
  unreviewed allow path on the workflow.
domain: governance
severity: medium
compliance:
  soc2: "CC6.1, CC8.1"
  nist_800_53_r5: "AC-6, CA-7"
  fedramp_moderate: "AC-6"
  iso_27001_2022: "A.5.15, A.8.27"
  ccm_v4: ["IAM-16", "GRC-08"]
scope_tags:
  - aws
  - stepfunctions
taxonomy:
  - compliance-mapping
  - trust-decay
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: persistence
remediation:
  description: >
    Stale temporary allow rule older than 90 days.
  action: >
    Quarterly access-review: identify temporary
    statements (Sids tagged temp- / commented),
    promote to permanent or remove. Encode
    expiry date in Sid for mechanical review.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "iam": {
          "stale_temp_rule_age_days": 30
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.iam.has_stale_temp_rule
      op: eq
      value: true
    - field: properties.compute.iam.stale_temp_rule_age_days
      op: gt
      value: 90
defect: >
  Temporary allow rule older than 90 days.
infection: >
  Original purpose forgotten; rule remains as
  unaudited allow path; review skips because
  reviewers don't know which are still needed.
failure: >
  Allow-path debt.
tests:
  - name: 180-day stale rule fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          iam:
            has_stale_temp_rule: true
            stale_temp_rule_age_days: 180
  - name: recent rule passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          iam:
            has_stale_temp_rule: true
            stale_temp_rule_age_days: 30
