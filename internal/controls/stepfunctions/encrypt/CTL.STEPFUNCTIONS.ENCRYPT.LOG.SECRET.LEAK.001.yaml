dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.ENCRYPT.LOG.SECRET.LEAK.001
name: Step Functions IncludeExecutionData Captures Secrets To CloudWatch Logs
description: >
  Step Functions has `IncludeExecutionData:
  true` on a workflow whose payloads contain
  secrets / PII / PHI without input/output
  redaction. Logs end up holding the
  sensitive data; anyone with CloudWatch Logs
  read access reads it. The right pattern is
  IncludeExecutionData: true PLUS explicit
  redaction (Pass state mapping that strips
  secret fields) before the log-captured
  states.
domain: encryption
severity: critical
compliance:
  soc2: "CC6.1, CC6.7"
  pci_dss_v4.0: "3.4.1, 3.5.1"
  hipaa: "164.312(a)(2)(iv)"
  nist_800_53_r5: "SC-28, SI-12"
  fedramp_moderate: "SC-28"
  iso_27001_2022: "A.5.34, A.8.24"
  ccm_v4: ["CEK-04", "DSP-04"]
scope_tags:
  - aws
  - stepfunctions
taxonomy:
  - compliance-mapping
  - encryption-at-rest
  - logging
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: exfiltration
remediation:
  description: >
    Workflow logs capture secrets without
    redaction.
  action: >
    Add a redaction Pass state that maps
    sensitive fields away from the payload
    before any state-with-Catch (and thus
    before logging captures the payload).
    Reference SecretsManager via
    `arn:aws:states:::aws-sdk:secretsmanager:
    getSecretValue` rather than embedding.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "encrypt": {
          "log_redacts_secrets": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.encrypt.payload_has_secrets
      op: eq
      value: true
    - field: properties.compute.encrypt.log_redacts_secrets
      op: eq
      value: false
defect: >
  Logs capture sensitive payload without
  redaction.
infection: >
  Secrets in CWL; readable by any role with
  logs:GetLogEvents.
failure: >
  Secret leak via observability path.
tests:
  - name: leak fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          encrypt:
            payload_has_secrets: true
            log_redacts_secrets: false
  - name: redacted passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          encrypt:
            payload_has_secrets: true
            log_redacts_secrets: true
