dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.LAMBDA.CALLBACK.NOHEARTBEAT.001
name: Step Functions Lambda Callback Function Doesn't Honor Heartbeat
description: >
  Step Functions Task uses Lambda with
  `.waitForTaskToken` callback pattern but
  the Lambda function code doesn't call
  `SendTaskHeartbeat` periodically before
  completion. If Task has HeartbeatSeconds
  set, Lambda exceeding it triggers
  `States.Heartbeat` even when Lambda is
  still doing valid work.
domain: lifecycle
severity: medium
compliance:
  soc2: "CC7.4"
  nist_800_53_r5: "SI-11"
  fedramp_moderate: "SI-11"
  iso_27001_2022: "A.8.16"
  ccm_v4: ["BCR-08"]
scope_tags:
  - aws
  - stepfunctions
taxonomy:
  - compliance-mapping
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: persistence
remediation:
  description: >
    Lambda callback doesn't send heartbeats.
  action: >
    Add periodic `SendTaskHeartbeat` calls in
    Lambda code (e.g., once per 30s in a
    long-running iteration). Or remove
    HeartbeatSeconds from the Task if no
    progress signal is needed.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "asl": {
          "lambda_callback_heartbeats": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.asl.lambda_uses_callback
      op: eq
      value: true
    - field: properties.compute.asl.lambda_callback_heartbeats
      op: eq
      value: false
defect: >
  Lambda callback function doesn't call
  SendTaskHeartbeat.
infection: >
  Task triggers heartbeat-timeout while
  Lambda is still working; spurious failure.
failure: >
  Callback contract broken.
tests:
  - name: no heartbeat fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          asl:
            lambda_uses_callback: true
            lambda_callback_heartbeats: false
  - name: heartbeats passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          asl:
            lambda_uses_callback: true
            lambda_callback_heartbeats: true
