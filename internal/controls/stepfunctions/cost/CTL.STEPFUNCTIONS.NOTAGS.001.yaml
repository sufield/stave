dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.NOTAGS.001
name: Step Functions State Machine Missing Cost / Environment / Compliance Tags
description: >
  Step Functions state machine has no
  `cost-center`, `team`, `owner`,
  `environment`, or `compliance-scope` tags.
  Cost allocation can't roll up by
  team / project; environment-class can't
  be determined from inventory; compliance
  scoping (HIPAA / PCI / SOC2 / GDPR)
  requires manual lookup per machine.
domain: governance
severity: low
compliance:
  soc2: "CC8.1"
  nist_800_53_r5: "CM-8, PM-3"
  fedramp_moderate: "CM-8"
  iso_27001_2022: "A.5.9, A.5.30"
  ccm_v4: ["GRC-08", "BCR-08"]
scope_tags:
  - aws
  - stepfunctions
taxonomy:
  - compliance-mapping
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: persistence
remediation:
  description: >
    State machine missing org-standard tags.
  action: >
    Apply tags: cost-center, team, owner,
    environment, compliance-scope. Activate
    AWS Cost Allocation Tags via Billing
    Console. Enforce via tag policy + SCP.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "cost": {
          "tags_complete": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.cost.tags_complete
      op: eq
      value: false
defect: >
  Required tags missing.
infection: >
  Cost / governance reporting requires manual
  per-machine lookup.
failure: >
  Governance metadata gap.
tests:
  - name: missing fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          cost:
            tags_complete: false
  - name: tagged passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          cost:
            tags_complete: true
