dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.ALARM.EXEC.TIME.SLO.001
name: Step Functions ExecutionTime Has No SLO Alarm
description: >
  No CloudWatch alarm on `ExecutionTime`
  bounded by an SLO (e.g., p99 < 60s).
  Long-running stuck executions accumulate
  invisibly; downstream consumers wait on
  results that arrive far past expected.
  Particularly important for synchronous
  Express patterns where the caller has its
  own timeout.
domain: detection
severity: medium
compliance:
  soc2: "CC7.2, A1.1"
  nist_800_53_r5: "AU-12"
  fedramp_moderate: "AU-12"
  iso_27001_2022: "A.8.16"
  ccm_v4: ["LOG-08"]
scope_tags:
  - aws
  - stepfunctions
taxonomy:
  - compliance-mapping
  - monitoring
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: detection_evasion
remediation:
  description: >
    No alarm on ExecutionTime SLO.
  action: >
    Alarm: ExecutionTime p99 > <SLO> sustained
    15min. Set SLO based on workflow's
    documented SLA.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "alarms": {
          "execution_time_slo_alarm": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.alarms.execution_time_slo_alarm
      op: eq
      value: false
defect: >
  No alarm on ExecutionTime SLO.
infection: >
  Latency drift unobserved; downstream timeout
  cascades.
failure: >
  Latency signal absent.
tests:
  - name: missing fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          alarms:
            execution_time_slo_alarm: false
  - name: present passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          alarms:
            execution_time_slo_alarm: true
