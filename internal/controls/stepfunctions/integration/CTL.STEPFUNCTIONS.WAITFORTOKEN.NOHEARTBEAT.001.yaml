dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.WAITFORTOKEN.NOHEARTBEAT.001
name: Step Functions .waitForTaskToken Without HeartbeatSeconds
description: >
  Step Functions Task using
  `.waitForTaskToken` integration has no
  `HeartbeatSeconds` configured. Worker can
  hang indefinitely; Step Functions waits
  forever (or until the workflow's overall
  TimeoutSeconds, if set). Heartbeat-based
  liveness check is the standard pattern;
  workers send `SendTaskHeartbeat` every N
  seconds.
domain: lifecycle
severity: high
compliance:
  soc2: "CC7.4, A1.2"
  nist_800_53_r5: "SI-11"
  fedramp_moderate: "SI-11"
  iso_27001_2022: "A.8.16"
  ccm_v4: ["BCR-08"]
scope_tags:
  - aws
  - stepfunctions
taxonomy:
  - compliance-mapping
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: persistence
remediation:
  description: >
    .waitForTaskToken without HeartbeatSeconds.
  action: >
    Add HeartbeatSeconds matching the
    worker's expected heartbeat interval +
    margin (e.g., worker heartbeats every 30s,
    HeartbeatSeconds: 60). Worker must call
    SendTaskHeartbeat within the interval.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "asl": {
          "waitfortoken_no_heartbeat_count": 0
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.asl.waitfortoken_no_heartbeat_count
      op: gt
      value: 0
defect: >
  .waitForTaskToken without heartbeat.
infection: >
  Worker hang = workflow stalled until
  overall timeout (if any) or forever.
failure: >
  Liveness check absent.
tests:
  - name: missing fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          asl:
            waitfortoken_no_heartbeat_count: 1
  - name: present passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          asl:
            waitfortoken_no_heartbeat_count: 0
