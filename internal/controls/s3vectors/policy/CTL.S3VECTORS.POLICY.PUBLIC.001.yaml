dsl_version: ctrl.v1
id: CTL.S3VECTORS.POLICY.PUBLIC.001
name: Vector Bucket Policy Must Not Permit Public Access
description: >
  S3 Vectors Vector Bucket policies must not grant access to
  anonymous or wildcard principals. Vector Buckets use the
  s3vectors: IAM namespace, which is separate from s3:.
  Organization-level S3 Block Public Access and RCPs scoped to
  s3:* do not cover s3vectors: actions. A public policy on a
  Vector Bucket exposes vector indexes and the data they encode —
  embedding vectors can leak the semantic content of the source
  documents.
domain: exposure
severity: critical
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["DSP-17", "IVS-03"]
scope_tags:
  - aws
  - s3vectors
taxonomy:
  - identity-perimeter
  - trust-boundary
  - data-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3vectors_vector_bucket
params:
  attack_stage: exfiltration
observation_fields:
  - storage.kind
  - storage.access.has_wildcard_principal
remediation:
  description: >
    Vector Bucket policy grants access to anonymous or wildcard
    principals. S3 Block Public Access does not cover the s3vectors:
    namespace. Embedding vectors can leak semantic content.
  action: >
    Remove wildcard Principal statements from the Vector Bucket
    policy. Add aws:PrincipalOrgID condition. Verify SCP/RCP
    coverage for s3vectors: actions exists independently.
  example: |
    {
      "storage": {
        "kind": "vector_bucket",
        "access": {
          "has_wildcard_principal": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: vector_bucket
    - field: properties.storage.access.has_wildcard_principal
      op: eq
      value: true
tests:
  - name: vector bucket with wildcard principal fires
    verdict: VIOLATION
    asset:
      asset_id: arn:aws:s3vectors:us-east-1:123456789012:bucket/ml-embeddings
      asset_type: aws_s3vectors_vector_bucket
      vendor: aws
      properties:
        storage:
          kind: vector_bucket
          access:
            has_wildcard_principal: true
  - name: vector bucket with restricted policy passes
    verdict: PASS
    asset:
      asset_id: arn:aws:s3vectors:us-east-1:123456789012:bucket/ml-embeddings
      asset_type: aws_s3vectors_vector_bucket
      vendor: aws
      properties:
        storage:
          kind: vector_bucket
          access:
            has_wildcard_principal: false
