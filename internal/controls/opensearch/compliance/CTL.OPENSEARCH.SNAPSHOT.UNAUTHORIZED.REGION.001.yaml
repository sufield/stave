dsl_version: ctrl.v1
id: CTL.OPENSEARCH.SNAPSHOT.UNAUTHORIZED.REGION.001
name: OpenSearch Snapshot Cross-Region Replication In Unauthorized Region
description: >
  OpenSearch snapshot S3 cross-region replication
  destination is a region not on the org's
  authorized list. Same data-residency violation
  as primary domain in unauthorized region —
  but via the backup path. Backup data is
  identical to primary; the destination region
  matters as much as the primary.
domain: governance
severity: high
compliance:
  soc2: "CC1.5, CC6.1"
  pci_dss_v4.0: "12.10.1"
  hipaa: "164.310(d)"
  nist_800_53_r5: "AC-3, CA-7"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.5.10, A.8.13"
  ccm_v4: ["DSP-04", "DSP-19"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: persistence
remediation:
  description: >
    Snapshot CRR destination in unauthorized
    region.
  action: >
    Reconfigure CRR to authorized region.
    Delete existing replica copies that live
    in the unauthorized region.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "governance": {
          "snapshot_region_authorized": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.governance.snapshot_region_authorized
      op: eq
      value: false
defect: >
  Snapshot CRR destination unauthorized.
infection: >
  Backup data leaves authorized region;
  residency violated.
failure: >
  Backup-path residency breach.
tests:
  - name: unauth crr fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          governance:
            snapshot_region_authorized: false
  - name: authorized crr passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          governance:
            snapshot_region_authorized: true
