dsl_version: ctrl.v1
id: CTL.OPENSEARCH.ALARM.KMS.INACCESSIBLE.001
name: OpenSearch KMS Key Access Has No CloudWatch Alarm
description: >
  OpenSearch domain has no CloudWatch alarm on
  `KMSKeyError` or `KMSKeyInaccessible` metrics.
  When the at-rest encryption KMS key becomes
  unreachable (key disabled, policy change,
  cross-account grant revoked), the domain
  cannot decrypt indices — search and indexing
  fail until access is restored. Without an
  alarm, on-call is paged by customer impact
  rather than the cause.
domain: detection
severity: critical
compliance:
  soc2: "CC7.2, A1.2"
  nist_800_53_r5: "AU-12, SC-12"
  fedramp_moderate: "AU-12"
  iso_27001_2022: "A.8.16, A.8.24"
  ccm_v4: ["LOG-08", "CEK-09"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
  - monitoring
subtractive_category:
  - S05
  - S09
  - S10
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: detection_evasion
remediation:
  description: >
    No alarm on KMS key accessibility.
  action: >
    Alarms: KMSKeyError >= 1 (page),
    KMSKeyInaccessible >= 1 (page). On fire,
    check key state, key policy, key grants in
    cross-account scenarios.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "alarms": {
          "kms_alarms_complete": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.alarms.kms_alarms_complete
      op: eq
      value: false
defect: >
  KMS-key alarm set incomplete.
infection: >
  Key access break causes domain to refuse
  decrypt; queries/indexes fail; on-call learns
  via customer outage rather than KMS event.
failure: >
  Encryption-key health signal absent.
tests:
  - name: missing kms alarms fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          alarms:
            kms_alarms_complete: false
  - name: complete kms alarms passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          alarms:
            kms_alarms_complete: true
