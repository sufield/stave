dsl_version: ctrl.v1
id: CTL.OPENSEARCH.ALARM.FREESTORAGE.001
name: OpenSearch Free Storage Space Has No CloudWatch Alarm
description: >
  OpenSearch domain has no CloudWatch alarm on
  the `FreeStorageSpace` metric. Once
  FreeStorageSpace drops below the cluster's
  flood-stage watermark (default 95% utilization),
  OpenSearch sets indices read-only and writes
  fail. Recovery requires manual intervention
  and is slow.
domain: detection
severity: high
compliance:
  soc2: "CC7.2, A1.1"
  nist_800_53_r5: "AU-12, SI-4"
  fedramp_moderate: "AU-12"
  iso_27001_2022: "A.8.16"
  ccm_v4: ["LOG-08"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
  - monitoring
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: detection_evasion
remediation:
  description: >
    No alarm on FreeStorageSpace.
  action: >
    Alarm: FreeStorageSpace < 25% of one-node
    capacity sustained 15min (warn). Page at
    < 10%. Pair with auto-scaling or storage
    expansion plan.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "alarms": {
          "freestorage_alarm_present": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.alarms.freestorage_alarm_present
      op: eq
      value: false
defect: >
  No alarm on FreeStorageSpace.
infection: >
  Storage fills silently; flood-stage hits
  without warning; cluster goes read-only.
failure: >
  Pre-saturation signal absent.
tests:
  - name: missing alarm fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          alarms:
            freestorage_alarm_present: false
  - name: alarm present passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          alarms:
            freestorage_alarm_present: true
