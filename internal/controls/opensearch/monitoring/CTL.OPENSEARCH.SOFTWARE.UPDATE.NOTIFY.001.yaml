dsl_version: ctrl.v1
id: CTL.OPENSEARCH.SOFTWARE.UPDATE.NOTIFY.001
name: OpenSearch Service Software Update Events Not Subscribed
description: >
  OpenSearch domain has no EventBridge rule
  subscribed to `aws.opensearch` /
  `ServiceSoftwareUpdate` events. Service software
  updates appear in the AWS Health dashboard but
  unless wired to a notification channel,
  operators don't see them until the update
  becomes mandatory or causes a maintenance-
  window outage.
domain: detection
severity: medium
compliance:
  soc2: "CC7.2, CC8.1"
  nist_800_53_r5: "SI-2, AU-12"
  fedramp_moderate: "SI-2"
  iso_27001_2022: "A.8.16, A.8.32"
  ccm_v4: ["LOG-08", "TVM-04"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
subtractive_category:
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: detection_evasion
remediation:
  description: >
    No EventBridge rule on
    ServiceSoftwareUpdate.
  action: >
    Create EventBridge rule: source
    aws.opensearch, detail-type
    "AWS Service Event"; route to SNS / Slack /
    PagerDuty depending on severity. Subscribe
    on-call.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "alarms": {
          "software_update_notification_subscribed": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.alarms.software_update_notification_subscribed
      op: eq
      value: false
defect: >
  No EventBridge subscription on software update
  events.
infection: >
  Software updates pile up; cluster runs older
  patch sets; mandatory updates eventually force
  a window the team hasn't planned for.
failure: >
  Patch-currency signal absent.
tests:
  - name: no subscription fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          alarms:
            software_update_notification_subscribed: false
  - name: subscription present passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          alarms:
            software_update_notification_subscribed: true
