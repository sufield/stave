dsl_version: ctrl.v1
id: CTL.OPENSEARCH.ALARM.5XX.001
name: OpenSearch 5xx HTTP Errors Have No CloudWatch Alarm
description: >
  OpenSearch domain has no CloudWatch alarm on
  HTTP 5xx error rate (`5xx` metric). 5xx surge
  indicates internal cluster errors — query
  parser failures, JVM out-of-memory, plugin
  crashes — and is the most direct user-impact
  signal. Without an alarm, error spikes appear
  in dashboards but do not page anyone.
domain: detection
severity: high
compliance:
  soc2: "CC7.2, A1.1"
  nist_800_53_r5: "AU-12, SI-4"
  fedramp_moderate: "AU-12"
  iso_27001_2022: "A.8.16"
  ccm_v4: ["LOG-08"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
  - monitoring
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: detection_evasion
remediation:
  description: >
    No alarm on 5xx rate.
  action: >
    Alarm: 5xx > 1% of total request volume for
    5min sustained (page). Pair with 4xx alarm
    for client-side errors.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "alarms": {
          "http_5xx_alarm_present": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.alarms.http_5xx_alarm_present
      op: eq
      value: false
defect: >
  No alarm on 5xx error rate.
infection: >
  Internal-error spikes invisible; user impact
  surfaces via downstream complaint chain.
failure: >
  User-facing error signal absent.
tests:
  - name: missing alarm fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          alarms:
            http_5xx_alarm_present: false
  - name: alarm present passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          alarms:
            http_5xx_alarm_present: true
