dsl_version: ctrl.v1
id: CTL.OPENSEARCH.ALARM.THREADPOOL.001
name: OpenSearch Threadpool Saturation Has No CloudWatch Alarms
description: >
  OpenSearch domain has no CloudWatch alarms on
  threadpool saturation metrics:
  `ThreadpoolSearchQueue`, `ThreadpoolWriteQueue`,
  or `ThreadpoolSearchRejected`. Threadpool
  saturation precedes user-visible latency or
  rejects; without alarms, the cluster appears
  to slow down for no traceable reason.
domain: detection
severity: medium
compliance:
  soc2: "CC7.2, A1.1"
  nist_800_53_r5: "AU-12, SI-4"
  fedramp_moderate: "AU-12"
  iso_27001_2022: "A.8.16"
  ccm_v4: ["LOG-08"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
  - monitoring
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: detection_evasion
remediation:
  description: >
    Threadpool saturation alarms incomplete.
  action: >
    Alarms: ThreadpoolSearchQueue > 100 (warn),
    ThreadpoolWriteQueue > 50 (warn),
    ThreadpoolSearchRejected > 0 (page).
  example: |
    {
      "search_service": {
        "kind": "domain",
        "alarms": {
          "threadpool_alarms_complete": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.alarms.threadpool_alarms_complete
      op: eq
      value: false
defect: >
  Threadpool alarm set incomplete.
infection: >
  Saturation accumulates; latency / rejects
  appear; root-cause investigation slow.
failure: >
  Capacity-saturation signal absent.
tests:
  - name: incomplete threadpool alarms fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          alarms:
            threadpool_alarms_complete: false
  - name: complete threadpool alarms passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          alarms:
            threadpool_alarms_complete: true
