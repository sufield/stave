dsl_version: ctrl.v1
id: CTL.OPENSEARCH.SNAPSHOT.REPO.PATH.COLLISION.001
name: OpenSearch Has Multiple Snapshot Repositories Pointing To Same S3 Path
description: >
  OpenSearch domain has more than one registered
  snapshot repository pointing to the same S3
  bucket / base path. Snapshot writes from each
  repo race to overwrite the snapshot index
  (`index-N`) file; reads return stale data.
  Most commonly seen after operators register
  a new repository to debug an issue with the
  old one and never delete the old reference.
domain: governance
severity: medium
compliance:
  soc2: "CC8.1"
  nist_800_53_r5: "CP-9, CM-2"
  fedramp_moderate: "CP-9"
  iso_27001_2022: "A.8.13"
  ccm_v4: ["BCR-08"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
  - trust-decay
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: persistence
remediation:
  description: >
    Multiple repos point to same S3 path.
  action: >
    Identify the duplicate via
    GET _snapshot/_all; delete the unused
    repository:
      DELETE _snapshot/<old-name>
    Verify via test snapshot create + restore.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "backup": {
          "repo_path_collision": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.backup.repo_path_collision
      op: eq
      value: true
defect: >
  Two or more snapshot repos at same S3 path.
infection: >
  Snapshot writes race; index-N corruption
  possible; restore unpredictable.
failure: >
  Backup integrity at risk via concurrent
  writers.
tests:
  - name: collision fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          backup:
            repo_path_collision: true
  - name: unique path passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          backup:
            repo_path_collision: false
