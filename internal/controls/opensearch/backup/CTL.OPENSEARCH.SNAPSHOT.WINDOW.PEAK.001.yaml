dsl_version: ctrl.v1
id: CTL.OPENSEARCH.SNAPSHOT.WINDOW.PEAK.001
name: OpenSearch Automated Snapshot Window In Production Peak Hours
description: >
  OpenSearch domain's automated snapshot hour
  falls within the production peak traffic window.
  Snapshot operations consume IO and JVM
  resources; running them during peak adds
  latency to user-facing queries / writes.
  Default `automated_snapshot_start_hour: 0` (UTC)
  often falls during US business hours for
  US-West / US-East workloads.
domain: governance
severity: low
compliance:
  soc2: "CC8.1, A1.1"
  nist_800_53_r5: "CP-9, CM-3"
  fedramp_moderate: "CP-9"
  iso_27001_2022: "A.5.30, A.8.13"
  ccm_v4: ["BCR-08"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: persistence
remediation:
  description: >
    Auto-snapshot hour in production peak.
  action: >
    Set automated_snapshot_start_hour to off-peak
    UTC hour matching the workload's traffic
    pattern. Verify with describe-domain-config.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "backup": {
          "snapshot_window_offpeak": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.backup.snapshot_window_offpeak
      op: eq
      value: false
defect: >
  Auto-snapshot window falls in production peak.
infection: >
  Snapshot IO contends with user traffic;
  latency drift during snapshot window.
failure: >
  User-impact during routine backups.
tests:
  - name: peak window fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          backup:
            snapshot_window_offpeak: false
  - name: offpeak window passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          backup:
            snapshot_window_offpeak: true
