dsl_version: ctrl.v1
id: CTL.OPENSEARCH.PAINLESS.INLINE.001
name: OpenSearch Inline Painless Scripts Enabled
description: >
  OpenSearch domain has inline Painless script
  execution enabled. Painless is sandboxed but
  the sandbox has had documented escape
  primitives in past CVEs; allowing untrusted
  callers to submit inline scripts is an
  accepted attack surface. Production-tier
  domains should restrict to stored, signed
  scripts.
domain: exposure
severity: high
compliance:
  soc2: "CC6.1, CC7.1"
  pci_dss_v4.0: "6.2"
  nist_800_53_r5: "SI-2, AC-3"
  fedramp_moderate: "SI-2"
  iso_27001_2022: "A.8.8"
  ccm_v4: ["TVM-08"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: execution
remediation:
  description: >
    Inline Painless enabled.
  action: >
    Set script.allowed_types: "stored" via
    cluster settings. Migrate any inline-
    script callers to stored scripts.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "plugin": {
          "inline_scripts_enabled": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.plugin.inline_scripts_enabled
      op: eq
      value: true
defect: >
  Inline Painless scripts enabled.
infection: >
  Untrusted callers submit scripts; sandbox
  escape primitives reachable.
failure: >
  Script-execution attack surface open.
tests:
  - name: inline on fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          plugin:
            inline_scripts_enabled: true
  - name: stored only passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          plugin:
            inline_scripts_enabled: false
