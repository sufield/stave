dsl_version: ctrl.v1
id: CTL.OPENSEARCH.PLUGIN.UNTRUSTED.001
name: OpenSearch Custom Plugin From Untrusted Source Or Signature Verification Off
description: >
  OpenSearch domain runs a custom plugin from
  an unverified source, or has plugin signature
  verification disabled. Plugins execute with
  full cluster privileges; supply-chain attack
  on a plugin compromises the entire domain.
domain: exposure
severity: high
compliance:
  soc2: "CC6.1, CC7.1"
  pci_dss_v4.0: "6.4"
  nist_800_53_r5: "SI-7, SI-2"
  fedramp_moderate: "SI-7"
  iso_27001_2022: "A.8.8, A.8.34"
  ccm_v4: ["TVM-04", "TVM-08"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: execution
remediation:
  description: >
    Plugin from untrusted source or signature
    verification off.
  action: >
    Vet plugin source / build pipeline; enable
    signature verification. Pin plugin version
    to a known-good build. Audit plugin list
    against an organizational allowlist.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "plugin": {
          "all_signed_trusted": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.plugin.all_signed_trusted
      op: eq
      value: false
defect: >
  Plugin from untrusted source / unsigned.
infection: >
  Supply-chain compromise on plugin =
  cluster-level code execution.
failure: >
  Trust boundary on plugins absent.
tests:
  - name: untrusted fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          plugin:
            all_signed_trusted: false
  - name: trusted passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          plugin:
            all_signed_trusted: true
