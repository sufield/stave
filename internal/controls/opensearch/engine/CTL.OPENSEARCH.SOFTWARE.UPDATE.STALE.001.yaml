dsl_version: ctrl.v1
id: CTL.OPENSEARCH.SOFTWARE.UPDATE.STALE.001
name: OpenSearch Service Software Update Available For Over 30 Days
description: >
  OpenSearch domain has an available service
  software update that has been pending for
  more than 30 days. AWS publishes updates
  fixing security and stability issues; ignoring
  them past the 30-day window indicates patch
  cadence is not being maintained.
domain: governance
severity: high
compliance:
  soc2: "CC7.1, CC8.1"
  pci_dss_v4.0: "6.2"
  nist_800_53_r5: "SI-2"
  fedramp_moderate: "SI-2"
  iso_27001_2022: "A.8.8"
  ccm_v4: ["TVM-04"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
  - trust-decay
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: persistence
remediation:
  description: >
    Software update pending > 30 days.
  action: >
    Apply via StartServiceSoftwareUpdate during
    next maintenance window. Establish a 7-day
    SLO for non-critical, 24-hour SLO for
    security updates.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "engine": {
          "software_update_pending_days": 7
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.engine.software_update_pending_days
      op: gt
      value: 30
defect: >
  Pending software update > 30 days.
infection: >
  Patch cadence broken; vulnerabilities
  accumulate.
failure: >
  Operational hygiene gap.
tests:
  - name: 60d pending fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          engine:
            software_update_pending_days: 60
  - name: 7d pending passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          engine:
            software_update_pending_days: 7
