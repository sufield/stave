dsl_version: ctrl.v1
id: CTL.OPENSEARCH.OSIS.SECRETS.PLAIN.001
name: OpenSearch Ingestion Pipeline Stores Secrets In Plaintext Config
description: >
  OpenSearch Ingestion pipeline configuration
  contains plaintext credentials (API keys,
  database passwords, third-party tokens) rather
  than referencing AWS Secrets Manager. The
  pipeline definition is auditable / readable
  by anyone with osis:GetPipeline; secrets
  exfiltrate via inventory query.
domain: governance
severity: critical
compliance:
  soc2: "CC6.1"
  pci_dss_v4.0: "8.3.2"
  nist_800_53_r5: "IA-5, SC-28"
  fedramp_moderate: "IA-5"
  iso_27001_2022: "A.5.16, A.8.5"
  ccm_v4: ["IAM-09"]
scope_tags:
  - aws
  - opensearch
  - osis
taxonomy:
  - compliance-mapping
  - credential-lifecycle
subtractive_category:
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_osis_pipeline
params:
  attack_stage: credential_access
remediation:
  description: >
    OSIS pipeline has plaintext secrets.
  action: >
    Move secrets to Secrets Manager; reference
    via ${aws_secrets:<secret-name>} in pipeline
    config. Rotate any secrets that were
    historically stored in plaintext.
  example: |
    {
      "search_service": {
        "kind": "pipeline",
        "config": {
          "secrets_externalized": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: pipeline
    - field: properties.search_service.config.secrets_externalized
      op: eq
      value: false
defect: >
  Pipeline config has plaintext secrets.
infection: >
  Anyone with osis:GetPipeline reads the
  credentials.
failure: >
  Credentials in inventory.
tests:
  - name: plaintext fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:osis:us-east-1:111122223333:pipeline/prod"
      asset_type: aws_osis_pipeline
      vendor: aws
      properties:
        search_service:
          kind: pipeline
          config:
            secrets_externalized: false
  - name: secrets manager passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:osis:us-east-1:111122223333:pipeline/prod"
      asset_type: aws_osis_pipeline
      vendor: aws
      properties:
        search_service:
          kind: pipeline
          config:
            secrets_externalized: true
