dsl_version: ctrl.v1
id: CTL.OPENSEARCH.AUDIT.SECURITY.CHANGES.SHARED.001
name: OpenSearch Security-Plugin Changes Share Retention With Operational Logs
description: >
  OpenSearch security-plugin changes (FGAC role
  edits, internal-user mutations, role-mapping
  updates) are written to the same CloudWatch
  Log group as operational audit events with
  shared retention. High-volume operational
  events push security-changes events out of
  retention before the regulatory window for
  security-event preservation closes. Security-
  changes need their own retention bucket.
domain: governance
severity: medium
compliance:
  soc2: "CC7.2, CC8.1"
  pci_dss_v4.0: "10.5.1"
  nist_800_53_r5: "AU-11, CM-3"
  fedramp_moderate: "AU-11"
  iso_27001_2022: "A.5.33, A.8.34"
  ccm_v4: ["LOG-04"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: detection_evasion
remediation:
  description: >
    Security-plugin changes share retention with
    operational audit.
  action: >
    Configure separate CloudWatch destination for
    security-changes events (or use a metric
    filter to copy them to a longer-retention
    group). Apply 7y retention for security-
    changes if SOX-scoped, 6y if HIPAA-scoped.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "audit": {
          "security_changes_separate_retention": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.audit.security_changes_separate_retention
      op: eq
      value: false
defect: >
  Security-plugin changes share retention with
  operational audit.
infection: >
  Security-relevant events (role grants, master-
  user changes, FGAC config changes) age out
  faster than they should. Investigation of
  privilege-escalation incidents fails after the
  retention boundary.
failure: >
  Critical-event retention shortfall. The most
  audit-relevant category gets the shortest
  retention budget.
tests:
  - name: shared retention fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          audit:
            security_changes_separate_retention: false
  - name: separate retention passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          audit:
            security_changes_separate_retention: true
