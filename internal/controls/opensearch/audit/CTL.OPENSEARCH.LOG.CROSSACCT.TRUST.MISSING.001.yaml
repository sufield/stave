dsl_version: ctrl.v1
id: CTL.OPENSEARCH.LOG.CROSSACCT.TRUST.MISSING.001
name: OpenSearch Cross-Account Log Delivery Role Lacks Required Trust
description: >
  OpenSearch domain configured for cross-account
  log delivery (logs go to a CloudWatch group in a
  central observability account) — but the
  delivery role in the destination account does
  not include the OpenSearch service principal in
  its trust policy. Logs are generated in the
  domain's account but cannot be assumed-into the
  destination account; events drop silently.
  Common after re-org / account splits where the
  central account got the role created without
  trust for the new domain accounts.
domain: detection
severity: high
compliance:
  soc2: "CC7.2"
  pci_dss_v4.0: "10.4.1"
  nist_800_53_r5: "AU-12"
  fedramp_moderate: "AU-12"
  iso_27001_2022: "A.8.15"
  ccm_v4: ["LOG-04", "IAM-09"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - confused-deputy
  - logging
  - trust-boundary
subtractive_category:
  - S05
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: detection_evasion
remediation:
  description: >
    Cross-account log delivery role lacks
    required trust.
  action: >
    Update the delivery role's trust policy in
    the destination account to include es.
    amazonaws.com plus the source account ID:
      "Principal": {"Service": "es.amazonaws.com"},
      "Condition": {
        "StringEquals": {"aws:SourceAccount": "111122223333"}
      }
  example: |
    {
      "search_service": {
        "kind": "domain",
        "audit": {
          "crossaccount_log_role_trust_complete": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.audit.crossaccount_log_delivery
      op: eq
      value: true
    - field: properties.search_service.audit.crossaccount_log_role_trust_complete
      op: eq
      value: false
defect: >
  Cross-account log delivery role missing trust
  for the source domain.
infection: >
  Domain audit / slow logs generated locally;
  cross-account delivery silently fails. The
  destination team monitors their group, sees no
  events, assumes nothing of interest happened.
failure: >
  Silent cross-account logging gap. Worse than
  no central logging because central team
  presumes coverage.
tests:
  - name: missing trust fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          audit:
            crossaccount_log_delivery: true
            crossaccount_log_role_trust_complete: false
  - name: complete trust passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          audit:
            crossaccount_log_delivery: true
            crossaccount_log_role_trust_complete: true
