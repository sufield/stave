dsl_version: ctrl.v1
id: CTL.OPENSEARCH.POLICY.WILDCARD.OPEN.IP.001
name: OpenSearch Access Policy Wildcard Principal With Open IP Condition
description: >
  OpenSearch domain access policy uses
  `Principal: "*"` with an `aws:SourceIp` condition
  that resolves to `0.0.0.0/0` (or includes a `/0`
  CIDR among allowed ranges). The condition is
  intended to lock the policy down to a known IP set,
  but the actual CIDR is open or includes an open
  catch-all. This is functionally identical to a
  wildcard principal with no condition. Often the
  result of operator copy-paste from public examples
  or a default `0.0.0.0/0` left from initial setup.
domain: exposure
severity: critical
compliance:
  soc2: "CC6.1"
  pci_dss_v4.0: "1.3.1, 1.3.2"
  nist_800_53_r5: "AC-3, AC-6"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.8.20"
  ccm_v4: ["DSP-17", "IAM-16"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - least-privilege
  - network-perimeter
  - trust-boundary
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: initial_access
  blast_radius:
    type: data_exposure
    scope: account
    multiplier: 3.0
remediation:
  description: >
    Access policy permits wildcard principal with an
    aws:SourceIp condition that includes 0.0.0.0/0.
  action: >
    Replace 0.0.0.0/0 with the actual trusted CIDR
    list (corporate gateway, NAT, VPN). For VPC
    domains, use aws:SourceVpc or aws:SourceVpce
    instead of IP-based conditions. Audit access
    policies during quarterly review:
      aws es describe-domain-config --domain-name <name>
        --query 'DomainConfig.AccessPolicies'
  example: |
    {
      "search_service": {
        "kind": "domain",
        "access": {
          "policy_allows_wildcard": true,
          "policy_open_ip_condition": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.access.policy_allows_wildcard
      op: eq
      value: true
    - field: properties.search_service.access.policy_open_ip_condition
      op: eq
      value: true
defect: >
  Access policy combines wildcard principal with
  open (0.0.0.0/0) IP condition.
infection: >
  Any source IP can authenticate as the wildcard
  principal. The IP condition appears to provide
  network-level scoping in the policy review but
  does not restrict access. Audit logs show policy
  conditions present, masking the actual openness.
failure: >
  Functionally public access policy with the
  appearance of restriction. Worse than no policy
  because reviewers see a condition and skip detail.
tests:
  - name: wildcard with open ip fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            policy_allows_wildcard: true
            policy_open_ip_condition: true
  - name: wildcard with restricted ip passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            policy_allows_wildcard: true
            policy_open_ip_condition: false
