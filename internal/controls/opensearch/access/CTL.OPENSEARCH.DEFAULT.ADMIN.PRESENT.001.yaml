dsl_version: ctrl.v1
id: CTL.OPENSEARCH.DEFAULT.ADMIN.PRESENT.001
name: OpenSearch Default admin User Not Removed After Master Setup
description: >
  OpenSearch domain's internal user database still
  contains the default `admin` user after the FGAC
  master setup completed. The default user is
  documented, has well-known capabilities, and is
  a primary target for credential-stuffing /
  default-password attacks. Once the operational
  master user is in place, the default admin should
  be removed.
domain: governance
severity: high
compliance:
  soc2: "CC6.1"
  pci_dss_v4.0: "2.2, 8.2.1"
  nist_800_53_r5: "IA-5, AC-2"
  fedramp_moderate: "IA-5"
  iso_27001_2022: "A.5.16, A.8.5"
  ccm_v4: ["IAM-09"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: credential_access
remediation:
  description: >
    Default admin user remains in internal user
    DB.
  action: >
    Delete the default admin user via Dashboards
    Security plugin or opensearch-cli. Confirm
    via _security/api/internalusers — admin should
    not appear.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "access": {
          "default_admin_user_present": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.access.default_admin_user_present
      op: eq
      value: true
defect: >
  Default admin user not removed.
infection: >
  Attacker tries `admin` with a list of common
  passwords. If the password was never changed
  (or set to a weak value during initial setup),
  the attacker has FGAC admin.
failure: >
  Known-default account on production domain.
  First step of any attacker recon catalog.
tests:
  - name: default admin present fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            default_admin_user_present: true
  - name: default admin removed passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            default_admin_user_present: false
