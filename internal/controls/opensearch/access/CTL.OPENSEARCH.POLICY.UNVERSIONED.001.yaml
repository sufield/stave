dsl_version: ctrl.v1
id: CTL.OPENSEARCH.POLICY.UNVERSIONED.001
name: OpenSearch Access Policy Not Version-Pinned In IaC
description: >
  OpenSearch domain access policy is managed
  out-of-band — applied via console or ad-hoc CLI
  without an IaC source of truth (Terraform /
  CloudFormation / CDK). History of policy
  changes is unreviewable; rollback to a
  known-good state requires reconstructing the
  policy from CloudTrail. Access-policy drift is
  the most common path to silent permission
  expansion.
domain: governance
severity: medium
compliance:
  soc2: "CC8.1, CC7.1"
  nist_800_53_r5: "CM-2, CM-3, CM-8"
  fedramp_moderate: "CM-2"
  iso_27001_2022: "A.5.16, A.8.32"
  ccm_v4: ["GRC-08", "IAM-16"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
  - logging
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: persistence
  blast_radius:
    type: detection
    scope: account
    multiplier: 1.5
remediation:
  description: >
    Access policy not managed in IaC; changes
    untracked.
  action: >
    Move the policy under Terraform / CDK /
    CloudFormation. Use a `policy_version` tag or
    a Sid suffix to track the deployed version.
    Configure CI/CD to detect drift via
    `terraform plan` and alert on diff.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "access": {
          "policy_managed_in_iac": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.access.policy_managed_in_iac
      op: eq
      value: false
defect: >
  Access policy not under IaC management.
infection: >
  Policy changes happen via console; nobody
  reviews the diff. Permissions expand without
  approval; unauthorized statement additions go
  unnoticed until incident review.
failure: >
  Audit-trail break. Access-policy state at any
  point in time is whatever the most recent
  console operator left it as.
tests:
  - name: policy not in IaC fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            policy_managed_in_iac: false
  - name: policy in IaC passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            policy_managed_in_iac: true
