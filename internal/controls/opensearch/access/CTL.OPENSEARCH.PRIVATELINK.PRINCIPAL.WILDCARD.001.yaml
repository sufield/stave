dsl_version: ctrl.v1
id: CTL.OPENSEARCH.PRIVATELINK.PRINCIPAL.WILDCARD.001
name: OpenSearch PrivateLink Endpoint Policy Permits Any Principal
description: >
  OpenSearch domain accessed via AWS PrivateLink
  / Interface VPC Endpoint has an endpoint policy
  with `Principal: "*"` and no scoping conditions.
  The endpoint policy is the only network-layer
  filter on what callers reach the domain through
  the VPC endpoint; with a wildcard principal, any
  IAM identity in the consumer VPC's account can
  invoke the domain via the PrivateLink path. Often
  default state — the endpoint policy is auto-created
  open and never tightened.
domain: exposure
severity: high
compliance:
  soc2: "CC6.1, CC6.6"
  pci_dss_v4.0: "1.3.4"
  nist_800_53_r5: "SC-7, AC-3"
  fedramp_moderate: "SC-7"
  iso_27001_2022: "A.8.20"
  ccm_v4: ["IVS-03", "IAM-16"]
  owasp_subtractive: "S02"
  subtractive_tier: "deletion"
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
  - trust-boundary
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: lateral_movement
  blast_radius:
    type: data_exposure
    scope: account
    multiplier: 2.0
remediation:
  description: >
    PrivateLink VPC endpoint policy permits any
    principal.
  action: >
    Replace Principal: "*" with the specific IAM
    role / user ARNs that need PrivateLink access.
    Add aws:SourceVpc / aws:SourceVpce conditions
    to scope to the intended consumer VPCs:
      "Condition": {
        "StringEquals": {
          "aws:SourceVpce": "vpce-0123456789abcdef0"
        }
      }
  example: |
    {
      "search_service": {
        "kind": "domain",
        "access": {
          "privatelink_endpoint_policy_wildcard": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.access.privatelink_enabled
      op: eq
      value: true
    - field: properties.search_service.access.privatelink_endpoint_policy_wildcard
      op: eq
      value: true
defect: >
  PrivateLink endpoint policy permits Principal: "*"
  with no scoping conditions.
infection: >
  Any IAM identity in any consumer VPC's account
  can reach the domain via the PrivateLink path.
  Compromise of one workload in the consumer VPC
  becomes access to the OpenSearch data, regardless
  of intent. Domain access policy still applies but
  is commonly Principal: "*" too because operators
  expected the endpoint policy to do the scoping.
failure: >
  Network-layer scoping intended but absent.
  PrivateLink reduces the attack surface to "any
  identity in the consumer VPC's account" rather
  than "the specific identities the integration
  needs."
tests:
  - name: privatelink wildcard fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            privatelink_enabled: true
            privatelink_endpoint_policy_wildcard: true
  - name: privatelink scoped principals passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            privatelink_enabled: true
            privatelink_endpoint_policy_wildcard: false
