dsl_version: ctrl.v1
id: CTL.OPENSEARCH.POLICY.ACTION.WILDCARD.001
name: OpenSearch Access Policy Grants Action Wildcard To Non-Admin Role
description: >
  OpenSearch domain access policy grants `es:*` on
  `Resource: "*"` (or domain ARN with `/*`) to a
  principal that is not the admin / break-glass
  role. The wildcard includes data-plane reads,
  writes, deletes, and management API calls
  (UpdateDomainConfig, DeleteDomain). Non-admin
  roles getting `es:*` is the most common
  privilege-escalation gap on managed domains.
domain: exposure
severity: critical
compliance:
  soc2: "CC6.1, CC6.3"
  pci_dss_v4.0: "7.2.1, 7.2.2"
  nist_800_53_r5: "AC-6, AC-3"
  fedramp_moderate: "AC-6"
  iso_27001_2022: "A.5.15, A.8.20"
  ccm_v4: ["IAM-02", "IAM-16"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: privilege_escalation
  blast_radius:
    type: data_destruction
    scope: account
    multiplier: 3.0
remediation:
  description: >
    Access policy grants es:* to a non-admin role.
  action: >
    Replace es:* with the minimum action set the
    role actually needs (e.g., es:ESHttpGet,
    es:ESHttpPost on /_search). Reserve es:* for
    a documented break-glass role with separate
    sign-off requirements.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "access": {
          "policy_action_wildcard_nonadmin": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.access.policy_action_wildcard_nonadmin
      op: eq
      value: true
defect: >
  Non-admin role granted es:* on the domain.
infection: >
  Any compromise of the non-admin role yields full
  data-plane and control-plane access. Attacker can
  read all indices, modify mappings, delete indices,
  run UpdateDomainConfig to flip security settings,
  or call DeleteDomain.
failure: >
  Privilege amplification. Compromise of any role
  with es:* on the domain ≈ compromise of the
  domain itself.
tests:
  - name: nonadmin with es-star fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            policy_action_wildcard_nonadmin: true
  - name: scoped actions passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            policy_action_wildcard_nonadmin: false
