dsl_version: ctrl.v1
id: CTL.OPENSEARCH.MASTER.PASSWORD.AGE.001
name: OpenSearch Master User Password Older Than 90 Days
description: >
  OpenSearch FGAC password-based master user
  credential has not been rotated in over 90
  days. Long-lived shared credentials accumulate
  exposure risk: leak surface (logs, vault
  history, operator memory), revocation blast
  radius (rotation breaks every consuming
  service), and audit-trail opacity (multiple
  callers sharing one credential). Even when
  password auth is unavoidable, rotation cadence
  bounds the leakage window.
domain: governance
severity: medium
compliance:
  soc2: "CC6.1, CC6.6"
  pci_dss_v4.0: "8.3.6, 8.3.9"
  nist_800_53_r5: "IA-5"
  fedramp_moderate: "IA-5"
  iso_27001_2022: "A.5.16, A.8.5"
  ccm_v4: ["IAM-09"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - trust-decay
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: credential_access
remediation:
  description: >
    Master password not rotated > 90 days.
  action: >
    Rotate via UpdateDomainConfig --advanced-
    security-options master-user-password.
    Coordinate with consuming services to update
    their stored credential. Long-term: migrate
    to IAM-role-based master.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "access": {
          "master_password_age_days": 30
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.access.fgac_enabled
      op: eq
      value: true
    - field: properties.search_service.access.master_user_iam_role
      op: eq
      value: false
    - field: properties.search_service.access.master_password_age_days
      op: gt
      value: 90
defect: >
  Master password age > 90 days.
infection: >
  Long-lived credential's leak window is the full
  age. If the credential leaked at any point in
  that window (logs, Git, vault history,
  ex-employee memory), the leak is live.
failure: >
  Stale credential. Compliance and sensible
  rotation cadence violated.
tests:
  - name: master password 180d fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            fgac_enabled: true
            master_user_iam_role: false
            master_password_age_days: 180
  - name: recently rotated passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            fgac_enabled: true
            master_user_iam_role: false
            master_password_age_days: 30
