dsl_version: ctrl.v1
id: CTL.OPENSEARCH.PUBLIC.001
name: OpenSearch Domain Must Not Be Publicly Accessible
description: >
  OpenSearch domains must not have public endpoints accessible from
  the internet. A publicly accessible domain allows anyone to query,
  index, or enumerate data without network-level restrictions. The
  Darkbeam breach (2023) exposed 3.8 billion records from an
  Elasticsearch instance left unprotected on the public internet.
  Domains must be deployed within a VPC.
domain: exposure
severity: critical
compliance:
  soc2: "CC6.1"
  pci_dss_v4.0: "1.3.1"
  nist_800_53_r5: "AC-3"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.8.20"
  ccm_v4: ["DSP-17", "IAM-16", "IVS-03"]
  owasp_subtractive: "S03"
  subtractive_tier: "deletion"
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
  - network-isolation
  - network-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_opensearch_domain]
params:
  attack_stage: initial_access
remediation:
  description: >
    OpenSearch domain is publicly accessible from the internet.
    Anyone can query or enumerate the data.
  action: >
    Migrate the domain to a VPC. Create a new domain with VPC
    configuration specifying private subnets and security groups.
    Use VPN, bastion, or AWS PrivateLink for authorized access.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "access": {
          "publicly_accessible": false,
          "vpc_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.access.publicly_accessible
      op: eq
      value: true
