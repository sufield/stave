dsl_version: ctrl.v1
id: CTL.OPENSEARCH.VPCE.FOREIGN.PRINCIPAL.001
name: OpenSearch VPC Endpoint Service Permits Foreign AWS Principals
description: >
  OpenSearch domain's PrivateLink-style VPC endpoint
  service permits principals outside the domain's
  organization or trusted-account list. The endpoint
  service is a network-level grant — once a foreign
  account creates a VPC endpoint to it, traffic from
  that account's VPC reaches the domain regardless
  of the resource policy's `Principal` clause. The
  endpoint service ACL must enumerate only known
  trusted account IDs.
domain: exposure
severity: high
compliance:
  soc2: "CC6.1, CC6.6"
  pci_dss_v4.0: "1.3.4"
  nist_800_53_r5: "SC-7, AC-4"
  fedramp_moderate: "SC-7"
  iso_27001_2022: "A.8.20, A.8.22"
  ccm_v4: ["IVS-03", "IVS-09"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
  - network-perimeter
  - trust-boundary
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: initial_access
  blast_radius:
    type: data_exposure
    scope: cross_account
    multiplier: 3.0
remediation:
  description: >
    OpenSearch VPC endpoint service permits foreign
    AWS principals.
  action: >
    Restrict the endpoint service ACL to the trusted
    account list:
      aws ec2 modify-vpc-endpoint-service-permissions
        --service-id <id>
        --remove-allowed-principals <foreign-account-arns>
    Audit periodically; foreign-account ARNs added
    for one-off integrations get left behind.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "access": {
          "vpc_endpoint_service": {
            "permits_foreign_principals": false
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.access.vpc_endpoint_service.permits_foreign_principals
      op: eq
      value: true
defect: >
  VPC endpoint service ACL includes principals from
  outside the trusted-account list.
infection: >
  Foreign accounts can create VPC endpoints to the
  domain's endpoint service. From their endpoint, all
  traffic to the domain is permitted at the network
  layer; the resource policy's Principal clause is
  the only remaining check, and it commonly says
  Principal: "*" with conditions tied to the
  intended VPC.
failure: >
  Network-level cross-account ingress. Domain is
  reachable from any foreign account whose VPC
  creates an endpoint to the endpoint service.
tests:
  - name: foreign principal in vpce service fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            vpc_endpoint_service:
              permits_foreign_principals: true
  - name: trusted-only vpce service passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            vpc_endpoint_service:
              permits_foreign_principals: false
