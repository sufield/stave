dsl_version: ctrl.v1
id: CTL.OPENSEARCH.OVERPROVISIONED.001
name: OpenSearch Domain Sustained CPU Below Right-Sizing Threshold
description: >
  OpenSearch domain has sustained CPU < 5%
  averaged across data nodes over the last
  30 days; clearly over-provisioned. Right-
  sizing recommendations from Trusted Advisor
  / Compute Optimizer go unread; the
  organization pays for headroom that has
  never been used.
domain: governance
severity: low
compliance:
  soc2: "CC8.1"
  nist_800_53_r5: "CM-7, SC-5"
  fedramp_moderate: "CM-7"
  iso_27001_2022: "A.8.6"
  ccm_v4: ["BCR-08"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: persistence
remediation:
  description: >
    Domain over-provisioned.
  action: >
    Right-size to next smaller instance class
    via blue-green. Verify capacity headroom on
    new sizing before next traffic peak.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "cost": {
          "is_overprovisioned": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.cost.is_overprovisioned
      op: eq
      value: true
defect: >
  Domain over-provisioned.
infection: >
  Capacity paid for but unused.
failure: >
  Right-sizing skipped.
tests:
  - name: overprovisioned fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          cost:
            is_overprovisioned: true
  - name: rightsized passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          cost:
            is_overprovisioned: false
