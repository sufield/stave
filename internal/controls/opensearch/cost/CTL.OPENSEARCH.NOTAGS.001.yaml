dsl_version: ctrl.v1
id: CTL.OPENSEARCH.NOTAGS.001
name: OpenSearch Domain Missing Cost-Allocation Or Compliance Tags
description: >
  OpenSearch domain has no `cost-center`,
  `team`, `owner`, or `data-classification`
  tag. Cost allocation can't roll up by
  team / project; compliance scoping (HIPAA /
  PCI / SOC2 / GDPR) requires manual lookup
  for each domain. Org-standard tag set is
  the foundation of governance reporting.
domain: governance
severity: low
compliance:
  soc2: "CC8.1"
  nist_800_53_r5: "CM-8, PM-3"
  fedramp_moderate: "CM-8"
  iso_27001_2022: "A.5.9, A.5.30"
  ccm_v4: ["GRC-08", "BCR-08"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: persistence
remediation:
  description: >
    Domain missing org-standard tags.
  action: >
    Apply tags: cost-center, team, owner,
    data-classification, compliance-scope,
    environment. Activate AWS Cost Allocation
    Tags via Billing Console.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "governance": {
          "tags_complete": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.governance.tags_complete
      op: eq
      value: false
defect: >
  Domain tags incomplete.
infection: >
  Cost / compliance reporting requires manual
  lookup per domain.
failure: >
  Governance metadata gap.
tests:
  - name: missing tags fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          governance:
            tags_complete: false
  - name: tagged passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          governance:
            tags_complete: true
