dsl_version: ctrl.v1
id: CTL.OPENSEARCH.ROLLOVER.MISSING.001
name: OpenSearch Time-Series Pattern Lacks Rollover Policy Or Index Template
description: >
  OpenSearch domain has time-series index pattern
  (e.g., `logs-2026.01.01`, `metrics-*`) without
  a rollover policy, or rollover policy with
  size-only condition (no max-doc-count fallback),
  or index template missing. New indices grow
  past recommended shard size (50 GB), or never
  rollover when expected, or arrive without
  expected mappings.
domain: governance
severity: medium
compliance:
  soc2: "CC8.1"
  nist_800_53_r5: "CM-2, CP-2"
  fedramp_moderate: "CM-2"
  iso_27001_2022: "A.5.30"
  ccm_v4: ["BCR-08"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: persistence
remediation:
  description: >
    Rollover / template incomplete for
    time-series.
  action: >
    Create index template with mapping,
    settings, and ILM/ISM rollover alias.
    Configure rollover with both size (50gb) AND
    max_docs (200M) conditions for safety.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "ism": {
          "rollover_complete": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.ism.has_timeseries_indices
      op: eq
      value: true
    - field: properties.search_service.ism.rollover_complete
      op: eq
      value: false
defect: >
  Rollover / template incomplete.
infection: >
  Indices grow oversized or never rollover;
  shard size > 50 GB; recovery slow.
failure: >
  Index lifecycle drift.
tests:
  - name: rollover incomplete fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          ism:
            has_timeseries_indices: true
            rollover_complete: false
  - name: rollover complete passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          ism:
            has_timeseries_indices: true
            rollover_complete: true
