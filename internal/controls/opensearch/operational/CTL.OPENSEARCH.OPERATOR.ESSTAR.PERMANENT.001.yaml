dsl_version: ctrl.v1
id: CTL.OPENSEARCH.OPERATOR.ESSTAR.PERMANENT.001
name: OpenSearch Operator Break-Glass Role With es:* Permanently Active
description: >
  Organization has a break-glass IAM role with
  `es:*` permissions that is permanently
  assumable rather than gated behind a
  just-in-time elevation flow. Permanent
  break-glass = always-on cluster-admin
  capability for any caller in the trust
  policy. Compromise of any of those callers
  yields domain admin without further
  escalation.
domain: governance
severity: high
compliance:
  soc2: "CC6.1, CC6.3"
  pci_dss_v4.0: "7.2.4"
  nist_800_53_r5: "AC-2, AC-6"
  fedramp_moderate: "AC-2"
  iso_27001_2022: "A.5.15, A.5.18"
  ccm_v4: ["IAM-02", "IAM-09"]
scope_tags:
  - aws
  - opensearch
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: persistence
remediation:
  description: >
    Break-glass role permanently active.
  action: >
    Move break-glass behind JIT elevation
    (AWS IAM Identity Center / Permission
    Sets with approval workflow). Track
    elevation events in audit log.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "governance": {
          "breakglass_jit_only": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.governance.breakglass_jit_only
      op: eq
      value: false
defect: >
  Break-glass role permanently active.
infection: >
  Always-on admin path; any compromise of
  trusted callers yields admin.
failure: >
  No elevation friction for the highest
  permission tier.
tests:
  - name: permanent fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          governance:
            breakglass_jit_only: false
  - name: jit-only passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          governance:
            breakglass_jit_only: true
