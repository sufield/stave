dsl_version: ctrl.v1
id: CTL.DATASYNC.ROLE.OVERBROAD.001
name: DataSync Task Role Exceeds Required Permissions
description: >
  DataSync task's IAM role has permissions beyond what the
  data transfer requires. DataSync tasks need access to the
  specific source and destination locations (S3 buckets, EFS
  filesystems, FSx shares, or NFS/SMB endpoints) and
  CloudWatch Logs for task logging. Any action outside this
  set — s3:*, efs:*, iam:PassRole — means the DataSync
  agent can access storage beyond its transfer scope.
domain: identity
severity: medium
compliance:
  soc2: "CC6.1, CC6.3"
  nist_800_53_r5: "AC-6"
  pci_dss_v4.0: "7.2"
  fedramp_moderate: "AC-6"
  iso_27001_2022: "A.5.15, A.8.2"
  ccm_v4: ["IAM-04", "IAM-14"]
scope_tags:
  - aws
  - datasync
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - least-privilege
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_datasync_task
params:
  attack_stage: privilege_escalation
  blast_radius:
    type: control
    scope: account
remediation:
  description: >
    DataSync task role has permissions beyond the transfer's
    required scope.
  action: >
    Scope the DataSync role to the specific source and
    destination location ARNs. Use separate roles for tasks
    with different source-destination pairs. Remove wildcard
    storage actions.
  example: |
    {
      "compute": {
        "kind": "datasync_task",
        "datasync": {
          "role_exceeds_required": false,
          "role_arn": "arn:aws:iam::111122223333:role/datasync-s3-to-efs-scoped"
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: datasync_task
    - field: properties.compute.datasync.role_exceeds_required
      op: eq
      value: true
defect: >
  DataSync task role grants actions beyond the data
  transfer's required permissions.
infection: >
  DataSync tasks transfer data between storage locations.
  An overbroad role means a compromised or reconfigured
  DataSync task can read or write to storage beyond its
  source-destination pair. DataSync agents run on EC2 or
  on-premises — the role is the credential boundary for
  data movement.
failure: >
  DataSync task role blast radius expansion. Reconfigured
  or compromised transfer accesses storage outside its
  source-destination pair.
tests:
  - name: overbroad DataSync role fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:datasync:us-east-1:111122223333:task/task-abc123"
      asset_type: aws_datasync_task
      vendor: aws
      properties:
        compute:
          kind: datasync_task
          datasync:
            role_exceeds_required: true
            role_arn: "arn:aws:iam::111122223333:role/datasync-full-access"
            excess_actions:
              - "s3:*"
              - "efs:*"
  - name: scoped DataSync role passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:datasync:us-east-1:111122223333:task/task-abc123"
      asset_type: aws_datasync_task
      vendor: aws
      properties:
        compute:
          kind: datasync_task
          datasync:
            role_exceeds_required: false
            role_arn: "arn:aws:iam::111122223333:role/datasync-s3-to-efs-scoped"
