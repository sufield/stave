dsl_version: ctrl.v1
id: CTL.SNS.AUDIT.DATAEVENTS.001
name: CloudTrail Data Events Not Enabled for SNS
description: >
  CloudTrail is not configured to log SNS data events
  (Publish). Management events (CreateTopic, DeleteTopic,
  SetTopicAttributes, Subscribe) are recorded by default but
  Publish operations are not. For alarm notification topics,
  data events answer the legitimacy question: was that
  notification published by a real CloudWatch alarm or by an
  attacker leveraging an over-permissive topic policy? For
  topics carrying business events, data events provide the
  per-message audit trail required for compliance regimes
  that require knowing who sent what. Cost note: SNS Publish
  data events generate moderate log volume — lower than SQS
  (which has both Send and Receive per message) but still
  significant for high-traffic topics; the control is medium
  severity because the cost tradeoff is real.
domain: detection
severity: medium
compliance:
  cis_aws_v3.0: "3.2"
  soc2: "CC7.1, CC7.2"
  nist_800_53_r5: "AU-2, AU-3, AU-12"
  pci_dss_v4.0: "10.1, 10.2"
  fedramp_moderate: "AU-2"
  hipaa: "164.312(b)"
  iso_27001_2022: "A.8.15, A.8.16"
  ccm_v4: ["LOG-02", "LOG-13"]
scope_tags:
  - aws
  - sns
taxonomy:
  - compliance-mapping
  - confused-deputy
  - logging
subtractive_category:
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_sns_topic
params:
  attack_stage: detection_evasion
remediation:
  description: >
    SNS topic has no CloudTrail data-event coverage. Publish
    operations are unrecorded.
  action: >
    Add an SNS data-event selector to a CloudTrail trail
    covering this topic:
    aws cloudtrail put-event-selectors --trail-name <trail>
    --advanced-event-selectors
    '[{"Name":"SNS data events","FieldSelectors":
    [{"Field":"eventCategory","Equals":["Data"]},
    {"Field":"resources.type","Equals":["AWS::SNS::Topic"]},
    {"Field":"resources.ARN","Equals":["<topic-arn>"]}]}]'.
    Restrict the resource ARN selector to security-sensitive
    topics (alarm-notification, financial-event,
    compliance-event topics) so the data-event volume cost
    stays bounded. Verify the trail's S3 destination is in
    the same organization with appropriate access controls.
  example: |
    {
      "messaging": {
        "kind": "topic",
        "sns": {
          "topic_arn": "arn:aws:sns:us-east-1:111122223333:alerts",
          "cloudtrail_data_events": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.messaging.kind
      op: eq
      value: topic
    - field: properties.messaging.sns.cloudtrail_data_events
      op: eq
      value: false
defect: >
  SNS topic is not covered by a CloudTrail data-event
  selector; Publish operations are unrecorded.
infection: >
  Management events (CreateTopic, DeleteTopic,
  SetTopicAttributes) are logged in CloudTrail by default.
  Data events — the Publish operations — are not. Without
  data events, who published which message to which topic is
  unknown. For an alarm notification topic, this is the
  legitimacy question: when an alarm notification was
  published, was it published by the legitimate CloudWatch
  alarm or by an attacker leveraging a confused-deputy gap
  in the topic policy? Without data events the records are
  indistinguishable: both produce a notification at the
  subscriber. Data events provide the per-Publish principal,
  source IP, and request parameters that distinguish
  legitimate from injected events.
failure: >
  No message-level audit trail. Publish operations are
  unrecorded; legitimate and injected notifications are
  indistinguishable in post-incident review.
tests:
  - name: topic without data events fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:sns:us-east-1:111122223333:alerts"
      asset_type: aws_sns_topic
      vendor: aws
      properties:
        messaging:
          kind: topic
          sns:
            topic_arn: "arn:aws:sns:us-east-1:111122223333:alerts"
            cloudtrail_data_events: false
  - name: topic with data events passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:sns:us-east-1:111122223333:alerts"
      asset_type: aws_sns_topic
      vendor: aws
      properties:
        messaging:
          kind: topic
          sns:
            topic_arn: "arn:aws:sns:us-east-1:111122223333:alerts"
            cloudtrail_data_events: true
