dsl_version: ctrl.v1
id: CTL.ORG.SCP.CLOUDFORMATION.MACRO.001
name: SCP Must Restrict CloudFormation Macro Usage
description: >
  An SCP must restrict CloudFormation macro usage to prevent
  resource injection via external macros. CloudFormation macros
  are Lambda-backed and can transform templates at deploy time.
  A macro from an external account can inject arbitrary resources
  into a stack.
  Technique: Wiz "Resource injection in CloudFormation template".
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "SA-12"
  soc2: "CC8.1"
  ccm_v4: ["AIS-06"]
scope_tags:
  - aws
  - iam
  - organizations
  - cloudformation
taxonomy:
  - account-governance
payer_exempt: true
payer_compensating_control: null
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_organization
params:
  attack_stage: execution
observation_fields:
  - identity.kind
  - identity.scp.restricts_cloudformation_macros
remediation:
  description: >
    No SCP restricts CloudFormation macro usage. External
    macros can inject resources into stacks.
  action: >
    Add an SCP restricting cloudformation:CreateStack and
    cloudformation:CreateChangeSet with conditions limiting
    macro sources to trusted accounts.
  example: |
    {
      "identity": {
        "kind": "organization",
        "scp": {
          "restricts_cloudformation_macros": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: organization
    - field: properties.identity.scp.restricts_cloudformation_macros
      op: ne
      value: true
tests:
  - name: "no macro restriction fires"
    verdict: VIOLATION
    asset:
      asset_id: "o-abc123def4"
      asset_type: aws_organization
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            restricts_cloudformation_macros: false
  - name: "macro restriction passes"
    verdict: PASS
    asset:
      asset_id: "o-abc123def4"
      asset_type: aws_organization
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            restricts_cloudformation_macros: true
