dsl_version: ctrl.v1
id: CTL.ORG.SCP.S3NAMESPACE.001
name: SCP Does Not Enforce S3 Account-Regional Namespace
description: >
  Organization SCPs do not enforce the S3 account-regional namespace
  for new bucket creation. Without this enforcement, services that
  auto-create buckets with predictable names (Glue, SageMaker, CDK,
  Athena, Beanstalk, EMR Studio, CodeStar) use the global namespace,
  where an attacker who knows the account ID can pre-create the bucket
  in an unused region. The account-regional namespace (buckets in the
  format {prefix}-{account-id}-{region}-an) prevents cross-account
  name squatting by construction. An SCP requiring the
  s3:x-amz-bucket-namespace condition on s3:CreateBucket is the
  structural fix for the entire Bucket Monopoly attack class.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "CM-7"
  soc2: "CC6.6"
  ccm_v4: ["DSP-04"]
scope_tags:
  - aws
  - organizations
  - s3
taxonomy:
  - account-governance
payer_exempt: true
payer_compensating_control: null
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_organization
params:
  attack_stage: initial_access
observation_fields:
  - organization.kind
  - organization.scp.enforces_s3_account_regional_namespace
remediation:
  description: >
    Organization SCPs do not enforce S3 account-regional namespace.
    Predictable-name buckets remain squattable in unused regions.
  action: >
    Add an SCP denying s3:CreateBucket unless
    s3:x-amz-bucket-namespace matches the account-regional format.
    This prevents all future buckets from using the global namespace,
    eliminating the Bucket Monopoly attack surface for Glue, SageMaker,
    CDK, Athena, Beanstalk, and other services that auto-create
    predictable-name buckets.
  example: |
    {
      "organization": {
        "kind": "scp_policy_set",
        "scp": {
          "enforces_s3_account_regional_namespace": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.organization.kind
      op: eq
      value: scp_policy_set
    - field: properties.organization.scp.enforces_s3_account_regional_namespace
      op: ne
      value: true
tests:
  - name: "no namespace enforcement fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:organizations::111122223333:organization/o-abc123"
      asset_type: aws_organization
      vendor: aws
      properties:
        organization:
          kind: scp_policy_set
          scp:
            enforces_s3_account_regional_namespace: false
  - name: "namespace enforcement passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:organizations::444455556666:organization/o-def456"
      asset_type: aws_organization
      vendor: aws
      properties:
        organization:
          kind: scp_policy_set
          scp:
            enforces_s3_account_regional_namespace: true
