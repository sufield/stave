dsl_version: ctrl.v1
id: CTL.ORG.RCP.KMSSECRETSPERIMETER.001
name: "RCP Does Not Restrict KMS and Secrets Manager External Access"
description: >
  No RCP restricts KMS key usage and Secrets Manager access
  from principals outside the organization. Without this RCP,
  a KMS key policy or Secrets Manager resource policy that
  grants access to an external account is effective — the
  external principal can decrypt data or read secrets even if
  no identity policy in the org grants them access. RCPs are
  the only mechanism that overrides resource-based policies
  at the organizational level. The RCP should deny kms:* and
  secretsmanager:* when aws:PrincipalOrgID is not the
  organization's ID.
domain: identity
severity: critical
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["DSP-04", "IAM-10"]
scope_tags:
  - aws
  - organizations
  - kms
taxonomy:
  - account-governance
  - identity-perimeter
  - encryption-at-rest
payer_exempt: true
payer_compensating_control: null
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_organization
params:
  attack_stage: exfiltration
observation_fields:
  - organization.kind
  - organization.rcp.denies_kms_secrets_external
remediation:
  description: >
    No RCP restricts KMS and Secrets Manager access from
    external principals.
  action: >
    Create an RCP that denies kms:Decrypt, kms:Encrypt,
    kms:GenerateDataKey, kms:ReEncryptFrom, kms:ReEncryptTo,
    kms:CreateGrant, secretsmanager:GetSecretValue,
    secretsmanager:DescribeSecret when
    aws:PrincipalOrgID is not the organization's ID.
    Exempt AWS service principals that need cross-account
    key usage (e.g., for cross-account S3 replication with
    KMS).
  example: |
    {
      "organization": {
        "kind": "rcp_policy_set",
        "rcp": {
          "denies_kms_secrets_external": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.organization.kind
      op: eq
      value: rcp_policy_set
    - field: properties.organization.rcp.denies_kms_secrets_external
      op: ne
      value: true
defect: >
  No RCP restricts KMS and Secrets Manager from external access.
infection: >
  KMS key policies and Secrets Manager resource policies that
  grant external principal access are effective. An external
  account can use organization KMS keys to decrypt data or read
  secrets — even if the org admin didn't intend to grant that
  access (e.g., a developer added a cross-account key policy
  for debugging and forgot to remove it).
failure: >
  Attacker compromises an external account that has a KMS key
  grant. Uses the key to decrypt S3 objects encrypted with that
  key. Or reads production secrets via a Secrets Manager resource
  policy grant. The org's identity-based controls (SCPs) don't
  apply because the caller is outside the org — only an RCP can
  enforce the perimeter.
tests:
  - name: "no KMS/secrets perimeter fires"
    verdict: VIOLATION
    asset:
      asset_id: "o-abc123def4"
      asset_type: aws_organization
      vendor: aws
      properties:
        organization:
          kind: rcp_policy_set
          rcp:
            denies_kms_secrets_external: false
  - name: "KMS/secrets perimeter passes"
    verdict: PASS
    asset:
      asset_id: "o-abc123def4"
      asset_type: aws_organization
      vendor: aws
      properties:
        organization:
          kind: rcp_policy_set
          rcp:
            denies_kms_secrets_external: true
