dsl_version: ctrl.v1
id: CTL.ORG.RCP.CONFUSEDDEPUTY.001
name: "RCP Does Not Enforce Source Conditions Against Confused Deputy"
description: >
  No RCP enforces aws:SourceOrgID or aws:SourceAccount
  conditions on resource-facing actions. Without this RCP,
  resources can be accessed via confused deputy attacks — an
  AWS service acting on behalf of an external principal
  accesses resources in the organization because the resource
  policy trusts the service principal without verifying the
  source account. The RCP should deny resource actions when
  aws:SourceOrgID is not the organization's ID (for
  service-to-service calls).
domain: identity
severity: high
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["IAM-10"]
scope_tags:
  - aws
  - organizations
taxonomy:
  - account-governance
  - identity-perimeter
  - trust-boundary
payer_exempt: true
payer_compensating_control: null
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_organization
params:
  attack_stage: initial_access
observation_fields:
  - organization.kind
  - organization.rcp.denies_external_source
remediation:
  description: >
    No RCP enforces source conditions against confused
    deputy attacks.
  action: >
    Create an RCP that denies resource-facing actions
    when aws:SourceOrgID is not the organization's ID.
    This complements the PrincipalOrgID RCP by covering
    service-to-service call paths.
  example: |
    {
      "organization": {
        "kind": "rcp_policy_set",
        "rcp": {
          "denies_external_source": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.organization.kind
      op: eq
      value: rcp_policy_set
    - field: properties.organization.rcp.denies_external_source
      op: ne
      value: true
tests:
  - name: "no source condition enforcement fires"
    verdict: VIOLATION
    asset:
      asset_id: "o-abc123def4"
      asset_type: aws_organization
      vendor: aws
      properties:
        organization:
          kind: rcp_policy_set
          rcp:
            denies_external_source: false
  - name: "source condition enforcement passes"
    verdict: PASS
    asset:
      asset_id: "o-abc123def4"
      asset_type: aws_organization
      vendor: aws
      properties:
        organization:
          kind: rcp_policy_set
          rcp:
            denies_external_source: true
