dsl_version: ctrl.v1
id: CTL.ORG.RCP.S3.ACLDISABLED.001
name: "RCP Does Not Enforce S3 ACL Disabled on Bucket Creation"
description: >
  No RCP enforces BucketOwnerEnforced object ownership on new
  S3 buckets. S3 ACLs are a legacy access control mechanism and
  a persistent source of public exposure. BucketOwnerEnforced
  disables ACLs entirely. Without this RCP, developers can create
  buckets with ACLs enabled and grant public access via ACL —
  bypassing bucket policies and BPA. The RCP should deny
  s3:CreateBucket when s3:x-amz-object-ownership is not
  BucketOwnerEnforced.
domain: governance
severity: high
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["DSP-01"]
scope_tags:
  - aws
  - organizations
  - s3
taxonomy:
  - account-governance
  - data-protection
payer_exempt: true
payer_compensating_control: null
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_organization
params:
  attack_stage: exfiltration
observation_fields:
  - organization.kind
  - organization.rcp.enforces_s3_acl_disabled
remediation:
  description: >
    No RCP enforces ACL-disabled (BucketOwnerEnforced) object
    ownership on new S3 bucket creation.
  action: >
    Create an RCP that denies s3:CreateBucket with condition
    "s3:x-amz-object-ownership" != "BucketOwnerEnforced".
    Attach to the organization root.
  example: |
    {
      "organization": {
        "kind": "rcp_policy_set",
        "rcp": {
          "enforces_s3_acl_disabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.organization.kind
      op: eq
      value: rcp_policy_set
    - field: properties.organization.rcp.enforces_s3_acl_disabled
      op: ne
      value: true
defect: >
  No RCP enforces ACL-disabled ownership on S3 bucket creation.
infection: >
  New S3 buckets can be created with ACLs enabled. ACL-based
  access grants bypass bucket policies and are harder to audit.
  A bucket with ACLs enabled can be made publicly readable via
  a single PutBucketAcl or PutObjectAcl call.
failure: >
  Developer creates a bucket with ObjectWriter ownership, then
  a third-party integration sets a public-read ACL on uploaded
  objects. The bucket policy denies public access but the ACL
  grant takes effect because ACLs are enabled. Data exposure
  via direct S3 URL.
tests:
  - name: "no ACL enforcement fires"
    verdict: VIOLATION
    asset:
      asset_id: "o-abc123def4"
      asset_type: aws_organization
      vendor: aws
      properties:
        organization:
          kind: rcp_policy_set
          rcp:
            enforces_s3_acl_disabled: false
  - name: "ACL enforcement passes"
    verdict: PASS
    asset:
      asset_id: "o-abc123def4"
      asset_type: aws_organization
      vendor: aws
      properties:
        organization:
          kind: rcp_policy_set
          rcp:
            enforces_s3_acl_disabled: true
