dsl_version: ctrl.v1
id: CTL.ORG.EXISTS.001
name: Account Must Be Member of an AWS Organization
description: >
  AWS account is standalone — not a member of an AWS Organization.
  Farris traces the multi-account strategy back to the CodeSpaces
  incident. A standalone account has no SCPs, no RCPs, no
  centralized root management, no organizational CloudTrail, and
  no service-linked roles for cross-account governance. It is the
  pre-2017 security posture. The collector sets the
  in_organization flag on the account summary asset.
domain: governance
severity: high
compliance:
  cis_aws_v3.0: "1.1"
  nist_800_53_r5: "AC-6(5)"
  soc2: "CC6.6"
  ccm_v4: ["IAM-02"]
scope_tags:
  - aws
  - organizations
taxonomy:
  - compliance-mapping
  - account-governance
subtractive_category:
  - S02
  - S05
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_account_summary
params:
  attack_stage: initial_access
observation_fields:
  - account.in_organization
remediation:
  description: >
    Account is not a member of an AWS Organization. No
    organizational controls (SCPs, RCPs, centralized logging)
    are available.
  action: >
    Create an AWS Organization and add this account as a member,
    or join an existing Organization. Enable all features to get
    access to SCPs, consolidated billing, and centralized governance.
  example: |
    {
      "account": {
        "in_organization": true
      }
    }
unsafe_predicate:
  all:
    - field: properties.account.in_organization
      op: ne
      value: true
defect: >
  Account is standalone with no organizational governance.
infection: >
  A standalone account cannot benefit from SCPs (preventive
  guardrails), organizational CloudTrail (centralized logging),
  or centralized root management. Every security control must
  be configured individually.
failure: >
  Account compromise has no organizational backstop. No SCP
  prevents privilege escalation, no org trail captures events,
  and no centralized team can respond to the incident.
tests:
  - name: "standalone account fires"
    verdict: VIOLATION
    asset:
      asset_id: "111122223333"
      asset_type: aws_account_summary
      vendor: aws
      properties:
        account:
          in_organization: false
  - name: "org member account passes"
    verdict: PASS
    asset:
      asset_id: "444455556666"
      asset_type: aws_account_summary
      vendor: aws
      properties:
        account:
          in_organization: true
