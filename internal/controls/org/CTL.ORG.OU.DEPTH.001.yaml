dsl_version: ctrl.v1
id: CTL.ORG.OU.DEPTH.001
name: OU Hierarchy Must Not Be Excessively Deep
description: >
  The organizational unit hierarchy exceeds 4 levels deep.
  AWS Organizations supports up to 5 levels of OU nesting.
  Deep hierarchies make SCP inheritance difficult to reason
  about — each level can add Deny statements that interact
  with higher-level SCPs in non-obvious ways. A flatter
  structure (2-3 levels) is easier to audit and less likely
  to contain SCP blind spots.
domain: governance
severity: low
compliance:
  nist_800_53_r5: "CM-6"
  soc2: "CC6.1"
  ccm_v4: ["GRC-01"]
scope_tags:
  - aws
  - organizations
taxonomy:
  - account-governance
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_organization]
params:
  attack_stage: discovery
  max_ou_depth: 4
observation_fields:
  - organization.kind
  - organization.ou_depth
remediation:
  description: >
    OU hierarchy is deeper than 4 levels. SCP
    inheritance is difficult to audit.
  action: >
    Flatten the OU hierarchy. Consolidate nested OUs
    where the SCP distinction between levels is minimal.
  example: |
    {
      "organization": {
        "kind": "org_config",
        "ou_depth": 3
      }
    }
unsafe_predicate:
  all:
    - field: properties.organization.kind
      op: eq
      value: org_config
    - field: properties.organization.ou_depth
      op: gt
      value: 4
tests:
  - name: "5-level deep OU fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:organizations::111122223333:organization/o-abc123"
      asset_type: aws_organization
      vendor: aws
      properties:
        organization:
          kind: org_config
          ou_depth: 5
  - name: "3-level OU passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:organizations::111122223333:organization/o-abc123"
      asset_type: aws_organization
      vendor: aws
      properties:
        organization:
          kind: org_config
          ou_depth: 3
