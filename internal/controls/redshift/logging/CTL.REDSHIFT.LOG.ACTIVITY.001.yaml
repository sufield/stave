dsl_version: ctrl.v1
id: CTL.REDSHIFT.LOG.ACTIVITY.001
name: Redshift Must Log User Activity
description: Redshift user activity logging must be enabled to record SQL
  statements.
domain: audit
severity: medium
compliance:
  nist_800_53_r5: AU-12
  soc2: CC7.1
  ccm_v4:
  - LOG-03
scope_tags:
- aws
- redshift
taxonomy:
  - compliance-mapping
  - logging
subtractive_category:
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_redshift_cluster]
params:
  attack_stage: detection_evasion
remediation:
  description: User activity logging not enabled.
  action: Enable user activity logging in the parameter group.
unsafe_predicate:
  all:
  - field: properties.database.kind
    op: eq
    value: redshift_cluster
  - field: properties.database.logging.user_activity_logging_enabled
    op: eq
    value: false
