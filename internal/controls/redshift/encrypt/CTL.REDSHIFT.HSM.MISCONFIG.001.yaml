dsl_version: ctrl.v1
id: CTL.REDSHIFT.HSM.MISCONFIG.001
name: Redshift HSM Encryption Mode Must Match Compliance Profile
description: >
  When the organization's compliance profile mandates HSM-backed
  key custody (FedRAMP High, FIPS 140-2 Level 3, certain
  financial-services attestations), the Redshift cluster's
  `hsm_status` must report `active` against the configured HSM
  client certificate and HSM configuration. The failure mode is
  silent drift: an HSM-required cluster restored from snapshot
  without re-attaching the HSM configuration ends up encrypted
  with a software KMS key — the cluster keeps running, the
  compliance attestation lapses, and the operator only finds out
  during the next audit.
domain: governance
severity: high
compliance:
  nist_800_53_r5: SC-13
  fedramp_high: SC-13
  pci_dss_v4.0: 3.6.1
  ccm_v4:
  - CEK-08
  - CEK-09
scope_tags:
- aws
- redshift
taxonomy:
  - compliance-mapping
subtractive_category:
  - S09
  - S10
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_redshift_cluster]
params:
  attack_stage: exfiltration
remediation:
  description: >
    Compliance profile mandates HSM-backed encryption but the
    cluster's `hsm_status` is not `active`. Encryption is in
    effect but not against an HSM-rooted key, breaking the
    attestation requirement.
  action: >
    Re-attach the HSM configuration:
    `aws redshift modify-cluster-iam-roles ... --hsm-client-certificate-identifier <cert> --hsm-configuration-identifier <cfg>`
    and verify with `describe-clusters` that `HsmStatus.Status`
    is `active`. If the HSM is no longer needed because the
    compliance profile changed, document the profile change
    rather than letting the cluster drift.
unsafe_predicate:
  all:
  - field: properties.database.kind
    op: eq
    value: redshift_cluster
  - field: properties.database.encryption.hsm_required
    op: eq
    value: true
  - field: properties.database.encryption.hsm_status
    op: ne
    value: active
