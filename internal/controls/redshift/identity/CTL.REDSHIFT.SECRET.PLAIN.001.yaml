dsl_version: ctrl.v1
id: CTL.REDSHIFT.SECRET.PLAIN.001
name: Redshift Cluster Must Use Secrets Manager for Master Password
description: >
  Redshift cluster master password is not managed by AWS
  Secrets Manager. Plaintext passwords in Terraform state,
  CloudFormation parameters, or environment variables are
  exposed to anyone with access to the deployment pipeline.
  Secrets Manager provides automatic rotation and audit
  logging for database credentials.
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "IA-5"
  soc2: "CC6.1"
  pci_dss_v4.0: "8.3"
  ccm_v4: ["IAM-02"]
scope_tags:
  - aws
  - redshift
taxonomy:
  - compliance-mapping
  - credential-lifecycle
subtractive_category:
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_redshift_cluster]
params:
  attack_stage: credential_access
remediation:
  description: >
    Redshift cluster master password is not managed by
    Secrets Manager.
  action: >
    Enable Secrets Manager integration for the Redshift
    cluster master password. Use manage_master_user_password
    in Terraform or the ManageMasterUserPassword API parameter.
  example: |
    {
      "database": {
        "kind": "redshift_cluster",
        "credentials": {
          "uses_secrets_manager": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.database.kind
      op: eq
      value: redshift_cluster
    - field: properties.database.credentials.uses_secrets_manager
      op: ne
      value: true
tests:
  - name: plaintext password fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:redshift:us-east-1:111122223333:cluster:my-cluster"
      asset_type: aws_redshift_cluster
      vendor: aws
      properties:
        database:
          kind: redshift_cluster
          credentials:
            uses_secrets_manager: false
  - name: secrets manager managed passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:redshift:us-east-1:111122223333:cluster:my-cluster"
      asset_type: aws_redshift_cluster
      vendor: aws
      properties:
        database:
          kind: redshift_cluster
          credentials:
            uses_secrets_manager: true
