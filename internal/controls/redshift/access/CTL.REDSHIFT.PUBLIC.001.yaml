dsl_version: ctrl.v1
id: CTL.REDSHIFT.PUBLIC.001
name: Redshift Clusters Must Not Be Publicly Accessible
description: Redshift clusters must not have the publicly accessible setting
  enabled.
domain: exposure
severity: critical
compliance:
  nist_800_53_r5: AC-3
  soc2: CC6.6
  pci_dss_v4.0: 1.3.4
  ccm_v4:
  - IVS-03
  owasp_subtractive: "S08"
  subtractive_tier: "deletion"
scope_tags:
- aws
- redshift
taxonomy:
  - compliance-mapping
  - network-isolation
  - network-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_redshift_cluster]
params:
  attack_stage: initial_access
remediation:
  description: Redshift cluster is publicly accessible.
  action: Disable public accessibility and place the cluster in a private
    subnet.
unsafe_predicate:
  all:
  - field: properties.database.kind
    op: eq
    value: redshift_cluster
  - field: properties.database.access.publicly_accessible
    op: eq
    value: true
