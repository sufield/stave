dsl_version: ctrl.v1
id: CTL.REDSHIFT.MAINTENANCE.DEFERRED.001
name: Redshift Cluster Must Not Have Maintenance Indefinitely Deferred
description: >
  Redshift exposes a `DeferredMaintenanceWindows` mechanism so
  operators can postpone an engine patch through an in-flight
  business window. The mechanism becomes a security failure when a
  cluster has had maintenance deferred continuously for longer than
  the maximum supported window — engine CVEs queue up unpatched,
  and the cluster runs an unsupported version that AWS will
  eventually force-upgrade in a less convenient window than the one
  the operator was protecting.
domain: hygiene
severity: medium
compliance:
  nist_800_53_r5: SI-2
  soc2: CC7.1
  pci_dss_v4.0: 6.3.3
  ccm_v4:
  - TVM-04
scope_tags:
- aws
- redshift
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_redshift_cluster]
params:
  attack_stage: persistence
remediation:
  description: >
    Cluster has an active deferred-maintenance window that has been
    in effect long enough that engine patches are accumulating.
  action: >
    Schedule a maintenance window outside of business hours, allow
    the deferred window to expire, then verify with
    `aws redshift describe-clusters --query 'Clusters[].DeferredMaintenanceWindows'`
    that no active deferred window remains.
unsafe_predicate:
  all:
  - field: properties.database.kind
    op: eq
    value: redshift_cluster
  - field: properties.database.maintenance.has_active_deferred_window
    op: eq
    value: true
