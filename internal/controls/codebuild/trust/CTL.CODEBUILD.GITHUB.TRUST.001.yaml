dsl_version: ctrl.v1
id: CTL.CODEBUILD.GITHUB.TRUST.001
name: CodeBuild GitHub Source Must Not Allow Untrusted PR Triggers
description: >
  CodeBuild projects with GitHub source must not allow builds
  triggered by pull requests from any contributor without an
  approval gate. An attacker creates a pull request that triggers
  a CodeBuild run, gaining access to the build environment's IAM
  role and any secrets in environment variables. Extends
  CTL.CODEBUILD.WEBHOOK.ANCHORED.001 (regex anchoring) and
  CTL.CODEBUILD.BUILDSPEC.USERCONTROLLED.001 (buildspec source)
  with explicit PR trigger trust validation.
  Technique: hackingthe.cloud CodeBuild GitHub runner persistence.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SA-12"
  soc2: "CC8.1"
  ccm_v4: ["AIS-06", "STA-04"]
scope_tags:
  - aws
  - codebuild
taxonomy:
  - trust-boundary
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_codebuild_project
params:
  attack_stage: initial_access
observation_fields:
  - compute.kind
  - compute.codebuild.github_source
  - compute.codebuild.allows_untrusted_pr_trigger
remediation:
  description: >
    CodeBuild project allows builds triggered by external pull
    requests without approval.
  action: >
    Configure webhook filters to restrict PULL_REQUEST_CREATED
    events to trusted actors. Use ACTOR_ACCOUNT_ID filters with
    anchored patterns. Enable build approval for external
    contributions.
  example: |
    {
      "compute": {
        "kind": "codebuild_project",
        "codebuild": {
          "github_source": true,
          "allows_untrusted_pr_trigger": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: codebuild_project
    - field: properties.compute.codebuild.github_source
      op: eq
      value: true
    - field: properties.compute.codebuild.allows_untrusted_pr_trigger
      op: eq
      value: true
tests:
  - name: "untrusted pr trigger fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:codebuild:us-east-1:123456789012:project/deploy"
      asset_type: aws_codebuild_project
      vendor: aws
      properties:
        compute:
          kind: codebuild_project
          codebuild:
            github_source: true
            allows_untrusted_pr_trigger: true
  - name: "trusted pr trigger passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:codebuild:us-east-1:123456789012:project/deploy"
      asset_type: aws_codebuild_project
      vendor: aws
      properties:
        compute:
          kind: codebuild_project
          codebuild:
            github_source: true
            allows_untrusted_pr_trigger: false
