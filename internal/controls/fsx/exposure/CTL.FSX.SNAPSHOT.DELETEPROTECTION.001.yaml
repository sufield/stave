dsl_version: ctrl.v1
id: CTL.FSX.SNAPSHOT.DELETEPROTECTION.001
name: FSx File System Backups Must Have Deletion Protection
description: >
  FSx file system does not have backup deletion protection enabled.
  Without deletion protection, an attacker with fsx:DeleteBackup or
  fsx:DeleteSnapshot can permanently destroy recovery points. This
  is the FSx variant of the Codefinger ransomware preparation
  pattern: delete backups, encrypt or destroy data, demand ransom.
  AWS Backup vault lock or equivalent immutability mechanisms
  prevent backup deletion even by principals with administrative
  access.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "CP-9, SC-28"
  soc2: "CC6.1"
  ccm_v4: ["BCR-01", "BCR-11"]
scope_tags:
  - aws
  - fsx
  - ransomware
taxonomy:
  - data-protection
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_fsx_file_system
params:
  attack_stage: resilience
observation_fields:
  - storage.kind
  - storage.backup.deletion_protection_enabled
remediation:
  description: >
    FSx file system backups do not have deletion protection.
  action: >
    Configure AWS Backup vault lock on the vault storing FSx
    backups. Set the lock mode to compliance for immutable
    protection or governance for removable protection. This
    prevents backup deletion even by principals with
    fsx:DeleteBackup or fsx:DeleteSnapshot permissions.
  example: |
    {
      "storage": {
        "kind": "file_system",
        "backup": {
          "deletion_protection_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: file_system
    - field: properties.storage.backup.deletion_protection_enabled
      op: ne
      value: true
tests:
  - name: "no deletion protection — fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:fsx:us-east-1:111122223333:file-system/fs-abc123"
      asset_type: aws_fsx_file_system
      vendor: aws
      properties:
        storage:
          kind: file_system
          backup:
            deletion_protection_enabled: false
  - name: "deletion protection enabled — passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:fsx:us-east-1:111122223333:file-system/fs-abc123"
      asset_type: aws_fsx_file_system
      vendor: aws
      properties:
        storage:
          kind: file_system
          backup:
            deletion_protection_enabled: true
