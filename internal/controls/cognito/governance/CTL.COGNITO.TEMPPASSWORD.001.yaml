dsl_version: ctrl.v1
id: CTL.COGNITO.TEMPPASSWORD.001
name: Cognito Temporary Passwords Must Expire Within 7 Days
description: >
  Cognito user pool temporary password validity must not exceed 7
  days. Long-lived temporary passwords increase the window for
  credential interception or misuse.
domain: exposure
severity: low
compliance:
  owasp_nhi: "NHI7"
  nist_800_53_r5: "IA-5"
  ccm_v4: ["IAM-16"]
scope_tags:
  - aws
  - cognito
taxonomy:
  - compliance-mapping
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_cognito_user_pool
params:
  attack_stage: credential_access
remediation:
  description: Cognito temporary password validity exceeds 7 days.
  action: Set TemporaryPasswordValidityDays to 7 or less.
  example: |
    {
      "identity": {
        "kind": "user_pool",
        "password_policy": { "temp_password_valid_days_exceeded": false }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: user_pool
    - field: properties.identity.password_policy.temp_password_valid_days_exceeded
      op: present
    - field: properties.identity.password_policy.temp_password_valid_days_exceeded
      op: eq
      value: true
