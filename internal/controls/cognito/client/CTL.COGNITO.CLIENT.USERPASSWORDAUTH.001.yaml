dsl_version: ctrl.v1
id: CTL.COGNITO.CLIENT.USERPASSWORDAUTH.001
name: Cognito App Client Allows Non-Interactive Password Authentication
description: >
  Cognito app client has ALLOW_USER_PASSWORD_AUTH in its ExplicitAuthFlows.
  This flow posts username and password directly to the Cognito token
  endpoint — no SRP challenge, no interactive step, no MFA prompt. It is
  the AWS equivalent of the OAuth ROPC (Resource Owner Password Credentials)
  grant that enabled the Huntress LSHIY campaign: 81M login attempts, 78
  account takeovers, all bypassing MFA because the non-interactive flow
  never presents a challenge.

  AWS marks USER_PASSWORD_AUTH as "not recommended" but does not disable it
  by default. Any app client with this flow enabled provides an MFA bypass
  path if the user pool's MfaConfiguration is not ON for all users.
  Credentials also transit in cleartext to the endpoint (unlike SRP which
  never sends the password).
domain: identity
severity: high
compliance:
  nist_800_53_r5: "IA-2(1), IA-5"
  soc2: "CC6.1"
  pci_dss_v4.0: "8.3.1"
  ccm_v4: ["IAM-09", "IAM-14"]
scope_tags:
  - aws
  - cognito
taxonomy:
  - compliance-mapping
  - credential-lifecycle
subtractive_category:
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_cognito_app_client
params:
  attack_stage: credential_access
observation_fields:
  - identity.kind
  - identity.cognito.allows_user_password_auth
remediation:
  description: >
    Cognito app client allows USER_PASSWORD_AUTH — a non-interactive
    authentication flow that bypasses MFA and sends credentials in
    cleartext.
  action: >
    Remove ALLOW_USER_PASSWORD_AUTH from the app client's
    ExplicitAuthFlows. Use ALLOW_USER_SRP_AUTH instead (SRP never
    sends the password over the wire). If USER_PASSWORD_AUTH is
    required for legacy clients, enforce MfaConfiguration ON on
    the user pool and monitor for credential-stuffing patterns.
  example: |
    {
      "identity": {
        "kind": "cognito_app_client",
        "cognito": {
          "allows_user_password_auth": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: cognito_app_client
    - field: properties.identity.cognito.allows_user_password_auth
      op: eq
      value: true
defect: >
  Cognito app client has USER_PASSWORD_AUTH enabled in
  ExplicitAuthFlows.
infection: >
  An attacker with valid credentials (from phishing, credential
  stuffing, or password reuse) calls InitiateAuth with
  AuthFlow=USER_PASSWORD_AUTH. The Cognito endpoint accepts the
  username and password directly, issues tokens without presenting
  an MFA challenge, and the attacker has a valid session. The
  Huntress LSHIY campaign used this exact pattern (via the OAuth
  ROPC equivalent) to take over 78 accounts across enterprises
  that had MFA enabled but scoped to interactive flows only.
failure: >
  Non-interactive authentication bypasses MFA. Credential-based
  account takeover at scale without second-factor interaction.
tests:
  - name: "USER_PASSWORD_AUTH enabled fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cognito-idp:us-east-1:111122223333:userpool/us-east-1_abc/client/abc123"
      asset_type: aws_cognito_app_client
      vendor: aws
      properties:
        identity:
          kind: cognito_app_client
          cognito:
            allows_user_password_auth: true
  - name: "USER_PASSWORD_AUTH disabled passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:cognito-idp:us-east-1:111122223333:userpool/us-east-1_def/client/def456"
      asset_type: aws_cognito_app_client
      vendor: aws
      properties:
        identity:
          kind: cognito_app_client
          cognito:
            allows_user_password_auth: false
  - name: "non-app-client asset passes (wrong kind)"
    verdict: PASS
    asset:
      asset_id: "arn:aws:cognito-idp:us-east-1:111122223333:userpool/us-east-1_abc"
      asset_type: aws_cognito_user_pool
      vendor: aws
      properties:
        identity:
          kind: user_pool
          auth:
            mfa_enforced: false
