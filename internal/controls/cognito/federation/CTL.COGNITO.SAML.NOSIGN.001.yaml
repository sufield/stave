dsl_version: ctrl.v1
id: CTL.COGNITO.SAML.NOSIGN.001
name: Cognito SAML Provider Does Not Require Signed Assertions
description: >
  Cognito SAML identity provider configuration
  does not require signed assertions. Cognito
  accepts assertions without verifying the
  signature — an attacker who can craft a
  SAML response (no infrastructure access
  required) can forge a federated identity.
domain: exposure
severity: critical
compliance:
  owasp_nhi: "NHI3"
  cis_aws_v3.0: "1.16"
  soc2: "CC6.1"
  nist_800_53_r5: "IA-2, SC-12, SC-13"
  pci_dss_v4.0: "8.3"
  fedramp_moderate: "IA-2, SC-12, SC-13"
  iso_27001_2022: "A.5.16, A.8.5"
  ccm_v4: ["IAM-09"]
scope_tags:
  - aws
  - cognito
taxonomy:
  - compliance-mapping
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_cognito_user_pool
params:
  attack_stage: credential_access
  blast_radius:
    type: data
    scope: account
    multiplier: 5.0
remediation:
  description: >
    SAML assertions accepted unsigned.
    Identity forgery is possible.
  action: >
    Enable signature verification on the
    SAML provider: aws cognito-idp
    update-identity-provider with provider
    details requiring signed assertions.
    Verify by submitting an unsigned
    assertion to the SAML endpoint and
    confirming Cognito rejects it. Pair with
    encrypted assertions for full
    protection against tampering and
    eavesdropping.
  example: |
    {
      "identity": {
        "kind": "cognito_user_pool",
        "cognito": {
          "saml_assertion_signed": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: cognito_user_pool
    - field: properties.identity.cognito.saml_assertion_signed
      op: ne
      value: true
defect: >
  Cognito SAML provider does not require
  signed assertions.
infection: >
  SAML assertions are XML documents asserting
  user identity. The IdP signs the assertion
  with a private key; the relying party
  (Cognito) verifies the signature against
  the IdP's metadata-published public key.
  Without signature verification, Cognito
  accepts any well-formed assertion. An
  attacker writes a SAML response by hand,
  populates it with a victim's email and
  group memberships, posts it to Cognito's
  SAML endpoint — Cognito accepts it and
  issues tokens for the victim. This is the
  classic SAML Response Injection attack.
  Production SAML deployments universally
  require signed assertions; the unsigned
  state is typically a configuration error.
failure: >
  Identity forgery via crafted SAML response.
  Cognito accepts assertions without
  signature verification.
tests:
  - name: unsigned assertions fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cognito-idp:us-east-1:111122223333:userpool/us-east-1_abc"
      asset_type: aws_cognito_user_pool
      vendor: aws
      properties:
        identity:
          kind: cognito_user_pool
          cognito:
            saml_assertion_signed: false
  - name: signed assertions pass
    verdict: PASS
    asset:
      asset_id: "arn:aws:cognito-idp:us-east-1:111122223333:userpool/us-east-1_abc"
      asset_type: aws_cognito_user_pool
      vendor: aws
      properties:
        identity:
          kind: cognito_user_pool
          cognito:
            saml_assertion_signed: true
