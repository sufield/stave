dsl_version: ctrl.v1
id: CTL.EVENTBRIDGE.CONNECTION.APIKEY.PLAINTEXT.001
name: EventBridge Connection API Key Embedded In Definition
description: >
  EventBridge Connection uses API_KEY authentication with the
  key value embedded directly in the connection definition
  rather than referenced from Secrets Manager. The key is
  visible to any principal with events:DescribeConnection.
  Same plaintext-credential pattern as BASIC auth but for
  API-key-style integrations (most third-party SaaS APIs use
  this auth style).
domain: exposure
severity: high
compliance:
  soc2: "CC6.1, CC6.3"
  nist_800_53_r5: "AC-3, IA-5, SC-28"
  pci_dss_v4.0: "3.5, 8.3"
  fedramp_moderate: "AC-3, IA-5"
  iso_27001_2022: "A.5.17, A.8.5, A.8.24"
  ccm_v4: ["IAM-02", "IAM-16"]
scope_tags:
  - aws
  - eventbridge
taxonomy:
  - credential-lifecycle
  - key-management
  - logging
subtractive_category:
  - S07
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eventbridge_connection
params:
  attack_stage: credential_access
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.5
remediation:
  description: >
    EventBridge Connection API_KEY auth has the key embedded
    in the connection definition.
  action: >
    Move the API key to AWS Secrets Manager. Update the
    connection's ApiKeyAuthParameters to use a SECRETS_MANAGER
    reference. Configure the secret for automatic rotation
    where the partner API supports it.
  example: |
    {
      "governance": {
        "kind": "eventbridge_connection",
        "events": {
          "auth_type": "API_KEY",
          "credentials_via_secret": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: eventbridge_connection
    - field: properties.governance.events.auth_type
      op: eq
      value: API_KEY
    - field: properties.governance.events.credentials_via_secret
      op: eq
      value: false
defect: >
  EventBridge Connection API_KEY value is stored in the
  connection definition rather than referenced from Secrets
  Manager.
infection: >
  The connection's ApiKeyAuthParameters carry the API key
  in plain text. Every principal with events:DescribeConnection
  sees it. CloudTrail logs the PutConnection / UpdateConnection
  events with the key payload. Key rotation requires editing
  the connection rather than rotating a secret. If the partner's
  API key gives broad access (most SaaS API keys do — they
  authorize the entire account's API surface), the impact of
  exposure is large.
failure: >
  API key exposure. Partner API access credentials are visible
  in connection configuration to a broad set of principals;
  rotation is manual.
tests:
  - name: API_KEY connection with plaintext key fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:connection/partner"
      asset_type: aws_eventbridge_connection
      vendor: aws
      properties:
        governance:
          kind: eventbridge_connection
          events:
            auth_type: "API_KEY"
            credentials_via_secret: false
  - name: API_KEY connection with secret reference passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:connection/partner"
      asset_type: aws_eventbridge_connection
      vendor: aws
      properties:
        governance:
          kind: eventbridge_connection
          events:
            auth_type: "API_KEY"
            credentials_via_secret: true
