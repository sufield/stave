dsl_version: ctrl.v1
id: CTL.EVENTBRIDGE.POLICY.SES.NOSOURCE.001
name: EventBridge Bus Policy Allows SES Inbound Without Source Restriction
description: >
  EventBridge bus resource policy grants events:PutEvents to the
  SES service principal (ses.amazonaws.com) without an
  aws:SourceArn or aws:SourceAccount condition. Any SES sending
  identity in any account can publish bounce, complaint, and
  delivery events to the bus. Downstream rules consuming SES
  events for compliance / abuse handling fire on spoofed payloads.
domain: exposure
severity: medium
compliance:
  soc2: "CC6.1, CC6.6"
  nist_800_53_r5: "AC-3, AC-4, SC-7"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.5.15, A.8.9"
  ccm_v4: ["IAM-16", "IVS-09"]
scope_tags:
  - aws
  - eventbridge
taxonomy:
  - compliance-mapping
  - confused-deputy
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eventbridge_bus
params:
  attack_stage: initial_access
  blast_radius:
    type: prevention
    scope: account
    multiplier: 1.5
remediation:
  description: >
    EventBridge bus policy authorizes the SES service principal
    without a source restriction.
  action: >
    Add aws:SourceArn (the SES configuration set or identity ARN)
    or aws:SourceAccount (the SES-owning account) to every
    statement granting ses.amazonaws.com PutEvents.
  example: |
    {
      "governance": {
        "kind": "eventbridge_bus",
        "events": {
          "policy_allows_ses": true,
          "policy_ses_has_source": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: eventbridge_bus
    - field: properties.governance.events.policy_allows_ses
      op: eq
      value: true
    - field: properties.governance.events.policy_ses_has_source
      op: eq
      value: false
defect: >
  EventBridge bus policy authorizes SES service principal
  PutEvents without aws:SourceArn or aws:SourceAccount.
infection: >
  The bus policy grants PutEvents to ses.amazonaws.com without
  source restriction. Any SES configuration set in any account can
  publish bounce / complaint / delivery events to the bus. An
  attacker can trigger artificial bounce events that flow into
  abuse-handling automation, suppression-list rules, or
  reputation-tracking pipelines built on top of EB rules.
failure: >
  Spoofed SES event injection. Bounce/complaint automation runs on
  attacker-controlled input.
tests:
  - name: SES principal without source condition fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:event-bus/email"
      asset_type: aws_eventbridge_bus
      vendor: aws
      properties:
        governance:
          kind: eventbridge_bus
          events:
            policy_allows_ses: true
            policy_ses_has_source: false
  - name: SES principal with sourceArn passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:event-bus/email"
      asset_type: aws_eventbridge_bus
      vendor: aws
      properties:
        governance:
          kind: eventbridge_bus
          events:
            policy_allows_ses: true
            policy_ses_has_source: true
