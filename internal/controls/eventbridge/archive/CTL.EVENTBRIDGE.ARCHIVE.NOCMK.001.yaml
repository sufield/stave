dsl_version: ctrl.v1
id: CTL.EVENTBRIDGE.ARCHIVE.NOCMK.001
name: EventBridge Archive Encrypted With AWS-Managed Key
description: >
  EventBridge archive uses AWS-managed key encryption (aws/events)
  rather than a customer-managed KMS key. Archive payloads include
  every event matched by the archive's filter pattern — typically
  spanning months of audit-grade traffic. AWS-managed-key
  encryption can't be revoked, audited at the key level, or
  rotated on the org's schedule. For archives serving compliance
  retention or incident-investigation roles, CMK is the
  required posture.
domain: governance
severity: medium
compliance:
  soc2: "CC6.1"
  nist_800_53_r5: "SC-12, SC-28"
  pci_dss_v4.0: "3.5"
  fedramp_moderate: "SC-12, SC-28"
  iso_27001_2022: "A.5.17, A.8.24"
  ccm_v4: ["CEK-02", "CEK-03"]
scope_tags:
  - aws
  - eventbridge
taxonomy:
  - compliance-mapping
  - confused-deputy
  - encryption-at-rest
subtractive_category:
  - S07
  - S09
  - S10
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eventbridge_archive
params:
  attack_stage: collection
remediation:
  description: >
    EventBridge archive uses AWS-managed key encryption.
  action: >
    Create a CMK with a key policy allowing
    events.amazonaws.com to encrypt/decrypt archive payloads,
    scoped by aws:SourceAccount. Update the archive's KmsKeyId
    via UpdateArchive (or recreate the archive — the
    KmsKeyIdentifier can only be set at create time on some
    CFN paths, so a recreate may be required). Existing archived
    events under the AWS-managed key remain readable until the
    archive's retention expires.
  example: |
    {
      "governance": {
        "kind": "eventbridge_archive",
        "events": {
          "uses_cmk": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: eventbridge_archive
    - field: properties.governance.events.uses_cmk
      op: eq
      value: false
defect: >
  EventBridge archive uses AWS-managed key encryption rather
  than a customer-managed KMS key.
infection: >
  Archive payloads — every event the archive's filter matched
  over the retention window — are encrypted with aws/events.
  The org has no policy control over the key, no per-key audit
  visibility, and no ability to rotate on its own cadence. If
  the archive serves compliance retention or incident-
  investigation roles, the encryption boundary falls outside
  the org's KMS audit surface.
failure: >
  Compliance / audit gap. Archived event payloads are encrypted
  but not under the org's key-management control.
tests:
  - name: archive with AWS-managed key fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:archive/audit"
      asset_type: aws_eventbridge_archive
      vendor: aws
      properties:
        governance:
          kind: eventbridge_archive
          events:
            uses_cmk: false
  - name: archive with CMK passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:archive/audit"
      asset_type: aws_eventbridge_archive
      vendor: aws
      properties:
        governance:
          kind: eventbridge_archive
          events:
            uses_cmk: true
