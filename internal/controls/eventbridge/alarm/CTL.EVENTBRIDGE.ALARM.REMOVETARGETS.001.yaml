dsl_version: ctrl.v1
id: CTL.EVENTBRIDGE.ALARM.REMOVETARGETS.001
name: EventBridge Has No Alarm For RemoveTargets / DisableRule
description: >
  EventBridge has no CloudWatch alarm covering RemoveTargets
  and DisableRule API events. RemoveTargets silently disables
  a rule's downstream invocations while leaving the rule in
  place; DisableRule pauses rule firing entirely. Both are
  reachable from broad PutTargets / PutRule grants (see
  EB-2's POLICY.REMOVETARGETS.BROAD) and produce
  silent-rule-failure outcomes (see EB-3's RULE.NOTARGETS).
  Alarm coverage on these calls is the detection layer for
  the silent-disablement pattern.
domain: governance
severity: high
compliance:
  soc2: "CC7.2, A1.2"
  nist_800_53_r5: "AU-6, IR-5, SI-4"
  pci_dss_v4.0: "10.2, 10.4"
  fedramp_moderate: "AU-6, SI-4"
  iso_27001_2022: "A.5.24, A.8.15, A.8.16"
  ccm_v4: ["LOG-08", "SEF-04"]
scope_tags:
  - aws
  - eventbridge
taxonomy:
  - compliance-mapping
  - logging
  - monitoring
subtractive_category:
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eventbridge_bus
params:
  attack_stage: detection_evasion
remediation:
  description: >
    No CloudWatch alarm covers RemoveTargets / DisableRule
    API events.
  action: >
    Create a CloudTrail metric filter matching eventName =
    RemoveTargets OR DisableRule on the bus's region trail.
    Wire a CloudWatch alarm on that metric to SNS. RemoveTargets
    is the silent-disable pattern — the rule remains visible,
    targets are stripped — and benefits most from immediate
    alert.
  example: |
    {
      "governance": {
        "kind": "eventbridge_bus",
        "events": {
          "alarm_remove_targets_configured": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: eventbridge_bus
    - field: properties.governance.events.alarm_remove_targets_configured
      op: eq
      value: false
defect: >
  No CloudWatch alarm covers RemoveTargets / DisableRule.
infection: >
  RemoveTargets and DisableRule both produce silent-rule-
  failure outcomes: the rule appears in inventory, console
  shows it as configured, but downstream invocations don't
  fire. Without an alarm on the API events, operators detect
  the silent failure only when downstream symptoms surface
  — security automation that doesn't trigger, audit ingestion
  that goes quiet, retention pipelines that stop producing
  output. The detection latency is the gap between the API
  call and the symptom.
failure: >
  Silent rule disablement undetected. Rules are stripped of
  targets or disabled without operator notification; downstream
  consumers experience the failure first.
tests:
  - name: bus without remove-targets alarm fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:event-bus/audit"
      asset_type: aws_eventbridge_bus
      vendor: aws
      properties:
        governance:
          kind: eventbridge_bus
          events:
            alarm_remove_targets_configured: false
  - name: bus with alarm passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:event-bus/audit"
      asset_type: aws_eventbridge_bus
      vendor: aws
      properties:
        governance:
          kind: eventbridge_bus
          events:
            alarm_remove_targets_configured: true
