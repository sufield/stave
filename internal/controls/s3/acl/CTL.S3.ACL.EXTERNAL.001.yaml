dsl_version: ctrl.v1
id: CTL.S3.ACL.EXTERNAL.001
name: S3 ACL Grants Access to External Canonical ID
description: >
  S3 bucket ACL grants permissions to a canonical ID that does not
  belong to the owning account. S3 ACLs are a legacy access mechanism
  that predates bucket policies. Unlike bucket policies — which are
  visible, auditable, and centrally manageable — ACL grants are opaque:
  a canonical ID is a 64-character hex string with no human-readable
  account mapping. Cross-account ACL grants bypass bucket policy
  restrictions, Public Access Block settings, and Access Point controls.
  They create an invisible trust relationship that standard access
  reviews miss.
intent_rationale: >
  Piper's lateral movement taxonomy identifies S3 ACLs with canonical
  IDs as one of five cross-account trust types. Unlike role trust
  policies or resource policies, ACL grants do not appear in IAM Access
  Analyzer findings and cannot be blocked by SCPs. The only defense is
  detecting and removing them.
domain: exposure
exposure:
  type: acl_cross_account
  principal_scope: cross_account
severity: medium
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["DSP-17", "IAM-16"]
  owasp_subtractive: "S05"
  subtractive_tier: "deletion"
scope_tags:
  - aws
  - s3
taxonomy:
  - trust-boundary
  - compliance-mapping
subtractive_category:
  - S03
  - S05
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_bucket
params:
  attack_stage: lateral_movement
observation_fields:
  - storage.kind
  - storage.access.has_external_acl_grant
remediation:
  description: >
    Bucket ACL grants permissions to an external canonical ID. This
    cross-account trust is invisible to standard access review tools.
  action: >
    Replace the ACL grant with an equivalent bucket policy statement
    that grants the external account access via its account ID. Bucket
    policies are auditable, revocable, and visible to IAM Access
    Analyzer. After migrating the grant, set the bucket ACL to
    BucketOwnerFullControl and enable BlockPublicAcls to prevent
    future ACL-based grants.
  example: |
    {
      "storage": {
        "kind": "bucket",
        "access": {
          "has_external_acl_grant": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.access.has_external_acl_grant
      op: eq
      value: true
tests:
  - name: "bucket with external canonical ID ACL grant fails"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:s3:::cross-account-acl-bucket"
      asset_type: aws_s3_bucket
      vendor: aws
      properties:
        storage:
          kind: bucket
          access:
            has_external_acl_grant: true
  - name: "bucket with no external ACL grants passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:s3:::clean-bucket"
      asset_type: aws_s3_bucket
      vendor: aws
      properties:
        storage:
          kind: bucket
          access:
            has_external_acl_grant: false
  - name: "bucket owned by single account passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:s3:::internal-only-bucket"
      asset_type: aws_s3_bucket
      vendor: aws
      properties:
        storage:
          kind: bucket
          access:
            has_external_acl_grant: false
