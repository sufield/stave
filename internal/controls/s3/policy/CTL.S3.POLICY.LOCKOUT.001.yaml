dsl_version: ctrl.v1
id: CTL.S3.POLICY.LOCKOUT.001
name: Bucket Policy Must Not Self-Lock Out Administration
description: >
  An S3 bucket policy must not contain a Deny statement that blocks the
  bucket owner's own policy-management actions (s3:PutBucketPolicy,
  s3:DeleteBucketPolicy) without a guaranteed administrative carve-out.
  The classic self-lockout pattern is a broad "Deny s3:* unless
  aws:SourceIp / aws:SourceVpce matches" that also covers policy
  management: if the operator loses that network path — an office IP
  change, a deleted VPC endpoint, a rotated CIDR — then no principal can
  edit the policy to recover. The bucket, often an audit-log or
  compliance bucket, becomes permanently unmanageable without AWS root or
  Support intervention. This is a resilience failure, not an exposure:
  the data stays private, but administration is irrecoverable.
domain: governance
severity: high
compliance:
  nist_800_53_r5: "AC-6"
  ccm_v4: ["IAM-16", "GRC-04"]
scope_tags:
  - aws
  - s3
taxonomy:
  - compliance-mapping
  - network-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_bucket
params:
  attack_stage: resilience
remediation:
  description: >
    The bucket policy contains a Deny that can lock out its own
    administration: policy-management actions are denied under a network
    condition with no guaranteed administrative escape. Losing that
    network path makes the policy unrecoverable.
  action: >
    Carve out break-glass administration from the Deny. Either (a) add an
    explicit Allow for s3:PutBucketPolicy / s3:DeleteBucketPolicy to a
    dedicated administrative role that is assumable WITHOUT the network
    condition, or (b) scope the Deny to data-plane actions only
    (s3:GetObject, s3:PutObject, ...) and keep policy-management actions
    out of the Deny entirely. Never gate policy-management behind a
    single IP/VPC condition.
  example: |
    {
      "storage": {
        "kind": "bucket",
        "access": {
          "has_self_lockout_deny": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.access.has_self_lockout_deny
      op: eq
      value: true
