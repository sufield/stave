dsl_version: ctrl.v1
id: CTL.S3.LOG.BUCKET.VERSIONING.001
name: Log Destination Bucket Must Have Versioning Enabled
description: >
  When server access logging is enabled, the log destination bucket
  must have versioning enabled. Without versioning, deleted or
  overwritten log files cannot be recovered, allowing attackers to
  destroy audit evidence.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "AU-9"
  hipaa: "164.312(b)"
  ccm_v4: ["LOG-12"]
scope_tags:
  - aws
  - s3
taxonomy:
  - compliance-mapping
  - logging
subtractive_category:
  - S08
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_bucket
params:
  attack_stage: detection_evasion
remediation:
  description: >
    Log destination bucket does not have versioning enabled. Log files
    can be permanently deleted or overwritten, destroying the audit
    trail with no possibility of recovery.
  action: >
    Enable versioning on the log destination bucket to preserve all
    versions of log objects. This ensures that even if log files are
    deleted or overwritten, previous versions remain recoverable.
  example: |
    {
      "storage": {
        "kind": "bucket",
        "logging": {
          "enabled": true
        },
        "logging_destination": {
          "versioning_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.logging.enabled
      op: eq
      value: true
    - field: properties.storage.logging_destination.versioning_enabled
      op: eq
      value: false
