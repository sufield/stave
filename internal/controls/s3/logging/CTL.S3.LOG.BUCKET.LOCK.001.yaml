dsl_version: ctrl.v1
id: CTL.S3.LOG.BUCKET.LOCK.001
name: Log Destination Bucket Must Have Object Lock Enabled
description: >
  When server access logging is enabled, the log destination bucket
  must have Object Lock enabled. Without Object Lock, log files can
  be deleted by any principal with s3:DeleteObject permission, even
  with versioning enabled.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "AU-9"
  hipaa: "164.312(b)"
  fedramp_moderate: "AU-9"
  ccm_v4: ["LOG-12"]
scope_tags:
  - aws
  - s3
taxonomy:
  - compliance-mapping
  - logging
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_bucket
params:
  attack_stage: detection_evasion
remediation:
  description: >
    Log destination bucket does not have Object Lock enabled. Log files
    can be deleted by any principal with s3:DeleteObject permission,
    allowing attackers to destroy audit evidence even when versioning
    is enabled.
  action: >
    Enable Object Lock on the log destination bucket with a retention
    policy. Object Lock prevents log file deletion for the retention
    period, ensuring audit trail immutability. Note that Object Lock
    must be enabled at bucket creation time.
  example: |
    {
      "storage": {
        "kind": "bucket",
        "logging": {
          "enabled": true
        },
        "logging_destination": {
          "object_lock_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.logging.enabled
      op: eq
      value: true
    - field: properties.storage.logging_destination.object_lock_enabled
      op: eq
      value: false
