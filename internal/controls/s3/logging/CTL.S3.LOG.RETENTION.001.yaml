dsl_version: ctrl.v1
id: CTL.S3.LOG.RETENTION.001
name: Log Retention Must Be At Least 90 Days
description: >
  When server access logging is enabled, the log destination bucket
  must retain logs for at least 90 days. Short retention periods allow
  attackers to wait out the retention window, after which evidence of
  unauthorized access is automatically destroyed.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "AU-11"
  hipaa: "164.530(j)"
  fedramp_moderate: "AU-11"
  ccm_v4: ["LOG-12"]
scope_tags:
  - aws
  - s3
taxonomy:
  - compliance-mapping
  - logging
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_bucket
params:
  attack_stage: detection_evasion
remediation:
  description: >
    Log destination bucket has a lifecycle expiration shorter than 90
    days. Audit logs are automatically deleted before the minimum
    retention period required for compliance and incident investigation.
  action: >
    Set the lifecycle expiration on the log destination bucket to at
    least 90 days. Many compliance frameworks require longer retention;
    consult your compliance team for the appropriate retention period.
  example: |
    {
      "storage": {
        "kind": "bucket",
        "logging": {
          "enabled": true
        },
        "logging_destination": {
          "lifecycle_expiration_days": 365
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.logging.enabled
      op: eq
      value: true
    - field: properties.storage.logging_destination.lifecycle_expiration_days
      op: gt
      value: 0
    - field: properties.storage.logging_destination.lifecycle_expiration_days
      op: lt
      value: 90
