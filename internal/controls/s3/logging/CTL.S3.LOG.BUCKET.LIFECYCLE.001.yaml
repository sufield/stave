dsl_version: ctrl.v1
id: CTL.S3.LOG.BUCKET.LIFECYCLE.001
name: Log Destination Bucket Must Have Lifecycle Policy
description: >
  When server access logging is enabled, the log destination bucket
  must have a lifecycle policy configured. Without lifecycle
  management, log storage grows unbounded, increasing costs and
  making audit analysis impractical.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "AU-11"
  hipaa: "164.312(b)"
  ccm_v4: ["LOG-12"]
scope_tags:
  - aws
  - s3
taxonomy:
  - compliance-mapping
  - logging
subtractive_category:
  - S08
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_bucket
params:
  attack_stage: resilience
remediation:
  description: >
    Log destination bucket does not have a lifecycle policy configured.
    Log files accumulate indefinitely, increasing storage costs and
    making compliance-required log review and analysis impractical.
  action: >
    Configure a lifecycle policy on the log destination bucket to
    manage log retention. Transition older logs to cheaper storage
    classes and expire logs after the required retention period.
  example: |
    {
      "storage": {
        "kind": "bucket",
        "logging": {
          "enabled": true
        },
        "logging_destination": {
          "lifecycle_policy_configured": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.logging.enabled
      op: eq
      value: true
    - field: properties.storage.logging_destination.lifecycle_policy_configured
      op: eq
      value: false
