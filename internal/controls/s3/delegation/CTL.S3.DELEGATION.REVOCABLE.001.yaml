dsl_version: ctrl.v1
id: CTL.S3.DELEGATION.REVOCABLE.001
name: Customer Cannot Revoke Vendor's S3 Access
description: >
  The customer account does not retain the ability to revoke this
  vendor's access to the bucket. This can occur when the vendor
  owns the bucket in the customer's namespace (cross-account
  bucket ownership), when the vendor's IAM role has
  s3:PutBucketPolicy on this bucket (the vendor can restore their
  own access after revocation), or when the bucket policy uses a
  condition the customer cannot modify. Irrevocable vendor access
  means the customer cannot contain a vendor-side breach: if the
  vendor is compromised, the customer must wait for the vendor to
  remediate, or delete the bucket entirely.
intent_rationale: >
  Revocability is the minimum control the customer must retain
  over delegated access. Without it, delegation becomes permanent
  transfer — the customer's security posture depends on the
  vendor's security posture with no circuit breaker. A delegated
  relationship without revocability is a single-vendor-failure
  blast radius.
domain: exposure
severity: high
compliance:
  owasp_nhi: "NHI3, NHI6"
  nist_800_53_r5: "AC-6"
  fedramp_moderate: "AC-6"
  pci_dss_v4.0: "7.2.5"
  soc2: "CC6.1"
  ccm_v4: ["STA-04", "IAM-02"]
scope_tags:
  - aws
  - s3
  - supply-chain
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_bucket
params:
  base_impact: 8
  attack_stage: persistence
remediation:
  description: >
    The customer account cannot unilaterally revoke the vendor's
    access. The vendor's permissions persist regardless of customer
    action.
  action: >
    Verify bucket ownership is with the customer account (not the
    vendor's account). Remove s3:PutBucketPolicy and s3:PutBucketAcl
    from the vendor's allowed actions. Ensure the customer's IAM
    retains s3:PutBucketPolicy on this bucket so customer-side
    changes can override vendor changes. Re-run the collector to
    refresh delegation.customer_can_revoke.
  example: |
    {
      "storage": {
        "kind": "bucket"
      },
      "delegation": {
        "customer_can_revoke": true
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.delegation.customer_can_revoke
      op: eq
      value: false
tests:
  - name: "bucket where customer retains revoke capability passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:s3:::revocable-bucket"
      asset_type: aws_s3_bucket
      vendor: aws
      properties:
        storage:
          kind: bucket
        delegation:
          customer_can_revoke: true
  - name: "bucket where customer cannot revoke vendor fails"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:s3:::vendor-locked-bucket"
      asset_type: aws_s3_bucket
      vendor: aws
      properties:
        storage:
          kind: bucket
        delegation:
          customer_can_revoke: false
