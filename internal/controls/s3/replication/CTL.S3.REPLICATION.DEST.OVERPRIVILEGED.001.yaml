dsl_version: ctrl.v1
id: CTL.S3.REPLICATION.DEST.OVERPRIVILEGED.001
name: Replication Destination Policy Grants Excessive Permissions
description: >
  S3 replication destination bucket policy grants the source account
  permissions beyond what replication requires. The minimum set is
  s3:ReplicateDelete, s3:ReplicateObject, s3:List*, and
  s3:GetBucketVersioning. If the destination policy allows
  s3:DeleteObjectVersion, s3:PutBucketPolicy,
  s3:PutLifecycleConfiguration, or s3:* from the source account, a
  compromised source account can destroy the backup. The collector
  pre-computes replication.destination_overprivileged by comparing
  the destination bucket policy grants against the replication
  minimum-privilege set.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "AC-6"
  soc2: "CC6.1"
  ccm_v4: ["BCR-08", "DSP-17"]
scope_tags:
  - aws
  - s3
taxonomy:
  - identity-perimeter
  - data-protection
subtractive_category:
  - S02
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_bucket
params:
  attack_stage: impact
  base_impact: 8
  blast_radius:
    type: recovery
    scope: account
    multiplier: 2.0
observation_fields:
  - storage.kind
  - storage.replication.enabled
  - storage.replication.destination_overprivileged
remediation:
  description: >
    Replication destination bucket policy grants the source account
    more permissions than replication requires. A compromised source
    account can delete backup objects or modify the backup bucket
    policy.
  action: >
    Restrict the destination bucket policy to the replication minimum
    privilege set: s3:ReplicateObject, s3:ReplicateDelete, s3:List*,
    s3:GetBucketVersioning. Remove s3:DeleteObjectVersion,
    s3:PutBucketPolicy, s3:PutLifecycleConfiguration, and any
    wildcard grants from the source account's allowed actions.
  example: |
    {
      "storage": {
        "kind": "bucket",
        "replication": {
          "enabled": true,
          "destination_overprivileged": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.replication.enabled
      op: eq
      value: true
    - field: properties.storage.replication.destination_overprivileged
      op: eq
      value: true
tests:
  - name: "destination policy grants s3:DeleteObjectVersion — fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:s3:::prod-backup-dest"
      asset_type: aws_s3_bucket
      vendor: aws
      properties:
        storage:
          kind: bucket
          replication:
            enabled: true
            destination_overprivileged: true
  - name: "destination policy grants only replication actions — passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:s3:::prod-backup-dest-locked"
      asset_type: aws_s3_bucket
      vendor: aws
      properties:
        storage:
          kind: bucket
          replication:
            enabled: true
            destination_overprivileged: false
  - name: "no replication — passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:s3:::static-site"
      asset_type: aws_s3_bucket
      vendor: aws
      properties:
        storage:
          kind: bucket
          replication:
            enabled: false
            destination_overprivileged: false
