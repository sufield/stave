dsl_version: ctrl.v1
id: CTL.S3.PAB.RESTRICTPUBLICBUCKETS.001
name: S3 Bucket Restrict Public Buckets Flag Must Be Enabled
description: >
  The `RestrictPublicBuckets` flag of the bucket's Public Access
  Block configuration restricts evaluation of any existing public
  bucket policy: when the flag is on, public grants in the bucket
  policy are limited to AWS service principals and authorized AWS
  services (e.g., CloudFront OAC). When this specific flag is
  `false`, historical `Principal: "*"` grants stay fully effective —
  enabling `BlockPublicPolicy` alone does not neutralize policies
  that were in place before the flag was turned on. The umbrella
  `CTL.S3.CONTROLS.001` fires when any of the four PAB flags is off;
  this control narrows the finding to the specific flag so the
  operator knows the fix is not "block new public policies" but
  "restrict the ones already there." Prowler and ScoutSuite both
  report the four flags independently.
domain: exposure
severity: high
compliance:
  cis_aws_v1.4.0: "2.1.5"
  cis_aws_v3.0: "2.1.4"
  pci_dss_v3.2.1: "1.3.6"
  soc2: "CC6.1"
  pci_dss_v4.0: "2.2.1"
  nist_800_53_r5: "AC-3"
  fedramp_moderate: "AC-3"
  gdpr: "Art.32"
  ffiec: "ISH-4"
  iso_27001_2022: "A.8.3"
  nist_csf_2.0: "PR.PS"
  ccm_v4: ["DSP-07", "DSP-17"]
  owasp_subtractive: "S08"
  subtractive_tier: "deletion"
scope_tags:
  - aws
  - s3
taxonomy:
  - compliance-mapping
  - network-perimeter
subtractive_category:
  - S03
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_bucket
params:
  attack_stage: initial_access
remediation:
  description: >
    The bucket's `RestrictPublicBuckets` PAB flag is disabled. Any
    pre-existing public bucket policy remains fully effective;
    enabling `BlockPublicPolicy` alone does not retroactively
    restrict its evaluation.
  action: >
    Enable the `RestrictPublicBuckets` flag on the bucket's Public
    Access Block configuration. Pair it with `BlockPublicPolicy` for
    full policy-path coverage — the pair prevents new public policy
    writes and limits the effect of any historical public grants to
    service principals.
  example: |
    {
      "storage": {
        "kind": "bucket",
        "controls": {
          "public_access_block": {
            "restrict_public_buckets": true
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.controls.public_access_block.restrict_public_buckets
      op: eq
      value: false
alternatives:
  - tool: prowler
    check_id: s3_bucket_level_public_access_block
    coverage: covered
    note: Stave umbrella requires all 4 flags vs Prowler's 2; per-flag controls give actionable remediation.
