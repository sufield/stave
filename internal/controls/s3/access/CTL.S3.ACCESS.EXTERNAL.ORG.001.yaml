dsl_version: ctrl.v1
id: CTL.S3.ACCESS.EXTERNAL.ORG.001
name: PHI Buckets Must Not Be Reachable by External Principals
description: >
  S3 buckets tagged data-classification=phi must not have policy
  statements granting access to principals outside the AWS
  Organization. The control reads the engine-derived
  external_account_ids list (set when bucket policy Principals or
  Conditions admit any non-org account); a non-empty list paired
  with a phi data-classification tag is an HIPAA-reportable breach
  exposure regardless of which specific S3 actions are allowed.
intent_rationale: >
  Patient health records must never be accessible to principals
  outside the covered entity's AWS Organization control boundary.
  HIPAA 164.312(a)(1) requires the covered entity to retain
  exclusive access; even read-only access by an external principal
  is a reportable breach (45 CFR 164.402). This invariant exists
  to make that boundary mechanically checkable — not just
  documented in policy. An AI agent reasoning about whether a
  finding matters should treat this control's failure as
  always-actionable: there is no benign cross-org PHI access.
domain: exposure
severity: critical
compliance:
  hipaa: "164.312(a)(1)"
  nist_800_53_r5: "AC-6"
  soc2: "CC6.3"
  ccm_v4: ["DSP-07", "DSP-17", "IAM-16"]
  owasp_nhi: "NHI5"
scope_tags:
  - aws
  - s3
  - hipaa
taxonomy:
  - compliance-mapping
  - identity-perimeter
subtractive_category:
  - S05
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_bucket
params:
  attack_stage: exfiltration
remediation:
  description: >
    Bucket holds PHI but its policy admits at least one principal
    outside the AWS Organization. The grant must be removed or
    constrained by aws:PrincipalOrgID before the bucket re-enters
    a compliant state.
  action: >
    1) Review the bucket policy and remove any statement whose
    Principal lists an external AWS account ID. 2) If cross-org
    access is intentional (e.g., a sanctioned BAA partner), scope
    the Allow with aws:PrincipalOrgID matching the partner's
    organization ID and aws:PrincipalArn restricting to the
    specific partner role. 3) Tag the bucket with
    `phi_external_intended: <baa-id>` to suppress this control
    only after the legal/compliance review is on file.
  example: |
    {
      "storage": {
        "kind": "bucket",
        "tags": {
          "data-classification": "phi"
        },
        "access": {
          "external_account_ids": []
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.tags.data-classification
      op: eq
      value: phi
    - field: properties.storage.access.external_account_ids
      op: present
forbidden_state:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.tags.data-classification
      op: eq
      value: phi
    - field: properties.storage.access.external_account_ids
      op: present
