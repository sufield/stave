dsl_version: ctrl.v1
id: CTL.S3.MFADELETE.001
name: MFA Delete Must Be Enabled on S3 Buckets
description: >
  S3 buckets should have MFA Delete enabled on versioned buckets.
  MFA Delete requires a second factor to permanently delete object
  versions, preventing unauthorized or accidental data destruction.
domain: exposure
severity: high
compliance:
  cis_aws_v3.0: "2.1.2"
  soc2: "CC6.1"
  nist_800_53_r5: "CP-9"
  ccm_v4: ["BCR-08"]
scope_tags:
  - aws
  - s3
taxonomy:
  - compliance-mapping
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_bucket
params:
  attack_stage: resilience
remediation:
  description: >
    MFA Delete is not enabled on this versioned bucket.
  action: >
    Enable MFA Delete (requires root credentials):
    aws s3api put-bucket-versioning --bucket <name>
    --versioning-configuration Status=Enabled,MFADelete=Enabled
    --mfa "arn:aws:iam::<account>:mfa/root-account-mfa-device <code>"
  example: |
    {
      "storage": {
        "kind": "bucket",
        "versioning": {
          "enabled": true,
          "mfa_delete_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.versioning.enabled
      op: eq
      value: true
    - field: properties.storage.versioning.mfa_delete_enabled
      op: eq
      value: false
alternatives:
  - tool: prowler
    check_id: s3_bucket_no_mfa_delete
    coverage: covered
    note: Both check storage.versioning.mfa_delete_enabled on versioned buckets.
