dsl_version: ctrl.v1
id: CTL.S3.CLASSIFY.COVERAGE.001
name: All S3 Buckets Must Have a Data Classification Tag
description: >
  Every S3 bucket must have a data-classification tag with a value from
  the recognized taxonomy (phi, pii, confidential, internal, public,
  non-sensitive). The data-classification tag is the gating condition for
  the majority of Stave's sensitive data controls — PHI encryption,
  Object Lock, Macie scanning, lifecycle retention, and access scoping
  are all conditional on this tag. A bucket without the tag silently
  passes all tag-conditional controls regardless of its actual contents.
  CIS 2.1.3 requires that all S3 data is discovered, classified, and
  secured. This control establishes the classification baseline — it
  does not verify what classification was applied, only that every bucket
  has been explicitly classified so downstream controls can evaluate it.
domain: exposure
severity: medium
compliance:
  cis_aws_v3.0: "2.1.3"
  nist_800_53_r5: "CM-8"
  fedramp_moderate: "CM-8"
  hipaa: "164.308(a)(1)(ii)(A)"
  pci_dss_v4.0: "12.5.2"
  soc2: "CC6.1"
  gdpr: "Art.30"
  ccm_v4: ["DSP-07", "GRC-05"]
scope_tags:
  - aws
  - s3
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_bucket
params:
  attack_stage: exfiltration
remediation:
  description: >
    S3 bucket does not have a data-classification tag or has an
    unrecognized classification value. The bucket is invisible to
    all tag-conditional sensitive data controls.
  action: >
    Apply a data-classification tag to the bucket with a value from the
    recognized taxonomy: phi, pii, confidential, internal, public, or
    non-sensitive. Use AWS Tag Editor or the S3 PutBucketTagging API to
    apply tags. Establish a tagging policy requiring classification at
    bucket creation time. Use AWS Config rules or SCPs to enforce
    mandatory tagging.
  example: |
    {
      "storage": {
        "kind": "bucket",
        "classification": {
          "is_unclassified": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.classification.is_unclassified
      op: eq
      value: true
