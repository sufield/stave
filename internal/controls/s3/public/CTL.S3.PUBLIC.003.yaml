dsl_version: ctrl.v1
id: CTL.S3.PUBLIC.003
name: No Public Write Access
description: >
  S3 buckets must not allow public write or delete access.
  Public write enables data injection, ransomware, and policy takeover.
compliance:
  ccm_v4: ["DSP-07", "DSP-17"]
  owasp_subtractive: "S08"
  subtractive_tier: "deletion"
domain: exposure
exposure:
  type: public_write
  principal_scope: public
severity: critical
scope_tags:
  - aws
  - s3
taxonomy:
  - compliance-mapping
  - network-perimeter
subtractive_category:
  - S03
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_s3_bucket]
params:
  attack_stage: initial_access
remediation:
  description: >
    Bucket allows public write or delete access. Attackers can inject
    malicious content, overwrite existing objects, or hold data ransom.
  action: >
    Remove bucket policy statements that grant s3:PutObject or s3:DeleteObject
    to Principal "*". Remove ACL grants that allow WRITE or FULL_CONTROL to
    AllUsers or AuthenticatedUsers. Enable S3 Public Access Block.
  example: |
    {
      "storage": {
        "access": {
          "public_write": false
        }
      }
    }
unsafe_predicate:
  any:
    - field: properties.storage.access.public_write
      op: eq
      value: true
alternatives:
  - tool: prowler
    check_id: s3_bucket_public_write_acl
    coverage: covered
    note: >-
      Stave splits ACL-write detection across public-write composite, FULL_CONTROL
      grants, and WRITE_ACP (escalation) grants.
