dsl_version: ctrl.v1
id: CTL.WAF.RULES.OWASP.001
name: WAF Must Have OWASP Core Rule Coverage
description: >
  WAF web ACLs must include the three core AWS managed rule groups that
  cover OWASP Top 10 attack categories: AWSManagedRulesCommonRuleSet
  (XSS, path traversal, HTTP violations), AWSManagedRulesSQLiRuleSet
  (SQL injection), and AWSManagedRulesKnownBadInputsRuleSet (Log4Shell,
  deserialization, known CVE payloads). All three groups must be attached
  and enforcing in BLOCK mode. A WAF with custom rules only, or with
  managed rule groups that cover IP reputation or bot management but not
  OWASP attack categories, provides incomplete coverage. This control
  differs from CTL.WAF.RULES.001 (which checks for any managed rules)
  by requiring the specific groups needed for baseline OWASP coverage.
  HackerOne report #382625 documents a stored XSS bypass against a
  production WAF that was active and blocking with custom rules but
  lacked AWSManagedRulesCommonRuleSet — the payload used a marquee
  element with an inline event handler, a known vector covered by
  the CrossSiteScripting_BODY rule in the common rule set.
  This control is the **coverage** check in the seven-control WAF
  safety envelope: presence (CTL.WAF.RULES.001), enforcement
  (CTL.WAF.RULES.BLOCKMODE.001), coverage (CTL.WAF.RULES.OWASP.001),
  visibility (CTL.WAF.LOGGING.001), architectural prerequisite
  (CTL.WAF.ORIGIN.LOCKDOWN.001), parser overflow protection
  (CTL.WAF.PARSERLIMIT.PROTECT.001), and evasion observability
  (CTL.WAF.EVASION.OBSERVE.001). All seven may fire on the same Web
  ACL simultaneously; each addresses a distinct failure mode.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SI-3"
  fedramp_moderate: "SI-3"
  pci_dss_v4.0: "6.4.1"
  soc2: "CC6.6"
  owasp_top10_2021: "A03"
  ccm_v4: ["CCC-04", "GRC-05"]
scope_tags:
  - aws
  - waf
taxonomy:
  - compliance-mapping
  - logging
subtractive_category:
  - S03
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_waf_web_acl]
params:
  base_impact: 8
  attack_stage: initial_access
  blast_radius:
    type: detection
    scope: account
    multiplier: 1.5
remediation:
  description: >
    WAF web ACL is missing one or more of the three required OWASP core
    rule groups, or the groups are attached but overridden to COUNT mode.
    Custom blacklist rules do not satisfy this requirement — HackerOne
    report #382625 demonstrates a WAF bypass where a blacklist-based WAF
    failed to block a known XSS vector that AWSManagedRulesCommonRuleSet
    covers explicitly.
  action: >
    Add the following AWS managed rule groups to the web ACL and ensure
    each is in BLOCK mode with no COUNT override at the group level or
    rule action override level: (1) AWSManagedRulesCommonRuleSet — covers
    XSS, path traversal, common exploits, (2) AWSManagedRulesSQLiRuleSet
    — covers SQL injection attack patterns, (3) AWSManagedRulesKnownBad
    InputsRuleSet — covers known CVE exploits including Log4j and
    Spring4Shell.
  example: |
    {
      "waf": {
        "kind": "web_acl",
        "rules": {
          "has_owasp_coverage": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.waf.kind
      op: eq
      value: web_acl
    - field: properties.waf.rules.has_owasp_coverage
      op: eq
      value: false
tests:
  - name: "web acl with all three OWASP groups passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:wafv2:us-east-1:111122223333:regional/webacl/prod/abc"
      asset_type: aws_waf_web_acl
      vendor: aws
      properties:
        waf:
          kind: web_acl
          rules:
            has_managed_rules: true
            has_owasp_coverage: true
  - name: "web acl missing OWASP coverage fails"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:wafv2:us-east-1:111122223333:regional/webacl/blacklist-only/def"
      asset_type: aws_waf_web_acl
      vendor: aws
      properties:
        waf:
          kind: web_acl
          rules:
            has_managed_rules: false
            has_owasp_coverage: false
