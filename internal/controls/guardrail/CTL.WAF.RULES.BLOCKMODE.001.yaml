dsl_version: ctrl.v1
id: CTL.WAF.RULES.BLOCKMODE.001
name: WAF Rules Must Be in BLOCK Mode, Not COUNT Mode
description: >
  All WAF rules and rule groups must have their effective action set to BLOCK.
  A rule in COUNT mode observes and logs attacks but does not block them. AWS
  WAF defaults newly added rules to COUNT mode during tuning. This becomes a
  permanent misconfiguration when teams never transition to BLOCK. The WAF
  appears active in every compliance report while blocking nothing. COUNT mode
  may be intentional during tuning — the stave/waf-count-mode-justified tag
  documents this exception.
  This control is the **enforcement** check in the seven-control WAF
  safety envelope: presence (CTL.WAF.RULES.001), enforcement
  (CTL.WAF.RULES.BLOCKMODE.001), coverage (CTL.WAF.RULES.OWASP.001),
  visibility (CTL.WAF.LOGGING.001), architectural prerequisite
  (CTL.WAF.ORIGIN.LOCKDOWN.001), parser overflow protection
  (CTL.WAF.PARSERLIMIT.PROTECT.001), and evasion observability
  (CTL.WAF.EVASION.OBSERVE.001). All seven may fire on the same Web
  ACL simultaneously; each addresses a distinct failure mode.
domain: exposure
severity: critical
compliance:
  nist_800_53_r5: "SI-3"
  fedramp_moderate: "SI-3"
  pci_dss_v4.0: "6.4.1"
  soc2: "CC6.6"
  ccm_v4: ["CCC-04", "GRC-05"]
scope_tags:
  - aws
  - waf
taxonomy:
  - compliance-mapping
  - logging
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_waf_web_acl]
params:
  base_impact: 10
  attack_stage: initial_access
  blast_radius:
    type: detection
    scope: account
    multiplier: 2.0
remediation:
  description: >
    One or more WAF rules are in COUNT mode — observing attacks but not
    blocking them. The WAF provides no protection while appearing active.
  action: >
    Transition COUNT-mode rules to BLOCK mode. If COUNT mode is intentional
    during tuning, add a stave/waf-count-mode-justified tag to the WebACL
    with the justification (e.g., ticket number).
  example: |
    {
      "waf": {
        "kind": "web_acl",
        "has_count_mode_rules": false
      }
    }
unsafe_predicate:
  all:
    - field: properties.waf.kind
      op: eq
      value: web_acl
    - field: properties.waf.has_count_mode_rules
      op: eq
      value: true
    - field: properties.waf.count_mode_justified
      op: ne
      value: true
