dsl_version: ctrl.v1
id: CTL.KINESIS.POLICY.CROSSACCOUNT.001
name: Kinesis Stream Resource Policy Grants Cross-Account Access Without Organizational Boundary
description: >
  Kinesis Data Streams resource policy grants actions to
  principals in external AWS accounts without an
  aws:PrincipalOrgID condition. External accounts can
  GetRecords (exfiltrate stream data) or PutRecord (inject
  data into the stream pipeline). If the account leaves the
  organization, access persists. Same shape as
  CTL.SNS.POLICY.CROSSACCOUNT.001 on the streaming side.
domain: exposure
severity: high
compliance:
  cis_aws_v3.0: "1.20"
  soc2: "CC6.1, CC6.6"
  nist_800_53_r5: "AC-3, AC-4, AC-6"
  pci_dss_v4.0: "1.2, 7.1, 7.2"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.5.15, A.5.19"
  ccm_v4: ["IAM-16", "IVS-09"]
scope_tags:
  - aws
  - kinesis
taxonomy:
  - identity-perimeter
  - trust-boundary
subtractive_category:
  - S03
  - S05
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_kinesis_stream
params:
  attack_stage: initial_access
  blast_radius:
    type: prevention
    scope: organization
    multiplier: 2.0
remediation:
  description: >
    Kinesis stream resource policy grants cross-account
    access without an aws:PrincipalOrgID condition.
  action: >
    Add aws:PrincipalOrgID restricting access to the
    organization's ID. For a legitimate cross-org consumer,
    use aws:PrincipalAccount with the explicit account ID
    and document the trust relationship.
  example: |
    {
      "streaming": {
        "kind": "kinesis_stream",
        "kinesis": {
          "policy_cross_account": true,
          "policy_has_org_condition": true,
          "policy_external_accounts": ["222233334444"]
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.streaming.kind
      op: eq
      value: kinesis_stream
    - field: properties.streaming.kinesis.policy_cross_account
      op: eq
      value: true
    - field: properties.streaming.kinesis.policy_has_org_condition
      op: eq
      value: false
defect: >
  Kinesis stream resource policy grants actions to external
  account principals without aws:PrincipalOrgID.
infection: >
  Cross-account stream access without organizational
  boundary means external accounts can read from or write
  to the stream regardless of current org membership. For
  GetRecords, the external account can consume every record
  in the stream — data exfiltration. For PutRecord, the
  external account can inject records into the pipeline —
  data injection that downstream consumers process as
  legitimate. PrincipalOrgID ensures only accounts currently
  in the organization can access the stream; departures are
  enforced automatically.
failure: >
  Stream access outside organizational boundary. External-
  account principals can read or write stream records
  without org-membership verification.
tests:
  - name: cross-account without org condition fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:kinesis:us-east-1:111122223333:stream/shared-events"
      asset_type: aws_kinesis_stream
      vendor: aws
      properties:
        streaming:
          kind: kinesis_stream
          kinesis:
            policy_cross_account: true
            policy_has_org_condition: false
            policy_external_accounts:
              - "222233334444"
  - name: cross-account with org condition passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:kinesis:us-east-1:111122223333:stream/shared-events"
      asset_type: aws_kinesis_stream
      vendor: aws
      properties:
        streaming:
          kind: kinesis_stream
          kinesis:
            policy_cross_account: true
            policy_has_org_condition: true
            policy_external_accounts:
              - "222233334444"
  - name: same-account stream passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:kinesis:us-east-1:111122223333:stream/internal-events"
      asset_type: aws_kinesis_stream
      vendor: aws
      properties:
        streaming:
          kind: kinesis_stream
          kinesis:
            policy_cross_account: false
