dsl_version: ctrl.v1
id: CTL.EC2.EBS.ALARM.BURSTBALANCE.001
name: No CloudWatch Alarm for gp2 Burst Balance Depletion
description: >
  No CloudWatch alarm watches BurstBalance for
  gp2 volumes despite the account having gp2
  volumes. gp2 burst credits expire silently:
  the volume drops from up to 3,000 burst IOPS
  to baseline (3 IOPS per GB) when credits hit
  zero. Without an alarm, the performance
  cliff is invisible until the application
  slows down.
domain: audit
severity: medium
compliance:
  soc2: "CC7.1, A1.1"
  nist_800_53_r5: "AU-6, SI-4"
  pci_dss_v4.0: "10.6"
  fedramp_moderate: "AU-6"
  iso_27001_2022: "A.8.16"
  ccm_v4: ["LOG-08"]
scope_tags:
  - aws
  - ec2
  - ebs
taxonomy:
  - compliance-mapping
  - monitoring
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_ec2_account
params:
  attack_stage: detection_evasion
  blast_radius:
    type: governance
    scope: account
    multiplier: 1.5
remediation:
  description: >
    No alarm warns before gp2 burst credits
    deplete.
  action: >
    Create a CloudWatch alarm on AWS/EBS
    BurstBalance for each gp2 volume with
    threshold < 20% over 15 minutes. Wire to
    the operational topic. Long-term, migrate
    sustained-throughput gp2 workloads to gp3
    (no burst model — flat 3,000 IOPS / 125
    MB/s with optional provisioned increases).
  example: |
    {
      "compute": {
        "kind": "ec2_account",
        "ebs": {
          "alarm_burst_balance": true,
          "has_gp2_volumes": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: ec2_account
    - field: properties.compute.ebs.has_gp2_volumes
      op: eq
      value: true
    - field: properties.compute.ebs.alarm_burst_balance
      op: eq
      value: false
defect: >
  No CloudWatch alarm monitors gp2 BurstBalance
  despite gp2 volumes being in use.
infection: >
  gp2 volumes have a burst credit system:
  baseline IOPS is 3 per GB, with burst up to
  3,000 IOPS for short periods using earned
  credits. When credits are depleted, the
  volume drops to baseline — for a 100 GB gp2,
  that's 3,000 burst IOPS down to 300 baseline.
  The performance cliff is dramatic: page
  load times spike, queries time out, queues
  back up, instances become unresponsive.
  Without a BurstBalance alarm, the application
  slowdown is the first signal — not the
  underlying cause. With an alarm at <20%
  remaining, the team can take pre-emptive
  action (provisioned IOPS, gp3 migration,
  load shed) before users notice.
failure: >
  Undetected performance cliff. gp2 burst
  credits deplete silently — application
  slowdown without root-cause attribution.
tests:
  - name: gp2 in use without burst alarm fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:ec2:us-east-1:111122223333:account"
      asset_type: aws_ec2_account
      vendor: aws
      properties:
        compute:
          kind: ec2_account
          ebs:
            alarm_burst_balance: false
            has_gp2_volumes: true
  - name: account with no gp2 volumes does not fire
    verdict: PASS
    asset:
      asset_id: "arn:aws:ec2:us-east-1:111122223333:account"
      asset_type: aws_ec2_account
      vendor: aws
      properties:
        compute:
          kind: ec2_account
          ebs:
            alarm_burst_balance: false
            has_gp2_volumes: false
  - name: gp2 in use with burst alarm passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:ec2:us-east-1:111122223333:account"
      asset_type: aws_ec2_account
      vendor: aws
      properties:
        compute:
          kind: ec2_account
          ebs:
            alarm_burst_balance: true
            has_gp2_volumes: true
