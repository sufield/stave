dsl_version: ctrl.v1
id: CTL.EC2.PROFILE.OVERBROAD.001
name: EC2 Instance Profile Must Follow Least Privilege
description: >
  EC2 instance profiles must not have AdministratorAccess or overly
  broad permissions. Instance profile credentials are accessible
  via the metadata service — overprivileged profiles increase the
  blast radius of credential theft.
domain: identity
severity: medium
compliance:
  cis_aws_v3.0: "1.18"
  nist_800_53_r5: "AC-6"
  soc2: "CC6.1"
  ccm_v4: ["IAM-04", "IAM-05"]
scope_tags:
  - aws
  - ec2
taxonomy:
  - compute-hardening
  - credential-lifecycle
  - least-privilege
subtractive_category:
  - S01
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_ec2_instance
params:
  attack_stage: credential_access
remediation:
  description: Instance profile has overly broad permissions.
  action: >
    Replace the instance profile's role with a scoped policy granting
    only the permissions the workload needs. Use IAM Access Analyzer
    to generate a least-privilege policy from observed API activity.
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: instance
    - field: properties.compute.instance_profile.is_overprivileged
      op: eq
      value: true
