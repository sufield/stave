dsl_version: ctrl.v1
id: CTL.EC2.EBS.SNAPSHOT.UNENCRYPTED.SHARED.001
name: EBS Snapshot Shared Without Encryption
description: >
  EBS snapshot is shared with one or more accounts and is
  unencrypted. The receiving account can restore the
  snapshot and read every block in plaintext. Shared
  snapshots that contain meaningful data should be
  encrypted with a KMS key whose grant is explicitly
  extended to the receiving account — encryption at rest
  on the source side, encryption in transit during the
  copy, and key-based access revocation if the share is
  later withdrawn. An unencrypted shared snapshot offers
  none of those protections; once shared, the data is
  effectively published to the receiving account
  permanently.
domain: exposure
severity: high
compliance:
  cis_aws_v3.0: "2.2.1"
  nist_800_53_r5: "SC-28"
  fedramp_moderate: "SC-28"
  pci_dss_v4.0: "3.5.1"
  soc2: "CC6.7"
  hipaa: "164.312(a)(2)(iv)"
  ccm_v4: ["CEK-08", "CEK-13"]
scope_tags:
  - aws
  - ec2
taxonomy:
  - compliance-mapping
  - encryption-at-rest
subtractive_category:
  - S08
  - S10
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_ebs_snapshot
params:
  attack_stage: collection
observation_fields:
  - compute.kind
  - compute.ebs.snapshot_id
  - compute.ebs.snapshot_shared
  - compute.ebs.snapshot_encrypted
  - compute.ebs.snapshot_shared_unencrypted
remediation:
  description: >
    EBS snapshot is shared with another account and is not
    encrypted. The receiving account can restore plaintext
    data.
  action: >
    Withdraw the existing share immediately. Re-create the
    snapshot as encrypted: `aws ec2 copy-snapshot --source-
    snapshot-id <id> --encrypted --kms-key-id <key>`. Grant
    the receiving account explicit `kms:Decrypt` permission
    on the KMS key. Re-share the new encrypted snapshot.
    Add an SCP that denies `ec2:ModifySnapshotAttribute
    --add` for unencrypted snapshots to prevent recurrence.
  example: |
    {
      "compute": {
        "kind": "ebs_snapshot",
        "ebs": {
          "snapshot_shared_unencrypted": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: ebs_snapshot
    - field: properties.compute.ebs.snapshot_shared
      op: eq
      value: true
    - field: properties.compute.ebs.snapshot_encrypted
      op: eq
      value: false
