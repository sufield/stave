dsl_version: ctrl.v1
id: CTL.EBS.SNAPSHOT.DELETEPROTECTION.001
name: EBS Snapshot Lock Not Enabled
description: >
  EBS snapshot does not have snapshot lock enabled. Snapshot lock
  prevents deletion for a configurable retention period, providing
  protection against both accidental and malicious deletion.
  Combined with Recycle Bin, snapshot lock is the primary defense
  against ransomware that targets backup artifacts. Without it, an
  attacker with ec2:DeleteSnapshot can permanently destroy recovery
  points.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "CP-9, SC-28"
  soc2: "CC6.1"
  ccm_v4: ["BCR-01", "BCR-11"]
scope_tags:
  - aws
  - ec2
  - ebs
  - ransomware
taxonomy:
  - data-protection
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_ebs_snapshot
params:
  attack_stage: resilience
observation_fields:
  - compute.kind
  - compute.ebs.snapshot_lock_enabled
remediation:
  description: >
    EBS snapshot does not have deletion protection (snapshot lock).
  action: >
    Enable snapshot lock on critical snapshots using
    ec2:LockSnapshot. Set the lock mode to compliance for
    immutable protection or governance for removable protection.
    Set a retention period that exceeds your recovery time
    objective.
  example: |
    {
      "compute": {
        "kind": "ebs_snapshot",
        "ebs": {
          "snapshot_lock_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: ebs_snapshot
    - field: properties.compute.ebs.snapshot_lock_enabled
      op: ne
      value: true
tests:
  - name: "snapshot without lock — fires"
    verdict: VIOLATION
    asset:
      asset_id: "snap-0123456789abcdef0"
      asset_type: aws_ebs_snapshot
      vendor: aws
      properties:
        compute:
          kind: ebs_snapshot
          ebs:
            snapshot_lock_enabled: false
  - name: "snapshot with lock — passes"
    verdict: PASS
    asset:
      asset_id: "snap-abcdef0123456789a"
      asset_type: aws_ebs_snapshot
      vendor: aws
      properties:
        compute:
          kind: ebs_snapshot
          ebs:
            snapshot_lock_enabled: true
