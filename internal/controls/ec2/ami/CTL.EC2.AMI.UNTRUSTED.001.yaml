dsl_version: ctrl.v1
id: CTL.EC2.AMI.UNTRUSTED.001
name: Instance Launched From Untrusted AMI Source
description: >
  EC2 instance is running an AMI whose owner account is not in
  the organization, is not Amazon's published-image owner ID,
  and is not from the verified marketplace publisher list. The
  AMI's content (operating system, installed software, embedded
  credentials, possible backdoors) is outside organizational
  control. The trust boundary for AMIs is the owner account:
  AMIs from `amazon`, `aws-marketplace` (verified publishers),
  and accounts within the organization are trusted; everything
  else is treated as third-party software running with full
  instance privileges. The trusted-publisher list is
  configurable via deployment metadata.
domain: exposure
severity: high
compliance:
  cis_aws_v3.0: "2.1.1"
  nist_800_53_r5: "SA-12"
  fedramp_moderate: "SA-12"
  pci_dss_v4.0: "6.3.2"
  soc2: "CC8.1"
  hipaa: "164.312(c)(2)"
  ccm_v4: ["IPY-01", "STA-04"]
scope_tags:
  - aws
  - ec2
taxonomy:
  - compliance-mapping
  - compute-hardening
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_ec2_instance
params:
  attack_stage: initial_access
observation_fields:
  - compute.kind
  - compute.ami.id
  - compute.ami.owner_id
  - compute.ami.owner_in_org
  - compute.ami.owner_is_amazon
  - compute.ami.owner_is_marketplace
  - compute.ami.is_trusted
remediation:
  description: >
    Instance is running an AMI from an account outside the
    organization's trusted publisher set.
  action: >
    Replace the instance with one launched from an internally-
    built AMI or a verified marketplace AMI. If the third-party
    AMI is genuinely needed, scan it (Amazon Inspector) before
    use, snapshot a known-good version into the organization's
    AMI account, and replace the launch template / ASG to
    reference the internal copy. Add the original publisher
    account to the trusted-publisher allowlist explicitly if
    its AMIs are part of approved supply.
  example: |
    {
      "compute": {
        "kind": "instance",
        "ami": {
          "is_trusted": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: instance
    - field: properties.compute.ami.is_trusted
      op: eq
      value: false
