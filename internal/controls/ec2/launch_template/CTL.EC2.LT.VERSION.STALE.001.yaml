dsl_version: ctrl.v1
id: CTL.EC2.LT.VERSION.STALE.001
name: Launch Template Default Version Must Match the Latest Version
description: >
  EC2 launch template default version (the version used by ASGs and
  manual launches that do not pin a specific number) must match the
  template's latest version. Launch templates are versioned: every
  edit produces a new version, and the default version pointer is
  updated separately. When the default lags behind latest, security
  improvements that were authored into the newer versions are not
  applied to scale-out events, replacement launches, or any
  workflow that takes the default. Common drift: version 7 enforces
  IMDSv2 and is the latest, but the default is pinned at version 5
  → every new instance launches with IMDSv1 enabled. Or version 8
  updates the AMI for a published CVE fix, but version 6 is
  default → new instances launch with the vulnerable AMI. The
  version delta is a measurable governance gap: the work was done
  but never made authoritative.
domain: governance
severity: medium
compliance:
  nist_800_53_r5: "CM-2"
  soc2: "CC8.1"
  ccm_v4: ["CCC-04"]
scope_tags: [aws, ec2]
taxonomy:
  - compliance-mapping
  - compute-hardening
  - trust-decay
subtractive_category:
  - S01
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_ec2_launch_template
params:
  attack_stage: initial_access
remediation:
  description: Launch template default version is not the latest version.
  action: Update the default version to latest after reviewing the version diff.
  example: |
    {"compute": {"kind": "launch_template", "launch_template": {"using_latest": true}}}
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: launch_template
    - field: properties.compute.launch_template.using_latest
      op: eq
      value: false
