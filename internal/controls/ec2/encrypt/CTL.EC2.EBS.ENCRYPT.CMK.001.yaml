dsl_version: ctrl.v1
id: CTL.EC2.EBS.ENCRYPT.CMK.001
name: EBS Volume Encrypted with AWS-Managed Key Not CMK
description: >
  EBS volume is encrypted (CTL.EC2.EBS.ENCRYPT.001
  passes) but the encryption key is the AWS-
  managed key (aws/ebs) rather than a
  customer-managed KMS key. Default encryption
  exists; customer-controlled encryption does
  not. There is no key policy, no usage audit
  trail, no revocation capability — same CMK
  enforcement pattern as every other encrypted
  service.
domain: exposure
severity: medium
compliance:
  cis_aws_v3.0: "2.2.1"
  soc2: "CC6.1, CC6.7"
  nist_800_53_r5: "SC-12, SC-13, SC-28"
  pci_dss_v4.0: "3.4, 3.5.1"
  fedramp_moderate: "SC-12, SC-13, SC-28"
  hipaa: "164.312(a)(2)(iv), 164.312(e)(2)(ii)"
  iso_27001_2022: "A.8.24"
  ccm_v4: ["CEK-03", "CEK-09"]
scope_tags:
  - aws
  - ec2
  - ebs
taxonomy:
  - compliance-mapping
  - encryption-at-rest
  - logging
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_ebs_volume
params:
  attack_stage: collection
  blast_radius:
    type: data
    scope: account
    multiplier: 1.5
remediation:
  description: >
    Volume uses AWS-managed encryption. No
    customer-controlled key barrier.
  action: >
    Re-encrypt the volume with a customer-
    managed key by creating a new encrypted
    snapshot with KmsKeyId set to a CMK ARN,
    then creating a new volume from that
    snapshot. Update the instance to use the
    new volume. The CMK's policy should grant
    Encrypt/Decrypt to the EC2 service principal
    and decrypt access only to the principals
    that need to attach the volume.
  example: |
    {
      "compute": {
        "kind": "ebs_volume",
        "ebs": {
          "volume_id": "vol-0123456789abcdef",
          "encrypted": true,
          "kms_key_arn": "arn:aws:kms:us-east-1:111122223333:key/abc",
          "uses_cmk": true,
          "uses_aws_managed_key": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: ebs_volume
    - field: properties.compute.ebs.encrypted
      op: eq
      value: true
    - field: properties.compute.ebs.uses_cmk
      op: eq
      value: false
defect: >
  EBS volume is encrypted with the AWS-managed
  key rather than a customer-managed KMS key.
infection: >
  AWS-managed encryption (aws/ebs) protects
  data against raw storage access — the
  encryption key never leaves AWS, and the
  underlying disks cannot be read in plaintext.
  But the key lives in AWS's account, not the
  customer's. There is no key policy to scope
  decryption authority, no CloudTrail visibility
  into decryption events, and no way to revoke
  access by deleting or disabling the key. A
  customer-managed key with a tightly-scoped
  policy gives the operator control over which
  principals can decrypt and a revocation path
  if access needs to be cut off.
failure: >
  No key policy control. Default encryption
  protects against raw storage access but not
  against compromised attach permissions inside
  the account.
tests:
  - name: volume with AWS-managed key fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:ec2:us-east-1:111122223333:volume/vol-0123456789abcdef"
      asset_type: aws_ebs_volume
      vendor: aws
      properties:
        compute:
          kind: ebs_volume
          ebs:
            volume_id: "vol-0123456789abcdef"
            encrypted: true
            kms_key_arn: "arn:aws:kms:us-east-1:111122223333:key/aws/ebs"
            uses_cmk: false
            uses_aws_managed_key: true
  - name: volume with CMK passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:ec2:us-east-1:111122223333:volume/vol-0123456789abcdef"
      asset_type: aws_ebs_volume
      vendor: aws
      properties:
        compute:
          kind: ebs_volume
          ebs:
            volume_id: "vol-0123456789abcdef"
            encrypted: true
            kms_key_arn: "arn:aws:kms:us-east-1:111122223333:key/abc-cmk-id"
            uses_cmk: true
            uses_aws_managed_key: false
