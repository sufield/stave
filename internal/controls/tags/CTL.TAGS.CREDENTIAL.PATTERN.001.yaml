dsl_version: ctrl.v1
id: CTL.TAGS.CREDENTIAL.PATTERN.001
name: Resource Tags Must Not Contain Credential Patterns
description: >
  No resource tag value should match common credential patterns
  (AWS access key IDs, connection strings, passwords, private
  keys). Developers store secrets in tags for convenience. An
  attacker with tag:GetResources — a low-privilege, commonly
  granted action — can scan all tags across all services and
  harvest embedded credentials. This is a heuristic control
  with false positive risk for tags containing example data.
  Technique: Wiz "Extract credentials from resource tags".
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "IA-5(7)"
  soc2: "CC6.1"
  ccm_v4: ["DSP-10", "IAM-11"]
scope_tags:
  - aws
taxonomy:
  - credential-lifecycle
subtractive_category:
  - S07
applicable_asset_types: [aws_ec2_instance, aws_s3_bucket, aws_rds_instance, aws_lambda_function, aws_iam_role]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
observation_fields:
  - tags.contains_credential_pattern
remediation:
  description: >
    A resource tag value matches a credential pattern.
    Credentials stored in tags are readable by any principal
    with tag:GetResources.
  action: >
    Move the credential to AWS Secrets Manager or Systems Manager
    Parameter Store (SecureString). Remove the tag value. Rotate
    the exposed credential.
  example: |
    {
      "tags": {
        "contains_credential_pattern": false
      }
    }
unsafe_predicate:
  all:
    - field: properties.tags.contains_credential_pattern
      op: eq
      value: true
tests:
  - name: "credential in tag fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:ec2:us-east-1:123456789012:instance/i-abc123"
      asset_type: aws_ec2_instance
      vendor: aws
      properties:
        tags:
          contains_credential_pattern: true
  - name: "clean tags passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:ec2:us-east-1:123456789012:instance/i-abc123"
      asset_type: aws_ec2_instance
      vendor: aws
      properties:
        tags:
          contains_credential_pattern: false
