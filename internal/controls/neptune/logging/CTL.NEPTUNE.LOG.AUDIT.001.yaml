dsl_version: ctrl.v1
id: CTL.NEPTUNE.LOG.AUDIT.001
name: Neptune Must Export Logs to CloudWatch
description: Neptune clusters must export audit logs to CloudWatch Logs.
domain: audit
severity: medium
compliance:
  nist_800_53_r5: AU-12
  soc2: CC7.1
  ccm_v4:
  - LOG-03
scope_tags:
- aws
- neptune
taxonomy:
  - compliance-mapping
  - logging
subtractive_category:
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_neptune_cluster]
params:
  attack_stage: detection_evasion
remediation:
  description: Enable CloudWatch log export on the cluster..
  action: Enable CloudWatch log export on the cluster.
unsafe_predicate:
  all:
  - field: properties.database.kind
    op: eq
    value: neptune_cluster
  - field: properties.database.logging.cloudwatch_export_enabled
    op: eq
    value: false
