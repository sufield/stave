dsl_version: ctrl.v1
id: CTL.NEPTUNE.SG.OPEN.001
name: Neptune Cluster Security Group Must Not Allow 0.0.0.0/0 Ingress on 8182
description: >
  Neptune clusters must not have a VPC security group attached that
  allows 0.0.0.0/0 ingress on the Gremlin / SPARQL endpoint port
  (8182). Distinct from CTL.NEPTUNE.SUBNET.PUBLIC.001 (subnet
  placement): even with the cluster in a private subnet, an open
  security group plus a transit gateway peer or misconfigured NAT
  exposes the graph endpoint to internet scanners. Neptune has no
  database-local password — IAM auth is the only auth mechanism —
  so the security boundary is entirely the network policy plus
  CTL.NEPTUNE.AUTH.IAM.001.
domain: network
severity: critical
compliance:
  nist_800_53_r5: SC-7
  soc2: CC6.6
  pci_dss_v4.0: 1.3.4
  ccm_v4:
  - IVS-03
  - IVS-04
scope_tags:
- aws
- neptune
taxonomy:
  - compliance-mapping
  - network-isolation
  - network-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_neptune_cluster]
params:
  attack_stage: initial_access
remediation:
  description: >
    A VPC security group attached to the cluster permits ingress
    from 0.0.0.0/0 on the Neptune port (8182). Combined with IAM
    auth disabled, anyone with VPC reach can issue Gremlin / SPARQL
    queries directly.
  action: >
    Replace the 0.0.0.0/0 rule with the CIDR block(s) of the
    application tier or VPN range that legitimately needs cluster
    access. Even in private deployments, scope the rule to the
    specific tier rather than the whole VPC.
unsafe_predicate:
  all:
  - field: properties.database.kind
    op: eq
    value: neptune_cluster
  - field: properties.database.network.security_group_open_to_world
    op: eq
    value: true
