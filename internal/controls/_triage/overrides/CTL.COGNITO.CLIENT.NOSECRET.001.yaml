control: CTL.COGNITO.CLIENT.NOSECRET.001
defect: >
  Confidential Cognito app client has no client
  secret.
infection: >
  Cognito app clients with a secret authenticate
  to the token endpoint using HTTP Basic auth
  with client_id:client_secret. Without a
  secret, the client identifies itself with
  client_id alone — and client_id is not a
  secret (it appears in URLs, logs, callback
  redirects). Any party that obtains the
  client_id can impersonate the application,
  exchange auth codes for tokens, and act in
  the application's name. The intentional case
  for no-secret is a public client (mobile or
  SPA) where storing a secret is impossible
  anyway. The dangerous case is a server-side
  client that someone left without a secret —
  the application has no client-level identity
  proof, only the OAuth flow's user-level
  proof.
failure: >
  Application has no client-level authentication
  to Cognito. Any caller with the client_id
  can impersonate the application.
