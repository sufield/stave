control: CTL.IAM.ESCALATE.ATTACHROLEPOLICY.001
defect: >
  The principal (user or role) has iam:AttachRolePolicy scoped to a
  reachable role — its own ARN (role self-attach), an assumable role's
  ARN (user case), wildcard "*", or a role-set that includes one. It
  can attach any managed policy to that role.
infection: >
  A single AttachRolePolicy call attaches AdministratorAccess (or
  any other broad managed policy) to the target role. That role's
  effective permissions expand immediately, and every active session
  under it picks up the new permissions on the next API call. The role
  ARN appears unchanged in casual review — only the attached policy
  list grows.
failure: >
  Privilege escalation to admin. The principal — or any identity that
  assumes the target role — can grant itself unrestricted permissions
  with a single API call.
