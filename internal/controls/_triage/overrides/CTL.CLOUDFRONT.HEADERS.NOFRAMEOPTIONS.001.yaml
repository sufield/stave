control: CTL.CLOUDFRONT.HEADERS.NOFRAMEOPTIONS.001
defect: >
  CloudFront distribution doesn't send X-Frame-Options or
  frame-ancestors CSP directive.
infection: >
  Iframe embedding lets one origin display another origin's
  content inside a frame on its own page. Without a server-
  side instruction forbidding the framing, browsers allow
  it. An attacker hosts a page that frames the legitimate
  site, overlays invisible UI controls (transparent
  buttons, click-targets positioned over the framed
  content), and tricks the visitor into clicking through
  to destructive actions on the framed site — funds
  transfers, profile changes, account deletion. The
  pattern (clickjacking) is one of the older browser-side
  attacks but remains effective against any site that
  doesn't forbid framing. The classic defense is the
  X-Frame-Options header (DENY or SAMEORIGIN). The modern
  defense is the frame-ancestors directive in Content-
  Security-Policy, which supports more granular control.
  Most sites should use both for defense in depth — older
  browsers honor X-Frame-Options, newer browsers honor
  the CSP directive, and frames from foreign origins are
  refused either way.
failure: >
  Clickjacking exposure. The site embeds in iframes on
  attacker-controlled pages; UI overlay attacks succeed
  on any user who can be social-engineered to visit.
