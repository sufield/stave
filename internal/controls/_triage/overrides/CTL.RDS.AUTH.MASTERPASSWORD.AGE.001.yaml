control: CTL.RDS.AUTH.MASTERPASSWORD.AGE.001
defect: >
  RDS master password has not been rotated within
  the configured threshold (default 90 days).
infection: >
  The master password is the administrative
  credential — schema modification, user
  management, full data access, configuration
  changes. Long-lived master passwords accumulate
  exposure across the lifetime of the
  organization in places that the security review
  cannot easily inventory: shell history files
  on bastion hosts that no longer have owners,
  config files in private repos that
  accidentally became public years later when a
  permission change rippled through, connection-
  pool definitions cached in build artifacts of
  long-since-deployed images, Slack DMs and
  email threads from the database's initial
  setup, password managers belonging to people
  who have rotated out of the role. Each
  individual exposure is small; the cumulative
  exposure of a 200-day-old master password is
  significant and cannot be reduced without
  rotation. The 90-day floor matches PCI-DSS 8.3
  rotation expectations and FedRAMP credential-
  rotation baselines. With Secrets Manager
  ManageMasterUserPassword enabled, RDS rotates
  the master automatically; without it, rotation
  is a documented runbook step that team
  attrition and operational pressure conspire
  against.
failure: >
  Long-lived administrative credential. The
  master password has been static for the
  threshold window, accumulating exposure across
  people, systems, and historical artifacts that
  the security review cannot enumerate.
