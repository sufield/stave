control: CTL.IAM.PASSWORD.ROTATION.001
defect: >
  IAM user console password has not been rotated within the
  organizational policy period (typically 90 days).
infection: >
  Stale passwords accumulate exposure risk — more time for the
  credential to have been phished, shared, shoulder-surfed, or
  keylogged. Unlike access keys which have discrete creation events,
  passwords can be compromised through multiple vectors that leave
  no trace in CloudTrail.
failure: >
  Accumulated password compromise risk. The password has existed
  long enough to have been exposed through one or more vectors
  without any credential refresh.
