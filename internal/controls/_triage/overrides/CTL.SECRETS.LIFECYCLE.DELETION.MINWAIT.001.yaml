control: CTL.SECRETS.LIFECYCLE.DELETION.MINWAIT.001
defect: >
  Secret is scheduled for deletion with the minimum 7-day
  recovery window.
infection: >
  When a secret is scheduled for deletion the recovery
  window is the only buffer against accidentally deleting a
  credential a service still depends on. With a 7-day
  window, consumers that retrieve the credential less than
  weekly may never surface — by the time the monthly
  billing job tries to authenticate, the secret has been
  permanently deleted. Permanent deletion is irreversible.
  A 30-day window catches monthly and most quarterly jobs
  while the secret is still recoverable. The minimum window
  is acceptable only for secrets whose consumers are
  catalogued and active.
failure: >
  Insufficient recovery buffer. Secret deletion will
  complete before infrequent consumers have a chance to
  fail loudly.
