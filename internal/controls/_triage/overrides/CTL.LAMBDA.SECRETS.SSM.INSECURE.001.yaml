control: CTL.LAMBDA.SECRETS.SSM.INSECURE.001
defect: >
  Lambda function references one or more SSM
  Parameter Store parameters that hold
  credentials but are stored as String type
  instead of SecureString.
infection: >
  SSM Parameter Store String type stores values
  in plaintext at rest and gates reads on a
  single IAM action — ssm:GetParameter — that
  is granted broadly in many fleets because it
  is also the right action for non-credential
  parameters (config endpoints, feature flags,
  build versions). Anyone with that grant
  reads the parameter value without any
  additional decrypt step, without any
  CloudTrail entry that distinguishes a
  credential read from a configuration read,
  and without ever interacting with KMS. The
  parameter value is visible in the SSM
  console for any role that can navigate
  there. SecureString-typed parameters
  encrypt the value with KMS, gate reads on
  kms:Decrypt against the key policy in
  addition to ssm:GetParameter, log every
  decrypt in CloudTrail under the calling
  identity, and keep ciphertext at rest. The
  pattern that produces this finding is a
  one-shot parameter creation that took the
  SSM default (String) for what was
  recognizably a credential, or a refactor
  where the parameter was migrated to a new
  name without re-typing as SecureString.
  Same architectural pattern as the S3 / RDS /
  Secrets-Manager equivalence: managed storage
  is necessary but not sufficient — the
  storage type matters.
failure: >
  Credential stored in plaintext. The SSM
  parameter is readable by every principal
  with ssm:GetParameter on the parameter
  hierarchy; KMS, key-policy review, and
  per-fetch audit are all bypassed.
