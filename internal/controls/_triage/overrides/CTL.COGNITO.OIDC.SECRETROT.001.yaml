control: CTL.COGNITO.OIDC.SECRETROT.001
defect: >
  Cognito OIDC provider client secret has not
  been rotated in 90+ days.
infection: >
  OIDC client secrets are bearer credentials
  Cognito uses to authenticate to the IdP's
  token endpoint. Long-lived secrets are
  long-lived attack surface — compromised
  through any of the usual paths
  (configuration leak, infrastructure
  takeover, insider threat), they remain
  valid until manual rotation. A 90-day
  rotation cadence bounds the worst-case
  exposure window without imposing
  pathological operational overhead.
  Production secrets that haven't rotated
  in over a year are typical and frequent
  — the rotation discipline tends to atrophy
  once the integration works.
failure: >
  Stale OIDC client secret. Long-lived
  bearer credential beyond standard rotation
  window.
