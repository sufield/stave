control: CTL.S3.POLICY.WRITE.001
defect: >
  The bucket policy contains a Statement with Effect "Allow",
  Principal "*" (or AWS: "*"), and a write action such as
  s3:PutObject, s3:DeleteObject, or s3:*. No restricting
  Condition narrows the principal to a specific account, VPC,
  IP range, or organization.
infection: >
  Any unauthenticated HTTP caller can issue PUT or DELETE
  against the bucket, including object overwrites of existing
  keys. Object uploads do not require listing permissions, so
  attackers do not need to enumerate to exploit — they upload
  crafted objects against guessed or leaked keys, or write
  fresh malicious content for serving. In combination with
  public read on the same bucket, an attacker can replace
  JavaScript, documents, or binaries that legitimate users
  download.
failure: >
  Content takeover. Attackers can inject malicious objects,
  overwrite trusted artifacts, or hold data ransom by deleting
  and re-uploading encrypted copies. If the bucket backs a
  website, CDN, or software distribution, every downstream
  consumer receives attacker-controlled content until the
  bucket is remediated and the content re-validated.
