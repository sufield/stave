control: CTL.ECS.TASKDEF.SECRET.BROKEN.REF.001
defect: >
  Task execution role lacks IAM permission to
  retrieve a secret or SSM parameter that the
  task definition references via valueFrom.
infection: >
  ECS resolves valueFrom references at task
  launch by having the execution role call
  secretsmanager:GetSecretValue (for Secrets
  Manager) or ssm:GetParameter (for SSM). When
  the role's policy doesn't grant that
  permission against the specific resource
  ARN, the call returns AccessDeniedException
  and the task fails before the container
  starts. The failure mode is structurally
  similar to the ghost-reference cases (deleted
  secret, deleted parameter) but the underlying
  cause is different: the resource exists, the
  reference is correct, and the gap is in IAM
  rather than in the resource catalog.
  Operators frequently hit this on first
  introduction of valueFrom — the secret is
  created, the task definition is updated to
  reference it, the deployment fails, and the
  cause is "the execution role's policy was
  written before the secret existed and was
  never updated." Same fix every time: add a
  scoped Get permission to the role's policy
  for the new ARN. Same architectural lesson
  as CTL.LAMBDA.SECRETS.BROKEN.REF.001 — the
  reference and the permission must be wired
  together.
failure: >
  Launch failure with AccessDeniedException.
  The task definition is correct, the secret
  exists, the bridge between them is missing.
