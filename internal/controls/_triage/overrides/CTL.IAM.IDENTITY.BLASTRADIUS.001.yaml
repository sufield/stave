control: CTL.IAM.IDENTITY.BLASTRADIUS.001
defect: >
  The IAM role can reach more than 50 resources through direct
  permissions and transitive role assumption chains.
infection: >
  A single credential compromise gives an attacker access to the
  entire reachable resource set. The blast radius includes every
  resource reachable through sts:AssumeRole edges and transitive
  chains. A role that can assume three other roles, each with 20
  resources, has a blast radius of 60+ even if its direct
  permissions are narrow.
failure: >
  Wide blast radius from credential compromise. A single compromised
  role provides access to a disproportionately large number of
  resources.
