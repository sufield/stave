control: CTL.SECRETS.GHOST.ROTATIONLAMBDA.001
defect: >
  Secret has rotation enabled but the rotation Lambda
  function has been deleted; rotation cannot execute.
infection: >
  Secret rotation is the mechanism that changes the
  credential on a schedule — generating a new password,
  updating the target service (RDS, API, etc.), and storing
  the new value. When the rotation Lambda is deleted: the
  rotation schedule triggers on time, the trigger attempts
  to invoke the Lambda, the invocation fails (function not
  found), the rotation fails silently, the credential
  doesn't change. The secret's LastRotatedDate stops
  advancing. The credential becomes static — the same
  password indefinitely. The rotation configuration shows
  "Rotation enabled: Yes" and "Rotation schedule: 30 days."
  An auditor checking rotation sees "enabled." The
  credential hasn't actually changed since the Lambda was
  deleted — which could be weeks, months, or years ago.
failure: >
  Silent rotation failure. Rotation appears enabled but the
  Lambda function was deleted. The credential is static
  while appearing rotated.
