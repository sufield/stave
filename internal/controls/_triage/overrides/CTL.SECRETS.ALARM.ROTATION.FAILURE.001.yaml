control: CTL.SECRETS.ALARM.ROTATION.FAILURE.001
defect: >
  No CloudWatch alarm monitors Secrets Manager rotation
  failures.
infection: >
  Rotation failure means the Lambda function attempted to
  rotate the credential and failed. Common causes: the
  Lambda function can't reach the target database
  (network/VPC/SG change), the Lambda function doesn't
  have permission to change the password (IAM policy
  changed), the Lambda function code has a bug (runtime
  error), or the target service rejected the new
  credential (password policy violation). After failure:
  the credential stays the same (AWSCURRENT unchanged),
  the LastRotatedDate doesn't advance, and Secrets Manager
  may retry on the next scheduled rotation — which may
  also fail for the same reason. Without an alarm, the
  team discovers rotation failure when an auditor checks
  LastRotatedDate (weeks later), a compliance scan flags
  the secret (quarterly), or ROTATION.STALE.001 fires
  (after 2x the interval). A rotation failure alarm
  provides minutes-level detection.
failure: >
  Undetected rotation failure. Credential rotation failed
  — the credential is static with no real-time
  notification.
