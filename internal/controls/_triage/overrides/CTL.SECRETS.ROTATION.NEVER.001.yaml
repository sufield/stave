control: CTL.SECRETS.ROTATION.NEVER.001
defect: >
  Secret rotation is enabled but has never successfully
  rotated.
infection: >
  Rotation was configured at secret creation time (or
  shortly after) but has never executed successfully. The
  rotation Lambda has been invoked one or more times by the
  schedule and every invocation has failed. Common
  first-rotation failures: the rotation Lambda's execution
  role can't assume the database admin role; the Lambda's
  network configuration prevents reaching the target service
  (RDS in a private subnet without VPC endpoints); the
  rotation strategy is misconfigured for the credential
  type (single-user template applied to a multi-user
  workload). Until rotation succeeds at least once, the
  credential stored in the secret is whatever value was
  initialized at creation.
failure: >
  Original credential never changed. The secret holds the
  value first stored at creation time despite rotation
  being enabled.
