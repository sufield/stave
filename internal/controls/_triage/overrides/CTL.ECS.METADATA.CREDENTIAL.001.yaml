control: CTL.ECS.METADATA.CREDENTIAL.001
defect: >
  The ECS task definition does not restrict credential endpoint access.
  All containers in the task — including sidecars and utility
  containers — can retrieve the task role's IAM credentials from the
  metadata endpoint at 169.254.170.2.
infection: >
  An SSRF-vulnerable container running on ECS/Fargate reaches the task
  metadata endpoint and retrieves the task role's temporary IAM
  credentials. The attacker uses these credentials from external
  infrastructure to access AWS resources with the task role's
  permissions. This is the same attack class as EC2 IMDSv1 credential
  theft (Capital One) but on containers. Unlike EC2 IMDS which has
  IMDSv2 token requirements, ECS task metadata has no equivalent
  token mechanism.
failure: >
  Container credential theft via SSRF. An attacker exfiltrates task
  role credentials and operates with the task's AWS permissions from
  outside the container environment.
