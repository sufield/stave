control: CTL.SECRETS.POLICY.READWRITE.001
defect: >
  Secret policy grants both GetSecretValue and PutSecretValue
  to the same application principal.
infection: >
  Separation of read and write for credentials means:
  applications READ the credential (GetSecretValue) to
  authenticate to the target service. Administrators or
  rotation functions WRITE the credential (PutSecretValue)
  to update it. When both permissions overlap on an
  application principal: a compromised application role can
  change the database password (locking out every other
  application that uses the same credential), an insider
  with application access can modify the credential
  (replacing the production password with one they control),
  and there's no separation between credential consumer and
  credential manager. The blast radius of compromising the
  application role expands from "read the credential" to
  "control the credential."
failure: >
  No read/write separation. The same principal can both
  retrieve and replace the credential.
