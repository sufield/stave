control: CTL.APIGATEWAY.STAGE.VARS.CREDENTIALS.001
defect: >
  API Gateway stage variables hold values that
  match credential patterns (access keys, database
  connection strings with embedded passwords,
  password=/token= assignments, JWT-shaped
  strings).
infection: >
  Stage variables are plaintext configuration
  attached to a stage. They appear in: the API
  Gateway console (visible to anyone with
  apigateway:GetStage), API exports
  (OpenAPI/Swagger generated by ExportStage),
  CloudTrail UpdateStage events (visible in the
  audit trail), and any mapping template or
  integration that interpolates them — which can
  reflect the credential into responses if the
  template doesn't escape correctly. There is no
  rotation, no encryption at rest at the
  application layer, and no separation between
  who can read API Gateway configuration and who
  can read the secret. Same detection pattern as
  CTL.LAMBDA.ENV.SECRETS.001 — the Lambda env
  vars surface; this is the API Gateway stage
  vars surface. The architectural mistake is the
  same: putting secrets in plaintext config
  rather than a dedicated secret store.
failure: >
  Credentials in plaintext configuration. Anyone
  with apigateway:GetStage reads the credential;
  rotation requires manual coordination with
  every dependent system.
