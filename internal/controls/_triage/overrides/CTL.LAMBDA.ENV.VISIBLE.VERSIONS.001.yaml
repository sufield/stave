control: CTL.LAMBDA.ENV.VISIBLE.VERSIONS.001
defect: >
  Lambda function has multiple published
  versions whose environment-variable maps
  differ from the current ($LATEST) version.
infection: >
  Published Lambda versions are immutable
  snapshots of the function configuration —
  including the full environment-variable map
  at the moment the version was published —
  and the snapshot persists for as long as
  the version exists, regardless of what
  happens to the live function afterward.
  Anyone with lambda:GetFunction against the
  version-qualified ARN
  (function:my-fn:3, function:my-fn:5, etc.)
  can read the historical environment block
  for that version. A database password that
  was a raw value in version 3 is still
  readable from version 3 a year later, even
  if version 14 is the live version and the
  password has been rotated three times in the
  meantime. Lambda Aliases that point at
  older versions keep them alive (and
  accessible) by definition; many fleets retain
  every published version for rollback
  capability without realizing the env-block
  retention implication. The leak is
  conditional on the env var ever having
  contained a credential; non-credential
  drift (feature-flag changes, URL updates) is
  not leaking anything sensitive but is the
  same observation surface, so the control
  fires on env-block divergence and the
  triage explains the credential-history
  consideration.
failure: >
  Credential history in version snapshots.
  Old credentials from previous configurations
  remain readable by GetFunction against the
  version-qualified ARN, even after the live
  function has rotated past them.
