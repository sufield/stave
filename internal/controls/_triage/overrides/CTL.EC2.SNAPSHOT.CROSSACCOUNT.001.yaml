control: CTL.EC2.SNAPSHOT.CROSSACCOUNT.001
defect: >
  The EBS snapshot is shared with one or more external AWS accounts.
  The snapshot data is accessible from those accounts.
infection: >
  An attacker with ec2:ModifySnapshotAttribute shares the snapshot to
  their own AWS account. From their account, the attacker restores
  the snapshot as an EBS volume and mounts it — gaining full read
  access to the volume's data. If the snapshot is unencrypted, no
  additional access (KMS key) is needed. This is ATT&CK technique
  T1578.001 (Create Snapshot) — data exfiltration through the
  snapshot sharing mechanism.
failure: >
  Cross-account data exfiltration via EBS snapshot. An attacker
  accesses the full contents of an EBS volume — databases, file
  systems, application data — by restoring a shared snapshot in
  their own account.
