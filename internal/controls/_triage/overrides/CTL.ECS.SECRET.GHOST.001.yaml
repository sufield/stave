control: CTL.ECS.SECRET.GHOST.001
defect: >
  ECS task definition references a Secrets Manager secret that has been
  deleted. The container either fails to start or falls back to insecure
  defaults.
infection: >
  Applications commonly handle missing secrets by falling back to
  hardcoded credentials, insecure connections, or unauthenticated mode.
  The fallback is silent — the container runs, the application serves
  traffic, but the security posture has degraded without any alert.
failure: >
  Credential fallback to insecure default. The container operates without
  the intended credential, potentially connecting to databases without
  authentication or disabling TLS verification.
