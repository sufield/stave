control: CTL.EC2.USERDATA.CREDS.001
defect: >
  The EC2 launch template embeds credentials (AWS access keys,
  passwords, or API tokens) in the user data script. User data is
  stored in plaintext and accessible via the instance metadata
  service at 169.254.169.254/latest/user-data.
infection: >
  Any process on the instance — including attacker code exploiting
  an SSRF vulnerability or running after initial compromise — can
  retrieve the embedded credentials from the metadata endpoint in a
  single HTTP GET. The credentials are also visible in the EC2
  console, CloudFormation template history, and
  ec2:DescribeInstanceAttribute API responses, creating multiple
  extraction paths.
failure: >
  Credential exposure with lateral movement potential. The embedded
  credentials grant access to whatever resources they protect and
  persist in the launch template even after the instance is
  terminated.
