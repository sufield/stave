control: CTL.EC2.USERDATA.SECRETS.001
defect: >
  The EC2 instance's user data contains embedded secrets (API keys,
  database passwords, or tokens). User data is stored in plaintext
  and accessible to every process on the instance via the metadata
  endpoint.
infection: >
  Any compromised process on the instance can retrieve secrets from
  the metadata service at 169.254.169.254/latest/user-data without
  elevated privileges. The secrets are also visible through the EC2
  console and ec2:DescribeInstanceAttribute API, meaning any
  principal with EC2 read access can extract them.
failure: >
  Credential exposure. The embedded secrets grant access to the
  systems they authenticate to, and they persist in instance
  metadata and EC2 API responses for the lifetime of the instance.
