control: CTL.ECS.IMAGE.UNTRUSTED.001
defect: >
  The ECS task definition references a container image from a
  registry outside the organization's trusted set (e.g., Docker Hub
  or a third-party registry instead of the account's ECR).
infection: >
  Images from untrusted registries may contain vulnerabilities,
  backdoors, or cryptocurrency miners. The image executes with the
  task role's AWS permissions, meaning malicious code in the image
  has direct access to the service's AWS resources. The image source
  is outside the organization's control — updates, deletions, or
  tag mutations by the source owner affect production workloads.
failure: >
  Supply chain compromise. Malicious or vulnerable code executes in
  the production environment with legitimate service permissions.
