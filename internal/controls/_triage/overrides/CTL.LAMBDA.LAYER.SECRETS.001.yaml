control: CTL.LAMBDA.LAYER.SECRETS.001
defect: >
  One or more Lambda layers attached to this function contain
  embedded secrets (API keys, credentials, certificates, or private
  keys).
infection: >
  Secrets in layers are accessible to anyone with
  lambda:GetLayerVersion permission. Unlike environment variables
  (which can be encrypted with KMS), layer contents are stored
  as plain archives. Secrets persist across function versions and
  layer version updates — deleting the secret from code does not
  remove it from published layer versions.
failure: >
  Credential exposure. Embedded secrets are extractable by any
  principal with layer read access, enabling unauthorized access
  to the systems those credentials protect.
