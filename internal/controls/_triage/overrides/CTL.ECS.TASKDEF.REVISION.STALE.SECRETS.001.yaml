control: CTL.ECS.TASKDEF.REVISION.STALE.SECRETS.001
defect: >
  Older revisions of this task definition family
  contain plaintext credentials in container env
  vars, even when the current active revision
  has been migrated to valueFrom.
infection: >
  ECS task definition revisions are immutable.
  Updating a task definition creates a new
  revision; the old revision is preserved
  forever (until explicitly deregistered) so
  that running tasks still pinned to the old
  revision can resolve their configuration.
  When an operator migrates secrets out of env
  vars into Secrets Manager or SSM, the
  migration changes the new revision; the
  history of plaintext-credential revisions
  remains intact and remains accessible to any
  identity with ecs:DescribeTaskDefinition on
  the older revision ARNs. Two consequences
  follow. First, the credentials in the stale
  revisions are still readable — the
  "migration" doesn't remove them from the
  control plane, it just stops new tasks from
  using them. Second, CloudTrail's
  RegisterTaskDefinition events from the
  pre-migration era preserve the same plaintext
  values in the audit log itself; even
  deregistering the revisions doesn't remove
  the values from CloudTrail. Real remediation
  requires treating the leaked credentials as
  compromised and rotating the underlying
  secret (database password, API token, access
  key) — not just changing the task definition.
  Severity is medium because the current state
  is clean and the historical exposure depends
  on who has IAM read on older revision ARNs;
  high enough to flag because operators
  consistently underestimate that "we moved to
  Secrets Manager" doesn't equal "the old
  passwords are safe."
failure: >
  Migration is incomplete. Stale revisions
  preserve plaintext credentials accessible via
  DescribeTaskDefinition; CloudTrail history
  preserves them indelibly.
