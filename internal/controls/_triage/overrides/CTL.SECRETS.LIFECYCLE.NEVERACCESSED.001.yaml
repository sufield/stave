control: CTL.SECRETS.LIFECYCLE.NEVERACCESSED.001
defect: >
  Secret has never been accessed since creation.
infection: >
  A secret that has never been accessed indicates the
  consumer never integrated. The credential sits in Secrets
  Manager, encrypted by the KMS key, with a resource policy
  granting access — and nobody retrieves it. Common causes:
  the deployment was abandoned mid-way, the application
  configuration was never updated to point at the secret
  ARN, the team stored the credential "for later" without
  integrating. The credential is not exercised; rotation (if
  enabled) churns the value without any consumer noticing;
  the credential is also a latent surface — if the resource
  policy is overly broad, the credential is readable but
  unused, which means illegitimate reads have no
  legitimate-baseline to stand out against.
failure: >
  Original credential never retrieved. The secret was
  created with intent that never materialized.
