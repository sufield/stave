control: CTL.SECRETS.REPLICA.POLICY.MISMATCH.001
defect: >
  Secret replicas across regions have inconsistent resource
  policies.
infection: >
  Replicated secrets share the same credential value across
  regions. If the primary in us-east-1 has a restrictive
  policy (GetSecretValue only for specific production
  roles) but the replica in ap-southeast-1 has a broader
  policy (GetSecretValue for account root), an attacker
  reads the credential from the replica. The credential is
  the same. The access control is different. The weakest
  replica policy is the effective access control for the
  credential. Additionally, replicas in less-monitored
  regions may have less CloudTrail coverage — access to
  the replica may be less visible than access to the
  primary.
failure: >
  Inconsistent credential access control across regions.
  The weakest replica policy determines effective access
  to the credential.
