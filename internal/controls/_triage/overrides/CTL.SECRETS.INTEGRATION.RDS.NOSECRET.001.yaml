control: CTL.SECRETS.INTEGRATION.RDS.NOSECRET.001
defect: >
  RDS master credential is not managed by Secrets Manager.
infection: >
  An RDS master credential outside Secrets Manager has
  no: automated rotation (the password is static until
  someone manually changes it), access auditing (who
  knows the password is untracked — it's a string stored
  somewhere), access control (anyone who has the password
  string can authenticate — no IAM policy, no resource
  policy, no KMS key), or lifecycle management (the
  password persists until someone remembers to change
  it). The credential is likely hardcoded in: application
  configuration files (committed to source control),
  CloudFormation templates (visible to anyone with stack
  access), environment variables (visible in the
  execution environment), or documentation (wikis,
  runbooks, shared documents).
failure: >
  Unmanaged database credential. Master password is
  outside Secrets Manager — no rotation, no auditing, no
  access control.
