control: CTL.APIGATEWAY.PAYLOAD.SIZE.UNLIMITED.001
defect: >
  REST API method does not declare an explicit maximum body
  size constraint via the request validator and request model.
infection: >
  API Gateway accepts request bodies up to the service maximum
  (10 MB for both REST and HTTP APIs). For most APIs the
  legitimate maximum is far smaller — kilobytes for typical
  JSON, hundreds of kilobytes for richly-attributed records.
  The 10 MB ceiling is a memory amplification vector: an
  attacker sends max-size bodies repeatedly to exhaust backend
  memory (Lambda allocation, container heap), drive up
  invocation cost, or trigger downstream timeouts. The fix is
  the request model declaring maxLength / maxItems / maxBytes
  constraints in JSON Schema attached to the method, with the
  request validator configured to enforce body validation.
  Methods that legitimately accept large bodies (file upload,
  batch import) should document the rationale — the constraint
  isn't always tighter than the service maximum, but the
  decision should be deliberate.
failure: >
  Memory amplification. Max-size bodies consume backend memory
  and invocation budget far beyond what the operation should
  ever need.
