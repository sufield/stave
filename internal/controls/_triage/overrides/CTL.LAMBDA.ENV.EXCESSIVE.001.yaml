control: CTL.LAMBDA.ENV.EXCESSIVE.001
defect: >
  Lambda function carries more environment
  variables than the audit threshold permits
  (default 20).
infection: >
  Functions that exceed the env-var threshold
  are almost always misconfigured: they hold a
  mix of credentials (which should live in
  Secrets Manager — see SECRETS.NOTMANAGED),
  endpoint URLs (which should live in SSM
  Parameter Store hierarchies or AWS
  AppConfig), feature flags (which belong in
  AppConfig), retry parameters (config
  service), and per-deploy values (build
  metadata, region IDs, version strings)
  that an external configuration service
  manages more cleanly than the function's
  immutable env block. Three problems
  compound at scale. (1) Audit cost: a 30-
  variable env block is past the size a
  human reviewer can hold in working memory;
  identifying which entries are credentials
  versus URLs versus flags becomes a
  per-variable pattern-matching exercise that
  is rarely repeated thereafter. (2)
  Rotation cost: every change to any one
  variable requires a function configuration
  update, and (for raw credentials) a
  published-version churn that retains the
  historical value, multiplying the cost of
  rotation by every variable that has ever
  been rotated. (3) Disclosure surface: every
  additional variable is one more value
  exposed to any IAM principal that can call
  lambda:GetFunctionConfiguration, expanding
  the reconnaissance surface available to
  anyone with that grant. The threshold is a
  heuristic; some functions legitimately
  carry many flags, and the threshold is
  configurable.
failure: >
  Configuration sprawl. Audit, rotation, and
  disclosure costs all rise linearly with
  variable count past the threshold.
