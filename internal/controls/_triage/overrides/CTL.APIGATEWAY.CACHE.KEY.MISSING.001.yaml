control: CTL.APIGATEWAY.CACHE.KEY.MISSING.001
defect: >
  REST API method has caching enabled but no cache key
  parameters configured.
infection: >
  Cache key parameters tell API Gateway which request attributes
  partition the cache: query string parameters, path parameters,
  headers. With no key parameters, every request to a given
  resource+method receives the same cached response regardless
  of input variation. /products?id=5 and /products?id=42 share
  one cache slot — the second caller receives the first
  caller's data. The cache turns from a performance accelerator
  into a correctness hazard: cross-user data leakage, search
  results unrelated to the query, responses for resource IDs
  the requester doesn't own. The fix is to key on the request
  attributes that legitimately vary the response (query string,
  path parameter, the auth-derived caller); endpoints whose
  response should not be cached at all should disable caching
  rather than caching with no keys.
failure: >
  Cross-user data leakage via shared cache. Users receive each
  other's responses; correctness collapses while caching looks
  like it's working.
