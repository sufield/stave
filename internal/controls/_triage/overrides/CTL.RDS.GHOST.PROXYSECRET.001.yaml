control: CTL.RDS.GHOST.PROXYSECRET.001
defect: >
  RDS Proxy references a Secrets Manager secret
  whose ARN no longer resolves to an existing
  secret.
infection: >
  This is the most dangerous ghost reference in
  the database-domain set because the failure
  mode is delayed, not immediate. RDS Proxy
  authenticates to the backend database using
  credentials retrieved from Secrets Manager;
  once the Proxy has an authenticated connection
  pool, those connections continue serving
  application traffic without re-fetching the
  secret. The pool re-fetches only when it
  refreshes (idle expiry, scale-out, restart,
  pool-size growth, secret rotation event). On
  re-fetch the lookup fails, the Proxy cannot
  authenticate, and every new connection
  attempt returns a connection-establishment
  error. Existing connections continue serving
  requests. The Proxy console reports healthy.
  The application sees normal traffic. Hours
  later — frequently in the off-hours when
  pools naturally turn over after the day's
  peak — a wave of new-connection failures
  surfaces, the on-call sees Proxy errors, and
  the connection between "secrets engineer
  deleted the old version of secret X this
  morning" and "RDS Proxy is failing now"
  is not obvious in the timeline. The most
  common origins are secret-rotation workflows
  that delete the previous secret without
  confirming the Proxy was re-pointed, account
  migrations that did not migrate the Proxy
  configuration, and IaC drift that removed
  the secret reference while keeping the Proxy.
failure: >
  Delayed connection failure with no obvious
  causal link. The Proxy serves existing
  connections successfully and fails new
  connections only after the pool refreshes,
  hours after the secret deletion that caused
  the problem.
