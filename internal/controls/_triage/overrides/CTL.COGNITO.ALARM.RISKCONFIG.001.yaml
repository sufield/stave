control: CTL.COGNITO.ALARM.RISKCONFIG.001
defect: >
  No CloudWatch alarm monitors
  SetRiskConfiguration API calls.
infection: >
  Advanced security risk configuration
  controls whether Cognito blocks sign-ins
  that match compromised credentials, blocks
  high-risk login patterns, and enforces
  adaptive authentication. SetRiskConfiguration
  is the API that flips these. An attacker
  with the right Cognito permissions (or a
  misconfigured automation) can downgrade
  enforced to audit-only, set the
  compromised-credentials action to NO_ACTION,
  or disable the entire feature. The downgrade
  doesn't show in user-visible login flows;
  it surfaces only when the attacker exploits
  the now-allowed pattern. An alarm catches
  the configuration change immediately.
failure: >
  Silent advanced-security downgrade. Risk
  configuration can be weakened without
  notification.
