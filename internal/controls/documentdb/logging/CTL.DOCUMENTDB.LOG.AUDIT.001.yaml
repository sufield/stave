dsl_version: ctrl.v1
id: CTL.DOCUMENTDB.LOG.AUDIT.001
name: DocumentDB Must Export Logs to CloudWatch
description: DocumentDB clusters must export audit logs to CloudWatch.
domain: audit
severity: medium
compliance:
  nist_800_53_r5: AU-12
  soc2: CC7.1
  ccm_v4:
  - LOG-03
scope_tags:
- aws
- documentdb
taxonomy:
  - compliance-mapping
  - logging
subtractive_category:
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_documentdb_cluster]
params:
  attack_stage: detection_evasion
remediation:
  description: Enable CloudWatch log export..
  action: Enable CloudWatch log export.
unsafe_predicate:
  all:
  - field: properties.database.kind
    op: eq
    value: documentdb_cluster
  - field: properties.database.logging.cloudwatch_export_enabled
    op: eq
    value: false
