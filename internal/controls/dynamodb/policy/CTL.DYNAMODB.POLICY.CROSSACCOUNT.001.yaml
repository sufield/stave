dsl_version: ctrl.v1
id: CTL.DYNAMODB.POLICY.CROSSACCOUNT.001
name: DynamoDB Table Policy Grants Cross-Account Access Without Organizational Boundary
description: >
  DynamoDB table resource policy grants actions to principals in
  external AWS accounts without an aws:PrincipalOrgID condition.
  Cross-account access without an org boundary means the external
  account can read, write, or delete table items. If the external
  account leaves the organization, access persists. Same risk
  pattern as CTL.SNS.POLICY.CROSSACCOUNT.001 and
  CTL.SQS.POLICY.CROSSACCOUNT.001.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["DSP-17", "IAM-16"]
scope_tags:
  - aws
  - dynamodb
taxonomy:
  - identity-perimeter
  - trust-boundary
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_dynamodb_table
params:
  attack_stage: initial_access
observation_fields:
  - database.kind
  - database.dynamodb.policy_cross_account
  - database.dynamodb.policy_has_org_condition
remediation:
  description: >
    DynamoDB table resource policy grants cross-account access
    without an aws:PrincipalOrgID condition.
  action: >
    Add an aws:PrincipalOrgID condition to restrict cross-account
    access to principals within the organization. If cross-account
    access is not needed, remove the resource policy entirely.
  example: |
    {
      "database": {
        "kind": "table",
        "dynamodb": {
          "policy_cross_account": true,
          "policy_has_org_condition": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.database.kind
      op: eq
      value: table
    - field: properties.database.dynamodb.policy_cross_account
      op: eq
      value: true
    - field: properties.database.dynamodb.policy_has_org_condition
      op: eq
      value: false
tests:
  - name: "cross-account without org condition fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:dynamodb:us-east-1:111122223333:table/UserData"
      asset_type: aws_dynamodb_table
      vendor: aws
      properties:
        database:
          kind: table
          dynamodb:
            policy_cross_account: true
            policy_has_org_condition: false
  - name: "cross-account with org condition passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:dynamodb:us-east-1:111122223333:table/UserData"
      asset_type: aws_dynamodb_table
      vendor: aws
      properties:
        database:
          kind: table
          dynamodb:
            policy_cross_account: true
            policy_has_org_condition: true
  - name: "no cross-account access passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:dynamodb:us-east-1:111122223333:table/Internal"
      asset_type: aws_dynamodb_table
      vendor: aws
      properties:
        database:
          kind: table
          dynamodb:
            policy_cross_account: false
