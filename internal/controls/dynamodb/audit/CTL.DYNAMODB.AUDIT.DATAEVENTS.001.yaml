dsl_version: ctrl.v1
id: CTL.DYNAMODB.AUDIT.DATAEVENTS.001
name: DynamoDB Table Has No CloudTrail Data Event Coverage
description: >
  DynamoDB table is not covered by any CloudTrail trail
  with data events enabled. Management events
  (CreateTable, DeleteTable, UpdateTable) are logged by
  default, but data events — the actual reads and writes
  to items (GetItem, PutItem, UpdateItem, DeleteItem,
  Query, Scan, BatchGetItem, BatchWriteItem) — are not
  logged unless explicitly enabled. DynamoDB has no other
  built-in audit log: CloudTrail data events are the only
  item-level audit trail. Without them, unauthorized data
  access is invisible.
domain: audit
severity: high
compliance:
  cis_aws_v3.0: "3.9"
  hipaa: "164.312(b)"
  pci_dss_v4.0: "10.2.1.7"
  soc2: "CC7.1"
  nist_800_53_r5: "AU-12"
  fedramp_moderate: "AU-12"
  ccm_v4: ["LOG-03", "LOG-05"]
scope_tags:
  - aws
  - dynamodb
taxonomy:
  - compliance-mapping
  - logging
subtractive_category:
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_dynamodb_table]
params:
  attack_stage: detection_evasion
remediation:
  description: >
    DynamoDB table is not covered by CloudTrail data
    events. No item-level audit trail exists for this
    table.
  action: >
    Add a CloudTrail data event selector that includes
    this table: event category Data, resource type
    AWS::DynamoDB::Table, ARN matching this table, with
    read/write type All. Verify the trail is delivering
    events to S3 and CloudWatch Logs.
  example: |
    {
      "database": {
        "kind": "table",
        "dynamodb": {
          "cloudtrail_data_events": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.database.kind
      op: eq
      value: table
    - field: properties.database.dynamodb.cloudtrail_data_events
      op: eq
      value: false
