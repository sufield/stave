dsl_version: ctrl.v1
id: CTL.IAM.SEMANTICS.FORANYVALUE.DENY.001
name: ForAnyValue in Deny Bypassed When Key Is Absent
description: >
  A Deny statement uses ForAnyValue on a condition key that may be
  absent from the request context. ForAnyValue tests whether ANY
  value in the request set matches the policy set — but when the
  key is absent the request set is empty, and the existential
  quantifier over an empty set is false (∃x∈∅.P(x) ≡ false). A
  false condition in a Deny statement means the deny does not fire.
  The deny is completely bypassed for every request that omits the
  key. This is the dual of Pitfall 1 (ForAllValues vacuous truth):
  where ForAllValues universally satisfies on empty sets,
  ForAnyValue universally fails. In an Allow context, ForAnyValue
  failing is conservative (access denied). In a Deny context,
  ForAnyValue failing is dangerous — the deny that was supposed to
  block certain values never fires. Formally: the intended deny
  domain is |{r : ∃v∈r.key. v∈P}| but the actual domain is
  |{r : r.key ∈ dom(r) ∧ ∃v∈r.key. v∈P}|, excluding all requests
  where the key is absent. For service-specific keys absent from
  most request types, this exclusion can be enormous.
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["IAM-05"]
scope_tags:
  - aws
  - iam
taxonomy:
  - formal-semantics
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_policy
params:
  attack_stage: detection_evasion
  base_impact: 6
  blast_radius:
    type: prevention
    scope: account
    multiplier: 1.5
remediation:
  description: >
    IAM Deny statement uses ForAnyValue on a key that may be absent.
    The deny is silently bypassed for requests missing the key.
  action: >
    Replace ForAnyValue with the scalar operator and add explicit
    handling for key absence. Use a Null condition check
    (Null: {key: "true"}) in a separate Deny statement to also
    block requests where the key is absent, or restructure as an
    Allow-with-ForAnyValue pattern where the conservative failure
    mode (deny access on empty set) is desirable.
  example: |
    {
      "identity": {
        "kind": "policy",
        "policy": {
          "semantics": {
            "has_foranyvalue_deny_on_absent_key": false
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: policy
    - field: properties.identity.policy.semantics.has_foranyvalue_deny_on_absent_key
      op: present
    - field: properties.identity.policy.semantics.has_foranyvalue_deny_on_absent_key
      op: eq
      value: true
tests:
  - name: "Deny with ForAnyValue on optional key fails"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:policy/RegionDeny"
      asset_type: aws_iam_policy
      vendor: aws
      properties:
        identity:
          kind: policy
          policy:
            semantics:
              has_foranyvalue_deny_on_absent_key: true
  - name: "Deny with ForAnyValue plus Null guard passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:policy/RegionDenySafe"
      asset_type: aws_iam_policy
      vendor: aws
      properties:
        identity:
          kind: policy
          policy:
            semantics:
              has_foranyvalue_deny_on_absent_key: false
