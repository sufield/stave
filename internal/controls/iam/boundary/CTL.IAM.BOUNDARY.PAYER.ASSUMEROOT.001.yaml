dsl_version: ctrl.v1
id: CTL.IAM.BOUNDARY.PAYER.ASSUMEROOT.001
name: Payer Permission Boundary Must Deny sts:AssumeRoot
description: >
  Permission boundary in the management account does not deny
  sts:AssumeRoot for non-admin principals. AssumeRoot allows
  a principal to obtain temporary credentials with root-level
  privileges in a member account. If the management account
  is compromised and the boundary doesn't deny AssumeRoot,
  the attacker can escalate to root in any member account.
domain: identity
severity: critical
compliance:
  nist_800_53_r5: "AC-6(1)"
  soc2: "CC6.1"
  ccm_v4: ["IAM-05"]
scope_tags:
  - aws
  - iam
taxonomy:
  - least-privilege
  - trust-boundary
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  attack_stage: privilege_escalation
  base_impact: 10
  blast_radius:
    type: identity
    scope: organization
    multiplier: 5.0
observation_fields:
  - identity.kind
  - identity.account.is_management
  - identity.role.has_boundary
  - identity.role.boundary_denies_assume_root
remediation:
  description: >
    Permission boundary in management account does not
    deny sts:AssumeRoot.
  action: >
    Add an explicit Deny for sts:AssumeRoot to the
    permission boundary policy. Only the break-glass
    admin role should be exempt.
  example: |
    {
      "identity": {
        "kind": "role",
        "account": {"is_management": true},
        "role": {
          "has_boundary": true,
          "boundary_denies_assume_root": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: role
    - field: properties.identity.account.is_management
      op: eq
      value: true
    - field: properties.identity.role.has_boundary
      op: eq
      value: true
    - field: properties.identity.role.boundary_denies_assume_root
      op: eq
      value: false
tests:
  - name: "boundary without AssumeRoot deny fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::999988887777:role/payer-admin"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          account:
            is_management: true
          role:
            has_boundary: true
            boundary_denies_assume_root: false
  - name: "boundary with AssumeRoot deny passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::999988887777:role/payer-admin"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          account:
            is_management: true
          role:
            has_boundary: true
            boundary_denies_assume_root: true
