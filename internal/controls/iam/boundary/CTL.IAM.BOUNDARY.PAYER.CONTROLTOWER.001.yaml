dsl_version: ctrl.v1
id: CTL.IAM.BOUNDARY.PAYER.CONTROLTOWER.001
name: Payer Permission Boundary Must Deny Control Tower Configuration Changes
description: >
  Permission boundary in the management account does not
  deny controltower:DeregisterOrganizationalUnit,
  controltower:DisableControl, controltower:DeleteLandingZone,
  and controltower:UpdateLandingZone. Control Tower enforces
  guardrails across the organization via managed SCPs and
  Config rules. If the management account is compromised, an
  attacker can deregister OUs (removing all managed guardrails),
  disable individual controls, or delete the landing zone
  entirely — undermining all governance without touching the
  SCPs directly. The drift check
  (CTL.ORG.CONTROLTOWER.DRIFT.001) detects after-the-fact
  drift but does not prevent the mutation.
domain: identity
severity: critical
compliance:
  nist_800_53_r5: "AC-6(1)"
  soc2: "CC6.1"
  ccm_v4: ["IAM-05"]
scope_tags:
  - aws
  - iam
taxonomy:
  - least-privilege
  - account-governance
  - trust-boundary
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  attack_stage: detection_evasion
  base_impact: 10
  blast_radius:
    type: governance
    scope: organization
    multiplier: 5.0
observation_fields:
  - identity.kind
  - identity.account.is_management
  - identity.role.has_boundary
  - identity.role.boundary_denies_control_tower_config
remediation:
  description: >
    Permission boundary in management account does not
    deny Control Tower configuration changes.
  action: >
    Add an explicit Deny for
    controltower:DeregisterOrganizationalUnit,
    controltower:DisableControl,
    controltower:DeleteLandingZone, and
    controltower:UpdateLandingZone to the permission
    boundary. Only the governance-admin break-glass role
    should have these permissions.
  example: |
    {
      "identity": {
        "kind": "role",
        "account": {"is_management": true},
        "role": {
          "has_boundary": true,
          "boundary_denies_control_tower_config": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: role
    - field: properties.identity.account.is_management
      op: eq
      value: true
    - field: properties.identity.role.has_boundary
      op: eq
      value: true
    - field: properties.identity.role.boundary_denies_control_tower_config
      op: eq
      value: false
tests:
  - name: "boundary without control tower deny fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::999988887777:role/payer-developer"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          account:
            is_management: true
          role:
            has_boundary: true
            boundary_denies_control_tower_config: false
  - name: "boundary with control tower deny passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::999988887777:role/payer-developer"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          account:
            is_management: true
          role:
            has_boundary: true
            boundary_denies_control_tower_config: true
