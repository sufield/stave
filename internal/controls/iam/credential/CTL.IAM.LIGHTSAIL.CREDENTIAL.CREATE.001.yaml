dsl_version: ctrl.v1
id: CTL.IAM.LIGHTSAIL.CREDENTIAL.CREATE.001
name: IAM Policy Grants Lightsail Credential Creation
description: >
  An IAM principal has a policy granting lightsail:CreateBucketAccessKey.
  This allows creating S3-compatible access keys outside the IAM
  credential lifecycle — invisible to credential reports, rotation
  policies, and inventory tools. This is a privilege escalation vector:
  the attacker converts IAM-governed access into a shadow credential
  that survives key rotation and even IAM user deletion.
domain: identity
severity: high
compliance:
  owasp_nhi: "NHI1"
  nist_800_53_r5: "AC-6"
  soc2: "CC6.3"
  ccm_v4: ["IAM-02"]
scope_tags:
  - aws
  - iam
taxonomy:
  - credential-lifecycle
  - resource-sprawl
  - least-privilege
  - identity-perimeter
subtractive_category:
  - S02
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_user
  - aws_iam_role
params:
  attack_stage: privilege_escalation
observation_fields:
  - identity.kind
  - identity.permissions.lightsail_create_bucket_access_key
remediation:
  description: >
    IAM principal can create Lightsail bucket access keys — shadow
    credentials outside the IAM lifecycle.
  action: >
    Remove lightsail:CreateBucketAccessKey from the principal's policies.
  example: |
    {
      "identity": {
        "kind": "iam_principal",
        "permissions": {
          "lightsail_create_bucket_access_key": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: in
      value:
        - iam_user
        - iam_role
    - field: properties.identity.permissions.lightsail_create_bucket_access_key
      op: present
    - field: properties.identity.permissions.lightsail_create_bucket_access_key
      op: eq
      value: true
tests:
  - name: "principal with credential creation permission fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:user/deploy-bot"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: iam_user
          permissions:
            lightsail_create_bucket_access_key: true
  - name: "principal without credential creation passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::444455556666:user/readonly-user"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: iam_user
          permissions:
            lightsail_create_bucket_access_key: false
  - name: "role with credential creation fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:role/lambda-exec"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: iam_role
          permissions:
            lightsail_create_bucket_access_key: true
