dsl_version: ctrl.v1
id: CTL.IAM.APPRUNNER.ADMIN.001
name: IAM Policy Grants App Runner Service Creation
description: >
  An IAM principal has a policy granting apprunner:CreateService.
  App Runner services have public HTTPS endpoints by default and
  execute with an IAM role. The created compute is invisible to
  ec2:DescribeInstances and runs in an AWS-managed VPC outside
  standard network security monitoring.
domain: identity
severity: high
compliance:
  nist_800_53_r5: "AC-6"
  soc2: "CC6.3"
  ccm_v4: ["IAM-02"]
scope_tags:
  - aws
  - iam
taxonomy:
  - least-privilege
  - resource-sprawl
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_user
  - aws_iam_role
params:
  attack_stage: persistence
observation_fields:
  - identity.kind
  - identity.permissions.apprunner_create_service
remediation:
  description: >
    IAM principal can create App Runner services — internet-facing
    compute outside the standard EC2/ECS control plane.
  action: >
    Remove apprunner:CreateService from the principal's policies unless
    App Runner usage is explicitly governed.
  example: |
    {
      "identity": {
        "kind": "iam_principal",
        "permissions": {
          "apprunner_create_service": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: in
      value:
        - iam_user
        - iam_role
    - field: properties.identity.permissions.apprunner_create_service
      op: present
    - field: properties.identity.permissions.apprunner_create_service
      op: eq
      value: true
tests:
  - name: "principal with App Runner create fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:user/deploy-bot"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: iam_user
          permissions: {apprunner_create_service: true}
  - name: "principal without App Runner create passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::444455556666:user/readonly"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: iam_user
          permissions: {apprunner_create_service: false}
