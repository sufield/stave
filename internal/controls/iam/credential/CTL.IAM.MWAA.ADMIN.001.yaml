dsl_version: ctrl.v1
id: CTL.IAM.MWAA.ADMIN.001
name: IAM Policy Grants MWAA Environment Creation
description: >
  An IAM principal has a policy granting airflow:CreateEnvironment.
  MWAA environments provision Fargate compute, S3 buckets for DAG
  storage, and CloudWatch log groups. DAGs execute arbitrary Python
  code with the MWAA execution role's permissions, and the web server
  can be configured for public internet access.
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "AC-6"
  soc2: "CC6.3"
  ccm_v4: ["IAM-02"]
scope_tags: [aws, iam]
taxonomy:
  - least-privilege
  - resource-sprawl
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_iam_user, aws_iam_role]
params:
  attack_stage: persistence
observation_fields:
  - identity.kind
  - identity.permissions.airflow_create_environment
remediation:
  description: IAM principal can create MWAA environments — workflow compute with code execution.
  action: Remove airflow:CreateEnvironment from the principal's policies.
  example: |
    {"identity": {"kind": "iam_principal", "permissions": {"airflow_create_environment": false}}}
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: in
      value: [iam_user, iam_role]
    - field: properties.identity.permissions.airflow_create_environment
      op: present
    - field: properties.identity.permissions.airflow_create_environment
      op: eq
      value: true
tests:
  - name: "principal with MWAA create fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:user/data-eng"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: iam_user
          permissions: {airflow_create_environment: true}
  - name: "principal without MWAA create passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::444455556666:user/readonly"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: iam_user
          permissions: {airflow_create_environment: false}
