dsl_version: ctrl.v1
id: CTL.IAM.CREDENTIAL.CICD.AI.001
name: CI/CD Pipeline Stores Long-Lived AI Provider API Key
description: >
  CI/CD pipelines (GitHub Actions, GitLab CI, Bitbucket Pipelines)
  store long-lived API keys for external AI providers (OpenAI,
  Anthropic, Google Gemini) as pipeline secrets or environment
  variables. If the pipeline is compromised — through a supply-
  chain attack on a dependency, a malicious pull request, or a
  trojanized GitHub Action — the attacker gains persistent access
  to the AI provider's API under the organization's account.

  Long-lived AI-provider keys in CI/CD are the AI equivalent of
  long-lived AWS access keys in CI/CD (see
  CTL.IAM.CREDENTIAL.CICD.001). The mitigation pattern is the
  same: prefer short-lived, scoped credentials over permanent
  API keys, and where OIDC federation is not yet available for
  the AI provider, rotate the key on a short interval and scope
  it to the minimum required API surface.

  The TeamPCP / UNC6780 campaign (GTIG, March 2026) demonstrated
  this exact extraction path against AWS keys; the same technique
  extracts AI-provider API keys from the same secret stores
  (LiteLLM/BerriAI compromise is the canonical case study).
domain: identity
severity: high
compliance:
  owasp_nhi: "NHI2, NHI7"
  soc2: "CC6.1"
  nist_800_53_r5: "IA-5(1)"
  ccm_v4: ["IAM-02", "IAM-08"]
scope_tags:
  - cicd
  - supply-chain
  - ai
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - key-management
subtractive_category:
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_iam_user, aws_iam_role]
params:
  attack_stage: initial_access
observation_fields:
  - identity.cicd.ai_provider.name
  - identity.cicd.ai_provider.key_present
  - identity.cicd.ai_provider.is_long_lived
  - identity.cicd.ai_provider.rotation_days
remediation:
  description: >
    CI/CD pipeline stores a long-lived AI-provider API key with
    no rotation policy. A leak of the key — via a compromised
    dependency, a malicious workflow, or a logged secret — grants
    indefinite access to the provider's API.
  action: >
    Replace the long-lived AI-provider API key with a short-lived
    credential. For providers that support OIDC federation (e.g.,
    Google Cloud service-account OIDC), use that. Otherwise: store
    the key in a secrets manager configured for automatic rotation
    (AWS Secrets Manager, HashiCorp Vault, GitHub OIDC-fronted
    issuance); scope it to the minimum required API surface; and
    set billing alerts to surface unauthorized usage spikes early.
  example: |
    {
      "identity": {
        "cicd": {
          "ai_provider": {
            "name": "anthropic",
            "key_present": true,
            "is_long_lived": false,
            "rotation_days": 7
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.cicd.ai_provider.key_present
      op: present
    - field: properties.identity.cicd.ai_provider.key_present
      op: eq
      value: true
    - field: properties.identity.cicd.ai_provider.is_long_lived
      op: present
    - field: properties.identity.cicd.ai_provider.is_long_lived
      op: eq
      value: true
defect: >
  CI/CD pipeline stores a long-lived AI-provider API key.
infection: >
  AI-provider API keys are bearer tokens — a stolen key authenticates
  the attacker as the legitimate account-holder until manually
  revoked. CI/CD secret stores are the primary leakage path: keys
  live in plaintext pipeline configuration or in the secret store's
  decrypted runtime view, accessible to anyone who can modify the
  pipeline, read its logs, or compromise a build dependency that
  runs inside the same environment. Unlike AWS, most AI providers
  do not yet expose OIDC federation as a first-class alternative,
  so the operational defense reduces to rotation cadence and
  surface scoping — both of which require the key to be
  registered as "long-lived: false" with a defined rotation
  interval upstream of Stave's evaluation.
failure: >
  Compromise of a CI/CD dependency results in extraction of the
  AI-provider key. The attacker uses it to generate content
  against the organization's quota, exfiltrate prompts and
  responses, query fine-tuned models, or exhaust the API budget.
  No cloud-side credential alert fires because the key is the
  legitimate one.
tests:
  - name: pipeline with long-lived AI provider key fires
    verdict: VIOLATION
    asset:
      asset_id: "cicd:github-actions:org/repo"
      asset_type: cicd_pipeline
      vendor: github
      properties:
        identity:
          cicd:
            ai_provider:
              name: anthropic
              key_present: true
              is_long_lived: true
              rotation_days: null
              stored_as: repository_secret
  - name: pipeline with rotated AI provider key passes
    verdict: PASS
    asset:
      asset_id: "cicd:github-actions:org/secure-repo"
      asset_type: cicd_pipeline
      vendor: github
      properties:
        identity:
          cicd:
            ai_provider:
              name: anthropic
              key_present: true
              is_long_lived: false
              rotation_days: 7
              stored_as: secrets_manager_with_rotation
  - name: pipeline with no AI provider key passes
    verdict: PASS
    asset:
      asset_id: "cicd:github-actions:org/no-ai-repo"
      asset_type: cicd_pipeline
      vendor: github
      properties:
        identity:
          cicd:
            ai_provider:
              key_present: false
