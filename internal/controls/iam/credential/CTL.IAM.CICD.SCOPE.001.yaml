dsl_version: ctrl.v1
id: CTL.IAM.CICD.SCOPE.001
name: CI/CD IAM Role Has Overly Broad Permissions
description: >
  IAM role assumed by a CI/CD system via OIDC federation has
  AdministratorAccess or permissions spanning more than five
  service namespaces. Even with OIDC federation eliminating
  long-lived credentials, an overpermissioned CI/CD role gives
  an attacker who compromises the pipeline everything they need.
  Drizly's attacker reconfigured AWS security settings — implying
  admin-level access from the CI/CD credential. CI/CD roles
  should have the minimum permissions needed for deployment.
domain: identity
severity: critical
compliance:
  nist_800_53_r5: "AC-6(1)"
  soc2: "CC6.1"
  ccm_v4: ["IAM-04", "IAM-09"]
scope_tags:
  - aws
  - iam
taxonomy:
  - least-privilege
  - trust-boundary
subtractive_category:
  - S02
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  attack_stage: privilege_escalation
observation_fields:
  - identity.cicd.role_has_admin
  - identity.cicd.role_service_namespace_count
  - identity.trust.allows_oidc_cicd
remediation:
  description: >
    CI/CD IAM role has AdministratorAccess or broad permissions
    spanning many service namespaces.
  action: >
    Replace AdministratorAccess with a scoped policy that grants
    only the permissions the CI/CD pipeline needs. Typical CI/CD
    roles need: S3 for artifacts, ECR for container images,
    CloudFormation or CDK for deployments, and the specific
    services being deployed. Use separate roles for separate
    pipeline stages (build vs deploy).
  example: |
    {
      "identity": {
        "cicd": {
          "role_has_admin": false,
          "role_service_namespace_count": 3
        },
        "trust": {
          "allows_oidc_cicd": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.trust.allows_oidc_cicd
      op: eq
      value: true
    - field: properties.identity.cicd.role_has_admin
      op: eq
      value: true
defect: >
  CI/CD IAM role has AdministratorAccess.
infection: >
  The CI/CD pipeline can perform any action in the AWS account.
  A compromised pipeline — via malicious dependency, modified
  workflow file, or compromised CI/CD platform — has full admin
  access. The blast radius of a pipeline compromise equals the
  blast radius of an admin credential compromise.
failure: >
  Attacker compromises CI/CD pipeline (e.g., via credential
  stuffing of a developer's GitHub account, as in Drizly 2020).
  The pipeline's IAM role has AdministratorAccess. The attacker
  reconfigures security settings, exfiltrates data, and creates
  persistence mechanisms — all through the CI/CD role.
tests:
  - name: "CI/CD role with admin fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::123456789012:role/github-deploy"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          trust:
            allows_oidc_cicd: true
          cicd:
            role_has_admin: true
            role_service_namespace_count: 15
  - name: "CI/CD role with scoped permissions passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::123456789012:role/github-deploy-scoped"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          trust:
            allows_oidc_cicd: true
          cicd:
            role_has_admin: false
            role_service_namespace_count: 3
  - name: "non-CI/CD role with admin passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::123456789012:role/admin-role"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          trust:
            allows_oidc_cicd: false
          cicd:
            role_has_admin: true
            role_service_namespace_count: 20
