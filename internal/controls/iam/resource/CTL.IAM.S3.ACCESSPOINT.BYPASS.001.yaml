dsl_version: ctrl.v1
id: CTL.IAM.S3.ACCESSPOINT.BYPASS.001
name: IAM Policy Grants S3 Access on Bucket ARN Bypassing Access Points
description: >
  IAM policy grants S3 write actions directly on a bucket ARN when
  S3 access points are configured for that bucket. Access points
  enforce network-origin and IAM restrictions at a narrower scope
  than the bucket policy. A role that writes via the bucket ARN
  bypasses access-point restrictions entirely — the access-point
  VPC restriction, principal constraints, and action scope do not
  apply to direct bucket operations. The
  has_s3_bucket_arn_bypassing_ap property is derived by the
  collector by cross-referencing the IAM policy's S3 resource
  ARNs with the bucket's access-point configuration.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "AC-6"
  soc2: "CC6.1"
  ccm_v4: ["IAM-04", "DSP-07"]
scope_tags:
  - aws
  - iam
taxonomy:
  - compliance-mapping
  - least-privilege
  - data-perimeter
subtractive_category:
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_iam_user, aws_iam_role]
params:
  attack_stage: exfiltration
observation_fields:
  - identity.policies.has_s3_bucket_arn_bypassing_ap
remediation:
  description: >
    IAM policy grants S3 write actions on a bucket ARN when access
    points are configured for that bucket.
  action: >
    Replace the bucket ARN in the IAM policy Resource element with
    the access point ARN. Use
    arn:aws:s3:region:account:accesspoint/name to enforce
    access-point restrictions.
  example: |
    {
      "identity": {
        "kind": "role",
        "policies": {
          "has_s3_bucket_arn_bypassing_ap": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.policies.has_s3_bucket_arn_bypassing_ap
      op: present
    - field: properties.identity.policies.has_s3_bucket_arn_bypassing_ap
      op: eq
      value: true
