dsl_version: ctrl.v1
id: CTL.IAM.ESCALATE.PUTROLEPOLICY.001
name: Principal Must Not Escalate via iam:PutRolePolicy
description: >
  A principal (IAM user or role) holding `iam:PutRolePolicy` on a role
  it can reach can write an arbitrary inline policy onto that role —
  including one that grants `"Action": "*"` on `"Resource": "*"`. Two
  shapes share one outcome: a ROLE whose Resource field includes its own
  ARN self-writes admin (one step), or a USER with `iam:PutRolePolicy`
  scoped to a role it can assume writes an admin inline policy onto that
  role and then assumes it (the Rhino/Bishop Fox privesc12 technique). A
  single `PutRolePolicy` call produces full admin authority without
  touching any managed policy. Distinct AWS action from
  `iam:PutUserPolicy`, which targets users (see
  `CTL.IAM.ESCALATE.PUTUSERPOLICY.001`) — this control covers
  `iam:PutRolePolicy` whether the holding principal is a user or a role.
  Rhino Security Labs' iam__privesc_scan and Prowler's
  iam_policy_allows_privilege_escalation both enumerate it.
domain: identity
severity: critical
scope: compound
corpus_reference: MITRE:T1098.003
compliance:
  owasp_nhi: "NHI5"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  nist_800_53_r5: "AC-6(5)"
  fedramp_moderate: "AC-6(5)"
  iso_27001_2022: "A.8.3"
  ccm_v4: ["IAM-02", "IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
  - aws_iam_user
params:
  attack_stage: privilege_escalation
  base_impact: 10
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.5
observation_fields:
  - identity.kind
  - identity.escalation.put_role_policy.present
  - identity.escalation.put_role_policy.target_role_arn
  - identity.escalation.put_role_policy.resource_scope
remediation:
  description: >
    Principal has `iam:PutRolePolicy` scoped to a reachable role (its
    own ARN, an assumable role's ARN, or `"*"`). The principal — or any
    identity that has assumed it — can author an inline policy granting
    `"Action": "*"` on `"Resource": "*"` on that role and immediately
    operate with admin authority.
  action: >
    Remove `iam:PutRolePolicy` from the role, or scope its Resource
    to role ARNs that do not include the role itself. Organization
    SCPs denying `iam:PutRolePolicy` on `${aws:PrincipalArn}` close
    the path at the boundary. A permissions boundary on the role
    that forbids self-write of inline policies is an additional
    defensive layer.
  example: |
    {
      "identity": {
        "kind": "role",
        "escalation": {
          "put_role_policy": {
            "present": false
          }
        }
      }
    }
mitre_attack:
  - id: T1098.003
    name: "Account Manipulation: Additional Cloud Roles"
    tactic: privilege-escalation
validated_against:
  - vendor: bishopfox
    lab: privesc12-PutRolePolicy
    result: detected
    verified: "2026-05-30"
unsafe_predicate:
  all:
    - field: properties.identity.escalation.put_role_policy.present
      op: present
    - field: properties.identity.escalation.put_role_policy.present
      op: eq
      value: true
tests:
  - name: role with self-write escalation path fires
    verdict: VIOLATION
    asset:
      asset_id: arn:aws:iam::111122223333:role/self-write
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          escalation:
            put_role_policy:
              present: true
              target_role_arn: arn:aws:iam::111122223333:role/self-write
              resource_scope: "*"
  - name: user holding PutRolePolicy on an assumable role fires (Bishop Fox privesc12)
    verdict: VIOLATION
    asset:
      asset_id: arn:aws:iam::111122223333:user/attacker
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: user
          escalation:
            put_role_policy:
              present: true
              target_role_arn: arn:aws:iam::111122223333:role/assumable-admin
              resource_scope: "*"
  - name: user without the escalation path passes
    verdict: PASS
    asset:
      asset_id: arn:aws:iam::111122223333:user/alice
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: user
          escalation:
            put_role_policy:
              present: false
alternatives:
  - tool: prowler
    check_id: iam_inline_policy_allows_privilege_escalation
    coverage: covered
    note: One of 24 per-technique controls covering the aggregated Prowler check.
  - tool: prowler
    check_id: iam_policy_allows_privilege_escalation
    coverage: covered
    note: One of 24 per-technique controls covering the aggregated Prowler check.
