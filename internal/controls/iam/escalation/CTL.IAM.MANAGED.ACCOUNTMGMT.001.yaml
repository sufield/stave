dsl_version: ctrl.v1
id: CTL.IAM.MANAGED.ACCOUNTMGMT.001
name: Account Management Policy Must Not Be Attached Outside Management Account
description: >
  The AWSManagedAccountManagementAccess policy grants full IAM
  lifecycle actions including iam:CreateRole, iam:DeleteRole,
  iam:AttachRolePolicy, iam:PutRolePolicy, and
  iam:UpdateAssumeRolePolicy. This policy is intended for
  management account principals performing account setup
  automation. Attachment to a principal in a member account
  grants that principal unrestricted IAM policy management — a
  direct privilege escalation vector. The policy also grants
  iam:PutRolePermissionsBoundary, making boundary enforcement
  ineffective because the principal can remove its own boundary.
domain: identity
severity: high
compliance:
  nist_800_53_r5: "AC-6(1)"
  mitre_attack: "T1098"
  soc2: "CC6.3"
  ccm_v4: ["IAM-05"]
scope_tags:
  - aws
  - iam
taxonomy:
  - least-privilege
  - account-governance
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_iam_role]
params:
  attack_stage: privilege_escalation
observation_fields:
  - identity.kind
  - identity.policies.has_account_management_policy
  - identity.role.is_management_account_principal
remediation:
  description: >
    AWSManagedAccountManagementAccess policy is attached to a
    principal outside the management account, granting full IAM
    lifecycle control in the member account.
  action: >
    Remove the AWSManagedAccountManagementAccess policy from
    member account principals. If account setup automation is
    needed in member accounts, create a scoped policy with only
    the specific IAM actions required, constrained by permission
    boundaries and resource-level conditions.
  example: |
    {
      "identity": {
        "kind": "role",
        "role": {
          "is_management_account_principal": true
        },
        "policies": {
          "has_account_management_policy": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: role
    - field: properties.identity.policies.has_account_management_policy
      op: eq
      value: true
    - field: properties.identity.role.is_management_account_principal
      op: ne
      value: true
tests:
  - name: "account management policy on non-management principal fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::444455556666:role/AccountSetupRole"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          role:
            is_management_account_principal: false
          policies:
            has_account_management_policy: true
  - name: "account management policy on management principal passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:role/MgmtAccountAdmin"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          role:
            is_management_account_principal: true
          policies:
            has_account_management_policy: true
  - name: "no account management policy passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::444455556666:role/WorkloadRole"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          role:
            is_management_account_principal: false
          policies:
            has_account_management_policy: false
