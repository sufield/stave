dsl_version: ctrl.v1
id: CTL.IAM.ESCALATE.MODIFYINSTANCE.001
name: Principal Must Not Escalate via EC2 ModifyInstanceAttribute
description: >
  Principals with ec2:ModifyInstanceAttribute can modify an EC2
  instance's user-data script. On the next instance reboot, the
  modified user-data executes with the instance profile role's
  permissions. The attacker injects a reverse shell or credential
  exfiltration script into user-data, reboots the instance, and gains
  the instance role's permissions.
domain: identity
severity: high
scope: compound
corpus_reference: MITRE:T1098
compliance:
  owasp_nhi: "NHI5"
  soc2: "CC6.1"
  nist_800_53_r5: "AC-6(5)"
  ccm_v4: ["IAM-05"]
scope_tags:
  - aws
  - iam
  - ec2
taxonomy:
  - compliance-mapping
  - compute-hardening
  - credential-lifecycle
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_iam_user, aws_iam_role]
params:
  attack_stage: privilege_escalation
  base_impact: 9
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.0
observation_fields:
  - identity.kind
  - identity.escalation.ec2_modifyinstance.present
remediation:
  description: >
    Principal can modify EC2 instance user-data to inject code that
    executes with the instance role.
  action: >
    Remove ec2:ModifyInstanceAttribute or scope it to specific
    instance ARNs via resource conditions. Use launch templates with
    immutable user-data instead of allowing runtime modifications.
    Enforce instance metadata service v2 (IMDSv2) to limit credential
    access from injected scripts.
  example: |
    {
      "identity": {
        "kind": "user",
        "escalation": {
          "ec2_modifyinstance": {
            "present": false
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.escalation.ec2_modifyinstance.present
      op: present
    - field: properties.identity.escalation.ec2_modifyinstance.present
      op: eq
      value: true
tests:
  - name: user with EC2 ModifyInstanceAttribute escalation path fires
    verdict: VIOLATION
    asset:
      asset_id: arn:aws:iam::111122223333:user/mallory
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: user
          escalation:
            ec2_modifyinstance:
              present: true
  - name: user without escalation path passes
    verdict: PASS
    asset:
      asset_id: arn:aws:iam::111122223333:user/bob
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: user
          escalation:
            ec2_modifyinstance:
              present: false
alternatives:
  - tool: prowler
    check_id: iam_inline_policy_allows_privilege_escalation
    coverage: covered
    note: One of 38 per-technique controls covering the aggregated Prowler check.
  - tool: prowler
    check_id: iam_policy_allows_privilege_escalation
    coverage: covered
    note: One of 38 per-technique controls covering the aggregated Prowler check.
