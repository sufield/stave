dsl_version: ctrl.v1
id: CTL.IAM.ESCALATE.ATTACHROLEPOLICY.NOCONDITION.001
name: Principal Has Unrestricted iam:AttachRolePolicy Without Policy ARN Condition
description: >
  A principal has `iam:AttachRolePolicy` but the granting statement
  lacks a `Condition` restricting which policy ARNs can be attached.
  Without a `StringEquals`, `StringLike`, or `ArnEquals` condition on
  the `iam:PolicyARN` key, the principal can attach any of AWS's
  1,000+ managed policies — including `AdministratorAccess` and
  `AmazonS3FullAccess` — to any role it can target. Combined with
  `sts:AssumeRole` trust on the target role, this creates a two-stage
  escalation: modify the role's permissions, then assume it. The safe
  pattern scopes attachment to a whitelist of approved policy ARNs
  via `iam:PolicyARN` condition and restricts the Resource field to
  specific role ARNs. Absence of the condition converts a scoped
  delegation into a full privilege-escalation path.

  Scope: applies to both users and roles (matching
  `CTL.IAM.ESCALATE.ATTACHROLEPOLICY.001`). Fires when
  `attach_role_policy.present` is true AND
  `has_policy_arn_condition` is false — i.e., the grant exists
  and is unrestricted.
domain: identity
severity: critical
scope: compound
corpus_reference: MITRE:T1098.003
compliance:
  owasp_nhi: "NHI5"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  nist_800_53_r5: "AC-6(5)"
  fedramp_moderate: "AC-6(5)"
  iso_27001_2022: "A.8.3"
  ccm_v4: ["IAM-02", "IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
taxonomy:
  - compliance-mapping
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
  - aws_iam_user
params:
  attack_stage: privilege_escalation
  base_impact: 10
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.5
observation_fields:
  - identity.escalation.attach_role_policy.present
  - identity.escalation.attach_role_policy.has_policy_arn_condition
remediation:
  description: >
    Principal has `iam:AttachRolePolicy` with no `iam:PolicyARN`
    condition, making the permission unrestricted. Any AWS managed
    policy — including `AdministratorAccess` — can be attached to
    any role the principal can target.
  action: >
    Add a `Condition` block with `ArnEquals` or `StringEquals` on
    `iam:PolicyARN` to restrict which managed policies can be
    attached. Example: `"Condition": {"ArnEquals": {"iam:PolicyARN":
    "arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess"}}`. Also scope
    the Resource to specific role ARNs. If the principal should not
    attach role policies at all, remove `iam:AttachRolePolicy`
    entirely.
  example: |
    {
      "identity": {
        "escalation": {
          "attach_role_policy": {
            "present": true,
            "has_policy_arn_condition": true
          }
        }
      }
    }
mitre_attack:
  - id: T1098.003
    name: "Account Manipulation: Additional Cloud Roles"
    tactic: privilege-escalation
validated_against:
  - vendor: bishopfox
    lab: privesc9-AttachRolePolicy
    result: detected
    verified: "2026-05-30"
unsafe_predicate:
  all:
    - field: properties.identity.escalation.attach_role_policy.present
      op: eq
      value: true
    - field: properties.identity.escalation.attach_role_policy.has_policy_arn_condition
      op: eq
      value: false
alternatives:
  - tool: prowler
    check_id: iam_policy_allows_privilege_escalation
    coverage: partial
    note: Prowler detects the capability but does not distinguish condition-restricted from unrestricted grants.
