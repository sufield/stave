dsl_version: ctrl.v1
id: CTL.IAM.ESCALATE.SQSADDPERM.001
name: Principal Must Not Escalate via SQS AddPermission
description: >
  Principals with sqs:AddPermission can modify an SQS queue's
  resource-based policy to allow cross-account message consumption.
  If the queue processes sensitive data or triggers downstream
  workflows (Lambda, Step Functions), the attacker grants an external
  account access to consume or inject messages.
domain: identity
severity: medium
scope: compound
corpus_reference: MITRE:T1098
compliance:
  owasp_nhi: "NHI5"
  soc2: "CC6.1"
  nist_800_53_r5: "AC-6(5)"
  ccm_v4: ["IAM-05"]
scope_tags:
  - aws
  - iam
  - sqs
taxonomy:
  - compliance-mapping
subtractive_category:
  - S02
  - S05
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_iam_user, aws_iam_role]
params:
  attack_stage: collection
  base_impact: 6
  blast_radius:
    type: prevention
    scope: account
    multiplier: 1.5
observation_fields:
  - identity.kind
  - identity.escalation.sqs_addpermission.present
remediation:
  description: >
    Principal can modify SQS queue policies to allow cross-account
    message access.
  action: >
    Remove sqs:AddPermission or scope it to specific queue ARNs via
    resource conditions. Use SQS queue policies with explicit deny for
    cross-account access and enable SQS server-side encryption to
    protect message contents.
  example: |
    {
      "identity": {
        "kind": "user",
        "escalation": {
          "sqs_addpermission": {
            "present": false
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.escalation.sqs_addpermission.present
      op: present
    - field: properties.identity.escalation.sqs_addpermission.present
      op: eq
      value: true
tests:
  - name: user with SQS AddPermission escalation path fires
    verdict: VIOLATION
    asset:
      asset_id: arn:aws:iam::111122223333:user/mallory
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: user
          escalation:
            sqs_addpermission:
              present: true
  - name: user without escalation path passes
    verdict: PASS
    asset:
      asset_id: arn:aws:iam::111122223333:user/bob
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: user
          escalation:
            sqs_addpermission:
              present: false
alternatives:
  - tool: prowler
    check_id: iam_inline_policy_allows_privilege_escalation
    coverage: covered
    note: One of 38 per-technique controls covering the aggregated Prowler check.
  - tool: prowler
    check_id: iam_policy_allows_privilege_escalation
    coverage: covered
    note: One of 38 per-technique controls covering the aggregated Prowler check.
