dsl_version: ctrl.v1
id: CTL.IAM.ESCALATE.PUTUSERPOLICY.NOCONDITION.001
name: Principal Has iam:PutUserPolicy Without Content Restriction
description: >
  A principal has `iam:PutUserPolicy` in its effective permissions.
  Unlike `iam:AttachUserPolicy` which can be condition-restricted via
  `iam:PolicyARN`, there is no IAM Condition key that restricts the
  *content* of an inline policy written via PutUserPolicy. Every
  PutUserPolicy grant is inherently unrestricted in what policy
  document the caller can write — the only available defense is
  restricting the Resource field (which users can be targeted).
  This makes PutUserPolicy structurally more dangerous than
  AttachUserPolicy: the attacker authors the payload (arbitrary
  Action/Resource/Effect JSON) rather than selecting from existing
  managed policies.

  Scope: gated on `identity.kind == "user"`. Fires when the
  principal has `iam:PutUserPolicy` in its effective permissions
  regardless of whether the Resource includes the principal's own
  ARN. The self-targeting variant is detected by
  `CTL.IAM.ESCALATE.PUTUSERPOLICY.001`.
domain: identity
severity: high
scope: compound
corpus_reference: MITRE:T1098.003
compliance:
  owasp_nhi: "NHI5"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  nist_800_53_r5: "AC-6(5)"
  fedramp_moderate: "AC-6(5)"
  iso_27001_2022: "A.8.3"
  ccm_v4: ["IAM-02", "IAM-05", "IAM-16"]
scope_tags:
