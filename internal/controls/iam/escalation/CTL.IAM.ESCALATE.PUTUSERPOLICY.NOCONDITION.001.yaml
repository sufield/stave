params:
  attack_stage: privilege_escalation
  base_impact: 8
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.0
observation_fields:
  - identity.kind
  - identity.escalation.put_user_policy.present
  - identity.escalation.put_user_policy.resource_scope
remediation:
  description: >
    Principal has `iam:PutUserPolicy` — the ability to write
    arbitrary inline policy documents onto IAM users. No IAM
    Condition key restricts the content of the inline policy,
    so any grant of this action allows writing admin-equivalent
    permissions.
  action: >
    Remove `iam:PutUserPolicy` from the principal. If the
    principal must manage inline policies for service accounts,
    scope the Resource field to specific user ARNs that do not
    include the principal itself. Deny at the organization
    boundary with an SCP.
  example: |
    {
      "identity": {
        "kind": "user",
        "escalation": {
          "put_user_policy": {
            "present": false
          }
        }
      }
    }
mitre_attack:
