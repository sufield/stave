params:
  attack_stage: privilege_escalation
  base_impact: 10
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.5
observation_fields:
  - identity.kind
  - identity.escalation.put_role_policy.present
  - identity.escalation.put_role_policy.resource_scope
remediation:
  description: >
    Principal has `iam:PutRolePolicy` — the ability to write
    arbitrary inline policy documents onto IAM roles. No IAM
    Condition key restricts the content of the inline policy,
    so any grant of this action allows writing admin-equivalent
    permissions onto any role within Resource scope.
  action: >
    Remove `iam:PutRolePolicy` from the principal. If the
    principal must manage inline policies for service roles,
    scope the Resource field to specific role ARNs that do not
    include the principal itself or any role it can assume. Deny
    at the organization boundary with an SCP.
  example: |
    {
      "identity": {
        "kind": "role",
        "escalation": {
          "put_role_policy": {
            "present": false
          }
        }
      }
    }
mitre_attack:
