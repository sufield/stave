dsl_version: ctrl.v1
id: CTL.IAM.ESCALATE.PUTROLEPOLICY.NOCONDITION.001
name: Principal Has iam:PutRolePolicy Without Content Restriction
description: >
  A principal has `iam:PutRolePolicy` in its effective permissions.
  Unlike `iam:AttachRolePolicy` which can be condition-restricted via
  `iam:PolicyARN`, there is no IAM Condition key that restricts the
  *content* of an inline policy written via PutRolePolicy. Every
  PutRolePolicy grant is inherently unrestricted in what policy
  document the caller can write — the only available defense is
  restricting the Resource field (which roles can be targeted).
  This makes PutRolePolicy structurally more dangerous than
  AttachRolePolicy: the attacker authors the payload (arbitrary
  Action/Resource/Effect JSON) rather than selecting from existing
  managed policies. Combined with `sts:AssumeRole` trust on the
  target role, this creates a two-stage escalation: write an admin
  inline policy onto the role, then assume it.

  Scope: applies to both users and roles (matching
  `CTL.IAM.ESCALATE.PUTROLEPOLICY.001`). Fires when the
  principal has `iam:PutRolePolicy` in its effective permissions
  regardless of resource scope. The self-targeting variant (role
  writing to its own ARN) is also detected by
  `CTL.IAM.ESCALATE.PUTROLEPOLICY.001`.
