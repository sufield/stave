dsl_version: ctrl.v1
id: CTL.IAM.ROOT.USAGE.001
name: Root Account Must Not Be Used for Daily Tasks
description: >
  The root account must not be used for day-to-day operations. Root
  activity should be limited to account setup tasks. Recent root
  usage indicates operational reliance on root credentials.
domain: identity
severity: high
compliance:
  owasp_nhi: "NHI5, NHI10"
  cis_aws_v3.0: "1.7"
  soc2: "CC6.2"
  pci_dss_v4.0: "8.1.1"
  nist_800_53_r5: "AC-2"
  fedramp_moderate: "AC-2"
  ccm_v4: ["IAM-09", "IAM-14"]
scope_tags:
  - aws
  - iam
taxonomy:
  - compliance-mapping
  - credential-lifecycle
subtractive_category:
  - S02
type: unsafe_state
classification: parameterized_check
applicable_asset_types:
  - aws_iam_account
params:
  attack_stage: credential_access
remediation:
  description: >
    Root account has been used recently. Root should only be used
    for account-level tasks that require it.
  action: >
    Create IAM admin users or roles for daily operations. Lock root
    credentials and use them only for account-level tasks.
  example: |
    {
      "identity": {
        "kind": "account",
        "root": {
          "last_used_days": 120
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: account
    - field: properties.identity.root.last_used_days
      op: lt
      value: 90
alternatives:
  - tool: prowler
    check_id: iam_avoid_root_usage
    coverage: covered
    note: Both check root-account activity signals.
