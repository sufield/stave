dsl_version: ctrl.v1
id: CTL.IAM.OIDC.GITHUB.SUBJECT.001
name: GitHub Actions OIDC Trust Does Not Restrict Subject Claim
description: >
  IAM role trusts the GitHub Actions OIDC provider
  (token.actions.githubusercontent.com) but does not restrict
  the subject claim to specific repositories and branches.
  Without a subject restriction, ANY GitHub repository —
  including attacker-controlled repos — can assume the role.
  The trust policy should restrict the sub claim to specific
  org/repo:ref patterns like
  "repo:myorg/myrepo:ref:refs/heads/main".
domain: identity
severity: critical
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["IAM-04", "IAM-10"]
scope_tags:
  - aws
  - iam
taxonomy:
  - trust-boundary
  - identity-perimeter
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  attack_stage: initial_access
observation_fields:
  - identity.trust.allows_github_oidc
  - identity.trust.github_oidc_subject_restricted
remediation:
  description: >
    IAM role trusts GitHub Actions OIDC but does not restrict
    the subject claim.
  action: >
    Add a StringLike condition on
    token.actions.githubusercontent.com:sub in the trust
    policy to restrict which repositories and branches can
    assume the role. Example condition value:
    "repo:myorg/myrepo:ref:refs/heads/main".
  example: |
    {
      "identity": {
        "trust": {
          "allows_github_oidc": true,
          "github_oidc_subject_restricted": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.trust.allows_github_oidc
      op: eq
      value: true
    - field: properties.identity.trust.github_oidc_subject_restricted
      op: ne
      value: true
defect: >
  GitHub Actions OIDC trust does not restrict the subject claim.
infection: >
  Any GitHub repository can assume this IAM role. The OIDC
  federation eliminates long-lived keys but does not scope
  access — the trust is effectively "any GitHub workflow in
  the world can authenticate as this role." An attacker who
  creates a GitHub Actions workflow in any repo can obtain
  temporary credentials for this role.
failure: >
  Attacker creates a GitHub Actions workflow in a public repo
  that assumes the unrestricted OIDC role. The workflow
  obtains temporary AWS credentials and exfiltrates data or
  modifies infrastructure. The trust policy's lack of subject
  restriction makes this indistinguishable from a legitimate
  workflow.
tests:
  - name: "unrestricted GitHub OIDC trust fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::123456789012:role/github-deploy"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          trust:
            allows_github_oidc: true
            github_oidc_subject_restricted: false
  - name: "restricted GitHub OIDC trust passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::123456789012:role/github-deploy-scoped"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          trust:
            allows_github_oidc: true
            github_oidc_subject_restricted: true
  - name: "non-GitHub OIDC role passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::123456789012:role/gitlab-deploy"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          trust:
            allows_github_oidc: false
            github_oidc_subject_restricted: false
