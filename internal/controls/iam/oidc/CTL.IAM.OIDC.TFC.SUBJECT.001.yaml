dsl_version: ctrl.v1
id: CTL.IAM.OIDC.TFC.SUBJECT.001
name: Terraform Cloud OIDC Roles Must Restrict Subject Claim
description: >
  IAM roles trusting Terraform Cloud OIDC must restrict the sub
  claim to specific organizations and workspaces. Without a
  subject restriction, any Terraform Cloud workspace can assume
  the role. Same pattern as GitLab OIDC misconfiguration.
  Technique: hackingthe.cloud exploiting misconfigured Terraform
  Cloud OIDC.
domain: identity
severity: critical
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["IAM-09", "IVS-03"]
scope_tags:
  - aws
  - iam
taxonomy:
  - trust-boundary
  - identity-perimeter
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  attack_stage: initial_access
observation_fields:
  - identity.kind
  - identity.trust.allows_tfc_oidc
  - identity.trust.tfc_oidc_subject_restricted
remediation:
  description: >
    IAM role trusts Terraform Cloud OIDC but does not restrict
    the sub claim. Any TFC workspace can assume this role.
  action: >
    Add a StringLike condition on app.terraform.io:sub in the
    trust policy restricting to specific org:workspace patterns.
  example: |
    {
      "identity": {
        "kind": "role",
        "trust": {
          "allows_tfc_oidc": true,
          "tfc_oidc_subject_restricted": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: role
    - field: properties.identity.trust.allows_tfc_oidc
      op: eq
      value: true
    - field: properties.identity.trust.tfc_oidc_subject_restricted
      op: ne
      value: true
tests:
  - name: "tfc oidc without subject restriction fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::123456789012:role/tfc-deploy"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          trust:
            allows_tfc_oidc: true
            tfc_oidc_subject_restricted: false
  - name: "tfc oidc with subject restriction passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::123456789012:role/tfc-deploy"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          trust:
            allows_tfc_oidc: true
            tfc_oidc_subject_restricted: true
