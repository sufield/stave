dsl_version: ctrl.v1
id: CTL.IAM.POLLUTION.STALEADMIN.001
name: Stale IAM Credential Has Administrative Permissions
description: >
  IAM user has credentials unused for 90+ days AND has
  administrative permissions. A stale credential with admin
  access is the highest-risk pollution pattern: the key has no
  active operational purpose (unused), maximum blast radius
  (admin), and is likely unmonitored (no one watches for its use
  because no one remembers it exists). This is the compound of
  CTL.IAM.CRED.UNUSED.001 (stale credential) and
  CTL.IAM.POLICY.ADMIN.001 (admin access) — neither alone
  captures the distinct risk class of an abandoned admin key.
  Farris: "access keys that are who knows where, waiting to be
  exposed."
domain: identity
severity: critical
compliance:
  owasp_nhi: "NHI1"
  nist_800_53_r5: "AC-2"
  soc2: "CC6.2"
  ccm_v4: ["IAM-02", "IAM-08"]
  owasp_subtractive: "S07"
  subtractive_tier: "deletion"
scope_tags:
  - aws
  - iam
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - trust-decay
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_user
params:
  attack_stage: credential_access
  base_impact: 10
  blast_radius:
    type: compromise
    scope: account
    multiplier: 3.0
observation_fields:
  - identity.kind
  - identity.credentials.unused
  - identity.policies.has_admin_access
remediation:
  description: >
    IAM user has stale credentials with administrative permissions.
    This is an abandoned admin key — maximum blast radius with no
    operational purpose.
  action: >
    Immediately disable or delete the stale credentials. Remove
    administrative permissions. If the user is no longer needed,
    delete the IAM user entirely.
  example: |
    {
      "identity": {
        "kind": "user",
        "credentials": {
          "unused": false
        },
        "policies": {
          "has_admin_access": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: user
    - field: properties.identity.credentials.unused
      op: eq
      value: true
    - field: properties.identity.policies.has_admin_access
      op: eq
      value: true
defect: >
  IAM user has stale credentials AND administrative permissions.
  Abandoned admin key with maximum blast radius.
infection: >
  The credential is unused but broadly privileged. No one monitors
  for its use because it has no active consumer. If exposed in a
  code repository, config file, or CI pipeline, an attacker gains
  admin access with no usage baseline to trigger anomaly detection.
failure: >
  Attacker discovers the stale admin key (leaked repo, config dump,
  social engineering). Full account compromise follows — the key
  has admin access and no one is watching for its use. The breach
  is discovered weeks or months later through billing anomalies,
  not security monitoring.
tests:
  - name: "stale credential with admin access fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:user/abandoned-admin"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: user
          credentials:
            unused: true
          policies:
            has_admin_access: true
  - name: "active credential with admin access passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:user/active-admin"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: user
          credentials:
            unused: false
          policies:
            has_admin_access: true
  - name: "stale credential without admin passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:user/stale-readonly"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: user
          credentials:
            unused: true
          policies:
            has_admin_access: false
