dsl_version: ctrl.v1
id: CTL.IAM.CRED.TTL.EXCEEDED.001
name: IAM Credential Has Exceeded Its Declared TTL
description: >
  IAM credential has a declared TTL (maximum lifetime) and the
  current age exceeds it. The credential should have been rotated
  or deactivated when its TTL elapsed. A credential beyond its TTL
  is a permanent attack surface masquerading as a temporary one.
  Distinct from CTL.IAM.CRED.EXPIRY.001 which checks whether an
  expiry IS DECLARED — this control checks whether the declared
  expiry HAS ELAPSED. A credential with has_expiry=true and
  ttl_exceeded=true passed the first check and fails the second:
  the operator set a TTL but nobody enforced it. Same shape as
  CTL.AD.KRBTGT.ROTATION.001 (krbtgt_password_age_days > 180) and
  CTL.IAM.CRED.UNUSED45.001 (access_key_unused_days > 45) — the
  Time-Bound Credential Invariant stricter variant called out in
  the temporal-features audit (GAP-L, row 12b).
domain: identity
severity: critical
compliance:
  owasp_nhi: "NHI7"
  nist_800_53_r5: "IA-5, AC-2"
  soc2: "CC6.1"
  hipaa: "164.312(d)"
  pci_dss_v4.0: "8.3.5"
  fedramp_moderate: "IA-5"
  iso_27001_2022: "A.5.16, A.8.5"
  ccm_v4: ["IAM-02", "IAM-08"]
  owasp_subtractive: "S07"
  subtractive_tier: "deletion"
scope_tags:
  - aws
  - iam
taxonomy:
  - compliance-mapping
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_user
params:
  attack_stage: credential_access
remediation:
  description: >
    IAM credential has a declared TTL but the current age exceeds
    it. The credential is past its expressed expiration; it
    should have been rotated or deactivated.
  action: >
    Rotate or deactivate the credential immediately. For access
    keys:

        aws iam update-access-key --access-key-id <key-id> \
          --status Inactive --user-name <user>

    Then issue a new credential with a fresh TTL, or migrate the
    workload to ephemeral credentials (OIDC federation via
    GitHub Actions / GitLab CI assume-role, IAM Roles Anywhere
    with SPIFFE/SPIRE, or short-lived STS sessions tied to a
    workload identity). Audit how the TTL was bypassed — typically
    the collector pre-computes ttl_exceeded from the
    credential's creation date + declared max lifetime; the bypass
    is usually "the rotation Lambda failed and nobody noticed."
  example: |
    {
      "identity": {
        "kind": "user",
        "credentials": {
          "has_expiry": true,
          "ttl_exceeded": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: user
    - field: properties.identity.credentials.has_expiry
      op: present
    - field: properties.identity.credentials.has_expiry
      op: eq
      value: true
    - field: properties.identity.credentials.ttl_exceeded
      op: present
    - field: properties.identity.credentials.ttl_exceeded
      op: eq
      value: true
