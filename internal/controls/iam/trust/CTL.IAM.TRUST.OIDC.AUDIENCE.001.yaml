dsl_version: ctrl.v1
id: CTL.IAM.TRUST.OIDC.AUDIENCE.001
name: OIDC Federation Trust Must Restrict Audience Claim
description: >
  IAM roles that trust OIDC identity providers must include an
  audience (aud) condition in the trust policy. Without an audience
  restriction, any OIDC token issued by the provider — regardless
  of the intended relying party — can be used to assume the role.
  An attacker who obtains a token meant for a different AWS account
  or a non-AWS service can replay it against this role.
domain: identity
severity: medium
scope: atomic
compliance:
  owasp_nhi: "NHI3"
  soc2: "CC6.1"
  nist_800_53_r5: "AC-3"
  ccm_v4: ["IAM-16"]
scope_tags:
  - aws
  - iam
  - supply-chain
taxonomy:
  - compliance-mapping
  - trust-boundary
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  attack_stage: initial_access
remediation:
  description: >
    OIDC trust policy has no audience condition. Any token from
    the identity provider can assume this role regardless of the
    intended relying party.
  action: >
    Add a StringEquals condition on the aud claim in the trust
    policy. For GitHub Actions use
    "token.actions.githubusercontent.com:aud": "sts.amazonaws.com".
  example: |
    {
      "identity": {
        "kind": "role",
        "trust": {
          "oidc": {
            "has_oidc_trust": true,
            "audience_restricted": true
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.trust.oidc.has_oidc_trust
      op: present
    - field: properties.identity.trust.oidc.has_oidc_trust
      op: eq
      value: true
    - field: properties.identity.trust.oidc.audience_restricted
      op: ne
      value: true
tests:
  - name: no audience restriction fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::123456789012:role/github-deploy"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          trust:
            oidc:
              has_oidc_trust: true
              audience_restricted: false
              provider: github
  - name: audience restricted passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::123456789012:role/github-deploy"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          trust:
            oidc:
              has_oidc_trust: true
              audience_restricted: true
              provider: github
  - name: non-OIDC role passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::123456789012:role/ec2-instance"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
