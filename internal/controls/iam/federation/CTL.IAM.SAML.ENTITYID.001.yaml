dsl_version: ctrl.v1
id: CTL.IAM.SAML.ENTITYID.001
name: SAML Provider Must Have Tracked Entity ID
description: >
  IAM SAML provider has no tracked entity ID (Issuer). The
  entity ID identifies which external identity provider is
  federated into the AWS account. Without tracking the entity
  ID, changes to the SAML metadata (provider replacement,
  IdP migration, entity ID rotation) go undetected. An
  attacker who replaces the SAML metadata with their own IdP
  gains federated access to the account.
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "IA-8"
  soc2: "CC6.1"
  ccm_v4: ["IAM-13"]
scope_tags:
  - aws
  - iam
  - federation
taxonomy:
  - trust-boundary
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_iam_saml_provider]
params:
  attack_stage: initial_access
observation_fields:
  - identity.kind
  - identity.saml.entity_id_tracked
remediation:
  description: >
    SAML provider entity ID is not tracked. IdP
    replacement would go undetected.
  action: >
    Record the SAML entity ID and monitor for changes.
    Set up CloudTrail alerts for
    iam:UpdateSAMLProvider events.
  example: |
    {
      "identity": {
        "kind": "saml_provider",
        "saml": {
          "entity_id_tracked": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: saml_provider
    - field: properties.identity.saml.entity_id_tracked
      op: ne
      value: true
tests:
  - name: "untracked entity ID fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:saml-provider/OktaIdP"
      asset_type: aws_iam_saml_provider
      vendor: aws
      properties:
        identity:
          kind: saml_provider
          saml:
            entity_id_tracked: false
  - name: "tracked entity ID passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:saml-provider/OktaIdP"
      asset_type: aws_iam_saml_provider
      vendor: aws
      properties:
        identity:
          kind: saml_provider
          saml:
            entity_id_tracked: true
