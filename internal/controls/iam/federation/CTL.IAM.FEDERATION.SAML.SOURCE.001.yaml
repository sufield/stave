dsl_version: ctrl.v1
id: CTL.IAM.FEDERATION.SAML.SOURCE.001
name: SAML Provider Must Be From Recognized Identity Source
description: >
  IAM SAML provider's metadata references an identity provider
  that is not in the recognized provider list. Same risk as
  unrecognized OIDC providers: a SAML provider from an unknown
  source is either shadow federation or compromise. The collector
  parses the entityID from the SAML metadata document and checks
  it against the approved IdP list.
domain: identity
severity: high
corpus_reference: MITRE:T1078.004
compliance:
  owasp_nhi: "NHI3"
  soc2: "CC6.1"
  nist_800_53_r5: "IA-8"
  ccm_v4: ["IAM-05", "IAM-14"]
scope_tags:
  - aws
  - iam
  - multicloud
taxonomy:
  - compliance-mapping
  - trust-boundary
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_saml_provider
params:
  attack_stage: initial_access
observation_fields:
  - identity.kind
  - identity.federation.is_recognized_provider
remediation:
  description: >
    SAML provider references an unrecognized identity provider.
    This may indicate shadow federation or compromise.
  action: >
    Verify the SAML provider entityID is intentional and from a
    trusted identity source. If the provider is legitimate, add it
    to the recognized provider list. If not, delete the provider
    and audit all roles that reference it.
  example: |
    {
      "identity": {
        "kind": "saml_provider",
        "federation": {
          "is_recognized_provider": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: saml_provider
    - field: properties.identity.federation.is_recognized_provider
      op: ne
      value: true
defect: >
  SAML provider entityID is not in the recognized provider list.
infection: >
  An unrecognized SAML provider federates identity from an unknown
  source. Any role trusting this provider grants access to principals
  authenticated by an IdP the organization may not control.
failure: >
  Attacker operates the unrecognized IdP or compromises it. SAML
  assertions from the unknown provider are accepted as valid,
  granting the attacker role-based access.
tests:
  - name: "unrecognized SAML provider fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:saml-provider/UnknownIdP"
      asset_type: aws_iam_saml_provider
      vendor: aws
      properties:
        identity:
          kind: saml_provider
          federation:
            is_recognized_provider: false
  - name: "recognized SAML provider passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:saml-provider/AzureAD"
      asset_type: aws_iam_saml_provider
      vendor: aws
      properties:
        identity:
          kind: saml_provider
          federation:
            is_recognized_provider: true
