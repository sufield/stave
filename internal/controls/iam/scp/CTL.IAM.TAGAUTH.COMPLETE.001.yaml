dsl_version: ctrl.v1
id: CTL.IAM.TAGAUTH.COMPLETE.001
name: Tag-Based Authorization Scheme Must Be Complete (All Four Layers)
description: >
  COMPOUND. The tag-based authorization scheme has four layers: enforcement
  (CTL.IAM.SCP.TAGAUTH.ENFORCE.001), tag-mutation lock
  (CTL.IAM.SCP.TAGAUTH.MUTATION.001), session-tag block
  (CTL.IAM.RCP.TAGAUTH.SESSION.001), and tagger protection
  (CTL.IAM.SCP.TAGAUTH.TAGGER.001). All four must hold SIMULTANEOUSLY — if any
  layer is missing OR present-but-incorrect, the scheme is bypassable, and the
  bypass path depends on which layer fails.

  This control reads the four per-layer derived booleans (each encoding
  correctness, not mere existence — a layer that exists with the wrong condition
  operator reports its boolean as false) and fires if ANY is not true. The
  reasoning spec examples/scp-tag-authorization/ proves the per-layer derivation
  and the four-way conjunction two ways (Soufflé enumerates the specific bypass
  path; Z3 proves scheme-complete = AND of the four).
domain: identity
severity: critical
scope: compound
corpus_reference: MITRE:T1098
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_organization
compliance:
  nist_800_53_r5: "AC-6"
  soc2: "CC6.1"
  ccm_v4: ["IAM-05"]
scope_tags:
  - aws
  - iam
  - scp
  - rcp
taxonomy:
  - compliance-mapping
subtractive_category:
  - S02
params:
  attack_stage: privilege_escalation
observation_fields:
  - identity.kind
  - identity.tag_auth.sensitive_actions_tag_gated
  - identity.tag_auth.tag_mutation_locked
  - identity.tag_auth.session_tag_injection_blocked
  - identity.tag_auth.tagger_role_protected
remediation:
  description: >
    The tag-based authorization scheme is incomplete — at least one of the four
    layers is missing or incorrect, making the scheme bypassable.
  action: >
    Fix whichever layer's control is failing: ENFORCE (no enforcement),
    MUTATION (self-tag exemption), SESSION (session-tag injection), or TAGGER
    (tagger-role hijack). All four must hold simultaneously.
  example: |
    {
      "identity": {
        "kind": "organization",
        "tag_auth": {
          "sensitive_actions_tag_gated": true,
          "tag_mutation_locked": true,
          "session_tag_injection_blocked": true,
          "tagger_role_protected": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: organization
    - any:
        - field: properties.identity.tag_auth.sensitive_actions_tag_gated
          op: ne
          value: true
        - field: properties.identity.tag_auth.tag_mutation_locked
          op: ne
          value: true
        - field: properties.identity.tag_auth.session_tag_injection_blocked
          op: ne
          value: true
        - field: properties.identity.tag_auth.tagger_role_protected
          op: ne
          value: true
defect: >
  At least one of the four tag-auth layers does not hold (missing or incorrect).
infection: >
  The scheme is bypassable along the path of the failing layer — no enforcement,
  self-tag exemption, session-tag injection, or tagger-role hijack.
failure: >
  Sensitive actions the tag scheme was meant to gate become reachable.
tests:
  - name: three layers hold but RCP session-tag block missing fires (vulnerable — session-tag injection)
    verdict: VIOLATION
    asset: { asset_id: "arn:aws:organizations::111122223333:organization/o-norcp", asset_type: aws_organization, vendor: aws, properties: { identity: { kind: organization, tag_auth: { sensitive_actions_tag_gated: true, tag_mutation_locked: true, session_tag_injection_blocked: false, tagger_role_protected: true } } } }
  - name: all four layers hold passes (false-positive trap)
    verdict: PASS
    asset: { asset_id: "arn:aws:organizations::444455556666:organization/o-complete", asset_type: aws_organization, vendor: aws, properties: { identity: { kind: organization, tag_auth: { sensitive_actions_tag_gated: true, tag_mutation_locked: true, session_tag_injection_blocked: true, tagger_role_protected: true } } } }
  - name: all four present but mutation lock uses wrong operator fires (false-negative trap — existence is not correctness)
    verdict: VIOLATION
    asset: { asset_id: "arn:aws:organizations::777788889999:organization/o-wrongop", asset_type: aws_organization, vendor: aws, properties: { identity: { kind: organization, tag_auth: { sensitive_actions_tag_gated: true, tag_mutation_locked: false, session_tag_injection_blocked: true, tagger_role_protected: true } } } }
