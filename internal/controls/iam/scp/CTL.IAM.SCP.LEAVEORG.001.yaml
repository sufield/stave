dsl_version: ctrl.v1
id: CTL.IAM.SCP.LEAVEORG.001
name: "SCP Does Not Deny organizations:LeaveOrganization"
description: >
  Member accounts can exit the organization via
  organizations:LeaveOrganization. When an account leaves, ALL SCPs are
  immediately removed — every organizational guardrail drops instantly. The
  account becomes completely ungoverned with no region restrictions, no
  service restrictions, and no escalation prevention. An attacker who
  compromises a member account admin can remove every organizational
  control with one API call.
domain: identity
severity: critical
compliance:
  owasp_nhi: "NHI6"
  nist_800_53_r5: "AC-6"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  ccm_v4: ["IAM-05"]
scope_tags:
  - aws
  - iam
taxonomy:
  - account-governance
  - compliance-mapping
payer_exempt: true
payer_compensating_control: null
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_organization
params:
  attack_stage: detection_evasion
observation_fields:
  - identity.kind
  - identity.scp.denies_leave_org
remediation:
  description: >
    Organization SCPs do not deny organizations:LeaveOrganization for
    member accounts.
  action: >
    Add an SCP that denies organizations:LeaveOrganization for all
    principals in member accounts. Apply it to the organization root
    or all OUs.
  example: |
    {
      "identity": {
        "kind": "organization",
        "scp": {
          "denies_leave_org": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: organization
    - field: properties.identity.scp.denies_leave_org
      op: ne
      value: true
tests:
  - name: "organization without leave-org denial fails"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:organizations::111122223333:organization/o-abc123"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            denies_leave_org: false
  - name: "organization with leave-org denial passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:organizations::444455556666:organization/o-def456"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            denies_leave_org: true
