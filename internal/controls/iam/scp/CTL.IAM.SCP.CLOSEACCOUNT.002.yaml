dsl_version: ctrl.v1
id: CTL.IAM.SCP.CLOSEACCOUNT.002
name: "SCP Does Not Deny CloseAccount for Domain-Tagged Accounts"
description: >
  No SCP denies account:CloseAccount with a condition scoped to
  accounts tagged HasRegisteredDomains. The unconditional deny
  (CTL.IAM.SCP.CLOSEACCOUNT.001) prevents all account closures,
  but organizations that allow controlled account decommissioning
  need a tag-conditional deny that protects only accounts holding
  Route 53 domain registrations. Without this, an account closure
  workflow can close a domain-holding account, triggering domain
  suspension on day 5 and permanent loss after 30 days.
domain: identity
severity: high
compliance:
  nist_800_53_r5: "AC-6"
  soc2: "CC6.1"
  ccm_v4: ["IAM-05", "BCR-08"]
scope_tags:
  - aws
  - iam
taxonomy:
  - account-governance
  - compliance-mapping
payer_exempt: true
payer_compensating_control: null
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_organization
params:
  attack_stage: impact
observation_fields:
  - identity.kind
  - identity.scp.denies_close_account_for_domain_tagged
remediation:
  description: >
    Organization SCPs do not deny account:CloseAccount for accounts
    tagged HasRegisteredDomains.
  action: >
    Add an SCP that denies organizations:CloseAccount and
    account:CloseAccount with a Condition requiring
    aws:ResourceTag/HasRegisteredDomains equals true. Apply
    it to the organization root or the OU containing domain-
    holding accounts.
  example: |
    {
      "identity": {
        "kind": "organization",
        "scp": {
          "denies_close_account_for_domain_tagged": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: organization
    - field: properties.identity.scp.denies_close_account_for_domain_tagged
      op: ne
      value: true
defect: >
  SCP does not deny CloseAccount conditioned on the
  HasRegisteredDomains tag.
infection: >
  An account decommissioning workflow or compromised admin
  closes an account that holds Route 53 domain registrations.
failure: >
  Domain suspension begins on day 5 after account closure.
  Domains become unresolvable, email stops, TLS certificates
  cannot be renewed. After 30 days the domain is released
  for anyone to register.
tests:
  - name: "no tag-conditional close-account deny fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:organizations::111122223333:organization/o-notag"
      asset_type: aws_organization
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            denies_close_account_for_domain_tagged: false
  - name: "tag-conditional close-account deny present passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:organizations::444455556666:organization/o-tagged"
      asset_type: aws_organization
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            denies_close_account_for_domain_tagged: true
