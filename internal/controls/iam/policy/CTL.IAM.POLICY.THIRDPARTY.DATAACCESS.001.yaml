dsl_version: ctrl.v1
id: CTL.IAM.POLICY.THIRDPARTY.DATAACCESS.001
name: Third-Party Role Has Data-Plane Access
description: >
  IAM role assumed by a third-party principal (cross-account trust
  outside the organization) has policies granting data-plane access
  to S3 (GetObject, PutObject), DynamoDB (GetItem, PutItem, Query),
  Secrets Manager (GetSecretValue), or similar data-reading actions.
  Third-party integrations should use scoped read-only access to
  metadata (ListBuckets, DescribeTable) unless data access is an
  explicit, documented requirement. Unintentional data-plane grants
  to vendor roles are a common root cause of data breaches via
  supply-chain compromise.
domain: identity
severity: high
compliance:
  nist_800_53_r5: "AC-6, AC-17"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  ccm_v4: ["IAM-05", "DSP-17"]
scope_tags:
  - aws
  - iam
taxonomy:
  - least-privilege
  - trust-boundary
subtractive_category:
  - S05
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  attack_stage: collection
observation_fields:
  - identity.kind
  - identity.trust.is_third_party
  - identity.policies.has_data_plane_access
remediation:
  description: >
    Third-party role has data-plane access to sensitive services.
  action: >
    Restrict the role's policies to metadata-only actions unless
    data access is an explicit integration requirement. Document
    the business justification and apply conditions (source IP,
    VPC endpoint, external ID) to limit scope.
  example: |
    {
      "identity": {
        "kind": "role",
        "trust": {
          "is_third_party": true
        },
        "policies": {
          "has_data_plane_access": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: role
    - field: properties.identity.trust.is_third_party
      op: eq
      value: true
    - field: properties.identity.policies.has_data_plane_access
      op: eq
      value: true
tests:
  - name: "third-party role with data access — fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:role/vendor-integration"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          trust:
            is_third_party: true
          policies:
            has_data_plane_access: true
  - name: "third-party role without data access — passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:role/vendor-readonly"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          trust:
            is_third_party: true
          policies:
            has_data_plane_access: false
  - name: "internal role with data access — passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:role/internal-app"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          trust:
            is_third_party: false
          policies:
            has_data_plane_access: true
