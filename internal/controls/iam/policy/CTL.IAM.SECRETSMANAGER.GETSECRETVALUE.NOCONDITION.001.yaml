dsl_version: ctrl.v1
id: CTL.IAM.SECRETSMANAGER.GETSECRETVALUE.NOCONDITION.001
name: "Broad secretsmanager:GetSecretValue Grant Without Condition"
description: >
  An identity policy grants secretsmanager:GetSecretValue on a broad
  Resource (wildcard or account-wide secret ARN pattern) with no
  Condition element. The re:Inforce 2019 fundamentals talk identifies
  ABAC tag-match conditions as the primary control for scoping secret
  access — without a Condition, the grant spans every secret in the
  account. This control fires only when the grant is via an explicit
  Action match (secretsmanager:GetSecretValue or a prefix wildcard
  like secretsmanager:Get* that covers it); grants via
  secretsmanager:* are covered by the service-wide wildcard controls
  (RF-IAM-07 family) and excluded here to avoid double-fire.
  NotAction/NotResource inversions are covered by
  CTL.IAM.POLICY.CONDITION.NOTRESOURCE.001 and are out of scope.
domain: identity
severity: high
compliance:
  nist_800_53_r5: "AC-6(5)"
  soc2: "CC6.3"
  ccm_v4: ["IAM-05"]
scope_tags:
  - aws
  - iam
taxonomy:
  - least-privilege
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_iam_user, aws_iam_role]
params:
  attack_stage: credential_access
observation_fields:
  - identity.kind
  - identity.policies.secretsmanager_getsecretvalue_broad_nocondition
remediation:
  description: >
    Identity policy grants secretsmanager:GetSecretValue on all
    secrets without an ABAC condition gate.
  action: >
    Add an ABAC Condition to the policy statement restricting
    GetSecretValue to secrets tagged for the principal's project or
    team. Example: "Condition": {"StringEquals":
    {"secretsmanager:ResourceTag/project":
    "${aws:PrincipalTag/project}"}}. Alternatively, scope the
    Resource to specific secret ARNs.
  example: |
    {
      "identity": {
        "kind": "role",
        "policies": {
          "secretsmanager_getsecretvalue_broad_nocondition": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: in
      value: [user, role]
    - field: properties.identity.policies.secretsmanager_getsecretvalue_broad_nocondition
      op: present
    - field: properties.identity.policies.secretsmanager_getsecretvalue_broad_nocondition
      op: eq
      value: true
tests:
  - name: "user with broad GetSecretValue and no condition fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:user/secrets-reader"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: user
          policies:
            secretsmanager_getsecretvalue_broad_nocondition: true
  - name: "role with ABAC condition present passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:role/scoped-secrets"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          policies:
            secretsmanager_getsecretvalue_broad_nocondition: false
  - name: "role without GetSecretValue grant passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:role/no-secrets"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          policies: {}
