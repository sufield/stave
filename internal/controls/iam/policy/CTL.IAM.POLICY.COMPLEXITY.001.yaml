dsl_version: ctrl.v1
id: CTL.IAM.POLICY.COMPLEXITY.001
name: IAM Policy Complexity Must Be Bounded
description: >
  IAM policies with more than 25 statements indicate excessive
  complexity that increases misconfiguration risk. Complex policies
  are harder to audit, more likely to contain shadowed statements or
  contradictory rules, and resist review. Policy complexity is itself
  a risk factor — it obscures the effective permissions and makes
  least-privilege verification impractical.
domain: identity
severity: medium
compliance:
  soc2: "CC6.1"
  nist_800_53_r5: "AC-6"
  fedramp_moderate: "AC-6"
  ccm_v4: ["IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
taxonomy:
  - compliance-mapping
  - resource-sprawl
subtractive_category:
  - S02
type: unsafe_state
classification: parameterized_check
applicable_asset_types: [aws_iam_user, aws_iam_role]
params:
  attack_stage: privilege_escalation
remediation:
  description: >
    IAM entity has policies with more than 25 total statements.
    Complex policies obscure effective permissions and resist audit.
  action: >
    Refactor complex policies into smaller, focused policies scoped to
    specific services. Use policy conditions and resource-scoped
    statements instead of many broad statements. Consider using
    AWS managed policies where appropriate.
  example: |
    {
      "identity": {
        "kind": "user",
        "policies": {
          "statement_count": 10
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.policies.statement_count
      op: gt
      value: 25
