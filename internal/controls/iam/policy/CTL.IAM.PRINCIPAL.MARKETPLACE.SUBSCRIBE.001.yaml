dsl_version: ctrl.v1
id: CTL.IAM.PRINCIPAL.MARKETPLACE.SUBSCRIBE.001
name: Principal Has Effective Marketplace Subscription Permissions
description: >
  IAM principal's effective permissions include buyer-side
  Marketplace subscription actions (Subscribe,
  AcceptAgreementRequest, AcceptAgreementApprovalRequest,
  CreateAgreementRequest). A principal with these permissions
  can create irrecoverable financial commitments via
  contract-with-consumption agreements — the attack path from
  the r/aws $472k incident. Ship-now-not-evaluable: this
  control evaluates when a collector projects the
  identity.marketplace.can_subscribe boolean from the IAM
  resolver's effective permission set.
domain: identity
severity: high
scope: atomic
corpus_reference: "aws:marketplace-buyer-actions"
compliance:
  nist_800_53_r5: "AC-6"
  soc2: "CC6.1"
  ccm_v4: ["IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
taxonomy:
  - least-privilege
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_user
  - aws_iam_role
params:
  base_impact: 7
  attack_stage: initial_access
  blast_radius:
    type: prevention
    scope: account
    multiplier: 1.5
observation_fields:
  - identity.marketplace.can_subscribe
remediation:
  description: >
    IAM principal has effective permissions to subscribe to
    Marketplace products.
  action: >
    Remove or scope the Marketplace subscription permissions.
    For managed policies (AdministratorAccess, PowerUserAccess),
    add an SCP deny (CTL.ORG.SCP.MARKETPLACE.001) or a
    ProductId condition (CTL.IAM.POLICY.MARKETPLACE.NOCONDITION.001).
    For explicit grants, replace with least-privilege policies.
  example: |
    {
      "identity": {
        "marketplace": {
          "can_subscribe": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.marketplace.can_subscribe
      op: eq
      value: true
defect: >
  IAM principal has effective Marketplace subscription
  permissions — can create financial commitments.
infection: >
  A compromised credential can call AcceptAgreementRequest to
  accept contract-with-consumption agreements. Seller-side
  BatchMeterUsage then generates charges the buyer cannot stop.
failure: >
  Attacker accepts a Marketplace agreement; seller meters
  arbitrary consumption. Charges are irrecoverable — the
  $472k incident demonstrated 4-hour detection was too slow.
tests:
  - name: "user with can_subscribe fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:user/deploy-bot"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: user
          marketplace:
            can_subscribe: true
  - name: "user without can_subscribe passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:user/readonly"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: user
          marketplace:
            can_subscribe: false
  - name: "user with absent field passes (not-evaluable)"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:user/legacy"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: user
