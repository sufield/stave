dsl_version: ctrl.v1
id: CTL.IAM.FOOTHOLD.CICD.SECRETS.001
name: CI/CD Role Can Read Production Secrets
description: >
  A CI/CD-identified role has effective permissions to read secrets
  from Secrets Manager (secretsmanager:GetSecretValue) or SSM
  Parameter Store SecureStrings (ssm:GetParameter). If the pipeline
  is compromised through a supply chain attack, the attacker harvests
  database credentials, API keys, and service tokens. The
  TeamPCP/Trivy attack (March 2026) stole the BerriAI/LiteLLM PyPI
  publishing token from Secrets Manager through exactly this path.
domain: identity
severity: medium
scope: compound
corpus_reference: MITRE:T1552.001
compliance:
  owasp_nhi: "NHI5"
  nist_800_53_r5: "AC-6"
  soc2: "CC6.1"
  ccm_v4: ["IAM-04"]
scope_tags:
  - aws
  - iam
  - cicd
taxonomy:
  - least-privilege
  - supply-chain
  - credential-lifecycle
subtractive_category:
  - S02
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  attack_stage: credential_access
observation_fields:
  - identity.cicd_role
  - identity.effective_access.secretsmanager
remediation:
  description: >
    CI/CD role can read secrets from Secrets Manager. A compromised
    pipeline can harvest production credentials.
  action: >
    Restrict secrets access to only the specific secrets the
    pipeline needs. Use resource-based conditions to scope
    secretsmanager:GetSecretValue to named secret ARNs. If the
    pipeline only needs secrets at deploy time, use a separate
    deploy-phase role with time-limited access.
  example: |
    {
      "identity": {
        "kind": "iam_role",
        "cicd_role": true,
        "effective_access": { "secretsmanager": false }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.cicd_role
      op: eq
      value: true
    - field: properties.identity.effective_access.secretsmanager
      op: eq
      value: true
tests:
  - name: "CI/CD role with secrets read fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:role/github-actions-deploy"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: iam_role
          cicd_role: true
          effective_access:
            secretsmanager: true
  - name: "CI/CD role without secrets read passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:role/github-actions-test"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: iam_role
          cicd_role: true
          effective_access:
            secretsmanager: false
