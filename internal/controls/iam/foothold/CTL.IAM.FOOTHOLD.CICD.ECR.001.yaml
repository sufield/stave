dsl_version: ctrl.v1
id: CTL.IAM.FOOTHOLD.CICD.ECR.001
name: CI/CD Role Can Push Container Images to ECR
description: >
  A CI/CD-identified role has effective permissions to push container
  images to ECR (ecr:PutImage, ecr:BatchPutImage,
  ecr:CompleteLayerUpload). If the pipeline is compromised through a
  supply chain attack on a dependency, the attacker can publish
  backdoored container images that production services pull. This is
  the artifact-poisoning leg of the supply chain propagation compound.
domain: identity
severity: medium
scope: compound
corpus_reference: MITRE:T1195.002
compliance:
  owasp_nhi: "NHI5"
  nist_800_53_r5: "AC-6"
  soc2: "CC6.1"
  ccm_v4: ["IAM-04"]
scope_tags:
  - aws
  - iam
  - cicd
taxonomy:
  - least-privilege
  - supply-chain
subtractive_category:
  - S02
  - S08
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  attack_stage: persistence
observation_fields:
  - identity.cicd_role
  - identity.effective_access.ecr
remediation:
  description: >
    CI/CD role can push images to ECR. A compromised pipeline can
    inject malicious container images into production registries.
  action: >
    Scope ECR push permissions to specific repositories. Use ECR
    repository policies to restrict which roles can push, and
    enable image scanning on push to detect known vulnerabilities
    in published images.
  example: |
    {
      "identity": {
        "kind": "iam_role",
        "cicd_role": true,
        "effective_access": { "ecr": false }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.cicd_role
      op: eq
      value: true
    - field: properties.identity.effective_access.ecr
      op: eq
      value: true
tests:
  - name: "CI/CD role with ECR push fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:role/github-actions-deploy"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: iam_role
          cicd_role: true
          effective_access:
            ecr: true
  - name: "CI/CD role without ECR push passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:role/github-actions-test"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: iam_role
          cicd_role: true
          effective_access:
            ecr: false
