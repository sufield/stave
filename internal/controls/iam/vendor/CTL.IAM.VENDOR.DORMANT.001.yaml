dsl_version: ctrl.v1
id: CTL.IAM.VENDOR.DORMANT.001
name: Vendor Cross-Account Role Must Not Be Dormant
description: >
  Cross-account roles granted to external vendors (SaaS providers,
  auditors, consultants) must be actively used or decommissioned.
  A vendor role unused for more than 90 days is "ghost access" —
  the vendor may no longer need it, the contract may have ended, but
  the access persists. Each dormant vendor role is an unmonitored
  ingress path that can be exploited if the vendor is compromised.
domain: identity
severity: high
compliance:
  soc2: "CC6.1"
  nist_800_53_r5: "AC-2"
  ccm_v4: ["IAM-07", "IAM-08", "IAM-10"]
  owasp_subtractive: "S07"
  subtractive_tier: "deletion"
scope_tags:
  - aws
  - iam
  - supply-chain
taxonomy:
  - network-perimeter
  - trust-boundary
  - trust-decay
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  base_impact: 7
  attack_stage: initial_access
remediation:
  description: >
    External vendor role has been unused for more than 90 days.
    Ghost access persists after the business need has ended.
  action: >
    Review the vendor relationship. If the contract has ended or
    the vendor no longer needs access, delete the cross-account
    role. If access is still needed, re-verify the trust policy
    and scope permissions to current requirements.
  example: |
    {
      "identity": {
        "kind": "role",
        "vendor_trust": {
          "is_external_vendor": true,
          "is_dormant": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: role
    - field: properties.identity.vendor_trust.is_external_vendor
      op: present
    - field: properties.identity.vendor_trust.is_external_vendor
      op: eq
      value: true
    - field: properties.identity.vendor_trust.is_dormant
      op: present
    - field: properties.identity.vendor_trust.is_dormant
      op: eq
      value: true
