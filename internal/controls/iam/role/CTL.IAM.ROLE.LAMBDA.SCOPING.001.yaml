dsl_version: ctrl.v1
id: CTL.IAM.ROLE.LAMBDA.SCOPING.001
name: Lambda Execution Role Assumable by Any Function
description: >
  Lambda execution role trust policy allows lambda.amazonaws.com
  without a condition restricting which Lambda functions can assume
  it. Any Lambda function in the account can assume this role. If
  the role has database access, any function — including one an
  attacker creates — gets database access by assuming this role.
domain: identity
severity: medium
compliance:
  owasp_nhi: "NHI5"
  soc2: "CC6.3"
  nist_800_53_r5: "AC-6(1)"
  pci_dss_v4.0: "7.2.2"
  fedramp_moderate: "AC-6(1)"
  ccm_v4: ["IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
  - lambda
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  attack_stage: privilege_escalation
observation_fields:
  - identity.kind
  - identity.role.lambda_scoped
  - identity.role.lambda_condition
remediation:
  description: >
    Lambda execution role trust policy allows any Lambda function
    in the account to assume it. No function-level scoping.
  action: >
    Add a condition on aws:SourceFunctionArn or lambda:FunctionArn
    in the trust policy to restrict which Lambda functions can assume
    this role.
  example: |
    {
      "identity": {
        "kind": "role",
        "role": {
          "lambda_scoped": true,
          "lambda_condition": "aws:SourceFunctionArn"
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: role
    - field: properties.identity.role.lambda_scoped
      op: ne
      value: true
defect: >
  Lambda execution role trust policy allows any Lambda function in
  the account to assume it.
infection: >
  Lambda functions assume their execution role via the Lambda service.
  When the trust policy only constrains the service principal
  (lambda.amazonaws.com) without a source function condition, any
  function in the account can assume the role. An attacker who can
  create a Lambda function (lambda:CreateFunction + iam:PassRole) can
  create a function that assumes this role and inherits its full
  permission set. If the role has RDS, DynamoDB, or S3 access, the
  attacker's function gets that access.
failure: >
  Unscoped execution role. Any Lambda function in the account can
  assume this role and inherit its full permission set.
tests:
  - name: role without function scoping fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:role/lambda-db-role"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          role:
            lambda_scoped: false
  - name: role with function scoping passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::111122223333:role/lambda-scoped-role"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          role:
            lambda_scoped: true
            lambda_condition: "aws:SourceFunctionArn"
