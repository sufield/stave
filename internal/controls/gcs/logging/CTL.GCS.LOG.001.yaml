dsl_version: ctrl.v1
id: CTL.GCS.LOG.001
name: Access Logging Must Be Enabled
description: >
  GCS buckets must have access logging enabled. Without logging, access
  patterns cannot be audited and unauthorized access goes undetected.
domain: exposure
severity: medium
compliance:
  cis_gcp_v1.3.0: "5.3"
  ccm_v4: ["LOG-12"]
scope_tags:
  - gcp
  - gcs
taxonomy:
  - compliance-mapping
  - logging
type: unsafe_state
classification: state_assertion
applicable_asset_types: [gcp_storage_bucket]
params:
  attack_stage: detection_evasion
remediation:
  description: >
    Bucket does not have access logging enabled. Access events are not
    recorded for audit or incident response.
  action: >
    Enable access logging for the bucket. Run:
    gcloud storage buckets update gs://BUCKET
    --log-bucket=LOG_BUCKET --log-object-prefix=PREFIX
  example: |
    {
      "storage": {
        "kind": "bucket",
        "logging": {
          "enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.logging.enabled
      op: eq
      value: false
