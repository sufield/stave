dsl_version: ctrl.v1
id: CTL.SIGNIN.CONSOLE.POLICY.EMPTY.001
name: Console Sign-In Policy Must Define Network Restrictions
description: >
  When console sign-in authorization is enabled, at least one
  resource permission statement must define network restrictions
  (source IP or source VPC conditions). Enforcement with no
  statements is a no-op — authorization is on but restricting
  nothing.
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["IAM-10"]
scope_tags:
  - aws
  - signin
taxonomy:
  - account-governance
  - identity-perimeter
subtractive_category:
  - S05
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_signin_configuration]
params:
  attack_stage: initial_access
observation_fields:
  - governance.signin.console_authorization_enabled
  - governance.signin.has_resource_permission_statements
remediation:
  description: >
    Console authorization is enabled but no resource permission
    statements restrict network access.
  action: >
    Add at least one resource permission statement via
    aws signin put-resource-permission-statement with
    --source-ip and/or --source-vpc parameters.
  example: |
    {
      "governance": {
        "signin": {
          "console_authorization_enabled": true,
          "has_resource_permission_statements": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.signin.console_authorization_enabled
      op: eq
      value: true
    - field: properties.governance.signin.has_resource_permission_statements
      op: eq
      value: false
defect: >
  Console authorization is enforced but no network restriction
  statements exist.
infection: >
  Sign-in enforcement is active but has no rules; any network
  location is permitted for console access.
failure: >
  Console sign-in appears protected (authorization enabled) but
  has no actual restrictions — security theatre.
tests:
  - name: enabled with no statements fires
    verdict: VIOLATION
    asset: { asset_id: "111111111111/signin", asset_type: aws_signin_configuration, vendor: aws, properties: { governance: { signin: { console_authorization_enabled: true, has_resource_permission_statements: false, has_excluded_principal: false } } } }
  - name: enabled with statements passes
    verdict: PASS
    asset: { asset_id: "222222222222/signin", asset_type: aws_signin_configuration, vendor: aws, properties: { governance: { signin: { console_authorization_enabled: true, has_resource_permission_statements: true, has_excluded_principal: false } } } }
  - name: disabled with no statements passes (control 1 handles this)
    verdict: PASS
    asset: { asset_id: "333333333333/signin", asset_type: aws_signin_configuration, vendor: aws, properties: { governance: { signin: { console_authorization_enabled: false, has_resource_permission_statements: false, has_excluded_principal: false } } } }
