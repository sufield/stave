dsl_version: ctrl.v1
id: CTL.SIGNIN.CONSOLE.BYPASS.UNDOCUMENTED.001
name: Console Sign-In Bypass Must Have Matching Restrictions
description: >
  An excluded principal (bypass ARN) in the console sign-in policy
  must be paired with at least one resource permission statement
  that defines actual restrictions. A bypass ARN with no restriction
  statements indicates incomplete configuration — the bypass exists
  for a restriction that does not exist.
domain: identity
severity: low
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
scope_tags:
  - aws
  - signin
taxonomy:
  - account-governance
  - identity-perimeter
subtractive_category:
  - S05
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_signin_configuration]
params:
  attack_stage: initial_access
observation_fields:
  - governance.signin.has_excluded_principal
  - governance.signin.has_resource_permission_statements
remediation:
  description: >
    Console sign-in policy has a bypass principal but no network
    restriction statements — the bypass has nothing to bypass.
  action: >
    Either add resource permission statements (source IP/VPC
    restrictions) that the bypass principal is exempt from, or
    remove the excluded principal if no restrictions are planned.
  example: |
    {
      "governance": {
        "signin": {
          "has_excluded_principal": true,
          "has_resource_permission_statements": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.signin.has_excluded_principal
      op: eq
      value: true
    - field: properties.governance.signin.has_resource_permission_statements
      op: eq
      value: false
defect: >
  Excluded principal exists but no resource permission statements
  define restrictions.
infection: >
  The bypass ARN grants an exemption from non-existent restrictions,
  indicating misconfigured or partially deployed sign-in policy.
failure: >
  Console sign-in policy is internally inconsistent — incomplete
  deployment.
tests:
  - name: bypass with no statements fires
    verdict: VIOLATION
    asset: { asset_id: "111111111111/signin", asset_type: aws_signin_configuration, vendor: aws, properties: { governance: { signin: { console_authorization_enabled: true, has_resource_permission_statements: false, has_excluded_principal: true } } } }
  - name: bypass with statements passes
    verdict: PASS
    asset: { asset_id: "222222222222/signin", asset_type: aws_signin_configuration, vendor: aws, properties: { governance: { signin: { console_authorization_enabled: true, has_resource_permission_statements: true, has_excluded_principal: true } } } }
  - name: no bypass no statements passes
    verdict: PASS
    asset: { asset_id: "333333333333/signin", asset_type: aws_signin_configuration, vendor: aws, properties: { governance: { signin: { console_authorization_enabled: true, has_resource_permission_statements: false, has_excluded_principal: false } } } }
