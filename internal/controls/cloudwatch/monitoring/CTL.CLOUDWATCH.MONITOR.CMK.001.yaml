dsl_version: ctrl.v1
id: CTL.CLOUDWATCH.MONITOR.CMK.001
name: "CMK Disable or Deletion Must Be Monitored"
description: >
  A CloudWatch metric filter and alarm must monitor cmk disable or deletion.
  KMS key disabling or scheduled deletion renders encrypted data permanently inaccessible — a ransomware vector.
domain: exposure
severity: high
compliance:
  owasp_nhi: "NHI8"
  cis_aws_v3.0: "4.7"
  soc2: "CC7.1"
  ccm_v4: ["LOG-03"]
scope_tags:
  - aws
  - cloudwatch
taxonomy:
  - compliance-mapping
  - encryption-at-rest
  - logging
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_cloudwatch_alarm]
params:
  attack_stage: detection_evasion
remediation:
  description: >
    No metric filter or alarm is configured to monitor cmk disable or deletion.
  action: >
    Create a CloudWatch log metric filter on the CloudTrail log group
    matching the CIS-specified pattern for cmk disable or deletion, then create
    an alarm with an SNS notification action.
  example: |
    {
      "monitoring": {
        "kind": "account",
        "metric_filters": {
          "cmk_changes": {
            "exists": true
          }
        },
        "alarms": {
          "cmk_changes": {
            "exists": true,
            "sns_topic_arn": "arn:aws:sns:us-east-1:123456789012:security-alerts"
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.monitoring.kind
      op: eq
      value: account
    - field: properties.monitoring.metric_filters.cmk_changes.exists
      op: ne
      value: true
