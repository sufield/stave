dsl_version: ctrl.v1
id: CTL.VPC.BPA.MODE.001
name: VPC Block Public Access Mode Is Not Bidirectional
description: >
  VPC Block Public Access is enabled but the internet gateway block
  mode is not "block-bidirectional". AWS supports two modes:
  "block-ingress" blocks inbound traffic through IGWs but permits
  outbound, while "block-bidirectional" blocks both directions.
  Ingress-only mode still permits outbound data exfiltration through
  IGWs — an attacker who gains code execution on an instance in a VPC
  with an IGW can exfiltrate data even though inbound connections are
  blocked. Bidirectional mode provides complete network isolation from
  the internet at the account level.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "SC-7, AC-4"
  fedramp_moderate: "SC-7"
  soc2: "CC6.6"
  ccm_v4: ["IVS-03"]
scope_tags:
  - aws
  - vpc
  - network-perimeter
taxonomy:
  - network-perimeter
  - compliance-mapping
subtractive_category:
  - S03
  - S06
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_account
params:
  attack_stage: exfiltration
observation_fields:
  - network.vpc_bpa.enabled
  - network.vpc_bpa.mode
remediation:
  description: >
    VPC BPA is enabled but mode is not bidirectional. Outbound traffic
    through Internet Gateways is still permitted.
  action: >
    Change the VPC BPA internet gateway block mode to
    "block-bidirectional" via ec2:ModifyVpcBlockPublicAccessOptions.
    Verify that workloads requiring outbound internet access use NAT
    Gateways (which are not affected by BPA) rather than IGW routes.
  example: |
    {
      "network": {
        "vpc_bpa": {
          "enabled": true,
          "mode": "block-bidirectional"
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.vpc_bpa.enabled
      op: eq
      value: true
    - field: properties.network.vpc_bpa.mode
      op: ne
      value: block-bidirectional
tests:
  - name: "BPA enabled ingress-only — fires"
    verdict: VIOLATION
    asset:
      asset_id: "123456789012"
      asset_type: aws_account
      vendor: aws
      properties:
        network:
          vpc_bpa:
            enabled: true
            mode: block-ingress
  - name: "BPA enabled bidirectional — passes"
    verdict: PASS
    asset:
      asset_id: "123456789012"
      asset_type: aws_account
      vendor: aws
      properties:
        network:
          vpc_bpa:
            enabled: true
            mode: block-bidirectional
  - name: "BPA not enabled — passes (ACCOUNT.001 handles this)"
    verdict: PASS
    asset:
      asset_id: "123456789012"
      asset_type: aws_account
      vendor: aws
      properties:
        network:
          vpc_bpa:
            enabled: false
            mode: ""
