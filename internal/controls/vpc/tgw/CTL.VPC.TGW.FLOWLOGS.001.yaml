dsl_version: ctrl.v1
id: CTL.VPC.TGW.FLOWLOGS.001
name: Transit Gateway Flow Logs Not Enabled
description: >
  Transit Gateway flow logs are not enabled. Cross-VPC traffic transiting
  through the TGW is not recorded. The TGW is the central hub for
  inter-VPC traffic — if flow logs are enabled on individual VPCs but not
  on the TGW itself, lateral-movement traffic between VPCs is invisible.
  Per-VPC flow logs capture traffic that enters and exits a VPC, but they
  do not show the TGW-internal routing decisions or traffic that traverses
  multiple VPCs via the TGW. Flow logs at the hub are required for
  forensics, anomaly detection, and incident response on cross-VPC flows.
domain: audit
severity: high
compliance:
  cis_aws_v3.0: "3.9"
  nist_800_53_r5: "AU-12"
  fedramp_moderate: "AU-12"
  pci_dss_v4.0: "10.2.1"
  soc2: "CC7.2"
  hipaa: "164.312(b)"
  ccm_v4: ["LOG-03", "LOG-08"]
scope_tags:
  - aws
  - vpc
taxonomy:
  - compliance-mapping
  - logging
  - network-isolation
subtractive_category:
  - S06
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_transit_gateway
params:
  attack_stage: detection_evasion
observation_fields:
  - network.kind
  - network.tgw.id
  - network.tgw.flow_logs_enabled
  - network.tgw.flow_log_destination
remediation:
  description: >
    Transit Gateway has no flow logs configured. Inter-VPC traffic is
    not recorded.
  action: >
    Enable flow logs on the Transit Gateway, sending records to a
    CloudWatch Logs group or S3 bucket in a logging-dedicated account.
    Retain logs per your incident response and compliance requirements
    (typically 1 year minimum). Correlate TGW flow logs with VPC flow
    logs to trace cross-VPC traffic end to end.
  example: |
    {
      "network": {
        "kind": "transit_gateway",
        "tgw": {
          "flow_logs_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: transit_gateway
    - field: properties.network.tgw.flow_logs_enabled
      op: eq
      value: false
