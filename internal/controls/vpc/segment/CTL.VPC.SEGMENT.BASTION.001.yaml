dsl_version: ctrl.v1
id: CTL.VPC.SEGMENT.BASTION.001
name: Bastion Host Has Unrestricted Internal Access
description: >
  A bastion or jump host (identified by tag or name containing
  "bastion"/"jump"/"jumpbox", or an instance with a public IP
  and SSH ingress from 0.0.0.0/0) has a security group that
  permits outbound to all internal subnets on management ports
  (SSH/22, RDP/3389). The bastion is, by design, the bridge
  between the public internet and the internal network — making
  it the highest-value lateral-movement target. A compromise of
  the bastion with unrestricted internal egress yields
  management-plane access to every instance in the VPC. The
  bastion's egress should be scoped to specific destination
  subnets and ports.
domain: exposure
severity: high
compliance:
  cis_aws_v3.0: "5.1"
  nist_800_53_r5: "AC-17"
  fedramp_moderate: "AC-17"
  pci_dss_v4.0: "1.3.2"
  soc2: "CC6.6"
  hipaa: "164.312(e)(1)"
  ccm_v4: ["IVS-03", "IVS-06"]
scope_tags:
  - aws
  - vpc
taxonomy:
  - compliance-mapping
  - network-isolation
  - network-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_vpc]
params:
  attack_stage: lateral_movement
observation_fields:
  - network.kind
  - network.bastion.identified
  - network.bastion.egress_unrestricted_internal
  - network.bastion.egress_destination_cidrs
  - network.bastion.egress_ports
remediation:
  description: >
    Bastion host's security group permits outbound traffic to
    all internal subnets on management ports.
  action: >
    Tighten the bastion SG egress to only the subnets and ports
    required for legitimate jump-host duties. Examples: SSH only
    to the application-subnet CIDR, RDP only to the Windows-tier
    CIDR. Replace the bastion with AWS Systems Manager Session
    Manager where feasible — it eliminates the bastion entirely
    and routes through IAM-authenticated SSM rather than SSH.
    If a bastion remains, keep its instance image patched, log
    every session to CloudWatch Logs or S3, and enforce MFA on
    the IAM role that connects.
  example: |
    {
      "network": {
        "kind": "ec2_instance",
        "bastion": {
          "egress_unrestricted_internal": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.bastion.identified
      op: eq
      value: true
    - field: properties.network.bastion.egress_unrestricted_internal
      op: eq
      value: true
