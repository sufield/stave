dsl_version: ctrl.v1
id: CTL.VPC.FLOWLOG.FORMAT.001
name: Flow Log Missing Critical Fields
description: >
  Flow log uses the default log format, which omits several fields
  useful for security analysis: vpc-id, subnet-id, tcp-flags,
  pkt-srcaddr, pkt-dstaddr, flow-direction. A custom log format
  that includes these fields substantially improves forensics
  capability — pkt-srcaddr/pkt-dstaddr show the pre-NAT addresses
  that map flows back to private-subnet origins, and tcp-flags
  distinguish established connections from SYN scans. The default
  format was designed for network-operations use cases and leaves
  security investigators reconstructing the missing context from
  other sources.
domain: audit
severity: medium
compliance:
  cis_aws_v3.0: "3.9"
  nist_800_53_r5: "AU-3"
  fedramp_moderate: "AU-3"
  pci_dss_v4.0: "10.2.2"
  soc2: "CC7.2"
  hipaa: "164.312(b)"
  ccm_v4: ["LOG-03", "LOG-08"]
scope_tags:
  - aws
  - vpc
taxonomy:
  - compliance-mapping
  - logging
  - network-isolation
subtractive_category:
  - S06
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_vpc_flow_log
params:
  attack_stage: detection_evasion
observation_fields:
  - network.kind
  - network.flowlog.format
  - network.flowlog.is_default_format
  - network.flowlog.has_critical_fields
  - network.flowlog.missing_fields
remediation:
  description: >
    Flow log uses the default format and omits fields that are
    valuable for security analysis.
  action: >
    Change the flow log's format to a custom format that includes
    vpc-id, subnet-id, tcp-flags, pkt-srcaddr, pkt-dstaddr, and
    flow-direction (in addition to the default fields). AWS
    provides a recommended security-oriented format in the
    documentation; copy it and extend with any workload-specific
    fields. New logs are delivered in the new format once the
    change is saved.
  example: |
    {
      "network": {
        "kind": "flow_log",
        "flowlog": {
          "has_critical_fields": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: flow_log
    - field: properties.network.flowlog.has_critical_fields
      op: eq
      value: false
