dsl_version: ctrl.v1
id: CTL.VPC.FLOWLOG.ENCRYPT.001
name: VPC Flow Logs Must Be Encrypted
description: >
  VPC flow logs contain network metadata (source/destination IPs, ports,
  protocols). When stored in S3, flow logs must be encrypted with a
  customer-managed KMS key to protect network topology information.
domain: exposure
severity: medium
compliance:
  hipaa: "164.312(a)(2)(iv)"
  soc2: "CC6.7"
  ccm_v4: ["LOG-12"]
scope_tags:
  - aws
  - vpc
taxonomy:
  - encryption-at-rest
  - logging
  - network-isolation
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_vpc
params:
  attack_stage: detection_evasion
remediation:
  description: >
    VPC flow logs are not encrypted. Network metadata is stored in
    plaintext, exposing infrastructure topology.
  action: >
    Configure flow log destination with SSE-KMS encryption. For S3
    destinations, enable default bucket encryption with a CMK.
  example: |
    {
      "network": {
        "kind": "vpc",
        "flow_log": {
          "encrypted": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: vpc
    - field: properties.network.flow_log.enabled
      op: eq
      value: true
    - field: properties.network.flow_log.encrypted
      op: eq
      value: false
