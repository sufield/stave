dsl_version: ctrl.v1
id: CTL.VPC.FLOWLOG.SUBNET.001
name: Sensitive Subnet Does Not Have Flow Logs
description: >
  Subnet flagged as containing sensitive resources (databases,
  management instances, tagged as critical) has no subnet-level
  flow logs AND the parent VPC does not have VPC-level flow logs
  enabled either. At that point, the subnet has no flow-log
  coverage at any scope. VPC-level logs satisfy the coverage
  requirement for non-sensitive subnets; sensitive subnets benefit
  from the extra granularity of subnet-level logs but the
  control fires only when neither layer is active, to avoid
  noise on well-covered deployments.
domain: audit
severity: medium
compliance:
  cis_aws_v3.0: "3.9"
  nist_800_53_r5: "AU-12"
  fedramp_moderate: "AU-12"
  pci_dss_v4.0: "10.2.1"
  soc2: "CC7.2"
  hipaa: "164.312(b)"
  ccm_v4: ["LOG-03", "LOG-08"]
scope_tags:
  - aws
  - vpc
taxonomy:
  - compliance-mapping
  - logging
  - network-isolation
subtractive_category:
  - S06
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_ec2_subnet
params:
  attack_stage: detection_evasion
observation_fields:
  - network.kind
  - network.subnet.id
  - network.subnet.name
  - network.subnet.flow_logs_enabled
  - network.subnet.vpc_flow_logs_enabled
  - network.subnet.has_sensitive_resources
remediation:
  description: >
    Sensitive subnet has no flow-log coverage at either subnet or
    VPC scope.
  action: >
    Enable flow logs at the subnet level for this subnet and
    route them to the same destination used by the rest of the
    account (CloudWatch Logs or S3 in a logging-dedicated
    account). Alternatively, enable VPC-level flow logs if
    VPC-wide coverage is preferred. Sensitive subnets (databases,
    management) are usually worth the extra granularity of
    subnet-level logs on top of VPC-level.
  example: |
    {
      "network": {
        "kind": "subnet",
        "subnet": {
          "flow_logs_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: subnet
    - field: properties.network.subnet.has_sensitive_resources
      op: eq
      value: true
    - field: properties.network.subnet.flow_logs_enabled
      op: eq
      value: false
    - field: properties.network.subnet.vpc_flow_logs_enabled
      op: eq
      value: false
