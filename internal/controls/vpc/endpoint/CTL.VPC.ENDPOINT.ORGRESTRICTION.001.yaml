dsl_version: ctrl.v1
id: CTL.VPC.ENDPOINT.ORGRESTRICTION.001
name: VPC Endpoint Policy Must Restrict Destination to Organizational Resources
description: >
  VPC endpoint policies for data services (S3, DynamoDB, Secrets Manager,
  Bedrock, SageMaker) must restrict access to organizational resources using
  aws:ResourceOrgID, aws:ResourceAccount, or specific resource ARNs. Without
  destination restriction, a compromised workload can reach any resource in
  the service globally — including attacker-controlled resources in external
  accounts — through the organization's own endpoint. This is the network-level
  enforcement layer that catches what IAM policy gaps miss.
domain: network
severity: high
compliance:
  nist_800_53_r5: "AC-4"
  soc2: "CC6.6"
  ccm_v4: ["IVS-03", "DSP-17"]
scope_tags:
  - aws
  - vpc
taxonomy:
  - network-perimeter
  - data-perimeter
  - identity-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_vpc_endpoint
params:
  attack_stage: exfiltration
remediation:
  description: >
    VPC endpoint policy does not restrict access to organizational
    resources. Any resource in the service globally is reachable
    through this endpoint.
  action: >
    Add an aws:ResourceOrgID condition to the endpoint policy to
    restrict access to resources owned by your organization, or
    restrict the Resource field to specific resource ARNs.
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: vpc_endpoint
    - field: properties.network.endpoint_policy.restricts_to_org_resources
      op: eq
      value: false
