dsl_version: ctrl.v1
id: CTL.VPC.ENDPOINT.SECRETSMANAGER.EGRESS.001
name: Secrets Manager Endpoint Policy Does Not Restrict Destination to Organizational Resources
description: >
  Secrets Manager interface endpoint policy does not restrict access to
  organizational resources using aws:ResourceOrgID, aws:ResourceAccount,
  or specific secret ARNs. Without destination restriction, a compromised
  workload can PutSecretValue to any secret globally — including secrets
  in attacker-controlled accounts — exfiltrating data via secret creation
  in an external account.
domain: network
severity: high
compliance:
  nist_800_53_r5: "AC-4"
  soc2: "CC6.6"
  ccm_v4: ["IVS-03", "DSP-17"]
scope_tags:
  - aws
  - vpc
taxonomy:
  - network-perimeter
  - data-perimeter
subtractive_category:
  - S05
  - S06
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_vpc_endpoint
params:
  attack_stage: exfiltration
observation_fields:
  - network.kind
  - network.vpc_endpoint.service_name
  - network.endpoint_policy.restricts_to_org_resources
remediation:
  description: >
    Secrets Manager endpoint policy does not restrict access to
    organizational resources. Any secret globally is reachable through
    this endpoint.
  action: >
    Add an aws:ResourceOrgID condition to the endpoint policy to restrict
    access to secrets owned by your organization, or restrict the Resource
    field to specific secret ARNs.
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: vpc_endpoint
    - field: properties.network.vpc_endpoint.service_name
      op: contains
      value: ".secretsmanager"
    - field: properties.network.endpoint_policy.restricts_to_org_resources
      op: eq
      value: false
tests:
  - name: "Secrets Manager endpoint without org restriction fires"
    verdict: VIOLATION
    asset:
      asset_id: "vpce-0sm001unrestricted"
      asset_type: aws_vpc_endpoint
      vendor: aws
      properties:
        network:
          kind: vpc_endpoint
          vpc_endpoint:
            kind: Interface
            service_name: com.amazonaws.us-east-1.secretsmanager
          endpoint_policy:
            restricts_to_org_resources: false
  - name: "Secrets Manager endpoint with org restriction passes"
    verdict: PASS
    asset:
      asset_id: "vpce-0sm002restricted"
      asset_type: aws_vpc_endpoint
      vendor: aws
      properties:
        network:
          kind: vpc_endpoint
          vpc_endpoint:
            kind: Interface
            service_name: com.amazonaws.us-east-1.secretsmanager
          endpoint_policy:
            restricts_to_org_resources: true
