dsl_version: ctrl.v1
id: CTL.VPC.ENDPOINT.ECR.EGRESS.001
name: ECR Endpoint Policy Does Not Restrict Destination to Organizational Resources
description: >
  ECR interface endpoint policy does not restrict access to organizational
  resources using aws:ResourceOrgID, aws:ResourceAccount, or specific
  repository ARNs. Without destination restriction, a compromised workload
  can PutImage to any ECR repository globally — including attacker-controlled
  repositories in external accounts — exfiltrating code, configuration, and
  embedded secrets via container image push.
domain: network
severity: high
compliance:
  nist_800_53_r5: "AC-4"
  soc2: "CC6.6"
  ccm_v4: ["IVS-03", "DSP-17"]
scope_tags:
  - aws
  - vpc
taxonomy:
  - network-perimeter
  - data-perimeter
subtractive_category:
  - S05
  - S06
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_vpc_endpoint
params:
  attack_stage: exfiltration
observation_fields:
  - network.kind
  - network.vpc_endpoint.service_name
  - network.endpoint_policy.restricts_to_org_resources
remediation:
  description: >
    ECR endpoint policy does not restrict access to organizational
    resources. Any ECR repository globally is reachable through this
    endpoint.
  action: >
    Add an aws:ResourceOrgID condition to the endpoint policy to restrict
    access to repositories owned by your organization, or restrict the
    Resource field to specific repository ARNs.
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: vpc_endpoint
    - field: properties.network.vpc_endpoint.service_name
      op: contains
      value: ".ecr"
    - field: properties.network.endpoint_policy.restricts_to_org_resources
      op: eq
      value: false
tests:
  - name: "ECR endpoint without org restriction fires"
    verdict: VIOLATION
    asset:
      asset_id: "vpce-0ecr001unrestricted"
      asset_type: aws_vpc_endpoint
      vendor: aws
      properties:
        network:
          kind: vpc_endpoint
          vpc_endpoint:
            kind: Interface
            service_name: com.amazonaws.us-east-1.ecr.api
          endpoint_policy:
            restricts_to_org_resources: false
  - name: "ECR endpoint with org restriction passes"
    verdict: PASS
    asset:
      asset_id: "vpce-0ecr002restricted"
      asset_type: aws_vpc_endpoint
      vendor: aws
      properties:
        network:
          kind: vpc_endpoint
          vpc_endpoint:
            kind: Interface
            service_name: com.amazonaws.us-east-1.ecr.api
          endpoint_policy:
            restricts_to_org_resources: true
