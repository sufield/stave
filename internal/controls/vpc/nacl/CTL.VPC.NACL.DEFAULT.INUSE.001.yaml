dsl_version: ctrl.v1
id: CTL.VPC.NACL.DEFAULT.INUSE.001
name: Subnet Uses Default Network ACL
description: >
  Subnet is associated with the VPC's default Network ACL, which
  ships with allow-all rules for both inbound and outbound
  traffic. Network ACLs are stateless subnet-level filters
  evaluated before security groups. The default NACL provides
  no filtering, so security groups become the only network
  control layer — a misconfigured or overly permissive SG has
  no NACL safety net. Custom NACLs add defense-in-depth: even
  if an SG allows SSH from 0.0.0.0/0, a NACL rule denying
  0.0.0.0/0:22 at the subnet boundary blocks the traffic.
domain: exposure
severity: medium
compliance:
  cis_aws_v3.0: "5.1"
  nist_800_53_r5: "SC-7"
  fedramp_moderate: "SC-7"
  pci_dss_v4.0: "1.3.2"
  soc2: "CC6.6"
  ccm_v4: ["IVS-03", "IVS-06"]
scope_tags:
  - aws
  - vpc
taxonomy:
  - compliance-mapping
  - network-isolation
  - network-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_vpc_network_acl
params:
  attack_stage: initial_access
observation_fields:
  - network.kind
  - network.nacl.is_default
  - network.nacl.id
  - network.nacl.subnet_id
  - network.nacl.allows_all_inbound
  - network.nacl.allows_all_outbound
remediation:
  description: >
    Subnet uses the default Network ACL. No subnet-level filtering
    is applied; security groups are the only control layer.
  action: >
    Associate the subnet with a custom NACL that mirrors the
    security-group policy at the subnet boundary: deny known-
    bad CIDRs, deny admin ports from non-management sources,
    and allow only the egress destinations required by the
    subnet's workload. NACLs are stateless, so allow rules
    must cover both request and response directions explicitly
    (use AWS documentation's ephemeral-port tables).
  example: |
    {
      "network": {
        "kind": "network_acl",
        "nacl": {
          "is_default": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: network_acl
    - field: properties.network.nacl.is_default
      op: eq
      value: true
