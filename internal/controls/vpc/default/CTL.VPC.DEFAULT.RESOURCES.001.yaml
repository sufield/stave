dsl_version: ctrl.v1
id: CTL.VPC.DEFAULT.RESOURCES.001
name: Resources Deployed in Default VPC
description: >
  Active resources (EC2 instances, RDS instances, VPC-configured
  Lambda functions, ECS tasks) exist in the default VPC. The default
  VPC ships with unsafe defaults: public subnets in every AZ with
  `MapPublicIpOnLaunch` enabled, a default security group that
  permits all intra-VPC traffic, and an Internet Gateway. Production
  workloads inherit all of those defaults. Strengthens
  `CTL.VPC.DEFAULT.001` (which detects the default VPC's existence)
  by focusing on the actionable problem — resources deployed in it.
domain: exposure
severity: high
compliance:
  cis_aws_v3.0: "5.1"
  nist_800_53_r5: "SC-7"
  fedramp_moderate: "SC-7"
  pci_dss_v4.0: "1.2.1"
  soc2: "CC6.6"
  ccm_v4: ["IVS-03", "IVS-06"]
  owasp_subtractive: "S04"
  subtractive_tier: "deletion"
scope_tags:
  - aws
  - vpc
taxonomy:
  - compliance-mapping
  - network-isolation
subtractive_category:
  - S03
  - S04
  - S06
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_vpc
params:
  attack_stage: initial_access
observation_fields:
  - network.kind
  - network.vpc.is_default
  - network.vpc.resource_count
  - network.vpc.resource_types
  - network.vpc.has_active_resources
remediation:
  description: >
    Default VPC contains active workload resources.
  action: >
    Migrate resources out of the default VPC into a purpose-built VPC
    with non-default subnets, route tables, and security groups. If
    migration is not feasible short-term, harden the default VPC in
    place: remove auto-assign public IP on its subnets, restrict the
    default security group to deny-all, and detach the default IGW
    if the resources do not need internet access. Do not deploy new
    workloads into the default VPC.
  example: |
    {
      "network": {
        "kind": "vpc",
        "vpc": {
          "is_default": true,
          "has_active_resources": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: vpc
    - field: properties.network.vpc.is_default
      op: eq
      value: true
    - field: properties.network.vpc.has_active_resources
      op: eq
      value: true
