dsl_version: ctrl.v1
id: CTL.VPC.SG.EGRESS.DNS.001
name: Security Group Allows DNS Egress to Internet
description: >
  Security group allows UDP/TCP port 53 outbound to 0.0.0.0/0 instead
  of restricting DNS to internal resolvers or VPC DNS
  (169.254.169.253). Unrestricted DNS egress enables DNS tunneling —
  data exfiltration encoded in DNS queries to attacker-controlled
  domains. The finding is informational — the exfiltration signal
  lives in the vpc_dns_exfiltration chain which combines this
  indicator with missing DNS Firewall.
domain: exposure
severity: low
compliance:
  soc2: "CC6.6"
  nist_800_53_r5: "SC-7"
  pci_dss_v4.0: "1.3.1"
  ccm_v4: ["IVS-03"]
scope_tags:
  - aws
  - vpc
taxonomy:
  - compliance-mapping
  - network-perimeter
subtractive_category:
  - S03
  - S06
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_ec2_security_group
defect: >
  Security group allows DNS (port 53) egress to 0.0.0.0/0 instead of
  VPC DNS resolver.
infection: >
  DNS tunneling encodes data in DNS queries and responses. An attacker
  on a compromised instance sends DNS queries to a domain they control
  — each query contains a small amount of exfiltrated data in the
  subdomain label. The response carries commands. DNS traffic is rarely
  inspected or blocked because legitimate DNS is required for
  operations. Restricting DNS egress to the VPC DNS resolver
  (169.254.169.253) or Route53 Resolver endpoints prevents direct DNS
  communication with external resolvers.
failure: >
  Data exfiltration via DNS tunneling. An attacker exfiltrates data
  through DNS queries to a domain they control.
params:
  attack_stage: exfiltration
remediation:
  description: >
    Security group allows DNS egress to the internet. DNS tunneling
    is possible from any resource behind this SG.
  action: >
    Restrict DNS egress to the VPC DNS resolver (169.254.169.253) or
    Route53 Resolver endpoints. Remove rules allowing port 53 to
    0.0.0.0/0.
  example: |
    {
      "network": {
        "kind": "security_group",
        "egress": {
          "dns_to_internet": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: security_group
    - field: properties.network.egress.dns_to_internet
      op: eq
      value: true
tests:
  - name: SG with DNS egress to internet fires
    verdict: VIOLATION
    asset:
      asset_id: "sg-dns-open"
      asset_type: aws_security_group
      vendor: aws
      properties:
        network:
          kind: security_group
          egress:
            dns_to_internet: true
  - name: SG with DNS to VPC resolver passes
    verdict: PASS
    asset:
      asset_id: "sg-dns-internal"
      asset_type: aws_security_group
      vendor: aws
      properties:
        network:
          kind: security_group
          egress:
            dns_to_internet: false
