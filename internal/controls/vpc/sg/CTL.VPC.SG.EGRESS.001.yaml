dsl_version: ctrl.v1
id: CTL.VPC.SG.EGRESS.001
name: Security Group Allows Unrestricted Egress
description: >
  Security group allows all outbound traffic to 0.0.0.0/0 on all
  protocols and ports. This is the default configuration for every
  AWS security group. The finding is informational — the
  exfiltration signal lives in the compound chains
  (vpc_exfiltration_path, vpc_dns_exfiltration,
  data_exfiltration_path, vpc_private_subnet_leakage) which
  combine this indicator with missing detection controls.
domain: exposure
severity: low
compliance:
  soc2: "CC6.6"
  nist_800_53_r5: "SC-7"
  fedramp_moderate: "SC-7"
  ccm_v4: ["IVS-03"]
scope_tags:
  - aws
  - vpc
taxonomy:
  - compliance-mapping
  - network-perimeter
subtractive_category:
  - S03
  - S06
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_ec2_security_group
params:
  attack_stage: lateral_movement
remediation:
  description: >
    Security group allows all outbound traffic to the internet.
  action: >
    Replace the default allow-all egress rule with specific outbound
    rules for required ports (443 for HTTPS, 53 for DNS, etc.) and
    destinations. Use VPC endpoints for AWS service traffic to avoid
    internet egress entirely.
  example: |
    {
      "network": {
        "kind": "security_group",
        "egress": {
          "unrestricted_all_ports": false
        }
      }
    }
defect: >
  Security group allows all egress traffic to 0.0.0.0/0 (all protocols,
  all ports).
infection: >
  Unrestricted egress is the default configuration for every AWS security
  group. Most organizations never modify it. An attacker who gains code
  execution on any resource behind this SG can exfiltrate data to any
  destination, establish reverse shells to any C2 server, tunnel data
  through DNS, and send stolen credentials to any endpoint.
failure: >
  Unrestricted outbound communication. A compromised resource exfiltrates
  data, establishes C2, or sends stolen credentials to any internet
  destination.
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: security_group
    - field: properties.network.egress.unrestricted_all_ports
      op: eq
      value: true
tests:
  - name: SG with all-traffic egress fires
    verdict: VIOLATION
    asset:
      asset_id: "sg-allopen-egress"
      asset_type: aws_ec2_security_group
      vendor: aws
      properties:
        network:
          kind: security_group
          egress:
            unrestricted_all_ports: true
  - name: SG with scoped egress passes
    verdict: PASS
    asset:
      asset_id: "sg-scoped-egress"
      asset_type: aws_ec2_security_group
      vendor: aws
      properties:
        network:
          kind: security_group
          egress:
            unrestricted_all_ports: false
  - name: SG with DNS-only egress passes
    verdict: PASS
    asset:
      asset_id: "sg-dns-only"
      asset_type: aws_ec2_security_group
      vendor: aws
      properties:
        network:
          kind: security_group
          egress:
            unrestricted_all_ports: false
            dns_to_internet: true
