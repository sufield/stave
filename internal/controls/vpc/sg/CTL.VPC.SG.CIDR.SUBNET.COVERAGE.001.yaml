dsl_version: ctrl.v1
id: CTL.VPC.SG.CIDR.SUBNET.COVERAGE.001
name: Security Group Ingress Rules Do Not Cover All VPC Subnets
description: >
  Security group has ingress rules with RFC 1918 CIDR sources that
  do not cover all subnets in the VPC. This typically occurs after
  VPC CIDR expansion — automation adds subnets in the new CIDR
  range but existing SG rules still reference only the original
  subnets. Workloads in uncovered subnets cannot reach services
  behind this SG on the restricted ports, and the asymmetry may
  mask lateral movement detection when only some internal traffic
  is visible to the SG.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "AC-4"
  soc2: "CC6.6"
  pci_dss_v4.0: "1.2.1"
  ccm_v4: ["IVS-03"]
scope_tags:
  - aws
  - vpc
taxonomy:
  - network-isolation
  - network-perimeter
subtractive_category:
  - S06
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_ec2_security_group
params:
  attack_stage: lateral_movement
observation_fields:
  - network.kind
  - network.security_group.cidr_coverage.covers_all_vpc_subnets
  - network.security_group.cidr_coverage.has_cidr_rules
  - network.security_group.cidr_coverage.uncovered_subnet_count
remediation:
  description: >
    Security group ingress rules reference specific internal CIDRs
    that do not cover all subnets in the VPC.
  action: >
    Update the SG ingress rules to use the VPC's full CIDR range
    (e.g. 10.0.0.0/8 or the VPC CIDR) instead of individual subnet
    CIDRs, or add rules for the missing subnet CIDRs. After VPC
    CIDR expansion, audit all SGs that use subnet-specific CIDRs.
  example: |
    {
      "network": {
        "kind": "security_group",
        "security_group": {
          "cidr_coverage": {
            "covers_all_vpc_subnets": true,
            "has_cidr_rules": true,
            "uncovered_subnet_count": 0
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: security_group
    - field: properties.network.security_group.cidr_coverage.has_cidr_rules
      op: eq
      value: true
    - field: properties.network.security_group.cidr_coverage.covers_all_vpc_subnets
      op: eq
      value: false
tests:
  - name: SG with full VPC CIDR coverage passes
    verdict: PASS
    asset:
      asset_id: "sg-full-coverage"
      asset_type: aws_ec2_security_group
      vendor: aws
      properties:
        network:
          kind: security_group
          security_group:
            cidr_coverage:
              covers_all_vpc_subnets: true
              has_cidr_rules: true
              uncovered_subnet_count: 0
  - name: SG with partial coverage fires
    verdict: VIOLATION
    asset:
      asset_id: "sg-partial-coverage"
      asset_type: aws_ec2_security_group
      vendor: aws
      properties:
        network:
          kind: security_group
          security_group:
            cidr_coverage:
              covers_all_vpc_subnets: false
              has_cidr_rules: true
              uncovered_subnet_count: 2
  - name: SG with no CIDR rules is safe
    verdict: PASS
    asset:
      asset_id: "sg-no-cidr-rules"
      asset_type: aws_ec2_security_group
      vendor: aws
      properties:
        network:
          kind: security_group
          security_group:
            ingress_rules: []
