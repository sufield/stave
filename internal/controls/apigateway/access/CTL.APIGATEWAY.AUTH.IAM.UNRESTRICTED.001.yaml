dsl_version: ctrl.v1
id: CTL.APIGATEWAY.AUTH.IAM.UNRESTRICTED.001
name: IAM-Authorized Method Without Resource-Level Restriction
description: >
  REST API method uses AWS_IAM authorization, but no resource
  policy restricts which IAM principals can invoke. With AWS_IAM
  alone, every IAM principal in the AWS account that holds
  execute-api:Invoke on this API's ARN can call the method. In
  large accounts that's hundreds or thousands of principals — far
  beyond the intended caller set. AWS_IAM is the authentication
  layer; the authorization layer is the resource policy. Without
  a resource policy that names specific principals or scopes
  invocation by VPC, source IP, or organization, the method is
  effectively open to every IAM identity that can hit it.
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "AC-2, AC-3, AC-6"
  fedramp_moderate: "AC-2, AC-3, AC-6"
  pci_dss_v4.0: "7.1, 7.2"
  soc2: "CC6.1, CC6.3"
  iso_27001_2022: "A.5.15, A.8.3"
  ccm_v4: ["IAM-04", "IAM-05"]
scope_tags:
  - aws
  - apigateway
taxonomy:
  - compliance-mapping
  - identity-perimeter
  - network-perimeter
subtractive_category:
  - S03
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_apigateway_rest_api]
params:
  attack_stage: privilege_escalation
remediation:
  description: >
    AWS_IAM authorization is enabled but no resource policy scopes
    invocation; every IAM principal in the account can call.
  action: >
    Attach a resource policy that names the specific principals
    permitted to invoke (Principal: AWS: arn:aws:iam::ACCOUNT:role/X)
    or scopes by source VPC / source IP / aws:PrincipalOrgID. aws
    apigateway update-rest-api with --patch-operations
    op=replace,path=/policy,value=<json>. For private APIs, scope
    by aws:SourceVpce. For public-internet APIs, scope by
    aws:PrincipalOrgID to the organization that should reach the
    API.
  example: |
    {
      "api": {
        "kind": "apigateway_method",
        "method": {
          "authorization_type": "AWS_IAM",
          "iam": {
            "resource_policy_restricts_principals": true
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.api.kind
      op: eq
      value: apigateway_method
    - field: properties.api.method.authorization_type
      op: eq
      value: AWS_IAM
    - field: properties.api.method.iam.resource_policy_restricts_principals
      op: eq
      value: false
