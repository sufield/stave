dsl_version: ctrl.v1
id: CTL.APIGATEWAY.AUTH.JWT.AUDIENCE.001
name: HTTP API JWT Authorizer Without Audience Validation
description: >
  HTTP API JWT authorizer does not validate the audience (aud) claim.
  Without audience validation, any valid JWT signed by the configured
  issuer is accepted — regardless of which application it was issued
  for. If the issuer (Auth0, Cognito, Okta, or any IdP serving
  multiple applications) issues tokens for Application A, those
  tokens can be used to access this API even if it is Application B.
  The token is legitimately signed and not expired but was never
  intended for this audience. Audience validation ties the token to
  this API's specific client ID.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "IA-2"
  fedramp_moderate: "IA-2"
  pci_dss_v4.0: "8.2"
  soc2: "CC6.2"
  ccm_v4: ["IAM-04", "IAM-16"]
scope_tags:
  - aws
  - apigateway
taxonomy:
  - compliance-mapping
subtractive_category:
  - S03
  - S07
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_apigateway_rest_api]
params:
  attack_stage: initial_access
remediation:
  description: >
    HTTP API JWT authorizer accepts any token from the issuer because
    audience is not validated. Cross-application token reuse is
    possible.
  action: >
    Configure the audience claim on the JWT authorizer with the
    specific client ID(s) that should be accepted. In the API
    Gateway console: Authorizer → Edit → Audience. Multiple audiences
    are allowed; an empty audience list is the unsafe state. Verify
    that the issuer URL is also pinned and uses HTTPS.
  example: |
    {
      "api": {
        "kind": "apigateway_authorizer",
        "authorizer": {
          "type": "JWT",
          "jwt": {
            "audience_configured": true
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.api.kind
      op: eq
      value: apigateway_authorizer
    - field: properties.api.authorizer.type
      op: eq
      value: JWT
    - field: properties.api.authorizer.jwt.audience_configured
      op: eq
      value: false
