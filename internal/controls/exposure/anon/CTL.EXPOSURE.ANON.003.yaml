dsl_version: ctrl.v1
id: CTL.EXPOSURE.ANON.003
name: Unauthenticated Access Path Must Have Authentication Boundary
description: >
  Any resource reachable from anonymous principals must have at least
  one authentication boundary in the access path — a point where
  identity is verified (Cognito authorizer, Lambda authorizer, IAM
  authorization, mTLS). An inspection boundary (WAF, API Gateway
  threat protection) provides defense-in-depth but does NOT establish
  identity — a path with only WAF is still unauthenticated. This
  control flags paths where no identity verification exists between
  the public internet and the target resource.
domain: exposure
severity: high
compliance:
  soc2: "CC6.6"
  pci_dss_v4.0: "6.4.1"
  nist_800_53_r5: "SC-7"
  fedramp_moderate: "SC-7"
  ccm_v4: ["DSP-07", "DSP-17", "IVS-03"]
scope_tags:
  - aws
  - cross-service
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_resource]
params:
  base_impact: 8
  attack_stage: initial_access
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.0
remediation:
  description: >
    Resource is reachable from anonymous with no authentication
    boundary in the path. An inspection boundary (WAF) may exist
    but does not verify identity.
  action: >
    Add an authentication boundary to the access path. Configure a
    Cognito user pool authorizer or Lambda authorizer on API Gateway
    routes. Enable IAM authorization on the API Gateway stage. If
    service-to-service, enable mTLS.
  example: |
    {
      "reachability": {
        "kind": "anonymous_path",
        "anonymous_path": {
          "reachable": true,
          "has_auth_boundary": true,
          "auth_boundary_types": ["cognito"],
          "inspection_boundary_types": ["waf"]
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.reachability.kind
      op: eq
      value: anonymous_path
    - field: properties.reachability.anonymous_path.reachable
      op: present
    - field: properties.reachability.anonymous_path.reachable
      op: eq
      value: true
    - field: properties.reachability.anonymous_path.has_auth_boundary
      op: ne
      value: true
