dsl_version: ctrl.v1
id: CTL.KEYSPACES.SECRET.PLAIN.001
name: Keyspaces Connection Credentials Must Use Secrets Manager
description: >
  Keyspaces connection credentials are not managed through
  AWS Secrets Manager. Hardcoded CQL credentials risk exposure
  and complicate rotation.
domain: identity
severity: low
compliance:
  nist_800_53_r5: "IA-5"
  soc2: "CC6.1"
scope_tags:
  - aws
  - keyspaces
taxonomy:
  - compliance-mapping
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_keyspaces_keyspace]
params:
  attack_stage: credential_access
remediation:
  description: >
    Keyspaces connection credentials are not managed via
    Secrets Manager.
  action: >
    Store Keyspaces CQL credentials in AWS Secrets Manager
    and configure automatic rotation.
  example: |
    {
      "database": {
        "kind": "keyspace",
        "credentials": {
          "uses_secrets_manager": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.database.kind
      op: eq
      value: keyspace
    - field: properties.database.credentials.uses_secrets_manager
      op: ne
      value: true
tests:
  - name: keyspace without Secrets Manager fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cassandra:us-east-1:123456789012:/keyspace/my-keyspace"
      asset_type: aws_keyspaces_keyspace
      vendor: aws
      properties:
        database:
          kind: keyspace
          credentials:
            uses_secrets_manager: false
  - name: keyspace with Secrets Manager passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:cassandra:us-east-1:123456789012:/keyspace/my-keyspace"
      asset_type: aws_keyspaces_keyspace
      vendor: aws
      properties:
        database:
          kind: keyspace
          credentials:
            uses_secrets_manager: true
