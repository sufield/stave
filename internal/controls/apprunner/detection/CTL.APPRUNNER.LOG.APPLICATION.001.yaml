dsl_version: ctrl.v1
id: CTL.APPRUNNER.LOG.APPLICATION.001
name: App Runner Service Must Have Application Logging Enabled
description: >
  App Runner service does not have application logging enabled.
  Application logs capture stdout/stderr from the containerized
  application, providing visibility into runtime errors, request
  handling, and potential exploitation attempts. App Runner
  services are internet-facing — without application logging,
  web application attacks leave no trace in CloudWatch.
domain: detection
severity: medium
compliance:
  nist_800_53_r5: "AU-2, AU-3"
  soc2: "CC7.2"
  pci_dss_v4.0: "10.2"
scope_tags:
  - aws
  - apprunner
taxonomy:
  - compliance-mapping
  - logging
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_apprunner_service]
params:
  attack_stage: discovery
remediation:
  description: >
    App Runner service application logging is not enabled.
  action: >
    Enable application logging for the App Runner service to
    deliver container stdout/stderr to CloudWatch Logs.
  example: |
    {
      "compute": {
        "kind": "apprunner_service",
        "logging": {
          "application_log_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: apprunner_service
    - field: properties.compute.logging.application_log_enabled
      op: ne
      value: true
tests:
  - name: application logging disabled fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:apprunner:us-east-1:111122223333:service/api-backend/abc123"
      asset_type: aws_apprunner_service
      vendor: aws
      properties:
        compute:
          kind: apprunner_service
          logging:
            application_log_enabled: false
  - name: application logging enabled passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:apprunner:us-east-1:111122223333:service/api-backend/abc123"
      asset_type: aws_apprunner_service
      vendor: aws
      properties:
        compute:
          kind: apprunner_service
          logging:
            application_log_enabled: true
