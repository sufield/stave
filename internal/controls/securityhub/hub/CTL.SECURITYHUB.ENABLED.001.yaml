dsl_version: ctrl.v1
id: CTL.SECURITYHUB.ENABLED.001
name: AWS Security Hub Must Be Enabled
description: >
  Security Hub must be enabled to aggregate security findings from GuardDuty, Inspector, Macie, and Config into a unified view.
domain: exposure
severity: high
compliance:
  soc2: "CC7.1"
  pci_dss_v4.0: "11.3.1"
  nist_800_53_r5: "SI-4"
  fedramp_moderate: "SI-4"
  gdpr: "Art.32"
  ffiec: "CAT-D3"
  iso_27001_2022: "A.8.16"
  nist_csf_2.0: "DE.CM"
  ccm_v4: ["LOG-03"]
scope_tags:
  - aws
  - securityhub
taxonomy:
  - compliance-mapping
  - monitoring
subtractive_category:
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_securityhub_hub]
params:
  attack_stage: detection_evasion
  blast_radius:
    type: detection
    scope: account
    multiplier: 2.5
remediation:
  description: >
    Security Hub is not enabled. Security findings are not aggregated.
  action: >
    Enable Security Hub: aws securityhub enable-security-hub --enable-default-standards
  example: |
    {
      {
      "security_hub": {
        "kind": "hub",
        "enabled": true
      }
    }
    }
unsafe_predicate:
  all:
    - field: properties.security_hub.enabled
      op: eq
      value: false
