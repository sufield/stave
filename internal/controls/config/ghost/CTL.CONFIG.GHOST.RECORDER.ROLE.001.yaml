dsl_version: ctrl.v1
id: CTL.CONFIG.GHOST.RECORDER.ROLE.001
name: Config Recorder IAM Role Deleted
description: >
  AWS Config configuration recorder has an IAM
  role that has been deleted. The recorder
  exists with role ARN configured; the role
  itself does not exist. Config cannot assume
  the role, cannot read resource configurations,
  and recording stops silently. Every Config
  rule, every conformance pack, every compliance
  evaluation depends on this single role.
domain: exposure
severity: critical
archetype: ghost-reference
scope: compound
compliance:
  cis_aws_v3.0: "3.5"
  soc2: "CC7.1, CC8.1"
  nist_800_53_r5: "CM-2, CM-3, CM-8, SA-10"
  pci_dss_v4.0: "10.1, 11.5"
  fedramp_moderate: "CM-2, CM-8"
  hipaa: "164.312(b)"
  iso_27001_2022: "A.5.16, A.8.15"
  ccm_v4: ["LOG-08", "LOG-12"]
scope_tags:
  - aws
  - config
taxonomy:
  - account-governance
  - compliance-mapping
  - trust-decay
subtractive_category:
  - S08
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_config_recorder]
params:
  attack_stage: detection_evasion
  blast_radius:
    type: detection
    scope: account
    multiplier: 5.0
remediation:
  description: >
    Config recorder role is gone. Configuration
    recording cannot function.
  action: >
    Recreate the IAM role with the
    AWSConfigServiceRolePolicy or repoint the
    recorder at the AWS service-linked role
    (AWSServiceRoleForConfig) — the latter is
    auto-managed and avoids the ghost-role
    failure mode entirely. Update via aws
    configservice put-configuration-recorder
    --configuration-recorder
    name=<name>,roleARN=<role>. After fix,
    confirm the recorder status returns to
    recording and the next configuration
    history file lands in the delivery bucket.
  example: |
    {
      "compliance": {
        "kind": "config_recorder",
        "config": {
          "recorder_name": "default",
          "recorder_role_arn": "arn:aws:iam::111122223333:role/AWSServiceRoleForConfig",
          "recorder_role_exists": true,
          "has_ghost_recorder_role": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compliance.kind
      op: eq
      value: config_recorder
    - field: properties.compliance.config.has_ghost_recorder_role
      op: eq
      value: true
defect: >
  AWS Config recorder role has been deleted.
infection: >
  The Config recorder role is the IAM role
  Config assumes to call Describe* and List*
  APIs across all AWS services. Without this
  role, Config can't read the configuration of
  any resource — EC2 instances, S3 buckets,
  IAM policies, RDS databases, Lambda functions,
  security groups, KMS keys — nothing. The
  recorder appears in the console; the role
  ARN is displayed; the recording status may
  still show "Recording" until the next
  evaluation cycle fails. Every Config rule
  stops receiving configuration data, every
  compliance evaluation returns
  INSUFFICIENT_DATA, and every conformance
  pack stops evaluating. The entire
  configuration compliance system is
  non-functional because the single role it
  depends on was deleted.
failure: >
  Complete configuration blindness. Config can't
  read any resource configuration because the
  recorder role was deleted; all compliance
  evaluation stops.
tests:
  - name: recorder with deleted role fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:config:us-east-1:111122223333:config-recorder/default"
      asset_type: aws_config_recorder
      vendor: aws
      properties:
        compliance:
          kind: config_recorder
          config:
            recorder_name: "default"
            recorder_role_arn: "arn:aws:iam::111122223333:role/deleted-config-role"
            recorder_role_exists: false
            has_ghost_recorder_role: true
  - name: recorder with valid role passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:config:us-east-1:111122223333:config-recorder/default"
      asset_type: aws_config_recorder
      vendor: aws
      properties:
        compliance:
          kind: config_recorder
          config:
            recorder_name: "default"
            recorder_role_arn: "arn:aws:iam::111122223333:role/AWSServiceRoleForConfig"
            recorder_role_exists: true
            has_ghost_recorder_role: false
