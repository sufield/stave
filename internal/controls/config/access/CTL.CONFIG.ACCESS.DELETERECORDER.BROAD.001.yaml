dsl_version: ctrl.v1
id: CTL.CONFIG.ACCESS.DELETERECORDER.BROAD.001
name: config:DeleteConfigurationRecorder Granted to Broad Principals
description: >
  IAM policies grant
  config:DeleteConfigurationRecorder to non-
  administrative principals.
  DeleteConfigurationRecorder is the
  permanent counterpart to
  StopConfigurationRecorder — instead of
  stopping the recorder (recoverable), it
  deletes the recorder configuration entirely
  (recoverable only by recreation). Once
  deleted, no resource configurations are
  recorded; the configuration audit trail
  has no future entries until a new recorder
  is created. The permission should be tightly
  restricted to security administrators and
  protected by SCP at the org level.
domain: exposure
severity: critical
compliance:
  cis_aws_v3.0: "1.16, 3.5"
  soc2: "CC6.1, CC6.3, CC7.1"
  nist_800_53_r5: "AC-3, AC-6, CM-5, SI-4"
  pci_dss_v4.0: "7.1, 7.2, 10.5"
  fedramp_moderate: "AC-3, AC-6, CM-5"
  hipaa: "164.312(a)(1), 164.312(b)"
  iso_27001_2022: "A.5.15, A.5.18"
  ccm_v4: ["IAM-09", "LOG-08"]
scope_tags:
  - aws
  - config
taxonomy:
  - compliance-mapping
  - least-privilege
subtractive_category:
  - S09
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_config_recorder]
params:
  attack_stage: privilege_escalation
  blast_radius:
    type: detection
    scope: account
    multiplier: 5.0
remediation:
  description: >
    Too many principals can delete the Config
    recorder.
  action: >
    Audit IAM policies for config:Delete*,
    config:DeleteConfigurationRecorder, and
    config:* on Resource: *. Restrict the
    permission to a dedicated security-admin
    role. Pair with an SCP at the org level
    that denies DeleteConfigurationRecorder
    for all member accounts (the existing
    CTL.CONFIG.ACCESS.NOSCP.001 covers that).
  example: |
    {
      "compliance": {
        "kind": "config_account",
        "config": {
          "delete_recorder_principals": ["arn:aws:iam::111122223333:role/security-admin"],
          "delete_recorder_principal_count": 1,
          "delete_recorder_broadly_granted": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compliance.kind
      op: eq
      value: config_account
    - field: properties.compliance.config.delete_recorder_broadly_granted
      op: eq
      value: true
defect: >
  config:DeleteConfigurationRecorder is granted
  to non-administrative principals.
infection: >
  DeleteConfigurationRecorder permanently
  removes the recorder configuration. Unlike
  StopConfigurationRecorder, which is a
  reversible state change, deletion drops the
  recorder definition entirely — no scope
  configuration, no role association, no
  delivery channel binding survives. An
  attacker with this permission deletes the
  recorder, makes configuration changes (IAM
  backdoor, public bucket, open SG, snapshot
  share to attacker account), and either
  leaves the recorder deleted or recreates a
  new one with narrower scope to avoid
  capturing the same change set. The
  configuration audit trail has a
  larger-than-stop-recorder gap and the
  recorder's prior configuration is lost.
  This permission should be one of the most
  tightly restricted in the account.
failure: >
  Excessive Config delete access. Too many
  principals can permanently remove
  configuration recording — the configuration
  audit trail can be terminated.
tests:
  - name: broad DeleteRecorder access fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:config:us-east-1:111122223333:account"
      asset_type: aws_config_account
      vendor: aws
      properties:
        compliance:
          kind: config_account
          config:
            delete_recorder_principals:
              - "arn:aws:iam::111122223333:role/dev-team"
              - "arn:aws:iam::111122223333:role/ops"
              - "arn:aws:iam::111122223333:role/sre"
              - "arn:aws:iam::111122223333:role/security-admin"
            delete_recorder_principal_count: 4
            delete_recorder_broadly_granted: true
  - name: scoped DeleteRecorder access passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:config:us-east-1:111122223333:account"
      asset_type: aws_config_account
      vendor: aws
      properties:
        compliance:
          kind: config_account
          config:
            delete_recorder_principals: ["arn:aws:iam::111122223333:role/security-admin"]
            delete_recorder_principal_count: 1
            delete_recorder_broadly_granted: false
