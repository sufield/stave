dsl_version: ctrl.v1
id: CTL.CONFIG.INCOMPLETE.001
name: Complete Data Required for AWS Config Assessment
description: >
  The observation snapshot is missing required AWS Config properties.
domain: exposure
severity: info
compliance:
  ccm_v4: ["CCC-04", "CCC-07", "DCS-06", "LOG-03"]
scope_tags:
  - aws
  - config
taxonomy:
  - compliance-mapping
applicable_asset_types:
  - aws_config_recorder
type: unsafe_state
classification: state_assertion
params: {}
remediation:
  description: >
    Observation is missing AWS Config recorder properties.
  action: >
    Ensure the extractor calls aws configservice describe-configuration-recorders
    and aws configservice describe-config-rules.
  example: |
    {
      "compliance": {
        "kind": "recorder",
        "recording_enabled": true,
        "all_resource_types": true,
        "has_active_rules": true
      }
    }
unsafe_predicate:
  all:
    - field: properties.compliance.kind
      op: eq
      value: recorder
    - field: properties.compliance.recording_enabled
      op: missing
      value: true
