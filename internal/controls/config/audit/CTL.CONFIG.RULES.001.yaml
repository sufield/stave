dsl_version: ctrl.v1
id: CTL.CONFIG.RULES.001
name: AWS Config Must Have Active Rules
description: >
  AWS Config must have active Config Rules to evaluate resource
  compliance. Recording without rules provides change history but
  no automated drift detection.
domain: exposure
severity: medium
compliance:
  hipaa: "164.312(c)(1)"
  soc2: "CC6.3"
  pci_dss_v4.0: "6.3.2"
  nist_800_53_r5: "CM-3"
  fedramp_moderate: "CM-3"
  ccm_v4: ["CCC-04", "CCC-07", "LOG-03"]
scope_tags:
  - aws
  - config
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_config_recorder]
params:
  attack_stage: detection_evasion
remediation:
  description: >
    AWS Config has no active rules. Configuration drift will not be
    detected automatically.
  action: >
    Deploy Config Rules for your compliance requirements. Start with
    AWS managed rules for common checks (encrypted-volumes,
    restricted-common-ports, etc).
  example: |
    {
      "compliance": {
        "kind": "recorder",
        "has_active_rules": true
      }
    }
unsafe_predicate:
  all:
    - field: properties.compliance.kind
      op: eq
      value: recorder
    - field: properties.compliance.has_active_rules
      op: eq
      value: false
