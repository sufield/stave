dsl_version: ctrl.v1
id: CTL.CONFIG.DELIVERY.ENCRYPT.CMK.001
name: Config Delivery Channel Not Encrypted with Customer-Managed KMS Key
description: >
  AWS Config delivery channel delivers configuration snapshots to S3
  without a customer-managed KMS key. The delivery channel's
  s3KmsKeyArn is unset or uses the AWS-managed key. Without CMK
  encryption, configuration snapshots containing IAM policies,
  security group rules, and encryption keys are encrypted with a key
  the customer cannot audit, rotate, or revoke. If the
  delivery_s3_kms_cmk field is absent the control is not-evaluable
  and does not fire.
domain: exposure
severity: medium
compliance:
  soc2: "CC6.1, CC6.7"
  nist_800_53_r5: "SC-12, SC-13, SC-28"
  pci_dss_v4.0: "3.5"
  ccm_v4: ["CEK-03"]
scope_tags:
  - aws
  - config
taxonomy:
  - encryption-at-rest
  - key-management
subtractive_category:
  - S10
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_config_recorder
params:
  attack_stage: exfiltration
observation_fields:
  - compliance.kind
  - compliance.config.delivery_s3_kms_cmk
remediation:
  description: >
    Config delivery channel is not encrypting snapshots with a
    customer-managed KMS key.
  action: >
    Update the delivery channel to specify a customer-managed KMS
    key (aws configservice put-delivery-channel --delivery-channel
    s3KmsKeyArn=arn:aws:kms:...:key/...).
  example: |
    {
      "compliance": {
        "kind": "config_recorder",
        "config": {
          "delivery_s3_kms_cmk": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compliance.kind
      op: eq
      value: config_recorder
    - field: properties.compliance.config.delivery_s3_kms_cmk
      op: eq
      value: false
tests:
  - name: delivery channel with AWS-managed key fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:config:us-east-1:111122223333:recorder/default"
      asset_type: aws_config_recorder
      vendor: aws
      properties:
        compliance:
          kind: config_recorder
          config:
            delivery_s3_kms_cmk: false
  - name: delivery channel with CMK passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:config:us-east-1:111122223333:recorder/default"
      asset_type: aws_config_recorder
      vendor: aws
      properties:
        compliance:
          kind: config_recorder
          config:
            delivery_s3_kms_cmk: true
  - name: delivery channel with absent delivery_s3_kms_cmk passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:config:us-east-1:111122223333:recorder/default"
      asset_type: aws_config_recorder
      vendor: aws
      properties:
        compliance:
          kind: config_recorder
