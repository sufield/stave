    // Throttle behaviors (from FM-046)
    {"subject":"...payment-processor","predicate":"throttle_behavior","field_1":"push_apigw","field_2":"fail_fast"}
    {"subject":"...order-notifier","predicate":"throttle_behavior","field_1":"esm_sqs","field_2":"backlog"}
    {"subject":"...log-shipper","predicate":"throttle_behavior","field_1":"push_eventbridge","field_2":"retry"}
    {"subject":"...thumbnail-generator","predicate":"throttle_behavior","field_1":"push_s3","field_2":"retry"}
    {"subject":"...report-builder","predicate":"throttle_behavior","field_1":"push_eventbridge","field_2":"retry"}

  souffle_trace:
    rule_1_pool_topology:
      - "total_reserved(us-east-1, 900)"
      - "unreserved_pool_size(us-east-1, 100)"
      - "unreserved_member_count(us-east-1, 20)"
      - "per_function_fair_share(us-east-1, 5)"
      - "  (100 / 20 = 5 — at starvation threshold)"

    rule_2_critical_exposure:
      - "critical_function_exposed(payment-processor, critical, 100, 20, 5)"
      - "critical_function_exposed(order-notifier, high, 100, 20, 5)"

    rule_3_exhaustion_candidates:
      - "exhaustion_candidate(report-builder, long_timeout, timeout_exceeds_300s)"
      - "  (timeout 900s = 15 minutes, holds pool slots)"
      - "exhaustion_candidate(*, no_concurrency_cap, no_reserved_concurrency)"
      - "  (all 20 unreserved functions are candidates)"
      - "exhaustion_candidate(order-notifier, retry_amplification, backlog_event_source)"
      - "  (SQS ESM with backlog behavior)"
      - "exhaustion_candidate(log-shipper, retry_pressure, retry_event_source)"
      - "exhaustion_candidate(thumbnail-generator, retry_pressure, retry_event_source)"
      - "exhaustion_candidate(report-builder, retry_pressure, retry_event_source)"

    rule_4_cascade_paths:
      - "cascade_path(thumbnail-generator, payment-processor, critical, 100)"
      - "cascade_path(thumbnail-generator, order-notifier, high, 100)"
      - "cascade_path(thumbnail-generator, log-shipper, unknown, 100)"
      - "  ... (thumbnail-generator → 19 victims)"
      - "cascade_blast_radius(thumbnail-generator, 19, 2, 1)"
      - "  (19 victims, 2 critical+high, 1 backlog)"
      - "cascade_blast_radius(report-builder, 19, 2, 1)"
      - "  (same pool, same victims)"

    rule_5_feedback:
      - "feedback_loop(thumbnail-generator, order-notifier, esm_sqs, backlog)"
      - "  order-notifier's SQS messages pile up during throttle, burst on recovery"
      - "feedback_loop(thumbnail-generator, log-shipper, push_eventbridge, retry)"
      - "  log-shipper retries with backoff during throttle"
      - "circular_feedback: none"
      - "  (only order-notifier has backlog; thumbnail-generator has retry,"
      - "   but circular requires BOTH to have backlog)"

    rule_6_starvation:
      - "reservation_starvation(us-east-1, 1000, 900, 100, 20, 5)"
      - "  fair share = 5 (at threshold: < 5 would be strictly starved)"
      - "  NOTE: 5 is NOT < 5, so this rule does NOT fire with strict <"
      - "  The threshold is configurable; at exactly 5, this is borderline"

    rule_7_false_isolation:
      - "No provisioned-without-reserved in this example"

  compound_findings:
    category_a:
      trigger: "arn:aws:lambda:us-east-1:123456789012:function:thumbnail-generator"
      risk_factors:
        - {factor: "no_concurrency_cap", reason: "no_reserved_concurrency"}
        - {factor: "retry_pressure", reason: "retry_event_source"}
      pool_context:
        region: us-east-1
        account_limit: 1000
        total_reserved: 900
        unreserved_pool_size: 100
        unreserved_member_count: 20
        per_function_fair_share: 5
      blast_radius:
        total_victims: 19
        critical_victims: 1
        high_victims: 1
        backlog_victims: 1
      feedback_loops:
        - victim: "arn:aws:lambda:us-east-1:123456789012:function:order-notifier"
          mechanism: esm_sqs
          behavior: backlog
      severity: critical
      severity_reasons:
        - "Exhaustion candidate shares pool with critical function (payment-processor)"
        - "19 co-tenant functions throttled if pool exhausted"
        - "Feedback loop: order-notifier SQS backlog creates burst on recovery"

    category_b:
      region: us-east-1
      account_limit: 1000
      total_reserved: 900
      unreserved_pool_size: 100
      unreserved_member_count: 20
      per_function_fair_share: 5
      top_reservers:
        - {function: "ml-inference", reserved: 400}
        - {function: "video-transcoder", reserved: 300}
        - {function: "image-resizer", reserved: 200}
      severity: high
      severity_reason: "90% of concurrency reserved; 20 functions share 100 slots (5 per function)"

    remediation_hint: >
      1. Add reserved concurrency for payment-processor (50) and
         order-notifier (30) to isolate critical functions.
      2. Request account limit increase to 2,000 via service quota.
      3. Reduce report-builder timeout from 900s to 60s.
      4. Tag all Lambda functions with criticality levels.

  # --- Mitigated case ---
  mitigated_case:
    description: >
      payment-processor gets reserved 50, order-notifier gets reserved
      30, account limit increased to 2,000, report-builder timeout
      reduced to 60s.

    snapshot_diff: |
      account_concurrency_limit: 1000 → 2000
      payment-processor: reserved = 50 (now isolated)
      order-notifier: reserved = 30 (now isolated)
      report-builder: timeout 900 → 60
      Total reserved: 900 + 50 + 30 = 980
      Unreserved pool: 2000 - 980 = 1020
      Unreserved members: 18 (payment-processor and order-notifier
        moved to reserved_isolated)
      Fair share: 1020 / 18 = 56

    souffle_output:
      pool_topology:
        total_reserved: "(us-east-1, 980)"
        unreserved_pool_size: "(us-east-1, 1020)"
        unreserved_member_count: "(us-east-1, 18)"
        per_function_fair_share: "(us-east-1, 56)"
      critical_function_exposed: "(empty — both critical functions now reserved)"
      exhaustion_candidates: "only no_concurrency_cap for 18 functions (no long_timeout, no public_trigger)"
      cascade_paths: "18 functions × 17 victims = 306 paths, all unknown criticality"
      cascade_blast_radius: "each trigger: 17 victims, 0 critical, 0 backlog"
      feedback_loops: "(empty — order-notifier now reserved)"
      reservation_starvation: "(empty — fair share 56 >> 5)"
      false_isolation: "(empty)"

    finding: >
      No critical or high victims in unreserved pool. No feedback
      loops. Fair share 56 (well above threshold). Remaining:
      cascade_path findings for 18 unknown-criticality functions,
      severity = low. Remediation recommendation: tag remaining
      functions with criticality levels for better analysis.

# =========================================================================
# Fact projection gap analysis
# =========================================================================

fact_projection_gap: >
  New projector functions needed in sirfacts/facts.go:

  1. accountConcurrencyFacts(assets []sir.AssetFact) []Fact
     From the account settings asset, emit
     (region, "account_concurrency_limit", limit).

  2. functionConcurrencyFacts(assets []sir.AssetFact) []Fact
     For each Lambda function:
     - If ReservedConcurrentExecutions is set: emit function_reserved
     - If ProvisionedConcurrencyConfigs exists: emit function_provisioned
     - Always emit function_region (from ARN) and function_timeout

  3. functionCriticalityFacts(assets []sir.AssetFact) []Fact
     Scan function tags for criticality keys. Emit function_criticality
     with the highest-priority match, or "unknown"/"default" if no
     tag found. For inferred classification, check connected resource
     names and invocation sources.

  4. throttleBehaviorFacts(invocationPaths []Fact) []Fact
     Derive from FM-046's lambda_invocation_path facts using the
     mechanism → behavior mapping table. If FM-046 hasn't run,
     emit nothing (closed-world: no throttle_behavior = unknown).

validation:
  exact_match:
    - unreserved_pool_size
    - per_function_fair_share
    - critical_function_exposed count
    - cascade_blast_radius counts
  semantic_match:
    - exhaustion_candidate risk factors
    - feedback_loop detection
    - severity classification
  ignore:
    - ordering of cascade paths
    - Soufflé stderr warnings for empty optional relations
