      - {arn: "arn:aws:ec2:us-east-1:111122223333:instance/i-0a1b2c3d4e5f00004",
         type: "aws_ec2_instance", edge: "load_balance", az: "us-east-1a"}
    az_distribution:
      us-east-1a: 4
    remediation_hint: >
      Register targets in ≥1 additional AZ for target group
      arn:aws:elasticloadbalancing:us-east-1:111122223333:targetgroup/my-tg/73e2d6bc24d8a067.
      The ALB is configured for us-east-1a and us-east-1b, but all 4
      targets are in us-east-1a. Move ≥1 instance to us-east-1b.

  # --- Passing case ---
  passing_case:
    description: >
      Same topology, instances spread across two AZs. The rule does
      not fire.

    snapshot_diff: >
      instance i-0a1b2c3d4e5f00003: placement.availability_zone = "us-east-1b"
      instance i-0a1b2c3d4e5f00004: placement.availability_zone = "us-east-1b"

    derived_facts:
      lb_target_az:
        - [ALB, instance_1, "us-east-1a"]
        - [ALB, instance_2, "us-east-1a"]
        - [ALB, instance_3, "us-east-1b"]
        - [ALB, instance_4, "us-east-1b"]

      lb_az_count:
        - [ALB, 2]

    output: >
      single_az_behind_lb.csv: (empty — no output)

    explanation: >
      lb_az_count(ALB, 2) — the guard "lb_az_count(LB, 1)" is not
      satisfied, so single_az_behind_lb does not fire. The chain is
      silent when redundancy exists.

# =========================================================================
# Fact projection gap analysis
# =========================================================================

fact_projection_gap: >
  The current fact projector (sirfacts/facts.go) emits no AZ placement
  or dependency edge facts. Implementing this spec requires two new
  projector functions:

  1. azPlacementFacts(assets []sir.AssetFact) []Fact
     Walks each asset's Properties map, extracts AZ data based on
     asset type, emits (arn, "resource_az", az) and (arn, "az_scoped",
     "true") triples. Source paths:
       - properties.compute.placement.availability_zone (EC2)
       - properties.database.availability_zone + secondary_availability_zone (RDS)
       - properties.network.availability_zones[] (ELB)
       - properties.network.availability_zone (subnet, NAT GW)
       - properties.compute.vpc_config.subnet_ids → cross-ref subnet AZ (Lambda)
       - properties.storage.availability_zone (EBS)
       - properties.storage.mount_targets[].availability_zone_id (EFS)

  2. dependencyEdgeFacts(assets []sir.AssetFact) []Fact
     Walks each asset's Properties map, extracts relationship fields,
     emits (source, "depends_on", target) and (source+target,
     "dep_type", label) triples. This requires the SIR to carry
     cross-resource references (target group ARNs, subnet IDs, route
     table associations, etc.) in asset properties — most of these
     fields are already captured by existing collectors; the projector
     function is the new code.

  The transform.sh script needs updating to pre-create empty .facts
  files for the new predicates: resource_az, az_scoped, depends_on,
  dep_type.

validation:
  exact_match:
    - finding_type
    - severity
    - blast_radius
  semantic_match:
    - dependency_chain
    - remediation_hint
  ignore:
    - fact ordering in JSONL
    - Soufflé stderr warnings for empty optional relations
