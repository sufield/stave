name: stave inspect compliance
synopsis: Resolve compliance framework crosswalk
description: |-
    Compliance reads a crosswalk YAML mapping and resolves it against
    requested compliance frameworks, producing a filtered mapping from
    internal checks to external control references.

    Inputs:
      --file, -f    Path to crosswalk YAML file (default: stdin)
      --framework   Compliance frameworks to include (repeatable; default: all)
      --check-id    Check IDs to resolve (repeatable; default: all from file)

    Outputs:
      stdout        JSON crosswalk resolution

    Exit Codes:
      0   - Resolution completed successfully
      2   - Invalid input (malformed YAML, unknown framework)
      4   - Internal error
      130 - Interrupted (SIGINT)



    Offline-only: reads local files; makes zero network connections; no cloud credentials.
usage: stave inspect compliance [flags]
options:
    - name: check-id
      default_value: '[]'
      usage: 'Check IDs to resolve (default: all from file)'
    - name: file
      shorthand: f
      usage: 'Path to crosswalk YAML file (default: stdin)'
    - name: framework
      default_value: '[]'
      usage: 'Compliance frameworks to include (default: all)'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for compliance
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave inspect compliance --file crosswalk.yaml
      stave inspect compliance --file crosswalk.yaml --framework nist_800_53
      cat crosswalk.yaml | stave inspect compliance
      stave inspect compliance --file crosswalk.yaml --check-id CTL.S3.PUBLIC.001 | jq .
see_also:
    - stave inspect - Low-level security analysis primitives
