name: stave check
synopsis: Compare before/after evaluations to check remediation
description: |-
    Compare before/after evaluations to check whether remediation resolved findings.

    Verify runs the same controls against two sets of observations (before and after
    remediation) and reports which findings were resolved, which remain, and which
    are newly introduced. Use it after applying fixes to confirm that violations
    have been addressed without introducing regressions.

    Inputs:
      --before, -b             Path to before-remediation observations (required)
      --after, -a              Path to after-remediation observations (required)
      --controls, -i           Path to control definitions directory (default: controls)
      --max-unsafe             Maximum allowed unsafe duration
      --now                    Override current time (RFC3339) for deterministic output

    Outputs:
      stdout                   Verification report JSON showing resolved, remaining,
                               and introduced findings
      stderr                   Error messages (if any)

    Exit Codes:
      0   - All findings resolved; no remaining or introduced violations
      3   - Remaining or introduced violations exist
      130 - Interrupted (SIGINT)

    Offline-only: reads local files; makes zero network connections; no cloud credentials.
usage: stave check [flags]
options:
    - name: after
      shorthand: a
      usage: Path to after-remediation observations (required)
    - name: before
      shorthand: b
      usage: Path to before-remediation observations (required)
    - name: controls
      shorthand: i
      default_value: controls
      usage: Path to control definitions directory
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for check
    - name: max-unsafe
      usage: |
        Maximum allowed unsafe duration Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: now
      usage: Override current time (RFC3339) for deterministic output
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      # Compare before/after observations
      stave check --before ./obs-before --after ./obs-after --controls ./controls

      # Deterministic output for CI
      stave check --before ./obs-before --after ./obs-after --controls ./controls \
        --now 2026-01-15T00:00:00Z

      # With a custom unsafe duration threshold
      stave check --before ./obs-before --after ./obs-after --controls ./controls \
        --max-unsafe 72h
see_also:
    - stave - Configuration safety evaluator
