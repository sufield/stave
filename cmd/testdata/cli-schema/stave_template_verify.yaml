name: stave template verify
synopsis: Verify a template's fixture produces expected findings
description: |-
    Run the template's fixture snapshot through its control and chain
    selection. Compare actual findings against expected findings using
    semantic matching — not line-by-line diff.

    Two findings match when their match_keys fields are equal (default:
    control_id + resource_id). All execution metadata (timestamps, scan
    IDs, finding UUIDs) is ignored.

    Inputs:
      template-name       Name of the template to verify (positional)

    Outputs:
      stdout              Verification result (PASS/FAIL with details)

    Exit Codes:
      0   Verification passed
      3   Verification failed (missing or unexpected findings)
      2   Invalid input (template not found)
      4   Internal error
usage: stave template verify [template-name] [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for verify
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      # Verify a specific template
      stave template verify bucket-hijacking-assessment

      # Verify all templates
      stave template verify --all
see_also:
    - stave template - Manage assessment templates
