name: stave ci fix-loop
synopsis: Run apply-before/apply-after/verify in one command
description: |-
    Fix-loop executes the remediation verification lifecycle in one run:
    apply before state, apply after state, compare findings, and emit a
    remediation report suitable for CI/CD.

    Input:
      --before      Directory containing before-remediation observations
      --after       Directory containing after-remediation observations
      --controls  Directory containing control definitions

    Output:
      stdout  remediation report JSON
      --out   writes evaluation.before.json, evaluation.after.json,
              verification.json, remediation-report.json

    Exit Codes:
      0   - No remaining or introduced violations
      3   - Remaining or introduced violations exist

    Offline-only: reads local files; makes zero network connections; no cloud credentials.
usage: stave ci fix-loop [flags]
options:
    - name: after
      shorthand: a
      usage: Path to after-remediation observations (required)
    - name: before
      shorthand: b
      usage: Path to before-remediation observations (required)
    - name: controls
      shorthand: i
      default_value: controls
      usage: Path to control definitions directory
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for fix-loop
    - name: max-unsafe
      usage: |
        Maximum allowed unsafe duration Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: now
      usage: |
        Override current time (RFC3339). Required for deterministic output
    - name: out
      usage: Write remediation artifacts to this directory
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      # Run a full fix-loop comparing before and after observations
      stave ci fix-loop --before ./obs-before --after ./obs-after --controls ./controls --out ./output --now 2026-01-11T00:00:00Z

      # Run in CI with a strict 72-hour threshold
      stave ci fix-loop --before ./obs-before --after ./obs-after --controls ./controls --out ./output --max-unsafe 72h --now 2026-01-11T00:00:00Z

      # Inspect the remediation report
      cat ./output/remediation-report.json | jq '.summary'
see_also:
    - stave ci - CI/CD policy and baseline commands
