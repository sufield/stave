name: stave export-controls
synopsis: Export the control catalog for external solver consumption
description: |
    Export the control catalog as a JSON document — each entry carries the
    control's predicate tree, authored intent rationale, and the optional
    forbidden_state block (the high-level "this configuration must never
    exist" claim external SMT compilers consume to generate Z3
    satisfiability queries).

    The export is metadata-only: no observation reads, no findings, no
    clock. External solvers receive a pure description of "the controls
    Stave evaluates" without inheriting any of Stave's evaluation
    semantics. The JSON shape itself is the stable solver-import format,
    so the top-level array is keyed `invariants` — that name is the
    solver-side data contract, not Stave's user-facing vocabulary.

    Inputs:
      --controls, -i      Control definitions directory (default: built-in catalog)
      --format, -f        Output format: json (default: json)

    Outputs:
      stdout: control export as a JSON document (sorted by control ID).
      stderr: errors.

    Exit codes:
      0   success
      2   input error (bad flag)
      4   internal error (load failure, projection error)
      130 SIGINT
usage: stave export-controls [flags]
options:
    - name: controls
      shorthand: i
      usage: control definitions directory (empty = built-in catalog)
    - name: format
      shorthand: f
      default_value: json
      usage: 'output format: json'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for export-controls
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      # Built-in catalog → JSON to stdout
      stave export-controls > controls.json

      # Filter to controls that author a forbidden_state block
      stave export-controls | jq '[.invariants[] | select(.forbidden_state.combine != "")]'

      # Custom controls directory
      stave export-controls --controls ./my-controls > controls.json
see_also:
    - stave - Configuration safety evaluator
