name: stave snapshot diff
synopsis: Compare the latest two observation snapshots
description: |-
    Diff compares the latest two snapshots in the observations directory and
    reports asset-level changes (added, removed, modified) including property-level
    differences for modified assets.

    Inputs:
      --observations, -o  Path to observation snapshots directory (default: observations)
      --format, -f        Output format: text or json (default: text)
      --change-type       Filter changes: added, removed, modified (repeatable)
      --asset-type        Filter by asset type (repeatable)
      --asset-id          Filter by asset ID substring

    Outputs:
      stdout              Diff report showing added, removed, and modified assets
      stderr              Error messages (if any)

    Exit Codes:
      0   - Diff completed successfully
      2   - Invalid input or configuration error
      4   - Internal error
      130 - Interrupted (SIGINT)

    Offline-only: reads local files; makes zero network connections; no cloud credentials.
usage: stave snapshot diff [flags]
options:
    - name: asset-id
      usage: Filter by asset ID substring
    - name: asset-type
      default_value: '[]'
      usage: Filter by asset type
    - name: change-type
      default_value: '[]'
      usage: 'Filter changes: PROVISIONED, DECOMMISSIONED, RECONFIGURED'
    - name: format
      shorthand: f
      default_value: text
      usage: Output format (text|json)
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for diff
    - name: observations
      shorthand: o
      default_value: observations
      usage: Path to observation snapshots directory
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      # Human-readable summary
      stave snapshot diff --observations ./observations

      # Machine-readable output
      stave snapshot diff --observations ./observations --format json

      # Write report to file
      stave snapshot diff --observations ./observations --format json > output/diff.json
see_also:
    - stave snapshot - Snapshot inspection commands
