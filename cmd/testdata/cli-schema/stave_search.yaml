name: stave search
synopsis: Find catalog entries matching a free-form intent
description: |
    Search the capability catalog by intent. Ranks every capability
    (control group, compound chain, operational feature) against the
    query tokens, expanding synonyms so the user does not need to know
    Stave's vocabulary first.

    Scoring (per matched token, summed):
      title:        3
      use_when:     2
      keyword:      1
      description:  0.5
    Phrase-verbatim hits add 5; threshold of 1.0 filters single-word
    matches against long descriptions.

    Use this when you know your problem but not the catalog vocabulary:
    "public S3 bucket", "expired access keys", "Cognito unauthenticated
    access", "CloudTrail logging disabled", "shadow admin", "orphaned
    policies".

    Inputs:
      <query>       Free-form intent string (required)
      --top N       Number of matches to surface (default 10)
      --format F    text (default) | json
      --controls    Control catalog directory (default: controls)
      --chains      Chain catalog directory (default: chains)

    Exit codes:
      0   Matches found (or zero matches but query was well-formed)
      2   Invalid input (missing query, bad --format)
      4   Internal error (catalog load failure)
usage: stave search <query> [flags]
options:
    - name: chains
      default_value: chains
      usage: chain catalog directory
    - name: controls
      shorthand: i
      default_value: controls
      usage: control catalog directory
    - name: format
      shorthand: f
      default_value: text
      usage: 'output format: text | json'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for search
    - name: top
      default_value: "10"
      usage: number of matches to surface
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave search "public S3 bucket"
      stave search "how long was this misconfigured"
      stave search "shadow admin"
      stave search "kms rotation" --format json
see_also:
    - stave - Configuration safety evaluator
