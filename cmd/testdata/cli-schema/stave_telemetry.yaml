name: stave telemetry
synopsis: Emit structured NDJSON telemetry from assessment output
description: |-
    Telemetry reads assessment JSON (from stave apply) and emits one NDJSON
    line per finding — consumable by Vector, Fluent Bit, Splunk, Logstash,
    Loki, or any log shipper.

    This is a format converter, not a re-evaluator. It transforms Stave's
    deterministic reasoning output into the structured telemetry stream that
    dashboards, SIEM pipelines, and compliance trending systems consume.

    Inputs:
      stdin or --in       Assessment JSON from stave apply --format json
      --severity          Comma-separated severity filter (default: all)
      --resource          Scope to a specific resource ARN (default: all)

    Output:
      NDJSON to stdout — one JSON object per line, newline terminated.
      Append-safe: results can be appended to a file without re-parsing.

    Exit Codes:
      0   Telemetry emitted
      2   Input error

    Offline-only: reads local files; makes zero network connections; no cloud credentials.
usage: stave telemetry [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for telemetry
    - name: in
      usage: 'Path to assessment JSON (default: stdin)'
    - name: resource
      usage: Scope to a specific resource ARN
    - name: severity
      usage: Comma-separated severity filter (e.g., critical,high)
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      # Pipe from apply
      stave apply --format json | stave telemetry

      # From file
      stave telemetry --in assessment.json

      # Filter by severity
      stave telemetry --in assessment.json --severity critical,high

      # Scope to one resource
      stave telemetry --in assessment.json --resource arn:aws:s3:::prod-bucket
see_also:
    - stave - Configuration safety evaluator
