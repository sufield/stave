name: stave diagnose report
synopsis: Generate a plain-text report from evaluation output
description: |-
    Report reads evaluation JSON and renders a formatted summary of findings,
    controls evaluated, and asset coverage.

    Inputs:
      --in, -i            Path to evaluation JSON file (required)
      --format, -f        Output format: text or json (default: text)
      --template-file     Path to custom Go template for text output

    Outputs:
      stdout              Rendered report (text or JSON)
      stderr              Error messages and git-dirty warnings (if any)

    Exit Codes:
      0   - Report generated successfully
      2   - Invalid input (missing file, bad format)
      4   - Internal error
      130 - Interrupted (SIGINT)

    Examples:
      # Render text report from evaluation output
      stave report --in output/evaluation.json

      # JSON report for scripting
      stave report --in output/evaluation.json --format json | jq .summary

      # Use a custom template
      stave report --in output/evaluation.json --template-file ./my-template.tmpl

    Offline-only: reads local files; makes zero network connections; no cloud credentials.
usage: stave diagnose report [flags]
options:
    - name: format
      shorthand: f
      default_value: text
      usage: Output format (text|json)
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for report
    - name: in
      shorthand: i
      usage: Path to evaluation JSON file (required)
    - name: template-file
      usage: Path to custom Go template
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: '  stave report --in evaluation.json --format text'
see_also:
    - stave diagnose - Diagnose evaluation inputs and results
