name: stave forge preview
synopsis: |
    Evaluate a predicate against a snapshot without writing files
description: |-
    Evaluates a control predicate against all matching assets in a snapshot
    and shows per-resource FAIL/PASS results. Uses the identical CEL
    evaluation path as stave apply.

    Predicate can be specified as field/op/value or as a raw expression.

    Exit Codes:
      0   Preview completed successfully
      2   Invalid input or missing flags
      4   Internal error

    Examples:
      stave forge preview --snapshot obs.json \
        --field properties.storage.access.public_read --op eq --value true

      stave forge preview --snapshot obs.json --asset-type aws_s3_bucket \
        --field properties.storage.encryption.at_rest_enabled --op eq --value false
usage: stave forge preview [flags]
options:
    - name: asset-type
      usage: filter to a specific asset type
    - name: field
      usage: predicate field path
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for preview
    - name: op
      default_value: eq
      usage: predicate operator
    - name: predicate
      usage: raw CEL predicate expression (alternative to field/op/value)
    - name: snapshot
      usage: path to snapshot file (required)
    - name: value
      default_value: "true"
      usage: predicate value
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: '  stave forge preview --snapshot obs.json --field properties.storage.access.public_read --op eq --value true'
see_also:
    - stave forge - Author and test custom controls
