name: stave bisect
synopsis: Find when a control was first violated
description: |-
    Bisect searches through timestamped snapshot history to find the exact
    point in time when a control was first violated. Like git bisect for commits,
    it binary-searches through a snapshot archive.

    Modes:
      bisect (default)    Binary search — O(log N), finds the transition into the
                          current violation window. Fast for large archives.
      scan                Linear scan — O(N), finds ALL violation windows including
                          the earliest. Correct for non-monotonic histories.

    Inputs:
      --controls, -i      Path to control definitions directory
      --observations, -o  Path to snapshot archive directory
      --control-id        ID of the single control to bisect (required)
      --mode              Search strategy: bisect or scan (default: bisect)
      --format, -f        Output format: text or json (default: text)
      --eval-time               Evaluation reference timestamp (RFC3339) for deterministic evaluation
      --resource          Scope to a specific resource ARN (optional)

    Output:
      Text mode shows the transition point with a property delta between
      the last PASS and first VIOLATION snapshots. Timestamps use "between
      A and B" language — Stave operates on snapshots and cannot attribute
      changes to specific events within a window.

    Exit Codes:
      0   No violation found in the archive
      2   Input error (missing flags, no snapshots)
      3   Violation window(s) found
      4   Internal error

    Offline-only: reads local files; makes zero network connections; no cloud credentials.
usage: stave bisect [flags]
options:
    - name: control-id
      usage: Control ID to bisect (required)
    - name: controls
      shorthand: i
      usage: |
        Path to control definitions directory (default: embedded catalog)
    - name: eval-time
      usage: |
        Evaluation reference timestamp (RFC3339). Durations and temporal risk are measured against this time. Defaults to wall clock.
    - name: format
      shorthand: f
      default_value: text
      usage: 'Output format: text or json'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for bisect
    - name: mode
      default_value: bisect
      usage: 'Search strategy: bisect or scan'
    - name: observations
      shorthand: o
      default_value: observations
      usage: Path to snapshot archive directory
    - name: resource
      usage: Scope to a specific resource ARN
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      # Find when a bucket became public
      stave bisect -i controls/s3 -o snapshots/ --control-id CTL.S3.PUBLIC.001

      # Scan for all violation windows over 12 months
      stave bisect -i controls/s3 -o snapshots/ --control-id CTL.S3.PUBLIC.001 --mode scan

      # Scope to a specific resource
      stave bisect -i controls/ -o snapshots/ --control-id CTL.S3.ENCRYPT.001 --resource arn:aws:s3:::prod-bucket
see_also:
    - stave - Configuration safety evaluator
