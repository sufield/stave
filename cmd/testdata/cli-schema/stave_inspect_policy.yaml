name: stave inspect policy
synopsis: Analyze an S3 bucket policy document
description: |-
    Policy reads a raw S3 bucket policy JSON document and performs a
    comprehensive security analysis including access assessment, prefix scope
    analysis, risk scoring, and IAM action requirements.

    Inputs:
      --file, -f  Path to policy JSON file (default: stdin)

    Outputs:
      stdout      JSON report with assessment, prefix_scope, risk, and required_iam_actions

    Exit Codes:
      0   - Analysis completed successfully
      2   - Invalid input (malformed JSON, missing required fields)
      4   - Internal error
      130 - Interrupted (SIGINT)



    Offline-only: reads local files; makes zero network connections; no cloud credentials.
usage: stave inspect policy [flags]
options:
    - name: file
      shorthand: f
      usage: 'Path to policy JSON file (default: stdin)'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for policy
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave inspect policy --file policy.json
      cat policy.json | stave inspect policy
      stave inspect policy --file policy.json | jq .risk
see_also:
    - stave inspect - Low-level security analysis primitives
