name: stave export compliance
synopsis: Export compliance evidence package
description: |-
    Evaluate a snapshot against a compliance framework profile and
    export a structured evidence package as JSON.

    Runs the full assessment pipeline with evidence generation, evaluates
    the requested compliance profile, and produces a requirement-centric
    evidence package with per-requirement scores, gaps, and reasoning traces.

    Supported profiles:
      hipaa              HIPAA Security Rule
      soc2               SOC 2 Trust Service Criteria
      pci_dss_v4.0       PCI-DSS v4.0
      fedramp_moderate   FedRAMP Moderate (NIST 800-53 Rev 5)
      cis_aws_v3.0       CIS AWS Foundations Benchmark v3.0

    Exit Codes:
      0   All required requirements satisfied
      1   One or more required requirements failed
      2   Invalid input (bad profile ID, missing snapshot)
      4   Internal error

    Examples:
      stave export compliance --snapshot obs.json --profile hipaa

      stave export compliance --snapshot obs.json --profile soc2 \
        --include-pass --out evidence.json

      stave export compliance --snapshot obs.json --profile pci_dss_v4.0 \
        --min-severity high
usage: stave export compliance [flags]
options:
    - name: assessment-uuid
      usage: UUID for this assessment result (for OSCAL)
    - name: assessor
      default_value: Stave automated assessment
      usage: assessor name (for OSCAL)
    - name: composite
      default_value: "false"
      usage: force composite report even for single framework
    - name: format
      shorthand: f
      default_value: json
      usage: 'output format: json | table | markdown'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for compliance
    - name: include-pass
      default_value: "false"
      usage: include passing evidence records
    - name: min-severity
      default_value: all
      usage: 'minimum severity filter: critical|high|medium|low|all'
    - name: out
      usage: write output to file instead of stdout
    - name: profile
      usage: compliance profile ID (required)
    - name: profile-file
      default_value: '[]'
      usage: path to custom profile YAML (can be repeated)
    - name: snapshot
      usage: path to snapshot file (required)
    - name: system-uuid
      usage: UUID of the System Security Plan (for eMASS/OSCAL)
    - name: verbose
      default_value: "false"
      usage: include reasoning traces in table output
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave export compliance --snapshot obs.json --profile hipaa
      stave export compliance --snapshot obs.json --profile soc2 --out evidence.json
see_also:
    - stave export - Export controls and compliance evidence
