name: stave config context create
synopsis: Create or update a named context
description: |-
    Create a named context that stores default paths for a project.
    Contexts are saved in the user configuration and selected with
    'config context use'. They affect default path resolution only —
    evaluation semantics are never changed.

    Exit Codes:
      0    Context created or updated
      2    Input error (invalid directory or name)
      4    Internal error
usage: stave config context create <name> [flags]
options:
    - name: config
      default_value: stave.yaml
      usage: Project config path (absolute or relative to --dir)
    - name: controls
      usage: Default controls directory for this context
    - name: dir
      shorthand: d
      default_value: .
      usage: Project root directory for this context
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for create
    - name: observations
      usage: Default observations directory for this context
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: format
      shorthand: f
      default_value: text
      usage: 'Output format: text or json'
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave config context create myproject --dir /path/to/project
      stave config context create myproject --dir . --controls controls/s3
see_also:
    - stave config context - Named project context commands
