name: stave permissions resource
synopsis: Show who has effective access to a resource
description: |-
    Show all principals with resolved effective access to a specific
    resource ARN, with access path attribution (identity-based, resource
    policy, or both).

    By default shows only non-designated principals. Use --all to include
    designated principals.

    Exit Codes:
      0   No non-designated access to the resource
      1   Non-designated principals have access (PHI violation)
      3   Incomplete resolution
      4   Internal error

    Examples:
      stave nep resource --snapshot obs.json \
        --resource arn:aws:s3:::phi-patient-records

      stave nep resource --snapshot obs.json \
        --resource arn:aws:s3:::phi-records --all

      stave nep resource --snapshot obs.json \
        --resource arn:aws:s3:::phi-records --format dot | dot -Tpng > access.png
usage: stave permissions resource [flags]
options:
    - name: actions
      usage: comma-separated action filter
    - name: all
      default_value: "false"
      usage: show all principals including designated
    - name: classification
      default_value: phi
      usage: data classification tag value to filter resources
    - name: format
      shorthand: f
      default_value: table
      usage: 'output format: table | json | dot'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for resource
    - name: resource
      usage: resource ARN to query (required)
    - name: show-designated
      default_value: "false"
      usage: show designated principals (alias for --all)
    - name: snapshot
      usage: path to snapshot file (required)
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave nep resource --snapshot obs.json --resource arn:aws:s3:::phi-records
      stave nep resource --snapshot obs.json --resource arn:aws:s3:::phi-records --all --format dot
see_also:
    - stave permissions - Query net effective permissions from a snapshot
