name: stave diagnose
synopsis: Diagnose evaluation inputs and results
description: |-
    Diagnose evaluation inputs and results to identify likely causes of unexpected findings.

    Diagnose analyzes controls, observations, and optional prior output to explain
    why an evaluation produced (or did not produce) certain findings. It is useful
    for troubleshooting threshold mismatches, clock skew, and predicate logic.

    Inputs:
      --controls      Directory containing YAML control definitions
      --observations    Directory containing JSON observation snapshots
      --previous-output Optional path to existing apply output JSON

    Outputs:
      stdout            Diagnostic report (text or JSON with --format json)
      stderr            Error messages (if any)

    What it explains:
      - Expected violations but got none (threshold too high, time span too short)
      - Unexpected violations (clock skew, streak reset)
      - Empty findings (no predicate matches, under threshold)
      - Configuration mismatches

    Subcommands:
      finding    Deep-dive analysis of a single control/asset violation

    Exit Codes:
      0   - No diagnostic issues found
      2   - Invalid input or error
      3   - Diagnostic issues detected
      130 - Interrupted (SIGINT)

    Offline-only: reads local files; makes zero network connections; no cloud credentials.
usage: stave diagnose [flags]
options:
    - name: case
      default_value: '[]'
      usage: Filter to one or more diagnostic case values
    - name: controls
      shorthand: i
      default_value: controls
      usage: |
        Path to control definitions directory (inferred from project root if omitted)
    - name: eval-time
      usage: |
        Evaluation reference timestamp (RFC3339). Durations and temporal risk are measured against this time. Defaults to wall clock.
    - name: format
      shorthand: f
      default_value: text
      usage: 'Output format: text or json'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for diagnose
    - name: max-unsafe
      usage: |
        Maximum allowed unsafe duration (e.g., 24h, 7d) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: no-pager
      default_value: "false"
      usage: never page output, even on a terminal
    - name: now
      usage: Alias for --eval-time
    - name: observations
      shorthand: o
      default_value: observations
      usage: |
        Path to observation snapshots directory (inferred from project root if omitted)
    - name: previous-output
      shorthand: p
      usage: |
        Path to existing apply output JSON (optional; if omitted, runs apply internally)
    - name: signal-contains
      usage: Filter diagnostics by signal substring (case-insensitive)
    - name: template
      usage: |
        Template string for custom output formatting (supports {{.Field}}, {{range}}, {{json}})
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      # Basic diagnosis
      stave diagnose --controls ./controls --observations ./obs

      # Automation/CI mode (exit code only)
      stave diagnose --controls ./controls --observations ./obs --quiet

      # Troubleshooting an existing apply output
      stave diagnose --previous-output previous-run.json --controls ./controls --observations ./obs

      # JSON output for scripting
      stave diagnose --controls ./controls --observations ./obs --format json

      # Show only threshold/span diagnostics
      stave diagnose --controls ./controls --observations ./obs --case expected_violations_none

      # Diagnose from stdin (pipe evaluation output)
      stave apply --controls ./controls --observations ./obs | stave diagnose --previous-output - --controls ./controls --observations ./obs

      # Deep dive into a single finding (subcommand)
      stave diagnose finding --control-id CTL.S3.PUBLIC.001 --asset-id my-bucket \
        --controls ./controls --observations ./obs
see_also:
    - stave - Configuration safety evaluator
    - stave diagnose explain - Generate guided remediation playbook for a finding
    - stave diagnose finding - Deep-dive analysis of a single finding
    - stave diagnose report - Generate a plain-text report from evaluation output
    - stave diagnose trace - Trace predicate evaluation for a single control against a single asset
