name: stave attest sign
synopsis: Sign a snapshot's assets with an Ed25519 private key
description: |-
    Sign a snapshot's assets array with an Ed25519 private key and
    produce an attested snapshot with an inline attestation field.

    Inputs:
      --snapshot PATH   Path to observation snapshot JSON (required)
      --key PATH        Path to Ed25519 private key PEM (required)
      --key-id STRING   Key identifier embedded in signature
      --out PATH        Write attested snapshot to file (default: stdout)

    Outputs:
      stdout            Attested snapshot JSON (unless --out is set)

    Exit Codes:
      0   Signing succeeded
      2   Invalid input
usage: stave attest sign [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for sign
    - name: key
      usage: Path to Ed25519 private key PEM (required)
    - name: key-id
      usage: Key identifier for the signature
    - name: out
      usage: Write attested snapshot to file
    - name: snapshot
      usage: Path to snapshot JSON (required)
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave attest sign --snapshot obs.json --key private.pem
      stave attest sign --snapshot obs.json --key private.pem --out attested.json
see_also:
    - stave attest - Snapshot tamper detection via Ed25519 signatures
