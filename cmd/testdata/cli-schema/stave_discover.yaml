name: stave discover
synopsis: |
    Resolve AWS services to the data Stave needs (the collection manifest)
description: |-
    Discover what Stave needs from you. Tell it which AWS services you use; it
    resolves the packs covering those services and merges their requirements into a
    single collection manifest — the exact read-only API calls, observation signals,
    and minimum collector IAM permissions to gather.

    "Service groups" are not a new concept: a pack is a named group of controls with
    a requirements manifest, and a service is just a different lookup key into the
    same packs. discover is the by-service axis; "stave pack show <name>" is the
    by-name axis. Both produce the same manifest model.

    Stave never collects data or calls AWS. discover tells you WHAT to collect; you
    collect it with your own tools (AWS CLI, Steampipe, …) and run "stave apply".

    Inputs:  --services (required, comma-separated); --format, -f (text|json);
             --controls, -i (catalog to resolve against).
    Outputs: the merged collection manifest on stdout.

    Exit codes: 0 = success, 2 = input error (no services/bad format), 4 = internal.
usage: stave discover [flags]
options:
    - name: controls
      shorthand: i
      default_value: controls
      usage: 'control definitions directory (default: built-in catalog)'
    - name: format
      shorthand: f
      default_value: text
      usage: 'output format: text, json'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for discover
    - name: services
      default_value: '[]'
      usage: |
        AWS services in use (comma-separated), e.g. iam,s3,ec2,lambda,cloudtrail
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      # I use IAM, S3, EC2, Lambda and CloudTrail — what does Stave need?
      stave discover --services iam,s3,ec2,lambda,cloudtrail

      # Machine-readable manifest for CI
      stave discover --services iam,s3 --format json
see_also:
    - stave - Configuration safety evaluator
