name: stave graph silos
synopsis: Find services with controls but zero compound chains
description: |-
    Silos analyzes the control/chain graph topology to find services with
    controls but zero compound chains connecting them to other services.

    These "silent" services have atomic detection but no cross-service risk
    composition — the gap where compound chains add value over single-resource
    scanners.

    Output includes a ranked silo list, the most-connected services, and a
    connectivity distribution histogram.

    Inputs:
      --chains          Chains directory (default: chains)
      --format, -f      Output format: text (default) or json
      --min-controls    Only show silos with >= N controls (default: 1)

    Exit Codes:
      0   Analysis completed
      2   Input error
      4   Internal error
      130 Interrupted (SIGINT)

    Examples:
      stave graph silos
      stave graph silos --format json
      stave graph silos --min-controls 5

    Offline-only: reads local files; makes zero network connections; no cloud credentials.
usage: stave graph silos [flags]
options:
    - name: chains
      default_value: chains
      usage: Path to chain definitions directory
    - name: format
      shorthand: f
      default_value: text
      usage: 'Output format: text or json'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for silos
    - name: min-controls
      default_value: "1"
      usage: Only show silos with at least N controls
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: '  stave graph silos --format json | jq ''.silos[:5]'''
see_also:
    - stave graph - Visualize control and asset relationships
