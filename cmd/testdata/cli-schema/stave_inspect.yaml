name: stave inspect
synopsis: Low-level security analysis primitives
description: |-
    Inspect provides direct access to Stave's domain analysis engines.

    Each subcommand reads JSON from --file or stdin and outputs analysis results
    as JSON. These are building blocks for custom tooling and debugging.

    Subcommands:
      policy      S3 bucket policy analysis
      acl         S3 ACL grant analysis
      exposure    Exposure classification
      risk        Risk scoring
      compliance  Framework crosswalk
      aliases     Predicate alias listing

    Offline-only: reads local files; makes zero network connections; no cloud credentials.
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for inspect
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
see_also:
    - stave - Configuration safety evaluator
    - stave inspect acl - Analyze S3 ACL grants
    - stave inspect aliases - List predicate aliases with metadata
    - stave inspect compliance - Resolve compliance framework crosswalk
    - stave inspect exposure - Classify resource exposure vectors
    - stave inspect policy - Analyze an S3 bucket policy document
    - stave inspect risk - Score risk from policy statement context
