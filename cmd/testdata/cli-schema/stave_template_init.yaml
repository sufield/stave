name: stave template init
synopsis: Instantiate a template with parameters
description: |-
    Instantiate a template by resolving parameters. In non-interactive
    mode (when --param flags are provided), all required parameters must
    be supplied via flags.

    Inputs:
      template-name       Name of the template to instantiate (positional)
      --param KEY=VALUE   Parameter value (repeatable)
      --output PATH       Output path for values file (default: ./stave-values.yaml)

    Outputs:
      stave-values.yaml   Instantiated values file

    Exit Codes:
      0   Values file written
      2   Invalid input or missing required parameter
      4   Internal error
usage: stave template init [template-name] [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for init
    - name: output
      default_value: ./stave-values.yaml
      usage: output path for values file
    - name: param
      default_value: '[]'
      usage: parameter value as KEY=VALUE (repeatable)
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      # Non-interactive with explicit params
      stave template init bucket-hijacking-assessment \
        --param target_accounts=123456789012,987654321098 \
        --param regions=us-east-1 \
        --output ./stave-values.yaml
see_also:
    - stave template - Manage assessment templates
