name: stave render
synopsis: Render JSON data through a Go text/template
description: |-
    Render pipes JSON data through a Go text/template file and writes
    the result to stdout. The data comes from any stave command that
    produces --format json output; the template is a file on disk.

    This separates data (code owns) from presentation (content owns).
    Each changes independently — adding a control changes the JSON,
    editing the template changes the output format, neither touches
    the other.

    Inputs:
      --data FILE       JSON input file (or - for stdin)
      --template FILE   Go text/template file

    Exit codes:
      0   Success
      2   Invalid input (missing flags, bad JSON, bad template)
      4   Internal error

    Use --data - to read from stdin (pipe from any stave --format json command)
    or --data FILE for a saved JSON file.
usage: stave render [flags]
options:
    - name: data
      usage: JSON input file (- for stdin)
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for render
    - name: template
      usage: Go text/template file
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      # Pipe chain catalog through a markdown template
      stave catalog --kind chain --format json | stave render --data - --template templates/chain-catalog.md.tmpl

      # Render a saved JSON file
      stave render --data catalog.json --template templates/chain-catalog.md.tmpl > docs/chain-catalog.md
see_also:
    - stave - Configuration safety evaluator
