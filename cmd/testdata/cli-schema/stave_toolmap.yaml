name: stave toolmap
synopsis: |
    Map offensive tools to configuration prerequisites and find coverage gaps
description: |-
    Perform a three-way join of chains × controls × offensive tool prerequisites.

    For each registered tool, checks whether its configuration prerequisites are
    detected by an existing chain (capability match) and validated by an existing
    control (field path match). Prerequisites with both are "covered"; those
    missing either are "gaps".

    Inputs:
      --chains PATH       Path to chain definitions directory (default: chains)
      --controls PATH     Path to controls directory (default: controls)
      --format STRING     Output format: text (default) | json
      --generate PATH     Generate chain YAML skeletons for gaps into PATH
      --tool NAME         Show prerequisites for a specific tool
      --capability TOKEN  Show tools needing this capability

    Exit Codes:
      0   Success
      2   Invalid input
      3   Gaps found
      4   Internal error
usage: stave toolmap [flags]
options:
    - name: capability
      usage: show tools needing this capability
    - name: chains
      default_value: chains
      usage: path to chain definitions directory
    - name: controls
      shorthand: i
      default_value: controls
      usage: path to controls directory
    - name: format
      shorthand: f
      default_value: text
      usage: 'output format: text | json'
    - name: generate
      usage: generate chain skeletons for gaps into this directory
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for toolmap
    - name: tool
      usage: show prerequisites for a specific tool
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      # Run three-way join, print gap report
      stave toolmap

      # JSON output for automation
      stave toolmap --format json

      # Generate chain skeletons for gaps
      stave toolmap --generate ./generated-chains

      # Show prerequisites for a specific tool
      stave toolmap --tool pacu

      # Show tools needing a capability
      stave toolmap --capability iam_credential_theft
see_also:
    - stave - Configuration safety evaluator
