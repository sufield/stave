name: stave catalog lint
synopsis: Lint the entire control and chain catalog
description: |
    Lint runs combined structural checks across the control and
    chain catalog in a single pass:

      1. Control lint   — schema, CEL syntax, completeness (forge lint)
      2. Chain lint     — structure, member controls, capabilities
      3. Cross-reference — chain ControlIDs exist in the loaded catalog
      4. Duplicate detection — no two chains share the same ID

    With --semantic, control lint includes always-firing and impossible
    condition checks. With --strict, warnings are treated as errors.

    Inputs:
      --controls DIR   Control catalog directory (default: controls)
      --chains DIR     Chain catalog directory (default: chains)
      --format F       text (default) | json
      --semantic       Enable semantic analysis on controls
      --strict         Treat warnings as errors

    Exit codes:
      0   No errors
      2   Invalid input (bad flags)
      3   Lint errors found
      4   Internal error
usage: stave catalog lint [flags]
options:
    - name: chains
      usage: 'chain catalog directory (default: embedded chains)'
    - name: controls
      shorthand: i
      usage: 'control catalog directory (default: embedded catalog)'
    - name: format
      shorthand: f
      default_value: text
      usage: 'output format: text | json'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for lint
    - name: semantic
      default_value: "false"
      usage: enable semantic analysis on controls
    - name: strict
      default_value: "false"
      usage: treat warnings as errors
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave catalog lint
      stave catalog lint --semantic --strict
      stave catalog lint --format json | jq '.total_errors'
      stave catalog lint --controls controls/s3
see_also:
    - stave catalog - Print the user-facing capability catalog
