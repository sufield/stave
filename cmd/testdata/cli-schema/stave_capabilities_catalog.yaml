name: stave capabilities catalog
synopsis: Print the user-facing capability catalog
description: |
    Catalog emits the grouped view of what Stave can check: control
    groups by (service, category), compound chains, and operational
    features (readiness, gaps, drift, validate, export-sir). Pair with
    `stave search <query>` to look up by intent.

    Use --service to filter to one service (s3, iam, lambda, …) or
    --category to filter within a service. --kind narrows to one of
    control_group | chain | operational.

    Output is paged through $PAGER (then 'less -R', then 'more') when stdout is a
    terminal, and written plain and unpaged when stdout is a pipe, a redirect, or
    CI — so '... | grep' and '... > file' are unaffected. JSON is never paged.
    Use --no-pager to force plain output on a terminal.

    Drill-down mirrors 'man <topic>':
      catalog                 summary: one line per service
      catalog <SERVICE>       that service's capabilities, one line each
      catalog <SERVICE> --leaf  the leaf controls (individual control IDs)
      catalog --severity CRITICAL  only the matching leaf controls, any level

    --severity matches an EXACT level and lists control-group controls only;
    chains and operational features carry no severity and are excluded (stated in
    the output, not silently dropped). --leaf is the leaf drill-down: --controls/-i
    is already the catalog directory, so the leaf toggle is a distinct flag.

    Inputs:
      --service SVC    Filter to one service (e.g. s3); also accepted positionally
      --category CAT   Filter to one category within --service (e.g. public)
      --kind K         control_group | chain | operational
      --severity SEV   critical | high | medium | low | info (leaf controls)
      --leaf           Drill to individual leaf controls
      --family NAME    Filter chains to one family (e.g. iam, s3, apigw); implies --kind chain
      --verbose        Show full chain descriptions (default truncates to one phrase)
      --format F       auto (default; paged on a TTY) | text | wide | json
      --no-pager       Never page, even on a terminal
      --controls DIR   Control catalog directory (default: controls)
      --chains DIR     Chain catalog directory (default: chains)

    Exit codes:
      0   Success
      2   Invalid input
      4   Internal error
usage: stave capabilities catalog [flags]
options:
    - name: category
      usage: filter to one category (requires --service)
    - name: chains
      usage: 'chain catalog directory (default: embedded chains)'
    - name: controls
      shorthand: i
      usage: 'control catalog directory (default: embedded catalog)'
    - name: family
      usage: filter chains to one family (e.g. apigw, iam, s3)
    - name: format
      shorthand: f
      default_value: auto
      usage: 'output format: auto | text | wide | json'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for catalog
    - name: kind
      usage: 'filter to one kind: control_group | chain | operational'
    - name: leaf
      default_value: "false"
      usage: |
        drill to leaf controls (the individual control IDs); pairs with a service
    - name: no-pager
      default_value: "false"
      usage: never page output, even on a terminal
    - name: service
      usage: filter to one service
    - name: severity
      usage: |
        show only leaf controls of this severity: critical | high | medium | low | info
    - name: taxonomy
      usage: filter by taxonomy category (comma-separated, OR-joined)
    - name: verbose
      default_value: "false"
      usage: |
        show full chain descriptions (default truncates to one phrase)
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave catalog
      stave catalog s3
      stave catalog --service s3 --leaf
      stave catalog --kind chain
      stave catalog --format json | jq '.capabilities | length'
      stave catalog stats
      stave catalog inspect CTL.S3.PUBLIC.001
      stave catalog coverage
      stave catalog gaps checklist.yaml
see_also:
    - stave capabilities - Print supported input types and version constraints (default) or a user-facing catalog (subcommand)
    - stave capabilities catalog coverage - Show per-service control coverage
    - stave capabilities catalog gaps - Compare catalog against an external checklist
    - stave capabilities catalog inspect - Show full metadata for a single control
    - stave capabilities catalog matrix - Show taxonomy × service cross-product with gap cells
    - stave capabilities catalog stats - Print aggregate catalog statistics
    - stave capabilities catalog taxonomy - List taxonomy categories with control counts
    - stave capabilities catalog validate - Validate the entire control and chain catalog
