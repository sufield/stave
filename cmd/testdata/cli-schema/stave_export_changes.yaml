name: stave export changes
synopsis: Export remediation property changes from assessment findings
description: |-
    Extract remediation property changes from assessment findings into
    a structured format for external tooling (Terraform, CloudFormation, etc.).

    Each change includes the control ID, asset ID, property path,
    current value, and required value. Stave provides the data;
    external tools generate vendor-specific scripts.

    Exit Codes:
      0   Export complete
      2   Invalid input
usage: stave export changes [flags]
options:
    - name: assessment
      usage: stave apply JSON output (required)
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for changes
    - name: min-confidence
      default_value: "0"
      usage: minimum remediation confidence (0.0-1.0)
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave export changes --assessment findings.json
      stave export changes --assessment findings.json --min-confidence 0.8
see_also:
    - stave export - Export controls and compliance evidence
