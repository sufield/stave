name: stave vet
synopsis: Vet a Steampipe→Stave mapping file before use
description: |
    Vet inspects a contracts/steampipe/<asset_type>.yaml mapping and
    reports whether it can produce a schema-valid observation for the
    declared asset type, plus how much of the catalog's read surface it
    covers.

    Three checks:
      1. Structural — required fields, recognised operation kinds, each
         kind's mandatory subfields.
      2. Schema fit — every operation path resolves to a property declared
         in schemas/observation/v1/asset-types/<asset_type>.schema.json
         (paths the schema does not declare are warned, not failed —
         additionalProperties is true).
      3. Catalog coverage — how many of the property paths the control +
         chain catalog reads for this asset type are populated, with the
         highest-control-count gaps surfaced.

    Inputs:
      --file FILE        Mapping YAML to vet (required)
      --controls DIR     Control catalog (default: controls)
      --chains DIR       Chain catalog (default: chains)
      --format F         text (default) | json
      --strict           Treat coverage gaps and unknown-to-schema paths
                         as failures (exit 3) instead of warnings.

    Exit codes:
      0   Mapping is valid (warnings may apply unless --strict)
      2   Invalid input (missing flag, unreadable file, bad format)
      3   Mapping is invalid (structural or, with --strict, coverage gap)
      4   Internal error
usage: stave vet [flags]
options:
    - name: chains
      usage: 'chain catalog directory (default: embedded chains)'
    - name: controls
      shorthand: i
      usage: 'control catalog directory (default: embedded catalog)'
    - name: file
      usage: mapping YAML file to vet (required)
    - name: format
      shorthand: f
      default_value: text
      usage: 'output format: text | json'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for vet
    - name: strict
      default_value: "false"
      usage: treat coverage gaps and unknown-to-schema paths as failures
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave vet --file contracts/steampipe/aws_s3_bucket.yaml
      stave vet --file contracts/steampipe/aws_iam_role.yaml --strict
      stave vet --file contracts/steampipe/aws_kms_key.yaml --format json
see_also:
    - stave - Configuration safety evaluator
