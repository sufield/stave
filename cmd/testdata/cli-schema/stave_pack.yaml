name: stave pack
synopsis: |
    Concern packs — named control groupings and their data requirements
description: |-
    Inspect concern packs: named, cross-cutting groupings of controls (e.g.
    "entropy", "quick") plus a requirements manifest describing the exact AWS API
    calls and observation signals the pack needs.

    A pack is distinct from a compliance --profile (which evaluates a snapshot
    against a framework) and from a filesystem domain (-i path): membership is
    resolved by control ID, ID-glob pattern, and minimum severity.

    Subcommands:
      list           list available packs and their control counts
      show <name>    show a pack's requirements manifest (the data you must collect)

    Exit codes: 0 = success, 2 = input error (unknown pack/format), 4 = internal.
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for pack
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
see_also:
    - stave - Configuration safety evaluator
    - stave pack list - List available concern packs and their control counts
    - stave pack show - Show a pack's requirements manifest (AWS calls, signals, collector permissions)
