name: stave report
synopsis: Generate executive security posture report
description: |-
    Aggregate all assessment dimensions into a single structured
    report document: posture score, findings summary, SLA compliance,
    top findings, active chains, ATT&CK coverage, framework readiness,
    team attribution, and executive summary.

    Consumers render the report however needed — Jinja template,
    Python script, Pandoc, or direct API consumption.

    Inputs:
      --history PATH          History directory (required)
      --snapshot PATH         Snapshot to assess (required)
      --sla-profile-file PATH SLA policy
      --team-manifest PATH    Team manifest
      --format STRING         json (default) | markdown
      --out PATH              Write to file
      --title STRING          Report title
      --period STRING         Reporting period label

    Exit Codes:
      0   Report generated
      2   Invalid input
      4   Internal error
usage: stave report [flags]
options:
    - name: chains
      default_value: chains
      usage: chains directory
    - name: controls
      shorthand: i
      default_value: controls
      usage: controls directory
    - name: format
      shorthand: f
      default_value: json
      usage: 'output format: json | markdown'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for report
    - name: history
      usage: history directory (required)
    - name: out
      usage: write to file
    - name: period
      usage: reporting period label
    - name: sla-profile-file
      usage: SLA policy file
    - name: snapshot
      usage: snapshot to assess (required)
    - name: team-breakdown
      default_value: "false"
      usage: Include per-team findings breakdown in report
    - name: team-manifest
      usage: team manifest
    - name: title
      default_value: Security Posture Report
      usage: report title
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave report --history ./history --snapshot latest.json
      stave report --history ./history --snapshot latest.json \
        --sla-profile-file sla.yaml --team-manifest teams.yaml \
        --format markdown --out report.md
see_also:
    - stave - Configuration safety evaluator
