name: stave exempt acknowledge
synopsis: Add a formal risk acceptance
description: |-
    Add a formal risk acceptance (acknowledgment) for a specific finding.
    Requires approver identity, rationale, and expiry date.
    The entry is written to the acceptance YAML file with a full audit trail.

    Exit Codes:
      0   Acknowledgment added
      2   Invalid input
      4   Internal error
usage: stave exempt acknowledge [flags]
options:
    - name: approver
      usage: identity of approving authority (required)
    - name: asset-id
      usage: asset ARN or ID (required)
    - name: compensating
      usage: comma-separated compensating control IDs
    - name: control-id
      usage: control ID (required)
    - name: expires
      usage: expiry date YYYY-MM-DD (required)
    - name: file
      default_value: ./stave-acknowledgments.yaml
      usage: path to acceptance file
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for acknowledge
    - name: reason
      usage: rationale for accepting this risk (required)
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave exempt acknowledge \
        --control-id CTL.S3.PUBLIC.001 \
        --asset-id arn:aws:s3:::legacy-bucket \
        --reason "Temporary public access during migration" \
        --approver "jane.doe@example.com (CISO)" \
        --expires 2026-09-01
see_also:
    - stave exempt - Manage risk acceptances (acknowledgments, exceptions, exemptions)
