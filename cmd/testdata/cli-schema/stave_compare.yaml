name: stave compare
synopsis: Compare compliance posture between two frameworks
description: |-
    Analyze the gap between a baseline framework (e.g. HIPAA) and a
    target framework (e.g. FedRAMP Moderate). Identifies shared
    violations (fix once, satisfy both), marginal work (target-only),
    and free coverage (already passing).

    Answers: "What is the marginal cost to adopt framework B given
    we already comply with framework A?"

    Inputs:
      --from STRING       Baseline framework key (required)
      --to STRING         Target framework key (required)
      --assessment PATH   stave apply JSON output (required)
      --format STRING     table (default) | json | markdown

    Framework keys: hipaa, nist_800_53_r5, fedramp_moderate,
      soc2, pci_dss_v4.0, cis_aws_v3.0, gdpr, iso_27001_2022

    Exit Codes:
      0   Gap analysis produced
      2   Invalid input
usage: stave compare [flags]
options:
    - name: after
      usage: After assessment path (--mode remediation)
    - name: assessment
      usage: stave apply JSON output (required)
    - name: before
      usage: Before assessment path (--mode remediation)
    - name: format
      shorthand: f
      default_value: table
      usage: 'output format: table | json | markdown'
    - name: from
      usage: baseline framework key (required)
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for compare
    - name: mode
      usage: 'Comparison mode: remediation'
    - name: simulated
      usage: Simulated output for efficiency comparison
    - name: to
      usage: target framework key (required)
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave compare --from hipaa --to fedramp_moderate \
        --assessment findings.json

      stave compare --from hipaa --to soc2 \
        --assessment findings.json --format markdown
see_also:
    - stave - Configuration safety evaluator
