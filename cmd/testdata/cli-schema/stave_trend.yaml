name: stave trend
synopsis: Analyze compliance posture trends across assessment runs
description: |-
    Reads a sequence of stave apply output files and computes posture
    metrics including violation rate, MTTR, severity distribution,
    attack stage trends, velocity, and improvement projection.

    Requires at least 2 assessment files to produce a trend report.

    Exit Codes:
      0   Trend report generated successfully
      2   Invalid input or insufficient data
      4   Internal error

    Examples:
      stave trend --history ./assessments/
      stave trend --files run1.json,run2.json,run3.json --format json
      stave trend --history ./assessments/ --window 10
usage: stave trend [flags]
options:
    - name: compliance
      usage: |
        comma-separated framework profiles for trajectory (hipaa,soc2,...)
    - name: files
      usage: comma-separated assessment files in chronological order
    - name: format
      shorthand: f
      default_value: table
      usage: 'output format: table | json | openmetrics'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for trend
    - name: history
      usage: directory of out.v0.1 assessment files
    - name: min-runs
      default_value: "2"
      usage: minimum assessment files required
    - name: no-pager
      default_value: "false"
      usage: never page output, even on a terminal
    - name: regression-only
      default_value: "false"
      usage: show only regressing teams
    - name: rollup
      usage: aggregate to hierarchy group ID
    - name: team
      usage: filter to specific team ID
    - name: team-manifest
      usage: path to team manifest YAML for per-team metrics
    - name: window
      default_value: "0"
      usage: limit to most recent N assessments (0 = all)
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave trend --history ./assessments/
      stave trend --history ./assessments/ --format json
see_also:
    - stave - Configuration safety evaluator
    - stave trend forecast - Project posture score trajectory with SLA breach warnings
    - stave trend oscillation - Classify violation oscillation patterns across assessment history
    - stave trend predict - Project compliance readiness achievement date
