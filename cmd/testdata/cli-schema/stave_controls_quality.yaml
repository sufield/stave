name: stave controls quality
synopsis: |
    Analyze control catalog metadata completeness and coverage gaps
description: |-
    Evaluate control catalog quality by checking metadata completeness
    (severity, remediation action, attack stage, compliance mappings),
    identifying blind spots where observed asset types lack controls,
    and detecting MITRE ATT&CK stage coverage gaps.

    Inputs:
      --controls           Path to control definitions directory
      --snapshot           Path to observation snapshot for blind spot detection
      --format             Output format: table or json (default: table)
      --min-completeness   Minimum overall completeness percentage (exit 1 if below)

    Exit Codes:
      0   Quality report generated
      1   Completeness below --min-completeness threshold
      2   Input error
      4   Internal error

    Offline-only: reads local files; makes zero network connections; no cloud credentials.
usage: stave controls quality [flags]
options:
    - name: controls
      shorthand: i
      default_value: controls
      usage: Path to control definitions directory
    - name: format
      shorthand: f
      default_value: table
      usage: 'Output format: table or json'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for quality
    - name: min-completeness
      default_value: "0"
      usage: Minimum overall completeness percentage (exit 1 if below)
    - name: snapshot
      usage: Path to observation snapshot for blind spot detection
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave controls quality --controls controls/s3
      stave controls quality --controls controls/ --snapshot observations/latest.json
      stave controls quality --controls controls/ --min-completeness 80 --format json
see_also:
    - stave controls - Work with control definitions
