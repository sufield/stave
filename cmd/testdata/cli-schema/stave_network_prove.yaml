name: stave network prove
synopsis: Verify a network safety property
description: |-
    Proves a network safety property against observation snapshots.

    Returns UNSAT if the property holds (no violating paths), SAT with
    a counterexample identifying the specific violation, or EVIDENCE_GATED
    when a path reaches a route target the snapshot cannot resolve.

    Properties:
      bastion-ssh          All SSH to production routes through a bastion host
      prod-dev-isolation   No network path between production and development VPCs
      database-isolation   No cross-VPC or internet path to database-tier hosts
      firewall-mandatory   All private subnet internet traffic passes through Network Firewall
      transitive-ssh       No SSH path from external to internal via an intermediate host
      transitive-egress    Proves no tag-isolated workload reaches the internet via a host
                           with default-route egress. Network-layer only; IAM-layer service
                           paths are not evaluated. EVIDENCE_GATED means a path reaches a
                           route target the snapshot cannot resolve (TGW, VPN/DX, firewall
                           or GWLB endpoint, NAT instance); the result names the observation
                           that would settle it.

    Inputs:
      --observations, -o  Observation snapshots directory (required)
      --property          Safety property to verify (default: bastion-ssh)
      --port              Port to verify for bastion-ssh (default: 22)
      --format, -f        Output format: json, text (default: text)

    Outputs:
      stdout: proof result (UNSAT = property holds, SAT = violation found,
              EVIDENCE_GATED = inconclusive, additional observation needed)

    Exit codes:
      0   Proof completed successfully (regardless of SAT/UNSAT/EVIDENCE_GATED)
      2   Input error (bad flags, missing observations)
      4   Internal error
      130 Interrupted (SIGINT)

    Offline-only: reads local files; makes zero network connections; no cloud credentials.
usage: stave network prove [flags]
options:
    - name: format
      shorthand: f
      default_value: text
      usage: 'output format: json, text'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for prove
    - name: observations
      shorthand: o
      usage: path to observations directory (required)
    - name: port
      default_value: "22"
      usage: 'port to verify (default: 22)'
    - name: property
      default_value: bastion-ssh
      usage: |
        safety property to verify: bastion-ssh, prod-dev-isolation, database-isolation, firewall-mandatory, transitive-ssh, transitive-egress
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      # Verify bastion SSH routing
      stave network prove -o observations --property bastion-ssh

      # Verify environment isolation
      stave network prove -o observations --property prod-dev-isolation

      # Verify database tier isolation
      stave network prove -o observations --property database-isolation -f json

      # Verify firewall enforcement
      stave network prove -o observations --property firewall-mandatory
see_also:
    - stave network - Network reachability analysis and safety proofs
