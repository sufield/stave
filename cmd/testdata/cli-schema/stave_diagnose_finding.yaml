name: stave diagnose finding
synopsis: Deep-dive analysis of a single finding
description: |-
    Finding generates a detailed root-cause analysis for a specific control/asset
    violation. It shows control metadata, predicate evaluation trace, evidence,
    remediation guidance, and next steps.

    Inputs:
      --control-id     Control ID to inspect (required)
      --asset-id       Asset ID to inspect (required)
      --controls       Directory containing YAML control definitions
      --observations   Directory containing JSON observation snapshots
      --previous-output  Optional path to existing apply output JSON

    Outputs:
      stdout           Finding detail (text or JSON with --format json)

    Exit Codes:
      0   - Finding detail rendered successfully
      2   - Invalid input or error
      3   - Violation confirmed

    Examples:
      # Deep dive into a specific finding
      stave diagnose finding \
        --control-id CTL.S3.PUBLIC.001 \
        --asset-id res:aws:s3:bucket:my-bucket \
        --controls ./controls --observations ./obs

      # Using existing evaluation output
      stave diagnose finding \
        --control-id CTL.S3.PUBLIC.001 \
        --asset-id res:aws:s3:bucket:my-bucket \
        --previous-output output/evaluation.json \
        --controls ./controls --observations ./obs

      # JSON output for scripting
      stave diagnose finding \
        --control-id CTL.S3.PUBLIC.001 \
        --asset-id res:aws:s3:bucket:my-bucket \
        --controls ./controls --observations ./obs \
        --format json

    Offline-only: reads local files; makes zero network connections; no cloud credentials.
usage: stave diagnose finding [flags]
options:
    - name: asset-id
      usage: Asset ID to inspect (required)
    - name: control-id
      usage: Control ID to inspect (required)
    - name: controls
      shorthand: i
      default_value: controls
      usage: Path to control definitions directory
    - name: format
      shorthand: f
      default_value: text
      usage: 'Output format: text or json'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for finding
    - name: max-unsafe
      usage: |
        Maximum allowed unsafe duration Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: now
      usage: Override current time (RFC3339)
    - name: observations
      shorthand: o
      default_value: observations
      usage: Path to observation snapshots directory
    - name: previous-output
      shorthand: p
      usage: Path to existing apply output JSON
    - name: template
      usage: Template string for custom output formatting
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave diagnose finding --control-id CTL.S3.PUBLIC.001 --asset-id my-bucket \
        --controls ./controls --observations ./obs
see_also:
    - stave diagnose - Diagnose evaluation inputs and results
