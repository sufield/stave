name: stave forge test
synopsis: Run fixture-based assertions against a control
description: |-
    Evaluate a control predicate against pass and fail fixture files
    and assert the expected verdict. Shows predicate trace on failure.

    Exit Codes:
      0   All assertions passed
      1   One or more assertions failed
      2   Invalid input
      4   Internal error
usage: stave forge test [flags]
options:
    - name: control
      usage: path to control YAML file (required)
    - name: fail
      usage: 'fixture that must produce verdict: fail'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for test
    - name: pass
      usage: 'fixture that must produce verdict: pass'
    - name: snapshot
      usage: real snapshot for smoke test
    - name: verbose
      default_value: "false"
      usage: show trace on pass
    - name: watch
      default_value: "false"
      usage: re-run on control file change
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave forge test \
        --control controls/ad/CTL.AD.PASS.MINLEN.001.yaml \
        --pass testdata/fixture-pass.json \
        --fail testdata/fixture-fail.json
see_also:
    - stave forge - Author and test custom controls
