name: stave exempt export
synopsis: Export risk register as OSCAL POA&M
description: |-
    Export acknowledgments and open findings as an OSCAL Plan of Action
    and Milestones (POA&M) document for FedRAMP, HIPAA, and SOC2 submissions.

    Exit Codes:
      0   Export complete
      2   Invalid input
      4   Internal error
usage: stave exempt export [flags]
options:
    - name: assessor
      default_value: Stave automated assessment
      usage: assessor name
    - name: file
      default_value: ./stave-acknowledgments.yaml
      usage: path to acknowledgment YAML file
    - name: format
      shorthand: f
      default_value: oscal-poam
      usage: 'output format: oscal-poam'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for export
    - name: output
      usage: path to out.v0.1.json for open findings
    - name: system-uuid
      usage: UUID of the System Security Plan
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave exempt export --format oscal-poam --system-uuid <uuid>
      stave exempt export --format oscal-poam --output assessment.json
see_also:
    - stave exempt - Manage risk acceptances (acknowledgments, exceptions, exemptions)
