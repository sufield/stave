name: stave capabilities
synopsis: |
    Print supported input types and version constraints (default) or a user-facing catalog (subcommand)
description: |-
    Capabilities exposes two views.

    Default (no subcommand) emits a JSON document describing the protocol
    metadata: observation schemas, control DSL versions, input source
    types, and command capability metadata this version of Stave supports.
    This is the stable contract consumers parse.

    `stave capabilities catalog` emits the user-facing capability
    catalog: grouped detections + compound chains + operational features.
    Pair with `stave search` to look up by intent.

    Exit Codes:
      0   - Success
      4   - Internal error

    Examples:
      # Protocol metadata (default)
      stave capabilities

      # User-facing catalog
      stave capabilities catalog

      # Supported observation schema versions
      stave capabilities | jq '.observation_support.schemas'

      # Supported control (policy) DSL versions
      stave capabilities | jq '.policy_support.schemas'

      # Supported input source types
      stave capabilities | jq '[.data_ingress.connectors[].type]'

      # Supported compliance / security frameworks
      stave capabilities | jq '.compliance_support.security_frameworks'

    Offline-only: reads local files; makes zero network connections; no cloud credentials.
usage: stave capabilities [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for capabilities
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: '  stave capabilities | jq ''.version'''
see_also:
    - stave - Configuration safety evaluator
    - stave capabilities catalog - Print the user-facing capability catalog
