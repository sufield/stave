name: stave trend predict
synopsis: Project compliance readiness achievement date
description: |-
    Predict estimates when a target compliance readiness percentage will
    be achieved based on historical MTTR and current framework gaps.

    Requires at least 2 assessment files to compute trends.

    Inputs:
      --history            Directory of out.v0.1 assessment files
      --files              Comma-separated assessment files
      --profile            Compliance framework profile name
      --target-readiness   Target readiness percentage (default: 95)
      --window             Lookback window in days for MTTR computation (default: 90)
      --format             Output format: text or json (default: text)

    Exit Codes:
      0   Prediction generated
      2   Invalid input or insufficient data
      4   Internal error

    Offline-only: reads local files; makes zero network connections; no cloud credentials.
usage: stave trend predict [flags]
options:
    - name: files
      usage: Comma-separated assessment files in chronological order
    - name: format
      shorthand: f
      default_value: text
      usage: 'Output format: text or json'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for predict
    - name: history
      usage: Directory of out.v0.1 assessment files
    - name: profile
      usage: Compliance framework profile name
    - name: target-readiness
      default_value: "95"
      usage: Target readiness percentage
    - name: window
      default_value: "90"
      usage: Lookback window in days for MTTR computation
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave trend predict --history ./assessments/ --target-readiness 95
      stave trend predict --history ./assessments/ --profile pci_dss --format json
see_also:
    - stave trend - Analyze compliance posture trends across assessment runs
