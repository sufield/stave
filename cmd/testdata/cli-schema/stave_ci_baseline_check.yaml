name: stave ci baseline check
synopsis: |
    Compare evaluation findings against baseline and detect new findings
description: |-
    Check compares current evaluation findings against a saved baseline.
    New findings (not in the baseline) are reported. Use --fail-on-new to
    fail the CI pipeline when new violations appear.

    Use --warn-on-resolved to emit a warning when baseline findings disappear.
    Disappearing findings may indicate data loss rather than remediation.

    Inputs:
      --in               Path to current evaluation JSON
      --baseline         Path to saved baseline JSON
      --fail-on-new      Exit 3 when new findings detected (default: true)
      --warn-on-resolved Warn when baseline findings disappear (default: false)

    Exit Codes:
      0    No new findings (or --fail-on-new=false)
      2    Input error (missing or invalid files)
      3    New findings detected (when --fail-on-new is true)
      4    Internal error
usage: stave ci baseline check [flags]
options:
    - name: baseline
      usage: Path to baseline JSON (required)
    - name: fail-on-new
      default_value: "true"
      usage: Return exit code 3 when new findings are detected
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for check
    - name: in
      usage: Path to evaluation JSON (required)
    - name: warn-on-resolved
      default_value: "false"
      usage: |
        Warn when baseline findings disappear (may indicate data loss)
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave ci baseline check --in output/evaluation.json --baseline output/baseline.json
      stave ci baseline check --in output/evaluation.json --baseline output/baseline.json --fail-on-new=false
      stave ci baseline check --in output/evaluation.json --baseline output/baseline.json --warn-on-resolved
see_also:
    - stave ci baseline - Manage baseline findings for fail-on-new CI workflows
