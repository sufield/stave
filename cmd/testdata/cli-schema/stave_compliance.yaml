name: stave compliance
synopsis: |
    Evaluate a snapshot against a compliance framework and report coverage
description: |-
    Evaluate a configuration snapshot against a compliance framework.

    For each framework control, Stave runs the mapped Stave controls against the
    snapshot and reports one of three actionable lists:

      COVERED      framework control has Stave verification — PASS or FAIL
      GAPS         in scope, but no Stave control exists yet (build one)
      OUT OF SCOPE organizational / runtime / physical — a different team's job

    A coverage percentage (verified ÷ in-scope) makes progress visible: add a
    control, re-run, watch it climb.

    The report also runs a mapping-integrity self-check: the framework mapping must
    reference only controls that exist in the catalog, have unique framework IDs,
    and carry well-formed confidence/uncovered_aspects metadata. Errors are shown
    after the report; --strict turns them into a non-zero exit for CI. Use
    --verify-mapping to run only this check (no snapshot needed).

    Inputs:
      --framework       compliance framework to evaluate (default: aicm-v1.1)
      --snapshot        observation snapshot directory, or - for stdin
      --controls        control directory (default: built-in catalog)
      --format          text | json | markdown (default: text)
      --now             override current time (RFC3339) for deterministic output
      --verify-mapping  check the mapping against the catalog and exit (no snapshot)
      --strict          fail (exit 2) on mapping-integrity errors

    Outputs:
      stdout        the three-list report (+ integrity section) in the chosen format
      exit code     0 = no failures, 3 = a covered control failed,
                    2 = input error or (with --strict) mapping-integrity error,
                    4 = internal error

      Note: integrity errors use exit 2, not 1 — exit 1 is reserved for
      security-audit gating across the CLI.

    Examples:
      stave compliance --framework aicm-v1.1 --snapshot ./my-config/
      stave compliance --snapshot ./snap --format json > coverage.json
      stave compliance --snapshot ./snap --format markdown > COMPLIANCE.md
      stave compliance --verify-mapping --strict   # CI gate, no snapshot
usage: stave compliance [flags]
options:
    - name: controls
      shorthand: i
      default_value: controls
      usage: 'control definitions directory (default: built-in catalog)'
    - name: format
      shorthand: f
      default_value: text
      usage: 'output format: text, json, markdown'
    - name: framework
      default_value: aicm-v1.1
      usage: 'compliance framework: aicm-v1.1'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for compliance
    - name: now
      usage: override current time (RFC3339) for deterministic output
    - name: snapshot
      usage: observation snapshot directory (or - for stdin)
    - name: strict
      default_value: "false"
      usage: |
        fail (exit 2) on mapping-integrity errors (dangling refs, duplicate IDs, invalid confidence)
    - name: verify-mapping
      default_value: "false"
      usage: |
        check the framework mapping against the catalog and exit (no snapshot needed)
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      # Coverage report against the default framework
      stave compliance --snapshot ./my-config/

      # Machine-readable output for an auditor
      stave compliance --framework aicm-v1.1 --snapshot ./snap --format json > coverage.json
see_also:
    - stave - Configuration safety evaluator
