name: stave trend forecast
synopsis: Project posture score trajectory with SLA breach warnings
description: |-
    Forecast computes a linear trend over daily posture scores and
    projects the score forward over the specified horizon. When an
    SLA profile is provided, annotates each severity with ON_TRACK,
    AT_RISK, or BREACHING status based on MTTR trajectory.

    Requires at least 7 assessment files for a meaningful trend.

    Inputs:
      --history            Directory of out.v0.1 assessment files
      --files              Comma-separated assessment files
      --horizon            Forecast horizon in days (default: 90)
      --sla-profile        Path to SLA policy YAML (enables SLA status)
      --format             Output format: table or json (default: table)

    Exit Codes:
      0   Forecast generated
      2   Invalid input or insufficient data

    Offline-only: reads local files; makes zero network connections; no cloud credentials.
usage: stave trend forecast [flags]
options:
    - name: files
      usage: comma-separated assessment files
    - name: format
      shorthand: f
      default_value: table
      usage: 'output format: table | json'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for forecast
    - name: history
      usage: directory of assessment JSON files
    - name: horizon
      default_value: "90"
      usage: forecast horizon in days
    - name: sla-profile
      usage: path to SLA policy YAML
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave trend forecast --history ./assessments/ --horizon 90
      stave trend forecast --history ./assessments/ --sla-profile sla.yaml --format json
see_also:
    - stave trend - Analyze compliance posture trends across assessment runs
