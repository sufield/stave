name: stave cel eval
synopsis: Evaluate a CEL expression against observation assets
description: |-
    Evaluate a CEL expression against assets from an observation file.
    Reports which assets match and which do not.

    Inputs:
      --expr         CEL expression to evaluate (required)
      --input        Path to observation JSON file
      --stdin        Read observation JSON from stdin
      --asset-type   Filter to assets of this type
      --format       Output format: text or json (default: text)

    Exit Codes:
      0   Evaluation completed
      2   Invalid input
      4   Internal error

    Offline-only: reads local files; makes zero network connections; no cloud credentials.
usage: stave cel eval [flags]
options:
    - name: asset-type
      usage: Filter to assets of this type
    - name: expr
      usage: CEL expression to evaluate (required)
    - name: format
      shorthand: f
      default_value: text
      usage: 'Output format: text or json'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for eval
    - name: input
      usage: Path to observation JSON file
    - name: stdin
      default_value: "false"
      usage: Read observation JSON from stdin
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave cel eval --expr 'properties["storage"]["versioning"]["enabled"] == false' --input obs.json
      cat obs.json | stave cel eval --expr 'properties["type"] == "aws_s3_bucket"' --stdin
see_also:
    - stave cel - CEL expression tools
