name: stave catalog gaps
synopsis: Compare catalog against an external checklist
description: |
    Gaps loads an external YAML checklist and reports which items
    have matching controls in the catalog (COVERED) and which do not
    (UNCOVERED). Ambiguous matches (multiple controls match) are marked
    with "?".

    Checklist format:
      checks:
        - id: iam-mfa-root
          service: IAM
          description: "Root account has MFA enabled"
          reference: "CIS 1.5"

    Matching logic: same service + keyword overlap on description.
    Use --strict for exact control-ID matching only.

    Inputs:
      <checklist-file>   Path to the YAML checklist (positional, required)
      --format F         text (default) | json
      --strict           Exact ID match only, no fuzzy matching
      --controls DIR     Control catalog directory (default: controls)

    Exit codes:
      0   Success
      2   Invalid input (bad checklist file)
      4   Internal error
usage: stave catalog gaps <checklist-file> [flags]
options:
    - name: controls
      shorthand: i
      usage: 'control catalog directory (default: embedded catalog)'
    - name: format
      shorthand: f
      default_value: text
      usage: 'output format: text | json'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for gaps
    - name: strict
      default_value: "false"
      usage: exact control-ID match only, no fuzzy matching
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave catalog gaps checklist.yaml
      stave catalog gaps cis-benchmark.yaml --strict
      stave catalog gaps prowler-checks.yaml --format json
see_also:
    - stave catalog - Print the user-facing capability catalog
