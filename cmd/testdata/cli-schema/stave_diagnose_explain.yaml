name: stave diagnose explain
synopsis: Generate guided remediation playbook for a finding
description: |-
    Assemble a remediation narrative from structured finding data,
    control metadata, and chain context. Explains the security impact,
    dependency order for safe remediation, and compound risk context.

    No network calls — fully offline, air-gap compatible.

    Exit Codes:
      0   Playbook generated
      2   Invalid input
      4   Internal error
usage: stave diagnose explain [flags]
options:
    - name: asset
      usage: explain all findings for an asset
    - name: chains
      default_value: chains
      usage: chains directory
    - name: control
      usage: explain all findings for a control
    - name: controls
      default_value: controls
      usage: controls directory
    - name: depth
      default_value: standard
      usage: 'detail level: brief | standard | detailed'
    - name: finding-id
      usage: explain a specific finding by ID
    - name: format
      shorthand: f
      default_value: narrative
      usage: 'output format: narrative | json | markdown'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for explain
    - name: out
      usage: write output to file
    - name: output
      usage: path to out.v0.1.json (required)
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave diagnose explain --finding-id sha256:a3f8c2 --output out.v0.1.json
      stave diagnose explain --asset arn:aws:s3:::phi-records --output out.v0.1.json
      stave diagnose explain --control CTL.S3.PUBLIC.001 --output out.v0.1.json --format markdown
see_also:
    - stave diagnose - Diagnose evaluation inputs and results
