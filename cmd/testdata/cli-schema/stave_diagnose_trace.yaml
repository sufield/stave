name: stave diagnose trace
synopsis: |
    Trace predicate evaluation for a single control against a single asset
description: |-
    Trace walks a control's unsafe_predicate clause by clause against a
    single asset and prints a detailed evaluation log — field value,
    operator, comparison value, and PASS/FAIL — for every clause.

    Use this when you get unexpected evaluation results and want to
    understand exactly why a control did or did not match.

    Examples:
      stave trace --control CTL.S3.PUBLIC.001 \
        --observation observations/2026-01-11T000000Z.json \
        --asset-id res:aws:s3:bucket:public-bucket

      stave trace --control CTL.S3.ENCRYPT.001 \
        --observation observations/2026-01-11T000000Z.json \
        --asset-id res:aws:s3:bucket:public-bucket \
        --format json

    Exit Codes:
      0    Success
      2    Input error
      4    Internal error

    Offline-only: reads local files; makes zero network connections; no cloud credentials.
usage: stave diagnose trace [flags]
options:
    - name: asset-id
      usage: Asset ID to trace against (required)
    - name: control
      usage: Control ID to trace (required)
    - name: controls
      shorthand: i
      default_value: controls
      usage: Path to control definitions directory
    - name: format
      shorthand: f
      default_value: text
      usage: 'Output format: text or json'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for trace
    - name: observation
      usage: Path to single observation JSON file (required)
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: '  stave trace --controls controls/s3 --observation observations/snap.json --control CTL.S3.PUBLIC.001 --asset-id my-bucket'
see_also:
    - stave diagnose - Diagnose evaluation inputs and results
