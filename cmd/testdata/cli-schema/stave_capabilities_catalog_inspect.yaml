name: stave capabilities catalog inspect
synopsis: Show full metadata for a single control
description: |
    Inspect prints the complete metadata for one control: severity,
    domain, scope, compliance mappings, applicable asset types, observation
    fields, chains that reference it, and remediation guidance.

    Inputs:
      <control-id>     The control ID to inspect (positional, required)
      --format F       text (default) | json
      --controls DIR   Control catalog directory (default: controls)
      --chains DIR     Chain catalog directory (default: chains)

    Exit codes:
      0   Success
      2   Invalid input (unknown control ID)
      4   Internal error
usage: stave capabilities catalog inspect <control-id> [flags]
options:
    - name: chains
      default_value: chains
      usage: chain catalog directory
    - name: controls
      shorthand: i
      default_value: controls
      usage: control catalog directory
    - name: format
      shorthand: f
      default_value: text
      usage: 'output format: text | json'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for inspect
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave catalog inspect CTL.S3.PUBLIC.001
      stave catalog inspect CTL.IAM.ESCALATE.SSOOAUTH.001 --format json
see_also:
    - stave capabilities catalog - Print the user-facing capability catalog
