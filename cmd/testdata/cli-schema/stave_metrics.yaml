name: stave metrics
synopsis: Write Prometheus scrape file for node_exporter
description: |-
    Produce a stable Prometheus text format metrics file covering
    posture score, findings by severity, SLA burn rates, chain
    activations, and per-team metrics.

    Designed for the node_exporter textfile collector. Run on a
    schedule via cron to maintain continuous monitoring.

    Inputs:
      --history DIR         Directory of assessment JSON files (required)
      --out PATH            Output .prom file path (required)

    Exit Codes:
      0   Metrics written
      2   Invalid input
usage: stave metrics [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for metrics
    - name: history
      usage: directory of assessment JSON files (required)
    - name: out
      usage: output .prom file path (required)
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave metrics --history ./history --out /var/lib/node_exporter/stave.prom
      stave metrics --history ./history --out stave.prom
see_also:
    - stave - Configuration safety evaluator
