name: stave export-sir
synopsis: Export the Stave Intermediate Representation as JSON
description: |
    Export the Stave Intermediate Representation (SIR) for the configured
    controls and observations as a deterministic document.

    The SIR is the vendor-neutral fact set the Z3 solver consumes for compound
    risk reasoning. It carries every control fact, asset, identity (with
    transitive role chains), effective-permission edge, and exposure window
    that the engine's evaluation pipeline produces — but stripped of
    infrastructure noise (file paths, git metadata, tool versions).

    Scope: the SIR is a curated projection, not a complete dump of every
    property a control reads. The export currently covers 13 top-level
    configuration domains (IAM, Cognito, S3 storage policies, Bedrock AI
    agents, delegation, credential lifecycle, trail logging, network, and
    a subset of compute / k8s). Properties in uncovered domains (Azure,
    GCP, M365, databases, messaging, secrets, monitoring, and 80+ others)
    are evaluated by CEL controls inside 'stave apply' but are NOT in the
    export. A solver UNSAT verdict is valid for chains the SIR can express;
    it is silent about chains whose members live in uncovered domains. See
    the Fact Export reference in stave-guide for the full domain table.

    Three output formats are supported:

      json    — full nested SIR document (default).
      jsonl   — one (subject, predicate, object) triple per line. Lossy
                projection optimised for Datalog/Soufflé and ASP/Clingo
                consumers that prefer flat predicate(s, o) facts.
      smt2    — SMT-LIB v2 declarations + assertions. The output contains
                facts only — no (check-sat), no queries — so any SMT solver
                (Z3, cvc5, Yices) reads the same file. Reasoning programs
                append their own query to the file before invoking the
                solver.

    Inputs:
      --controls, -i      Control definitions directory (default: controls)
      --observations, -o  Observation snapshots directory (default: observations)
      --format, -f        Output format: json | jsonl | smt2 (default: json)
      --now               RFC3339 timestamp for deterministic output

    Outputs:
      stdout: SIR document in the requested format.
      stderr: errors and progress (when stderr is a TTY).

    Exit codes:
      0   success
      2   input error (bad flag, malformed --now)
      4   internal error (load failure, builder error)
      130 SIGINT
usage: stave export-sir [flags]
options:
    - name: allowlist-mode
      default_value: curated
      usage: |
        scalar projector mode: curated (default — 59 hand-authored entries) | full (experimental — emit one auto_prop_<path> triple per control-read property path the predicate index advertises; measures coverage gain, no downstream solver consumes the auto_prop_* names yet)
    - name: closed-world
      default_value: "false"
      usage: |
        emit closed-world forall axioms in SMT2 output (restricts each predicate to its asserted tuples only; needed for negative proofs but causes solver timeout on large fact sets)
    - name: controls
      shorthand: i
      default_value: controls
      usage: control definitions directory
    - name: format
      shorthand: f
      default_value: json
      usage: 'output format: json | jsonl | smt2'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for export-sir
    - name: now
      usage: override current time (RFC3339) for deterministic output
    - name: observations
      shorthand: o
      default_value: observations
      usage: observation snapshots directory
    - name: strip-catalog
      default_value: "false"
      usage: |
        omit control catalog metadata (has_severity, has_type, has_domain) from the fact stream; reduces SMT2/JSONL output to observation-derived facts only
    - name: validate
      default_value: "false"
      usage: |
        check SIR coverage against CEL controls and warn on stderr about projection gaps (controls that fire in CEL but evaluate properties not projected as SIR facts)
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      # Export SIR for the project's default controls + observations
      stave export-sir > sir.json

      # Pin --now for byte-identical reproduction
      stave export-sir --now 2026-05-01T12:00:00Z > sir.json

      # Pretty-print for inspection
      stave export-sir | jq .

      # Triple form for Datalog / ASP consumers
      stave export-sir --format jsonl > facts.jsonl

      # SMT-LIB v2 facts; append a query before piping into z3 / cvc5
      stave export-sir --format smt2 > facts.smt2
      cat facts.smt2 query.smt2 | z3 -in
see_also:
    - stave - Configuration safety evaluator
