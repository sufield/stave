name: stave ci baseline save
synopsis: Save evaluation findings as baseline
description: |-
    Save captures the current evaluation findings as a baseline snapshot.
    Subsequent runs of 'baseline check' compare new findings against this
    baseline so CI only fails on newly introduced violations.

    Inputs:
      --in     Path to evaluation JSON from 'stave apply --format json'
      --out    Output path for the baseline file (default: output/baseline.json)

    Exit Codes:
      0    Baseline saved successfully
      2    Input error (missing or invalid evaluation file)
      4    Internal error
usage: stave ci baseline save [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for save
    - name: in
      usage: Path to evaluation JSON (required)
    - name: out
      default_value: output/baseline.json
      usage: Path to baseline output JSON
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave ci baseline save --in output/evaluation.json
      stave ci baseline save --in output/evaluation.json --out baselines/2026-03.json
see_also:
    - stave ci baseline - Manage baseline findings for fail-on-new CI workflows
