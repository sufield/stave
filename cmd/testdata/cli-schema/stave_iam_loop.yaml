name: stave iam loop
synopsis: Run one IAM policy analysis cycle
description: |-
    Loop runs one cycle of the IAM policy analysis pipeline: parse a policy
    JSON file, generate a micro-observation (obs.v0.1), and render the
    structural risk signals that the observation captured.

    The composition spine connects iam-explain (parser, risk evaluator, SMT
    exporter) to stave's evaluation engine via obs.v0.1 files. This command
    runs one pass — no catalog verdicts, no diff, no watch.

    Inputs:
      <policy.json>   IAM policy document (positional, required). Accepts a
                      full policy document, a bare Statement array, or a single
                      Statement object — iam-explain's parser handles all three.
      --format, -f    Output format: text (default), json

    Outputs:
      stdout: micro-observation rendered as structured risk signals (text) or
              raw obs.v0.1 JSON (json)
      stderr: cycle wall-clock time

    Exit codes:
      0   Cycle completed successfully
      2   Input error (missing policy, iam-explain not found)
      4   Internal error (parse failure, obs validation failure)
      130 Interrupted (SIGINT)

    Requires: iam-explain binary in PATH (build from projects/iam-explain/).

    Offline-only: reads local files; makes zero network connections; no cloud credentials.
usage: stave iam loop <policy.json> [flags]
options:
    - name: format
      shorthand: f
      default_value: text
      usage: 'output format: text, json'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for loop
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      # Analyze a dangerous policy
      stave iam loop examples/dangerous-policy.json

      # JSON output for piping
      stave iam loop --format json policy.json

      # From iam-explain's test fixtures
      stave iam loop projects/iam-explain/testdata/dangerous-policy.json
see_also:
    - stave iam - IAM policy analysis commands
