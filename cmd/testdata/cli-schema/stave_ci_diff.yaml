name: stave ci diff
synopsis: Compare two evaluations and report new findings
description: |-
    Diff compares a current evaluation against a baseline evaluation and
    reports newly introduced and resolved findings.

    Use this in CI to fail PRs only when new violations are introduced.

    Exit Codes:
      0   - Success
      2   - Input error
      3   - New findings detected (with --fail-on-new)
      4   - Internal error

    Offline-only: reads local files; makes zero network connections; no cloud credentials.
usage: stave ci diff [flags]
options:
    - name: baseline
      usage: Path to baseline evaluation JSON (required)
    - name: current
      usage: Path to current evaluation JSON (required)
    - name: fail-on-new
      default_value: "true"
      usage: Return exit code 3 when new findings are detected
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for diff
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave ci diff --current pr-evaluation.json --baseline main-evaluation.json
      stave ci diff --current pr-evaluation.json --baseline main-evaluation.json --fail-on-new
see_also:
    - stave ci - CI/CD policy and baseline commands
