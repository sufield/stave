name: stave controls list
synopsis: List control IDs and names
description: |-
    List loads controls from a directory and prints concise metadata.

    Exit Codes:
      0    Success
      2    Input error
      4    Internal error

    Offline-only: reads local files; makes zero network connections; no cloud credentials.
usage: stave controls list [flags]
options:
    - name: built-in
      default_value: "false"
      usage: List built-in embedded controls instead of filesystem
    - name: columns
      shorthand: c
      default_value: id,name,type
      usage: 'Comma-separated columns: id,name,type,risk,domain'
    - name: controls
      shorthand: i
      default_value: controls
      usage: Path to control definitions directory
    - name: filter
      default_value: '[]'
      usage: Filter controls by selector (e.g. aws/s3/severity:high+)
    - name: format
      shorthand: f
      default_value: text
      usage: 'Output format: text, json, csv'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for list
    - name: no-headers
      default_value: "false"
      usage: Hide headers for table/csv output
    - name: packs
      default_value: "false"
      usage: List built-in control packs instead of controls
    - name: sort
      shorthand: s
      default_value: id
      usage: 'Sort column: id,name,type,risk,domain'
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave controls list --controls controls/s3 --format json
      stave controls list --built-in --filter aws/s3/severity:high+
see_also:
    - stave controls - Work with control definitions
