name: stave plan
synopsis: |
    Preview which controls will evaluate, by service and severity
description: |-
    Preview what Stave will check before you collect anything. Given the AWS
    services you use (or a pack), it shows the controls that would evaluate, broken
    down by service and severity, plus a severity-weighted collection order so you
    start with the highest-impact data first.

    This is a coverage preview — distinct from "stave apply --dry-run", which checks
    whether an already-collected snapshot is READY to evaluate. Use plan to decide
    what to collect; use apply --dry-run to confirm a collected snapshot is complete.

    Inputs:  --services (comma-separated) OR --pack <name>; --format, -f (text|json);
             --controls, -i (catalog to resolve against).
    Outputs: a per-service control/severity table and recommended collection order.

    Exit codes: 0 = success, 2 = input error, 4 = internal.
usage: stave plan [flags]
options:
    - name: controls
      shorthand: i
      default_value: controls
      usage: 'control definitions directory (default: built-in catalog)'
    - name: format
      shorthand: f
      default_value: text
      usage: 'output format: text, json'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for plan
    - name: pack
      usage: preview a named pack instead of services
    - name: services
      default_value: '[]'
      usage: AWS services to preview (comma-separated), e.g. iam,s3,ec2
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      # What will Stave check for these services?
      stave plan --services iam,s3,ec2

      # Preview a named pack
      stave plan --pack entropy --format json
see_also:
    - stave - Configuration safety evaluator
