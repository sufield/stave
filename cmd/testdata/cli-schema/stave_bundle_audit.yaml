name: stave bundle audit
synopsis: Assemble a compliance-period evidence package
description: |-
    Package all evidence components for a specific compliance framework
    and time period into a named directory with a SHA-256 manifest.

    Components: assessment results, executive report, continuity
    attestation, remediation trend, and exemption register.

    Inputs:
      --framework        Compliance framework (hipaa, soc2, fedramp, pci_dss)
      --period           Period shorthand (Q1-2026, Q4-2025)
      --from / --to      Explicit date range (ISO 8601)
      --history          Directory of assessment JSON files
      --exempt           Path to acknowledgments YAML (optional)
      --out              Output directory (created if not exists)
      --dry-run          Show what would be collected without writing

    Exit Codes:
      0   Package assembled
      2   Invalid input

    Offline-only: reads local files; makes zero network connections; no cloud credentials.
usage: stave bundle audit [flags]
options:
    - name: dry-run
      default_value: "false"
      usage: show what would be collected
    - name: exempt
      usage: path to acknowledgments YAML
    - name: framework
      usage: compliance framework (required)
    - name: from
      usage: period start date (ISO 8601)
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for audit
    - name: history
      usage: directory of assessment JSON files (required)
    - name: out
      usage: output directory (required unless --dry-run)
    - name: period
      usage: period shorthand (e.g. Q1-2026)
    - name: to
      usage: period end date (ISO 8601)
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave bundle audit --framework hipaa --period Q1-2026 --history ./assessments/ --out ./audit/
      stave bundle audit --framework soc2 --from 2025-01-01 --to 2025-12-31 --history ./assessments/
      stave bundle audit --framework hipaa --period Q1-2026 --history ./assessments/ --dry-run
see_also:
    - stave bundle - Generate a sealed evidence bundle for air-gap GRC integration
