name: stave exempt
synopsis: |
    Manage risk acceptances (acknowledgments, exceptions, exemptions)
description: |-
    CRUD interface for managing formal risk acceptance records.

    Subcommands:
      acknowledge   Add a formal risk acceptance
      except        Add an operational suppression
      exempt        Add a scope exclusion
      list          List all active entries
      remove        Mark an acknowledgment as revoked
      upcoming      Show entries approaching expiry
      lint          Lint the acceptance file
      suggest       Suggest exemptions for chronic/oscillating findings
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for exempt
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
see_also:
    - stave - Configuration safety evaluator
    - stave exempt acknowledge - Add a formal risk acceptance
    - stave exempt asset - Add a scope exclusion (exemption)
    - stave exempt except - Add an operational suppression
    - stave exempt export - Export risk register as OSCAL POA&M
    - stave exempt history - Show full audit trail including expired entries
    - stave exempt lint - Lint the acceptance file
    - stave exempt list - List all active risk acceptances
    - stave exempt remove - Mark an acknowledgment as revoked
    - stave exempt suggest - Suggest exemptions for chronic/oscillating findings
    - stave exempt upcoming - Show acceptances approaching expiry
