name: stave prove history
synopsis: Show proof result timeline
description: |-
    Display the timeline of proof results from the history JSONL file.

    Shows when each property held, when it was violated, and calculates
    continuous compliance percentage and MTTR.

    Inputs:
      --dir          Directory containing history.jsonl (required)
      --property     Filter to this query name
      --since        Show results since this date (YYYY-MM-DD)
      --format, -f   Output format: text (default), json

    Exit codes:
      0   History displayed
      2   Input error
usage: stave prove history [flags]
options:
    - name: dir
      usage: directory containing history.jsonl (required)
    - name: format
      shorthand: f
      default_value: text
      usage: 'output format: text, json'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for history
    - name: property
      usage: filter to this query name
    - name: since
      usage: show results since this date (YYYY-MM-DD)
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave prove history --dir proofs/
      stave prove history --dir proofs/ --property bastion-ssh --format json
      stave prove history --dir proofs/ --since 2026-01-01
see_also:
    - stave prove - Run Z3 SMT queries against a Stave assessment
