name: stave expand
synopsis: Show every control sharing a structural defect archetype
description: |
    Expand a finding or archetype into the family of controls that
    detect the same class of structural defect across services.

    When a single finding fires, its archetype identifies every other place
    the same defect can manifest in your infrastructure. Use --finding to
    pivot from a specific control, --archetype to start from a known class,
    or --list to see all archetypes.

    Inputs:
      --archetype <id>     Archetype ID (e.g., ghost-reference)
      --finding <id>       Control ID to look up the archetype from
      --list               List all archetypes with control counts
      --format text|json   Output format (default: text)
      --snapshots <dir>    Path to observations dir (optional; enables
                           snapshot coverage section)
      --controls <dir>     Control definitions directory (default: controls)

    Outputs:
      stdout: archetype summary, controls grouped by service, optional
              snapshot coverage and recommended commands.
      stderr: errors only.

    Exit codes:
      0   success
      2   input error (missing flags, unknown archetype/finding)
      4   internal error (control loader failure)
      130 SIGINT
usage: stave expand [flags]
options:
    - name: archetype
      usage: archetype ID to expand (e.g., ghost-reference)
    - name: controls
      shorthand: i
      default_value: controls
      usage: control definitions directory
    - name: finding
      usage: |
        control ID to expand from (e.g., CTL.ROUTE53.DANGLING.S3.001)
    - name: format
      shorthand: f
      default_value: text
      usage: 'output format: text or json'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for expand
    - name: list
      default_value: "false"
      usage: list all archetypes with control counts
    - name: no-pager
      default_value: "false"
      usage: never page output, even on a terminal
    - name: snapshots
      usage: observations directory for snapshot coverage check
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      # List all archetypes with control counts
      stave expand --list

      # Expand an archetype into its control family
      stave expand --archetype ghost-reference

      # Pivot from a known finding to its sibling controls
      stave expand --finding CTL.ROUTE53.DANGLING.S3.001

      # JSON output for tooling
      stave expand --archetype ghost-reference --format json
see_also:
    - stave - Configuration safety evaluator
