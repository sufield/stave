name: stave contract show
synopsis: Show the agent-facing contract for an asset type
description: |
    Show emits everything an agent needs to populate observations for
    one asset type:

      - the per-asset JSON Schema path
      - the property paths the catalog reads, with type, control count,
        chain count, and a "required vs optional" hint
      - any Steampipe mapping under contracts/steampipe/

    Use --list to enumerate every asset type with at least one
    applicable_asset_types declaration in the catalog, showing whether
    each has a schema and a Steampipe mapping.

    Inputs:
      --asset-type T     Asset type to show (e.g. aws_s3_bucket)
      --list             List every asset type with controls (no --asset-type)
      --controls DIR     Control catalog (default: controls)
      --chains DIR       Chain catalog (default: chains)
      --steampipe DIR    Directory of Steampipe mappings (default: contracts/steampipe)
      --format F         text (default) | json

    Exit codes:
      0   Success
      2   Invalid input (missing flag, unknown asset type)
      4   Internal error (catalog load failure)
usage: stave contract show [flags]
options:
    - name: asset-type
      usage: asset type to inspect (e.g. aws_s3_bucket)
    - name: chains
      usage: 'chain catalog directory (default: embedded chains)'
    - name: controls
      shorthand: i
      usage: 'control catalog directory (default: embedded catalog)'
    - name: format
      shorthand: f
      default_value: text
      usage: 'output format: text | json'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for show
    - name: list
      default_value: "false"
      usage: list every asset type with controls
    - name: no-pager
      default_value: "false"
      usage: never page output, even on a terminal
    - name: steampipe
      default_value: contracts/steampipe
      usage: Steampipe mapping directory
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      # Detailed view for one type
      stave contract show --asset-type aws_s3_bucket

      # All types with at-a-glance schema + mapping presence
      stave contract show --list

      # Machine-readable
      stave contract show --asset-type aws_iam_role --format json
see_also:
    - stave contract - Inspect Stave's per-asset-type input contracts
