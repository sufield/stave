name: stave forge new
synopsis: Interactive control authoring wizard
description: |-
    Create a new custom security control interactively. The wizard prompts
    for control metadata, lets you browse property paths from a real snapshot,
    and shows live CEL evaluation before writing files.

    Use --non-interactive to accept all inputs from flags (equivalent to make forge).

    Exit Codes:
      0   Control generated successfully
      2   Invalid input or missing required flags
      4   Internal error

    Examples:
      stave forge new --snapshot obs.json

      stave forge new --non-interactive \
        --id CTL.S3.TAGS.001 \
        --name "S3 buckets must have team tag" \
        --field properties.storage.tags.team \
        --op missing \
        --severity high \
        --remediation "Add a team tag"
usage: stave forge new [flags]
options:
    - name: asset-type
      default_value: aws_s3_bucket
      usage: asset type for fixtures
    - name: compliance
      usage: compliance refs (key=value,...)
    - name: domain
      default_value: exposure
      usage: 'domain: exposure | identity | governance'
    - name: field
      usage: predicate field path
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for new
    - name: id
      usage: control ID (e.g. CTL.S3.TAGS.001)
    - name: kind
      usage: asset kind filter
    - name: name
      usage: control name
    - name: non-interactive
      default_value: "false"
      usage: accept all inputs from flags, skip wizard
    - name: op
      default_value: eq
      usage: predicate operator
    - name: out
      default_value: testdata/e2e
      usage: output base directory
    - name: remediation
      usage: remediation action text
    - name: scope-tags
      default_value: aws
      usage: comma-separated scope tags
    - name: severity
      default_value: high
      usage: 'severity: critical | high | medium | low'
    - name: snapshot
      usage: snapshot for path discovery and live preview
    - name: value
      default_value: "true"
      usage: unsafe value
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave forge new --snapshot obs.json
      stave forge new --non-interactive --id CTL.S3.TAGS.001 --name "..." --field ... --remediation "..."
see_also:
    - stave forge - Author and test custom controls
