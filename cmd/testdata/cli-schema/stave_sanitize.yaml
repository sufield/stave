name: stave sanitize
synopsis: Sanitize a snapshot for cross-boundary sharing
description: |-
    Replace ARNs, account IDs, and sensitive fields with deterministic
    tokens for safe cross-boundary sharing. The sanitized snapshot remains
    evaluable by stave apply.

    Default sanitization hashes asset IDs and replaces 12-digit account
    IDs in property values. Custom rules can be provided via --rules.

    Inputs:
      --snapshot PATH   Observation snapshot JSON file (required)
      --rules PATH      Custom sanitization rules YAML (optional)
      --out PATH        Output file path (required)

    Exit Codes:
      0   Sanitized snapshot written
      2   Invalid input
usage: stave sanitize [flags]
options:
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for sanitize
    - name: out
      usage: output file path (required)
    - name: rules
      usage: path to custom sanitization rules YAML
    - name: snapshot
      usage: path to observation snapshot JSON (required)
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: |4-
      stave sanitize --snapshot snapshot.json --out sanitized.json
      stave sanitize --snapshot snapshot.json --rules rules.yaml --out sanitized.json
see_also:
    - stave - Configuration safety evaluator
