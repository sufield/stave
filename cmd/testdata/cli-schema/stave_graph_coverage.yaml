name: stave graph coverage
synopsis: Show which controls cover which assets
description: |-
    Coverage outputs a graph showing control→asset edges.

    Purpose: Visualize policy coverage — find uncovered assets, see control
    scope, and understand protection density on high-value assets.

    Uses the same matching logic as apply: for each control, tests its
    unsafe_predicate against each asset from the latest observation snapshot.

    Output Formats:
      --format dot    DOT graph (default) — pipe to graphviz for rendering
      --format json   Machine-readable JSON with edges and uncovered assets

    Examples:
      # Output DOT graph to stdout
      stave graph coverage --controls ./controls --observations ./obs

      # Render as PNG (requires graphviz)
      stave graph coverage --controls ./controls --observations ./obs | dot -Tpng > coverage.png

      # JSON output with jq
      stave graph coverage --controls ./controls --observations ./obs --format json | jq .

      # Sanitize asset identifiers
      stave graph coverage --controls ./controls --observations ./obs --sanitize

    Exit Codes:
      0   - Coverage graph generated successfully
      2   - Invalid input or configuration error
      4   - Internal error
      130 - Interrupted (SIGINT)

    Offline-only: reads local files; makes zero network connections; no cloud credentials.
usage: stave graph coverage [flags]
options:
    - name: controls
      shorthand: i
      default_value: controls
      usage: Path to control definitions directory
    - name: format
      shorthand: f
      default_value: dot
      usage: 'Output format: dot or json'
    - name: help
      shorthand: h
      default_value: "false"
      usage: help for coverage
    - name: observations
      shorthand: o
      default_value: observations
      usage: Path to observation snapshots directory
inherited_options:
    - name: allow-symlink-output
      default_value: "false"
      usage: 'Allow writing output through symlinks (default: refuse)'
    - name: cpu-profile
      usage: Write CPU profile to file
    - name: force
      default_value: "false"
      usage: Allow overwriting existing output files
    - name: log-file
      usage: 'Write logs to file (default: stderr)'
    - name: log-format
      default_value: text
      usage: 'Log format: text|json'
    - name: log-level
      usage: 'Log level: debug|info|warn|error (overrides -v)'
    - name: log-timestamps
      default_value: "false"
      usage: Include timestamps in logs (breaks determinism)
    - name: log-timings
      default_value: "false"
      usage: Include timing information (breaks determinism)
    - name: mem-profile
      usage: Write heap profile to file
    - name: no-color
      default_value: "false"
      usage: Disable ANSI colors in output
    - name: path-mode
      usage: |
        Path rendering in errors/logs: base (basename only) or full (absolute paths) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: quiet
      default_value: "false"
      usage: |
        Suppress output (exit code only) Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: require-offline
      default_value: "false"
      usage: |
        Assert offline operation: fail if proxy env vars (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY) are set
    - name: sanitize
      default_value: "false"
      usage: |
        Sanitize infrastructure identifiers (bucket names, ARNs, policies) from output Resolved default may come from STAVE_* env vars, stave.yaml, user config, or built-in.
    - name: show-dev
      default_value: "false"
      usage: |
        In --help, list only development-only commands (default: hide them from the listing)
    - name: strict
      default_value: "false"
      usage: |
        Enable strict integrity checks for embedded registries and references
    - name: verbose
      shorthand: v
      default_value: "0"
      usage: Increase verbosity (-v=INFO, -vv=DEBUG)
    - name: "yes"
      shorthand: "y"
      default_value: "false"
      usage: |
        Auto-confirm all interactive prompts (distinct from --force which controls file overwriting)
example: '  stave graph coverage --controls controls/s3 --observations observations'
see_also:
    - stave graph - Visualize control and asset relationships
