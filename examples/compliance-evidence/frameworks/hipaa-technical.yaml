# HIPAA Technical Safeguards (45 CFR § 164.312) — same pattern
# as soc2-cc.yaml. The Stave-control mapping is derived from
# each control's `compliance.hipaa:` metadata at run time.
framework: HIPAA Technical Safeguards
version: "45 CFR 164.312"
metadata_field: hipaa
controls:
  "164.312(a)(1)":
    title: Access Control — Unique User Identification
    description: >
      Implement technical policies and procedures for
      electronic information systems that maintain electronic
      protected health information to allow access only to
      those persons or software programs that have been
      granted access rights.
    cross_reference: "SOC 2 CC6.1, NIST AC-2"
  "164.312(a)(2)(i)":
    title: Access Control — Automatic Logoff
    description: >
      Implement electronic procedures that terminate an
      electronic session after a predetermined time of
      inactivity.
    cross_reference: "SOC 2 CC6.1, NIST AC-12"
  "164.312(b)":
    title: Audit Controls
    description: >
      Implement hardware, software, and/or procedural
      mechanisms that record and examine activity in
      information systems that contain or use electronic
      protected health information.
    cross_reference: "SOC 2 CC7.2, NIST AU-2, AU-3"
  "164.312(d)":
    title: Person or Entity Authentication
    description: >
      Implement procedures to verify that a person or entity
      seeking access to electronic protected health information
      is the one claimed.
    cross_reference: "SOC 2 CC6.1, NIST IA-2"
  "164.312(c)(1)":
    title: Integrity — Data Modification Detection
    description: >
      Implement policies and procedures to protect electronic
      protected health information from improper alteration or
      destruction.
    cross_reference: "SOC 2 CC6.6, NIST SI-7"
  "164.312(e)(1)":
    title: Transmission Security
    description: >
      Implement technical security measures to guard against
      unauthorized access to electronic protected health
      information that is being transmitted over an electronic
      communications network.
    cross_reference: "SOC 2 CC6.6, NIST SC-8"
