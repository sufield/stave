version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - stavedev

linters:
  enable:
    - containedctx
    - depguard
    - durationcheck
    - errcheck
    - errorlint
    - fatcontext
    - forcetypeassert
    - gocritic
    - gosec
    - govet
    - ineffassign
    - nestif
    - nilerr
    - nilnesserr
    - noctx
    - predeclared
    - recvcheck
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - wastedassign
  settings:
    depguard:
      rules:
        headless-core:
          files:
            - "internal/**"
          deny:
            - pkg: "github.com/spf13/cobra"
              desc: "Core logic must remain headless; CLI dependencies belong in cmd/"
            - pkg: "github.com/spf13/pflag"
              desc: "Core logic must remain headless; CLI dependencies belong in cmd/"
        core-no-aws:
          files:
            - "internal/core/**"
          deny:
            - pkg: "github.com/*/stave/internal/adapters/aws/**"
              desc: "Core packages must depend on port interfaces, not AWS adapters"
        cmd-no-infra:
          files:
            - "cmd/**"
          deny:
            - pkg: "github.com/*/stave/internal/infra/**"
              desc: "CLI adapters must not know about infrastructure"
    gocritic:
      disable-all: true
      enabled-checks:
        - appendAssign
        - boolExprSimplify
        - deferInLoop
        - emptyStringTest
        - initClause
        - nestingReduce
        - singleCaseSwitch
        - sloppyLen
        - switchTrue
        - unnecessaryBlock
    govet:
      enable:
        - shadow
    recvcheck:
      # Built-in exclusions cover Marshal* but not Unmarshal* methods.
      # Unmarshal* must use pointer receivers (they mutate the receiver)
      # while value types correctly use value receivers for everything else.
      # Private helpers (assign, parseAndAssign, ensureInit) serve the
      # unmarshal path and also need pointer receivers.
      exclusions:
        # Deserialization methods must use pointer receivers
        - "*.UnmarshalJSON"
        - "*.UnmarshalText"
        - "*.UnmarshalYAML"
        - "*.UnmarshalXML"
        - "*.UnmarshalBinary"
        - "*.GobDecode"
        # Private helpers that serve the unmarshal path
        - "*.assign"
        - "*.parseAndAssign"
        - "*.ensureInit"
        # Mutating methods on otherwise-value types (returned by value
        # from accessors, so non-mutating methods must stay value receivers)
        - "*.Record"
        - "*.RecordObservation"
        - "*.checkContracts"
        - "*.FindAsset"
        - "*.addIssue"
        - "*.Set"
        - "*.SetSensitive"
        - "*.Prepare"
        - "*.collect"
    nestif:
      min-complexity: 12
    revive:
      rules:
        - name: unused-parameter
          disabled: true
        - name: var-naming
          disabled: true
        - name: receiver-naming
          disabled: true
    errcheck:
      # fmt.Fprintf/Fprintln writes to stdout/stderr are best-effort terminal
      # output — errors are not actionable. Close/Remove errors are similarly
      # non-actionable in cleanup paths.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - os.Remove
        - os.RemoveAll
  exclusions:
    generated: strict
    paths:
      - (^|/)testdata($|/)
      - (^|/)fixtures($|/)
      - (^|/)examples($|/)
    rules:
      - path: _test\.go
        linters:
          - errorlint
          - forcetypeassert
          - gosec
          - errcheck
          - noctx
          - unparam
      - path: _test\.go
        linters:
          - cyclop
          - gocognit
          - funlen
          - dupl

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports

output:
  formats:
    text:
      path: stdout
      colors: true
