version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - stavedev

linters:
  enable:
    - containedctx
    - depguard
    - durationcheck
    - errcheck
    - errorlint
    - errname
    - forbidigo
    - fatcontext
    - forcetypeassert
    - gocognit
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - funlen
    - nestif
    - nilerr
    - nilnesserr
    - noctx
    - predeclared
    - recvcheck
    - revive
    - staticcheck
    - perfsprint
    - unconvert
    - unparam
    - unused
    - wastedassign
    - wrapcheck
  settings:
    depguard:
      rules:
        headless-core:
          # Core-airgap: everything outside the adapter packages is
          # banned from importing cobra or pflag — either directly,
          # or transitively through cliflags / cmdctx. The adapter
          # packages (anything under cmd/, plus cliflags and cmdctx
          # by name) are excluded from this rule so they can
          # translate cobra into plain data and vice versa.
          list-mode: lax
          files:
            - "!**/cmd/**"
            - "!**/cliflags/**"
            - "!**/cmdctx/**"
          deny:
            - pkg: "github.com/spf13/cobra"
              desc: "cobra is a CLI adapter; keep it out of application/domain code"
            - pkg: "github.com/spf13/pflag"
              desc: "pflag is a CLI adapter; keep it out of application/domain code"
            - pkg: "github.com/sufield/stave/cmd/cmdutil/cliflags"
              desc: "cliflags transitively imports cobra; core code should depend on internal/config (GlobalSettings) instead"
            - pkg: "github.com/sufield/stave/cmd/cmdutil/cmdctx"
              desc: "cmdctx transitively imports cobra; core code should receive resolved context/logger values"
        core-no-aws:
          files:
            - "internal/core/**"
          deny:
            - pkg: "github.com/*/stave/internal/adapters/aws/**"
              desc: "Core packages must depend on port interfaces, not AWS adapters"
        cmd-no-infra:
          files:
            - "cmd/**"
          deny:
            - pkg: "github.com/*/stave/internal/infra/**"
              desc: "CLI adapters must not know about infrastructure"
        gaps-facade-only:
          # Facade ratchet: cmd/gaps consumes pkg/stave only. The
          # orchestration (loading snapshots/controls/chains, calling
          # the gap analyzer) moved into pkg/stave.Gaps in the Step 0
          # migration probe (see docs/architecture/pkg-stave-facade.md).
          # When a future cmd/gaps change tempts a quick `internal/`
          # import, this rule rejects it at lint time and the sibling
          # cmd/gaps/architecture_test.go rejects it at test time.
          # Add commands to this list as they migrate; do not weaken
          # an existing entry.
          files:
            - "cmd/gaps/**"
          deny:
            - pkg: "github.com/sufield/stave/internal/**"
              desc: "cmd/gaps is facade-only — add capability to pkg/stave, then consume it"
        readiness-facade-only:
          # Step 2 of the facade migration. Same rule shape as
          # gaps-facade-only; cmd/readiness now consumes
          # pkg/stave.Readiness exclusively. The orchestration and
          # loading code that used to live here moved into
          # pkg/stave/readiness.go and shares the loadControlsOrBuiltin
          # + loadChainsOptional helpers with [Gaps].
          files:
            - "cmd/readiness/**"
          deny:
            - pkg: "github.com/sufield/stave/internal/**"
              desc: "cmd/readiness is facade-only — add capability to pkg/stave, then consume it"
    gocritic:
      disable-all: true
      enabled-checks:
        - appendAssign
        - boolExprSimplify
        - deferInLoop
        - emptyStringTest
        - hugeParam
        - initClause
        - nestingReduce
        - rangeValCopy
        - singleCaseSwitch
        - sloppyLen
        - switchTrue
        - unnecessaryBlock
      settings:
        hugeParam:
          # ControlDefinition is 584 bytes after the Iter 5.1 ForbiddenState
          # UnsafePredicate addition. Raising the threshold avoids cascading
          # pointer rewrites across the public-API callsites that pass the
          # struct by value to satisfy the PredicateEval signature
          # (controldef.PredicateEval is fixed; changing it ripples through
          # every CEL evaluator + every test stub). Hot-path internal sites
          # (isTriggered, checkUnsafe, computeAssetStates) DO take the
          # struct by pointer to skip the per-call copy — those are
          # narrower internal helpers, not signature-bound boundaries.
          sizeThreshold: 600
        rangeValCopy:
          sizeThreshold: 128
    govet:
      enable:
        - shadow
    recvcheck:
      # We allow mixed receivers in two cases:
      #
      # 1. Initialization methods (pointer receiver on value types)
      #    Unmarshal/decode/assign methods must use pointer receivers because
      #    they mutate the receiver. The built-in Marshal* exclusions don't
      #    cover the Unmarshal side or private helpers that serve it.
      #
      # 2. Value types with controlled mutation
      #    Types like ObservationStats, ExposureHistory, and Snapshot are
      #    returned by value from accessors to enforce immutability during
      #    analysis. Their read-only methods use value receivers. Only the
      #    single mutating method (Record, Prepare, etc.) uses a pointer
      #    receiver — this is intentional to prevent accidental mutation
      #    through returned copies.
      exclusions:
        # --- Group 1: Initialization (deserialization + helpers) ---
        - "*.UnmarshalJSON"
        - "*.UnmarshalText"
        - "*.UnmarshalYAML"
        - "*.UnmarshalXML"
        - "*.UnmarshalBinary"
        - "*.GobDecode"
        - "*.assign"
        - "*.parseAndAssign"
        - "*.ensureInit"
        # --- Group 2: Controlled mutation on value types ---
        - "*.Record"
        - "*.RecordObservation"
        - "*.checkContracts"
        - "*.FindAsset"
        - "*.addIssue"
        - "*.Set"
        - "*.SetSensitive"
        - "*.Prepare"
        - "*.collect"
    nestif:
      min-complexity: 12
    funlen:
      # Calibrated against the current codebase: max prod function is
      # `builtinAliases` (208 lines — a static alias table, not complex);
      # max statement count is `renderTrendTable` at 85. Ceilings sit
      # just above those so no existing function fails, but new code
      # above the bar is caught. Tighten over time as outliers refactor.
      # See docs/audits/lint-complexity-baseline.md for the ratchet plan.
      lines: 210
      statements: 90
    gocyclo:
      # Production max cyclomatic complexity is 31 (mergeEdgeProperties
      # in internal/adapters/graph/builder.go). Ceiling at 32 catches
      # new code above that bar without forcing immediate refactoring.
      min-complexity: 32
    gocognit:
      # Production max cognitive complexity is 84 (stringifiedPolicyFacts
      # in cmd/exportsir/facts.go). Ceiling at 85 — same ratchet logic.
      # cyclop is intentionally not enabled — it overlaps gocyclo with a
      # different metric scale, and the playbook says pick one.
      min-complexity: 85
    revive:
      rules:
        - name: unused-parameter
          disabled: true
        - name: var-naming
          disabled: true
        - name: receiver-naming
          disabled: true
    errcheck:
      # fmt.Fprintf/Fprintln writes to stdout/stderr are best-effort terminal
      # output — errors are not actionable. Close/Remove errors are similarly
      # non-actionable in cleanup paths.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - os.Remove
        - os.RemoveAll
    wrapcheck:
      # wrapcheck's defaults already ignore fmt.Errorf, errors.New, errors.Join,
      # errors.Unwrap, and the conventional .Wrap*/.WithMessage*/.WithStack
      # helpers. The signatures below extend that list with Stave-specific
      # error-construction helpers — wrapping their results would be
      # double-wrapping.
      extra-ignore-sigs:
        - .WithHint(            # ui.WithHint annotates an error with a fix hint
        - .WithNextCommand(     # ui.WithNextCommand decorates with a "try X" hint
        - ui.UserError(         # constructs a user-facing error message
        - ui.EnumError(         # constructs a user-facing enum-validation error
      ignore-sig-regexps:
        # Stream-writer output. Errors are surfaced via errcheck's exclude-
        # functions and rarely actionable. Wrapping them adds noise without
        # debugging value.
        - func fmt\.Fprint
        - \(io\.Writer\)\.Write
        - \(\*bufio\.Writer\)\.Flush
        - \(\*encoding/csv\.Writer\)\.Error
      ignore-package-globs:
        # Low-level encoding errors at type-boundary code (controldef
        # Marshal/Unmarshal helpers, csv writer). Wrapping at the call site
        # is correct, but at the type-layer wrapping just adds "marshal: "
        # to messages that already say "json: cannot unmarshal …".
        - encoding/*
  exclusions:
    generated: strict
    paths:
      - (^|/)testdata($|/)
      - (^|/)fixtures($|/)
      - (^|/)examples($|/)
      - internal/tools/
    rules:
      # Iteration scope: wrapcheck is enforced only in internal/core/evaluation/engine/
      # (5 violations fixed in this iteration). 397 other production violations
      # are grandfathered. Future iterations widen this allow-list package by
      # package — remove a path from this exclusion and fix its violations in
      # the same iteration. See docs/audits/lint-wrapcheck-rollout.md for the chip-away
      # plan.
      - linters: [wrapcheck]
        path-except: '^internal/core/evaluation/engine/'
      - path: _test\.go
        linters:
          - forcetypeassert
          - gosec
          - errcheck
          - noctx
          - unparam
        # rangeValCopy in tests: 47 issues in engine e2e tests.
        # Deferred — test performance is not a concern.
      - path: _test\.go
        linters:
          - gocritic
        text: "rangeValCopy"
      - path: _test\.go
        linters:
          - cyclop
          - gocognit
          - gocyclo
          - funlen
          - dupl

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports

output:
  formats:
    text:
      path: stdout
      colors: true
