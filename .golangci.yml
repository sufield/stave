version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - stavedev

linters:
  enable:
    - containedctx
    - depguard
    - durationcheck
    - errcheck
    - errorlint
    - errname
    - forbidigo
    - fatcontext
    - forcetypeassert
    - gocritic
    - gosec
    - govet
    - ineffassign
    - nestif
    - nilerr
    - nilnesserr
    - noctx
    - predeclared
    - recvcheck
    - revive
    - staticcheck
    - perfsprint
    - unconvert
    - unparam
    - unused
    - wastedassign
  settings:
    depguard:
      rules:
        headless-core:
          files:
            - "internal/**"
          deny:
            - pkg: "github.com/spf13/cobra"
              desc: "Core logic must remain headless; CLI dependencies belong in cmd/"
            - pkg: "github.com/spf13/pflag"
              desc: "Core logic must remain headless; CLI dependencies belong in cmd/"
        core-no-aws:
          files:
            - "internal/core/**"
          deny:
            - pkg: "github.com/*/stave/internal/adapters/aws/**"
              desc: "Core packages must depend on port interfaces, not AWS adapters"
        cmd-no-infra:
          files:
            - "cmd/**"
          deny:
            - pkg: "github.com/*/stave/internal/infra/**"
              desc: "CLI adapters must not know about infrastructure"
    gocritic:
      disable-all: true
      enabled-checks:
        - appendAssign
        - boolExprSimplify
        - deferInLoop
        - emptyStringTest
        - hugeParam
        - initClause
        - nestingReduce
        - rangeValCopy
        - singleCaseSwitch
        - sloppyLen
        - switchTrue
        - unnecessaryBlock
      settings:
        hugeParam:
          sizeThreshold: 512
        rangeValCopy:
          sizeThreshold: 128
    govet:
      enable:
        - shadow
    recvcheck:
      # We allow mixed receivers in two cases:
      #
      # 1. Initialization methods (pointer receiver on value types)
      #    Unmarshal/decode/assign methods must use pointer receivers because
      #    they mutate the receiver. The built-in Marshal* exclusions don't
      #    cover the Unmarshal side or private helpers that serve it.
      #
      # 2. Value types with controlled mutation
      #    Types like ObservationStats, ExposureHistory, and Snapshot are
      #    returned by value from accessors to enforce immutability during
      #    analysis. Their read-only methods use value receivers. Only the
      #    single mutating method (Record, Prepare, etc.) uses a pointer
      #    receiver — this is intentional to prevent accidental mutation
      #    through returned copies.
      exclusions:
        # --- Group 1: Initialization (deserialization + helpers) ---
        - "*.UnmarshalJSON"
        - "*.UnmarshalText"
        - "*.UnmarshalYAML"
        - "*.UnmarshalXML"
        - "*.UnmarshalBinary"
        - "*.GobDecode"
        - "*.assign"
        - "*.parseAndAssign"
        - "*.ensureInit"
        # --- Group 2: Controlled mutation on value types ---
        - "*.Record"
        - "*.RecordObservation"
        - "*.checkContracts"
        - "*.FindAsset"
        - "*.addIssue"
        - "*.Set"
        - "*.SetSensitive"
        - "*.Prepare"
        - "*.collect"
    nestif:
      min-complexity: 12
    revive:
      rules:
        - name: unused-parameter
          disabled: true
        - name: var-naming
          disabled: true
        - name: receiver-naming
          disabled: true
    errcheck:
      # fmt.Fprintf/Fprintln writes to stdout/stderr are best-effort terminal
      # output — errors are not actionable. Close/Remove errors are similarly
      # non-actionable in cleanup paths.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - os.Remove
        - os.RemoveAll
  exclusions:
    generated: strict
    paths:
      - (^|/)testdata($|/)
      - (^|/)fixtures($|/)
      - (^|/)examples($|/)
      - internal/tools/
    rules:
      - path: _test\.go
        linters:
          - forcetypeassert
          - gosec
          - errcheck
          - noctx
          - unparam
        # rangeValCopy in tests: 47 issues in engine e2e tests.
        # Deferred — test performance is not a concern.
      - path: _test\.go
        linters:
          - gocritic
        text: "rangeValCopy"
      - path: _test\.go
        linters:
          - cyclop
          - gocognit
          - funlen
          - dupl

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports

output:
  formats:
    text:
      path: stdout
      colors: true
