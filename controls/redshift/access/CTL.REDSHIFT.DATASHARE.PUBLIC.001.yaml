dsl_version: ctrl.v1
id: CTL.REDSHIFT.DATASHARE.PUBLIC.001
name: Redshift Datashare Must Not Allow Publicly Accessible Consumers
description: >
  Redshift datashares can be created with
  `AllowPubliclyAccessibleConsumers=true` — a setting that permits a
  datashare to be consumed by clusters whose `PubliclyAccessible`
  flag is set. Combining a datashare with public consumers
  effectively re-exports warehouse data to any internet-reachable
  cluster the consumer account creates, bypassing the producer's
  network controls entirely. This is distinct from the cross-account
  share check: a cross-account share to a trusted partner is fine,
  but allowing that partner to consume from a public-facing cluster
  reintroduces the exposure the producer's PUBLIC.001 control was
  preventing.
domain: exposure
severity: critical
compliance:
  nist_800_53_r5: AC-3
  soc2: CC6.6
  pci_dss_v4.0: 1.3.4
  ccm_v4:
  - DSP-17
  - IVS-03
scope_tags:
- aws
- redshift
taxonomy:
  - compliance-mapping
  - network-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_redshift_cluster
params:
  attack_stage: exfiltration
remediation:
  description: >
    Datashare permits consumption by clusters that are publicly
    accessible. The datashare's data can leave a private VPC via
    a consumer's public-facing cluster.
  action: >
    Update the datashare with
    `aws redshift modify-data-share --data-share-arn <arn> --no-allow-publicly-accessible-consumers`.
    Audit any consumer cluster ARNs to confirm none are themselves
    publicly accessible.
unsafe_predicate:
  all:
  - field: properties.database.kind
    op: eq
    value: redshift_cluster
  - field: properties.database.datashare.allows_publicly_accessible_consumers
    op: eq
    value: true
