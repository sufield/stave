dsl_version: ctrl.v1
id: CTL.COGNITO.GHOST.POSTCONFIRM.001
name: Cognito Post-Confirmation Lambda Trigger References Deleted Function
description: >
  Cognito post-confirmation Lambda trigger has
  been deleted. Confirmation succeeds (the user
  is verified) but post-confirmation processing —
  user provisioning, group assignment, downstream
  account creation — fails silently.
domain: audit
severity: high
archetype: ghost-reference
compliance:
  owasp_nhi: "NHI1"
  soc2: "CC6.1, CC7.1, CC8.1"
  nist_800_53_r5: "CM-2, CM-3"
  pci_dss_v4.0: "8.2"
  fedramp_moderate: "CM-3"
  iso_27001_2022: "A.5.16, A.8.5"
  ccm_v4: ["IAM-09"]
scope_tags:
  - aws
  - cognito
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
  blast_radius:
    type: governance
    scope: account
    multiplier: 2.5
remediation:
  description: >
    Post-confirmation Lambda is gone. New users
    get verified accounts but no downstream
    provisioning.
  action: >
    Redeploy the Lambda or remove
    post_confirmation. Audit recently confirmed
    users for missing downstream state (group
    membership, profile records, role
    assignments) and backfill.
  example: |
    {
      "identity": {
        "kind": "cognito_user_pool",
        "cognito": {
          "trigger_type": "post_confirmation",
          "trigger_lambda_arn": "arn:aws:lambda:us-east-1:111122223333:function:cog-postconfirm",
          "trigger_lambda_exists": true,
          "has_ghost_trigger": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: cognito_user_pool
    - field: properties.identity.cognito.trigger_type
      op: eq
      value: post_confirmation
    - field: properties.identity.cognito.has_ghost_trigger
      op: eq
      value: true
defect: >
  Cognito post-confirmation trigger references a
  deleted Lambda function.
infection: >
  Post-confirmation triggers fire after a user
  completes verification (email or phone code).
  Common uses: writing the user record into the
  application database, assigning Cognito groups
  based on signup attributes, sending welcome
  emails, granting initial entitlements. With
  the Lambda deleted, the user is confirmed in
  Cognito but the downstream side effects don't
  fire. The user logs in successfully but
  finds no profile, no group, no entitlement.
  The application breaks for that user even
  though Cognito reports success.
failure: >
  Confirmed users stuck without downstream
  provisioning. The post-confirmation Lambda
  was deleted; user records are partial.
tests:
  - name: ghost post-confirmation trigger fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cognito-idp:us-east-1:111122223333:userpool/us-east-1_abcdefg"
      asset_type: aws_cognito_user_pool
      vendor: aws
      properties:
        identity:
          kind: cognito_user_pool
          cognito:
            trigger_type: "post_confirmation"
            trigger_lambda_arn: "arn:aws:lambda:us-east-1:111122223333:function:deleted-fn"
            trigger_lambda_exists: false
            has_ghost_trigger: true
  - name: live post-confirmation trigger passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:cognito-idp:us-east-1:111122223333:userpool/us-east-1_abcdefg"
      asset_type: aws_cognito_user_pool
      vendor: aws
      properties:
        identity:
          kind: cognito_user_pool
          cognito:
            trigger_type: "post_confirmation"
            trigger_lambda_arn: "arn:aws:lambda:us-east-1:111122223333:function:cog-postconfirm"
            trigger_lambda_exists: true
            has_ghost_trigger: false
