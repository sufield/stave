dsl_version: ctrl.v1
id: CTL.COGNITO.OIDC.SECRETROT.001
name: Cognito OIDC Provider Client Secret Not Rotated
description: >
  Cognito OIDC identity provider's client
  secret has not been rotated in 90+ days.
  Long-lived OIDC client secrets become
  high-value credentials over time;
  compromise of a secret rotated infrequently
  yields long-term federated access.
domain: identity
severity: medium
compliance:
  owasp_nhi: "NHI3"
  cis_aws_v3.0: "1.16"
  soc2: "CC6.1, CC8.1"
  nist_800_53_r5: "IA-5"
  pci_dss_v4.0: "8.6"
  fedramp_moderate: "IA-5"
  iso_27001_2022: "A.5.17, A.8.5"
  ccm_v4: ["IAM-09"]
scope_tags:
  - aws
  - cognito
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_cognito_user_pool
params:
  attack_stage: credential_access
  blast_radius:
    type: governance
    scope: account
    multiplier: 1.5
remediation:
  description: >
    OIDC client secret aged past rotation
    threshold.
  action: >
    Generate a new client secret at the IdP,
    update the Cognito provider with the new
    value: aws cognito-idp update-identity-
    provider with provider_details containing
    the new client_secret. Revoke the old
    secret at the IdP after a brief overlap
    window. For high-trust deployments,
    automate the rotation cycle on a
    quarterly cadence.
  example: |
    {
      "identity": {
        "kind": "cognito_user_pool",
        "cognito": {
          "oidc_client_secret_age_days": 30,
          "oidc_secret_rotation_overdue": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: cognito_user_pool
    - field: properties.identity.cognito.oidc_secret_rotation_overdue
      op: eq
      value: true
defect: >
  Cognito OIDC provider client secret has not
  been rotated in 90+ days.
infection: >
  OIDC client secrets are bearer credentials
  Cognito uses to authenticate to the IdP's
  token endpoint. Long-lived secrets are
  long-lived attack surface — compromised
  through any of the usual paths
  (configuration leak, infrastructure
  takeover, insider threat), they remain
  valid until manual rotation. A 90-day
  rotation cadence bounds the worst-case
  exposure window without imposing
  pathological operational overhead.
  Production secrets that haven't rotated
  in over a year are typical and frequent
  — the rotation discipline tends to atrophy
  once the integration works.
failure: >
  Stale OIDC client secret. Long-lived
  bearer credential beyond standard rotation
  window.
tests:
  - name: overdue rotation fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cognito-idp:us-east-1:111122223333:userpool/us-east-1_abc"
      asset_type: aws_cognito_user_pool
      vendor: aws
      properties:
        identity:
          kind: cognito_user_pool
          cognito:
            oidc_client_secret_age_days: 365
            oidc_secret_rotation_overdue: true
  - name: recently rotated passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:cognito-idp:us-east-1:111122223333:userpool/us-east-1_abc"
      asset_type: aws_cognito_user_pool
      vendor: aws
      properties:
        identity:
          kind: cognito_user_pool
          cognito:
            oidc_client_secret_age_days: 30
            oidc_secret_rotation_overdue: false
