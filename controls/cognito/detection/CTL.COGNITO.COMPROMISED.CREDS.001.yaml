dsl_version: ctrl.v1
id: CTL.COGNITO.COMPROMISED.CREDS.001
name: Cognito Must Block Sign-In with Compromised Credentials
description: >
  Cognito user pools with advanced security must block sign-in
  attempts using credentials detected in known breaches. Requires
  advanced security ENFORCED mode with compromised-credentials
  policy set to BLOCK on sign-in events.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "IA-5"
  soc2: "CC6.1"
  ccm_v4: ["IAM-16"]
scope_tags:
  - aws
  - cognito
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
remediation:
  description: Cognito does not block sign-in with compromised credentials.
  action: >
    Enable advanced security in ENFORCED mode and set the
    compromised-credentials policy to BLOCK for sign-in events.
  example: |
    {
      "identity": {
        "kind": "user_pool",
        "security": { "blocks_compromised_credentials": true }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: user_pool
    - field: properties.identity.security.blocks_compromised_credentials
      op: eq
      value: false
