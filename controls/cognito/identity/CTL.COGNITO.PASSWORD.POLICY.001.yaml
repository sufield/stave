dsl_version: ctrl.v1
id: CTL.COGNITO.PASSWORD.POLICY.001
name: Cognito User Pools Must Enforce a Strong Password Policy
description: >
  Weak Cognito password policies enable brute force and dictionary
  attacks against user accounts. A minimum length of 12 characters
  with complexity requirements significantly increases the effort
  required for credential attacks. Temporary passwords with long
  validity windows allow attackers to reuse intercepted temporary
  passwords for extended periods.
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "IA-5"
  aws_security_hub: "Cognito.3"
  mitre_attack: "TA0006"
  ccm_v4: ["AIS-01", "IAM-15"]
scope_tags:
  - aws
  - cognito
type: unsafe_state
params:
  attack_stage: credential_access
remediation:
  description: >
    Cognito user pool has a weak password policy. Minimum length is
    below 12 or complexity requirements are not enforced.
  action: >
    aws cognito-idp update-user-pool --user-pool-id <id>
    --policies PasswordPolicy='{MinimumLength=12,
    RequireUppercase=true,RequireLowercase=true,
    RequireNumbers=true,RequireSymbols=true,
    TemporaryPasswordValidityDays=3}'
  example: |
    {
      "identity": {
        "kind": "user_pool",
        "password_policy": {
          "strong": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: user_pool
    - field: properties.identity.password_policy.strong
      op: eq
      value: false
