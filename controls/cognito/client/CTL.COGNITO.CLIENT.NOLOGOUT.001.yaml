dsl_version: ctrl.v1
id: CTL.COGNITO.CLIENT.NOLOGOUT.001
name: Cognito App Client Has No Logout URL Configured
description: >
  Cognito app client has no logout URLs
  configured. Users cannot complete the
  hosted-UI logout flow back to the
  application's logout-confirmation page.
  Sessions become harder to terminate cleanly
  — users either remain logged in via
  refresh tokens or land on a generic page
  after logout.
domain: governance
severity: medium
compliance:
  soc2: "CC6.1, CC8.1"
  nist_800_53_r5: "AC-12, IA-2"
  pci_dss_v4.0: "8.6"
  fedramp_moderate: "AC-12"
  iso_27001_2022: "A.5.17"
  ccm_v4: ["IAM-09"]
scope_tags:
  - aws
  - cognito
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_cognito_app_client
params:
  attack_stage: persistence
  blast_radius:
    type: governance
    scope: account
    multiplier: 1.5
remediation:
  description: >
    No logout URL configured. Logout flow
    can't redirect users back to the
    application.
  action: >
    Add a logout URL pointing at the
    application's signed-out landing page:
    aws cognito-idp update-user-pool-client
    with --logout-urls including
    https://app.example.com/signed-out.
    The application should also call the
    Cognito logout endpoint
    (auth.example.com/logout) and use revoke
    token revocation to invalidate refresh
    tokens server-side.
  example: |
    {
      "identity": {
        "kind": "cognito_app_client",
        "cognito": {
          "logout_urls": ["https://app.example.com/signed-out"],
          "has_logout_url": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: cognito_app_client
    - field: properties.identity.cognito.has_logout_url
      op: eq
      value: false
defect: >
  Cognito app client has no logout URL.
infection: >
  Cognito's hosted UI provides a logout
  endpoint that ends the Cognito session and
  redirects to a configured logout URL. With
  no logout URL configured, the application
  can sign the user out locally (clearing
  cookies, dropping tokens) but the Cognito
  session persists — the next visit to the
  hosted UI may auto-sign-in via the still-
  valid Cognito session. Combined with long
  refresh-token lifetimes, this defeats the
  user's expectation of 'sign out means
  signed out.' The fix is straightforward
  configuration; the cost of skipping it is
  silent session leakage that surfaces only
  when a user expects logout to mean logout.
failure: >
  Logout flow incomplete. Users can't be
  properly signed out from the Cognito side;
  hosted-UI sessions persist beyond
  application logout.
tests:
  - name: no logout URL fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cognito-idp:us-east-1:111122223333:userpool/us-east-1_abc/client/abc123"
      asset_type: aws_cognito_user_pool_client
      vendor: aws
      properties:
        identity:
          kind: cognito_app_client
          cognito:
            logout_urls: []
            has_logout_url: false
  - name: logout URL configured passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:cognito-idp:us-east-1:111122223333:userpool/us-east-1_abc/client/abc123"
      asset_type: aws_cognito_user_pool_client
      vendor: aws
      properties:
        identity:
          kind: cognito_app_client
          cognito:
            logout_urls: ["https://app.example.com/signed-out"]
            has_logout_url: true
