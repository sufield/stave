dsl_version: ctrl.v1
id: CTL.GLUE.JOB.SECRETS.001
name: Glue ETL Jobs Must Not Store Secrets in Job Arguments
description: >
  Glue ETL job DefaultArguments must not contain plaintext secrets
  (passwords, API keys, tokens). Job arguments are visible in the
  AWS console, CLI output, and CloudTrail logs. Use Secrets Manager
  or Parameter Store references instead.
domain: exposure
severity: critical
compliance:
  nist_800_53_r5: "IA-5(7)"
  soc2: "CC6.1"
  pci_dss_v4.0: "3.4.1"
  ccm_v4: ["IAM-16", "DSP-17"]
scope_tags:
  - aws
  - glue
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - logging
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_glue_job
params:
  attack_stage: credential_access
remediation:
  description: >
    Glue ETL job contains plaintext secrets in DefaultArguments.
  action: >
    Move secrets to AWS Secrets Manager or SSM Parameter Store.
    Reference them in job scripts using boto3 at runtime instead
    of passing them as job arguments.
  example: |
    {
      "compute": {
        "kind": "glue_job",
        "secrets": { "has_plaintext_secrets": false }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: glue_job
    - field: properties.compute.secrets.has_plaintext_secrets
      op: eq
      value: true
