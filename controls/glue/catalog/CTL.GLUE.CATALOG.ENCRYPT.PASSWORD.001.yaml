dsl_version: ctrl.v1
id: CTL.GLUE.CATALOG.ENCRYPT.PASSWORD.001
name: Glue Data Catalog Must Encrypt Connection Passwords
description: >
  The Glue Data Catalog must encrypt connection passwords at rest
  using KMS. Connection properties store JDBC passwords, Redshift
  credentials, and other data store authentication material.
  Unencrypted passwords are readable by any principal with
  glue:GetConnection access.
domain: encryption
severity: high
compliance:
  nist_800_53_r5: "SC-28"
  soc2: "CC6.1"
  pci_dss_v4.0: "3.4.1"
  ccm_v4: ["CEK-03", "IAM-16"]
scope_tags:
  - aws
  - glue
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
remediation:
  description: >
    Glue Data Catalog does not encrypt connection passwords.
    Credentials for data stores are stored in plaintext.
  action: >
    Enable connection password encryption in the Data Catalog
    encryption settings with a KMS key.
  example: |
    {
      "governance": {
        "kind": "glue_catalog",
        "encryption": { "connection_passwords_encrypted": true }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: glue_catalog
    - field: properties.governance.encryption.connection_passwords_encrypted
      op: eq
      value: false
