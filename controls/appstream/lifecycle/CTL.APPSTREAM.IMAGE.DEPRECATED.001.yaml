dsl_version: ctrl.v1
id: CTL.APPSTREAM.IMAGE.DEPRECATED.001
name: AppStream Image Must Not Use Deprecated Platform
description: >
  AppStream 2.0 images must not use deprecated OS platforms.
  Windows Server 2012 R2 reached end-of-life in October 2023 and
  no longer receives security patches from Microsoft. AppStream
  images built on deprecated platforms expose streaming sessions
  to unpatched OS vulnerabilities. Users connect to these sessions
  with their corporate credentials — a compromised streaming
  instance is a credential-harvesting opportunity.
domain: exposure
severity: low
compliance:
  nist_800_53_r5: "SI-2"
  soc2: "CC7.1"
scope_tags:
  - aws
  - appstream
taxonomy:
  - compliance-mapping
  - deprecation
type: unsafe_state
classification: state_assertion
params:
  attack_stage: persistence
remediation:
  description: >
    AppStream image uses a deprecated OS platform that no longer
    receives security patches.
  action: >
    Rebuild the AppStream image on a supported platform
    (Windows Server 2019 or 2022). Create a new image builder
    with the updated platform, install your applications, and
    create a new image. Update your fleet to use the new image.
  example: |
    {
      "compute": {
        "kind": "appstream_image",
        "platform": {
          "is_deprecated": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: appstream_image
    - field: properties.compute.platform.is_deprecated
      op: eq
      value: true
