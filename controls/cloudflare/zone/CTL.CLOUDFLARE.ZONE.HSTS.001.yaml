dsl_version: ctrl.v1
id: CTL.CLOUDFLARE.ZONE.HSTS.001
name: Cloudflare Zone HSTS Not Enabled
description: >
  HTTP Strict Transport Security not enabled. Browsers allow
  downgrade to HTTP via man-in-the-middle.
domain: encryption
severity: high
compliance:
  nist_800_53_r5: "SC-8"
  soc2: "CC6.7"
scope_tags: [cloudflare]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Cloudflare Zone HSTS Not Enabled — finding detected.
  action: Remediate per control description.
  example: |
    {"cloudflare": {"zone": {"kind": "zone_config", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.cloudflare.zone.kind
      op: eq
      value: zone_config
    - field: properties.cloudflare.zone.hsts_enabled
      op: eq
      value: false
