dsl_version: ctrl.v1
id: CTL.CLOUDFLARE.ZONE.DMARC.001
name: Cloudflare Zone Missing DMARC Record
description: >
  No DMARC record. Email spoofing for this domain is not
  detectable by receiving mail servers.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SC-7"
  soc2: "CC6.6"
scope_tags: [cloudflare]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Cloudflare Zone Missing DMARC Record — finding detected.
  action: Remediate per control description.
  example: |
    {"cloudflare": {"zone": {"kind": "zone_config", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.cloudflare.zone.kind
      op: eq
      value: zone_config
    - field: properties.cloudflare.zone.has_dmarc_record
      op: eq
      value: false
