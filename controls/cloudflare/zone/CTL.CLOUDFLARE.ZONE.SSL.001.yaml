dsl_version: ctrl.v1
id: CTL.CLOUDFLARE.ZONE.SSL.001
name: Cloudflare SSL Mode Not Full (Strict)
description: >
  SSL mode is Off, Flexible, or Full instead of Full (Strict). Flexible
  encrypts client-to-Cloudflare but sends plaintext to origin — false HTTPS.
domain: encryption
severity: critical
compliance:
  nist_800_53_r5: "SC-8"
  pci_dss_v4: "4.1"
  soc2: "CC6.7"
  hipaa: "164.312(e)(1)"
scope_tags: [cloudflare]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Cloudflare SSL Mode Not Full (Strict) — finding detected.
  action: Remediate per control description.
  example: |
    {"cloudflare": {"zone": {"kind": "zone_config", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.cloudflare.zone.kind
      op: eq
      value: zone_config
    - field: properties.cloudflare.zone.ssl_mode_is_strict
      op: eq
      value: false
