dsl_version: ctrl.v1
id: CTL.CLOUDFLARE.ZONE.DEVMODE.001
name: Development Mode Enabled in Production
description: >
  Development mode enabled. Disables caching and may bypass
  security features. Never for production zones.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "CM-6"
  soc2: "CC6.1"
scope_tags: [cloudflare]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types: [cloudflare_zone]
params:
  attack_stage: initial_access
remediation:
  description: Development Mode Enabled in Production — finding detected.
  action: Remediate per control description.
  example: |
    {"cloudflare": {"zone": {"kind": "zone_config", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.cloudflare.zone.kind
      op: eq
      value: zone_config
    - field: properties.cloudflare.zone.development_mode
      op: eq
      value: true
