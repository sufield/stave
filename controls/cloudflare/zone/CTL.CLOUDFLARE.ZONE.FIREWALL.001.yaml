dsl_version: ctrl.v1
id: CTL.CLOUDFLARE.ZONE.FIREWALL.001
name: Cloudflare Zone Has No Firewall Blocking Rules
description: >
  No custom firewall rules in block mode. Zone has no custom
  filtering beyond managed rulesets.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "SC-7"
  soc2: "CC6.6"
scope_tags: [cloudflare]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Cloudflare Zone Has No Firewall Blocking Rules — finding detected.
  action: Remediate per control description.
  example: |
    {"cloudflare": {"zone": {"kind": "zone_config", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.cloudflare.zone.kind
      op: eq
      value: zone_config
    - field: properties.cloudflare.zone.firewall_blocking_rules
      op: eq
      value: false
