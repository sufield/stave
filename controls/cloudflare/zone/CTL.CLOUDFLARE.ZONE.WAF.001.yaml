dsl_version: ctrl.v1
id: CTL.CLOUDFLARE.ZONE.WAF.001
name: Cloudflare Zone WAF Not Enabled
description: >
  WAF not enabled. No application-layer inspection. All traffic
  passes to origin unfiltered.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SC-7"
  pci_dss_v4: "6.4"
  soc2: "CC6.6"
scope_tags: [cloudflare]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Cloudflare Zone WAF Not Enabled — finding detected.
  action: Remediate per control description.
  example: |
    {"cloudflare": {"zone": {"kind": "zone_config", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.cloudflare.zone.kind
      op: eq
      value: zone_config
    - field: properties.cloudflare.zone.waf_enabled
      op: eq
      value: false
