dsl_version: ctrl.v1
id: CTL.CLOUDFLARE.ZONE.GEOLOCATION.001
name: IP Geolocation Not Enabled
description: >
  CF-IPCountry header not added. Origin cannot implement
  geographic access controls.
domain: exposure
severity: low
compliance:
  nist_800_53_r5: "SC-7"
  soc2: "CC6.6"
scope_tags: [cloudflare]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: IP Geolocation Not Enabled — finding detected.
  action: Remediate per control description.
  example: |
    {"cloudflare": {"zone": {"kind": "zone_config", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.cloudflare.zone.kind
      op: eq
      value: zone_config
    - field: properties.cloudflare.zone.ip_geolocation
      op: eq
      value: false
