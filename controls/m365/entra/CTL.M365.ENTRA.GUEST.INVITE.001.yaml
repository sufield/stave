dsl_version: ctrl.v1
id: CTL.M365.ENTRA.GUEST.INVITE.001
name: Guest Invitations Not Restricted to Admins
description: >
  Any user can invite guest users. Unrestricted invitations
  expand the tenant identity perimeter.
domain: identity
severity: medium
compliance:
  cis_m365_v4: "7.1"
  nist_800_53_r5: "AC-2"
  soc2: "CC6.2"
scope_tags: [m365]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Guest Invitations Not Restricted to Admins — finding detected.
  action: Remediate per control description.
  example: |
    {"m365": {"identity": {"kind": "entra_config", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.m365.identity.kind
      op: eq
      value: entra_config
    - field: properties.m365.identity.guest.invite_restricted_to_admins
      op: eq
      value: false
