dsl_version: ctrl.v1
id: CTL.M365.ENTRA.CA.DIRSYNC.001
name: Directory Sync Account Not Excluded from CA
description: >
  Sync service accounts not excluded from CA. CA policies may
  break AD synchronization.
domain: identity
severity: medium
compliance:
  cis_m365_v4: "5.7"
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
scope_tags: [m365]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Directory Sync Account Not Excluded from CA — finding detected.
  action: Remediate per control description.
  example: |
    {"m365": {"identity": {"kind": "conditional_access_policy", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.m365.identity.kind
      op: eq
      value: conditional_access_policy
    - field: properties.m365.identity.ca.dir_sync_excluded
      op: eq
      value: false
