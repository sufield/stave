dsl_version: ctrl.v1
id: CTL.M365.EXCHANGE.SHAREDMAILBOX.001
name: Shared Mailbox Direct Sign-In Not Disabled
description: >
  Shared mailboxes allow direct sign-in with credentials. Shared
  mailboxes often have passwords but no MFA — well-known MFA bypass.
domain: identity
severity: high
compliance:
  cis_m365_v4: "10.7"
  nist_800_53_r5: "IA-2"
  soc2: "CC6.1"
scope_tags: [m365]
taxonomy:
  - compliance-mapping
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
applicable_asset_types: [m365_resource]
params:
  attack_stage: initial_access
remediation:
  description: Shared Mailbox Direct Sign-In Not Disabled — finding detected.
  action: Remediate per control description.
  example: |
    {"m365": {"exchange": {"kind": "exchange_org", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.m365.exchange.kind
      op: eq
      value: exchange_org
    - field: properties.m365.exchange.shared_mailbox_signin_disabled
      op: eq
      value: false
