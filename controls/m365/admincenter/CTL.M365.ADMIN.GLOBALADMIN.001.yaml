dsl_version: ctrl.v1
id: CTL.M365.ADMIN.GLOBALADMIN.001
name: Global Admin Count Not Within Safe Range
description: >
  Fewer than 2 or more than 4 global admins. Single point of
  failure or excessive attack surface.
domain: identity
severity: high
compliance:
  cis_m365_v4: "15.2"
  nist_800_53_r5: "AC-2"
  soc2: "CC6.1"
scope_tags: [m365]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Global Admin Count Not Within Safe Range — finding detected.
  action: Remediate per control description.
  example: |
    {"m365": {"placeholder": true}}
unsafe_predicate:
  all:
    - field: properties.m365.admin.kind
      op: eq
      value: admincenter_config
    - field: properties.m365.admin.global_admin_count_compliant
      op: eq
      value: false
