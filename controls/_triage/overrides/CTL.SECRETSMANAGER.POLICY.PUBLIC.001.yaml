control: CTL.SECRETSMANAGER.POLICY.PUBLIC.001
defect: >
  The Secrets Manager resource policy grants access to Principal "*"
  or unauthenticated principals without scoping conditions. Any AWS
  principal can retrieve the secret value.
infection: >
  An attacker calls secretsmanager:GetSecretValue and retrieves the
  secret — typically database credentials, API keys, certificates,
  or other authentication material. The secret value is returned in
  plaintext. Unlike S3 or SQS public access, secret retrieval
  directly yields authentication credentials.
failure: >
  Credential exposure via public secret. An attacker retrieves
  production credentials and uses them to access the downstream
  system the secret protects — databases, APIs, third-party services.
