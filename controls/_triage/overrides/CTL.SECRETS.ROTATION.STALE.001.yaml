control: CTL.SECRETS.ROTATION.STALE.001
defect: >
  Secret rotation interval has been exceeded by more than 2x
  since the last successful rotation.
infection: >
  Rotation is enabled. The interval is configured. But the
  credential hasn't actually changed in the recorded number
  of days — multiple times the configured interval. This
  means rotation has been failing silently. Common causes:
  the rotation Lambda was deleted, the rotation Lambda
  errors on every execution (code bug, network issue,
  permission change after a role rename), rotation was
  manually paused and never resumed, or the rotation
  schedule was misconfigured. The result: the credential is
  static while appearing rotated. The audit report shows
  "rotation enabled, interval 30 days." The reality is
  "same password for 90+ days."
failure: >
  False rotation. Rotation is configured but the credential
  hasn't changed in many multiples of the intended
  interval.
