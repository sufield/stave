control: CTL.VPC.SG.EGRESS.001
defect: >
  Security group allows all egress traffic to 0.0.0.0/0 (all protocols,
  all ports).
infection: >
  Unrestricted egress is the default configuration for every AWS security
  group. Most organizations never modify it. An attacker who gains code
  execution on any resource behind this SG can exfiltrate data to any
  destination, establish reverse shells to any C2 server, tunnel data
  through DNS, and send stolen credentials to any endpoint.
failure: >
  Unrestricted outbound communication. A compromised resource exfiltrates
  data, establishes C2, or sends stolen credentials to any internet
  destination.
