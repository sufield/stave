control: CTL.IAM.PASSWORD.REUSE.001
defect: >
  The IAM account password policy prevents reuse of fewer than 24
  previous passwords.
infection: >
  Without sufficient reuse prevention, users cycle between a small
  set of passwords when forced to rotate. A reuse history of 3 means
  users alternate between 4 passwords — an attacker who obtains any
  historical password can predict the current one.
failure: >
  Password rotation defeat. Users cycle through a small set of
  known passwords, negating the security value of mandatory password
  rotation.
