control: CTL.SECRETS.POLICY.SPRAWL.001
defect: >
  Secret resource policy exceeds the 10-statement threshold.
infection: >
  Resource policies grow over time as new consumers are
  added without removing old ones. Sprawled secret policies
  hide problems: a Statement granting cross-account access
  to an account that's been decommissioned, a Statement
  granting GetSecretValue to a principal that has been
  deleted (CTL.SECRETS.GHOST.POLICY.PRINCIPAL.001), a
  Statement granting both GetSecretValue and PutSecretValue
  to the same application principal
  (CTL.SECRETS.POLICY.READWRITE.001). With 15+ statements
  every audit becomes a deep manual review and any
  Statement can hide effectively-public access by combining
  a broad Resource pattern, a permissive Action list, and
  an absent Condition.
failure: >
  Unauditable credential access surface. The accumulated
  policy hides drift, decommissioned consumers, and ghost
  references.
