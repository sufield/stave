control: CTL.VPC.SG.EGRESS.DNS.001
defect: >
  Security group allows DNS (port 53) egress to 0.0.0.0/0 instead of
  VPC DNS resolver.
infection: >
  DNS tunneling encodes data in DNS queries and responses. An attacker
  sends queries to a domain they control — each query contains exfiltrated
  data. DNS traffic is rarely inspected. Restricting DNS egress to the VPC
  resolver prevents direct DNS communication with external resolvers.
failure: >
  Data exfiltration via DNS tunneling to an attacker-controlled domain.
