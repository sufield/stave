control: CTL.SNS.POLICY.SETTOPICATTRS.BROAD.001
defect: >
  SNS topic policy grants sns:SetTopicAttributes to a broad
  principal class.
infection: >
  SetTopicAttributes can modify the topic's access policy,
  encryption settings, delivery policy, and display name.
  A principal with SetTopicAttributes can grant themselves
  any other SNS action by editing the policy — adding
  themselves as Subscribe principal (data exfiltration),
  adding Publish access for a service principal without
  source restriction (confused deputy), or disabling
  encryption (data exposure). It is a privilege-escalation
  primitive on the topic. Combined with policy sprawl
  (CTL.SNS.POLICY.SPRAWL.001), the attacker's modification
  blends into the existing noise. SetTopicAttributes should
  be administrative-only.
failure: >
  Topic-policy self-modification. Any matching principal
  can edit the topic policy to grant themselves additional
  access; SetTopicAttributes is a one-step privilege
  escalation.
