control: CTL.SECRETS.CROSSACCOUNT.NOKMS.001
defect: >
  Secret grants cross-account access via Secrets Manager
  policy but the KMS key policy does not grant Decrypt to
  the same account.
infection: >
  Secrets Manager secrets are encrypted with a KMS key. To
  read a secret, a principal needs BOTH:
  secretsmanager:GetSecretValue (permission to call the
  Secrets Manager API) AND kms:Decrypt on the secret's
  encryption key (permission to decrypt the encrypted
  value). When a secret is shared cross-account via
  resource policy but the KMS key policy doesn't include
  the external account, the external account's
  GetSecretValue call fails with an access denied on the
  KMS Decrypt step. The Secrets Manager permission looks
  correct; the failure comes from KMS. This is a
  cross-service permission mismatch — one service grants
  access, another blocks it — and is uniquely confusing
  because the IAM/secret policy review surface looks
  complete.
failure: >
  Cross-service permission mismatch. Secret access granted
  by Secrets Manager policy but blocked by KMS key policy.
