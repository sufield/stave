control: CTL.CLOUDTRAIL.CONFIG.GLOBALEVENTS.001
defect: >
  CloudTrail trail does not include global service events.
infection: >
  Global service events are generated by services that
  don't operate in a specific region — IAM, STS,
  CloudFront, Route 53. These services generate events
  in us-east-1 regardless of where the API call was
  made. With IncludeGlobalServiceEvents = false: IAM
  changes (CreateUser, AttachRolePolicy, CreateAccessKey)
  are not logged by this trail. STS events (AssumeRole,
  GetSessionToken) are not logged. An attacker who
  creates an IAM user, attaches AdministratorAccess, and
  assumes a cross-account role — all unrecorded. The
  most critical identity and access events are missing
  from the audit trail.
failure: >
  Identity events unrecorded. IAM, STS, CloudFront, and
  Route 53 events excluded from the audit trail.
