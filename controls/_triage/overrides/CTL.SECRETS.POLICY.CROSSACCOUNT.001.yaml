control: CTL.SECRETS.POLICY.CROSSACCOUNT.001
defect: >
  Secret resource policy grants cross-account access without
  aws:PrincipalOrgID.
infection: >
  Cross-account secret access without organizational
  boundary means any IAM principal in the specified external
  account with secretsmanager:GetSecretValue in their IAM
  policy can read the credential. If the external account
  is: compromised (an attacker reads the production database
  password from another account), decommissioned (the
  account is closed but the policy persists — if the
  account ID is reclaimed, the new owner gets secret
  access), or a partner (the partner's IAM controls
  determine who in their account reads the credential).
  PrincipalOrgID ensures only accounts currently in the
  organization can read the secret; without it, the
  external boundary is whoever happens to own the named
  account ID.
failure: >
  Credential accessible outside organizational boundary.
  External account principals can read the secret without
  org-membership verification.
