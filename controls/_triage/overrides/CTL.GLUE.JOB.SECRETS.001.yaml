control: CTL.GLUE.JOB.SECRETS.001
defect: >
  The Glue ETL job stores plaintext secrets (passwords, API keys,
  tokens) in DefaultArguments. These values are visible in the AWS
  console, CLI output, and CloudTrail logs.
infection: >
  An attacker with glue:GetJob or CloudTrail read access retrieves
  the job arguments and extracts credentials. The credentials
  typically grant access to production data stores — RDS databases,
  Redshift clusters, S3 buckets, or third-party APIs that the ETL
  pipeline connects to.
failure: >
  Credential exposure via job metadata. Plaintext secrets in Glue
  job arguments are accessible through multiple vectors (console,
  API, CloudTrail) and grant direct access to downstream data
  stores.
