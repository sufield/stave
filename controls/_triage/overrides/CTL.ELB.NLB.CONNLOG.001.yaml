control: CTL.ELB.NLB.CONNLOG.001
defect: >
  Network Load Balancer has connection logging
  disabled.
infection: >
  Connection logs (introduced for NLB in 2024)
  record TLS handshake outcomes, negotiated
  cipher suites, client SNI values, and
  handshake results. These data fields are
  absent from access logs. For TLS
  troubleshooting (a particular client can't
  connect, certain ciphers are negotiated
  unexpectedly, SNI routing isn't working),
  connection logs are the primary forensic
  surface. Without them, debugging requires
  packet capture or client-side traces.
failure: >
  No TLS handshake audit. Connection-level
  TLS events not captured for forensics or
  debugging.
