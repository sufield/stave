control: CTL.SECRETS.LIFECYCLE.ORPHAN.DATABASE.001
defect: >
  Secret contains credentials for a database that no longer
  exists.
infection: >
  The secret stores a database password for a database that
  no longer exists. The credential is useless — it
  authenticates to nothing. But the secret persists: the
  resource policy grants GetSecretValue to principals (who
  can read a useless credential), the KMS key encrypts the
  secret (consuming key operations), rotation may still be
  configured (rotation Lambda attempts to rotate a credential
  for a non-existent database — rotation fails silently),
  and the secret consumes Secrets Manager cost. More
  importantly, the orphaned secret clutters the credential
  inventory — auditors must evaluate every secret, including
  dead ones, and the dead ones distract from real findings.
failure: >
  Orphaned credential infrastructure. Secret stores a
  credential for a deleted database; the policy, rotation,
  and KMS coupling persist without purpose.
