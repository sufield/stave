control: CTL.SECRETS.REPLICA.NONCOMPLIANT.REGION.001
defect: >
  Secret is replicated to a region outside data-residency
  authorization.
infection: >
  Data residency requirements treat credentials as
  protected data — often more strictly than general data,
  because credentials grant access to all data they
  authenticate. A replica in a non-compliant region means:
  the credential value is stored at rest in that region's
  Secrets Manager, the credential can be retrieved by
  principals with GetSecretValue and access to that
  region, and the region's CloudTrail and KMS posture
  determines the surrounding controls. If the credential
  authenticates a database holding regulated data, the
  credential leaving the data-residency boundary is a
  policy violation independent of the database's own
  region.
failure: >
  Credential material in unauthorized region. Data
  residency violation; credential can be retrieved
  outside compliant boundary.
