control: CTL.SECRETS.GHOST.DELETION.REFERENCED.001
defect: >
  Secret is scheduled for deletion while still referenced by
  active resources.
infection: >
  When a secret is scheduled for deletion, a recovery window
  begins (minimum 7 days, maximum 30 days). During the
  window: GetSecretValue fails for every caller, the secret
  can be recovered (RestoreSecret). When the window expires,
  the secret is permanently deleted with no recovery. Every
  service that references the secret fails: Lambda functions
  that retrieve the credential on cold start fail to start.
  ECS tasks that inject the secret via valueFrom fail to
  launch. RDS Proxy that authenticates via the secret can't
  connect to the database. The failure is immediate (during
  the deletion window) and permanent (after the window
  expires).
failure: >
  Cascading authentication failure. Secret deletion will
  break every service that depends on it for credentials.
