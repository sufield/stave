control: CTL.IAM.ESCALATE.PUTROLEPOLICY.001
defect: >
  The role has iam:PutRolePolicy scoped to its own role ARN. Any
  workload running under this role can write an arbitrary inline
  policy onto itself.
infection: >
  A single PutRolePolicy call authors an inline policy granting
  "Action": "*" on "Resource": "*" on the role. The role's
  effective permissions expand immediately. Unlike managed policy
  attachment, inline policies are embedded directly in the role and
  don't appear in the managed policy console view — they are easier
  to overlook in audit.
failure: >
  Privilege escalation to admin via self-authored inline policy.
  Any workload or principal under this role can grant itself
  unrestricted permissions with a single API call.
