control: CTL.ECS.IMAGE.DIGEST.001
defect: >
  The ECS task definition references a container image by tag
  instead of digest. Tags are mutable — the same tag can point
  to different images over time.
infection: >
  An attacker with push access to the registry (or a compromised
  CI/CD pipeline) can overwrite the tag with a malicious image.
  The next deployment or scale-out event pulls the malicious image
  under the trusted tag name without any change to the task
  definition.
failure: >
  Supply chain compromise via tag mutation. Malicious code executes
  in production with the service's task role permissions.
