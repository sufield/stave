dsl_version: ctrl.v1
id: CTL.LIGHTSAIL.DB.PUBLIC.001
name: Lightsail Databases Must Not Be Publicly Accessible
description: >
  Lightsail managed databases must not be publicly accessible.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SC-7"
  soc2: "CC6.6"
  ccm_v4: ["IVS-03"]
scope_tags: [aws, lightsail]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Lightsail database is publicly accessible.
  action: Disable public mode on the database.
  example: |
    {"database": {"kind": "lightsail_database", "access": {"publicly_accessible": false}}}
unsafe_predicate:
  all:
    - field: properties.database.kind
      op: eq
      value: lightsail_database
    - field: properties.database.access.publicly_accessible
      op: eq
      value: true
