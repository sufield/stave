dsl_version: ctrl.v1
id: CTL.ORG.SCP.EMR.DENY.001
name: SCP Does Not Deny EMR Usage
description: >
  Organization SCPs do not deny EMR service usage in member accounts.
  EMR provisions EC2 instances with overpermissioned default security
  groups (ElasticMapReduce-master and ElasticMapReduce-slave) that
  allow broad inbound access. EMR clusters run with IAM roles that
  may have S3 and KMS access, and the default security groups are
  created automatically if none are specified. Without an SCP denying
  elasticmapreduce:*, any IAM principal can provision compute clusters
  with network exposure and broad data access.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "CM-7"
  soc2: "CC6.6"
  ccm_v4: ["IAM-10"]
scope_tags:
  - aws
  - organizations
taxonomy:
  - account-governance
  - resource-sprawl
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_organization
params:
  attack_stage: detection_evasion
observation_fields:
  - organization.kind
  - organization.scp.denies_elasticmapreduce
remediation:
  description: >
    Organization SCPs do not deny EMR usage in member accounts.
  action: >
    Add an SCP denying elasticmapreduce:* for all principals. Exclude
    specific accounts if EMR is intentionally used.
  example: |
    {
      "organization": {
        "kind": "scp_policy_set",
        "scp": {
          "denies_elasticmapreduce": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.organization.kind
      op: eq
      value: scp_policy_set
    - field: properties.organization.scp.denies_elasticmapreduce
      op: ne
      value: true
tests:
  - name: "no EMR deny fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:organizations::111122223333:organization/o-abc123"
      asset_type: aws_organization
      vendor: aws
      properties:
        organization:
          kind: scp_policy_set
          scp: {denies_elasticmapreduce: false}
  - name: "EMR deny passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:organizations::444455556666:organization/o-def456"
      asset_type: aws_organization
      vendor: aws
      properties:
        organization:
          kind: scp_policy_set
          scp: {denies_elasticmapreduce: true}
