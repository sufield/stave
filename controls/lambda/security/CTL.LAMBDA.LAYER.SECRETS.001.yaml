dsl_version: ctrl.v1
id: CTL.LAMBDA.LAYER.SECRETS.001
name: Lambda Layers Must Not Contain Embedded Secrets
description: >
  Lambda layers must not contain embedded secrets (API keys,
  database credentials, certificates, private keys). Unlike
  environment variables (detectable via ENV.SECRETS.001), layer
  contents are opaque archives accessible to anyone with
  lambda:GetLayerVersion permission. Secrets in layers persist
  across function versions and are not encrypted by KMS.
domain: exposure
severity: high
compliance:
  owasp_nhi: "NHI2"
  nist_800_53_r5: "IA-5"
  soc2: "CC6.1"
  pci_dss_v4.0: "8.3.4"
  ccm_v4: ["DSP-17", "IAM-05"]
scope_tags:
  - aws
  - lambda
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
remediation:
  description: >
    Lambda layer contains embedded secrets accessible to anyone
    with layer read permission.
  action: >
    Remove secrets from layer contents. Use Secrets Manager or
    SSM Parameter Store for credentials retrieved at runtime.
    Republish the layer without sensitive files.
  example: |
    {
      "compute": {
        "kind": "function",
        "layers": { "has_embedded_secrets": false }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: function
    - field: properties.compute.layers.has_embedded_secrets
      op: eq
      value: true
