dsl_version: ctrl.v1
id: CTL.LAMBDA.ENV.SECRETS.001
name: Lambda Functions Must Not Store Secrets in Environment Variables
description: >
  Lambda function environment variables must not contain plaintext secrets
  such as database credentials, API keys, or tokens. Environment variables
  are visible in plaintext to anyone with lambda:GetFunction permission,
  are included in CloudTrail logs for UpdateFunctionConfiguration events,
  and are stored in the Lambda service's configuration store without
  application-level encryption. AWS Secrets Manager and SSM Parameter
  Store SecureString provide encrypted storage with rotation, audit
  logging, and fine-grained access control. Moving secrets out of
  environment variables is the single most impactful Lambda security
  improvement for most functions.
domain: exposure
severity: critical
compliance:
  owasp_nhi: "NHI2"
  nist_800_53_r5: "SC-28"
  fedramp_moderate: "SC-28"
  pci_dss_v4.0: "3.5.1"
  soc2: "CC6.1"
  hipaa: "164.312(a)(2)(iv)"
  ccm_v4: ["CEK-03", "DSP-17"]
scope_tags:
  - aws
  - lambda
type: unsafe_state
classification: state_assertion
params:
  base_impact: 10
  attack_stage: initial_access
  blast_radius:
    type: detection
    scope: account
    multiplier: 2.0
remediation:
  description: >
    Lambda function has plaintext secrets in environment variables.
    Credentials are visible to anyone with lambda:GetFunction permission
    and appear in CloudTrail configuration change logs.
  action: >
    Move secrets to AWS Secrets Manager or SSM Parameter Store
    SecureString. Update the function code to retrieve secrets at runtime
    via the AWS SDK. Remove the plaintext values from the environment
    variable configuration. Use the Lambda Secrets Manager extension for
    cached retrieval with minimal latency impact.
  example: |
    {
      "compute": {
        "kind": "function",
        "env": {
          "has_plaintext_secrets": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: function
    - field: properties.compute.env.has_plaintext_secrets
      op: eq
      value: true
