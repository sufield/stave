dsl_version: ctrl.v1
id: CTL.LAMBDA.ENV.VISIBLE.VERSIONS.001
name: Lambda Published Versions Must Not Retain Stale Environment Variables
description: >
  Lambda functions with multiple published versions whose
  older versions hold environment variables that differ
  from the current ($LATEST) version are surfaced for
  cleanup. Published Lambda versions are immutable
  snapshots of the function configuration — including the
  full environment-variable map at the moment the version
  was published — and the snapshot persists even after
  the live function rotates the credential, removes the
  variable, or migrates to a Secrets Manager reference.
  Anyone with `lambda:GetFunction` against the version-
  qualified ARN can read the historical environment
  block. A database password that was a raw value in
  version 3 is still readable from version 3 a year
  later, even if version 14 is the live one and the
  password has been rotated three times in the meantime.
  The pattern is benign for non-credential env vars
  (feature flags, service URLs); it is a leak when the
  env var ever held a credential. Published-version
  cleanup (DeleteFunction with version qualifier) is the
  remediation; the control is medium because the leak
  requires both `GetFunction` rights AND awareness that
  versions retain history.
domain: secrets
severity: medium
compliance:
  owasp_nhi: "NHI2"
  nist_800_53_r5: "MP-6"
  pci_dss_v4: "3.5"
  ccm_v4: ["DSP-15", "IAM-02"]
scope_tags: [aws, lambda]
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_lambda_function
params:
  attack_stage: credential_access
remediation:
  description: Older Lambda function versions retain environment variables that differ from the current version.
  action: Delete unused published versions; for versions still in use, audit the environment for stale credentials and delete after migration.
  example: |
    {"compute": {"kind": "function", "function": {"old_versions_have_stale_env": false}}}
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: function
    - field: properties.compute.function.old_versions_have_stale_env
      op: eq
      value: true
