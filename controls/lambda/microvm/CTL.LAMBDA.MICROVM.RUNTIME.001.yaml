dsl_version: ctrl.v1
id: CTL.LAMBDA.MICROVM.RUNTIME.001
name: MicroVM Maximum Runtime Exceeds Organization Limit
description: >
  MicroVM Maximum Runtime Exceeds Organization Limit. Lab control for the Lambda MicroVM validation suite
  (ctf/labs/microvm). Evaluates a captured MicroVM configuration snapshot
  (obs.v0.1) for this invariant.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "AC-6"
scope_tags:
  - aws
  - lambda
  - microvm
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_lambda_microvm
params:
  attack_stage: resilience
remediation:
  description: >
    MicroVM Maximum Runtime Exceeds Organization Limit — finding detected on the captured MicroVM configuration.
  action: >
    Lower the MicroVM maximum duration to within the org limit (<=1800s); 8h is the AWS ceiling, not a target.
  example: |
    {
      "microvm": {
        "kind": "microvm",
        "max_duration_seconds": 900
      }
    }
unsafe_predicate:
  all:
    - field: properties.microvm.kind
      op: eq
      value: microvm
    - field: properties.microvm.max_duration_seconds
      op: gt
      value: 1800
