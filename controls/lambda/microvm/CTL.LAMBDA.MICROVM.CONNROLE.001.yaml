dsl_version: ctrl.v1
id: CTL.LAMBDA.MICROVM.CONNROLE.001
name: MicroVM Network Connector Role Is Over-Privileged
description: >
  MicroVM Network Connector Role Is Over-Privileged. Lab control for the Lambda MicroVM validation suite
  (ctf/labs/microvm). Evaluates a captured MicroVM configuration snapshot
  (obs.v0.1) for this invariant.
domain: identity
severity: high
compliance:
  nist_800_53_r5: "AC-6"
scope_tags:
  - aws
  - lambda
  - microvm
taxonomy:
  - compliance-mapping
  - compute-hardening
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  attack_stage: persistence
remediation:
  description: >
    MicroVM Network Connector Role Is Over-Privileged — finding detected on the captured MicroVM configuration.
  action: >
    Scope the connector role to ENI management only (ec2:Create/Delete/DescribeNetworkInterfaces).
  example: |
    {
      "role": {
        "kind": "iam_role",
        "purpose": "connector",
        "over_privileged": false
      }
    }
unsafe_predicate:
  all:
    - field: properties.role.kind
      op: eq
      value: iam_role
    - field: properties.role.purpose
      op: eq
      value: connector
    - field: properties.role.over_privileged
      op: eq
      value: true
