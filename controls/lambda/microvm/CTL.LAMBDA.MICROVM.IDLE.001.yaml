dsl_version: ctrl.v1
id: CTL.LAMBDA.MICROVM.IDLE.001
name: MicroVM Idle Duration Exceeds Organization Limit
description: >
  MicroVM Idle Duration Exceeds Organization Limit. Lab control for the Lambda MicroVM validation suite
  (ctf/labs/microvm). Evaluates a captured MicroVM configuration snapshot
  (obs.v0.1) for this invariant.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "AC-6"
scope_tags:
  - aws
  - lambda
  - microvm
taxonomy:
  - compliance-mapping
  - trust-decay
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_lambda_microvm
params:
  attack_stage: resilience
remediation:
  description: >
    MicroVM Idle Duration Exceeds Organization Limit — finding detected on the captured MicroVM configuration.
  action: >
    Lower maxIdleDurationSeconds to within the org limit (<=1800s) for agent workloads.
  example: |
    {
      "microvm": {
        "kind": "microvm",
        "idle_policy": {
          "max_idle_duration_seconds": 900
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.microvm.kind
      op: eq
      value: microvm
    - field: properties.microvm.idle_policy.max_idle_duration_seconds
      op: gt
      value: 1800
