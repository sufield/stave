dsl_version: ctrl.v1
id: CTL.LAMBDA.MICROVM.TAGSESSION.001
name: MicroVM Execution Role Trust Policy Missing or Over-Broad sts:TagSession
description: >
  MicroVM Execution Role Trust Policy Missing or Over-Broad sts:TagSession. Lab control for the Lambda MicroVM validation suite
  (ctf/labs/microvm). Evaluates a captured MicroVM configuration snapshot
  (obs.v0.1) for this invariant.
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "AC-6"
scope_tags:
  - aws
  - lambda
  - microvm
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  attack_stage: privilege_escalation
remediation:
  description: >
    MicroVM Execution Role Trust Policy Missing or Over-Broad sts:TagSession — finding detected on the captured MicroVM configuration.
  action: >
    Include sts:TagSession in the trust policy and avoid sts:* wildcards.
  example: |
    {
      "role": {
        "kind": "iam_role",
        "purpose": "execution",
        "trust_session_safe": true
      }
    }
unsafe_predicate:
  all:
    - field: properties.role.kind
      op: eq
      value: iam_role
    - field: properties.role.purpose
      op: eq
      value: execution
    - field: properties.role.trust_session_safe
      op: eq
      value: false
