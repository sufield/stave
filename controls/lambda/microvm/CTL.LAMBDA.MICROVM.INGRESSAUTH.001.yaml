dsl_version: ctrl.v1
id: CTL.LAMBDA.MICROVM.INGRESSAUTH.001
name: MicroVM Ingress Authentication Not Securely Enabled
description: >
  MicroVM Ingress Authentication Not Securely Enabled. Lab control for the Lambda MicroVM validation suite
  (ctf/labs/microvm). Evaluates a captured MicroVM configuration snapshot
  (obs.v0.1) for this invariant.
domain: identity
severity: critical
compliance:
  nist_800_53_r5: "AC-6"
scope_tags:
  - aws
  - lambda
  - microvm
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_lambda_microvm
params:
  attack_stage: initial_access
remediation:
  description: >
    MicroVM Ingress Authentication Not Securely Enabled — finding detected on the captured MicroVM configuration.
  action: >
    Enable ingress authentication and constrain the auth token expiry; never disable ingress auth.
  example: |
    {
      "microvm": {
        "kind": "microvm",
        "ingress": {
          "secure": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.microvm.kind
      op: eq
      value: microvm
    - field: properties.microvm.ingress.secure
      op: eq
      value: false
