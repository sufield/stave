dsl_version: ctrl.v1
id: CTL.LAMBDA.MICROVM.ENTROPY.001
name: MicroVM Does Not Reinitialize Entropy on Resume
description: >
  MicroVM Does Not Reinitialize Entropy on Resume. Lab control for the Lambda MicroVM validation suite
  (ctf/labs/microvm). Evaluates a captured MicroVM configuration snapshot
  (obs.v0.1) for this invariant.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "AC-6"
scope_tags:
  - aws
  - lambda
  - microvm
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_lambda_microvm
params:
  attack_stage: resilience
remediation:
  description: >
    MicroVM Does Not Reinitialize Entropy on Resume — finding detected on the captured MicroVM configuration.
  action: >
    Configure lifecycle hooks that reinitialize entropy on run and resume.
  example: |
    {
      "microvm": {
        "kind": "microvm",
        "entropy_reinit_configured": true
      }
    }
unsafe_predicate:
  all:
    - field: properties.microvm.kind
      op: eq
      value: microvm
    - field: properties.microvm.entropy_reinit_configured
      op: eq
      value: false
