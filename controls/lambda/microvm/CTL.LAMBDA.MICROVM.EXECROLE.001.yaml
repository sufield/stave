dsl_version: ctrl.v1
id: CTL.LAMBDA.MICROVM.EXECROLE.001
name: MicroVM Execution Role Is Over-Privileged
description: >
  MicroVM Execution Role Is Over-Privileged. Lab control for the Lambda MicroVM validation suite
  (ctf/labs/microvm). Evaluates a captured MicroVM configuration snapshot
  (obs.v0.1) for this invariant.
domain: identity
severity: critical
compliance:
  nist_800_53_r5: "AC-6"
scope_tags:
  - aws
  - lambda
  - microvm
taxonomy:
  - compliance-mapping
  - compute-hardening
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  attack_stage: privilege_escalation
remediation:
  description: >
    MicroVM Execution Role Is Over-Privileged — finding detected on the captured MicroVM configuration.
  action: >
    Scope the execution role to least privilege; remove wildcard actions and broad secretsmanager/s3 access.
  example: |
    {
      "role": {
        "kind": "iam_role",
        "purpose": "execution",
        "over_privileged": false
      }
    }
unsafe_predicate:
  all:
    - field: properties.role.kind
      op: eq
      value: iam_role
    - field: properties.role.purpose
      op: eq
      value: execution
    - field: properties.role.over_privileged
      op: eq
      value: true
