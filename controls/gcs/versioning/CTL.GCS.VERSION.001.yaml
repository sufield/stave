dsl_version: ctrl.v1
id: CTL.GCS.VERSION.001
name: Object Versioning Must Be Enabled
description: >
  GCS buckets must have object versioning enabled. Without versioning,
  deleted or overwritten objects cannot be recovered, and ransomware
  attacks that encrypt objects are irreversible.
domain: exposure
severity: medium
compliance:
  cis_gcp_v1.3.0: "5.3"
scope_tags:
  - gcp
  - gcs
type: unsafe_state
params:
  attack_stage: resilience
remediation:
  description: >
    Bucket does not have object versioning enabled. Deleted objects
    cannot be recovered.
  action: >
    Enable versioning. Run:
    gcloud storage buckets update gs://BUCKET --versioning
  example: |
    {
      "storage": {
        "kind": "bucket",
        "versioning": {
          "enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.versioning.enabled
      op: eq
      value: false
