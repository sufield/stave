dsl_version: ctrl.v1
id: CTL.AD.KERB.CLOCKSKEW.001
name: Kerberos Clock Skew Tolerance Must Not Exceed 5 Minutes
description: >
  Maximum clock skew tolerance must not exceed 5 minutes. Large
  skew enables replay attacks on Kerberos tickets.
domain: identity
severity: medium
compliance:
  cis_ad: "1.3.3"
  ccm_v4: ["CEK-04", "IAM-14"]
scope_tags:
  - active_directory
taxonomy:
  - compliance-mapping
  - credential-lifecycle
type: unsafe_state
classification: parameterized_check
params:
  attack_stage: credential_access
remediation:
  description: >
    Kerberos clock skew tolerance exceeds 5 minutes.
  action: >
    Set maximum clock skew to 5 minutes in Kerberos Policy.
unsafe_predicate:
  all:
    - field: properties.kerberos_policy.max_clock_skew_minutes
      op: gt
      value: 5
