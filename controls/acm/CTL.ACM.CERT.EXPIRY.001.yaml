dsl_version: ctrl.v1
id: CTL.ACM.CERT.EXPIRY.001
name: ACM Imported Certificates Must Not Be Near Expiry
description: >
  SSL/TLS certificates imported into ACM must not be within 30 days of
  expiry or already expired. ACM automatically renews certificates it
  provisions (AMAZON_ISSUED) but does not renew imported certificates.
  Imported certificates expire silently on their expiry date with no
  enforcement mechanism — services continue serving traffic on an expired
  certificate until clients reject it. An expired certificate on a
  production load balancer or CloudFront distribution causes TLS
  negotiation failures for all clients that enforce certificate validity.
  For HIPAA and PCI-DSS environments, serving traffic on an expired
  certificate is a direct compliance violation. This control evaluates
  only IMPORTED certificates — AMAZON_ISSUED certificates are auto-renewed
  and out of scope.
domain: exposure
severity: high
compliance:
  owasp_nhi: "NHI7"
  nist_800_53_r5: "SC-12"
  fedramp_moderate: "SC-12"
  pci_dss_v4.0: "4.2.1"
  soc2: "CC6.7"
  hipaa: "164.312(e)(2)(ii)"
  ccm_v4: ["CEK-03", "CEK-04"]
scope_tags:
  - aws
  - acm
type: unsafe_state
classification: state_assertion
params:
  base_impact: 8
  attack_stage: exfiltration
  blast_radius:
    type: detection
    scope: account
    multiplier: 1.0
remediation:
  description: >
    ACM imported certificate is within 30 days of expiry or already
    expired. Services using this certificate will experience TLS
    negotiation failures when clients enforce certificate validity.
  action: >
    Renew or replace the imported certificate. Import the new certificate
    into ACM via aws acm import-certificate. If the certificate was
    originally from a private CA, re-issue from the CA and re-import.
    Consider migrating to an ACM-managed certificate (AMAZON_ISSUED) for
    automatic renewal — ACM provisions free public certificates for
    domains validated via DNS or email. After importing the new
    certificate, verify the associated services (load balancers,
    CloudFront distributions, API Gateway domains) are serving the
    updated certificate.
  example: |
    {
      "certificate": {
        "kind": "imported",
        "imported_near_expiry": false
      }
    }
unsafe_predicate:
  all:
    - field: properties.certificate.kind
      op: eq
      value: imported
    - field: properties.certificate.imported_near_expiry
      op: eq
      value: true
