dsl_version: ctrl.v1
id: CTL.VSPHERE.ESX.ACCOUNT.LOCKOUT.001
name: ESXi Account Lockout Must Be Configured
description: >
  ESXi hosts must have account lockout configured. Without account
  lockout, an attacker can perform unlimited password guessing
  attempts against local ESXi accounts. The DCUI, SSH, and Host
  Client interfaces all accept local credentials. Brute-force
  attacks against the root account or service accounts become
  trivial when there is no lockout threshold to slow or block
  repeated failures.
domain: exposure
severity: high
compliance:
  cis_vmware_esxi_7: "1.3"
  nist_800_53_r5: "AC-7"
  ccm_v4: ["IAM-15", "IVS-04"]
scope_tags:
  - vmware
  - esxi
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - network-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types: [vsphere_vm]
params:
  attack_stage: credential_access
remediation:
  description: >
    Account lockout is not configured on the ESXi host. An attacker
    can perform unlimited password guessing attempts against local
    accounts without being locked out.
  action: >
    Configure account lockout on the ESXi host. In the vSphere
    Client, navigate to Host > Configure > System > Advanced System
    Settings. Set Security.AccountLockFailures to 5 and
    Security.AccountUnlockTime to 900.
  example: |
    {
      "esxi": {
        "account_lockout_enabled": true
      }
    }
unsafe_predicate:
  all:
    - field: properties.esxi.account_lockout_enabled
      op: eq
      value: false
