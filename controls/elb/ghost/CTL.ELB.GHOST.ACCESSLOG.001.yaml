dsl_version: ctrl.v1
id: CTL.ELB.GHOST.ACCESSLOG.001
name: ELB Access Log S3 Bucket Does Not Exist
description: >
  ELB access logging is enabled but the S3 destination
  bucket has been deleted. The configuration shows
  "access logging: enabled" with the bucket name. An
  auditor sees access logging configured. Every log write
  fails silently. Same invisible-harmful pattern as
  CTL.CLOUDTRAIL.GHOST.S3BUCKET.001 — the logging
  appears configured, the destination is gone, the logs
  are silently lost.
domain: exposure
severity: high
archetype: ghost-reference
scope: compound
compliance:
  cis_aws_v3.0: "2.1"
  soc2: "CC7.1, CC7.2"
  nist_800_53_r5: "AU-2, AU-9, CM-2, CM-3"
  pci_dss_v4.0: "10.1, 10.5"
  fedramp_moderate: "AU-2"
  hipaa: "164.312(b)"
  iso_27001_2022: "A.5.16, A.8.15"
  ccm_v4: ["LOG-02", "LOG-08"]
scope_tags:
  - aws
  - elb
taxonomy:
  - compliance-mapping
  - logging
  - trust-decay
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
  blast_radius:
    type: detection
    scope: account
    multiplier: 3.0
remediation:
  description: >
    ELB access-log S3 bucket has been deleted. Logs are
    silently dropped.
  action: >
    Either (a) recreate the bucket with the same name and
    restore the bucket policy granting the regional ELB
    log-delivery service account s3:PutObject, or (b)
    repoint the ELB at an existing audit bucket via
    aws elbv2 modify-load-balancer-attributes — Key
    access_logs.s3.bucket. Verify by triggering traffic
    and confirming a new log file appears in the bucket
    within five minutes. Audit the gap window: every
    request handled while the bucket was missing has no
    access-log record.
  example: |
    {
      "network": {
        "kind": "load_balancer",
        "elb": {
          "access_logging_enabled": true,
          "access_log_bucket": "org-elb-access-logs",
          "access_log_bucket_exists": true,
          "has_ghost_access_log": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: load_balancer
    - field: properties.network.elb.access_logging_enabled
      op: eq
      value: true
    - field: properties.network.elb.has_ghost_access_log
      op: eq
      value: true
defect: >
  ELB access logging targets an S3 bucket that has been
  deleted.
infection: >
  Access logging is enabled — the configuration shows the
  bucket name, the prefix, and "enabled: true." An
  auditor or compliance check sees access logging
  configured and marks it compliant. But the bucket was
  deleted. Every access log write fails silently. No
  request is recorded — who accessed the application,
  from where, when, which paths, which response codes —
  all unrecorded. If a security incident occurs, there
  is no request-level audit trail. The investigation is
  blind to what happened at the load balancer layer.
failure: >
  Silent access log loss. Access logging appears enabled
  but no logs are written because the S3 bucket was
  deleted.
tests:
  - name: ELB with deleted access log bucket fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:elasticloadbalancing:us-east-1:111122223333:loadbalancer/app/prod-alb/abc"
      asset_type: aws_load_balancer
      vendor: aws
      properties:
        network:
          kind: load_balancer
          elb:
            access_logging_enabled: true
            access_log_bucket: "org-elb-access-logs-deleted"
            access_log_bucket_exists: false
            has_ghost_access_log: true
  - name: ELB with active access log bucket passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:elasticloadbalancing:us-east-1:111122223333:loadbalancer/app/prod-alb/abc"
      asset_type: aws_load_balancer
      vendor: aws
      properties:
        network:
          kind: load_balancer
          elb:
            access_logging_enabled: true
            access_log_bucket: "org-elb-access-logs"
            access_log_bucket_exists: true
            has_ghost_access_log: false
