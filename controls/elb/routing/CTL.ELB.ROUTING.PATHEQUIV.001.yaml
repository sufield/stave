dsl_version: ctrl.v1
id: CTL.ELB.ROUTING.PATHEQUIV.001
name: Backend Reachable Via Paths With Inconsistent Security Controls
description: >
  A backend EC2 instance is reachable through more than one ALB/listener/rule
  path, and those paths do not carry equivalent security controls. One path
  enforces authentication (authenticate-oidc/cognito), a source-ip gate, or sits
  behind a WAF; another path reaching the SAME instance does not. The strongest
  path is irrelevant — an attacker takes the weakest one, bypassing the control.

  The master compound for ALB routing: reachability resolves to the instance,
  not the target-group ARN, so two different target groups that share an EC2
  instance are the same backend (instance-level overlap). A listener's default
  rule is just another path. Subsumes the source-ip-gate-bypass case
  (ALB-ROUTING-003). The derived signal
  network.elb.tg_path_controls_inconsistent is computed by the reasoning spec
  examples/alb-routing-path-equivalence/ (Soufflé + Z3, which agree on the
  trap-triplet).

  Inspired by Doyensec CloudsecTidbits No. 5 — Navigating Lax Load Balancers.
  Validated against doyensec/ELBaph.
domain: network
severity: high
scope: compound
corpus_reference: "MITRE:T1190"
compliance:
  nist_800_53_r5: "AC-4"
  soc2: "CC6.1"
  pci_dss_v4.0: "1.3.1"
scope_tags:
  - aws
  - elb
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_elbv2_load_balancer
params:
  attack_stage: initial_access
observation_fields:
  - network.kind
  - network.elb.target_group_arn
  - network.elb.tg_path_controls_inconsistent
  - network.elb.tg_path_inconsistent_dimension
  - network.elb.tg_path_controlled_rule
  - network.elb.tg_path_bypass_rule
  - network.elb.tg_path_shared_instance
remediation:
  description: >
    A backend instance is reachable via multiple routing paths that enforce
    different security controls; the weakest path bypasses the others.
  action: >
    Make every path to the backend carry equivalent controls, or collapse the
    paths. Apply the same authentication action, source-ip condition, and WAF
    association on every ALB/listener/rule that forwards to the shared target
    groups. If an alternate path is unintended, remove the listener rule or
    deregister the instance from the alternate target group. Treat the default
    rule as a path: point it at a fixed 403 response rather than the same backend.
  example: |
    {
      "network": {
        "kind": "target_group",
        "elb": {
          "tg_path_controls_inconsistent": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: target_group
    - field: properties.network.elb.tg_path_controls_inconsistent
      op: eq
      value: true
tests:
  - name: backend reachable via gated ALB-1 and ungated ALB-2 fires (vulnerable)
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:elasticloadbalancing:us-east-1:111122223333:targetgroup/tg-shared/abc"
      asset_type: aws_target_group
      vendor: aws
      properties:
        network:
          kind: target_group
          elb:
            target_group_arn: "arn:aws:elasticloadbalancing:us-east-1:111122223333:targetgroup/tg-shared/abc"
            tg_path_controls_inconsistent: true
            tg_path_inconsistent_dimension: auth
            tg_path_controlled_rule: "rule/alb-1/r1"
            tg_path_bypass_rule: "rule/alb-2/r2"
            tg_path_shared_instance: "i-abc"
  - name: every path carries equivalent controls passes (false-positive trap)
    verdict: PASS
    asset:
      asset_id: "arn:aws:elasticloadbalancing:us-east-1:111122223333:targetgroup/tg-consistent/def"
      asset_type: aws_target_group
      vendor: aws
      properties:
        network:
          kind: target_group
          elb:
            target_group_arn: "arn:aws:elasticloadbalancing:us-east-1:111122223333:targetgroup/tg-consistent/def"
            tg_path_controls_inconsistent: false
  - name: instance shared across two target groups (auth rule vs default rule) fires (false-negative trap — instance-level overlap)
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:elasticloadbalancing:us-east-1:111122223333:targetgroup/tg-catchall/ghi"
      asset_type: aws_target_group
      vendor: aws
      properties:
        network:
          kind: target_group
          elb:
            target_group_arn: "arn:aws:elasticloadbalancing:us-east-1:111122223333:targetgroup/tg-catchall/ghi"
            tg_path_controls_inconsistent: true
            tg_path_inconsistent_dimension: auth
            tg_path_controlled_rule: "rule/alb-1/r1"
            tg_path_bypass_rule: "rule/alb-1/default"
            tg_path_shared_instance: "i-abc"
