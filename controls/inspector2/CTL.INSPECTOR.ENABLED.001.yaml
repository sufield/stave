dsl_version: ctrl.v1
id: CTL.INSPECTOR.ENABLED.001
name: Amazon Inspector Must Be Enabled
description: >
  Amazon Inspector 2 must be enabled for vulnerability scanning of
  EC2, ECR, and Lambda resources. Without Inspector, known
  vulnerabilities in deployed software go undetected.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "RA-5"
  soc2: "CC7.1"
  ccm_v4: ["TVM-02"]
scope_tags: [aws, inspector2]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Amazon Inspector is not enabled.
  action: Enable Inspector 2 for EC2, ECR, and Lambda scanning.
  example: |
    {"governance": {"kind": "inspector_config", "scanner": {"enabled": true}}}
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: inspector_config
    - field: properties.governance.scanner.enabled
      op: eq
      value: false
