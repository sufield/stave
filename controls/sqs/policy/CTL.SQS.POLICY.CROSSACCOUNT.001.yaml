dsl_version: ctrl.v1
id: CTL.SQS.POLICY.CROSSACCOUNT.001
name: SQS Queue Policy Grants Cross-Account Access Without Organizational Boundary
description: >
  SQS queue policy grants actions to principals in external AWS
  accounts without an aws:PrincipalOrgID condition (or an
  equivalent SourceAccount restriction limited to the
  organization's account list). Any principal in the external
  account can perform the granted actions — if the external
  account is compromised, or leaves the organization, the queue
  policy still trusts it. PrincipalOrgID ensures only accounts
  currently in the organization can access the queue. Distinct
  from CTL.SQS.POLICY.PUBLIC.001 (Principal: "*") — this control
  fires on policies that name specific external accounts but
  lack an org boundary.
domain: exposure
severity: high
compliance:
  cis_aws_v3.0: "1.20"
  soc2: "CC6.1, CC6.6"
  nist_800_53_r5: "AC-3, AC-4, AC-6"
  pci_dss_v4.0: "1.2, 7.1, 7.2"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.5.15, A.5.19"
  ccm_v4: ["IAM-16", "IVS-09"]
scope_tags:
  - aws
  - sqs
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_sqs_queue
params:
  attack_stage: initial_access
  blast_radius:
    type: prevention
    scope: organization
    multiplier: 2.0
remediation:
  description: >
    SQS queue policy grants cross-account access without an
    aws:PrincipalOrgID condition. The policy trusts external
    accounts regardless of organizational membership.
  action: >
    Add aws:PrincipalOrgID restricting access to the
    organization's ID (o-xxxxxxxxxx). For the rare legitimate
    cross-org grant, use aws:PrincipalAccount with the explicit
    account ID and document the trust relationship. Apply via
    aws sqs set-queue-attributes --attributes
    Policy=<file://policy.json>. Companion controls:
    CTL.SQS.POLICY.PUBLIC.001 covers Principal: "*";
    CTL.SQS.POLICY.SNS/S3/EVENTS.NOSOURCE.001 cover service
    principals; this control covers specific external account
    principals.
  example: |
    {
      "messaging": {
        "kind": "queue",
        "sqs": {
          "policy_cross_account": true,
          "policy_has_org_condition": true,
          "policy_external_accounts": ["222233334444"]
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.messaging.kind
      op: eq
      value: queue
    - field: properties.messaging.sqs.policy_cross_account
      op: eq
      value: true
    - field: properties.messaging.sqs.policy_has_org_condition
      op: eq
      value: false
defect: >
  SQS queue policy grants actions to external account principals
  without aws:PrincipalOrgID.
infection: >
  Cross-account queue access without organizational boundary
  means the external account has queue access regardless of
  whether it is in the organization. If the account was once in
  the organization but later left, the queue policy still trusts
  it. If the account is a partner or vendor, the queue policy
  trusts the partner's IAM controls — any principal in the
  partner's account with the matching IAM permissions can
  interact with the queue. PrincipalOrgID ensures only accounts
  currently in the organization can access the queue; accounts
  that leave lose access automatically. The condition is
  cheaper than maintaining an account allowlist.
failure: >
  Queue access outside organizational boundary. External-account
  principals can interact with the queue without org-membership
  verification, and access persists across org membership
  changes.
tests:
  - name: cross-account without org condition fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:sqs:us-east-1:111122223333:shared-queue"
      asset_type: aws_sqs_queue
      vendor: aws
      properties:
        messaging:
          kind: queue
          sqs:
            policy_cross_account: true
            policy_has_org_condition: false
            policy_external_accounts:
              - "222233334444"
            policy_cross_account_actions:
              - "sqs:SendMessage"
              - "sqs:ReceiveMessage"
  - name: cross-account with org condition passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:sqs:us-east-1:111122223333:shared-queue"
      asset_type: aws_sqs_queue
      vendor: aws
      properties:
        messaging:
          kind: queue
          sqs:
            policy_cross_account: true
            policy_has_org_condition: true
            policy_external_accounts:
              - "222233334444"
  - name: same-account policy passes (no cross-account)
    verdict: PASS
    asset:
      asset_id: "arn:aws:sqs:us-east-1:111122223333:internal-queue"
      asset_type: aws_sqs_queue
      vendor: aws
      properties:
        messaging:
          kind: queue
          sqs:
            policy_cross_account: false
