dsl_version: ctrl.v1
id: CTL.SQS.POLICY.EVENTS.NOSOURCE.001
name: SQS Queue Policy Allows EventBridge Without SourceAccount
description: >
  SQS queue policy grants sqs:SendMessage to the EventBridge
  service principal (events.amazonaws.com) without
  aws:SourceAccount or aws:SourceArn condition. Any EventBridge
  rule in any account can deliver events to the queue.
  EventBridge is particularly dangerous without source
  restriction because rules can match arbitrary event patterns —
  an attacker creates a rule in their own account that matches
  high-volume events (CloudTrail API calls, custom events) and
  routes them to the target queue, flooding it. Counterpart to
  CTL.SQS.POLICY.SNS.NOSOURCE.001 and
  CTL.SQS.POLICY.S3.NOSOURCE.001 on the EventBridge surface.
domain: exposure
severity: high
compliance:
  cis_aws_v3.0: "1.20"
  soc2: "CC6.1, CC6.6"
  nist_800_53_r5: "AC-3, AC-4, SC-7"
  pci_dss_v4.0: "1.2, 7.1"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.5.15, A.8.9"
  ccm_v4: ["IAM-16", "IVS-09"]
scope_tags:
  - aws
  - sqs
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_sqs_queue
params:
  attack_stage: initial_access
remediation:
  description: >
    SQS queue policy authorizes the EventBridge service
    principal without a source restriction. Any EventBridge
    rule in any account can target the queue.
  action: >
    Add aws:SourceAccount (the account owning the legitimate
    rules) and ideally aws:SourceArn (each rule's ARN) to every
    Statement granting events.amazonaws.com SendMessage. If the
    queue receives events from many rules in the same account,
    SourceAccount alone is sufficient; if only specific rules
    should be authorized, list each in SourceArn. Apply via
    aws sqs set-queue-attributes --attributes
    Policy=<file://policy.json>.
  example: |
    {
      "messaging": {
        "kind": "queue",
        "sqs": {
          "policy_allows_events": true,
          "policy_events_has_source": true,
          "policy_events_source_accounts": ["111122223333"]
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.messaging.kind
      op: eq
      value: queue
    - field: properties.messaging.sqs.policy_allows_events
      op: eq
      value: true
    - field: properties.messaging.sqs.policy_events_has_source
      op: eq
      value: false
defect: >
  SQS queue policy authorizes EventBridge service principal
  SendMessage without aws:SourceAccount or aws:SourceArn.
infection: >
  The queue policy grants sqs:SendMessage to
  events.amazonaws.com without restricting which rule or account
  can deliver events. EventBridge rules can match arbitrary
  event patterns — an attacker with permission to create rules
  in any AWS account can author a rule that matches high-volume
  patterns (every PutObject, every CloudTrail event) and routes
  them at the target queue. The queue floods with attacker-
  selected events. Even if the consumer validates event content,
  the volume alone is a denial-of-service vector. SourceAccount
  rejects rules from foreign accounts; SourceArn pins specific
  rules.
failure: >
  Cross-account event delivery. Any EventBridge rule in any
  account can route arbitrary events to the queue, with the
  obvious DoS and message-injection consequences.
tests:
  - name: EventBridge principal without source condition fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:sqs:us-east-1:111122223333:events-queue"
      asset_type: aws_sqs_queue
      vendor: aws
      properties:
        messaging:
          kind: queue
          sqs:
            policy_allows_events: true
            policy_events_has_source: false
  - name: EventBridge principal with sourceAccount passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:sqs:us-east-1:111122223333:events-queue"
      asset_type: aws_sqs_queue
      vendor: aws
      properties:
        messaging:
          kind: queue
          sqs:
            policy_allows_events: true
            policy_events_has_source: true
            policy_events_source_accounts:
              - "111122223333"
