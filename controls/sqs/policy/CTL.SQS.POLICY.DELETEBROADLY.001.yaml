dsl_version: ctrl.v1
id: CTL.SQS.POLICY.DELETEBROADLY.001
name: SQS Queue Policy Grants DeleteMessage to Broad Principals
description: >
  SQS queue policy grants sqs:DeleteMessage to a broad principal
  class — Principal: "*", account root, wildcard role pattern,
  or cross-account principals without conditions. DeleteMessage
  removes individual messages from the queue. Broad
  DeleteMessage access enables message destruction without
  reading: a principal that can delete but not receive can
  destroy messages out from under the legitimate consumer,
  causing silent message loss. Similar pattern to
  CTL.SQS.POLICY.RECEIVEMESSAGE.BROAD.001 but on the destruction
  axis rather than the read axis. Less severe than
  CTL.SQS.POLICY.PURGE.001 (which mass-deletes the entire
  queue in a single call) — DeleteMessage is one-message-at-a-
  time but still allows targeted destruction.
domain: exposure
severity: medium
compliance:
  soc2: "CC6.1, CC6.6, A1.2"
  nist_800_53_r5: "AC-3, AC-6, SI-11"
  pci_dss_v4.0: "1.2, 7.1"
  fedramp_moderate: "AC-6"
  iso_27001_2022: "A.5.15, A.8.3"
  ccm_v4: ["IAM-16"]
scope_tags:
  - aws
  - sqs
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_sqs_queue
params:
  attack_stage: impact
remediation:
  description: >
    SQS queue policy grants DeleteMessage to a broad principal
    class. Any matching principal can delete individual
    messages.
  action: >
    Restrict DeleteMessage to the consumer roles that
    legitimately process messages — typically the same role
    that holds ReceiveMessage, since the standard
    consume-and-delete pattern requires both. Avoid granting
    DeleteMessage to producer roles, monitoring roles, or
    cross-account principals unless there is a documented
    redrive-back workflow. Apply via aws sqs
    set-queue-attributes --attributes Policy=<file://policy.json>.
  example: |
    {
      "messaging": {
        "kind": "queue",
        "sqs": {
          "delete_broadly_granted": false,
          "policy_delete_principals": ["arn:aws:iam::111122223333:role/orders-consumer"]
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.messaging.kind
      op: eq
      value: queue
    - field: properties.messaging.sqs.delete_broadly_granted
      op: eq
      value: true
defect: >
  SQS queue policy grants sqs:DeleteMessage to a broad principal
  class.
infection: >
  DeleteMessage removes individual messages from the queue.
  Broad DeleteMessage access lets a principal destroy messages
  one by one, even without ReceiveMessage permission. An
  attacker with DeleteMessage but not ReceiveMessage can drop
  messages out from under the legitimate consumer — silent
  message loss without reading the content. Combined with
  ReceiveMessage, the attacker can drain the queue;
  alone, DeleteMessage is targeted destruction. Less severe
  than PurgeQueue (one-at-a-time vs. queue-wide) but still
  data-destruction capability.
failure: >
  Targeted message destruction. Any principal matching the
  broad pattern can delete individual messages; combined with
  ReceiveMessage it drains the queue.
tests:
  - name: DeleteMessage to wildcard role fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:sqs:us-east-1:111122223333:orders-queue"
      asset_type: aws_sqs_queue
      vendor: aws
      properties:
        messaging:
          kind: queue
          sqs:
            delete_broadly_granted: true
            policy_delete_principals:
              - "arn:aws:iam::111122223333:role/*"
  - name: DeleteMessage to specific consumer role passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:sqs:us-east-1:111122223333:orders-queue"
      asset_type: aws_sqs_queue
      vendor: aws
      properties:
        messaging:
          kind: queue
          sqs:
            delete_broadly_granted: false
            policy_delete_principals:
              - "arn:aws:iam::111122223333:role/orders-consumer"
