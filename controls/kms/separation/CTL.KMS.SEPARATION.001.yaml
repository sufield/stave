dsl_version: ctrl.v1
id: CTL.KMS.SEPARATION.001
name: KMS Key Admin and Key User on Same Principal
description: >
  Same IAM principal has both key administration permissions
  (kms:Create*, kms:Delete*, kms:Enable*, kms:Disable*, kms:Put*)
  and key usage permissions (kms:Encrypt, kms:Decrypt,
  kms:GenerateDataKey). No separation of duties — the principal who
  manages the key also uses it for cryptographic operations. A
  compromised principal can both modify the key's security
  configuration and decrypt all protected data.
domain: identity
severity: high
compliance:
  soc2: "CC6.3"
  nist_800_53_r5: "AC-5"
  pci_dss_v4.0: "7.2.2"
  fedramp_moderate: "AC-5"
  hipaa: "164.312(a)(1)"
  ccm_v4: ["CEK-03", "IAM-05"]
scope_tags:
  - aws
  - kms
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_kms_key
params:
  attack_stage: privilege_escalation
  base_impact: 9
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.0
observation_fields:
  - cryptography.kind
  - cryptography.principal_has_admin_and_usage
  - cryptography.dual_role_principals
remediation:
  description: >
    KMS key has a principal with both administration and usage
    permissions. No separation of duties between key management
    and cryptographic operations.
  action: >
    Separate key administration and key usage into distinct IAM
    principals. Key administrators should not have Encrypt, Decrypt,
    or GenerateDataKey permissions. Key users should not have
    Create*, Delete*, Enable*, Disable*, or Put* permissions.
  example: |
    {
      "cryptography": {
        "kind": "key",
        "principal_has_admin_and_usage": false
      }
    }
unsafe_predicate:
  all:
    - field: properties.cryptography.kind
      op: eq
      value: key
    - field: properties.cryptography.principal_has_admin_and_usage
      op: eq
      value: true
defect: >
  Same principal has both KMS key administration and key usage
  permissions.
infection: >
  Separation of duties for KMS requires that key administrators
  (who create, enable, disable, and rotate keys) are different from
  key users (who encrypt, decrypt, and generate data keys). Combined
  roles mean a compromised principal can both modify the key's
  security configuration (disable rotation, change key policy,
  schedule deletion) and use the key to decrypt all protected data.
  The attack surface is the union of management and data operations.
failure: >
  Full KMS control. A compromised principal manages the key lifecycle
  AND decrypts all data the key protects.
tests:
  - name: key with combined admin and usage principal fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:kms:us-east-1:111122223333:key/mrk-abc123"
      asset_type: aws_kms_key
      vendor: aws
      properties:
        cryptography:
          kind: key
          principal_has_admin_and_usage: true
          dual_role_principals:
            - "arn:aws:iam::111122223333:role/combined-kms-role"
  - name: key with separated admin and usage passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:kms:us-east-1:111122223333:key/mrk-def456"
      asset_type: aws_kms_key
      vendor: aws
      properties:
        cryptography:
          kind: key
          principal_has_admin_and_usage: false
