dsl_version: ctrl.v1
id: CTL.DMS.LOG.SOURCE.001
name: DMS Replication Tasks Must Enable Source Logging
description: >
  DMS replication tasks must enable source logging (SOURCE_CAPTURE
  and SOURCE_UNLOAD) for auditability of data extraction from
  source databases.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "AU-2"
  soc2: "CC7.1"
  ccm_v4: ["LOG-03"]
scope_tags: [aws, dms]
taxonomy:
  - compliance-mapping
  - logging
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_dms_replication_instance
params:
  attack_stage: detection_evasion
remediation:
  description: DMS replication task source logging is disabled.
  action: Enable SOURCE_CAPTURE and SOURCE_UNLOAD logging.
  example: |
    {"database": {"kind": "dms_replication_task", "logging": {"source_logging_enabled": true}}}
unsafe_predicate:
  all:
    - field: properties.database.kind
      op: eq
      value: dms_replication_task
    - field: properties.database.logging.source_logging_enabled
      op: eq
      value: false
