dsl_version: ctrl.v1
id: CTL.EXPOSURE.SOVEREIGNTY.001
name: Sensitive Data Must Not Be Accessible from Outside Its Jurisdiction
description: >
  Resources containing sensitive data (PHI, PII, confidential) in a
  specific jurisdiction must have access restricted to principals in
  the same jurisdiction. A bucket in eu-west-1 accessible by a
  US-based principal is a structural jurisdictional violation — the
  data is physically in the EU but logically reachable from outside
  the EU, defeating data residency controls.
domain: exposure
severity: high
compliance:
  gdpr: "Art.44"
  nist_800_53_r5: "AC-4"
  fedramp_moderate: "AC-4"
scope_tags:
  - aws
  - cross-service
  - compliance
type: unsafe_state
params:
  base_impact: 8
  attack_stage: exfiltration
remediation:
  description: >
    Sensitive data in a jurisdiction is accessible from a principal
    in a different jurisdiction. Data residency is structurally
    violated.
  action: >
    Restrict access to the resource using IAM condition keys that
    enforce source VPC or source IP ranges within the jurisdiction.
    Use SCPs to deny cross-jurisdiction access at the organization
    level. Review resource-based policies for cross-region grants.
  example: |
    {
      "reachability": {
        "kind": "cross_border",
        "sovereignty": {
          "cross_border_access_detected": false,
          "resource_jurisdiction": "eu",
          "target_sensitivity": "pii"
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.reachability.kind
      op: eq
      value: cross_border
    - field: properties.reachability.sovereignty.cross_border_access_detected
      op: eq
      value: true
    - field: properties.reachability.sovereignty.target_sensitivity
      op: in
      value: ["phi", "pii", "confidential"]
