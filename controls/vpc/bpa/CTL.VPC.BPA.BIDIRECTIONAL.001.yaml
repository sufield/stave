dsl_version: ctrl.v1
id: CTL.VPC.BPA.BIDIRECTIONAL.001
name: VPC Block Public Access Must Block Both Ingress and Egress
description: >
  VPC Block Public Access is enabled but in ingress-only mode.
  Ingress-only mode blocks inbound traffic from the internet
  but still allows outbound internet access via internet
  gateways. An attacker with code execution can still
  exfiltrate data or establish reverse shells. Bidirectional
  mode blocks both directions.
domain: network
severity: medium
compliance:
  nist_800_53_r5: "SC-7"
  soc2: "CC6.6"
  ccm_v4: ["IVS-03"]
scope_tags:
  - aws
  - vpc
taxonomy:
  - network-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_account
params:
  attack_stage: exfiltration
observation_fields:
  - network.kind
  - network.vpc_bpa.enabled
  - network.vpc_bpa.mode
remediation:
  description: >
    VPC BPA is in ingress-only mode. Outbound internet
    access is still allowed.
  action: >
    Switch to bidirectional mode via
    aws ec2 modify-vpc-block-public-access-options
    --internet-gateway-block-mode block-bidirectional.
    Create subnet-level exclusions for subnets that
    genuinely need outbound internet access.
  example: |
    {
      "network": {
        "kind": "vpc_bpa_settings",
        "vpc_bpa": {
          "enabled": true,
          "mode": "block-bidirectional"
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: vpc_bpa_settings
    - field: properties.network.vpc_bpa.enabled
      op: eq
      value: true
    - field: properties.network.vpc_bpa.mode
      op: eq
      value: block-ingress
tests:
  - name: "ingress-only mode fires"
    verdict: VIOLATION
    asset:
      asset_id: "111122223333:vpc-bpa"
      asset_type: aws_account
      vendor: aws
      properties:
        network:
          kind: vpc_bpa_settings
          vpc_bpa:
            enabled: true
            mode: block-ingress
  - name: "bidirectional mode passes"
    verdict: PASS
    asset:
      asset_id: "111122223333:vpc-bpa"
      asset_type: aws_account
      vendor: aws
      properties:
        network:
          kind: vpc_bpa_settings
          vpc_bpa:
            enabled: true
            mode: block-bidirectional
