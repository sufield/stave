dsl_version: ctrl.v1
id: CTL.VPC.DX.ENCRYPTION.001
name: Direct Connect Without Encryption
description: >
  Direct Connect connection carries unencrypted traffic. Neither a
  site-to-site VPN overlay nor MACsec is configured. Direct Connect
  is a dedicated physical link — not shared with other customers —
  but the traffic on it is plaintext by default. Anyone with physical
  access to the fiber path (datacenter staff, transit providers,
  co-location personnel) can tap the connection and read traffic.
  Either a VPN over the Direct Connect or MACsec provides
  confidentiality; the control passes if either is configured.
domain: encryption
severity: high
compliance:
  cis_aws_v3.0: "5.5"
  nist_800_53_r5: "SC-8"
  fedramp_moderate: "SC-8"
  pci_dss_v4.0: "4.2.1"
  soc2: "CC6.7"
  hipaa: "164.312(e)(1)"
  ccm_v4: ["CEK-03", "IVS-03"]
scope_tags:
  - aws
  - vpc
type: unsafe_state
classification: state_assertion
params:
  attack_stage: collection
observation_fields:
  - network.kind
  - network.dx.connection_id
  - network.dx.has_vpn_overlay
  - network.dx.macsec_enabled
remediation:
  description: >
    Direct Connect connection has neither a VPN overlay nor MACsec
    encryption. All traffic on the dedicated link is plaintext.
  action: >
    Add encryption to the Direct Connect path. Either (a) configure
    a site-to-site VPN over the Direct Connect connection and route
    all traffic through the VPN, or (b) enable MACsec on the Direct
    Connect ports (supported on 10 Gbps and 100 Gbps dedicated
    connections). VPN overlay is more widely supported; MACsec
    offers lower latency but requires compatible hardware on both
    ends.
  example: |
    {
      "network": {
        "kind": "directconnect_connection",
        "dx": {
          "has_vpn_overlay": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: directconnect_connection
    - field: properties.network.dx.has_vpn_overlay
      op: eq
      value: false
    - field: properties.network.dx.macsec_enabled
      op: eq
      value: false
