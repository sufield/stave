dsl_version: ctrl.v1
id: CTL.VPC.ENV.ISOLATION.001
name: Production VPC Must Be Isolated from Non-Production
description: >
  Production VPCs must not share network boundaries with
  non-production environments. When production and dev/staging
  workloads share a VPC, a misconfiguration or compromise in a
  lower environment can reach production resources through security
  group rules, VPC peering, or shared subnets. Environment isolation
  requires separate VPCs with explicit, auditable cross-VPC
  connections.
domain: exposure
severity: high
compliance:
  soc2: "CC6.6"
  pci_dss_v4.0: "1.3.1"
  nist_800_53_r5: "SC-7"
  fedramp_moderate: "SC-7"
  iso_27001_2022: "A.8.22"
  ccm_v4: ["IVS-06"]
scope_tags:
  - aws
  - vpc
taxonomy:
  - compliance-mapping
  - network-isolation
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_vpc
params:
  attack_stage: lateral_movement
remediation:
  description: >
    VPC contains workloads from multiple environments (production
    and non-production). Environment isolation is not enforced at
    the network level.
  action: >
    Create separate VPCs for each environment (prod, staging, dev).
    Tag VPCs with an environment classification tag. Use VPC peering
    or Transit Gateway with explicit route tables for any required
    cross-environment communication. Ensure security groups do not
    reference resources in other environments.
  example: |
    {
      "network": {
        "kind": "vpc",
        "env_isolation": {
          "mixed_environments": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: vpc
    - field: properties.network.env_isolation.mixed_environments
      op: eq
      value: true
