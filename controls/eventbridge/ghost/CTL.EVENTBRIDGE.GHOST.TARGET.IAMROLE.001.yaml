dsl_version: ctrl.v1
id: CTL.EVENTBRIDGE.GHOST.TARGET.IAMROLE.001
name: EventBridge Rule Target Invocation Role Was Deleted
description: >
  An EventBridge rule references an IAM role for target invocation,
  but the role ARN no longer exists. The rule pattern continues to
  match events; each match attempts AssumeRole on the missing role
  and fails. Events route to DLQ or are discarded. This is the
  identity-side of the ghost-target moat — the target resource may
  still exist, but the rule cannot reach it because the assumed
  role was deleted. Same silent failure pattern but the failure
  point is the IAM role rather than the downstream service.
domain: governance
severity: high
archetype: ghost-reference
scope: compound
compliance:
  soc2: "CC6.1, CC6.3, CC8.1"
  nist_800_53_r5: "AC-3, CM-2, CM-3"
  fedramp_moderate: "AC-3, CM-2"
  iso_27001_2022: "A.5.15, A.5.16, A.8.32"
  ccm_v4: ["IAM-13", "BCR-08"]
scope_tags:
  - aws
  - eventbridge
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eventbridge_rule_target
params:
  attack_stage: detection_evasion
  blast_radius:
    type: detection
    scope: account
    multiplier: 2.0
remediation:
  description: >
    EventBridge rule target's invocation role no longer exists. The
    rule cannot assume the role; every event fails delivery.
  action: >
    Recreate the IAM role at the original ARN (preserve the name and
    trust policy to avoid breaking other rules using it), update the
    rule target to use a live role, or remove the target. Verify the
    role's trust policy permits events.amazonaws.com to assume it.
  example: |
    {
      "governance": {
        "kind": "eventbridge_rule_target",
        "events": {
          "target_arn": "arn:aws:lambda:us-east-1:111122223333:function:processor",
          "invocation_role_arn": "arn:aws:iam::111122223333:role/eventbridge-invoke",
          "invocation_role_exists": true,
          "has_ghost_invocation_role": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: eventbridge_rule_target
    - field: properties.governance.events.has_ghost_invocation_role
      op: eq
      value: true
defect: >
  EventBridge rule target's invocation role ARN has been deleted.
infection: >
  The rule pattern continues to match. Each match requires
  EventBridge to AssumeRole on the named invocation role to deliver
  the event to the target — the AssumeRole call fails because the
  role no longer exists. EventBridge cannot complete the invocation;
  the event routes to DLQ or is discarded. The target resource
  itself is healthy and would accept the event; the failure is
  upstream, in the identity layer.
failure: >
  Silent identity-layer failure. Events meant for healthy targets
  are dropped because the role that EventBridge was supposed to
  assume to invoke them was deleted. Easy to misdiagnose: target
  health checks pass, rule pattern is correct, downstream consumers
  show no records.
tests:
  - name: rule target with deleted invocation role fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:rule/orders/target-1"
      asset_type: aws_eventbridge_rule_target
      vendor: aws
      properties:
        governance:
          kind: eventbridge_rule_target
          events:
            target_id: "target-1"
            target_arn: "arn:aws:lambda:us-east-1:111122223333:function:processor"
            invocation_role_arn: "arn:aws:iam::111122223333:role/eventbridge-invoke-deleted"
            invocation_role_exists: false
            has_ghost_invocation_role: true
  - name: rule target with live invocation role passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:rule/orders/target-1"
      asset_type: aws_eventbridge_rule_target
      vendor: aws
      properties:
        governance:
          kind: eventbridge_rule_target
          events:
            target_id: "target-1"
            target_arn: "arn:aws:lambda:us-east-1:111122223333:function:processor"
            invocation_role_arn: "arn:aws:iam::111122223333:role/eventbridge-invoke"
            invocation_role_exists: true
            has_ghost_invocation_role: false
