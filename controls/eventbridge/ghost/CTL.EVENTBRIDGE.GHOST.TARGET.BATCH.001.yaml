dsl_version: ctrl.v1
id: CTL.EVENTBRIDGE.GHOST.TARGET.BATCH.001
name: EventBridge Rule Targets Deleted Batch Job Queue
description: >
  An EventBridge rule's target is an AWS Batch job queue ARN that no
  longer exists. Each matching event attempts SubmitJob against a
  missing queue — the API rejects it. Events route to DLQ if
  configured or are discarded. AWS Batch is typically used for
  long-running compute and ML pipelines triggered by events; a ghost
  Batch target silently halts those pipelines.
domain: governance
severity: high
compliance:
  soc2: "CC6.1, CC8.1, CC7.4"
  nist_800_53_r5: "CM-2, CM-3, SI-4"
  fedramp_moderate: "CM-2"
  iso_27001_2022: "A.5.16, A.8.32"
  ccm_v4: ["BCR-08", "DSP-17"]
scope_tags:
  - aws
  - eventbridge
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eventbridge_rule_target
params:
  attack_stage: detection_evasion
  blast_radius:
    type: detection
    scope: account
    multiplier: 2.0
remediation:
  description: >
    EventBridge rule target references a Batch job queue that has
    been deleted. Submitted jobs fail.
  action: >
    Recreate the Batch job queue at the original ARN, repoint the
    target to a live queue, or remove the target. Verify the
    associated compute environment also still exists — a deleted
    compute environment will silently fail downstream of a live
    queue with the same symptom.
  example: |
    {
      "governance": {
        "kind": "eventbridge_rule_target",
        "events": {
          "target_type": "batch_job_queue",
          "target_arn": "arn:aws:batch:us-east-1:111122223333:job-queue/ml-pipeline",
          "target_exists": true,
          "has_ghost_target": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: eventbridge_rule_target
    - field: properties.governance.events.target_type
      op: eq
      value: batch_job_queue
    - field: properties.governance.events.has_ghost_target
      op: eq
      value: true
defect: >
  EventBridge rule target ARN names an AWS Batch job queue that has
  been deleted.
infection: >
  The rule pattern continues to match. Each match attempts
  SubmitJob against the named queue — the API rejects with
  ClientException. Events route to DLQ if configured or are
  discarded. ML training runs, ETL pipelines, and scheduled compute
  jobs the rule was supposed to launch silently stop running. The
  rule's CloudWatch metrics show invocation attempts; the Batch
  console shows no submitted jobs.
failure: >
  Silent compute-pipeline failure. Long-running compute work the
  rule was scheduled to trigger doesn't run. Outputs that depend on
  Batch processing never appear.
tests:
  - name: rule target to deleted Batch queue fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:rule/nightly-ml/target-1"
      asset_type: aws_eventbridge_rule_target
      vendor: aws
      properties:
        governance:
          kind: eventbridge_rule_target
          events:
            target_id: "target-1"
            target_type: "batch_job_queue"
            target_arn: "arn:aws:batch:us-east-1:111122223333:job-queue/ml-pipeline-deleted"
            target_exists: false
            has_ghost_target: true
  - name: rule target to live Batch queue passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:rule/nightly-ml/target-1"
      asset_type: aws_eventbridge_rule_target
      vendor: aws
      properties:
        governance:
          kind: eventbridge_rule_target
          events:
            target_id: "target-1"
            target_type: "batch_job_queue"
            target_arn: "arn:aws:batch:us-east-1:111122223333:job-queue/ml-pipeline"
            target_exists: true
            has_ghost_target: false
