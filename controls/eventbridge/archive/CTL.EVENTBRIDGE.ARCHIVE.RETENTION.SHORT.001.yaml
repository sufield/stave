dsl_version: ctrl.v1
id: CTL.EVENTBRIDGE.ARCHIVE.RETENTION.SHORT.001
name: EventBridge Archive Retention Shorter Than Incident Investigation Window
description: >
  EventBridge archive retention is below 30 days. Incident
  investigations routinely look back 30-90 days for chains of
  causation; an archive with retention shorter than the typical
  investigation window provides little of its intended value.
  Common cause: RetentionDays defaulted to 7 by an example
  template and never reviewed against operational needs.
domain: governance
severity: low
compliance:
  soc2: "CC7.2, CC7.3"
  nist_800_53_r5: "AU-11, IR-4"
  fedramp_moderate: "AU-11, IR-4"
  iso_27001_2022: "A.5.24, A.8.16"
  ccm_v4: ["LOG-04", "SEF-04"]
scope_tags:
  - aws
  - eventbridge
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eventbridge_archive
params:
  attack_stage: detection_evasion
remediation:
  description: >
    EventBridge archive retention is below 30 days.
  action: >
    Set RetentionDays to at least 30, and align with the
    archive's operational role: incident-investigation needs
    typically want 90+, audit retention is framework-specific.
    Pair with a tag (Purpose=incident-investigation /
    audit-retention) so the choice is explicit.
  example: |
    {
      "governance": {
        "kind": "eventbridge_archive",
        "events": {
          "retention_days": 90
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: eventbridge_archive
    - field: properties.governance.events.retention_days
      op: gt
      value: 0
    - field: properties.governance.events.retention_days
      op: lt
      value: 30
defect: >
  EventBridge archive retention is below 30 days but greater
  than zero (i.e., not "indefinite" — explicitly short).
infection: >
  An archive with retention below 30 days expires events before
  the typical incident-investigation window. When investigators
  need to reconstruct a chain of events spanning the past
  several weeks, the archive may have already evicted the
  earliest evidence. The archive nominally exists; its
  practical utility for incident response is limited.
failure: >
  Investigation gap. Archived events expire before
  investigations can reach them; the archive's stated purpose
  is undermined by its configured retention.
tests:
  - name: archive with 7-day retention fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:archive/audit"
      asset_type: aws_eventbridge_archive
      vendor: aws
      properties:
        governance:
          kind: eventbridge_archive
          events:
            retention_days: 7
  - name: archive with 90-day retention passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:archive/audit"
      asset_type: aws_eventbridge_archive
      vendor: aws
      properties:
        governance:
          kind: eventbridge_archive
          events:
            retention_days: 90
  - name: archive with indefinite retention does not fire here
    verdict: PASS
    asset:
      asset_id: "arn:aws:events:us-east-1:111122223333:archive/audit"
      asset_type: aws_eventbridge_archive
      vendor: aws
      properties:
        governance:
          kind: eventbridge_archive
          events:
            retention_days: 0
