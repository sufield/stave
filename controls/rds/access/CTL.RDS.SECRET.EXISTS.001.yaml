dsl_version: ctrl.v1
id: CTL.RDS.SECRET.EXISTS.001
name: RDS Database Credentials Must Be Managed by Secrets Manager
description: >
  RDS instances must have their database credentials managed by
  AWS Secrets Manager — either via the native
  ManageMasterUserPassword integration (creates and rotates the
  secret automatically) or via a Secrets Manager secret tagged
  with the instance identifier. When credentials are NOT in
  Secrets Manager, they are stored somewhere — and that
  somewhere is invariably a worse place: application config
  files committed to git, ECS task definitions where the
  password appears in plaintext to anyone with task-definition-
  describe rights, Lambda environment variables visible in
  CloudFormation console output, SSM Parameter Store with
  String type (not encrypted at rest), or hardcoded into
  source. Each storage location is a separate exposure surface;
  every application that connects to the database has its own
  copy of the credential; rotation requires updating every copy
  in every consumer, which means rotation does not happen.
  Secrets Manager centralizes the credential, supports automatic
  rotation, and logs every retrieval via CloudTrail.
domain: access
severity: high
compliance:
  nist_800_53_r5: "IA-5"
  pci_dss_v4: "8.2"
  hipaa: "164.312(d)"
  ccm_v4: ["IAM-02", "CEK-05"]
scope_tags: [aws, rds]
taxonomy:
  - credential-lifecycle
  - encryption-at-rest
  - logging
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
remediation:
  description: RDS instance does not have credentials managed by Secrets Manager.
  action: Enable ManageMasterUserPassword on the instance, or create a Secrets Manager secret referenced by every application that connects.
  example: |
    {"database": {"kind": "rds_instance", "auth": {"manages_credentials_via_sm": true}}}
unsafe_predicate:
  all:
    - field: properties.database.kind
      op: eq
      value: rds_instance
    - field: properties.database.auth.manages_credentials_via_sm
      op: eq
      value: false
