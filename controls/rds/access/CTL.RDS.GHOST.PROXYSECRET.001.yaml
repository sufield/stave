dsl_version: ctrl.v1
id: CTL.RDS.GHOST.PROXYSECRET.001
name: RDS Proxies Must Not Reference Deleted Secrets Manager Secrets
description: >
  RDS Proxies must reference Secrets Manager secrets that
  currently exist. The Proxy authenticates to its backend
  database using credentials retrieved from Secrets Manager;
  when the secret is deleted, the Proxy keeps serving the
  connection pool it has already authenticated, but every new
  connection (pool growth, pool refresh after idle expiry,
  scale-out, restart) requires re-fetching the secret and
  fails. The failure mode is the most dangerous one in the
  ghost-reference family: it is delayed, not immediate. The
  Proxy console reports healthy. The application sees normal
  traffic. Hours later — frequently in the off-hours when the
  pool naturally turns over — a wave of connection failures
  surfaces, with no obvious link to the secret deletion that
  happened earlier in the day. Proxy-secret ghosts are
  particularly common after secret-rotation workflows that
  delete the previous secret without confirming the Proxy was
  actually pointed at the new one. The control fires on the
  reference at audit time so the failure is paid in
  change-window time rather than during incident time.
domain: access
severity: critical
compliance:
  nist_800_53_r5: "CM-2"
  pci_dss_v4: "8.2"
  ccm_v4: ["IAM-08", "BCR-08"]
scope_tags: [aws, rds]
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - trust-decay
type: unsafe_state
classification: state_assertion
params:
  attack_stage: resilience
remediation:
  description: RDS Proxy references a deleted Secrets Manager secret.
  action: Point the Proxy at the current secret (or restore the secret if deletion was unintentional and within the recovery window).
  example: |
    {"database": {"kind": "rds_proxy", "proxy": {"has_ghost_proxy_secret": false}}}
unsafe_predicate:
  all:
    - field: properties.database.kind
      op: eq
      value: rds_proxy
    - field: properties.database.proxy.has_ghost_proxy_secret
      op: eq
      value: true
