dsl_version: ctrl.v1
id: CTL.RDS.ENCRYPT.001
name: RDS Storage Encryption Must Be Enabled
description: >
  RDS instances must have storage encryption enabled. Unencrypted
  database storage exposes data at rest to unauthorized access if
  the underlying storage is compromised.
domain: exposure
severity: high
compliance:
  hipaa: "164.312(a)(2)(iv)"
  cis_aws_v1.4.0: "2.3.1"
  cis_aws_v3.0: "2.3.1"
  soc2: "CC6.7"
  pci_dss_v4.0: "3.4.1"
  nist_800_53_r5: "SC-28"
  fedramp_moderate: "SC-28"
  gdpr: "Art.32"
  ffiec: "ISH-4"
scope_tags:
  - aws
  - rds
type: unsafe_state
params: {}
remediation:
  description: >
    RDS instance does not have storage encryption enabled. Database
    contents are stored in plaintext on the underlying EBS volumes.
  action: >
    Storage encryption can only be enabled at creation time. Create a
    snapshot, copy it with encryption enabled, then restore to a new
    encrypted instance. Enable encryption by default for new instances.
  example: |
    {
      "database": {
        "kind": "instance",
        "encryption": {
          "storage_encrypted": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.database.kind
      op: eq
      value: instance
    - field: properties.database.encryption.storage_encrypted
      op: eq
      value: false
