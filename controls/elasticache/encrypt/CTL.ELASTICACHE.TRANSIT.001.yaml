dsl_version: ctrl.v1
id: CTL.ELASTICACHE.TRANSIT.001
name: ElastiCache Must Have In-Transit Encryption Enabled
description: >
  ElastiCache clusters must have in-transit encryption enabled.
  Without TLS, cache traffic travels in plaintext between the
  application and the cache nodes, exposing cached PHI data.
domain: exposure
severity: high
compliance:
  hipaa: "164.312(e)(2)(ii)"
  soc2: "CC6.6"
  pci_dss_v4.0: "4.2.1"
  nist_800_53_r5: "SC-8"
  fedramp_moderate: "SC-8"
  gdpr: "Art.32"
  ccm_v4: ["CEK-03", "DSP-10"]
scope_tags:
  - aws
  - elasticache
type: unsafe_state
params:
  attack_stage: exfiltration
remediation:
  description: >
    ElastiCache cluster does not have in-transit encryption enabled.
    Cache traffic is transmitted in plaintext.
  action: >
    In-transit encryption can only be enabled at cluster creation.
    Create a new replication group with TransitEncryptionEnabled=true
    and migrate data from the existing cluster.
  example: |
    {
      "cache": {
        "kind": "cluster",
        "encryption": {
          "in_transit_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.cache.kind
      op: eq
      value: cluster
    - field: properties.cache.encryption.in_transit_enabled
      op: eq
      value: false
