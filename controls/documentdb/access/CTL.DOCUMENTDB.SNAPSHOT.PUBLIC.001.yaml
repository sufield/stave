dsl_version: ctrl.v1
id: CTL.DOCUMENTDB.SNAPSHOT.PUBLIC.001
name: DocumentDB Snapshots Must Not Be Public
description: DocumentDB snapshots must not be publicly accessible.
domain: exposure
severity: critical
compliance:
  nist_800_53_r5: AC-3
  soc2: CC6.6
  ccm_v4:
  - DSP-17
scope_tags:
- aws
- documentdb
taxonomy:
  - compliance-mapping
  - network-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_documentdb_cluster
params:
  attack_stage: exfiltration
remediation:
  description: Remove public access from the snapshot..
  action: Remove public access from the snapshot.
unsafe_predicate:
  all:
  - field: properties.database.kind
    op: eq
    value: documentdb_cluster
  - field: properties.database.snapshot.is_public
    op: eq
    value: true
