dsl_version: ctrl.v1
id: CTL.DOCUMENTDB.BACKUP.001
name: DocumentDB Automated Backups Must Be Enabled
description: DocumentDB clusters must have automated backups.
domain: resilience
severity: medium
compliance:
  nist_800_53_r5: CP-9
  soc2: CC7.1
  ccm_v4:
  - BCR-08
scope_tags:
- aws
- documentdb
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_documentdb_cluster]
params:
  attack_stage: impact
remediation:
  description: Set backup retention period to at least 7 days..
  action: Set backup retention period to at least 7 days.
unsafe_predicate:
  all:
  - field: properties.database.kind
    op: eq
    value: documentdb_cluster
  - field: properties.database.backup.automated_backup_enabled
    op: eq
    value: false
