dsl_version: ctrl.v1
id: CTL.DOCUMENTDB.SG.OPEN.001
name: DocumentDB Cluster Security Group Must Not Allow 0.0.0.0/0 Ingress on 27017
description: >
  DocumentDB clusters must not have a VPC security group attached
  that allows 0.0.0.0/0 ingress on the cluster port (27017). Even
  with member instances configured `publicly_accessible=false`, an
  open security group on a cluster placed in a public subnet — or
  reachable through a misconfigured NAT / transit gateway — exposes
  the document store to internet scanners. Distinct from
  CTL.DOCUMENTDB.SNAPSHOT.PUBLIC.001 (snapshot share) and
  CTL.DOCUMENTDB.INSTANCE.PUBLIC.001 (instance flag): this control
  catches the network-policy gap that admits the wrong source even
  when the per-instance flag is correct.
domain: network
severity: critical
compliance:
  nist_800_53_r5: SC-7
  soc2: CC6.6
  pci_dss_v4.0: 1.3.4
  ccm_v4:
  - IVS-03
  - IVS-04
scope_tags:
- aws
- documentdb
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: >
    A VPC security group attached to the cluster permits ingress
    from 0.0.0.0/0 on the DocumentDB port. The cluster is reachable
    from any source the VPC's network path admits.
  action: >
    Replace the 0.0.0.0/0 rule with the CIDR block(s) of the
    application tier or VPN range that legitimately needs cluster
    access. Avoid scoping rules to "any private RFC1918" — that
    admits the entire VPC's compute fleet.
unsafe_predicate:
  all:
  - field: properties.database.kind
    op: eq
    value: documentdb_cluster
  - field: properties.database.network.security_group_open_to_world
    op: eq
    value: true
