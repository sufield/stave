dsl_version: ctrl.v1
id: CTL.CLOUD9.ENV.ACTIVE.001
name: Cloud9 Environments Are Active in Account
description: >
  The account has active Cloud9 environments. Cloud9 creates EC2
  instances with security groups and IAM credential access behind
  the Cloud9 API surface. Environments can have direct SSH access
  from the internet and inherit the creating principal's credentials.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "CM-8"
  soc2: "CC6.1"
  ccm_v4: ["DSP-04"]
scope_tags: [aws, cloud9]
taxonomy: [resource-sprawl]
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_account]
params:
  attack_stage: discovery
observation_fields: [account.cloud9.has_active_environments]
remediation:
  description: Cloud9 environments active outside normal governance.
  action: Evaluate intent; if unwanted, delete environments and SCP deny cloud9:*.
  example: |
    {"account": {"cloud9": {"has_active_environments": false}}}
unsafe_predicate:
  all:
    - field: properties.account.cloud9.has_active_environments
      op: eq
      value: true
tests:
  - name: "active Cloud9 fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:root"
      asset_type: aws_account
      vendor: aws
      properties:
        account: {cloud9: {has_active_environments: true}}
  - name: "no Cloud9 passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::444455556666:root"
      asset_type: aws_account
      vendor: aws
      properties:
        account: {cloud9: {has_active_environments: false}}
