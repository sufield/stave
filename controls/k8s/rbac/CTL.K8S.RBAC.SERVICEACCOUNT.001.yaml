dsl_version: ctrl.v1
id: CTL.K8S.RBAC.SERVICEACCOUNT.001
name: Default Service Account Must Not Have Active Tokens
description: >
  The default service account in each namespace should not have
  auto-mounted tokens. Pods using the default service account inherit
  permissions that may allow unintended API access.
domain: exposure
severity: high
compliance:
  cis_k8s_v1.8.0: "5.1.5"
scope_tags:
  - kubernetes
  - rbac
type: unsafe_state
params:
  attack_stage: privilege_escalation
remediation:
  description: >
    Default service account has automountServiceAccountToken enabled.
    Pods without explicit service account configuration inherit this
    token and can make API calls.
  action: >
    Set automountServiceAccountToken to false on the default service
    account in every namespace. Create dedicated service accounts
    with minimal permissions for workloads that need API access.
  example: |
    {
      "rbac": {
        "kind": "service_account",
        "default_token_automount": false
      }
    }
unsafe_predicate:
  all:
    - field: properties.rbac.kind
      op: eq
      value: service_account
    - field: properties.rbac.is_default
      op: eq
      value: true
    - field: properties.rbac.default_token_automount
      op: eq
      value: true
