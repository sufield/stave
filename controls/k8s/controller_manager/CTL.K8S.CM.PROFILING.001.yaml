dsl_version: ctrl.v1
id: CTL.K8S.CM.PROFILING.001
name: Controller Manager Profiling Must Be Disabled
description: >
  The controller manager profiling endpoint must be disabled. Profiling
  exposes system and program details useful for attackers to identify
  vulnerabilities and plan privilege escalation.
domain: exposure
severity: low
compliance:
  cis_k8s_v1.9: "1.3.2"
  ccm_v4: ["IVS-04"]
scope_tags:
  - kubernetes
  - controller_manager
type: unsafe_state
classification: state_assertion
params:
  attack_stage: discovery
remediation:
  description: >
    Controller manager profiling is enabled, exposing system internals.
  action: >
    Set --profiling=false on the controller manager.
unsafe_predicate:
  all:
    - field: type
      op: eq
      value: k8s_controller_manager
    - field: properties.controller_manager.profiling_enabled
      op: eq
      value: true
