dsl_version: ctrl.v1
id: CTL.K8S.CM.BIND.ADDR.001
name: Controller Manager Must Bind to Loopback Address
description: >
  The controller manager must bind to a loopback address (127.0.0.1
  or ::1). Binding to 0.0.0.0 or a routable address exposes the
  controller manager's unsecured HTTP endpoints to the network.
domain: exposure
severity: high
compliance:
  cis_k8s_v1.9: "1.3.7"
  ccm_v4: ["IVS-04"]
scope_tags:
  - kubernetes
  - controller_manager
taxonomy:
  - compliance-mapping
  - network-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types: [k8s_controller_manager]
params:
  attack_stage: initial_access
remediation:
  description: >
    Controller manager is bound to a non-loopback address, exposing
    its endpoints to the network.
  action: >
    Set --bind-address=127.0.0.1 on the controller manager.
unsafe_predicate:
  all:
    - field: type
      op: eq
      value: k8s_controller_manager
    - field: properties.controller_manager.bind_address
      op: ne
      value: "127.0.0.1"
