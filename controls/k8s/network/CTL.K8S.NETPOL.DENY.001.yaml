dsl_version: ctrl.v1
id: CTL.K8S.NETPOL.DENY.001
name: Namespaces Must Have Default-Deny Network Policy
description: >
  Namespaces with network policies must include a default-deny ingress
  policy. Without default-deny, network policies only add allow rules
  on top of the implicit allow-all default.
domain: exposure
severity: medium
compliance:
  cis_k8s_v1.8.0: "5.3.2"
  ccm_v4: ["IVS-03", "IVS-06"]
scope_tags:
  - kubernetes
  - network
taxonomy:
  - compliance-mapping
  - network-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types: [k8s_cluster]
params:
  attack_stage: lateral_movement
remediation:
  description: >
    Namespace has network policies but no default-deny. Traffic not
    matched by any policy is still allowed.
  action: >
    Add a default-deny ingress NetworkPolicy that selects all pods
    and has no ingress rules.
  example: |
    {
      "network_policy": {
        "kind": "namespace",
        "has_default_deny": true
      }
    }
unsafe_predicate:
  all:
    - field: properties.network_policy.kind
      op: eq
      value: namespace
    - field: properties.network_policy.has_network_policies
      op: eq
      value: true
    - field: properties.network_policy.has_default_deny
      op: eq
      value: false
