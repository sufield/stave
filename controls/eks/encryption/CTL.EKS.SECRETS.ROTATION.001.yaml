dsl_version: ctrl.v1
id: CTL.EKS.SECRETS.ROTATION.001
name: KMS Key for EKS Secrets Encryption Must Have Rotation Enabled
description: >
  EKS envelope encryption uses a KMS CMK to encrypt the data
  encryption key protecting Kubernetes secrets. A compromised KMS key
  grants permanent access to all secrets encrypted with it — without
  rotation, a leaked or compromised key remains valid indefinitely.
  Annual KMS key rotation limits the window of exposure. Each rotation
  generates a new key version — previous versions remain available for
  decryption but new encryptions use the current version.
domain: encryption
severity: medium
compliance:
  nist_800_53_r5: "SC-12"
  mitre_attack: "TA0006"
scope_tags:
  - aws
  - eks
  - kms
type: unsafe_state
params:
  attack_stage: credential_access
remediation:
  description: >
    KMS key used for EKS secrets encryption does not have automatic
    rotation enabled. Compromised key material remains valid
    indefinitely.
  action: >
    Enable automatic rotation on the KMS key:
    aws kms enable-key-rotation --key-id <key-id>
  example: |
    {
      "encryption": {
        "key_rotation_enabled": true
      }
    }
unsafe_predicate:
  all:
    - field: properties.encryption.secrets_encrypted
      op: eq
      value: true
    - field: properties.encryption.key_rotation_enabled
      op: eq
      value: false
