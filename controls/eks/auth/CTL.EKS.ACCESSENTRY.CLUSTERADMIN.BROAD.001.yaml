dsl_version: ctrl.v1
id: CTL.EKS.ACCESSENTRY.CLUSTERADMIN.BROAD.001
name: EKS Access Entry Grants Cluster-Admin Policy To Non-Admin Principal
description: >
  EKS Access Entry has the AWS-managed
  AmazonEKSClusterAdminPolicy or AmazonEKSAdminPolicy
  associated with a principal that isn't a documented
  break-glass admin or platform-team role. The policy grants
  full cluster admin (equivalent to system:masters) at the
  AWS-side rather than via in-cluster RBAC. Same overprivilege
  pattern as aws-auth system:masters but on the modern
  Access Entries surface.
domain: identity
severity: critical
compliance:
  soc2: "CC6.1, CC6.3"
  nist_800_53_r5: "AC-3, AC-6"
  pci_dss_v4.0: "7.2"
  fedramp_moderate: "AC-3, AC-6"
  iso_27001_2022: "A.5.15, A.8.2"
  ccm_v4: ["IAM-04", "IAM-08"]
scope_tags:
  - aws
  - eks
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - least-privilege
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eks_access_entry
params:
  attack_stage: privilege_escalation
  blast_radius:
    type: control
    scope: account
    multiplier: 3.0
remediation:
  description: >
    EKS Access Entry has cluster-admin policy associated with
    a principal that isn't break-glass.
  action: >
    Replace AmazonEKSClusterAdminPolicy / AmazonEKSAdminPolicy
    with a custom AccessPolicy scoped to the operations the
    principal actually needs (read-only, namespace-admin for a
    specific namespace, etc.). Cluster-admin policies should
    only attach to principals tagged Purpose=BreakGlass with
    explicit on-call rotation documented.
  example: |
    {
      "k8s": {
        "cluster": {
          "access_entry": {
            "policy_arns": ["arn:aws:eks::aws:cluster-access-policy/AmazonEKSViewPolicy"],
            "has_cluster_admin_policy": false
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.k8s.cluster.access_entry.has_cluster_admin_policy
      op: eq
      value: true
    - field: properties.k8s.cluster.access_entry.is_break_glass_admin
      op: eq
      value: false
defect: >
  EKS Access Entry attaches AmazonEKSClusterAdminPolicy or
  AmazonEKSAdminPolicy to a non-break-glass principal.
infection: >
  The Access Entry grants cluster-admin to an IAM principal
  whose business purpose doesn't justify it. Compromise of
  the principal — through credential leak, role-trust drift,
  CI runner takeover — yields full cluster control. The grant
  is at the AWS-side, so cluster RBAC audits scoped to
  in-cluster ClusterRoleBindings won't surface it; only an
  EKS API-side audit (ListAccessEntries / DescribeAccessEntry)
  reveals the cluster-admin attachment.
failure: >
  Cluster-admin grant to over-scoped principals via the
  AWS-side authentication surface; in-cluster RBAC audit
  won't catch it.
tests:
  - name: cluster-admin to workload principal fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:eks:us-east-1:111122223333:cluster/prod#access-entry/arn:aws:iam::111122223333:role/CIDeployer"
      asset_type: aws_eks_access_entry
      vendor: aws
      properties:
        k8s:
          cluster:
            access_entry:
              principal_arn: "arn:aws:iam::111122223333:role/CIDeployer"
              policy_arns:
                - "arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
              has_cluster_admin_policy: true
              is_break_glass_admin: false
  - name: break-glass admin passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:eks:us-east-1:111122223333:cluster/prod#access-entry/arn:aws:iam::111122223333:role/EKS-BreakGlass"
      asset_type: aws_eks_access_entry
      vendor: aws
      properties:
        k8s:
          cluster:
            access_entry:
              principal_arn: "arn:aws:iam::111122223333:role/EKS-BreakGlass"
              policy_arns:
                - "arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
              has_cluster_admin_policy: true
              is_break_glass_admin: true
