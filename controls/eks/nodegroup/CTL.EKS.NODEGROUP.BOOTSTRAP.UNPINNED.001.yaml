dsl_version: ctrl.v1
id: CTL.EKS.NODEGROUP.BOOTSTRAP.UNPINNED.001
name: EKS Self-Managed Node Bootstrap Script Not Pinned To AMI Checksum
description: >
  EKS self-managed node group's launch template runs a
  bootstrap script that fetches and runs unpinned content
  (curl from a non-version-pinned URL, eksctl bootstrap
  with `--latest`, ad-hoc Helm install) without pinning
  to a specific AMI version or content hash. On node
  recreation (scaling, replacement, AZ rebalance), the
  script may pull a different version than the original
  cluster nodes ran — silent kernel parameter drift,
  kubelet config drift, or CNI version drift between
  otherwise-identical-looking nodes.
domain: governance
severity: medium
compliance:
  soc2: "CC8.1"
  nist_800_53_r5: "CM-2, CM-3"
  fedramp_moderate: "CM-2"
  iso_27001_2022: "A.5.16, A.8.32"
  ccm_v4: ["BCR-08"]
scope_tags:
  - aws
  - eks
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eks_nodegroup
params:
  attack_stage: persistence
remediation:
  description: >
    EKS self-managed node bootstrap script not pinned to
    AMI / content checksum.
  action: >
    Pin the bootstrap content: bake a custom AMI with the
    desired bootstrap state pre-applied (rather than
    running a fetch-and-execute on first boot), or
    download bootstrap artifacts from a versioned S3
    bucket with object-version checksums and verify before
    execution. EKS-optimized AMIs are preferred for managed
    node groups precisely because they're versioned + AWS-
    maintained.
  example: |
    {
      "k8s": {
        "nodegroup": {
          "is_self_managed": true,
          "bootstrap_pinned": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.k8s.nodegroup.is_self_managed
      op: eq
      value: true
    - field: properties.k8s.nodegroup.bootstrap_pinned
      op: eq
      value: false
defect: >
  EKS self-managed node group's bootstrap script fetches
  unversioned content without checksum verification.
infection: >
  Each node creation runs the bootstrap; the bootstrap
  fetches content (CNI plugin binary, kubelet config,
  helper scripts) from upstream URLs without pinning.
  Two nodes in the same node group provisioned a week
  apart can have meaningfully different software state.
  Configuration drift between nodes causes intermittent
  failures (workload runs fine on some nodes, fails on
  others), kernel-parameter inconsistency, and security-
  patch drift if the upstream source updates between
  fetches.
failure: >
  Per-node configuration drift. Same-group nodes have
  different software state; intermittent workload
  failures; security posture inconsistent.
tests:
  - name: self-managed unpinned bootstrap fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:eks:us-east-1:111122223333:nodegroup/prod/self-managed"
      asset_type: aws_eks_nodegroup
      vendor: aws
      properties:
        k8s:
          nodegroup:
            is_self_managed: true
            bootstrap_pinned: false
  - name: self-managed pinned bootstrap passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:eks:us-east-1:111122223333:nodegroup/prod/self-managed"
      asset_type: aws_eks_nodegroup
      vendor: aws
      properties:
        k8s:
          nodegroup:
            is_self_managed: true
            bootstrap_pinned: true
  - name: managed nodegroup not in scope
    verdict: PASS
    asset:
      asset_id: "arn:aws:eks:us-east-1:111122223333:nodegroup/prod/managed"
      asset_type: aws_eks_nodegroup
      vendor: aws
      properties:
        k8s:
          nodegroup:
            is_self_managed: false
            bootstrap_pinned: false
