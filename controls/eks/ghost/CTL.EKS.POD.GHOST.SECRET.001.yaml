dsl_version: ctrl.v1
id: CTL.EKS.POD.GHOST.SECRET.001
name: EKS Pod References Deleted Secret In env Or volumes
description: >
  Pod / Deployment / StatefulSet manifest references a
  Kubernetes Secret (in `envFrom`, `valueFrom.secretKeyRef`,
  or `volumes.secret.secretName`) that no longer exists in
  the namespace. New pod creation fails with `CreatePodError:
  secret X not found`; existing pods continue running with
  cached values. Same name-reuse risk as the other ghost
  controls — if the Secret is recreated, the pod silently
  picks up whatever values the new Secret carries.
domain: governance
severity: high
archetype: ghost-reference
scope: compound
compliance:
  soc2: "CC6.1, CC8.1, CC7.4"
  nist_800_53_r5: "CM-2, CM-3"
  fedramp_moderate: "CM-2"
  iso_27001_2022: "A.5.16, A.8.32"
  ccm_v4: ["BCR-08", "IAM-02"]
scope_tags:
  - aws
  - eks
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - trust-decay
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_eks_pod_spec
params:
  attack_stage: privilege_escalation
remediation:
  description: >
    Pod spec references a Kubernetes Secret that has been
    deleted from the namespace.
  action: >
    Recreate the Secret at the original name (kubectl create
    secret), or update the pod spec to reference a live
    Secret (kubectl edit deploy <name>). Audit pods for
    ghost Secret refs via `kubectl get pods -A -o yaml |
    grep secretRef` plus a kubectl get secret -A walk.
  example: |
    {
      "k8s": {
        "pod_spec": {
          "secret_refs": ["orders-db-creds", "orders-api-token"],
          "secret_refs_exist": true,
          "has_ghost_secret_ref": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.k8s.pod_spec.has_ghost_secret_ref
      op: eq
      value: true
defect: >
  EKS Pod spec references a Kubernetes Secret that has been
  deleted from the namespace.
infection: >
  The Pod manifest is structurally correct. New Pod
  creation fails because the named Secret can't be
  resolved. Deployment rollouts, replica scale-up, and
  node-replace pod recreation all hit the failure. Existing
  pods continue running with cached Secret values until they
  recycle. If the Secret is later recreated — by Helm
  reapply, manifest reapply, or namespace recreation — pods
  silently pick up the new values, which may differ from
  the originals (cred rotation gone wrong, copy-paste from
  another env's secret).
failure: >
  Silent Pod startup failure + name-reuse credential
  swap. New pods fail to start; recreated Secrets are
  silently consumed.
tests:
  - name: Pod with ghost Secret fires
    verdict: VIOLATION
    asset:
      asset_id: "k8s/orders/deployment/orders-api"
      asset_type: aws_eks_pod_spec
      vendor: aws
      properties:
        k8s:
          pod_spec:
            secret_refs: ["orders-db-creds-deleted"]
            secret_refs_exist: false
            has_ghost_secret_ref: true
  - name: Pod with live Secret passes
    verdict: PASS
    asset:
      asset_id: "k8s/orders/deployment/orders-api"
      asset_type: aws_eks_pod_spec
      vendor: aws
      properties:
        k8s:
          pod_spec:
            secret_refs: ["orders-db-creds"]
            secret_refs_exist: true
            has_ghost_secret_ref: false
