dsl_version: ctrl.v1
id: CTL.SNS.POLICY.SUBSCRIBE.BROAD.001
name: SNS Topic Policy Grants Subscribe to Broad Principals
description: >
  SNS topic policy grants sns:Subscribe to overly broad
  principals — Principal: "*", account root, wildcard role
  patterns, or cross-account principals without conditions.
  Subscribe creates a subscription that receives EVERY
  future message published to the topic. Broad Subscribe
  access is data-exfiltration capability: the attacker does
  not need to read existing messages — they receive every
  new one until the subscription is removed. Distinct from
  CTL.SNS.POLICY.PUBLIC.001 (Principal: "*"); this control
  fires when the principal is named but the principal class
  is too broad (account root, wildcard role pattern).
domain: exposure
severity: high
compliance:
  cis_aws_v3.0: "1.20"
  soc2: "CC6.1, CC6.6"
  nist_800_53_r5: "AC-3, AC-6"
  pci_dss_v4.0: "1.2, 7.1"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.5.15, A.8.3"
  ccm_v4: ["IAM-16"]
scope_tags:
  - aws
  - sns
taxonomy:
  - least-privilege
  - network-perimeter
  - trust-decay
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_sns_topic
params:
  attack_stage: collection
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.5
remediation:
  description: >
    SNS topic policy grants sns:Subscribe to a broad principal
    class. Any matching principal can create a subscription
    and receive every future message.
  action: >
    Replace broad principals (account root, wildcard role
    patterns) with the specific service accounts or roles
    that legitimately need to subscribe (typically a small
    fixed set: the Lambda execution role, the SQS poller's
    role, the third-party webhook integration). Audit
    subscribers periodically against the principal allowlist
    so decommissioned roles drop off.
  example: |
    {
      "messaging": {
        "kind": "topic",
        "sns": {
          "subscribe_broadly_granted": false,
          "policy_subscribe_principals": ["arn:aws:iam::111122223333:role/orders-consumer"]
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.messaging.kind
      op: eq
      value: topic
    - field: properties.messaging.sns.subscribe_broadly_granted
      op: eq
      value: true
defect: >
  SNS topic policy grants sns:Subscribe to a broad principal
  class.
infection: >
  sns:Subscribe creates a subscription that receives every
  message published to the topic. A principal with broad
  Subscribe access can create a subscription to any endpoint
  they control — an SQS queue in their account, a Lambda
  function they own, or an HTTP endpoint they operate. Every
  message published to the topic — alarm notifications,
  application events, customer data — is delivered to the
  attacker's endpoint. This is data exfiltration via
  subscription: the attacker does not need to read existing
  messages, they receive every future message until the
  subscription is removed. Detection is hard because the
  subscription itself is a normal SNS configuration; the
  endpoint may be in a different account, hidden behind a
  service principal.
failure: >
  Data exfiltration via subscription. Any matching principal
  can subscribe and continuously receive every future
  message from the topic.
tests:
  - name: Subscribe to account root fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:sns:us-east-1:111122223333:orders-topic"
      asset_type: aws_sns_topic
      vendor: aws
      properties:
        messaging:
          kind: topic
          sns:
            subscribe_broadly_granted: true
            policy_subscribe_principals:
              - "arn:aws:iam::111122223333:root"
            subscribe_principal_count: 1
  - name: Subscribe to specific role passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:sns:us-east-1:111122223333:orders-topic"
      asset_type: aws_sns_topic
      vendor: aws
      properties:
        messaging:
          kind: topic
          sns:
            subscribe_broadly_granted: false
            policy_subscribe_principals:
              - "arn:aws:iam::111122223333:role/orders-consumer"
            subscribe_principal_count: 1
  - name: Subscribe to Principal "*" fires (severe — public)
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:sns:us-east-1:111122223333:public-topic"
      asset_type: aws_sns_topic
      vendor: aws
      properties:
        messaging:
          kind: topic
          sns:
            subscribe_broadly_granted: true
            policy_subscribe_principals:
              - "*"
            subscribe_principal_count: 1
