dsl_version: ctrl.v1
id: CTL.SNS.INCOMPLETE.001
name: Complete Data Required for SNS Assessment
description: >
  The observation snapshot is missing required SNS topic properties.
domain: exposure
severity: info
compliance:
  ccm_v4: ["DCS-06"]
scope_tags:
  - aws
  - sns
type: unsafe_state
params: {}
remediation:
  description: >
    Observation is missing SNS topic properties.
  action: >
    Ensure the extractor calls aws sns get-topic-attributes and maps
    the KmsMasterKeyId to the messaging.encryption observation properties.
  example: |
    {
      "messaging": {
        "kind": "topic",
        "encryption": {
          "encrypted": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.messaging.kind
      op: eq
      value: topic
    - field: properties.messaging.encryption.encrypted
      op: missing
      value: true
