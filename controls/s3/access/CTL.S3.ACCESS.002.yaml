dsl_version: ctrl.v1
id: CTL.S3.ACCESS.002
name: No Wildcard Principal Policies
description: >
  S3 bucket policies must not grant access to a wildcard principal
  (Principal "*" or AWS: "*"). A wildcard principal makes every
  statement in the policy effectively anonymous or cross-account
  unless a restricting Condition (aws:PrincipalOrgID, aws:SourceVpc,
  aws:SourceIp with a fixed CIDR, aws:SourceArn, etc.) narrows it.
  Without such a Condition, the policy is a public-access grant
  regardless of which specific S3 actions are allowed.
domain: exposure
exposure:
  type: wildcard_principal
  principal_scope: public
severity: high
compliance:
  nist_800_53_r5: "AC-6"
  ccm_v4: ["DSP-17", "IAM-16"]
scope_tags:
  - aws
  - s3
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_bucket
params:
  attack_stage: exfiltration
remediation:
  description: >
    Bucket policy contains a statement with a wildcard principal.
    Unless a Condition restricts the caller, any AWS identity or
    anonymous caller can invoke the statement's allowed actions.
  action: >
    1. Narrow the Allow. Replace the wildcard principal with the
       specific AWS account IDs or role ARNs that actually need
       access. If a wildcard must remain (cross-org distribution,
       service-bound caller), add a restricting Condition that fixes
       the caller set: aws:PrincipalOrgID, aws:SourceVpc /
       aws:SourceVpce, aws:SourceIp with a fixed CIDR, or
       aws:SourceArn.

    2. If the bucket genuinely needs to be reachable from the
       public internet (CDN origin, static asset distribution),
       prefer scoped mechanisms over a wildcard bucket policy:
       CloudFront Origin Access Control, S3 Access Points with
       network-bound policies, or signed/presigned URLs. These
       give you a narrow Allow on a defined caller surface
       instead of a "*" Allow with hopeful Conditions.

    3. Keep S3 Block Public Access fully enforced as an interim
       guard while the policy change is being rolled out — PAB
       does not fix a broad Allow, it only suppresses its effect
       at the network boundary, so treat it as a containment
       layer rather than the remediation.
  example: |
    {
      "storage": {
        "kind": "bucket",
        "access": {
          "has_wildcard_principal": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.access.has_wildcard_principal
      op: eq
      value: true
