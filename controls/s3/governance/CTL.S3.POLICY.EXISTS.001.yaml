dsl_version: ctrl.v1
id: CTL.S3.POLICY.EXISTS.001
name: S3 Bucket Must Have an Explicit Bucket Policy Attached
description: >
  S3 buckets must have an explicit resource-based bucket policy. Without
  a policy, access controls rely entirely on IAM and ACLs — there is no
  resource-level enforcement of encryption requirements, VPC restrictions,
  or transport security.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "AC-3"
  hipaa: "164.312(a)(1)"
  soc2: "CC6.1"
  ccm_v4: ["DSP-07", "GRC-05"]
scope_tags:
  - aws
  - s3
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: >
    S3 bucket has no bucket policy attached. Resource-level access
    controls cannot be enforced.
  action: >
    Attach a bucket policy that restricts access to known principals,
    VPC endpoints, or organization IDs (aws:PrincipalArn,
    aws:PrincipalOrgID, aws:SourceVpc, aws:SourceVpce). The scoped
    Allow is the primary control: it defines who can reach the bucket
    at all and is the line of defence that would still hold if every
    other guard were removed.

    Layered Deny statements (deny aws:SecureTransport=false to enforce
    TLS, deny PutObject without server-side encryption headers) are
    valuable secondary guards but do not replace a scoped Allow —
    they harden a bucket whose Allow is already narrow, they do not
    rescue one whose Allow is broad. Apply them after the Allow has
    been scoped, not instead of scoping it.

    Warning: do not add Deny statements before scoping the Allow. A
    Deny that references your own principals (e.g. denying access
    unless aws:PrincipalOrgID matches and SourceIP is on a missing
    list) can lock the account out of its own bucket if the Allow
    has not been verified to admit the operator first. Order matters:
    scope the Allow, verify access still works, then add Deny guards.
  example: |
    {
      "storage": {
        "kind": "bucket",
        "policy_json": "{\"Version\":\"2012-10-17\",\"Statement\":[...]}"
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.policy_json
      op: eq
      value: ""
