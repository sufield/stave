dsl_version: ctrl.v1
id: CTL.S3.DETECT.MACIE.002
name: Macie Automated Sensitive Data Discovery Must Be Active
description: >
  Buckets monitored by Macie must have automated sensitive data
  discovery actively running, not just enabled. A Macie classification
  job can exist but be paused, cancelled, or have never completed a
  scan. Without active discovery, new sensitive data uploaded after
  the last scan goes undetected. Automated discovery continuously
  samples bucket contents to find sensitive data as it arrives.
domain: exposure
severity: medium
compliance:
  hipaa: "164.308(a)(1)(ii)(D)"
  soc2: "CC7.2"
  nist_800_53_r5: "SI-4"
  fedramp_moderate: "SI-4"
  ccm_v4: ["DSP-03"]
scope_tags:
  - aws
  - s3
  - sensitive-data
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_bucket
params:
  attack_stage: exfiltration
remediation:
  description: >
    Macie is enabled for this bucket but automated sensitive data
    discovery is not active. New sensitive data is not being detected.
  action: >
    Verify the Macie classification job for this bucket is in RUNNING
    status. If paused, resume it with aws macie2 update-classification-job.
    Enable automated sensitive data discovery at the account level with
    aws macie2 update-automated-discovery-configuration to ensure
    continuous sampling of all monitored buckets.
  example: |
    {
      "storage": {
        "kind": "bucket",
        "macie": {
          "enabled": true,
          "classification_job_active": true,
          "automated_discovery": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.macie.enabled
      op: eq
      value: true
    - field: properties.storage.macie.automated_discovery
      op: eq
      value: false
