dsl_version: ctrl.v1
id: CTL.S3.AP.PAB.BLOCKPUBLICPOLICY.001
name: S3 Access Point Block Public Policy Flag Must Be Enabled
description: >
  The `BlockPublicPolicy` flag of a single-region S3 Access Point's
  Public Access Block configuration rejects any new Access Point policy
  that grants access to a public principal (`Principal: "*"`,
  `Principal: {"AWS": "*"}`, or an Allow block with no Principal) without
  a narrowing `Condition`. When this specific flag is `false`, new
  policies with wildcard principals and no scoping Condition succeed at
  PUT time rather than being rejected at the Access Point boundary.
  The umbrella `CTL.S3.AP.PAB.001` fires when any of the four AP PAB
  flags is off; this control narrows the finding to the specific flag
  so remediation is a one-command fix rather than requiring the operator
  to enumerate which of the four is missing. Prowler and ScoutSuite
  both report the four flags independently.
domain: exposure
severity: high
compliance:
  hipaa: "164.312(a)(1)"
  soc2: "CC6.1"
  ccm_v4: ["DSP-07", "DSP-17"]
scope_tags:
  - aws
  - s3
taxonomy:
  - compliance-mapping
  - network-perimeter
  - trust-boundary
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3_access_point
params:
  attack_stage: initial_access
remediation:
  description: >
    The Access Point's `BlockPublicPolicy` PAB flag is disabled. New
    Access Point policies that grant access to a wildcard principal
    without a scoping Condition will succeed at PUT time.
  action: >
    Enable the `BlockPublicPolicy` flag on the Access Point's Public
    Access Block configuration. From the CLI:

        aws s3control put-access-point-public-access-block \
          --account-id <account> \
          --name <access-point-name> \
          --public-access-block-configuration \
          'BlockPublicAcls=<current>,IgnorePublicAcls=<current>,BlockPublicPolicy=true,RestrictPublicBuckets=<current>'

    Preserve the other three flag values so enabling this one doesn't
    silently disable the others.
  example: |
    {
      "storage": {
        "kind": "access_point",
        "public_access_block": {
          "block_public_policy": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: access_point
    - field: properties.storage.public_access_block.block_public_policy
      op: eq
      value: false
