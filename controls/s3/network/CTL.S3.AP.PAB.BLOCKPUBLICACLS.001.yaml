dsl_version: ctrl.v1
id: CTL.S3.AP.PAB.BLOCKPUBLICACLS.001
name: S3 Access Point Block Public ACLs Flag Must Be Enabled
description: >
  The `BlockPublicAcls` flag of a single-region S3 Access Point's Public
  Access Block configuration rejects any new ACL grant applied through
  the Access Point endpoint that would make the data publicly accessible.
  When this specific flag is `false`, new PUT-ACL calls routed via the
  Access Point that grant `READ`, `WRITE`, `READ_ACP`, or `WRITE_ACP`
  to `http://acs.amazonaws.com/groups/global/AllUsers` or
  `.../AuthenticatedUsers` succeed rather than being rejected at the
  Access Point boundary. The umbrella `CTL.S3.AP.PAB.001` fires when any
  of the four AP PAB flags is off; this control narrows the finding to
  the specific flag so remediation is a one-command fix rather than
  requiring the operator to enumerate which of the four is missing.
  Prowler and ScoutSuite both report the four flags independently.
domain: exposure
severity: high
compliance:
  hipaa: "164.312(a)(1)"
  soc2: "CC6.1"
  ccm_v4: ["DSP-07", "DSP-17"]
scope_tags:
  - aws
  - s3
type: unsafe_state
params:
  attack_stage: initial_access
remediation:
  description: >
    The Access Point's `BlockPublicAcls` PAB flag is disabled. New PUT-ACL
    calls routed through this Access Point that grant read or write to
    AllUsers or AuthenticatedUsers will succeed rather than being blocked
    at the Access Point boundary.
  action: >
    Enable the `BlockPublicAcls` flag on the Access Point's Public Access
    Block configuration. From the CLI:

        aws s3control put-access-point-public-access-block \
          --account-id <account> \
          --name <access-point-name> \
          --public-access-block-configuration \
          'BlockPublicAcls=true,IgnorePublicAcls=<current>,BlockPublicPolicy=<current>,RestrictPublicBuckets=<current>'

    Preserve the other three flag values so enabling this one doesn't
    silently disable the others.
  example: |
    {
      "storage": {
        "kind": "access_point",
        "public_access_block": {
          "block_public_acls": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: access_point
    - field: properties.storage.public_access_block.block_public_acls
      op: eq
      value: false
