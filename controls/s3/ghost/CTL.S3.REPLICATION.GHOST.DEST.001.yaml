dsl_version: ctrl.v1
id: CTL.S3.REPLICATION.GHOST.DEST.001
name: S3 Replication Destination Bucket Deleted
description: >
  S3 bucket has a replication rule configured but the
  destination bucket has been deleted. Replication
  silently fails — objects written to the source bucket
  are not replicated. If the destination bucket name is
  re-registered under a different account, replication
  may resume to attacker-controlled storage. This is a
  direct bucket hijacking vector: the source bucket's
  replication configuration still contains the
  destination bucket name, and S3 resolves names
  globally.
domain: exposure
severity: high
archetype: ghost-reference
scope: compound
compliance:
  cis_aws_v3.0: "2.1.3"
  soc2: "CC6.1"
  nist_800_53_r5: "AC-3, SC-28"
  ccm_v4: ["DSP-04"]
scope_tags:
  - aws
  - s3
taxonomy:
  - trust-decay
  - data-protection
type: unsafe_state
classification: state_assertion
params:
  attack_stage: exfiltration
  blast_radius:
    type: data
    scope: service
    multiplier: 3.0
remediation:
  description: >
    S3 replication destination bucket has been deleted.
    Replication silently fails and the dangling name is
    vulnerable to hijack.
  action: >
    Either (a) recreate the destination bucket with the
    original name and restore the replication IAM role
    policy, or (b) update the replication rule to point
    at an existing bucket: aws s3api
    put-bucket-replication --bucket <source>
    --replication-configuration file://repl.json. If
    replication is no longer needed, delete the rule
    entirely rather than leaving a dangling reference.
    After repointing, verify by uploading a test object
    to the source and confirming it appears in the
    destination.
  example: |
    {
      "data": {
        "kind": "bucket",
        "s3": {
          "replication": {
            "enabled": true,
            "destination_bucket": "prod-replica-us-west-2",
            "destination_exists": true,
            "has_ghost_destination": false
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.data.kind
      op: eq
      value: bucket
    - field: properties.data.s3.replication.has_ghost_destination
      op: eq
      value: true
defect: >
  S3 replication rule references a destination bucket
  that has been deleted.
infection: >
  S3 cross-region or cross-account replication copies
  every object written to the source bucket into the
  destination bucket. When the destination is deleted,
  replication fails silently — PutObject succeeds on the
  source, but the replica is never created. The
  replication configuration still names the deleted
  bucket. Because S3 bucket names are globally unique,
  any account can re-register the same name. If an
  attacker registers the destination name, S3 replication
  may resume writing objects to attacker-controlled
  storage. The source bucket owner sees replication
  "configured" — the rule exists, the IAM role exists —
  but the destination is an attacker bucket.
failure: >
  Replication data loss and potential exfiltration.
  Every object written to the source bucket either
  fails to replicate (data loss) or replicates to
  attacker-controlled storage (exfiltration).
tests:
  - name: replication to deleted destination fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:s3:::prod-data-us-east-1"
      asset_type: aws_s3_bucket
      vendor: aws
      properties:
        data:
          kind: bucket
          s3:
            replication:
              enabled: true
              destination_bucket: "prod-replica-us-west-2-deleted"
              destination_exists: false
              has_ghost_destination: true
  - name: replication to live destination passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:s3:::prod-data-us-east-1"
      asset_type: aws_s3_bucket
      vendor: aws
      properties:
        data:
          kind: bucket
          s3:
            replication:
              enabled: true
              destination_bucket: "prod-replica-us-west-2"
              destination_exists: true
              has_ghost_destination: false
