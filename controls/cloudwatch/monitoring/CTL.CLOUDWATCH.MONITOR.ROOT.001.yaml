dsl_version: ctrl.v1
id: CTL.CLOUDWATCH.MONITOR.ROOT.001
name: "Root Account Usage Must Be Monitored"
description: >
  A CloudWatch metric filter and alarm must monitor root account usage.
  Root account API activity should be near-zero. Any activity may indicate compromise or unauthorized administrative action.
domain: exposure
severity: high
compliance:
  owasp_nhi: "NHI8"
  cis_aws_v3.0: "4.3"
  soc2: "CC7.1"
  ccm_v4: ["LOG-03"]
scope_tags:
  - aws
  - cloudwatch
taxonomy:
  - compliance-mapping
  - logging
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
remediation:
  description: >
    No metric filter or alarm is configured to monitor root account usage.
  action: >
    Create a CloudWatch log metric filter on the CloudTrail log group
    matching the CIS-specified pattern for root account usage, then create
    an alarm with an SNS notification action.
  example: |
    {
      "monitoring": {
        "kind": "account",
        "metric_filters": {
          "root_account_usage": {
            "exists": true
          }
        },
        "alarms": {
          "root_account_usage": {
            "exists": true,
            "sns_topic_arn": "arn:aws:sns:us-east-1:123456789012:security-alerts"
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.monitoring.kind
      op: eq
      value: account
    - field: properties.monitoring.metric_filters.root_account_usage.exists
      op: ne
      value: true
