dsl_version: ctrl.v1
id: CTL.CLOUDWATCH.MONITOR.NOMFA.001
name: "Console Sign-In Without MFA Must Be Monitored"
description: >
  A CloudWatch metric filter and alarm must monitor console sign-in without mfa.
  Console sign-ins without MFA indicate either MFA is not enforced or credentials were used from a context that bypassed MFA.
domain: exposure
severity: medium
compliance:
  owasp_nhi: "NHI8"
  cis_aws_v3.0: "4.2"
  soc2: "CC7.1"
  ccm_v4: ["LOG-03"]
scope_tags:
  - aws
  - cloudwatch
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - logging
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
remediation:
  description: >
    No metric filter or alarm is configured to monitor console sign-in without mfa.
  action: >
    Create a CloudWatch log metric filter on the CloudTrail log group
    matching the CIS-specified pattern for console sign-in without mfa, then create
    an alarm with an SNS notification action.
  example: |
    {
      "monitoring": {
        "kind": "account",
        "metric_filters": {
          "console_signin_no_mfa": {
            "exists": true
          }
        },
        "alarms": {
          "console_signin_no_mfa": {
            "exists": true,
            "sns_topic_arn": "arn:aws:sns:us-east-1:123456789012:security-alerts"
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.monitoring.kind
      op: eq
      value: account
    - field: properties.monitoring.metric_filters.console_signin_no_mfa.exists
      op: eq
      value: false
