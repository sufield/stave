dsl_version: ctrl.v1
id: CTL.CLOUDWATCH.MONITOR.AUTHFAIL.001
name: "Console Authentication Failures Must Be Monitored"
description: >
  A CloudWatch metric filter and alarm must monitor console authentication failures.
  Failed console authentication attempts indicate brute force attacks against IAM user passwords.
domain: exposure
severity: medium
compliance:
  cis_aws_v3.0: "4.6"
  soc2: "CC7.1"
scope_tags:
  - aws
  - cloudwatch
type: unsafe_state
params:
  attack_stage: detection_evasion
remediation:
  description: >
    No metric filter or alarm is configured to monitor console authentication failures.
  action: >
    Create a CloudWatch log metric filter on the CloudTrail log group
    matching the CIS-specified pattern for console authentication failures, then create
    an alarm with an SNS notification action.
  example: |
    {
      "monitoring": {
        "kind": "account",
        "metric_filters": {
          "console_auth_failures": {
            "exists": true
          }
        },
        "alarms": {
          "console_auth_failures": {
            "exists": true,
            "sns_topic_arn": "arn:aws:sns:us-east-1:123456789012:security-alerts"
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.monitoring.kind
      op: eq
      value: account
    - field: properties.monitoring.metric_filters.console_auth_failures.exists
      op: eq
      value: false
