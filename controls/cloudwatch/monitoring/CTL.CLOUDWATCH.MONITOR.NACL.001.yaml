dsl_version: ctrl.v1
id: CTL.CLOUDWATCH.MONITOR.NACL.001
name: "NACL Changes Must Be Monitored"
description: >
  A CloudWatch metric filter and alarm must monitor nacl changes.
  Network ACL changes can open or close network paths.
domain: exposure
severity: medium
compliance:
  cis_aws_v3.0: "4.11"
  soc2: "CC7.1"
scope_tags:
  - aws
  - cloudwatch
type: unsafe_state
params:
  attack_stage: detection_evasion
remediation:
  description: >
    No metric filter or alarm is configured to monitor nacl changes.
  action: >
    Create a CloudWatch log metric filter on the CloudTrail log group
    matching the CIS-specified pattern for nacl changes, then create
    an alarm with an SNS notification action.
  example: |
    {
      "monitoring": {
        "kind": "account",
        "metric_filters": {
          "nacl_changes": {
            "exists": true
          }
        },
        "alarms": {
          "nacl_changes": {
            "exists": true,
            "sns_topic_arn": "arn:aws:sns:us-east-1:123456789012:security-alerts"
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.monitoring.kind
      op: eq
      value: account
    - field: properties.monitoring.metric_filters.nacl_changes.exists
      op: eq
      value: false
