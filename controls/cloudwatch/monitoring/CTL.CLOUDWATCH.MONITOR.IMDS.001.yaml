dsl_version: ctrl.v1
id: CTL.CLOUDWATCH.MONITOR.IMDS.001
name: IMDS Configuration Changes Must Be Monitored
description: >
  CloudWatch alarms must detect changes to EC2 instance metadata
  options (ModifyInstanceMetadataOptions). Without monitoring, an
  attacker can downgrade IMDSv2 to IMDSv1 silently.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "AU-12"
  soc2: "CC7.1"
  ccm_v4: ["LOG-03", "LOG-05"]
scope_tags:
  - aws
  - cloudwatch
  - ec2
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
remediation:
  description: No alarms detect IMDS configuration changes.
  action: >
    Create a CloudWatch metric filter on CloudTrail events matching
    ModifyInstanceMetadataOptions. Create an alarm with SNS
    notification for any match.
unsafe_predicate:
  all:
    - field: properties.monitoring.metric_filters.imds_config_changes.exists
      op: eq
      value: false
