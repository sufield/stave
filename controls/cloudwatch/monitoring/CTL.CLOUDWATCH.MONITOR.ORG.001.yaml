dsl_version: ctrl.v1
id: CTL.CLOUDWATCH.MONITOR.ORG.001
name: "AWS Organizations Changes Must Be Monitored"
description: >
  A CloudWatch metric filter and alarm must monitor aws organizations changes.
  Organizations changes affect account-level governance and SCP enforcement.
domain: exposure
severity: medium
compliance:
  cis_aws_v3.0: "4.15"
  soc2: "CC7.1"
  ccm_v4: ["LOG-03"]
scope_tags:
  - aws
  - cloudwatch
taxonomy:
  - compliance-mapping
  - logging
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
remediation:
  description: >
    No metric filter or alarm is configured to monitor aws organizations changes.
  action: >
    Create a CloudWatch log metric filter on the CloudTrail log group
    matching the CIS-specified pattern for aws organizations changes, then create
    an alarm with an SNS notification action.
  example: |
    {
      "monitoring": {
        "kind": "account",
        "metric_filters": {
          "organizations_changes": {
            "exists": true
          }
        },
        "alarms": {
          "organizations_changes": {
            "exists": true,
            "sns_topic_arn": "arn:aws:sns:us-east-1:123456789012:security-alerts"
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.monitoring.kind
      op: eq
      value: account
    - field: properties.monitoring.metric_filters.organizations_changes.exists
      op: ne
      value: true
