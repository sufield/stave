dsl_version: ctrl.v1
id: CTL.CLOUDWATCH.MONITOR.MFADEVICE.001
name: MFA Device Changes Must Be Monitored
description: >
  A CloudWatch metric filter and alarm must monitor MFA device
  enrollment and deactivation events. MFA device changes
  (CreateVirtualMFADevice, EnableMFADevice, DeactivateMFADevice,
  DeleteVirtualMFADevice) are a persistence mechanism — an attacker
  who gains temporary access can enroll their own MFA device to
  maintain access after the victim resets their password.
domain: exposure
severity: medium
compliance:
  soc2: "CC7.1"
  nist_800_53_r5: "SI-4"
  fedramp_moderate: "SI-4"
scope_tags:
  - aws
  - cloudwatch
type: unsafe_state
params:
  attack_stage: detection_evasion
remediation:
  description: >
    No metric filter or alarm is configured to monitor MFA device
    changes. Unauthorized MFA enrollment goes undetected.
  action: >
    Create a CloudWatch log metric filter on the CloudTrail log group
    matching CreateVirtualMFADevice, EnableMFADevice, DeactivateMFADevice,
    and DeleteVirtualMFADevice events. Create an alarm with an SNS
    notification action to alert on any MFA device change.
  example: |
    {
      "monitoring": {
        "kind": "account",
        "metric_filters": {
          "mfa_device_changes": {
            "exists": true
          }
        },
        "alarms": {
          "mfa_device_changes": {
            "exists": true,
            "sns_topic_arn": "arn:aws:sns:us-east-1:123456789012:security-alerts"
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.monitoring.metric_filters.mfa_device_changes.exists
      op: eq
      value: false
