dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.LOG.GROUP.MISSING.001
name: Step Functions Log Destination CloudWatch Group Does Not Exist
description: >
  Step Functions log configuration references
  a CloudWatch Log group that does not exist.
  Log delivery silently drops events — the
  state machine reports logging-enabled, the
  pipeline appears healthy from inventory, but
  no events arrive at any consumer. Common
  pattern: log group renamed or deleted by
  another team without checking which services
  delivered to it.
domain: detection
severity: high
compliance:
  soc2: "CC7.2, A1.2"
  pci_dss_v4.0: "10.4.1"
  nist_800_53_r5: "AU-3, AU-12"
  fedramp_moderate: "AU-3"
  iso_27001_2022: "A.8.15"
  ccm_v4: ["LOG-04", "LOG-08"]
scope_tags:
  - aws
  - stepfunctions
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: detection_evasion
remediation:
  description: >
    Log destination references missing CWL
    group.
  action: >
    Re-create the log group or repoint via
    UpdateStateMachine --logging-configuration.
    Verify with describe-state-machine.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "log": {
          "destination_log_group_exists": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.log.destination_log_group_exists
      op: eq
      value: false
defect: >
  Log destination CWL group missing.
infection: >
  Events generated by state machine drop
  silently; compliance report says logging
  enabled while reality is no audit data
  persists.
failure: >
  Silent log loss.
tests:
  - name: missing fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          log:
            destination_log_group_exists: false
  - name: present passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          log:
            destination_log_group_exists: true
