dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.LOG.EXPRESS.UNARCHIVED.001
name: Step Functions Express Workflow Logs Not Exported To Long-Retention Store
description: >
  Express workflow logs go only to CloudWatch
  with default retention. Unlike Standard
  (which retains execution history for ~90
  days via the API), Express has no API
  history at all — logs are the only record.
  Without long-retention archival (S3 export,
  SIEM ingestion), evidence beyond the CWL
  retention window is gone.
domain: detect
severity: medium
compliance:
  soc2: "CC7.2"
  pci_dss_v4.0: "10.5.1"
  nist_800_53_r5: "AU-11"
  fedramp_moderate: "AU-11"
  iso_27001_2022: "A.5.33, A.8.15"
  ccm_v4: ["LOG-04"]
scope_tags:
  - aws
  - stepfunctions
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: detection_evasion
remediation:
  description: >
    Express logs only in CWL with default
    retention.
  action: >
    Add log subscription filter exporting to
    Kinesis Firehose → S3 (or SIEM ingest).
    Apply S3 lifecycle for cost control.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "log": {
          "express_archived_long_retention": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.log.is_express
      op: eq
      value: true
    - field: properties.compute.log.express_archived_long_retention
      op: eq
      value: false
defect: >
  Express workflow logs not archived to long
  retention.
infection: >
  Beyond CWL retention, no record of any
  Express execution exists.
failure: >
  Express observability cliff.
tests:
  - name: not archived fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          log:
            is_express: true
            express_archived_long_retention: false
  - name: archived passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          log:
            is_express: true
            express_archived_long_retention: true
