dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.IAM.CROSSACCOUNT.NOEXTERNAL.001
name: Step Functions Cross-Account StartExecution Without ExternalId
description: >
  Step Functions cross-account `states:StartExecution`
  grant lacks an `sts:ExternalId` condition. Any
  role in the foreign account can assume into
  the trusted role and start executions —
  classic confused-deputy. ExternalId binds
  the trust to a specific tenant / integration.
domain: exposure
severity: high
compliance:
  soc2: "CC6.1, CC6.6"
  pci_dss_v4.0: "7.2.4"
  nist_800_53_r5: "AC-3, AC-6"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.5.16, A.8.20"
  ccm_v4: ["IAM-09", "IAM-16"]
scope_tags:
  - aws
  - stepfunctions
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: privilege_escalation
  blast_radius:
    type: cross_account
    scope: cross_account
    multiplier: 3.0
remediation:
  description: >
    Cross-account StartExecution lacks
    ExternalId.
  action: >
    Add sts:ExternalId condition matching the
    integration's known external ID. Distribute
    the ExternalId out-of-band.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "iam": {
          "crossaccount_externalid_present": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.iam.has_crossaccount_principal
      op: eq
      value: true
    - field: properties.compute.iam.crossaccount_externalid_present
      op: eq
      value: false
defect: >
  Cross-account grant without ExternalId.
infection: >
  Any role in foreign account assumes trusted
  role and starts executions; surface = entire
  foreign account.
failure: >
  Cross-account confused-deputy surface.
tests:
  - name: no externalid fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          iam:
            has_crossaccount_principal: true
            crossaccount_externalid_present: false
  - name: externalid present passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          iam:
            has_crossaccount_principal: true
            crossaccount_externalid_present: true
