dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.ASL.DM.NO.RESULTWRITER.001
name: Step Functions Distributed Map Lacks ResultWriter For Large Outputs
description: >
  Distributed Map state has no `ResultWriter`
  configured. Map output is collected in-memory
  and capped at the 256 KB execution-payload
  limit. Aggregate output truncates silently
  when the limit is hit; downstream sees
  partial results without explicit signal.
  ResultWriter writes per-iteration outputs to
  S3, sidestepping the limit.
domain: lifecycle
severity: medium
compliance:
  soc2: "CC7.4"
  nist_800_53_r5: "SI-11"
  fedramp_moderate: "SI-11"
  iso_27001_2022: "A.8.16"
  ccm_v4: ["BCR-08"]
scope_tags:
  - aws
  - stepfunctions
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: persistence
remediation:
  description: >
    Distributed Map without ResultWriter.
  action: >
    Add ResultWriter pointing at an S3 bucket.
    Configure bucket policy to deny non-VPC
    writes and use SSE-KMS.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "asl": {
          "dm_no_resultwriter_count": 0
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.asl.dm_no_resultwriter_count
      op: gt
      value: 0
defect: >
  Distributed Map without ResultWriter.
infection: >
  Aggregate output truncated at 256 KB;
  partial results silent.
failure: >
  Output-handling silent truncation.
tests:
  - name: missing fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          asl:
            dm_no_resultwriter_count: 1
  - name: present passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          asl:
            dm_no_resultwriter_count: 0
