dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.ASL.DM.CHILD.IAM.INHERIT.001
name: Step Functions Distributed Map Child Executions Inherit Parent's Broad IAM
description: >
  Distributed Map's child executions inherit
  the parent state machine's IAM execution
  role. If the parent role is broadly scoped
  (already a defect from SF-2), every child
  execution multiplies the blast radius —
  thousands of concurrent processes operating
  with the same broad permissions, any of
  which can be compromised by a malicious
  input record.
domain: exposure
severity: high
compliance:
  soc2: "CC6.1, CC6.3"
  nist_800_53_r5: "AC-6"
  fedramp_moderate: "AC-6"
  iso_27001_2022: "A.5.15, A.8.20"
  ccm_v4: ["IAM-02", "IAM-16"]
scope_tags:
  - aws
  - stepfunctions
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: privilege_escalation
remediation:
  description: >
    DM child executions use parent's broad
    role.
  action: >
    Define a separate child execution role for
    Distributed Map iterations. Scope the
    child role to only the actions a single
    iteration needs.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "asl": {
          "dm_child_role_separate": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.asl.has_distributed_map
      op: eq
      value: true
    - field: properties.compute.asl.dm_child_role_separate
      op: eq
      value: false
defect: >
  DM child executions share parent's role.
infection: >
  Per-iteration compromise multiplies the
  blast radius across thousands of concurrent
  executions.
failure: >
  Per-iteration least-privilege absent.
tests:
  - name: shared role fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          asl:
            has_distributed_map: true
            dm_child_role_separate: false
  - name: separate role passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          asl:
            has_distributed_map: true
            dm_child_role_separate: true
