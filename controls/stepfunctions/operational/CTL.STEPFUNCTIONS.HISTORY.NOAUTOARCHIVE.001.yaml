dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.HISTORY.NOAUTOARCHIVE.001
name: Step Functions Old Executions Not Auto-Archived To Cold Storage
description: >
  Step Functions Standard execution history
  ages out at ~90 days; without auto-archive,
  old execution data is gone for good. Even
  with EventBridge Status-Change events
  exported (SF-5), the per-step detail
  history doesn't survive. For long-tail
  audit, configure scheduled
  GetExecutionHistory + S3 export.
domain: governance
severity: low
compliance:
  soc2: "CC7.2"
  pci_dss_v4.0: "10.5.1"
  nist_800_53_r5: "AU-11"
  fedramp_moderate: "AU-11"
  iso_27001_2022: "A.5.33"
  ccm_v4: ["LOG-04"]
scope_tags:
  - aws
  - stepfunctions
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: detection_evasion
remediation:
  description: >
    No execution-history auto-archive.
  action: >
    Schedule a daily / weekly Lambda that
    pages GetExecutionHistory for all
    completed-and-aged executions and
    writes to S3 with lifecycle.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "operational": {
          "history_autoarchive": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.operational.history_autoarchive
      op: eq
      value: false
defect: >
  No auto-archive of execution history.
infection: >
  Per-step history gone after 90 days.
failure: >
  Long-tail audit gap.
tests:
  - name: missing fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          operational:
            history_autoarchive: false
  - name: present passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          operational:
            history_autoarchive: true
