dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.IAC.OWNERSHIP.001
name: Step Functions IaC Module Lacks Ownership / On-Call Tags
description: >
  Step Functions state machine's IaC module
  lacks `owner` and `oncall-rotation` tags
  pointing at a maintainer team. During
  incidents, on-call has no quick path to
  the owner; for production-tier workflows
  this delays response.
domain: governance
severity: low
compliance:
  soc2: "CC8.1, A1.1"
  nist_800_53_r5: "CM-8, IR-6"
  fedramp_moderate: "CM-8"
  iso_27001_2022: "A.5.9, A.5.30"
  ccm_v4: ["GRC-08"]
scope_tags:
  - aws
  - stepfunctions
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: persistence
remediation:
  description: >
    IaC ownership tags missing.
  action: >
    Add `owner` (team email or PagerDuty
    rotation), `oncall-rotation` (rotation
    name), `runbook` (URL). Enforce via
    tag-policy SCP.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "operational": {
          "ownership_tags_complete": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.operational.ownership_tags_complete
      op: eq
      value: false
defect: >
  Ownership / on-call tags missing.
infection: >
  Slow incident response; ambiguous
  ownership.
failure: >
  Incident-response readiness gap.
tests:
  - name: missing fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          operational:
            ownership_tags_complete: false
  - name: present passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          operational:
            ownership_tags_complete: true
