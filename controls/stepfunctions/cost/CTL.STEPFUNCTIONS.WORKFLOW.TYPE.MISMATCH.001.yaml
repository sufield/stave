dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.WORKFLOW.TYPE.MISMATCH.001
name: Step Functions Workflow Type Mismatched For Workload Pattern
description: >
  Step Functions Standard workflow used for
  short, high-volume executions (cost
  prohibitive: $0.025 per state transition);
  or Express workflow used for executions
  that exceed 5 minutes (silent failure at
  the cap). Workflow type should match
  workload's runtime profile.
domain: governance
severity: medium
compliance:
  soc2: "CC8.1, A1.1"
  nist_800_53_r5: "CM-7"
  fedramp_moderate: "CM-7"
  iso_27001_2022: "A.8.6"
  ccm_v4: ["BCR-08"]
scope_tags:
  - aws
  - stepfunctions
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: persistence
remediation:
  description: >
    Workflow type mismatched for workload.
  action: >
    Standard for: long-running, low-volume,
    state-transition-bounded. Express for:
    short, high-volume, IAM-rate-bounded.
    Convert via blue-green; pricing change
    is significant.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "cost": {
          "type_matches_workload": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.cost.type_matches_workload
      op: eq
      value: false
defect: >
  Workflow type mismatched for workload.
infection: >
  Either runaway cost (Standard for high-vol)
  or silent execution cap (Express for long).
failure: >
  Type / workload mismatch.
tests:
  - name: mismatch fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          cost:
            type_matches_workload: false
  - name: matched passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          cost:
            type_matches_workload: true
