dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.SECRETS.001
name: Step Functions State Machines Must Not Contain Secrets in Definitions
description: >
  Step Functions state machine definitions must not contain hardcoded
  secrets. Definition JSON is visible in the console, API responses,
  and CloudTrail logs.
domain: exposure
severity: critical
compliance:
  nist_800_53_r5: "IA-5(7)"
  soc2: "CC6.1"
  ccm_v4: ["IAM-16", "DSP-17"]
scope_tags: [aws, stepfunctions]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
remediation:
  description: Step Functions state machine definition contains secrets.
  action: Replace hardcoded secrets with Secrets Manager or Parameter Store references.
  example: |
    {"compute": {"kind": "state_machine", "secrets": {"has_secrets_in_definition": false}}}
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.secrets.has_secrets_in_definition
      op: eq
      value: true
