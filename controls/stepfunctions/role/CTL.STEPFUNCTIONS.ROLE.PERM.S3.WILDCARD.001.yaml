dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.ROLE.PERM.S3.WILDCARD.001
name: Step Functions Execution Role Grants s3:* On Wildcard Resource
description: >
  Execution role grants `s3:*` on
  `Resource: "*"`. Includes object reads,
  writes, deletes, bucket-policy modifications,
  and replication-config changes. Distributed
  Map state and direct S3 SDK integrations
  inherit this scope; one workflow becomes a
  total-S3 pivot.
domain: exposure
severity: critical
compliance:
  soc2: "CC6.1, CC6.3"
  pci_dss_v4.0: "7.2.1"
  nist_800_53_r5: "AC-6"
  fedramp_moderate: "AC-6"
  iso_27001_2022: "A.5.15, A.8.20"
  ccm_v4: ["IAM-02", "IAM-16"]
scope_tags:
  - aws
  - stepfunctions
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: privilege_escalation
  blast_radius:
    type: data_destruction
    scope: account
    multiplier: 3.5
remediation:
  description: >
    s3:* on Resource:*.
  action: >
    Restrict to specific bucket / object ARNs.
    Split read vs write actions where possible.
    Reserve s3:DeleteObject / s3:PutBucketPolicy
    for explicit workflow steps.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "role": {
          "s3_wildcard": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.role.s3_wildcard
      op: eq
      value: true
defect: >
  s3:* granted on Resource:*.
infection: >
  Workflow can read / modify / delete any
  bucket in the account.
failure: >
  Object-store authority unscoped.
tests:
  - name: wildcard fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          role:
            s3_wildcard: true
  - name: scoped passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          role:
            s3_wildcard: false
