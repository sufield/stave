dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.ROLE.NOCONDITIONS.001
name: Step Functions Execution Role Lacks Defense-In-Depth Condition Keys
description: >
  Execution role's identity-based policies have
  no defense-in-depth condition keys —
  `aws:RequestedRegion`, `aws:CalledVia`,
  `aws:SourceVpc`, `aws:VpcSourceIp`. Granted
  actions execute regardless of where the call
  comes from. Conditions reduce blast radius
  during a credential-leak incident: stolen
  credentials are useless from outside the
  expected region or service path.
domain: governance
severity: low
compliance:
  soc2: "CC6.1"
  nist_800_53_r5: "AC-3, AC-6"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.5.15, A.8.20"
  ccm_v4: ["IAM-16"]
scope_tags:
  - aws
  - stepfunctions
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: persistence
remediation:
  description: >
    Role has no defense-in-depth conditions.
  action: >
    Add condition: aws:RequestedRegion equals
    the workflow's region. For VPC-bound
    workflows, add aws:SourceVpc /
    aws:SourceVpce. For CalledVia: states.
    amazonaws.com to ensure the role is only
    callable via Step Functions.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "role": {
          "has_defense_conditions": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.role.has_defense_conditions
      op: eq
      value: false
defect: >
  Role identity policies lack defense-in-depth
  conditions.
infection: >
  Stolen credentials usable from anywhere; no
  contextual gate.
failure: >
  Credential-leak blast radius unbounded.
tests:
  - name: no conditions fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          role:
            has_defense_conditions: false
  - name: with conditions passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          role:
            has_defense_conditions: true
