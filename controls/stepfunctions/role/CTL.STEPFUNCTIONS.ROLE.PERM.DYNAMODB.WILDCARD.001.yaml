dsl_version: ctrl.v1
id: CTL.STEPFUNCTIONS.ROLE.PERM.DYNAMODB.WILDCARD.001
name: Step Functions Execution Role Grants dynamodb:* On Wildcard Resource
description: >
  Execution role grants `dynamodb:*` on
  `Resource: "*"`. State machine can read,
  write, or delete every DynamoDB table in the
  account. Workflow input or definition
  compromise becomes total DynamoDB authority
  for the workflow's region.
domain: exposure
severity: high
compliance:
  soc2: "CC6.1, CC6.3"
  pci_dss_v4.0: "7.2.1"
  nist_800_53_r5: "AC-6"
  fedramp_moderate: "AC-6"
  iso_27001_2022: "A.5.15, A.8.20"
  ccm_v4: ["IAM-02", "IAM-16"]
scope_tags:
  - aws
  - stepfunctions
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_stepfunctions_state_machine
params:
  attack_stage: privilege_escalation
  blast_radius:
    type: data_destruction
    scope: account
    multiplier: 3.0
remediation:
  description: >
    dynamodb:* on Resource:*.
  action: >
    Restrict to specific table ARNs and the
    minimum action set (PutItem / GetItem /
    Query / UpdateItem). Reserve
    DeleteTable / DeleteItem for explicit
    workflow steps that need them.
  example: |
    {
      "compute": {
        "kind": "state_machine",
        "role": {
          "dynamodb_wildcard": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: state_machine
    - field: properties.compute.role.dynamodb_wildcard
      op: eq
      value: true
defect: >
  dynamodb:* granted on Resource:*.
infection: >
  Any DDB table reachable from any workflow
  step.
failure: >
  Database authority unscoped.
tests:
  - name: wildcard fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          role:
            dynamodb_wildcard: true
  - name: scoped passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:states:us-east-1:111122223333:stateMachine:prod"
      asset_type: aws_stepfunctions_state_machine
      vendor: aws
      properties:
        compute:
          kind: state_machine
          role:
            dynamodb_wildcard: false
