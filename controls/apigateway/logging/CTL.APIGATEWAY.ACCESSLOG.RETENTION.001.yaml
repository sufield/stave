dsl_version: ctrl.v1
id: CTL.APIGATEWAY.ACCESSLOG.RETENTION.001
name: API Gateway Access Log Group Has No Retention Policy
description: >
  Access logging is enabled with a CloudWatch log group
  destination, but the log group has no retention policy
  configured (defaults to "Never expire"). Logs accumulate
  indefinitely. The cost grows month over month for data that
  most operators only need for the audit window the compliance
  framework prescribes (typically 90 days to 7 years depending
  on industry). The data also accumulates as a regulatory
  liability — logs that exist must be produced under subpoena,
  including whatever sensitive data leaks into the access log
  format.
domain: audit
severity: medium
compliance:
  nist_800_53_r5: "AU-4, AU-11, SI-12"
  fedramp_moderate: "AU-4, AU-11"
  pci_dss_v4.0: "10.5, 10.7"
  soc2: "CC7.2, A1.1"
  iso_27001_2022: "A.5.33, A.8.10"
  ccm_v4: ["LOG-08", "LOG-12"]
scope_tags:
  - aws
  - apigateway
taxonomy:
  - compliance-mapping
  - logging
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_apigateway_rest_api]
params:
  attack_stage: detection_evasion
remediation:
  description: >
    Access log destination CloudWatch log group has no retention
    policy; logs accumulate indefinitely.
  action: >
    Set the log group retention to the period the compliance
    framework requires (or the operator-chosen window, whichever
    is longer): aws logs put-retention-policy --log-group-name
    /aws/apigateway/<api> --retention-in-days 365. Common
    values: 90 (general security), 365 (SOC 2), 2557 (HIPAA 7
    years). For longer-than-CloudWatch retention windows,
    configure subscription filters to ship into S3 with object
    lifecycle policies and Glacier transitions.
  example: |
    {
      "api": {
        "kind": "apigateway_stage",
        "access_log": {
          "log_group_retention_days": 365
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.api.kind
      op: eq
      value: apigateway_stage
    - field: properties.api.access_log.destination_type
      op: eq
      value: cloudwatch
    - field: properties.api.access_log.log_group_retention_days
      op: eq
      value: 0
