dsl_version: ctrl.v1
id: CTL.APIGATEWAY.WAF.001
name: REST API Stages Must Have WAF ACL Attached
description: >
  API Gateway REST API stages must have an AWS WAF web ACL associated
  for application-layer filtering. Without WAF, APIs are exposed to
  injection attacks, parameter tampering, L7 floods, and bot abuse.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SC-7"
  soc2: "CC6.6"
  ccm_v4: ["IVS-03"]
scope_tags:
  - aws
  - apigateway
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: REST API stage has no WAF ACL attached.
  action: Associate a WAFv2 web ACL with the API stage.
  example: |
    {
      "api": {
        "kind": "rest_api",
        "waf": { "acl_attached": true }
      }
    }
unsafe_predicate:
  all:
    - field: properties.api.kind
      op: eq
      value: rest_api
    - field: properties.api.waf.acl_attached
      op: eq
      value: false
