dsl_version: ctrl.v1
id: CTL.APIGATEWAY.STAGE.VARS.CREDENTIALS.001
name: API Gateway Stage Variables Contain Credentials
description: >
  API Gateway stage variables hold values that match credential
  patterns — AWS access-key prefixes (AKIA, ASIA), database
  connection strings with embedded passwords, generic password=
  or token= assignments, or JWT-shaped strings. Stage variables are
  plaintext configuration: they are visible to anyone with
  apigateway:GetStage permission, returned in API exports
  (OpenAPI/Swagger), included in CloudTrail audit events for
  UpdateStage calls, and may be reflected into responses if used in
  mapping templates without escaping. They have no encryption at
  rest beyond the API Gateway service itself and no rotation. This
  is the same detection mechanism used by
  CTL.LAMBDA.ENV.SECRETS.001 against Lambda environment variables —
  same pattern, different configuration surface. Secrets belong in
  Secrets Manager or SSM Parameter Store SecureString.
domain: identity
severity: high
compliance:
  nist_800_53_r5: "SC-28"
  fedramp_moderate: "SC-28"
  pci_dss_v4.0: "3.5.1"
  soc2: "CC6.1"
  hipaa: "164.312(a)(2)(iv)"
  ccm_v4: ["CEK-03", "DSP-17"]
scope_tags:
  - aws
  - apigateway
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - logging
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
remediation:
  description: >
    API Gateway stage variables include values matching credential
    patterns. Plaintext credentials are exposed to any caller of
    GetStage.
  action: >
    Move the credential to AWS Secrets Manager or SSM Parameter
    Store SecureString. Update the integration mapping templates
    or Lambda integrations to fetch the secret at request time
    via a Lambda authorizer or backend code. Remove the credential
    from the stage variables and rotate it (assume the previous
    plaintext is compromised).
  example: |
    {
      "api": {
        "kind": "apigateway_stage",
        "stage": {
          "has_credential_vars": false,
          "credential_var_keys": [],
          "variable_count": 3
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.api.kind
      op: eq
      value: apigateway_stage
    - field: properties.api.stage.has_credential_vars
      op: eq
      value: true
