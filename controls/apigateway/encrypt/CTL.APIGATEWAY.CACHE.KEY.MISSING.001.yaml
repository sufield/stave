dsl_version: ctrl.v1
id: CTL.APIGATEWAY.CACHE.KEY.MISSING.001
name: API Gateway Caching Enabled Without Cache Key Parameters
description: >
  REST API stage has caching enabled but no cache key parameters
  are configured. With no key parameters, every request to a
  given resource+method receives the same cached response
  regardless of query string, path parameter, or header
  variation. A user query for /products?id=5 returns the
  cached response for /products?id=42. The cache turns from a
  performance accelerator into a correctness hazard — users
  see other users' data, search results unrelated to the query,
  responses for resource IDs that aren't theirs. Cache key
  parameters tell API Gateway which request attributes
  partition the cache; for any non-trivial endpoint, at least
  the query string and path parameters that vary the response
  must be in the key.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SC-5, SI-10"
  fedramp_moderate: "SC-5, SI-10"
  pci_dss_v4.0: "6.4.2"
  soc2: "CC6.1, CC7.1"
  iso_27001_2022: "A.5.10, A.8.16"
  ccm_v4: ["IVS-09", "DSP-07"]
scope_tags:
  - aws
  - apigateway
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_apigateway_rest_api]
params:
  attack_stage: impact
remediation:
  description: >
    Caching is enabled but no cache key parameters partition
    cached responses; one user can receive another user's data.
  action: >
    Configure cache key parameters on the method that match the
    request attributes which legitimately vary the response.
    aws apigateway put-method with cacheKeyParameters listing
    method.request.querystring.<name>, method.request.path.<name>,
    method.request.header.<name>. For per-user caches, key on
    the auth-derived caller (method.request.header.Authorization
    or a custom header). For endpoints whose response should
    not be cached at all, disable caching on the method instead
    of caching with no keys.
  example: |
    {
      "api": {
        "kind": "apigateway_method",
        "cache": {
          "enabled": true,
          "key_parameters_configured": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.api.kind
      op: eq
      value: apigateway_method
    - field: properties.api.cache.enabled
      op: eq
      value: true
    - field: properties.api.cache.key_parameters_configured
      op: eq
      value: false
