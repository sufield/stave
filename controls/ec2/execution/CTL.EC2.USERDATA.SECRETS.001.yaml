dsl_version: ctrl.v1
id: CTL.EC2.USERDATA.SECRETS.001
name: EC2 User Data Must Not Contain Secrets or Credentials
description: >
  EC2 instance user data is stored in plaintext in the instance
  metadata and is visible to any process on the instance via
  the metadata endpoint. Secrets embedded in user data (API keys,
  database passwords, tokens) are exposed to any compromised
  process and persist in the instance metadata after launch.
  User data is also visible in the EC2 console and via
  ec2:DescribeInstanceAttribute API calls.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "IA-5"
  mitre_attack: "T1059.009"
  ccm_v4: ["DSP-17", "IAM-05"]
scope_tags:
  - aws
  - ec2
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_ec2_instance
params:
  attack_stage: execution
remediation:
  description: >
    EC2 user data contains embedded secrets. Credentials are
    exposed in instance metadata and EC2 API responses.
  action: >
    Move secrets to AWS Secrets Manager or SSM Parameter Store
    (SecureString type). Retrieve secrets at runtime via IAM role
    credentials rather than embedding in user data scripts.
  example: |
    {
      "compute": {
        "kind": "instance",
        "user_data": {
          "has_secrets": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: instance
    - field: properties.compute.user_data.has_secrets
      op: eq
      value: true
