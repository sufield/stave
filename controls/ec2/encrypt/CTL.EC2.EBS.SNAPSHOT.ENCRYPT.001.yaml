dsl_version: ctrl.v1
id: CTL.EC2.EBS.SNAPSHOT.ENCRYPT.001
name: EBS Snapshots Must Be Encrypted
description: >
  Unencrypted EBS snapshots expose full disk contents if shared or
  made public. Even in a private state, unencrypted snapshots can be
  copied to another account. Encrypted EBS snapshots require access
  to the KMS key to restore — snapshots shared across accounts
  cannot be used without the source account sharing the KMS key.
domain: encryption
severity: high
compliance:
  nist_800_53_r5: "SC-28"
  aws_security_hub: "EC2.32"
  mitre_attack: "TA0010"
scope_tags:
  - aws
  - ec2
type: unsafe_state
params:
  attack_stage: exfiltration
remediation:
  description: >
    EBS snapshot is not encrypted. The snapshot can be copied and
    restored without a KMS key.
  action: >
    Copy the snapshot with encryption enabled:
    aws ec2 copy-snapshot --source-snapshot-id <id>
    --source-region <region> --encrypted --kms-key-id <key-arn>.
    Enable encryption by default: aws ec2 enable-ebs-encryption-by-default
  example: |
    {
      "compute": {
        "kind": "ebs_snapshot",
        "encrypted": true
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: ebs_snapshot
    - field: properties.compute.encrypted
      op: eq
      value: false
