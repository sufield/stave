dsl_version: ctrl.v1
id: CTL.EC2.EIP.UNASSIGNED.001
name: Elastic IPs Must Be Associated with Resources
description: >
  Unassigned Elastic IP addresses incur cost and represent
  unused public IP allocations that should be released.
domain: governance
severity: low
compliance:
  ccm_v4: ["DCS-06"]
scope_tags: [aws, ec2]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_ec2_elastic_ip
params: {}
remediation:
  description: Elastic IP is not associated with any resource.
  action: Associate the EIP with an instance or release it.
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: elastic_ip
    - field: properties.compute.eip.is_associated
      op: eq
      value: false
