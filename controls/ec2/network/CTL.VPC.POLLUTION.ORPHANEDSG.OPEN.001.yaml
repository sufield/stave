dsl_version: ctrl.v1
id: CTL.VPC.POLLUTION.ORPHANEDSG.OPEN.001
name: Orphaned Security Group Has Unrestricted Ingress
description: >
  Security group has no attached resources AND allows unrestricted
  ingress (0.0.0.0/0 or ::/0). An orphaned SG with open ingress
  is not currently exposing anything, but when reattached — which
  orphaned SGs often are, because developers search for existing
  SGs rather than creating new ones — the resource inherits the
  permissive rule immediately. This is a distance-one pattern: the
  risk is one attachment away. The compound of CTL.EC2.SG.UNUSED.001
  (orphaned) and CTL.VPC.SG.UNRESTRICTED.001 (open ingress) —
  individually these are low and medium severity; together they
  represent a latent exposure waiting for a trigger.
domain: network
severity: medium
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.6"
  ccm_v4: ["IVS-03"]
scope_tags:
  - aws
  - ec2
  - vpc
taxonomy:
  - compliance-mapping
  - network-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_ec2_security_group
params:
  attack_stage: initial_access
observation_fields:
  - network.kind
  - network.security_group.is_unused
  - network.security_group.has_unrestricted_ingress
remediation:
  description: >
    Orphaned security group allows unrestricted ingress. One
    attachment away from exposing a resource to the internet.
  action: >
    Delete the unused security group. If it cannot be deleted
    (referenced by a launch template or other config), remove
    all ingress rules to eliminate the latent risk.
  example: |
    {
      "network": {
        "kind": "security_group",
        "security_group": {
          "is_unused": false,
          "has_unrestricted_ingress": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: security_group
    - field: properties.network.security_group.is_unused
      op: eq
      value: true
    - field: properties.network.security_group.has_unrestricted_ingress
      op: eq
      value: true
tests:
  - name: "orphaned SG with open ingress fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:ec2:us-east-1:111122223333:security-group/sg-orphaned-open"
      asset_type: aws_ec2_security_group
      vendor: aws
      properties:
        network:
          kind: security_group
          security_group:
            is_unused: true
            has_unrestricted_ingress: true
  - name: "attached SG with open ingress passes (separate control)"
    verdict: PASS
    asset:
      asset_id: "arn:aws:ec2:us-east-1:111122223333:security-group/sg-attached-open"
      asset_type: aws_ec2_security_group
      vendor: aws
      properties:
        network:
          kind: security_group
          security_group:
            is_unused: false
            has_unrestricted_ingress: true
  - name: "orphaned SG with restricted ingress passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:ec2:us-east-1:111122223333:security-group/sg-orphaned-closed"
      asset_type: aws_ec2_security_group
      vendor: aws
      properties:
        network:
          kind: security_group
          security_group:
            is_unused: true
            has_unrestricted_ingress: false
