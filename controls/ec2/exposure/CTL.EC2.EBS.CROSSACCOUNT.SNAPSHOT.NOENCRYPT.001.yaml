dsl_version: ctrl.v1
id: CTL.EC2.EBS.CROSSACCOUNT.SNAPSHOT.NOENCRYPT.001
name: Encrypted Snapshot Shared Cross-Account Without KMS Key Sharing
description: >
  EBS snapshot is encrypted and shared with an
  external account, but the encrypting KMS key
  policy does not grant kms:Decrypt to the
  recipient. The recipient has
  createVolumePermission on the snapshot but
  cannot decrypt it; CreateVolume fails with a
  KMS access error. Cross-service permission
  mismatch — EBS grants access, KMS blocks it.
domain: exposure
severity: high
compliance:
  soc2: "CC6.1, CC6.6"
  nist_800_53_r5: "AC-3, AC-4, SC-12, SC-28"
  pci_dss_v4.0: "3.4, 7.1"
  fedramp_moderate: "AC-3, SC-12"
  hipaa: "164.312(a)(2)(iv), 164.312(e)(2)(ii)"
  iso_27001_2022: "A.5.15, A.8.24"
  ccm_v4: ["IAM-09", "CEK-09"]
scope_tags:
  - aws
  - ec2
  - ebs
type: unsafe_state
classification: state_assertion
params:
  attack_stage: persistence
  blast_radius:
    type: data
    scope: cross_account
    multiplier: 2.0
remediation:
  description: >
    Snapshot share without matching KMS key
    share. Recipient sees the share but cannot
    use it.
  action: >
    Update the encrypting CMK's key policy to
    grant kms:Decrypt and kms:CreateGrant to
    the recipient account: aws kms put-key-policy
    --key-id <id> --policy <updated-json>. Add
    the recipient's account principal under
    Allow with kms:Decrypt action and a
    kms:ViaService=ec2.<region>.amazonaws.com
    condition. After fix, the recipient should
    be able to call ec2:CreateVolume from the
    shared snapshot.
  example: |
    {
      "compute": {
        "kind": "ebs_snapshot",
        "ebs": {
          "snapshot_id": "snap-0123456789abcdef",
          "snapshot_encrypted": true,
          "snapshot_shared_accounts": ["444455556666"],
          "snapshot_kms_key_arn": "arn:aws:kms:us-east-1:111122223333:key/abc",
          "kms_grants_decrypt_to_shared": true,
          "has_kms_sharing_mismatch": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: ebs_snapshot
    - field: properties.compute.ebs.snapshot_encrypted
      op: eq
      value: true
    - field: properties.compute.ebs.has_kms_sharing_mismatch
      op: eq
      value: true
defect: >
  Encrypted snapshot shared cross-account but
  KMS key does not grant Decrypt to the
  recipient account.
infection: >
  Creating a volume from an encrypted snapshot
  requires both ec2:CreateVolume with
  createVolumePermission on the snapshot AND
  kms:Decrypt on the KMS key that encrypted
  it. When only the snapshot share is granted,
  the recipient calls ec2:CreateVolume, the API
  attempts to decrypt the snapshot data using
  the KMS key, kms:Decrypt fails (recipient
  not in key policy), and CreateVolume fails
  with a cryptic KMS access error. The snapshot
  sharing looks correct in the EBS console; the
  failure surfaces only when the recipient
  tries to use it. The same cross-service
  permission shape as Secrets Manager
  cross-account access without KMS sharing.
failure: >
  Cross-service permission mismatch. Snapshot
  shared but KMS key not shared — recipient
  cannot create volumes from the snapshot.
tests:
  - name: encrypted shared snapshot without KMS share fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:ec2:us-east-1:111122223333:snapshot/snap-0123456789abcdef"
      asset_type: aws_ebs_snapshot
      vendor: aws
      properties:
        compute:
          kind: ebs_snapshot
          ebs:
            snapshot_id: "snap-0123456789abcdef"
            snapshot_encrypted: true
            snapshot_shared_accounts: ["444455556666"]
            snapshot_kms_key_arn: "arn:aws:kms:us-east-1:111122223333:key/abc"
            kms_grants_decrypt_to_shared: false
            has_kms_sharing_mismatch: true
  - name: encrypted shared snapshot with matching KMS passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:ec2:us-east-1:111122223333:snapshot/snap-0123456789abcdef"
      asset_type: aws_ebs_snapshot
      vendor: aws
      properties:
        compute:
          kind: ebs_snapshot
          ebs:
            snapshot_id: "snap-0123456789abcdef"
            snapshot_encrypted: true
            snapshot_shared_accounts: ["444455556666"]
            snapshot_kms_key_arn: "arn:aws:kms:us-east-1:111122223333:key/abc"
            kms_grants_decrypt_to_shared: true
            has_kms_sharing_mismatch: false
  - name: unencrypted shared snapshot does not fire (UNENCRYPTED.SHARED handles it)
    verdict: PASS
    asset:
      asset_id: "arn:aws:ec2:us-east-1:111122223333:snapshot/snap-0123456789abcdef"
      asset_type: aws_ebs_snapshot
      vendor: aws
      properties:
        compute:
          kind: ebs_snapshot
          ebs:
            snapshot_id: "snap-0123456789abcdef"
            snapshot_encrypted: false
            snapshot_shared_accounts: ["444455556666"]
            has_kms_sharing_mismatch: false
