dsl_version: ctrl.v1
id: CTL.EC2.SNAPSHOT.CROSSACCOUNT.001
name: EBS Snapshots Must Not Be Shared with External Accounts
description: >
  EBS snapshots must not be shared with external AWS accounts unless
  the snapshot is encrypted and sharing is to a specific authorized
  account. Unencrypted cross-account snapshot sharing enables data
  exfiltration — an attacker with ec2:ModifySnapshotAttribute shares
  a snapshot to their account, then restores it in their environment.
  ATT&CK technique T1578.001 (Create Snapshot) uses this vector.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  ccm_v4: ["DSP-17", "IVS-03"]
scope_tags:
  - aws
  - ec2
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_ebs_snapshot
params:
  attack_stage: exfiltration
  mitre_attack: "T1578.001"
remediation:
  description: >
    EBS snapshot is shared with external AWS accounts.
  action: >
    Remove cross-account sharing from the snapshot. If sharing is
    required, ensure the snapshot is encrypted with a KMS key and
    share only with specific authorized account IDs.
  example: |
    {
      "compute": {
        "kind": "ebs_snapshot",
        "access": { "has_cross_account_share": false }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: ebs_snapshot
    - field: properties.compute.access.has_cross_account_share
      op: eq
      value: true
