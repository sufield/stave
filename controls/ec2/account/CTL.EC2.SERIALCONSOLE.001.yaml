dsl_version: ctrl.v1
id: CTL.EC2.SERIALCONSOLE.001
name: EC2 Serial Console Access Must Be Disabled
description: >
  EC2 Serial Console access must be disabled at the account level
  unless explicitly needed for emergency debugging. Serial console
  provides direct TTY access to EC2 instances, bypassing SSH,
  security groups, NACLs, and all network-layer controls. An
  attacker with ec2-instance-connect:SendSerialConsoleSSHPublicKey
  permission and instance-level access can use serial console to
  interact with the instance OS outside the network path that
  monitoring tools observe. This gap was discovered through
  cross-cloud transposition — GCP has CTL.GCP.COMPUTE.SERIALPORT.001
  in the Stave catalog but no AWS analog existed despite AWS
  offering the same capability via EnableSerialConsoleAccess.
  Account-level toggle — same pattern as CTL.EC2.EBS.DEFAULT.001.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "AC-17"
  soc2: "CC6.1"
  ccm_v4: ["IAM-04"]
scope_tags:
  - aws
  - ec2
taxonomy:
  - compliance-mapping
  - network-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_ec2_instance
params:
  attack_stage: lateral_movement
remediation:
  description: >
    EC2 serial console access is enabled at the account level.
    Instances are accessible via serial console, bypassing network
    controls.
  action: >
    Disable serial console access: aws ec2
    disable-serial-console-access. If serial console is needed
    for emergency debugging, enable it temporarily and disable
    after use. Use IAM policies to restrict
    ec2-instance-connect:SendSerialConsoleSSHPublicKey to
    break-glass roles only.
  example: |
    {
      "compute": {
        "serial_console_access_enabled": false
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.serial_console_access_enabled
      op: eq
      value: true
