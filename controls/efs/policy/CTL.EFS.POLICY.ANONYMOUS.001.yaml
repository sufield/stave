dsl_version: ctrl.v1
id: CTL.EFS.POLICY.ANONYMOUS.001
name: EFS File System Policy Must Prevent Anonymous Access
description: >
  EFS file system policies must prevent anonymous (unauthenticated) access.
  Without this policy, any principal that can reach the mount target can
  access the file system without IAM authentication, enabling unauthorized
  data access from within the VPC.
domain: exposure
severity: critical
compliance:
  nist_800_53_r5: "AC-3"
scope_tags:
  - aws
  - efs
type: unsafe_state
params:
  base_impact: 9
  attack_stage: initial_access
remediation:
  description: >
    EFS file system policy does not prevent anonymous access. Any principal
    in the VPC can mount the file system without authentication.
  action: >
    Apply a file system policy that prevents anonymous access. Run:
    aws efs put-file-system-policy --file-system-id fs-xxx --policy
    '{"Statement":[{"Effect":"Deny","Principal":{"AWS":"*"},
    "Action":"*","Condition":{"Bool":{"elasticfilesystem:AccessedViaMountTarget":"true"}},
    "Resource":"*"}]}'
  example: |
    {
      "filesystem": {
        "kind": "efs",
        "file_system_policy": {
          "prevent_anonymous_access": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.filesystem.kind
      op: eq
      value: efs
    - field: properties.filesystem.file_system_policy.prevent_anonymous_access
      op: eq
      value: false
