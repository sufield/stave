dsl_version: ctrl.v1
id: CTL.OPENSEARCH.BLUEGREEN.STUCK.001
name: OpenSearch Blue-Green Deployment Failed Without Rollback
description: >
  OpenSearch domain has a blue-green deployment
  in `Failed` state for more than 24 hours
  without rollback. Cluster runs in a partial
  state; old config still active but new config
  state-machine is stuck. Operators commonly
  ignore the failure because the domain
  appears healthy.
domain: governance
severity: high
compliance:
  soc2: "CC8.1, A1.2"
  nist_800_53_r5: "CM-3"
  fedramp_moderate: "CM-3"
  iso_27001_2022: "A.8.32"
  ccm_v4: ["BCR-04"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: persistence
remediation:
  description: >
    Failed blue-green deployment > 24h.
  action: >
    Inspect via DescribeDomainChangeProgress.
    Either retry or call CancelDomainChange to
    roll back. Investigate root cause via
    domain config events / CloudTrail.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "engine": {
          "bluegreen_failed_hours": 0
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.engine.bluegreen_failed_hours
      op: gt
      value: 24
defect: >
  Blue-green failed > 24 hours, no rollback.
infection: >
  Cluster runs in partial state; future config
  changes blocked until current change resolves.
failure: >
  Stalled change-management cycle.
tests:
  - name: 48h failed fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          engine:
            bluegreen_failed_hours: 48
  - name: clean state passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          engine:
            bluegreen_failed_hours: 0
