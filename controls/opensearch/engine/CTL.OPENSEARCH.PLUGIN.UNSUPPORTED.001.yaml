dsl_version: ctrl.v1
id: CTL.OPENSEARCH.PLUGIN.UNSUPPORTED.001
name: OpenSearch Plugins Or Custom Packages Not Compatible With Engine
description: >
  OpenSearch domain has plugins / custom packages
  pinned to engine version that no longer
  matches the cluster's actual engine, or has
  custom packages out of sync with engine. Plugin
  loaders fall back to compat mode (slow, fewer
  features) or fail to load entirely. Symptoms:
  custom analyzers fail, ML Commons predictions
  return errors, async-search timeout.
domain: governance
severity: medium
compliance:
  soc2: "CC8.1"
  nist_800_53_r5: "CM-2, CM-3"
  fedramp_moderate: "CM-3"
  iso_27001_2022: "A.8.32"
  ccm_v4: ["TVM-04"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: persistence
remediation:
  description: >
    Plugins / custom packages out of sync with
    engine.
  action: >
    Update plugin pins to match engine version.
    Re-deploy custom packages built for the
    current engine. Verify with
    GET _cat/plugins.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "engine": {
          "plugins_compatible": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.engine.plugins_compatible
      op: eq
      value: false
defect: >
  Plugins / custom packages not compatible with
  engine.
infection: >
  Compat-mode performance penalty; some features
  unavailable. Errors surface as user-impact.
failure: >
  Engine / plugin coordination broken.
tests:
  - name: incompatible plugins fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          engine:
            plugins_compatible: false
  - name: compatible plugins passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          engine:
            plugins_compatible: true
