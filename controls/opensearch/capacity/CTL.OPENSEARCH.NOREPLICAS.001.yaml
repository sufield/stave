dsl_version: ctrl.v1
id: CTL.OPENSEARCH.NOREPLICAS.001
name: OpenSearch Production Indices Have Zero Replicas
description: >
  OpenSearch production domain has indices with
  `number_of_replicas: 0` (no replicas).
  Single-replica defaults exist for a reason:
  primary shard loss without replicas means
  data unavailability. With multi-AZ topology
  but zero replicas, AZ failure still loses
  shards.
domain: resilience
severity: high
compliance:
  soc2: "A1.1, A1.2"
  nist_800_53_r5: "CP-9, SC-5"
  fedramp_moderate: "CP-9"
  iso_27001_2022: "A.8.14"
  ccm_v4: ["BCR-04"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: resilience
remediation:
  description: >
    Production indices have 0 replicas.
  action: >
    Set index template default
    number_of_replicas to 1 minimum (2 for
    high-availability tier). Apply via:
      PUT /_template/<name> {"settings": {
        "number_of_replicas": 1 }}
  example: |
    {
      "search_service": {
        "kind": "domain",
        "capacity": {
          "indices_with_zero_replicas": 0
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.capacity.is_production
      op: eq
      value: true
    - field: properties.search_service.capacity.indices_with_zero_replicas
      op: gt
      value: 0
defect: >
  One or more production indices have 0
  replicas.
infection: >
  Single shard loss = data unavailability.
failure: >
  No redundancy at the index level.
tests:
  - name: zero replicas fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          capacity:
            is_production: true
            indices_with_zero_replicas: 5
  - name: replicas configured passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          capacity:
            is_production: true
            indices_with_zero_replicas: 0
