dsl_version: ctrl.v1
id: CTL.OPENSEARCH.MASTER.COUNT.NONQUORUM.001
name: OpenSearch Master Node Count Does Not Form Quorum
description: >
  OpenSearch domain with dedicated masters has
  master count of 1 or 2. Master count of 1 is
  a single point of failure; count of 2 cannot
  form quorum after losing 1 (split-brain
  risk). Production-tier domains require 3
  masters minimum to tolerate single-node
  failure with quorum.
domain: resilience
severity: critical
compliance:
  soc2: "A1.1, A1.2"
  nist_800_53_r5: "SC-5, CP-7"
  fedramp_moderate: "SC-5"
  iso_27001_2022: "A.8.14"
  ccm_v4: ["BCR-04"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: resilience
remediation:
  description: >
    Master count != 3 (or 5 for very large).
  action: >
    Update master count to 3 via
    UpdateDomainConfig --cluster-config
    dedicated-master-count=3. Confirms quorum
    after single-node loss.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "capacity": {
          "master_count": 3
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.capacity.dedicated_master_enabled
      op: eq
      value: true
    - field: properties.search_service.capacity.master_count
      op: lt
      value: 3
defect: >
  Master count < 3.
infection: >
  Single-node loss triggers split-brain or
  cluster-state stall. Production cluster fails
  to maintain itself.
failure: >
  No quorum tolerance.
tests:
  - name: 1 master fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          capacity:
            dedicated_master_enabled: true
            master_count: 1
  - name: 3 masters passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          capacity:
            dedicated_master_enabled: true
            master_count: 3
