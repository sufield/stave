dsl_version: ctrl.v1
id: CTL.OPENSEARCH.DATA.NODE.SINGLE.001
name: OpenSearch Production Domain Has Single Data Node
description: >
  OpenSearch production-tier domain has only one
  data node. Any node-level event (instance
  retirement, kernel upgrade, EBS detach) takes
  the cluster offline. Single-data-node setups
  are appropriate only for development /
  ephemeral workloads.
domain: resilience
severity: high
compliance:
  soc2: "A1.1, A1.2"
  nist_800_53_r5: "CP-7, SC-5"
  fedramp_moderate: "CP-7"
  iso_27001_2022: "A.8.14"
  ccm_v4: ["BCR-04"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: resilience
remediation:
  description: >
    Single data node on production domain.
  action: >
    Scale to >= 3 data nodes; pair with
    >= 1 replica setting on indices to
    distribute data.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "capacity": {
          "data_node_count": 3
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.capacity.is_production
      op: eq
      value: true
    - field: properties.search_service.capacity.data_node_count
      op: lt
      value: 2
defect: >
  Production domain has 1 data node.
infection: >
  Any node event = cluster outage.
failure: >
  Single-node failure mode.
tests:
  - name: single node prod fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          capacity:
            is_production: true
            data_node_count: 1
  - name: 3 nodes passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          capacity:
            is_production: true
            data_node_count: 3
