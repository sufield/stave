dsl_version: ctrl.v1
id: CTL.OPENSEARCH.ML.UNSAFE.001
name: OpenSearch ML Commons Plugin Auth Or Versioning Unsafe
description: >
  OpenSearch ML Commons plugin enabled with no
  authentication on `_predict` endpoint, or
  ML model deployed without version pinning.
  Anonymous prediction calls = abuse / cost
  amplification. Unpinned models = silent
  rollovers that change downstream behavior
  without notice.
domain: governance
severity: medium
compliance:
  soc2: "CC6.1, CC8.1"
  nist_800_53_r5: "AC-3, CM-3"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.8.5, A.8.32"
  ccm_v4: ["IAM-09", "TVM-04"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: persistence
remediation:
  description: >
    ML Commons auth / versioning unsafe.
  action: >
    Restrict _predict to authenticated callers
    via FGAC role mapping. Pin model versions
    in production deployments; promote new
    versions through staged rollout.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "plugin": {
          "ml_safe": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.plugin.ml_enabled
      op: eq
      value: true
    - field: properties.search_service.plugin.ml_safe
      op: eq
      value: false
defect: >
  ML Commons auth / versioning unsafe.
infection: >
  Unauth prediction → cost / abuse.
  Unpinned model → silent behavior change.
failure: >
  ML surface ungated.
tests:
  - name: unsafe fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          plugin:
            ml_enabled: true
            ml_safe: false
  - name: safe passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          plugin:
            ml_enabled: true
            ml_safe: true
