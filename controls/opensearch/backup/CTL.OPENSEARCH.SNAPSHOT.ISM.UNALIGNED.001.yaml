dsl_version: ctrl.v1
id: CTL.OPENSEARCH.SNAPSHOT.ISM.UNALIGNED.001
name: OpenSearch Snapshot Retention Not Aligned With ISM Index Lifecycle
description: >
  OpenSearch snapshot retention policy and ISM
  (Index State Management) index-deletion policy
  produce inconsistent recovery boundaries:
  ISM deletes indices at, e.g., 30 days, but
  snapshots only retain 14 days — recovery for
  any index 15-30 days old is impossible.
  Conversely if ISM deletes at 7 days but
  snapshots retain 365, snapshots accumulate
  garbage. Retention horizons should align with
  the longest legitimate recovery scenario.
domain: governance
severity: medium
compliance:
  soc2: "CC7.4, A1.2"
  nist_800_53_r5: "CP-9"
  fedramp_moderate: "CP-9"
  iso_27001_2022: "A.8.13"
  ccm_v4: ["BCR-08"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: persistence
remediation:
  description: >
    Snapshot retention misaligned with ISM
    deletion.
  action: >
    Set snapshot retention >= ISM index lifetime
    + buffer for restore window. Document the
    chosen recovery horizon in runbook.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "backup": {
          "snapshot_aligned_with_ism": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.backup.snapshot_aligned_with_ism
      op: eq
      value: false
defect: >
  Snapshot retention horizon misaligned with
  ISM lifecycle.
infection: >
  Recovery for indices in the gap window is
  impossible. Compliance audit cites
  inconsistent retention story.
failure: >
  Recovery-window discontinuity.
tests:
  - name: misaligned fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          backup:
            snapshot_aligned_with_ism: false
  - name: aligned passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          backup:
            snapshot_aligned_with_ism: true
