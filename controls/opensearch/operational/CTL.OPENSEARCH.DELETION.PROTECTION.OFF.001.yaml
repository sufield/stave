dsl_version: ctrl.v1
id: CTL.OPENSEARCH.DELETION.PROTECTION.OFF.001
name: OpenSearch Production Domain Has No Deletion Protection
description: >
  OpenSearch production-tier domain has no
  termination protection. A single
  DeleteDomain call (accidental, malicious,
  buggy automation) destroys the domain
  irreversibly. Production domains require an
  explicit deletion-protection flag or SCP
  guard.
domain: governance
severity: high
compliance:
  soc2: "CC8.1, A1.2"
  nist_800_53_r5: "CM-3, CP-9"
  fedramp_moderate: "CM-3"
  iso_27001_2022: "A.5.16, A.8.32"
  ccm_v4: ["GRC-08", "BCR-08"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: impact
remediation:
  description: >
    Deletion protection off on production
    domain.
  action: >
    Apply a tag-based SCP that denies
    DeleteDomain on domains tagged
    deletion_protection=true. Or use an IAM
    policy condition denying the action when
    the tag is set.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "governance": {
          "deletion_protection": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.governance.is_production
      op: eq
      value: true
    - field: properties.search_service.governance.deletion_protection
      op: eq
      value: false
defect: >
  Production domain without deletion
  protection.
infection: >
  Single API call can destroy production data.
failure: >
  No undo for destruction.
tests:
  - name: no protection fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          governance:
            is_production: true
            deletion_protection: false
  - name: protection on passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          governance:
            is_production: true
            deletion_protection: true
