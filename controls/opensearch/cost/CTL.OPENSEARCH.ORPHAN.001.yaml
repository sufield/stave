dsl_version: ctrl.v1
id: CTL.OPENSEARCH.ORPHAN.001
name: OpenSearch-Tagged Resources Orphaned After Domain Deletion
description: >
  AWS account has resources tagged for an
  OpenSearch domain that no longer exists:
  orphan snapshot S3 bucket, VPC endpoint,
  CloudWatch Log group. Each accrues cost
  forever. The orphan KMS key (if any) is
  separately tracked by KMS lifecycle.
domain: governance
severity: low
compliance:
  soc2: "CC8.1"
  nist_800_53_r5: "CM-8"
  fedramp_moderate: "CM-8"
  iso_27001_2022: "A.5.9, A.8.10"
  ccm_v4: ["BCR-08", "GRC-08"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: persistence
remediation:
  description: >
    Orphan resources from deleted domain.
  action: >
    Inventory orphan resources via tag query
    `kubernetes.io/cluster/...` equivalent for
    OS: `aws:opensearch:domain-name` matching
    deleted domain. Snapshot then delete.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "cost": {
          "has_orphan_resources": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.cost.has_orphan_resources
      op: eq
      value: true
defect: >
  Orphan resources from deleted domain.
infection: >
  Cost accrues; inventory clutter; orphan
  snapshot buckets contain potentially
  sensitive data without active owner.
failure: >
  Cleanup gap.
tests:
  - name: orphans fire
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/old"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          cost:
            has_orphan_resources: true
  - name: clean passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          cost:
            has_orphan_resources: false
