dsl_version: ctrl.v1
id: CTL.OPENSEARCH.ROLE.MAPPING.DANGLING.001
name: OpenSearch FGAC Role Mapping References Deleted IAM Role
description: >
  OpenSearch FGAC role mapping references an IAM
  role / SAML group / Cognito group that no
  longer exists in the source identity provider.
  The mapping is dead — no caller assumes the
  identity. Worse, if the IAM role ARN gets
  recreated by a different team for a different
  purpose, the FGAC mapping silently grants the
  new role's callers whatever the dangling
  mapping had.
domain: governance
severity: medium
compliance:
  soc2: "CC6.1, CC8.1"
  nist_800_53_r5: "AC-2, AC-6"
  fedramp_moderate: "AC-2"
  iso_27001_2022: "A.5.16, A.8.20"
  ccm_v4: ["IAM-09", "IAM-16"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: persistence
remediation:
  description: >
    FGAC role mapping references deleted IAM
    role.
  action: >
    Quarterly: cross-reference FGAC role
    mappings against IAM role list. Remove dead
    mappings. Use IAM Access Analyzer's unused-
    access findings to drive cleanup cadence.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "access": {
          "role_mapping_dangling_count": 0
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.access.role_mapping_dangling_count
      op: gt
      value: 0
defect: >
  Role mappings reference deleted IAM
  identities.
infection: >
  Original identity gone; mapping inert. If the
  ARN is recreated by another team, the new
  identity's callers inherit the old mapping's
  FGAC role unintentionally. Audit doesn't
  flag the mapping because it looks valid.
failure: >
  Identity ghost-mapping. Future identity reuse
  becomes silent privilege grant.
tests:
  - name: dangling mappings fire
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            role_mapping_dangling_count: 3
  - name: no dangling mappings passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            role_mapping_dangling_count: 0
