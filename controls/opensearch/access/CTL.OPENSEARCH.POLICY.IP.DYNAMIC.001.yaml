dsl_version: ctrl.v1
id: CTL.OPENSEARCH.POLICY.IP.DYNAMIC.001
name: OpenSearch Access Policy IP Allowlist Permits Dynamic ISP Range
description: >
  OpenSearch domain access policy `aws:SourceIp`
  allowlist includes a CIDR range that belongs to a
  consumer / dynamic-ISP / cloud-provider netblock
  rather than a static corporate egress. Examples:
  `Comcast` residential ranges, AWS public IPs in
  bulk, Cloudflare proxy ranges, large /8 blocks.
  These ranges rotate, are shared across millions of
  hosts, and are commonly used by attackers. The
  allowlist appears restrictive at policy review but
  effectively permits any client behind the listed
  ISP.
domain: exposure
severity: high
compliance:
  soc2: "CC6.1, CC6.6"
  nist_800_53_r5: "AC-3, AC-6"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.8.20"
  ccm_v4: ["IAM-16"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: initial_access
  blast_radius:
    type: data_exposure
    scope: account
    multiplier: 2.0
remediation:
  description: >
    Access policy IP allowlist includes a dynamic-ISP
    or large shared range.
  action: >
    Replace dynamic ranges with the static corporate
    NAT egress / VPN gateway addresses. For VPC
    domains, use aws:SourceVpce instead of
    aws:SourceIp. Inventory all CIDRs in the policy
    against an IP-intelligence source (MaxMind,
    Spamhaus DROP, AWS IP ranges JSON) and remove
    any range marked as ISP / cloud / proxy.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "access": {
          "policy_ip_allowlist_dynamic_isp": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.access.policy_ip_allowlist_dynamic_isp
      op: eq
      value: true
defect: >
  Access policy IP allowlist includes a dynamic-ISP
  / cloud-provider / residential CIDR.
infection: >
  Any client that obtains an IP within the listed
  range — by ISP rotation, cloud-instance request,
  or proxy use — gets access. Attackers commonly
  abuse misconfigured policies via residential
  proxy services. Allowlist length increases over
  time as new operator IPs get added; cleanup is
  rare.
failure: >
  Effectively unlocked access policy with the
  appearance of restriction. The allowlist is
  load-bearing in compliance review but porous in
  practice.
tests:
  - name: dynamic isp range in allowlist fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            policy_ip_allowlist_dynamic_isp: true
  - name: static corporate ips passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            policy_ip_allowlist_dynamic_isp: false
