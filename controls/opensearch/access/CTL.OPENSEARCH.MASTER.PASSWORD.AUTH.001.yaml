dsl_version: ctrl.v1
id: CTL.OPENSEARCH.MASTER.PASSWORD.AUTH.001
name: OpenSearch Master User Authenticates Via Password Not IAM Role
description: >
  OpenSearch FGAC master user is provisioned with a
  password (internal user database) instead of
  mapping to an IAM role. Password-based master
  auth means: the credential lives somewhere
  (Secrets Manager, vault, or worse), can be
  exfiltrated, and cannot be rotated automatically
  alongside the calling service's identity. IAM
  role mapping ties the master to AWS principal
  identity — rotated automatically, audited via
  CloudTrail, no shared secret.
domain: governance
severity: high
compliance:
  soc2: "CC6.1, CC6.6"
  pci_dss_v4.0: "8.2.1, 8.3.1"
  nist_800_53_r5: "IA-2, IA-5"
  fedramp_moderate: "IA-2"
  iso_27001_2022: "A.5.16, A.8.5"
  ccm_v4: ["IAM-09"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: credential_access
remediation:
  description: >
    Master user is password-based; switch to IAM
    role.
  action: >
    Update the FGAC master configuration to
    reference an IAM role ARN as the master.
    Decommission the password-based master once
    the role-based master is verified working.
    Document the break-glass account separately.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "access": {
          "master_user_iam_role": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.access.fgac_enabled
      op: eq
      value: true
    - field: properties.search_service.access.master_user_iam_role
      op: eq
      value: false
defect: >
  Master user is password-based, not IAM-role
  mapped.
infection: >
  Master credential is a long-lived shared secret.
  Rotation depends on a manual process. Leakage
  via Git, log capture, or memory dump is a single
  step from credential to full domain control.
failure: >
  Long-lived credential as control-plane key.
  Trail of custody exists outside AWS-native
  identity.
tests:
  - name: master via password fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            fgac_enabled: true
            master_user_iam_role: false
  - name: master via IAM role passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          access:
            fgac_enabled: true
            master_user_iam_role: true
