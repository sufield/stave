dsl_version: ctrl.v1
id: CTL.OPENSEARCH.ISM.NOSNAPSHOT.DELETE.001
name: OpenSearch ISM Delete State Has No Pre-Delete Snapshot Action
description: >
  OpenSearch ISM policy's `delete` state runs
  without a preceding `snapshot` action, or the
  snapshot action references a repository
  different from the compliance-retained one.
  Once an index reaches delete state, data is
  irrevocable; recovery is impossible if no
  snapshot was taken first or if the snapshot
  went to a short-retention repo.
domain: governance
severity: high
compliance:
  soc2: "CC7.4, A1.2"
  nist_800_53_r5: "CP-9"
  fedramp_moderate: "CP-9"
  iso_27001_2022: "A.8.13"
  ccm_v4: ["BCR-08", "BCR-11"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_opensearch_domain
params:
  attack_stage: impact
remediation:
  description: >
    ISM delete state without snapshot guard.
  action: >
    Add snapshot action before delete:
      "actions": [
        {"snapshot": {"repository": "<long-ret-repo>",
         "snapshot": "{{ctx.index}}-final"}},
        {"delete": {}}
      ]
  example: |
    {
      "search_service": {
        "kind": "domain",
        "ism": {
          "delete_has_snapshot_guard": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.ism.has_delete_state
      op: eq
      value: true
    - field: properties.search_service.ism.delete_has_snapshot_guard
      op: eq
      value: false
defect: >
  ISM delete state without snapshot guard.
infection: >
  Index reaches delete; data irrevocable.
failure: >
  Single-step destruction with no recovery
  position.
tests:
  - name: no snapshot guard fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          ism:
            has_delete_state: true
            delete_has_snapshot_guard: false
  - name: snapshot guard present passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:es:us-east-1:111122223333:domain/prod"
      asset_type: aws_opensearch_domain
      vendor: aws
      properties:
        search_service:
          kind: domain
          ism:
            has_delete_state: true
            delete_has_snapshot_guard: true
