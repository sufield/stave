dsl_version: ctrl.v1
id: CTL.BACKUP.ENCRYPT.001
name: Backups Must Be Encrypted
description: >
  All backups must be encrypted at rest. Unencrypted backups expose
  data if the backup storage is compromised or the backup is shared
  across accounts.
domain: exposure
severity: high
compliance:
  hipaa: "164.312(a)(2)(iv)"
  soc2: "CC6.7"
  pci_dss_v4.0: "3.4.1"
  nist_800_53_r5: "SC-28"
  fedramp_moderate: "SC-28"
  gdpr: "Art.32"
  ffiec: "BCP"
  ccm_v4: ["BCR-08", "CCC-04", "CCC-07", "CEK-03"]
scope_tags:
  - aws
  - backup
taxonomy:
  - compliance-mapping
  - encryption-at-rest
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_backup_vault]
params:
  attack_stage: exfiltration
remediation:
  description: >
    Backup is not encrypted. Backup data is stored in plaintext.
  action: >
    Enable encryption on the backup vault or copy the backup with
    encryption enabled. For AWS Backup, set the vault encryption key
    to a customer-managed KMS key.
  example: |
    {
      "backup": {
        "kind": "resource",
        "encrypted": true
      }
    }
unsafe_predicate:
  all:
    - field: properties.backup.kind
      op: eq
      value: resource
    - field: properties.backup.has_backup
      op: eq
      value: true
    - field: properties.backup.encrypted
      op: eq
      value: false
