dsl_version: ctrl.v1
id: CTL.BACKUP.INCOMPLETE.001
name: Complete Data Required for Backup Assessment
description: >
  Backup safety cannot be assessed when backup status is missing
  from the snapshot. The extractor must populate backup.has_backup.
compliance:
  ccm_v4: ["BCR-08", "CEK-03", "DCS-06"]
domain: exposure
severity: low
scope_tags:
  - aws
  - backup
taxonomy:
  - compliance-mapping
applicable_asset_types:
  - aws_backup_plan
type: unsafe_state
classification: absence_check
params: {}
remediation:
  description: >
    Backup assessment data is incomplete. The extractor did not populate
    required backup properties.
  action: >
    Re-run the extractor with backup permissions:
    backup:ListBackupJobs, backup:DescribeBackupVault,
    rds:DescribeDBSnapshots, s3:GetBucketReplication.
unsafe_predicate:
  all:
    - field: properties.backup.kind
      op: eq
      value: resource
    - field: properties.backup.has_backup
      op: missing
      value: true
