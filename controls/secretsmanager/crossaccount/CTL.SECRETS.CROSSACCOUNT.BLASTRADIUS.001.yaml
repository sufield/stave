dsl_version: ctrl.v1
id: CTL.SECRETS.CROSSACCOUNT.BLASTRADIUS.001
name: Secret Shared with Excessive Number of Accounts
description: >
  Secret resource policy grants GetSecretValue to more
  than 5 external accounts. Same blast-radius pattern as
  CTL.KMS.CROSSACCOUNT.BLASTRADIUS.001 — each sharing
  account increases risk in both directions: credential
  compromise affects all accounts, and account compromise
  in any one of them provides credential access. Threshold
  of 5 is consistent across cross-account blast radius
  controls.
domain: governance
severity: high
compliance:
  owasp_nhi: "NHI6"
  soc2: "CC6.1, CC6.6"
  nist_800_53_r5: "AC-3, AC-6, SC-12"
  pci_dss_v4.0: "7.1, 7.2"
  fedramp_moderate: "AC-6"
  iso_27001_2022: "A.5.15, A.8.3"
  ccm_v4: ["IAM-04", "IAM-09"]
scope_tags:
  - aws
  - secretsmanager
taxonomy:
  - credential-lifecycle
  - identity-perimeter
  - least-privilege
  - logging
  - monitoring
  - trust-boundary
type: unsafe_state
classification: state_assertion
params:
  attack_stage: lateral_movement
  blast_radius:
    type: prevention
    scope: organization
    multiplier: 4.0
remediation:
  description: >
    Secret is shared with too many external accounts. Each
    sharing account is a potential compromise path.
  action: >
    Audit the cross-account list and remove accounts that
    no longer require access. For accounts that genuinely
    need the credential, prefer architecture changes that
    avoid sharing: each consuming account uses a separate
    secret with its own rotation, or each account
    authenticates through a shared service that brokers
    access. If broad sharing is unavoidable (a true
    enterprise-wide credential), pair with strict
    aws:PrincipalOrgID conditions
    (CTL.SECRETS.POLICY.CROSSACCOUNT.001),
    high-frequency access alarms
    (CTL.SECRETS.ALARM.ACCESS.VOLUME.001), and CloudTrail
    data events in every consuming account
    (CTL.SECRETS.AUDIT.DATAEVENTS.001).
  example: |
    {
      "secret": {
        "kind": "secret",
        "policy": {
          "cross_account_count": 2,
          "cross_account_excessive": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.policy.cross_account_excessive
      op: eq
      value: true
defect: >
  Secret is shared with more than 5 external accounts.
infection: >
  Each account with secret access increases the blast
  radius: credential compromise (if the credential is
  leaked, all sharing accounts are affected), account
  compromise (if any one of the sharing accounts is
  compromised, the attacker reads the credential via
  that account's access), and rotation impact (when the
  credential rotates, every sharing account must handle
  the new value — if any caches the old value,
  authentication breaks). A credential shared with 10
  accounts means 10 potential compromise paths and 10
  potential rotation-failure surfaces.
failure: >
  Excessive credential blast radius. Credential compromise
  or rotation failure affects every sharing account.
tests:
  - name: secret shared with 8 accounts fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:shared/master-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          policy:
            cross_account_count: 8
            cross_account_excessive: true
            cross_account_ids: ["222233334444", "333344445555", "444455556666", "555566667777", "666677778888", "777788889999", "888899990000", "999900001111"]
  - name: secret shared with 2 accounts passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:shared/master-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          policy:
            cross_account_count: 2
            cross_account_excessive: false
            cross_account_ids: ["222233334444", "333344445555"]
  - name: secret shared with 5 accounts (at threshold) passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:shared/master-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          policy:
            cross_account_count: 5
            cross_account_excessive: false
            cross_account_ids: ["222233334444", "333344445555", "444455556666", "555566667777", "666677778888"]
