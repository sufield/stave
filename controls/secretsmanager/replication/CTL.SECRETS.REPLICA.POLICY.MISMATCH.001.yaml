dsl_version: ctrl.v1
id: CTL.SECRETS.REPLICA.POLICY.MISMATCH.001
name: Secret Replicas Have Different Access Policies
description: >
  Secrets Manager secret is replicated to other regions
  but the replicas have different resource policies. The
  same credential value exists in multiple regions with
  inconsistent access control. The weakest replica policy
  is the effective access control for the credential —
  same pattern as
  CTL.KMS.MULTIREGION.POLICY.MISMATCH.001.
domain: governance
severity: high
compliance:
  soc2: "CC6.1, CC6.6"
  nist_800_53_r5: "AC-3, AC-4, SC-12"
  pci_dss_v4.0: "7.1, 7.2"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.5.15, A.8.3"
  ccm_v4: ["IAM-04", "DSP-13"]
scope_tags:
  - aws
  - secretsmanager
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.5
remediation:
  description: >
    Secret replicas in different regions enforce different
    access controls. The weakest replica policy is the
    effective access control.
  action: >
    Synchronize the resource policy across the primary and
    every replica. Either: (a) rebuild the replicas after
    aligning the primary's policy
    (aws secretsmanager replicate-secret-to-regions or
    delete-replica + replicate); or (b) update each
    replica's resource policy individually
    (aws secretsmanager put-resource-policy --secret-id
    <replica-arn> --resource-policy <policy>) so all
    regions enforce the same rules. Pair with
    CloudTrail data events
    (CTL.SECRETS.AUDIT.DATAEVENTS.001) in every region —
    a less-monitored replica region weakens the audit
    surface as well as the access surface.
  example: |
    {
      "secret": {
        "kind": "secret",
        "replication": {
          "is_replicated": true,
          "replica_regions": ["us-east-1", "eu-west-1"],
          "replica_policies_consistent": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.replication.is_replicated
      op: eq
      value: true
    - field: properties.secret.replication.replica_policies_consistent
      op: eq
      value: false
defect: >
  Secret replicas across regions have inconsistent resource
  policies.
infection: >
  Replicated secrets share the same credential value across
  regions. If the primary in us-east-1 has a restrictive
  policy (GetSecretValue only for specific production
  roles) but the replica in ap-southeast-1 has a broader
  policy (GetSecretValue for account root), an attacker
  reads the credential from the replica. The credential is
  the same. The access control is different. The weakest
  replica policy is the effective access control for the
  credential. Additionally, replicas in less-monitored
  regions may have less CloudTrail coverage — access to
  the replica may be less visible than access to the
  primary.
failure: >
  Inconsistent credential access control across regions.
  The weakest replica policy determines effective access
  to the credential.
tests:
  - name: replica policy mismatch fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/global-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          replication:
            is_replicated: true
            replica_regions: ["us-east-1", "ap-southeast-1"]
            replica_policies_consistent: false
            policy_mismatches:
              - region: "ap-southeast-1"
                summary: "broader Principal scope vs primary"
  - name: consistent replica policies passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/global-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          replication:
            is_replicated: true
            replica_regions: ["us-east-1", "eu-west-1"]
            replica_policies_consistent: true
            policy_mismatches: []
  - name: 3-replica partial mismatch (2 match, 1 differs) fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/multi-region-XyZ"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          replication:
            is_replicated: true
            replica_regions: ["us-east-1", "eu-west-1", "ap-southeast-1"]
            replica_policies_consistent: false
            policy_mismatches:
              - region: "ap-southeast-1"
                summary: "missing PrincipalOrgID condition"
