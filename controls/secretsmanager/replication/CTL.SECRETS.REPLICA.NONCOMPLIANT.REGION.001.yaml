dsl_version: ctrl.v1
id: CTL.SECRETS.REPLICA.NONCOMPLIANT.REGION.001
name: Secret Replicated to Non-Compliant Region
description: >
  Secrets Manager secret is replicated to a region that
  doesn't comply with data residency requirements. The
  credential value — which may be a database password,
  API key, or service token — exists in a region where
  data processing is not authorized. Same pattern as
  CTL.KMS.MULTIREGION.NONCOMPLIANT.REGION.001.
domain: governance
severity: high
compliance:
  soc2: "CC6.1, CC6.7"
  nist_800_53_r5: "AC-4, SC-12, SC-28"
  pci_dss_v4.0: "1.2"
  fedramp_moderate: "AC-4"
  hipaa: "164.312(a)(1)"
  iso_27001_2022: "A.5.31, A.8.20"
  ccm_v4: ["DSP-13", "DSP-19"]
scope_tags:
  - aws
  - secretsmanager
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - logging
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_secretsmanager_secret]
params:
  attack_stage: exfiltration
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.5
remediation:
  description: >
    Secret is replicated to a region outside the
    organization's data residency boundary.
  action: >
    Remove the non-compliant replica
    (aws secretsmanager remove-regions-from-replication
    --secret-id <id> --remove-replica-regions <region>).
    Audit the secret's CloudTrail data events in the
    non-compliant region to understand whether the
    credential was retrieved while the replica existed
    — if so, treat as a data-residency incident and
    rotate the credential. Configure SCPs to deny
    secretsmanager:ReplicateSecretToRegions for
    non-compliant regions to prevent re-introduction.
  example: |
    {
      "secret": {
        "kind": "secret",
        "replication": {
          "is_replicated": true,
          "replica_regions": ["us-east-1", "eu-west-1"],
          "has_noncompliant_replica": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.replication.is_replicated
      op: eq
      value: true
    - field: properties.secret.replication.has_noncompliant_replica
      op: eq
      value: true
defect: >
  Secret is replicated to a region outside data-residency
  authorization.
infection: >
  Data residency requirements treat credentials as
  protected data — often more strictly than general data,
  because credentials grant access to all data they
  authenticate. A replica in a non-compliant region means:
  the credential value is stored at rest in that region's
  Secrets Manager, the credential can be retrieved by
  principals with GetSecretValue and access to that
  region, and the region's CloudTrail and KMS posture
  determines the surrounding controls. If the credential
  authenticates a database holding regulated data, the
  credential leaving the data-residency boundary is a
  policy violation independent of the database's own
  region.
failure: >
  Credential material in unauthorized region. Data
  residency violation; credential can be retrieved
  outside compliant boundary.
tests:
  - name: replica in non-compliant region fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/eu-data-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          replication:
            is_replicated: true
            replica_regions: ["us-east-1", "ap-east-1"]
            has_noncompliant_replica: true
            noncompliant_regions: ["ap-east-1"]
  - name: replicas all in compliant regions passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/eu-data-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          replication:
            is_replicated: true
            replica_regions: ["us-east-1", "eu-west-1"]
            has_noncompliant_replica: false
            noncompliant_regions: []
