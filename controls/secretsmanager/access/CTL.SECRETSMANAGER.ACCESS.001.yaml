dsl_version: ctrl.v1
id: CTL.SECRETSMANAGER.ACCESS.001
name: Secrets Must Have Rotation Enabled
description: >
  Secrets Manager secrets must have automatic rotation enabled.
  Long-lived secrets that are never rotated increase the blast radius
  of credential leaks and prevent timely revocation.
domain: exposure
severity: medium
compliance:
  hipaa: "164.312(a)(1)"
  soc2: "CC6.1"
  ccm_v4: ["DSP-17", "IAM-16"]
scope_tags:
  - aws
  - secretsmanager
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
remediation:
  description: >
    Secret does not have automatic rotation enabled. The secret value
    may be stale or compromised without detection.
  action: >
    Configure automatic rotation with a Lambda function. Run:
    aws secretsmanager rotate-secret --secret-id xxx
    --rotation-lambda-arn arn:aws:lambda:...
    --rotation-rules AutomaticallyAfterDays=90
  example: |
    {
      "secret": {
        "kind": "secret",
        "access": {
          "rotation_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.access.rotation_enabled
      op: eq
      value: false
