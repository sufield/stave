dsl_version: ctrl.v1
id: CTL.SECRETS.ALARM.POLICYCHANGE.001
name: No CloudWatch Alarm for Secret Policy Changes
description: >
  No CloudWatch alarm monitors CloudTrail for
  PutResourcePolicy or DeleteResourcePolicy API calls on
  secrets. Policy changes modify who can access the
  credential — adding new principals, adding cross-account
  access, removing scoping conditions. Without an alarm,
  secret access-control modifications are invisible until
  audited. Same pattern as KMS.ALARM.POLICYCHANGE and
  SNS.ALARM.DELETETOPIC: the access posture changes and
  nobody is told.
domain: detection
severity: medium
compliance:
  cis_aws_v3.0: "4.13"
  soc2: "CC7.2"
  nist_800_53_r5: "AU-6, SI-4"
  pci_dss_v4.0: "10.6"
  fedramp_moderate: "SI-4"
  iso_27001_2022: "A.8.16"
  ccm_v4: ["LOG-08"]
scope_tags:
  - aws
  - secretsmanager
taxonomy:
  - credential-lifecycle
  - identity-perimeter
  - key-management
  - logging
  - monitoring
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_secretsmanager_secret]
params:
  attack_stage: detection_evasion
remediation:
  description: >
    Secret resource-policy modifications go undetected. Any
    change to who can read or write the credential is
    invisible.
  action: >
    Create CloudTrail metric filters on
    eventName = PutResourcePolicy and
    eventName = DeleteResourcePolicy scoped to Secrets
    Manager, then a CloudWatch alarm with threshold 1 over
    a 5-minute period. Route to security on-call so policy
    changes trigger immediate review against a recent
    snapshot of the policy. Pair with
    CTL.SECRETS.AUDIT.DATAEVENTS.001 so the modification
    event AND any subsequent reads of the affected secret
    are correlated in the audit trail.
  example: |
    {
      "secret": {
        "kind": "secret",
        "monitoring": {
          "alarm_policy_change": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.monitoring.alarm_policy_change
      op: ne
      value: true
defect: >
  No CloudWatch alarm monitors PutResourcePolicy /
  DeleteResourcePolicy on Secrets Manager secrets.
infection: >
  Resource-policy modifications change the secret's access
  surface. A PutResourcePolicy call may add a new principal
  (legitimate consumer integrating, or attacker granting
  themselves access), add cross-account access (legitimate
  partner integration, or attacker pivoting), or remove a
  scoping condition (legitimate fix, or attacker dropping
  the aws:PrincipalOrgID condition). Without an alarm,
  every one of these changes is invisible until the next
  policy audit — which may be quarterly or annual. By the
  time an audit catches the change, the attacker has had
  weeks of access. The alarm gives minutes-level
  detection.
failure: >
  Undetected access-control changes. Who can read or
  modify the credential changed without notification.
tests:
  - name: secret without policy-change alarm fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/api-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          monitoring:
            alarm_policy_change: false
  - name: secret with policy-change alarm passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/api-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          monitoring:
            alarm_policy_change: true
