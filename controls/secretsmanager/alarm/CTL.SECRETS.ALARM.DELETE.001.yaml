dsl_version: ctrl.v1
id: CTL.SECRETS.ALARM.DELETE.001
name: No CloudWatch Alarm for Secrets Manager DeleteSecret
description: >
  No CloudWatch alarm monitors CloudTrail for DeleteSecret
  API calls. DeleteSecret schedules the secret for permanent
  deletion with a recovery window (7-30 days). Without an
  alarm, deletion is invisible until dependent services
  start failing. Companion to
  CTL.SECRETS.GHOST.DELETION.REFERENCED.001 (SM-1): GHOST
  detects state (already pending deletion); this alarm
  detects the event (deletion happening now), enabling
  immediate restore-or-confirm response.
domain: detection
severity: high
compliance:
  cis_aws_v3.0: "4.13"
  soc2: "CC7.2, CC7.3, A1.2"
  nist_800_53_r5: "AU-6, IR-4, SI-4, CP-10"
  pci_dss_v4.0: "10.6, 10.7"
  fedramp_moderate: "SI-4"
  iso_27001_2022: "A.5.16, A.8.16"
  ccm_v4: ["IAM-04", "BCR-08"]
scope_tags:
  - aws
  - secretsmanager
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
  blast_radius:
    type: detection
    scope: account
    multiplier: 3.0
remediation:
  description: >
    No alarm wired to CloudTrail DeleteSecret events. Secret
    deletions can occur without real-time notification.
  action: >
    Create a CloudTrail metric filter on
    eventName = DeleteSecret scoped to the account, then a
    CloudWatch alarm with threshold 1 and a 60-second
    period: aws logs put-metric-filter --filter-pattern
    '{ $.eventName = "DeleteSecret" }' followed by aws
    cloudwatch put-metric-alarm. Route the alarm to an SNS
    topic with confirmed subscribers (ops on-call,
    PagerDuty) so deletions surface within minutes —
    enough time to RestoreSecret if the deletion was
    accidental.
  example: |
    {
      "secret": {
        "kind": "secret",
        "monitoring": {
          "alarm_delete_secret": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.monitoring.alarm_delete_secret
      op: eq
      value: false
defect: >
  No CloudWatch alarm monitors DeleteSecret API calls.
infection: >
  DeleteSecret schedules the secret for permanent deletion
  with a recovery window (7-30 days). During this window,
  GetSecretValue fails — every Lambda function, ECS task,
  RDS Proxy, and application that retrieves this credential
  fails. Without an alarm: the deletion is invisible until
  dependent services start failing. A scheduled deletion on
  Friday evening causes service failures over the weekend
  — nobody is notified until Monday. RestoreSecret can
  reverse the deletion during the recovery window, but only
  if someone knows it happened. The alarm provides
  seconds-to-minutes notification.
failure: >
  Undetected secret deletion. Credential scheduled for
  permanent deletion without notification. Dependent
  services fail.
tests:
  - name: secret without delete alarm fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/db-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          monitoring:
            alarm_delete_secret: false
  - name: secret with delete alarm passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/db-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          monitoring:
            alarm_delete_secret: true
  - name: pending-deletion secret without delete alarm fires (compound)
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:legacy/api-XyZ"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          monitoring:
            alarm_delete_secret: false
          lifecycle:
            is_scheduled_deletion: true
            deletion_days_remaining: 5
            dependent_resource_count: 4
