dsl_version: ctrl.v1
id: CTL.SECRET.BLAST.002
name: Cross-Account Secret Access Must Not Target Sensitive Resource
description: >
  Secrets that provide credentials to sensitive resources must
  have access restricted to the owning account. Cross-account
  access to a secret that unlocks PHI or PII data doubles the
  blast radius — the secret is reachable from a wider set of
  principals across account boundaries.
domain: exposure
severity: critical
compliance:
  soc2: "CC6.1"
  nist_800_53_r5: "AC-3"
  fedramp_moderate: "AC-3"
scope_tags:
  - aws
  - secretsmanager
type: unsafe_state
params:
  base_impact: 10
  attack_stage: credential_access
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.5
remediation:
  description: >
    Secret targeting sensitive resource is readable from another
    AWS account. Cross-account access widens the credential
    compromise surface.
  action: >
    Remove cross-account access from the secret resource policy.
    If cross-account access is required, restrict to specific
    role ARNs and require an external ID condition.
  example: |
    {
      "secret": {
        "kind": "secret",
        "blast_radius": {
          "access_vector": "same_account",
          "target_sensitivity": "phi"
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.blast_radius.access_vector
      op: eq
      value: cross_account
    - field: properties.secret.blast_radius.target_sensitivity
      op: in
      value: ["phi", "pii", "confidential"]
