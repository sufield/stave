dsl_version: ctrl.v1
id: CTL.SECRET.BLAST.INCOMPLETE.001
name: Complete Data Required for Secret Blast Radius Assessment
description: >
  Secret blast radius assessment requires the target_sensitivity
  field. The extractor could not determine which resource the
  secret provides credentials for.
compliance:
  ccm_v4: ["DCS-06", "DSP-17", "IAM-05"]
domain: exposure
severity: low
scope_tags:
  - aws
  - secretsmanager
applicable_asset_types:
  - aws_secretsmanager_secret
type: unsafe_state
classification: state_assertion
params: {}
remediation:
  description: >
    Secret blast radius data is incomplete. The extractor could not
    identify the target resource for this secret.
  action: >
    Tag secrets with the target resource ARN. Re-run the extractor
    with permissions to read secret metadata and tags.
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.blast_radius.target_sensitivity
      op: missing
      value: true
