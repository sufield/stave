dsl_version: ctrl.v1
id: CTL.SECRETS.POLICY.CROSSACCOUNT.001
name: Secret Resource Policy Grants Cross-Account Access Without Organizational Boundary
description: >
  Secret resource policy grants secretsmanager:GetSecretValue
  to principals in external accounts without an
  aws:PrincipalOrgID condition. Any principal in the
  specified external account with the matching IAM
  permissions can read the credential. Distinct from
  CTL.SECRETSMANAGER.POLICY.PUBLIC.001 (Principal '*') and
  from CTL.SECRETS.CROSSACCOUNT.NOKMS.001 (cross-service
  KMS mismatch): this control checks the org-boundary
  scoping condition specifically.
domain: exposure
severity: high
compliance:
  owasp_nhi: "NHI9"
  cis_aws_v3.0: "1.20"
  soc2: "CC6.1, CC6.6, CC6.7"
  nist_800_53_r5: "AC-3, AC-4, AC-6"
  pci_dss_v4.0: "7.1, 7.2, 1.2"
  fedramp_moderate: "AC-3"
  hipaa: "164.312(a)(1)"
  iso_27001_2022: "A.5.15, A.8.3"
  ccm_v4: ["IAM-16", "DSP-13"]
scope_tags:
  - aws
  - secretsmanager
taxonomy:
  - confused-deputy
  - credential-lifecycle
  - identity-perimeter
  - network-perimeter
  - trust-boundary
  - trust-decay
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
  blast_radius:
    type: prevention
    scope: account
    multiplier: 3.0
remediation:
  description: >
    Secret grants cross-account access without
    aws:PrincipalOrgID. Any principal in the named external
    account with matching IAM permissions can read the
    credential.
  action: >
    Add aws:PrincipalOrgID to every Statement that grants
    cross-account GetSecretValue (or PutSecretValue) so the
    grant only applies to accounts currently in the
    organization. If the access was unintended, remove the
    cross-account principal from the policy. If the access
    must extend outside the organization (true partner
    access), require a sourceVpce or sourceAccount condition
    pinning the access to specific infrastructure.
  example: |
    {
      "secret": {
        "kind": "secret",
        "policy": {
          "policy_cross_account": true,
          "policy_has_org_condition": true,
          "policy_external_accounts": ["444455556666"]
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.policy.policy_cross_account
      op: eq
      value: true
    - field: properties.secret.policy.policy_has_org_condition
      op: eq
      value: false
defect: >
  Secret resource policy grants cross-account access without
  aws:PrincipalOrgID.
infection: >
  Cross-account secret access without organizational
  boundary means any IAM principal in the specified external
  account with secretsmanager:GetSecretValue in their IAM
  policy can read the credential. If the external account
  is: compromised (an attacker reads the production database
  password from another account), decommissioned (the
  account is closed but the policy persists — if the
  account ID is reclaimed, the new owner gets secret
  access), or a partner (the partner's IAM controls
  determine who in their account reads the credential).
  PrincipalOrgID ensures only accounts currently in the
  organization can read the secret; without it, the
  external boundary is whoever happens to own the named
  account ID.
failure: >
  Credential accessible outside organizational boundary.
  External account principals can read the secret without
  org-membership verification.
tests:
  - name: cross-account policy without OrgID fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:shared/db-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          policy:
            policy_cross_account: true
            policy_has_org_condition: false
            policy_external_accounts: ["444455556666"]
            policy_cross_account_actions: ["secretsmanager:GetSecretValue"]
  - name: cross-account policy with PrincipalOrgID passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:shared/db-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          policy:
            policy_cross_account: true
            policy_has_org_condition: true
            policy_external_accounts: ["444455556666"]
            policy_cross_account_actions: ["secretsmanager:GetSecretValue"]
