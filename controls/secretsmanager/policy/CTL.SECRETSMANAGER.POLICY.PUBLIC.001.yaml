dsl_version: ctrl.v1
id: CTL.SECRETSMANAGER.POLICY.PUBLIC.001
name: Secrets Manager Secret Must Not Have Public Resource Policy
description: >
  Secrets Manager resource policies must not grant
  secretsmanager:GetSecretValue or secretsmanager:* to Principal "*"
  or to unauthenticated principals without scoping conditions. Public
  secret access allows any AWS principal to retrieve the secret value,
  which typically contains database credentials, API keys, or
  certificates.
domain: exposure
severity: critical
compliance:
  owasp_nhi: "NHI5"
  soc2: "CC6.1"
  nist_800_53_r5: "AC-3"
  pci_dss_v4.0: "3.4.1"
  hipaa: "164.312(a)(1)"
  ccm_v4: ["DSP-17", "IAM-16"]
scope_tags:
  - aws
  - secretsmanager
taxonomy:
  - confused-deputy
  - credential-lifecycle
  - identity-perimeter
  - network-perimeter
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
remediation:
  description: >
    Secrets Manager resource policy grants public or broadly scoped
    access. Any AWS principal can retrieve the secret value.
  action: >
    Restrict the resource policy to specific IAM roles or accounts.
    Remove any statements with Principal "*". For cross-account
    access, add aws:PrincipalOrgID or aws:SourceAccount conditions.
  example: |
    {
      "secret": {
        "kind": "secret",
        "policy": {
          "has_public_access": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.policy.has_public_access
      op: eq
      value: true
