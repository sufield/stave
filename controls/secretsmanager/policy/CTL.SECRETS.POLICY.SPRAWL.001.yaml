dsl_version: ctrl.v1
id: CTL.SECRETS.POLICY.SPRAWL.001
name: Secret Resource Policy Has Excessive Permission Statements
description: >
  Secret resource policy has more than 10 permission
  statements. Same threshold and pattern as
  CTL.SQS.POLICY.SPRAWL.001, CTL.SNS.POLICY.SPRAWL.001, and
  CTL.LAMBDA.POLICY.ACCUMULATED.001 — accumulated permission
  statements make the credential's access surface
  unauditable. Sprawled secret policies often hide
  effectively-public access in a Statement that the team
  forgot was added.
domain: governance
severity: medium
compliance:
  soc2: "CC6.1, CC6.3, CC8.1"
  nist_800_53_r5: "AC-3, AC-6, CM-2"
  pci_dss_v4.0: "7.1, 7.2"
  fedramp_moderate: "AC-6"
  iso_27001_2022: "A.5.15, A.8.3"
  ccm_v4: ["IAM-04", "IAM-09"]
scope_tags:
  - aws
  - secretsmanager
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
remediation:
  description: >
    Secret resource policy contains more than 10 permission
    statements. The access surface is unauditable.
  action: >
    Audit every Statement: for each, identify the principal,
    actions, and conditions. Consolidate redundant
    Statements (multiple Statements granting the same
    actions to similar principals can be merged). Remove
    Statements for decommissioned consumers. The target is
    a policy where every Statement is reviewable in a
    single sitting and the team can articulate why each
    grant exists.
  example: |
    {
      "secret": {
        "kind": "secret",
        "policy": {
          "policy_statement_count": 4,
          "policy_excessive": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.policy.policy_excessive
      op: eq
      value: true
defect: >
  Secret resource policy exceeds the 10-statement threshold.
infection: >
  Resource policies grow over time as new consumers are
  added without removing old ones. Sprawled secret policies
  hide problems: a Statement granting cross-account access
  to an account that's been decommissioned, a Statement
  granting GetSecretValue to a principal that has been
  deleted (CTL.SECRETS.GHOST.POLICY.PRINCIPAL.001), a
  Statement granting both GetSecretValue and
  PutSecretValue to the same application principal
  (CTL.SECRETS.POLICY.READWRITE.001). With 15+ statements
  every audit becomes a deep manual review and any
  Statement can hide effectively-public access by combining
  a broad Resource pattern, a permissive Action list, and
  an absent Condition.
failure: >
  Unauditable credential access surface. The accumulated
  policy hides drift, decommissioned consumers, and ghost
  references.
tests:
  - name: 15-statement policy fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:shared/master-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          policy:
            policy_statement_count: 15
            policy_excessive: true
  - name: 3-statement policy passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/api-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          policy:
            policy_statement_count: 3
            policy_excessive: false
