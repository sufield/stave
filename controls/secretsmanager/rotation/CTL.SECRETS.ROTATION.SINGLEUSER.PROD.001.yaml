dsl_version: ctrl.v1
id: CTL.SECRETS.ROTATION.SINGLEUSER.PROD.001
name: Production Secret Uses Single-User Rotation Strategy
description: >
  Production secret uses the single-user rotation strategy
  instead of the multi-user (alternating-users) strategy.
  Single-user rotation: changes the password for the same
  database user. During the brief window between password
  change and secret update, connections using the old
  password fail. Multi-user rotation: alternates between
  two users (e.g., app_user and app_user_clone). One is
  always valid while the other rotates. No downtime
  window. Fires only on production secrets — single-user
  rotation on dev/test is acceptable. Same production
  heuristic as CTL.APIGATEWAY.EXECLOG.LEVEL.001 and
  CTL.ECS.EXEC.PRODUCTION.001.
domain: governance
severity: medium
compliance:
  owasp_nhi: "NHI7"
  soc2: "CC6.1, A1.2"
  nist_800_53_r5: "IA-5, CP-10"
  pci_dss_v4.0: "8.2.4"
  fedramp_moderate: "IA-5"
  iso_27001_2022: "A.5.16, A.8.32"
  ccm_v4: ["IAM-04", "BCR-08"]
scope_tags:
  - aws
  - secretsmanager
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_secretsmanager_secret
params:
  attack_stage: impact
remediation:
  description: >
    Production secret uses single-user rotation; rotation
    creates a brief authentication-failure window.
  action: >
    Switch to multi-user rotation by creating a clone
    database user (same permissions, different name) and
    updating the rotation Lambda to alternate between the
    two users on each cycle. The AWS-provided rotation
    templates (RDS-PostgreSQL-MultiUser-Rotation,
    RDS-MySQL-MultiUser-Rotation) implement this pattern
    out of the box. After the switch, rotate the secret
    immediately to verify the new strategy works
    end-to-end.
  example: |
    {
      "secret": {
        "kind": "secret",
        "rotation": {
          "rotation_strategy": "multi_user",
          "is_production": true,
          "uses_single_user": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.rotation.is_production
      op: eq
      value: true
    - field: properties.secret.rotation.uses_single_user
      op: eq
      value: true
defect: >
  Production secret uses single-user rotation strategy.
infection: >
  Single-user rotation changes the password for one
  database user. The rotation sequence: (1) generate new
  password, (2) update the database user's password, (3)
  store new password in the secret. Between steps 2 and 3,
  any caller that already retrieved the old password and
  tries to use it sees an authentication failure. Multi-
  user rotation avoids this entirely: two users (e.g.,
  app_user, app_user_clone) take turns; the inactive user
  is rotated while the active user continues serving
  traffic. For production workloads, the no-downtime
  property of multi-user rotation is the difference
  between rotation being a routine operation and rotation
  causing transient errors.
failure: >
  Brief authentication-failure window during rotation.
  Production traffic experiences transient errors every
  rotation cycle.
tests:
  - name: production secret with single-user rotation fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/rds-master-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          rotation:
            rotation_strategy: "single_user"
            is_production: true
            uses_single_user: true
            secret_type: "rds"
  - name: production secret with multi-user rotation passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/rds-master-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          rotation:
            rotation_strategy: "multi_user"
            is_production: true
            uses_single_user: false
            secret_type: "rds"
  - name: dev secret with single-user rotation does not fire
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:dev/rds-master-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          rotation:
            rotation_strategy: "single_user"
            is_production: false
            uses_single_user: true
            secret_type: "rds"
