dsl_version: ctrl.v1
id: CTL.SECRETS.ROTATION.STALE.001
name: Secret Rotation Enabled But Last Rotation Was Long Ago
description: >
  Secret has rotation enabled but the last successful
  rotation was more than 2x the rotation interval ago. If
  the configured interval is 30 days and the last rotation
  was 90 days ago, rotation has been failing or stuck for
  60+ days. The configuration shows "rotation enabled,
  30-day interval" — the credential hasn't actually changed
  in 90 days. Deepens CTL.SECRETS.ROTATION.001 (which
  checks whether rotation is enabled) by checking whether
  rotation is actually WORKING.
domain: governance
severity: high
archetype: false-protection
compliance:
  owasp_nhi: "NHI7"
  cis_aws_v3.0: "2.4"
  soc2: "CC6.1, CC6.7"
  nist_800_53_r5: "IA-5, SC-12"
  pci_dss_v4.0: "3.6, 8.2.4"
  fedramp_moderate: "IA-5"
  hipaa: "164.312(a)(1)"
  iso_27001_2022: "A.5.16, A.8.5"
  ccm_v4: ["IAM-04", "CEK-10"]
scope_tags:
  - aws
  - secretsmanager
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
remediation:
  description: >
    Secret rotation is configured but the last rotation
    completed more than 2x the configured interval ago.
    Rotation has been failing or stuck.
  action: >
    Force an immediate rotation
    (aws secretsmanager rotate-secret --secret-id <id>
    --rotate-immediately) and watch the rotation Lambda's
    CloudWatch logs to identify the failure mode. Common
    causes: rotation Lambda was deleted (see
    CTL.SECRETS.GHOST.ROTATIONLAMBDA.001), rotation Lambda
    errors on every execution (code bug, network issue,
    permission change), the rotation schedule was manually
    paused and never resumed. After the underlying issue is
    fixed, verify LastRotatedDate advances on the next
    scheduled cycle.
  example: |
    {
      "secret": {
        "kind": "secret",
        "rotation": {
          "rotation_enabled": true,
          "last_rotated_days": 5,
          "rotation_interval_days": 30,
          "rotation_overdue": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.rotation.rotation_enabled
      op: eq
      value: true
    - field: properties.secret.rotation.rotation_overdue
      op: eq
      value: true
defect: >
  Secret rotation interval has been exceeded by more than 2x
  since the last successful rotation.
infection: >
  Rotation is enabled. The interval is configured. But the
  credential hasn't actually changed in the recorded number
  of days — multiple times the configured interval. This
  means rotation has been failing silently. Common causes:
  the rotation Lambda was deleted, the rotation Lambda
  errors on every execution (code bug, network issue,
  permission change after a role rename), rotation was
  manually paused and never resumed, or the rotation
  schedule was misconfigured. The result: the credential is
  static while appearing rotated. The audit report shows
  "rotation enabled, interval 30 days." The reality is
  "same password for 90+ days."
failure: >
  False rotation. Rotation is configured but the credential
  hasn't changed in many multiples of the intended
  interval.
tests:
  - name: rotation overdue (95 days, interval 30) fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/api-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          rotation:
            rotation_enabled: true
            last_rotated_days: 95
            rotation_interval_days: 30
            rotation_overdue: true
            rotation_overdue_factor: 3.16
  - name: recent rotation (5 days, interval 30) passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/api-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          rotation:
            rotation_enabled: true
            last_rotated_days: 5
            rotation_interval_days: 30
            rotation_overdue: false
            rotation_overdue_factor: 0.16
  - name: severely stuck rotation (300 days, interval 30 — 10x overdue) fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:legacy/db-master-XyZ"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          rotation:
            rotation_enabled: true
            last_rotated_days: 300
            rotation_interval_days: 30
            rotation_overdue: true
            rotation_overdue_factor: 10.0
