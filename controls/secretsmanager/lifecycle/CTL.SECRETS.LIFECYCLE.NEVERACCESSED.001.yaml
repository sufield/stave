dsl_version: ctrl.v1
id: CTL.SECRETS.LIFECYCLE.NEVERACCESSED.001
name: Secret Never Accessed Since Creation
description: >
  Secret was created but has never been accessed
  (GetSecretValue never called). The credential was stored
  but never retrieved by any service or application. This
  indicates: deployment incomplete (secret created but the
  application was never configured to retrieve it),
  abandoned provisioning (infrastructure partially deployed),
  or manual credential storage without integration (a
  password saved "just in case"). Fires only after a
  30-day grace period so freshly created secrets in active
  deployments don't trip the control prematurely.
domain: governance
severity: medium
compliance:
  soc2: "CC6.1, CC8.1"
  nist_800_53_r5: "CM-2, CM-3, SA-22"
  pci_dss_v4.0: "1.2, 8.5"
  fedramp_moderate: "CM-2"
  iso_27001_2022: "A.5.16, A.8.32"
  ccm_v4: ["IAM-04", "IAM-08"]
scope_tags:
  - aws
  - secretsmanager
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
remediation:
  description: >
    Secret has never been accessed since creation. Either
    the deployment that should consume it never completed,
    or the credential was stored without integration.
  action: >
    Audit the original ticket / deployment that created the
    secret. If the deployment is still in progress, expect
    the first GetSecretValue within the deployment window;
    otherwise schedule deletion
    (aws secretsmanager delete-secret --secret-id <id>
    --recovery-window-in-days 30). If the secret was stored
    manually as a contingency, document the consumer that
    will retrieve it and confirm a path exists for legitimate
    access.
  example: |
    {
      "secret": {
        "kind": "secret",
        "lifecycle": {
          "has_ever_been_accessed": true,
          "last_accessed_days": 7
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.lifecycle.has_ever_been_accessed
      op: eq
      value: false
    - field: properties.secret.lifecycle.secret_age_days
      op: gt
      value: 30
defect: >
  Secret has never been accessed since creation.
infection: >
  A secret that has never been accessed indicates the
  consumer never integrated. The credential sits in Secrets
  Manager, encrypted by the KMS key, with a resource policy
  granting access — and nobody retrieves it. Common causes:
  the deployment was abandoned mid-way, the application
  configuration was never updated to point at the secret
  ARN, the team stored the credential "for later" without
  integrating. The credential is not exercised; rotation (if
  enabled) churns the value without any consumer noticing;
  the credential is also a latent surface — if the resource
  policy is overly broad, the credential is readable but
  unused, which means illegitimate reads have no
  legitimate-baseline to stand out against.
failure: >
  Original credential never retrieved. The secret was
  created with intent that never materialized.
tests:
  - name: secret never accessed, 180 days old fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:abandoned/api-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          lifecycle:
            has_ever_been_accessed: false
            last_accessed_date: null
            secret_age_days: 180
  - name: secret accessed at least once passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/api-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          lifecycle:
            has_ever_been_accessed: true
            last_accessed_days: 7
            secret_age_days: 220
  - name: recently created (10 days) never-accessed secret does not fire (grace period)
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:newproject/api-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          lifecycle:
            has_ever_been_accessed: false
            last_accessed_date: null
            secret_age_days: 10
