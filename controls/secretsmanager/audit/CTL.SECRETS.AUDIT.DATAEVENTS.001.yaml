dsl_version: ctrl.v1
id: CTL.SECRETS.AUDIT.DATAEVENTS.001
name: CloudTrail Data Events Not Enabled for Secrets Manager
description: >
  CloudTrail is not configured to log Secrets Manager data
  events (GetSecretValue, PutSecretValue, DeleteSecret).
  Management events (CreateSecret, DescribeSecret,
  UpdateSecret) are logged by default but the most
  sensitive operation — GetSecretValue, the credential
  read — is not. For secrets containing database
  passwords, API keys, and service credentials, data
  events are the only credential-access audit trail.
  Higher severity than SQS/SNS data-event controls
  (medium): credential access is the most sensitive data
  access operation in AWS.
domain: detection
severity: high
compliance:
  cis_aws_v3.0: "3.2"
  soc2: "CC7.1, CC7.2"
  nist_800_53_r5: "AU-2, AU-3, AU-12"
  pci_dss_v4.0: "10.1, 10.2"
  fedramp_moderate: "AU-2"
  hipaa: "164.312(b)"
  iso_27001_2022: "A.8.15, A.8.16"
  ccm_v4: ["LOG-02", "LOG-13"]
scope_tags:
  - aws
  - secretsmanager
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - logging
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
  blast_radius:
    type: detection
    scope: account
    multiplier: 3.0
remediation:
  description: >
    Secrets Manager data events are not logged. Credential
    access is unrecorded.
  action: >
    Add a Secrets Manager data-event selector to a
    CloudTrail trail covering the account or the relevant
    secret ARNs:
    aws cloudtrail put-event-selectors --trail-name <trail>
    --advanced-event-selectors
    '[{"Name":"Secrets Manager data events","FieldSelectors":
    [{"Field":"eventCategory","Equals":["Data"]},
    {"Field":"resources.type","Equals":["AWS::SecretsManager::Secret"]}]}]'.
    For high-volume environments, restrict the resource
    ARN selector to security-sensitive secrets to bound
    log-volume cost. Verify the trail's S3 destination has
    appropriate access controls and retention.
  example: |
    {
      "secret": {
        "kind": "secret",
        "monitoring": {
          "cloudtrail_data_events": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.secret.kind
      op: eq
      value: secret
    - field: properties.secret.monitoring.cloudtrail_data_events
      op: eq
      value: false
defect: >
  Secrets Manager data events are not enabled in CloudTrail
  for this secret.
infection: >
  Without data events: who retrieved the production
  database password at 2am is unknown. Who read the API
  key for the payment gateway is unknown. Whether the
  secret was accessed from the expected VPC or from an
  unexpected IP is unknown. Management events show who
  created and configured the secret. Data events show
  who READ the credential — the most sensitive operation.
  For incident response, data events answer: was the
  credential accessed by the attacker? When? From where?
  How many times? Without data events, these questions
  are unanswerable.
failure: >
  No credential-access audit trail. Who read which
  credential, when, and from where is unrecorded.
tests:
  - name: secret without data events fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/db-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          monitoring:
            cloudtrail_data_events: false
  - name: secret with data events passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:secretsmanager:us-east-1:111122223333:secret:prod/db-AbCdEf"
      asset_type: aws_secret
      vendor: aws
      properties:
        secret:
          kind: secret
          monitoring:
            cloudtrail_data_events: true
