dsl_version: ctrl.v1
id: CTL.SECRETS.ROTATION.001
name: Secrets Manager Secrets Must Have Automatic Rotation Enabled
description: >
  Secrets without automatic rotation retain the same credential value
  indefinitely. An attacker who obtains a secret value through any
  means (log harvesting, memory dump, API call) has permanent access
  unless the secret is manually rotated. Automatic rotation limits
  the window of compromise — a stolen credential becomes invalid
  after the rotation interval.
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "IA-5"
  mitre_attack: "T1528"
  aws_security_hub: "SecretsManager.1"
  ccm_v4: ["CEK-05", "IAM-02"]
scope_tags:
  - aws
  - secretsmanager
type: unsafe_state
classification: state_assertion
params:
  attack_stage: collection
remediation:
  description: >
    Secret does not have automatic rotation configured. Compromised
    credentials remain valid indefinitely.
  action: >
    Configure automatic rotation with a Lambda rotation function:
    aws secretsmanager rotate-secret --secret-id <id>
    --rotation-lambda-arn <arn> --rotation-rules
    AutomaticallyAfterDays=30
  example: |
    {
      "secrets": {
        "kind": "secret",
        "rotation_enabled": true
      }
    }
unsafe_predicate:
  all:
    - field: properties.secrets.kind
      op: eq
      value: secret
    - field: properties.secrets.rotation_enabled
      op: eq
      value: false
