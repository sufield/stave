dsl_version: ctrl.v1
id: CTL.SAGEMAKER.ENDPOINT.MONITOR.001
name: SageMaker Endpoint Configuration Must Have Model Monitoring
description: >
  SageMaker endpoint configuration has no model monitoring
  schedule attached. Without a monitoring schedule (data
  quality, model quality, bias drift, or feature attribution),
  a deployed endpoint can drift, be silently replaced, or
  serve adversarial inputs without detection. Model monitoring
  is the equivalent of CloudTrail for ML inference: the audit
  surface that distinguishes "the model is doing what it
  promised" from "the model is doing something useful enough
  for the dashboard to look healthy."
domain: governance
severity: medium
compliance:
  owasp_nhi: "NHI8"
  nist_800_53_r5: "AU-2, CM-3"
  soc2: "CC7.2"
  hipaa: "164.312(b)"
  ccm_v4: ["LOG-01"]
scope_tags:
  - aws
  - sagemaker
taxonomy:
  - compliance-mapping
  - logging
  - monitoring
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_sagemaker_notebook]
params:
  attack_stage: detection_evasion
remediation:
  description: >
    SageMaker endpoint has no model monitoring schedule. Drift,
    adversarial inputs, and silent model swaps are undetected.
  action: >
    Attach a monitoring schedule via CreateMonitoringSchedule
    targeting the endpoint. At minimum, configure a data-
    quality monitor with a baseline statistics file. For
    production endpoints serving regulated data, also
    attach model-quality and bias-drift monitors.
  example: |
    {
      "compute": {
        "kind": "sagemaker_endpoint_config",
        "governance": { "has_model_monitor": true }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: sagemaker_endpoint_config
    - field: properties.compute.governance.has_model_monitor
      op: eq
      value: false
