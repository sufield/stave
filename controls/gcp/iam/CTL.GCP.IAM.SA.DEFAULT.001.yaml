dsl_version: ctrl.v1
id: CTL.GCP.IAM.SA.DEFAULT.001
name: Default Service Account Used
description: >
  Default Compute Engine or App Engine service account in use.
  Default SAs have Editor-level permissions by default — far
  broader than any workload needs.
domain: identity
severity: high
compliance:
  cis_gcp_v3: "1.3"
  nist_800_53_r5: "AC-6"
  pci_dss_v4: "7.2.1"
  soc2: "CC6.1"
scope_tags: [gcp]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Default Service Account Used — finding detected.
  action: Create a custom SA with least-privilege roles.
  example: |
    {"gcp": {"identity": {"kind": "service_account", "sa": {"is_default": false}}}}
unsafe_predicate:
  all:
    - field: properties.gcp.identity.kind
      op: eq
      value: service_account
    - field: properties.gcp.identity.sa.is_default
      op: present
    - field: properties.gcp.identity.sa.is_default
      op: eq
      value: true
