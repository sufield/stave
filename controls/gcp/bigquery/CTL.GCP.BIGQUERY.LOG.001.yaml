dsl_version: ctrl.v1
id: CTL.GCP.BIGQUERY.LOG.001
name: BigQuery Data Access Logging Not Enabled
description: >
  Data Access audit logs not enabled for BigQuery. Query execution,
  table reads, and data exports are not recorded.
domain: detection
severity: medium
compliance:
  cis_gcp_v3: "7.3"
  nist_800_53_r5: "AU-2"
  hipaa: "164.312(b)"
  soc2: "CC7.2"
scope_tags: [gcp]
taxonomy:
  - compliance-mapping
  - logging
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
remediation:
  description: BigQuery Data Access Logging Not Enabled — finding detected.
  action: Enable Data Access audit logs for BigQuery.
  example: |
    {"gcp": {"data": {"kind": "bigquery_dataset", "bigquery": {"data_access_logging": true}}}}
unsafe_predicate:
  all:
    - field: properties.gcp.data.kind
      op: eq
      value: bigquery_dataset
    - field: properties.gcp.data.bigquery.data_access_logging
      op: eq
      value: false
