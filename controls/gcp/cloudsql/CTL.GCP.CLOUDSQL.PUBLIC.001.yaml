dsl_version: ctrl.v1
id: CTL.GCP.CLOUDSQL.PUBLIC.001
name: Cloud SQL Instance Publicly Accessible
description: >
  Instance has a public IP and/or authorized networks includes
  0.0.0.0/0. Database reachable from the internet.
domain: exposure
severity: critical
compliance:
  cis_gcp_v3: "6.5"
  nist_800_53_r5: "AC-4"
  hipaa: "164.312(a)(1)"
  pci_dss_v4: "1.3"
  soc2: "CC6.6"
scope_tags: [gcp]
taxonomy:
  - compliance-mapping
  - network-perimeter
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Cloud SQL Instance Publicly Accessible — finding detected.
  action: Remove 0.0.0.0/0 from authorized networks and use private IP.
  example: |
    {"gcp": {"database": {"kind": "cloudsql_instance", "cloudsql": {"authorized_networks_public": false}}}}
unsafe_predicate:
  all:
    - field: properties.gcp.database.kind
      op: eq
      value: cloudsql_instance
    - field: properties.gcp.database.cloudsql.authorized_networks_public
      op: eq
      value: true
