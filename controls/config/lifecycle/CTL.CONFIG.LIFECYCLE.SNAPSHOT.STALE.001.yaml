dsl_version: ctrl.v1
id: CTL.CONFIG.LIFECYCLE.SNAPSHOT.STALE.001
name: Config Configuration Snapshots Not Delivered in 30+ Days
description: >
  AWS Config has not delivered a configuration
  snapshot to S3 in more than 30 days.
  Snapshots are full resource inventories at a
  point in time. Configuration history files
  (per-resource changes) may still be
  delivered, but the durable full-inventory
  baseline is stale.
domain: exposure
severity: high
compliance:
  soc2: "CC7.1, CC7.2, CC8.1"
  nist_800_53_r5: "AU-9, CA-7, CM-2, SI-4"
  pci_dss_v4.0: "10.1, 10.5"
  fedramp_moderate: "AU-9, CA-7"
  hipaa: "164.312(b)"
  iso_27001_2022: "A.5.16, A.8.15"
  ccm_v4: ["LOG-08", "LOG-12"]
scope_tags:
  - aws
  - config
taxonomy:
  - compliance-mapping
  - trust-decay
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
  blast_radius:
    type: data
    scope: account
    multiplier: 3.0
remediation:
  description: >
    No configuration snapshot in 30+ days; the
    durable inventory is stale.
  action: >
    Inspect Config delivery channel status: aws
    configservice describe-delivery-channel-
    status. If delivery is failing, fix the
    underlying issue (S3 permission, deleted
    bucket, KMS key inaccessible). After fix,
    trigger a manual snapshot delivery: aws
    configservice deliver-config-snapshot
    --delivery-channel-name <name>. Confirm
    the next snapshot lands in S3.
  example: |
    {
      "compliance": {
        "kind": "config_delivery_channel",
        "config": {
          "last_snapshot_days": 2,
          "snapshot_delivery_stale": false,
          "delivery_channel_name": "default",
          "delivery_s3_bucket": "config-bucket-111122223333"
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compliance.kind
      op: eq
      value: config_delivery_channel
    - field: properties.compliance.config.snapshot_delivery_stale
      op: eq
      value: true
defect: >
  Config configuration snapshots not delivered
  in 30+ days.
infection: >
  Configuration snapshots are full resource
  inventories — they capture the configuration
  of every recorded resource at a point in
  time. Without recent snapshots, compliance
  auditors have no recent baseline to compare
  against, incident investigators cannot
  establish what the account looked like at a
  specific point in time, and configuration
  drift analysis cannot compare current state
  to a known good state. Common causes: the
  delivery channel S3 bucket permission was
  changed (Config can't write), the snapshot
  delivery schedule was removed, or the
  recorder was stopped and restarted without
  triggering a new snapshot. Even the longest
  snapshot interval (24h) should produce a
  snapshot daily — 30 days of no delivery is
  always abnormal.
failure: >
  Stale configuration baseline. No configuration
  snapshot delivered in 30+ days; the durable
  resource inventory is outdated.
tests:
  - name: 45-day stale snapshot fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:config:us-east-1:111122223333:delivery-channel/default"
      asset_type: aws_config_delivery_channel
      vendor: aws
      properties:
        compliance:
          kind: config_delivery_channel
          config:
            last_snapshot_days: 45
            snapshot_delivery_stale: true
            delivery_channel_name: "default"
            delivery_s3_bucket: "config-bucket-111122223333"
  - name: recent snapshot passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:config:us-east-1:111122223333:delivery-channel/default"
      asset_type: aws_config_delivery_channel
      vendor: aws
      properties:
        compliance:
          kind: config_delivery_channel
          config:
            last_snapshot_days: 2
            snapshot_delivery_stale: false
            delivery_channel_name: "default"
            delivery_s3_bucket: "config-bucket-111122223333"
