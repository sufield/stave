dsl_version: ctrl.v1
id: CTL.GITHUB.REPO.SECRETSCAN.001
name: Repository Secret Scanning Not Enabled
description: >
  Secret scanning not enabled. Committed credentials (API keys,
  tokens, passwords, private keys) are not detected. Secrets in
  git history persist forever.
domain: exposure
severity: critical
compliance:
  nist_800_53_r5: "SA-11"
  nist_ssdf: "PW.7"
  pci_dss_v4: "6.5"
  soc2: "CC8.1"
scope_tags: [github]
taxonomy:
  - compliance-mapping
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
applicable_asset_types: [github_repository]
params:
  attack_stage: initial_access
remediation:
  description: Repository Secret Scanning Not Enabled — finding detected.
  action: Enable secret scanning in repository security settings.
  example: |
    {"github": {"repo": {"kind": "repository", "secret_scanning_enabled": true}}}
unsafe_predicate:
  all:
    - field: properties.github.repo.kind
      op: eq
      value: repository
    - field: properties.github.repo.secret_scanning_enabled
      op: eq
      value: false
