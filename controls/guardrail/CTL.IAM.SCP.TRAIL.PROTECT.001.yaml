dsl_version: ctrl.v1
id: CTL.IAM.SCP.TRAIL.PROTECT.001
name: SCPs Must Deny CloudTrail Disruption Actions
description: >
  Service Control Policies must deny cloudtrail:StopLogging,
  cloudtrail:DeleteTrail, and cloudtrail:UpdateTrail to non-
  breakglass roles. Without these protective denies, any IAM
  principal with sufficient permissions can disrupt logging.
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "AU-9"
  soc2: "CC7.1"
  fedramp_moderate: "AU-9"
  ccm_v4: ["CCC-04", "GRC-05"]
scope_tags:
  - aws
  - scp
taxonomy:
  - account-governance
  - compliance-mapping
  - logging
  - detection-evasion
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_iam_user, aws_iam_role]
params:
  attack_stage: detection_evasion
remediation:
  description: >
    No SCP denies CloudTrail disruption actions to non-breakglass
    roles.
  action: >
    Create an SCP with Effect Deny on cloudtrail:StopLogging,
    cloudtrail:DeleteTrail, and cloudtrail:UpdateTrail. Add a
    Condition excluding the breakglass role ARN.
  example: |
    {
      "scp": {
        "denies_trail_disruption": true
      }
    }
unsafe_predicate:
  all:
    - field: properties.scp.denies_trail_disruption
      op: ne
      value: true
