dsl_version: ctrl.v1
id: CTL.ECS.METADATA.CREDENTIAL.001
name: ECS Tasks Must Restrict Credential Endpoint Access to Required Containers
description: >
  ECS task definitions must restrict task metadata credential endpoint
  access (169.254.170.2) to only the containers that require AWS API
  access. Sidecar containers, init containers, and utility containers
  that do not call AWS APIs should not have credential endpoint access.
  Without scoping, every container in the task — including those
  vulnerable to SSRF — can retrieve the task role's IAM credentials
  from the metadata endpoint. This is the same attack class as EC2
  IMDSv1 credential theft (Capital One) but on containers. Unlike
  EC2 IMDS which has IMDSv2 token requirements, ECS task metadata
  has no equivalent token mechanism — the mitigation is restricting
  which containers can reach the endpoint.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "AC-6(5)"
  fedramp_moderate: "AC-6(5)"
  pci_dss_v4.0: "7.2.1"
  soc2: "CC6.1"
  hipaa: "164.312(a)(1)"
  ccm_v4: ["IAM-05", "IVS-03"]
scope_tags:
  - aws
  - ecs
taxonomy:
  - compliance-mapping
  - compute-hardening
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.0
remediation:
  description: >
    ECS task definition does not restrict credential endpoint access.
    All containers in the task can retrieve task role credentials from
    the metadata endpoint.
  action: >
    Configure container-level credential scoping in the task
    definition. Set credentialSpecs or use task role credential
    isolation to restrict which containers can access the credential
    endpoint. Sidecar and utility containers that do not require AWS
    API access should not have credential endpoint access.
  example: |
    {
      "container": {
        "kind": "task_definition",
        "metadata": {
          "credential_scoping_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.container.kind
      op: eq
      value: task_definition
    - field: properties.container.metadata.credential_scoping_enabled
      op: eq
      value: false
