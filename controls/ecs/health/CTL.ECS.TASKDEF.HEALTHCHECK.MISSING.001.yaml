dsl_version: ctrl.v1
id: CTL.ECS.TASKDEF.HEALTHCHECK.MISSING.001
name: ECS Container Has No Health Check
description: >
  Container definition has no healthCheck configured. ECS has no
  in-container signal for whether the container is healthy. A
  process that is running but unresponsive — deadlocked, stuck
  in a GC pause, blocked on a downed dependency, leaking
  connections — keeps the container in RUNNING state and
  continues to receive traffic; ECS only replaces the container
  when the process exits. Load-balancer health checks (ALB/NLB)
  provide partial coverage: they probe the container's listening
  port from outside and replace the task if the port stops
  responding. They do not catch in-process problems that don't
  manifest as port-level failures (slow but successful
  responses, internal queue backup, lost background workers).
  The task-level healthCheck runs inside the container and can
  test deeper invariants. Severity is medium because LB health
  checks usually catch the worst cases; the in-container check
  is defense-in-depth.
domain: governance
severity: medium
compliance:
  nist_800_53_r5: "SI-4"
  fedramp_moderate: "SI-4"
  soc2: "A1.1"
  ccm_v4: ["IVS-09", "LOG-12"]
scope_tags:
  - aws
  - ecs
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_ecs_service
params:
  attack_stage: resilience
remediation:
  description: >
    Container has no healthCheck configured. Hung or unresponsive
    containers continue to receive traffic.
  action: >
    Add a healthCheck command to the container definition that
    tests the application's actual readiness — a curl against an
    in-process /health endpoint, a CLI subcommand that probes
    background workers, or a deeper smoke test depending on the
    workload. Set interval, timeout, retries, and startPeriod
    appropriately. If a load balancer already health-checks
    this container at the port level and the team has decided
    that's sufficient, document that decision in a triage
    override on this control rather than leaving the finding
    unacknowledged.
  example: |
    {
      "container": {
        "kind": "task_definition",
        "health": {
          "has_health_check": true,
          "health_check_type": "CMD-SHELL"
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.container.kind
      op: eq
      value: task_definition
    - field: properties.container.health.has_health_check
      op: eq
      value: false
