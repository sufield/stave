dsl_version: ctrl.v1
id: CTL.ECS.EXEC.RESTRICT.001
name: ECS Exec Must Be Disabled on Production Services
description: >
  ECS Exec allows running interactive shell commands in running ECS
  containers via aws ecs execute-command. When enabled, any principal
  with ecs:ExecuteCommand permission can run arbitrary commands in
  production containers — equivalent to SSH access. ECS Exec has
  legitimate debugging use in development, but in production it
  represents an unnecessary execution vector. Attackers with IAM
  access can use it to establish persistence, exfiltrate data, or
  pivot to other services accessible from the container's network.
domain: governance
severity: high
compliance:
  nist_800_53_r5: "AC-3"
  mitre_attack: "T1059"
scope_tags:
  - aws
  - ecs
type: unsafe_state
params:
  attack_stage: execution
remediation:
  description: >
    ECS Exec is enabled on a production service. Interactive shell
    access is available to any principal with ecs:ExecuteCommand.
  action: >
    Disable ECS Exec on production services:
    aws ecs update-service --cluster <cluster> --service <service>
    --no-enable-execute-command --force-new-deployment.
    Restrict ecs:ExecuteCommand via IAM policy to break-glass roles
    with MFA enforcement.
  example: |
    {
      "container": {
        "kind": "ecs_service",
        "exec": {
          "enabled_in_production": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.container.kind
      op: eq
      value: ecs_service
    - field: properties.container.exec.enabled_in_production
      op: eq
      value: true
