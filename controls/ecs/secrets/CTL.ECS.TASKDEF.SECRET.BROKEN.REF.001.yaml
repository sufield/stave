dsl_version: ctrl.v1
id: CTL.ECS.TASKDEF.SECRET.BROKEN.REF.001
name: ECS Task Definition Secret Reference Inaccessible to Execution Role
description: >
  Container definition uses valueFrom to reference a Secrets
  Manager secret or SSM parameter, but the task execution role
  does not have IAM permission to retrieve that specific
  resource. The task definition is correctly structured (the
  operator chose valueFrom over plaintext, the right intent),
  but the policy attached to the execution role doesn't grant
  secretsmanager:GetSecretValue or ssm:GetParameter against
  the named ARN. The task fails at launch with
  AccessDeniedException. Same cross-resource shape as
  CTL.LAMBDA.SECRETS.BROKEN.REF.001 — the reference exists,
  the resource exists, the permission to bridge them does not.
  Distinct from CTL.ECS.SECRET.GHOST.001 (secret deleted) and
  CTL.ECS.GHOST.SSMPARAMETER.001 (parameter deleted) —
  here the resource is fine, the permission is the gap.
domain: identity
severity: high
compliance:
  nist_800_53_r5: "AC-3"
  fedramp_moderate: "AC-3"
  pci_dss_v4.0: "7.2.1"
  soc2: "CC6.1"
  ccm_v4: ["IAM-04", "IAM-16"]
scope_tags:
  - aws
  - ecs
taxonomy:
  - compliance-mapping
  - trust-decay
type: unsafe_state
classification: state_assertion
params:
  attack_stage: resilience
remediation:
  description: >
    Task execution role lacks permission to retrieve a secret
    or SSM parameter referenced by the task definition. Tasks
    fail at launch.
  action: >
    Add the appropriate Get permission to the execution role's
    policy, scoped to the specific resource ARN(s) referenced
    by valueFrom — secretsmanager:GetSecretValue for Secrets
    Manager, ssm:GetParameter (and kms:Decrypt against the
    parameter's KMS key for SecureString) for SSM. Avoid
    blanket "*" grants; the cost of scoping the permission to
    the ARN is small and matches the cost of having created
    the valueFrom in the first place.
  example: |
    {
      "container": {
        "kind": "task_definition",
        "secrets": {
          "exec_role_can_access": true,
          "inaccessible_arns": []
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.container.kind
      op: eq
      value: task_definition
    - field: properties.container.secrets.exec_role_can_access
      op: eq
      value: false
