dsl_version: ctrl.v1
id: CTL.ECS.TASKDEF.SSM.INSECURE.001
name: ECS Task Definition References SSM Parameter as String Type
description: >
  Container definition uses valueFrom to inject an SSM Parameter
  Store parameter that is stored as String type rather than
  SecureString. String parameters are stored in plaintext and
  retrieved in plaintext — no KMS encryption, no audit trail
  for decrypts, no separation between "who can read the
  parameter" and "who can read the secret it contains." For
  parameters carrying credentials, tokens, or any sensitive
  configuration, SecureString is the correct type. Same
  detection pattern as CTL.LAMBDA.SECRETS.SSM.INSECURE.001 on
  a different surface. The task definition's valueFrom is
  correct in shape; the type of the underlying parameter is
  the problem.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "SC-28"
  fedramp_moderate: "SC-28"
  pci_dss_v4.0: "3.5.1"
  soc2: "CC6.1"
  hipaa: "164.312(a)(2)(iv)"
  ccm_v4: ["CEK-03", "DSP-17"]
scope_tags:
  - aws
  - ecs
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - encryption-at-rest
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_ecs_service
params:
  attack_stage: credential_access
remediation:
  description: >
    Container references one or more SSM parameters stored as
    String. Sensitive values are unencrypted at rest.
  action: >
    Re-create the parameter as SecureString with a
    customer-managed KMS key (preferred) or the AWS-managed
    alias/aws/ssm key. Update the execution role's policy to
    add kms:Decrypt against the parameter's KMS key.
    Verify the task launches and retrieves the value
    correctly. Then delete the original String parameter and
    update the valueFrom reference if the name changed.
  example: |
    {
      "container": {
        "kind": "task_definition",
        "ssm_parameters": {
          "has_insecure_string_type": false,
          "insecure_param_names": []
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.container.kind
      op: eq
      value: task_definition
    - field: properties.container.ssm_parameters.has_insecure_string_type
      op: eq
      value: true
