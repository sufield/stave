dsl_version: ctrl.v1
id: CTL.ECS.LOG.001
name: ECS Task Definitions Must Have CloudWatch Logging Configured
description: >
  ECS essential containers must have a log driver configured. Without logging, container stdout and stderr are discarded — invocations, errors, and execution output leave no audit trail. A compromised container generating no logs is forensically invisible.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "AU-2"
  fedramp_moderate: "AU-2"
  hipaa: "164.312(b)"
  pci_dss_v4.0: "10.2.1"
  soc2: "CC7.1"
  ccm_v4: ["IVS-06", "LOG-12"]
scope_tags:
  - aws
  - ecs
taxonomy:
  - compliance-mapping
  - logging
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_ecs_service
params:
  attack_stage: detection_evasion
remediation:
  description: >
    ECS essential container has no log driver configured.
  action: >
    Configure the awslogs log driver for all essential containers in the task definition.
unsafe_predicate:
  all:
    - field: properties.container.kind
      op: eq
      value: task_definition
    - field: properties.container.logging.driver_configured
      op: eq
      value: false
