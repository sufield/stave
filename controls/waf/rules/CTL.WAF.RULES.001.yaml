dsl_version: ctrl.v1
id: CTL.WAF.RULES.001
name: WAF Must Have Managed Rule Groups Enabled
description: >
  WAF web ACLs must include AWS managed rule groups for common attack
  patterns (SQLi, XSS, known bad inputs). Without managed rules, the
  WAF provides no baseline protection against OWASP Top 10 attacks.
  This control is the **presence** check in the seven-control WAF
  safety envelope: presence (CTL.WAF.RULES.001), enforcement
  (CTL.WAF.RULES.BLOCKMODE.001), coverage (CTL.WAF.RULES.OWASP.001),
  visibility (CTL.WAF.LOGGING.001), architectural prerequisite
  (CTL.WAF.ORIGIN.LOCKDOWN.001), parser overflow protection
  (CTL.WAF.PARSERLIMIT.PROTECT.001), and evasion observability
  (CTL.WAF.EVASION.OBSERVE.001). All seven may fire on the same Web
  ACL simultaneously; each addresses a distinct failure mode.
domain: exposure
severity: high
compliance:
  soc2: "CC6.6"
  pci_dss_v4.0: "6.4.1"
  nist_800_53_r5: "SI-3"
  fedramp_moderate: "SI-3"
  ccm_v4: ["IVS-09", "LOG-12"]
scope_tags:
  - aws
  - waf
taxonomy:
  - compliance-mapping
  - logging
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: >
    WAF web ACL does not include managed rule groups. No baseline
    protection against common web attacks.
  action: >
    Add AWS managed rule groups to the web ACL:
    AWSManagedRulesCommonRuleSet, AWSManagedRulesSQLiRuleSet,
    AWSManagedRulesKnownBadInputsRuleSet.
  example: |
    {
      "waf": {
        "kind": "web_acl",
        "rules": {
          "has_managed_rules": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.waf.kind
      op: eq
      value: web_acl
    - field: properties.waf.rules.has_managed_rules
      op: eq
      value: false
