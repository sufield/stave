dsl_version: ctrl.v1
id: CTL.DYNAMODB.POLICY.PUBLIC.001
name: DynamoDB Table Resource Policy Must Not Allow Public Access
description: >
  DynamoDB table resource policies (added November 2023) must not
  grant access to Principal "*" or unauthenticated principals
  without restricting via aws:SourceArn, aws:SourceAccount, or
  aws:PrincipalOrgID conditions. Resource policies on DynamoDB
  tables enable cross-account access without IAM role assumption —
  the same confused-deputy surface that exists on S3 buckets, SNS
  topics, SQS queues, and Lambda functions. CloudFox enumerates
  DynamoDB tables and checks resource policies for public access.
  A table with a public resource policy exposes all items to any
  AWS principal, bypassing the table owner's IAM policies entirely.
  This is the same risk pattern as CTL.SNS.POLICY.PUBLIC.001 and
  CTL.SQS.POLICY.PUBLIC.001 applied to the DynamoDB confused-deputy
  surface.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["DSP-17", "IVS-03"]
scope_tags:
  - aws
  - dynamodb
taxonomy:
  - confused-deputy
  - identity-perimeter
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_dynamodb_table
params:
  attack_stage: initial_access
remediation:
  description: >
    DynamoDB table resource policy grants public or broadly scoped
    access. Any AWS principal can read or write table items without
    assuming a role in the table owner's account.
  action: >
    Restrict the resource policy to specific account IDs or add an
    aws:PrincipalOrgID condition. For cross-account access, use
    explicit account ARNs and require aws:SourceVpce or
    aws:SourceVpc conditions. If cross-account access is not
    needed, remove the resource policy entirely — DynamoDB tables
    do not have resource policies by default.
  example: |
    {
      "database": {
        "kind": "table",
        "dynamodb": {
          "resource_policy_public": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.database.kind
      op: eq
      value: table
    - field: properties.database.dynamodb.resource_policy_public
      op: eq
      value: true
tests:
  - name: "DynamoDB table with public resource policy fails"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:dynamodb:us-east-1:111122223333:table/UserData"
      asset_type: aws_dynamodb_table
      vendor: aws
      properties:
        database:
          kind: table
          dynamodb:
            resource_policy_public: true
  - name: "DynamoDB table with restricted resource policy passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:dynamodb:us-east-1:444455556666:table/Orders"
      asset_type: aws_dynamodb_table
      vendor: aws
      properties:
        database:
          kind: table
          dynamodb:
            resource_policy_public: false
