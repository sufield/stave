dsl_version: ctrl.v1
id: CTL.S3EXPRESS.POLICY.PUBLIC.001
name: Directory Bucket Policy Must Not Permit Public Access
description: >
  S3 Express Directory Bucket policies must not grant access to
  anonymous or wildcard principals. Directory Buckets use the
  s3express: IAM namespace, which is separate from s3:. Organization-level
  S3 Block Public Access and RCPs scoped to s3:* do not cover
  s3express: actions. A public policy on a Directory Bucket is
  invisible to s3:-scoped defenses.
domain: exposure
severity: critical
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  ccm_v4: ["DSP-17", "IVS-03"]
scope_tags:
  - aws
  - s3express
taxonomy:
  - identity-perimeter
  - trust-boundary
  - data-perimeter
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_s3express_directory_bucket
params:
  attack_stage: exfiltration
observation_fields:
  - storage.kind
  - storage.access.has_wildcard_principal
remediation:
  description: >
    Directory Bucket policy grants access to anonymous or wildcard
    principals. S3 Block Public Access may not cover the s3express:
    namespace.
  action: >
    Remove wildcard Principal statements from the Directory Bucket
    policy. Add aws:PrincipalOrgID condition to restrict access to
    your AWS Organization. Verify that any SCP or RCP covering
    s3express: actions is in place — s3:* SCPs do not apply.
  example: |
    {
      "storage": {
        "kind": "directory_bucket",
        "access": {
          "has_wildcard_principal": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: directory_bucket
    - field: properties.storage.access.has_wildcard_principal
      op: eq
      value: true
tests:
  - name: directory bucket with wildcard principal fires
    verdict: VIOLATION
    asset:
      asset_id: arn:aws:s3express:us-east-1:123456789012:bucket/prod-cache--use1-az4--x-s3
      asset_type: aws_s3express_directory_bucket
      vendor: aws
      properties:
        storage:
          kind: directory_bucket
          access:
            has_wildcard_principal: true
  - name: directory bucket with restricted policy passes
    verdict: PASS
    asset:
      asset_id: arn:aws:s3express:us-east-1:123456789012:bucket/prod-cache--use1-az4--x-s3
      asset_type: aws_s3express_directory_bucket
      vendor: aws
      properties:
        storage:
          kind: directory_bucket
          access:
            has_wildcard_principal: false
