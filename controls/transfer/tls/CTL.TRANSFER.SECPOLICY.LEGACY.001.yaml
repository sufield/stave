dsl_version: ctrl.v1
id: CTL.TRANSFER.SECPOLICY.LEGACY.001
name: Transfer Family Server Must Not Use Legacy Security Policy
description: >
  AWS Transfer Family servers must use a current security policy,
  not a legacy policy such as TransferSecurityPolicy-2018-11. Legacy
  policies include weak cipher suites (CBC-mode ciphers, SHA1-based
  MACs) and may permit TLS 1.0 negotiation. AWS publishes updated
  security policies that remove deprecated ciphers; servers pinned
  to old policies expose file transfer sessions to downgrade risks.
  SFTP, FTPS, and FTP-over-TLS sessions carry credentials and file
  contents — weak cipher negotiation on the transfer endpoint is a
  direct data exposure vector. The same pattern as
  CTL.APIGATEWAY.DOMAIN.TLS.POLICY.STALE.001 and
  CTL.ELB.TLS.CUSTOM.WEAKCIPHER.001.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SC-8, SC-13"
  soc2: "CC6.1, CC6.7"
  pci_dss_v4.0: "4.2"
  ccm_v4: ["CEK-03", "DSP-10"]
scope_tags:
  - aws
  - transfer
taxonomy:
  - encryption-in-transit
  - trust-decay
  - deprecation
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_transfer_server]
params:
  attack_stage: credential_access
remediation:
  description: >
    Transfer Family server uses a legacy security policy with weak
    cipher suites.
  action: >
    Update the server security policy to the current AWS
    recommendation: aws transfer update-server --server-id <id>
    --security-policy-name TransferSecurityPolicy-2024-01. Verify
    that all SFTP/FTPS clients can negotiate with the modern cipher
    list before switching production servers. Older clients may
    require TLS-stack upgrades.
  example: |
    {
      "transfer": {
        "kind": "transfer_server",
        "tls": {
          "security_policy_is_current": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.transfer.kind
      op: eq
      value: transfer_server
    - field: properties.transfer.tls.security_policy_is_current
      op: eq
      value: false
