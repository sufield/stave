dsl_version: ctrl.v1
id: CTL.AZURE.DEFENDER.KEYVAULT.001
name: Defender for Key Vault Not Enabled
description: >
  Defender for Key Vault not enabled. No detection of anomalous
  key access patterns, unusual secret retrieval, or suspicious
  management operations.
domain: exposure
severity: high
compliance:
  cis_azure_v2: "2.1.6"
  nist_800_53_r5: "SI-4"
  soc2: "CC7.1"
scope_tags: [azure]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Defender for Key Vault Not Enabled — finding detected.
  action: Enable Defender for Key Vault at Standard tier.
  example: |
    {"azure": {"monitoring": {"kind": "defender_setting", "defender": {"plan": "KeyVaults", "pricing_tier": "Standard"}}}}
unsafe_predicate:
  all:
    - field: properties.azure.monitoring.kind
      op: eq
      value: defender_setting
    - field: properties.azure.monitoring.defender.plan
      op: eq
      value: KeyVaults
    - any:
        - field: properties.azure.monitoring.defender.enabled
          op: eq
          value: false
        - field: properties.azure.monitoring.defender.pricing_tier
          op: eq
          value: Free
