dsl_version: ctrl.v1
id: CTL.AZURE.FUNCTION.RUNTIME.001
name: Azure Function App Must Not Run Deprecated Runtime
description: >
  Azure Function apps must run a supported runtime version. Deprecated
  runtimes receive no security patches.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SI-2"
  soc2: "CC7.1"
  ccm_v4: ["TVM-02"]
scope_tags: [azure]
taxonomy:
  - compliance-mapping
  - compute-hardening
  - deprecation
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Function app runs a deprecated runtime version.
  action: Upgrade to a supported runtime version.
  example: |
    {"azure": {"compute": {"kind": "function_app", "function": {"runtime_deprecated": false}}}}
unsafe_predicate:
  all:
    - field: properties.azure.compute.kind
      op: eq
      value: function_app
    - field: properties.azure.compute.function.runtime_deprecated
      op: eq
      value: true
