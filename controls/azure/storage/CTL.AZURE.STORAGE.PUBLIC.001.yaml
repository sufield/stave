dsl_version: ctrl.v1
id: CTL.AZURE.STORAGE.PUBLIC.001
name: Azure Storage Account Must Not Allow Public Blob Access
description: >
  Azure Storage accounts must have AllowBlobPublicAccess disabled.
  When enabled, individual containers can be set to public access,
  exposing blobs to unauthenticated internet access.
domain: exposure
severity: critical
compliance:
  nist_800_53_r5: "AC-3"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  ccm_v4: ["DSP-17", "IVS-03"]
scope_tags:
  - azure
taxonomy:
  - compliance-mapping
  - network-perimeter
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Azure Storage account allows public blob access.
  action: Set AllowBlobPublicAccess to false on the storage account.
  example: |
    {"azure": {"storage": {"kind": "azure_blob_storage", "allow_blob_public_access": false}}}
unsafe_predicate:
  all:
    - field: properties.azure.storage.kind
      op: eq
      value: azure_blob_storage
    - field: properties.azure.storage.allow_blob_public_access
      op: eq
      value: true
