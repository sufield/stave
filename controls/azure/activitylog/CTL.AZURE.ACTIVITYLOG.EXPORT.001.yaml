dsl_version: ctrl.v1
id: CTL.AZURE.ACTIVITYLOG.EXPORT.001
name: Activity Log Not Exported to Storage or Log Analytics
description: >
  Activity Log data retained only in portal (90-day default).
  Without export, historical audit data is permanently lost.
domain: exposure
severity: high
compliance:
  cis_azure_v2: "5.1.2"
  nist_800_53_r5: "AU-6"
  hipaa: "164.312(b)"
  pci_dss_v4: "10.2"
  soc2: "CC7.2"
scope_tags: [azure]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Activity Log Not Exported to Storage or Log Analytics — finding detected.
  action: Remediate per control description.
  example: |
    {"azure": {"monitoring": {"kind": "activity_log", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.azure.monitoring.kind
      op: eq
      value: activity_log
    - field: properties.azure.monitoring.activitylog.exported
      op: eq
      value: false
