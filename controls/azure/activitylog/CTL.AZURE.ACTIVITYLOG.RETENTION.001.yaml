dsl_version: ctrl.v1
id: CTL.AZURE.ACTIVITYLOG.RETENTION.001
name: Activity Log Retention Below 365 Days
description: >
  Activity Log exported but retention under 365 days.
  Compliance frameworks require one-year minimum audit log retention.
domain: exposure
severity: medium
compliance:
  cis_azure_v2: "5.1.3"
  nist_800_53_r5: "AU-12"
  hipaa: "164.312(b)"
  pci_dss_v4: "10.7"
  soc2: "CC7.2"
scope_tags: [azure]
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Activity Log Retention Below 365 Days — finding detected.
  action: Remediate per control description.
  example: |
    {"azure": {"monitoring": {"kind": "activity_log", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.azure.monitoring.kind
      op: eq
      value: activity_log
    - field: properties.azure.monitoring.activitylog.exported
      op: eq
      value: true
    - field: properties.azure.monitoring.activitylog.retention_sufficient
      op: eq
      value: false
