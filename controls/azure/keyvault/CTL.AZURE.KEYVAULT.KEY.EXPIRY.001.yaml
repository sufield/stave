dsl_version: ctrl.v1
id: CTL.AZURE.KEYVAULT.KEY.EXPIRY.001
name: Key Vault Keys Without Expiration Date
description: >
  Keys without expiration dates persist indefinitely. No forced
  rotation — a compromised key remains valid forever.
domain: encryption
severity: high
compliance:
  owasp_nhi: "NHI7"
  cis_azure_v2: "8.1"
  nist_800_53_r5: "SC-12"
  soc2: "CC6.1"
scope_tags: [azure]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: persistence
remediation:
  description: Key Vault Keys Without Expiration Date — finding detected.
  action: Set expiration dates on all keys.
  example: |
    {"azure": {"security": {"kind": "keyvault", "keyvault": {"key_expiry_set": true}}}}
unsafe_predicate:
  all:
    - field: properties.azure.security.kind
      op: eq
      value: keyvault
    - field: properties.azure.security.keyvault.key_expiry_set
      op: eq
      value: false
