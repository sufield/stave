dsl_version: ctrl.v1
id: CTL.ECR.POLICY.BROAD.001
name: ECR Repository Policy Must Not Grant Broad Cross-Account Access
description: >
  ECR repository policies must not grant ecr:GetDownloadUrlForLayer,
  ecr:BatchGetImage, or ecr:PutImage to external accounts without
  restricting to specific account IDs or aws:PrincipalOrgID. Broad
  cross-account access allows image theft (pull) or supply chain
  compromise (push) from any granted account.
domain: exposure
severity: high
compliance:
  soc2: "CC6.1"
  nist_800_53_r5: "AC-3"
  pci_dss_v4.0: "7.2.1"
  ccm_v4: ["DSP-17", "IVS-03"]
scope_tags:
  - aws
  - ecr
taxonomy:
  - identity-perimeter
  - least-privilege
  - trust-boundary
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_ecr_repository
params:
  attack_stage: initial_access
remediation:
  description: >
    ECR repository policy grants broad cross-account image access.
  action: >
    Restrict the repository policy to specific account IDs or add
    an aws:PrincipalOrgID condition. For push access, restrict to
    CI/CD pipeline roles only.
  example: |
    {
      "container_registry": {
        "kind": "repository",
        "policy": { "has_broad_cross_account": false }
      }
    }
unsafe_predicate:
  all:
    - field: properties.container_registry.kind
      op: eq
      value: repository
    - field: properties.container_registry.policy.has_broad_cross_account
      op: eq
      value: true
