dsl_version: ctrl.v1
id: CTL.BEDROCK.AGENT.OVERPERM.MODEL.001
name: Bedrock Agent Execution Role Must Scope bedrock:InvokeModel
description: >
  Bedrock agent execution role grants bedrock:InvokeModel on
  Resource: * — the agent can invoke any foundation model in the
  account, ignoring whatever model the agent's foundation_model
  field declares. An attacker who controls the agent's prompt or
  tool input can pivot the agent to invoke unintended models
  (cheaper, less restricted, or with different content policies)
  and bypass model-allowlist governance. Scope the
  bedrock:InvokeModel permission to the specific model ARN(s)
  the agent is configured to use.
domain: identity
severity: high
compliance:
  owasp_nhi: "NHI5"
  nist_800_53_r5: "AC-6"
  soc2: "CC6.1"
  hipaa: "164.312(a)(1)"
  ccm_v4: ["IAM-04", "IAM-05"]
scope_tags:
  - aws
  - bedrock
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_bedrock_agent
params:
  attack_stage: privilege_escalation
remediation:
  description: >
    Bedrock agent execution role grants bedrock:InvokeModel on
    Resource: *. The role can invoke any model in the account,
    not only the model the agent's configuration declares.
  action: >
    Scope the role's bedrock:InvokeModel permission to the
    specific foundation model ARN(s) the agent uses.
    Replace Resource: "*" with explicit model ARNs such as
    arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-sonnet-20240229-v1:0.
  example: |
    {
      "ai": {
        "kind": "bedrock_agent",
        "agent": { "model_invoke_scope_broad": false }
      }
    }
unsafe_predicate:
  all:
    - field: properties.ai.kind
      op: eq
      value: bedrock_agent
    - field: properties.ai.agent.model_invoke_scope_broad
      op: eq
      value: true
