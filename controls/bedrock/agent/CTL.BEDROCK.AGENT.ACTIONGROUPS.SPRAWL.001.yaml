dsl_version: ctrl.v1
id: CTL.BEDROCK.AGENT.ACTIONGROUPS.SPRAWL.001
name: Bedrock Agent Action-Group Count Must Be Bounded
description: >
  Bedrock agent has more than 10 action groups attached. Each
  action group is a Lambda function or API schema the agent can
  invoke; sprawled action-group lists expand the agent's blast
  radius beyond its stated purpose, often because teams stack
  ad-hoc tool integrations onto a single agent rather than
  splitting capability into purpose-built agents. Same shape
  as CTL.SQS.POLICY.SPRAWL and CTL.SECRETS.POLICY.SPRAWL —
  accumulated permission attachments that hide effective
  reachability. An attacker who controls the prompt enumerates
  the larger surface; legitimate operators no longer reason
  about what the agent can do.
domain: governance
severity: medium
compliance:
  owasp_nhi: "NHI5"
  nist_800_53_r5: "AC-6, CM-2"
  soc2: "CC6.1, CC8.1"
  ccm_v4: ["IAM-04", "IAM-09"]
scope_tags:
  - aws
  - bedrock
type: unsafe_state
classification: state_assertion
params:
  attack_stage: privilege_escalation
remediation:
  description: >
    Bedrock agent has accumulated more action groups than the
    recommended threshold; the agent's reachable Lambda /
    API surface is no longer auditable at a glance.
  action: >
    Split the agent into purpose-built agents (one per
    customer workflow) so each agent's action-group list
    stays small and reviewable. Remove inactive or
    deprecated action groups via DeleteAgentActionGroup.
  example: |
    {
      "ai": {
        "kind": "bedrock_agent",
        "agent": { "action_group_count": 4 }
      }
    }
unsafe_predicate:
  all:
    - field: properties.ai.kind
      op: eq
      value: bedrock_agent
    - field: properties.ai.agent.action_group_count
      op: gt
      value: 10
