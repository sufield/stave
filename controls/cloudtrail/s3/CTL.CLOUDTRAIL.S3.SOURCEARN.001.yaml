dsl_version: ctrl.v1
id: CTL.CLOUDTRAIL.S3.SOURCEARN.001
name: CloudTrail Trail S3 Bucket Policy Does Not Validate SourceArn
description: >
  CloudTrail trail S3 bucket policy allows s3:PutObject
  from the cloudtrail.amazonaws.com service principal
  without restricting aws:SourceArn to the specific
  trail(s) that should deliver to this bucket. Without
  SourceArn validation, any CloudTrail trail in any AWS
  account can write to this bucket — including an
  attacker's trail writing fake log entries.
domain: exposure
severity: medium
compliance:
  soc2: "CC6.1, CC6.6, CC7.1"
  nist_800_53_r5: "AC-3, AU-9, AU-10"
  pci_dss_v4.0: "10.5, 7.1"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.5.15, A.8.15"
  ccm_v4: ["IAM-16", "LOG-08"]
scope_tags:
  - aws
  - cloudtrail
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_cloudtrail_trail
params:
  attack_stage: detection_evasion
remediation:
  description: >
    Trail S3 bucket policy authorizes the CloudTrail
    service principal without aws:SourceArn restriction.
    Any trail in any account can write to it.
  action: >
    Update the bucket policy's CloudTrail PutObject
    statement to require aws:SourceArn matching the
    organization's trail ARN(s). For an org trail use the
    multi-region trail ARN; for member-account trails list
    each. The condition shape:
    "Condition":{"StringEquals":{"aws:SourceArn":[
      "arn:aws:cloudtrail:us-east-1:111122223333:trail/org-trail"]}}.
    Verify by attempting to write from a test trail in a
    different account — the write must fail with
    AccessDenied citing the SourceArn condition.
  example: |
    {
      "audit": {
        "kind": "trail",
        "cloudtrail": {
          "s3_policy_has_source_arn": true,
          "s3_policy_source_arns": ["arn:aws:cloudtrail:us-east-1:111122223333:trail/org-trail"]
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.audit.kind
      op: eq
      value: trail
    - field: properties.audit.cloudtrail.s3_policy_has_source_arn
      op: eq
      value: false
defect: >
  CloudTrail trail S3 bucket allows CloudTrail PutObject
  without aws:SourceArn condition.
infection: >
  The bucket policy grants s3:PutObject to the
  cloudtrail.amazonaws.com service principal — allowing
  CloudTrail to write log files. Without aws:SourceArn
  condition: any trail in any AWS account can write to
  this bucket. An attacker creates their own trail in
  their own account, points it at this bucket, and
  generates API calls. The attacker's log entries appear
  alongside legitimate entries — fake events mixed with
  real events. An investigator reading the logs sees
  events that never happened in the organization's
  accounts. SourceArn restricts PutObject to specific
  trail ARN(s) — only the organization's trails can write.
failure: >
  Log injection possible. Any CloudTrail trail in any
  account can write entries to the audit log bucket.
tests:
  - name: trail bucket without SourceArn condition fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cloudtrail:us-east-1:111122223333:trail/org-trail"
      asset_type: aws_cloudtrail_trail
      vendor: aws
      properties:
        audit:
          kind: trail
          cloudtrail:
            s3_bucket_name: "org-cloudtrail-logs"
            s3_policy_has_source_arn: false
  - name: trail bucket with SourceArn condition passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:cloudtrail:us-east-1:111122223333:trail/org-trail"
      asset_type: aws_cloudtrail_trail
      vendor: aws
      properties:
        audit:
          kind: trail
          cloudtrail:
            s3_bucket_name: "org-cloudtrail-logs"
            s3_policy_has_source_arn: true
            s3_policy_source_arns:
              - "arn:aws:cloudtrail:us-east-1:111122223333:trail/org-trail"
