dsl_version: ctrl.v1
id: CTL.CLOUDTRAIL.VALIDATION.001
name: CloudTrail Log File Validation Must Be Enabled
description: >
  CloudTrail must have log file integrity validation enabled. Without
  validation, an attacker who gains access to the log bucket can modify
  or delete log entries to cover their tracks.
domain: exposure
severity: high
compliance:
  hipaa: "164.312(b)"
  cis_aws_v1.4.0: "3.2"
  cis_aws_v3.0: "3.2"
  soc2: "CC7.1"
  pci_dss_v4.0: "10.2.1"
  nist_800_53_r5: "AU-9"
  fedramp_moderate: "AU-9"
  gdpr: "Art.32"
  ffiec: "ISH-4"
  iso_27001_2022: "A.8.15"
scope_tags:
  - aws
  - cloudtrail
type: unsafe_state
params:
  attack_stage: detection_evasion
remediation:
  description: >
    CloudTrail log file validation is disabled. Log integrity cannot
    be verified.
  action: >
    Enable log file validation on the trail. Run:
    aws cloudtrail update-trail --name xxx --enable-log-file-validation
  example: |
    {
      "audit_trail": {
        "kind": "trail",
        "log_file_validation_enabled": true
      }
    }
unsafe_predicate:
  all:
    - field: properties.audit_trail.kind
      op: eq
      value: trail
    - field: properties.audit_trail.log_file_validation_enabled
      op: eq
      value: false
