dsl_version: ctrl.v1
id: CTL.CLOUDTRAIL.EVS.BLIND.001
name: CloudTrail Does Not Log EVS Management Events
description: >
  CloudTrail is not configured to log EVS management events. If EVS
  management events are not logged, an attacker can create VMware SDDC
  environments, provision clusters, and operate an entire VMware
  management plane without leaving an audit trail. EVS is not
  inventoried by AWS Config — CloudTrail is the only detection surface
  for EVS API activity.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "AU-2"
  soc2: "CC7.1"
  ccm_v4: ["LOG-01"]
scope_tags:
  - aws
  - cloudtrail
taxonomy:
  - logging
  - detection-evasion
  - resource-sprawl
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_cloudtrail_trail
params:
  attack_stage: detection_evasion
observation_fields:
  - audit_trail.kind
  - audit_trail.evs_events.logged
remediation:
  description: >
    CloudTrail trail does not log EVS management events.
  action: >
    Ensure event selectors include EVS management events.
    With advanced selectors, add eventSource = evs.amazonaws.com.
  example: |
    {
      "audit_trail": {
        "kind": "trail",
        "evs_events": {
          "logged": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.audit_trail.kind
      op: eq
      value: trail
    - field: properties.audit_trail.evs_events.logged
      op: ne
      value: true
tests:
  - name: "trail not logging EVS events fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cloudtrail:us-east-1:111122223333:trail/main-trail"
      asset_type: aws_cloudtrail_trail
      vendor: aws
      properties:
        audit_trail:
          kind: trail
          evs_events:
            logged: false
  - name: "trail logging EVS events passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:cloudtrail:us-east-1:444455556666:trail/full-trail"
      asset_type: aws_cloudtrail_trail
      vendor: aws
      properties:
        audit_trail:
          kind: trail
          evs_events:
            logged: true
  - name: "trail missing EVS logging field fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cloudtrail:us-east-1:777788889999:trail/partial-trail"
      asset_type: aws_cloudtrail_trail
      vendor: aws
      properties:
        audit_trail:
          kind: trail
