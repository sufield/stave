dsl_version: ctrl.v1
id: CTL.CLOUDTRAIL.DATA.DYNAMODB.001
name: CloudTrail Must Log DynamoDB Data Events
description: >
  CloudTrail trails must include DynamoDB data events to log
  table-level operations (GetItem, PutItem, Query, Scan). Without
  this, data exfiltration from DynamoDB is invisible.
domain: audit
severity: low
compliance:
  nist_800_53_r5: "AU-12"
  soc2: "CC7.1"
  ccm_v4: ["LOG-03", "LOG-05"]
scope_tags:
  - aws
  - cloudtrail
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
remediation:
  description: Trail does not log DynamoDB data events.
  action: >
    Add DynamoDB data event selector to the trail: event category
    Data, resource type AWS::DynamoDB::Table, read/write type All.
unsafe_predicate:
  all:
    - field: properties.audit_trail.kind
      op: eq
      value: trail
    - field: properties.audit_trail.data_events.dynamodb.enabled
      op: eq
      value: false
