dsl_version: ctrl.v1
id: CTL.IAM.ZT.SHORTLIVED.001
name: Service Access Must Use Short-Lived Credentials
description: >
  Service-to-service access must use short-lived credentials (STS
  temporary tokens, IAM Roles Anywhere certificates, OIDC federation)
  rather than long-lived access keys. Short-lived credentials limit
  the blast radius of compromise — a stolen token expires
  automatically. This is a core Zero Trust principle: never trust
  a credential longer than necessary.
domain: identity
severity: medium
compliance:
  owasp_nhi: "NHI5"
  nist_800_53_r5: "IA-5"
  fedramp_moderate: "IA-5"
  nist_csf_2.0: "PR.AA"
  ccm_v4: ["IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
taxonomy:
  - compliance-mapping
  - credential-lifecycle
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
remediation:
  description: >
    Service uses long-lived access keys instead of short-lived
    credentials. A stolen key provides indefinite access.
  action: >
    Replace long-lived access keys with IAM roles (for EC2, ECS,
    Lambda), IAM Roles Anywhere (for on-premises), or OIDC
    federation (for CI/CD). Use STS AssumeRole with session
    duration limits.
  example: |
    {
      "identity": {
        "kind": "service_identity",
        "credentials": {
          "uses_short_lived": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: service_identity
    - field: properties.identity.credentials.uses_short_lived
      op: ne
      value: true
alternatives:
  - tool: prowler
    check_id: iam_user_with_temporary_credentials
    coverage: covered
    note: Stave's short-lived credentials posture; Prowler's IAM/STS exception is acceptable-use nuance.
