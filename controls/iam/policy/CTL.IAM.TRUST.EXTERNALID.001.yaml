dsl_version: ctrl.v1
id: CTL.IAM.TRUST.EXTERNALID.001
name: Account-Root Cross-Account Trust Must Require External ID
description: >
  IAM roles trusting an account root principal (arn:aws:iam::X:root)
  without an sts:ExternalId condition allow ANY principal in the
  trusted account to assume the role. This is the most dangerous
  cross-account trust pattern — a compromised service account, OAuth
  app, or test tenant in the trusted account can assume the role.
  The Microsoft Midnight Blizzard 2024 breach exploited a legacy
  test OAuth app to assume a role with full_access_as_app
  permissions, pivoting from a test tenant to production Exchange
  mailboxes. Account-root trust without ExternalId is critical
  because the blast radius is the entire trusted account's principal
  population.
domain: identity
severity: critical
scope: compound
corpus_reference: MITRE:T1199
compliance:
  owasp_nhi: "NHI4"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  nist_800_53_r5: "AC-3"
  fedramp_moderate: "AC-3"
  iso_27001_2022: "A.8.3"
  ccm_v4: ["IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
taxonomy:
  - compliance-mapping
  - trust-boundary
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  attack_stage: lateral_movement
remediation:
  description: >
    Cross-account IAM role trusts an account root principal without
    an external ID condition. Any principal in the trusted account
    can assume this role.
  action: >
    Add an sts:ExternalId condition to the role trust policy.
    Generate a unique external ID per trust relationship. Verify
    the assuming application passes the correct external ID.
  example: |
    {
      "identity": {
        "kind": "role",
        "role": {
          "cross_account_trust_without_external_id": false,
          "principal_is_account_root": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.role.cross_account_trust_without_external_id
      op: present
    - field: properties.identity.role.cross_account_trust_without_external_id
      op: eq
      value: true
    - field: properties.identity.role.principal_is_account_root
      op: present
    - field: properties.identity.role.principal_is_account_root
      op: eq
      value: true
