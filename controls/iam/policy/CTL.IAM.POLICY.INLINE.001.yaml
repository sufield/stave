dsl_version: ctrl.v1
id: CTL.IAM.POLICY.INLINE.001
name: No Inline Policies on IAM Users
description: >
  IAM users must not have inline policies attached directly.
  Inline policies are harder to audit, cannot be reused, and
  create per-user policy sprawl that resists central governance.
domain: identity
severity: medium
compliance:
  owasp_nhi: "NHI5"
  cis_aws_v1.4.0: "1.15"
  cis_aws_v3.0: "1.15"
  hipaa: "164.312(a)(1)"
  soc2: "CC6.3"
  pci_dss_v4.0: "7.2.2"
  nist_800_53_r5: "AC-6"
  fedramp_moderate: "AC-6"
  gdpr: "Art.32"
  ffiec: "CAT-D3"
  iso_27001_2022: "A.8.2"
  nist_csf_2.0: "PR.AA"
  ccm_v4: ["IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
taxonomy:
  - compliance-mapping
  - least-privilege
  - resource-sprawl
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_user
params:
  attack_stage: privilege_escalation
remediation:
  description: >
    IAM user has inline policies attached. Inline policies bypass
    centralized policy management and are invisible to IAM Access Analyzer.
  action: >
    Convert inline policies to managed policies and attach via groups
    or roles. Delete the inline policies from the user.
  example: |
    {
      "identity": {
        "kind": "user",
        "policies": {
          "has_inline_policies": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: user
    - field: properties.identity.policies.has_inline_policies
      op: present
    - field: properties.identity.policies.has_inline_policies
      op: eq
      value: true
alternatives:
  - tool: prowler
    check_id: iam_inline_policy_no_administrative_privileges
    coverage: covered
    note: "POLICY.ADMIN catches *:*; POLICY.INLINE enforces no-inline-on-users as structural hygiene."
  - tool: prowler
    check_id: iam_policy_attached_only_to_group_or_roles
    coverage: covered
    note: Stave splits 'no direct managed attach' from 'no inline policies' into two controls; union matches.
