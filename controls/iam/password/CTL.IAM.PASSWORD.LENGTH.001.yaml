dsl_version: ctrl.v1
id: CTL.IAM.PASSWORD.LENGTH.001
name: Password Minimum Length Must Be At Least 14
description: >
  The IAM account password policy must require a minimum password
  length of 14 characters. Shorter passwords are vulnerable to
  brute-force and dictionary attacks.
domain: identity
severity: medium
compliance:
  cis_aws_v1.4.0: "1.8"
  cis_aws_v3.0: "1.8"
  hipaa: "164.312(a)(2)(i)"
  pci_dss_v3.2.1: "8.2.3"
  soc2: "CC6.1"
  pci_dss_v4.0: "8.3.6"
  nist_800_53_r5: "IA-5(1)"
  fedramp_moderate: "IA-5(1)"
scope_tags:
  - aws
  - iam
type: unsafe_state
params: {}
remediation:
  description: >
    Password policy minimum length is below 14 characters. Short passwords
    are the weakest link in credential-based authentication.
  action: >
    Update the IAM account password policy to require at least 14 characters.
    Run: aws iam update-account-password-policy --minimum-password-length 14
  example: |
    {
      "identity": {
        "kind": "password_policy",
        "password_policy": {
          "minimum_length": 14
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: password_policy
    - field: properties.identity.password_policy.minimum_length
      op: lt
      value: 14
