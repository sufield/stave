dsl_version: ctrl.v1
id: CTL.IAM.PASSWORD.COMPLEXITY.001
name: Password Policy Must Require All Character Types
description: >
  The IAM account password policy must require uppercase, lowercase,
  numbers, and symbols. Missing any character type requirement reduces
  the keyspace and makes passwords easier to crack.
domain: identity
severity: medium
compliance:
  cis_aws_v1.4.0: "1.8"
  hipaa: "164.312(a)(2)(i)"
  pci_dss_v3.2.1: "8.2.3"
  soc2: "CC6.1"
  pci_dss_v4.0: "8.3.6"
  nist_800_53_r5: "IA-5(1)"
scope_tags:
  - aws
  - iam
type: unsafe_state
params: {}
remediation:
  description: >
    Password policy does not require all character types. At least one of
    uppercase, lowercase, numbers, or symbols is not required.
  action: >
    Update the IAM password policy to require all four character types.
  example: |
    {
      "identity": {
        "kind": "password_policy",
        "password_policy": {
          "require_uppercase": true,
          "require_lowercase": true,
          "require_numbers": true,
          "require_symbols": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: password_policy
    - any:
        - field: properties.identity.password_policy.require_uppercase
          op: eq
          value: false
        - field: properties.identity.password_policy.require_lowercase
          op: eq
          value: false
        - field: properties.identity.password_policy.require_numbers
          op: eq
          value: false
        - field: properties.identity.password_policy.require_symbols
          op: eq
          value: false
