dsl_version: ctrl.v1
id: CTL.IAM.OAUTH.NOINTROSPECTION.001
name: Account Must Have OAuth Token Introspection Capability
description: >
  No identity in this account has signin:IntrospectOAuth2Token
  permission, but at least one identity has OAuth grant permissions
  (signin:AuthorizeOAuth2Access or signin:CreateOAuth2Token). Token
  status cannot be validated during incident response — defenders
  cannot determine whether a token is active, what scopes it has, or
  when it expires.
domain: identity
severity: medium
scope: compound
compliance:
  nist_800_53_r5: "AC-2(1)"
  soc2: "CC6.1"
scope_tags:
  - aws
  - iam
  - oauth
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_account
observation_fields:
  - account.oauth.has_oauth_grants
  - account.oauth.any_introspection_capable_identity
remediation:
  description: >
    No identity in this account can introspect OAuth tokens
    (signin:IntrospectOAuth2Token), but OAuth grants are active.
    Token status cannot be validated during incident response.
  action: >
    Grant signin:IntrospectOAuth2Token permission to at least one
    security or incident response role. Consider pairing with
    signin:RevokeOAuth2Token for a complete token lifecycle
    management capability.
  example: |
    {
      "account": {
        "oauth": {
          "has_oauth_grants": true,
          "any_introspection_capable_identity": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.account.oauth.has_oauth_grants
      op: eq
      value: true
    - field: properties.account.oauth.any_introspection_capable_identity
      op: eq
      value: false
tests:
  - name: Account with OAuth grants but no introspection capability
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:organizations::123456789012:account/o-abc123/123456789012"
      asset_type: aws_account
      vendor: aws
      properties:
        account:
          oauth:
            has_oauth_grants: true
            any_introspection_capable_identity: false
  - name: Account with OAuth grants and introspection capability
    verdict: PASS
    asset:
      asset_id: "arn:aws:organizations::123456789012:account/o-abc123/123456789012"
      asset_type: aws_account
      vendor: aws
      properties:
        account:
          oauth:
            has_oauth_grants: true
            any_introspection_capable_identity: true
  - name: Account with no OAuth grants
    verdict: PASS
    asset:
      asset_id: "arn:aws:organizations::123456789012:account/o-abc123/123456789012"
      asset_type: aws_account
      vendor: aws
      properties:
        account:
          oauth:
            has_oauth_grants: false
            any_introspection_capable_identity: false
