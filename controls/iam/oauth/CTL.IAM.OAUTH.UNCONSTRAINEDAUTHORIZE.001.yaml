dsl_version: ctrl.v1
id: CTL.IAM.OAUTH.UNCONSTRAINEDAUTHORIZE.001
name: OAuth Authorize Access Must Have Redirect URI Constraint
description: >
  An IAM identity has signin:AuthorizeOAuth2Access permission without a
  signin:OAuthRedirectUri condition. Without this condition, OAuth tokens
  can be delivered to arbitrary endpoints — an attacker who compromises
  the role's credentials can redirect authorization tokens to
  infrastructure they control. The signin:OAuthRedirectUri condition
  restricts delivery to http://localhost:* for local development or to
  specific hosted provider URIs.

  Note: this evaluation does not credit SCP-based OAuth restrictions
  that use condition keys. If your organization uses SCPs with
  signin:OAuthRedirectUri conditions, this finding may not apply.
domain: identity
severity: high
scope: compound
corpus_reference: MITRE:T1550.001
compliance:
  nist_800_53_r5: "AC-6(5)"
  fedramp_moderate: "AC-6(5)"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  iso_27001_2022: "A.8.3"
  ccm_v4: ["IAM-02", "IAM-05"]
scope_tags:
  - aws
  - iam
  - oauth
taxonomy:
  - compliance-mapping
  - least-privilege
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_user
  - aws_iam_role
observation_fields:
  - identity.oauth.authorize_access.present
  - identity.oauth.redirect_uri_constrained
remediation:
  description: >
    Identity can authorize OAuth access to the AWS MCP Server
    (signin:AuthorizeOAuth2Access) without a redirect URI constraint.
    OAuth tokens can be delivered to arbitrary endpoints.
  action: >
    Add a signin:OAuthRedirectUri condition to the policy statement
    granting signin:AuthorizeOAuth2Access. For local development,
    constrain to http://localhost:* or http://127.0.0.1:*. For hosted
    MCP providers, constrain to the specific provider callback URI.
  example: |
    {
      "identity": {
        "oauth": {
          "authorize_access": { "present": true },
          "redirect_uri_constrained": true
        }
      }
    }
mitre_attack:
  - id: T1550.001
    name: "Use Alternate Authentication Material: Application Access Token"
    tactic: credential-access
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: in
      value: ["user", "role"]
    - field: properties.identity.oauth.authorize_access.present
      op: present
    - field: properties.identity.oauth.authorize_access.present
      op: eq
      value: true
    - field: properties.identity.oauth.redirect_uri_constrained
      op: ne
      value: true
tests:
  - name: Role with OAuth authorize and no redirect constraint
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::123456789012:role/mcp-agent"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          oauth:
            authorize_access:
              present: true
            redirect_uri_constrained: false
  - name: Role with OAuth authorize and redirect constraint
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::123456789012:role/mcp-agent-scoped"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          oauth:
            authorize_access:
              present: true
            redirect_uri_constrained: true
  - name: Role without OAuth authorize permission
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::123456789012:role/no-oauth"
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          oauth:
            authorize_access:
              present: false
            redirect_uri_constrained: false
