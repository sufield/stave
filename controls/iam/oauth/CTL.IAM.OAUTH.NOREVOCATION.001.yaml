dsl_version: ctrl.v1
id: CTL.IAM.OAUTH.NOREVOCATION.001
name: Account Must Have OAuth Token Revocation Capability
description: >
  No identity in this account has signin:RevokeOAuth2Token permission,
  but at least one identity has OAuth grant permissions
  (signin:AuthorizeOAuth2Access or signin:CreateOAuth2Token). If an
  OAuth token is compromised, no one can revoke it. This is analogous
  to having IAM credentials without the ability to deactivate access
  keys.

  This control evaluates at the account level — it fires on the
  account asset when the account has OAuth-capable identities but no
  revocation-capable identity.
domain: identity
severity: high
scope: compound
corpus_reference: MITRE:T1550.001
compliance:
  nist_800_53_r5: "AC-2(1)"
  fedramp_moderate: "AC-2(1)"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
scope_tags:
  - aws
  - iam
  - oauth
taxonomy:
  - compliance-mapping
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_account
observation_fields:
  - account.oauth.has_oauth_grants
  - account.oauth.any_revocation_capable_identity
remediation:
  description: >
    No identity in this account can revoke OAuth tokens
    (signin:RevokeOAuth2Token), but OAuth grants are active.
    Compromised tokens cannot be revoked.
  action: >
    Grant signin:RevokeOAuth2Token permission to at least one security
    or break-glass role. Consider granting both
    signin:RevokeOAuth2Token and signin:IntrospectOAuth2Token to an
    incident response role.
  example: |
    {
      "account": {
        "oauth": {
          "has_oauth_grants": true,
          "any_revocation_capable_identity": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.account.oauth.has_oauth_grants
      op: present
    - field: properties.account.oauth.has_oauth_grants
      op: eq
      value: true
    - field: properties.account.oauth.any_revocation_capable_identity
      op: ne
      value: true
tests:
  - name: Account with OAuth grants but no revocation capability
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:organizations::123456789012:account/o-abc123/123456789012"
      asset_type: aws_account
      vendor: aws
      properties:
        account:
          oauth:
            has_oauth_grants: true
            any_revocation_capable_identity: false
  - name: Account with OAuth grants and revocation capability
    verdict: PASS
    asset:
      asset_id: "arn:aws:organizations::123456789012:account/o-abc123/123456789012"
      asset_type: aws_account
      vendor: aws
      properties:
        account:
          oauth:
            has_oauth_grants: true
            any_revocation_capable_identity: true
  - name: Account with no OAuth grants at all
    verdict: PASS
    asset:
      asset_id: "arn:aws:organizations::123456789012:account/o-abc123/123456789012"
      asset_type: aws_account
      vendor: aws
      properties:
        account:
          oauth:
            has_oauth_grants: false
            any_revocation_capable_identity: false
