dsl_version: ctrl.v1
id: CTL.IAM.ROLE.INTENTMISMATCH.001
name: Role Permissions Must Match Declared Purpose
description: >
  The permission categories present on a role must be consistent with its
  declared role-type tag. A role tagged readonly must not have iam_write
  or compute_control permissions. A role tagged application must not have
  iam_write or network_control permissions. The extractor computes
  intent_mismatch by comparing the role's actual permission categories
  against the compatibility matrix for its declared role-type. Requires
  CTL.IAM.ROLE.INTENTTAG.001 to pass first — if role-type is absent,
  this control cannot evaluate.
domain: identity
severity: high
compliance:
  nist_800_53_r5: "AC-6"
  fedramp_moderate: "AC-6"
  pci_dss_v4.0: "7.2.1"
  soc2: "CC6.3"
scope_tags:
  - aws
  - iam
type: unsafe_state
params:
  base_impact: 8
  attack_stage: persistence
  blast_radius:
    type: prevention
    scope: account
    multiplier: 1.5
remediation:
  description: >
    This role's actual permissions do not match its declared purpose.
    Permissions from forbidden categories for its role-type were detected.
  action: >
    Review the forbidden permission categories listed in this finding.
    Either remove the permissions that contradict the declared purpose,
    or update the role-type tag to accurately reflect the role's actual
    function. If the role legitimately needs cross-category permissions,
    consider splitting it into separate roles.
  example: |
    {
      "identity": {
        "kind": "role",
        "tags": {
          "role-type": "readonly"
        },
        "intent_mismatch": false,
        "permission_categories": ["data_read", "audit_read"]
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: role
    - field: properties.identity.tags.role-type
      op: present
    - field: properties.identity.intent_mismatch
      op: eq
      value: true
tests:
  - name: "role matching intent passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::123:role/correct"
      asset_type: iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          intent_mismatch: false
          tags:
            role-type: data-reader
  - name: "role with intent mismatch fails"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::123:role/mismatched"
      asset_type: iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          intent_mismatch: true
          tags:
            role-type: read-only
