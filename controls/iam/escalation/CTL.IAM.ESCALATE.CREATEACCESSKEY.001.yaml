dsl_version: ctrl.v1
id: CTL.IAM.ESCALATE.CREATEACCESSKEY.001
name: Principal Must Not Escalate via iam:CreateAccessKey On Another User
description: >
  A principal with `iam:CreateAccessKey` whose Resource field reaches
  another IAM user — one whose attached permissions exceed the
  principal's own — can create a second access key for that user and
  authenticate as them immediately. The target user's password,
  console session, or MFA state is irrelevant; access keys are
  standalone long-lived credentials. This is Rhino Security Labs'
  credential-manipulation escalation technique and is covered by
  Prowler's iam_policy_allows_privilege_escalation and Pacu's
  iam__privesc_scan. The target user is limited to two access keys
  by AWS; when the victim already has two keys the attack requires
  an extra `DeleteAccessKey` call, which the
  `target_has_max_keys` diagnostic exposes.
domain: identity
severity: critical
scope: compound
corpus_reference: MITRE:T1098.001
compliance:
  owasp_nhi: "NHI5"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  nist_800_53_r5: "AC-6(5)"
  fedramp_moderate: "AC-6(5)"
  iso_27001_2022: "A.8.3"
  ccm_v4: ["IAM-02", "IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
taxonomy:
  - credential-lifecycle
  - key-management
  - logging
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
params:
  attack_stage: privilege_escalation
  base_impact: 10
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.5
observation_fields:
  - identity.kind
  - identity.escalation.create_access_key.present
  - identity.escalation.create_access_key.target_user_arn
  - identity.escalation.create_access_key.permission_delta
  - identity.escalation.create_access_key.resource_scope
  - identity.escalation.create_access_key.target_has_max_keys
remediation:
  description: >
    Principal has `iam:CreateAccessKey` reaching a user whose
    permissions exceed its own. A single `CreateAccessKey` call
    produces long-lived credentials the principal can use to act as
    that user without triggering a console login audit event. The
    `target_user_arn` on the finding identifies the victim; the
    `permission_delta` lists the specific actions gained.
  action: >
    Scope `iam:CreateAccessKey` to the principal's own user ARN (or
    remove it entirely from non-admin principals). If a
    break-glass key-rotation workflow is needed, gate the permission
    through an assumed admin role rather than attaching it directly.
    Organization-level SCPs denying `iam:CreateAccessKey` on
    `${aws:PrincipalArn}` inversions are an effective perimeter
    control. Monitor `CreateAccessKey` calls in CloudTrail with an
    alert on any call where the subject user is not the caller.
  example: |
    {
      "identity": {
        "kind": "user",
        "escalation": {
          "create_access_key": {
            "present": false
          }
        }
      }
    }
mitre_attack:
  - id: T1098.001
    name: "Account Manipulation: Additional Cloud Credentials"
    tactic: privilege-escalation
validated_against:
  - vendor: datadog
    lab: iam-002-to-admin
    result: detected
    verified: "2026-05-29"
  - vendor: datadog
    lab: lambda-004-to-iam-002
    result: detected
    verified: "2026-05-29"
  - vendor: bishopfox
    lab: privesc4-CreateAccessKey
    result: detected
    verified: "2026-05-30"
unsafe_predicate:
  all:
    - field: properties.identity.escalation.create_access_key.present
      op: present
    - field: properties.identity.escalation.create_access_key.present
      op: eq
      value: true
