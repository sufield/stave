dsl_version: ctrl.v1
id: CTL.IAM.ESCALATE.RESYNCMFADEVICE.001
name: Principal Must Not Escalate via iam:ResyncMFADevice On Another User
description: >
  A principal with `iam:ResyncMFADevice` whose Resource field
  reaches another IAM user — one whose attached permissions exceed
  the principal's own — can resynchronize or manipulate that user's
  MFA device. In combination with a password reset
  (`iam:UpdateLoginProfile`, covered separately) this clears the
  MFA barrier on console login; on its own it enables temporary MFA
  bypass by forcing the device into a resync window where a chosen
  code pair is accepted. This is one of Rhino Security Labs'
  credential-manipulation techniques and is covered by Prowler's
  iam_policy_allows_privilege_escalation and Pacu's
  iam__privesc_scan. The finding fires whenever the permission
  reaches a privileged user; whether the attack has already been
  chained with a password reset is a RiskEngine-level compounding
  concern, not something the single-resource control gates on.
domain: identity
severity: critical
scope: compound
corpus_reference: MITRE:T1098
compliance:
  owasp_nhi: "NHI5"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  nist_800_53_r5: "AC-6(5)"
  fedramp_moderate: "AC-6(5)"
  iso_27001_2022: "A.8.3"
  ccm_v4: ["IAM-02", "IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
taxonomy:
  - compute-hardening
  - credential-lifecycle
  - logging
type: unsafe_state
classification: state_assertion
params:
  attack_stage: privilege_escalation
  base_impact: 10
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.5
observation_fields:
  - identity.kind
  - identity.escalation.resync_mfa_device.present
  - identity.escalation.resync_mfa_device.target_user_arn
  - identity.escalation.resync_mfa_device.permission_delta
  - identity.escalation.resync_mfa_device.resource_scope
  - identity.escalation.resync_mfa_device.target_has_mfa
remediation:
  description: >
    Principal has `iam:ResyncMFADevice` reaching a user whose
    permissions exceed its own. The permission enables temporary
    MFA bypass on the target; combined with `UpdateLoginProfile` or
    `CreateAccessKey` on the same user (each covered by its own
    ESCALATE control) it yields an interactive or programmatic
    takeover path.
  action: >
    Scope `iam:ResyncMFADevice` to the principal's own user ARN (or
    remove it from non-admin principals). MFA-device management is
    an admin-role operation; direct user grants for it are rarely
    intentional. Alert on CloudTrail `ResyncMFADevice` events where
    the subject user differs from the caller.
  example: |
    {
      "identity": {
        "kind": "user",
        "escalation": {
          "resync_mfa_device": {
            "present": false
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.escalation.resync_mfa_device.present
      op: eq
      value: true
alternatives:
  - tool: prowler
    check_id: iam_inline_policy_allows_privilege_escalation
    coverage: covered
    note: One of 24 per-technique controls covering the aggregated Prowler check.
  - tool: prowler
    check_id: iam_policy_allows_privilege_escalation
    coverage: covered
    note: One of 24 per-technique controls covering the aggregated Prowler check.
