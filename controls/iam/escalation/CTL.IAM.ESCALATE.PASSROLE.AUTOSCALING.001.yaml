dsl_version: ctrl.v1
id: CTL.IAM.ESCALATE.PASSROLE.AUTOSCALING.001
name: Principal Must Not Escalate via Auto Scaling Launch Configuration with PassRole
description: >
  Principals with iam:PassRole on a role R plus
  autoscaling:CreateLaunchConfiguration and
  autoscaling:CreateAutoScalingGroup can escalate to R's permissions
  even when ec2:RunInstances is explicitly denied. The principal
  creates a launch configuration specifying R as the instance
  profile, then creates an auto scaling group with min-size 1. The
  AWSServiceRoleForAutoScaling service-linked role launches the EC2
  instance on the principal's behalf, bypassing any ec2:RunInstances
  deny. The principal gains shell access via user-data reverse shell,
  SSH key, or vulnerable AMI, then reads IMDS credentials for R.
  This technique was documented in the 2022 EC2 Auto Scaling
  privilege escalation research and is detected by PMapper.
domain: identity
severity: high
scope: compound
corpus_reference: MITRE:T1098
compliance:
  owasp_nhi: "NHI5"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  nist_800_53_r5: "AC-6(5)"
  fedramp_moderate: "AC-6(5)"
  iso_27001_2022: "A.8.3"
  ccm_v4: ["IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
  - autoscaling
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - network-perimeter
type: unsafe_state
classification: state_assertion
params:
  attack_stage: privilege_escalation
  base_impact: 9
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.0
observation_fields:
  - identity.kind
  - identity.escalation.passrole_autoscaling.present
  - identity.escalation.passrole_autoscaling.target_role
  - identity.escalation.passrole_autoscaling.permission_delta
remediation:
  description: >
    Principal has an Auto Scaling–mediated escalation path. Its
    iam:PassRole grant reaches a role whose effective permissions
    exceed the principal's own, and its autoscaling grants allow it
    to create a launch configuration and auto scaling group that
    indirectly launch an EC2 instance with that role as the instance
    profile. The instance's user-data or shell can read IMDS
    credentials for the role and perform any action the role is
    authorised for.
  action: >
    Scope iam:PassRole to a role whose effective permissions do not
    exceed the principal's, or remove
    autoscaling:CreateLaunchConfiguration and
    autoscaling:CreateAutoScalingGroup. If auto scaling capability is
    required, enforce an instance-profile allowlist via a Condition
    on iam:PassRole (Condition.StringEquals:
    iam:PassedToService == ec2.amazonaws.com together with a
    narrowly-scoped Resource ARN).
  example: |
    {
      "identity": {
        "kind": "user",
        "escalation": {
          "passrole_autoscaling": {
            "present": false
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.escalation.passrole_autoscaling.present
      op: present
    - field: properties.identity.escalation.passrole_autoscaling.present
      op: eq
      value: true
tests:
  - name: user with auto scaling passrole escalation path fires
    verdict: VIOLATION
    asset:
      asset_id: arn:aws:iam::111122223333:user/mallory
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: user
          escalation:
            passrole_autoscaling:
              present: true
              target_role: arn:aws:iam::111122223333:role/ec2-admin-instance-profile
              permission_delta:
                - iam:AttachRolePolicy
                - iam:PutUserPolicy
  - name: user without escalation path passes
    verdict: PASS
    asset:
      asset_id: arn:aws:iam::111122223333:user/bob
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: user
          escalation:
            passrole_autoscaling:
              present: false
alternatives:
  - tool: prowler
    check_id: iam_inline_policy_allows_privilege_escalation
    coverage: covered
    note: One of 25 per-technique controls covering the aggregated Prowler check.
  - tool: prowler
    check_id: iam_policy_allows_privilege_escalation
    coverage: covered
    note: One of 25 per-technique controls covering the aggregated Prowler check.
  - tool: pmapper
    check_id: autoscaling_privesc
    coverage: covered
    note: PMapper detects this path via its graph analysis.
