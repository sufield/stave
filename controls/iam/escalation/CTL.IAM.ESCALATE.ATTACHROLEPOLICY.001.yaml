dsl_version: ctrl.v1
id: CTL.IAM.ESCALATE.ATTACHROLEPOLICY.001
name: Principal Must Not Escalate via iam:AttachRolePolicy
description: >
  A principal (IAM user or role) holding `iam:AttachRolePolicy` on a
  role it can reach can attach any managed policy — including
  `arn:aws:iam::aws:policy/AdministratorAccess` — to that role and gain
  the policy's permissions with a single API call. Two shapes share one
  outcome: a ROLE whose Resource field includes its own ARN self-attaches
  admin (one step), or a USER with `iam:AttachRolePolicy` scoped to a
  role it can assume attaches admin to that role and then assumes it (the
  Rhino/Bishop Fox privesc9 technique). The escalating principal is the
  one holding the permission; the victim is the role. Distinct AWS action
  from `iam:AttachUserPolicy`, which targets users (see
  `CTL.IAM.ESCALATE.ATTACHUSERPOLICY.001`) — this control covers
  `iam:AttachRolePolicy` whether the holding principal is a user or a
  role. Rhino Security Labs' iam__privesc_scan and Prowler's
  iam_policy_allows_privilege_escalation both enumerate it.
domain: identity
severity: critical
scope: compound
corpus_reference: MITRE:T1098.003
compliance:
  owasp_nhi: "NHI5"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  nist_800_53_r5: "AC-6(5)"
  fedramp_moderate: "AC-6(5)"
  iso_27001_2022: "A.8.3"
  ccm_v4: ["IAM-02", "IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_iam_role
  - aws_iam_user
params:
  attack_stage: privilege_escalation
  base_impact: 10
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.5
observation_fields:
  - identity.kind
  - identity.escalation.attach_role_policy.present
  - identity.escalation.attach_role_policy.target_role_arn
  - identity.escalation.attach_role_policy.resource_scope
  - identity.escalation.attach_role_policy.reachable_managed_policies
remediation:
  description: >
    Principal has `iam:AttachRolePolicy` scoped to a reachable role
    (its own ARN, an assumable role's ARN, `"*"`, or a role-set that
    includes one). The principal — or any identity that has assumed it
    — can attach `AdministratorAccess` (or any other broad managed
    policy) to that role and immediately operate with those
    permissions.
  action: >
    Remove `iam:AttachRolePolicy` from the role, or scope its Resource
    to role ARNs that do not include the role itself (admin-only
    role-creation workflows, for example). Enforce at the
    organization level with an SCP that denies
    `iam:AttachRolePolicy` on `${aws:PrincipalArn}`. A permissions
    boundary on the role that prevents the attached policy from
    taking effect is an additional defensive layer.
  example: |
    {
      "identity": {
        "kind": "role",
        "escalation": {
          "attach_role_policy": {
            "present": false
          }
        }
      }
    }
mitre_attack:
  - id: T1098.003
    name: "Account Manipulation: Additional Cloud Roles"
    tactic: privilege-escalation
validated_against:
  - vendor: bishopfox
    lab: privesc9-AttachRolePolicy
    result: detected
    verified: "2026-05-30"
unsafe_predicate:
  all:
    - field: properties.identity.escalation.attach_role_policy.present
      op: eq
      value: true
tests:
  - name: role with self-attach escalation path fires
    verdict: VIOLATION
    asset:
      asset_id: arn:aws:iam::111122223333:role/self-attach
      asset_type: aws_iam_role
      vendor: aws
      properties:
        identity:
          kind: role
          escalation:
            attach_role_policy:
              present: true
              target_role_arn: arn:aws:iam::111122223333:role/self-attach
              resource_scope: "*"
              reachable_managed_policies:
                - arn:aws:iam::aws:policy/AdministratorAccess
  - name: user holding AttachRolePolicy on an assumable role fires (Bishop Fox privesc9)
    verdict: VIOLATION
    asset:
      asset_id: arn:aws:iam::111122223333:user/attacker
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: user
          escalation:
            attach_role_policy:
              present: true
              target_role_arn: arn:aws:iam::111122223333:role/assumable-admin
              resource_scope: "*"
              reachable_managed_policies:
                - arn:aws:iam::aws:policy/AdministratorAccess
  - name: user without the escalation path passes
    verdict: PASS
    asset:
      asset_id: arn:aws:iam::111122223333:user/alice
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: user
          escalation:
            attach_role_policy:
              present: false
alternatives:
  - tool: prowler
    check_id: iam_inline_policy_allows_privilege_escalation
    coverage: covered
    note: One of 24 per-technique controls covering the aggregated Prowler check.
  - tool: prowler
    check_id: iam_policy_allows_privilege_escalation
    coverage: covered
    note: One of 24 per-technique controls covering the aggregated Prowler check.
