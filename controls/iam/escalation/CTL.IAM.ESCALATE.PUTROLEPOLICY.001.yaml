dsl_version: ctrl.v1
id: CTL.IAM.ESCALATE.PUTROLEPOLICY.001
name: Role Must Not Escalate via iam:PutRolePolicy On Self
description: >
  A role with `iam:PutRolePolicy` whose Resource field includes its
  own role ARN can write an arbitrary inline policy onto itself —
  including one that grants `"Action": "*"` on `"Resource": "*"`.
  This is the role-side analogue of
  `CTL.IAM.ESCALATE.PUTUSERPOLICY.001`: distinct AWS action
  (`iam:PutRolePolicy` vs `iam:PutUserPolicy`), distinct principal
  kind (role vs user), same one-step escalation outcome. A single
  `PutRolePolicy` call produces full admin authority without touching
  any managed policy or other principal. Rhino Security Labs'
  iam__privesc_scan and Prowler's iam_policy_allows_privilege_escalation
  both enumerate this technique on roles.
domain: identity
severity: critical
compliance:
  owasp_nhi: "NHI5"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  nist_800_53_r5: "AC-6(5)"
  fedramp_moderate: "AC-6(5)"
  iso_27001_2022: "A.8.3"
  ccm_v4: ["IAM-02", "IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
type: unsafe_state
classification: state_assertion
params:
  attack_stage: privilege_escalation
  base_impact: 10
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.5
observation_fields:
  - identity.kind
  - identity.escalation.put_role_policy.present
  - identity.escalation.put_role_policy.target_role_arn
  - identity.escalation.put_role_policy.resource_scope
remediation:
  description: >
    Role has `iam:PutRolePolicy` scoped to its own role ARN. Any
    workload running under this role — or any principal that has
    assumed it — can author an inline policy granting
    `"Action": "*"` on `"Resource": "*"` and immediately operate
    with admin authority.
  action: >
    Remove `iam:PutRolePolicy` from the role, or scope its Resource
    to role ARNs that do not include the role itself. Organization
    SCPs denying `iam:PutRolePolicy` on `${aws:PrincipalArn}` close
    the path at the boundary. A permissions boundary on the role
    that forbids self-write of inline policies is an additional
    defensive layer.
  example: |
    {
      "identity": {
        "kind": "role",
        "escalation": {
          "put_role_policy": {
            "present": false
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: role
    - field: properties.identity.escalation.put_role_policy.present
      op: eq
      value: true
alternatives:
  - tool: prowler
    check_id: iam_inline_policy_allows_privilege_escalation
    coverage: covered
    note: One of 24 per-technique controls covering the aggregated Prowler check.
  - tool: prowler
    check_id: iam_policy_allows_privilege_escalation
    coverage: covered
    note: One of 24 per-technique controls covering the aggregated Prowler check.
