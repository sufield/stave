dsl_version: ctrl.v1
id: CTL.IAM.CRED.UNUSED.001
name: Disable Unused Credentials
description: >
  IAM credentials unused for 90 days or more must be disabled.
  Dormant credentials are a persistent attack surface that provides
  access without triggering normal usage patterns.
domain: identity
severity: medium
compliance:
  cis_aws_v1.4.0: "1.12"
  hipaa: "164.312(a)(2)(i)"
  soc2: "CC6.2"
scope_tags:
  - aws
  - iam
type: unsafe_state
params: {}
remediation:
  description: >
    IAM user has credentials that have not been used in over 90 days.
    Dormant credentials increase the attack surface without business justification.
  action: >
    Disable or delete unused credentials. Review the user's need for access
    and remove the IAM user if no longer required.
  example: |
    {
      "identity": {
        "kind": "user",
        "credentials": {
          "unused": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: user
    - field: properties.identity.credentials.unused
      op: eq
      value: true
