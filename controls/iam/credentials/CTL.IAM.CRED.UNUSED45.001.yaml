dsl_version: ctrl.v1
id: CTL.IAM.CRED.UNUSED45.001
name: Disable Credentials Unused for 45 Days
description: >
  IAM credentials (passwords and access keys) unused for 45 or more
  days must be disabled. CIS v3.0 requires a 45-day threshold, which
  is stricter than the 90-day HIPAA threshold.
domain: identity
severity: medium
compliance:
  cis_aws_v3.0: "1.12"
  ccm_v4: ["IAM-02", "IAM-08"]
scope_tags:
  - aws
  - iam
type: unsafe_state
classification: parameterized_check
params:
  attack_stage: credential_access
remediation:
  description: >
    Credentials have been unused for 45 or more days. Dormant
    credentials are a lateral movement vector.
  action: >
    Disable inactive access keys and console passwords:
    aws iam update-access-key --status Inactive --access-key-id AKIA...
  example: |
    {
      "identity": {
        "kind": "user",
        "credentials": {
          "unused_days": 30
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: user
    - field: properties.identity.credentials.unused_days
      op: gt
      value: 45
alternatives:
  - tool: prowler
    check_id: iam_user_accesskey_unused
    coverage: covered
    note: Stave has two thresholds; Prowler's 45-day matches UNUSED45.001 precisely.
