dsl_version: ctrl.v1
id: CTL.IAM.CRED.SINGLEKEY.001
name: Single Active Access Key per User
description: >
  Each IAM user must have at most one active access key. Multiple
  active keys increase the attack surface and complicate key rotation.
domain: identity
severity: medium
compliance:
  cis_aws_v3.0: "1.13"
  soc2: "CC6.1"
  pci_dss_v4.0: "8.3.4"
  nist_800_53_r5: "IA-5"
  fedramp_moderate: "IA-5"
  ccm_v4: ["IAM-02", "IAM-08"]
scope_tags:
  - aws
  - iam
type: unsafe_state
params:
  attack_stage: credential_access
remediation:
  description: >
    IAM user has more than one active access key.
  action: >
    Deactivate and delete the extra access key:
    aws iam update-access-key --status Inactive --access-key-id AKIA...
    aws iam delete-access-key --access-key-id AKIA...
  example: |
    {
      "identity": {
        "kind": "user",
        "access_keys": {
          "active_count": 1
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: user
    - field: properties.identity.access_keys.active_count
      op: gt
      value: 1
alternatives:
  - tool: prowler
    check_id: iam_user_two_active_access_key
    coverage: covered
    note: Both enforce at-most-one active access key per user.
