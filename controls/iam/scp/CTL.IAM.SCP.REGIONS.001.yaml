dsl_version: ctrl.v1
id: CTL.IAM.SCP.REGIONS.001
name: "SCP Does Not Restrict AWS Regions"
description: >
  SCP does not restrict which AWS regions member accounts can use.
  Resources can be created in any region including regions without
  organizational monitoring, CloudTrail, or Config. An attacker deploys
  resources in an unmonitored region to evade detection.
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "AC-6"
  soc2: "CC6.1"
  ccm_v4: ["IAM-05"]
scope_tags:
  - aws
  - iam
taxonomy:
  - account-governance
  - compliance-mapping
  - logging
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_organization
params:
  attack_stage: detection_evasion
observation_fields:
  - identity.kind
  - identity.scp.restricts_regions
remediation:
  description: >
    Organization SCPs do not restrict AWS regions for member accounts.
  action: >
    Add an SCP with an aws:RequestedRegion condition that denies all
    actions in non-approved regions. Allow only the regions where
    organizational monitoring is deployed.
  example: |
    {
      "identity": {
        "kind": "organization",
        "scp": {
          "restricts_regions": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: organization
    - field: properties.identity.scp.restricts_regions
      op: eq
      value: false
tests:
  - name: "organization without region restriction fails"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:organizations::111122223333:organization/o-abc123"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            restricts_regions: false
  - name: "organization with region restriction passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:organizations::444455556666:organization/o-def456"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            restricts_regions: true
