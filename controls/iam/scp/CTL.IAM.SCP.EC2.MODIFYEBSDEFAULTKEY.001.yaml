dsl_version: ctrl.v1
id: CTL.IAM.SCP.EC2.MODIFYEBSDEFAULTKEY.001
name: "SCP Does Not Deny ec2:ModifyEbsDefaultKmsKeyId"
description: >
  No SCP in the hierarchy denies ec2:ModifyEbsDefaultKmsKeyId.
  This is the weaponization step in the BYOKM ransomware kill
  chain — the attacker changes the default EBS encryption key
  to their BYOKM key so all new volumes and snapshots in that
  region are encrypted under attacker-controlled material.
  Changing the default EBS encryption key is rarely needed after
  initial account setup. Denying it by SCP prevents an attacker
  from redirecting encryption to an attacker-controlled key
  without affecting normal EBS operations (which use whatever
  key is already set as default).
domain: identity
severity: high
compliance:
  nist_800_53_r5: "SC-12"
  soc2: "CC6.1"
  ccm_v4: ["CEK-03", "IAM-05"]
scope_tags:
  - aws
  - iam
  - ec2
taxonomy:
  - account-governance
  - compliance-mapping
  - key-management
payer_exempt: true
payer_compensating_control: null
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_organization
params:
  attack_stage: impact
  base_impact: 8
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.0
observation_fields:
  - identity.kind
  - identity.scp.denies_ec2_modify_ebs_default_key
remediation:
  description: >
    Organization SCPs do not deny ec2:ModifyEbsDefaultKmsKeyId.
    Any principal can change the default EBS encryption key.
  action: >
    Add an SCP that denies ec2:ModifyEbsDefaultKmsKeyId for all
    principals. Exempt the infrastructure automation role if
    default key changes are part of account provisioning.
  example: |
    {
      "identity": {
        "kind": "organization",
        "scp": {
          "denies_ec2_modify_ebs_default_key": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: organization
    - field: properties.identity.scp.denies_ec2_modify_ebs_default_key
      op: ne
      value: true
tests:
  - name: "organization without ModifyEbsDefaultKmsKeyId denial fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:organizations::111122223333:organization/o-abc123"
      asset_type: aws_organization
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            denies_ec2_modify_ebs_default_key: false
  - name: "organization with ModifyEbsDefaultKmsKeyId denial passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:organizations::444455556666:organization/o-def456"
      asset_type: aws_organization
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            denies_ec2_modify_ebs_default_key: true
