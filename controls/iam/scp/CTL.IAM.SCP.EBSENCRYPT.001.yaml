dsl_version: ctrl.v1
id: CTL.IAM.SCP.EBSENCRYPT.001
name: "SCP Does Not Protect EBS Default Encryption"
description: >
  SCP does not deny disabling EBS default encryption. If EBS default
  encryption is enabled at the account level, any identity with
  ec2:DisableEbsEncryptionByDefault can turn it off, allowing new
  volumes to be created without encryption. The SCP prevents this
  setting from being toggled off, maintaining encryption-by-default
  as an organizational invariant.
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "SC-28"
  soc2: "CC6.1"
  ccm_v4: ["DSP-10"]
scope_tags:
  - aws
  - iam
  - ec2
taxonomy:
  - account-governance
  - encryption-at-rest
payer_exempt: true
payer_compensating_control: null
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_organization
params:
  attack_stage: detection_evasion
observation_fields:
  - identity.kind
  - identity.scp.denies_ebs_encryption_disable
remediation:
  description: >
    Organization SCPs do not prevent disabling EBS default encryption.
  action: >
    Add an SCP that denies ec2:DisableEbsEncryptionByDefault for all
    principals in member accounts. This ensures that once EBS default
    encryption is enabled, it cannot be turned off.
  example: |
    {
      "identity": {
        "kind": "organization",
        "scp": {
          "denies_ebs_encryption_disable": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: organization
    - field: properties.identity.scp.denies_ebs_encryption_disable
      op: ne
      value: true
tests:
  - name: "organization without EBS encryption protection fails"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:organizations::111122223333:organization/o-abc123"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            denies_ebs_encryption_disable: false
  - name: "organization with EBS encryption protection passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:organizations::444455556666:organization/o-def456"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: organization
          scp:
            denies_ebs_encryption_disable: true
