dsl_version: ctrl.v1
id: CTL.IAM.IDENTITY.BLASTRADIUS.006
name: User Must Not Reach Excessive Sensitive Resources
description: >
  IAM users must have access to fewer than 20 resources classified as
  sensitive (PHI, PII, confidential). A user that can reach 85
  sensitive resources is a qualitatively different risk than one that
  reaches 5 — credential compromise exposes a proportionally larger
  data surface. This is the user-kind equivalent of
  CTL.IAM.IDENTITY.BLASTRADIUS.004 for roles. Iski's disclosure (April
  2025) showed the Iski pattern: a user with read access to
  user-backups-staging — which held production database backups and
  user PII — turned a leaked access key into a full PII breach. The
  extractor counts unique sensitive resources reachable through the
  user's attached and inline policies.
domain: identity
severity: critical
scope: compound
corpus_reference: MITRE:T1550
compliance:
  hipaa: "164.312(a)(1)"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.2"
  nist_800_53_r5: "AC-6(5)"
  fedramp_moderate: "AC-6(5)"
  ccm_v4: ["IAM-03", "IAM-05"]
scope_tags:
  - aws
  - iam
type: unsafe_state
classification: parameterized_check
applicable_asset_types:
  - aws_iam_user
params:
  base_impact: 10
  attack_stage: exfiltration
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.5
remediation:
  description: >
    User has access to more than 20 sensitive resources. Credential
    compromise exposes a disproportionate data surface.
  action: >
    Split broad user permissions into scoped Resource ARNs. Move
    programmatic access onto service-linked roles with tightly-scoped
    trust policies. Use IAM Access Analyzer to identify unused
    permissions on sensitive resources. Apply permissions boundaries
    that restrict access to classified data.
  example: |
    {
      "identity": {
        "kind": "user",
        "user": {
          "sensitive_resource_count": 5
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: user
    - field: properties.identity.user.sensitive_resource_count
      op: gt
      value: 20
