dsl_version: ctrl.v1
id: CTL.IAM.ROOT.MFA.001
name: Root Account Must Have MFA Enabled
description: >
  The AWS root account must have multi-factor authentication enabled.
  Root has unrestricted access to all resources. Compromise without
  MFA is the highest-severity identity risk.
domain: identity
severity: critical
compliance:
  cis_aws_v1.4.0: "1.5"
  cis_aws_v3.0: "1.5"
  hipaa: "164.312(d)"
  pci_dss_v3.2.1: "8.3"
  soc2: "CC6.1"
  pci_dss_v4.0: "8.3.1"
  nist_800_53_r5: "IA-2(1)"
  fedramp_moderate: "IA-2(1)"
  gdpr: "Art.32"
  ffiec: "CAT-D3"
  iso_27001_2022: "A.8.5"
  nist_csf_2.0: "PR.AA"
scope_tags:
  - aws
  - iam
type: unsafe_state
params:
  attack_stage: credential_access
remediation:
  description: >
    Root account does not have MFA enabled. An attacker with root
    credentials can perform any action in the AWS account.
  action: >
    Enable MFA on the root account using a hardware MFA device or
    virtual MFA app. Navigate to IAM > Security credentials > MFA.
  example: |
    {
      "identity": {
        "kind": "account",
        "root": {
          "mfa_enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: account
    - field: properties.identity.root.mfa_enabled
      op: eq
      value: false
