dsl_version: ctrl.v1
id: CTL.IAM.CLOUD9.ADMIN.001
name: IAM Policy Grants Cloud9 Environment Creation
description: >
  An IAM principal has a policy granting cloud9:CreateEnvironmentEC2.
  Cloud9 environments create EC2 instances with security groups and
  inherit the creating principal's credentials. Environments can have
  direct SSH access from the internet.
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "AC-6"
  soc2: "CC6.3"
  ccm_v4: ["IAM-02"]
scope_tags: [aws, iam]
taxonomy:
  - least-privilege
  - resource-sprawl
type: unsafe_state
classification: state_assertion
applicable_asset_types: [aws_iam_user, aws_iam_role]
params:
  attack_stage: persistence
observation_fields:
  - identity.kind
  - identity.permissions.cloud9_create_environment
remediation:
  description: IAM principal can create Cloud9 environments — EC2 with SG and credentials.
  action: Remove cloud9:CreateEnvironmentEC2 from the principal's policies.
  example: |
    {"identity": {"kind": "iam_principal", "permissions": {"cloud9_create_environment": false}}}
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: in
      value: [iam_user, iam_role]
    - field: properties.identity.permissions.cloud9_create_environment
      op: eq
      value: true
tests:
  - name: "principal with Cloud9 create fires"
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:iam::111122223333:user/dev"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: iam_user
          permissions: {cloud9_create_environment: true}
  - name: "principal without Cloud9 create passes"
    verdict: PASS
    asset:
      asset_id: "arn:aws:iam::444455556666:user/readonly"
      asset_type: aws_iam_user
      vendor: aws
      properties:
        identity:
          kind: iam_user
          permissions: {cloud9_create_environment: false}
