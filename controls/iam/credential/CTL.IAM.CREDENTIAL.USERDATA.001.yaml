dsl_version: ctrl.v1
id: CTL.IAM.CREDENTIAL.USERDATA.001
name: EC2 User Data Contains AWS Credentials
description: >
  EC2 instance user data contains AWS access keys, secret keys, or
  session tokens. User data is retrievable via the instance metadata
  service (169.254.169.254/latest/user-data) and visible in the EC2
  console, API responses, and CloudFormation stack history. Credentials
  in user data are exposed to anyone with EC2 describe permissions or
  metadata access — four separate attack surfaces.
domain: exposure
severity: high
compliance:
  owasp_nhi: "NHI2"
  soc2: "CC6.1"
  nist_800_53_r5: "IA-5(7)"
  pci_dss_v4.0: "8.6.2"
  fedramp_moderate: "IA-5(7)"
  hipaa: "164.312(a)(1)"
  ccm_v4: ["IAM-02", "DSP-17"]
scope_tags:
  - aws
  - iam
  - ec2
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
observation_fields:
  - compute.userdata_contains_credentials
  - compute.userdata_credential_type
remediation:
  description: >
    EC2 instance user data contains hardcoded AWS credentials.
    Credentials are exposed via metadata service, EC2 API, console,
    and CloudFormation history.
  action: >
    Remove hardcoded credentials from user data. Use IAM instance
    profiles for EC2 access to AWS services. For bootstrap secrets
    use Secrets Manager or SSM Parameter Store SecureString.
  example: |
    {
      "compute": {
        "userdata_contains_credentials": false
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.userdata_contains_credentials
      op: eq
      value: true
defect: >
  EC2 instance user data contains AWS credentials.
infection: >
  EC2 user data is not encrypted. It is readable via: the instance
  metadata service at 169.254.169.254 (any process on the instance),
  the EC2 DescribeInstanceAttribute API (anyone with
  ec2:DescribeInstanceAttribute permission), the AWS console (anyone
  with console access to EC2), and CloudFormation stack history (if
  the instance was launched via CFN). AWS credentials in user data
  are exposed on four separate surfaces. The credentials persist in
  user data even after the instance is stopped — they are not cleared
  on shutdown.
failure: >
  Credential exposure via user data. AWS credentials accessible to
  any process on the instance and any principal with EC2 describe
  permissions.
tests:
  - name: instance with credentials in user data fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:ec2:us-east-1:111122223333:instance/i-0abc123def456"
      asset_type: aws_ec2_instance
      vendor: aws
      properties:
        compute:
          userdata_contains_credentials: true
          userdata_credential_type: access_key
  - name: instance without credentials in user data passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:ec2:us-east-1:111122223333:instance/i-0def456abc789"
      asset_type: aws_ec2_instance
      vendor: aws
      properties:
        compute:
          userdata_contains_credentials: false
