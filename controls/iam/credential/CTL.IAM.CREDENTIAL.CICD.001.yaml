dsl_version: ctrl.v1
id: CTL.IAM.CREDENTIAL.CICD.001
name: CI/CD Uses Long-Lived Access Keys Instead of OIDC Federation
description: >
  CI/CD pipelines (GitHub Actions, GitLab CI, Bitbucket Pipelines)
  authenticate to AWS using long-lived IAM access keys stored as
  CI/CD secrets instead of OIDC federation. OIDC federation provides
  short-lived credentials scoped to specific repositories and
  workflows — no long-lived secrets to leak, no keys to rotate.
domain: identity
severity: medium
compliance:
  owasp_nhi: "NHI2"
  soc2: "CC6.1"
  nist_800_53_r5: "IA-5(1)"
  pci_dss_v4.0: "8.3.6"
  fedramp_moderate: "IA-5(1)"
  ccm_v4: ["IAM-02", "IAM-08"]
scope_tags:
  - aws
  - iam
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
observation_fields:
  - identity.cicd.uses_long_lived_keys
  - identity.cicd.oidc_provider_configured
  - identity.cicd.key_age_days
remediation:
  description: >
    CI/CD integration uses long-lived IAM access keys instead of
    OIDC federation. Keys persist until manually rotated or deleted.
  action: >
    Replace long-lived IAM access keys with OIDC federation.
    Configure an IAM OIDC provider for your CI/CD platform and
    create a role with a trust policy scoped to specific repositories
    and workflows.
  example: |
    {
      "identity": {
        "cicd": {
          "uses_long_lived_keys": false,
          "oidc_provider_configured": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.cicd.uses_long_lived_keys
      op: eq
      value: true
defect: >
  CI/CD integration uses long-lived IAM access keys instead of OIDC
  federation.
infection: >
  Long-lived access keys in CI/CD environments are the most commonly
  leaked credential type. They are stored as CI/CD 'secrets' but are
  accessible to anyone who can modify the pipeline configuration,
  read pipeline logs (if accidentally printed), or access the CI/CD
  platform's secret storage. OIDC federation (supported by GitHub
  Actions, GitLab CI, and others) replaces long-lived keys with
  short-lived tokens scoped to specific repositories and workflows.
  No secret to leak. No key to rotate. No credential that persists
  after the pipeline run.
failure: >
  CI/CD credential exposure. Long-lived access keys are leaked from
  the CI/CD platform and used to access AWS from outside the
  pipeline.
tests:
  - name: CI/CD with long-lived keys fires
    verdict: VIOLATION
    asset:
      asset_id: "cicd:github-actions:org/repo"
      asset_type: aws_cicd_integration
      vendor: aws
      properties:
        identity:
          cicd:
            uses_long_lived_keys: true
            oidc_provider_configured: false
            key_age_days: 200
  - name: CI/CD with OIDC federation passes
    verdict: PASS
    asset:
      asset_id: "cicd:github-actions:org/secure-repo"
      asset_type: aws_cicd_integration
      vendor: aws
      properties:
        identity:
          cicd:
            uses_long_lived_keys: false
            oidc_provider_configured: true
