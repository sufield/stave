expected_result:
  proof_trees_count: 12
  first_proof_root: anonymous reaches arn:aws:s3:::app-public-assets via s3:GetObject
  edges_per_proof: 4
validation:
  exact_match:
  - proof_trees_count
  - edges_per_proof
