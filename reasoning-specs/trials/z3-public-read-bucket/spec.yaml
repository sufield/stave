# reasoning-spec: z3-public-read-bucket
# engine: z3
# trial-fixture: input.smt2

question: >
  Is there an S3 bucket in this fact base that allows public read AND
  has Public Access Block disabled? If so, what is the witness — the
  specific bucket ARN?

context: >
  In AWS, an S3 bucket is publicly readable when (a) the bucket
  policy or ACL admits Principal "*" on s3:GetObject AND (b) the
  Public Access Block ("PAB") flags on the bucket and its containing
  account do NOT mask that admission. The catalog projects two
  per-asset booleans: has_public_read(bucket, "true"|"false") and
  has_public_access_blocked(bucket, "true"|"false"). The forbidden
  state is the conjunction: a bucket with public_read=true AND
  public_access_blocked=false. SAT means at least one bucket is in
  that state and the solver names it; UNSAT means no bucket in the
  fact base satisfies the conjunction.

input:
  source: stave export-sir --format smt2  +  appended query
  format: smt-lib
  fixture: input.smt2
  required_fields:
    - has_type(<arn>, "aws_s3_bucket")
    - has_public_read(<arn>, "true"|"false")
    - has_public_access_blocked(<arn>, "true"|"false")

reasoning:
  steps:
    - step: 1
      action: >
        Read the SMT-LIB document. It declares predicates as
        Bool functions over String arguments and asserts ground
        atoms (one per (subject, object) pair) plus closed-world
        forall axioms ("this predicate is true ONLY for the
        explicitly-asserted pairs").
      input: input.smt2 (every line until the first `(check-sat)`)
      output: An in-solver model of the per-asset facts.
      rule: >
        Treat the document literally. The closed-world axioms
        forbid any predicate value that wasn't explicitly
        asserted; do not infer beyond the asserted ground atoms.

    - step: 2
      action: >
        Read the query block (after the facts). It asserts
        the conjunction of three constraints over a single
        free variable `bucket`:
          (assert (has_type bucket "aws_s3_bucket"))
          (assert (has_public_read bucket "true"))
          (assert (has_public_access_blocked bucket "false"))
        followed by (check-sat) and (get-value (bucket)).
      input: the query block of input.smt2
      output: Three additional assertions plus the verdict request.
      rule: Use the query verbatim; do not modify the constraints.

    - step: 3
      action: >
        Decide satisfiability and, if SAT, report the witness.
      input: facts + query from steps 1 and 2
      output: |
        One of two outcomes:
          - SAT: the value of `bucket` for which all three
            constraints hold (e.g. arn:aws:s3:::acme-customer-uploads)
          - UNSAT: no `bucket` value can satisfy all three
      rule: >
        SAT requires at least one explicitly-asserted ground atom
        triple where the same first argument appears in
        has_type=aws_s3_bucket, has_public_read=true, AND
        has_public_access_blocked=false. UNSAT requires every
        s3_bucket subject in the fact base to fail at least one
        of the two public-state predicates.

output:
  format: text
  schema:
    verdict: SAT | UNSAT
    witness: When SAT, the bucket ARN that satisfies the conjunction.
             Omitted when UNSAT.

  expected_result:
    verdict: SAT
    witness: arn:aws:s3:::acme-customer-uploads

validation:
  exact_match:
    - verdict
    - witness
  semantic_match: []
  ignore:
    - solver warnings preceding the verdict line
    - whitespace around the (get-value …) tuple
