# NIST SP 800-53 Rev 5 — CM: Configuration Management
# Summary: 7 controls — 5 MAPPED, 0 NEW, 2 MANUAL

controls:

- id: NIST.CM.1
  title: AWS Config recording all resource types
  nist_control: "CM-2"
  mapped_to_existing: true
  existing_control: CIS CTL.CONFIG.ENABLED.001
  note: Config provides auditable baseline configuration.

- id: NIST.CM.2
  title: Config rules actively evaluating compliance
  nist_control: "CM-3"
  mapped_to_existing: true
  existing_control: HIPAA CTL.CONFIG.RULES.001
  note: Automated drift detection from baseline.

- id: NIST.CM.3
  title: CloudFormation drift detection
  nist_control: "CM-3"
  mapped_to_existing: true
  existing_control: SOC2 CTL.CLOUDFORMATION.DRIFT.001
  note: IaC drift indicates out-of-band changes.

- id: NIST.CM.4
  title: EC2 IMDSv2 required (hardening)
  nist_control: "CM-6"
  mapped_to_existing: true
  existing_control: CIS CTL.EC2.IMDSV2.001
  note: Secure instance metadata configuration.

- id: NIST.CM.5
  title: RDS auto minor version upgrade
  nist_control: "CM-6"
  mapped_to_existing: true
  existing_control: CIS CTL.RDS.AUTOUPGRADE.001
  note: Security patches applied automatically.

- id: NIST.CM.6
  title: Baseline configuration documented
  nist_control: "CM-2"
  manual: true
  reason: Baseline documentation is an organizational artifact.
  evidence_guidance: Documented baseline configs for each system type.

- id: NIST.CM.7
  title: Change control board procedures
  nist_control: "CM-3"
  manual: true
  reason: Change approval workflows are organizational processes.
  evidence_guidance: Change tickets, approval records, and CAB meeting minutes.
