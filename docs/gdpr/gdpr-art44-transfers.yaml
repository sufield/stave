# GDPR — Chapter V (Articles 44-49): International Data Transfers
# Summary: 4 controls — 0 MAPPED, 1 NEW, 3 MANUAL

invariants:

- id: GDPR.44.1
  title: S3 buckets must be in approved EU/EEA regions
  gdpr_article: "Art.44"
  description: >
    S3 buckets containing personal data of EU/EEA data subjects must
    be located in approved AWS regions (eu-west-1, eu-west-2,
    eu-west-3, eu-central-1, eu-central-2, eu-north-1, eu-south-1,
    eu-south-2). Data stored outside the EEA requires explicit
    transfer safeguards.
  conditions:
    - storage.kind == "bucket"
    - storage.region in ["eu-west-1", "eu-west-2", "eu-west-3", "eu-central-1", "eu-central-2", "eu-north-1", "eu-south-1", "eu-south-2"]
  all_must_pass: true
  severity: high
  remediation: >
    Move data to an EU/EEA region or implement Standard Contractual
    Clauses (SCCs) with supplementary measures for the transfer.

- id: GDPR.44.2
  title: Standard Contractual Clauses for non-EEA transfers
  gdpr_article: "Art.46"
  manual: true
  reason: SCCs are contractual documents between controller and processor.
  evidence_guidance: Signed SCCs with AWS (available via AWS Artifact) or other transfer mechanisms (adequacy decision, binding corporate rules).

- id: GDPR.44.3
  title: Supplementary measures (Schrems II)
  gdpr_article: "Art.46"
  manual: true
  reason: Supplementary measures are technical and organizational decisions requiring legal assessment.
  evidence_guidance: Transfer impact assessment (TIA) documenting supplementary measures such as customer-managed encryption keys where the processor cannot access raw data.

- id: GDPR.44.4
  title: Data transfer documentation
  gdpr_article: "Art.44"
  manual: true
  reason: Transfer documentation is an organizational record.
  evidence_guidance: Documented data flows showing all cross-border transfers, legal basis for each, and safeguards applied.
