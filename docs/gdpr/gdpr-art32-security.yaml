# GDPR — Article 32: Security of Processing
# Summary: 18 controls — 18 MAPPED, 0 NEW, 0 MANUAL

controls:

# Encryption at rest
- id: GDPR.32.1
  title: S3 encryption at rest
  gdpr_article: "Art.32(1)(a)"
  mapped_to_existing: true
  existing_control: HIPAA CTL.S3.ENCRYPT.001, CTL.S3.ENCRYPT.003
  note: Encryption of personal data at rest — SSE with KMS CMK.

- id: GDPR.32.2
  title: RDS storage encryption
  gdpr_article: "Art.32(1)(a)"
  mapped_to_existing: true
  existing_control: HIPAA CTL.RDS.ENCRYPT.001
  note: Database encryption at rest.

- id: GDPR.32.3
  title: EBS volume encryption
  gdpr_article: "Art.32(1)(a)"
  mapped_to_existing: true
  existing_control: HIPAA CTL.EC2.EBS.ENCRYPT.001
  note: Block storage encryption.

- id: GDPR.32.4
  title: DynamoDB/SQS/SNS/Secrets Manager encryption
  gdpr_article: "Art.32(1)(a)"
  mapped_to_existing: true
  existing_control: HIPAA CTL.DYNAMODB.ENCRYPT.001, CTL.SQS.ENCRYPT.001, CTL.SNS.ENCRYPT.001, CTL.SECRETSMANAGER.ENCRYPT.001
  note: Encryption for all data services.

- id: GDPR.32.5
  title: Backup encryption
  gdpr_article: "Art.32(1)(a)"
  mapped_to_existing: true
  existing_control: HIPAA CTL.BACKUP.ENCRYPT.001
  note: Backup vault encryption.

# Encryption in transit
- id: GDPR.32.6
  title: S3 TLS enforcement
  gdpr_article: "Art.32(1)(a)"
  mapped_to_existing: true
  existing_control: HIPAA CTL.S3.ENCRYPT.002
  note: Deny non-HTTPS via bucket policy.

- id: GDPR.32.7
  title: ELB/RDS/API Gateway TLS
  gdpr_article: "Art.32(1)(a)"
  mapped_to_existing: true
  existing_control: HIPAA CTL.ELB.TLS.001, CTL.RDS.SSL.001, CTL.APIGATEWAY.TLS.001
  note: TLS 1.2+ on all data services.

# Confidentiality
- id: GDPR.32.8
  title: S3 Block Public Access
  gdpr_article: "Art.32(1)(b)"
  mapped_to_existing: true
  existing_control: CIS CTL.S3.CONTROLS.001
  note: Default-deny access for confidentiality.

- id: GDPR.32.9
  title: RDS not publicly accessible
  gdpr_article: "Art.32(1)(b)"
  mapped_to_existing: true
  existing_control: HIPAA CTL.RDS.PUBLIC.001
  note: Database endpoints not internet-reachable.

- id: GDPR.32.10
  title: IAM least privilege
  gdpr_article: "Art.32(1)(b)"
  mapped_to_existing: true
  existing_control: CIS CTL.IAM.POLICY.ADMIN.001, CTL.IAM.POLICY.INLINE/DIRECT.001
  note: No wildcard admin, permissions through groups.

# Integrity
- id: GDPR.32.11
  title: S3 versioning enabled
  gdpr_article: "Art.32(1)(b)"
  mapped_to_existing: true
  existing_control: HIPAA CTL.S3.VERSION.001
  note: Data integrity through versioning.

- id: GDPR.32.12
  title: CloudTrail log validation
  gdpr_article: "Art.32(1)(b)"
  mapped_to_existing: true
  existing_control: CIS CTL.CLOUDTRAIL.VALIDATION.001
  note: Audit log integrity.

# Availability and restoration
- id: GDPR.32.13
  title: RDS Multi-AZ and backups
  gdpr_article: "Art.32(1)(c)"
  mapped_to_existing: true
  existing_control: HIPAA CTL.RDS.MULTIAZ.001, CTL.RDS.BACKUP.001
  note: Database resilience and restoration.

- id: GDPR.32.14
  title: Backup existence and replication
  gdpr_article: "Art.32(1)(c)"
  mapped_to_existing: true
  existing_control: HIPAA CTL.BACKUP.EXISTS.001, CTL.BACKUP.REPLICATION.001
  note: Cross-region backup for disaster recovery.

# Authentication
- id: GDPR.32.15
  title: MFA on privileged accounts
  gdpr_article: "Art.32(1)(b)"
  mapped_to_existing: true
  existing_control: CIS CTL.IAM.ROOT.MFA.001, CTL.IAM.CONSOLE.MFA.001
  note: Strong authentication for personal data access.

- id: GDPR.32.16
  title: KMS key management
  gdpr_article: "Art.32(1)(a)"
  mapped_to_existing: true
  existing_control: CIS CTL.KMS.ROTATION.001, HIPAA CTL.KMS.POLICY.001
  note: Cryptographic key lifecycle management.

# Threat detection
- id: GDPR.32.17
  title: GuardDuty enabled
  gdpr_article: "Art.32(1)(d)"
  mapped_to_existing: true
  existing_control: SOC2 CTL.GUARDDUTY.ENABLED.001
  note: Continuous threat detection for security testing.

- id: GDPR.32.18
  title: Security Hub enabled
  gdpr_article: "Art.32(1)(d)"
  mapped_to_existing: true
  existing_control: SOC2 CTL.SECURITYHUB.ENABLED.001
  note: Aggregated security findings.
