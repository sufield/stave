# GDPR — Articles 33 & 34: Personal Data Breach Notification
# Summary: 5 controls — 2 MAPPED, 0 NEW, 3 MANUAL

invariants:

- id: GDPR.33.1
  title: GuardDuty for breach detection
  gdpr_article: "Art.33(1)"
  mapped_to_existing: true
  existing_invariant: SOC2 CTL.GUARDDUTY.ENABLED.001
  note: Threat detection to identify breaches.

- id: GDPR.33.2
  title: CloudWatch monitoring for anomaly detection
  gdpr_article: "Art.33(1)"
  mapped_to_existing: true
  existing_invariant: CIS CTL.CLOUDWATCH.MONITOR.UNAUTH.001, CTL.CLOUDWATCH.MONITOR.ROOT.001
  note: Automated alerting for unauthorized access patterns.

- id: GDPR.33.3
  title: 72-hour supervisory authority notification
  gdpr_article: "Art.33(1)"
  manual: true
  reason: Breach notification is a process triggered by security events, not infrastructure config.
  evidence_guidance: Documented breach notification procedures with 72-hour timeline, contact details for relevant supervisory authority, and template notification forms.

- id: GDPR.33.4
  title: Data subject notification for high-risk breaches
  gdpr_article: "Art.34(1)"
  manual: true
  reason: Determining high risk and notifying individuals is an organizational decision.
  evidence_guidance: Breach assessment criteria for determining high risk, notification templates, and communication channel procedures.

- id: GDPR.33.5
  title: Breach response plan tested
  gdpr_article: "Art.33"
  manual: true
  reason: Incident response testing is an organizational exercise.
  evidence_guidance: Annual tabletop exercise records including breach scenario, response timeline, and improvement actions.
