# SOC 2 Trust Service Criteria — C1: Confidentiality
# AWS services: S3, RDS, EBS, KMS, Secrets Manager, CloudFront
#
# Summary: 8 controls — 7 MAPPED, 0 NEW, 1 MANUAL

invariants:

# --- MAPPED ---

- id: SOC2.C1.1
  title: S3 buckets encrypted at rest
  soc2_criteria: C1.1
  mapped_to_existing: true
  existing_invariant: HIPAA CTL.S3.ENCRYPT.001
  note: >
    SSE enabled on all S3 buckets — covered by HIPAA §164.312(a)(2)(iv).

- id: SOC2.C1.2
  title: S3 bucket policy enforces TLS
  soc2_criteria: C1.1
  mapped_to_existing: true
  existing_invariant: HIPAA CTL.S3.ENCRYPT.002
  note: >
    Deny statement for aws:SecureTransport=false — covered by
    HIPAA §164.312(e)(2)(ii) and CIS 2.1.1.

- id: SOC2.C1.3
  title: RDS storage encryption enabled
  soc2_criteria: C1.1
  mapped_to_existing: true
  existing_invariant: HIPAA CTL.RDS.ENCRYPT.001
  note: >
    Storage encryption at rest — covered by HIPAA §164.312(a)(2)(iv)
    and CIS 2.3.1.

- id: SOC2.C1.4
  title: EBS volumes encrypted
  soc2_criteria: C1.1
  mapped_to_existing: true
  existing_invariant: HIPAA CTL.EC2.EBS.ENCRYPT.001
  note: >
    EBS encryption by default — covered by HIPAA §164.312(a)(2)(iv)
    and CIS 2.2.1.

- id: SOC2.C1.5
  title: KMS customer-managed key rotation enabled
  soc2_criteria: C1.1
  mapped_to_existing: true
  existing_invariant: CIS CTL.KMS.ROTATION.001
  note: >
    Automatic key rotation limits blast radius — covered by CIS 3.6.

- id: SOC2.C1.6
  title: Secrets Manager secrets encrypted with CMK
  soc2_criteria: C1.1
  mapped_to_existing: true
  existing_invariant: HIPAA CTL.SECRETSMANAGER.ENCRYPT.001
  note: >
    Customer-managed KMS key for breach response key revocation —
    covered by HIPAA §164.312(a)(2)(iv).

- id: SOC2.C1.7
  title: S3 Object Lock for data retention
  soc2_criteria: C1.2
  mapped_to_existing: true
  existing_invariant: HIPAA CTL.S3.LOCK.001
  note: >
    Object Lock prevents deletion during retention period —
    covered by HIPAA §164.316(b)(2).

# --- MANUAL ---

- id: SOC2.C1.8
  title: Data classification policy documented
  soc2_criteria: C1.1
  manual: true
  reason: >
    Data classification is an organizational policy that defines
    sensitivity levels and handling requirements. Whether data is
    properly classified requires human judgment, not config inspection.
  evidence_guidance: >
    Auditors expect a data classification policy defining sensitivity
    levels (public, internal, confidential, restricted), handling
    requirements per level, and evidence of classification labeling
    on data stores (tags, naming conventions).

# --- Section Summary ---
# Total: 8 controls
# MAPPED: 7 (encryption at rest/transit, KMS, Secrets Manager, Object Lock)
# NEW: 0
# MANUAL: 1 (data classification policy)
# C1 is well-covered by existing HIPAA and CIS encryption controls.
