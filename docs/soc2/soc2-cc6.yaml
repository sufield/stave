# SOC 2 Trust Service Criteria — CC6: Logical and Physical Access Controls
# AWS services: IAM, S3, RDS, EC2, VPC, Secrets Manager, KMS
#
# Summary: 18 controls — 14 MAPPED, 2 NEW, 2 MANUAL

controls:

# --- MAPPED controls (covered by existing HIPAA or CIS controls) ---

- id: SOC2.CC6.1
  title: Multi-factor authentication on privileged accounts
  soc2_criteria: CC6.1
  mapped_to_existing: true
  existing_control: HIPAA CTL.IAM.ROOT.MFA.001, CTL.IAM.CONSOLE.MFA.001, CIS CTL.IAM.ROOT.HWMFA.001
  note: >
    Root and console users must have MFA enabled — covered by HIPAA
    §164.312(d) and CIS 1.5, 1.6, 1.10.

- id: SOC2.CC6.2
  title: Root account must not have access keys
  soc2_criteria: CC6.1
  mapped_to_existing: true
  existing_control: CIS CTL.IAM.ROOT.ACCESSKEY.001
  note: >
    Root access keys provide unrestricted access — covered by CIS 1.4.

- id: SOC2.CC6.3
  title: Password policy enforces complexity and length
  soc2_criteria: CC6.1
  mapped_to_existing: true
  existing_control: HIPAA CTL.IAM.PASSWORD.LENGTH.001, CTL.IAM.PASSWORD.REUSE.001, CTL.IAM.PASSWORD.COMPLEXITY.001
  note: >
    Password minimum length >= 14, reuse prevention >= 24, and all
    character types required — covered by HIPAA §164.312(a)(2)(i).

- id: SOC2.CC6.4
  title: Access keys rotated within 90 days
  soc2_criteria: CC6.1
  mapped_to_existing: true
  existing_control: CIS CTL.IAM.CRED.ROTATION.001
  note: >
    Stale access keys increase blast radius — covered by CIS 1.14.

- id: SOC2.CC6.5
  title: Unused credentials disabled
  soc2_criteria: CC6.1
  mapped_to_existing: true
  existing_control: CIS CTL.IAM.CRED.UNUSED.001, CTL.IAM.CRED.UNUSED45.001
  note: >
    Dormant credentials are lateral movement vectors — covered by
    CIS 1.12 (45 days) and HIPAA (90 days).

- id: SOC2.CC6.6
  title: No full administrative privilege policies attached
  soc2_criteria: CC6.1
  mapped_to_existing: true
  existing_control: CIS CTL.IAM.POLICY.ADMIN.001
  note: >
    Wildcard *:* admin policies violate least privilege — covered by CIS 1.16.

- id: SOC2.CC6.7
  title: Users receive permissions only through groups
  soc2_criteria: CC6.3
  mapped_to_existing: true
  existing_control: CIS CTL.IAM.POLICY.INLINE.001, CTL.IAM.POLICY.DIRECT.001
  note: >
    Inline and direct policies bypass central governance — covered by CIS 1.15.

- id: SOC2.CC6.8
  title: S3 Block Public Access enabled
  soc2_criteria: CC6.1
  mapped_to_existing: true
  existing_control: CIS CTL.S3.CONTROLS.001
  note: >
    All four BPA flags must be enabled — covered by CIS 2.1.4.

- id: SOC2.CC6.9
  title: RDS instances not publicly accessible
  soc2_criteria: CC6.1
  mapped_to_existing: true
  existing_control: HIPAA CTL.RDS.PUBLIC.001
  note: >
    Public RDS exposes databases to the internet — covered by
    HIPAA §164.312(a)(1) and CIS 2.3.3.

- id: SOC2.CC6.10
  title: Security groups restrict administrative port ingress
  soc2_criteria: CC6.6
  mapped_to_existing: true
  existing_control: CIS CTL.VPC.SG.UNRESTRICTED.001, CTL.VPC.SG.IPV6.001, CTL.VPC.NACL.ADMIN.001
  note: >
    No SG or NACL allows 0.0.0.0/0 or ::/0 to SSH/RDP — covered
    by CIS 5.1, 5.2, 5.3.

- id: SOC2.CC6.11
  title: Default security group restricts all traffic
  soc2_criteria: CC6.6
  mapped_to_existing: true
  existing_control: CIS CTL.VPC.SG.DEFAULT.001
  note: >
    Default SG must have no inbound or outbound rules — covered by CIS 5.4.

- id: SOC2.CC6.12
  title: KMS key policies restrict access to specific roles
  soc2_criteria: CC6.1
  mapped_to_existing: true
  existing_control: HIPAA CTL.KMS.POLICY.001
  note: >
    No wildcard principal on KMS key policies — covered by HIPAA §164.312(a)(1).

- id: SOC2.CC6.13
  title: Secrets Manager secrets have rotation enabled
  soc2_criteria: CC6.1
  mapped_to_existing: true
  existing_control: HIPAA CTL.SECRETSMANAGER.ACCESS.001
  note: >
    Automatic rotation prevents long-lived credential exposure —
    covered by HIPAA §164.312(a)(1).

- id: SOC2.CC6.14
  title: EC2 instances must not have public IP addresses
  soc2_criteria: CC6.6
  mapped_to_existing: true
  existing_control: HIPAA CTL.EC2.PUBLIC.001
  note: >
    Public IPs expose instances to the internet — covered by
    HIPAA §164.312(e)(1) and CIS 5.1.

# --- NEW controls (not covered by HIPAA or CIS) ---

- id: SOC2.CC6.15
  title: IAM Access Analyzer enabled with no unresolved findings
  soc2_criteria: CC6.1
  description: >
    IAM Access Analyzer must be enabled and have no active findings
    indicating unintended external access to resources. Unresolved
    findings mean resources are shared with principals outside the
    trust boundary.
  conditions:
    - access_analyzer.enabled == true
    - access_analyzer.active_findings_count == 0
  all_must_pass: true
  severity: high
  remediation: >
    Review and resolve all Access Analyzer findings. For each finding,
    either restrict the resource policy or archive the finding with
    justification.

- id: SOC2.CC6.16
  title: S3 bucket policies must not use wildcard principals
  soc2_criteria: CC6.1
  description: >
    S3 bucket policies must not grant access to Principal "*" without
    appropriate conditions. Wildcard principals make bucket contents
    accessible to any AWS account or anonymous users.
  conditions:
    - storage.access.has_wildcard_principal == false
  all_must_pass: true
  severity: critical
  remediation: >
    Replace wildcard Principal "*" in bucket policies with specific
    account IDs, IAM roles, or use VPC endpoint conditions.

# --- MANUAL controls (cannot be verified from snapshot) ---

- id: SOC2.CC6.17
  title: Physical access controls for data center facilities
  soc2_criteria: CC6.5
  manual: true
  reason: >
    Physical data center access controls are managed by AWS as part
    of the shared responsibility model and are not configurable.
  evidence_guidance: >
    Reference the AWS SOC 2 Type II report (available via AWS Artifact)
    which covers physical security controls for AWS data centers.

- id: SOC2.CC6.18
  title: Periodic user access reviews
  soc2_criteria: CC6.2
  manual: true
  reason: >
    Access reviews require human judgment to determine whether each
    user's permissions are still appropriate for their role.
  evidence_guidance: >
    Auditors expect quarterly access review documentation showing
    who reviewed, what was reviewed, and any access removed.

# --- Section Summary ---
