# SOC 2 Trust Service Criteria — A1: Availability
# AWS services: RDS, S3, ELB/ALB, Auto Scaling, Route 53
#
# Summary: 8 controls — 5 MAPPED, 2 NEW, 1 MANUAL

controls:

# --- MAPPED ---

- id: SOC2.A1.1
  title: RDS instances deployed in Multi-AZ
  soc2_criteria: A1.2
  mapped_to_existing: true
  existing_control: HIPAA CTL.RDS.MULTIAZ.001
  note: >
    Multi-AZ provides automatic failover for database availability —
    covered by HIPAA §164.308(a)(7).

- id: SOC2.A1.2
  title: RDS automated backups enabled with retention
  soc2_criteria: A1.2
  mapped_to_existing: true
  existing_control: HIPAA CTL.RDS.BACKUP.001
  note: >
    Automated backups enable point-in-time recovery — covered by
    HIPAA §164.308(a)(7).

- id: SOC2.A1.3
  title: Critical resources have backups
  soc2_criteria: A1.2
  mapped_to_existing: true
  existing_control: HIPAA CTL.BACKUP.EXISTS.001, CTL.BACKUP.RECENT.001
  note: >
    Backup existence and recency verified — covered by
    HIPAA §164.308(a)(7).

- id: SOC2.A1.4
  title: Cross-region replication for disaster recovery
  soc2_criteria: A1.2
  mapped_to_existing: true
  existing_control: HIPAA CTL.BACKUP.REPLICATION.001
  note: >
    Regional outage protection via cross-region replication —
    covered by HIPAA §164.308(a)(7).

- id: SOC2.A1.5
  title: ELB cross-zone load balancing enabled
  soc2_criteria: A1.1
  mapped_to_existing: true
  existing_control: HIPAA CTL.ELB.CROSSZONE.001
  note: >
    Cross-zone distributes traffic evenly across AZs —
    covered by HIPAA §164.308(a)(7).

# --- NEW ---

- id: SOC2.A1.6
  title: Auto Scaling groups span multiple Availability Zones
  soc2_criteria: A1.1
  description: >
    Auto Scaling groups must be configured across multiple Availability
    Zones. A single-AZ ASG has a single point of failure — an AZ
    outage will take down all instances in the group.
  conditions:
    - scaling.kind == "auto_scaling_group"
    - scaling.availability_zone_count > 1
  all_must_pass: true
  severity: high
  remediation: >
    Update the ASG to span at least two AZs:
    aws autoscaling update-auto-scaling-group --auto-scaling-group-name <name>
    --availability-zones us-east-1a us-east-1b

- id: SOC2.A1.7
  title: Route 53 health checks configured for critical endpoints
  soc2_criteria: A1.1
  description: >
    Route 53 health checks must be configured for DNS records pointing
    to critical application endpoints. Without health checks, DNS
    continues routing to failed endpoints.
  conditions:
    - dns_service.kind == "hosted_zone"
    - dns_service.health_checks_configured == true
  all_must_pass: true
  severity: medium
  remediation: >
    Create Route 53 health checks for critical endpoints and associate
    them with DNS failover routing policies.

# --- MANUAL ---

- id: SOC2.A1.8
  title: RTO and RPO documented and validated
  soc2_criteria: A1.2
  manual: true
  reason: >
    Recovery Time Objective and Recovery Point Objective are business
    requirements documented in DR plans. Whether backups and failover
    actually meet these targets requires DR testing, not config inspection.
  evidence_guidance: >
    Auditors expect documented RTO/RPO per critical system, DR test
    results showing actual recovery times, and gap analysis if targets
    were not met.

# --- Section Summary ---
# Total: 8 controls
# MAPPED: 5 (Multi-AZ, backups, replication, cross-zone LB)
# NEW: 2 (Auto Scaling multi-AZ, Route 53 health checks)
# MANUAL: 1 (RTO/RPO documentation)
# Highest priority NEW: SOC2.A1.6 (Auto Scaling multi-AZ — common SaaS pattern)
