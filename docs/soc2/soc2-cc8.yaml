# SOC 2 Trust Service Criteria — CC8: Change Management
# AWS services: CloudTrail, Config, CloudFormation
#
# Summary: 6 controls — 3 MAPPED, 1 NEW, 2 MANUAL

controls:

# --- MAPPED ---

- id: SOC2.CC8.1
  title: CloudTrail configuration changes monitored
  soc2_criteria: CC8.1
  mapped_to_existing: true
  existing_control: CIS CTL.CLOUDWATCH.MONITOR.TRAIL.001
  note: >
    Metric filter detects CreateTrail, UpdateTrail, DeleteTrail,
    StopLogging — covered by CIS 4.5.

- id: SOC2.CC8.2
  title: AWS Config detects configuration drift
  soc2_criteria: CC8.1
  mapped_to_existing: true
  existing_control: CIS CTL.CONFIG.ENABLED.001, HIPAA CTL.CONFIG.RULES.001
  note: >
    Config records all resource changes and evaluates rules —
    covered by CIS 3.3 and HIPAA §164.312(c)(1).

- id: SOC2.CC8.3
  title: IAM policy changes monitored
  soc2_criteria: CC8.1
  mapped_to_existing: true
  existing_control: CIS CTL.CLOUDWATCH.MONITOR.IAMPOLICY.001
  note: >
    Metric filter detects CreatePolicy, DeletePolicy, AttachRolePolicy
    — covered by CIS 4.4.

# --- NEW ---

- id: SOC2.CC8.4
  title: CloudFormation stack drift detection enabled
  soc2_criteria: CC8.1
  description: >
    CloudFormation stacks managing production infrastructure must
    have drift detection enabled. Drift indicates out-of-band changes
    that bypass the IaC change management process.
  conditions:
    - infrastructure.kind == "stack"
    - infrastructure.drift_detection_enabled == true
  all_must_pass: true
  severity: medium
  remediation: >
    Enable drift detection on the stack:
    aws cloudformation detect-stack-drift --stack-name <name>
    Configure periodic drift detection via EventBridge scheduled rule.

# --- MANUAL ---

- id: SOC2.CC8.5
  title: Change approval process documented
  soc2_criteria: CC8.1
  manual: true
  reason: >
    Change approval workflows are organizational processes (pull
    request reviews, change advisory boards) that cannot be verified
    from infrastructure configuration.
  evidence_guidance: >
    Auditors expect documented change management policy, evidence of
    PR reviews or change tickets for infrastructure changes, and
    separation of duties between requestor and approver.

- id: SOC2.CC8.6
  title: Pre-production testing required before deployment
  soc2_criteria: CC8.1
  manual: true
  reason: >
    Testing requirements are CI/CD pipeline policies that cannot be
    determined from a production infrastructure snapshot.
  evidence_guidance: >
    Auditors expect CI/CD pipeline configuration showing required
    test stages, deployment gate policies, and test result retention.

# --- Section Summary ---
# Total: 6 controls
# MAPPED: 3 (CloudTrail monitoring, Config drift, IAM policy monitoring)
# NEW: 1 (CloudFormation stack drift detection)
# MANUAL: 2 (change approval, pre-production testing)
# Highest priority NEW: SOC2.CC8.4 (CloudFormation drift — verifies IaC integrity)
