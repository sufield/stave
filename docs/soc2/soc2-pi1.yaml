# SOC 2 Trust Service Criteria — PI1: Processing Integrity
# AWS services: CloudTrail, Config, SQS, Lambda
#
# Summary: 5 controls — 2 MAPPED, 1 NEW, 2 MANUAL

invariants:

# --- MAPPED ---

- id: SOC2.PI1.1
  title: CloudTrail data event logging for S3 objects
  soc2_criteria: PI1.1
  mapped_to_existing: true
  existing_invariant: CIS CTL.CLOUDTRAIL.DATAWRITE.001, CTL.CLOUDTRAIL.DATAREAD.001
  note: >
    Object-level read and write logging provides processing audit
    trail — covered by CIS 3.8 and 3.9.

- id: SOC2.PI1.2
  title: SQS queue encryption for data in transit
  soc2_criteria: PI1.1
  mapped_to_existing: true
  existing_invariant: HIPAA CTL.SQS.ENCRYPT.001
  note: >
    Queue encryption protects message integrity — covered by
    HIPAA §164.312(a)(2)(iv).

# --- NEW ---

- id: SOC2.PI1.3
  title: SQS queues must have dead-letter queue configured
  soc2_criteria: PI1.2
  description: >
    SQS queues processing critical workloads must have a dead-letter
    queue (DLQ) configured. Without a DLQ, messages that fail
    processing are silently discarded after max receives, causing
    data loss and processing gaps.
  conditions:
    - messaging.kind == "queue"
    - messaging.dead_letter_queue.enabled == true
  all_must_pass: true
  severity: medium
  remediation: >
    Configure a dead-letter queue:
    aws sqs set-queue-attributes --queue-url <url>
    --attributes '{"RedrivePolicy":"{\"deadLetterTargetArn\":\"<dlq-arn>\",\"maxReceiveCount\":\"3\"}"}'

# --- MANUAL ---

- id: SOC2.PI1.4
  title: Data processing accuracy validation
  soc2_criteria: PI1.3
  manual: true
  reason: >
    Processing accuracy validation requires application-level
    reconciliation checks (input vs output counts, checksums, business
    rule validation) that cannot be determined from infrastructure config.
  evidence_guidance: >
    Auditors expect documented reconciliation procedures, automated
    data quality checks in ETL pipelines, and exception reports for
    processing discrepancies.

- id: SOC2.PI1.5
  title: Error handling and retry procedures documented
  soc2_criteria: PI1.4
  manual: true
  reason: >
    Error handling strategies are application architecture decisions
    (retry policies, circuit breakers, compensation logic) that cannot
    be verified from AWS resource configuration.
  evidence_guidance: >
    Auditors expect documented error handling patterns, evidence of
    dead-letter queue monitoring, and escalation procedures for
    persistent processing failures.

# --- Section Summary ---
# Total: 5 controls
# MAPPED: 2 (CloudTrail data events, SQS encryption)
# NEW: 1 (SQS dead-letter queue)
# MANUAL: 2 (processing accuracy, error handling)
# Highest priority NEW: SOC2.PI1.3 (SQS DLQ — prevents silent data loss)
