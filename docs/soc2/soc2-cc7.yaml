# SOC 2 Trust Service Criteria — CC7: System Operations
# AWS services: CloudTrail, CloudWatch, Config, GuardDuty, Security Hub
#
# Summary: 12 controls — 8 MAPPED, 2 NEW, 2 MANUAL

controls:

# --- MAPPED ---

- id: SOC2.CC7.1
  title: CloudTrail enabled in all regions
  soc2_criteria: CC7.2
  mapped_to_existing: true
  existing_control: CIS CTL.CLOUDTRAIL.ENABLED.001
  note: >
    Multi-region trail provides complete audit coverage — covered by CIS 3.1.

- id: SOC2.CC7.2
  title: CloudTrail log file validation enabled
  soc2_criteria: CC7.2
  mapped_to_existing: true
  existing_control: CIS CTL.CLOUDTRAIL.VALIDATION.001
  note: >
    Log integrity validation prevents tamper — covered by CIS 3.2.

- id: SOC2.CC7.3
  title: CloudTrail S3 bucket has access logging
  soc2_criteria: CC7.2
  mapped_to_existing: true
  existing_control: CIS CTL.CLOUDTRAIL.S3LOG.001
  note: >
    Audit log bucket access must itself be auditable — covered by CIS 3.4.

- id: SOC2.CC7.4
  title: AWS Config recording all resource types
  soc2_criteria: CC7.1
  mapped_to_existing: true
  existing_control: CIS CTL.CONFIG.ENABLED.001
  note: >
    Config provides configuration change history — covered by CIS 3.3.

- id: SOC2.CC7.5
  title: AWS Config rules actively evaluating compliance
  soc2_criteria: CC7.1
  mapped_to_existing: true
  existing_control: HIPAA CTL.CONFIG.RULES.001
  note: >
    Config rules detect drift from security baseline — covered by
    HIPAA §164.312(c)(1).

- id: SOC2.CC7.6
  title: VPC flow logging enabled
  soc2_criteria: CC7.1
  mapped_to_existing: true
  existing_control: CIS CTL.VPC.FLOWLOG.001
  note: >
    Flow logs capture network traffic metadata — covered by CIS 3.7.

- id: SOC2.CC7.7
  title: Unauthorized API calls monitored
  soc2_criteria: CC7.2
  mapped_to_existing: true
  existing_control: CIS CTL.CLOUDWATCH.MONITOR.UNAUTH.001
  note: >
    Metric filter and alarm for AccessDenied events — covered by CIS 4.1.

- id: SOC2.CC7.8
  title: Root account usage monitored
  soc2_criteria: CC7.2
  mapped_to_existing: true
  existing_control: CIS CTL.CLOUDWATCH.MONITOR.ROOT.001
  note: >
    Any root activity triggers alert — covered by CIS 4.3.

# --- NEW ---

- id: SOC2.CC7.9
  title: Amazon GuardDuty must be enabled
  soc2_criteria: CC7.2
  description: >
    GuardDuty must be enabled in all regions to provide continuous
    threat detection. GuardDuty analyzes CloudTrail, VPC Flow Logs,
    and DNS logs to detect reconnaissance, instance compromise, and
    account compromise patterns.
  conditions:
    - threat_detection.kind == "detector"
    - threat_detection.enabled == true
  all_must_pass: true
  severity: high
  remediation: >
    Enable GuardDuty in each region:
    aws guardduty create-detector --enable --region <region>

- id: SOC2.CC7.10
  title: AWS Security Hub must be enabled
  soc2_criteria: CC7.1
  description: >
    Security Hub must be enabled to aggregate security findings from
    GuardDuty, Inspector, Macie, and Config. Without Security Hub,
    findings are scattered across services with no unified view.
  conditions:
    - security_hub.kind == "hub"
    - security_hub.enabled == true
  all_must_pass: true
  severity: high
  remediation: >
    Enable Security Hub:
    aws securityhub enable-security-hub --enable-default-standards

# --- MANUAL ---

- id: SOC2.CC7.11
  title: Incident response plan documented and tested
  soc2_criteria: CC7.4
  manual: true
  reason: >
    Incident response plans are organizational documents that cannot
    be verified from an infrastructure configuration snapshot.
  evidence_guidance: >
    Auditors expect a written incident response plan, evidence of
    annual tabletop exercises, and post-incident review documentation.

- id: SOC2.CC7.12
  title: Regular vulnerability scanning performed
  soc2_criteria: CC7.1
  manual: true
  reason: >
    Vulnerability scanning is a runtime activity. Whether scans were
    performed and remediated cannot be determined from static config.
  evidence_guidance: >
    Auditors expect scan reports from tools like Inspector, Qualys,
    or Nessus showing scan frequency and remediation timelines.

# --- Section Summary ---
# Total: 12 controls
# MAPPED: 8 (CloudTrail, Config, CloudWatch, VPC flow logs)
# NEW: 2 (GuardDuty enabled, Security Hub enabled)
# MANUAL: 2 (incident response plan, vulnerability scanning)
# Highest priority NEW: SOC2.CC7.9 (GuardDuty — foundational threat detection)
