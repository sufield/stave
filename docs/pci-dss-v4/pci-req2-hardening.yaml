# PCI-DSS v4.0 — Requirement 2: Secure Configurations
# Summary: 4 controls — 3 MAPPED, 0 NEW, 1 MANUAL

invariants:

- id: PCI.2.1
  title: S3 Block Public Access must be enabled
  pci_requirement: "2.2.1"
  mapped_to_existing: true
  existing_invariant: CIS CTL.S3.CONTROLS.001
  note: >
    All four BPA flags enabled at bucket level — covered by CIS 2.1.4.

- id: PCI.2.2
  title: EC2 instances must require IMDSv2
  pci_requirement: "2.2.1"
  mapped_to_existing: true
  existing_invariant: CIS CTL.EC2.IMDSV2.001
  note: >
    IMDSv2 prevents SSRF credential theft — covered by CIS 5.6.

- id: PCI.2.3
  title: RDS auto minor version upgrade must be enabled
  pci_requirement: "2.2.1"
  mapped_to_existing: true
  existing_invariant: CIS CTL.RDS.AUTOUPGRADE.001
  note: >
    Security patches applied automatically — covered by CIS 2.3.2.

- id: PCI.2.4
  title: System hardening standards documented
  pci_requirement: "2.2"
  manual: true
  reason: >
    Hardening standards are organizational documents defining approved
    configurations per system type.
  evidence_guidance: >
    Auditors expect documented hardening baselines (CIS benchmarks,
    STIGs) and evidence of compliance testing.
