# PCI-DSS v4.0 — Requirement 11: Test Security of Systems and Networks
# Summary: 4 controls — 2 MAPPED, 0 NEW, 2 MANUAL

controls:

- id: PCI.11.1
  title: Security Hub must be enabled
  pci_requirement: "11.3.1"
  mapped_to_existing: true
  existing_control: SOC2 CTL.SECURITYHUB.ENABLED.001
  note: >
    Aggregated security findings — covered by SOC2 CC7.1.

- id: PCI.11.2
  title: IAM Access Analyzer must be enabled
  pci_requirement: "11.3.1"
  mapped_to_existing: true
  existing_control: CIS CTL.IAM.ANALYZER.001
  note: >
    External access detection — covered by CIS 1.20.

- id: PCI.11.3
  title: Quarterly vulnerability scans
  pci_requirement: "11.3.1"
  manual: true
  reason: >
    Vulnerability scanning is a runtime activity. Scan completion
    and remediation cannot be verified from infrastructure config.
  evidence_guidance: >
    Auditors expect quarterly ASV scan reports, internal scan results,
    and evidence of remediation for all high/critical findings.

- id: PCI.11.4
  title: Annual penetration testing
  pci_requirement: "11.4.1"
  manual: true
  reason: >
    Penetration testing is an organizational activity performed by
    qualified assessors against live systems.
  evidence_guidance: >
    Auditors expect annual pentest reports covering application and
    network layers, with evidence of finding remediation.
