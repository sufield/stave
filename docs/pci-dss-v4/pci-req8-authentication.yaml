# PCI-DSS v4.0 — Requirement 8: Identify and Authenticate Access
# Summary: 10 controls — 10 MAPPED, 0 NEW, 0 MANUAL

invariants:

- id: PCI.8.1
  title: Root account must have MFA enabled
  pci_requirement: "8.3.1"
  mapped_to_existing: true
  existing_invariant: CIS CTL.IAM.ROOT.MFA.001, CTL.IAM.ROOT.HWMFA.001
  note: >
    Root MFA (hardware preferred) — covered by CIS 1.5, 1.6.

- id: PCI.8.2
  title: Root account must not have access keys
  pci_requirement: "8.3.4"
  mapped_to_existing: true
  existing_invariant: CIS CTL.IAM.ROOT.ACCESSKEY.001
  note: >
    No root access keys — covered by CIS 1.4.

- id: PCI.8.3
  title: Console users must have MFA enabled
  pci_requirement: "8.3.1"
  mapped_to_existing: true
  existing_invariant: CIS CTL.IAM.CONSOLE.MFA.001
  note: >
    All console users require MFA — covered by CIS 1.10.

- id: PCI.8.4
  title: Password minimum length must be 12+ characters
  pci_requirement: "8.3.6"
  mapped_to_existing: true
  existing_invariant: HIPAA CTL.IAM.PASSWORD.LENGTH.001
  note: >
    PCI v4 requires 12, Stave checks 14 (stricter) — covered by HIPAA.

- id: PCI.8.5
  title: Password reuse prevention
  pci_requirement: "8.3.7"
  mapped_to_existing: true
  existing_invariant: HIPAA CTL.IAM.PASSWORD.REUSE.001
  note: >
    Last 4 passwords prevented (PCI), Stave checks 24 (stricter) — covered by HIPAA.

- id: PCI.8.6
  title: Access keys must be rotated within 90 days
  pci_requirement: "8.3.9"
  mapped_to_existing: true
  existing_invariant: CIS CTL.IAM.CRED.ROTATION.001
  note: >
    Key rotation within 90 days — covered by CIS 1.14.

- id: PCI.8.7
  title: Unused credentials must be disabled
  pci_requirement: "8.1.4"
  mapped_to_existing: true
  existing_invariant: CIS CTL.IAM.CRED.UNUSED.001
  note: >
    Inactive credentials disabled — covered by CIS 1.12.

- id: PCI.8.8
  title: Single active access key per user
  pci_requirement: "8.3.4"
  mapped_to_existing: true
  existing_invariant: CIS CTL.IAM.CRED.SINGLEKEY.001
  note: >
    At most one active key — covered by CIS 1.13.

- id: PCI.8.9
  title: Cognito user pools must enforce MFA
  pci_requirement: "8.3.1"
  mapped_to_existing: true
  existing_invariant: HIPAA CTL.COGNITO.MFA.001
  note: >
    MFA for application users — covered by HIPAA §164.312(d).

- id: PCI.8.10
  title: Root account must not be used for daily tasks
  pci_requirement: "8.1.1"
  mapped_to_existing: true
  existing_invariant: CIS CTL.IAM.ROOT.USAGE.001
  note: >
    Root last used > 90 days — covered by CIS 1.7.
