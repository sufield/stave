# PCI-DSS v4.0 — Requirement 6: Develop and Maintain Secure Systems
# Summary: 4 controls — 2 MAPPED, 0 NEW, 2 MANUAL

controls:

- id: PCI.6.1
  title: CloudFormation drift detection must be enabled
  pci_requirement: "6.3.2"
  mapped_to_existing: true
  existing_control: SOC2 CTL.CLOUDFORMATION.DRIFT.001
  note: >
    IaC drift indicates out-of-band changes — covered by SOC2 CC8.1.

- id: PCI.6.2
  title: RDS auto minor version upgrade must be enabled
  pci_requirement: "6.3.3"
  mapped_to_existing: true
  existing_control: CIS CTL.RDS.AUTOUPGRADE.001
  note: >
    Security patches applied automatically — covered by CIS 2.3.2.

- id: PCI.6.3
  title: Secure development lifecycle documented
  pci_requirement: "6.2.1"
  manual: true
  reason: >
    SDLC documentation is an organizational process including code
    reviews, security testing, and deployment procedures.
  evidence_guidance: >
    Auditors expect documented SDLC policy, evidence of code reviews,
    SAST/DAST scan results, and deployment approval records.

- id: PCI.6.4
  title: Web application firewall or code review for public apps
  pci_requirement: "6.4.1"
  manual: true
  reason: >
    WAF configuration varies by application and cannot be generically
    verified from infrastructure config without app-specific context.
  evidence_guidance: >
    Auditors expect WAF configuration evidence or annual code review
    results for all public-facing web applications.
