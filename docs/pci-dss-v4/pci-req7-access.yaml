# PCI-DSS v4.0 — Requirement 7: Restrict Access by Business Need
# Summary: 5 controls — 5 MAPPED, 0 NEW, 0 MANUAL

invariants:

- id: PCI.7.1
  title: No full admin IAM policies attached
  pci_requirement: "7.2.1"
  mapped_to_existing: true
  existing_invariant: CIS CTL.IAM.POLICY.ADMIN.001
  note: >
    No *:* wildcard admin access — covered by CIS 1.16.

- id: PCI.7.2
  title: IAM users must receive permissions through groups only
  pci_requirement: "7.2.2"
  mapped_to_existing: true
  existing_invariant: CIS CTL.IAM.POLICY.INLINE.001, CTL.IAM.POLICY.DIRECT.001
  note: >
    No inline or direct policies on users — covered by CIS 1.15.

- id: PCI.7.3
  title: S3 buckets must not be publicly readable
  pci_requirement: "7.2.1"
  mapped_to_existing: true
  existing_invariant: HIPAA CTL.S3.PUBLIC.001
  note: >
    No public read access — covered by HIPAA §164.312(a)(1).

- id: PCI.7.4
  title: RDS instances must not be publicly accessible
  pci_requirement: "7.2.1"
  mapped_to_existing: true
  existing_invariant: HIPAA CTL.RDS.PUBLIC.001
  note: >
    No public database access — covered by HIPAA and CIS 2.3.3.

- id: PCI.7.5
  title: KMS key policies must restrict access
  pci_requirement: "7.2.1"
  mapped_to_existing: true
  existing_invariant: HIPAA CTL.KMS.POLICY.001
  note: >
    No wildcard principal on key policies — covered by HIPAA.
