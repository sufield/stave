# PCI-DSS v4.0 — Requirement 12: Support Information Security with Policies
# Summary: 4 controls — 0 MAPPED, 0 NEW, 4 MANUAL

controls:

- id: PCI.12.1
  title: Information security policy maintained
  pci_requirement: "12.1.1"
  manual: true
  reason: >
    Security policies are organizational documents that cannot be
    verified from infrastructure configuration.
  evidence_guidance: >
    Auditors expect a current information security policy reviewed
    annually, approved by management, and communicated to all personnel.

- id: PCI.12.2
  title: Security awareness training
  pci_requirement: "12.6.1"
  manual: true
  reason: >
    Training completion is tracked in HR/LMS systems, not AWS config.
  evidence_guidance: >
    Auditors expect annual security awareness training records for
    all personnel, including acknowledgment of security policies.

- id: PCI.12.3
  title: Incident response plan tested annually
  pci_requirement: "12.10.1"
  manual: true
  reason: >
    IR plan testing is an organizational exercise involving tabletop
    or live scenarios that cannot be verified from config.
  evidence_guidance: >
    Auditors expect a documented IR plan, evidence of annual testing
    (tabletop exercises), and post-incident review records.

- id: PCI.12.4
  title: Service provider compliance management
  pci_requirement: "12.8.1"
  manual: true
  reason: >
    Vendor compliance management involves contractual and operational
    reviews outside of infrastructure configuration.
  evidence_guidance: >
    Auditors expect a service provider inventory, evidence of PCI
    compliance attestation from each provider, and annual reassessment.
