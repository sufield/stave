# PCI-DSS v4.0 — Requirement 10: Log and Monitor All Access
# Summary: 10 controls — 8 MAPPED, 1 NEW, 1 MANUAL

invariants:

- id: PCI.10.1
  title: CloudTrail must be enabled in all regions
  pci_requirement: "10.2.1"
  mapped_to_existing: true
  existing_invariant: CIS CTL.CLOUDTRAIL.ENABLED.001
  note: >
    Multi-region trail for complete audit coverage — covered by CIS 3.1.

- id: PCI.10.2
  title: CloudTrail log file validation must be enabled
  pci_requirement: "10.2.1"
  mapped_to_existing: true
  existing_invariant: CIS CTL.CLOUDTRAIL.VALIDATION.001
  note: >
    Log integrity validation — covered by CIS 3.2.

- id: PCI.10.3
  title: CloudTrail logs must be encrypted with KMS
  pci_requirement: "10.5.1"
  mapped_to_existing: true
  existing_invariant: HIPAA CTL.CLOUDTRAIL.ENCRYPT.001
  note: >
    KMS encryption for audit logs — covered by CIS 3.5.

- id: PCI.10.4
  title: S3 access logging must be enabled
  pci_requirement: "10.2.1.3"
  mapped_to_existing: true
  existing_invariant: HIPAA CTL.S3.LOG.001, CTL.S3.AUDIT.OBJECTLEVEL.001
  note: >
    Server access logging + object-level CloudTrail events — covered by HIPAA.

- id: PCI.10.5
  title: CloudWatch monitoring alarms for security events
  pci_requirement: "10.4.1"
  mapped_to_existing: true
  existing_invariant: CIS CTL.CLOUDWATCH.MONITOR.UNAUTH.001, ROOT.001, IAMPOLICY.001, etc.
  note: >
    All 15 CIS 4.x monitoring controls apply to PCI audit requirements.

- id: PCI.10.6
  title: S3 data event logging (read + write)
  pci_requirement: "10.2.1.7"
  mapped_to_existing: true
  existing_invariant: CIS CTL.CLOUDTRAIL.DATAWRITE.001, CTL.CLOUDTRAIL.DATAREAD.001
  note: >
    Object-level read and write logging — covered by CIS 3.8, 3.9.

- id: PCI.10.7
  title: CloudTrail S3 bucket must have access logging
  pci_requirement: "10.5.1"
  mapped_to_existing: true
  existing_invariant: CIS CTL.CLOUDTRAIL.S3LOG.001
  note: >
    Audit log bucket access must be logged — covered by CIS 3.4.

- id: PCI.10.8
  title: VPC flow logging must be enabled
  pci_requirement: "10.2.1"
  mapped_to_existing: true
  existing_invariant: CIS CTL.VPC.FLOWLOG.001
  note: >
    Network traffic logging — covered by CIS 3.7.

- id: PCI.10.9
  title: Log retention must be at least 12 months
  pci_requirement: "10.7"
  description: >
    CloudWatch log groups for CDE audit data must retain logs for at
    least 365 days. PCI requires 12 months of audit trail with at
    least 3 months immediately available for analysis.
  conditions:
    - log_group.has_retention_policy == true
    - log_group.retention_days >= 365
  all_must_pass: true
  severity: high
  remediation: >
    Set retention to at least 365 days: aws logs put-retention-policy
    --log-group-name <name> --retention-in-days 365

- id: PCI.10.10
  title: Regular log review process
  pci_requirement: "10.4.2"
  manual: true
  reason: >
    Log review frequency and process are organizational activities
    that cannot be verified from a configuration snapshot.
  evidence_guidance: >
    Auditors expect documented log review procedures, evidence of
    daily review for critical logs, and escalation records.
