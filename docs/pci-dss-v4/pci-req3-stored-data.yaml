# PCI-DSS v4.0 — Requirement 3: Protect Stored Account Data
# Summary: 6 controls — 5 MAPPED, 1 NEW, 0 MANUAL

invariants:

- id: PCI.3.1
  title: S3 buckets must be encrypted at rest with KMS
  pci_requirement: "3.4.1"
  mapped_to_existing: true
  existing_invariant: HIPAA CTL.S3.ENCRYPT.001, CTL.S3.ENCRYPT.003
  note: >
    SSE enabled (ENCRYPT.001) and KMS CMK required (ENCRYPT.003) —
    covered by HIPAA §164.312(a)(2)(iv).

- id: PCI.3.2
  title: RDS storage encryption must be enabled
  pci_requirement: "3.4.1"
  mapped_to_existing: true
  existing_invariant: HIPAA CTL.RDS.ENCRYPT.001
  note: >
    Storage encryption at rest — covered by HIPAA and CIS 2.3.1.

- id: PCI.3.3
  title: EBS volumes must be encrypted
  pci_requirement: "3.4.1"
  mapped_to_existing: true
  existing_invariant: HIPAA CTL.EC2.EBS.ENCRYPT.001
  note: >
    EBS encryption by default — covered by HIPAA and CIS 2.2.1.

- id: PCI.3.4
  title: KMS key rotation must be enabled
  pci_requirement: "3.6.1"
  mapped_to_existing: true
  existing_invariant: CIS CTL.KMS.ROTATION.001
  note: >
    Automatic key rotation — covered by CIS 3.6.

- id: PCI.3.5
  title: Secrets Manager must use customer-managed KMS key
  pci_requirement: "3.4.1"
  mapped_to_existing: true
  existing_invariant: HIPAA CTL.SECRETSMANAGER.ENCRYPT.001
  note: >
    CMK for key custody during breach response — covered by HIPAA.

- id: PCI.3.6
  title: S3 KMS encryption must use customer-managed key
  pci_requirement: "3.5.1"
  description: >
    S3 buckets in the CDE must use KMS encryption with a customer-managed
    key, not the AWS-managed key. PCI requires key custody — the ability
    to revoke, rotate, and audit key usage independently.
  conditions:
    - storage.encryption.algorithm == "aws:kms"
    - storage.encryption.kms_key_id != ""
    - storage.encryption.kms_key_id does not contain "alias/aws/s3"
  all_must_pass: true
  severity: high
  remediation: >
    Change the default encryption to SSE-KMS with a customer-managed key.
    Note: this is already covered by CTL.S3.ENCRYPT.003 which checks for
    KMS CMK specifically. Tag ENCRYPT.003 with PCI requirement 3.5.1.
