# CIS AWS Foundations Benchmark v3.0 — CloudTrail
# 6 controls

controls:

- id: CIS.CLOUDTRAIL.1
  title: Ensure CloudTrail is enabled in all regions
  cis_control: "3.1"
  cis_level: 1
  description: >
    At least one CloudTrail trail must be configured as multi-region.
    A single-region trail misses API activity in other regions, leaving
    gaps in the audit record for forensic investigation.
  conditions:
    - audit_trail.multi_region_enabled == true
  all_must_pass: true
  severity: critical
  remediation: >
    Update the trail to multi-region:
    aws cloudtrail update-trail --name <trail> --is-multi-region-trail
  stave_control: CTL.CLOUDTRAIL.ENABLED.001

- id: CIS.CLOUDTRAIL.2
  title: Ensure CloudTrail log file validation is enabled
  cis_control: "3.2"
  cis_level: 2
  description: >
    Log file integrity validation must be enabled on all trails.
    Without validation, an attacker who gains access to the log bucket
    can modify or delete entries to cover their tracks with no detection.
  conditions:
    - audit_trail.log_file_validation_enabled == true
  all_must_pass: true
  severity: high
  remediation: >
    Enable validation:
    aws cloudtrail update-trail --name <trail> --enable-log-file-validation
  stave_control: CTL.CLOUDTRAIL.VALIDATION.001

- id: CIS.CLOUDTRAIL.3
  title: Ensure the S3 bucket used to store CloudTrail logs has access logging enabled
  cis_control: "3.4"
  cis_level: 1
  description: >
    The S3 bucket receiving CloudTrail logs must have server access
    logging enabled. Without it, access to the audit logs themselves
    is not auditable — an attacker could read or tamper with logs
    without trace.
  conditions:
    - audit_trail.s3_bucket_logging_enabled == true
  all_must_pass: true
  severity: high
  remediation: >
    Enable access logging on the trail's S3 bucket:
    aws s3api put-bucket-logging --bucket <trail-bucket>
    --bucket-logging-status '{"LoggingEnabled":{"TargetBucket":"<log-bucket>","TargetPrefix":"cloudtrail/"}}'

- id: CIS.CLOUDTRAIL.4
  title: Ensure CloudTrail logs are encrypted at rest using KMS CMKs
  cis_control: "3.5"
  cis_level: 2
  description: >
    CloudTrail logs must be encrypted with a customer-managed KMS key.
    Default SSE-S3 encryption does not allow key revocation during
    breach response, and CMK usage provides an additional audit layer
    via KMS CloudTrail events.
  conditions:
    - audit_trail.encryption.encrypted == true
    - audit_trail.encryption.kms_key_id != ""
  all_must_pass: true
  severity: high
  remediation: >
    Configure KMS encryption on the trail:
    aws cloudtrail update-trail --name <trail> --kms-key-id arn:aws:kms:...
  stave_control: CTL.CLOUDTRAIL.ENCRYPT.001

- id: CIS.CLOUDTRAIL.5
  title: Ensure that Object-level logging for write events is enabled for S3 bucket
  cis_control: "3.8"
  cis_level: 2
  description: >
    CloudTrail must have S3 data event logging enabled for write
    operations (PutObject, DeleteObject). Without object-level logging,
    individual object mutations are invisible to the audit trail.
  conditions:
    - audit_trail.s3_data_events.write_enabled == true
  all_must_pass: true
  severity: high
  remediation: >
    Add S3 data event selectors to the trail:
    aws cloudtrail put-event-selectors --trail-name <trail>
    --advanced-event-selectors '[{"Name":"S3WriteEvents",
    "FieldSelectors":[{"Field":"eventCategory","Equals":["Data"]},
    {"Field":"resources.type","Equals":["AWS::S3::Object"]},
    {"Field":"readOnly","Equals":["false"]}]}]'

- id: CIS.CLOUDTRAIL.6
  title: Ensure that Object-level logging for read events is enabled for S3 bucket
  cis_control: "3.9"
  cis_level: 2
  description: >
    CloudTrail must have S3 data event logging enabled for read
    operations (GetObject). Read logging provides evidence of data
    access for PHI audit trails and breach investigations.
  conditions:
    - audit_trail.s3_data_events.read_enabled == true
  all_must_pass: true
  severity: high
  remediation: >
    Add S3 read data event selectors to the trail:
    aws cloudtrail put-event-selectors --trail-name <trail>
    --advanced-event-selectors '[{"Name":"S3ReadEvents",
    "FieldSelectors":[{"Field":"eventCategory","Equals":["Data"]},
    {"Field":"resources.type","Equals":["AWS::S3::Object"]},
    {"Field":"readOnly","Equals":["true"]}]}]'

# Cross-service dependencies:
# CIS 3.4 — requires S3 bucket logging status for the trail's destination bucket.
#   The extractor must resolve the trail's S3BucketName and check its logging config.
# CIS 3.8, 3.9 — requires CloudTrail event selector configuration
#   (aws cloudtrail get-event-selectors).
# All CloudWatch monitoring controls (4.1–4.15) depend on a CloudTrail trail
#   delivering to a CloudWatch Logs log group.
