# CIS AWS Foundations Benchmark v3.0 — IAM
# 19 automatable controls + 2 MANUAL + 1 PARTIAL

invariants:

# --- Section 1.1–1.3: Account-level (MANUAL) ---

- id: CIS.IAM.1
  title: Maintain current contact details
  cis_control: "1.1"
  cis_level: 1
  description: >
    The AWS account contact details must be kept current so AWS can
    reach the account owner during security events. This is not
    evaluable from a configuration snapshot.
  conditions: []
  all_must_pass: true
  severity: medium
  remediation: >
    Review and update contact details in the AWS Management Console
    under Account Settings.
  status: MANUAL
  manual_reason: >
    Contact detail currency requires human verification. No API
    exposes whether the registered email and phone are still valid.

- id: CIS.IAM.2
  title: Ensure security contact information is registered
  cis_control: "1.2"
  cis_level: 1
  description: >
    A dedicated security contact must be registered so AWS can notify
    the security team directly during abuse or compromise events.
  conditions: []
  all_must_pass: true
  severity: medium
  remediation: >
    Register a security contact in the AWS Management Console under
    Account Settings > Alternate Contacts.
  status: MANUAL
  manual_reason: >
    While the alternate contact API exists (account:GetAlternateContact),
    it requires organizational-level access and does not confirm the
    contact is monitored.

- id: CIS.IAM.3
  title: Ensure security questions are registered in the AWS account
  cis_control: "1.3"
  cis_level: 1
  description: >
    Security questions must be configured for root account password
    recovery. This is a console-only setting with no API access.
  conditions: []
  all_must_pass: true
  severity: medium
  remediation: >
    Configure security questions in the AWS Management Console root
    account settings.
  status: MANUAL
  manual_reason: >
    Security question configuration is console-only. No AWS API exposes
    whether security questions are set.

# --- Section 1.4–1.7: Root account ---

- id: CIS.IAM.4
  title: Ensure no 'root' user account access key exists
  cis_control: "1.4"
  cis_level: 1
  description: >
    The root account must not have access keys. Root access keys
    provide unrestricted access to all AWS resources and cannot be
    constrained by IAM policies or SCPs.
  conditions:
    - identity.root.has_access_keys == false
  all_must_pass: true
  severity: critical
  remediation: >
    Delete root access keys via the IAM console or CLI:
    aws iam delete-access-key --access-key-id AKIA...
  stave_control: CTL.IAM.ROOT.ACCESSKEY.001

- id: CIS.IAM.5
  title: Ensure MFA is enabled for the 'root' user account
  cis_control: "1.5"
  cis_level: 1
  description: >
    The root account must have multi-factor authentication enabled.
    Root is the most privileged identity in the account and MFA
    prevents credential-only compromise.
  conditions:
    - identity.root.mfa_enabled == true
  all_must_pass: true
  severity: critical
  remediation: >
    Enable MFA for root in the IAM console under Security Credentials.
    Use a hardware TOTP device for maximum security.
  stave_control: CTL.IAM.ROOT.MFA.001

- id: CIS.IAM.6
  title: Ensure hardware MFA is enabled for the 'root' user account
  cis_control: "1.6"
  cis_level: 2
  description: >
    The root account must use a hardware MFA device, not a virtual one.
    Hardware tokens cannot be cloned or phished via device compromise,
    providing stronger protection for the most privileged identity.
  conditions:
    - identity.root.mfa_enabled == true
    - identity.root.hardware_mfa == true
  all_must_pass: true
  severity: high
  remediation: >
    Replace the virtual MFA with a hardware TOTP device (e.g. YubiKey,
    Gemalto) in the IAM console under Security Credentials.

- id: CIS.IAM.7
  title: Eliminate use of the 'root' user for administrative and daily tasks
  cis_control: "1.7"
  cis_level: 1
  description: >
    The root account must not be used for day-to-day operations. Root
    activity should be limited to account setup tasks that require it.
    Recent root usage indicates operational reliance on root.
  conditions:
    - identity.root.last_used_days > 90
  all_must_pass: true
  severity: high
  remediation: >
    Create IAM admin users or roles for daily operations. Lock root
    credentials and use them only for account-level tasks.

# --- Section 1.8–1.9: Password policy ---

- id: CIS.IAM.8
  title: Ensure IAM password policy requires minimum length of 14 or greater
  cis_control: "1.8"
  cis_level: 1
  description: >
    The account password policy must require a minimum password length
    of at least 14 characters. Short passwords are susceptible to brute
    force attacks.
  conditions:
    - identity.password_policy.minimum_length >= 14
  all_must_pass: true
  severity: medium
  remediation: >
    Update the password policy: aws iam update-account-password-policy
    --minimum-password-length 14
  stave_control: CTL.IAM.PASSWORD.LENGTH.001

- id: CIS.IAM.9
  title: Ensure IAM password policy prevents password reuse
  cis_control: "1.9"
  cis_level: 1
  description: >
    The account password policy must prevent reuse of at least the
    last 24 passwords. Reuse allows credential stuffing from previously
    compromised password databases.
  conditions:
    - identity.password_policy.reuse_prevention_count >= 24
  all_must_pass: true
  severity: medium
  remediation: >
    Update the password policy: aws iam update-account-password-policy
    --password-reuse-prevention 24
  stave_control: CTL.IAM.PASSWORD.REUSE.001

# --- Section 1.10–1.15: User credentials ---

- id: CIS.IAM.10
  title: Ensure MFA is enabled for all IAM users that have a console password
  cis_control: "1.10"
  cis_level: 1
  description: >
    Every IAM user with console access must have MFA enabled. Console
    access without MFA relies solely on password, which may be phished
    or leaked.
  conditions:
    - identity.console_access.enabled == true
    - identity.console_access.mfa_enabled == true
  all_must_pass: true
  severity: high
  remediation: >
    Enable MFA for each console user via the IAM console or instruct
    users to self-configure MFA under My Security Credentials.
  stave_control: CTL.IAM.CONSOLE.MFA.001

- id: CIS.IAM.11
  title: Do not setup access keys during initial user setup
  cis_control: "1.11"
  cis_level: 1
  description: >
    Access keys should not be created at user creation time. Keys
    created during setup are often distributed insecurely and may
    not be needed. Create keys only when a specific use case requires
    programmatic access.
  conditions:
    - identity.access_keys.created_at_setup == false
  all_must_pass: true
  severity: medium
  remediation: >
    Delete access keys created at user setup time. Create new keys
    only when programmatic access is specifically required.
  status: PARTIAL
  partial_reason: >
    Evaluated heuristically by comparing access key creation date
    to user creation date. Exact match indicates setup-time creation.

- id: CIS.IAM.12
  title: Ensure credentials unused for 45 days or greater are disabled
  cis_control: "1.12"
  cis_level: 1
  description: >
    IAM credentials (passwords and access keys) unused for 45 or more
    days must be disabled. Dormant credentials are a lateral movement
    vector if the associated user account is compromised.
  conditions:
    - identity.credentials.unused_days < 45
  all_must_pass: true
  severity: medium
  remediation: >
    Disable inactive access keys and console passwords:
    aws iam update-access-key --status Inactive --access-key-id AKIA...
  stave_control: CTL.IAM.CRED.UNUSED.001

- id: CIS.IAM.13
  title: Ensure there is only one active access key available for any single IAM user
  cis_control: "1.13"
  cis_level: 1
  description: >
    Each IAM user must have at most one active access key. Multiple
    active keys increase the attack surface and complicate key rotation
    audits.
  conditions:
    - identity.access_keys.active_count <= 1
  all_must_pass: true
  severity: medium
  remediation: >
    Deactivate and delete the extra access key:
    aws iam update-access-key --status Inactive --access-key-id AKIA...
    aws iam delete-access-key --access-key-id AKIA...

- id: CIS.IAM.14
  title: Ensure access keys are rotated every 90 days or less
  cis_control: "1.14"
  cis_level: 1
  description: >
    All active access keys must have been rotated within the last 90
    days. Stale keys accumulate risk as they may have been exposed in
    logs, code repositories, or shared environments.
  conditions:
    - identity.access_keys.has_stale_key == false
  all_must_pass: true
  severity: medium
  remediation: >
    Create a new access key, update all consumers, then delete the old
    key: aws iam create-access-key && aws iam delete-access-key
  stave_control: CTL.IAM.CRED.ROTATION.001

- id: CIS.IAM.15
  title: Ensure IAM Users Receive Permissions Only Through Groups
  cis_control: "1.15"
  cis_level: 1
  description: >
    IAM users must not have inline policies or directly attached managed
    policies. All permissions should be assigned through IAM groups to
    ensure consistent governance and auditability.
  conditions:
    - identity.policies.has_inline_policies == false
    - identity.policies.has_direct_policies == false
  all_must_pass: true
  severity: medium
  remediation: >
    Move inline and directly attached policies to IAM groups. Add the
    user to the appropriate groups and remove direct policy attachments.
  stave_control: CTL.IAM.POLICY.INLINE.001, CTL.IAM.POLICY.DIRECT.001

# --- Section 1.16–1.19: Policy and certificate hygiene ---

- id: CIS.IAM.16
  title: Ensure IAM policies that allow full "*:*" administrative privileges are not attached
  cis_control: "1.16"
  cis_level: 1
  description: >
    No IAM policy with Effect Allow on Action "*" and Resource "*"
    should be attached to any IAM entity. Full admin policies violate
    least privilege and grant unrestricted access to all services.
  conditions:
    - identity.policies.has_admin_access == false
  all_must_pass: true
  severity: critical
  remediation: >
    Replace wildcard admin policies with scoped policies that grant
    only the specific permissions required. Use AWS Access Analyzer
    to generate least-privilege policies from CloudTrail activity.

- id: CIS.IAM.17
  title: Ensure a support role has been created to manage incidents with AWS Support
  cis_control: "1.17"
  cis_level: 1
  description: >
    At least one IAM entity must have the AWSSupportAccess managed
    policy attached. This ensures someone can open support cases
    during security incidents without using root.
  conditions:
    - identity.support_role.exists == true
  all_must_pass: true
  severity: medium
  remediation: >
    Create an IAM role with the AWSSupportAccess policy:
    aws iam attach-role-policy --role-name SupportRole
    --policy-arn arn:aws:iam::aws:policy/AWSSupportAccess

- id: CIS.IAM.19
  title: Ensure that all the expired SSL/TLS certificates stored in AWS IAM are removed
  cis_control: "1.19"
  cis_level: 1
  description: >
    Expired server certificates must be removed from IAM. Expired
    certificates cannot be used for TLS but create confusion during
    audits and may mask missing certificate rotation.
  conditions:
    - identity.certificates.has_expired == false
  all_must_pass: true
  severity: medium
  remediation: >
    Delete expired certificates: aws iam delete-server-certificate
    --server-certificate-name <name>. Migrate active certificates
    to AWS Certificate Manager (ACM).

# --- Section 1.21–1.22: Organizational ---

- id: CIS.IAM.21
  title: Ensure IAM users are managed centrally via identity federation or AWS Organizations
  cis_control: "1.21"
  cis_level: 2
  description: >
    Multi-account environments should use identity federation (SSO/SAML)
    or AWS Organizations for centralized user management rather than
    per-account IAM users.
  conditions: []
  all_must_pass: true
  severity: medium
  remediation: >
    Implement AWS IAM Identity Center (SSO) or SAML federation.
    Migrate per-account IAM users to federated identities.
  status: MANUAL
  manual_reason: >
    Whether identity is centrally managed is an organizational design
    decision that cannot be determined from a single account snapshot.

- id: CIS.IAM.22
  title: Ensure access to AWSCloudShellFullAccess is restricted
  cis_control: "1.22"
  cis_level: 1
  description: >
    The AWSCloudShellFullAccess managed policy should not be attached
    to any IAM entity unless specifically required. CloudShell provides
    a browser-based shell with the caller's IAM permissions, which can
    bypass network-level controls.
  conditions:
    - identity.policies.cloudshell_unrestricted == false
  all_must_pass: true
  severity: medium
  remediation: >
    Detach AWSCloudShellFullAccess from all IAM users, groups, and
    roles that do not require it. Use a scoped CloudShell policy
    if partial access is needed.

# --- Cross-service dependencies ---
# CIS 1.18 (instance roles) requires EC2 instance data — see cis-ec2.yaml
# CIS 1.16 (admin policies) requires reading IAM policy documents
# CIS 1.17 (support role) requires listing entities for AWSSupportAccess policy ARN
# CIS 1.22 (CloudShell) requires listing entities for AWSCloudShellFullAccess policy ARN
