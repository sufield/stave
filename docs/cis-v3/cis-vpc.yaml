# CIS AWS Foundations Benchmark v3.0 — VPC
# 5 automatable + 1 MANUAL + 1 cross-service (KMS)

controls:

- id: CIS.VPC.1
  title: Ensure rotation for customer-created symmetric CMKs is enabled
  cis_control: "3.6"
  cis_level: 2
  description: >
    Customer-created symmetric KMS keys must have automatic key rotation
    enabled. Key rotation limits the amount of data encrypted with a
    single key version, reducing the blast radius of key compromise.
  conditions:
    - cryptography.kind == "key"
    - cryptography.key_rotation_enabled == true
  all_must_pass: true
  severity: medium
  remediation: >
    Enable key rotation:
    aws kms enable-key-rotation --key-id <key-id>

- id: CIS.VPC.2
  title: Ensure VPC flow logging is enabled in all VPCs
  cis_control: "3.7"
  cis_level: 2
  description: >
    Every VPC must have flow logging enabled. Flow logs capture IP
    traffic metadata (source, destination, ports, action) for security
    analysis, intrusion detection, and forensic investigation.
  conditions:
    - network.kind == "vpc"
    - network.flow_log.enabled == true
  all_must_pass: true
  severity: high
  remediation: >
    Enable flow logs for the VPC:
    aws ec2 create-flow-logs --resource-type VPC --resource-ids <vpc-id>
    --traffic-type ALL --log-destination-type cloud-watch-logs
    --log-group-name vpc-flow-logs
  stave_control: CTL.VPC.FLOWLOG.001

- id: CIS.VPC.3
  title: Ensure no Network ACLs allow ingress from 0.0.0.0/0 to remote server administration ports
  cis_control: "5.1"
  cis_level: 1
  description: >
    Network ACLs must not allow inbound traffic from 0.0.0.0/0 or
    ::/0 to SSH (22) or RDP (3389) ports. NACLs are stateless and
    apply to the entire subnet — open admin ports expose all instances
    in the subnet.
  conditions:
    - network.kind == "nacl"
    - network.nacl.allows_admin_from_internet == false
  all_must_pass: true
  severity: high
  remediation: >
    Replace the 0.0.0.0/0 allow rule with a specific CIDR for
    authorized admin IP ranges:
    aws ec2 replace-network-acl-entry --network-acl-id <nacl-id>
    --ingress --rule-number <n> --cidr-block <admin-cidr>
    --port-range From=22,To=22 --protocol tcp --rule-action allow

- id: CIS.VPC.4
  title: Ensure no security groups allow ingress from 0.0.0.0/0 to remote server administration ports
  cis_control: "5.2"
  cis_level: 1
  description: >
    Security groups must not allow inbound SSH (22) or RDP (3389)
    from 0.0.0.0/0. Open admin ports are the most common entry point
    for automated attack tools scanning the internet.
  conditions:
    - network.kind == "security_group"
    - network.has_unrestricted_ingress == false
  all_must_pass: true
  severity: critical
  remediation: >
    Restrict the SG ingress rule to specific CIDR blocks:
    aws ec2 revoke-security-group-ingress --group-id <sg-id>
    --protocol tcp --port 22 --cidr 0.0.0.0/0
  stave_control: CTL.VPC.SG.UNRESTRICTED.001

- id: CIS.VPC.5
  title: Ensure no security groups allow ingress from ::/0 to remote server administration ports
  cis_control: "5.3"
  cis_level: 1
  description: >
    Security groups must not allow inbound SSH (22) or RDP (3389)
    from ::/0 (IPv6 any). IPv6 open admin ports are equally dangerous
    as IPv4 and are often overlooked during security reviews.
  conditions:
    - network.kind == "security_group"
    - network.has_unrestricted_ipv6_ingress == false
  all_must_pass: true
  severity: critical
  remediation: >
    Restrict IPv6 SG ingress rules to specific prefixes:
    aws ec2 revoke-security-group-ingress --group-id <sg-id>
    --ip-permissions IpProtocol=tcp,FromPort=22,ToPort=22,Ipv6Ranges=[{CidrIpv6=::/0}]

- id: CIS.VPC.6
  title: Ensure the default security group of every VPC restricts all traffic
  cis_control: "5.4"
  cis_level: 2
  description: >
    The default security group in every VPC must have no inbound or
    outbound rules. AWS creates a default SG with an allow-all
    self-referencing rule. Any resource accidentally placed in the
    default SG inherits unintended access.
  conditions:
    - network.kind == "security_group"
    - network.is_default == true
    - network.allows_all_traffic == false
  all_must_pass: true
  severity: medium
  remediation: >
    Remove all inbound and outbound rules from the default SG:
    aws ec2 revoke-security-group-ingress --group-id <sg-id> --protocol all --port all --source-group <sg-id>
    aws ec2 revoke-security-group-egress --group-id <sg-id> --protocol all --port all --cidr 0.0.0.0/0
  stave_control: CTL.VPC.SG.DEFAULT.001

- id: CIS.VPC.7
  title: Ensure routing tables for VPC peering are "least access"
  cis_control: "5.5"
  cis_level: 2
  description: >
    VPC peering route tables should route only the minimum required
    CIDR ranges, not the entire peered VPC CIDR. Overly broad routing
    exposes services not intended to be reachable across the peering.
  conditions: []
  all_must_pass: true
  severity: medium
  remediation: >
    Review peering route entries and replace the full peered VPC CIDR
    with the specific subnet CIDRs that need cross-VPC access.
  status: MANUAL
  manual_reason: >
    Determining "least access" requires understanding the intended
    communication pattern between peered VPCs. A static snapshot shows
    route CIDRs but cannot determine whether they exceed the intended
    scope without business context.

# Cross-service dependencies:
# CIS 3.6 (KMS rotation) — this is a KMS control grouped in the logging
#   section. Requires kms:GetKeyRotationStatus for each CMK.
# CIS 5.1 (NACLs) — requires ec2:DescribeNetworkAcls. The observation
#   needs a new asset type: aws_network_acl with network.kind = "nacl".
# CIS 5.2, 5.3 (security groups) — IPv4 is covered by existing SG
#   controls; IPv6 requires a new property: has_unrestricted_ipv6_ingress.
