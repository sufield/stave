# CIS AWS Foundations Benchmark v3.0 — EC2
# 3 controls

invariants:

- id: CIS.EC2.1
  title: Ensure EBS Volume Encryption is Enabled in all Regions
  cis_control: "2.2.1"
  cis_level: 1
  description: >
    EBS volume encryption must be enabled by default in all regions.
    When enabled by default, new EBS volumes and snapshots are
    automatically encrypted without requiring explicit configuration
    per volume.
  conditions:
    - compute.encryption.ebs_encrypted == true
  all_must_pass: true
  severity: high
  remediation: >
    Enable EBS encryption by default in each region:
    aws ec2 enable-ebs-encryption-by-default --region <region>
  stave_control: CTL.EC2.EBS.ENCRYPT.001

- id: CIS.EC2.2
  title: Ensure IAM instance roles are used for AWS resource access from instances
  cis_control: "1.18"
  cis_level: 2
  description: >
    EC2 instances that access AWS services must use IAM instance
    profiles (roles) instead of embedded access keys. Instance roles
    provide temporary credentials that are automatically rotated,
    eliminating long-lived credential exposure.
  conditions:
    - compute.kind == "instance"
    - compute.iam_profile_attached == true
  all_must_pass: true
  severity: medium
  remediation: >
    Create an IAM role with the required permissions and attach it
    to the instance: aws ec2 associate-iam-instance-profile
    --iam-instance-profile Name=<role> --instance-id <id>

- id: CIS.EC2.3
  title: Ensure that EC2 Metadata Service only allows IMDSv2
  cis_control: "5.6"
  cis_level: 1
  description: >
    EC2 instances must be configured to require Instance Metadata
    Service Version 2 (IMDSv2). IMDSv1 is vulnerable to SSRF attacks
    that can extract instance credentials from the metadata endpoint.
  conditions:
    - compute.network.imdsv2_required == true
  all_must_pass: true
  severity: high
  remediation: >
    Require IMDSv2 on all instances:
    aws ec2 modify-instance-metadata-options --instance-id <id>
    --http-tokens required --http-endpoint enabled
  stave_control: CTL.EC2.IMDSV2.001

# Cross-service dependencies:
# CIS 1.18 (instance roles) — this is an IAM control evaluated on EC2
#   instances. The observation must include the IamInstanceProfile from
#   ec2:DescribeInstances.
# CIS 2.2.1 (EBS default encryption) — requires ec2:GetEbsEncryptionByDefault
#   per region, which is an account-level setting, not per-instance.
