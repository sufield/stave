[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stave-solver"
version = "0.1.0"
description = "Z3-backed solver for the Stave Intermediate Representation. Consumes SIR JSON via stdin, emits Stave-format findings via stdout."
requires-python = ">=3.11"
dependencies = [
    "z3-solver>=4.13",
]

[project.scripts]
stave-solver = "stave_solver.main:main"

[tool.setuptools.packages.find]
include = ["stave_solver*"]
