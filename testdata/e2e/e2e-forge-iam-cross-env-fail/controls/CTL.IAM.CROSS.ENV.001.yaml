dsl_version: ctrl.v1
id: CTL.IAM.CROSS.ENV.001
name: Non-Production Must Not Access Production Resources
description: >
  IAM roles in non-production environments (test, staging, QA) must
  not have access to production resources. Cross-environment access
  collapses security boundaries — a compromised test account becomes
  a path to production data. The Microsoft breach (2024) demonstrated
  this exact failure: a test tenant with production-scope grants
  enabled a nation-state actor to pivot from test to production.
domain: identity
severity: critical
compliance:
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  nist_800_53_r5: "AC-4"
  fedramp_moderate: "AC-4"
  iso_27001_2022: "A.8.22"
  ccm_v4: ["IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
type: unsafe_state
params:
  attack_stage: lateral_movement
remediation:
  description: >
    Non-production IAM role has access to production resources.
    Security boundary between environments is collapsed.
  action: >
    Remove production resource ARNs from non-production role policies.
    Use separate AWS accounts for prod and non-prod with no cross-
    account trust. Enforce environment boundaries via SCPs that deny
    non-prod accounts from accessing prod resources. Tag all accounts
    and roles with their environment classification.
  example: |
    {
      "identity": {
        "kind": "role",
        "role": {
          "cross_env_prod_access": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.role.cross_env_prod_access
      op: eq
      value: true
