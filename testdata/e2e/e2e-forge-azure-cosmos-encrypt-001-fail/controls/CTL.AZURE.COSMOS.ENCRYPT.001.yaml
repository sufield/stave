dsl_version: ctrl.v1
id: CTL.AZURE.COSMOS.ENCRYPT.001
name: Cosmos DB Must Use Customer-Managed Key
description: >
  Cosmos DB uses service-managed encryption without Key Vault integration.
domain: encryption
severity: medium
compliance:
  nist_800_53_r5: "SC-28"
  soc2: "CC6.1"
  ccm_v4: ["CEK-03"]
scope_tags: [azure]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Cosmos DB Must Use Customer-Managed Key — finding detected.
  action: Remediate per control description.
  example: |
    {"azure": {"database": {"kind": "cosmosdb_account", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.azure.database.kind
      op: eq
      value: cosmosdb_account
    - field: properties.azure.database.cosmos.uses_cmk
      op: eq
      value: false
