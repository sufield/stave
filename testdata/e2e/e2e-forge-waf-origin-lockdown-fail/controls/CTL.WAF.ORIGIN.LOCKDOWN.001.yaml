dsl_version: ctrl.v1
id: CTL.WAF.ORIGIN.LOCKDOWN.001
name: WAF Origin Must Not Accept Direct Internet Traffic
description: >
  When a WAF Web ACL is associated with an origin server (ALB, API Gateway,
  EC2 instance), the origin's network ingress controls must not permit
  inbound connections on application ports from the public internet. A WAF
  that sits in front of an origin provides zero protection if the origin
  also accepts direct connections from 0.0.0.0/0 or ::/0 — an attacker
  who discovers the origin IP address through Censys, Shodan, certificate
  transparency logs, historical DNS records, or timing analysis can send
  traffic directly to the origin, bypassing every WAF rule, DDoS
  protection, and rate limit. This is the architectural prerequisite for
  all other WAF controls — without origin lockdown, the entire WAF safety
  envelope is irrelevant regardless of how well the WAF rules are
  configured. HackerOne report (Linode) documents this exact pattern: an
  origin behind Cloudflare was discoverable via Censys, allowing direct
  unfiltered payload delivery and denial-of-service against the
  unprotected origin.
domain: exposure
severity: critical
compliance:
  nist_800_53_r5: "SC-7"
  fedramp_moderate: "SC-7"
  pci_dss_v4.0: "1.3.1"
  soc2: "CC6.6"
  hipaa: "164.312(e)(1)"
scope_tags:
  - aws
  - waf
type: unsafe_state
params:
  base_impact: 10
  attack_stage: initial_access
  blast_radius:
    type: detection
    scope: account
    multiplier: 2.5
remediation:
  description: >
    The WAF Web ACL's associated origin server accepts direct inbound
    traffic from the public internet on application ports. Security group
    or NACL rules permit 0.0.0.0/0 or ::/0 ingress, allowing attackers
    to bypass the WAF entirely by connecting directly to the origin IP.
    Origin IPs are routinely discoverable through Censys, Shodan,
    certificate transparency logs, and historical DNS records.
  action: >
    Restrict the origin's security group inbound rules on application
    ports (80, 443, custom) to allow traffic only from WAF or CDN
    provider IP ranges. For CloudFront, use the AWS-managed prefix list
    com.amazonaws.global.cloudfront.origin-facing in the security group
    rule. For regional ALBs behind AWS WAF, restrict to the WAF endpoint
    subnet CIDRs. Remove all 0.0.0.0/0 and ::/0 ingress rules on
    application ports.
  example: |
    {
      "waf": {
        "kind": "web_acl",
        "origin_lockdown": {
          "allows_direct_ingress": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.waf.kind
      op: eq
      value: web_acl
    - field: properties.waf.origin_lockdown.allows_direct_ingress
      op: eq
      value: true
