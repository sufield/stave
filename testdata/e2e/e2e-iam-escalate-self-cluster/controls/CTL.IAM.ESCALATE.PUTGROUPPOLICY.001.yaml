dsl_version: ctrl.v1
id: CTL.IAM.ESCALATE.PUTGROUPPOLICY.001
name: Principal Must Not Escalate via iam:PutGroupPolicy On A Belonging Group
description: >
  A principal with `iam:PutGroupPolicy` whose Resource field includes
  a group the principal belongs to can write an arbitrary inline
  policy onto that group. Every member of the group — including the
  principal — inherits the inline policy immediately. This is Rhino
  Security Labs privilege-escalation technique #4 ("IAM — Put inline
  policy on group"). Mirrors PUTUSERPOLICY but via the group hop.

  Scope: gated on `identity.kind == "user"`. IAM groups are a
  user-only concept — roles cannot belong to groups. No role-side
  analogue exists because AWS IAM does not have role groups.
domain: identity
severity: critical
compliance:
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  nist_800_53_r5: "AC-6(5)"
  fedramp_moderate: "AC-6(5)"
  iso_27001_2022: "A.8.3"
  ccm_v4: ["IAM-02", "IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
type: unsafe_state
classification: state_assertion
params:
  attack_stage: privilege_escalation
  base_impact: 10
  blast_radius:
    type: prevention
    scope: account
    multiplier: 2.5
observation_fields:
  - identity.kind
  - identity.escalation.put_group_policy.present
  - identity.escalation.put_group_policy.target_group
  - identity.escalation.put_group_policy.resource_scope
remediation:
  description: >
    Principal has `iam:PutGroupPolicy` reaching a group it belongs to.
    Authoring an inline policy granting `"Action": "*"` on
    `"Resource": "*"` on that group elevates every member to admin,
    including the principal.
  action: >
    Scope `iam:PutGroupPolicy` to groups the principal does not belong
    to, or remove the permission from non-admin principals. SCP-level
    deny on `iam:PutGroupPolicy` where the target group contains the
    calling principal closes the path.
  example: |
    {
      "identity": {
        "kind": "user",
        "escalation": {
          "put_group_policy": {
            "present": false
          }
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: user
    - field: properties.identity.escalation.put_group_policy.present
      op: eq
      value: true
