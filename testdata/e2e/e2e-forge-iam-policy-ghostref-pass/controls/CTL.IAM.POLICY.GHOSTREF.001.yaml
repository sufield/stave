dsl_version: ctrl.v1
id: CTL.IAM.POLICY.GHOSTREF.001
name: IAM Policies Must Not Reference Non-Existent Resources
description: >
  Detects assets where has_ghost_resource_refs is eq true.
domain: identity
severity: high
scope_tags:
  - aws
  - iam
type: unsafe_state
params: {}
remediation:
  description: >
    Detects assets where has_ghost_resource_refs is eq true.
  action: >
    Remove or update Allow statements that reference ARNs for non-existent resources.
unsafe_predicate:
  all:
    - field: properties.identity.policy.has_ghost_resource_refs
      op: eq
      value: true
