dsl_version: ctrl.v1
id: CTL.GCP.GKE.WORKLOAD.001
name: GKE Workload Identity Not Enabled
description: >
  Workload Identity not enabled. Pods use the node's service account
  via the metadata server — all pods on a node share the same GCP
  credentials. Compromise of any pod exposes the node SA.
domain: identity
severity: high
compliance:
  cis_gcp_v3: "7.2"
  nist_800_53_r5: "AC-6"
  pci_dss_v4: "7.2.1"
  soc2: "CC6.1"
scope_tags: [gcp]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: GKE Workload Identity Not Enabled — finding detected.
  action: Enable Workload Identity for per-pod GCP credential scoping.
  example: |
    {"gcp": {"compute": {"kind": "gke_cluster", "gke": {"workload_identity_enabled": true}}}}
unsafe_predicate:
  all:
    - field: properties.gcp.compute.kind
      op: eq
      value: gke_cluster
    - field: properties.gcp.compute.gke.workload_identity_enabled
      op: eq
      value: false
