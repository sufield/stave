dsl_version: ctrl.v1
id: CTL.NEPTUNE.ENCRYPT.REST.001
name: Neptune Clusters Must Have Encryption at Rest
description: Neptune clusters must encrypt data at rest with KMS.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: SC-28
  soc2: CC6.7
  pci_dss_v4.0: 3.4.1
  ccm_v4:
  - CEK-03
scope_tags:
- aws
- neptune
type: unsafe_state
classification: state_assertion
params:
  attack_stage: exfiltration
remediation:
  description: Enable encryption.
  action: Enable encryption. Requires creating a new encrypted cluster.
unsafe_predicate:
  all:
  - field: properties.database.kind
    op: eq
    value: neptune_cluster
  - field: properties.database.encryption.at_rest_enabled
    op: eq
    value: false
