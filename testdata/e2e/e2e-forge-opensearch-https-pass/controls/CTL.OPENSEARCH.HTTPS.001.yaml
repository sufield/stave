dsl_version: ctrl.v1
id: CTL.OPENSEARCH.HTTPS.001
name: HTTPS Must Be Enforced
description: >
  OpenSearch domains must enforce HTTPS for all connections. Without
  HTTPS enforcement, clients can connect over unencrypted HTTP,
  exposing queries, results, and credentials in transit.
domain: exposure
severity: high
compliance:
  hipaa: "164.312(e)(1)"
  soc2: "CC6.7"
  pci_dss_v4.0: "4.2.1"
  nist_800_53_r5: "SC-8"
  fedramp_moderate: "SC-8"
  ccm_v4: ["CEK-03", "DSP-10"]
scope_tags:
  - aws
  - opensearch
type: unsafe_state
params:
  attack_stage: exfiltration
remediation:
  description: >
    OpenSearch domain does not enforce HTTPS. Clients can connect
    over unencrypted HTTP.
  action: >
    Enable HTTPS enforcement in the domain endpoint options. Set
    the TLS security policy to Policy-Min-TLS-1-2-PFS-2023-10
    for current best practice.
  example: |
    {
      "search_service": {
        "kind": "domain",
        "transport": {
          "https_enforced": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.search_service.kind
      op: eq
      value: domain
    - field: properties.search_service.transport.https_enforced
      op: eq
      value: false
