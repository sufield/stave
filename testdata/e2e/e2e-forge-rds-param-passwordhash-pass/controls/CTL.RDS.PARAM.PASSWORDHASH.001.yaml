dsl_version: ctrl.v1
id: CTL.RDS.PARAM.PASSWORDHASH.001
name: PostgreSQL RDS Instances Must Use scram-sha-256 Password Hashing
description: >
  PostgreSQL RDS instances must set the password_encryption
  parameter to scram-sha-256, not md5. MD5 password hashing on
  PostgreSQL is unsalted (a static deterministic hash of the
  password and the username), which makes large-scale rainbow
  table lookups effective against any database whose pg_authid
  contents leak — a scenario that includes routine pg_dump
  artifacts, replication snapshots, and cross-account snapshot
  sharing. scram-sha-256 (RFC 5802 / RFC 7677, supported since
  PostgreSQL 10) introduces per-user salts, iterative hashing,
  and a challenge-response authentication exchange that does not
  expose the password hash to the network. The parameter governs
  every new password set after the change; existing MD5 hashes
  are converted on the next password rotation. The control fires
  only on PostgreSQL engines (a no-op for MySQL / SQL Server /
  Oracle).
domain: encryption
severity: medium
compliance:
  nist_800_53_r5: "IA-5"
  pci_dss_v4: "8.3"
  ccm_v4: ["IAM-08", "CEK-03"]
scope_tags: [aws, rds]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_theft
remediation:
  description: PostgreSQL RDS instance has password_encryption set to md5.
  action: Set password_encryption to scram-sha-256 in the parameter group and rotate user passwords.
  example: |
    {"database": {"kind": "rds_instance", "engine": "postgres", "parameters": {"password_encryption": "scram-sha-256"}}}
unsafe_predicate:
  all:
    - field: properties.database.kind
      op: eq
      value: rds_instance
    - field: properties.database.engine
      op: eq
      value: postgres
    - field: properties.database.parameters.password_encryption_weak
      op: eq
      value: true
