dsl_version: ctrl.v1
id: CTL.EC2.SG.UNUSED.001
name: Unused Security Groups Must Be Removed
description: 'Security groups with no attached resources should be removed.
  Unused SGs with broad rules are latent risks — when accidentally attached,
  the broad rules take effect immediately.

  '
domain: network
severity: medium
compliance:
  nist_800_53_r5: CM-7
  soc2: CC6.1
  ccm_v4:
  - IVS-03
scope_tags:
- aws
- ec2
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Security group has no attached resources.
  action: 'Delete the unused security group, or if retention is needed, remove
    all ingress and egress rules to eliminate latent risk.

    '
unsafe_predicate:
  all:
  - field: properties.network.kind
    op: eq
    value: security_group
  - field: properties.network.security_group.is_unused
    op: eq
    value: true
defect: 'The security group has no attached resources (zero network interfaces).
  Its rules are inactive but persist.

  '
infection: 'An unused security group with broad ingress rules is a latent
  risk. When attached to a new resource — through IaC misconfiguration or
  manual error — the broad rules take effect immediately without review. The
  resource inherits exposure the operator may not be aware of.

  '
failure: 'Accidental exposure. A resource attached to a dormant security group
  with broad rules becomes reachable from the internet without any deliberate
  change to the security group itself.

  '
