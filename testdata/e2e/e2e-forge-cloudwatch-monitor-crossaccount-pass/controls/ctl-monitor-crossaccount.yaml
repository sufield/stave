dsl_version: ctrl.v1
id: CTL.CLOUDWATCH.MONITOR.CROSSACCOUNT.001
name: Cross-Account AssumeRole Events Must Be Monitored
description: >
  Must monitor cross-account AssumeRole events.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "AU-12"
  ccm_v4: ["LOG-03", "LOG-05"]
scope_tags: [aws, cloudwatch, iam]
type: unsafe_state
classification: state_assertion
defect: >
  No metric filter detects cross-account AssumeRole events.
infection: >
  Cross-account access proceeds unmonitored.
failure: >
  Undetected cross-account access from external principals.
params:
  attack_stage: detection_evasion
remediation:
  description: No metric filter for cross-account AssumeRole.
  action: Create metric filter matching cross-account AssumeRole events.
unsafe_predicate:
  all:
    - field: properties.monitoring.metric_filters.cross_account_assume_role.exists
      op: eq
      value: false
