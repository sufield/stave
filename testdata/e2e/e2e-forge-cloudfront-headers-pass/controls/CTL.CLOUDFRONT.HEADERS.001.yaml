dsl_version: ctrl.v1
id: CTL.CLOUDFRONT.HEADERS.001
name: CloudFront Distributions Must Enforce Security Response Headers
description: >
  CloudFront distributions must have a response headers policy attached
  that includes Strict-Transport-Security (HSTS) with max-age >= 31536000,
  X-Frame-Options set to DENY or SAMEORIGIN, X-Content-Type-Options set
  to nosniff, and Referrer-Policy set to a restrictive value. Without
  these headers, browsers do not enforce transport security, framing
  protection, MIME type enforcement, or referrer leakage prevention.
  Content-Security-Policy (CSP) is not required — it requires
  application-specific source definitions outside Stave's scope. This
  pairs with CTL.CLOUDFRONT.TLS.001: TLS enforces encrypted transport,
  response headers enforce browser-layer security.
domain: exposure
severity: low
compliance:
  nist_800_53_r5: "SC-8"
  fedramp_moderate: "SC-8"
  pci_dss_v4.0: "6.4.1"
  soc2: "CC6.6"
  ccm_v4: ["AIS-04", "DSP-10"]
scope_tags:
  - aws
  - cloudfront
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: >
    CloudFront distribution has no response headers policy or the policy
    is missing one or more required security headers.
  action: >
    Create or update a response headers policy with the four required
    headers: Strict-Transport-Security (max-age=31536000; includeSubDomains),
    X-Frame-Options (DENY or SAMEORIGIN), X-Content-Type-Options (nosniff),
    and Referrer-Policy (strict-origin-when-cross-origin or no-referrer).
    Attach the policy to the distribution via the CloudFront console or
    UpdateDistribution API.
  example: |
    {
      "cdn": {
        "kind": "distribution",
        "security_headers": {
          "all_required_present": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.cdn.kind
      op: eq
      value: distribution
    - field: properties.cdn.security_headers.all_required_present
      op: eq
      value: false
