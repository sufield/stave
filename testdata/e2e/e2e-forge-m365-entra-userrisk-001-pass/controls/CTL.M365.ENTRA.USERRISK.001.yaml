dsl_version: ctrl.v1
id: CTL.M365.ENTRA.USERRISK.001
name: User Risk Policy Not Enabled
description: >
  Compromised users not forced to change password or blocked.
domain: identity
severity: high
compliance:
  cis_m365_v4: "2.2"
  nist_800_53_r5: "AC-7"
  soc2: "CC6.1"
scope_tags: [m365]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: User Risk Policy Not Enabled — finding detected.
  action: Remediate per control description.
  example: |
    {"m365": {"identity": {"kind": "entra_config", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.m365.identity.kind
      op: eq
      value: entra_config
    - field: properties.m365.identity.user_risk_policy_enabled
      op: eq
      value: false
