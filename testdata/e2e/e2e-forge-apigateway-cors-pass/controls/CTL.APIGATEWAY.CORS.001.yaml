dsl_version: ctrl.v1
id: CTL.APIGATEWAY.CORS.001
name: HTTP APIs Must Not Combine Wildcard Origin With Credentials
description: >
  API Gateway v2 HTTP APIs expose CORS configuration at the API level.
  Setting AllowOrigins to "*" together with AllowCredentials=true is
  the canonical CORS misconfiguration: browsers reject the combination
  at request time, so the configuration never succeeds for real clients,
  but the intent encoded in the resource is credentialed cross-origin
  access from any origin. This typically indicates the API owner
  intended to allow a broad set of web clients to make credentialed
  calls and did not understand that wildcard-plus-credentials is
  rejected. Real attackers do not need this misconfiguration to be
  functional — its presence signals that the origin allowlist and
  credentials policy have not been reasoned about together. The
  observation shape mirrors the CorsConfiguration object returned by
  "aws apigatewayv2 get-api".
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "AC-4"
  fedramp_moderate: "AC-4"
  pci_dss_v4.0: "6.4.1"
  soc2: "CC6.1"
  ccm_v4: ["AIS-04", "DSP-10"]
scope_tags:
  - aws
  - apigateway
type: unsafe_state
params:
  attack_stage: initial_access
remediation:
  description: >
    HTTP API CorsConfiguration sets AllowCredentials to true while
    AllowOrigins contains "*". Browsers will refuse this combination,
    but the configuration reveals misaligned intent about which
    origins should be permitted to make credentialed calls.
  action: >
    Either set AllowCredentials to false and keep the wildcard (if the
    API is genuinely open and cookies/auth headers are not required),
    or replace the wildcard in AllowOrigins with the explicit set of
    origins that need credentialed access. Update via
    "aws apigatewayv2 update-api --api-id <id> --cors-configuration ...".
  example: |
    {
      "api": {
        "kind": "http_api",
        "cors": {
          "configured": true,
          "allows_wildcard_origin": false,
          "credentials_allowed": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.api.kind
      op: eq
      value: http_api
    - field: properties.api.cors.configured
      op: eq
      value: true
    - field: properties.api.cors.allows_wildcard_origin
      op: eq
      value: true
    - field: properties.api.cors.credentials_allowed
      op: eq
      value: true
