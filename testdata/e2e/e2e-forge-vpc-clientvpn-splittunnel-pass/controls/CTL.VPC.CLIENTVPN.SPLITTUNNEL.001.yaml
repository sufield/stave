dsl_version: ctrl.v1
id: CTL.VPC.CLIENTVPN.SPLITTUNNEL.001
name: Client VPN Split Tunneling Enabled
description: >
  Client VPN endpoint has split tunneling enabled. Only VPC-destined
  traffic routes through the VPN; all other traffic leaves the client
  device directly to the internet. The client is simultaneously
  connected to the trusted VPC and the untrusted internet. An attacker
  who compromises the device via the internet path (malicious website,
  phishing, drive-by download) can pivot directly into the VPC through
  the VPN — the laptop becomes the corporate network perimeter. Split
  tunneling is a legitimate choice for bandwidth-sensitive use cases;
  triage should weigh that tradeoff rather than prescribe full-tunnel
  unconditionally.
domain: exposure
severity: medium
compliance:
  cis_aws_v3.0: "5.5"
  nist_800_53_r5: "AC-17"
  fedramp_moderate: "AC-17"
  pci_dss_v4.0: "1.3.4"
  soc2: "CC6.6"
  hipaa: "164.312(e)(1)"
  ccm_v4: ["IVS-03", "IVS-06"]
scope_tags:
  - aws
  - vpc
type: unsafe_state
classification: state_assertion
params:
  attack_stage: lateral_movement
observation_fields:
  - network.kind
  - network.clientvpn.endpoint_id
  - network.clientvpn.split_tunnel
remediation:
  description: >
    Client VPN endpoint has split tunneling enabled. Client devices
    are simultaneously bridged between the corporate VPC and the
    public internet.
  action: >
    Disable split tunneling so all client traffic routes through the
    VPN and passes through corporate security controls (firewall,
    proxy, DLP). If split tunneling is a documented business need
    (bandwidth-sensitive use cases, specific SaaS allowlist), keep
    it but compensate with strict endpoint hardening: EDR, host
    firewall, mandatory OS patching, and application allowlisting
    on the client device itself.
  example: |
    {
      "network": {
        "kind": "clientvpn_endpoint",
        "clientvpn": {
          "split_tunnel": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.network.kind
      op: eq
      value: clientvpn_endpoint
    - field: properties.network.clientvpn.split_tunnel
      op: eq
      value: true
