dsl_version: ctrl.v1
id: CTL.ECS.NETWORK.001
name: ECS Task Definitions Must Not Use Host Network Mode
description: >
  Detects assets where host_mode is eq true.
domain: exposure
severity: high
scope_tags:
  - aws
  - ecs
type: unsafe_state
params: {}
remediation:
  description: >
    Detects assets where host_mode is eq true.
  action: >
    Switch to awsvpc network mode.
unsafe_predicate:
  all:
    - field: properties.container.network.host_mode
      op: eq
      value: true
