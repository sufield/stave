dsl_version: ctrl.v1
id: CTL.S3.TENANT.ISOLATION.001
name: Shared-Bucket Tenant Isolation Must Enforce Prefix
description: >
  When a shared S3 bucket uses prefix-based tenant isolation, every
  app-signer identity that produces presigned URLs must enforce the
  tenant prefix.  An identity that allows path traversal (../) or
  disables prefix enforcement lets one tenant read or overwrite
  another tenant's objects.
compliance:
  ccm_v4: ["IVS-06"]
domain: exposure
exposure:
  type: tenant_isolation_breach
  principal_scope: cross_account
severity: high
scope_tags:
  - aws
  - s3
type: unsafe_state
classification: state_assertion
defect: >
  A shared bucket tagged with a tenant-prefix scheme has an
  app-signer identity that either allows path traversal
  (allow_traversal=true) or disables prefix enforcement
  (enforce_prefix=false). The signer can mint presigned URLs
  that escape the tenant prefix — either by including "../"
  in the signed key or by omitting the prefix entirely.
infection: >
  Any tenant using this app-signer can request a presigned
  URL targeting another tenant's prefix. The URL is validly
  signed, so the bucket policy's signature-based tenant gate
  never triggers — S3 honors the URL exactly as the signer
  minted it. This is architecturally invisible to the bucket
  itself: the ACL remains private, the bucket policy remains
  tenant-aware, but the signer's presigned URLs bypass both
  layers. Cross-tenant read or write happens at signing time,
  not at S3's request-evaluation time. In the unikrn-254200
  pattern, the signer gives tenant A's session a URL that
  lists or overwrites tenant B's objects — no S3-layer
  misconfiguration to audit.
failure: >
  Cross-tenant data breach and data integrity failure.
  Tenant A reads, overwrites, or deletes tenant B's objects
  through presigned URLs the application legitimately
  issued. Audit logs show tenant A making signed requests
  against the bucket — which is normal behavior — so
  detection requires cross-referencing signer identity state
  against per-request prefixes, a correlation few shops
  build. Remediation requires fixing every app-signer with
  the unsafe setting and revoking any outstanding presigned
  URLs.
params:
  attack_stage: exfiltration
remediation:
  description: >
    Shared bucket has an app-signer identity that allows path traversal
    or disables prefix enforcement. One tenant can read or overwrite
    another tenant's objects.
  action: >
    Update the app-signer configuration to enforce tenant prefix
    restrictions (enforce_prefix=true) and block path traversal
    (allow_traversal=false) on all presigned URL signers.
  example: |
    {
      "storage": {
        "kind": "bucket",
        "tags": {
          "tenant_mode": "shared",
          "tenant_prefix": "org-123"
        }
      },
      "identities": [
        {
          "type": "app_signer",
          "id": "appsigner:s3:uploads",
          "purpose": "enforce_prefix=true allow_traversal=false"
        }
      ]
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.tags.tenant_mode
      op: eq
      value: shared
    - field: properties.storage.tags.tenant_prefix
      op: present
      value: true
    - field: identities
      op: any_match
      value:
        all:
          - field: type
            op: eq
            value: app_signer
          - field: id
            op: contains
            value: "appsigner:s3:"
          - any:
              - field: purpose
                op: contains
                value: "allow_traversal=true"
              - field: purpose
                op: contains
                value: "enforce_prefix=false"
