dsl_version: ctrl.v1
id: CTL.IAM.TRUST.ORGBOUNDARY.001
name: Cross-Account Trust Must Restrict to Organization via PrincipalOrgID
description: >
  Trust must restrict to org.
domain: identity
severity: high
compliance:
  nist_800_53_r5: "AC-3"
  ccm_v4: ["IAM-05", "IAM-16"]
scope_tags: [aws, iam]
type: unsafe_state
classification: state_assertion
defect: >
  Trust allows assumption without aws:PrincipalOrgID.
infection: >
  External principals outside the organization can assume this role.
failure: >
  Unauthorized cross-account access from outside the organization.
params:
  attack_stage: lateral_movement
remediation:
  description: Trust allows assumption from any account.
  action: Add aws:PrincipalOrgID condition.
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: role
    - field: properties.identity.trust_policy.has_cross_account_trust
      op: eq
      value: true
    - field: properties.identity.trust_policy.has_org_id_condition
      op: eq
      value: false
