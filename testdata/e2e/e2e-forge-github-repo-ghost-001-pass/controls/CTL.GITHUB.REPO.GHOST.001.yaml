dsl_version: ctrl.v1
id: CTL.GITHUB.REPO.GHOST.001
name: CODEOWNERS References Deleted Team or User
description: >
  CODEOWNERS file references a team or user that no longer exists.
  Code ownership assigned to a ghost — changes to the owned path
  have no actual reviewer.
domain: identity
severity: medium
compliance:
  nist_800_53_r5: "AC-2"
  soc2: "CC6.2"
scope_tags: [github]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: persistence
remediation:
  description: CODEOWNERS References Deleted Team or User — finding detected.
  action: Update CODEOWNERS to reference existing teams and users.
  example: |
    {"github": {"repo": {"kind": "repository", "codeowners": {"has_ghost_owner": false}}}}
unsafe_predicate:
  all:
    - field: properties.github.repo.kind
      op: eq
      value: repository
    - field: properties.github.repo.codeowners.has_ghost_owner
      op: eq
      value: true
