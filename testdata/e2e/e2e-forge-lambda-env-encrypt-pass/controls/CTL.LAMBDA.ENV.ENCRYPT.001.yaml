dsl_version: ctrl.v1
id: CTL.LAMBDA.ENV.ENCRYPT.001
name: Lambda Environment Variables Must Be Encrypted with CMK
description: >
  Detects assets where kms_encrypted is eq false.
domain: exposure
severity: high
scope_tags:
  - aws
  - lambda
type: unsafe_state
params: {}
remediation:
  description: >
    Detects assets where kms_encrypted is eq false.
  action: >
    Configure a customer-managed KMS key for environment variable encryption.
unsafe_predicate:
  all:
    - field: properties.compute.env.kms_encrypted
      op: eq
      value: false
