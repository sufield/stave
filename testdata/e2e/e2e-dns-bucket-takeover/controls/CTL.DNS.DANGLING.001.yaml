dsl_version: ctrl.v1
id: CTL.DNS.DANGLING.001
name: DNS Records Must Not Point to Unclaimed Resources
description: >
  DNS records (CNAME, ALIAS, A) that reference external cloud resources
  must resolve to resources that exist and are owned by the organization.
  A dangling DNS record pointing to a deleted or unclaimed resource enables
  subdomain takeover — the attacker claims the resource and serves content
  under the organization's domain.
domain: exposure
exposure:
  type: subdomain_takeover
  principal_scope: public
severity: critical
scope_tags:
  - dns
type: unsafe_state
params: {}
remediation:
  description: >
    A DNS record points to a cloud resource that does not exist or is not
    owned by the organization. An attacker can claim the resource and serve
    content under your domain — phishing, malware, or credential harvesting
    that appears to originate from a trusted hostname.
  action: >
    Either claim the target resource in your cloud account to block takeover,
    or delete the DNS record that points to the unclaimed resource. Audit all
    DNS zones for records pointing to decommissioned infrastructure.
  example: |
    {
      "dns": {
        "record_type": "CNAME",
        "target_exists": true,
        "target_owned": true
      }
    }
unsafe_predicate:
  any:
    - field: properties.dns.target_exists
      op: eq
      value: false
    - field: properties.dns.target_owned
      op: eq
      value: false
