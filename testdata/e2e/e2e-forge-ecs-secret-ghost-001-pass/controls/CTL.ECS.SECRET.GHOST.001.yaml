dsl_version: ctrl.v1
id: CTL.ECS.SECRET.GHOST.001
name: ECS Task Definitions Must Not Reference Deleted Secrets
description: >
  ECS task definitions must not inject secrets from Secrets Manager
  that have been deleted. A missing secret causes either container
  startup failure or silent fallback to insecure defaults — hardcoded
  credentials, unauthenticated connections, or disabled TLS.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "IA-5"
  soc2: "CC6.1"
  hipaa: "164.312(d)"
  ccm_v4: ["IAM-16"]
scope_tags: [aws, ecs]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
remediation:
  description: ECS task definition references a deleted Secrets Manager secret.
  action: Recreate the secret or update the task definition to reference an active secret.
  example: |
    {"container": {"kind": "task_definition", "secrets": {"has_ghost_reference": false}}}
unsafe_predicate:
  all:
    - field: properties.container.kind
      op: eq
      value: task_definition
    - field: properties.container.secrets.has_ghost_reference
      op: eq
      value: true
