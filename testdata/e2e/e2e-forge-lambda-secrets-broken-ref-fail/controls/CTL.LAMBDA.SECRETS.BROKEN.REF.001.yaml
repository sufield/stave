dsl_version: ctrl.v1
id: CTL.LAMBDA.SECRETS.BROKEN.REF.001
name: Lambda Secret References Must Match Execution Role Permissions
description: >
  Lambda functions whose environment variables reference
  Secrets Manager ARNs or SSM Parameter Store names must
  have execution roles whose IAM policy grants the
  appropriate fetch action (`secretsmanager:GetSecretValue`
  for SM, `ssm:GetParameter` / `ssm:GetParameters` for
  SSM) on the referenced resource. The deployment is
  set up with the right reference but the wrong (or
  missing) permission: the env var carries the ARN, the
  application code calls GetSecretValue with that ARN,
  and the call fails with AccessDeniedException. The
  function then either crashes (when it does not
  handle the error path) or operates in a degraded mode
  (when it falls back to a default or skips the
  credential-using operation), and the failure is
  consistent across every cold start. The pattern is
  almost always a deployment misconfiguration: the
  secret was created and the env var was wired, but the
  IAM policy update that grants the fetch was either
  never authored (the IaC is split across teams) or was
  scoped to the wrong ARN (a previous version of the
  secret, a sibling secret, or a wildcard that
  intentionally excluded this one). Cross-resource
  reasoning: env var references are joined against role
  policy grants to detect the mismatch.
domain: secrets
severity: high
compliance:
  nist_800_53_r5: "AC-3"
  pci_dss_v4: "7.2"
  ccm_v4: ["IAM-08", "BCR-08"]
scope_tags: [aws, lambda]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
remediation:
  description: Lambda function references a secret its execution role cannot read.
  action: Add the GetSecretValue / GetParameter grant to the role's policy, scoped to the referenced ARN.
  example: |
    {"compute": {"kind": "function", "function": {"role_can_access_secrets": true}}}
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: function
    - field: properties.compute.function.env_references_secret
      op: eq
      value: true
    - field: properties.compute.function.role_can_access_secrets
      op: eq
      value: false
