dsl_version: ctrl.v1
id: CTL.SSM.DOCUMENT.SECRETS.001
name: SSM Documents Must Not Contain Embedded Secrets
description: >
  SSM documents must not contain hardcoded passwords, access keys,
  tokens, or private keys. Use Secrets Manager or Parameter Store
  references instead.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "IA-5(7)"
  soc2: "CC6.1"
  ccm_v4: ["IAM-16", "DSP-17"]
scope_tags: [aws, ssm]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
remediation:
  description: SSM document contains embedded secrets.
  action: Replace hardcoded credentials with Secrets Manager or Parameter Store references.
  example: |
    {"governance": {"kind": "ssm_document", "secrets": {"has_embedded_secrets": false}}}
unsafe_predicate:
  all:
    - field: properties.governance.kind
      op: eq
      value: ssm_document
    - field: properties.governance.secrets.has_embedded_secrets
      op: eq
      value: true
