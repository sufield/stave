dsl_version: ctrl.v1
id: CTL.GCP.COMPUTE.FIREWALL.SSH.001
name: Firewall Rule Allows SSH from the Internet
description: >
  Firewall rule allows TCP port 22 from 0.0.0.0/0. SSH directly
  accessible from any IP on the internet.
domain: exposure
severity: critical
compliance:
  cis_gcp_v3: "3.6"
  nist_800_53_r5: "SC-7"
  hipaa: "164.312(a)(1)"
  pci_dss_v4: "1.3"
  soc2: "CC6.6"
scope_tags: [gcp]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Firewall Allows SSH from Internet — finding detected.
  action: Restrict source ranges to specific IPs or use IAP for SSH.
  example: |
    {"gcp": {"compute": {"kind": "firewall_rule", "firewall": {"allows_ssh_from_internet": false}}}}
unsafe_predicate:
  all:
    - field: properties.gcp.compute.kind
      op: eq
      value: firewall_rule
    - field: properties.gcp.compute.firewall.allows_ssh_from_internet
      op: eq
      value: true
