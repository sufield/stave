dsl_version: ctrl.v1
id: CTL.S3.PUBLIC.001
name: No Public S3 Bucket Read
description: >
  S3 buckets must not allow public read access.
  Detects buckets with anonymous read exposure via policy or ACL.
domain: exposure
exposure:
  type: public_read
  principal_scope: public
severity: critical
compliance:
  hipaa: "164.312(a)(1)"
  cis_aws_v1.4.0: "2.1.5"
  pci_dss_v3.2.1: "1.2.1"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  nist_800_53_r5: "AC-3"
  fedramp_moderate: "AC-3"
  gdpr: "Art.32"
  ffiec: "ISH-4"
  iso_27001_2022: "A.8.3"
  ccm_v4: ["DSP-07", "DSP-17"]
scope_tags:
  - aws
  - s3
type: unsafe_state
classification: state_assertion
defect: >
  The bucket's access configuration grants read permission to the
  public — either via a bucket policy statement with Principal "*"
  or via an ACL grant to the AllUsers pseudo-group. The bucket is
  reachable without authentication from the public internet.
infection: >
  Anyone on the internet can fetch objects from this bucket over
  anonymous HTTP/HTTPS. Search engines and automated scanners
  continuously enumerate publicly-indexed bucket names, meaning
  exposure is active from the moment the policy or ACL is in place —
  not hypothetical. Once the bucket name is known, every object
  whose key the caller can guess or enumerate is fetchable.
failure: >
  Unbounded data exposure. Every file stored in this bucket is
  readable by arbitrary internet callers, including potentially
  sensitive operational data, customer information, backup
  artifacts, or internal documentation that wasn't intended to
  reach the public surface.
params:
  attack_stage: initial_access
observation_fields:
  - storage.access.public_read
remediation:
  description: >
    Bucket has public read access enabled via policy or ACL.
    Anyone on the internet can access objects in this bucket.
  action: >
    Enable S3 Public Access Block (all four settings).
    Remove any bucket policy statements granting access to Principal "*".
    Remove any ACL grants to AllUsers or AuthenticatedUsers.
  example: |
    {
      "storage": {
        "access": {
          "public_read": false
        }
      }
    }
unsafe_predicate:
  any:
    - field: properties.storage.access.public_read
      op: eq
      value: true
