dsl_version: ctrl.v1
id: CTL.IAM.PASSWORD.ROTATION.001
name: User Passwords Must Be Rotated Within Policy Period
description: >
  IAM user console passwords must be rotated per organizational policy
  (typically 90 days). The credential report tracks password_last_changed;
  passwords older than the policy period have accumulated exposure risk
  and may have been shared, phished, or brute-forced. This complements
  access key rotation (CTL.IAM.CRED.ROTATION.001) to cover the full
  credential lifecycle.
domain: identity
severity: medium
compliance:
  soc2: "CC6.1"
  nist_800_53_r5: "IA-5(1)"
  cis_aws_v3.0: "1.12"
  pci_dss_v4.0: "8.3.9"
  fedramp_moderate: "IA-5(1)"
  hipaa: "164.312(a)(2)(i)"
scope_tags:
  - aws
  - iam
type: unsafe_state
params:
  base_impact: 5
  attack_stage: credential_access
remediation:
  description: >
    IAM user console password has not been rotated within the
    organizational policy period. Stale passwords accumulate
    compromise risk.
  action: >
    Require the user to change their password. Enforce a maximum
    password age via the account password policy. Run:
    aws iam update-account-password-policy --max-password-age 90
  example: |
    {
      "identity": {
        "kind": "user",
        "password": {
          "has_stale_password": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: user
    - field: properties.identity.password.has_stale_password
      op: eq
      value: true
