dsl_version: ctrl.v1
id: CTL.ECS.SECRETS.001
name: ECS Task Definitions Must Not Pass Secrets as Plaintext Environment Variables
description: >
  ECS container definitions must not pass credentials as plaintext environment variables. Plaintext env vars are stored in the task definition, visible in the ECS console, logged in CloudTrail, and accessible to any process in the container. Use Secrets Manager or SSM Parameter Store references via the secrets field instead.
domain: exposure
severity: critical
compliance:
  nist_800_53_r5: "IA-5"
  fedramp_moderate: "IA-5"
  hipaa: "164.312(a)(2)(iv)"
  pci_dss_v4.0: "3.4.1"
  soc2: "CC6.1"
  ccm_v4: ["IVS-06", "LOG-12"]
scope_tags:
  - aws
  - ecs
type: unsafe_state
params:
  attack_stage: credential_access
remediation:
  description: >
    ECS container has plaintext secrets in environment variables.
  action: >
    Move secrets to Secrets Manager or SSM Parameter Store. Reference them via the secrets field in the container definition.
unsafe_predicate:
  all:
    - field: properties.container.kind
      op: eq
      value: task_definition
    - field: properties.container.env.has_plaintext_secrets
      op: eq
      value: true
