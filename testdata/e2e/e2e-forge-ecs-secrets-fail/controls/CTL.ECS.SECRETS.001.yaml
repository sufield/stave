dsl_version: ctrl.v1
id: CTL.ECS.SECRETS.001
name: ECS Task Definitions Must Not Pass Secrets as Plaintext Environment Variables
description: >
  Detects assets where has_plaintext_secrets is eq true.
domain: exposure
severity: critical
scope_tags:
  - aws
  - ecs
type: unsafe_state
params: {}
remediation:
  description: >
    Detects assets where has_plaintext_secrets is eq true.
  action: >
    Move secrets to Secrets Manager or SSM Parameter Store references.
unsafe_predicate:
  all:
    - field: properties.container.env.has_plaintext_secrets
      op: eq
      value: true
