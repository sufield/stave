dsl_version: ctrl.v1
id: CTL.REDSHIFT.PUBLIC.001
name: Redshift Clusters Must Not Be Publicly Accessible
description: Redshift clusters must not have the publicly accessible setting
  enabled.
domain: exposure
severity: critical
compliance:
  nist_800_53_r5: AC-3
  soc2: CC6.6
  pci_dss_v4.0: 1.3.4
  ccm_v4:
  - IVS-03
scope_tags:
- aws
- redshift
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Redshift cluster is publicly accessible.
  action: Disable public accessibility and place the cluster in a private
    subnet.
unsafe_predicate:
  all:
  - field: properties.database.kind
    op: eq
    value: redshift_cluster
  - field: properties.database.access.publicly_accessible
    op: eq
    value: true
defect: The Redshift cluster has PubliclyAccessible enabled, making the data
  warehouse endpoint reachable from the internet.
infection: An attacker can connect directly to the cluster from any IP address.
  Combined with weak credentials or SQL injection through an application proxy,
  the entire data warehouse is accessible. Automated scanners continuously
  probe for publicly accessible Redshift endpoints.
failure: Direct data warehouse compromise from the internet. Business intelligence
  data, historical records, and aggregated datasets are exposed.
