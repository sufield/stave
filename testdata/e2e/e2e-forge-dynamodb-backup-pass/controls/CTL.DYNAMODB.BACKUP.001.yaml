dsl_version: ctrl.v1
id: CTL.DYNAMODB.BACKUP.001
name: DynamoDB Tables Must Have Backup Plan
description: DynamoDB tables must be included in a backup plan.
domain: resilience
severity: medium
compliance:
  nist_800_53_r5: CP-9
  soc2: CC7.1
  ccm_v4:
  - BCR-08
scope_tags:
- aws
- dynamodb
type: unsafe_state
classification: state_assertion
params:
  attack_stage: impact
remediation:
  description: No backup plan.
  action: Add table to AWS Backup plan or enable PITR.
unsafe_predicate:
  all:
  - field: properties.database.kind
    op: eq
    value: table
  - field: properties.database.backup.has_backup_plan
    op: eq
    value: false
defect: 'The DynamoDB table has no backup plan configured. No AWS Backup plan
  includes this table and PITR may not be enabled.

  '
infection: 'Without backups, accidental or malicious deletion of the table
  or its items is unrecoverable. Ransomware attacks targeting DynamoDB tables
  have no recovery path.

  '
failure: 'Data loss. Table data is unrecoverable after deletion or corruption.

  '
