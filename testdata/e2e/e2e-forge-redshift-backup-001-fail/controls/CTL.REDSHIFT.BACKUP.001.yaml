dsl_version: ctrl.v1
id: CTL.REDSHIFT.BACKUP.001
name: Redshift Automated Snapshots Must Be Enabled
description: Redshift clusters must have automated snapshots enabled with
  adequate retention.
domain: resilience
severity: medium
compliance:
  nist_800_53_r5: CP-9
  soc2: CC7.1
  ccm_v4:
  - BCR-08
scope_tags:
- aws
- redshift
type: unsafe_state
classification: state_assertion
params:
  attack_stage: impact
remediation:
  description: Automated snapshots not enabled.
  action: Set automated snapshot retention period to at least 7 days.
unsafe_predicate:
  all:
  - field: properties.database.kind
    op: eq
    value: redshift_cluster
  - field: properties.database.backup.automated_snapshots_enabled
    op: eq
    value: false
