dsl_version: ctrl.v1
id: CTL.EC2.KEYPAIR.NOKEY.SSHOPEN.001
name: EC2 Instances With SSH Open Must Have a Key Pair
description: >
  EC2 instances whose security groups allow inbound SSH (port 22)
  must have an EC2 key pair associated. An instance launched
  without a key pair has no SSH public key injected by EC2 — yet
  if the security group permits SSH, the port is network-reachable.
  This combination is ambiguous and never the intended end state:
  either password authentication is enabled (the instance is
  brute-forceable from anywhere the SG permits), or SSH keys were
  added post-launch via user data, configuration management, or
  SSM (so a real access path exists but is invisible to AWS API
  audits), or SSH is open with no usable access method at all
  (gratuitous exposure). All three outcomes are problematic and
  none of them are visible by inspecting either the instance or
  the security group in isolation — the control surfaces them by
  joining the two.
domain: governance
severity: medium
compliance:
  nist_800_53_r5: "AC-17"
  soc2: "CC6.1"
  ccm_v4: ["IAM-08", "IVS-04"]
scope_tags: [aws, ec2]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Instance has no key pair but its security group allows SSH.
  action: Either close port 22 in the SG, or attach an explicit key pair to the instance.
  example: |
    {"compute": {"kind": "instance", "instance": {"has_key_pair": true, "sg_allows_ssh": true}}}
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: instance
    - field: properties.compute.instance.has_key_pair
      op: eq
      value: false
    - field: properties.compute.instance.sg_allows_ssh
      op: eq
      value: true
