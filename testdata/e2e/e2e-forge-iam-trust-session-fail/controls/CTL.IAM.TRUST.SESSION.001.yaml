dsl_version: ctrl.v1
id: CTL.IAM.TRUST.SESSION.001
name: Cross-Account Trust Must Have Session-Limiting Conditions
description: >
  IAM roles with cross-account trust policies must include at least
  one session-limiting condition beyond principal identity binding.
domain: identity
severity: medium
compliance:
  soc2: "CC6.1"
  nist_800_53_r5: "AC-3"
  ccm_v4: ["IAM-05", "IAM-16"]
scope_tags:
  - aws
  - iam
type: unsafe_state
classification: state_assertion
defect: >
  The role's cross-account trust policy allows assumption without
  session-limiting conditions.
infection: >
  A principal with sts:AssumeRole permission can assume this role
  from any IP address, without MFA, for the maximum session duration.
failure: >
  Unrestricted cross-account role assumption from any network
  location without additional authentication.
params:
  attack_stage: lateral_movement
remediation:
  description: >
    Cross-account trust policy allows assumption without session-
    limiting conditions.
  action: >
    Add aws:MultiFactorAuthPresent, aws:SourceIp, or aws:SourceVpc
    conditions to the trust policy, or set MaxSessionDuration.
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: role
    - field: properties.identity.trust_policy.has_cross_account_trust
      op: eq
      value: true
    - field: properties.identity.trust_policy.has_assumption_constraints
      op: eq
      value: false
