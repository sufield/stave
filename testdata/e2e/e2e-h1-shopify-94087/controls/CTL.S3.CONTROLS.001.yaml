dsl_version: ctrl.v1
id: CTL.S3.CONTROLS.001
name: Public Access Block Must Be Enabled
description: >
  S3 buckets must have the public access block fully enabled.
  When disabled, the bucket has no safety net against accidental
  public exposure from policy or ACL changes. This detects the
  enabling condition for public access, not the exposure itself.
domain: exposure
severity: high
compliance:
  cis_aws_v1.4.0: "2.1.5"
  cis_aws_v3.0: "2.1.4"
  pci_dss_v3.2.1: "1.3.6"
  soc2: "CC6.1"
  pci_dss_v4.0: "2.2.1"
  nist_800_53_r5: "AC-3"
  fedramp_moderate: "AC-3"
  gdpr: "Art.32"
  ffiec: "ISH-4"
  iso_27001_2022: "A.8.3"
  nist_csf_2.0: "PR.PS"
  ccm_v4: ["DSP-07", "DSP-17"]
scope_tags:
  - aws
  - s3
type: unsafe_state
classification: state_assertion
defect: >
  The bucket's Public Access Block is not fully enabled — at
  least one of BlockPublicAcls, IgnorePublicAcls,
  BlockPublicPolicy, RestrictPublicBuckets is disabled. The
  bucket has no catch-all defense against a future ACL or
  policy change that would expose content publicly.
infection: >
  PAB is a defense-in-depth control: even if the bucket is
  currently private, any subsequent change to the bucket
  policy or ACL can make it public with no intermediate
  warning. PAB, when fully enabled, rejects the change at
  configuration time — the AWS API returns an error rather
  than accepting the unsafe policy. Without PAB, operators
  performing routine maintenance or automation running at
  scale can accidentally flip a bucket public. Audit trails
  attribute the exposure to the operator or script, not to
  the absent safety net, so investigations often miss that
  PAB-on-everywhere would have prevented the incident.
failure: >
  Future accidental exposure through routine bucket changes.
  The bucket is not currently public, so this control is
  preventive, not reactive — the failure it describes is
  whatever would happen if an unrelated configuration change
  made the bucket public. Enabling PAB eliminates the class
  entirely for this bucket regardless of which mechanism
  (ACL, policy, future API surface) would otherwise have
  opened the exposure.
params:
  attack_stage: initial_access
remediation:
  description: >
    Public Access Block is not fully enabled. The bucket has no safety net
    against accidental public exposure from policy or ACL changes.
  action: >
    Enable all four Public Access Block settings on the bucket:
    BlockPublicAcls, IgnorePublicAcls, BlockPublicPolicy, RestrictPublicBuckets.
  example: |
    {
      "storage": {
        "kind": "bucket",
        "controls": {
          "public_access_fully_blocked": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.controls.public_access_fully_blocked
      op: eq
      value: false
