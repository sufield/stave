dsl_version: ctrl.v1
id: CTL.CLOUDFLARE.ZONE.HOTLINK.001
name: Hotlink Protection Not Enabled
description: >
  Other websites can embed images and assets from this domain.
  Bandwidth theft and content association risk.
domain: exposure
severity: low
compliance:
  nist_800_53_r5: "SC-7"
  soc2: "CC6.6"
scope_tags: [cloudflare]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Hotlink Protection Not Enabled — finding detected.
  action: Remediate per control description.
  example: |
    {"cloudflare": {"zone": {"kind": "zone_config", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.cloudflare.zone.kind
      op: eq
      value: zone_config
    - field: properties.cloudflare.zone.hotlink_protection
      op: eq
      value: false
