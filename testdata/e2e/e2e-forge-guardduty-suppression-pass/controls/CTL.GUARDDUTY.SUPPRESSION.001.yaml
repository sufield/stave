dsl_version: ctrl.v1
id: CTL.GUARDDUTY.SUPPRESSION.001
name: GuardDuty Must Not Have Broad Suppression Rules
domain: governance
description: >
  Safety mechanism integrity control. Checks that security guardrails
  are actively enforcing, not just present.
severity: critical
compliance:
  nist_800_53_r5: "SI-4"
  fedramp_moderate: "SI-4"
  iso_27001_2022: "A.8.16"
  soc2: "CC7.1"
scope_tags:
  - aws
  - guardduty
type: unsafe_state
params:
  base_impact: 10
  attack_stage: detection_evasion
remediation:
  description: >
    Safety mechanism integrity check detected a guardrail in non-enforcing
    or degraded state.
  action: >
    Review the specific guardrail identified in this finding and restore
    it to an enforcing state.
unsafe_predicate:
  all:
    - field: properties.guardduty.has_broad_suppression
      op: eq
      value: true
