dsl_version: ctrl.v1
id: CTL.ECS.TASKROLE.SHARED.001
name: ECS Task Definitions Must Use Per-Service Task Roles
description: 'Each ECS task definition should have its own dedicated IAM task
  role. Shared task roles grant every service using the role the union of
  all services'' permissions, expanding blast radius.

  '
domain: identity
severity: medium
compliance:
  soc2: CC6.1
  nist_800_53_r5: AC-6
  pci_dss_v4.0: 7.2.1
  ccm_v4:
  - IAM-04
  - IAM-05
scope_tags:
- aws
- ecs
type: unsafe_state
classification: state_assertion
params:
  attack_stage: lateral_movement
remediation:
  description: 'ECS task definition uses a task role shared with other task
    definitions.

    '
  action: 'Create a dedicated IAM role per task definition scoped to only
    the permissions that specific service needs.

    '
  example: "{\n  \"container\": {\n    \"kind\": \"task_definition\",\n  \
    \  \"task_role\": { \"is_shared\": false }\n  }\n}\n"
unsafe_predicate:
  all:
  - field: properties.container.kind
    op: eq
    value: task_definition
  - field: properties.container.task_role.is_shared
    op: eq
    value: true
defect: 'The ECS task definition uses a task role shared with other task definitions,
  granting all services the union of permissions intended for individual services.

  '
infection: 'Compromise of any service using the shared role grants the attacker
  permissions intended for all services sharing it. A low-value service with
  minimal external exposure becomes a pivot point to high-value services through
  the shared credential.

  '
failure: 'Lateral movement across ECS services via shared credentials. The
  blast radius of a single container compromise expands to every service using
  the same role.

  '
