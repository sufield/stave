dsl_version: ctrl.v1
id: CTL.COGNITO.MFA.001
name: Cognito User Pool Must Enforce MFA
description: >
  Cognito user pools handling PHI must enforce multi-factor
  authentication. Without MFA, a compromised password grants full
  access to the application and any PHI it serves.
domain: identity
severity: high
compliance:
  hipaa: "164.312(d)"
  soc2: "CC6.1"
  pci_dss_v4.0: "8.3.1"
  nist_800_53_r5: "IA-2(1)"
  fedramp_moderate: "IA-2(1)"
  ccm_v4: ["IAM-14", "IAM-16"]
scope_tags:
  - aws
  - cognito
type: unsafe_state
params:
  attack_stage: credential_access
remediation:
  description: >
    Cognito user pool does not enforce MFA. User authentication
    relies on password alone.
  action: >
    Set MfaConfiguration to ON (required) on the user pool. Run:
    aws cognito-idp set-user-pool-mfa-config --user-pool-id xxx
    --mfa-configuration ON --software-token-mfa-configuration Enabled=true
  example: |
    {
      "identity": {
        "kind": "user_pool",
        "auth": {
          "mfa_enforced": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.identity.kind
      op: eq
      value: user_pool
    - field: properties.identity.auth.mfa_enforced
      op: eq
      value: false
