dsl_version: ctrl.v1
id: CTL.LAMBDA.ENV.ENCRYPT.001
name: Lambda Environment Variables Must Be Encrypted with CMK
description: >
  Lambda functions with environment variables must encrypt them using a customer-managed KMS key, not the default AWS-managed key. Without CMK encryption, environment variable values are encrypted with a default key that any principal with lambda:GetFunction can decrypt. A CMK provides fine-grained access control over decryption — only principals with kms:Decrypt on the specific key can read the values.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SC-28"
  fedramp_moderate: "SC-28"
  hipaa: "164.312(a)(2)(iv)"
  pci_dss_v4.0: "3.4.1"
  soc2: "CC6.7"
  ccm_v4: ["CEK-03"]
scope_tags:
  - aws
  - lambda
type: unsafe_state
classification: state_assertion
params:
  attack_stage: exfiltration
remediation:
  description: >
    Lambda function environment variables are not encrypted with a customer-managed KMS key.
  action: >
    Create a KMS key and configure the function to use it for environment variable encryption via the aws lambda update-function-configuration --kms-key-arn command.
  example: |
    {
      "compute": {
        "kind": "function",
        "env": {
          "kms_encrypted": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: function
    - field: properties.compute.env.kms_encrypted
      op: eq
      value: false
