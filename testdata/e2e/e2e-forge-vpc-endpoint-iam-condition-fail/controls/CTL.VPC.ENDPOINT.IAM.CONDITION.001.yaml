dsl_version: ctrl.v1
id: CTL.VPC.ENDPOINT.IAM.CONDITION.001
name: VPC Endpoint Policy Must Require IAM Conditions
description: 'VPC endpoint policies must include IAM conditions (aws:PrincipalArn,
  aws:PrincipalOrgID) to verify the identity of requesters. Without these,
  any principal in the VPC can use the endpoint without identity verification
  at the policy layer.

  '
domain: network
severity: medium
compliance:
  nist_800_53_r5: AC-3
  soc2: CC6.1
  ccm_v4:
  - IAM-05
  - IVS-03
scope_tags:
- aws
- vpc
type: unsafe_state
classification: state_assertion
params:
  attack_stage: lateral_movement
remediation:
  description: VPC endpoint policy lacks IAM conditions.
  action: 'Add aws:PrincipalArn or aws:PrincipalOrgID conditions to the endpoint
    policy to restrict which principals can use it.

    '
unsafe_predicate:
  all:
  - field: properties.network.kind
    op: eq
    value: vpc_endpoint
  - field: properties.network.endpoint_policy.requires_iam_conditions
    op: eq
    value: false
defect: 'The VPC endpoint policy does not require IAM conditions (aws:PrincipalArn,
  aws:PrincipalOrgID) on requests. Any principal can use the endpoint without
  identity verification.

  '
infection: 'Without IAM conditions, the endpoint policy does not verify who
  is making the request. A compromised instance or attacker-planted process
  can use the endpoint with any credentials (or no credentials) without the
  policy blocking the request.

  '
failure: 'Uncontrolled endpoint usage. The endpoint is usable by any principal
  in the VPC without identity verification at the endpoint policy layer.

  '
