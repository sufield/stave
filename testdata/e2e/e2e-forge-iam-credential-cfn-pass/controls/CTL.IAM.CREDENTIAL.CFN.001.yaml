dsl_version: ctrl.v1
id: CTL.IAM.CREDENTIAL.CFN.001
name: CloudFormation Stack Contains Embedded Credentials
description: >
  CloudFormation stack parameters, resources, or outputs contain AWS
  access keys, secret keys, or hardcoded passwords. Stack parameters
  marked as NoEcho are still visible in the template source. Stack
  history retains parameter values across updates — credentials
  embedded in any historical version remain retrievable.
domain: exposure
severity: high
compliance:
  soc2: "CC6.1"
  nist_800_53_r5: "IA-5(7)"
  pci_dss_v4.0: "8.6.2"
  fedramp_moderate: "IA-5(7)"
  ccm_v4: ["IAM-02", "DSP-17"]
scope_tags:
  - aws
  - iam
type: unsafe_state
classification: state_assertion
params:
  attack_stage: credential_access
observation_fields:
  - governance.cfn.contains_credentials
  - governance.cfn.credential_parameters
remediation:
  description: >
    CloudFormation stack contains hardcoded credentials in parameters,
    resources, or outputs. Stack history retains these values across
    updates.
  action: >
    Replace hardcoded credentials in CloudFormation with dynamic
    references to Secrets Manager or SSM Parameter Store SecureString.
    Use NoEcho for sensitive parameters and rotate any exposed
    credentials immediately.
  example: |
    {
      "governance": {
        "cfn": {
          "contains_credentials": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.governance.cfn.contains_credentials
      op: eq
      value: true
defect: >
  CloudFormation stack contains embedded AWS credentials or passwords.
infection: >
  CloudFormation stack parameters marked NoEcho hide values from
  console display but not from the template source, CLI describe
  calls with --include-nested-stacks, or change sets. Stack history
  retains parameter values across all updates — deleting and
  recreating the stack does not purge history from CloudTrail.
  Credentials embedded in any stack version are retrievable by
  anyone with cloudformation:DescribeStacks or
  cloudformation:GetTemplate permissions.
failure: >
  Credential exposure via CloudFormation. AWS credentials or
  passwords accessible through stack templates, history, and API
  responses.
tests:
  - name: stack with embedded credentials fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cloudformation:us-east-1:111122223333:stack/legacy-app/abc123"
      asset_type: aws_cloudformation_stack
      vendor: aws
      properties:
        governance:
          cfn:
            contains_credentials: true
            credential_parameters:
              - "DBPassword"
  - name: stack without embedded credentials passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:cloudformation:us-east-1:111122223333:stack/modern-app/def456"
      asset_type: aws_cloudformation_stack
      vendor: aws
      properties:
        governance:
          cfn:
            contains_credentials: false
