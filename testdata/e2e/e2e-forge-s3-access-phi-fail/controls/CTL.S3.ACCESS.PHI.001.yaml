dsl_version: ctrl.v1
id: CTL.S3.ACCESS.PHI.001
name: PHI Bucket Access Must Be Scoped to Specific Principals
description: >
  S3 buckets tagged with data-classification=phi must have access
  restricted to explicitly named principals and prefixes. Broad
  bucket-level access (wildcard principals, unrestricted actions)
  on PHI data violates the HIPAA minimum necessary standard
  (§164.502(b)). Access must be narrowed to the exact IAM roles,
  account IDs, and object prefixes required for each authorized
  workflow.
domain: exposure
severity: high
compliance:
  hipaa: "164.502(b)"
  soc2: "CC6.1"
  pci_dss_v4.0: "7.2.1"
  nist_800_53_r5: "AC-6"
  fedramp_moderate: "AC-6"
  ccm_v4: ["DSP-17", "IAM-16"]
scope_tags:
  - aws
  - s3
  - sensitive-data
  - hipaa
type: unsafe_state
params:
  attack_stage: exfiltration
remediation:
  description: >
    PHI bucket has broad access that exceeds the minimum necessary
    standard. Access is not scoped to specific principals or prefixes.
  action: >
    Restrict bucket policy to named IAM role ARNs and specific object
    prefixes. Remove wildcard principals and broad s3:* actions. Use
    IAM Access Analyzer to identify unused permissions and generate
    least-privilege policies from CloudTrail activity.
  example: |
    {
      "storage": {
        "kind": "bucket",
        "tags": {
          "data-classification": "phi"
        },
        "access": {
          "phi_access_scoped": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.storage.kind
      op: eq
      value: bucket
    - field: properties.storage.tags.data-classification
      op: eq
      value: phi
    - field: properties.storage.access.phi_access_scoped
      op: eq
      value: false
