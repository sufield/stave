dsl_version: ctrl.v1
id: CTL.EC2.AMI.CURRENCY.001
name: EC2 Instances Must Not Run Deprecated or End-of-Life AMIs
description: >
  EC2 instances must not run on AMIs that are deprecated by AWS or the
  AMI owner, or that exceed the maximum AMI age threshold (default 180
  days). Deprecated AMIs represent an OS-level version currency gap —
  the underlying operating system, kernel, and pre-installed packages
  are not receiving security patches. Unlike Lambda runtimes and RDS
  engine versions where AWS manages the execution environment, EC2 AMIs
  are operator-selected and operator-maintained. SSM Patch Manager
  patches running instances but does not update the underlying AMI —
  when instances are replaced through auto-scaling or redeployment, they
  launch from the same aged AMI with accumulated patches missing. The
  180-day default threshold represents two quarterly patching cycles
  with buffer. Organizations can override per-instance via a
  stave/ami-max-age-days tag.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "SI-2"
  fedramp_moderate: "SI-2"
  pci_dss_v4.0: "6.3.3"
  soc2: "CC7.1"
  ccm_v4: ["CCC-04", "IVS-04"]
scope_tags:
  - aws
  - ec2
type: unsafe_state
params:
  attack_stage: initial_access
remediation:
  description: >
    EC2 instance is running on a deprecated or aged AMI. The underlying
    OS image has accumulated unpatched vulnerabilities.
  action: >
    Replace the instance with one launched from a current, non-deprecated
    AMI. For auto-scaling groups, update the launch template to reference
    a current AMI and perform a rolling replacement. For standalone
    instances, launch a replacement from a current AMI and migrate the
    workload. Establish an AMI refresh pipeline that builds updated AMIs
    on a regular cadence and deprecates old ones.
  example: |
    {
      "compute": {
        "kind": "instance",
        "ami": {
          "is_deprecated_or_aged": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: instance
    - field: properties.compute.ami.is_deprecated_or_aged
      op: eq
      value: true
