dsl_version: ctrl.v1
id: CTL.S3.PUBLIC.002
name: No Public S3 Buckets With Sensitive Data
description: >
  S3 buckets tagged with sensitive data classifications
  (PHI, PII, confidential) must not allow any public access.
compliance:
  ccm_v4: ["DSP-07", "DSP-17"]
domain: exposure
exposure:
  type: public_read
  principal_scope: public
severity: critical
scope_tags:
  - aws
  - s3
  - sensitive-data
type: unsafe_state
classification: state_assertion
defect: >
  A bucket tagged with a sensitive-data classification (PHI,
  PII, or confidential) is exposed via public read or public
  list. The tag declares the data's sensitivity; the access
  state contradicts that declaration.
infection: >
  Any internet caller can fetch the sensitive objects via
  anonymous GET or enumerate them via anonymous ListBucket.
  Search engines and compliance scanners specifically match
  data-classification tags against access state, so a single
  tagged-sensitive + public bucket becomes the highest-priority
  finding in most posture dashboards. Regulators treat the
  classification tag as evidence of awareness: the organization
  has labeled this data sensitive and nonetheless exposed it
  publicly, which weakens claims of accidental oversight.
failure: >
  Regulated-data breach. PHI exposure triggers HIPAA breach
  notification; PII exposure triggers GDPR/CCPA obligations;
  confidential data exposure typically triggers contractual
  disclosure and customer notification. Remediation scope is
  bounded by the exposure window — audit CloudTrail to bound
  who accessed during that window and produce the notification
  roster.
params:
  attack_stage: initial_access
remediation:
  description: >
    A bucket containing sensitive data (PHI, PII, or confidential) has public
    read or list access. This data is accessible to anyone on the internet.
  action: >
    Immediately enable S3 Public Access Block (all four settings).
    Remove bucket policy statements granting access to Principal "*".
    Remove ACL grants to AllUsers or AuthenticatedUsers. Audit CloudTrail
    logs for unauthorized access during the exposure window.
  example: |
    {
      "storage": {
        "access": {
          "public_read": false,
          "public_list": false
        },
        "tags": {
          "data-classification": "phi"
        }
      }
    }
unsafe_predicate:
  all:
    - any:
        - field: properties.storage.access.public_read
          op: eq
          value: true
        - field: properties.storage.access.public_list
          op: eq
          value: true
    - any:
        - field: properties.storage.tags.data-classification
          op: eq
          value: phi
        - field: properties.storage.tags.data-classification
          op: eq
          value: pii
        - field: properties.storage.tags.data-classification
          op: eq
          value: confidential
