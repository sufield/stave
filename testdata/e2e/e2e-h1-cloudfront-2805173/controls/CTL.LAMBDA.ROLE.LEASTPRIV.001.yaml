dsl_version: ctrl.v1
id: CTL.LAMBDA.ROLE.LEASTPRIV.001
name: Lambda Execution Role Must Follow Least Privilege
description: >
  Lambda function execution roles must not have overly broad permissions.
  An over-privileged execution role grants the function — and any attacker
  who compromises or invokes it — access to AWS resources beyond what the
  function requires. Common violations include admin policies, wildcard
  resource ARNs on sensitive actions, or managed policies like
  AmazonS3FullAccess attached to functions that only need read access to
  a single bucket. When combined with a public function URL or a
  compromised dependency, an over-privileged role converts a single
  function compromise into account-wide lateral movement.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "AC-6"
  fedramp_moderate: "AC-6"
  pci_dss_v4.0: "7.2.1"
  soc2: "CC6.1"
  hipaa: "164.312(a)(1)"
  ccm_v4: ["IAM-04", "IAM-05"]
scope_tags:
  - aws
  - lambda
type: unsafe_state
classification: state_assertion
defect: >
  The Lambda function's execution role carries broader permissions
  than the function needs — typically an AWS-managed *FullAccess
  policy, a wildcard on a sensitive action, or a broadly-scoped
  inline policy left from development. IAM Access Analyzer would
  flag the role as over-privileged relative to observed call
  patterns.
infection: >
  Any code the function executes — intentional, injected via a
  compromised dependency, or triggered via a public function URL
  — inherits the over-privileged role's access. Lambda's
  assume-role happens on every invocation, so the runtime's
  access is the full authority of the execution role, not some
  subset the function happens to use. If the function is
  publicly invokable or called from an internet-reachable
  resource, this single over-privileged role converts a function
  compromise into lateral movement across the account.
failure: >
  Account-wide lateral movement from a single function
  compromise. Attacker reach extends to every AWS resource the
  role can touch: S3 buckets, DynamoDB tables, Secrets Manager,
  other Lambda functions. In a chained exploit with a compromised
  dependency or a public URL, this is the pivot that turns a
  local code-execution bug into a full data-exfiltration
  incident.
params:
  base_impact: 8
  attack_stage: initial_access
  blast_radius:
    type: detection
    scope: account
    multiplier: 1.5
remediation:
  description: >
    Lambda execution role has overly broad permissions. The function can
    access AWS resources beyond what it requires for its intended purpose.
  action: >
    Scope the execution role policy to only the specific actions and
    resource ARNs the function needs. Replace managed policies like
    AmazonS3FullAccess with inline policies scoped to specific buckets
    and actions. Use IAM Access Analyzer to identify unused permissions
    and generate a least-privilege policy from actual function activity.
  example: |
    {
      "compute": {
        "kind": "function",
        "execution_role": {
          "is_overprivileged": false
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: function
    - field: properties.compute.execution_role.is_overprivileged
      op: eq
      value: true
