dsl_version: ctrl.v1
id: CTL.IAM.NEP.ADMIN.001
name: Net Effective Permissions Must Not Include Admin-Equivalent Actions
description: >
  After resolving all policy layers (SCPs, permission boundaries,
  identity-based policies, explicit denies), a principal not designated
  as administrative must not have admin-equivalent effective permissions.
  This is distinct from CTL.IAM.POLICY.ADMIN.001 which checks policy
  content — this control checks the resolved effective permissions after
  organizational constraints are applied. A principal may have an
  AdminAccess policy attached but be effectively constrained by an SCP.
domain: identity
severity: critical
compliance:
  nist_800_53_r5: "AC-6"
  fedramp_moderate: "AC-6"
  pci_dss_v4.0: "7.2.1"
  soc2: "CC6.1"
  hipaa: "164.312(a)(1)"
  ccm_v4: ["IAM-05"]
scope_tags:
  - aws
  - iam
type: unsafe_state
classification: state_assertion
defect: >
  After resolving every policy layer (SCPs, permission boundaries,
  identity-based policies, explicit denies), this principal's net
  effective permissions include admin-equivalent actions such as
  iam:*, *:*, or a large set of high-impact actions that together
  equal administrative authority. The principal is not tagged as
  intentionally administrative.
infection: >
  Any compromise of this principal — a leaked access key, a
  misconfigured assume-role chain, a captured session token —
  yields the full admin surface. The effective-permissions
  resolver has already confirmed that no SCP, boundary, or deny
  statement constrains the admin actions at runtime, so attackers
  do not have to bypass organizational controls. When combined
  with access paths from public-facing resources (public functions,
  exposed IAM roles in compromised containers), admin-equivalent
  NEP converts one foothold into full account compromise.
failure: >
  Account-wide compromise. The attacker has the same authority as
  a deliberate administrator: create users, remove logging,
  disable guardrails, exfiltrate any resource. Containment
  requires organizational-level rotation and recovery, not a
  scoped fix.
params:
  attack_stage: privilege_escalation
remediation:
  description: >
    Principal has admin-equivalent net effective permissions after all
    policy layers are resolved.
  action: >
    Review the identity-based policies granting admin-equivalent actions.
    Apply an SCP or permission boundary to constrain the effective
    permissions. If the principal requires admin access, tag it with
    stave/role-type: administrative to document the intent.
unsafe_predicate:
  all:
    - field: properties.identity.nep.is_admin
      op: eq
      value: true
