dsl_version: ctrl.v1
id: CTL.CLOUDTRAIL.ORG.001
name: CloudTrail Must Be Configured as Organization Trail
description: 'CloudTrail trails must be configured as AWS Organizations trails
  covering all member accounts. Account-level trails leave member accounts
  without centralized logging.

  '
domain: audit
severity: medium
compliance:
  cis_aws_v3.0: '3.1'
  nist_800_53_r5: AU-12
  soc2: CC7.1
  fedramp_moderate: AU-12
  ccm_v4:
  - LOG-03
  - LOG-05
scope_tags:
- aws
- cloudtrail
type: unsafe_state
classification: state_assertion
params:
  attack_stage: detection_evasion
remediation:
  description: Trail covers only this account, not the organization.
  action: Convert to an organization trail via the management account.
  example: "{\n  \"audit_trail\": {\n    \"kind\": \"trail\",\n    \"is_organization_trail\"\
    : true\n  }\n}\n"
unsafe_predicate:
  all:
  - field: properties.audit_trail.kind
    op: eq
    value: trail
  - field: properties.audit_trail.is_organization_trail
    op: eq
    value: false
defect: 'The CloudTrail trail is configured for this account only, not as
  an AWS Organizations trail covering all member accounts.

  '
infection: 'Attacker activity in other member accounts is not captured by
  this trail. An attacker who compromises a member account and operates within
  it generates no log entries in the centralized trail, leaving their actions
  invisible to the security team monitoring this account''s logs.

  '
failure: 'Blind spots across the organization. Security monitoring covers
  only one account while attackers operate undetected in others.

  '
