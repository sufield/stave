dsl_version: ctrl.v1
id: CTL.LIGHTSAIL.INSTANCE.PUBLIC.001
name: Lightsail Instances Must Not Expose Public Ports Broadly
description: >
  Lightsail instances with public IPs must not have firewall rules
  allowing broad public access to service ports.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SC-7"
  soc2: "CC6.6"
  ccm_v4: ["IVS-03"]
scope_tags: [aws, lightsail]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Lightsail instance exposes public ports broadly.
  action: Restrict firewall rules to specific CIDR ranges.
  example: |
    {"compute": {"kind": "lightsail_instance", "network": {"has_broad_public_ports": false}}}
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: lightsail_instance
    - field: properties.compute.network.has_broad_public_ports
      op: eq
      value: true
