dsl_version: ctrl.v1
id: CTL.APIGATEWAY.VALIDATION.001
name: API Gateway Must Have Request Validation Enabled
description: >
  API Gateway REST APIs must have request validation configured. API
  Gateway can validate incoming requests against a defined schema —
  checking required parameters, parameter types and formats, and request
  body conformance to a JSON schema — before the request reaches the
  backend. Without validation, malformed and malicious inputs are
  forwarded to the backend uninspected. This is complementary to WAF
  protection: WAF managed rules detect known-malicious patterns (SQLi,
  XSS, known exploits), while request validation detects structural
  violations (missing fields, wrong types, malformed bodies). A backend
  that receives only structurally valid requests is harder to attack
  through injection because type confusion, null pointer paths, and
  unexpected field exploitation are blocked at the API boundary.
  Request validation is particularly valuable for APIs handling PHI or
  financial data where the backend may make trust assumptions about
  well-formed input.
domain: exposure
severity: medium
compliance:
  nist_800_53_r5: "SI-10"
  fedramp_moderate: "SI-10"
  pci_dss_v4.0: "6.2.4"
  soc2: "CC6.6"
  hipaa: "164.312(c)(1)"
  ccm_v4: ["AIS-01", "AIS-04"]
scope_tags:
  - aws
  - apigateway
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: >
    API Gateway REST API has no request validation configured. All
    requests are forwarded to the backend regardless of structure or
    content.
  action: >
    Configure a request validator on the REST API via the API Gateway
    console or PutRestApi/UpdateMethod API. Define request models (JSON
    schemas) for endpoints that accept request bodies. Enable parameter
    validation for all methods. For REST APIs handling PHI or sensitive
    data, enable both parameter and body validation against defined
    model schemas.
  example: |
    {
      "apigateway": {
        "kind": "rest_api",
        "request_validation": {
          "enabled": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.apigateway.kind
      op: eq
      value: rest_api
    - field: properties.apigateway.request_validation.enabled
      op: eq
      value: false
