dsl_version: ctrl.v1
id: CTL.APIGATEWAY.THROTTLE.001
name: API Gateway Stages Must Have Throttling Limits Configured
description: >
  API Gateway stages must have default throttling limits configured with
  non-zero burst and rate values. Without throttling, a single client can
  send unlimited requests — exhausting backend resources, generating
  unbounded AWS costs (Denial of Wallet on Lambda), enabling credential
  brute force, and abusing sensitive business flows at machine speed.
  OWASP API4:2023 (Unrestricted Resource Consumption) and API6:2023
  (Unrestricted Access to Sensitive Business Flows) both share this
  infrastructure gap. WAF rate-based rules limit requests per IP at the
  WAF layer; API Gateway throttling limits requests per stage or per API
  key at the application layer. Both are needed — WAF addresses anonymous
  volume attacks, API Gateway throttling addresses authenticated API abuse
  and distributed attacks that evade per-IP limits.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SC-5"
  fedramp_moderate: "SC-5"
  hipaa: "164.308(a)(1)(ii)(B)"
  pci_dss_v4.0: "6.4.1"
  soc2: "A1.1"
scope_tags:
  - aws
  - apigateway
type: unsafe_state
params:
  attack_stage: initial_access
  base_impact: 8
  blast_radius:
    type: detection
    scope: account
    multiplier: 1.5
remediation:
  description: >
    API Gateway stage has no default throttling configured. Any client
    can send unlimited requests to the API.
  action: >
    Configure stage-level throttling via the API Gateway console or
    UpdateStage API. Set a burst limit and rate limit appropriate for
    the API's expected traffic. For REST APIs handling sensitive
    operations, create a usage plan with per-consumer throttle limits
    and associate API keys with it.
  example: |
    {
      "apigateway": {
        "kind": "rest_api",
        "throttling": {
          "stage_throttle_configured": true
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.apigateway.kind
      op: eq
      value: rest_api
    - field: properties.apigateway.throttling.stage_throttle_configured
      op: eq
      value: false
