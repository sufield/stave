dsl_version: ctrl.v1
id: CTL.CLOUDFLARE.ZONE.DNSSEC.001
name: Cloudflare Zone DNSSEC Not Enabled
description: >
  DNSSEC not enabled. DNS responses can be spoofed.
domain: exposure
severity: high
compliance:
  nist_800_53_r5: "SC-20"
  soc2: "CC6.6"
scope_tags: [cloudflare]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: Cloudflare Zone DNSSEC Not Enabled — finding detected.
  action: Remediate per control description.
  example: |
    {"cloudflare": {"zone": {"kind": "zone_config", "placeholder": true}}}
unsafe_predicate:
  all:
    - field: properties.cloudflare.zone.kind
      op: eq
      value: zone_config
    - field: properties.cloudflare.zone.dnssec_enabled
      op: eq
      value: false
