dsl_version: ctrl.v1
id: CTL.CLOUD9.ROLE.OVERBROAD.001
name: Cloud9 Environment Role Exceeds Required Permissions
description: >
  Cloud9 environment's IAM credentials have permissions
  beyond what the development IDE requires. Cloud9
  environments either use AWS managed temporary credentials
  (scoped automatically) or a manually attached instance
  profile. When using an instance profile, the environment
  needs only the specific resources the developer works
  with. Any wildcard actions — s3:*, iam:PassRole,
  sts:AssumeRole on broad targets — mean the IDE becomes
  an over-permissioned interactive shell.
domain: identity
severity: medium
compliance:
  soc2: "CC6.1, CC6.3"
  nist_800_53_r5: "AC-6"
  pci_dss_v4.0: "7.2"
  fedramp_moderate: "AC-6"
  iso_27001_2022: "A.5.15, A.8.2"
  ccm_v4: ["IAM-04", "IAM-14"]
scope_tags:
  - aws
  - cloud9
taxonomy:
  - compliance-mapping
  - credential-lifecycle
  - least-privilege
subtractive_category:
  - S02
type: unsafe_state
classification: state_assertion
applicable_asset_types:
  - aws_cloud9_environment
params:
  attack_stage: privilege_escalation
  blast_radius:
    type: control
    scope: account
remediation:
  description: >
    Cloud9 environment role has permissions beyond the
    developer's required scope.
  action: >
    Use AWS managed temporary credentials (which are
    automatically scoped) instead of a custom instance
    profile. If a custom profile is required, scope it to
    the specific resources the developer needs. Remove
    wildcard actions.
  example: |
    {
      "compute": {
        "kind": "cloud9_env",
        "cloud9": {
          "role_exceeds_required": false,
          "role_arn": "arn:aws:iam::111122223333:role/cloud9-dev-scoped"
        }
      }
    }
unsafe_predicate:
  all:
    - field: properties.compute.kind
      op: eq
      value: cloud9_env
    - field: properties.compute.cloud9.role_exceeds_required
      op: eq
      value: true
defect: >
  Cloud9 environment role grants actions beyond the
  developer's required permissions.
infection: >
  Cloud9 environments are interactive shells accessed via
  a browser. An overbroad role means any developer with
  Cloud9 access — or an attacker who compromises a
  developer's session — has account-wide reach from the
  IDE terminal.
failure: >
  Cloud9 environment role blast radius expansion.
  Interactive IDE session yields account-wide access via
  overbroad instance profile.
tests:
  - name: overbroad Cloud9 role fires
    verdict: VIOLATION
    asset:
      asset_id: "arn:aws:cloud9:us-east-1:111122223333:environment:abc123"
      asset_type: aws_cloud9_environment
      vendor: aws
      properties:
        compute:
          kind: cloud9_env
          cloud9:
            role_exceeds_required: true
            role_arn: "arn:aws:iam::111122223333:role/cloud9-admin"
            excess_actions:
              - "s3:*"
              - "iam:*"
  - name: scoped Cloud9 role passes
    verdict: PASS
    asset:
      asset_id: "arn:aws:cloud9:us-east-1:111122223333:environment:abc123"
      asset_type: aws_cloud9_environment
      vendor: aws
      properties:
        compute:
          kind: cloud9_env
          cloud9:
            role_exceeds_required: false
            role_arn: "arn:aws:iam::111122223333:role/cloud9-dev-scoped"
