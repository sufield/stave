dsl_version: ctrl.v1
id: CTL.AZURE.APP.TLS.001
name: App Service TLS Minimum Version Below 1.2
description: >
  App Service accepts TLS 1.0 or 1.1 connections with known
  vulnerabilities (BEAST, POODLE, CRIME).
domain: encryption
severity: high
compliance:
  cis_azure_v2: "9.3"
  nist_800_53_r5: "SC-8"
  pci_dss_v4: "4.2.1"
  soc2: "CC6.1"
scope_tags: [azure]
type: unsafe_state
classification: state_assertion
params:
  attack_stage: initial_access
remediation:
  description: App Service TLS Minimum Version Below 1.2 — finding detected.
  action: Set minimum TLS version to 1.2.
  example: |
    {"azure": {"compute": {"kind": "app_service", "app": {"tls_min_version": "1.2"}}}}
unsafe_predicate:
  all:
    - field: properties.azure.compute.kind
      op: eq
      value: app_service
    - field: properties.azure.compute.app.tls_min_version
      op: lt
      value: "1.2"
