dsl_version: ctrl.v1
id: CTL.ID.KUBE.003
name: Binding to system:unauthenticated
description: |
  Bindings that grant permissions to system:unauthenticated allow anonymous access.
  Applies to: k8s.clusterrolebinding, k8s.rolebinding resources
type: unsafe_state
classification: state_assertion
severity: critical
defect: >
  A RoleBinding or ClusterRoleBinding grants permissions to the
  built-in system:unauthenticated group, which represents any
  request made without a valid bearer token or client
  certificate. The binding makes the referenced Role or
  ClusterRole accessible to anonymous callers reaching the API
  server.
infection: >
  Any network endpoint that can reach the Kubernetes API server
  — a misconfigured LoadBalancer, an exposed NodePort, a bastion
  reachable from unintended networks, or a pod with host-network
  access — can exercise the bound permissions without
  authenticating. Since system:unauthenticated is distinct from
  authenticated service accounts, cluster auditors often miss
  it: RBAC audits filtering on named users or service accounts
  skip these bindings entirely. When paired with a ClusterRole
  that grants read of secrets or write to workloads, anonymous
  API access turns into cluster-wide read or takeover.
failure: >
  Anonymous access to cluster resources bound by the binding.
  If the referenced role is cluster-admin or equivalent, the
  result is full cluster compromise reachable by any network
  path to the API server. If the role is narrower, the failure
  scopes to whatever the bound permissions grant, but the
  absence of authentication is almost always an authoring
  mistake — very few legitimate workflows need
  system:unauthenticated access.
params: {}
unsafe_predicate:
  any:
    - field: "properties.binds_to_system_unauthenticated"
      op: "eq"
      value: true
