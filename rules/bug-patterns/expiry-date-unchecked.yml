id: stave-expiry-date-unchecked
language: go
severity: warning
message: "ExpiryDate accepted without format or past-date validation"
note: |
  Bug class: CLASS 16 — Missing expiry validation
  Bughunt Jun 26 2026: exception expiry dates were never validated — invalid formats
  passed validation then crashed policy runs. Jul 19: past expiry dates accepted.
  All expiry date inputs must validate format (YYYY-MM-DD) and reject past dates.
rule:
  kind: selector_expression
  regex: '\.ExpiryDate$'
  inside:
    stopBy: end
    kind: function_declaration
    regex: "Add|Create|Register"
  not:
    follows:
      pattern: time.Parse($$$)
      stopBy: end
