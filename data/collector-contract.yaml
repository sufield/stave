  # ─── Security Incident Response ──────────────────────────────

  - field: security.incident_response.membership_active
    type: boolean
    status: planned
    postcondition: >
      True if the account has an active Security Incident
      Response membership. Sourced from
      security-ir:ListMemberships / GetMembership.
    consumers:
      - CTL.SECURITYIR.ENABLED.001

  - field: security.incident_response.notification_configured
    type: boolean
    status: planned
    postcondition: >
