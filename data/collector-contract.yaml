      is configured. Sourced from security-ir:GetMembership
      notification settings.
    consumers:
      - CTL.SECURITYIR.NOTIFICATION.001

  # ─── Directory Service ───────────────────────────────────────

  - field: directory.type
    type: string
    status: planned
    postcondition: >
      The directory type (SimpleAD, ADConnector, MicrosoftAD).
      Sourced from ds:DescribeDirectories.
    consumers:
      - CTL.DIRECTORYSERVICE.ENABLED.001

  - field: directory.logging.cloudwatch_configured
    type: boolean
    status: planned
    postcondition: >
      True if the Directory Service directory has log forwarding
      to CloudWatch configured. Sourced from
      ds:ListLogSubscriptions.
    consumers:
      - CTL.DIRECTORYSERVICE.LOGGING.001

  # ─── Shadow AI Governance ──────────────────────────────────

  - field: account.ai_workload_authorized
    type: boolean
    status: planned
    postcondition: >
      True if the account is designated for AI/ML workloads via
      the stave:ai-workload-authorized tag. Sourced from
      organizations:ListTagsForResource or
      resourcegroupstaggingapi:GetResources.
    consumers:
      - CTL.ACCOUNT.AI.UNSANCTIONED.001

  - field: account.ai_services.has_active_services
    type: boolean
    status: planned
    postcondition: >
      True if the account has active AI/ML service resources
      (Bedrock model access, SageMaker endpoints, Comprehend
      endpoints, etc.). Derived from service-specific list APIs.
    consumers:
      - CTL.ACCOUNT.AI.UNSANCTIONED.001

  - field: organization.scp.denies_ai_services
    type: boolean
    status: planned
    postcondition: >
      True if an SCP in the organization denies AI/ML service
      actions (bedrock:*, sagemaker:*, comprehend:*, textract:*,
      rekognition:*, etc.) with condition exceptions for
      designated ML accounts/OUs.
    consumers:
      - CTL.ORG.SCP.AI.SERVICE.RESTRICT.001

  # ─── S3 Vectors ────────────────────────────────────────────

  - field: storage.access.has_external_access
    type: boolean
    status: planned
    postcondition: >
      True if the Vector Bucket policy grants access to
      principals in external AWS accounts. Sourced from
      s3vectors:GetVectorBucketPolicy, parsed and evaluated
      against the owning account ID.
    consumers:
      - CTL.S3VECTORS.POLICY.CROSSACCOUNT.001

  - field: storage.access.has_wildcard_principal
    type: boolean
    status: planned
    postcondition: >
      True if the Vector Bucket policy grants access to
      wildcard (*) or anonymous principals. Sourced from
      s3vectors:GetVectorBucketPolicy.
    consumers:
      - CTL.S3VECTORS.POLICY.PUBLIC.001

  - field: storage.encryption.enabled
    type: boolean
    status: planned
    postcondition: >
      True if the Vector Bucket has encryption configured.
      Sourced from s3vectors:GetVectorBucket encryption
      configuration.
    consumers:
      - CTL.S3VECTORS.ENCRYPTION.001

  - field: audit.cloudtrail.data_events_s3vectors
    type: boolean
    status: planned
    postcondition: >
      True if CloudTrail advanced event selectors include
      AWS::S3Vectors::VectorBucket or AWS::S3Vectors::Index
      resource types. Sourced from
      cloudtrail:GetEventSelectors.
    consumers:
      - CTL.CLOUDTRAIL.DATA.S3VECTORS.001

  - field: identity.iam.has_s3vectors_putvectors_wildcard
    type: boolean
    status: planned
    postcondition: >
      True if the IAM principal has a policy granting
      s3vectors:PutVectors (or s3vectors:*) with Resource "*".
      Derived from IAM policy analysis.
    consumers:
      - CTL.S3VECTORS.IAM.PUTVECTORS.WILDCARD.001

  # ─── KMS Key Policy Gap Fields ───────────────────────────────

  - field: cryptography.policy.has_root_principal_full_access
    type: boolean
    postcondition: >
      True if the KMS key policy contains a statement granting
      arn:aws:iam::ACCOUNT:root with kms:* or all four usage
      actions (Encrypt, Decrypt, GenerateDataKey*, ReEncrypt*).
      This is the AWS default key policy pattern — it delegates
      all KMS permissions to IAM policies.
    consumers:
      - CTL.KMS.POLICY.ROOT.PRINCIPAL.001

  - field: cryptography.policy.enclave_attestation.has_pcr_condition
    type: boolean
    postcondition: >
      True if the KMS key policy includes at least one condition
      key matching kms:RecipientAttestation:PCR* (PCR0, PCR1,
      or PCR2). Relevant only for keys tagged
      enclave-protected=true. Without PCR conditions, any Nitro
      Enclave or the parent instance can use the key.
    consumers:
      - CTL.KMS.POLICY.ENCLAVE.NOPCR.001

  - field: cryptography.deletion_protection.has_scp_deny
    type: boolean
    postcondition: >
      True if an SCP in the organization denies
      kms:ScheduleKeyDeletion for this key or account. Derived
      by checking effective SCPs on the account for Deny
      statements covering kms:ScheduleKeyDeletion.
    consumers:
      - CTL.KMS.DELETION.NOPROTECTION.001

  # ─── OIDC Trust Policy CI Provider Classification ───────────
  - field: identity.trust.oidc.is_ci_provider
    type: boolean
    postcondition: >
      True if the OIDC provider URL matches a known CI/CD provider.
      Known CI providers: token.actions.githubusercontent.com
      (GitHub Actions), gitlab.com (GitLab CI),
      api.bitbucket.org/2.0 (Bitbucket Pipelines),
      oidc.circleci.com (CircleCI), app.terraform.io
      (Terraform Cloud / HCP Terraform), app.harness.io (Harness).
      Cognito user pools, Google Workspace, Azure AD / Entra ID,
      and other non-CI OIDC providers MUST be false.
      Derived from the OIDC provider URL in the trust policy
      Federated principal.
    botocore_source: "iam:GetRole → AssumeRolePolicyDocument → Statement[].Principal.Federated"
    consumers:
      - CTL.IAM.TRUST.OIDC.UNSCOPED.001
      - CTL.IAM.TRUST.OIDC.ORGWILDCARD.001

  # ─── OIDC Trust Policy Org-Wildcard Subject Claim ──────────
  - field: identity.trust.oidc.sub_claim_org_wildcard
    type: boolean
    postcondition: >
      True if the OIDC subject claim condition is present but
      wildcarded at the organization or group level — any repo
      in the org can assume the role. For GitHub Actions:
      "repo:myorg/*" or "repo:myorg/*:*". For GitLab CI:
      "project_path:mygroup/*". The sub condition exists (the
      role is not unscoped) but does not restrict to specific
      repositories. False when the sub condition pins to a
      specific repo, branch, or environment. Null/absent when
      no OIDC trust or no sub condition present.
    botocore_source: "iam:GetRole → AssumeRolePolicyDocument → Statement[].Condition.StringLike"
    consumers:
      - CTL.IAM.TRUST.OIDC.ORGWILDCARD.001

  # ─── OIDC Trust Policy Mutable Subject Claim ────────────────
  - field: identity.trust.oidc.sub_claim_uses_mutable_id
    type: boolean
    postcondition: >
      True if the OIDC subject claim condition uses name-based
      identifiers without immutable numeric anchors. Derived by
      parsing the trust policy Condition block for StringEquals
      or StringLike on the sub claim. For GitHub: check whether
      the value contains @<numeric_id> segments — if not, the
      identifier is mutable. For GitLab: project_path is mutable,
      project_id is immutable. For any OIDC provider: alpha/slash
      identifiers without numeric anchors are mutable.
    hazop_reference: "OIDC identity takeover via repo rename/recreate"
    consumers:
      - CTL.IAM.TRUST.OIDC.MUTABLE.SUBJECT.001

  # ─── IAM Identity Ratio ─────────────────────────────────────
  - field: identity.nhi_ratio_excessive
    type: boolean
    postcondition: >
      True if the machine-to-human identity ratio (IAM roles /
      IAM users) exceeds 200:1. Derived from
      iam:GetAccountSummary SummaryMap.Roles and SummaryMap.Users.
      Accounts with zero IAM users are excluded (ratio undefined).
    consumers:
      - CTL.IAM.IDENTITY.RATIO.001

  # ─── CodeArtifact Supply Chain ──────────────────────────────
  - field: governance.codeartifact.has_external_connection
    type: boolean
    postcondition: >
      True if the CodeArtifact repository has at least one
      external connection (public:npmjs, public:pypi, etc.).
      Derived from codeartifact:DescribeRepository
      externalConnections array length > 0.
    consumers:
      - CTL.CODEARTIFACT.EXTERNAL.UNRESTRICTED.001

  - field: governance.codeartifact.origin_restrictions_enforced
    type: boolean
    postcondition: >
      True if the repository has package origin restrictions
      that BLOCK upstream publish for all configured package
      formats. Derived from codeartifact:GetPackageGroupOriginConfiguration.
      False if no restrictions exist or any format allows
      upstream publish.
    consumers:
      - CTL.CODEARTIFACT.EXTERNAL.UNRESTRICTED.001

  - field: access.codeartifact.policy_allows_public
    type: boolean
    postcondition: >
      True if the repository resource policy contains
      Principal "*" or Principal AWS "*" without restricting
      conditions. Derived from
      codeartifact:GetRepositoryPermissionsPolicy.
    consumers:
      - CTL.CODEARTIFACT.POLICY.PUBLIC.001

  - field: access.codeartifact.domain_policy_cross_account_unconditioned
    type: boolean
    postcondition: >
      True if the domain resource policy allows cross-account
      principals without aws:PrincipalOrgID or specific account
      conditions. Derived from
      codeartifact:GetDomainPermissionsPolicy.
    consumers:
      - CTL.CODEARTIFACT.DOMAIN.POLICY.CROSSACCOUNT.001

  - field: governance.codeartifact.has_cross_domain_upstream
    type: boolean
    postcondition: >
      True if the repository upstream list includes repositories
      in a different CodeArtifact domain or AWS account. Derived
      from codeartifact:DescribeRepository upstreams array.
    consumers:
      - CTL.CODEARTIFACT.UPSTREAM.UNVETTED.001

  # ─── Bedrock Prompt Versioning ──────────────────────────────
  - field: governance.bedrock.prompt.has_draft_version
    type: boolean
    postcondition: >
      True if the Bedrock prompt has an unpublished DRAFT
      variant. Derived from bedrock:GetPrompt checking for
      a variant with status DRAFT.
    consumers:
      - CTL.BEDROCK.PROMPT.DRAFT.STALE.001

  - field: governance.bedrock.prompt.version_sprawl
    type: boolean
    postcondition: >
      True if the Bedrock prompt has more than 20 versions.
      Derived from bedrock:ListPromptVersions result count.
    consumers:
      - CTL.BEDROCK.PROMPT.VERSIONSPRAWL.001

  - field: governance.bedrock.prompt.version_count
    type: integer
    postcondition: >
      Number of published versions of the Bedrock prompt.
      Derived from bedrock:ListPromptVersions result count.

  - field: governance.bedrock.prompt.default_variant
    type: string
    postcondition: >
      Name of the active default variant for the Bedrock
      prompt. Derived from bedrock:GetPrompt defaultVariant.

  # ─── SageMaker Model Package Group ─────────────────────────
  - field: governance.sagemaker.model_package.approval_status
    type: string
    postcondition: >
      The ModelApprovalStatus of the latest model package version
      in the group: Approved, Rejected, or
      PendingManualApproval. Derived from
      sagemaker:DescribeModelPackage on the latest version.
    consumers:
      - CTL.SAGEMAKER.MODELPACKAGE.UNAPPROVED.001

  - field: access.sagemaker.model_package_group.policy_allows_broad_access
    type: boolean
    postcondition: >
      True if the model package group resource policy allows
      Principal "*", broad cross-account access without
      conditions, or any principal with sagemaker:Describe*
      and sagemaker:CreateModel* without scoping. Derived from
      sagemaker:GetModelPackageGroupPolicy.
    consumers:
      - CTL.SAGEMAKER.MODELPACKAGE.ACCESS.001

  - field: access.sagemaker.model_package_group.cross_account_principals
    type: list
    postcondition: >
      List of cross-account principal ARNs extracted from
      the model package group resource policy. Derived from
      sagemaker:GetModelPackageGroupPolicy principal analysis.

  - field: governance.sagemaker.model_package.certify_for_marketplace
    type: boolean
    postcondition: >
      True if the latest model package version is certified
      for AWS Marketplace. Derived from
      sagemaker:DescribeModelPackage CertifyForMarketplace.

  - field: governance.sagemaker.model_package.model_package_version
    type: integer
    postcondition: >
      Version number of the latest model package in the group.
      Derived from sagemaker:DescribeModelPackage
      ModelPackageVersion.

  - field: governance.sagemaker.model_package.created_by
    type: string
    postcondition: >
      ARN of the creator of the latest model package version
