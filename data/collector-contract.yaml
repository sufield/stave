# Collector Contract
#
# Axiom 1 boundary between the collector (Physical Domain) and the
# evaluation engine (Functional Domain). Each entry specifies the
# semantic postcondition a collector MUST satisfy when producing a
# boolean field. The CEL predicate engine trusts these fields without
# re-evaluating the underlying policy. A collector that violates a
# postcondition produces a wrong verdict — a SILENT_RISK at the
# interface boundary.
#
# Scope: pre-computed boolean fields where the collector makes a
# semantic judgment (policy interpretation, classification, state
# derivation). Raw API fields (strings, counts, timestamps) are
# outside this contract — their meaning is literal.
#
# null_semantics for all boolean fields: null or absent means
# "the collector did not evaluate this field." It does NOT mean
# false. Predicates that test `op: eq, value: false` will not
# match null — this is by design. A missing field is an unknown,
# not a safe state.

version: "1.0"

contracts:

  # ─── SCP / RCP / Boundary Policy Deny Booleans ───────────────
  #
  # Group postcondition (applies to ALL denies_* fields):
  #
  #   MUST be true if ANY policy in scope (SCP, RCP, permission
  #   boundary) contains a Deny for the named action(s).
  #
  #   NotAction handling: a Deny with NotAction lists the EXCEPTIONS
  #   to the deny. {"Effect":"Deny","NotAction":["sts:AssumeRoot"]}
  #   denies everything EXCEPT AssumeRoot — so denies_assume_root
  #   is FALSE for this statement (AssumeRoot is the exception, not
  #   the denied action). Collectors MUST NOT invert NotAction.
  #
  #   Condition handling: if the Deny has Conditions (e.g.
  #   aws:PrincipalArn), the deny is conditional. The field SHOULD
  #   still be true — the predicate evaluates the deny's existence,
  #   not its effective scope. Conditional vs unconditional is a
  #   separate field concern.

  - field: denies_assume_root
    type: boolean
    postcondition: >
      True if any SCP/RCP/boundary denies sts:AssumeRoot.
      NotAction in Deny = deny everything except listed;
      AssumeRoot in NotAction means it is NOT denied.
    hazop_reference: "HAZOP deviation 1: NotAction vs Action"
    consumers:
      - CTL.IAM.SCP.ASSUMEROOT.001
      - CTL.IAM.BOUNDARY.PAYER.ASSUMEROOT.001

  - field: denies_leave_org
    type: boolean
    postcondition: >
      True if any SCP denies organizations:LeaveOrganization.
    consumers:
      - CTL.ORG.SCP.DENY.LEAVEORG.001

  - field: denies_close_account
    type: boolean
    postcondition: >
      True if any SCP denies account:CloseAccount.
    consumers:
      - CTL.ORG.SCP.DENY.CLOSEACCOUNT.001

  - field: denies_iam_create_user
    type: boolean
    postcondition: >
      True if any SCP denies iam:CreateUser.
    consumers:
      - CTL.ORG.SCP.DENY.CREATEUSER.001

  - field: denies_kms_import_key_material
    type: boolean
    postcondition: >
      True if any SCP denies kms:ImportKeyMaterial.
    consumers:
      - CTL.ORG.SCP.DENY.IMPORTKEYMATERIAL.001

  - field: denies_trail_disruption
    type: boolean
    postcondition: >
      True if any SCP denies both cloudtrail:StopLogging
      AND cloudtrail:DeleteTrail.
    consumers:
      - CTL.ORG.SCP.ANTITAKEOVER.001

  - field: denies_guardduty_disable
    type: boolean
    postcondition: >
      True if any SCP denies guardduty:DeleteDetector
      and guardduty:DisableOrganizationAdminAccount.
    consumers:
      - CTL.ORG.SCP.DENY.GUARDDUTY.001

  - field: denies_config_modify
    type: boolean
    postcondition: >
      True if any SCP denies config:StopConfigurationRecorder
      and config:DeleteConfigurationRecorder.
    consumers:
      - CTL.ORG.SCP.DENY.CONFIG.001

  - field: denies_cloudtrail_modify
    type: boolean
    postcondition: >
      True if any SCP denies cloudtrail:StopLogging,
      cloudtrail:DeleteTrail, and cloudtrail:UpdateTrail.
    consumers:
      - CTL.ORG.SCP.DENY.CLOUDTRAIL.001

  - field: denies_root_access_key
    type: boolean
    postcondition: >
      True if any SCP denies iam:CreateAccessKey for root.
    consumers:
      - CTL.ORG.SCP.DENY.ROOTACCESSKEY.001

  - field: denies_get_federation_token
    type: boolean
    postcondition: >
      True if any SCP denies sts:GetFederationToken.
    consumers:
      - CTL.ORG.SCP.DENY.FEDERATIONTOKEN.001

  - field: denies_ri_purchase
    type: boolean
    postcondition: >
      True if any SCP denies ec2:PurchaseReservedInstancesOffering
      and related RI purchase actions.
    consumers:
      - CTL.ORG.SCP.DENY.RIPURCHASE.001

  - field: denies_savings_plan_create
    type: boolean
    postcondition: >
      True if any SCP denies savingsplans:CreateSavingsPlan.
    consumers:
      - CTL.ORG.SCP.DENY.SAVINGSPLAN.001

  - field: denies_service_agreements
    type: boolean
    postcondition: >
      True if any SCP denies aws-marketplace:AcceptAgreementApprovalRequest
      and related marketplace agreement actions.
    consumers:
      - CTL.ORG.SCP.DENY.AGREEMENTS.001

  - field: denies_iam_escalation
    type: boolean
    postcondition: >
      True if any SCP denies the IAM privilege escalation
      vector actions (CreatePolicyVersion, SetDefaultPolicyVersion,
      AttachUserPolicy, etc.).
    consumers:
      - CTL.ORG.SCP.DENY.IAMESCALATION.001

  - field: denies_igw_creation
    type: boolean
    postcondition: >
      True if any SCP denies ec2:CreateInternetGateway
      and ec2:AttachInternetGateway.
    consumers:
      - CTL.ORG.SCP.DENY.IGW.001

  - field: denies_external_principal
    type: boolean
    postcondition: >
      True if any SCP denies actions that allow external
      principal access (ram:CreateResourceShare with
      external principals, etc.).
    consumers:
      - CTL.ORG.SCP.DENY.EXTERNALPRINCIPAL.001

  - field: denies_bpa_disable
    type: boolean
    postcondition: >
      True if any SCP denies s3:PutBucketPublicAccessBlock
      and s3:PutAccountPublicAccessBlock when removing
      restrictions.
    consumers:
      - CTL.ORG.SCP.DENY.BPADISABLE.001

  - field: denies_ebs_encryption_disable
    type: boolean
    postcondition: >
      True if any SCP denies ec2:DisableEbsEncryptionByDefault.
    consumers:
      - CTL.ORG.SCP.DENY.EBSENCRYPTION.001

  - field: denies_backup_vault_delete
    type: boolean
    postcondition: >
      True if any SCP denies backup:DeleteBackupVault
      and backup:DeleteRecoveryPoint.
    consumers:
      - CTL.ORG.SCP.DENY.BACKUPVAULT.001

  - field: denies_kms_schedule_key_deletion
    type: boolean
    postcondition: >
      True if any SCP denies kms:ScheduleKeyDeletion.
    consumers:
      - CTL.ORG.SCP.DENY.KMSDELETE.001

  - field: denies_kms_create_key_external
    type: boolean
    postcondition: >
      True if any SCP denies kms:CreateKey with external
      key material origin.
    consumers:
      - CTL.ORG.SCP.DENY.KMSEXTERNAL.001

  - field: denies_kms_replicate_key
    type: boolean
    postcondition: >
      True if any SCP denies kms:ReplicateKey.
    consumers:
      - CTL.ORG.SCP.DENY.KMSREPLICATE.001

  - field: denies_kms_delete_key_material
    type: boolean
    postcondition: >
      True if any SCP denies kms:DeleteImportedKeyMaterial.
    consumers:
      - CTL.ORG.SCP.DENY.KMSDELETEMATERIAL.001

  - field: denies_kms_secrets_external
    type: boolean
    postcondition: >
      True if any SCP denies using external KMS keys
      for secrets encryption.
    consumers:
      - CTL.ORG.SCP.DENY.KMSSECRETS.001

  - field: denies_access_analyzer_delete
    type: boolean
    postcondition: >
      True if any SCP denies accessanalyzer:DeleteAnalyzer.
    consumers:
      - CTL.ORG.SCP.DENY.ACCESSANALYZER.001

  - field: denies_recyclebin_modify
    type: boolean
    postcondition: >
      True if any SCP denies rbin:DeleteRule and rbin:UpdateRule.
    consumers:
      - CTL.ORG.SCP.DENY.RECYCLEBIN.001

  - field: denies_guardduty_ipset_modify
    type: boolean
    postcondition: >
      True if any SCP denies guardduty:CreateIPSet and
      guardduty:UpdateIPSet (trusted IP list manipulation).
    consumers:
      - CTL.ORG.SCP.DENY.GUARDDUTYIPSET.001

  - field: denies_guardduty_modify
    type: boolean
    postcondition: >
      True if any SCP denies guardduty:UpdateDetector
      and related detector modification actions.
    consumers:
      - CTL.ORG.SCP.DENY.GUARDDUTYMODIFY.001

  - field: denies_eventbridge_rule_modify
    type: boolean
    postcondition: >
      True if any SCP denies events:DeleteRule,
      events:DisableRule, events:RemoveTargets.
    consumers:
      - CTL.ORG.SCP.DENY.EVENTBRIDGE.001

  - field: denies_critical_role_modify
    type: boolean
    postcondition: >
      True if any SCP denies iam:DeleteRole,
      iam:DetachRolePolicy, etc. for critical roles.
    consumers:
      - CTL.ORG.SCP.DENY.CRITICALROLE.001

  - field: denies_modify_userdata
    type: boolean
    postcondition: >
      True if any SCP denies ec2:ModifyInstanceAttribute
      for userData modification.
    consumers:
      - CTL.ORG.SCP.DENY.USERDATA.001

  - field: denies_confused_deputy_assume_role
    type: boolean
    postcondition: >
      True if any SCP denies sts:AssumeRole when
      confused deputy conditions are not met.
    consumers:
      - CTL.ORG.SCP.DENY.CONFUSEDDEPUTY.001

  - field: denies_accesskey_without_sourceip
    type: boolean
    postcondition: >
      True if any SCP denies actions when aws:SourceIp
      condition is not present for access key usage.
    consumers:
      - CTL.ORG.SCP.DENY.ACCESSKEYNOSOURCEIP.001

  - field: denies_lambda_public
    type: boolean
    postcondition: >
      True if any SCP denies lambda:AddPermission with
      public principal.
    consumers:
      - CTL.ORG.SCP.DENY.LAMBDAPUBLIC.001

  - field: denies_traffic_mirror_create
    type: boolean
    postcondition: >
      True if any SCP denies ec2:CreateTrafficMirrorTarget
      and related traffic mirror actions.
    consumers:
      - CTL.ORG.SCP.DENY.TRAFFICMIRROR.001

  - field: denies_vpc_management
    type: boolean
    postcondition: >
      True if any SCP denies VPC management actions
      (CreateVpc, DeleteVpc, etc.) outside approved roles.
    consumers:
      - CTL.ORG.SCP.DENY.VPCMANAGEMENT.001

  - field: denies_external_source
    type: boolean
    postcondition: >
      True if any SCP denies actions that allow external
      source configurations.
    consumers:
      - CTL.ORG.SCP.DENY.EXTERNALSOURCE.001

  # Service-scope deny booleans (SCP denies all actions for
  # a service to prevent shadow infrastructure)

  - field: denies_lightsail
    type: boolean
    postcondition: >
      True if any SCP denies lightsail:* (all Lightsail actions).

  - field: denies_evs
    type: boolean
    postcondition: >
      True if any SCP denies evs:* (all EVS actions).

  - field: denies_airflow
    type: boolean
    postcondition: >
      True if any SCP denies airflow:* (all MWAA actions).

  - field: denies_amplify
    type: boolean
    postcondition: >
      True if any SCP denies amplify:* (all Amplify actions).

  - field: denies_apprunner
    type: boolean
    postcondition: >
      True if any SCP denies apprunner:* (all App Runner actions).

  - field: denies_batch
    type: boolean
    postcondition: >
      True if any SCP denies batch:* (all Batch actions).

  - field: denies_elasticbeanstalk
    type: boolean
    postcondition: >
      True if any SCP denies elasticbeanstalk:* (all EB actions).

  - field: denies_elasticmapreduce
    type: boolean
    postcondition: >
      True if any SCP denies elasticmapreduce:* (all EMR actions).

  - field: denies_sagemaker
    type: boolean
    postcondition: >
      True if any SCP denies sagemaker:* (all SageMaker actions).

  # ─── Resource State Booleans ──────────────────────────────────

  - field: has_public_ip
    type: boolean
    postcondition: >
      Explicitly true/false for EC2 instances and RDS instances.
      False means "evaluated, no public IP." Never null when the
      resource type supports public IPs.
    hazop_reference: "HAZOP deviation 2: null vs false"
    consumers:
      - CTL.EC2.PUBLIC.001
      - CTL.RDS.PUBLIC.001

  - field: is_encrypted
    type: boolean
    postcondition: >
      Explicitly true/false for any resource that supports
      encryption at rest (EBS, S3, RDS, DynamoDB, SQS, SNS,
      Kinesis, EFS, etc.). True = encryption enabled with
      any key type (AWS-managed or CMK).

  - field: imdsv2_required
    type: boolean
    postcondition: >
      True only if HttpTokens == "required" on the EC2
      instance or EKS node group metadata options.
      "optional" = false. Absent metadata options = false.
    consumers:
      - CTL.EC2.IMDSV2.001
      - CTL.EKS.NODEGROUP.IMDSV2.001

  - field: public_read
    type: boolean
    postcondition: >
      True if any grant allows public read (bucket policy
      Principal:*, bucket/object ACL AllUsers READ). False
      if S3 Block Public Access overrides the grant. The
      fold: (policy_grants OR acl_grants) AND NOT bpa_blocks.
    consumers:
      - CTL.S3.PUBLIC.READ.001

  - field: account_public_access_fully_blocked
    type: boolean
    postcondition: >
      True only if all four S3 account-level BPA settings
      are enabled (BlockPublicAcls, IgnorePublicAcls,
      BlockPublicPolicy, RestrictPublicBuckets).

  - field: vpc_bpa_enforced
    type: boolean
    postcondition: >
      True if a declarative policy enforces VPC BPA
      organization-wide. Derived from declarative policy
      set, not from individual VPC settings.
    consumers:
      - CTL.ORG.DP.VPC.BPA.001

  - field: ssl_enforced
    type: boolean
    postcondition: >
      True if the resource requires SSL/TLS for all
      connections (RDS require_ssl parameter, Redshift
      require_ssl, ElastiCache in-transit encryption).

  - field: tls_enforced
    type: boolean
    postcondition: >
      True if TLS is required for the connection endpoint
      (API Gateway, ALB HTTPS listener, etc.).

  - field: mfa_enforced
    type: boolean
    postcondition: >
      True if MFA is required for the authentication path
      (IAM user console access, S3 delete with MFA, etc.).

  - field: https_enforced
    type: boolean
    postcondition: >
      True if HTTPS is required and HTTP requests are
      redirected or rejected (CloudFront viewer protocol,
      ALB redirect rule, API Gateway).

  - field: approval_enforced
    type: boolean
    postcondition: >
      True if a manual approval step is required in the
      pipeline or workflow before deployment proceeds.

  - field: confused_deputy_enforced
    type: boolean
    postcondition: >
      True if the trust policy includes aws:SourceArn
      or aws:SourceAccount conditions that prevent
      confused deputy attacks.

  - field: snapshot_before_delete_enforced
    type: boolean
    postcondition: >
      True if deletion protection or snapshot-before-delete
      is enabled (RDS, Aurora, DocumentDB, Neptune).

  # ─── Classification Booleans ──────────────────────────────────

  - field: has_data_access_actions
    type: boolean
    postcondition: >
      True if the IAM policy's effective permissions include
      any action classified as DataAccess in the sensitive
      action registry. Wildcard actions (s3:*, s3:Get*) MUST
      be expanded against the registry before classification.
    hazop_reference: "HAZOP deviation 3: registry fail-open"
    consumers:
      - CTL.IAM.POLICY.THIRDPARTY.DATAACCESS.001

  - field: has_credential_exposure_actions
    type: boolean
    postcondition: >
      True if the IAM policy's effective permissions include
      any action classified as CredentialExposure in the
      sensitive action registry. Same wildcard expansion rule.
    consumers:
      - CTL.IAM.POLICY.CREDENTIALEXPOSURE.001

  - field: has_dangerous_managed_policy
    type: boolean
    null_semantics: not_evaluated
    postcondition: >
      True if any attached managed policy grants actions classified
      as PrivilegeEscalation, CredentialExposure, ResourceExposure,
      or organization mutation (organizations:AttachPolicy,
      organizations:DetachPolicy) in the sensitive action registry.
      Unlike has_fullaccess_managed_policy (name pattern match),
      this field matches policy ACTIONS against the registry
      regardless of policy name. Same wildcard expansion rule.
    consumers:
      - CTL.IAM.ROLE.DANGEROUS.MANAGED.001

  - field: public_invoke_has_source_condition
    type: boolean
    null_semantics: not_evaluated
    postcondition: >
      True if every resource-policy statement granting
      lambda:InvokeFunction to Principal "*" includes an
      aws:SourceAccount or aws:SourceArn condition key.
      False if at least one public-invoke statement lacks both
      conditions. Null when the collector did not evaluate
      resource policies.
    consumers:
      - CTL.LAMBDA.POLICY.PUBLIC.001

  - field: has_admin_access
    type: boolean
    postcondition: >
      True if the policy grants Action:* on Resource:* with
      Effect:Allow. Condition keys do not negate admin status.

  - field: is_effectively_public
    type: boolean
    postcondition: >
      True if the resource is reachable from the internet
      through any path (direct public IP, public subnet
      with IGW route, public endpoint). Derived from
      network topology, not a single field.

  - field: is_dormant
    type: boolean
    postcondition: >
      True if the resource has had no API activity or
      invocations within the dormancy threshold period.
      Derived from CloudTrail/access advisor data.

  - field: is_orphan
    type: boolean
    postcondition: >
      True if the resource has no active references
      (security group with no ENIs, EBS volume with no
      attachments, Lambda with no triggers, etc.).

  # ─── Lake Formation ─────────────────────────────────────────

  - field: iam_allowed_principals_enabled
    type: boolean
    postcondition: >
      True if the Lake Formation data lake has the default
      IAMAllowedPrincipals super-permission active on any
      database or table. This bypasses Lake Formation's
      fine-grained access control.
    consumers:
      - CTL.LAKEFORMATION.DEFAULTPERM.001

  # ─── SageMaker MLflow ───────────────────────────────────────

  - field: uses_customer_kms
    type: boolean
    postcondition: >
      True if the resource uses a customer-managed KMS key
      for encryption. False if using AWS-managed default
      encryption or no encryption.
    consumers:
      - CTL.SAGEMAKER.MLFLOW.ENCRYPT.001
      - CTL.SAGEMAKER.ENDPOINT.ENCRYPT.001
      - CTL.SAGEMAKER.PIPELINE.ENCRYPT.001

  # ─── QuickSight DataSource ──────────────────────────────────

  - field: has_vpc_connection
    type: boolean
    postcondition: >
      True if the QuickSight data source connects to its
      underlying data store through a VPC connection rather
      than over the public AWS network.
    consumers:
      - CTL.QUICKSIGHT.DATASOURCE.VPC.001

  - field: ssl_disabled
    type: boolean
    postcondition: >
      True if the QuickSight data source has SSL disabled
      for its connection to the underlying data store.
    consumers:
      - CTL.QUICKSIGHT.DATASOURCE.ENCRYPT.001

  # ─── SageMaker Space ──────────────────────────────────────

  - field: sharing_type
    type: string
    postcondition: >
      The SharingType of the SageMaker Studio space
      (Private or Shared). Private spaces are isolated
      to a single user profile.
    consumers:
      - CTL.SAGEMAKER.SPACE.SHARING.001

  # ─── SageMaker UserProfile ─────────────────────────────────

  - field: has_per_user_role
    type: boolean
    postcondition: >
      True if the SageMaker user profile has its own execution
      role configured rather than inheriting the domain-level
      shared role. The collector MUST compare the user profile's
      ExecutionRole against the domain's DefaultUserSettings
      ExecutionRole — if they match or the profile has no
      override, the field is false.
    consumers:
      - CTL.SAGEMAKER.USERPROFILE.ROLE.001

  # ─── Boundary Policy Content (B10) ───────────────────────
  #
  # SCP/RCP policy document fields for payer invariant controls.
  # These require the collector to parse the policy body, not
  # just check its existence.

  - field: policy_document
    type: string
    postcondition: >
      The raw JSON policy document of a boundary policy
      (SCP, RCP, or permission boundary). Collectors MUST
      return the full JSON body, not a summary.
    consumers:
      - CTL.IAM.BOUNDARY.PAYER.SELFMODIFY.001
      - CTL.IAM.BOUNDARY.PAYER.IDENTITYCENTER.001
      - CTL.IAM.BOUNDARY.PAYER.CONTROLTOWER.001

  - field: denies_s3_data_perimeter_bypass
    type: boolean
    postcondition: >
      True if any SCP denies s3:* actions when
      aws:PrincipalOrgID does not match the organization.
    consumers:
      - CTL.ORG.SCP.DENY.S3DATAPERIMETER.001

  - field: management_principal_count
    type: integer
    postcondition: >
      The total number of IAM principals (users + roles)
      in the management account. Collectors MUST count via
      iam:ListUsers + iam:ListRoles in the management
      account only.
    consumers:
      - CTL.ORG.MGMT.PRINCIPAL.COUNT.001

  # ─── RCP Conditions (B25-B26) ────────────────────────────

  - field: rcp_denies_confused_deputy
    type: boolean
    postcondition: >
      True if any RCP denies cross-service access when
      confused deputy conditions (aws:SourceArn,
      aws:SourceAccount) are not present.
    consumers:
      - CTL.ORG.RCP.DENY.CONFUSEDDEPUTY.001

  - field: rcp_enforces_principal_org_id
    type: boolean
    postcondition: >
      True if any RCP denies actions when
      aws:PrincipalOrgID does not match the organization,
      enforcing that only org principals can access
      resources.
    consumers:
      - CTL.ORG.RCP.ENFORCE.PRINCIPALORGID.001

  # ─── Exposure Fields (B14-B18) ───────────────────────────

  - field: vault_policy_public
    type: boolean
    postcondition: >
      True if the Backup vault access policy allows
      public access (Principal: "*" without condition).
    consumers:
      - CTL.BACKUP.VAULT.PUBLIC.001

  - field: glacier_policy_public
    type: boolean
    postcondition: >
      True if the Glacier vault access policy allows
      public access (Principal: "*" without condition).
    consumers:
      - CTL.GLACIER.VAULT.PUBLIC.001

  - field: ses_authorization_policy_public
    type: boolean
    postcondition: >
      True if any SES identity authorization policy
      allows public access (Principal: "*").
    consumers:
      - CTL.SES.IDENTITY.PUBLIC.001

  - field: lambda_layer_public
    type: boolean
    postcondition: >
      True if the Lambda layer has a resource policy
      granting access to Principal: "*".
    consumers:
      - CTL.LAMBDA.LAYER.PUBLIC.001

  - field: elasticache_publicly_accessible
    type: boolean
    postcondition: >
      True if the ElastiCache cluster is publicly
      accessible (subnet group in public subnets with
      no security group restriction).
    consumers:
      - CTL.ELASTICACHE.PUBLIC.001

  # ─── Multi-Cloud Trust (B19-B24) ─────────────────────────

  - field: saml_entity_id
    type: string
    postcondition: >
      The SAML entity ID (Issuer) from the SAML provider
      metadata document. Used to track which external IdP
      is federated.
    consumers:
      - CTL.IAM.SAML.ENTITYID.001

  - field: trust_external_cloud_principal
    type: boolean
    postcondition: >
      True if the IAM role trust policy includes a
      principal from a non-AWS cloud provider (Azure AD,
      GCP service account, etc.).
    consumers:
      - CTL.IAM.TRUST.CROSSCLOUD.001

  - field: org_is_member
    type: boolean
    postcondition: >
      True if the account is a member of an AWS
      Organization. False for standalone accounts.
    consumers:
      - CTL.ORG.MEMBERSHIP.001

  - field: identity_center_enabled
    type: boolean
    postcondition: >
      True if IAM Identity Center (SSO) is enabled in
      the account/organization.
    consumers:
      - CTL.ORG.IDENTITYCENTER.ENABLED.001

  - field: ou_depth
    type: integer
    postcondition: >
      The depth of the organizational unit hierarchy
      from the root. Flat orgs = 1.
    consumers:
      - CTL.ORG.OU.DEPTH.001

  - field: root_email_domain
    type: string
    postcondition: >
      The email domain of the root account email.
      Collectors extract the domain portion after @.
    consumers:
      - CTL.ACCOUNT.ROOTEMAIL.DOMAIN.001

  # ─── GuardDuty (B1) ─────────────────────────────────────

  - field: finding_consistency_score
    type: number
    postcondition: >
      Ratio of GuardDuty findings confirmed by multiple
      detection methods to total findings. Range 0.0-1.0.
      Requires guardduty:GetFindings with multi-detector
      correlation.
    consumers: []

  - field: detection_method_count
    type: integer
    postcondition: >
      Number of distinct detection methods active for
      this GuardDuty detector (DNS logs, VPC flow logs,
      CloudTrail, S3 data events, etc.).
    consumers: []

  # ─── Account Resource Counts (B2) ────────────────────────

  - field: resource_count_by_service
    type: object
    postcondition: >
      Map of service name to resource count for the
      account. Populated from various List/Describe APIs.
      Keys are service names (e.g., "ec2", "s3", "lambda").
    consumers: []

  # ─── CloudTrail (B3) ─────────────────────────────────────

  - field: event_selector_exclusions
    type: array
    postcondition: >
      List of event selector exclusion patterns from
      cloudtrail:GetEventSelectors. Each entry is the
      exclusion selector configuration.
    consumers: []

  # ─── IAM Sensitive Actions (B4) ──────────────────────────

  - field: sensitive_action_grants
    type: array
    postcondition: >
      List of sensitive actions granted by IAM policies
      attached to this principal. Cross-referenced against
      the sensitive action registry.
    consumers: []

  # ─── ABAC Tag Policy (B5) ───────────────────────────────

  - field: tag_policy_enforced_keys
    type: array
    postcondition: >
      List of tag keys enforced by the organization's
      tag policy. From organizations:DescribeEffectivePolicy.
    consumers: []

  # ─── Key Origin Cross-Resource (B6-B7) ──────────────────

  - field: kms_key_origin
    type: string
    postcondition: >
      The origin of the KMS key used to encrypt this
      resource (AWS_KMS, EXTERNAL, AWS_CLOUDHSM).
      Requires kms:DescribeKey per resource key.
    consumers: []

  # ─── S3 Lifecycle (B8) ──────────────────────────────────

  - field: lifecycle_expiration_days
    type: integer
    postcondition: >
      Minimum expiration days across all lifecycle rules
      on this S3 bucket. From
      s3:GetBucketLifecycleConfiguration.
    consumers: []

  # ─── VPC Resource Inventory (B9) ────────────────────────

  - field: vpc_resource_count
    type: integer
    postcondition: >
      Total count of resources (ENIs, instances, etc.)
      within this VPC.
    consumers: []

  - field: vpc_eni_count
    type: integer
    postcondition: >
      Count of elastic network interfaces in this VPC.
      From ec2:DescribeNetworkInterfaces filtered by VPC.
    consumers: []

  # ─── VPC Isolation Intent (Jul 2026) ───────────────────────

  - field: isolation_intent
    type: string
    postcondition: >
      The declared isolation intent for this VPC, read from the
      AWS resource tag "stave:isolation-intent". Values:
      "airgapped" (no internet egress, no peering, no TGW, no
      VPN/DX), "egress-restricted" (egress only through VPC
      endpoints or allowlist), "internet-facing" (standard
      internet access expected). Empty string when no tag is set
      — controls fire unconditionally.
    consumers:
      - CTL.VPC.EGRESS.ENDPOINT.ONLY.001
      - CTL.VPC.SG.ENCLAVE.EGRESS.REACH.001
      - CTL.VPC.NACL.ENCLAVE.EGRESS.001

  # ─── Route Table IPv6 (Jul 2026) ──────────────────────────

  - field: has_ipv6_default_route
    type: boolean
    postcondition: >
      True when any route table in the VPC has a ::/0 route
      pointing to an egress-only internet gateway (eigw-*).
      Derived from ec2:DescribeRouteTables.
    consumers:
      - CTL.VPC.ROUTETABLE.IPV6.DEFAULT.001

  # ─── Gateway Endpoint Route Association (Jul 2026) ────────

  - field: gateway_endpoint_has_route_entries
    type: boolean
    postcondition: >
      True when a gateway VPC endpoint (S3 or DynamoDB) is
      associated with at least one route table. A gateway
      endpoint with no route table association exists but
      carries no traffic — a ghost endpoint.
    consumers:
      - CTL.VPC.ENDPOINT.GATEWAY.NOROUTE.001

  # ─── ECS Execute Command Logging (Jul 2026) ─────────────

  - field: exec_logging_enabled
    type: boolean
    postcondition: >
      True if the ECS cluster's ExecuteCommandConfiguration
      routes session output to a durable destination (S3
      bucket or CloudWatch log group). False if exec is
      enabled but logConfiguration is absent or has no
      destination. Derived from DescribeCluster →
      configuration.executeCommandConfiguration.logConfiguration.
    consumers:
      - CTL.ECS.EXEC.LOGGING.DESTINATION.001

  # ─── NLB Listener Rules (Jul 2026) ──────────────────────

  - field: listener_has_conditions
    type: boolean
    postcondition: >
      True if the NLB/ALB listener rule has at least one
      condition (host-header, path-pattern, source-ip, etc.).
      False if the rule is a default action with no conditions
      — all traffic matches unconditionally. Derived from
      DescribeRules → Rules[].Conditions.
    consumers:
      - CTL.NLB.LISTENER.NOCONDITION.001

  - field: mutual_tls_enabled
    type: boolean
    postcondition: >
      True if the NLB/ALB listener has mutual TLS
      authentication enabled. Derived from DescribeListeners
      → MutualAuthentication.Mode == "verify" or "passthrough".
    consumers:
      - CTL.NLB.MTLS.001

  # ─── S3 Local Zone (Jul 2026) ───────────────────────────

  - field: availability_zone_type
    type: string
    postcondition: >
      The availability zone type for the S3 bucket location:
      "standard" for normal AZs, "local-zone" for Local Zones.
      Derived by cross-referencing the bucket's location
      constraint with ec2:DescribeAvailabilityZones ZoneType.
    consumers:
      - CTL.S3.LOCALZONE.NOREPLICATION.001

  # ─── MCP Enforcement (Jul 2026) ─────────────────────────

  - field: mcp_enforcement_mode
    type: string
    postcondition: >
      The enforcement mode of the Managed Control Policy:
      "enforcing", "monitoring", or "none". Derived from
      organizations:ListManagedControlPoliciesForTarget.
    consumers:
      - CTL.ORG.MCP.FAILOPEN.001

  - field: mcp_rules_loaded
    type: boolean
    postcondition: >
      True if the MCP has at least one rule loaded and
      evaluating. False if the MCP is attached but has no
      active rules (syntax error, empty policy, or
      permission issue). Derived from MCP policy evaluation
      status.
    consumers:
      - CTL.ORG.MCP.NORULES.001

  # ─── Bedrock AgentCore Version (Jul 2026) ───────────────

  - field: agentcore_version_eol
    type: boolean
    postcondition: >
      True if the AgentCore runtime version is below the
      minimum safe version (currently 1.18.1). Derived by
      comparing the runtime's reported version against the
      known-vulnerable version list.
    consumers:
      - CTL.BEDROCK.AGENTCORE.VERSION.VULNERABLE.001

  - field: agentcore_version_pinned
    type: boolean
    postcondition: >
      True if the AgentCore runtime is pinned to a specific
      version rather than floating on "latest". Derived from
      the runtime configuration's version specification.
    consumers:
      - CTL.BEDROCK.AGENTCORE.VERSION.UNPINNED.001

  # ─── Athena Federated Query Connectors (Jul 2026) ───────

  - field: connector_version_vulnerable
    type: boolean
    postcondition: >
      True if any Athena federated query connector (Lambda
      data source) is at a version with known SQL injection
      vulnerabilities. Derived by inspecting the connector
      Lambda function's version/tag against the vulnerability
      registry.
    consumers:
      - CTL.ATHENA.CONNECTOR.VULNERABLE.001

  - field: connector_vpc_configured
    type: boolean
    postcondition: >
      True if the Athena federated query connector Lambda
      function is deployed within a VPC. False if the
      connector runs with unrestricted network access.
      Derived from lambda:GetFunction → VpcConfig.
    consumers:
      - CTL.ATHENA.CONNECTOR.NOVPC.001

  # ─── CloudTrail S3 Delivery Health (Jul 2026) ──────────

  - field: s3_delivery_healthy
    type: boolean
    postcondition: >
      True if CloudTrail S3 delivery has succeeded within
      the expected delivery window (24h). False if the trail
      reports delivery errors or last delivery is stale.
      Derived from cloudtrail:GetTrailStatus →
      LatestDeliveryError, LatestDeliveryTime.
    consumers:
      - CTL.CLOUDTRAIL.DELIVERY.HEALTH.001

  - field: s3_delivery_error
    type: string
    postcondition: >
      The CloudTrail S3 delivery error string from
      GetTrailStatus.LatestDeliveryError. Empty string or
      absent when delivery is healthy. Non-empty values
      indicate the trail is configured but logs are not
      reaching S3.
    consumers:
      - CTL.CLOUDTRAIL.DELIVERY.HEALTH.001

  - field: s3_last_delivery_time
    type: string
    postcondition: >
      ISO 8601 timestamp of the last successful S3 delivery
      from GetTrailStatus.LatestDeliveryTime. Used to detect
      stale delivery — a trail that was once delivering but
      has silently stopped.
    consumers:
      - CTL.CLOUDTRAIL.DELIVERY.HEALTH.001

  # ─── ECS Task Role Self-Deployment (Jul 2026) ───────────

  - field: has_self_deploy_capability
    type: boolean
    postcondition: >
      True if the ECS task role's IAM policy grants
      ecs:RegisterTaskDefinition + ecs:RunTask + iam:PassRole
      scoped to include its own task definition family and
      role. A task with this combination can rewrite and
      redeploy itself — a persistence mechanism. Derived by
      analyzing the task role policy for the three-permission
      combination with resource scope including self.
    consumers:
      - CTL.ECS.TASKROLE.SELFDEPLOY.001

  # ─── VPC Interface Endpoint PrivateLink (Jul 2026) ──────

  - field: has_default_full_access_policy
    type: boolean
    postcondition: >
      True if the VPC endpoint policy is the AWS default
      full-access policy (Principal *, Action *, Resource *).
      Derived by comparing the endpoint's policy document
      against the known default policy structure.
    consumers:
      - CTL.VPC.ENDPOINT.INTERFACE.DEFAULTPOLICY.001

  - field: is_cross_account_privatelink
    type: boolean
    postcondition: >
      True if the interface endpoint targets a PrivateLink
      service (vpce-svc-*) hosted in a different AWS account
      than the endpoint's own account. Derived by comparing
      the service name's account ID against the endpoint's
      owner account ID.
    consumers:
      - CTL.VPC.ENDPOINT.INTERFACE.CROSSACCOUNT.001
