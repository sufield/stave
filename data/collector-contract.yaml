    status: planned
    postcondition: >
      True if the VPC Lattice service network has an auth policy.
      Sourced from vpc-lattice:GetAuthPolicy per network.
    consumers:
      - CTL.VPCLATTICE.NETWORK.NOAUTH.001

  - field: lattice.network.has_external_associations
    type: boolean
    status: planned
