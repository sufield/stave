      sagemaker:DescribeModelPackage CreatedBy.

  - field: governance.sagemaker.model_package.approval_description
    type: string
    postcondition: >
      Approval justification text for the latest model package
      version. Derived from sagemaker:DescribeModelPackage
      ApprovalDescription. Empty if no justification provided.

  - field: governance.sagemaker.model_package.has_model_card
    type: boolean
    postcondition: >
      True if a model card exists for the model package group.
      Derived from sagemaker:ListModelCards filtered by the
      model package name. False if no cards exist.
    consumers:
      - CTL.SAGEMAKER.MODELPACKAGE.NOCARD.001

  - field: governance.sagemaker.model_package.model_card_status
    type: string
    postcondition: >
      The ModelCardStatus of the model card associated with the
      group: Draft, PendingReview, Approved, or Archived.
      Derived from sagemaker:DescribeModelCard. Empty string
      if no model card exists.
    consumers:
      - CTL.SAGEMAKER.MODELPACKAGE.CARD.DRAFT.001

  - field: governance.sagemaker.model_package.has_creator
    type: boolean
    postcondition: >
      True if the latest model package version has a traceable
      creator ARN (UserProfileArn or DomainId in CreatedBy).
      Derived from sagemaker:DescribeModelPackage.
    consumers:
      - CTL.SAGEMAKER.MODELPACKAGE.NOCREATOR.001

  # ─── SageMaker Data Quality Monitoring ──────────────────────
  - field: governance.sagemaker.data_quality.has_monitoring_schedule
    type: boolean
    postcondition: >
      True if the SageMaker endpoint has an active data quality
