# Prowler S3 check inventory.
#
# Declarative list of the AWS S3 checks Prowler ships, used by Stave's
# coverage aggregation to compute per-domain totals and not-covered
# lists. Source: prowler-cloud/prowler/prowler/providers/aws/services/s3/
# on the upstream master branch.
#
# Update this list when Prowler adds, removes, or renames an S3 check.
# Stave core does not interpret the tool name; it appears as an opaque
# string identifier on alternatives entries in control YAMLs.
tool: prowler
domain: s3
checks:
  - id: s3_access_point_public_access_block
  - id: s3_account_level_public_access_blocks
  - id: s3_bucket_acl_prohibited
  - id: s3_bucket_cross_account_access
  - id: s3_bucket_cross_region_replication
  - id: s3_bucket_default_encryption
  - id: s3_bucket_event_notifications_enabled
  - id: s3_bucket_kms_encryption
  - id: s3_bucket_level_public_access_block
  - id: s3_bucket_lifecycle_enabled
  - id: s3_bucket_no_mfa_delete
  - id: s3_bucket_object_lock
  - id: s3_bucket_object_versioning
  - id: s3_bucket_policy_public_write_access
  - id: s3_bucket_public_access
  - id: s3_bucket_public_list_acl
  - id: s3_bucket_public_write_acl
  - id: s3_bucket_secure_transport_policy
  - id: s3_bucket_server_access_logging_enabled
  - id: s3_bucket_shadow_resource_vulnerability
  - id: s3_multi_region_access_point_public_access_block
