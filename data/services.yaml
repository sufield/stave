# Service Registry — Stave's explicit AWS service universe.
#
# Source of truth for which AWS services Stave is aware of. The control
# catalog provides per-control data; this file provides per-service
# metadata. Control counts are derived at runtime by joining against
# the catalog (never duplicated here).
#
# Status values:
#   active            — AWS service available, Stave has controls
#   known_not_covered — AWS service exists, no Stave controls yet
#   out_of_scope      — outside Stave's configuration-security scope
#   retired           — AWS deprecated/removed the service
#   preview           — AWS service in preview/beta, tracking only

services:

  # ─── ACTIVE (Stave has controls) ────────────────────────────

  - id: acm
    name: AWS Certificate Manager
    short_name: ACM
    category: security

  - id: ad
    name: AWS Directory Service
    short_name: AD
