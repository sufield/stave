# OWASP AISVS v1.0 — Infrastructure-verifiable requirements
# Chapters C4 (Infrastructure), C5 (Access Control), C6 (Supply Chain),
# C13 (Monitoring). Only requirements where an AWS API response
# contains the configuration property.
#
# Format: stave catalog gaps compatible
standard: OWASP AISVS v1.0

checks:

  # ─── C4: Infrastructure Security ───────────────────────────

  - id: aisvs-c4.1.1
    service: SAGEMAKER
    description: "SageMaker endpoint has network isolation enabled"
    reference: "AISVS C4.1.1 Level 1"

  - id: aisvs-c4.1.2
    service: SAGEMAKER
    description: "SageMaker notebook instance runs in a VPC"
    reference: "AISVS C4.1.2 Level 1"

  - id: aisvs-c4.1.3
    service: SAGEMAKER
    description: "SageMaker training job has network isolation enabled"
    reference: "AISVS C4.1.3 Level 1"

  - id: aisvs-c4.1.4
    service: SAGEMAKER
    description: "SageMaker notebook instance uses IMDSv2"
    reference: "AISVS C4.1.4 Level 2"

  - id: aisvs-c4.2.1
    service: SAGEMAKER
    description: "SageMaker endpoint uses encrypted storage"
    reference: "AISVS C4.2.1 Level 1"

  - id: aisvs-c4.2.2
    service: SAGEMAKER
    description: "SageMaker notebook instance uses encrypted storage"
    reference: "AISVS C4.2.2 Level 1"

  - id: aisvs-c4.2.3
    service: SAGEMAKER
    description: "SageMaker training job uses encrypted output"
    reference: "AISVS C4.2.3 Level 1"

  - id: aisvs-c4.3.1
    service: BEDROCK
    description: "Bedrock custom model uses customer-managed KMS key"
    reference: "AISVS C4.3.1 Level 2"

  - id: aisvs-c4.3.2
    service: BEDROCK
    description: "Bedrock agent has guardrail attached"
    reference: "AISVS C4.3.2 Level 1"

  - id: aisvs-c4.4.1
    service: SAGEMAKER
    description: "SageMaker endpoint has data capture enabled for audit"
    reference: "AISVS C4.4.1 Level 2"

  - id: aisvs-c4.4.2
    service: SAGEMAKER
    description: "SageMaker training job has logging enabled"
    reference: "AISVS C4.4.2 Level 1"

  # ─── C5: Access Control ────────────────────────────────────

  - id: aisvs-c5.1.1
    service: BEDROCK
    description: "Bedrock model access policy restricts to approved models only"
    reference: "AISVS C5.1.1 Level 1"

  - id: aisvs-c5.1.2
    service: SAGEMAKER
    description: "SageMaker endpoint execution role follows least privilege"
    reference: "AISVS C5.1.2 Level 1"

  - id: aisvs-c5.1.3
    service: SAGEMAKER
    description: "SageMaker domain uses IAM authentication mode"
    reference: "AISVS C5.1.3 Level 1"

  - id: aisvs-c5.2.1
    service: BEDROCK
    description: "Bedrock agent does not have cross-account access"
    reference: "AISVS C5.2.1 Level 2"

  # ─── C6: Supply Chain ──────────────────────────────────────

  - id: aisvs-c6.1.1
    service: SAGEMAKER
    description: "SageMaker model uses approved container image from ECR"
    reference: "AISVS C6.1.1 Level 1"

  - id: aisvs-c6.1.2
    service: BEDROCK
    description: "Bedrock custom model imported from approved source"
    reference: "AISVS C6.1.2 Level 2"

  # ─── C13: Monitoring ───────────────────────────────────────

  - id: aisvs-c13.1.1
    service: SAGEMAKER
    description: "SageMaker endpoint has CloudWatch monitoring enabled"
    reference: "AISVS C13.1.1 Level 1"

  - id: aisvs-c13.1.2
    service: BEDROCK
    description: "Bedrock guardrail has content filter policy defined"
    reference: "AISVS C13.1.2 Level 1"

  - id: aisvs-c13.1.3
    service: BEDROCK
    description: "Bedrock guardrail has denied topic policy defined"
    reference: "AISVS C13.1.3 Level 1"

  - id: aisvs-c13.2.1
    service: SAGEMAKER
    description: "SageMaker endpoint VPC configuration restricts network access"
    reference: "AISVS C13.2.1 Level 2"
