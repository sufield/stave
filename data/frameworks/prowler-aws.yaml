# Prowler AWS Check Catalog — representative subset
# Sourced from prowler-cloud/prowler providers/aws/services/
# Focus: configuration-checkable checks across major services.
# Not exhaustive — Prowler has 300+ checks; this covers the
# high-impact subset for gap analysis.
#
# Format: stave catalog gaps compatible
standard: Prowler AWS Checks (v4.x)

checks:

  # ─── IAM ────────────────────────────────────────────────────

  - id: prowler-iam_root_no_access_key
    service: IAM
    description: "Root account has no access keys"
    reference: "Prowler iam_root_no_access_key"

  - id: prowler-iam_root_mfa_enabled
    service: IAM
    description: "Root account has MFA enabled"
    reference: "Prowler iam_root_mfa_enabled"

  - id: prowler-iam_root_hardware_mfa
    service: IAM
    description: "Root account has hardware MFA"
    reference: "Prowler iam_root_hardware_mfa"

  - id: prowler-iam_no_custom_policy_permissive_role_assumption
    service: IAM
    description: "No custom policy allows permissive role assumption"
    reference: "Prowler iam_no_custom_policy_permissive_role_assumption"

  - id: prowler-iam_policy_no_full_access_to_star
    service: IAM
    description: "No IAM policy grants full *:* access"
    reference: "Prowler iam_policy_no_full_access_to_star"

  - id: prowler-iam_user_mfa_enabled
    service: IAM
    description: "Console IAM users have MFA enabled"
    reference: "Prowler iam_user_mfa_enabled_console_access"

  - id: prowler-iam_password_policy_minimum_length
    service: IAM
    description: "Password policy minimum length is 14 or greater"
    reference: "Prowler iam_password_policy_minimum_length_14"

  - id: prowler-iam_user_accesskey_unused
    service: IAM
    description: "Access keys unused for 45 days are disabled"
    reference: "Prowler iam_user_accesskey_unused"

  - id: prowler-iam_access_analyzer_enabled
    service: IAM
    description: "IAM Access Analyzer is enabled"
    reference: "Prowler iam_access_analyzer_enabled"

  - id: prowler-iam_support_role_created
    service: IAM
    description: "Support role has been created"
    reference: "Prowler iam_support_role_created"

  - id: prowler-iam_inline_policy_no_admin_access
