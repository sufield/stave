# CloudSec Eval Kit — Atomic Ground Truth
#
# 30 inarguable misconfigurations across 8 AWS services.
# Each entry is objectively wrong, detectable from standard AWS APIs,
# and manually verifiable via the AWS console.
#
# Selection criteria:
#   - Objectively wrong (no threshold judgment)
#   - Any competent tool should find it
#   - Fix is unambiguous
#   - Console-verifiable in ≤3 clicks
#
# Source: NCC Group SadCloud (github.com/nccgroup/sadcloud)

# --- S3 ---

- id: GT-S3-001
  service: S3
  resource: sadcloud-cleartext-bucket
  finding: Bucket policy does not enforce TLS (no aws:SecureTransport deny)
  severity: HIGH
  stave_control: CTL.S3.ENCRYPT.002
  verification: "Console → S3 → bucket → Permissions → Bucket Policy → no SecureTransport condition"
  sadcloud_module: s3

- id: GT-S3-002
  service: S3
  resource: sadcloud-unversioned-bucket
  finding: Bucket versioning disabled
  severity: MEDIUM
  stave_control: CTL.S3.VERSION.001
  verification: "Console → S3 → bucket → Properties → Versioning = Disabled"
  sadcloud_module: s3

- id: GT-S3-003
  service: S3
  resource: sadcloud-nolog-bucket
  finding: Server access logging disabled
  severity: MEDIUM
  stave_control: CTL.S3.LOG.001
  verification: "Console → S3 → bucket → Properties → Server access logging = Disabled"
  sadcloud_module: s3

