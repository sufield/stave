# --- IAM: Structural ---

- id: GT-IAM-007
  service: IAM
  resource: sadcloudInlineUser
  finding: User has inline policy attached directly
  severity: MEDIUM
  stave_control: CTL.IAM.POLICY.INLINE.001
  verification: "Console → IAM → Users → user → Permissions → Inline policy present"
  sadcloud_module: iam

- id: GT-IAM-008
  service: IAM
  resource: sadcloudInlineGroup
  finding: Group has inline policy
  severity: MEDIUM
  stave_control: CTL.IAM.POLICY.INLINE.003
  verification: "Console → IAM → Groups → group → Permissions → Inline policy present"
  sadcloud_module: iam

- id: GT-IAM-009
  service: IAM
  resource: sadcloud-admin-role
  finding: IAM policy grants administrator access (Action:*, Resource:*)
  severity: CRITICAL
  stave_control: CTL.IAM.POLICY.ADMIN.002
  verification: "Console → IAM → Policies → policy → JSON → Effect:Allow, Action:*, Resource:*"
  sadcloud_module: iam

- id: GT-IAM-010
  service: IAM
  resource: sadcloud-wildcard-trust-role
  finding: Role trust policy allows assume from any AWS principal (Principal:*)
  severity: CRITICAL
  stave_control: CTL.IAM.TRUST.WILDCARD.001
  verification: "Console → IAM → Roles → role → Trust relationships → Principal = *"
  sadcloud_module: iam

- id: GT-IAM-011
  service: IAM
  resource: sadcloud-shadow-admin
  finding: Inline policy grants shadow admin permissions not visible in policy summary
  severity: HIGH
  stave_control: CTL.IAM.POLICY.SHADOW.001
  verification: "Console → IAM → Users → user → Inline policy → compare JSON vs Policy summary"
  sadcloud_module: iam

